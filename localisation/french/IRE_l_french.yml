 IRE_finna_fail:0 "L’Administration Fianna Fáil"
 IRE_finna_fail_desc:0 "Avec la victoire de Fianna Fáil aux élections, il est temps d’appliquer nos réformes."
 IRE_push_the_constituition:0 "Imposer la Constitution"
 IRE_push_the_constituition_desc:0 "Une nouvelle constitution est nécessaire pour affirmer la souveraineté de notre État et garantir que [IRE.GetNameDef] puisse se tenir aux côtés des grandes démocraties du monde."
 IRE_president_replacement:0 "Remplacer le Monarque par un Président"
 IRE_president_replacement_desc:0 "Le monarque britannique n’est plus associé à l’Irlande comme par le passé. Nous devrions remplacer cette fonction par un président."
 IRE_infectious_disease_wage:0 "Allocation Maladie Infectieuse"
 IRE_infectious_disease_wage_desc:0 "Offrir un revenu aux plus malheureux pour subvenir à leurs besoins est une avancée significative de notre politique intérieure."
 IRE_recognize_the_palce_of_the_church:0 "Reconnaître le Rôle de l’Église"
 IRE_recognize_the_palce_of_the_church_desc:0 "L’Église catholique a une place dans [IRE.GetNameDef] qui doit être reconnue et protégée."
 IRE_abolish_the_upper_house:0 "Abolir la Chambre Haute"
 IRE_abolish_the_upper_house_desc:0 "Le Sénat continue de bloquer notre programme. Il est donc devenu un fardeau pour notre pays et doit être supprimé."
 IRE_emergency_powers_act:0 "Loi sur les Pouvoirs d’Urgence"
 IRE_emergency_powers_act_desc:0 "Avec une guerre majeure qui fait rage en Europe, nous devons prendre des mesures pour assurer notre souveraineté et notre sécurité."
 IRE_temporary_state_guidance:0 "Orientation Temporaire de l’État"
 IRE_temporary_state_guidance_desc:0 "En ces temps sombres, l’État doit prendre les mesures nécessaires pour assurer la croissance et la protection de l’économie."
 IRE_broad_censorship_programs:0 "Grande Initiative de Censure"
 IRE_broad_censorship_programs_desc:0 "Certains s’expriment contre notre administration et mettent en danger l’avenir de [IRE.GetNameDef]. Ces personnes doivent être réduites au silence."
 IRE_ira_defense_force_memebrship:0 "Incorporer l’IRA dans les Forces de Défense"
 IRE_ira_defense_force_memebrship_desc:0 "La conscription des membres de l’IRA pourrait être utile en cas de conflit."
 IRE_promote_neutrality:0 "Se Retirer des Affaires Étrangères"
 IRE_promote_neutrality_desc:0 "[IRE.GetNameDefCap] n’a aucune raison de s’impliquer dans cette guerre. Préserver notre indépendance est bien plus important."
 IRE_northern_ireland_for_assistance:0 "Négocier l’Irlande du Nord contre de l’Aide"
 IRE_northern_ireland_for_assistance_desc:0 "La guerre ravage le monde et [ENG.GetNameDef] pourrait bientôt être pris dans un autre conflit. Nous pouvons leur offrir notre soutien et sécuriser leurs routes maritimes atlantiques, mais notre aide n’est pas gratuite : le prix est bien connu des deux côtés, une Irlande unifiée."
 IRE_fine_gael:0 "Fine Gael Triomphant"
 IRE_fine_gael_desc:0 "Nous avons gagné contre toute attente et sommes désormais prêts à gouverner selon notre vision."
 IRE_rally_rural_ireland:0 "Mobiliser l’Irlande Rurale"
 IRE_rally_rural_ireland_desc:0 "Une grande partie de notre base électorale se trouve dans la campagne ; il est vital de conserver leur soutien."
 IRE_hold_public_funding_oppertunities:0 "Organiser des Collectes Publiques"
 IRE_hold_public_funding_oppertunities_desc:0 "Notre parti a besoin de fonds pour survivre ; le meilleur moyen est d’organiser des rassemblements publics."
 IRE_radio_broadcasts:0 "Diffuser des Discours Électoraux"
 IRE_radio_broadcasts_desc:0 "Un dirigeant doit toujours s’adresser à son peuple, et avec la technologie moderne, nous pouvons le faire à la radio."
 IRE_oduffy_expulsion:0 "Achever l’Expulsion des Blueshirts"
 IRE_oduffy_expulsion_desc:0 "Les Blueshirts ternissent l’image de Fine Gael. Bien que la plupart aient été expulsés, y compris leur chef, certains demeurent."
 IRE_oust_the_moderates:0 "Mettre Fin à l’Apaisement des Modérés"
 IRE_oust_the_moderates_desc:0 "Les Blueshirts doivent reprendre le contrôle de Fine Gael. Nous avons encore des partisans parmi eux, et avec la victoire électorale, le moment est venu de s’imposer."
 IRE_raise_the_irish_brigade:0 "Lever la Brigade Irlandaise"
 IRE_raise_the_irish_brigade_desc:0 "[IRE.GetNameDefCap] pourrait constituer une petite force de volontaires pour aider nos alliés à l’étranger."
 IRE_rid_alien_influence:0 "Éliminer l’Influence Étrangère de l’Économie"
 IRE_rid_alien_influence_desc:0 "Les étrangers comme les [ENG.GetAdjective] ont trop d’emprise sur notre économie ; nous devons affirmer notre contrôle sur notre marché."
 IRE_accept_dominin_status:0 "Accepter le Statut de Dominion"
 IRE_accept_dominin_status_desc:0 "L’Irlande et la Grande-Bretagne ont toujours eu des liens étroits, et l’idée de rejoindre le Commonwealth existe depuis un certain temps. Peut-être devrions-nous l’accepter."
 IRE_establish_the_coorperate_state:0 "La Lutte pour l’État Corporatif"
 IRE_establish_the_coorperate_state_desc:0 "Le corporatisme est l’avenir de l’Irlande. Puisque le monde moderne l’adopte, nous devons en faire autant."
 IRE_agricultural_pasturing:0 "Élevage Agricole"
 IRE_agricultural_pasturing_desc:0 "L’agriculture est un aspect essentiel de l’économie de [IRE.GetNameDef]. Investir dans ce secteur ne peut être que bénéfique."
 IRE_protectionism:0 "Doctrine Protectionniste"
 IRE_protectionism_desc:0 "Importer trop de biens étrangers donnera à d’autres nations une emprise sur notre économie que nous pourrions ne pas pouvoir briser."
 IRE_free_trade:0 "Ouvrir le Marché Libre"
 IRE_free_trade_desc:0 "Le libre-échange est la meilleure voie pour assurer une croissance et une prospérité durables."
 IRE_irelands_oppertunity:0 "L’Opportunité de l’Irlande"
 IRE_irelands_oppertunity_desc:0 "Si nous voulons récupérer nos anciennes possessions territoriales, notre meilleur pari est de nous allier aux nouvelles puissances dominantes d’Europe."
 IRE_british_arms:0 "Achat d’Armes [ENG.GetAdjective]"
 IRE_british_arms_desc:0 "L’équipement de [IRE.GetNameDefCap] est obsolète et dépassé. En cas de conflit, nous devons obtenir de meilleures armes."
 IRE_treet:0 "Récupérer les Ports du Traité"
 IRE_treet_desc:0 "Un accord possible avec [ENG.GetNameDef] serait la restitution de la souveraineté sur nos ports."
 IRE_coa:0 "Loi de l’Éire"
 IRE_coa_desc:0 "Nous devons mettre fin à cette guerre commerciale et réparer nos liens avec [ENG.GetNameDef] avant que notre économie ne s’effondre."
 IRE_trade_war:0 "Guerre Commerciale Dévastatrice"
 IRE_trade_war_desc:0 "La guerre commerciale anglo-irlandaise dure depuis un certain temps à cause de différends commerciaux et du statut de la constitution irlandaise. Il faut y mettre fin avant d’endommager davantage notre économie."
 IRE_IRELAND:0 "Irlande"
 IRE_claim_the_celtic_world:0 "Revendiquer le Monde Celtique"
 IRE_claim_the_celtic_world_desc:0 "Unifier l’Irlande ne suffit pas, notre objectif est la libération de tous nos frères celtes."

ireland.1.t:0 "L’Irlande du Nord contre de l’Aide"
ireland.1.d:0 "Malcolm MacDonald, qui avait négocié avec l’État libre d’Irlande aux côtés de Neville Chamberlain, a été envoyé pour discuter d’une proposition intéressante. [ENG.GetNameDefCap] propose d’abandonner la partition et de nous restituer l’Irlande du Nord, à condition que nous rejoignions l’effort de guerre allié."
ireland.1.a:0 "Tout pour un allié."
ireland.1.b:0 "Le transfert n’en vaut pas la peine."
ireland.2.t:0 "Élections de 1937"
ireland.2.d:0 "Lors de ces élections, le Fianna Fáil d’Éamon de Valera voit sa domination contestée sur la scène politique [IRE.GetAdjective] par le Fine Gael. Ce dernier promet des politiques économiques plus conservatrices, comme de faibles impôts et du protectionnisme. Cependant, le parti reste entaché par son ancien chef, Eoin O’Duffy. Fianna Fáil devrait encore l’emporter grâce à la popularité de la constitution qu’il promet de faire adopter, mais il serait imprudent d’écarter totalement le Fine Gael."
ireland.2.a:0 "Que Fianna Fáil guide [IRE.GetNameDef]."
ireland.2.b:0 "Fine Gael est le meilleur choix pour [IRE.GetNameDef]."
ireland.3.t:0 "Eoin O’Duffy Met Fin à l’Apaisement"
ireland.3.d:0 "Eoin O’Duffy et les Blueshirts ont toujours été connus pour leurs positions radicales et leur sympathie affichée pour le fascisme. Avec son expulsion de Fine Gael, il n’a plus besoin de se retenir et utilise ce qu’il lui reste d’influence pour se renforcer à nouveau."
ireland.3.a:0 "Que ceci marque un nouvel avenir pour [IRE.GetNameDef]."
ireland.4.t:0 "Richard Mulcahy Prend la Tête de Fine Gael"
ireland.4.d:0 "Richard Mulcahy a pris la direction de Fine Gael. Il s’est montré digne successeur de W.T. Cosgrave et servira bien [IRE.GetNameDef]."
ireland.4.a:0 "W.T. Cosgrave a bien servi Fine Gael."
ireland.5.t:0 "Entrée de [IRE.GetNameDefCap] dans le Commonwealth"
ireland.5.d:0 "Le gouvernement [IRE.GetAdjective] a soumis une proposition pour intégrer le Commonwealth avec le statut de dominion. Accepter renforcerait nos deux nations économiquement et nous donnerait une nouvelle position stratégique. Cependant, les masses [IRE.GetAdjective], en particulier des groupes comme l’IRA, seraient mécontentes et pourraient provoquer des effusions de sang."
ireland.5.a:0 "Accueillons nos frères [IRE.GetAdjective] de retour."
ireland.5.b:0 "Mieux vaut les laisser tranquilles."
ireland.6.t:0 "[ENG.GetNameDefCap] Refuse"
ireland.6.a:0 "Ridicule !"
ireland.7.t:0 "[ENG.GetNameDefCap] Accepte"
ireland.7.d:0 "Notre gouvernement et [ENG.GetNameDef] sont parvenus à un accord concernant l’entrée de l’Irlande dans le Commonwealth."
ireland.7.a:0 "Nous faisons front uni."
ireland.6.d:0 "[ENG.GetNameDefCap] a décliné notre offre en déclarant : « Il serait trop difficile de trouver un accord entre nos deux nations en matière d’autonomie et de coopération économique. »"

news.31311.t:0 "Le Blitz de Belfast"
news.31311.d:0 "Les bombardiers [GER.GetAdjective] ont attaqué la ville nord-irlandaise de Belfast lors de trois raids, désormais appelés le « Blitz de Belfast ». Environ 1 000 personnes ont été tuées et 1 500 blessées. Des pompiers irlandais du sud ont rejoint les secours pour aider leurs frères irlandais. La déclaration officielle de la République fut : « Les habitants de Belfast sont eux aussi des Irlandais. »"
news.31311.a:0 "Quelle tragédie."
news.31311.b:0 "Ce sont nos compatriotes."
news.31311.c:0 "Une démonstration honteuse de l’Axe !"
news.31311.e:0 "Peut-être devrions-nous reconsidérer nos relations avec [IRE.GetNameDef]."

news.3137.t:0 "[IRE.GetNameDefCap] s’Aligne sur l’Axe"
news.3137.d:0 "[IRE.GetNameDefCap] a annoncé l’expulsion des diplomates alliés et le renforcement de ses liens avec les puissances de l’Axe.\n\nHitler aurait applaudi la nouvelle, déclarant que « les Irlandais ont une longue histoire de fiers guerriers et seront des partenaires et alliés précieux contre les Anglais »."
news.3137.a:0 "L’Axe s’agrandit."
news.3137.b:0 "Cela nous rendra plus forts !"
news.3137.c:0 "Un jour sombre pour l’Empire."
news.3137.e:0 "Bienvenue, Éire !"

news.3138.t:0 "[IRE.GetNameDefCap] s’Aligne sur le Komintern"
news.3138.d:0 "[IRE.GetNameDefCap] a annoncé l’expulsion des diplomates alliés et le renforcement de ses liens avec les puissances du Komintern.\n\nLes diplomates [SOV.GetAdjective] à [IRE.GetNameDef] furent surpris, n’ayant aucune idée de l’intérêt [IRE.GetAdjective] pour une telle alliance. Cependant, les généraux [SOV.GetAdjective] ont applaudi la nouvelle pour les avantages stratégiques que représente l’Irlande."
news.3138.a:0 "Le Komintern s’agrandit."
news.3138.b:0 "Solidarité pour tous les travailleurs !"
news.3138.c:0 "Un jour sombre pour l’Empire."
news.3138.e:0 "Un pas de plus vers la révolution mondiale !"

news.3139.t:0 "Le Raid de Noël"
news.3139.d:0 "Le 23 décembre 1939, l’IRA attaqua le Magazine Fort à Dublin.\n\nBien qu’elle ait réussi à s’emparer de munitions irlandaises, celles-ci furent rapidement reprises, et de nombreux volontaires de l’IRA furent arrêtés. Plusieurs hauts responsables de l’IRA ont été exécutés, et l’Oireachtas a reçu des pouvoirs d’urgence pour gérer la crise."
news.3139.a:0 "Une victoire pour [IRE.GetNameDefCap] !"
news.3139.b:0 "Tant mieux pour eux."

news.3133.t:0 "Fin de la Guerre Commerciale [ENG.GetAdjective]-[IRE.GetAdjective]"
news.3133.d:0 "La guerre commerciale [ENG.GetAdjective]-[IRE.GetAdjective] a eu un effet désastreux sur les économies de [ENG.GetNameDef] et [IRE.GetNameDef]. Cependant, l’adoption récente de la loi de l’Éire a mis fin à cette « guerre », et désormais les industries [IRE.GetAdjective] et [ENG.GetAdjective] profiteront d’un commerce plus libre. Cela pourrait marquer une nouvelle ère dans les relations [ENG.GetAdjective]-[IRE.GetAdjective].\n\n[IRE.GetLeader] a déclaré que cet accord ouvrait la porte à d’autres possibilités avec le gouvernement [ENG.GetAdjective]."
news.3133.a:0 "Enfin !"
news.3133.b:0 "Tant mieux pour eux."

news.3135.t:0 "Oskar Metzke"
news.3135.d:0 "Aujourd’hui, un homme a été découvert à Castletownroche, dans le comté de Cork, se présentant sous le nom d’« Oskar Metzke », affirmant être un vétéran tchèque. Lors de la fouille, il possédait une carte du pays, une boussole et un pistolet Luger.\n\nPeu après, alors qu’il était détenu par la Garda, la police [IRE.GetAdjective], il mourut de convulsions, causées par du cyanure qu’il avait avalé. Beaucoup pensent qu’il s’agissait d’un espion [GER.GetAdjective]."
news.3135.a:0 "Un espion [GER.GetAdjective] ? Ici ?"
news.3135.b:0 "Bon."

news.3132.t:0 "Les Glimmer Men"
news.3132.d:0 "L’approvisionnement en charbon de [IRE.GetNameDef] s’épuise, de nombreuses usines à gaz ayant fermé. Alors que des recherches sont menées sur l’utilisation de la tourbe comme alternative, le gouvernement [IRE.GetAdjective] a commencé à restreindre davantage l’usage du gaz, avec le ministre de l’Approvisionnement menaçant d’imposer un rationnement officiel.\n\nCela a conduit à des inspections visant à vérifier que les habitants n’utilisent pas le gaz aux heures interdites, les inspecteurs étant surnommés « glimmer men » par le peuple [IRE.GetAdjective]."
news.3132.a:0 "Dev, la cuisinière à gaz et le glimmerman."
news.3132.b:0 "Bon."

IRE_neutral:0 "Neutralité [IRE.GetAdjective]"
IRE_neutral_desc:0 "[IRE.GetNameDefCap] reste neutre dans la guerre, respectant simultanément [GER.GetNameDef], gardant son indépendance vis-à-vis de [ENG.GetNameDef] et apportant une aide aux deux camps."
IRE_ira:0 "Armée Républicaine Irlandaise"
IRE_ira_desc:0 "Malgré l’indépendance acquise par l’Irlande avec le traité anglo-irlandais de 1921, l’IRA anti-traité s’oppose encore au gouvernement et aux [ENG.GetAdjective], continuant à affaiblir l’État [IRE.GetAdjective]."

