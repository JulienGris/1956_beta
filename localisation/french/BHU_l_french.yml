 BHU_mayeum_choying_wangmo_dorji:0 "Mayeum Choying Wangmo Dorji"
 BHU_jigmi_y_thinley:0 "Jigmi Y Thinley"

 bhutan_focus:0 "Arbre de priorités national du Bhoutan"
 BHU_democratic_party:0 "Jai Gorkha"
 BHU_democratic_party_long:0 "Jai Gorkha"

 BHU_no_army:0 "Pays sans défense"
 BHU_no_army_desc:0 "Depuis le traité de Punakha de 1910, nous bénéficions d'une indépendance limitée sous domination britannique. Notre dépendance envers les spécialistes militaires [RAJ.GetAdjective] et [ENG.GetAdjective] nous permet de réaffecter le budget national à d'autres besoins. Cela nous laisse cependant totalement sans défense face aux menaces croissantes dans le monde."
 BHU_fledgling_army:0 "Armée naissante"
 BHU_treaty_with_britain:0 "Traités avec [ENG.GetNameDef]"
 BHU_treaty_with_britain_desc:0 "Les traités avec [ENG.GetNameDef] nous placent sous leur protection et dans leur sphère d’influence. Bien que nous perdions une partie de notre indépendance dans nos affaires internes, nous bénéficions largement de la « protection » de [ENG.GetNameDef].\n§W--------------\n§!§WPour obtenir§! §Gl’indépendance§! §Wvis-à-vis de [ENG.GetNameDef], nous devons avoir un soutien important pour un parti qui ne soutient pas la dynastie Wangchuck.§! §WCela débloquera une§! §Ydécision§! §Wpermettant de mettre fin à notre £autonomy_texticon  §Rsubjugation§!."
 BHU_first_inspection_idea:0 "Inspection de l’armée"
 BHU_first_inspection_idea_desc:0 "Inspection en cours."
 BHU_1921_modernization_roadmap_idea:0 "Feuille de route de modernisation"
 BHU_1921_modernization_roadmap_idea_desc:0 "Nous avons désormais l’opportunité de mettre en œuvre ce plan."
 BHU_can_decline_effect:0 "§WRègle définie : £trigger_yes Peut refuser un appel à la guerre§!"

 idea_BHU_dragons_storm:0 "Tempête du Dragon"
 idea_BHU_new_ideas:0 "Critiques envers la monarchie"
 idea_BHU_new_ideas_desc:0 "Si nous voulons entrer dans l’ère moderne en tant que nation souveraine et unie, nous devons ouvrir les yeux sur les bénéfices des nouvelles idéologies. Notre peuple souffre encore des chaînes de l’ancien régime monarchique."
 BHU_backward_economy:0 "Économie arriérée"
 BHU_backward_economy_desc:0 "Extrêmement dépendante de la production locale et des spécialistes étrangers, notre économie manque de base solide. L’ouverture de nos marchés limités provoquerait de l’inflation, un endettement envers l’étranger et de la pauvreté pour notre peuple."
 idea_BHU_unthinkable_offensive:0 "L’offensive impensable"
 idea_BHU_maintain_the_monarchy:0 "Maintenir la monarchie"
 idea_BHU_reinforce_the_throne:0 "Renforcer le trône"
 idea_BHU_aristocratic_regime:0 "Régime aristocratique"
 idea_BHU_the_quiet_strength:0 "La force tranquille"
 BHU_agriculatural_reform:0 "Réforme agricole"
 BHU_decentralized_administration:0 "Administration décentralisée"
 BHU_severe_economic_isolationism:0 "Isolationnisme économique sévère"
 BHU_severe_economic_isolationism_desc:0 "Extrêmement dépendante de la production locale et des spécialistes étrangers, notre économie manque de base solide. L’ouverture de nos marchés limités provoquerait de l’inflation, un endettement envers l’étranger et de la pauvreté pour notre peuple."
 BHU_moderate_economic_isolationism:0 "Isolationnisme économique modéré"
 BHU_moderate_economic_isolationism_desc:0 "Dépendante de la production locale et des spécialistes étrangers, notre économie manque de base solide. L’ouverture de nos marchés limités provoquerait de l’inflation, un endettement envers l’étranger et de la pauvreté pour notre peuple."
 BHU_slight_economic_isolationism:0 "Isolationnisme économique léger"
 BHU_slight_economic_isolationism_desc:0 "Légèrement dépendante de la production locale et des spécialistes étrangers, notre économie manque de base solide. L’ouverture de nos marchés limités provoquerait de l’inflation, un endettement envers l’étranger et de la pauvreté pour notre peuple."

#decisions
BHU_army_establishment:0 "La création d'une armée"
BHU_army_establishment_desc:0 "Pendant des années, nous avons compté sur une protection étrangère. Les gardes royaux armés d'épées et d'armures constituaient nos seules forces militaires, même si elles étaient principalement cérémonielles. Cela doit changer ! Le moment est venu de constituer une armée nationale bhoutanaise."
BHU_denounce_the_treaty_of_punakha:0 "Dénoncer le traité de Punakha"
BHU_improve_military_standards:0 "Améliorer les normes militaires"
BHU_mountain_warfare_courses:0 "Cours de guerre en montagne"
BHU_the_winter_soldiers:0 "Les soldats de l’hiver"
BHU_india_relations:0 "Relations avec [RAJ.GetNameDef]"
BHU_india_relations_desc:0 "Notre histoire a été liée au Sikkim pendant des siècles. En ces temps de changement, notre avenir est définitivement lié au destin de [RAJ.GetNameDef], pour le meilleur ou pour le pire."
BHU_bhutan_diplomacy:0 "Diplomatie [BHU.GetAdjective]"
BHU_bhutan_diplomacy_desc:0 "Nous ne pouvons pas nous reposer sur des traités obsolètes vieux de 30 ans avec [ENG.GetNameDef] dans un monde en mutation. Leur soutien n’est plus nécessaire ; désormais, [BHU.GetNameDef] cherchera l’aide de nouveaux alliés plus disposés à nous assister dans l’établissement de nos forces armées."
BHU_improve_relations:0 "Améliorer les relations avec [From.GetNameDef]"
BHU_improve_relations_tt:0 "Débloque la décision : §YAméliorer les relations avec [THIS.GetNameDef]§!"
BHU_establish_an_army_under_foreign_supervision:0 "Établir une armée sous supervision [From.GetAdjective]"

#flags
denounced_punakha_treaty:0 "Traité de Punakha dénoncé"
bhutan_improved_military_standards:0 "Les §Ynormes militaires§! ont été améliorées."
army_establishment_decision:0 "Création d’armée en cours"

BHU_aftermath_of_the_visit_to_india:0 "Souvenirs de Calcutta"
BHU_aftermath_of_the_visit_to_india_desc:0 "Pour la première fois depuis des années, le roi a visité [RAJ.GetNameDef]. Cet événement a consolidé le mouvement de modernisation du pays tout en confirmant la situation politique du royaume."
BHU_peace_will_reign:0 "La paix régnera"
BHU_peace_will_reign_desc:0 "Nous n’avons pas d’armée, personne ne nous menace, tout va bien."
BHU_blissful_isolation:0 "Isolement bienheureux"
BHU_blissful_isolation_desc:0 "Pourquoi se soucier du monde lorsque l’on médite dans un monastère dans l’un des pays les plus inaccessibles de la planète ?"
BHU_create_an_army:0 "Créer une armée"
BHU_create_an_army_desc:0 "Depuis que nous nous sommes placés sous la protection [ENG.GetAdjective], nous avons abandonné toute ambition militaire, ne conservant qu’une garde royale à des fins cérémonielles. Maintenant que le danger de guerre frappe à notre porte, il est temps de créer une armée nationale."
BHU_arms_deliveries:0 "Livraisons d’armes"
BHU_arms_deliveries_desc:0 "Comme nous ne pouvons pas produire nos propres armes, nous devons les faire venir de l’étranger. Heureusement, nos bonnes relations avec [ENG.GetNameDef] et [RAJ.GetNameDef] nous permettent de consacrer une partie de notre budget à la construction d’ateliers d’armement dans tout le pays cette année."
BHU_first_inspection:0 "La première inspection"
BHU_first_inspection_desc:0 "Pour organiser notre armée, nous devons inviter des spécialistes étrangers à évaluer nos progrès. L’inspection améliorera les performances de nos jeunes troupes et nous permettra de combler les lacunes dans la formation de nos officiers et commandants."
BHU_officers_training:0 "Formation des officiers"
BHU_officers_training_desc:0 "Nous ne pouvons atteindre l’efficacité sur le terrain que si les hommes sont correctement encadrés."
BHU_formalize_military_doctrine:0 "Formaliser la doctrine militaire"
BHU_formalize_military_doctrine_desc:0 "Sans planification militaire adéquate, notre armée ne pourra pas opérer à un niveau opérationnel."
BHU_elite_mountain_troops:0 "Troupes de montagne d’élite"
BHU_elite_mountain_troops_desc:0 "Notre territoire est proche du toit du monde, et nous ne pouvons planifier d’opérations militaires sans créer des troupes spécialisées capables d’opérer dans les zones les plus difficiles."
BHU_small_arms_workshop:0 "Atelier d’armes légères"
BHU_small_arms_workshop_desc:0 "En l’absence de véritables usines, la production d’armes doit être répartie entre plusieurs ateliers. Construire quelques installations dans nos plus grandes villes et assurer un transport rapide du matériel et des pièces entre elles augmentera le potentiel militaire de notre nation."
BHU_small_arms_technology:0 "Technologie des armes légères"
BHU_small_arms_technology_desc:0 "L’expérience acquise par les ateliers nous a permis de développer un équipement plus efficace. Les derniers prototypes, testés sur les stands de tir, ont atteint une précision et une puissance de feu à longue distance qui ont stupéfié la commission militaire présente. Nos spécialistes sont encouragés à lancer la production de ces nouvelles armes dès que possible."
BHU_ammunitions:0 "Production de munitions"
BHU_ammunitions_desc:0 "Mettre sur pied une armée permanente nécessitera bien plus d’hommes et d’armes que ce dont nous disposons actuellement. Alors que des recrues arrivent chaque jour dans les centres d’entraînement, elles se heurtent à notre incapacité à leur fournir un équipement militaire adéquat. Un nouveau décret a été adopté pour augmenter le financement public des nouveaux ateliers d’armement."
BHU_artillery:0 "Souffle de feu"
BHU_artillery_desc:0 "L’artillerie est le seul moyen de briser les positions retranchées de nos ennemis et, si nous voulons semer la confusion chez l’adversaire, nous devons la nommer en conséquence. Selon les anciens textes, le « souffle de feu » produisait l’effet recherché. Améliorons la chaleur et la portée de ce feu."
BHU_mountain_guns:0 "Canons de montagne"
BHU_mountain_guns_desc:0 "La prédominance du relief montagneux dans notre pays implique d’adapter tout notre matériel aux conditions naturelles et climatiques de notre territoire. L’idée d’un « Souffle de feu » capable de frapper efficacement nos ennemis dans un tel environnement mérite sans aucun doute un investissement."
BHU_upscaled_mechanical_dragon:0 "Dragons d’acier"
BHU_upscaled_mechanical_dragon_desc:0 "Bien que le concept puisse effrayer les gens ordinaires, nos spécialistes militaires estiment que nous avons besoin d’une unité de chars capable de combattre en montagne. Un projet coûteux, mais qui apportera de nombreux avantages annexes."
BHU_follow_the_1921_modernization_roadmap:0 "Feuille de route de modernisation de 1921"
BHU_follow_the_1921_modernization_roadmap_desc:0 "En 1921, nous avons élaboré un plan pour moderniser le pays. Faute de compétences, nous n’avons pas pu le mettre en œuvre, mais après avoir envoyé quelques personnes sélectionnées dans des écoles britanniques au cours de la dernière décennie, nous sommes peut-être enfin en mesure de l’appliquer."
BHU_education_reform:0 "Réforme de l’éducation"
l_french:
 BHU_education_reform_desc:0 "Le savoir est essentiel pour assurer l'avenir de notre nation. Les normes pédagogiques de notre pays reposaient auparavant sur les principes du bouddhisme et étaient principalement établies et maintenues par les moines dans les monastères. C'est inacceptable pour une nation moderne, et nous devons donc adopter les systèmes éducatifs occidentaux et leurs enseignements."
 BHU_train_more_doctors:0 "Développer le secteur de la santé"
 BHU_train_more_doctors_desc:0 "De nombreuses maladies potentiellement mortelles ont frappé la population ces dernières années. En nous consacrant à la formation de nouveaux spécialistes, nous pouvons également poser les bases du Département de la santé publique, chargé d'organiser la recherche et de réaliser des expertises médicales à travers le pays. Un tel établissement pourrait sembler coûteux, mais il sauvera des milliers de vies !"
 BHU_improve_agriculture:0 "Améliorer les techniques agricoles"
 BHU_improve_agriculture_desc:0 "Les techniques de culture traditionnelles sont totalement dépassées : équipements obsolètes, forte dépendance au transport animal, rotation des cultures à deux champs, et bien plus encore. Nous devons changer cela afin de libérer hommes et femmes pour d'autres activités économiques."
 BHU_improve_the_roads:0 "Améliorer les routes"
 BHU_improve_the_roads_desc:0 "Être l'un des pays les plus inaccessibles au monde est un atout pour notre défense. Cependant, nos forces terrestres souffrent de ces conditions difficiles : routes en terre, ponts en acier étroits et manque de transport automobile limitent sévèrement leur mobilité et leurs capacités de combat. Nous avons enfin entendu leurs demandes et avons lancé un programme gouvernemental de modernisation des routes."
 BHU_the_dragon_trains:0 "Les dragons de fer"
 BHU_the_dragon_trains_desc:0 "Nous ne pouvons pas rester à la traîne du progrès technologique des autres pays ! Notre peuple a besoin de moyens de transport adaptés, et l'État est prêt à soutenir cette cause. Un tel projet est indéniablement risqué, mais ses avantages à long terme compenseront largement les coûts. Comme on dit à la campagne : « Un dragon ne crache pas seulement du feu, il produit aussi de la fumée » — alors que nos hommes et nos femmes voient le dragon de fer franchir les montagnes !"
 BHU_mineral_survey:0 "Prospection minière"
 BHU_mineral_survey_desc:0 "La croissance régulière des installations de production locale et les récents accords commerciaux avec nos partenaires ont soulevé la question de la présence de ressources naturelles supplémentaires dans nos frontières. Nous devons réunir une équipe des géologues les plus expérimentés et mener une vaste prospection minière."
 BHU_exploit_the_findings:0 "Exploiter les découvertes"
 BHU_exploit_the_findings_desc:0 "La prospection géologique a été un succès incontestable, révélant de grands gisements de ferrosilicium dans le sud-ouest du pays, près de Phuentsholing. L'équipe demande un financement supplémentaire pour garantir que le minerai extrait soit exploité uniquement par des entreprises locales."
 BHU_new_weaving_techniques:0 "Nouvelles techniques de tissage"
 BHU_new_weaving_techniques_desc:0 "Les exportations de notre pays sont principalement dominées par le ciment, la dolomie et le fer semi-fini. Bien que les matières premières soient populaires à l'étranger, le tissu tissé est l'un de nos principaux produits locaux. L'adoption de nouvelles techniques de tissage est essentielle pour améliorer notre situation économique."
 BHU_reform_the_taxation_system:0 "Réformer le système fiscal"
 BHU_reform_the_taxation_system_desc:0 "Bien que le ngultrum [BHU.GetAdjective] soit la monnaie officielle, de nombreuses institutions religieuses, la plupart des paysans et divers groupes sherpas préfèrent contribuer au budget de l'État par des biens matériels plutôt que monétaires. Les récentes difficultés économiques ont forcé le gouvernement à décréter que tous les impôts doivent être payés en argent."
 BHU_organize_the_land:0 "Organiser les terres"
 BHU_organize_the_land_desc:0 "Les zones rurales de notre pays ne sont pas utilisées à leur plein potentiel. Il n'est pas nécessaire de confisquer ou d'approprier ces terres à notre peuple — tout ce dont nous avons besoin est de fournir une assistance et des outils aux paysans et aux ouvriers. Notre gouvernement est également prêt à investir des fonds supplémentaires pour acheter des terres inutilisées et y établir des ateliers."
 BHU_traders_of_the_himalaya:0 "Commerçants de l'Himalaya"
 BHU_traders_of_the_himalaya_desc:0 "Dans les terres fermées de l'Himalaya, rares sont ceux capables de commercer."
 BHU_fledgeling_industry:0 "Industrie naissante"
 BHU_fledgeling_industry_desc:0 "Notre industrie est peut-être encore à ses débuts, mais elle est en pleine croissance et doit être soigneusement entretenue pour se développer. Avec des investissements étatiques constants et un soutien économique, notre nation peut entrer dans l'ère moderne en tant que pays industriel."
 BHU_defense_policy:0 "Politique de défense"
 BHU_defense_policy_desc:0 "L'établissement d'une politique défensive à long terme est essentiel pour garantir notre sécurité."
 BHU_industrial_modernization:0 "Modernisation industrielle"
 BHU_industrial_modernization_desc:0 "Le monde se précipite vers les avancées technologiques les plus récentes, et chaque pays tente de se procurer l'équipement le plus moderne. Nous ne faisons pas exception, mais nous respectons chaque outil et machine à notre disposition, contrairement à d'autres. De petits budgets impliquent de grandes responsabilités."
 BHU_technological_progress:0 "Progrès technologique"
 BHU_technological_progress_desc:0 "La réforme de l'éducation n'est qu'une première étape vers un enseignement secondaire gratuit pour tous, sans distinction de genre, de couleur de peau, d'orientation ou de toute autre division obsolète des sociétés conservatrices. L'éducation et la technologie pour tous, quel qu'en soit le coût !"
 BHU_industry_enlightened_by_science:0 "Industrie éclairée par la science"
 BHU_industry_enlightened_by_science_desc:0 "Le développement scientifique est plus efficace en temps et en ressources s'il est soutenu par des instruments et outils modernes. Avec ces moyens et une solide base industrielle, nous pouvons profiter pleinement des fruits du progrès."
 BHU_utilize_our_forests:0 "Exploiter nos forêts"
 BHU_utilize_our_forests_desc:0 "Nos arbres ont poussé pendant des années ; ils constituent une richesse que nous n'avons jamais exploitée. Jusqu'à présent."
 BHU_german_arms_shipments:0 "Livraisons d'armes [GER.GetAdjective]"
 BHU_german_arms_shipments_desc:0 "Le Bhoutan est une nation qui peut difficilement se maintenir militairement, c'est pourquoi il serait peut-être sage de demander aux [GER.GetAdjective] des livraisons d'armes, peut-être à un prix réduit..."

 BHU_build_air_strip:0 "Construire une piste d'atterrissage"
 BHU_build_air_strip_desc:0 "Bien que tous les avions ne puissent pas voler jusqu'au Tibet, construire une piste d'atterrissage fiable est essentiel pour combiner les vols en haute altitude et l'appui aérien rapproché en une seule discipline : le pilotage au-dessus du Tibet. De plus, des avions spécifiques doivent être conçus car décoller à ces altitudes est déjà un exploit."
 BHU_small_airframes:0 "Cellules d'avion légères"
 BHU_small_airframes_desc:0 "Étant donné qu'une supériorité aérienne localisée suffira pour aider les troupes au sol, des avions plus petits et moins chers sont simplement un meilleur choix."
 BHU_large_airframes:0 "Cellules d'avion lourdes"
 BHU_large_airframes_desc:0 "Compte tenu de la taille du pays et de la difficulté à voler au-dessus des hautes montagnes, il vaut mieux disposer d'avions capables de survoler les sommets plutôt que de zigzaguer entre eux."
 BHU_the_dragon_flies:0 "Le dragon vole"
 BHU_the_dragon_flies_desc:0 "Nous régnerons sur les cieux comme des dragons et cracherons du feu sur nos ennemis."

 BHU_naval_effort:0 "Financer la construction navale"
 BHU_naval_effort_tt:0 "Pas assez d'emplacements pour des §Ychantiers navals§!"
 BHU_naval_effort_desc:0 "L'expansion de notre marine doit être notre priorité. Allouons toutes les ressources disponibles à de nouveaux chantiers navals et à la recherche sur les navires de surface légers."
 BHU_flexible_navy:0 "Marine flexible"
 BHU_flexible_navy_desc:0 "Réinventer la guerre navale en tenant compte des avancées de la technologie sous-marine nous permettra de frapper efficacement les convois ennemis."
 BHU_large_navy:0 "Grande marine"
 BHU_large_navy_desc:0 "Adapter nos doctrines navales pour accueillir de grands navires et assurer la sécurité de nos convois commerciaux nous apprendra beaucoup sur les types de navires dont nous avons besoin."
 BHU_submarine_effort:0 "Guerre sous-marine"
 BHU_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus passionnant depuis l'invention du torpilleur. Nous devons nous protéger contre les sous-marins et les utiliser contre le commerce ennemi."
 BHU_cruiser_effort:0 "Concevoir des croiseurs"
 BHU_cruiser_effort_desc:0 "Avant de nous lancer dans la recherche avancée sur les cuirassés, il faut remplacer les croiseurs plus petits."
 BHU_destroyer_effort:0 "Concevoir des destroyers"
 BHU_destroyer_effort_desc:0 "En étudiant la conception et l'utilisation stratégique des sous-marins, nous avons également appris comment contrer ces stratégies. Les destroyers seront cruciaux à cet effet."
 BHU_capital_ships_effort:0 "Intérêt pour les navires capitaux"
 BHU_capital_ships_effort_desc:0 "La nation ayant le plus de cuirassés dominera les océans. Les cuirassés et les porte-avions représentent à la fois l'ancien et le nouveau en matière de supériorité navale."
 BHU_unthinkable_offensive:0 "L'offensive impensable"
 BHU_unthinkable_offensive_desc:0 "Au-delà des vastes montagnes des mers se trouve notre destin. Au-delà de ces pics mouvants se trouve notre gloire. Partout dans le monde, les dragons seront redoutés !"

BHU_new_ideas:0 "Introduire de Nouvelles Idées"
BHU_new_ideas_desc:0 "Le monde extérieur nous apporte de nouvelles façons de concevoir notre gouvernement. Démocratie, communisme, fascisme, ces idéologies représentent des alternatives."
BHU_our_own_way:0 "Notre Propre Voie"
BHU_our_own_way_desc:0 "Nous avons déjà montré au monde de quoi nous étions capables, mais nous pouvons faire encore mieux."
BHU_constitutional_parlementarism:0 "Parlementarisme Constitutionnel"
BHU_constitutional_parlementarism_desc:0 "Pour trouver un équilibre entre les revendications du peuple et la vision directrice du roi, [BHU.GetLeader] a accepté de signer une constitution et a juré de la respecter devant tout le Tslzogdu (Assemblée nationale)."
BHU_share_power:0 "Réformer le Tslzogdu"
BHU_share_power_desc:0 "L’assemblée doit être réformée afin de permettre la mise en place d’institutions démocratiques."
BHU_open_the_country:0 "Ouvrir le Pays"
BHU_open_the_country_desc:0 "Notre économie a longtemps été autosuffisante, mais elle refusait également les opportunités venant de l’étranger. Cela doit changer. Comme d’autres puissances asiatiques au siècle dernier, le pays doit s’ouvrir au monde."
BHU_economic_developments:0 "Développements Économiques"
BHU_economic_developments_desc:0 "Les réformes sociales créent plus d’opportunités. Ce cercle vertueux renforce alors notre économie."
BHU_denounce_the_aristocracy:0 "Dénoncer l’Aristocratie"
BHU_denounce_the_aristocracy_desc:0 "L’aristocratie doit être dénoncée pour ce qu’elle est : les vestiges du servage se mêlant à la bourgeoisie naissante. Les éléments monarchistes ignorent le mouvement communiste grandissant derrière eux. Nous prendrons notre temps et attendrons le bon moment pour révéler notre présence."
BHU_overthrow_the_feudals:0 "Renverser le Servage"
BHU_overthrow_the_feudals_desc:0 "Le soutien croissant au Parti communiste du Bhoutan à travers le pays est devenu si fort que le roi obsolète et ses ministres fantoches ne sont plus nécessaires pour guider notre pays vers un brillant avenir communiste. L’heure de frapper est arrivée ! Que le roi connaisse la volonté du peuple !"
BHU_land_redistribution:0 "Redistribution des Terres"
BHU_land_redistribution_desc:0 "Le servage a volé les terres appartenant à nos pauvres paysans depuis des générations ! Nous ne pouvons progresser davantage tant que les besoins des paysans et des travailleurs ne sont pas pleinement satisfaits, et que la protection sociale n’atteint pas chaque foyer !"
BHU_mobilization_of_the_masses:0 "Mobiliser les Masses"
BHU_mobilization_of_the_masses_desc:0 "Le communisme est à la fois une idéologie et un état d’esprit, conçu d’abord par les grands Marx et Engels, puis réalisé par Lénine et Staline en Russie. Il est donc évident qu’une personne croyant sincèrement au marxisme prendra les armes pour protéger les valeurs menacées que nous partageons tous."
BHU_indoctrination_focus:0 "Axe d’Endoctrinement"
BHU_indoctrination_focus_desc:0 ""
BHU_contact_chinese_communists:0 "Contacter [PRC.GetNameDef]"
BHU_contact_chinese_communists_desc:0 "Nous partageons de nombreux traits communs avec les [PRC.GetAdjective], et l’un d’eux est une forte opposition aux oppresseurs nationalistes et capitalistes. [PRC.GetLeader] et son peuple sont réputés pour leurs compétences en guérilla et en activités partisanes derrière les lignes ennemies. Peut-être que certains d’entre eux pourraient contourner les patrouilles frontalières [TIB.GetAdjective] et [CHI.GetAdjective], atteindre notre pays et soutenir nos commandants ?"
BHU_contact_the_soviets:0 "La Connexion [SOV.GetAdjective]"
BHU_contact_the_soviets_desc:0 "Berceau des idéaux communistes, [SOV.GetNameDef] cherche sans aucun doute à étendre son influence dans le monde entier. Nous pouvons exploiter nos objectifs communs pour demander une vaste expédition militaire [SOV.GetAdjective] qui assistera nos préparatifs militaires."
BHU_forced_indusrial_progress:0 "Progrès Industriel Forcé"
BHU_forced_indusrial_progress_desc:0 "L’industrie apportera le progrès ; rien n’arrêtera le cours de l’Histoire."
BHU_proletarization:0 "Prolétarisation"
BHU_proletarization_desc:0 "La destruction des ennemis de classe est plus qu’une utopie. Un État créé par le prolétariat et pour le prolétariat est désormais plus proche que jamais."
BHU_embrace_radical_nationalism:0 "Adopter le Nationalisme Radical"
BHU_embrace_radical_nationalism_desc:0 "Le Bhoutan est isolé, mais il a un destin ; il a été choisi par le grand dragon du tonnerre pour forger un État fort."
BHU_spread_aggressive_attitude:0 "Diffuser l’Attitude Aggressive"
BHU_spread_aggressive_attitude_desc:0 "La paix est une illusion conçue pour détourner le peuple de son état naturel : montrer sa supériorité par le combat."
BHU_mass_conscription:0 "Conscription de Masse"
BHU_mass_conscription_desc:0 "Le peuple doit être mobilisé et remplir son devoir pour accomplir son grand destin !"
BHU_armement_program:0 "Lancer le Réarmement"
BHU_armement_program_desc:0 "Notre pays a avancé dans l’Histoire en somnambule sous l’influence de concepts intrinsèquement faibles tels que la paix et la compassion. On ne forme pas de bons soldats sans valoriser l’agressivité et la lutte comme mode de vie et triomphe sur la mort."
BHU_dragons_storm:0 "Tempête du Dragon"
BHU_dragons_storm_desc:0 "La tempête du tonnerre décimera tous nos ennemis !"
BHU_reclamation_of_the_lost_lands:0 "Récupération des Terres Perdues"
BHU_reclamation_of_the_lost_lands_desc:0 "Les Britanniques ont diminué notre pays au XIXᵉ siècle par leurs pressions. Notre revanche est enfin arrivée."
BHU_reclamation_of_the_lost_lands:0 "Réclamation des terres perdues"
BHU_attack_the_plateau:0 "Attaquer le plateau"
BHU_attack_the_plateau_desc:0 "L’indépendance de notre jeune État est menacée de toutes parts. Si nous tenterions une marche vers le sud, nous serions écrasés à coup sûr, mais notre frontière nord avec [TIB.GetNameDef] semble peu défendue. Avec une planification et un timing adéquats, nous pourrons frapper rapidement et imposer notre autorité sur ces terres qui nous reviennent de droit !"
BHU_swallow_the_white_sun:0 "Avaler le Soleil blanc"
BHU_swallow_the_white_sun_desc:0 "Des siècles de domination [CHI.GetAdjective] ont laissé de profondes cicatrices sur notre société. Le peuple [BHU.GetAdjective] se lèvera contre l’occupation étrangère, l’impérialisme et les gouvernements corrompus dispersés à travers la plaine centrale. Que l’Est tremble à la vue de l’ascension de [BHU.GetNamedef] !"
BHU_extinguish_the_red_sun:0 "Éteindre le Soleil rouge"
BHU_extinguish_the_red_sun_desc:0 "Les [JAP.GetAdjective] prétendent qu’il est de leur destin d’apporter paix et prospérité en Asie. Pourtant, nous savons tous qu’il ne s’agit que d’un masque dissimulant leurs ambitions impérialistes et bellicistes. Montrons-leur à quel point ils se trompent en imposant un gouvernement légitime sous notre juridiction directe !"

BHU_maintain_monarchic_regime:0 "Maintenir la monarchie"
BHU_maintain_monarchic_regime_desc:0 "Le Roi-Dragon est le chef et le pilier de notre pays."
BHU_reinforce_the_throne:0 "Renforcer le trône"
BHU_reinforce_the_throne_desc:0 "Vive le roi !"
BHU_the_quiet_strength:0 "La force tranquille"
BHU_the_quiet_strength_desc:0 "Le Roi-Dragon est notre guide et nous montrera la voie."
BHU_delegate_to_the_tslzogdu:0 "Déléguer au Tslzogdu"
BHU_delegate_to_the_tslzogdu_desc:0 "Le roi ne peut gouverner seul ; il doit déléguer une partie de son pouvoir à l’assemblée."
BHU_aristocratic_regime:0 "Régime aristocratique"
BHU_aristocratic_regime_desc:0 "Les grandes familles sont essentielles pour garantir la stabilité de nos institutions."
BHU_forced_industrial_progress:0 "Progrès industriel forcé"
BHU_forced_industrial_progress_desc:0 "Monarchistes, démocrates et fascistes ont échoué à assurer la prospérité industrielle et l’indépendance économique de notre pays. Seul le communisme, avec ses programmes d’industrialisation, mènera la nation [BHU.GetAdjective] à l’émancipation du prolétariat."

#Divers
BHU_no_army_tt:0 "\n§RImpossible de relever la loi sur la conscription ou de déclarer des guerres.\nImpossible d’entraîner, dissoudre ou modifier des unités.§!"

#Événements
#spicyedits
himalaya_bhutan.2.t:0 "Suite de la visite à Calcutta"
himalaya_bhutan.2.desc:0 "Pour la première fois depuis des années, le roi a visité [RAJ.GetNameDef]. Ce voyage a confirmé le plan de modernisation approuvé précédemment, tout en réaffirmant la situation politique du royaume. Cela pourrait signifier que le royaume s’apprête à connaître de profonds changements dans les années à venir."
himalaya_bhutan.2.a:0 "Revenons maintenant aux affaires plus pressantes."
