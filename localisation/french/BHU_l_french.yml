 BHU_andruk_tashi:0 "Andruk Tashi"
 BHU_bachu_phugyal:0 "Bachu Phugyal"
 BHU_ugyen_tanghi:0 "Uygen Tanghi"
 BHU_rin_singh_dorji:0 "Rin Singh Dorji"
