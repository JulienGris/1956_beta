ROM_increased_air_research:0 "Accroître la recherche aéronautique"
ROM_increased_air_research_desc:0 "Pour rester en tête en aéronautique, il faut investir immédiatement dans l’extension de la recherche [ROM.GetAdjective]."
ROM_turbine_engine_experiments:0 "Expérimenter les turbines"
