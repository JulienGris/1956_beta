ROM_romanian_armed_forces_modifier_fi:0 "Forțele Terestre Române"
ROM_romanian_armed_forces_modifier_fi_desc:0 "Après avoir combattu lors de la Deuxième guerre balkanique et de la Grande Guerre, les forces armées roumaines ont été notre première ligne de défense. Cependant, l’absence de véritable modernisation commence à se faire cruellement sentir.\n\nNous devons nous moderniser maintenant, ou nous risquons de tout perdre."
