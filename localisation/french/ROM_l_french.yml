###Événements###
############
rt56.romania.1.t:0 "[FROM.GetNameDefCap] propose un accord commercial"
rt56.romania.1.d:0 "Lors d’une réunion à Berlin aujourd’hui, le gouvernement roumain a proposé un accord commercial entre nos deux nations. Cela pourrait s’avérer particulièrement lucratif : les champs pétrolifères roumains en Munténie auront une grande valeur pour nos plans à venir."
rt56.romania.1.a:0 "C’est un bon jour pour être ami des [FROM.GetAdjective]s."
rt56.romania.1.b:0 "Pas besoin de commercer avec eux pour obtenir leur pétrole."
rt56.romania.2.t:0 "[FROM.GetNameDefCap] accepte la proposition commerciale"
rt56.romania.2.d:0 "Un télégramme vient d’arriver à Bucarest : les [FROM.GetAdjective]s ont accepté notre proposition commerciale."
rt56.romania.2.a:0 "Formidable !"
rt56.romania.3.t:0 "[FROM.GetNameDefCap] refuse l’offre commerciale"
rt56.romania.3.d:0 "Après un morne voyage de retour, nous avons appris que les [FROM.GetAdjective]s ne donneront pas suite à l’accord commercial proposé."
rt56.romania.3.a:0 "Bien regrettable."
rt56.romania.4.t:0 "Le plan quadriennal allemand"
rt56.romania.4.d:0 "Tôt ce matin, un certain Helmuth Wolthat est arrivé à [ROOT.Capital.GetCapitalVictoryPointName] avec une nouvelle proposition de la part de [GER.GetNameDef]. Comme l’accord commercial précédent signé avec l’Allemagne, il est sans doute à leur avantage — et celui-ci l’est encore davantage. Le plan quadriennal proposé verrait la majeure partie, sinon la totalité, de la production pétrolière de Munténie aller directement à [GER.GetNameDef], tandis que nous n’obtiendrions que de maigres gains industriels, très en-deçà de la valeur réelle du pétrole.\n\nMême si cela n’est pas explicitement dit, ses propos s’accompagnent sans aucun doute d’une menace voilée."
rt56.romania.4.a:0 "Et nous soumettre à une domination économique ? Jamais !"
rt56.romania.4.b:0 "Mieux vaut ne pas fâcher l’Aigle…"
rt56.romania.4.c:0 "Proposons une contre-offre…"
rt56.romania.5.t:0 "[FROM.GetNameDefCap] cède ses droits sur le pétrole"
rt56.romania.5.d:0 "De retour aujourd’hui à [ROOT.Capital.GetCapitalVictoryPointName], M. Helmuth Wolthat s’est félicité d’annoncer que [FROM.GetNameDef] a accepté une coopération économique accrue, garantissant ainsi que les champs pétrolifères de Munténie alimenteront notre effort de guerre à venir."
rt56.romania.5.a:0 "Quelle agréable surprise."
rt56.romania.6.t:0 "Contre-offre de [FROM.GetNameDefCap]"
rt56.romania.6.d:0 "Ce n’est pas exactement ce que nous espérions tirer du plan quadriennal — où [FROM.GetNameDef] nous aurait donné un accès total à son pétrole —, mais ils proposent d’aider à développer notre industrie synthétique afin d’augmenter notre production indigène. Ce ne sera pas une quantité comparable, mais cela ferait office de solution provisoire jusqu’à ce que nous placions durablement le pétrole roumain dans notre sphère."
rt56.romania.6.a:0 "Cela paraît suffisamment raisonnable."
rt56.romania.6.b:0 "Ils viendront bien rapidement à nous, de toute façon."
rt56.romania.7.t:0 "[FROM.GetNameDefCap] accepte notre offre"
rt56.romania.7.d:0 "De bonnes nouvelles nous parviennent de Berlin : les Allemands ont annoncé accepter notre contre-proposition. Cela nous permettra d’améliorer encore notre économie tout en conservant notre indépendance économique vis-à-vis de l’Allemagne."
rt56.romania.7.a:0 "Quel soulagement."
rt56.romania.8.t:0 "[FROM.GetNameDefCap] rejette la contre-proposition"
rt56.romania.8.d:0 "S’ils ne nous placent pas sous une domination économique, les Allemands ont toutefois annoncé que notre contre-proposition n’était pas satisfaisante : ils n’apporteront aucune aide pour améliorer l’économie roumaine."
rt56.romania.8.a:0 "Restons sur nos gardes."
rt56.balkan_pact.1.t:0 "[FROM.GetNameDefCap] veut renforcer le Pacte balkanique"
rt56.balkan_pact.1.d:0 "Depuis sa signature en 1934, le Pacte balkanique protège la région d’une possible future agression bulgare. Mais l’Italie et l’Allemagne ayant succombé au fascisme, il est temps de le renforcer pour être prêts si la Bulgarie tente de replonger les Balkans dans le chaos."
rt56.balkan_pact.1.a:0 "Le Pacte balkanique doit tenir."
rt56.balkan_pact.1.b:0 "Au risque d’un nouveau baril de poudre ?"
rt56.balkan_pact.2.t:0 "[FROM.GetNameDefCap] accepte de renouveler le pacte"
rt56.balkan_pact.2.d:0 "Notre émissaire envoyé auprès de [FROM.GetNameDef] est revenu aujourd’hui avec une bonne nouvelle : les [FROM.GetAdjective]s renouvelleront leurs obligations envers le Pacte balkanique."
rt56.balkan_pact.2.a:0 "Formidable !"
rt56.balkan_pact.3.t:0 "[FROM.GetNameDefCap] trahit le Pacte"
rt56.balkan_pact.3.d:0 "Au retour de nos envoyés de [FROM.GetNameDef], les nouvelles sont funestes : les [FROM.GetAdjective]s ne renouvelleront pas leur statut de signataire du Pacte balkanique…"
rt56.balkan_pact.3.a:0 "Bellicistes !"
rt56.balkan_pact.4.t:0 "[FROM.GetNameDefCap] nous invite à rejoindre le Pacte balkanique"
rt56.balkan_pact.4.d:0 "Bien que le Pacte balkanique soit un pacte défensif dirigé contre nous, [FROM.GetNameDef] nous a, lors d’une réunion aujourd’hui, proposé d’y adhérer. L’invitation implique une politique de non-agression avec ses membres actuels, mais aussi la renonciation à nos revendications territoriales."
rt56.balkan_pact.4.a:0 "La coopération profitera à tous sur le long terme."
rt56.balkan_pact.4.b:0 "Ce n’est qu’un leurre."
rt56.balkan_pact.5.t:0 "[FROM.GetNameDefCap] rejoint le Pacte balkanique"
rt56.balkan_pact.5.d:0 "Ce jour marque une ère nouvelle : les Balkans peuvent regarder l’avenir sans craindre leurs voisins ; une coopération inédite entre nos nations commence."
rt56.balkan_pact.5.a:0 "Les Balkans unis."
rt56.balkan_pact.6.t:0 "[FROM.GetNameDefCap] refuse de signer le pacte"
rt56.balkan_pact.6.d:0 "Sans surprise, [FROM.GetNameDef] a décliné notre invitation à rejoindre le Pacte balkanique. Est-ce pour poursuivre leurs revendications territoriales ? Nous l’ignorons, mais une chose est sûre : on ne peut pas leur faire confiance."
rt56.balkan_pact.6.a:0 "Prévisible."
rt56.balkan_pact.7.t:0 "[FROM.GetNameDefCap] propose de formaliser l’Entente balkanique"
rt56.balkan_pact.7.d:0 "Lors d’une réunion de tous les membres du Pacte balkanique, [FROM.GetLeader] a proposé de le formaliser pour en faire une véritable alliance contre toute menace extérieure pesant sur la stabilité des Balkans. Les avantages défensifs sont évidents, mais cela pourrait aussi comporter des inconvénients…"
rt56.balkan_pact.7.a:0 "Pour une région balkanique prospère !"
rt56.balkan_pact.7.b:0 "Au risque d’une intervention extérieure ?"
rt56.balkan_pact.8.t:0 "[FROM.GetNameDefCap] rejoint l’Entente balkanique"
rt56.balkan_pact.8.d:0 "Jugeant les avantages supérieurs aux inconvénients, les [FROM.GetAdjective]s ont accepté la proposition et ont rejoint notre faction."
rt56.balkan_pact.8.a:0 "Pour l’avenir !"
rt56.balkan_pact.9.t:0 "[FROM.GetNameDefCap] refuse l’invitation"
rt56.balkan_pact.9.d:0 "Arguant que créer un bloc politique supplémentaire en Europe pourrait déstabiliser la région, et ne souhaitant pas s’enchaîner à une faction, les [FROM.GetAdjective]s se sont retirés des pourparlers."
rt56.balkan_pact.9.a:0 "Bien regrettable."
rt56.balkan_pact.20.t:0 "Le Pacte balkanique est attaqué"
rt56.balkan_pact.20.d:0 "Nous avons appris que nos alliés de [FROM.GetNameDefCap] ont été attaqués ou envahis par les forces [BUL.GetAdjective]es il y a quelques jours ! En vertu de nos accords avec le gouvernement [FROM.GetAdjective], on attend de nous que nous entrions en guerre pour les aider. Ce n’est peut-être pas dans notre intérêt : il faut décider vite, le temps presse."
rt56.balkan_pact.20.a:0 "Nous les avons déjà battus, nous les battrons encore !"
rt56.balkan_pact.20.b:0 "Nous ne pouvons pas nous permettre une nouvelle guerre contre les [BUL.GetAdjective]s…"
rt56.rom_west.1.t:0 "[FROM.GetNameDefCap] demande des garanties militaires"
rt56.rom_west.1.d:0 "La guerre se profilant, nous tentons depuis quelques mois de formaliser une alliance avec [FROM.GetNameDef], sans succès apparent. Aujourd’hui, la donne semble changer : lors d’une rencontre entre [FROM.GetLeader] et [THIs.GetLeader], le premier a demandé une garantie militaire avant d’envisager une alliance."
rt56.rom_west.1.a:0 "Très bien, [FROM.GetNameDef] aura sa garantie."
rt56.rom_west.1.b:0 "Au risque de déstabiliser la région ?"
rt56.rom_west.2.t:0 "[FROM.GetNameDefCap] garantit un soutien militaire"
rt56.rom_west.2.d:0 "Excellentes nouvelles à l’issue de la rencontre de [THIS.GetLeader] avec [FROM.GetLeader] : [FROM.GetNameDef] nous promet une aide militaire si nous sommes attaqués."
rt56.rom_west.2.a:0 "Splendide !"
rt56.rom_west.3.t:0 "[FROM.GetNameDefCap] rejette la demande"
rt56.rom_west.3.d:0 "Malgré des nouvelles globalement positives, [THIS.GetLeader] a dû admettre ne pas avoir obtenu de garantie militaire de [FROM.GetNameDef]. Nous ne pourrons pas compter sur eux en cas d’invasion."
rt56.rom_west.3.a:0 "Nous n’avons pas besoin d’eux."
rt56.rom_stab_ger.1.t:0 "[FROM.GetNameDefCap] se prépare à la paix…"
rt56.rom_stab_ger.1.d:0 "Nos agents à Stockholm rapportent qu’un changement de régime pourrait survenir chez notre allié [FROM.GetNameDef], et que le nouveau pouvoir chercherait à signer un armistice avec [SOV.GetNameDef]. Restons à l’affût d’une possible trahison."
rt56.rom_stab_ger.1.a:0 "Sales lâches !"
rt56.rom_stab_ger.2.t:0 "[FROM.GetNameDefCap] demande la paix"
rt56.rom_stab_ger.2.d:0 "Tôt ce matin, notre ministre des Affaires étrangères a rencontré son homologue [FROM.GetAdjective] à Stockholm. Les [FROM.GetAdjective]s ont indiqué qu’un changement de régime était probable et qu’ils souhaitaient faire la paix avec [ROOT.GetNameDef], prêts à accepter les conditions exigées quelques mois plus tôt si nous les aidons à chasser les [GER.GetAdjective]s de leur territoire."
rt56.rom_stab_ger.2.a:0 "Cela aidera à étrangler les [GER.GetAdjective]. Acceptons."
rt56.rom_stab_ger.2.b:0 "Non ! Le sang du peuple soviétique exige une reddition totale !"
rt56.rom_stab_ger.3.t:0 "[FROM.GetNameDefCap] signe l’armistice"
rt56.rom_stab_ger.3.d:0 "Avec l’armistice signé, nous sommes désormais en paix avec [FROM.GetNameDef] et pouvons nous tourner vers les [HUN.GetAdjective]s pour reprendre la Transylvanie !"
rt56.rom_stab_ger.3.a:0 "Jusqu’à Berlin s’il le faut !"
rt56.rom_stab_ger.4.t:0 "[FROM.GetNameDefCap] refuse l’offre de paix"
rt56.rom_stab_ger.4.d:0 "[FROM.GetNameDefCap] nous a fait savoir qu’il n’y aura pas de paix tant que toute [ROOT.GetName] n’aura pas plié devant la puissance de l’Armée rouge. Il nous faut maintenant livrer l’ultime combat, pour la Roumanie."
rt56.rom_stab_ger.4.a:0 "La Roumanie ne tombera pas !"
rt56.rom_general_election.1.t:0 "Les élections générales"
rt56.rom_general_election.1.d:0 "Les élections générales se tiennent, il est temps de voir à quoi ressemblera l’avenir de la Roumanie. Le Parti national-libéral, favori de longue date, semble en bonne position, mais son rival — le Parti national paysan — paraît tout aussi fort.\n\n\nComme toujours en politique, nul ne sait vraiment ce qui sortira des urnes."
rt56.rom_general_election.1.a:0 "Comme prévu, le Roi devra intervenir."
rt56.rom_general_election.1.b:0 "Occupons le Roi et laissons la démocratie fonctionner…"
rt56.rom_general_election.2.t:0 "[FROM.GetNameDefCap] demande de l’aide face à la crise imminente"
rt56.rom_general_election.2.d:0 "À la suite de l’impasse électorale et de rumeurs de révolution venant des milieux de gauche, le gouvernement roumain a fait appel à nous, membres du Pacte balkanique, pour fournir une aide matérielle — armes et artillerie lourde — au cas où les communistes jetteraient le pays dans la guerre civile.\n\nLa situation en Roumanie risque de déborder sur nos terres si rien n’est fait. Faut-il les aider maintenant — au risque d’affronter plus tard un État communiste plus fort s’ils tombent —, ou conserver notre matériel pour mieux résister si les communistes l’emportent ?"
rt56.rom_general_election.2.a:0 "Absolument !"
rt56.rom_general_election.2.b:0 "Nous ne pouvons rien épargner…"
rt56.rom_general_election.21.t:0 "[FROM.GetNameDefCap] fournira des armes"
rt56.rom_general_election.21.d:0 "[FROM.GetNameDefCap] nous a promis qu’en cas de tentative de révolution communiste, ils nous fourniront des fusils et de l’artillerie lourde en fonction de leurs capacités."
rt56.rom_general_election.21.a:0 "Un ami de la démocratie."
rt56.rom_general_election.22.t:0 "[FROM.GetNameDefCap] ne nous soutiendra pas"
rt56.rom_general_election.22.d:0 "[FROM.GetNameDefCap] a clairement indiqué que, plutôt que de se tenir aux côtés de la démocratie, ils préfèrent laisser notre sort aux communistes. Si nous sortons vainqueurs de cette crise, nous n’oublierons pas cette trahison."
rt56.rom_general_election.22.a:0 "Ainsi va le Pacte balkanique…"
rt56.rom_general_election.3.t:0 "[FROM.GetNameDefCap] demande un soutien face à la crise imminente"
rt56.rom_general_election.3.d:0 "Des représentants de Bucarest sont arrivés à l’aube, fébriles et paranoïaques. Lors d’une audience privée, ils ont affirmé que des éléments communistes pourraient tenter de renverser le gouvernement d’ici six mois et demandent une aide pour faire face à cette crise imminente, si elle venait à se concrétiser."
rt56.rom_general_election.3.a:0 "Absolument !"
rt56.rom_general_election.3.b:0 "Nous ne pouvons rien épargner."
rt56.rom_general_election.31.t:0 "[FROM.GetNameDefCap] nous apportera son soutien"
rt56.rom_general_election.31.d:0 "[FROM.GetNameDefCap] nous a promis que, si une révolution éclatait, ils nous fourniraient des armes et ne freineraient pas l’envoi de volontaires. Ils ne nous soutiendront toutefois pas officiellement afin de ne pas compromettre leur position si nous échouons."
rt56.rom_general_election.31.a:0 "Une victoire douce-amère reste une victoire."
rt56.rom_general_election.32.t:0 "[FROM.GetNameDefCap] rejette notre demande"
rt56.rom_general_election.32.d:0 "Au nom de leur propre réarmement face au conflit qui menace l’Europe, le gouvernement [FROM.GetAdjective] a refusé toute aide, hormis des pensées et des prières."
rt56.rom_general_election.32.a:0 "Voleurs !"
rt56.rom_general_election.4.t:0 "Blocage électoral"
rt56.rom_general_election.4.d:0 "Coup de théâtre : après deux, puis trois recomptages, aucun parti ou faction n’est en mesure de former seul un gouvernement. L’impasse électorale est totale, et l’absence de coalition jette une ombre de doute sur le régime en place.\n\nAlors que les partis cherchent une figure de ralliement, des rumeurs de révolution de gauche se mettent à circuler…"
rt56.rom_general_election.4.a:0 "Avançons avec prudence."
rt56.rom_general_election.5.t:0 "La guerre civile roumaine"
rt56.rom_general_election.5.d:0 "Un peu plus de six mois ont passé depuis l’impasse, et la Roumanie se trouve au point de bascule. Deux camps majeurs se font face et l’avenir n’a jamais été aussi incertain.\n\nLes révolutionnaires renverseront-ils l’ancien régime, ou la coalition hétéroclite l’emportera-t-elle ? Seul l’avenir le dira — mais pour l’heure, il ne reste qu’une chose à faire…"
rt56.rom_general_election.5.a:0 "Aux armes !"
rt56.rom_general_election.6.t:0 "Impasse roumaine"
rt56.rom_general_election.6.d:0 "Après avoir combattu aux côtés des révolutionnaires en Roumanie contre l’ancien régime, nous arrivons à un point où le coût en vies et en matériel dépasse l’intérêt d’ajouter une révolution de plus à notre camp. Nos forces ont déjà commencé à se retirer, tandis qu’un cessez-le-feu est signé."
rt56.rom_general_election.6.a:0 "Exaspérant."
rt56.rom_general_election.7.t:0 "Les [SOV.GetAdjective]s interviennent"
rt56.rom_general_election.7.d:0 "Arguant qu’ils ne peuvent rester les bras croisés tandis que des camarades révolutionnaires se soulèvent contre leurs oppresseurs, [FROM.GetNameDef] a annoncé le lancement d’une mission de maintien de la paix visant à stabiliser la Roumanie et à ramener la stabilité dans la région."
rt56.rom_general_election.7.a:0 "L’Armée rouge approche."
rt56.rom_general_election.8.t:0 "L’élection anticipée"
rt56.rom_general_election.8.d:0 "Si la décision d’avancer la date du scrutin a pu être impopulaire, elle était vitale pour l’intégrité de la démocratie dans notre pays. À présent, il ne reste qu’à voir où la démocratie nous mènera."
rt56.rom_general_election.8.a:0 "Pour prévenir la dictature royale, il faut agir."
rt56.rom_general_election.9.t:0 "Intervenir en Roumanie ?"
rt56.rom_general_election.9.d:0 "À la suite de l’impasse électorale en Roumanie, une guerre civile a éclaté entre forces démocrates et communistes. Le conflit se jouant à notre frontière, il pourrait être utile d’intervenir du côté des communistes afin d’assurer notre influence dans les Balkans."
rt56.rom_general_election.9.a:0 "Nous aiderons nos camarades !"
rt56.rom_general_election.9.b:0 "Nous avons d’autres problèmes à régler."
rt56.rom_abdicate.1.t:0 "L’abdication du roi Carol"
rt56.rom_abdicate.1.d:0 "À la suite de concessions territoriales forcées, l’opinion publique réclame l’abdication du roi Carol II. Sa destination et ses projets restent inconnus, mais désormais la Roumanie se tourne vers son fils, le roi Michel Ier, pour guider le pays en ces temps troublés vers un avenir plus prospère !"
rt56.rom_abdicate.1.a:0 "Il doit abdiquer !"
rt56.rom_transylvania.1.t:0 "La Roumanie soulève la question de la Transylvanie du Nord"
rt56.rom_transylvania.1.d:0 "Après l’annexion hongroise de la Transylvanie du Nord, que nous avons soutenue, le gouvernement roumain a à plusieurs reprises demandé l’autorisation de reprendre ce territoire. Il arrive aujourd’hui avec une nouvelle proposition : ils nous transfèrent la Transnistrie, et en échange récupèrent leurs terres. Les Hongrois n’apprécieront sans doute pas si nous acceptons l’échange, mais au fond, ils n’ont pas vraiment leur mot à dire."
rt56.rom_transylvania.1.a:0 "Ils ont bien œuvré : qu’ils la récupèrent."
rt56.rom_transylvania.1.b:0 "Qu’ils gardent la Transnistrie."
rt56.rom_transylvania.2.t:0 "[FROM.GetNameDefCap] exige le retour de la Transylvanie du Nord"
rt56.rom_transylvania.2.d:0 "Un ultimatum venu de Berlin nous enjoint aujourd’hui de rendre la Transylvanie du Nord aux Roumains, revirement pour le moins surprenant. Deux options s’offrent à nous : transférer la région à la Roumanie, ou encourir la colère allemande une fois la guerre terminée."
rt56.rom_transylvania.2.a:0 "Très bien, nous obéirons."
rt56.rom_transylvania.2.b:0 "Non, la Transylvanie du Nord est hongroise !"
rt56.rom_transylvania.3.t:0 "[FROM.GetNameDefCap] rejette notre demande"
rt56.rom_transylvania.3.d:0 "Sans grande surprise, les Allemands ont choisi de maintenir la Transylvanie du Nord hors de notre portée en laissant les Hongrois la conserver. Frustrant, certes ; il nous faudra patienter jusqu’à la prochaine occasion."
rt56.rom_transylvania.3.a:0 "Dommage."
rt56.rom_tilea_affair.1.t:0 "L’affaire Tilea"
rt56.rom_tilea_affair.1.d:0 "Tôt ce matin, Viorel Tilea a fait irruption au ministère des Affaires étrangères en clamant que la Roumanie était menacée d’une invasion conjointe germano-hongroise.\n\nSelon lui, d’ici le début de l’été, ils seraient prêts à marcher sur la Transylvanie, puis à s’emparer des vastes réserves de pétrole du pays."
rt56.rom_tilea_affair.1.a:0 "[FROM.GetNameDefCap] doit être défendue"
rt56.rom_tilea_affair.1.b:0 "Nous ne défendrons pas [FROM.GetNameDef]."
rt56.rom_tilea_affair.2.t:0 "[FROM.GetNameDefCap] promet sa protection"
rt56.rom_tilea_affair.2.d:0 "À la suite de la visite paniquée de Tilea au Foreign Office de Londres, un télégramme est arrivé à Bucarest : [FROM.GetNameDef] nous apportera un soutien armé en cas de crise."
rt56.rom_tilea_affair.2.a:0 "Excellente nouvelle."
rt56.rom_tilea_affair.3.t:0 "[FROM.GetNameDefCap] rejette la demande"
rt56.rom_tilea_affair.3.d:0 "Les nouvelles revenues de Londres au sujet de la visite de Tilea s’accompagnent d’un refus : [FROM.GetNameDef] n’offrira pas d’aide militaire, jugeant hautement improbable une invasion conjointe germano-hongroise."
rt56.rom_tilea_affair.3.a:0 "À quoi nous attendions-nous ?"
rt56.rom_peace_front.1.t:0 "Le Front de la paix"
rt56.rom_peace_front.1.d:0 "Tôt ce matin, un émissaire de Bucarest est arrivé avec une proposition de coopération militaire entre nos pays.\n\nBaptisée « Front de la paix », l’alliance viserait à freiner l’expansion croissante de l’Allemagne en Europe centrale et, espérons-le, à la dissuader de déclencher une nouvelle Grande Guerre.\n\nCependant, cela pourrait tout autant servir de catalyseur et pousser l’Allemagne à se montrer plus agressive si elle se sent menacée…"
rt56.rom_peace_front.1.a:0 "Nous travaillerons avec [FROM.GetNameDef] et [ENG.GetNameDef]"
rt56.rom_peace_front.1.b:0 "Nous ne sombrerons pas avec eux"
rt56.rom_peace_front.2.t:0 "[FROM.GetNameDefCap] signe le Front de la paix"
rt56.rom_peace_front.2.d:0 "Après de longues discussions avec le ministre des Affaires étrangères [FROM.GetAdjective], celui-ci a décidé de rejoindre l’initiative du Front de la paix. Ensemble, nous pourrons, espérons-le, contenir l’Allemagne si elle tente de relancer la guerre."
rt56.rom_peace_front.2.a:0 "Excellente nouvelle."
rt56.rom_peace_front.3.t:0 "[FROM.GetNameDefCap] rejette la demande"
rt56.rom_peace_front.3.d:0 "Malgré tous les efforts de notre émissaire, le ministre [FROM.GetAdjective] des Affaires étrangères a refusé de signer l’accord qui aurait renforcé le Front de la paix, estimant qu’il s’agirait d’une tentative vaine et qu’il pourrait même servir de déclencheur à une guerre allemande."
rt56.rom_peace_front.3.a:0 "À quoi nous attendions-nous ?"
rt56.rom_bulgaria_situation.1.t:0 "[FROM.GetNameDefCap] exige un réalignement"
rt56.rom_bulgaria_situation.1.d:0 "Dans une déclaration publique à Bucarest aujourd’hui, [FROM.GetLeader] a exigé que nous, [ROOT.GetNameDef], réalignions notre politique étrangère et nous soumettions à l’autorité de Bucarest. Il a ajouté que si nous résistions, l’armée [FROM.GetAdjective] serait prête à franchir la frontière au moindre signe de refus."
rt56.rom_bulgaria_situation.1.a:0 "Nous n’avons pas le choix."
rt56.rom_bulgaria_situation.1.b:0 "Nous ne céderons pas un pouce de terrain !"
rt56.rom_bulgaria_situation.2.t:0 "[FROM.GetNameDefCap] se soumet"
rt56.rom_bulgaria_situation.2.d:0 "Aujourd’hui, [FROM.GetLeader] s’est exprimé à la radio sur tout le territoire de [FROM.GetNameDef], annonçant qu’au vu de la situation politique dans les Balkans, [FROM.GetNameDef] se plierait à nos exigences, estimant que c’est la meilleure voie pour épargner des vies au sein de [FROM.GetNameDef]."
rt56.rom_bulgaria_situation.2.a:0 "Parfait."
rt56.rom_bulgaria_situation.3.t:0 "[FROM.GetNameDefCap] nous défie"
rt56.rom_bulgaria_situation.3.d:0 "Aujourd’hui, [FROM.GetLeader] a déclaré à la radio, partout en [FROM.GetNameDef], que les exigences de [ROOT.GetLeader] constituaient une menace directe pour la souveraineté de [FROM.GetNameDef] et que tout soldat tentant de franchir la frontière serait accueilli par le feu de l’artillerie !"
rt56.rom_bulgaria_situation.3.a:0 "Quelle insolence."
rt56.rom_protect_yug.1.t:0 "[FROM.GetNameDefCap] réclame la protection de [YUG.GetNameDefCap]"
rt56.rom_protect_yug.1.d:0 "Encore une fois, le ministre [FROM.GetAdjective], Tilea, arrive avec une nouvelle requête. Il craint que [YUG.GetNameDef] ne soit attaquée directement par [GER.GetNameDef] et nous presse d’étendre à [YUG.GetName] la protection que nous leur avons accordée."
rt56.rom_protect_yug.1.a:0 "C’est une bonne proposition."
rt56.rom_protect_yug.1.b:0 "Cela ne ferait que nous disperser."
rt56.rom_protect_yug.2.t:0 "[FROM.GetNameDefCap] rejette la motion"
rt56.rom_protect_yug.2.d:0 "De nouvelles informations en provenance de Londres nous parviennent, hélas sombres : [FROM.GetNameDef] n’étendra pas à [YUG.GetNameDef] la protection qu’il nous a accordée, arguant que ses forces armées seraient trop dispersées pour être efficaces."
rt56.rom_protect_yug.2.a:0 "Qu’ils affrontent leur destin."
rt56.rom_com_bul_dobruja_trade.1.t:0 "[ROM.GetNameDefCap] offre la Dobroudja contre un soutien à la guerre d’indépendance"
rt56.rom_com_bul_dobruja_trade.1.d:0 "Contre toute attente, des membres du service de sécurité intérieure [FROM.GetAdjective] nous ont approchés avec une proposition. Ils souhaitent briser le joug imposé par [SOV.GetNameDef] et sont prêts à se séparer du territoire pris à notre dépens lors de la Deuxième guerre balkanique, en échange de notre soutien contre [SOV.GetNameDef]."
rt56.rom_com_bul_dobruja_trade.1.a:0 "L’entreprise est risquée, mais elle pourrait réussir."
rt56.rom_com_bul_dobruja_trade.1.b:0 "Non, [77.GetName] nous reviendra tôt ou tard."
rt56.rom_com_bul_dobruja_trade.2.t:0 "[FROM.GetNameDefCap] accepte la proposition"
rt56.rom_com_bul_dobruja_trade.2.d:0 "Nos agents envoyés auprès de [FROM.GetNameDef] sont revenus avec la promesse d’un soutien, à condition que nous respections l’accord de transfert de [77.GetName] au moment de la déclaration de guerre."
rt56.rom_com_bul_dobruja_trade.2.a:0 "Merveilleux — amer, mais merveilleux."
rt56.rom_com_bul_dobruja_trade.3.t:0 "[FROM.GetNameDefCap] rejette la proposition"
rt56.rom_com_bul_dobruja_trade.3.d:0 "Nos agents dépêchés auprès de [FROM.GetNameDef] rapportent avoir été accueillis par des rires puis expulsés, avec ce message : [77.GetName] reviendra bien assez tôt à [FROM.GetNameDef], et ils ne participeront pas à notre suicide."
rt56.rom_com_bul_dobruja_trade.3.a:0 "Ne jamais faire confiance à un [FROM.GetAdjective]."
rt56.rom_ger_divide_czech.1.t:0 "[FROM.GetNameDefCap] propose la partition de la Tchécoslovaquie"
rt56.rom_ger_divide_czech.1.d:0 "Aujourd’hui, un messager mandaté par [ROM.GetLeader] est arrivé à Berlin avec des cartes détaillant un projet de partition de [CZE.GetNameDef]. Le plan verrait les territoires tchèques nous revenir, tandis qu’un nouveau régime serait installé dans la partie slovaque. Cela nous donnerait l’occasion de réunifier les minorités allemandes des Sudètes, et les capacités industrielles de [9.GetName] et [75.GetName] conviendraient parfaitement à nos projets."
rt56.rom_ger_divide_czech.1.a:0 "Très bien, transmettons cela aux [CZE.GetAdjective]s."
rt56.rom_ger_divide_czech.1.b:0 "Non, nos plans n’impliquent pas [ROM.GetNameDef]."
rt56.rom_ger_divide_czech.2.t:0 "[FROM.GetNameDefCap] approuve la proposition"
rt56.rom_ger_divide_czech.2.d:0 "Un télégramme de la capitale [GER.GetAdjective] nous informe aujourd’hui de leur vif intérêt pour une partition de [CZE.GetNameDef] ; ils attendent notre feu vert ainsi que la réponse des [CZE.GetAdjective]s."
rt56.rom_ger_divide_czech.2.a:0 "Parfait, envoyons l’ultimatum."
rt56.rom_ger_divide_czech.3.t:0 "[FROM.GetNameDefcap] rejette la suggestion"
rt56.rom_ger_divide_czech.3.d:0 "Notre émissaire envoyé à [GER.GetNameDef] est revenu avec une mauvaise nouvelle : ils ne participeront à aucune partition de [CZE.GetNameDef] avec nous et se réservent le droit de décider des frontières d’Europe centrale."
rt56.rom_ger_divide_czech.3.a:0 "Quelle cécité."
rt56.rom_ger_divide_czech.4.t:0 "[FROM.GetNameDefCap] et [GER.GetNameDefCap] nous imposent la partition"
rt56.rom_ger_divide_czech.4.d:0 "Coup de tonnerre : [ROM.GetNameDef] et [GER.GetNameDef] se sont entendus pour nous adresser un ultimatum. Nous soumettre à leurs régimes respectifs, ou en subir les conséquences. Si notre frontière avec [GER.GetNameDef] est fortement fortifiée, celle avec [ROM.GetNameDef] l’est bien moins, hormis les défenses naturelles des Carpates. Trois options semblent s’offrir à nous…"
rt56.rom_ger_divide_czech.4.a:0 "Nous n’avons pas d’autre choix."
rt56.rom_ger_divide_czech.4.b:0 "Nous combattrons !"
rt56.rom_ger_divide_czech.4.c:0 "Rallier [FRA.GetNameDef] à notre cause !"
rt56.rom_ger_divide_czech.5.t:0 "[FROM.GetNameDefCap] se soumet"
rt56.rom_ger_divide_czech.5.d:0 "Coup de théâtre favorable : [CZE.GetNameDef] a retrouvé la raison et a décidé de céder à nos exigences communes. Les armées [GER.GetAdjective]es et la nôtre ont commencé les préparatifs pour entrer en [CZE.GetNameDef] afin d’y garantir la stabilité tout en sécurisant nos zones respectives."
rt56.rom_ger_divide_czech.5.a:0 "Merveilleux !"
rt56.rom_ger_divide_czech.6.t:0 "[FROM.GetNameDefCap] mobilise"
rt56.rom_ger_divide_czech.6.d:0 "Sans grande surprise, [CZE.GetNameDef] a décrété la mobilisation générale et se prépare désormais à résister à nos avancées."
rt56.rom_ger_divide_czech.6.a:0 "La politique a échoué, comme prévu."
rt56.rom_ger_divide_czech.7.t:0 "[FROM.GetNameDefCap] demande de l’aide"
rt56.rom_ger_divide_czech.7.d:0 "Des nouvelles stupéfiantes sont arrivées à Paris aujourd’hui : [CZE.GetNameDef] fait face à une menace existentielle émanant à la fois de [GER.GetNameDef] et, contre toute attente, de [ROM.GetNameDef], son ancien allié. Le ministre [CZE.GetAdjective] en poste dans [FRA.GetNameDef] nous supplie de les aider à repousser ces envahisseurs potentiels, car si eux tombent, le reste de l’Europe pourrait suivre."
rt56.rom_ger_divide_czech.7.a:0 "[FRA.GetNameDefCap] n’abandonnera pas [CZE.GetNameDef]"
rt56.rom_ger_divide_czech.7.b:0 "Nous ne pouvons risquer une guerre avec les [GER.GetAdjective]s pour l’instant…"
rt56.rom_ger_divide_czech.8.t:0 "[FROM.GetNameDefCap] se range à nos côtés"
rt56.rom_ger_divide_czech.8.d:0 "[FRA.GetNameDefCap] a annoncé qu’elle fournirait une aide militaire si les [ROM.GetAdjective]s et les [GER.GetAdjective]s osaient lancer leur attaque.\n\n[CZE.GetNameDefCap] ne tombera pas aujourd’hui !"
rt56.rom_ger_divide_czech.8.a:0 "Qu’ils viennent !"
rt56.rom_ger_divide_czech.9.t:0 "[FROM.GetNameDefCap] nous abandonne"
rt56.rom_ger_divide_czech.9.d:0 "[FRA.GetNameDefCap] a annoncé qu’elle n’est pas en mesure de nous apporter l’assistance militaire demandée, ne pouvant risquer une guerre avec [GER.GetNameDef] au vu de sa situation intérieure. Nous sommes, véritablement, seuls."
rt56.rom_ger_divide_czech.9.a:0 "Isolés, nous n’avons plus le choix."
rt56.rom_ger_divide_czech.9.b:0 "Très bien, nous nous battrons seuls !"
rt56.rom_hun_submission.1.t:0 "[FROM.GetLeader] exige notre soumission"
rt56.rom_hun_submission.1.d:0 "[FROM.GetLeader] poursuit ses diatribes et nous adresse désormais un ultimatum exigeant la présence de fonctionnaires roumains au sein de notre appareil d’État, transformant notre pays en un simple État fantoche."
rt56.rom_hun_submission.1.a:0 "Entre le Lynx et la Croix, quel choix reste-t-il."
rt56.rom_hun_submission.1.b:0 "Ils se briseront sur la Tisza. Qu’ils viennent."
rt56.rom_hun_submission.2.t:0 "[FROM.GetNameDefCap] se soumet"
rt56.rom_hun_submission.2.d:0 "Le gouvernement [FROM.GetAdjective] a décidé d’accepter nos exigences. Nos officiels ont obtenu l’accès à des rouages clés de leur État, garantissant notre influence dans leur pays."
rt56.rom_hun_submission.2.a:0 "Tout se déroule selon le plan."
rt56.rom_hun_submission.3.t:0 "[FROM.GetNameDefCap] reste défiant"
rt56.rom_hun_submission.3.d:0 "Le gouvernement [FROM.GetAdjective] a stupidement choisi de résister à nos demandes, malgré le risque que cela fait courir à l’existence même de leur nation."
rt56.rom_hun_submission.3.a:0 "Nous ne craignons pas de faire couler le sang [HUN.GetAdjective]."
rt56.rom_hun_invitation.1.t: "[FROM.GetName] propose d’aligner la Hongrie"
rt56.rom_hun_invitation.1.d: "[FROM.GetAdjective] diplomates sont arrivés aujourd’hui porteurs d’une requête de [FROM.GetLeader] : tenter de recruter [HUN.GetNameDef] dans notre faction."
rt56.rom_hun_invitation.1.a: "Excellente suggestion."
rt56.rom_hun_invitation.1.b: "Nous avons d’autres projets pour la Hongrie."
rt56.rom_hun_invitation.2.t: "[FROM.GetName] refuse d’inviter la Hongrie"
rt56.rom_hun_invitation.2.d: "Notre proposition d’aligner [HUN.GetNameDef] a été rejetée par [GER.GetLeader], qui a déblatéré sur leur potentiel de nuisance et leur propension à servir de tremplin à une propagande expansionniste."
rt56.rom_hun_invitation.2.a: "Tant pis pour eux."
rt56.rom_anti_legionary_activity.1.t:0 "Les activités anti-légionnaires s’intensifient"
rt56.rom_anti_legionary_activity.1.d:0 "Après l’annonce de la victoire électorale de la Garde de Fer, une vague de manifestations anti-légionnaires a déferlé sur la Transylvanie. Elles restent pour l’instant limitées, mais pourraient dégénérer si on les laisse s’envenimer."
rt56.rom_anti_legionary_activity.1.a:0 "Envoyez la Garde de Fer."
rt56.rom_embargo.1.t:0 "[FROM.GetNameDef] décrète un embargo contre les pays extrémistes"
rt56.rom_embargo.1.d:0 "Le gouvernement [FROM.GetAdjective] appelle à des sanctions économiques internationales contre les pays fascistes européens."
rt56.rom_embargo.1.a:0 "Nous les rejoindrons."
rt56.rom_embargo.1.b:0 "Notre économie ne le supporterait pas."
rt56.rom_bulg_pressure.1.t:0 "[FROM.GetName] contacte le FFP"
rt56.rom_bulg_pressure.1.d:0 "Aux premières heures du matin, nous avons appris que des agents de [FROM.GetName] entraient en contact avec des éléments du Front de la Patrie. Il semble que le régime révolutionnaire de Bucarest cherche à étendre son influence au-delà de ses frontières.\n\nComment devons-nous réagir ?"
rt56.rom_bulg_pressure.1.a:0 "Envoyer un contact."
rt56.rom_bulg_pressure.1.b:0 "Arrêter leurs contacts et les juger."
rt56.rom_bulg_pressure.11.t:0 "Le FFP montre de l’intérêt"
rt56.rom_bulg_pressure.11.d:0 "Après une longue attente, nous avons enfin la confirmation que le Front de la Patrie souhaite traiter avec nous. Nous pouvons désormais préparer correctement le futur coup d’État qui apportera la révolution aux [BUL.GetAdjective]s."
rt56.rom_bulg_pressure.11.a:0 "Parfait, le plan continue."
rt56.rom_bulg_pressure.21.t:0 "Nos contacts au FFP ont été exécutés"
rt56.rom_bulg_pressure.21.d:0 "On nous informe que nos contacts au sein du Front de la Patrie ont été exécutés après la découverte de notre implication. Le simulacre de procès n’a duré que quelques minutes avant que chacun ne soit fusillé.\n\nUne nouvelle question se pose : que faisons-nous maintenant ?"
rt56.rom_bulg_pressure.21.a:0 "Leur heure viendra."
rt56.rom_bulg_pressure.21.b:0 "Alors, agissons maintenant !"
rt56.rom_bulg_pressure.5.t:0 "[FROM.GetNameDefCap] pousse à l’annexion formelle"
rt56.rom_bulg_pressure.5.d:0 "À mesure que notre intégration avec [FROM.GetNameDef] se renforce, le gouvernement [FROM.GetAdjective] plaide pour notre unification officielle au sein d’un État plus vaste et plus fort, garantissant la sécurité de nos deux peuples."
rt56.rom_bulg_pressure.5.a:0 "Tout nous menait à cela."
rt56.rom_bulg_pressure.5.b:0 "La situation a changé."
rt56.rom_bulg_pressure.51.t:0 "[FROM.GetNameDefCap] est officiellement annexé"
rt56.rom_bulg_pressure.51.d:0 "Les [FROM.GetAdjective] ont annoncé aujourd’hui publiquement l’union de nos deux nations en un seul État, dont le siège du gouvernement sera à Bucarest. Des mois d’intégration progressive nous ont conduits jusqu’ici ; il est satisfaisant d’en voir enfin l’aboutissement."
rt56.rom_bulg_pressure.51.a:0 "L’unification, enfin."
rt56.rom_bulg_pressure.52.t:0 "[FROM.GetNameDefCap] se rétracte"
rt56.rom_bulg_pressure.52.d:0 "Malgré leur adhésion initiale au principe d’unification et des mois de préparation, le gouvernement [BUL.GetAdjective] semble s’être ravisé et s’est retiré de l’accord. Ainsi s’envolent des mois d’efforts."
rt56.rom_bulg_pressure.52.a:0 "Quelle contrariété."
rt56.rom_codreanu.1.t:0 "La mort de Corneliu Codreanu"
rt56.rom_codreanu.1.d:0 "Un rapport arrivé tôt ce matin indique que l’agitateur politique Corneliu Codreanu a été abattu la nuit dernière, à la suite d’une prétendue échauffourée entre un groupe d’assaillants et Codreanu avec ses escortes. L’emplacement des corps serait inconnu. À mesure que la nouvelle se répand, ses fidèles commencent à se rassembler pour des funérailles, malgré l’absence de dépouille.\n\n"
rt56.rom_codreanu.1.a:0 "La fin d’un homme controversé"
rt56.rom_comintern.1.t:0 "[FROM.GetNameDefCap] demande l’indépendance"
rt56.rom_comintern.1.d:0 "Le gouvernement [FROM.GetAdjective] réclame une plus grande autonomie, tout en restant notre allié fraternel dans la lutte pour la libération du prolétariat mondial."
rt56.rom_comintern.1.a:0 "Comme vous voudrez."
rt56.rom_comintern.1.b:0 "À une condition."
rt56.rom_comintern.1.c:0 "Hors de question."
rt56.rom_comintern.2.t:0 "[FROM.GetNameDefCap] nous accorde l’indépendance"
rt56.rom_comintern.2.d:0 "[FROM.GetNameDefCap] a accepté de nous accorder l’indépendance totale, au nom de l’amitié entre nos peuples."
rt56.rom_comintern.2.a:0 "Quel bonheur."
rt56.rom_comintern.3.t:0 "[FROM.GetNameDefCap] nous accorde une autonomie partielle"
rt56.rom_comintern.3.d:0 "[FROM.GetNameDefCap] a accepté d’accroître notre autonomie, au nom de l’amitié entre nos peuples."
rt56.rom_comintern.3.a:0 "Ce n’est pas exactement ce que nous voulions, mais ça s’en approche."
rt56.rom_comintern.4.t:0 "[FROM.GetNameDefCap] rejette notre demande"
rt56.rom_comintern.4.d:0 "[FROM.GetLeader] souhaite maintenir le statu quo et estime que notre parti n’est pas encore prêt à organiser lui-même la planification de son économie."
rt56.rom_comintern.4.a:0 "Alors nous restons liés."
rt56.rom_trial.1.t:0 "Le grand procès de [GetYear]"
rt56.rom_trial.1.d:0 "Le Bureau politique du Parti communiste roumain a découvert que certains de ses membres ont sapé la cause et se sont révélés être des ennemis du peuple. Non seulement ils ont remis en cause la ligne du parti, mais ils ont même dénoncé le centralisme démocratique. Il est de notre devoir de condamner les responsables et de faire respecter la doctrine du centralisme démocratique en neutralisant rapidement les éléments subversifs."
rt56.rom_trial.1.a:0 "Boris Ștefanov nous a menés jusqu’ici : qu’il dirige."
rt56.rom_trial.1.b:0 "Ana Pauker est une vraie stalinienne : qu’elle dirige."
rt56.rom_trial.1.c:0 "Gheorghe Gheorghiu-Dej promet un avenir prospère : qu’il dirige."
rt56.rom_trial.1.e:0 "Pătrășcanu doit diriger : tenons-nous sur nos propres jambes."
rt56.rom_trial.2.t:0 "Le procès final"
rt56.rom_trial.2.d:0 "Une nouvelle vague d’arrestations a secoué les plus hautes sphères de notre parti révolutionnaire. Ana Pauker et Gheorghe Gheorghiu-Dej sont accusés de dévier de la ligne du parti. Une fraction influente débat de leur expulsion."
rt56.rom_trial.2.a:0 "Ils peuvent rester."
rt56.rom_trial.2.b:0 "Pour la stabilité, ils doivent partir."
rt56.rom_rebirth.1.t:0 "Les régions exigent des réformes internes"
rt56.rom_rebirth.1.d:0 "Au lendemain de la guerre civile, plusieurs régions ont présenté une liste de revendications à satisfaire pour que la Roumanie devienne une véritable démocratie dans les Balkans.\n\nLes demandes vont d’une meilleure représentation électorale à des garanties de droits pour les minorités vivant dans nos frontières, en passant par des libertés politiques garanties — autant d’éléments qui leur auraient été ravis si les révolutionnaires avaient gagné."
rt56.rom_rebirth.1.a:0 "Très bien."
