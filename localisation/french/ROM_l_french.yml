#################################
###Arbre politique roumain#######
#################################

#Toutes les voies#
ROM_tatarescus_regime:0 "Le régime de Tătărescu"
ROM_tatarescus_regime_desc:0 "Gheorghe Tătărescu et le PNL dirigent la Roumanie depuis 1933, et notre nation a connu une croissance stable après la Grande Dépression. Mais, alors que les élections générales approchent, pourra-t-il mener la Roumanie vers un avenir prospère ?"
ROM_public_department_buildings:0 "Bâtiments administratifs publics"
ROM_public_department_buildings_desc:0 "Rien n’est plus frustrant que d’attendre des semaines pour une réponse administrative. En ouvrant des bâtiments spécifiques aux affaires publiques, les citoyens auront un lieu dédié pour adresser leurs requêtes au gouvernement."
ROM_clamp_down_on_extremism:0 "Réprimer l’extrémisme"
ROM_clamp_down_on_extremism_desc:0 "L’extrémisme est une plaie qui touche toutes les nations. Nous ne pouvons pas changer le monde, mais nous pouvons changer la Roumanie. En réprimant les groupes extrémistes qui appellent aux crimes et à la révolution, nous assurons un avenir sûr et prospère."
ROM_restrict_freedom_of_press:0 "Restreindre la liberté de la presse"
ROM_restrict_freedom_of_press_desc:0 "Bien que nous nous efforcions d’être un phare de démocratie dans les Balkans, certaines mesures impopulaires sont nécessaires. En restreignant la presse, nous privons les fauteurs de troubles d’un outil de propagande."
ROM_finalize_the_tax_reforms:0 "Finaliser les réformes fiscales"
ROM_finalize_the_tax_reforms_desc:0 "Le système fiscal roumain est désormais obsolète par rapport à d’autres pays européens. Pour assurer les revenus nécessaires à l’État, les réformes proposées doivent être mises en place."
ROM_enforce_the_tariffs:0 "Appliquer des tarifs douaniers"
ROM_enforce_the_tariffs_desc:0 "Afin de stimuler l’économie locale, il faut imposer des tarifs qui inciteront les entreprises à investir et acheter sur place plutôt qu’à importer."
ROM_privatize_state_owned_enterprises:0 "Privatiser les entreprises d’État"
ROM_privatize_state_owned_enterprises_desc:0 "Certaines entreprises publiques prospéreraient mieux entre des mains privées. Leur vente attirerait des investissements et permettrait à l’État de financer d’autres programmes."
ROM_public_works_programs:0 "Programmes de travaux publics"
ROM_public_works_programs_desc:0 "Grâce aux fonds dégagés par les réformes fiscales, les tarifs et les privatisations, nous pouvons investir davantage dans des projets profitant directement au peuple roumain."
ROM_a_flawed_democracy:0 "Une démocratie imparfaite"
ROM_a_flawed_democracy_desc:0 "Bien que certaines mesures semblent antidémocratiques, elles servent l’intérêt du pays et de son peuple. Restreindre légèrement certaines libertés est un prix acceptable pour préserver la liberté générale."
ROM_the_general_election:0 "Les élections générales"
ROM_the_general_election_desc:0 "Les élections approchent et l’avenir de la Roumanie est à nouveau en jeu. Les manœuvres politiciennes pourraient mettre en danger le royaume. Le Roi pourrait devoir intervenir pour assurer la stabilité."
ROM_hold_emergency_election:0 "Organiser des élections anticipées"
ROM_hold_emergency_election_desc:0 "Les partis extrémistes risquent de manipuler les élections. En les convoquant plus tôt, nous pourrions éviter ce danger et préserver l’intégrité démocratique."
#############################
###Historique & Démocratique###
#############################
ROM_dissolve_the_parliament:0 "Dissoudre le Parlement"
ROM_dissolve_the_parliament_desc:0 "Comme les élections se sont achevées sans vainqueur clair, le roi Carol II a annoncé publiquement qu’il dissolvait le Parlement afin de le reconstruire et de s’assurer que la démocratie prévaudra. Mais la manière dont tout cela se déroulera reste une question en suspens."
ROM_enforce_royal_dictatorship:0 "Imposer la Dictature Royale"
ROM_enforce_royal_dictatorship_desc:0 "Le roi a appris que la Garde de Fer fasciste prévoyait de se retirer des élections, ce qui aurait donné la majorité au PNC, un parti tout aussi extrémiste. Ainsi, le roi a décidé de s’emparer entièrement du gouvernement et de s’octroyer les pleins pouvoirs d’urgence afin de stabiliser le pays."
ROM_preservation_of_greater_romania:0 "Préserver la Grande Roumanie"
ROM_preservation_of_greater_romania_desc:0 "La préservation de la Grande Roumanie doit désormais primer sur tout le reste. Avec l’Union soviétique qui s’agite à l’est et le Reich allemand qui montre ses griffes, nous devons veiller à ce que, si la guerre éclate, la Roumanie repousse tous les envahisseurs potentiels !"
ROM_constitutional_reform:0 "Réforme Constitutionnelle"
ROM_constitutional_reform_desc:0 "Le roi Carol a préparé une nouvelle constitution qui lui permettra de continuer à diriger légalement notre pays vers un nouvel âge de prospérité, avec l’aide de son nouveau gouvernement."
ROM_build_the_carol_line:0 "Construire la Ligne Carol"
ROM_build_the_carol_line_desc:0 "Face aux longues frontières de la Roumanie, il est évident qu’elles sont gravement sous-protégées. En suivant l’exemple français, nous pouvons établir une ligne défensive qui protégera la Roumanie des agresseurs."
ROM_r56_german_romanian_trade_agreement:0 "Accord Commercial Germano-Roumain"
ROM_r56_german_romanian_trade_agreement_desc:0 "En signant un accord commercial avec l’Allemagne, nous nous assurons un partenaire stable capable de stimuler encore davantage notre économie."
ROM_western_diplomacy:0 "Diplomatie Occidentale"
ROM_western_diplomacy_desc:0 "Nos bonnes relations avec l’Occident ont consolidé la place de la Roumanie dans les Balkans en tant que puissance régionale. Cependant, nous vivons à côté de l’ours russe qui convoite nos terres orientales avec appétit et rancune. Obtenir une garantie officielle des Britanniques devrait tempérer cet esprit de revanche."
ROM_the_german_four_year_plan:0 "Le Plan Quadriennal Allemand"
ROM_the_german_four_year_plan_desc:0 "Les Allemands nous ont présenté une proposition : un plan quadriennal censé, selon eux, garantir la croissance et la prospérité du peuple roumain. Mais à y regarder de plus près, il ressemble davantage à un moyen de nous placer sous leur domination économique."
ROM_invite_german_military_advisors:0 "Inviter des Conseillers Militaires Allemands"
ROM_invite_german_military_advisors_desc:0 "L’armée allemande est l’une des meilleures du monde, sinon la meilleure, et la nôtre commence à accuser le coup. En invitant des conseillers allemands, nous bénéficierons d’un regard neuf qui pourra nous aider à corriger certains problèmes de nos forces armées."
ROM_anti_communist_measures:0 "Mesures Anticommunistes"
ROM_anti_communist_measures_desc:0 "Malgré notre fermeté à l’égard du communisme, la menace persistante d’une révolution violente n’a jamais disparu. Nous devons prendre des mesures supplémentaires pour l’empêcher de prendre pied en Roumanie."
ROM_strengthen_the_sentinels:0 "Renforcer les Sentinelles"
ROM_strengthen_the_sentinels_desc:0 "En renforçant les Sentinelles, projet personnel de Carol visant à contrer l’influence de la Garde de Fer sur la jeunesse roumaine, nous pouvons élargir le vivier de volontaires prêts à servir dans les forces armées avec le devoir de protéger la Roumanie."
ROM_subvert_fascism_in_romania:0 "Contrecarrer le Fascisme en Roumanie"
ROM_subvert_fascism_in_romania_desc:0 "Nous devons continuer à combattre l’influence fasciste qui rôde à chaque coin de rue. Qu’elle soit italienne, allemande ou même roumaine, nous devons la tenir à distance pour protéger les valeurs fondamentales de la Roumanie."
ROM_the_royal_guard:0 "La Garde Royale"
ROM_the_royal_guard_desc:0 "La Garde royale rassemble certains des meilleurs soldats de Roumanie, ayant juré leur vie à la protection du roi et de chaque parcelle du sol roumain."
ROM_axis_membership:0 "Adhésion à l’Axe"
ROM_axis_membership_desc:0 "Il est clair que le régime actuel n’a ni la capacité ni la volonté de protéger la Roumanie. Il est donc temps de changer de cap. En nous alliant à l’Allemagne, nous assurons la sécurité de la Roumanie et nous pourrons, une fois la guerre gagnée, retrouver notre gloire légitime."
ROM_purchase_german_designs_and_equipment:0 "Acheter des Plans et Équipements Allemands"
ROM_purchase_german_designs_and_equipment_desc:0 "En acquérant des modèles et du matériel éprouvés, nous pourrons équiper correctement nos forces armées. Nous pourrons même utiliser la recherche allemande comme base pour la nôtre, sans avoir à répéter leurs erreurs."
ROM_joint_german_oil_exploitation:0 "Exploitation Pétrolière Conjointe avec l’Allemagne"
ROM_joint_german_oil_exploitation_desc:0 "Nos champs pétrolifères figurent parmi les plus vastes d’Europe, et sont les plus importants hors du contrôle communiste. Avec l’aide de l’Allemagne, nous pourrons les exploiter à leur plein potentiel."
ROM_prepare_the_eastern_front:0 "Préparer le Front de l’Est"
ROM_prepare_the_eastern_front_desc:0 "Il est évident que l’Allemagne prépare une invasion vers l’est et nous devons nous y préparer. En renforçant nos logistiques et en préparant nos bases aériennes, nous pourrons les aider dans leur marche sur Moscou et reprendre les terres perdues."
ROM_claims_in_the_east:0 "Revendiquer l’Est"
ROM_claims_in_the_east_desc:0 "Avec la perte de la Transylvanie du Nord au profit des Hongrois, nous devons prouver aux yeux des Allemands que nous sommes dignes de récupérer la terre qui nous revient de droit."
ROM_the_transnistrian_exchange:0 "L’Échange de Transnistrie"
ROM_the_transnistrian_exchange_desc:0 "Grâce à nos nouvelles acquisitions à l’est, nous pourrions négocier avec les Allemands : ils obtiennent la Transnistrie, et en échange, nous récupérons la Transylvanie."
ROM_royal_coup:0 "Coup d’État Royal"
ROM_royal_coup_desc:0 "S’allier à l’Allemagne a pu sembler une bonne idée au début de la guerre, mais à mesure que les vents tournent, nous devons garantir la survie de la Roumanie. En envoyant une délégation à Stockholm pour négocier avec les Russes, nous pourrions leur présenter une proposition qu’ils jugeront, espérons-le, avantageuse."
ROM_push_across_the_tisza_river:0 "Traverser la Tisza"
ROM_push_across_the_tisza_river_desc:0 "Il est temps de reprendre ce que nous avons perdu. D’abord, nous reprendrons la Transylvanie, puis nous franchirons les murs de Budapest pour abattre les Allemands par le sud !"
ROM_the_percentage_question:0 "La Question des Pourcentages"
ROM_the_percentage_question_desc:0 "Nous avons peut-être commencé la guerre en ennemis, mais en reconnaissant nos erreurs, nous avons brisé nos chaînes fascistes et contribué à la victoire. Pourquoi devrions-nous être considérés comme des perdants, alors que nous avons combattu aux côtés des vainqueurs ?"
ROM_the_romanian_peoples_republic:0 "La République Populaire Roumaine"
ROM_the_romanian_peoples_republic_desc:0 "L’ancien royaume s’est effondré et, à l’issue de la Seconde Guerre mondiale, nous voilà libérés de l’avidité capitaliste et du carcan monarchique. Désormais, la République populaire roumaine se tiendra fièrement aux côtés de Moscou pour forger une nouvelle Europe !"
ROM_reconfigure_the_government:0 "Reconfigurer le Gouvernement"
ROM_reconfigure_the_government_desc:0 "Avec l’aube nouvelle vient un nouveau gouvernement. En supprimant les chaînes du passé, nous nous libérons enfin. Travailleurs, réjouissez-vous !"
######################
###L’Affaire Tilea###
######################
ROM_the_tilea_affair:0 "L’Affaire Tilea"
ROM_the_tilea_affair_desc:0 "Il n’est un secret pour personne que les Allemands préparent une invasion de la Roumanie via la Hongrie. Nous devons demander aux Britanniques une alliance officielle entre nos deux nations !"
ROM_the_peace_front:0 "Le Front de la Paix"
ROM_the_peace_front_desc:0 "En établissant un Front de la Paix, nous nous opposerons aux Allemands et à leurs alliés bellicistes. Chaque pas en avant sera un pas vers la liberté et la prospérité !"
ROM_allies_membership:0 "Adhésion aux Alliés"
ROM_allies_membership_desc:0 "En devenant membre officiel des Alliés, nous garantissons que la démocratie aura un ancrage permanent dans les Balkans, et de là, nous pourrons renverser tout gouvernement tyrannique qui oserait nous défier."
ROM_the_tisza_plan:0 "Le Plan de la Tisza"
ROM_the_tisza_plan_desc:0 "Les premiers projets, après la Grande Guerre, prévoyaient l’expansion de la Roumanie jusqu’au fleuve Tisza. Cela n’a pas abouti, mais rien ne nous empêche aujourd’hui de corriger cela en neutralisant le risque d’une alliance germano-hongroise."
ROM_protect_yugoslavia:0 "Protéger la Yougoslavie"
ROM_protect_yugoslavia_desc:0 "Avec les regards allemands et italiens tournés vers la Yougoslavie, nous devons intervenir pour la protéger. C’est notre devoir en tant que gardiens des Balkans."
peace_front:0 "Front de la Paix"
ROM_anti_italian_aid_in_albania:0 "Aide anti-italienne en Albanie"
ROM_anti_italian_aid_in_albania_desc:0 "Le Royaume d’Albanie est aujourd’hui pratiquement un État fantoche de l’Italie. En assurant le roi Zog et son gouvernement de notre protection, nous pourrons empêcher une annexion totale de l’Albanie — du moins, nous l’espérons."
ROM_handle_bulgaria:0 "Gérer la Bulgarie"
ROM_handle_bulgaria_desc:0 "La Bulgarie revendique une grande partie des Balkans malgré la perte de ces territoires pendant la Grande Guerre. Nous devons lui rappeler sa place et l’empêcher de déclencher un nouveau conflit balkanique."
ROM_safeguard_the_greeks:0 "Protéger les Grecs"
ROM_safeguard_the_greeks_desc:0 "Encore une fois, nous devons être une épine dans le pied de l’Italie. En protégeant la Grèce, nous contrecarrons les ambitions coloniales italiennes."
ROM_coerce_the_turks:0 "Convaincre les Turcs"
ROM_coerce_the_turks_desc:0 "En persuadant les Turcs de s’allier contre l’extrémisme croissant en Europe, nous pourrons compter sur un allié aguerri qui a déjà triomphé en infériorité numérique. Avec eux, les Balkans ne tomberont ni au fascisme ni au communisme !"

###########################
###Dernier Rempart Roumain###
###########################
ROM_romanias_final_stand:0 "Le Dernier Rempart Roumain"
ROM_romanias_final_stand_desc:0 "Notre offre de paix a été refusée. Nous n’avons plus d’autre choix que de lutter jusqu’au bout et d’espérer repousser l’ennemi."
ROM_the_carpathian_trap:0 "Le Piège des Carpates"
ROM_the_carpathian_trap_desc:0 "Nos ennemis ne doivent en aucun cas franchir les Carpates."
ROM_dominate_the_black_sea:0 "Dominer la mer Noire"
ROM_dominate_the_black_sea_desc:0 "Contrôler une partie du littoral de la mer Noire ne suffit pas : il nous faut garantir la maîtrise totale de la mer elle-même."
ROM_crush_the_fatherland_front:0 "Écraser le Front de la Patrie"
ROM_crush_the_fatherland_front_desc:0 "Le Front de la Patrie bulgare a pris le pouvoir en Bulgarie et menace désormais notre flanc sud."
ROM_the_new_greater_romania:0 "La Nouvelle Grande Roumanie"
ROM_the_new_greater_romania_desc:0 "La paix est enfin revenue. Il est temps de reconstruire les dégâts de la guerre et de préparer un avenir meilleur."
ROM_the_capital_of_the_balkans:0 "La Capitale des Balkans"
ROM_the_capital_of_the_balkans_desc:0 "Notre rôle de leader régional a permis à Bucarest de devenir un centre encore plus influent dans les Balkans."

##################################
###Formaliser l’Entente Balkanique###
##################################
ROM_strengthen_the_balkan_pact:0 "Renforcer le Pacte balkanique"
ROM_strengthen_the_balkan_pact_desc:0 "Le Pacte balkanique a été signé en février 1934 par la Grèce, la Turquie, la Yougoslavie et nous-mêmes. Conçu pour maintenir le statu quo géopolitique, la dégradation du climat international rend nécessaire de renforcer les engagements de ses membres."
ROM_preempt_the_bulgarian_threat:0 "Prévenir la menace bulgare"
ROM_preempt_the_bulgarian_threat_desc:0 "Les Bulgares ont plongé la région dans la guerre en 1913 puis en 1915. La menace de l’irredentisme bulgare demeure, et nous ne pouvons pas les laisser se réarmer et attaquer à nouveau."
ROM_invite_bulgaria_to_the_pact:0 "Inviter la Bulgarie dans le Pacte"
ROM_invite_bulgaria_to_the_pact_desc:0 "Bien que le Pacte encercle clairement la Bulgarie, elle pourrait devenir un allié si elle renonce à ses revendications sur nos terres."
ROM_formalize_the_balkan_entente:0 "Formaliser l’Entente balkanique"
ROM_formalize_the_balkan_entente_desc:0 "De vagues promesses de statu quo semblent de plus en plus fragiles à mesure que des nuages noirs s’amoncellent sur l’Europe. Si nous voulons assurer notre défense, nous devons transformer ce pacte en une véritable alliance, dotée de mécanismes de défense commune."
balkan_entente:0 "Entente balkanique"
ROM_invite_albania:0 "Inviter l’Albanie"
ROM_invite_albania_desc:0 "L’Albanie fait également partie de la péninsule balkanique et devrait nous rejoindre afin d’assurer la continuité territoriale."
ROM_balkan_research_institute:0 "Institut de recherche balkanique"
ROM_balkan_research_institute_desc:0 "Si nos meilleurs esprits pouvaient coopérer, nous en tirerions tous des bénéfices."
ROM_deal_with_the_hungarians:0 "Traiter avec les Hongrois"
ROM_deal_with_the_hungarians_desc:0 "L’irredentisme hongrois menace notre intégrité territoriale, car ils souhaitent reprendre l’Ardeal. Si nous voulons protéger notre nation, nous devons empêcher cela à tout prix."
ROM_invite_ukraine_to_the_entente:0 "Inviter l’Ukraine dans l’Entente"
ROM_invite_ukraine_to_the_entente_desc:0 "Les Ukrainiens partagent notre vision : le retour de l’expansion [SOV.getAdjective] doit être empêché. Bien qu’ils ne soient pas strictement balkaniques, ils seraient un allié très précieux."

###################################
###S’opposer à la dictature royale###
###################################
ROM_oppose_the_royal_dictatorship:0 "S’opposer à la dictature royale"
ROM_oppose_the_royal_dictatorship_desc:0 "Pour garantir la véritable liberté en Roumanie, nous devons tout faire pour contrer la dictature royale que ceux qui obéissent au Trône cherchent à imposer. Chaque jour, nos libertés disparaissent au nom de la sécurité. Cela doit cesser."
ROM_the_iron_guard:0 "La Garde de Fer"
ROM_the_iron_guard_desc:0 "Les seuls capables d’opposer une véritable résistance aux monarques dictatoriaux sont les membres de la Garde de Fer. Codreanu a été une voix essentielle de l’opposition au Trône. Il est temps de nous rallier à lui pour préserver nos libertés de Roumains."

####################
###La Garde de Fer###
####################
ROM_initial_political_reforms:0 "Réformes politiques initiales"
ROM_initial_political_reforms_desc:0 "Avec la victoire de la Garde de Fer aux élections, nous pouvons lancer des réformes politiques qui nous éloigneront d’un coup d’État monarchiste pour nous rapprocher des autres républiques : un pays dirigé par le peuple, pour le peuple."
ROM_total_ban_on_communism:0 "Interdiction totale du communisme"
ROM_total_ban_on_communism_desc:0 "Pour assurer la stabilité intérieure, nous devons frapper fort contre les communistes tapis dans l’ombre et menaçant de précipiter la Roumanie dans la ruine. En interdisant toute activité communiste, nous garantissons la stabilité et la prospérité dont nous rêvons."
ROM_crack_down_on_anti_legionary_activity:0 "Réprimer les activités anti-légionnaires"
ROM_crack_down_on_anti_legionary_activity_desc:0 "Depuis la victoire électorale de la Garde de Fer, les activités anti-légionnaires se multiplient. Elles menacent la stabilité de la Roumanie et pourraient même déboucher sur une tentative de coup d’État communiste. Nous devons donc les écraser."
ROM_seize_royal_assets:0 "Saisir les biens royaux"
ROM_seize_royal_assets_desc:0 "Deux choses sont certaines dans la vie : tout le monde meurt, et les familles royales thésaurisent toujours la richesse de leur peuple. En saisissant leurs biens, nous pourrons financer nos projets industriels et rendre au peuple roumain ce qui lui a été volé."
ROM_exile_or_execution:0 "Exil ou exécution"
ROM_exile_or_execution_desc:0 "Il est clair que la famille royale a enraciné une loyauté indéfectible. Nous leur offrons donc un choix : quitter la Roumanie en laissant leurs richesses derrière eux, ou répondre devant Dieu en personne."
ROM_romanian_autarky:0 "Autarcie roumaine"
ROM_romanian_autarky_desc:0 "En exploitant davantage nos propres ressources, nous pouvons viser l’autarcie : une économie capable de tenir seule, où le commerce n’est qu’un complément et non un pilier."
ROM_seize_foreign_companies:0 "Saisir les compagnies étrangères"
ROM_seize_foreign_companies_desc:0 "Après la Grande Guerre, de nombreuses entreprises étrangères sont venues exploiter la Roumanie. En les saisissant, nous garantissons que les profits restent dans nos frontières plutôt que d’enrichir Washington, Paris ou Londres."
ROM_nationalized_industrial_complex:0 "Complexe industriel nationalisé"
ROM_nationalized_industrial_complex_desc:0 "La nationalisation de notre industrie permettra des chaînes d’approvisionnement plus courtes et accélérera la création de nouveaux secteurs."
ROM_militarized_industry:0 "Industrie militarisée"
ROM_militarized_industry_desc:0 "Chaque usine roumaine doit pouvoir être reconvertie à tout instant pour produire armes, camions, munitions ou obus. Ainsi, notre industrie restera flexible et prête."
ROM_simas_ascendancy:0 "L’ascension de Sima"
ROM_simas_ascendancy_desc:0 "Bras droit de Codreanu, Horia Sima prend désormais la direction de la Garde de Fer et de la Roumanie. Il est temps qu’il mène notre nation à la gloire."
ROM_expand_the_iron_guard:0 "Étendre la Garde de Fer"
ROM_expand_the_iron_guard_desc:0 "Pilier du parti, la Garde de Fer a réprimé les activités anti-légionnaires et libéré la Roumanie de la monarchie parasite. En renforçant ses rangs, nous augmentons nos capacités militaires et assurons notre défense."
ROM_service_abroad:0 "Service à l’étranger"
ROM_service_abroad_desc:0 "Tout homme a le droit de se battre pour ce en quoi il croit. Nous ne devons pas entraver ceux qui veulent combattre à l’étranger pour une cause juste."
ROM_intervention_in_spain:0 "Intervention en Espagne"
ROM_intervention_in_spain_desc:0 "La guerre civile espagnole est un événement majeur. En envoyant des volontaires officiels, nous apprendrons beaucoup et pourrons aider un régime ami à triompher."
ROM_military_law_enforcement:0 "Forces de l’ordre militarisées"
ROM_military_law_enforcement_desc:0 "Certains crimes dépassent le cadre des forces locales. En mobilisant des unités spécialisées de l’armée, nous pouvons les épauler, voire les remplacer, pour plus d’efficacité."
ROM_alliance_with_the_germans:0 "Alliance avec les Allemands"
ROM_alliance_with_the_germans_desc:0 "Les Allemands ont été essentiels à notre économie ces dernières années. Il est temps de nous placer à leurs côtés pour redessiner l’Europe et garantir une paix durable."
bucharest_pact:0 "Pacte de Bucarest"
ROM_alliance_with_the_italians:0 "Alliance avec les Italiens"
ROM_alliance_with_the_italians_desc:0 "Nous avons beaucoup en commun avec les Italiens, qui ont déjà prouvé être de bons alliés. Ensemble, nous remodelerons l’Europe du Sud pour les millénaires à venir."
ROM_divide_the_czechs:0 "Diviser les Tchèques"
ROM_divide_the_czechs_desc:0 "L’union des Tchèques et des Slovaques fut utile après la Grande Guerre. Mais ils sont désormais les plus exposés aux attaques polonaises et hongroises. Nous devons intervenir pour assurer leur survie."
ROM_carve_up_yugo:0 "Démembrer la Yougoslavie"
ROM_carve_up_yugo_desc:0 "La création de la Yougoslavie fut une erreur. Les hypocrites de Londres et les parasites de Paris le savent. Aux côtés des Italiens, nous corrigerons cela pour neutraliser cette poudrière."
ROM_demand_hungarian_submission:0 "Exiger la soumission hongroise"
ROM_demand_hungarian_submission_desc:0 "Les Hongrois et Autrichiens ont déclenché la Grande Guerre, et ils menacent encore l’Europe. Deux choix s’offrent à eux : plier le genou ou subir l’invasion."
ROM_invite_the_hungarians:0 "Inviter les Hongrois"
ROM_invite_the_hungarians_desc:0 "Malgré notre passé conflictuel, nous devons regarder vers l’avenir et bâtir une alliance avec les Hongrois pour stabiliser l’Europe de l’Est, voire contenir les Soviétiques."
balkan_sphere:0 "Sphère balkanique"
ROM_protect_our_eastern_front:0 "Protéger notre front oriental"
ROM_protect_our_eastern_front_desc:0 "L’Union soviétique convoite les terres que nous avons libérées de l’Empire russe : la Bessarabie. Nous devons protéger chaque Roumain qui y vit si l’Ours russe se réveille."
ROM_spread_latin_influence_south:0 "Diffuser l’influence latine au sud"
ROM_spread_latin_influence_south_desc:0 "La Bulgarie est une nation slave avec une minorité latine. En tant que protecteurs des Latins des Balkans, nous devons garantir leur sécurité."
ROM_align_greece:0 "S’aligner sur la Grèce"
ROM_align_greece_desc:0 "La Grèce fut un grand allié durant la Grande Guerre et les guerres balkaniques. Nous devrions rapprocher son gouvernement du nôtre pour renforcer la stabilité de la région."
ROM_align_turkey:0 "S’aligner sur la Turquie"
ROM_align_turkey_desc:0 "Bien que nous ayons combattu contre eux pendant la Grande Guerre, les Turcs ont prouvé leur valeur militaire contre les Britanniques et les Français. Nous devons unir nos objectifs."
ROM_codreanus_iron_guard:0 "La Garde de Fer de Codreanu"
ROM_codreanus_iron_guard_desc:0 "Libérée du joug monarchique, la Roumanie peut être guidée par Codreanu vers un avenir glorieux, uni et béni par Dieu."
ROM_christian_education_centers:0 "Centres d’éducation chrétienne"
ROM_christian_education_centers_desc:0 "Pour lutter contre l’analphabétisme, l’athéisme et le communisme, nous ouvrirons des centres chrétiens dans tout le pays, afin de diffuser la parole de Dieu."
ROM_ratify_traditional_gender_roles:0 "Ratifier les rôles de genre traditionnels"
ROM_ratify_traditional_gender_roles_desc:0 "Après la lutte contre la monarchie, il faut restaurer l’ordre social tel qu’il doit être. En imposant des rôles traditionnels, chacun saura ce qui est attendu de lui."
ROM_solidify_church_presence:0 "Renforcer la présence de l’Église"
ROM_solidify_church_presence_desc:0 "L’Église a été reléguée trop longtemps au second plan. Il est temps de restaurer sa place centrale dans la vie des Roumains."
ROM_the_seat_of_balkan_orthodoxy:0 "Le Siège de l’orthodoxie balkanique"
ROM_the_seat_of_balkan_orthodoxy_desc:0 "Le siège de l’orthodoxie est aujourd’hui à Moscou, au cœur de l’Union soviétique. Nous devons revendiquer ce rôle pour les Balkans et montrer que le communisme y est éradiqué."
ROM_establish_the_legion:0 "Fonder la Légion"
ROM_establish_the_legion_desc:0 "Avec la Légion de l’Archange Mihail, nous combattrons l’hédonisme, l’athéisme et le communisme, et servirons de rempart de la foi."
legion_of_the_archangel_mihail:0 "Légion de l’Archange Mihail"
ROM_crack_down_on_communism:0 "Réprimer le communisme"
ROM_crack_down_on_communism_desc:0 "Chaque nation communiste d’Europe doit connaître notre position : il n’y aura ni relations amicales, ni camaraderie, ni la moindre aide pour ceux qui se sont détournés de Dieu !"
ROM_restore_the_bulgarian_patriarchate:0 "Rétablir le patriarcat bulgare"
ROM_restore_the_bulgarian_patriarchate_desc:0 "Le patriarcat bulgare est tombé et c’est notre devoir de le restaurer ! Leurs mains communistes souillent la sainteté des Églises en Bulgarie — nous devons agir avant que tout ne soit détruit !"
ROM_intervene_in_greece:0 "Intervenir en Grèce"
ROM_intervene_in_greece_desc:0 "La Grèce étant tombée au communisme, il nous incombe de rétablir la stabilité. Nous devons préserver la sainteté de l’Église et, peut-être, permettre au peuple grec de retrouver la grâce de Dieu."
ROM_yugoslav_intervention:0 "Intervention en Yougoslavie"
ROM_yugoslav_intervention_desc:0 "L’État yougoslave est malheureusement tombé au communisme ; nous devons intervenir pour corriger cela. Leur chute menace la stabilité des Balkans et la persécution des chrétiens ne tardera pas à sévir. Pour leur sécurité — et pour leur foi — nous agirons !"
ROM_reclaim_the_mother_church:0 "Reprendre l’Église-Mère"
ROM_reclaim_the_mother_church_desc:0 "L’Église-Mère à Istanbul, l’ancienne Constantinople, est menacée par les athées, les musulmans et les communistes de Turquie. Pour protéger le plus saint des édifices d’Istanbul, nous devons intervenir au nom des chrétiens de Turquie !"
ROM_the_holy_land:0 "La Terre sainte"
ROM_the_holy_land_desc:0 "La ville de Jérusalem est actuellement sous l’occupation du Mandat de Palestine, un État artificiel créé par les puissances impérialistes de Londres et de Paris. Nous devons y mettre fin et faire en sorte que la ville passe sous le contrôle de l’Église orthodoxe !"
ROM_seize_the_vatican:0 "S’emparer du Vatican"
ROM_seize_the_vatican_desc:0 "Le Vatican se trouve au cœur de Rome. Le schisme a divisé la chrétienté et dressé notre foi contre elle-même. Pour survivre, nous devons prendre la Cité et réunifier le christianisme en une seule croyance !"

########################
###Blocage électoral###
########################
ROM_deadlock_in_election:0 "Blocage électoral"
ROM_deadlock_in_election_desc:0 "Nous espérions un résultat net, mais l’élection s’achève sur une impasse : aucun parti ne peut former seul un gouvernement, et personne ne veut coopérer. Dans le même temps, des rumeurs parlent d’une révolution qui couve…"
ROM_contacts_in_moscow:0 "Contacts à Moscou"
ROM_contacts_in_moscow_desc:0 "Si nous voulons renverser un régime corrompu, complaisant et moribond, l’appui extérieur est indispensable. En activant nos connexions à Moscou, nous pourrons faire entrer l’équipement et le matériel nécessaires à la révolution."
ROM_form_a_coalition:0 "Former une coalition"
ROM_form_a_coalition_desc:0 "Si la rumeur d’une révolution imminente est vraie, nous devons nous préparer. Impossible d’être pris au dépourvu. En contactant des figures clés de l’opposition, nous bâtirons une grande coalition pour protéger la Roumanie de la vague de trahison rouge."
ROM_seek_western_support:0 "Chercher un soutien occidental"
ROM_seek_western_support_desc:0 "En sollicitant nos anciens alliés et d’autres nations conscientes de la menace communiste, nous nous assurerons de ne pas combattre seuls les révolutionnaires."
ROM_concessions_to_the_right:0 "Concessions à la droite"
ROM_concessions_to_the_right_desc:0 "Ils ne valent pas mieux que les communistes, mais des militaristes comme la Garde de Fer haïssent les rouges plus que nous. En leur offrant de menues concessions, nous pourrions obtenir l’accès à une partie de leurs armes en cas de révolution."
ROM_recruit_the_iron_guard:0 "Recruter la Garde de Fer"
ROM_recruit_the_iron_guard_desc:0 "La Garde de Fer a l’expérience de la lutte anticommuniste. N’ayons pas honte d’exploiter leur savoir-faire pour l’épreuve qui s’annonce."
ROM_request_balkan_aid:0 "Demander l’aide balkanique"
ROM_request_balkan_aid_desc:0 "En nous tournant vers nos voisins balkaniques, nous devrions obtenir un soutien matériel de ceux qui s’opposent au péril rouge."
ROM_secure_the_home_front:0 "Sécuriser l’arrière-pays"
ROM_secure_the_home_front_desc:0 "En créant un service secret dédié, nous saurons ce que préparent les révolutionnaires avant qu’ils n’agissent. Il est hors de question d’attendre leur première frappe : nous serons prêts à riposter."
ROM_ensure_eastern_loyalties:0 "Assurer les loyautés de l’Est"
ROM_ensure_eastern_loyalties_desc:0 "Les régions orientales ont été délaissées par le gouvernement de Bucarest, trop focalisé sur les territoires conquis de Transylvanie. En parlant aux notables locaux, nous rallierons l’Est à notre cause en promettant un avenir plus prospère."
ROM_peasant_militias:0 "Milices paysannes"
ROM_peasant_militias_desc:0 "Chaque homme peut changer l’avenir, qu’il le sache ou non. S’il continue de labourer pour un régime oppresseur, il devient soldat de sa machine de guerre. S’il dit « assez » et prend les armes avec ses semblables, il devient un révolutionnaire."
ROM_contact_the_unions:0 "Contacter les syndicats"
ROM_contact_the_unions_desc:0 "Les syndicats ouvriers de Roumanie ont été muselés ou affaiblis jusqu’au ridicule. Cela ne veut pas dire qu’ils ne veulent pas changer la donne. En retissant les liens, nous pourrons faire entrer plus d’armes avant l’étincelle."
ROM_soviet_military_expertise:0 "Expertise militaire soviétique"
ROM_soviet_military_expertise_desc:0 "L’arrivée de volontaires soviétiques, prêts à soutenir une nouvelle révolution prolétarienne, renforcera grandement notre juste cause."
ROM_the_romanian_communist_party:0 "Le Parti communiste roumain"
ROM_the_romanian_communist_party_desc:0 "À l’avant-garde de la révolution ouvrière, nous devons assurer la dictature du prolétariat contre la menace des éléments bourgeois contre-révolutionnaires."
ROM_the_romanian_civil_war:0 "La guerre civile roumaine"
ROM_the_romanian_civil_war_desc:0 "Le peuple est opprimé par des ploutocrates féodaux et bourgeois depuis bien trop longtemps. Il est temps d’agir et de devenir l’avant-garde de sa libération."
ROM_preempt_counter_revolution:0 "Prévenir la contre-révolution"
ROM_preempt_counter_revolution_desc:0 "Les forces hostiles sont battues mais pas totalement neutralisées. Actives, elles veulent reprendre leur place pour opprimer les travailleurs."
ROM_collectivized_farming_programs:0 "Programmes d’agriculture collectivisée"
ROM_collectivized_farming_programs_desc:0 "Depuis des siècles, les grands propriétaires exploitent les métayers sans terre. En collectivisant la terre, chacun recevra sa part et travaillera pour le bien commun."
ROM_soviet_influenced_industry:0 "Industrie d’inspiration soviétique"
ROM_soviet_influenced_industry_desc:0 "L’URSS s’est industrialisée rapidement en mobilisant toutes les ressources vers les industries lourdes. Elle nous a montré la voie du progrès — un avenir qui fonctionne."
ROM_empower_the_securitate:0 "Renforcer la Securitate"
ROM_empower_the_securitate_desc:0 "La pensée réactionnaire persiste chez certains éléments hostiles à la révolution ouvrière. Il faut les identifier et les rééduquer — ou employer des moyens plus radicaux."
ROM_the_great_trial_of_year:0 "Le grand procès de [GetYear]"
ROM_the_great_trial_of_year_desc:0 "Le Bureau politique du Parti communiste roumain a constaté que certains membres minaient nos engagements idéologiques, remettant en cause la ligne du parti et le centralisme démocratique. Il est de notre devoir de les condamner et d’imposer la doctrine par la neutralisation rapide des éléments subversifs."
ROM_challenge_moscow:0 "Défier Moscou"
ROM_challenge_moscow_desc:0 "La bureaucratie moscovite a pris le contrôle de l’Internationale et égare la gauche révolutionnaire. Nous devons rétablir la juste voie et redonner espoir aux travailleurs du monde."
ROM_subvert_moscow_authority:0 "Saper l’autorité de Moscou"
ROM_subvert_moscow_authority_desc:0 "Avant d’afficher clairement nos intentions, sapons d’abord l’influence soviétique afin de préparer le terrain à notre rectification idéologique."
ROM_prepare_anti_soviet_cells:0 "Préparer des cellules antisoviétiques"
ROM_prepare_anti_soviet_cells_desc:0 "Des groupes révolutionnaires autonomes doivent être prêts à agir. Idéologiquement, les Soviétiques sont pires que les bourgeois : ils embrouillent le prolétariat."
ROM_reestablish_foreign_connections:0 "Rétablir les connexions étrangères"
ROM_reestablish_foreign_connections_desc:0 "D’autres oppositions communistes à travers le monde pourront probablement nous aider."
ROM_break_our_shackles:0 "Briser nos chaînes"
ROM_break_our_shackles_desc:0 "Il est temps de restaurer la juste interprétation du marxisme et de rendre l’esprit révolutionnaire au peuple."
ROM_establish_the_upla:0 "Fonder l’U.P.L.A."
ROM_establish_the_upla_desc:0 "La domination soviétique a apporté aux Ukrainiens d’innombrables souffrances au lieu de la libération promise. À nous d’honorer cette promesse et de leur donner un gouvernement."
ROM_arms_for_the_workers:0 "Des armes pour les travailleurs"
ROM_arms_for_the_workers_desc:0 "\"Sous aucun prétexte, les armes et munitions ne doivent être livrées ; toute tentative de désarmer les travailleurs doit être déjouée, y compris par la force si nécessaire.\"\n— Karl Marx"
ROM_tractors_to_tanks:0 "Des tracteurs aux chars"
ROM_tractors_to_tanks_desc:0 "Nos fabricants de tracteurs doivent recevoir l’ordre de produire des blindés et de soutenir l’effort de guerre."
ROM_bureau_of_warfare:0 "Bureau de la guerre"
ROM_bureau_of_warfare_desc:0 "Le Bureau de la guerre doit administrer nos forces armées."
ROM_bureau_of_economics:0 "Bureau de l’économie"
ROM_bureau_of_economics_desc:0 "Le Bureau de l’économie doit diriger la planification et éliminer les problèmes survenus dans son application."
ROM_allegiance_to_moscow:0 "Allégeance à Moscou"
ROM_allegiance_to_moscow_desc:0 "Gloire à la cause du marxisme-léninisme incarnée par le triomphe d’Octobre ! Gloire au Komintern !"
ROM_finalize_the_trials:0 "Clore les procès"
ROM_finalize_the_trials_desc:0 "La dissidence idéologique au sein du parti doit être éliminée."
ROM_political_commissars:0 "Commissaires politiques"
ROM_political_commissars_desc:0 "Afin d’assurer la fiabilité politique de nos soldats, des commissaires doivent être attachés aux unités aux côtés des officiers."
ROM_foundation_romanian_red_army:0 "Création de l’Armée rouge roumaine"
ROM_foundation_romanian_red_army_desc:0 "Le prolétariat en armes est le socle de l’Armée rouge roumaine. Pour affronter les forces hostiles, elle doit toutefois être correctement entraînée et équipée."
ROM_pressure_fatherland_front:0 "Mettre la pression au Front de la Patrie"
ROM_pressure_fatherland_front_desc:0 "Notre ligne idéologique doit être clairement communiquée au Front de la Patrie bulgare. Notre solidarité avec leurs objectifs socialistes ne doit pas être troublée par de mesquines préoccupations impérialistes réactionnaires."
ROM_romanian_bulgarian_ssr:0 "La RSS roumano-bulgare"
ROM_romanian_bulgarian_ssr_desc:0 "Pour symboliser notre amitié renouvelée, unissons nos nations au sein d’une RSS roumano-bulgare indivisible, soudée par la solidarité socialiste."
ROM_restoration_of_order:0 "Rétablissement de l’ordre"
ROM_restoration_of_order_desc:0 ""
ROM_stabilize_the_new_government:0 "Stabiliser le nouveau gouvernement"
ROM_stabilize_the_new_government_desc:0 "À présent que nous avons renversé la dictature royale, nous devons rebâtir des institutions solides."
ROM_anti_revolutionary_policies:0 "Politiques antirévolutionnaires"
ROM_anti_revolutionary_policies_desc:0 "Les cellules terroristes communistes ont profité de l’agitation pour tenter de s’emparer du pouvoir et imposer leur terreur rouge. Nous devons l’empêcher à tout prix. Ils saigneront rouge, car nous deviendrons le rouge !"
ROM_bedrock_of_balkan_democracy:0 "Socle de la démocratie balkanique"
ROM_bedrock_of_balkan_democracy_desc:0 "Nous avons prouvé à nos voisins qu’il est possible de résister à la dictature et de faire fonctionner une démocratie."
ROM_the_iron_guard_threat:0 "La menace de la Garde de Fer"
ROM_the_iron_guard_threat_desc:0 "La Garde de Fer rejette les principes du pluralisme. Elle prône la violence révolutionnaire et menace nos institutions."
ROM_fate_of_codreanu:0 "Le sort de Codreanu"
ROM_fate_of_codreanu_desc:0 "Le sort de Corneliu Codreanu, chef de la Garde de Fer, doit être tranché."
ROM_handle_the_guard:0 "Maîtriser la Garde"
ROM_handle_the_guard_desc:0 "Le mouvement légionnaire doit être contenu pour prévenir un coup d’État fasciste."
ROM_total_ban_on_paramilitaries:0 "Interdiction totale des milices"
ROM_total_ban_on_paramilitaries_desc:0 "Les milices radicales doivent être dissoutes et désarmées ; au besoin, leurs dirigeants seront arrêtés."
ROM_the_old_kingdom:0 "L’Ancien Royaume"
ROM_the_old_kingdom_desc:0 "Nos territoires les plus anciens, issus de l’union de la Moldavie et de la Valachie, forment une plaine : le cœur historique de notre nation."
ROM_the_new_kingdom:0 "Le Nouveau Royaume"
ROM_the_new_kingdom_desc:0 "L’Ardeal, libéré en 1918, est bien plus montagneux et possède ses particularités. Il faut les traiter en conséquence."
ROM_the_east:0 "L’Est"
ROM_the_east_desc:0 "Les territoires autrefois sous domination russe au nord-est doivent être réformés."
ROM_rural_investments:0 "Investissements ruraux"
ROM_rural_investments_desc:0 "Notre cœur agricole a besoin d’investissements pour augmenter la production."
ROM_balkan_diplomacy:0 "Diplomatie balkanique"
ROM_balkan_diplomacy_desc:0 "Le Pacte balkanique a été signé en février 1934 par la Grèce, la Turquie, la Yougoslavie et nous. Destiné à maintenir le statu quo géopolitique, l’aggravation du climat international rend nécessaire le renforcement des engagements de ses membres."
ROM_restore_the_balkan_pact:0 "Restaurer le Pacte balkanique"
ROM_restore_the_balkan_pact_desc:0 "Le Pacte a été déstabilisé par nos troubles internes, mais nous devons marquer notre retour sur la scène internationale."
ROM_form_a_united_balkan_pact:0 "Former un Pacte balkanique uni"
ROM_form_a_united_balkan_pact_desc:0 "De vagues promesses de statu quo paraissent bien faibles sous les nuages noirs qui s’amoncellent sur l’Europe. Pour prendre en main notre défense, transformons le pacte en véritable alliance dotée de mécanismes de défense commune."
balkan_defense_pact:0 "Pacte de défense balkanique"
ROM_handle_the_bulgarians:0 "Gérer les Bulgares"
ROM_handle_the_bulgarians_desc:0 "Bien que le Pacte encercle clairement la Bulgarie, elle pourrait devenir une alliée si elle renonce à ses revendications sur nos terres."
ROM_pan_balkan_economic_pact:0 "Pacte économique pan-balkanique"
ROM_pan_balkan_economic_pact_desc:0 "L’intégration économique régionale devrait nous aider à améliorer nos économies et à affronter les années difficiles à venir."
ROM_unite_the_balkan_defence_pact:0 "Unifier le Pacte de défense balkanique"
ROM_unite_the_balkan_defence_pact_desc:0 "À mesure que des nuages noirs s’amoncellent sur l’Europe, les promesses vagues de statu quo paraissent de plus en plus faibles. Pour garantir notre défense collective, nous devons transformer ce pacte en une véritable alliance dotée de mécanismes assurant la protection de tous ses membres."
ROM_united_against_extremism:0 "Unis contre l’extrémisme"
ROM_united_against_extremism_desc:0 "La tyrannie totalitaire ne doit pas l’emporter !"
ROM_the_german_eagle:0 "L’Aigle allemand"
ROM_the_german_eagle_desc:0 "Les Allemands ont régulièrement menacé la paix sur le continent et doivent être contenus une bonne fois pour toutes."
ROM_the_soviet_sickle:0 "La Faucille soviétique"
ROM_the_soviet_sickle_desc:0 "[SOV.GetnameDefCap] a menacé à plusieurs reprises notre intégrité : c’est un danger pour notre nation."
ROM_the_italian_cross:0 "La Croix italienne"
ROM_the_italian_cross_desc:0 "Les Italiens doivent être punis pour leur folle volonté de bâtir un nouvel empire."
ROM_restore_the_little_entente:0 "Restaurer la Petite Entente"
ROM_restore_the_little_entente_desc:0 "La Petite Entente doit être restaurée afin de nous protéger des tyrans qui nous entourent."
ROM_handle_the_hungarians:0 "Gérer les Hongrois"
ROM_handle_the_hungarians_desc:0 "L’irredentisme magyar restera une menace pour notre intégrité territoriale tant qu’on ne lui rappellera pas fermement ses défaites passées."

#################################
###Objectifs industriels roumains###
#################################
ROM_industrial_investments:0 "Investissements industriels"
ROM_industrial_investments_desc:0 "Notre économie ne s’est remise que récemment des effets de la Grande Dépression. En investissant intelligemment, nous pouvons relancer la croissance."
ROM_raw_resource_exploitation:0 "Exploitation des ressources brutes"
ROM_raw_resource_exploitation_desc:0 "L’extraction minière et pétrolière est un pilier de notre économie depuis des décennies. Nos clients sont toujours preneurs de notre pétrole, et notre industrie a besoin de davantage de minerais pour se développer."
ROM_industrial_revitalization_program:0 "Programme de revitalisation industrielle"
ROM_industrial_revitalization_program_desc:0 "Avec plus de minerai à disposition, nous pourrons le traiter pour produire davantage de biens finis destinés à notre marché intérieur."
ROM_increase_mining_efforts:0 "Intensifier l’extraction minière"
ROM_increase_mining_efforts_desc:0 "Bonus aux technologies d’excavation. Débloque de nouvelles décisions d’excavation."
ROM_gold_mining:0 "Extraction d’or"
ROM_gold_mining_desc:0 "L’or est le moyen le plus simple d’adosser notre monnaie à une quantité suffisante de métal précieux."
ROM_derrick_upgrades:0 "Moderniser les derricks"
ROM_derrick_upgrades_desc:0 "La modernisation de nos derricks nous permettra d’extraire le pétrole plus efficacement."
ROM_coal_mining:0 "Extraction de charbon"
ROM_coal_mining_desc:0 "Le charbon alimente nos trains et une grande partie de nos machines industrielles, l’huile restant secondaire dans certains secteurs."
ROM_uranium_discovery:0 "Découverte d’uranium"
ROM_uranium_discovery_desc:0 "Nous avons découvert des gisements d’uranium. En les exploitant, nous pourrons accélérer nos recherches nucléaires !"
ROM_the_industrial_combines:0 "Les combines industrielles"
ROM_the_industrial_combines_desc:0 "La concentration de l’industrie peut rationaliser la production et accroître notre efficacité."
ROM_romanian_timber_industry:0 "Industrie du bois roumaine"
ROM_romanian_timber_industry_desc:0 "Les vastes forêts de l’Ardeal sont une ressource majeure pour fabriquer meubles, papier et bien d’autres produits."
ROM_ford_bucuresti:0 "Ford Bucuresti"
ROM_ford_bucuresti_desc:0 "Notre filiale locale de Ford est un élément clé de notre modeste capacité de production de véhicules."
ROM_agricultural_reforms:0 "Réformes agricoles"
ROM_agricultural_reforms_desc:0 "Nos agriculteurs sont au cœur de notre économie et ont été durement frappés par la Grande Dépression. Ils se relèvent : aidons-les à revenir pleinement."
ROM_agricultural_boom:0 "Boom agricole"
ROM_agricultural_boom_desc:0 "Nouvelles techniques, tracteurs et engrais peuvent décupler notre potentiel agricole. Pour réussir, il faudra aussi former la paysannerie afin d’assurer de bonnes récoltes."
ROM_strei_river_hydroelectric_modernization:0 "Hydroélectricité du Strei"
ROM_strei_river_hydroelectric_modernization_desc:0 "Un barrage sur le fleuve Strei permettrait de contrôler le débit et de produire de l’électricité localement."
ROM_improve_rural_roads:0 "Améliorer les routes rurales"
ROM_improve_rural_roads_desc:0 "Des infrastructures rurales solides sont essentielles pour acheminer la production agricole accrue vers les marchés."
ROM_malaxa_bucuresti:0 "Malaxa Bucuresti"
ROM_malaxa_bucuresti_desc:0 "Le projet de Nicolae Malaxa de créer la première voiture roumaine est prometteur et pourrait être réorienté vers un usage militaire."
ROM_expand_the_romanian_academy:0 "Étendre l’Académie roumaine"
ROM_expand_the_romanian_academy_desc:0 "L’Académie roumaine rassemble nos plus brillants esprits scientifiques ; accroître son budget de recherche devrait favoriser nos innovations."
ROM_atelierele_leonida:0 "Atelierele Leonida"
ROM_atelierele_leonida_desc:0 "Les ateliers Leonida comptent parmi les rares sites du pays où l’on peut modifier, réparer ou assembler des blindés."

######################
###Objectifs militaires###
######################
ROM_romanian_armed_forces:0 "Forces armées roumaines"
ROM_romanian_armed_forces_desc:0 "Malgré les innombrables innovations de la guerre moderne, les forces terrestres traditionnelles de [ROM.GetAdjective] restent le rempart de notre indépendance. Que nous adoptions les outils de la guerre interarmes ou que nous renforcions nos atouts éprouvés, l’inaction n’est pas une option."
ROM_army_modernisation_program:0 "Programme de modernisation de l’armée"
ROM_army_modernisation_program_desc:0 "La guerre civile russe, le conflit polono-soviétique et la guerre d’indépendance turque ont démontré la mutation rapide du champ de bataille. Pour rester au niveau des puissances régionales, nous devons moderniser agressivement notre armée."
ROM_the_higher_war_school:0 "École supérieure de guerre"
ROM_the_higher_war_school_desc:0 ""
ROM_the_nicolae_balcescu_academy:0 "Académie Nicolae Bălcescu"
ROM_the_nicolae_balcescu_academy_desc:0 ""
ROM_the_army_profession:0 "Le métier des armes"
ROM_the_army_profession_desc:0 ""
ROM_increase_domestic_production:0 "Accroître la production nationale"
ROM_increase_domestic_production_desc:0 "Il devient chaque jour plus clair que la paix de Versailles n’est qu’un luxe temporaire. Pour tenir les frontières de la Grande Roumanie, nous devons financer notre industrie de défense."
ROM_domestic_rifle_designs:0 "Conceptions nationales de fusils"
ROM_domestic_rifle_designs_desc:0 "À mesure que [ROOT.GetNameDef] se développe, nous devons promouvoir une production d’armes plus largement nationale. Nul n’est plus digne de confiance pour défendre notre Grande Union que les [ROOT.GetAdjective] qui ont combattu et saigné pour l’atteindre."
ROM_support_equipment_redesign:0 "Refonte de l’équipement de soutien"
ROM_support_equipment_redesign_desc:0 "Pour moderniser nos forces armées, nous devons innover dans les outils qui assurent leur efficacité au combat."
ROM_romanian_weapons_research_institute:0 "Institut roumain de recherche en armement"
ROM_romanian_weapons_research_institute_desc:0 "Devenir une nation de pointe en développement d’armements exige une académie capable de faire éclore les talents dont le pays a besoin."
ROM_defend_our_skies:0 "Défendre notre ciel"
ROM_defend_our_skies_desc:0 "L’Italien Giulio Douhet a décrit l’effroyable dévastation que les bombardements stratégiques infligent aux civils. Pour éviter la soumission par ces armes, modernisons immédiatement notre DCA."
ROM_static_anti_air_defense:0 "Défense antiaérienne statique"
ROM_static_anti_air_defense_desc:0 "Les progrès réalisés dans la défense de notre ciel sont notables, mais il faut aller plus loin pour affronter la tempête qui approche !"
ROM_the_modern_battlefield:0 "Le champ de bataille moderne"
ROM_the_modern_battlefield_desc:0 "Une armée peut avoir les hommes les plus braves et tout l’arsenal moderne : elle s’effondrera sous un commandement rétrograde. Nous devons penser « champ de bataille moderne » pour ne pas succomber à nouveau à la menace étrangère."
ROM_heavy_firepower:0 "Puissance de feu lourde"
ROM_heavy_firepower_desc:0 "Pendant la Grande Guerre, nous avons flanché sous les barrages [GER.GetAdjective] et [BUL.GetAdjective]. Nous reproduirons leurs innovations à leur plus haut niveau : tout ennemi de [ROOT.GetNameDef] saignera et périra dans nos profondeurs, tandis que nous tiendrons prudemment nos défenses naturelles !"
ROM_the_queen_of_battle:0 "La reine des batailles"
ROM_the_queen_of_battle_desc:0 "Malgré tous les outils modernes, l’infanterie reste la première ligne partout. Nos braves mèneront le combat avec discipline et fierté."
ROM_modernize_our_artillery:0 "Moderniser notre artillerie"
ROM_modernize_our_artillery_desc:0 "Les grosses pièces de la Grande Guerre sont dépassées selon les standards de Berlin et Londres. Il nous faut moderniser pour rester redoutés."
ROM_mobility_and_armor:0 "Mobilité et blindés"
ROM_mobility_and_armor_desc:0 "La manœuvre chère à Clausewitz mena l’armée prussienne à la victoire. Les blindés et tactiques mises au point à Berlin définiront la guerre interarmes à venir : [ROOT.GetNameDef] doit en être."
ROM_design_a_romanian_tank:0 "Concevoir un char roumain"
ROM_design_a_romanian_tank_desc:0 "Nous ne pouvons plus dépendre d’autrui pour nos plans de bataille. Une armée [ROOT.GetAdjective] prestigieuse a besoin de chars conçus chez nous."
ROM_study_foreign_tanks:0 "Étudier les chars étrangers"
ROM_study_foreign_tanks_desc:0 "Nous manquons de moyens économiques et de personnel pour innover largement en blindés. Inspirons-nous de [FRA.GetNameDef], [GER.GetNameDef] et des [ENG.GetAdjective] pour trouver ce qui convient à [ROM.GetNameDef]."
ROM_self_propelled_guns:0 "Canons automoteurs"
ROM_self_propelled_guns_desc:0 "L’appui-feu fourni par les bombardements automoteurs est très prometteur. Explorons ces armes et leur emploi dans notre armée."

#################
###Objectifs aériens###
#################
ROM_the_romanian_air_force:0 "Forces aériennes roumaines"
ROM_the_romanian_air_force_desc:0 "Les armes du ciel transforment rapidement le champ de bataille, et la tendance se confirmera dans les conflits à venir. Rejoignons l’Occident en embrassant cette nouvelle dimension."
ROM_expand_airbase_facilities:0 "Étendre les installations aériennes"
ROM_expand_airbase_facilities_desc:0 "Nous n’avons pas encore l’infrastructure logistique pour entretenir une grande force aérienne bien équipée. Finançons des aéroports dans les régions stratégiques du pays."
ROM_pilot_academies:0 "Académies de pilotage"
ROM_pilot_academies_desc:0 "Les pilotes doivent maîtriser un ensemble de compétences unique pour agir de façon autonome au combat. Ouvrons des académies pour former une nouvelle génération de personnel aérien courageux, motivé et qualifié."
ROM_home_defence_flying:0 "Défense aérienne du territoire"
ROM_home_defence_flying_desc:0 "La guerre menace la vie et la sécurité de nos proches : protégeons tous les [ROM.GetAdjective] contre le péril des bombardements."
ROM_funding_to_iar:0 "Financer l’IAR"
ROM_funding_to_iar_desc:0 "L’IAR [ROM.GetAdjective] vient d’être fondée avec l’aide de subventions publiques. La crise se calme et le conflit se profile : donnons-lui les moyens d’accroître notre recherche et notre capacité de production."
