r56_ROM_carol_idea:0 "Carol II"
r56_ROM_carol_idea_desc:0 "Le roi Carol II est connu pour ses goûts coûteux et sa propension à satisfaire les caprices encore plus dispendieux de sa maîtresse. Déjà à l’origine de nombreux scandales, il risque de recommencer s’il n’est pas remplacé ou remis dans le droit chemin."
r56_ROM_michael_idea:0 "Michel Ier"
r56_ROM_michael_idea_desc:0 "Depuis l’abdication forcée de Carol II, le rôle de roi de [ROM.GetNonIdeologyName] est relégué au second plan ; le pouvoir effectif est désormais entre les mains du Premier ministre."

