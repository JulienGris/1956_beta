l_french:
 r56_paraguay.1.t:0 "Coup d’État militaire !"
 r56_paraguay.1.d:0 "Après la guerre du Chaco de l’an dernier, que nous avons réussi à remporter, le faible gouvernement d’Eusebio Ayala est néanmoins resté en place. Mais le colonel Rafael Franco a orchestré un coup d’État pour instaurer un régime militaire bien plus fort, avec le soutien de nombreux partis d’opposition."
 r56_paraguay.1.a:0 "Vive le colonel Franco !"
 r56_paraguay.2.a:0 "Nous devons résister ! Formons une coalition avec le PCP et combattons !"
 r56_PAR_franco_coup:0 "Coup d’État militaire imminent"
 r56_PAR_franco_coup_desc:0 "L’armée, mécontente du régime faible de [PAR.getleader], a formé une conspiration pour renverser le gouvernement actuel. Cette conspiration est dirigée par le colonel Franco en exil. Si nous voulons l’empêcher, nous devons agir vite."
 r56_PAR_coup_called_off:0 "Le colonel Franco a été §Yassassiné§!"
 r56_PAR_franco_coup_mission:0 "Le retour du colonel Franco"
 r56_PAR_franco_coup_mission_desc:0 "Nos sources affirment que le retour du colonel Franco marquera le début du coup d’État militaire."
 r56_PAR_military_concessions:0 "Concessions à la faction de Morínigo"
 r56_PAR_marxist_concessions:0 "Concessions au PCP"
 r56_PAR_assassinate_franco:0 "Assassiner le colonel Franco"
 r56_PAR_assassinate_franco_desc:0 "Éliminer Franco est le seul moyen d’empêcher que le coup d’État ne devienne réalité..."

# tt's
 r56_PAR_civil_war_choice_tt:0 "Débloque l’§Yoption§! de résister au coup d’État militaire avec une §Rguerre civile.§!"
 r56_PAR_coup_called_off_tt:0 "Le coup d’État militaire sera §Yempêché§!"

