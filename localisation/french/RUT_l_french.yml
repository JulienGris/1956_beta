 #militaire
 RUT_carpathian_sich:0 "Former la Sich carpatique"
 RUT_carpathian_sich_desc:0 "Il est temps pour nous d’organiser une force de combat nationale. Cet embryon d’armée sera appelé la « sich », comme les volontaires de la République populaire d’Ukraine occidentale."
 RUT_equipment_effort:0 "Améliorer l’équipement d’infanterie"
 RUT_equipment_effort_desc:0 "Un élément vital dans la professionnalisation de la Sich carpatique sera de standardiser l’équipement et l’entraînement de l’infanterie afin d’accroître l’efficacité et la fiabilité de nos soldats."
 RUT_offensive_weapons_focus:0 "Armement offensif de l’infanterie"
 RUT_offensive_weapons_focus_desc:0 "La fin de la Grande Guerre a montré que l’armement automatique est la voie à suivre, et nous devons équiper au moins une partie de nos troupes avec de telles armes."
 RUT_mountain_brigades:0 "Brigades de montagne"
 RUT_mountain_brigades_desc:0 "Nous sommes au pied des Carpates. Ces montagnes sont notre refuge, mais c’est aussi là que nous devons apprendre à combattre."
 RUT_recon_companies:0 "Unités de reconnaissance"
 RUT_recon_companies_desc:0 "Des opérations militaires réussies ne peuvent être menées que si le renseignement est fiable. Les compagnies de reconnaissance sont une composante cruciale de la guerre moderne."
 RUT_engineer_effort:0 "Génie militaire"
 RUT_engineer_effort_desc:0 "Un soldat à découvert est vulnérable. Pour le protéger, il faut des ingénieurs de combat capables de bâtir ses défenses. Une position ennemie retranchée est difficile à prendre ; pour la réduire, il faut souvent des ingénieurs. Conclusion : en toute situation, ne jamais oublier de disposer d’ingénieurs entraînés."
 RUT_support_bonus:0 "Armes de soutien"
 RUT_support_bonus_desc:0 "Pour freiner et contenir l’avancée ennemie, notre infanterie doit disposer d’une puissance de feu suffisante pour ralentir l’ennemi et préparer des contre-attaques. Les armes lourdes comme les mitrailleuses et les mortiers mobiles sont essentielles aussi bien en attaque qu’en défense."
 RUT_motorization_effort:0 "Expériences de motorisation"
 RUT_motorization_effort_desc:0 "La vitesse sera un élément crucial dans la guerre à venir, et nous devons nous assurer de disposer d’un corps motorisé capable de remplir ce rôle."
 RUT_doctrine_effort:0 "Réviser les tactiques"
 RUT_doctrine_effort_desc:0 "La théorie militaire a beaucoup évolué ces dernières années, et nous devons fournir tous les efforts possibles pour rester à la pointe des innovations."
 RUT_conscript_management_focus:0 "Gestion des conscrits"
 RUT_conscript_management_focus_desc:0 "La tâche principale pour établir une armée efficace est de transformer des civils enrôlés en machines de guerre efficaces. Une discipline stricte doit être instaurée, tandis que des idéaux comme le sacrifice et la défense de notre patrie et de notre culture doivent être inculqués à nos soldats."
 RUT_modern_tactics_effort:0 "Tactiques modernes"
 RUT_modern_tactics_effort_desc:0 "Maintenant que nous avons adopté une doctrine militaire, nous devons l’adapter au terrain et demander des rapports précis aux officiers sur le front afin de mieux faire face aux situations changeantes."
 RUT_armor_effort:0 "Conception de chars"
 RUT_armor_effort_desc:0 "Il est temps pour notre corps d’ingénieurs d’étudier la possibilité de créer nos propres chars modernes. Copier les véhicules ennemis est une chose, mais innover est le seul moyen d’obtenir un véritable avantage décisif."
 RUT_mechanization_effort:0 "Mécanisation de l’armée"
 RUT_mechanization_effort_desc:0 "Si nos expériences de motorisation ont été fructueuses, il est clair que les troupes de première ligne doivent bénéficier d’une protection accrue contre le feu ennemi. C’est pourquoi nous devons concevoir une sorte de « camion blindé » qui protégera et soutiendra l’infanterie en première ligne."
 RUT_modern_artillery:0 "Artillerie moderne"
 RUT_modern_artillery_desc:0 "Des obus, encore des obus, toujours plus gros. Des obus pour briser les fortifications ennemies, des obus pour percer les blindés adverses… Notre devise : produire plus d’obus pour gagner la guerre !"
 RUT_anti_tank_defenses:0 "Défenses antichars"
 RUT_anti_tank_defenses_desc:0 "Les véhicules blindés représentent une menace constante pour une infanterie non préparée. Ils doivent donc être contrés par l’arme la plus efficace et rentable disponible : le canon antichar."
 RUT_special_forces:0 "Forces spéciales"
 RUT_special_forces_desc:0 "Parfois, la situation est trop spécifique pour un soldat d’infanterie ordinaire. Dans ces cas-là, il faut faire appel à des hommes spécialement entraînés. Dans les montagnes, sur l’eau ou dans les airs, ces troupes spéciales peuvent accomplir des exploits bien au-delà des capacités d’un soldat régulier."
 RUT_military_modernization:0 "Modernisation militaire"
 RUT_military_modernization_desc:0 "Maintenant que nous avons maîtrisé toutes les techniques de la guerre moderne, nous devons continuer nos efforts. Ce n’est qu’en remettant constamment en question nos pratiques et nos équipements que nous pourrons les améliorer sur le long terme."

 #aviation - naval
 RUT_short_range_fighter_focus:0 "Chasseurs à courte portée"
 RUT_short_range_fighter_focus_desc:0 "Comme notre territoire est réduit, nous n’aurons pas besoin d’aller loin pour défendre nos cieux. Nous pouvons donc nous concentrer sur des chasseurs petits et agiles."
 RUT_long_range_fighter_focus:0 "Chasseurs à longue portée"
 RUT_long_range_fighter_focus_desc:0 "Nous devons anticiper : si nous voulons couvrir toute l’Ukraine, il nous faudra des avions capables de voler plus loin tout en emportant des armes suffisantes pour renverser la balance en notre faveur."
 RUT_low_altitude_flights:0 "Vols à basse altitude"
 RUT_low_altitude_flights_desc:0 "Un avion proche du sol est capable de frapper ses cibles avec plus de précision. En outre, il montrera à nos soldats que le ciel nous appartient et qu’il est là pour les protéger."
 RUT_offensive_bombing_strategy:0 "Stratégie de bombardement offensif"
 RUT_offensive_bombing_strategy_desc:0 "Le point faible de l’ennemi n’est pas son armée, mais les usines qui produisent ses armes. Si nous pouvons les éliminer, ses forces ne pourront plus poursuivre le combat."
 RUT_compromised_approach:0 "Approche mitigée"
 RUT_compromised_approach_desc:0 "Si nous larguons assez de bombes sur les divisions ennemies, nous les réduirons en miettes. Et si nous visons leurs usines, nous détruirons leur capacité à se battre."
 RUT_form_mechanics:0 "Former des mécaniciens"
 RUT_form_mechanics_desc:0 "Au final, quelle différence entre un avion abattu par des tirs ennemis, détruit par un incendie moteur ou cloué au sol par une panne mécanique si nous ne pouvons pas le réparer ? Pour réduire ces risques, la seule solution est d’avoir des mécaniciens spécialisés et bien entraînés qui connaissent leurs avions mieux qu’un chirurgien ne connaît l’anatomie."

 RUT_aviation_effort:0 "Fonder l’école d’aviation"
 RUT_aviation_effort_tt:0 "Pas assez d’emplacements pour une §YBase aérienne§!"
 RUT_aviation_effort_desc:0 "Nulle part les avancées technologiques ne sont aussi rapides que dans la guerre aérienne. L’aviation est un domaine que toute nation moderne doit maîtriser."
 RUT_fighter_focus:0 "Priorité aux chasseurs"
 RUT_fighter_focus_desc:0 "Les combats aériens ne se sont pas arrêtés avec la Grande Guerre. Rester en avance dans le développement des chasseurs nous donnera un avantage à l’avenir."
 RUT_bomber_focus:0 "Priorité aux bombardiers"
 RUT_bomber_focus_desc:0 "Les guerres d’aujourd’hui seront racontées demain par des récits de feu tombant du ciel. Nous ferons en sorte que ce soient nos ennemis qui racontent ces histoires."
 RUT_aviation_effort_2:0 "Étudier les tactiques étrangères"
 RUT_aviation_effort_2_desc:0 "De nouveaux progrès en aviation seront nécessaires pour bien intégrer notre armée de l’air avec les autres branches militaires."
 RUT_CAS_effort:0 "Bombardiers en piqué"
 RUT_CAS_effort_desc:0 "Une armée moderne a besoin de soutien, au sol comme dans les airs."
 RUT_rocket_effort:0 "Moteurs-fusées"
 RUT_rocket_effort_desc:0 "Les moteurs-fusées et à réaction permettent des vitesses inédites, pour les engins habités comme non-habités. Être pionniers dans ces technologies nous donnera l’avantage de la surprise."
 RUT_NAV_effort:0 "Bombardiers navals"
 RUT_NAV_effort_desc:0 "De même que la guerre navale moderne se déroule sous l’eau, une partie se joue aussi dans les airs au-dessus des flots."
 RUT_foreign_port:0 "Construire des navires en territoires occupés"
 RUT_naval_effort_tt:0 "Pas assez d’emplacements pour des §YChantiers navals§!"
 RUT_foreign_port_desc:0 "L’expansion de notre marine doit être une priorité. Affectons toutes les ressources disponibles à de nouveaux chantiers navals et à la recherche sur les bâtiments de surface légers."
 RUT_ukrainian_shipbuilding:0 "Construire des navires en Ukraine"
 RUT_flexible_navy:0 "Marine flexible"
 RUT_flexible_navy_desc:0 "Réinventer la guerre navale en tenant compte des progrès des sous-marins nous permettra de frapper efficacement les convois ennemis."
 RUT_large_navy:0 "Grande marine"
 RUT_large_navy_desc:0 "Adapter nos doctrines navales pour accueillir de grands navires et protéger nos convois commerciaux nous en apprendra beaucoup sur les bâtiments dont nous avons besoin."
 RUT_submarine_effort:0 "Guerre sous-marine"
 RUT_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus marquant depuis l’invention des torpilleurs. Nous devons nous protéger des sous-marins et les utiliser contre la flotte ennemie."
 RUT_cruiser_effort:0 "Concevoir des croiseurs"
 RUT_cruiser_effort_desc:0 "Avant de nous lancer dans la recherche avancée sur les cuirassés, il faut remplacer nos croiseurs vieillissants."
 RUT_destroyer_effort:0 "Concevoir des destroyers"
 RUT_destroyer_effort_desc:0 "En étudiant les sous-marins et leur emploi stratégique, nous avons aussi appris à contrer leurs méthodes. Les destroyers seront essentiels pour cela."
 RUT_capital_ships_effort:0 "Intérêt pour les navires capitaux"
 RUT_capital_ships_effort_desc:0 "La nation qui possède le plus de cuirassés dominera les océans. Les cuirassés et les porte-avions représentent l’ancien et le nouveau de la suprématie navale."

 #industrie
 RUT_food_processing_plant:0 "Usine de transformation alimentaire"
 RUT_food_processing_plant_desc:0 "Puisque l’agriculture est actuellement le socle de notre économie, la meilleure manière d’amorcer l’industrialisation est de veiller à ce que les produits de nos terres puissent être stockés et vendus sur les marchés locaux et étrangers."
 RUT_construction_focus:0 "Technologies de construction"
 RUT_construction_focus_desc:0 "Rome n’a peut-être pas été bâtie en un jour, mais nous devons utiliser les technologies modernes pour nous en rapprocher autant que possible. Espérons que les programmes architecturaux tchécoslovaques de ces dernières années puissent servir de modèle d’architecture civile."
 RUT_extraction_focus:0 "Petite production minière"
 RUT_extraction_focus_desc:0 "Notre sous-sol n’est peut-être pas extrêmement riche, mais nous devons exploiter chaque ressource disponible pour ne pas dépendre des industries étrangères."
 RUT_industrial_technology:0 "Innovations manufacturières"
 RUT_industrial_technology_desc:0 "Le chemin d’une société agricole vers une société industrialisée est difficile, mais il est certain qu’un des fondements de cette transition est la fabrication de machines toujours plus efficaces."
 RUT_transcarpathian_infrastructure:0 "Infrastructures locales"
 RUT_transcarpathian_infrastructure_desc:0 "À travers montagnes, collines, forêts et rivières, il faut mobiliser tous les moyens. Pour qu’un train passe sans encombre, pour qu’un messager apporte l’alarme à temps. Certains jugeront ce projet insensé ; nos infrastructures, elles, doivent fleurir."
 RUT_build_industrial_area:0 "Construire un district industriel à Oujhorod"
 RUT_regional_industrialization:0 "Industrialisation régionale"
 RUT_regional_industrialization_desc:0 "Oujhorod est certainement notre ville la plus industrialisée, et nous devons en faire un centre industriel régional."
 RUT_small_arms_manufacturing:0 "Fabrication d’armes légères"
 RUT_small_arms_manufacturing_desc:0 "Si nous aspirons à un destin pacifique, les armes semblent néanmoins indispensables à notre époque. Nous devons donc organiser de petits ateliers prêts à produire des armes à feu et des munitions pour défendre la liberté de notre petit pays."
 RUT_military_production:0 "Production militaire"
 RUT_military_production_desc:0 "Pour faire face aux dangers de la guerre, les fusils ne suffisent pas : nous devons envisager des plans plus ambitieux afin d’équiper nos forces."
 RUT_research_grants:0 "Bourses de recherche"
 RUT_research_grants_desc:0 "Nous devons peut-être nous appuyer sur peu de spécialistes, mais au moins pouvons-nous les financer suffisamment pour concevoir un armement moderne pour nos soldats."

 #Politique
 RUT_a_free_rusyn_state:0 "Un État ruthène libre"
 RUT_a_free_rusyn_state_desc:0 "Certains nous ont appelés Tchécoslovaques, d’autres Ukrainiens. S’il est vrai que nous sommes frères des Ukrainiens, nous ne sommes pas tout à fait comme eux. Nous sommes des Ruthènes, les derniers des Rutheniens. Les derniers à tenir, libres — pour l’instant."
 RUT_claim_no_territories:0 "Ne revendiquer aucun territoire étranger"
 RUT_claim_no_territories_desc:0 "Nous sommes un petit pays d’une région reculée, entouré d’armées qui pourraient nous écraser en quelques jours. Revendiquer un quelconque territoire étranger serait une folie. Nous sommes des Ruthènes des Carpates et nous voulons vivre libres en Carpato-Ukraine."
 RUT_unification_with_russian_federation:0 "Unification avec la Fédération de Russie"
 RUT_unification_with_russian_federation_desc:0 "Vu la situation politique actuelle, l’indépendance ne paraît pas viable. Maintenant que des institutions démocratiques ont été établies en Russie, il pourrait être judicieux de chercher la sécurité à l’intérieur de la Fédération de Russie comme région autonome."
 RUT_return_under_czech_protection:0 "Retour sous protection tchèque"
 RUT_return_under_czech_protection_desc:0 "Une partie de notre population est nostalgique du régime tchécoslovaque. Même si certains droits promis en 1919 ont été longtemps refusés, la stabilité des institutions a permis à notre peuple de vivre dans le calme et la sécurité. Néanmoins, même les partisans d’une telle réunification exigent que la région envisagée dispose d’une autonomie avec des lois et des institutions spécifiques."
 RUT_defensive_preparation:0 "Préparation défensive"
 RUT_defensive_preparation_desc:0 "Nous n’avons peut-être pas les mêmes ressources que nos voisins, mais nous pouvons y remédier par une chose simple : la planification. En préparant à l’avance une stratégie et des fortifications défensives, nous augmenterons grandement nos chances de survie."
 RUT_ukraine_has_not_yet_perished:0 "\"L’Ukraine n’a pas encore péri\""
 RUT_ukraine_has_not_yet_perished_desc:0 "Cette devise populaire du nationalisme doit servir à la fois d’avertissement contre la possibilité de la destruction de notre État et de flambeau d’espoir en ces temps sombres, pour signifier que nous sommes toujours vivants, fiers et libres."
 RUT_agrarian_reforms:0 "Réformes agraires"
 RUT_agrarian_reforms_desc:0 "La terre est la pomme de discorde de l’Europe de l’Est. Tandis que certains pays tenteront d’en arracher à d’autres, en interne, les mouvements paysans contre les grands propriétaires ou le manque de représentation du secteur agricole dans les institutions plaident pour des réformes foncières et une modernisation agricole."
 RUT_submit_to_hungary:0 "Se soumettre à la Hongrie"
 RUT_submit_to_hungary_desc:0 "Avec l’effondrement de la Tchécoslovaquie, nous devons chercher un nouveau protecteur si nous voulons survivre. Des contacts au sein du gouvernement de Budapest, via les membres de notre minorité hongroise, nous ont indiqué qu’ils étaient prêts à intégrer notre territoire comme région autonome. Les politiciens favorables à ce projet d’unification (les « Magyarones ») occuperont des postes clés."
 RUT_hungarian_officers:0 "Officiers hongrois"
 RUT_hungarian_officers_desc:0 "Maintenant que nous sommes une partie autonome de la Hongrie, nos fils serviront dans des unités hongroises spécifiques, ukrainophones. Ces recrues doivent toutefois être formées et équipées selon les standards hongrois. C’est pourquoi nous avons demandé au gouvernement de Budapest de nous envoyer une équipe dédiée d’officiers de préférence bilingues."
 RUT_economic_ties:0 "Liens économiques"
 RUT_economic_ties_desc:0 "Nous faisions auparavant partie de la Tchécoslovaquie, avec une importante minorité hongroise. Maintenant que nous sommes intégrés à la structure hongroise, cette minorité peut développer pleinement ses liens avec le reste du pays."
 RUT_technology_sharing_hungary:0 "Scientifiques hongrois"
 RUT_technology_sharing_hungary_desc:0 "Ne nous voilons pas la face : comparée à d’autres régions plus industrialisées, la Carpathie est une région relativement reculée et arriérée. Par conséquent, si nous voulons maintenir la formation de nos conscrits et de notre industrie naissante au niveau des standards étrangers, nous aurons besoin de l’aide de spécialistes techniques hongrois."
 RUT_economic_developments:0 "Développements économiques"
 RUT_economic_developments_desc:0 "Les Tchèques nous ont peut-être considérés comme arriérés, mais c’est parce que notre véritable potentiel n’était pas encore révélé. Par un soutien attentif aux industries naissantes, nous pouvons améliorer la production nette de notre économie."
 RUT_claim_new_farmlands:0 "Réclamer de nouvelles terres agricoles"
 RUT_claim_new_farmlands_desc:0 "La Ruthénie est loin d’être densément peuplée. Il existe donc de nombreuses terres inexploitées qui pourraient être mises en valeur pour l’industrie si les investissements nécessaires sont consentis."
 RUT_anti_air_defenses:0 "Défenses antiaériennes"
 RUT_anti_air_defenses_desc:0 "La menace d’une attaque venue du ciel est réelle et ne peut être ignorée. Des mesures préventives doivent donc être établies pour renforcer certaines installations : creusement d’abris antiaériens, création d’un réseau d’observateurs entraînés, et enfin mise en place d’un groupe territorial antiaérien pour servir des pièces capables d’abattre tout bombardier ennemi."
 RUT_mountain_fortress:0 "Forteresse de montagne"
 RUT_mountain_fortress_desc:0 "Notre population étant bien plus réduite que celle de nos voisins, nous devons faire en sorte que chacun de nos soldats vaille littéralement cent des leurs. Des bunkers seront donc construits en terrain montagneux afin d’offrir la meilleure défense possible et de nous permettre de tenir assez longtemps pour que d’éventuels alliés interviennent."
 RUT_coup_against_voloshyn:0 "Coup d’État contre Voloshyn"
 RUT_coup_against_voloshyn_desc:0 "Une rumeur circule dans nos rangs : Voloshyn est faible, Voloshyn nous condamnera. Nous devons réagir avant qu’il ne soit trop tard ! Ces officiers sont prêts à mettre en péril la stabilité des institutions nouvellement établies pour prendre le contrôle du pays et sauver son autonomie."
 RUT_contact_galician_ukrainians:0 "Contacter les Ukrainiens de Galicie"
 RUT_contact_galician_ukrainians_desc:0 "Si les terres autour de Lviv sont passées sous contrôle polonais en 1919, leurs habitants avaient établi la République populaire d’Ukraine occidentale au début de la guerre civile russe. Même s’ils ont bénéficié d’une certaine autonomie au sein de la Pologne, beaucoup souhaitent encore former une nouvelle république ukrainienne. Des contacts informels ont déjà établi que si nous entrons à Lviv, nous obtiendrons le soutien de la population ukrainienne locale."
 RUT_unification_with_ukraine:0 "Unification avec l’Ukraine"
 RUT_unification_with_ukraine_desc:0 "Certains préfèrent mettre en avant les particularismes ruthènes, mais on ne peut nier que nous sommes un sous-groupe des Ukrainiens. Maintenant que l’Ukraine est libre et stable, unissons-nous et bâtissons un avenir commun."
 RUT_unification_with_ukraine2:0 "Unification avec l’Ukraine"
 RUT_unification_with_ukraine2_desc:0 "Certains préfèrent mettre en avant les particularismes ruthènes, mais on ne peut nier que nous sommes un sous-groupe des Ukrainiens. Maintenant que l’Ukraine est libre et stable, unissons-nous et bâtissons un avenir commun."
 RUT_west_ukrainian_veterans:0 "Anciens combattants d’Ukraine occidentale"
 RUT_west_ukrainian_veterans_desc:0 "Maintenant que nous contrôlons la capitale de la Galicie, nous devons rassembler les nationalistes de la région pour organiser de nouvelles unités en tant que nouvelle république d’Ukraine occidentale. Nous devrions aussi contacter certains de ses anciens commandants : quelques-uns pourraient accepter de diriger ces troupes fraîchement levées et de combattre pour notre cause commune."
 RUT_claim_ukraine:0 "Revendiquer l’Ukraine"
 RUT_claim_ukraine_desc:0 "Notre volonté de libérer tous les Ukrainiens a logiquement conduit à négliger les spécificités ruthènes de la Carpato-Ukraine ; si nous voulons revendiquer l’Ukraine entière, nous devons bâtir un discours national expliquant que la Carpato-Ukraine n’était qu’un État résiduel, tandis que l’Ukraine était sous le joug d’occupants étrangers."
 RUT_industry_in_kiev:0 "Industries à Kiev"
 RUT_industry_in_kiev_desc:0 "À présent que Kiev est sous notre contrôle, nous pouvons utiliser les infrastructures de la ville et même accroître sa productivité avec l’appui des nationalistes ukrainiens inaptes au service au front."
 RUT_railways_around_kiev:0 "Infrastructures autour de Kiev"
 RUT_railways_around_kiev_desc:0 "Pour sécuriser la ville la plus importante d’Ukraine, ses infrastructures de communication doivent être rénovées."
 RUT_industry_in_odessa:0 "Industries à Odessa"
 RUT_industry_in_odessa_desc:0 "Odessa est probablement le port ukrainien le plus important, et maintenant qu’il est sous notre contrôle, nous devons tout faire pour relancer — et même accroître — l’activité le plus vite possible."
 RUT_a_train_to_odessa:0 "Un train pour Odessa"
 RUT_a_train_to_odessa_desc:0 "Pour établir une liaison sécurisée avec notre port d’Odessa, nous devons remettre à niveau le réseau de communication entre la Galicie et la mer Noire."
 RUT_donbas_heavy_industries:0 "Industries lourdes du Donbass"
 RUT_donbas_heavy_industries_desc:0 "Les mines de charbon du Donbass offrent une opportunité précieuse de produire d’énormes quantités d’acier, nous permettant d’augmenter considérablement notre production militaire."
 RUT_a_train_to_the_donbass:0 "Un train vers l’Est"
 RUT_a_train_to_the_donbass_desc:0 "Afin d’assurer un approvisionnement sûr en charbon et en acier depuis la région industrielle du Donbass vers nos usines, nous devons sécuriser une voie ferrée vers l’est."
 RUT_industry_in_lviv:0 "Industries à Lviv"
 RUT_industry_in_lviv_desc:0 "Avec le soutien des Ukrainiens ruthènes, nous pourrons accroître notre productivité et mobiliser davantage de ressources pour l’effort de guerre."
 RUT_khust_lviv_railways:0 "Lignes Khust–Lviv"
 RUT_khust_lviv_railways_desc:0 "Pour sécuriser nos territoires libérés, nous devons établir une voie ferrée sûre à travers les montagnes entre la Carpathie et la Galicie."
 RUT_oun_moderates:0 "S’allier aux modérés de l’OUN"
 RUT_oun_moderates_desc:0 "Le soutien de l’Organisation des nationalistes ukrainiens est indispensable pour atteindre notre objectif. En nous rangeant du côté de l’OUN-M, nous favoriserons des forces plus ouvertes à une forme modérée de pouvoir sur une Ukraine indépendante."
 RUT_oun_radicals:0 "S’allier aux radicaux de l’OUN"
 RUT_oun_radicals_desc:0 "Le soutien de l’Organisation des nationalistes ukrainiens est indispensable pour atteindre notre objectif. En nous rangeant du côté de l’OUN-B, nous nous assurerons l’appui des nationalistes les plus fanatiques. Ils se battront jusqu’au dernier homme pour la liberté ukrainienne, mais chercheront peut-être aussi à prendre un contrôle absolu des institutions."
 RUT_ussr_war_goal:0 "Défier le tyran rouge"
 RUT_ussr_war_goal_desc:0 "La Russie a considéré pendant des siècles que l’Ukraine faisait partie de son territoire. L’Union soviétique défend la même idée et nous méprise, au point d’avoir été prête à tuer des millions de nos frères lors de la grande famine que nous appelons « Holodomor »."
 RUT_our_patriotic_war:0 "Notre guerre patriotique"
 RUT_our_patriotic_war_desc:0 "Les Allemands ont envahi et dévasté l’Europe de l’Est et menacent gravement notre existence même. Si nous voulons un jour vivre en paix, nous devons détruire une fois pour toutes la menace fasciste."
 RUT_one_ukraine:0 "Une seule Ukraine"
 RUT_one_ukraine_desc:0 "Après des efforts presque inhumains, nous touchons enfin à la victoire. Le rêve chimérique d’une génération — voir naître une Ukraine unifiée — devient réalité. Un nouvel État libre s’élèvera et remplacera la tyrannie de l’oppression étrangère."
 RUT_force_russia_abandon_claims:0 "Forcer la Russie à renoncer à ses revendications"
 RUT_force_russia_abandon_claims_desc:0 "Afin que le sacrifice de notre peuple n’ait pas été vain, nous devons graver dans un traité que l’État russe ne pourra plus jamais revendiquer de territoires ukrainiens."
 RUT_move_to_kiev:0 "Transférer la capitale à Kyiv"
 RUT_move_to_kiev_desc:0 "Maintenant que l’Ukraine est définitivement unie, l’acte officiel nécessaire sera de déplacer l’administration depuis la lointaine Ruthénie carpatique vers le centre historique du pays : Kyiv."
 RUT_reinforce_military_government:0 "Renforcer le gouvernement militaire"
 RUT_reinforce_military_government_desc:0 "Le processus décisionnel de l’armée ne doit en aucun cas être ralenti par les lourdeurs de la politique civile alors que la libération nationale finale est à portée de main."
 RUT_restore_civilian_government:0 "Rétablir un gouvernement civil"
 RUT_restore_civilian_government_desc:0 "Maintenant que les objectifs essentiels ont été atteints, nous devons rétablir un organe démocratique pour garantir que les institutions ne seront pas abusées à la fin de la guerre."
 RUT_ukraine_has_not_yet_perished2:0 "\"L’Ukraine n’a pas encore péri\""
 RUT_ukraine_has_not_yet_perished2_desc:0 "Cette devise populaire du nationalisme doit servir à la fois d’avertissement contre la possibilité de la destruction de notre État et de flambeau d’espoir en ces temps sombres, pour signifier que nous sommes toujours vivants, fiers et libres."

 RUT_approach_poland:0 "Se rapprocher de la Pologne"
 RUT_approach_poland_desc:0 "Nous avons des liens étroits avec la minorité ukrainienne du sud de la Pologne et devons exploiter tous nos atouts pour convaincre le gouvernement polonais qu’il est dans son intérêt de s’allier avec nous."
 RUT_approach_romania:0 "Se rapprocher de la Roumanie"
 RUT_approach_romania_desc:0 "Nous n’avons d’autre choix que de trouver des alliés dans un monde de plus en plus fou. La Roumanie est frontalière, a un accès à la mer et bénéficie du soutien de la Pologne et du Pacte balkanique ; ce devrait être un partenaire précieux."
 RUT_join_intermarium:0 "Rejoindre l’Intermarium"
 RUT_join_intermarium_desc:0 "Pour trouver la sécurité dans un monde de plus en plus dangereux, nous devons regarder vers le nord et chercher la protection en devenant membre de l’« Intermarium » polonais."
 RUT_join_cordon_sanitaire:0 "Rejoindre le cordon sanitaire"
 RUT_join_cordon_sanitaire_desc:0 "Pour trouver la sécurité dans un monde de plus en plus dangereux, nous devons chercher de l’aide de l’autre côté des montagnes et entrer dans l’alliance roumaine."
 RUT_join_little_entente:0 "Rejoindre la Petite Entente"
 RUT_join_little_entente_desc:0 "Avec la promesse de la France d’aider la Tchécoslovaquie, renouer les anciens liens serait une bonne manière de les soutenir contre l’agression étrangère."

 RUT_communist_influence:0 "Influence communiste"
 RUT_communist_influence_desc:0 "Tout a commencé par des tracts distribués dans les rues. Puis sont venus les orateurs de trottoir et les affiches appelant à l’émancipation du prolétariat contre les capitalistes corrompus. La diffusion des idées communistes se ressent dans tous les aspects de la société et apportera des changements colossaux."
 RUT_request_to_join_big_brother:0 "Rejoindre le grand frère soviétique"
 RUT_request_to_join_big_brother_desc:0 "Nous devons rejoindre la RSS d’Ukraine, partie de la glorieuse Union des républiques socialistes soviétiques. Un avenir radieux n’est possible que sous la sage direction du président du Présidium du Soviet suprême de l’Union des républiques socialistes soviétiques."
 RUT_purge_the_army:0 "Purger l’armée"
 RUT_purge_the_army_desc:0 "L’armée a traditionnellement attiré des officiers bourgeois et carriéristes, réactionnaires. Ils constituent désormais un obstacle potentiel, susceptibles de menacer la glorieuse révolution prolétarienne. Il faut donc s’en occuper avant qu’ils ne causent des problèmes."
 RUT_new_army:0 "Une nouvelle armée"
 RUT_new_army_desc:0 "Avec notre armée réorganisée, nous disposons enfin d’une force idéologiquement cohérente pour protéger le prolétariat des ploutocrates fascistes."
 RUT_request_to_join_ukrainian_brother:0 "Demander à rejoindre la RSS d’Ukraine"
 RUT_request_to_join_ukrainian_brother_desc:0 "La ligne politique officielle du parti communiste de Ruthénie transcarpatique est qu’il n’existe pas de Ruthènes. Nous sommes tous des Ukrainiens et devons logiquement rejoindre la République socialiste soviétique d’Ukraine."
 RUT_economic_reorganization:0 "Réorganisation économique"
 RUT_economic_reorganization_desc:0 "Nous devons entamer la réorganisation économique qui libérera l’artisan du capitaliste tyrannique et le paysan des propriétaires cruels et exploiteurs. La collectivisation ne sera pas arrêtée par les ennemis de la révolution !"
 RUT_central_planning:0 "Planification centrale"
 RUT_central_planning_desc:0 "Grâce à notre emprise ferme sur l’économie, nous pouvons lancer la tâche cyclopéenne d’industrialiser le pays en réallouant les ressources vers les industries lourdes pour assurer la réussite des premiers « plans quinquennaux ». Travailleurs ruthènes, en avant !"
 RUT_technology_sharing_communism:0 "Découvertes socialistes partagées"
 RUT_technology_sharing_communism_desc:0 "La réussite de la révolution mondiale exige que les scientifiques travailleurs s’unissent sous la bannière du progrès de l’humanité."
 RUT_technology_sharing_oun:0 "Associations scientifiques ukrainiennes"
 RUT_technology_sharing_oun_desc:0 "Pour coordonner les efforts des multiples ateliers qui expérimentent divers prototypes, nous devons organiser leur coopération dans un cadre plus large, permettant aux esprits les plus brillants du pays de partager plus efficacement leurs idées pour le bien commun de tous les Ukrainiens."
 RUT_technology_sharing_no_claims:0 "Partage technologique"
 RUT_technology_sharing_no_claims_desc:0 "Pour ne pas être distancés dans un monde en mutation rapide, nous devons renforcer la coopération avec nos alliés et garantir l’accès à leurs documents techniques précieux."

 RUT_carpathian_sich_tooltip:0 "Créer 2 petites divisions d’infanterie"

