#### MISSIONS ####
FRA_the_popular_front:0 "Le Front populaire"
FRA_the_popular_front_desc:0 "Une coalition fragile de mouvements de gauche, incluant la Section française de l’Internationale communiste, la Section française de l’Internationale ouvrière (SFIO) et le Parti radical-socialiste républicain progressiste, visant à mettre en œuvre des réformes sociales. Toutefois, les luttes internes entravent cette « alliance de circonstance »."

#### TOOLTIPS ####
FRA_has_no_deflation_tt:0 "Ne possède pas l’esprit national §YDéflation§!"

#### SECTION INDUSTRIELLE ####
french_focus:0 "Arbre de priorités [ROOT.getAdjective]"

FRA_tools_modernisation:0 "Modernisation des outils"
FRA_tools_modernisation_desc:0 "Le parc industriel [FRA.GetAdjective] est vétuste et vieillissant. Nous devons moderniser nos outils en acquérant des machines récentes et performantes."
FRA_monetary_tripartite_agreement:0 "Accord monétaire tripartite de [getYear]"
FRA_monetary_tripartite_agreement_desc:0 "Alors que d’autres pays ont laissé leur monnaie se dévaluer à la suite de la Grande Dépression, nous avons fermement refusé. Notre économie en pâtit. Pour affronter les tempêtes à venir, nous ne devons pas écarter une dévaluation. Cela nous permettrait de retrouver un avantage commercial et d’attirer davantage d’investissements étrangers."
FRA_overseas_factories:0 "Usines d’outre-mer"
FRA_overseas_factories_desc:0 "L’Algérie française étant considérée comme partie intégrante de [FRA.GetNameDef], nous devons renforcer la production et les infrastructures de ce département d’outre-mer."
FRA_cnrs:0 "Centre national de la recherche scientifique"
FRA_cnrs_desc:0 "Pour coordonner les activités de nos laboratoires actuels, nous devons regrouper ces organismes dans un centre national afin de renforcer notre capacité de recherche."
FRA_buy_heavy_water:0 "Acheter de l’eau lourde"
FRA_buy_heavy_water_desc:0 "L’Europe est instable et les premiers tests en science nucléaire sont prometteurs. Nous devrions racheter discrètement tout le stock d’eau lourde de [NOR.GetNameDef] pour assurer notre avance dans ce domaine."
FRA_research_grants:0 "Bourses de recherche"
FRA_research_grants_desc:0 "Afin de galvaniser la production scientifique nationale, nous pourrions accorder plus de financements à nos meilleures équipes. Les avancées technologiques nous donneront l’avantage là où nous en avons le plus besoin."
FRA_sncf:0 "Société nationale des chemins de fer français"
FRA_sncf_desc:0 "La nationalisation des principales compagnies ferroviaires de [FRA.GetNameDef] garantira notre contrôle des moyens de transport sur tout le territoire. La nouvelle SNCF développera les infrastructures actuelles."
FRA_sncf_tooltip:0 "Ajoute l’§Yinfrastructure§! maximale en §YÎle-de-France§!, §YPas-de-Calais§!, §YChampagne§! et §YAlsace§!"

#### PRIORITÉS COLONIALES ####
FRA_colonial_investments_desc:0 "L’Europe traverse une période dangereuse. Nous devons améliorer nos territoires du sud et nos colonies pour soutenir en continu la métropole."
FRA_colonial_investments_tooltip:0 "Toutes les colonies [FRA.getAdjective] hors d’Europe obtiennent :"
FRA_continue_mandat:0 "Poursuivre le mandat au Moyen-Orient"
FRA_continue_mandat_desc:0 "Nous ne pouvons pas appliquer intégralement les accords Viénot pour le moment, le monde devenant chaque jour plus menaçant. Nous pourrions cependant faire quelques concessions afin d’encourager Syriens et Libanais à nous soutenir."
FRA_develop_morocco:0 "Développer le Maroc"
FRA_develop_morocco_desc:0 "Notre protectorat du Maroc a besoin de fonds supplémentaires pour accroître la production locale et développer une économie efficace."
FRA_develop_tunisia:0 "Développer la Tunisie"
FRA_develop_tunisia_desc:0 "Le protectorat tunisien possède un grand potentiel industriel ; nous devons développer ses infrastructures."
FRA_develop_algeria:0 "Développer l’Algérie"
FRA_develop_algeria_desc:0 "Nous devons concentrer nos efforts industriels à Alger. Si les tensions s’intensifient en Europe, nous disposerons toujours d’une capacité industrielle hors de portée des bombardiers ennemis."
FRA_develop_indochine:0 "Développer l’Indochine"
FRA_develop_indochine_desc:0 "Si nous voulons utiliser notre colonie d’Indochine comme base dans le Pacifique, nous devons développer les infrastructures nécessaires au déploiement de nos troupes et renforcer nos ports."
FRA_technology_sharing:0 "Partage technologique"
FRA_technology_sharing_desc:0 "Pour rester dans la course technologique, une bonne solution serait de partager nos recherches avec nos colonies et nos alliés."
FRA_technology_sharing_tooltip:0 "Toutes les colonies [FRA.GetAdjective] bénéficient d’un bonus de §G5 %§! au partage technologique issu de la §YRecherche [FRA.GetAdjective]§!."
FRA_sahara_oil:0 "Pétrole du Sahara"
FRA_sahara_oil_desc:0 "Le pétrole est la seule ressource manquante à [FRA.GetNameDef]. Nous pourrions prospecter dans le désert du Sahara afin d’y trouver de l’or noir. Par ailleurs, notre production reste minime, il nous faut donc développer la technologie des carburants synthétiques comme [GER.GetNameDef]."
FRA_tungsten_mines:0 "Mines de tungstène"
FRA_tungsten_mines_desc:0 "Pour alimenter notre machine de guerre, nous avons besoin de plus de tungstène. Les mines indochinoises pourraient subvenir à nos besoins si nous les développons."
FRA_vienot_agreement:0 "Accords Viénot"
FRA_vienot_agreement_desc:0 "Le mandat [FRA.GetAdjective] sur la Syrie et le Liban ne pouvait durer éternellement, mais le Sénat a longtemps refusé de leur accorder l’indépendance. Avec la montée du nationalisme au Moyen-Orient, nos relations deviennent plus difficiles. Nous devrions les libérer et construire un partenariat plus efficace."
FRA_rewrite_protectorate_treaties:0 "Renégocier les traités de protectorat"
FRA_rewrite_protectorate_treaties_desc:0 "Les traités imposés par la France au Maroc et à la Tunisie étaient déséquilibrés, injustes et contraires à l’esprit républicain. Il est temps de mettre fin à cette vieille ère impérialiste."
FRA_rewrite_protectorate_treaties_tooltip:0 "§YMaroc§! et §YTunisie§! deviennent des §YÉtats associés§!. Ils peuvent désormais prendre des priorités politiques sans conditions et rester verrouillés à une diplomatie pro-[FRA.GetAdjective]."
FRA_autonomy_indochina:0 "Autonomie pour l’Indochine"
FRA_autonomy_indochina_desc:0 "Les pays d’Indochine sont la perle de l’empire colonial [FRA.GetAdjective], mais rien n’a été fait politiquement depuis la colonisation. Nous devons remédier à cette situation."
FRA_autonomy_indochina_tooltip:0 "§YVietnam§!, §YCambodge§! et §YLaos§! deviennent des §YÉtats associés§!. Ils peuvent désormais prendre des priorités politiques sans conditions et rester verrouillés à une diplomatie pro-[FRA.GetAdjective]."
FRA_self_government_for_the_colonies:0 "Autonomie des colonies"
FRA_self_government_for_the_colonies_desc:0 "Nous devrions accorder plus d’autonomie aux provinces d’outre-mer qui ne sont pas étroitement liées à [FRA.GetNameDef]. Un gouvernement local gère plus efficacement une administration éloignée."
FRA_consolidate_african_federations:0 "Consolider les fédérations africaines"
FRA_consolidate_african_federations_desc:0 "L’Afrique est vaste et ethniquement divisée, et nos colonies ne sont pas prêtes pour une gouvernance complète. Nous devrions bâtir de nouveaux États sur la base de fédérations coloniales."
FRA_gueye_lamine_law:0 "Loi Lamine Guèye"
FRA_gueye_lamine_law_desc:0 "Chaque individu de l’empire [FRA.GetAdjective] doit être égal en droits, [FRA.GetNameDef] en étant le garant, même si les colons ne l’acceptent pas."
FRA_create_french_union:0 "Créer l’Union française"
FRA_create_french_union_desc:0 "Avec toutes ces réformes, l’ancien empire colonial [FRA.GetAdjective] n’est plus d’actualité. Un nouveau système doit unir [FRA.GetNameDef] et chaque citoyen de cet ensemble."
FRA_overseas_departements:0 "Départements d’outre-mer"
FRA_overseas_departements_desc:0 "Nous devrions améliorer l’administration des territoires d’outre-mer, même si cela demande beaucoup de ressources pour consolider l’appareil d’État."


#### PRIORITÉ AU RÉARMEMENT ####

FRA_rearmament:0 "Réarmement"
FRA_rearmament_desc:0 "Un [GER.GetNameDef] renaissant s’affermit de jour en jour. Mieux vaut tard que jamais, nous devons réarmer notre pays."
FRA_military_complex_nationalisation:0 "Nationalisation du complexe militaire"
FRA_military_complex_nationalisation_desc:0 "Nos installations et notre capacité de production restent limitées. Nous pouvons imposer la nationalisation de certains fabricants cruciaux pour atteindre une réelle efficacité."
FRA_defense_national_funds:0 "Fonds nationaux de défense"
FRA_defense_national_funds_desc:0 "Nous ne pouvons pas financer un programme de réarmement massif avec notre budget actuel. Pour atteindre nos objectifs, nous devons augmenter les crédits alloués et contracter des emprunts afin de financer certains projets."
FRA_defense_national_funds_tooltip:0 "§YLe soutien industriel§! §Rcessera en temps de guerre§!."
FRA_war_material_licence:0 "Licence de production de matériel de guerre"
FRA_war_material_licence_desc:0 "Pour stimuler le développement des industries militaires et sécuriser l’approvisionnement en équipements d’infanterie, nous pouvons accorder des licences de production."
FRA_aircraft_manufacturer_nationalisation:0 "Nationalisation des constructeurs aéronautiques"
FRA_aircraft_manufacturer_nationalisation_desc:0 "Alors que les négociations pour acheter des avions [USA.GetAdjective] stagnent, nous devrions nationaliser nos constructeurs afin de pallier les faiblesses de la productivité [FRA.GetAdjective] dans ce secteur."
FRA_partial_mobilization:0 "Mobilisation partielle"
FRA_partial_mobilization_desc:0 "Les [GER.GetAdjective]s se montrent agressifs et le monde est instable. La guerre approche ; nous devons déclarer la mobilisation partielle de l’économie [FRA.GetAdjective]."
FRA_commit_automobile_manufacturer:0 "Mobiliser les constructeurs automobiles"
FRA_commit_automobile_manufacturer_desc:0 "Les constructeurs automobiles produisent les principaux moteurs militaires puissants pour nos chars et véhicules motorisés. L’État doit coopérer avec ces industriels afin de satisfaire les besoins de notre armée."
FRA_wartime_organisation_act:0 "Loi d’organisation en temps de guerre"
FRA_wartime_organisation_act_desc:0 "Avant que la guerre n’éclate, nous devons définir l’organisation de la nation en temps de conflit."
FRA_war_effort_law:0 "Loi de l’effort de guerre"
FRA_war_effort_law_desc:0 "Pour contribuer à l’effort de guerre, chaque [FRA.GetAdjective] doit payer des impôts supplémentaires et souscrire à des bons du Trésor."

#### PRIORITÉ POLITIQUE ####

FRA_legislative_election:0 "Élections législatives"
FRA_legislative_election_desc:0 "L’heure approche pour les élections législatives [FRA.GetAdjective] qui désigneront la 16e législature de la Troisième République. Le climat social est tendu, et le peuple [FRA.GetAdjective] espère que ce scrutin apportera des changements."
FRA_matignon_agreements_amendement:0 "Amendement aux accords de Matignon"
FRA_matignon_agreements_amendement_desc:0 "Dans ce contexte économique difficile, les accords de Matignon sont suicidaires. Pour redresser l’économie, nous devons réduire partiellement certains acquis, comme la semaine de 40 heures."
FRA_claim_the_andorran_throne:0 "Revendiquer le trône [ADR.GetAdjective]"
FRA_claim_the_andorran_throne_desc:0 "À notre frontière se trouve la petite nation [ADR.GetNameDef]. Avec notre unité avec l’Espagne, il est naturel que nous cherchions aussi à nous unir à eux."

#### PRIORITÉ DÉMOCRATIQUE ####

FRA_social_reforms:0 "Accords de Matignon"
FRA_social_reforms_desc:0 "Les accords de Matignon sont un succès partiel, mais ils peuvent être remis en cause à tout moment dans le contexte actuel. Nous devons aller plus loin dans les réformes sociales et consolider nos acquis."
FRA_support_blum:0 "Soutenir Blum"
FRA_support_blum_desc:0 "Les réformes de Blum ne sont pas aussi efficaces que l’espéraient les [FRA.GetAdjective], mais elles vont dans la bonne direction. Nous devrions lui donner davantage de pouvoir pour transformer la société."
FRA_intervention:0 "Intervention [FRA.GetAdjective]"
FRA_intervention_desc:0 "Les démocraties du monde ont besoin de notre aide. Nous ne pouvons laisser un nouveau régime fasciste ou communiste s’imposer. Quiconque est prêt à se battre pour la cause doit pouvoir le faire."
FRA_intervention_tooltip:0 "§R[ENG.GetNameDefCap] pourrait refuser une alliance.\n§!"
FRA_support_daladier:0 "Soutenir Daladier"
FRA_support_daladier_desc:0 "Blum a montré qu’il ne pouvait diriger un pays en temps de crise. Il doit démissionner et céder sa place à Édouard Daladier, chef du Parti radical et numéro deux du Front populaire."
FRA_status_quo:0 "Former le Front populaire"
FRA_status_quo_desc:0 "[FRA.GetNameDefCap] est le berceau et le protecteur de la liberté et doit le rester. Pour retrouver l’unité, nous devons stabiliser notre démocratie avant qu’elle ne s’effondre."
FRA_little_entente:0 "Petite Entente"
FRA_little_entente_desc:0 "La Petite Entente, une alliance formée après la Grande Guerre pour prévenir l’agression autrichienne et hongroise, était soutenue par la France mais s’est peu à peu effritée. Plutôt que de renforcer nos liens avec [ENG.GetNameDef], nous devrions restaurer et consolider cette faction, en commençant par ses fondateurs en [CZE.GetNameDef]."
FRA_go_with_britain:0 "S’allier à [ENG.GetNameDef]"
FRA_go_with_britain_desc:0 "Seuls [ROOT.GetNameDef] et [ENG.GetNameDef] subsistent de l’ancienne Triple-Entente, la Russie ayant changé à jamais. Si l’histoire doit se répéter, nous devons nous assurer que ces deux nations, bastions de démocratie et de liberté en Europe, demeurent alliées."
FRA_popular_front_united:0 "Front populaire uni"
FRA_popular_front_united_desc:0 "Nous devons cesser de nous déchirer et rester unis autour des réformes accomplies. Le Front ne s’effondrera pas et nous lutterons pour [FRA.GetNameDef] et « Liberté, Égalité, Fraternité » !"
FRA_invite_yugoslavia:0 "Inviter [YUG.GetNameDef]"
FRA_invite_yugoslavia_desc:0 "[YUG.GetNameDefCap] a déjà suffisamment de soucis sans craindre ses voisins expansionnistes. Les ramener dans la Petite Entente rendrait service à eux comme à nous."
FRA_invite_romania:0 "Inviter [ROM.GetNameDef]"
FRA_invite_romania_desc:0 "La démocratie [ROM.GetAdjective] est fragile, prise entre factions fascistes internes et communisme [SOV.GetAdjective]. L’intégrer à la Petite Entente renforcera sa stabilité grâce à notre soutien."
FRA_invite_poland:0 "Inviter [POL.GetNameDef]"
FRA_invite_poland_desc:0 "[GER.GetNameDefCap] revendique Dantzig et les anciennes terres perdues de [POL.GetNameDef]. L’inclure dans la Petite Entente garantirait sa sécurité."
FRA_research_treaty:0 "Traité de recherche"
FRA_research_treaty_desc:0 "En partageant nos avancées technologiques avec nos alliés, chaque nation de notre faction mènera sa recherche en temps de guerre plus efficacement."
FRA_invite_benelux:0 "Accord militaire [FRA.GetAdjective]-[BEL.GetAdjective]"
FRA_invite_benelux_desc:0 "[BEL.GetNameDefCap] et [LUX.GetNameDef] sont des proies faciles pour les [GER.GetAdjective]s. Pour les empêcher de contourner la ligne Maginot, nous devons sécuriser une coopération militaire de haut niveau."
FRA_economic_cooperation_agreement:0 "Accord de coopération économique"
FRA_economic_cooperation_agreement_desc:0 "Nous devons définir des accords économiques et logistiques pour assurer une coopération militaire parfaite."
FRA_preventive_intervention:0 "Intervention préventive"
FRA_preventive_intervention_desc:0 "Ces agresseurs ne nous laissent pas le choix. Pour le bien du monde libre et l’avenir de nos enfants, il est temps de faire la guerre."
FRA_rearmament_policy:0 "Politique de réarmement"
FRA_rearmament_policy_desc:0 "À mesure que la situation européenne évolue, la guerre semble de plus en plus proche. Qu’elle vienne de [GER.GetNameDef] ou de [SOV.GetNameDef], nous devons être prêts."
FRA_reynaud_economic_reforms:0 "Réformes économiques de Reynaud"
FRA_reynaud_economic_reforms_desc:0 "Pour remettre [FRA.GetNameDef] au travail, il faudra revoir certains acquis des accords de Matignon. Nommer Paul Reynaud, modéré de droite, au ministère des Finances permettra de mener ces réformes. La semaine de 40 heures doit être réduite voire supprimée, les impôts relevés et le franc de nouveau dévalué."
FRA_increase_military_spendings:0 "Augmenter les dépenses militaires"
FRA_increase_military_spendings_desc:0 "Il faut relancer les dépenses militaires pour faire face au danger de guerre, de plus en plus visible."
FRA_further_the_reforms:0 "Poursuivre les réformes"
FRA_further_the_reforms_desc:0 "Les accords de Matignon ne doivent pas marquer la fin des réformes sociales en [FRA.GetNameDef]. Continuons à soutenir les travailleurs et à renforcer les classes moyennes pour gagner leur appui."
FRA_law_against_combat_groups:0 "Loi contre les groupes de combat"
FRA_law_against_combat_groups_desc:0 "Les émeutes du 6 février 1934 prouvent que nous devons agir contre les groupes paramilitaires, notamment ceux d’extrême droite. Une loi permettant au président de dissoudre certaines organisations présentes sur le sol [FRA.GetAdjective] limitera leur influence."
FRA_invest_in_our_weaker_allies_tt:0 "Nous construirons 2 usines militaires dans chacun de nos alliés ayant moins d’usines que nous."

#### PRIORITÉ COMMUNISTE ####

FRA_radicalize_front:0 "Radicaliser la gauche"
FRA_radicalize_front_desc:0 "Les réformes du Front populaire ne sont pas assez drastiques pour redresser la situation actuelle. Nous devons radicaliser notre politique et intégrer davantage de communistes au gouvernement."
FRA_grands_travaux:0 "Grands Travaux"
FRA_grands_travaux_desc:0 "Une série de programmes de construction sociale accompagnera la nouvelle socialisation du pays. Cela réduira le chômage et créera des infrastructures publiques."
FRA_ideological_indoctrination:0 "Mobilisation nationale"
FRA_ideological_indoctrination_desc:0 "Nos valeurs et nos objectifs politiques méritent autant qu’une foi ancienne d’être défendus jusqu’à la mort. Tout partisan doit s’y préparer, et ceux qui s’en écartent doivent savoir à quoi s’attendre."
FRA_intervention_committee:0 "Comité d’intervention"
FRA_intervention_committee_desc:0 "Nous devons revoir notre politique d’intervention étrangère et soutenir les organisations de gauche dans d’autres pays pour endiguer l’influence fasciste."
FRA_organise_international:0 "Organiser la 4e Internationale"
FRA_organise_international_desc:0 "Nous devrions aider les trotskystes à établir leur organisation socialiste révolutionnaire internationale, dont le but affiché est d’aider la classe ouvrière à renverser le capitalisme et avancer vers le communisme international."
FRA_commune_proclamation:0 "Proclamation de la Commune"
FRA_commune_proclamation_desc:0 "Nous avons rassemblé assez de soutien pour lancer un coup d’État communiste. Il est temps de prendre le pouvoir et de perpétuer l’héritage de la Commune !"
FRA_scientific_convention:0 "Convention de Paris"
FRA_scientific_convention_desc:0 "Les [SOV.GetAdjective]s proposent d’étendre la coopération scientifique. Nous devrions signer une convention pour stimuler la recherche et l’innovation technologique."
FRA_research_cooperation:0 "Coopération scientifique"
FRA_research_cooperation_desc:0 "Les [SOV.GetAdjective]s sont intelligents et ingénieux, mais ne disposent pas de l’infrastructure nécessaire à de vastes programmes scientifiques. Nous travaillerons avec eux, partageant savoirs et découvertes pour un bénéfice mutuel."
FRA_assistance_treaty:0 "Traité d’assistance mutuelle [FRA.GetAdjective]-[SOV.GetAdjective]"
FRA_assistance_treaty_desc:0 "Un traité bilatéral entre nos deux pays communistes réduira la menace en Europe centrale. Ce pacte empêchera notamment une agression de [GER.GetNameDef]."
FRA_fascist_threat:0 "La menace fasciste"
FRA_fascist_threat_desc:0 "Le traité de Versailles et les sanctions économiques n’ont pas arrêté les nationalismes agressifs mais ont offert un terreau fertile à des mouvements encore plus sinistres. Nous devons vaincre le fascisme à tout prix !"
FRA_collectivisation:0 "Collectivisation"
FRA_collectivisation_desc:0 "Une campagne de collectivisation de l’industrie et des ressources privées aidera l’État à mieux superviser et stabiliser le pays, accompagnée d’une purge gouvernementale."
FRA_humanite_unie:0 "Humanité unie"
FRA_humanite_unie_desc:0 "Les banquiers repus et les démagogues assoiffés de pouvoir resserrent leur emprise sanglante sur le monde. Chaque jour, nous voyons des hommes libres réduits en esclavage et le monde s’enfoncer dans une crise née de la cupidité individuelle. Les idées [FRA.GetAdjective] sont plus nécessaires que jamais ! L’humanité a besoin de nous, et nous devons unir l’humanité !"
FRA_strike_empire:0 "Frapper l’Empire"
FRA_strike_empire_desc:0 "La menace qui pèse sur la liberté dans le monde, ce sont les empires capitalistes bâtis par les grandes puissances européennes. Nous devons les briser et libérer leurs peuples, en commençant par [ENG.GetNameDef]."
FRA_work_with_the_cgt:0 "Travailler avec la CGT"
FRA_work_with_the_cgt_desc:0 "La Confédération Générale du Travail est le plus grand syndicat [FRA.GetAdjective] et a joué un rôle clé dans la victoire du Front populaire et les grèves qui l’ont accompagné. Nous devrions nous rapprocher d’elle pour donner encore plus de pouvoir aux syndicats."
FRA_pcf_sfio_coalition:0 "Coalition PCF/SFIO"
FRA_pcf_sfio_coalition_desc:0 "Avec la montée de l’extrême gauche en [FRA.GetNameDef], une alliance permanente entre les deux principaux partis de ce courant permettrait une prise de pouvoir sans grandes difficultés."
FRA_syndicalist_revolution:0 "Révolution syndicaliste"
FRA_syndicalist_revolution_desc:0 "Le moment est venu pour [FRA.GetNameDef] de passer à une économie dirigée par les travailleurs ! Désormais, syndicats et employés œuvreront ensemble pour mettre fin à l’exploitation capitaliste et bâtir une économie juste."
FRA_help_the_spanish_republicans:0 "Aider les républicains espagnols"
FRA_help_the_spanish_republicans_desc:0 "Il est désormais temps d’apporter notre soutien total à la cause républicaine en Espagne. Ensemble, nous vaincrons les forces fascistes et bloquerons l’expansion de cette idéologie."
FRA_industrial_decentralization:0 "Décentralisation industrielle"
FRA_industrial_decentralization_desc:0 "La décentralisation de l’industrie permettra une meilleure démocratisation du travail, nous rapprochant du contrôle ouvrier sur l’économie."

#### FOCUS FASCISTE ####

FRA_far_right_leagues:0 "Ligues d’extrême droite"
FRA_far_right_leagues_desc:0 "Les ligues d’extrême droite sont plusieurs mouvements [FRA.GetAdjective] opposés au parlementarisme, qui se consacrent principalement aux défilés militaires, aux rixes de rue, aux manifestations et aux émeutes. Pour unir [FRA.GetNameDef], nous pourrions les utiliser afin d’affirmer notre supériorité et notre force, et éviter de sombrer dans la décadence."
FRA_front_liberte:0 "Front de la Liberté"
FRA_front_liberte_desc:0 "Pour nous opposer au Front populaire, nous devons former une alliance anti-marxiste avec les autres mouvements de droite. Ce Front de la Liberté fédérera ceux qui protestent contre le collectivisme."
FRA_support_ppf:0 "Parti Populaire Français"
FRA_support_ppf_desc:0 "Le Parti Populaire Français dénonce le parlementarisme, cherche à limiter la démocratie et à refaçonner la société [FRA.GetAdjective] selon ses convictions autoritaires. Marxistes et libéraux s’y sont vigoureusement opposés. Avec le succès du Front de la Liberté, le PPF, qui dirige le mouvement, devrait entrer au gouvernement."
FRA_we_want_petain:0 "Promouvoir Pétain"
FRA_we_want_petain_desc:0 "Depuis quelques années, certains prônent l’élévation du vainqueur de Verdun au rang de gardien de la France éternelle. Cela s’est illustré par un article publié dans « Le Grand Occident » intitulé « Nous voulons Pétain »."
FRA_charlemagne_division:0 "Division Charlemagne"
FRA_charlemagne_division_desc:0 "Le Komintern se renforce. Il est temps d’affirmer nos intérêts et de soutenir les organisations fascistes pour l’arrêter."
FRA_demand_wallonia:0 "Revendiquer la Wallonie"
FRA_demand_wallonia_desc:0 "La région wallonne au sein de [BEL.GetNameDef] est majoritairement occupée par des francophones. Ils ne se sentent pas [FRA.GetAdjective], mais nous pourrions exploiter l’argument linguistique pour prendre le contrôle de cette province."
FRA_ultimatum_to_belgium:0 "Ultimatum à [BEL.GetNameDef]"
FRA_ultimatum_to_belgium_desc:0 "Nous ne pouvons pas tolérer qu’une marionnette [ENG.GetAdjective] demeure à notre frontière nord."
FRA_split_switzerland:0 "Démembrer [SWI.GetNameDef]"
FRA_split_switzerland_desc:0 "La neutralité et les idéaux démocratiques de la Suisse sont une insulte à notre gouvernement. Nous pourrions conclure un accord secret avec [GER.GetLeader] et [ITA.GetLeader] pour diviser ce pays en trois."
FRA_strike_urss:0 "Frapper les [SOV.GetAdjective]s"
FRA_strike_urss_desc:0 "La menace de [SOV.GetNameDef] continue de croître malgré nos protestations. Nous ne pouvons tolérer l’agressivité de [SOV.GetName], et nous n’avons d’autre choix que de partir en guerre pour un avenir meilleur."
FRA_cagoule_coup:0 "Coup de la Cagoule"
FRA_cagoule_coup_desc:0 "La Cagoule est un groupe fascisant et anticommuniste qui a eu recours à la violence pour promouvoir ses activités. Le mouvement clandestin est en contact avec certains officiers de l’état-major militaire et bénéficie du financement de certains industriels. Nous avons entendu dire qu’un coup d’État pourrait avoir lieu, certains officiers militaires soutenant les mouvements antiparlementaires."
FRA_state_reorganisation:0 "Réorganisation de l’État"
FRA_state_reorganisation_desc:0 "Nous devons repenser le rôle de l’État en [FRA.GetNameDef]. Abandonnons toutes ces idéologies parlementaires et créons un parti fort et unique."
FRA_claim_rhineland:0 "Revendiquer la Rhénanie"
FRA_claim_rhineland_desc:0 "La menace [GER.GetAdjective] grandit d’année en année ; nous devons créer un État tampon sur la rive gauche du Rhin."
FRA_woo_italy:0 "Courtiser [ITA.GetNameDef]"
FRA_woo_italy_desc:0 "[ITA.GetNameDefCap] a le potentiel de devenir une nation puissante. Grâce au leadership fort de [ITA.GetLeader], le peuple [ITA.GetAdjective] est uni et prêt à combattre pour la bonne cause. Que cette cause soit la nôtre."
FRA_dismantle_germany:0 "Démanteler [GER.GetNameDef]"
FRA_dismantle_germany_desc:0 "Les [GER.GetAdjective] ne nous laissent aucun autre choix. Pour le bien de [FRA.GetNameDef] et l’avenir de nos enfants, il est temps de faire la guerre."
FRA_convince_spain:0 "Convaincre l’Espagne"
FRA_convince_spain_desc:0 "Franco et les nationalistes espagnols sont nos alliés naturels, unis par la religion, la culture et l’idéologie. Ensemble, nous protégerons les Latins de la menace [GER.GetAdjective]."
FRA_plan_xiv:0 "Plan XIV"
FRA_plan_xiv_desc:0 "Nous avons déjà sécurisé le nord. Seule [SWI.GetNameDefCap] demeure comme chemin potentiel pour nous atteindre. Nous ne pouvons tolérer cela."
FRA_nothern_italy_claim:0 "Revendiquer l’Italie du Nord"
FRA_nothern_italy_claim_desc:0 "[ITA.GetNameDef] n’est pas un véritable État. Il appartient à [FRA.GetNameDef], et nous devons le conquérir à nouveau, comme Napoléon l’a fait jadis."
FRA_secure_catalonia:0 "Marche catalane"
FRA_secure_catalonia_desc:0 "La Catalogne fut française sous le Premier Empire et sous Charlemagne. Pour honorer notre héritage, la soumission de l’Espagne est la seule solution."
FRA_alliance_with_industrialists:0 "Alliance avec les industriels"
FRA_alliance_with_industrialists_desc:0 "La Cagoule doit une grande partie de sa puissance à l’aide reçue de nombreux industriels, comme le fondateur de L’Oréal, Eugène Schueller. Des réformes économiques visant à renforcer nos liens avec les industriels, sur le modèle du fascisme italien, permettront un meilleur contrôle de l’économie."
FRA_root_out_communism:0 "Éradiquer le communisme"
FRA_root_out_communism_desc:0 "Les communistes ont failli accéder au pouvoir avec leurs alliés du Front populaire. Nous devons tout faire pour éliminer toute influence de la Troisième Internationale en [FRA.GetNameDef] !"
FRA_class_collaboration:0 "Collaboration de classes"
FRA_class_collaboration_desc:0 "Plutôt que de s’affronter au nom d’une « lutte des classes » qui ne mènerait qu’à l’anarchie, les différentes classes de la société [FRA.GetAdjective] doivent s’unir dans un même combat : celui de la grandeur de [FRA.GetNameDef] !"
FRA_the_three_levers:0 "Les trois leviers"
FRA_the_three_levers_desc:0 "Nous devons bâtir l’État moderne sur trois leviers : le conseil des provinces, le conseil des corporations et le conseil de l’empire. Ainsi, nous remplacerons l’ancien système parlementaire qui a constamment bloqué la politique [FRA.GetAdjective]."
FRA_service_ordre_legionnaire:0 "Service d’Ordre Légionnaire"
FRA_service_ordre_legionnaire_desc:0 "Établir une organisation paramilitaire officielle obéissant aux ordres du parti et indépendante de l’armée garantira que le militaire contrôle la société."

#### FOCUS MONARCHISTE ####

FRA_action_francaise:0 "Action Française"
FRA_action_francaise_desc:0 "L’Action Française soutient le rétablissement de la monarchie et, après la loi de 1905 sur la séparation de l’Église et de l’État, la restauration du catholicisme romain comme religion d’État. C’est aussi un point de ralliement face à la Troisième République, considérée comme corrompue et ingouvernable par nombre de ses opposants, qu’ils espéraient rallier à leur bannière."
FRA_camelots_roi:0 "Camelots du Roi"
FRA_camelots_roi_desc:0 "Les Camelots du Roi sont une organisation de jeunesse d’extrême droite issue du mouvement Action Française. Ce groupe paramilitaire peut renforcer notre position dans la société [FRA.GetAdjective]."
FRA_camelots_roi_tooltip:0 "§YJean d’Orléans sera choisi comme roi.\n§!"
FRA_brumaire_movement:0 "Soutenir les Bonapartistes"
FRA_brumaire_movement_desc:0 "Sous l’égide de Napoléon, la France a connu sa plus grande gloire, ses plus grandes victoires et sa plus vaste extension. Nul ne peut nier que l’Empire fut l’époque où la France était la nation la plus respectée et influente. Restaurer la dynastie Bonaparte nous permettra de retrouver cette gloire ancienne."
FRA_brumaire_movement_tooltip:0 "§YNapoléon VI sera choisi comme Empereur.\n§!"
FRA_papal_rehabilitation:0 "Réhabilitation papale"
FRA_papal_rehabilitation_desc:0 "En 1926, le pape Pie XI condamna l’Action Française en raison de l’influence de Maurras, agnostique. Avec le renouveau de l’anticommunisme dans l’Église catholique, nous pouvons mettre fin à cette condamnation."
FRA_union_latins:0 "Union latine"
FRA_union_latins_desc:0 "Une alliance fondée sur la civilisation et la culture latines en Europe ([ITA.GetNameDef], [FRA.GetNameDef], l’Espagne, [POR.GetNameDef] et [ROM.GetNameDef]) équilibrera le rapport de force avec l’Allemagne. Commençons avec [ROM.GetNameDef] ; ils peuvent conserver leur stabilité avec notre soutien."
FRA_restoration:0 "Restauration"
FRA_restoration_desc:0 "Il est temps de mettre fin à la République et de rendre la France à son héritier naturel. La nouvelle monarchie unira le peuple derrière un chef fort."
FRA_invite_portugal:0 "Inviter [POR.GetNameDef]"
FRA_invite_portugal_desc:0 "En tant que pays latin, [POR.GetNameDef] est un allié naturel du peuple [FRA.GetAdjective]. Nous devons renforcer ces liens d’amitié."
FRA_retake_haiti:0 "Reprendre Haïti"
FRA_retake_haiti_desc:0 "Haïti fut perdu à cause d’une révolte d’esclaves après la Révolution. Si nous voulons affirmer nos positions dans les Caraïbes et retrouver notre prestige, nous devons le reprendre par tous les moyens."
FRA_recover_quebec:0 "Récupérer le Québec"
FRA_recover_quebec_desc:0 "Le Québec a été volé par les Britanniques et reste peuplé de francophones. Il doit nous revenir par la force."
FRA_claim_louisiana:0 "Revendiquer la Louisiane"
FRA_claim_louisiana_desc:0 "[USA.GetNameDefCap] ne permettra jamais à notre influence de s’étendre davantage en Amérique. Les abattre aussi vite que possible est la meilleure solution."
FRA_usa_deal:0 "Accord avec [USA.GetNameDef]"
FRA_usa_deal_desc:0 "[USA.GetNameDefCap] est à la fois un vieil allié et notre meilleur ami en Amérique. En échange de terres [CAN.GetAdjective], nous devrions conclure une alliance."
FRA_militarist_society:0 "Société militariste"
FRA_militarist_society_desc:0 "Le pacifisme nous empêche d’obtenir la gloire que nous méritons. Des efforts pour militariser davantage la société permettront à [FRA.GetNameDef] de retrouver sa grandeur militaire."
FRA_national_integralism:0 "Intégralisme national"
FRA_national_integralism_desc:0 "Pour assurer la pérennité du nouveau royaume, nous devons suivre la doctrine intégraliste imaginée par Charles Maurras lui-même. Cela garantira la cohésion et la grandeur du territoire [FRA.GetAdjective]."
FRA_the_new_continental_system:0 "Le nouveau système continental"
FRA_the_new_continental_system_desc:0 "L’Europe compte de nombreuses puissances prêtes à déclencher une guerre au moindre incident territorial. Pour sécuriser notre place sur le continent, nous devons créer notre propre bloc afin que nos intérêts soient placés en premier."
FRA_our_natural_borders:0 "Nos frontières naturelles"
FRA_our_natural_borders_desc:0 "Pour garantir la sécurité de [FRA.GetNameDef], notre frontière nord doit suivre le cours du Rhin. Il est temps de récupérer notre frontière légitime."
FRA_compromise_with_germany:0 "Compromis avec [GER.GetNameDef]"
FRA_compromise_with_germany_desc:0 "Peut-être pourrions-nous parvenir à un accord avec [GER.GetLeader] afin de sécuriser nos zones d’influence et de nous concentrer sur nos propres problèmes."
FRA_approach_poland_and_romania:0 "Se rapprocher des gouvernements [POL.GetAdjective] et [ROM.GetAdjective]"
FRA_approach_poland_and_romania_desc:0 "[POL.GetNameDefCap] et [ROM.GetNameDef] sont essentiels pour la sécurité de l’Europe de l’Est ; ils sont donc cruciaux pour l’équilibre du système continental."
FRA_obtain_polish_cryptological_data:0 "Obtenir les données cryptologiques polonaises"
FRA_obtain_polish_cryptological_data_desc:0 "Nos grands alliés polonais ont réalisé des percées dans le domaine du décryptage assisté par machine. En collaborant étroitement, nous pourrions profiter de leurs technologies."

FRA_approach_the_empire_of_brazil:0 "Se rapprocher de [BRA.GetNameDef]"
FRA_approach_the_empire_of_brazil_desc:0 "Les empereurs du monde entier doivent se protéger contre le radicalisme traître."
FRA_a_more_durable_tilsit_treaty:0 "Un traité de Tilsit plus durable"
FRA_a_more_durable_tilsit_treaty_desc:0 "Désormais libéré de la tyrannie bolchévique, [SOV.GetNameDef] peut réintégrer le concert des nations et forger un lien durable avec [FRA.GetNameDef] pour garantir la sécurité en Europe."

FRA_destroy_albion:0 "Détruire l'Albion"
FRA_destroy_albion_desc:0 "Plus d’un siècle après notre humiliation à Waterloo, la perfide Albion continue de nous surpasser sur absolument tous les plans, en particulier au niveau colonial. Il est temps que cela cesse ; lorsque le Tricolore flottera sur Londres, nous prouverons au monde que [FRA.GetNameDef] est la véritable puissance mondiale."
FRA_side_with_the_legitimists:0 "Soutenir les Légitimistes"
FRA_side_with_the_orleanists:0 "Soutenir les Orléanistes"
FRA_side_with_the_orleanists_desc:0 "La Maison d’Orléans est la famille la plus légitime pour régner sur la France, ayant démontré sa compétence durant la Monarchie de Juillet."
FRA_legacy_of_the_grande_armee:0 "Héritage de la Grande Armée"
FRA_legacy_of_the_grande_armée_desc:0 "La Grande Armée fut, en son temps, la plus vaste et la plus redoutée du monde. Il est temps de bâtir une armée qui la rendra fière."
FRA_crush_germany:0 "Écraser [GER.GetNameDef]"
FRA_crush_germany_desc:0 "Depuis des temps immémoriaux, [FRA.GetNameDef] et [GER.GetNameDef] sont de grands rivaux au sein de l’Europe. Notre victoire lors de la Grande Guerre n’a pas suffi à apaiser les Boches, une nouvelle invasion semble donc nécessaire pour remettre les [GER.GetAdjective] à leur place, sous l’autorité de [FRA.GetNameDef]."
FRA_operation_charlemagna:0 "Opération Charlemagne"
FRA_operation_charlemagna_desc:0 "Plus d’un siècle après notre humiliation à Waterloo, la perfide Albion continue de nous surpasser sur absolument tous les plans, en particulier au niveau colonial. Il est temps que cela cesse ; lorsque le Tricolore flottera sur Londres, nous prouverons au monde que [FRA.GetNameDef] est la véritable puissance mondiale."
FRA_disunite_germany_tt:0 "[GER.GetNameDefCap] sera fragmenté en ses royaumes d’avant unification. Chaque nouvel État nous sera loyal."
FRA_disunite_italy:0 "Désunir [ITA.GetNameDef]"
FRA_disunite_italy_desc:0 "L’idée d’une Italie unie fut une erreur, et nous devons placer le peuple italien sous notre protection. L’Italie doit être redessinée selon les frontières de Napoléon Ier."
FRA_disunite_italy_tt:0 "L’Italie sera morcelée, [FRA.GetNameDef] conservera [158.GetName], [162.GetName] et [2.GetName], et le reste sera placé sous tutelle de Naples, Sicile, Sardaigne, Venise et un nouveau gouvernement italien loyal."
FRA_secure_iberia:0 "Sécuriser l’Ibérie"
FRA_restore_the_mexican_monarchy:0 "Restaurer la Monarchie mexicaine"
FRA_take_back_north_america:0 "Reprendre l’Amérique du Nord"
FRA_second_march_on_moscow:0 "La Seconde Marche sur Moscou"
FRA_napoleon_iii_legacy:0 "L’Héritage de Napoléon III"
FRA_napoleon_iii_legacy_desc:0 "Une Italie unie n’existerait pas sans l’aide de Napoléon III. Nous devons tendre la main aux [ITA.GetAdjective]s et nous allier pour le bien commun."
FRA_anti_german_front:0 "Front anti-[GER.GetAdjective]"
FRA_anti_german_front_desc:0 "L’Allemagne a toujours été l’ennemie naturelle de la France, et il ne faudra pas longtemps avant qu’elle ne plonge encore une fois l’Europe dans une guerre brutale. Nous devons créer un front uni contre l’agression [GER.GetAdjective] avec d’autres nations partageant nos vues."
FRA_chantilly_accord:0 "Accord de Chantilly"

FRA_support_the_legitimatises:0 "Soutenir les Légitimistes"
FRA_support_the_legitimatises_desc:0 "Depuis la Révolution de Juillet de 1830, les Légitimistes réclament le retour de la branche aînée de la dynastie des Bourbons issue du roi Charles X. Actuellement, cette branche se perpétue avec l’ancien roi d’Espagne Alphonse XIII et son fils, l’Infant Jacques."
FRA_social_nationalism_focus:0 "Nationalisme social"
FRA_social_nationalism_focus_desc:0 "Il doit exister une forme de solidarité nationale dans la lutte des classes, au sein de laquelle le roi constitue la clef de voûte."
FRA_decentralise_the_state:0 "Décentraliser l’État"
FRA_decentralise_the_state_desc:0 "La centralisation engendre le dirigisme et la bureaucratie propres au système démocratique. Le seul moyen pour une monarchie de survivre face aux idéaux républicains est de revenir aux pratiques d’avant la Révolution, celles d’un royaume décentralisé."
FRA_restore_ancient_reights:0 "Restaurer les anciens droits"
FRA_restore_ancient_reights_desc:0 "Une monarchie absolue régnant sur les ordres du royaume est le véritable modèle de la France. Le retour à l’Ancien Régime est l’unique avenir possible pour la nation."
FRA_embrace_the_counter_revolution:0 "Adopter la Contre-révolution"
FRA_embrace_the_counter_revolution_desc:0 "Unis sous un monarque absolu, le Royaume de France pourra redevenir la grande puissance de l’Europe."
FRA_counter_the_fascist_infulence:0 "Contrer l’influence fasciste"
FRA_counter_the_fascist_infulence_desc:0 "Si l’Action française a joué un rôle déterminant dans le retour de la monarchie, [FRA.GetNameDef] ne doit pas tomber entre les mains de l’extrême droite. Nous devons collaborer avec ceux qui nous sont favorables pour libérer le monarque de la foule fasciste."
FRA_oust_maurras:0 "Écarter Maurras"
FRA_oust_maurras_desc:0 "Charles Maurras est un fasciste dont les idées mèneraient la France à sa perte. En travaillant avec nos alliés antifascistes, nous pouvons le reléguer au second plan, puis dans l’oubli."
FRA_keep_the_separation_of_church_and_state:0 "Alliance avec le centre-droit"
FRA_keep_the_separation_of_church_and_state_desc:0 "Bien que la monarchie ne soit pas populaire auprès de tous, un compromis avec les partis non extrémistes nous permettra de préserver plus efficacement les valeurs traditionnelles de la France contre la tyrannie fasciste."
FRA_constitutional_monarchy_focus:0 "Une monarchie constitutionnelle"
FRA_constitutional_monarchy_focus_desc:0 "L’idée d’une monarchie constitutionnelle est antérieure à la Révolution. Nous ne devons pas céder aux radicaux et suivre plutôt l’exemple [ENG.GetAdjective]."
FRA_metropolitan_priority:0 "Priorité métropolitaine"
FRA_metropolitan_priority_desc:0 "Les villes de France sont son poumon vital. Nous devons collaborer avec les industriels pour améliorer encore notre économie."
FRA_public_works:0 "Travaux publics"
FRA_public_works_desc:0 "Un vaste programme de travaux publics améliorera non seulement la nation, mais aussi le prestige de la monarchie aux yeux du peuple."
FRA_assist_the_carlist_cause:0 "Soutenir la cause carliste"
FRA_assist_the_carlist_cause_desc:0 "Les Carlistes se battent pour le retour de la monarchie en Espagne. Il serait immoral de ne pas leur venir en aide."
FRA_intervene_in_the_spanish_civil_war:0 "Intervenir dans la guerre civile espagnole"
FRA_intervene_in_the_spanish_civil_war_desc:0 "Nous devons aider les Carlistes à combattre pour notre avenir commun en Espagne."
FRA_proclaim_the_dual_monarchy:0 "Proclamer la double monarchie"
FRA_proclaim_the_dual_monarchy_desc:0 "Nos rois sont les mêmes. Il est donc naturel que nos nations le soient aussi."
FRA_pacify_the_spanish_countryside:0 "Pacifier les campagnes espagnoles"
FRA_pacify_the_spanish_countryside_desc:0 "Les restes de la guerre civile espagnole continuent de résister à notre autorité. Il est temps de mettre fin à leur révolte et de rétablir l’autorité de l’État."
FRA_support_the_spanish_nationalists:0 "Soutenir les nationalistes espagnols"
FRA_support_the_spanish_nationalists_desc:0 "Les nationalistes espagnols ont besoin de soutien contre les communistes et les anarchistes. Nous devons veiller à ce que nos alliés du sud soient fiables."
FRA_ally_italy:0 "Inviter [ITA.GetNameDef] au front"
FRA_ally_italy_desc:0 "[ITA.GetNameDefCap] et [FRA.GetNameDef] furent longtemps alliés. Nous pouvons de nouveau nous tenir côte à côte."
FRA_pact_with_spain:0 "Pacte avec l’Espagne"
FRA_pact_with_spain_desc:0 "Les nationalistes espagnols sont des alliés naturels. Ensemble, nous pouvons unir l’Europe occidentale contre la menace [GER.GetAdjective] et communiste."
FRA_anti_communism_r56:0 "Anticommunisme"
FRA_anti_communism_r56_desc:0 "Le communisme est l’ennemi de la civilisation occidentale. Nous devons agir pour libérer les peuples du monde de l’oppression communiste."
FRA_return_to_dalmatia:0 "Retour en Dalmatie"
FRA_return_to_dalmatia_desc:0 "Les Provinces illyriennes furent une partie intégrante de la France napoléonienne. Nous devons les reprendre sous notre protection."
FRA_second_march_on_moscow_desc:0 "La Russie fut le plus grand échec de Napoléon Ier. Nous ne faillirons pas une seconde fois."
FRA_secure_iberia_desc:0 "L’Ibérie doit être placée sous notre contrôle total pour assurer la sécurité de notre patrie."
FRA_restore_the_mexican_monarchy_desc:0 "C’est Napoléon III qui créa le Second Empire mexicain. Ce sera Napoléon VI qui fondera le Troisième Empire mexicain."
FRA_take_back_north_america_desc:0 "Haïti, la Louisiane, l’Acadie, le Québec… toutes ces terres furent un jour les nôtres et sont aujourd’hui perdues. Nous les reprendrons."
FRA_proclaim_the_dual_monarchy_tt:0 "Nous annexerons et obtiendrons des cœurs sur l’Espagne si elle est notre puppet ou si [SPB.GetNameDef] existe et a remporté la guerre civile espagnole. Sinon, nous gagnerons un cœur sur tous les territoires espagnols si nous possédons un cœur espagnol."
#### MILITARY FOCUS ####
FRA_giraud_plan:0 "Plan Giraud"
FRA_giraud_plan_desc:0 "En ces temps troublés, il est préférable de renforcer nos défenses. Si des menaces surgissent, qu’elles viennent à nous : nous les affronterons sur notre sol. Nous avons un candidat idéal pour diriger notre armée ; il ne reste qu’à lui en donner l’ordre."
FRA_alpine_forts:0 "Fortifications alpines"
FRA_alpine_forts_desc:0 "Les [ITA.GetAdjective] ne franchiront pas la frontière si facilement une fois les Alpes couvertes de notre nouvelle ligne défensive. Cela nous donnera le temps de réagir et de renforcer notre position."
FRA_commission_fortified_regions:0 "Mission CORF"
FRA_commission_fortified_regions_desc:0 "Nous pouvons recréer l’ancienne Commission d’Organisation des Régions Fortifiées de 1927 pour étudier l’état de nos fortifications frontalières et actualiser nos plans de défense."
FRA_extend_the_maginot_line:0 "Étendre la ligne Maginot"
FRA_extend_the_maginot_line_desc:0 "Nous ne pouvons pas compter sur [BEL.GetNameDef] pour tenir sa ligne ; si l’ennemi passe, nous serons en grand danger. Étendre la ligne Maginot est crucial pour empêcher des armées indésirables de pénétrer en [FRA.GetNameDef] !"
FRA_de_gaulle_strategy:0 "Stratégie de De Gaulle"
FRA_de_gaulle_strategy_desc:0 "Nous ne pouvons pas rester inactifs alors que l’ennemi approche de nos frontières, ni abandonner nos alliés à leur sort en cas de guerre. Préparons notre armée ! Gamelin est l’homme de la situation."
FRA_motorized_focus:0 "Priorité motorisée"
FRA_motorized_focus_desc:0 "Trouver de meilleures méthodes pour construire nos véhicules d’infanterie nous aidera à soutenir et renforcer les lignes de front."
FRA_mechanized_focus:0 "Priorité mécanisée"
FRA_mechanized_focus_desc:0 "L’avenir de l’industrie militaire, ce sont les chars. Pour dominer le champ de bataille, il nous faut des blindés puissants et modernes !"
FRA_tank_modernisation:0 "Modernisation doctrinale"
FRA_tank_modernisation_desc:0 "Les blindés jouent un rôle de plus en plus crucial. Bien que plus légers que les chars les plus imposants, ils nous donnent l’avantage en matière de communications, de commandement, de transport et de guerre urbaine."
FRA_further_armament_program:0 "Programme d’armement supplémentaire"
FRA_further_armament_program_desc:0 "Avec de nouveaux fonds pour l’armée, nous pouvons produire des armes en masse. Un fusil dans les mains de chacun !"
FRA_infantry_focus:0 "Levée en masse"
FRA_infantry_focus_desc:0 "Tous les hommes et femmes capables de se battre devront le faire. Nous devons consacrer des ressources gouvernementales à la production et à l’amélioration de l’armement d’infanterie."
FRA_artillery_focus:0 "Grande Batterie"
FRA_artillery_focus_desc:0 "Notre artillerie formera une seule puissance de feu concentrée sur des points précis. Nous affaiblirons les lignes ennemies et les briserons, salve après salve s’il le faut !"
FRA_army_reform:0 "Réforme de l’armée"
FRA_army_reform_desc:0 "Aucune unité d’infanterie ni aucun char ultramoderne ne gagnera seul la guerre. Nous devons investir autant dans nos capacités tactiques que stratégiques. Avec les bonnes personnes, notre armée évoluera."
FRA_general_mobilisation_order:0 "Ordre de mobilisation générale"
FRA_general_mobilisation_order_desc:0 "Il nous faut maintenir l’armée de terre, l’aviation et la marine en état de guerre, et mobiliser toutes les forces [FRA.GetAdjective] disponibles."
FRA_africa_army:0 "Armée d’Afrique"
FRA_africa_army_desc:0 "L’expérience de l’Armée d’Afrique assurera notre domination dans les colonies et en Afrique du Nord. Nous pourrons compter sur des volontaires arabes ou berbères et sur les régiments de colons [FRA.GetAdjective]."
FRA_colonial_troops:0 "Troupes coloniales"
FRA_colonial_troops_desc:0 "Les Troupes coloniales, distinctes de l’Armée d’Afrique, regroupent les soldats autochtones d’Afrique de l’Ouest et du Centre. Leur équipement leur permettra de combattre dans des terres hostiles."
FRA_foreign_legion:0 "Légion étrangère"
FRA_foreign_legion_desc:0 "La Légion étrangère est l’unité d’élite de l’Armée d’Afrique, composée de soldats venus d’horizons et de nationalités diverses. L’expérience des légionnaires et la qualité de leur entraînement seront notre fer de lance."
FRA_commandos_marine:0 "Commandos Marine"
FRA_commandos_marine_desc:0 "Les Commandos Marine sont les forces spéciales de la Marine [FRA.GetAdjective]. Leur expertise dans la guerre amphibie et la reconnaissance navale défendra [FRA.GetNameDef] et permettra de vaincre l’ennemi jusque sur les rivages lointains."
FRA_blum_viollette_project:0 "Projet Blum-Viollette"
FRA_blum_viollette_project_desc:0 "La proposition Blum-Viollette suggérait qu’une minorité d’Algériens obtienne la pleine citoyenneté [FRA.GetAdjective], avec pour objectif d’étendre ensuite ces droits à d’autres groupes. Nous pourrons utiliser cet argument pour recruter dans la colonie, mais les colons [FRA.GetAdjective] protesteront violemment."
FRA_abolish_indigenat_statut:0 "Abolir le statut de l’Indigénat"
FRA_abolish_indigenat_statut_desc:0 "Chaque individu sur le sol [FRA.GetAdjective] doit jouir de droits égaux, quelle que soit son origine. Nous devons accorder la citoyenneté pleine et entière à tous les Algériens, même si cela implique un conflit avec les colons [FRA.GetAdjective]."

FRA_the_somua_s35:0 "Le SOMUA S35"
FRA_the_somua_s35_desc:0 "Nos ennemis pourraient aligner un grand nombre de chars. Nous concevrons et déploierons un char [FRA.GetAdjective] bien supérieur : blindé et suffisamment rapide pour contrer toute force mécanisée cherchant à défier la puissance de l’Armée [FRA.GetAdjective]."
FRA_the_mas38:0 "Le MAS-38"
FRA_the_mas38_desc:0 "L’Armée [FRA.GetAdjective] a toujours utilisé les armes légères et l’armement les plus modernes. Nous poursuivrons dans cette tradition."

#### NAVAL SECTION ####
FRA_naval_construction_program:0 "Programme de construction navale"
FRA_naval_construction_program_tt:0 "Pas assez d’emplacements pour une §YBase navale§!"
FRA_naval_construction_program_desc:0 "Si nous voulons agrandir notre flotte, la première étape est l’amélioration et le développement de nos bases navales. Nos navires uniques exigent une attention constante pour rester opérationnels en tout temps."
FRA_atlantic_domination:0 "Domination atlantique"
FRA_atlantic_domination_desc:0 "Améliorer la conception de nos cuirassés nous donnerait des avantages tactiques décisifs dans l’Atlantique. Grâce à leur puissance et leur portée inégalées, nul ne pourra échapper à leur feu."
FRA_pacific_protection:0 "Protection du Pacifique"
FRA_pacific_protection_desc:0 "Nos porte-avions sont obsolètes. Les théoriciens navals proposent de nouvelles doctrines qui justifieraient de pousser leur développement. Avec un soutien total, nous pourrons assurer le contrôle du Pacifique et protéger nos colonies contre [JAP.GetNameDef]."
FRA_darlan_doctrine:0 "Doctrine Darlan"
FRA_darlan_doctrine_desc:0 "Les nouveaux modèles de navires ont ouvert la voie à de nouvelles tactiques navales. L’amiral Darlan propose des théories qu’il convient de tester et de consolider par des plans de guerre solides, avant que la tempête n’éclate."
FRA_naval_gunnery:0 "Artillerie navale"
FRA_naval_gunnery_desc:0 "Améliorons l’efficacité de notre artillerie navale pour frapper plus fort et dominer les mers."
FRA_mediterranean_special_measures:0 "Mesures spéciales en Méditerranée"
FRA_mediterranean_special_measures_desc:0 "Les [ITA.GetAdjective] renforcent leur flotte et rêvent de dominer la Méditerranée. Si nous perdons notre ligne défensive en mer, nous risquons une invasion directe. Nous devons équiper nos navires des dernières technologies pour l’empêcher."
FRA_standardisation_engine:0 "Standardisation des moteurs"
FRA_standardisation_engine_desc:0 "Notre flotte de sous-marins et de bombardiers navals est vieillissante. Mais trop de variantes de pièces principales empêchent leur production en série. La standardisation de l’équipement doit devenir notre priorité."

FRA_CHEDN:0 "Fonder le CHEDN"
FRA_CHEDN_desc:0 "Le Collège des hautes études de défense nationale deviendra le principal institut théorique pour former nos futurs dirigeants aux affaires de défense. L’amiral Raoul Castex s’est proposé pour en poser les bases."
FRA_experiment_castex_strategies:0 "Expérimenter les stratégies de Castex"
FRA_experiment_castex_strategies_desc:0 "L’amiral Castex a proposé des doctrines qui vont à l’encontre du culte du cuirassé. Nous devrions tester ses idées pour en vérifier la pertinence."
FRA_adapt_young_school_concepts:0 "Adopter les concepts de la Jeune École"
FRA_adapt_young_school_concepts_desc:0 "Nous avons constaté l’efficacité des raids sous-marins ; la Jeune École propose d’en élargir l’usage avec des concepts modernes. Poussons plus loin ces suggestions."
FRA_strategic_manoeuvre:0 "Manœuvre stratégique"
FRA_strategic_manoeuvre_desc:0 "La Marine [FRA.GetAdjective] bénéficiera grandement d’exercices supplémentaires et de doctrines améliorées qui perfectionneront nos manœuvres en mer."
FRA_the_le_hardi_class_destroyer:0 "Le contre-torpilleur Le Hardi"
FRA_the_le_hardi_class_destroyer_desc:0 "Le destroyer, modeste en apparence, pourrait être le meilleur gardien de notre flotte. Nous lancerons une nouvelle série de contre-torpilleurs capables de remplir ce rôle."
FRA_lay_down_the_jean_bart:0 "Poser la quille du Jean Bart"
FRA_lay_down_the_jean_bart_desc:0 "Le cuirassé est l’arme la plus redoutable des mers. Nous entreprendrons la construction d’un maître des océans encore plus puissant."
FRA_increase_repair_capabilities:0 "Renforcer les capacités de réparation"
FRA_increase_repair_capabilities_desc:0 "Notre flotte s’usera rapidement, bataille après bataille, sans des arsenaux capables de les remettre en état. Nous allouerons les ressources et l’expertise nécessaires pour y remédier."

#### AIR SECTION ####

FRA_air_bases:0 "Élargir nos nouvelles bases aériennes"
FRA_air_bases_bypass_tt:0 "Pas assez d’emplacements pour une §YBase aérienne§!"
FRA_air_bases_desc:0 "Il est temps de développer notre Armée de l’air ! Les plans sont déjà prêts pour la construction de nouvelles bases aériennes afin de soutenir une forte augmentation des effectifs et du nombre d’appareils."

FRA_modernisation_program:0 "Programme de modernisation"
FRA_modernisation_program_desc:0 "Nous pouvons appliquer des innovations issues du génie civil à nos chasseurs pour améliorer leur vitesse, leur portée et leur plafond opérationnel. Il faut nous concentrer sur cet objectif si nous voulons rivaliser avec les progrès réalisés ailleurs."

FRA_buy_americain:0 "Acheter des bombardiers [USA.GetAdjective]"
FRA_buy_americain_desc:0 "Le soutien aérien est une composante essentielle de nos capacités offensives comme défensives. Or, nos bombardiers actuels sont dépassés. En acquérant les derniers modèles [USA.GetAdjective], nous pourrons rester dans la course."
FRA_buy_americain_tooltip:0 "Nous recevrons 200 bombardiers tactiques de la part de [USA.GetNameDef]."

FRA_barrage_david:0 "Barrage David"
FRA_barrage_david_desc:0 "Inspirée par une découverte [ENG.GetAdjective], l’Armée de l’air a mis au point un nouveau modèle de radar bistatique pour détecter les avions ennemis."

FRA_jet_effort:0 "Effort vers le réacteur"
FRA_jet_effort_desc:0 "Le combat aérien repose sur la mobilité. Le moteur à réaction est une avancée décisive qui fera paraître les pilotes ennemis immobiles tandis que nous les arracherons du ciel."

FRA_interwar_experience:0 "Expérience de l’entre-deux-guerres"
FRA_interwar_experience_desc:0 "Les avions de soutien aux forces terrestres se sont révélés très efficaces durant la révolte de l’Anti-Atlas. Plusieurs améliorations ont été suggérées et devraient être intégrées à nos manœuvres."

FRA_reorganize_air_army:0 "Réorganiser l’Armée de l’air"
FRA_reorganize_air_army_desc:0 "Nous avons désormais assez d’expérience pour tester de nouvelles théories sur la guerre aérienne, mais notre structure de commandement actuelle rend l’Armée de l’air difficile à gérer. Une réorganisation s’impose."

FRA_parachute_battalions:0 "G.I.A 601-602"
FRA_parachute_battalions_desc:0 "Les [SOV.GetAdjective] ont créé une nouvelle unité aéroportée capable de larguer troupes et matériel. Nous devrions former une unité similaire."

FRA_purchase_american_fighters:0 "Acheter des chasseurs [USA.GetAdjective]"
FRA_purchase_american_fighters_desc:0 "Notre manque actuel d’appareils modernes légers est une faiblesse stratégique. Nous devrions contacter les [USA.GetAdjective] pour acquérir des chasseurs performants afin d’assurer notre suprématie aérienne."

FRA_form_the_first_strategic_bombing_unit:0 "Former la première unité de bombardement stratégique"
FRA_form_the_first_strategic_bombing_unit_desc:0 "Bombarder les usines et la capacité de production de guerre de l’ennemi constitue une forte dissuasion. Créons une escadre de bombardiers stratégiques capable d’exploiter ce potentiel."

FRA_support_the_ecole_de_lair:0 "Soutenir l’École de l’Air"
FRA_support_the_ecole_de_lair_desc:0 "Notre École de l’Air forme les pilotes au combat aérien et au bombardement. Nous devrions améliorer nos programmes de formation pour répondre aux besoins d’une armée de l’air en pleine expansion."

FRA_faire_face:0 "Faire Face"
FRA_faire_face_desc:0 "Avec notre armée de l’air modernisée, nous pouvons mettre à l’épreuve de nouvelles doctrines et dépasser les anciennes conceptions en matière d’opérations aériennes et de formations de combat."

FRA_finalize_the_potez_630:0 "Finaliser le Potez 630"
FRA_finalize_the_potez_630_desc:0 "Travaux en cours"
FRA_finalize_the_potez_630_tt:0 "Permet la production du §HPotez 630§! si non encore recherché.\nLe §HPotez 630§! est §Gmoins coûteux§! à produire que les chasseurs classiques.\n"

FRA_develop_the_ms_406:0 "Développer le M.S. 406"
FRA_develop_the_ms_406_desc:0 "Travaux en cours"

FRA_enact_plan_v:0 "Appliquer le Plan V"
FRA_enact_plan_v_desc:0 "Les récents progrès en doctrines et en organisation aérienne permettent de constituer une force puissante capable de mener toutes les opérations aériennes souhaitées. Allouons fonds et moyens de production pour bâtir notre armée de l’air."

FRA_develop_bomber_fleet:0 "Développer la flotte de bombardiers"
FRA_develop_bomber_fleet_desc:0 "Maintenant que nous disposons d’une force aérienne conséquente, nous devons concevoir de meilleurs bombardiers capables d’emporter plus de bombes, de voler plus loin et plus vite. Que l’ennemi sache que le Tricolore peut frapper partout, à tout moment."

FRA_follow_up_on_the_potez:0 "Donner suite au projet Potez"
FRA_follow_up_on_the_potez_desc:0 "Un bombardier à long rayon d’action est sans défense sans escorte. Développons des chasseurs d’escorte plus grands et plus autonomes pour protéger nos bombardiers."

FRA_provide_aerial_support:0 "Fournir un soutien aérien"
FRA_provide_aerial_support_desc:0 "De nouveaux appareils, capables d’emporter une charge explosive plus importante et dotés de cellules plus robustes, s’intègreront parfaitement à notre doctrine d’appui aux assauts d’infanterie."

FRA_new_french_fighter:0 "Nouveau chasseur [FRA.GetAdjective]"
FRA_new_french_fighter_desc:0 "La prochaine génération de chasseurs légers [FRA.GetAdjective] surpassera ses adversaires en armement, en manœuvrabilité et en performance."

FRA_supprt_the_aeronavale:0 "Soutenir l’Aéronavale"
FRA_supprt_the_aeronavale_desc:0 "Notre branche aéronavale sera désormais équipée de modèles récents capables d’anéantir des flottes entières."

### FRANCE LIBRE ###

FRA_improve_equatorial_roads:0 "Améliorer les routes équatoriales"
FRA_improve_equatorial_roads_desc:0 "Traditionnellement négligées, les nécessités d’organiser une économie de guerre et une armée en Afrique équatoriale rendent indispensable l’amélioration du réseau routier."

FRA_radio_brazzaville:0 "Radio [Root.Capital.GetCapitalVictoryPointName]"
FRA_radio_brazzaville_desc:0 "Une puissante radio dans notre capitale en exil nous permettra de faire entendre notre voix dans le monde entier et de montrer que nous sommes prêts à libérer la France métropolitaine."

FRA_equatorial_african_gold_mining:0 "Exploitation aurifère en Afrique équatoriale"
FRA_equatorial_african_gold_mining_desc:0 "Nous devons exploiter pleinement l’or des colonies afin d’alimenter l’effort de guerre."

FRA_exploit_rubber_vines:0 "Exploiter les lianes à caoutchouc"
FRA_exploit_rubber_vines_desc:0 "En complément des plantations de caoutchouc, les lianes sauvages pourraient être exploitées. Toutefois, ce travail ardu risque de déplaire à certains travailleurs indigènes."

FRA_an_african_army:0 "Une armée africaine"
FRA_an_african_army_desc:0 "Notre nouvelle base est en Afrique, et c’est de là que la bannière [FRA.GetAdjective] flottera sans relâche jusqu’à l’écrasement de nos ennemis."

FRA_improved_logistics:0 "Logistique améliorée"
FRA_improved_logistics_desc:0 "La nature exilée de notre armée l’oblige à combattre dans tout l’Empire tout en préparant le retour en Métropole. Ces efforts ont montré qu’une planification logistique précise est essentielle à notre libération."

FRA_continue_the_fight_in_africa:0 "Poursuivre la guerre en Afrique"
FRA_continue_the_fight_in_africa_desc:0 "La Métropole est peut-être temporairement sous contrôle ennemi, mais la guerre est loin d’être terminée."

FRA_mobilize_the_empire:0 "Mobiliser l’Empire"
FRA_mobilize_the_empire_desc:0 "Pour sauver la France, les peuples de l’Empire seront essentiels. Il est temps qu’ils témoignent leur reconnaissance après des années passées sous le phare civilisateur du monde."

FRA_improve_equatorial_roads2:0 "Améliorer les routes équatoriales"
FRA_improve_equatorial_roads2_desc:0 "Traditionnellement négligées, les nécessités d’organiser une économie de guerre et une armée en Afrique équatoriale rendent indispensable l’amélioration du réseau routier."

FRA_radio_brazzaville2:0 "Radio [Root.Capital.GetCapitalVictoryPointName]"
FRA_radio_brazzaville2_desc:0 "Une puissante radio dans notre capitale en exil nous permettra de faire entendre notre voix dans le monde entier et de montrer que nous sommes prêts à libérer la France métropolitaine."

FRA_equatorial_african_gold_mining2:0 "Exploitation aurifère en Afrique équatoriale"
FRA_equatorial_african_gold_mining2_desc:0 "Nous devons exploiter pleinement l’or des colonies afin d’alimenter l’effort de guerre."

FRA_exploit_rubber_vines2:0 "Exploiter les lianes à caoutchouc"
FRA_exploit_rubber_vines2_desc:0 "En complément des plantations de caoutchouc, les lianes sauvages pourraient être exploitées. Toutefois, ce travail ardu risque de déplaire à certains travailleurs indigènes."

FRA_an_african_army2:0 "Une armée africaine"
FRA_an_african_army2_desc:0 "Notre nouvelle base est en Afrique, et c’est de là que la bannière [FRA.GetAdjective] flottera sans relâche jusqu’à l’écrasement de nos ennemis."

FRA_improved_logistics2:0 "Logistique améliorée"
FRA_improved_logistics2_desc:0 "La nature exilée de notre armée l’oblige à combattre dans tout l’Empire tout en préparant le retour en Métropole. Ces efforts ont montré qu’une planification logistique précise est essentielle à notre libération."

FRA_continue_the_fight2:0 "Poursuivre le combat"
FRA_continue_the_fight2_desc:0 "Il est temps de reconstruire notre armée."

FRA_the_free_french_navy2:0 "Organiser la marine en exil"
FRA_the_free_french_navy2_desc:0 "La mer est le premier front entre l’Empire et la Métropole. Elle sera la première étape de notre reconquête."

FRA_colonial_recruitment2:0 "Recrutement colonial"
FRA_colonial_recruitment2_desc:0 "Le sang remboursera le prix payé par [FRA.GetNameDef] pour leur illumination progressive."

FRA_prepare_for_our_return:0 "Préparer notre retour"
FRA_prepare_for_our_return_desc:0 "Seules des opérations amphibies nous permettront de reprendre pied sur la mère patrie."

FRA_prepare_for_our_return2:0 "Préparer notre retour"
FRA_prepare_for_our_return2_desc:0 "Seules des opérations amphibies nous permettront de reprendre pied sur la mère patrie."

FRA_the_regiment_normandie2:0 "Le régiment Normandie"
FRA_the_regiment_normandie2_desc:0 "Comme nous partageons un ennemi commun avec [SOV.GetNameDef], envoyer quelques pilotes à leur secours renforcerait notre effort de guerre commun."

### Règle de jeu bonus ####

FRA_unify_the_metropole:0 "Unifier la Métropole"
FRA_unify_the_metropole_desc:0 "L’Hexagone a été injustement coupé en deux par les traîtres du Sud. Nous devons restaurer une fois pour toutes l’unité [FRA.GetAdjective]."

#### DRAPEAUX ####
front_explosed:0 "Front populaire dissous"
matignon_agreements:0 "Accords de Matignon"
is_vichy_france:0 "Possède l’arbre de priorités de §YVichy France§!"
free_france_advisor_check:0 "Cet officier ne participera pas à un régime collaborationniste."

############################
          #### ÉVÉNEMENTS ####
############################

france.100.t:0 "Victoire du Front populaire aux élections"
france.100.d:0 "Le Front populaire a remporté les élections législatives et obtenu la majorité au Parlement. L’alliance des mouvements de gauche, incluant le Parti Communiste Français (PCF), la Section Française de l’Internationale Ouvrière (SFIO) et le Parti Radical et Socialiste, annonce la formation d’un gouvernement dirigé par le chef de la SFIO, Léon Blum. Les [FRA.GetAdjective] espèrent que le gouvernement Blum mettra en œuvre des réformes sociales pour mettre fin à la crise politique actuelle."
france.100.a:0 "Avec le Front, tout est possible !"

france.154.t:0 "Victoire de la droite aux élections"
france.154.d:0 "Les différents partis de droite, principalement la Fédération républicaine et l’Alliance démocratique, ont remporté les élections législatives et nommé Pierre-Étienne Flandin comme Premier ministre.\n\nLeur plan pour bloquer un nouveau gouvernement de gauche a été couronné de succès, et ils espèrent désormais remettre [FRA.GetNameDef] sur pied, notamment en mettant fin à l’inflation."
france.154.a:0 "[FRA.GetNameDefCap] sera de nouveau forte."

france.101.t:0 "Le Pacte Hoare-Laval"
france.101.d:0 "La presse a révélé au grand public le pacte Hoare-Laval, négocié dans leur dos. Soucieuses de ménager l’Italie, la France et la Grande-Bretagne ont conclu un accord avec Mussolini pour mettre rapidement fin à la Seconde guerre italo-éthiopienne, en concédant des territoires éthiopiens. L’objectif affiché est de préserver l’indépendance du pays, mais tout a été fait sans son aval. Droite et gauche dénoncent à l’unisson un acte d’apaisement envers Mussolini qui ferait de l’Éthiopie un simple État fantoche. Albert Sarraut dirigera le gouvernement jusqu’aux élections."
france.101.a:0 "Pierre Laval doit démissionner."

france.102.t:0 "Démission de Léon Blum"
france.102.d:0 "Avec une inflation atteignant 46 %, l’imposition de la semaine de 40 heures s’est révélée très inefficace, l’industrie ayant eu du mal à s’y adapter. La confusion économique a freiné l’effort de réarmement, tandis que la rapide montée en puissance de l’armement [GER.GetAdjective] a contraint Blum à abandonner les programmes de réformes sociales du Front populaire, sur lesquels on comptait beaucoup. Léon Blum démissionne, le Parlement lui refusant les moyens de résoudre la crise économique."
france.102.a:0 "Édouard Daladier et les radicaux formeront un nouveau gouvernement."

france.103.t:0 "Déflation !"
france.103.d:0 "En 1936, la France se relevait lentement de la crise économique qui l’avait frappée en 1931. La situation politique instable, la stagnation des salaires et le déficit public posaient déjà de sérieux défis au gouvernement.\n\nMalheureusement, notre attachement à l’étalon-or laisse la déflation freiner la croissance de nos exportations et complique le respect de nos obligations financières. La crise a déjà provoqué l’effondrement des deux tiers de nos exportations. Avec l’évasion massive des capitaux, la situation est alarmante, et le désenchantement de la classe ouvrière pour la politique ne fait qu’aggraver nos problèmes."
france.103.a:0 "Nous devons réformer l’économie rapidement."
FRA_deflation_tooltip:0 "§YDébloque des décisions pour réformer l’économie.\n§!"

france.104.t:0 "Accords de Matignon"
france.104.d:0 "Après la victoire électorale du Front populaire, une grève générale massive de la classe ouvrière éclata. Débutée au Havre et accompagnée d’occupations d’usines pour empêcher les lock-outs, elle se propagea rapidement à travers [FRA.GetNameDef]. Plus d’un million d’ouvriers cessèrent le travail. Ce mouvement social suivait immédiatement la victoire électorale du Front populaire pour renforcer sa position. Le nouveau gouvernement de gauche, dirigé par Léon Blum, négocia avec succès des accords sociaux, signés à l’Hôtel Matignon. Tous les travailleurs en bénéficient : droit de grève, congés payés, semaine de 40 heures et suppression des obstacles à l’organisation syndicale."
france.104.a:0 "Mettons en œuvre des réformes sociales."
france.104.b:0 "Nous ne pouvons pas tenir toutes nos promesses."

france.105.t:0 "Les communistes retirent leur soutien"
france.105.d:0 "Mécontent des récentes décisions du gouvernement de gauche, Maurice Thorez, chef du Parti Communiste Français, annonce que les communistes quittent le Front populaire et manifesteront leur mécontentement."
france.105.a:0 "Nous n’avons pas besoin d’eux pour diriger la nation."

france.106.t:0 "Les communistes soutiennent le gouvernement"
france.106.d:0 "Contrairement à d’autres nations, [FRA.GetNameDef] a accepté d’aider les Républicains espagnols pendant la guerre civile. Le cabinet Blum a adopté une politique d’intervention et signé un accord pour l’envoi de munitions et de volontaires. Maurice Thorez, chef du Parti Communiste Français, annonce que les communistes soutiendront la politique de Blum et renforceront le Front."
france.106.a:0 "Socialistes et communistes resteront unis !"

france.107.t:0 "Effondrement du Front populaire"
france.107.d:0 "Après deux années d’activité intense, le Front populaire perdit son élan et ne put que temporiser tandis que la crise européenne s’aggravait. Les travailleurs avaient obtenu de nouveaux droits substantiels, mais une hausse de 46 % des prix annula quasiment l’augmentation de 48 % des salaires. Le chômage resta élevé et la production industrielle globale stagnante. Confronté aux dissensions internes liées à la guerre civile espagnole, à l’opposition de la droite et aux effets persistants de la Grande Dépression, le Front populaire se dissout à l’automne 1938."
france.107.a:0 "Camille Chautemps formera le nouveau gouvernement."

france.108.t:0 "Inviter [BEL.GetNameDef] et [LUX.GetNameDef]"
france.108.d:0 "Pour contenir une possible résurgence de l’expansionnisme agressif des anciennes puissances centrales, [FRA.GetNameDef] a demandé que [BEL.GetNameDef] et [LUX.GetNameDef] rejoignent les Alliés afin de stopper les ambitions de [GER.GetLeader]."
france.108.a:0 "Nous devons protéger le Benelux."
france.108.b:0 "Nous ne voulons pas mettre [GER.GetLeader] en colère."

france.109.t:0 "[ENG.GetNameDefCap] accepte l’alliance"
france.109.d:0 "[ENG.GetNameDefCap] approuve nos efforts et a accepté l’invitation de [BEL.GetNameDef] et [LUX.GetNameDef] à rejoindre l’alliance."
france.109.a:0 "Heureusement, nous pouvons nous protéger contre [GER.GetNameDef]."

france.110.t:0 "[ENG.GetNameDefCap] refuse l’alliance"
france.110.d:0 "Malgré nos efforts pour soutenir les Alliés, notre tentative la plus récente de rapprochement a été accueillie avec scepticisme. [ENG.GetNameDefCap] a refusé d’accepter [BEL.GetNameDef] et [LUX.GetNameDef] dans l’alliance."
france.110.a:0 "Ils seront une cible facile pour [GER.GetLeader] !"

france.111.t:0 "Coup de La Cagoule"
france.111.d:0 "La Cagoule, officiellement appelée Comité secret d’action révolutionnaire, est un groupe [FRA.GetAdjective] fascisant et anticommuniste. Il pratique assassinats, attentats, sabotages d’armements et autres actions violentes pour accroître l’instabilité politique. Avec l’aide de l’état-major, ils exécutent aujourd’hui un coup d’État. La loi martiale est proclamée et, avec les changements en cours, la suite ne devrait guère être différente."
france.111.a:0 "L’état-major confie le pouvoir à Pétain."
france.111.b:0 "Le général Franchet d’Espèrey doit diriger le pays."

france.112.t:0 "Référendum nationaliste"
france.112.d:0 "La popularité du Parti Populaire Français a explosé, et de nombreux nationalistes prétendent désormais incarner la volonté du peuple. Jacques Doriot a exigé un référendum. Il souhaite rejouer les élections législatives et former une coalition avec les conservateurs et les radicaux pour mettre fin à la crise politique. Le gouvernement, impuissant et impopulaire, a accepté ses demandes. Quelques jours plus tard, la coalition remportait la majorité au Parlement et pouvait constituer un nouveau gouvernement."
france.112.a:0 "Doriot dirigera le nouveau gouvernement."

france.113.t:0 "[FRA.GetNameDefCap] revendique la Wallonie"
france.113.d:0 "[FRA.GetNameDefCap] a revendiqué la Wallonie et nous a envoyé un ultimatum. [FRA.GetLeader] la considère comme « un territoire [FRA.GetAdjective] légitime, séparé de la mère patrie par les accidents de l’histoire ». Il est clair qu’ils envisagent sérieusement une invasion si nous ne cédons pas rapidement."
france.113.a:0 "Nous ne pouvons pas lutter contre eux."
france.113.b:0 "Jamais nous ne céderons nos terres sans combattre !"
france.114.t:0 "[BEL.GetNameDefCap] accepte"
france.114.d:0 "[BEL.GetNameDefCap] a cédé à notre demande et nous a donné la Wallonie."
france.114.a:0 "Les Wallons sont désormais [FRA.GetAdjective]."

france.115.t:0 "[BEL.GetNameDefCap] refuse"
france.115.d:0 "[BEL.GetNameDefCap] refuse de céder à notre demande et se prépare à combattre."
france.115.a:0 "Ils connaissent les conséquences."

france.116.t:0 "Demande de partage de [SWI.GetNameDef]"
france.116.d:0 "[FRA.GetNameDefCap] prévoit de partager [SWI.GetNameDef] en deux, nous revenant la partie est. Devons-nous accepter ?"
france.116.a:0 "Oui, ce pays doit disparaître de la carte !"
france.116.b:0 "Non, le moment n’est pas venu."

france.117.t:0 "[GER.GetNameDefCap] accepte"
france.117.d:0 "[GER.GetLeader] a accepté notre plan de partage de [SWI.GetNameDef], affirmant que désormais, les [FRA.GetAdjective] et les [GER.GetAdjective] dominent l’Europe !"
france.117.a:0 "Grâce à nos nouveaux amis, l’Europe sera à nous !"

france.118.t:0 "[GER.GetNameDefCap] refuse"
france.118.d:0 "[GER.GetLeader] a refusé notre plan de partage de [SWI.GetNameDef], affirmant que la situation politique mondiale n’était pas encore prête."
france.118.a:0 "Une terrible erreur."

france.119.t:0 "Retour de Pétain au gouvernement"
france.119.d:0 "La Seconde Guerre mondiale a commencé, et Pétain avait déjà refusé plusieurs fois d’entrer au gouvernement. Il critique le Parlement pour le mauvais état de l’armement [FRA.GetAdjective], le manque de préparation et les coupes budgétaires de l’entre-deux-guerres. Cependant, en temps de guerre, la haute réputation de Pétain comme doyen des soldats [FRA.GetNameDef] depuis la mort de Foch, et comme le plus humain de nos commandants militaires, justifie que nous exigions son retour au gouvernement."
france.119.a:0 "Pétain unira le pays."

france.122.t:0 "Le cabinet démissionne"
france.122.d:0 "La Chambre des députés a élu Reynaud Premier ministre, mais à une seule voix près, la plupart de son parti s’étant abstenus. Le nouveau gouvernement est précaire ; beaucoup à droite exigent que Reynaud attaque [SOV.GetNameDef]. La Chambre a aussi imposé que Daladier, que Reynaud tient pour personnellement responsable de la faiblesse de [FRA.GetNameDef], devienne son ministre de la Défense nationale et de la Guerre."
france.122.a:0 "Paul Reynaud dirigera le nouveau gouvernement."

france.123.t:0 "Restauration de la monarchie"
france.123.d:0 "Aujourd’hui, le pape Pie XI a intronisé Jean d’Orléans comme roi des Français. Le nouveau souverain a annoncé qu’il guiderait le pays en ces temps incertains."
france.123.a:0 "Vive le Roi !"
france.123.b:0 "Maintenons Charles Maurras à la tête du pays."

france.124.t:0 "Invitation à la faction [FRA.GetAdjective]"
france.124.d:0 "Pour renforcer une nouvelle alliance et contenir une possible résurgence de l’expansionnisme agressif des anciennes puissances centrales, [FRA.GetNameDef] nous a demandé de les rejoindre dans une alliance destinée à unir ces nations."
france.124.a:0 "Avec plaisir."
france.124.b:0 "[Root.GetNameDefCap] suivra sa propre voie."

france.125.t:0 "[From.GetNameDefCap] rejoint la faction [FRA.GetAdjective]"
france.125.d:0 "Notre plan visant à freiner l’influence [GER.GetAdjective] en Europe progresse. [From.GetLeader] approuve nos efforts et a accepté notre invitation à rejoindre une alliance."
france.125.a:0 "Nous sommes un pas plus près de bâtir une faction solide."

france.126.t:0 "[From.GetName] refuse l’alliance [FRA.GetAdjective]"
france.126.d:0 "Malgré nos efforts pour offrir aide et soutien, notre dernière tentative de rapprochement a été accueillie avec scepticisme. [From.GetLeader] a refusé de rejoindre l’alliance, doutant peut-être de nos intentions ou craignant qu’une trop grande proximité fasse de lui une cible."
france.126.a:0 "Ils pourraient déjà être une cible, sans le savoir !"

france.127.t:0 "Le sort du Benelux"
france.127.d:0 "Avec l’annexion de la Wallonie, la frontière face à [GER.GetNameDef] est affaiblie. Pour nous protéger, nous devons convaincre le Benelux de suivre notre politique."
france.127.a:0 "Le nord-est sera sécurisé."

france.128.t:0 "Coup d’État communiste"
france.128.d:0 "Aujourd’hui, alors que la direction [Root.GetRulingParty] et l’armée se préparaient à une révolte d’ampleur nationale, plusieurs officiels du gouvernement [Root.GetAdjective] ont rapidement placé [Root.GetLeader] en résidence surveillée et engagé des négociations avec les communistes.\n\nSous prétexte de préserver l’ordre, ces négociations visaient en réalité à garantir des postes dans le nouvel État socialiste à ceux qui coopéreraient. Le coup fut achevé avant que quiconque puisse réagir, et ceux qui s’y seraient opposés sont désormais emprisonnés, exilés ou exécutés par le nouveau régime."
france.128.a:0 "Un vrai communisme est nécessaire pour survivre."
france.128.b:0 "La CGT prendra la tête du pays."
france.128.c:0 "[FRA.GetNameDefCap] ne sera pas une marionnette des [SOV.GetAdjective] !"

france.129.t:0 "Accord de coopération économique"
france.129.d:0 "Pour assurer une coopération militaire parfaite, nous devons définir certains accords économiques et logistiques avec [ENG.GetNameDef]. Maintenant que le traité est signé, que doivent prioriser les Alliés ?"
france.129.a:0 "Partager les nouvelles technologies électroniques et industrielles."
france.129.b:0 "Coordonner notre logistique et nos plans militaires."
france.129.c:0 "Imposer une sanction économique à [GER.GetNameDef]."

france.130.t:0 "Nommer un concepteur de matériel"
france.130.d:0 "Pour répondre aux besoins en équipement de notre armée, nous pouvons recruter un concepteur de matériel. Que devons-nous choisir ?"
france.130.a:0 "MAB"
france.130.b:0 "APX"
france.130.c:0 "De Dion-Bouton"
france.130.e:0 "Garder l’option pour plus tard"

france.131.t:0 "Nommer un concepteur de chars"
france.131.d:0 "Pour répondre aux besoins en équipement de notre armée, nous pouvons recruter un concepteur de chars. Que devons-nous choisir ?"
france.131.a:0 "Lorraine-Dietrich"
france.131.b:0 "Berliet"
france.131.c:0 "Delaunay-Belleville"
france.131.e:0 "Garder l’option pour plus tard"

france.133.t:0 "Ultimatum [FRA.GetAdjective]"
france.133.d:0 "[FRA.GetNameDefCap] nous met la pression pour signer un traité « d’assistance mutuelle » avec eux, qui leur donnerait le droit de stationner des forces sur notre territoire ! Ce n’est rien d’autre qu’une tentative à peine voilée d’annexer notre pays, mais nous pouvons difficilement résister à leurs troupes déjà massées à notre frontière."
france.133.a:0 "Accepter l’inévitable."
france.133.b:0 "Ils devront prendre nos terres par la force !"

france.134.t:0 "[LUX.GetNameDefCap] cède"
france.134.d:0 "[LUX.GetNameDefCap] a cédé à nos exigences. Nous avons remplacé le gouvernement actuel par un gouvernement anti-allemand, et désormais ils suivront notre volonté."
france.134.a:0 "Ils sont protégés de [GER.GetNameDef]."

france.135.t:0 "[LUX.GetNameDefCap] refuse notre offre"
france.135.d:0 "[LUX.GetNameDefCap] a outrageusement décidé de refuser notre généreuse offre de pacte d’assistance mutuelle contre l’Allemagne ! Nous devons les aligner de force au plus vite !"
france.135.a:0 "Nous devons protéger les [LUX.GetAdjective] de [GER.GetNameDef]."

france.136.t:0 "Ultimatum [FRA.GetAdjective]"
france.136.d:0 "[FRA.GetNameDefCap] nous met la pression pour signer un traité « d’assistance mutuelle » avec eux, qui leur donnerait le droit de stationner des forces sur notre territoire ! Ce n’est rien d’autre qu’une tentative à peine voilée d’annexer notre pays, mais nous pouvons difficilement résister à leurs troupes déjà massées à notre frontière."
france.136.a:0 "Accepter l’inévitable."
france.136.b:0 "Ils devront prendre nos terres par la force !"

france.137.t:0 "[BEL.GetAdjective] cède"
france.137.d:0 "[BEL.GetNameDefCap] a cédé à nos exigences. Nous avons remplacé le gouvernement actuel par un gouvernement anti-allemand, et désormais ils suivront notre volonté."
france.137.a:0 "Ils sont protégés de [GER.GetNameDef]."

france.138.t:0 "[BEL.GetNameDefCap] refuse notre offre"
france.138.d:0 "[BEL.GetNameDefCap] a outrageusement décidé de refuser notre généreuse offre de pacte d’assistance mutuelle contre l’Allemagne ! Nous devons les aligner de force au plus vite !"
france.138.a:0 "Nous devons protéger les [BEL.GetAdjective] de [GER.GetNameDef]."

france.139.t:0 "Ultimatum [FRA.GetAdjective]"
france.139.d:0 "[FRA.GetNameDefCap] nous met la pression pour signer un traité « d’assistance mutuelle » avec eux, qui leur donnerait le droit de stationner des forces sur notre territoire ! Ce n’est rien d’autre qu’une tentative à peine voilée d’annexer notre pays, mais nous pouvons difficilement résister à leurs troupes déjà massées à notre frontière."
france.139.a:0 "Accepter l’inévitable."
france.139.b:0 "Ils devront prendre nos terres par la force !"

france.140.t:0 "[HOL.GetNameDefCap] cède"
france.140.d:0 "Les Pays-Bas ont cédé à nos exigences. Nous avons remplacé le gouvernement actuel par un gouvernement anti-allemand, et désormais ils suivront notre volonté."
france.140.a:0 "Ils sont protégés de [GER.GetNameDef]."

france.141.t:0 "[HOL.GetNameDefCap] refuse notre offre"
france.141.d:0 "[HOL.GetNameDefCap] a outrageusement décidé de refuser notre généreuse offre de pacte d’assistance mutuelle contre l’Allemagne ! Nous devons les aligner de force au plus vite !"
france.141.a:0 "Nous devons protéger les [HOL.GetAdjective] de [GER.GetNameDef]."

france.142.t:0 "Offre de protectorat [FRA.GetAdjective]"
france.142.d:0 "[FRA.GetNameDefCap] nous met la pression pour signer un traité de « protectorat » avec eux, qui leur donnerait le droit de stationner des forces sur notre territoire ! Ce n’est rien d’autre qu’une tentative à peine voilée d’annexer notre pays, mais nous pouvons difficilement résister à leurs troupes déjà massées à notre frontière."
france.142.a:0 "Accepter l’inévitable."
france.142.b:0 "Ils devront prendre nos terres par la force !"

france.143.t:0 "[HAI.GetNameDefCap] cède"
france.143.d:0 "[HAI.GetNameDefCap] a cédé à nos exigences. Nous avons remplacé le gouvernement actuel par un gouvernement pro-[FRA.GetAdjective], et désormais ils suivront notre volonté."
france.143.a:0 "Comme il se doit."

france.144.t:0 "[HAI.GetNameDefCap] refuse notre offre"
france.144.d:0 "[HAI.GetNameDefCap] a outrageusement décidé de refuser notre généreuse offre de protectorat ! Nous devons les aligner de force au plus vite !"
france.144.a:0 "Nous devons reprendre notre ancienne colonie par la force désormais."

france.145.t:0 "[FRA.GetNameDefCap] réclame la Catalogne"
france.145.d:0 "[FRA.GetNameDefCap] a revendiqué la Catalogne et nous a envoyé un ultimatum. Ils prendront la province par la force si nous ne la leur donnons pas."
france.145.a:0 "Nous ne pouvons pas nous battre contre eux."
france.145.b:0 "Jamais nous ne céderons nos terres sans combattre !"

france.146.t:0 "L’Espagne accepte"
france.146.d:0 "L’Espagne a cédé à notre demande et nous a donné la Catalogne."
france.146.a:0 "Les Catalans sont désormais [FRA.GetAdjective]."

france.147.t:0 "L’Espagne refuse"
france.147.d:0 "L’Espagne refuse de céder à notre demande et se prépare à combattre."
france.147.a:0 "Ils connaissent les conséquences."

france.148.t:0 "Restauration de l’Empire"
france.148.d:0 "Aujourd’hui, le pape Pie XI a intronisé Napoléon VI comme empereur des Français. Le nouveau souverain a annoncé qu’il guiderait le pays en ces temps incertains."
france.148.a:0 "Vive l’Empereur !"

france.149.t:0 "Mort de Jean d’Orléans"
france.149.d:0 "La nuit dernière, Jean d’Orléans, notre bien-aimé roi, s’est éteint paisiblement dans son sommeil. Malgré son long exil, la providence avait permis son retour dans le royaume avant sa mort, et depuis son retour, il avait bien dirigé notre nation. Son fils, Henri d’Orléans, a désormais repris les rênes du pays, et après son couronnement, il sera connu sous le nom d’Henri VI."
france.149.a:0 "Le roi est mort, vive le roi !"

france.150.t:0 "Les syndicalistes s’emparent du pouvoir !"

france.158.t:0 "Honorer l’accord d’influence ?"
france.158.desc:0 "Nos objectifs ont été atteints et nous contrôlons désormais tous les États disputés de la région du Benelux. Nos partenaires s’attendent à ce que nous respections les stipulations du traité et divisions les terres conformément à l’accord provisoire signé plus tôt. Quelle sera la décision finale de [ROOT.getLeader] ?"
france.158.a:0 "Oui, ce n’est pas seulement notre conquête."
france.158.b:0 "Tout est à nous."
france.159.t:0 "L’Empire français se rapproche de la Pologne et de la Roumanie"
france.159.desc:0 "Dans une tentative de consolider l’influence française et probablement de prévenir toute expansion allemande ou [SOV.GetAdjective], [FRA.GetLeader] a annoncé le rétablissement d’un système continental destiné à défendre les intérêts français à travers l’Europe.\n\nOn a récemment aperçu des diplomates français à [POL.Capital.GetCapitalVictoryPointName] et à [ROM.Capital.GetCapitalVictoryPointName]. Cette nouvelle alliance pourrait forcer l’Allemagne à mener une difficile guerre sur deux fronts et garantirait l’accès français aux précieuses exportations de pétrole roumain."
france.159.a:0 "L’Empire sera la puissance dominante en Europe."
france.159.b:0 "Il est rassurant d’avoir un allié aussi puissant."
france.159.c:0 "Est-ce une nouvelle ère napoléonienne ?"
france.159.d:0 "Ce soi-disant Napoléon doit être arrêté."

# Correctif AAT petit réarmement
france.aat.1.t:0 "Allouer des fonds à un concepteur de chars"
france.aat.1.d:0 "Pour répondre aux besoins en équipement de notre armée, nous pouvons financer l’une des compagnies de conception de chars. Laquelle devons-nous choisir ?"
france.aat.1.a:0 "Financer directement Hotchkiss"
france.aat.1.b:0 "Financer directement Renault"
france.aat.1.c:0 "Financer directement APX"

france.aat.2.t:0 "Allouer des fonds à un concepteur de matériel"
france.aat.2.desc:0 "Pour répondre aux besoins en équipement de notre armée, nous pouvons financer l’une des compagnies de conception de matériel. Laquelle devons-nous choisir ?"
france.aat.2.a:0 "Financer directement MAS"
france.aat.2.b:0 "Financer directement Schneider"
france.aat.2.c:0 "Financer directement Panhard"
france.aat.2.d:0 "Financer directement Somua"

r56.news_event.1000.t:0 "Exposition universelle de Paris"
r56.news_event.1000.d:0 "La France est fière de lancer en grande pompe l’Exposition universelle de 1937. À Paris, environ 101 hectares et 44 pays offrent cent-quatre-vingt-dix pavillons thématiques autour des arts et techniques appliqués à la vie moderne. Près de 32 millions de visiteurs sont attendus. À cette occasion, Paris conservera le Palais de Chaillot, le Palais de la Découverte et le Palais de Tokyo. L’esprit et l’art nouveau triomphent partout. Le monde veut croire, pour un instant, que l’exposition parviendra enfin à réunir tout ce qui unit les hommes. Ce qui frappe les esprits, ce sont les pavillons monumentaux russe et allemand se faisant face dans un défi symbolique : une statue de vingt-cinq mètres de « L’Ouvrière et le Kolkhozien » brandissant la faucille et le marteau, opposée à une sculpture géante d’un aigle tenant une croix gammée dans ses serres."
r56.news_event.1000.a:0 "Un immense succès mondial"

