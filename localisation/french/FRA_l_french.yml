 FRA_repatriate_the_remains_of_napoleon_ii_desc:0 "Napoléon II, prince de Rome, plus connu sous le nom de « l’Aiglon », était le seul fils de Napoléon le Grand et de Marie-Louise d’Autriche. Il est mort en 1832 et fut enterré à Vienne. Il est temps de réunir le père et le fils et de lui offrir l’inhumation impériale qu’il mérite au Dôme des Invalides."

