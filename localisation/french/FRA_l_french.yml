 france.150.d:0 "À la suite d’un vaste appel à la grève lancé par la CGT, dont l’influence ces derniers mois avait atteint un niveau où le gouvernement fut contraint à des compromis de plus en plus drastiques, des centaines de milliers d’ouvriers se sont mobilisés à Paris en direction du palais Bourbon, ce qui rappelait à beaucoup les émeutes du 6 février 1934. Ces derniers ont alors forcé l’entrée du parlement tandis que, dans le reste de la ville, les désertions dans l’armée et les violences intenses n’ont pu être contenues par la police.\n\nSous la direction de Léon Jouhaux, ceux-ci ont proclamé la fin de la Troisième République et la transition vers un régime anticapitaliste et syndicaliste."
 france.150.a:0 "Les ouvriers sont désormais aux commandes."

 france.151.t:0 "Mort de Franchet d’Espèrey"
 france.151.d:0 "Louis Félix Marie François Franchet d’Espèrey, maréchal et chef d’État [FRA.GetAdjective], est décédé dans la nuit. Il a été inhumé avec les honneurs militaires avant d’être transféré aux Invalides.\n\nLa mort du maréchal a été soudaine pour de nombreux [FRA.GetAdjective], ainsi que pour le gouvernement qui n’avait prévu aucune procédure de succession. Celui-ci a donc convoqué d’urgence les ministres afin de décider de son successeur.\n\nPour beaucoup, le choix naturel est Henri Giraud, ministre de la Guerre, qui fut très proche de Franchet d’Espèrey tout au long de sa carrière militaire.\n\nCependant, un autre candidat peut rivaliser avec Giraud : François Mitterrand, ministre de l’Intérieur, qui, bien que simple journaliste il y a encore quelques années, a su gravir les échelons du gouvernement à toute vitesse, s’attirant ainsi une excellente réputation qui pourrait jouer en sa faveur."
 france.151.a:0 "Giraud est le choix évident."
 france.151.b:0 "Mitterrand semble prometteur."

 france.152.t:0 "Victoire du Front populaire en [FRA.GetNameDef]"
 france.152.d:0 "Le Front populaire, une alliance politique regroupant une grande partie des mouvements [FRA.GetAdjective] de gauche, dont la SFIO, le Parti radical et le Parti communiste, a remporté les élections législatives [FRA.GetAdjective] avec 57 % des voix. De nombreuses grèves ont été organisées en soutien au front. Léon Blum, dirigeant de la SFIO, a été nommé président du Conseil.\n\nLeur programme repose sur la défense de la démocratie, principalement par leur opposition aux ligues d’extrême-droite, leur pacifisme et la mise en place de nombreuses réformes sociales comme les congés payés ainsi que la volonté de relancer l’économie par la consommation."
 france.152.a:0 "Tout est possible !"
 france.152.b:0 "Bonne chance à eux."
 france.152.c:0 "Ce ne sont rien d’autre que de répugnants bolcheviques."

 france.153.t:0 "Victoire de la droite en [FRA.GetNameDef]"
 france.153.d:0 "Les élections législatives [FRA.GetAdjective] ont vu les différents partis de droite, en particulier la Fédération républicaine et l’Alliance démocratique, obtenir la majorité des voix et ainsi vaincre la tentative du Front populaire. Principalement unis dans leur anticommunisme et leur antisocialisme, leur victoire peut également être liée à la montée d’un mouvement encore plus extrémiste en [FRA.GetNameDef].\n\nPierre-Étienne Flandin, chef de l’Alliance démocratique et perçu comme une figure de rassemblement de la droite, a été nommé président du Conseil et a formé un gouvernement comprenant des membres des principaux partis de la coalition."
 france.153.a:0 "Nous allons rendre [FRA.GetNameDef] plus fort."
 france.153.b:0 "Peut-être ramèneront-ils la stabilité à [FRA.GetNameDef]."
 france.153.c:0 "Les élections ne portent que des capitalistes au pouvoir."

 FRA_economic_reforms:0 "Réformes économiques"
 FRA_economic_reforms_desc:0 "L’économie [FRA.GetAdjective] est dans une situation précaire. Nous devons initier des réformes économiques pour éliminer l’inflation, stabiliser le franc et réduire le déficit national."
 FRA_devaluation:0 "Dévaluation du franc"
 FRA_devaluation_desc:0 "Le seul moyen efficace de sortir rapidement de la déflation est de dévaluer la monnaie, plusieurs fois si nécessaire."
 FRA_assimilate_wallonia:0 "Assimiler la Wallonie"
 FRA_divide_catalogne_into_departments:0 "Diviser la Catalogne en départements"
 FRA_budget_deficit_law:0 "Loi sur le déficit budgétaire"
 FRA_budget_deficit_law_desc:0 "Nous devons réduire le déficit national en prenant des mesures drastiques comme des coupes dans les dépenses publiques."
 FRA_exchange_rate_stabilisation:0 "Stabilisation du taux de change"
 FRA_exchange_rate_stabilisation_desc:0 "Les exportations ont chuté à cause de la valeur trop élevée du franc. Nous pouvons créer un fonds de stabilisation des changes pour lutter contre une appréciation excessive de la monnaie et la fuite des capitaux."
 FRA_agriculture_national_office:0 "Office national de l’agriculture"
 FRA_agriculture_national_office_desc:0 "Pour stabiliser le marché des céréales, nous pourrions créer un nouvel office chargé de contrôler ses importations/exportations et de fixer un prix équitable."
 FRA_bank_france:0 "Nationaliser la Banque de France"
 FRA_bank_france_desc:0 "Nous avons déjà réformé le statut de la Banque de France en 1936, mais pour reprendre le contrôle de la situation économique, nous devons la nationaliser."
 FRA_national_department_state_market:0 "Département national des marchés publics"
 FRA_national_department_state_market_desc:0 "Ce nouvel office centralisera les commandes publiques et rendra les crédits aux entreprises plus flexibles."

 #### NATIONALISATION ####
 FRA_nationalisation:0 "Mesures de nationalisation"
 FRA_nationalisation_desc:0 "Avec le budget des Fonds nationaux de défense, nous pouvons imposer la nationalisation de fabricants pour gagner en efficacité de production. Toutefois, cela dégradera nos relations avec les industriels, et §Ril ne sera pas possible de le faire en temps de guerre§!."
 FRA_nationalize_industy:0 "Intégration des industries civiles"
 FRA_nationalize_industy_desc:0 "Nous pouvons nationaliser des entreprises industrielles pour accroître nos usines civiles, mais elles ne seront plus disponibles dans notre gouvernement à l’avenir."
