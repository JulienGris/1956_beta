indochina.1.t:0 "[FRA.GetNameDefCap] cède à [JAP.GetNameDef]"
indochina.1.d:0 "[FRA.GetNameDefCap] a ordonné à notre gouvernement de céder le Tonkin et le sud de l’Indochine à [JAP.GetNameDef]. Ces territoires sont les plus importants pour nous, regroupant la majorité des ressources, de la population et de l’industrie de toute l’Indochine. Allons-nous obéir ou résister ?"
indochina.1.a:0 "Nous ne pouvons pas céder !"
indochina.1.b:0 "Nous devons obéir aux ordres."

