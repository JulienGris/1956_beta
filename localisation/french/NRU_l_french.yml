l_french:

 NRU_commander_ridge_phosphate:0 "Dépôts de phosphate de Command Ridge"
 NRU_commander_ridge_phosphate_desc:0 "Command Ridge, ou pic Janor en nauruan, est le point culminant de l’île, et la plupart des gisements de phosphate s’y trouvent. \n \nL’exploitation du phosphate est pratiquée par les puissances européennes sur Nauru depuis son occupation par l’Allemagne durant la guerre civile nauruane.\nLe phosphate apporte à Nauru à la fois des avantages et des inconvénients : nous devons veiller à ne pas en extraire trop ni trop peu, sous peine de provoquer l’effondrement de l’économie."
 NRU_commander_ridge_phosphate_2:0 "Dépôts de phosphate de Command Ridge"
 NRU_commander_ridge_phosphate_2_desc:0 "Command Ridge, ou pic Janor en nauruan, est le point culminant de l’île, et la plupart des gisements de phosphate s’y trouvent. \n \nL’exploitation du phosphate est pratiquée par les puissances européennes sur Nauru depuis son occupation par l’Allemagne durant la guerre civile nauruane.\nLe phosphate apporte à Nauru à la fois des avantages et des inconvénients : nous devons veiller à ne pas en extraire trop ni trop peu, sous peine de provoquer l’effondrement de l’économie."
 NRU_commander_ridge_phosphate_3:0 "Dépôts de phosphate de Command Ridge"
 NRU_commander_ridge_phosphate_3_desc:0 "Command Ridge, ou pic Janor en nauruan, est le point culminant de l’île, et la plupart des gisements de phosphate s’y trouvent. \n \nL’exploitation du phosphate est pratiquée par les puissances européennes sur Nauru depuis son occupation par l’Allemagne durant la guerre civile nauruane.\nLe phosphate apporte à Nauru à la fois des avantages et des inconvénients : nous devons veiller à ne pas en extraire trop ni trop peu, sous peine de provoquer l’effondrement de l’économie."
 NRU_reap_the_benefits_idea:0 "Récolter les bénéfices"
 NRU_phosphate_reservers:0 "Commerce du phosphate nauruan"
 NRU_phosphate_reservers_majors:0 "Commerce du phosphate nauruan"
 NRU_tribal_council:0 "Chefs de Nauru"
 NRU_tribal_council_desc:0 "Nauru compte 10 tribus, chacune dirigée par un chef qui reçoit ses ordres du roi. Ces tribus sont les §YEamwit, Eamwitmwit, Eaoru, Eamwidara, Iruwa, Eano, Deiboe, Ranibok, Emea et Emangum.§!" #Emea est le lieu de naissance du roi Aweida, et la dynastie porte le nom de cette tribu, mais celle-ci conserve son propre chef.
 NRU_oppression_of_opposition:0 "Oppression de l’opposition"
 NRU_riots_of_48:0 "Émeutes nauruanes de 48"

 # ARBRES DE PRIORITÉS

 NRU_establish_nauru_pacific_line:0 "Établir la ligne pacifique de Nauru"
 NRU_establish_nauru_pacific_line_desc:0 "Établir la ligne pacifique de Nauru est vital pour que nous puissions commercer avec d’autres nations et assurer notre subsistance."
 NRU_continue_phosphate_mining:0 "Poursuivre l’exploitation du phosphate"
 NRU_continue_phosphate_mining_desc:0 "L’exploitation du phosphate est pratiquée à Nauru depuis des années. Le phosphate est notre principale ressource et peut-être notre SEULE ressource. Si nous cessons de l’extraire, nous risquons une dépression pire que tout ce que nous avons connu."
 NRU_further_phosphate_extraction:0 "Extraction de phosphate"
 NRU_further_phosphate_extraction_desc:0 "L’extraction du phosphate est notre premier pas, en tant que nouveau pays, vers la construction de l’avenir."
 NRU_futher_phosphate_extracion_two:0 "Extraction accrue de phosphate"
 NRU_futher_phosphate_extracion_two_desc:0 ""
 NRU_researchers_abroad:0 "Inviter des chercheurs étrangers"
 NRU_researchers_abroad_desc:0 "Inviter des chercheurs étrangers peut grandement nous aider sur le plan économique."
 NRU_start_exporting_phosphate:0 "Préparatifs à l’exportation"
 NRU_start_exporting_phosphate_desc:0 "Nous avons commencé l’exploitation à grande échelle du phosphate. Il est peut-être temps de nous ouvrir au monde ?"
 NRU_free_market:0 "Le libre marché"
 NRU_free_market_desc:0 "Ouvrons-nous au libre marché !"
 NRU_reap_the_benefits:0 "Récolter les bénéfices"
 NRU_reap_the_benefits_desc:0 "Nous y sommes parvenus : nous vendons du phosphate à tout va. Récoltons les bénéfices sans nous retourner…"
 NRU_britian_phosphate:0 "Se rapprocher de l’Occident"
 NRU_britian_phosphate_desc:0 "À l’aube d’une nouvelle décennie, il est évident que la voie de la démocratie guidera l’avenir partout. Nous suivrons ce chemin comme nos voisins et aiderons nos alliés à poser les fondations des démocraties de demain."
 NRU_japanese_phosphate:0 "Coopération avec le Japon"
 NRU_japanese_phosphate_desc:0 "Le Japon a montré qu’il ne fallait pas le sous-estimer, et cela vaut aussi pour nous. Si nous vendons notre phosphate aux Japonais au lieu de tenter de leur résister, nous pourrions avoir une chance de survivre à leur offensive dans le Pacifique."
 NRU_soviet_phosphate:0 "L’impensable"
 NRU_soviet_phosphate_desc:0 "Avec la Russie de plus en plus puissante, il semble évident qu’elle puisse tourner ses ambitions vers l’océan Pacifique. Si tel est le cas, mieux vaut être dans leurs bonnes grâces afin d’éviter l’assaut."
 NRU_autonomy_for_the_tribes:0 "Restaurer l’ancien système"
 NRU_autonomy_for_the_tribes_desc:0 "L’ancien système de gouvernement de Nauru reposait sur 12 chefs dirigeant chacun leur tribu, avec un roi comme chef d’État, qui donnait ses ordres aux chefs si nécessaire. Ce système n’a plus été appliqué depuis l’invasion durant la Grande Guerre. Mais maintenant que la monarchie est restaurée, peut-être est-il temps de revenir au passé."
 NRU_core_kiribati:0 "Intégrer le royaume d’Apemama"
 NRU_core_kiribati_desc:0 "Le royaume d’Apemama a été réduit en cendres par les colonialistes britanniques lorsqu’ils proclamèrent leur protectorat sur les îles Gilbert. Ce fut une violation de tous les droits et un acte d’humiliation contre les Gilbertins. Mais nous ne devons pas laisser les Britanniques réduire ce royaume en cendres sans conséquences. Montrons-leur ce que les Apemamans et les Nauruans unis peuvent accomplir !"

 # ÉVÉNEMENTS
 nauru.1.t:0 "Nauru propose un accord sur le phosphate"
 nauru.1.desc:0 "[NRU.GetNameDef] nous a approchés avec une offre : acheter leurs réserves de phosphate, réputées être de la meilleure qualité au monde, en échange d’investissements économiques dans Nauru. Il serait insensé de refuser, car cela bénéficierait autant à nous qu’aux Nauruans.\nMais devons-nous vraiment investir dans une île si éloignée, alors que nous pouvons obtenir du phosphate moins cher ailleurs ?"
 nauru.1.a:0 "Avec plaisir !"
 nauru.1.b:0 "Quelle blague…"

 nauru.2.t:0 "Nauru propose un accord sur le phosphate"
 nauru.2.desc:0 "[NRU.GetNameDef] nous a approchés avec une offre : acheter leurs réserves de phosphate, réputées être de la meilleure qualité au monde, en échange d’investissements économiques dans Nauru. Il serait insensé de refuser, car cela bénéficierait autant à nous qu’aux Nauruans.\nMais devons-nous vraiment investir dans une île si éloignée, alors que nous pouvons obtenir du phosphate moins cher ailleurs ?"
 nauru.2.a:0 "Ce serait en effet insensé de refuser"
 nauru.2.b:0 "Un Nauru quoi ?"

 nauru.3.t:0 "Pas d’accord !"
 nauru.3.desc:0 ""
 nauru.3.a:0 "Zut alors !"

 nauru.4.t:0 "Nauru propose un accord sur le phosphate"
 nauru.4.desc:0 "[NRU.GetNameDef] nous a approchés avec une offre : acheter leurs réserves de phosphate, réputées être de la meilleure qualité au monde, en échange d’investissements économiques dans Nauru. Il serait insensé de refuser, car cela bénéficierait autant à nous qu’aux Nauruans.\nMais devons-nous vraiment investir dans une île si éloignée, alors que nous pouvons obtenir du phosphate moins cher ailleurs ?"
 nauru.4.a:0 "Ce serait en effet insensé de refuser"
 nauru.4.b:0 "Qui sont-ils pour nous vendre du guano hors de prix ?"

