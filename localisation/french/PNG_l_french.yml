# UNIR LA PAPOUASIE
PNG_assimilate_west_papua:0 "Intégrer la Papouasie occidentale"
PNG_assimilate_west_papua_desc:0 "L’île de Papouasie n’a jamais été totalement unifiée sous un seul régime. Mais maintenant que nous contrôlons toute l’île, nous pourrions être en mesure de l’unir une fois pour toutes."

r56.news_event.1121.t:0 "Éruption à Rabaul"
r56.news_event.1121.desc:0 "« Le volcan Rabaul est l’un des plus actifs et des plus dangereux de Papouasie-Nouvelle-Guinée », une citation célèbre de nombreux volcanologues vient d’être confirmée, puisque Vulcan et Tavurvur sont entrés en éruption simultanément, causant la mort de 507 personnes et détruisant entièrement la ville de Rabaul. Le ciel s’est rempli de fumée volcanique, obscurcissant l’horizon pendant des heures, et Rabaul a été laissée en ruines. Le gouvernement du Mandat a été transféré dans la ville portuaire plus sûre de Lae, loin de toute activité volcanique. Jusqu’à présent, aucun rapport ne précise les prochaines mesures que le gouvernement australien entend prendre, mais il semble probable que Rabaul ne se remettra presque jamais de cet événement gigantesque et catastrophique."
r56.news_event.1121.a:0 "Un désastre total. Paix à leurs âmes."
r56.news_event.1121.b:0 "Un désastre."
