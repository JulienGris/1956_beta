GER_develop_the_heer:0 "Développer la Heer"
GER_develop_the_heer_desc:0 "Heinz Guderian et d’autres théoriciens radicaux prônent de nouvelles doctrines audacieuses mettant l’accent sur la communication, l’identification du 'Schwerpunkt' et les concentrations locales de forces combinées. Leur donner carte blanche pourrait éviter les boucheries de la Grande Guerre."
GER_luftwaffe_innovations:0 "Innovations de la Luftwaffe"
GER_luftwaffe_innovations_desc:0 "Les guerres modernes ne peuvent être gagnées sans la domination du ciel. Nous devons tout mettre en œuvre pour développer notre force aérienne !"

GER_afghanistan_friend_vanilla:0 "Se lier d’amitié avec l’Afghanistan"
GER_afghanistan_friend_vanilla_desc:0 "Le [AFG.GetName] est une nation en pleine modernisation qui, ces dernières années, a établi des relations solides avec le gouvernement [GER.GetAdjective]. Si nous parvenons à les rallier à notre cause, ils constitueront une porte d’entrée idéale vers le reste de l’Asie centrale."

