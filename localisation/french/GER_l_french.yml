# Diplomatie moyen-orientale
GER_middle_eastern_diplomacy_category:0 "Diplomatie au Moyen-Orient"
GER_middle_eastern_diplomacy_category_desc:0 "Avec les guerres qui font rage en Europe et l’avenir de l’Allemagne incertain, nous devons travailler à obtenir du soutien et établir des contacts avec les pays du Moyen-Orient tels que l’Afghanistan et la Perse. Ils pourraient s’avérer très importants sur le plan politique et stratégique, car ils partagent des frontières avec beaucoup de nos ennemis et possèdent de nombreuses ressources pétrolières."
GER_middle_eastern_diplomacy:0 "Diplomatie au Moyen-Orient"
GER_pro_german_propaganda:0 "Propagande pro-[GER.GetAdjective]"
GER_spread_pro_german_propaganda:0 "Diffuser de la propagande en [FROM.GetName]"
GER_send_german_advisors:0 "Envoyer des conseillers militaires en [FROM.GetName]"
GER_military_advisors:0 "Conseillers militaires [GER.GetAdjective]"
GER_invite_FROM_to_faction:0 "Inviter [FROM.GetName] à [ROOT.GetFactionName]"
GER_middle_eastern_diplomacy_desc:0 "Avec les guerres qui font rage en Europe et l’avenir de l’Allemagne incertain, nous devons travailler à obtenir du soutien et établir des contacts avec les pays du Moyen-Orient tels que l’Afghanistan et la Perse. Ils pourraient s’avérer très importants sur le plan politique et stratégique, car ils partagent des frontières avec beaucoup de nos ennemis et possèdent de nombreuses ressources pétrolières."

form_country_czechia_required_states_tt:0 "Contrôle tous les États §Ytchèques§!."

r56.ger.17.t:0 "L’Allemagne offre sa protection en échange de concessions"
r56.ger.17.d:0 "Le gouvernement impérial allemand nous a proposé un accord qui verrait le retour de leur territoire perdu en échange de notre sécurité sous leur influence, en tant que dominion spécial."
r56.ger.17.a:0 "Pour notre sécurité."
r56.ger.17.b:0 "Nous n’avons pas besoin d’eux !"

r56.ger.18.t:0 "La Pologne refuse la protection"
r56.ger.18.d:0 "Le gouvernement polonais a annoncé aujourd’hui qu’il ne céderait pas de territoire en échange de protection. En prenant cette décision, il pourrait désormais avoir besoin de plus de protection qu’avant."
r56.ger.18.a:0 "Qu’ils aillent au diable !"

r56.ger.19.t:0 "La Pologne accepte les conditions"
r56.ger.19.d:0 "Se sentant fortement menacée, la Pologne a accepté nos conditions et a cédé ses territoires orientaux."
r56.ger.19.a:0 "Bien."

r56.ger.20.t:0 "L’Allemagne propose l’unification"
r56.ger.20.d:0 "L’Allemagne propose l’unification"
r56.ger.20.d2:0 "L’Allemagne propose l’unification" #soutien fasciste élevé -> le référendum échouerait
r56.ger.20.a:0 "Que le peuple s’exprime."
r56.ger.20.b:0 "Le destin de l’Autriche est ailleurs."

r56.ger.21.t:0 "L’Autriche refuse l’unification !"
r56.ger.21.d1:0 "Aujourd’hui, le gouvernement autrichien a annoncé qu’il n’autoriserait pas de référendum sur l’unification de l’Autriche avec l’Allemagne. Malgré le soutien populaire et la clameur publique, les figures pro-indépendance au gouvernement ont fixé le cap de leur nation." #échec par blocage
r56.ger.21.d2:0 "Aujourd’hui, le peuple autrichien, influencé par des sentiments pro-indépendance fascistes, a voté contre l’unification de l’Autriche avec l’Allemagne." #échec par fascisme, se déclenche aussi pour l’Autriche
r56.ger.21.a:0 "Une trahison de la démocratie."
r56.ger.21.b:0 "Nous devrions les surveiller."

r56.ger.22.t:0 "L’Allemagne propose un échange territorial"
r56.ger.22.d:0 "Aujourd’hui, l’ambassadeur d’Allemagne a annoncé le désir de son pays de modifier la frontière germano-polonaise d’une manière présentée comme bénéfique aux deux nations. L’accord verrait le territoire polonais de Gdynia transféré à l’Allemagne en échange de la région allemande d’Oberschlesien, reliant ainsi l’Allemagne continentale à son enclave de Prusse orientale. Bien qu’Oberschlesien soit moins développée industriellement que Gdynia et nous ferait perdre notre accès à la mer, nous gagnerions l’acier et l’aluminium de la région, tout en améliorant nos relations avec le gouvernement allemand, augmentant notre population et réduisant les tensions ethniques."
r56.ger.22.a:0 "Gagnant-gagnant !"
r56.ger.22.b:0 "Gdynia est trop importante pour nous."

r56.ger.23.t1:0 "La Pologne approuve le réalignement des frontières"
r56.ger.23.d1:0 "Le gouvernement polonais a clairement indiqué qu’il acceptait la proposition allemande de déplacer la frontière germano-polonaise. Les troupes non locales ont commencé à se retirer de Gdynia, et ses habitants ne s’y sont pas opposés. Il ne reste plus qu’à faire de même."
r56.ger.23.a:0 "C’est réglé."
r56.ger.23.t2:0 "La Pologne refuse l’accord"
r56.ger.23.d2:0 "Le gouvernement polonais a clairement indiqué qu’il n’échangerait pas de territoire avec l’Allemagne, officiellement à cause de la minorité polonaise, mais plus probablement pour des raisons stratégiques liées à la marine et à l’industrie."
r56.ger.23.b:0 "Nous verrons bien."

r56.ger.24.t:0 "L’Allemagne propose la Lituanie contre les territoires germanisés"
r56.ger.24.d:0 "Le gouvernement allemand, ayant établi sa présence en Lituanie, propose un échange où nous recevrions la majeure partie de la Lituanie en échange des territoires largement pro-allemands de Katowice et de Gdynia. Cette manœuvre nous ferait perdre un important port naval et des ressources métalliques, mais nous gagnerions l’industrie lituanienne – ce qu’il en reste – tout en nous permettant de revendiquer l’héritage de la Pologne-Lituanie."
r56.ger.24.a:0 "D’une pierre deux coups."
r56.ger.24.b:0 "Les Lituaniens doivent rester indépendants."

r56.ger.25.d:0 "Après l’assassinat d’Hitler et une baisse de popularité, le gouvernement nazi s’est finalement effondré. Dans tout le pays, des éléments anti-nazis ont émergé : dans le cœur industriel et à travers la politique séparatiste de la Bavière s’est formé un nouveau courant démocrate conservateur. Autour des bastions communistes, notamment Berlin, le peuple s’est également révolté, bien que les villes soient pour l’instant protégées par des garnisons nazies.\n Il nous appartient désormais de décider qui soutenir."
r56.ger.25.a:0 "Se ranger aux côtés des conservateurs est l’option la plus sûre."
r56.ger.25.b:0 "Les communistes apporteront un véritable changement au peuple."
GER_communists_are_pretty_hard_tt: "\n§RLes chances de victoire seront contre nous !§!"
GER_communists_are_pretty_hard_tt_tip:0 "\n\n§HConseil :§! Même si vous pouvez vous concentrer sur les nazis et récupérer quelques États, voire les capituler, le §Hcamp conservateur§! finira probablement par §Hvous vaincre§! ensuite.\n\nEn formant une §Hpetite division mobile§!, vous pourriez §Hrusher§! les §Hvilles cruciales§! des conservateurs pendant qu’ils combattent les nazis."

# Anschluss démocratique
r56.ger.26.d:0 "L’Autriche a voté lors d’un référendum pour s’unir à l’Allemagne. Leur manque d’identité nationale forte et le sentiment pro-allemand général ont provoqué un bouleversement majeur en Europe. Il reste à voir comment les grandes puissances réagiront à cette violation démocratique du traité de Versailles."
r56.ger.26.b:0 "J’adore la démocratie."

r56.ger.27.t: "L’Allemagne propose un accord commercial"
r56.ger.27.d: "[FROM.GetNameDefCap] nous a proposé un traité de coopération dans lequel nous serions compensés financièrement et par une technologie navale en échange des droits sur une de nos petites réserves de pétrole."
r56.ger.27.a: "Leur aide nous serait utile."
r56.ger.27.b: "Nous ne leur faisons pas confiance."

r56.ger.28.t: "L’Allemagne propose d’éliminer la menace [YUG.GetAdjective]"
r56.ger.28.d: "Dans sa lutte contre la menace communiste, l’Allemagne est venue à nous et propose une invasion conjointe de la Yougoslavie. Elle est prête à nous laisser satisfaire nos revendications dans leur poursuite de renverser leur gouvernement communiste."
r56.ger.28.a: "Préparez les forces !"
r56.ger.28.b: "Pas maintenant !"

r56.ger.29.t: "[FROM.GetName] demande d’anciennes colonies en échange de son soutien"
r56.ger.29.d: "La nation allemande réformée a demandé la restitution de quelques possessions historiques mineures en échange de son soutien dans nos guerres actuelles."
r56.ger.29.a: "Cela nous aiderait !"
r56.ger.29.b: "Nous n’avons pas besoin d’eux."

r56.ger.30.t:0 "Les sympathies cachées d’Erich Ludendorff"
r56.ger.30.d:0 "Erich Ludendorff, le conservateur acharné et général en chef durant la Grande Guerre, reste un héros populaire dans l’esprit du peuple [ROOT.GetAdjective]. Bien qu’il ait fortement soutenu le NSDAP au début, il s’est aliéné du parti ces dernières années, au point de mépriser personnellement [GER.GetLeader].\n\nSa popularité est incontestable, et c’est un commandant militaire éprouvé. Peut-être qu’avec un peu de persuasion, il accepterait de se rallier à notre cause. Avec lui à nos côtés, notre force et notre légitimité en seraient considérablement renforcées."
r56.ger.30.a:0 "Espérons qu’il se joigne à nous."

r56.ger.31.t:0 "La santé déclinante de Ludendorff"
r56.ger.31.d:0 "Bien qu’il ait récemment rejoint notre lutte contre les nazis, la santé de Ludendorff recommence à se détériorer. Des complications liées à un cancer du foie font croire à beaucoup qu’il ne s’agit que d’une question de temps avant qu’il ne succombe à sa maladie.\n\nNous pourrions lui permettre de prendre sa retraite et de vivre le temps qui lui reste comme il le souhaite, ou bien lui offrir les meilleurs soins possibles afin qu’il continue à servir."
r56.ger.31.a:0 "Il nous a bien servi, laissons-le prendre sa retraite."
r56.ger.31.b:0 "Trouvons-lui les meilleurs soins possibles !"

r56.ger.32.t:0 "Mort de Ludendorff"
r56.ger.32.d:0 "Erich Ludendorff, l’homme qui nous a tant aidés dans notre cause, est décédé des suites de complications liées à un cancer du foie. Bien que nous ayons longtemps tenté de le soigner pour préserver sa santé, il a toujours voulu servir [GER.GetNameDef] jusqu’à son dernier souffle."
r56.ger.32.a:0 "Un véritable soldat jusqu’à la fin."

r56.ger.33.t:0 "Mort de Ludendorff"
r56.ger.33.d:0 "Erich Ludendorff, l’homme qui nous a tant aidés dans notre cause, est décédé des suites de complications liées à un cancer du foie. Bien qu’à la retraite, il a continué à servir [GER.GetNameDef] dans la sphère civile jusqu’à son dernier souffle."
r56.ger.33.a:0 "Il nous manquera."

r56.ger.37.t:0 "L’armée prend le pouvoir"
r56.ger.37.d:0 "Ce matin, dans ce qui a été décrit comme un coup d’État sans effusion de sang, plusieurs éléments des forces armées ont rapidement encerclé le palais impérial de [GER.GetLeader] et l’ont mis sous siège. Le Kaiser a été contraint de céder une grande partie de ses pouvoirs et de laisser une dictature militaire, dirigée par Kurt von Hammerstein-Equord, gouverner le pays, se réduisant ainsi au rang de simple figure symbolique.\n\nCe développement a suscité des réactions mitigées dans tout [GER.GetNameDef]. Seul l’avenir dira quelles en seront les conséquences à long terme."
r56.ger.37.a:0 "Un développement intéressant."

r56.ger.38.t:0 "Le Kaiser reprend le contrôle du gouvernement"
r56.ger.38.d:0 "À la suite de l’influence croissante de la royauté dans [GER.GetNameDef], le Kaiser a annoncé ce matin qu’il annulait de nombreuses lois restrictives imposées à la suite de l’action militaire, et qu’il rétablissait son commandement sur le gouvernement et l’armée.\n\nBien que cela puisse être impopulaire parmi les élites radicales, il est évident que le Kaiser possède la volonté populaire et le pouvoir pour réussir cette ambitieuse reprise en main."
r56.ger.38.a:0 "L’ordre sera-t-il restauré ?"

r56.ger.43.t:0 "[FROM.GetNameDefCap] demande à envoyer des conseillers militaires"
r56.ger.43.d:0 "Des conseillers militaires [GER.GetAdjective] sont arrivés dans la capitale plus tôt aujourd’hui après de longues discussions avec [GER.GetNameDef] sur une possible coopération militaire entre nos pays. Il semble que [GER.GetNameDef] soit prêt à investir dans notre armée et notre industrie afin de gagner notre soutien. Mais reste à savoir si nous l’accorderons."
r56.ger.43.a:0 "Bienvenue."
r56.ger.43.b:0 "Désolés, non."

r56.ger.44.t:0 "[FROM.GetNameDefCap] rejette"
r56.ger.44.d:0 "Après notre proposition d’un attaché militaire en [FROM.GetNameDefCap], les [FROM.GetAdjective] ont décidé qu’il valait mieux la rejeter. Cela peut être dû à leur alignement politique, qui ne correspond pas à celui de l’Allemagne, mais peut-être à autre chose…"
r56.ger.44.a:0 "Tant pis, leur perte."

r56.ger.45.t:0 "L’Accord naval germano-britannique"
r56.ger.45.d:0 "Depuis la signature de l’Accord naval germano-britannique en 1935, notre marine est limitée à un ratio de 35:100 par rapport à la Royal Navy, que les Britanniques tenaient à maintenir. Cependant, avec l’avenir de l’Europe incertain, nous devrions réévaluer notre position vis-à-vis de cet accord, même si cela pourrait avoir des conséquences avec les Britanniques."
r56.ger.45.a:0 "Au diable l’accord."
r56.ger.45.b:0 "Mieux vaut ne pas les contrarier…"

wtt_germany.83.t:0 "Mort de Guillaume III"
wtt_germany.83.d:0 "La nuit dernière, Guillaume III, notre bien-aimé Kaiser, est décédé d’une crise cardiaque. Malgré son règne court, le destin lui avait permis de gouverner avant sa mort, et depuis, il avait bien dirigé notre nation. Son fils, Wilhelm Friedrich, a maintenant repris les rênes du pays et, après son couronnement, sera connu sous le nom de Guillaume IV."

ger.civil_war.2.t: "[FROM.GetNameDefCap] demande des conseillers militaires"
ger.civil_war.2.desc: "[FROM.GetNameDefCap], dans une situation désespérée, n’a pas reçu beaucoup de soutien de la Wehrmacht dans son implication dans la guerre civile. À court de personnel qualifié, ils demandent le placement temporaire de quelques commandants de rang intermédiaire."
ger.civil_war.2.a: "Une opportunité d’influence et d’expérience !"
ger.civil_war.2.b: "C’est une cause perdue"
character_changes_country_tt: "[THIS.GetName] est transféré à [FROM.GetNameDef]"

ger_brest_litovsk.1.t:0 "[GER.GetNameDefCap] propose la paix !"
ger_brest_litovsk.1.d:0 "[SOV.GetNameDefCap] s’est vu proposer un traité pour mettre fin à la guerre [GER.GetAdjective]-[SOV.GetAdjective] à l’Est. Le traité inclut la cession de plusieurs territoires occidentaux occupés par les [SOV.GetAdjective] aux [GER.GetAdjective] en échange de la paix. Ces termes sont similaires au traité de Brest-Litovsk, qui avait mis fin au conflit germano-soviétique durant la Grande Guerre."
ger_brest_litovsk.1.a:0 "Rejeter les termes !"
ger_brest_litovsk.1.b:0 "Accepter les termes."

# Équilibre des pouvoirs & décisions
GER_monarchist_power_balance:0 "Équilibre des pouvoirs Kaiser-OHL"
GER_army_side:0 "Oberste Heeresleitung"
GER_low_army_influence:0 "Influence militaire minimale"
GER_emerging_army_influence:0 "Influence militaire émergente"
GER_high_army_influence:0 "Forte influence militaire"
GER_total_army_influence:0 "Dictature militaire"
GER_balance_range:0 "Influence égale"
GER_wilhelm_ii_side:0 "Maison de Hohenzollern"
GER_low_kaiser_control:0 "Contrôle du Kaiser minimal"
GER_medium_kaiser_control:0 "Contrôle du Kaiser moyen"
GER_high_kaiser_control:0 "Contrôle du Kaiser important"
GER_total_kaiser_control:0 "Contrôle absolu du Kaiser"

GER_bop_bolster_the_army:0 "Renforcer l’armée"
GER_bop_bolster_the_airforce:0 "Renforcer l’armée de l’air"
GER_bop_bolster_the_navy:0 "Renforcer la marine"
GER_bop_inspect_army:0 "Inspection d’État de l’armée"
GER_bop_inspect_airforce:0 "Inspection d’État de l’armée de l’air"
GER_bop_inspect_navy:0 "Inspection d’État de la marine"
GER_bop_prioritize_military_industry:0 "Prioriser l’industrie militaire"
GER_bop_prioritize_civilian_industry:0 "Prioriser l’industrie civile"
GER_monarchist_bop_prioritize_military_industry:0 "Priorisation de l’industrie militaire"
GER_monarchist_bop_prioritize_civilian_industry:0 "Priorisation de l’industrie civile"
GER_bop_nationalistic_military_parade:0 "Parade militaire nationaliste"
GER_bop_rally_in_honour_of_the_kaiser:0 "Rassemblement en l’honneur du Kaiser"

GER_strong_arm_the_industrialists:0 "Faire pression sur les industriels"
GER_strong_arm_the_industrialists_desc:0 "Nous pouvons « suggérer » aux industriels de contracter des prêts sous forme de bons Mefo au lieu de les demander à la Reichsbank. Ainsi, nous pouvons dissimuler combien d’argent la Reichsbank prête pour investir dans l’industrie lourde tout en obtenant un levier politique sur les industriels de notre pays. Contracter ces prêts privés sous forme de bons Mefo comporte le risque de cannibaliser notre économie, mais de telles craintes sont-elles fondées, vraiment ?"
GER_rally_the_technocrats:0 "Rallier les technocrates"
GER_rally_the_technocrats_desc:0 "Obtenir le soutien des technocrates est essentiel pour nos futurs efforts de guerre."
r56_GER_rally_the_technocrats_idea:0 "Rallier les technocrates"

# Menaces
GER_core_south_tyrol_threat:0 "Revendiquer le Tyrol du Sud"

# Nouveau contenu – catégories déjà existantes un peu confuses
GER_trade_influence_decisions: "Offensives commerciales"
GER_trade_influence_decisions_explain_tt: "Permettent la vassalisation de nations fortement dépendantes."
GER_influence_nation: "Exploiter l’influence sur [FROM.GetName]"
GER_protect_interests_nation: "Protéger les intérêts [ROOT.GetAdjective] en [FROM.GetNameDef]"
GER_coup_nation: "Coup d’État pro-[ROOT.GetAdjective] en [FROM.GetName]"
GER_target_for_hostile_trade_influence: "Peut être visé par des décisions hostiles."
GER_used_original_MR: "A divisé la Pologne avec l’Union soviétique sans céder la Lituanie."
GER_cut_german_trade_ties: "Rompre les liens commerciaux avec l’Allemagne"
GER_hostile_trade_decisions_tt: "§YDébloque des décisions pour créer un but de guerre contre [FROM.GetNameDef] ou utiliser notre influence pour installer un gouvernement plus favorable.§!"
GER_cannot_influence_us_anymore_tt: "§Y[FROM.GetName] ne pourra plus nous influencer ni utiliser son influence pour changer notre gouvernement.§!"
GER_pressure_LIT: "Faire pression sur [LIT.GetName]"
GER_pressure_LIT_desc: "[LIT.GetNameDefCap] dépend fortement de [ROOT.GetName] pour son commerce alimentaire depuis la perte de son port de Klaipéda. Menacer de fermer cette voie commerciale nous donne un levier considérable sur eux."
GER_HOL_free_influence_tt: "Donne 15 points d’influence commerciale §YPorte d’entrée de l’Europe§! sur [HOL.GetNameDef]."

RULE_ALLOW_RELEASE_NATIONS_NOT_GER_KINGDOMS_TOOLTIP:0 "Il n’est pas possible de libérer les royaumes allemands pour le moment."

#Royaumes allemands partagés

GERK_revitalize_old_traditions:0 "Raviver les anciennes traditions [ROOT.GetAdjective]"
GERK_revitalize_old_traditions_desc:0 "Les traditions militaristes de [ROOT.GetNameDef] remontent à plusieurs siècles. Elles constituent la caractéristique essentielle qui unit notre État, notre gouvernement et le socle commun du peuple [ROOT.GetAdjective]."

GERK_root_militarism:0 "Militarisme [ROOT.GetAdjective]"
GERK_root_militarism_desc:0 "Le militarisme a toujours été l’épine dorsale de [ROOT.GetNameDef]. Rien ne justifie que nous n’honorions pas cette tradition et cet héritage."

GERK_factory_of_europe:0 "L’Usine de l’Europe"
GERK_factory_of_europe_desc:0 "[ROOT.GetNameDefCap] possède une longue et fière histoire de production industrielle inégalée, et nous entendons bien perpétuer cette réputation."

GERK_army_with_a_state:0 "Une armée avec un État"
GERK_army_with_a_state_desc:0 "« Une armée avec un État » est l’expression proprement [ROOT.GetAdjective] qui symbolise la puissance et la domination de l’armée au sein de la société [ROOT.GetAdjective]."

GERK_move_towards_german_reunification:0 "Avancer vers la réunification [GER.GetAdjective]"
GERK_move_towards_german_reunification_desc:0 "Le monde germanophone a toujours été destiné à s’unir sous un seul État. Nous ne devons plus laisser ce destin nous échapper."

GERK_continue_motorization:0 "Motorisation de l’armée"
GERK_continue_motorization_desc:0 "L’ère du fantassin à pied touche à sa fin, et nous devons nous adapter pour garder une longueur d’avance. Nous devons nous assurer que nos troupes motorisées soient prêtes et capables de mener la charge afin d’apporter une victoire rapide et décisive."

GERK_field_piece_research:0 "Puissance de feu écrasante"
GERK_field_piece_research_desc:0 "L’infanterie est l’épine dorsale de notre armée, et pour qu’elle excelle, elle a besoin d’un soutien adapté. Nous devons investir massivement dans l’artillerie afin que nos soldats puissent exploiter chaque avantage et anéantir tout ennemi qui se dresse devant eux."

global_reunited_germany:0 "L’Allemagne réunifiée"

GERK_legacy_of_the_zollverein:0 "L’Héritage du Zollverein"
GERK_legacy_of_the_zollverein_desc:0 "Peut-être que le monde germanophone n’était pas destiné à s’unir, mais au moins à travailler ensemble pour une cause commune. Le Zollverein poursuivait exactement cet objectif, et il est temps de le recréer afin que nous soyons plus forts ensemble."

GER_zollverein_faction:0 "Zollverein"

WGR_establish_a_provisional_capital:0 "Établir une capitale provisoire"
WGR_establish_a_provisional_capital_desc:0 "Pour que notre gouvernement fonctionne, il est nécessaire d’établir une capitale provisoire en dehors de Berlin, jusqu’à ce que les circonstances permettent d’y revenir. En aucun cas nous ne devons donner l’impression que ce déplacement est permanent, sans quoi cela serait perçu comme un aveu de faiblesse."
#Certains événements on_action par Fantom

r56_on_action_event.1.t:0 "[GER.GetNameDefCap] change ses orientations politiques !"
r56_on_action_event.1.d:0 "Les changements du paysage politique de [GER.GetNameDef] ont conduit à la formation d’un nouveau système gouvernemental, visant à mener une politique intérieure bien différente de celle de leurs prédécesseurs, avec pour objectif de résoudre les conflits sociaux et de rétablir l’ordre dans le nouvel État.\n\nLeurs diplomates ont déjà annoncé que l’agenda extérieur de l’État [GER.GetAdjective] serait lui aussi profondément bouleversé, incluant la renégociation d’anciens accords économiques, la révision de traités et la remise en cause d’alliances diplomatiques à divers niveaux de puissance.\n\nAu sein de notre administration, les voix s’élèvent sans cesse : [ROOT.getLeader] réorientera-t-il [ROOT.GetHerHis] opinion vers [GER.GetNameDef], ou bien [ROOT.GetSheHe] la maintiendra tant que la situation restera incertaine ?"
r56_on_action_event.1.a:0 "Nous renoncerons à notre position envers eux."
r56_on_action_event.1.b:0 "Un changement de régime n’est rien si les cœurs du peuple restent corrompus !"

wtt_germany.80.t:0 "[GER.GetNameDefCap] exige le Jutland du Sud"
wtt_germany.80.desc:0 "Le gouvernement allemand nous a adressé un ultimatum exigeant le retour du Jutland du Sud. Cette terre fut perdue par l’Allemagne dans les années 1860 avant d’être rendue par le traité de Versailles. Nombre de Danois ethniques vivant dans cette région n’accepteront pas de bonne grâce d’être cédés."
wtt_germany.80.a:0 "Pour protéger notre nation, nous devons céder."
wtt_germany.80.b:0 "Nous ne renoncerons pas à notre sol souverain."

wtt_germany.81.t:0 "[FROM.GetNameDefCap] rend le Schleswig du Nord"
wtt_germany.81.d:0 "[FROM.GetNameDefCap] a accepté de nous rendre le Schleswig du Nord. Ce matin, les dernières garnisons et autorités [FROM.GetAdjective] se sont retirées à la hâte, suivies d’un flot de réfugiés cherchant à franchir la nouvelle frontière avant qu’elle ne se consolide."
wtt_germany.81.a:0 "Enfin, notre frontière nord est rétablie !"

wtt_germany.82.t:0 "[FROM.GetNameDefCap] refuse notre ultimatum"
wtt_germany.82.d:0 "[FROM.GetNameDefCap] a clairement fait savoir qu’il ne rendra pas le Schleswig du Nord, et que toute tentative de notre part pour le reprendre serait considérée comme un acte de guerre."
wtt_germany.82.a:0 "Alors ce sera la guerre."

# expansion communiste par Flor
# événements
r56.ger.46.t:0 "Le Parti appelle à une élection pour la direction"
r56.ger.46.desc:0 "Heinrich Brandler a joué un rôle inestimable durant la guerre civile, dirigeant une grande partie de la résistance contre les fascistes. Il a prouvé qu’il restait un chef-né ! Aujourd’hui, il a lancé une campagne pour devenir le nouveau président du KPD. Il a déjà rallié une large base au sein du parti.\n\nLa Révolution a triomphé en [ROOT.GetNonIdeologyName]. Désormais, de nombreux membres du KPD commencent à remettre en question l’autorité de Moscou. Le président actuel du KPD, Ernst Thälmann, est un stalinien convaincu et depuis longtemps le chef de l’aile gauche du parti. Il bénéficie du soutien de Moscou et de l’influence politique nécessaire pour conserver son poste. En opposition, Heinrich Brandler envisage un retour à la présidence, représentant l’aile droite du KPD. Ce qu’il manque en influence, il le compense par son expérience, ayant déjà dirigé le parti de 1920 à 1923. De plus, Moscou a désigné Ernst Thälmann comme son favori. Berceau du communisme, [ROOT.GetNonIdeologyName] suscite un grand intérêt pour [SOV.GetNameDef]. S’ils interviennent, ils pourraient forcer un résultat qui leur soit favorable..."
r56.ger.46.a:0 "Heinrich Brandler remporte son pari !"
r56.ger.46.b:0 "Thälmann conserve sa position."
r56.ger.46.c:0 "Moscou intervient et Ernst Thälmann reste au pouvoir."

r56.ger.47.t:0 "Heinrich Brandler revient d’exil"
r56.ger.47.desc:0 "Heinrich Brandler est un vétéran de la politique de gauche. Membre fondateur du KPD, il en fut le président de 1920 à 1923, lors de l’« Action de mars » et du soulèvement avorté de 1923, dont il fut tenu pour responsable.\n\nIl tomba en disgrâce auprès de l’URSS comme du KPD après avoir annulé la révolution de 1923. Après plusieurs années passées en Union soviétique, il revint en [GER.GetNonIdeologyName] et fonda le KPD(O), en opposition à la direction du KPD soutenue par Moscou. Il créa également l’Opposition de droite internationale, organisation rivale du Komintern. Après la prise de pouvoir d’Hitler, il partit en exil à Paris où il poursuivit sa lutte contre la ligne communiste de Moscou.\n\nAujourd’hui, il est de retour, vétéran de la politique et syndicaliste, prêt à combattre pour la Révolution !"
r56.ger.47.a:0 "Un atout précieux dans la lutte contre le fascisme."

r56.ger.48.t:0 "Ernst Thälmann réoriente le Parti"
r56.ger.48.desc:0 "La Révolution a triomphé ! [GER.GetNonIdeologyName] est désormais un État socialiste sous la direction d’Ernst Thälmann. Beaucoup ont péri, mais le sacrifice en valait la peine.\n\nThälmann a convoqué une réunion extraordinaire de la direction du parti pour changer son orientation. Moscou ne dictera plus la conduite du KPD ! Il a ainsi exhorté la direction à abandonner les idées de Staline au profit des enseignements de Lénine."
r56.ger.48.a:0 "Une nouvelle voie s’ouvre pour [ROOT.GetNonIdeologyName]."

r56.ger.49.t:0 "Les communistes [GER.GetAdjective] élisent Thälmann"
r56.ger.49.desc:0 "Les nouvelles de [GER.GetNonIdeologyName] viennent de tomber : après deux jours de débats, le comité de direction du KPD a élu un nouveau chef, Ernst Thälmann. Vétéran du parti, il fut longtemps un proche du Komintern et le candidat favori de [SOV.GetNameDef].\n\nCependant, à la surprise de [SOV.GetLeader], quatre heures plus tard, Ernst Thälmann annonça le retrait du KPD du Komintern, ce qui prit de court nombre d’observateurs, y compris dans son propre camp.\n\n« La révolution en [GER.GetNonIdeologyName] ne sera pas contrôlée par des puissances étrangères ! Nous, Allemands, pouvons et devons décider de notre avenir, de notre propre société socialiste ! » – discours d’Ernst Thälmann"
r56.ger.49.a:0 "Un développement intéressant."
r56.ger.49.b:0 "Ils ont trahi la Révolution !"

r56.ger.50.t:0 "Les communistes [GER.GetAdjective] élisent Brandler"
r56.ger.50.desc:0 "La lutte pour la direction en [GER.GetNonIdeologyName] est terminée. Le nouveau président du KPD, et donc le plus haut responsable de [GER.GetNonIdeologyName], est Heinrich Brandler, cofondateur du parti. Après plus d’une décennie d’exil, Brandler retrouve ce poste. Opposant déclaré au Komintern, il est également fondateur de l’Opposition de droite internationale, organisation rivale du Komintern.\n\nBrandler a aussi signé une nouvelle constitution pour [GER.GetNonIdeologyName], visant à renforcer la propriété publique, à abolir les différences de classe et à rebaptiser la nation [GER.GetNameDef]. Moscou reste pour l’instant silencieux, mais il est attendu que le nouveau dirigeant [GER.GetAdjective] soit dénoncé."
r56.ger.50.a:0 "Un développement intéressant."
r56.ger.50.b:0 "Ils ont trahi la Révolution !"

r56.ger.51.t:0 "La formation du Kominform"
r56.ger.51.desc:0 "Aujourd’hui, les délégations soviétiques et [GER.GetAdjective] ont signé l’accord actant la dissolution du Komintern et sa transformation en Kominform, dont [GER.GetNonIdeologyName] devient membre. Les relations entre les deux pays étaient tendues, mais elles se sont améliorées après la victoire communiste durant la guerre civile [GER.GetAdjective].\n\nPour [GER.GetNonIdeologyName], cela consolide la position d’Ernst Thälmann comme secrétaire général, lui qui a toujours entretenu des liens étroits avec ses homologues idéologiques de Moscou. Quant à [SOV.GetNameDefCap], cela lui confère une influence considérable sur [GER.GetNonIdeologyName]. Bien que les deux pays soient théoriquement égaux, beaucoup d’experts soupçonnent une ingérence soviétique dans la politique [GER.GetAdjective]."
r56.ger.51.a:0 "Un développement intéressant, mais attendu."
r56.ger.51.b:0 "Un pas de plus dans la mauvaise direction."

r56.ger.52.t:0 "[SOV.GetNameDefCap] accepte notre proposition"
r56.ger.52.desc:0 "Nous avons soumis à [SOV.GetNameDef] une proposition d’alliance, impliquant coopération diplomatique, économique et militaire. [SOV.GetNameDef] a accepté notre offre !\n\nDans le cadre de cet accord, le Komintern a été dissous et remplacé par le Kominform, mieux adapté à la puissance combinée de nos économies et de nos armées."
r56.ger.52.a:0 "Notre partenariat sera glorieux !"

r56.ger.53.t:0 "[GER.GetNonIdeologyName] propose une alliance"
r56.ger.53.desc:0 "Le ministère [GER.GetAdjective] des Affaires étrangères a présenté une proposition intéressante : former une alliance entre nos deux pays. Ernst Thälmann, dirigeant du KPD, a toujours été proche du Komintern.\nC’est une entreprise diplomatique, économique et militaire colossale. Pour ce faire, [GER.GetNameDef] a proposé la transformation du Komintern en Kominform afin d’établir de nouveaux protocoles pour une alliance fructueuse."
r56.ger.53.a:0 "Unifions nos efforts."
r56.ger.53.b:0 "Ce sont de faux communistes !"

r56.ger.54.t:0 "[GER.GetNameDefCap] demande un exercice militaire conjoint"
r56.ger.54.desc:0 "En tant que membre de la [THIS.GetFactionName], [GER.GetNameDef] a proposé un exercice militaire conjoint. En combinant nos efforts, nos armées pourront mieux coordonner leurs actions et développer de nouvelles tactiques et doctrines.\n\nCependant, cela aurait un coût important pour nous et nous placerait dans une situation désavantageuse en cas de guerre."
r56.ger.54.a:0 "Un tel exercice mérite qu’on y affecte des troupes."
r56.ger.54.b:0 "Nous ne pouvons pas nous permettre de retirer des troupes de nos frontières."

r56.ger.55.t:0 "Notre exercice militaire conjoint a été accepté"
r56.ger.55.desc:0 "Notre demande d’un exercice militaire conjoint a été acceptée. Plusieurs de nos divisions se dirigent déjà vers un lieu tenu secret où se dérouleront ces manœuvres. Nous espérons en tirer une meilleure connaissance du terrain et continuer à prendre l’avantage sur nos ennemis."
r56.ger.55.a:0 "Bonne chance à nos troupes."

r56.ger.56.t:0 "Notre exercice militaire conjoint a été refusé"
r56.ger.56.desc:0 "Notre demande d’un exercice militaire conjoint a été rejetée. Nous n’obtiendrons donc pas l’expérience anticipée et devrons travailler seuls à la préparation de notre armée. Peut-être est-ce finalement préférable, car un tel exercice aurait accaparé beaucoup de ressources depuis un front potentiel."
r56.ger.56.a:0 "C’est regrettable, mais nous ne pouvons pas les contraindre."

