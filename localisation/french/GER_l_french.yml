GER_general_staff_desc:0 "L’état-major général [ROOT.GetAdjective] était responsable de l’étude continue de tous les aspects de la guerre, y compris l’élaboration et la révision des plans de mobilisation ou de campagne. Cela a contribué à un niveau d’organisation plus élevé dans l’armée."
