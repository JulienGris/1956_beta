#Spicyedits
GER_poland_war:0 "Guerre avec la Pologne"
GER_poland_war_desc:0 "La Pologne faisait autrefois partie de l’Allemagne, et elle le sera à nouveau !"
GER_hungary_friend:0 "S’allier avec [HUN.getnamedef]"
GER_hungary_friend_desc:0 "Nous devons nous assurer que [HUN.getnamedef] soit à nos côtés."
GER_war_with_hungary:0 "Guerre avec [HUN.getnamedef]"
GER_war_with_hungary_desc:0 "[HUN.getnamedef] occupe un flanc sud critique de notre pays qu’il faut sécuriser, par la force si nécessaire."
GER_city_besiegement:0 "Artillerie de siège"
siege_artillery:0 "Artillerie de siège" #Tech
GER_city_besiegement_desc:0 "Avec le retour apparent de fortifications massives sur le champ de bataille moderne, nous devons améliorer nos pièces d’artillerie afin de mieux percer les défenses fortifiées et les zones urbaines."
GER_city_besiegement_tt:0 "§WDébloque :§! §YArtillerie de siège§!, §Wqui accorde§!\n§WArtillerie :§!\n§YUrbain§!\n§WAttaque :§! §G+5%§!\n§YFort§!\n§WAttaque :§! §G+5%§!\n\n§WArtillerie motorisée :§!\n§YUrbain§!\n§WAttaque :§! §G+5%§!\n§YFort§!\n§WAttaque :§! §G+5%§!\n\n"
GER_shock_troops_tech_bonus:0 "Bonus de recherche pour les troupes de choc"
GER_pocket_liqudation:0 "Tactiques de liquidation des poches"
GER_pocket_liqudation_desc:0 "Lorsque nous piégeons les forces ennemies dans des poches, nous devons employer des tactiques améliorées et des unités spécialisées pour liquider rapidement les troupes piégées, afin que nos soldats puissent rapidement soutenir les efforts principaux."
GER_pocket_liqudation_idea:0 "Tactiques de liquidation des poches"
GER_counter_deep_battle:0 "Contre-offensives de percée"
GER_counter_deep_battle_desc:0 "Avec nos ennemis utilisant efficacement leurs propres pointes blindées, nous devons développer de meilleures tactiques pour éviter que des percées ne s’effondrent sur nos fronts. Tenir chaque mètre de terrain n’est plus viable face à des offensives rapides. Nous devons nous replier, établir de nouvelles défenses et tenter de contre-attaquer les flancs nouvellement exposés de l’ennemi."
GER_reuse_capture_weapons:0 "Réutiliser les armes capturées"
GER_reuse_capture_weapons_desc:0 "Même si notre industrie est massive, nous ne pouvons pas fournir chaque escouade en première ligne en tout temps. Nous devons autoriser nos unités à utiliser des armes légères et d’autres équipements capturés pour combler les lacunes de ravitaillement."
GER_reuse_capture_weapons_random_generals_tt:0 "§YUn§! chef de l’armée sélectionné aléatoirement gagnera §YPillard§!§W :\n-Taux de capture d’équipement :§! §G+3%§!\n\n"
GER_captured_weapons:0 "Réutiliser les armes capturées"
GER_frontline_hospitals:0 "Hôpitaux de première ligne"
GER_frontline_hospitals_desc:0 "Les hôpitaux de campagne sont utiles pour maintenir l’efficacité de nos unités, mais les placer trop loin de la ligne de front rallonge le retour des soldats guéris. En rapprochant nos hôpitaux du front, nous prenons un grand risque, mais la rapidité des soins sauve des vies et permet aux soldats de retourner plus vite au combat."
GER_streamline_logistics:0 "Rationaliser la logistique intérieure"
GER_streamline_logistics_desc:0 "Nous ne devons pas négliger notre logistique intérieure. Bien qu’elle soit actuellement optimisée, elle pourrait bénéficier de nouveaux investissements pour assurer un fonctionnement fluide. Des améliorations internes pourraient également se traduire par de meilleures performances logistiques au front."
GER_desperate_measures:0 "Mesures désespérées"
GER_desperate_measures_desc:0 "La guerre impose un tribut inimaginable au pays, nous devons adopter des mesures qui auraient semblé impensables il y a quelques années."
GER_greater_collaborator_conscription:0 "Augmenter la conscription des collaborateurs"
GER_greater_collaborator_conscription_desc:0 "Si nos collaborateurs nous ont déjà beaucoup aidés dans la gestion des territoires occupés, ils doivent redoubler d’efforts et être désormais recrutés pour combattre dans notre armée. L’effort de guerre en dépend."
GER_found_the_volkssturm:0 "Former le Volkssturm"
GER_found_the_volkssturm_desc:0 "Il est désormais clair que nous devons élargir la conscription à des parties de la population jusque-là jugées inaptes. Nous pouvons former des unités du Volkssturm avec ces recrues, afin de libérer des troupes de garnison pour le front ou de renforcer des divisions sous-dotées."
GER_found_the_volkssturm_stockpile_tt:0 "§Y1,00K§! unités d’§Yarmes légères du Volkssturm§! sont ajoutées au stock national."
GER_front_line_cities:0 "Villes de première ligne"
GER_front_line_cities_desc:0 "La guerre pouvant bientôt atteindre notre territoire, nous devons préparer nos villes à se transformer en forteresses."
GER_front_line_cities_tt:0 "Ajoute §G1§! §Yfort terrestre§! dans chaque province de l’État contenant £victory_points£ §Ypoint(s) de victoire§!"
GER_werewolves:0 "Loups-garous"
GER_werewolves_desc:0 "Nous devons former des individus pour résister aux envahisseurs à chaque occasion possible."
r56_ger_theater_prep:0 "Préparation du théâtre d’opérations"
r56_ger_theater_prep_desc:0 "Nous préparons actuellement un possible théâtre de guerre."

r56_GER_poland_war_threat:0 "Justification contre la Pologne"

r56_GER_anti_comitern_pact:0 "A accompli l’objectif national §YPacte anti-Komintern§!"
r56_GER_anti_comitern_pact_days_tt:0 "Jours actuels : [?r56_GER_anti_comitern_pact:days|Y0]"

GER_a_world_in_flames:0 "Un monde en flammes"
GER_a_world_in_flames_desc:0 "Alors que nos ennemis se rapprochent, nous devons refuser de capituler. Nous pourrions être vaincus et anéantis. Mais si tel est le cas, nous entraînerons nos ennemis — et le monde — dans les flammes."
GER_a_world_in_flames_2_tt:0 "Ajoute jusqu’à §G5§! §Yforts terrestres§! le long de l’Oder dans les provinces contrôlées des États."
GER_a_world_in_flames_3_tt:0 "Ajoute jusqu’à §G5§! §Yforts terrestres§! le long du Rhin dans les provinces contrôlées des États."
GER_a_world_in_flames_4_tt:0 "Ajoute jusqu’à §G5§! §Yforts terrestres§! dans et autour de Berlin dans les provinces contrôlées de l’État."
GER_a_world_in_flames_5_tt:0 "\n   Soulève §Y4 divisions du Volkssturm§!.\n"
r56_a_world_in_flames_idea:0 "Monde en flammes"

#Modificateurs d’État - Tours Flak
r56_GER_flak_towers:0 "Tours Flak"
