# Info-bulles pour toutes les branches
GER_civil_war_tt:0 "Une §Hguerre civile§! éclatera entre les forces §9fascistes§!, §3conservatrices§! et §tsocialistes§!."
GER_help_SOV_revolutionaries:0 "Intervenir dans la guerre civile soviétique"
GER_help_SOV_revolutionaries_desc:0 "Soutenir la lutte révolutionnaire contre les restes du régime stalinien pourrait débarrasser le monde du communisme !"
GER_inter_communist_fighting_tt:0 "Obtient des objectifs de guerre contre l’§Hopposition européenne§!."
kpd_gets_opposition:0 "§RL’Opposition de droite va se former.§!"
r56_german_cw_ongoing:0 "[GER.GetNameDefCap] est en guerre civile." #drapeau global
