GER_AUS_wont_get_annexed_tt:0 "§RL’événement d’annexion de l’Autriche lors de son entrée dans votre alliance sera bloqué.§!"
GER_dem_ITA_pact_tt:0 "L’Italie §Hdémocratique§! ou §Hmonarchiste§! rejoindra votre alliance. Si l’§HItalie§! est §Hfasciste§! et que la §HYugoslavie§! est §Hcommuniste§!, vous pourrez les combattre ensemble.\n\n"
