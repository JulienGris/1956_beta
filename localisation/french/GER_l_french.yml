# Décisions NVA
GER_NVA_category:0 "La [GetNVAIdeaName]"
GER_NVA_category_desc:0 "La [GetNVAIdeaName] a été créée après notre victoire dans la guerre civile et protège ce pays, son peuple et les intérêts du prolétariat. Elle est le phare du monde socialiste en Europe de l’Est et du Centre. Si nous voulons que la Révolution soit protégée, voire étendue, nous devrons traiter la [GetNVAIdeaName] avec soin et la placer au cœur de nos priorités."
GER_nva_institute_equal_service:0 "Instaurer le service égalitaire"
GER_nva_institute_equal_service_desc:0 "La Révolution a triomphé et doit impliquer tous les Allemands de manière égale. Nous ne pouvons donc plus interdire aux femmes de servir dans l’armée."
GER_nva_military_exercise:0 "Ordonner un exercice militaire"
GER_nva_military_exercise_desc:0 "Même si nous avons une armée puissante, son efficacité sur le terrain reste à prouver. Nous devrions organiser un exercice militaire à grande échelle pour évaluer notre niveau de préparation."
