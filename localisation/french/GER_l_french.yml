r56_ger_naval_treaty:0 "Traité naval [ENG.GetAdjective]-[GER.GetAdjective]"
r56_ger_naval_treaty_desc:0 "Les récentes discussions avec [ENG.GetNameDef] ont largement assoupli les restrictions navales qui nous étaient imposées par le traité de Versailles, nous permettant ainsi d’augmenter considérablement notre capacité navale. Toutefois, des limitations persistent encore et ne disparaîtront qu’une fois notre marine totalement libérée de ce traité."
r56_GER_four_year_plan:0 "Le plan de quatre ans"
r56_GER_four_year_plan_upgrade:0 "Le plan de quatre ans perpétuel"
r56_GER_four_year_plan_desc:0 "§WEntrer dans une§! §Rguerre offensive§! §Wcontre une§! §Ygrande puissance§! §Rretire§! §Wce§! §Yesprit national§!\n"
GER_coerce_the_technocrats:0 "Contraindre les technocrates"
r56_GER_four_year_plan_upgrade_tt:0 "§Y$l56_GER_four_year_plan$ Esprit national§! devient permanent et ne sera plus supprimé en cas d’§Rentée en guerre offensive§!§W.§!"
GER_coerce_the_technocrats_desc:0 "De nombreux hommes d’affaires et leurs partenaires, la soi-disant classe technocratique, détestent travailler et faire des recherches sous notre gouvernement actuel. Cette potentielle cinquième colonne doit être brisée avant qu’elle ne nous détruise de l’intérieur. Les technocrates plieront à notre volonté et contribueront à nos efforts de développement du pays, d’une façon ou d’une autre."
r56_GER_coerce_the_technocrats_idea:0 "Technocrates contraints"
r56_GER_coerce_the_technocrats_idea_desc:0 "La classe technocratique et les milieux d’affaires plieront à notre volonté. Nous ne leur laisserons pas le choix !"
GER_coerce_the_technocrats_tt:0 "Quand l’objectif national §Y$GER_institute_price_controls$§! est §Yaccompli :§!"
r56_GER_economic_uncertainty:0 "Incertitudes économiques"
r56_GER_economic_uncertainty_desc:0 "Les industriels sont anxieux face aux choix économiques que doit faire le gouvernement. Décider de maintenir ou d’abandonner le système des billets MEFO au profit d’un autre plan de croissance permettrait d’apaiser ces inquiétudes sur notre économie intérieure et internationale."
r56_ger_ersatz_idea_1:0 "Ersatzmaterialien"
r56_ger_ersatz_idea_1_desc:0 "Notre économie n’a pas accès à toutes les ressources nécessaires via le commerce international. Nous devons utiliser ce que nous avons pour créer des substituts."

GER_enigma_machine0:0 "Machine Enigma"
GER_enigma_machine1:0 "Machine Enigma améliorée"
GER_enigma_machine2:0 "Machine Enigma à 5 rotors"
GER_enigma_machine3:0 "Machine Enigma à 8 rotors"

GER_establishing_the_reichskommissar:0 "Mise en place du Reichskommissar"

GER_eastern_campaign:0 "Campagne de l’Est"
GER_eastern_campaign_desc:0 "Les campagnes de propagande financées par l’État ont convaincu même les plus farouches opposants à la guerre à l’Est que les conditions de victoire seront dictées selon les termes [GER.getAdjective] et qu’aucune négociation ne viendra entraver les succès de la Wehrmacht.\n\n§HCet esprit national sera supprimé si les pertes [GER.getAdjective] infligées par les [SOV.getAdjective] atteignent le seuil de 4 millions ou si un État central [SOV.getAdjective] contrôlé a plus de 50 % de conformité.§!"

erwache.1.t:0 "Nommer les responsables économiques"
erwache.1.desc:0 "Nous avons deux options de nomination pour les postes de président de la Reichsbank et de ministre de l’Économie. L’un des candidats possibles, Hjalmar Schacht, travaille très bien avec les entreprises de [GER.GetNameDef] et développe les infrastructures civiles. Cependant, son manque de loyauté envers le NSDAP et son mépris pour les dépenses militaires en font un choix préoccupant. Notre deuxième candidat possible, Walther Funk, est très loyal au NSDAP et un fervent partisan des dépenses militaires. Pour réaliser de véritables progrès dans la reprise [GER.GetAdjective], nous devons choisir l’un de ces deux hommes pour diriger notre économie."
erwache.1.a:0 "Hjalmar Schacht."
erwache.1.b:0 "Walther Funk."
erwache.1.c:0 "Andreas Hermes."
erwache.1.d:0 "Fritz Schäffer."
erwache.1.e:0 "Franz Dahlem."
erwache.1.f:0 "Walter Ulbricht."
erwache.1.g:0 "Franz Jacob."
erwache.1.h:0 "Carl Friedrich Goerdeler."
erwache.1.i:0 "Paul Lejeune-Jung."
erwache.5.t:0 "La guerre civile [GER.GetAdjective]"
erwache.7.t:0 "[GER.GetNameDefCap] propose la paix !"
erwache.7.d:0 "[SOV.GetNameDefCap] s’est vu proposer un traité pour mettre fin à la guerre [GER.GetAdjective]-[SOV.GetAdjective] à l’Est. Le traité comprenait la cession de plusieurs territoires occidentaux occupés par les [SOV.GetAdjective] aux [GER.GetAdjective] en échange de la paix. Ces conditions rappellent le traité de Brest-Litovsk, qui mit fin au conflit germano-soviétique durant la Grande Guerre."
erwache.7.a:0 "Rejeter les conditions !"
erwache.7.b:0 "Accepter les conditions."

r56_GER_first_vienna_award_tt:0 "§RSelon votre choix, la Première Attribution de Vienne sera déclenchée si [HUN.GetNameDef] ne possède pas [664.getName] et [996.getName].§!"
r56_GER_first_vienna_award_II_tt:0 "§RCe choix déclenchera immédiatement la Première Attribution de Vienne si [HUN.GetNameDef] ne possède pas [664.getName] et [996.getName].§!"
erwache_news.2.t:0 "[SOV.GetNameDefCap] refuse la paix avec [GER.GetNameDef] !"
erwache_news.2.d:0 "\n[SOV.GetNameDefCap] a rejeté un projet de traité visant à mettre fin à la guerre [GER.GetAdjective]-[SOV.GetAdjective] à l’Est. Le traité comprenait la cession de plusieurs territoires occidentaux occupés par les [SOV.GetAdjective] aux [GER.GetAdjective] en échange de la paix. Ces conditions rappellent le traité de Brest-Litovsk, qui mit fin au conflit germano-soviétique durant la Première Guerre mondiale."
erwache_news.2.a:0 "Alors nous annexerons les terres [SOV.GetAdjective] par la force."
erwache_news.2.b:0 "Nous combattrons pour chaque pouce !"
erwache_news.2.c:0 "Intéressant."
