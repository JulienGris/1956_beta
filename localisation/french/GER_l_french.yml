# Événements pour tuer Hitler (réussis)
r56.kill_hitler.1.t:0 "Hitler tué par une explosion"
r56.kill_hitler.1.desc:0 "[GER.GetNameDefCap] semble secoué par une tentative de coup d’État, un groupe d’officiers de la Wehrmacht ayant réussi à tuer Hitler. Lors d’une exposition des dernières armes produites dans le Reich, un officier qui guidait le Führer transportait une bombe qu’il utilisa pour tuer le chancelier [GER.GetADjective] et deux de ses gardes du corps.\n\nLa suite reste incertaine, mais un nouveau Führer devrait prêter serment dans les prochaines heures."
r56.kill_hitler.1.a:0 "Un coup d’État ?"
r56.kill_hitler.1.b:0 "Des traîtres !"
r56.kill_hitler.9.t:0 "Hitler tué au combat !"
r56.kill_hitler.9.desc:0 "\nLors de la retraite des troupes [SOV.GetAdjective] de Sébastopol, le cadavre de Hitler a été retrouvé dans une tranchée aux côtés de ses camarades. Semion Hitler, un Juif ukrainien, avait combattu bravement contre les envahisseurs. Bien qu’il ait été blessé au combat, il avait réussi à rejoindre ses lignes. Faisant preuve d’un courage qui aurait couvert de honte son homonyme, un messager bavarois de la Première Guerre mondiale."
r56.kill_hitler.9.a:0 "Attendez, ce n’est pas le bon !"
r56.kill_hitler.9.b:0 "Nein ! Mein Führ…"

r56.kill_hitler.10.t:0 "Hitler se suicide"
r56.kill_hitler.10.desc:0 "\nLa défaite de [GER.GetNameDef] semblant inévitable, plutôt que de risquer d’être capturé, Adolf Hitler se serait suicidé dans son bunker de commandement dans la capitale [GER.GetAdjective].\n\nDans son testament, l’amiral Karl Dönitz a été nommé nouveau président [GER.Adjective] et a pris le commandement de ce qui reste des forces [GER.GetAdjective]. Bien que Dönitz ait déclaré qu’il s’engageait à « obtenir la paix la plus favorable possible » pour son pays, le soi-disant « Reich millénaire » touche à sa fin."
r56.kill_hitler.10.a:0 "Intéressant."
r56.kill_hitler.10.b:0 "Bon débarras."
r56.kill_hitler.10.c:0 "Catastrophique !"
r56.kill_hitler.10.d:0 "[GER.GetNameDef] triomphera !"

GER_cede_884_to_HUN:0 "Céder le Prekmurje à la Hongrie"
GER_cede_853_to_ITA:0 "Céder Ljubljana à l’Italie"

r56_italy_ljubljana_annexation.1.t:0 "L’Allemagne cède Ljubljana"
r56_italy_ljubljana_annexation.1.d:0 "[FROM.GetNameDefCap] nous a cédé la région de Ljubljana afin de renforcer nos relations amicales."
r56_italy_ljubljana_annexation.1.a:0 "Excellent."

r56_hungary_prekmurje_annexation.1.t:0 "[From.GetName] cède le Prekmurje"
r56_hungary_prekmurje_annexation.1.d:0 "[FROM.GetNameDefCap] nous a cédé la région du Prekmurje afin de renforcer nos relations amicales."
r56_hungary_prekmurje_annexation.1.a:0 "Excellent."

PRE_call_other_german_states:0 "Appeler les autres États allemands"

GER_naval_gunnery_r56:0 "Artillerie navale"
GER_naval_gunnery_r56_desc:0 "Notre flotte de surface aura besoin des canons les plus puissants."
GER_naval_effort_r56:0 "Dénoncer le traité naval"
GER_naval_effort_r56_desc:0 "Le traité naval [ENG.GetAdjective]-[GER.GetAdjective] de 1935 n’est rien d’autre qu’un stratagème visant à empêcher notre nation d’atteindre la grandeur et à permettre à [ENG.GetNameDef] de nous dominer. Nous ne pouvons plus nous incliner et négliger notre puissance navale."

r56_GER_decision_promote_hans_von_luck:0 "Promouvoir Hans von Luck"

# Endsieg
r56.ger.1.t:0 "Victoire ultime"
r56.ger.1.desc:0 "Notre effort de guerre a subi de nombreux revers, et nos ennemis pénètrent au cœur de notre patrie. Mais nous sommes plus forts qu’eux et, contrairement à eux, nous avons la résilience pour endurer de grandes souffrances et continuer jusqu’à la victoire. Nous mobiliserons toutes les forces disponibles de notre grande nation pour atteindre cette victoire ou périr en essayant."
r56.ger.1.a:0 "La victoire ultime est à portée de main. Il nous suffit de tenir bon."
r56_endsieg_idea:0 "Endsieg"
r56_endsieg_idea_desc:0 "La victoire ultime est à portée de main."
r56_GER_endsieg_tt:0 "§WCréer§! des unités §YVolkssturm§! et §YErsatzheer§! dans §Ycertains États centraux contrôlés§!"
r56.ger.2.t:0 "Plus près de la victoire ultime"
r56.ger.2.desc:0 "Notre patrie semblait perdue, mais grâce à notre résilience, nos souffrances n’ont pas été vaines. Nous avons repoussé nos ennemis hors de notre territoire et les avons mis sur la défensive. Bien qu’il reste encore un long chemin vers la victoire pour laquelle nous avons tant souffert, elle paraît désormais beaucoup plus proche."
r56.ger.2.a:0 "La victoire ultime est plus proche que jamais !"
r56_GER_endsieg_2_tt:0 "§RSupprime§! les unités §YVolkssturm§! et §YErsatzheer§!"

# Hors Endsieg
r56.ger.4.t:0 "La mort de Guillaume III"
r56.ger.4.desc:0 "L’empereur Guillaume III est décédé de vieillesse. Le trône est passé à son fils Guillaume IV, qui laisse la plupart de ses responsabilités aux politiciens."
r56.ger.4.a:0 "Le roi et empereur est mort, vive le roi et empereur !"

r56.ger.6.t:0 "[GER.GetNameDefCap] propose un front contre le fascisme"
r56.ger.6.d:0 "Le dirigeant [GER.GetAdjective], [GER.GetLeader], nous a envoyé une proposition visant à mettre de côté nos différends et à former un front uni contre la « menace fasciste » qui plane sur l’Europe."
r56.ger.6.a:0 "Unis, nous résistons."
r56.ger.6.b:0 "Plutôt mourir que devenir rouge !"

r56.ger.7.t:0 "Ultimatum [GER.GetAdjective]"
r56.ger.7.d:0 "[GER.GetNameDefCap], manifestement hostile à notre nation, nous a envoyé un ultimatum exigeant notre reddition immédiate pour nous protéger de la « menace fasciste » en Europe.\n\n[GER.GetNameDefCap] menace de « nous écraser quel qu’en soit le prix » si nous n’obtempérons pas. Bien que ces demandes soient scandaleuses, nous ne sommes peut-être pas en position de résister."
r56.ger.7.a:0 "Nous devons céder."
r56.ger.7.b:0 "Nous ne nous rendrons pas à ces diables rouges !"

r56.ger.8.t:0 "[AUS.GetNameDefCap] se rend"
r56.ger.8.d:0 "[AUS.GetNameDefCap], sans autre option, a accepté nos conditions et s’est complètement rendu.\n\nNous avons remporté une nouvelle victoire contre les fascistes."
r56.ger.8.a:0 "Excellent."

r56.ger.9.t:0 "[AUS.GetNameDefCap] refuse"
r56.ger.9.d:0 "[AUS.GetNameDefCap] a tenu bon et a refusé avec arrogance nos conditions de protection contre la menace fasciste.\n\nIls se révèlent être un autre tyran en Europe, et nous devons les abattre, quel qu’en soit le prix."
r56.ger.9.a:0 "Alors, c’est la guerre."

r56.ger.10.t:0 "[FRA.GetNameDefCap] accepte notre proposition"
r56.ger.10.d:0 "[FRA.GetNameDefCap] a accepté avec enthousiasme notre proposition et a convenu de mettre fin à toutes les relations hostiles entre nos deux nations afin de combattre la menace fasciste en Europe."
r56.ger.10.a:0 "Unis, nous résistons."

r56.ger.11.t:0 "[FRA.GetNameDefCap] rejette notre proposition"
r56.ger.11.d:0 "[FRA.GetNameDefCap] a outrageusement rejeté notre offre de mettre de côté nos différends ; les relations hostiles se poursuivront malgré la menace fasciste en Europe."
r56.ger.11.a:0 "Imbéciles arrogants."

r56.ger.15.t:0 "Premier arbitrage de Vienne"
r56.ger.15.d:0 "Les Hongrois furent parmi ceux qui souffrirent le plus après la Grande Guerre. Lors de l’éclatement de l’Empire austro-hongrois, de nombreux Hongrois se sont retrouvés en terre étrangère, bien que leurs ancêtres y aient vécu depuis des siècles. Nous pourrions considérablement améliorer nos relations avec [HUN.GetNameDef] en leur attribuant certains territoires pris à [CZE.GetNameDef]."
r56.ger.15.a:0 "Donnez-leur [664.getName] et [996.getName] !"
r56.ger.15.b:0 "Le territoire est à nous !"
r56.ger.15.c:0 "La Slovaquie mérite de le garder."

r56.ger.34.t:0 "[FROM.GetName] propose une intégration"
r56.ger.34.d:0 "[FROM.GetNameDefCap] est devenu un partenaire de plus en plus important pour [ROOT.GetNameDef], et cherche maintenant à prolonger ce partenariat par une intégration économique et politique."
r56.ger.34.a:0 "Une coopération plus étroite serait bénéfique."
r56.ger.34.b:0 "On ne peut pas leur faire confiance."
r56.ger.34.c:0 "Nous devons éliminer leur influence."

r56.ger.35.t:0 "[FROM.GetName] accepte l’intégration"
r56.ger.35.desc:0 "L’ambassadeur [FROM.GetAdjective] nous a informés que le gouvernement de [FROM.GetNameDef] est intéressé par notre proposition d’intégration. Nos liens économiques renforcés devraient être une influence positive pour nos deux nations."
r56.ger.35.a:0 "Délicieux."

r56.ger.36.t:0 "[FROM.GetName] refuse l’intégration"
r56.ger.36.desc:0 "Les représentants du gouvernement [FROM.GetAdjective] nous ont informés qu’ils n’entendent pas mettre en œuvre les actions prévues dans notre proposition d’intégration. Bien qu’ils assurent vouloir poursuivre notre relation commerciale, ils refusent de nous laisser étendre notre influence politique sur eux."
r56.ger.36.a:0 "Hélas, il n’y a rien à faire."
r56.ger.36.b:0 "Nous verrons comment ils s’en sortiront sans nous."
r56.ger.36.c:0 "Inacceptable."  # accorde un but de guerre ou renverse le gouvernement

r56.ger.39.t:0 "[FROM.GetName] renverse le gouvernement"
r56.ger.39.d:0 ""
r56.ger.39.a:0 "Leur influence a été globalement positive."
r56.ger.39.b:0 "Nous devons résister !"
r56.ger.40.t:0 "Échec du coup d'État soutenu par les [FROM.GetAdjective]"
r56.ger.40.d:0 "Les corporatistes soutenus par les [FROM.GetAdjective] ont tenté d'installer un gouvernement ami tôt ce matin, mais ils ont été arrêtés avec succès par la police et les partisans du gouvernement. Cette escalade extrême nous a permis de purger les principaux soutiens de ce mouvement, mais elle a de graves conséquences sur nos relations avec [GER.GetNameDef]."
r56.ger.40.a:0 ""

r56.ger.41.t:0 "Un gouvernement favorable aux [ROOT.GetAdjective] se forme en [FROM.GetName]"

r56.ger.42.t:0 "Coup d'État raté en [FROM.GetName]"
r56.ger.42.d:0 "Les forces soutenues par les [ROOT.GetAdjective] ont rencontré une résistance inattendue en [FROM.GetNameDef], provoquant plusieurs morts lorsque la police a empêché les paramilitaires de prendre des positions clés, ainsi que des arrestations de haut niveau. Il est certain qu’une telle opportunité ne se représentera pas."
r56.ger.42.a:0 "Brûlez les preuves"

# Yalta
news.339.title:0 "Occupation alliée de l'Allemagne"
news.339.desc:0 "Avec la fin de la Seconde Guerre mondiale en Europe, les Alliés ont pris le contrôle total de l'Allemagne et l'ont partagée entre quatre puissances occupantes : les [ENG.GetAdjective] et les [FRA.GetAdjective] à l'ouest, et les [USA.GetAdjective] et [SOV.GetAdjective] à l'est. Combien de temps faudra-t-il pour que ces terres se relèvent et soient dénazifiées reste incertain."
news.339.a:0 "Plus jamais ça."
r56_yalta_occupation_tt:0 "Si [FRA.GetNameDef], [ENG.GetNameDef] et [USA.GetNameDef] étaient présents à la conférence de Yalta, ils diviseraient [GER.GetNameDef] en zones d’occupation."
r56_yalta_decisions_available_tt:0 "De nouvelles décisions deviennent disponibles pour rétablir des pays dans les zones d’occupation en Allemagne et en Autriche."
r56_yalta_decisions_available_2_tt:0 "De nouvelles décisions deviennent disponibles pour établir de nouveaux États en Allemagne et en Autriche si ces territoires sont transformés en zones d’occupation et de gouvernement direct."

# Versailles
ger.renegotiate_versailles.1.t:0 "[GER.GetNameDefCap] propose de renégocier le traité de Versailles"
ger.renegotiate_versailles.1.d:0 "[GER.GetNameDefCap] nous a approchés avec une offre intéressante. Afin d’apaiser les tensions récemment ravivées entre nos deux nations en raison des événements survenus dans leur pays, ils nous proposent de renégocier le traité de Versailles. Concrètement, les [GER.GetAdjective] n’auraient plus à payer de réparations et aucune occupation de territoire [GER.GetNonIdeologyName] ne se poursuivrait.\n\nEn contrepartie, ils promettent de respecter les restrictions aériennes, terrestres et navales imposées et de reconnaître le réajustement des frontières du [GER.GetNonIdeologyName]. Cependant, ils exigent que nous leur fournissions des garanties de sécurité, puisqu’ils resteraient vulnérables sans une armée de grande envergure.\n\n[GER.GetNameDefCap] affirme fermement que cette renégociation est le seul moyen de préserver la paix de notre temps. Faut-il les croire sur parole ?"
ger.renegotiate_versailles.1.a:0 "Préservons la paix de notre temps."
ger.renegotiate_versailles.1.b:0 "Nous n’avons aucun intérêt pour les vieux traités."

ger.renegotiate_versailles.2.t:0 "[FROM.GetNameDefCap] accepte de renégocier le traité de Versailles"
ger.renegotiate_versailles.2.d:0 "[FROM.GetNameDefCap] a gracieusement accepté notre offre de renégocier le traité de Versailles, partageant notre point de vue selon lequel une telle action est nécessaire pour maintenir la paix de notre temps.\n\nDésormais, nous ne pourrons plus utiliser une grande partie de nos forces armées, mais [FROM.GetNameDef] a accepté de défendre notre nation contre toute agression étrangère à leur place."
ger.renegotiate_versailles.2.a:0 "La paix de notre temps."

ger.renegotiate_versailles.3.t:0 "[FROM.GetNameDefCap] refuse de renégocier le traité de Versailles"
ger.renegotiate_versailles.3.d:0 "[FROM.GetNameDefCap] a refusé notre offre de renégocier le traité de Versailles, déclarant qu’ils n’ont aucun intérêt à renégocier un ancien traité. Bien que cela puisse sembler une bonne nouvelle à première vue, cela soulève des questions sur les véritables intentions de [FROM.GetNameDef]."
