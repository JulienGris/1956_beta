# Diplomatie communiste-démocratique partagée
GER_recruit_officers_com:0 "Recruter des officiers vaincus"
GER_anti_expansionism:0 "Anti-expansionnisme"
GER_anti_expansionism_desc:0 "En dénonçant l’expansion par des moyens agressifs, nous pourrions rallier les nations régionales qui n’envisagent pas ce type de politique ou qui pourraient être elles-mêmes menacées."
GER_expansionism_light:0 "Héritage de Stresemann"
GER_expansionism_light_desc:0 "Bien que nous devions éviter de commettre les mêmes erreurs que la république de Weimar, il est indéniable que la politique de négociation agressive menée par Gustav Stresemann l’aurait renforcée si la Grande Dépression n’était pas survenue."
GER_renegotiate_versailles:0 "Renégocier Versailles"
GER_renegotiate_versailles_desc:0 "Le traité de Versailles a été blâmé pendant deux décennies pour les souffrances du peuple [GER.GetAdjective], mais il résulte simplement d’une négociation faible. Si nous voulons garantir la paix de notre temps, nous devons apprendre à trouver des compromis avec ceux qui nous l’ont imposé, pour un bénéfice mutuel."
GER_legacy_of_gluckliche_zwanziger_jahre:0 "Héritage des Glückliche Zwanziger Jahre"
GER_legacy_of_gluckliche_zwanziger_jahre_desc:0 "Les « Glückliche Zwanziger Jahre » ou « Années heureuses » marquèrent une période de forte reprise économique et de croissance sous la république de Weimar. Cela a montré le potentiel de prospérité du peuple [GER.GetAdjective] sous un système démocratique pacifique. Désormais, nous avons les moyens de réaliser pleinement ce potentiel."
GER_german_scientific_haven:0 "Havre scientifique [GER.GetAdjective]"
GER_german_scientific_haven_desc:0 "La grande fuite des cerveaux a pris fin, et nul potentiel n’est gaspillé en étant envoyé à l’armée ou à la guerre : chacun peut désormais se consacrer pleinement à ses études et à son métier. Cette nouvelle dynamique a permis l’émergence d’un grand nombre d’académiques dans notre pays, contribuant grandement à notre développement technologique."
GER_join_allies:0 "Rejoindre les Alliés"
GER_join_allies_desc:0 "En nous alliant aux Britanniques, nous pourrons exercer une influence sans précédent sur le monde grâce à notre alliance."
GER_lead_democracies:0 "Diriger les petites démocraties"
GER_lead_democracies_desc:0 "Seule la nation [GER.GetAdjective] renaissante a la volonté d’être le véritable protecteur de l’Europe."
GER_lead_communists:0 "Le nouvel exemple du communisme"
GER_lead_communists_desc:0 "[SOV.GetNameDefCap] est faible et ne représente pas le vrai communisme ! Seul [Root.GetNameDef] peut garantir la sécurité et la prospérité des nations socialistes européennes."
GER_inter_communist_fighting:0 "Combattre le communisme illégitime"
GER_inter_communist_fighting_desc:0 "Les nations où les travailleurs n’ont pas été libérés ne comprennent pas qu’il existe différentes idéologies communistes. Nous devons défendre la nôtre et renforcer notre position, les États bourgeois n’interviendront pas."
GER_anti_colonialism:0 "Position anti-impérialiste"
GER_anti_colonialism_desc:0 "Depuis que nos colonies nous ont été retirées, bien des choses ont changé. Nous devons reconnaître la colonisation pour le mal qu’elle est, et cela nous vaudra en outre la faveur de plusieurs puissances montantes."
GER_ally_benelux:0 "Alliance du Benelux"
GER_ally_benelux_desc:0 "Bien que petits, les pays du Benelux ne se contentent pas d’avoir une forte concentration industrielle : ils offriront également à notre alliance un accès stratégique à trois continents étrangers."
GER_western_communist:0 "Vaincre le communisme occidental"
GER_western_communist_desc:0 "Si nous voulons un jour repousser la menace de l’Est, nous devons d’abord sécuriser notre sphère d’influence."
GER_dem_anschluss_prep:0 "Agiter le sentiment pro-allemand en Autriche"
GER_dem_anschluss_prep_desc:0 "Les citoyens autrichiens ne savent que penser de leur fragile nation indépendante. En attisant les appels déjà existants à l’unification avec l’Allemagne, nous pourrions imposer un référendum."
GER_dem_anschluss:0 "Référendum d’unification"
GER_dem_anschluss_desc:0 ""
GER_aus_ally:0 "Frères d’armes"
GER_aus_ally_desc:0 "Nous aimerions être unis à nos frères germaniques autrichiens, mais leur laisser gérer leurs propres affaires pourrait être plus efficace."
GER_dem_italy_attack:0 "La menace du Sud"
GER_dem_italy_attack_desc:0 "[ITA.GetNameDefCap] représente une menace sérieuse au sud et ne peut être autorisée à nous frapper si nous entrons dans un nouveau conflit."
GER_request_danzig:0 "Demander le contrôle de la Ville libre"
GER_request_danzig_desc:0 "Compte tenu de notre changement de direction, quelle que soit notre allégeance, nous devrions pouvoir exiger que la ville fortement pro-allemande de Dantzig soit rendue à son propriétaire légitime."
GER_dem_polish_corridor_trade:0 "L’Oberschlesien contre Gdynia"
GER_dem_polish_corridor_trade_desc:0 "Si nous le souhaitons, nous pourrions négocier avec la Pologne pour résoudre la séparation de notre territoire en Prusse-Orientale, puisque nous contrôlons chacun des régions désireuses de changer de main."
GER_dem_polish_corridor_deal:0 "La Lituanie contre des territoires pro-allemands"
GER_dem_polish_corridor_deal_desc:0 "Puisque nous contrôlons des terres lituaniennes, nous pourrions conclure un accord avec les Polonais, qui aimeraient peut-être restaurer l’idée de la République polono-lituanienne, en échange des zones dominées par les Allemands de Gdynia et Katowice."
GER_colonies_for_support:0 "Des colonies contre du soutien"
GER_colonies_for_support_desc:0 "Les Britanniques, en particulier, pourraient être disposés à restaurer une partie de notre empire colonial en échange de notre soutien dans leur conflit actuel. Même si ce ne sont pas leurs plus précieuses possessions, cela marquerait une restauration historique."
GER_soviet_support:0 "Coopération avec les [GetRussiansDemonym]"
GER_soviet_support_desc:0 "[SOV.GetNameDefCap] pourrait être un bon partenaire pour restaurer notre puissance militaire."
GER_ally_eastern_europe:0 "Alliance danubienne"
GER_ally_eastern_europe_desc:0 "Malgré le manque de puissance industrielle balkanique, leur position en Europe est indéniablement stratégique."
GER_ally_czechoslovakia:0 "S’allier avec [CZE.GetNameDef]"
GER_ally_czechoslovakia_desc:0 "[CZE.GetNameDefCap] est le cœur industriel de l’Europe centrale après nous, et ils seraient un atout précieux pour notre alliance."
GER_counter_soviet_agression:0 "Contrer l’agression [SOV.GetAdjective]"
GER_counter_soviet_agression_desc:0 "Nous devons agir rapidement pour contrer la menace [SOV.GetAdjective] en élargissant notre alliance et en nous préparant à une frappe préventive."
GER_anti_bolshevist_bloc:0 "Coopérer avec le Bloc antibolchevique"
GER_anti_bolshevist_bloc_desc:0 "Dans les pays d’Europe de l’Est menacés ou occupés par les Soviétiques, des organisations anticommunistes se sont formées, influençant la politique et résistant à l’influence communiste. Travailler avec elles pourrait convaincre leurs nations d’origine de mettre de côté nos différences idéologiques pour s’unir contre le communisme."
GER_anti_soviet_friend_poland:0 "Inviter la Pologne"
GER_anti_soviet_friend_poland_desc:0 "Peu de nations ont autant souffert de la tentative de colonialisme soviétique que les [POL.GetAdjective] lors de leur guerre d’indépendance et de leur répression ultérieure par Staline en territoire soviétique. Leur position stratégique, leur force militaire et leur hostilité envers leur ancien oppresseur devraient en faire un allié redoutable."
GER_dem_anti_commie_bloc_hungary:0 "Inviter la Hongrie"
GER_dem_anti_commie_bloc_hungary_desc:0 "La Hongrie, démocratique ou non, partage notre mentalité antisoviétique et pourrait être intéressée par les avantages de notre protection."
GER_dem_italy_alliance:0 "Pacte italien"
GER_dem_italy_alliance_desc:0 "[ITA.GetLeader] est un opportuniste qui, malgré les différences idéologiques, pourrait être intéressé par le défi que représente l’influence communiste à ses portes, ou au moins par l’expansion de l’influence [ITA.GetAdjective]."
GER_anti_soviet_friend_baltics:0 "Protéger les États baltes"
GER_anti_soviet_friend_baltics_desc:0 "Ayant obtenu leur indépendance grâce à nous, les nations baltes pourraient être intéressées par notre aide pour la préserver."
GER_anti_soviet_friend_finland:0 "Inviter la Finlande"
GER_anti_soviet_friend_finland_desc:0 ""
GER_realise_ukrainian_statehood:0 "Réaliser l’État ukrainien"
GER_realise_ukrainian_statehood_desc:0 "Le peuple ukrainien s’est courageusement battu pour son indépendance autrefois, mais a échoué. Libérés de l’oppression soviétique, ils peuvent désormais tenter à nouveau sous notre protection."
GER_realise_belarusian_statehood:0 "Réaliser l’État biélorusse"
GER_realise_belarusian_statehood_desc:0 "En tant que république soviétique parmi les plus sévèrement touchées par la terreur stalinienne, la Biélorussie doit être l’une des principales cibles de la libération."
GER_safeguard_neutrality:0 "Préserver la neutralité"
GER_safeguard_neutrality_desc:0 "Au cœur, et bientôt au centre, de l’Europe, [Root.GetNameDef] occupe une position unique qui lui permet réellement de garantir la sécurité de ses partenaires neutres. Et si un conflit devait malgré tout éclater, nous sortirions sans aucun doute victorieux et renforcés."
GER_cooperate_with_nordics:0 "Coopérer avec les Nordiques"
GER_cooperate_with_nordics_desc:0 "Depuis le déclin des empires du nord et l’indépendance de la Finlande, ces nations sont traditionnellement restées neutres. Mais avec les [GetRussiansDemonym] à leur porte menant des guerres agressives, elles ne peuvent refuser de contribuer à la sécurité européenne."
GER_anti_soviet_war:0 "Combattre les [GetRussiansDemonym]"
GER_anti_soviet_war_desc:0 "Seul [Root.GetNameDef] peut sauver l’Europe de la tyrannie [SOV.GetAdjective]."
# Monarchisme
GER_mon_peaceful:0 "Des alliés plus fiables"
GER_mon_peaceful_desc:0 "Bien que nous soyons puissants, nous ne pouvons pas affronter le monde… encore une fois. En recherchant des partenaires moins agressifs, nous pourrions étendre notre Reich sans risquer une nouvelle guerre sur deux fronts."
GER_mon_FRA_alliance:0 "Alliance avec la France monarchiste"
GER_mon_FRA_alliance_desc:0 "Avec la France et l’Allemagne unies sous des gouvernements forts, nous devrions coopérer pour dominer l’Europe."
GER_alliance_with_gustaf:0 "Alliance avec Gustaf"
GER_alliance_with_gustaf_desc:0 "Le roi Gustaf de [SWE.GetNonIdeologyName] rejoindra sûrement notre mode de vie lorsqu’il réalisera le terrain commun que nous partageons, car nous sommes de même sang."
GER_sway_spain:0 "Rallier [SPB.GetNameDef]"
GER_sway_spain_desc:0 "Les monarchies de [ROOT.GetNonIdeologyName] et de [SPR.GetNonIdeologyName] partagent une longue et fructueuse histoire commune, il est donc naturel que nous nous unissions à nouveau."
GER_destabilize_france:0 "Déstabiliser la France"
GER_destabilize_france_desc:0 "La politique française est au bord du chaos, il ne lui faut qu’un petit coup de pouce… peut-être que nos communistes aimeraient prendre des vacances à Paris ?"
GER_mon_allies_alliance:0 "Accepter la domination navale britannique"
GER_mon_allies_alliance_desc:0 "Nous n’avons aucune chance contre la flotte de l’Empire britannique. Détourner notre production navale serait bénéfique pour nos ambitions en Europe continentale."
GER_mon_anti_commie_france:0 "Unis contre le communisme français"
GER_mon_anti_commie_france_desc:0 "Alors que la France, l’un des empires les plus puissants du monde, s’effondre, les Britanniques pourraient être disposés à nous tendre la main avant que la situation ne dégénère et que les idées communistes ne se propagent dans leur empire."
GER_restore_the_central_powers:0 "Restaurer les Puissances centrales"
GER_restore_the_central_powers_desc:0 "Humiliés par la perte de leur territoire, nos anciens alliés devraient être plus qu’enclins à rejoindre notre alliance si nous leur donnons une chance de retrouver leur grandeur."
GER_asia_department:0 "Le département asiatique"
GER_asia_department_tt:0 "Ce focus deviendra le prérequis de §YAmitié avec le Japon§! et §YAmitié avec la Chine§! une fois §YÉliminer Hitler§! sélectionné."

# Info-bulles (surtout monarchistes)
poland_special_dominion_tt:0 "Nous offrirons à la Pologne une protection en échange de nos anciens territoires et d’une influence politique, en la transformant en un type spécial de dominion."
intervene_soviet_civil_war_tt:0 "Il existe un camp non communiste et anti-stalinien dans la guerre civile qui peut être allié."
has_neutrality_idea_tt:0 "Dispose d’une idée de §Ypolitique étrangère neutre§!."
fascist_neutrality_alliance_tt:0 "Les pays §Yfascistes§! et §Ynon-alignés§! d’Europe seront moins réticents à rejoindre l’alliance démocratique de [Root.GetNameDef]."
GER_rhineland_decision_tt:0 "§RSi la France devient communiste ou notre alliée, nous ne générerons pas de tension mondiale.§!"
GER_central_powers_tt:0 "§YTous les pays non-alignés, historiquement alliés, seront invités à rejoindre notre faction.§!"
GER_middle_east_diplo_tt:0 "Ces décisions nous permettront d’influencer les pays du §YMoyen-Orient§! et leur politique, jusqu’à les faire rejoindre notre faction."
GER_will_strengthen_right_opposition:0 "§RVa renforcer l’Opposition de droite§!"
GER_heinrich_brandler_will_lead_country_tt:0 "Si §YHeinrich Brandler§! est employé comme §Yconseiller§!, il peut devenir le §Ychef de l’État§!"

