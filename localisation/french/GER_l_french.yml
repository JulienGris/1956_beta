# Événements
r56.ger.60.t:0 "Jour d’élection !"
r56.ger.60.desc:0 "Un pays démocratique a besoin d’élections pour fonctionner, et aujourd’hui elles se tiennent. Le vainqueur dirigera le gouvernement et occupera la fonction présidentielle.\n\nDeux partis majeurs sont en lice. Le plus populaire est de loin le SPD, qui a eu une influence considérable sur la politique [ROOT.GetAdjective] depuis des décennies. Il représente des positions sociales-démocrates, en faveur des classes populaires, du renforcement des syndicats et de l’instauration d’un système social.\nLe principal concurrent est le Zentrum, parti plus ancien et plus centriste. Son électorat est constitué en grande partie de catholiques du sud de l’Allemagne. Le parti est plus conservateur dans ses politiques culturelles et économiques, mais n’hésite pas à accroître les avantages sociaux pour les travailleurs.\n\nTous les votes ont été comptés et les résultats sont les suivants :"
r56.ger.60.a:0 "Le Zentrum l’emporte largement !"
r56.ger.60.b:0 "Le SPD l’emporte largement !"
r56.ger.60.c:0 "Le Zentrum l’emporte de justesse et forme une coalition."
r56.ger.60.d:0 "Le SPD l’emporte de justesse et forme une coalition."
r56.ger.60.e:0 "Le gouvernement actuel obtient 4 années supplémentaires sans opposition !"

r56.ger.61.t:0 "Otto Wels meurt à 66 ans"
r56.ger.61.desc:0 "Otto Wels, l’un des derniers à résister au fascisme, vient de s’éteindre à l’âge de 66 ans. Président du SPD depuis 20 ans, il dirigeait le pays depuis la chute du fascisme durant la guerre civile.\n\nOn ne saurait surestimer l’importance de cette personnalité dans la politique [ROOT.GetAdjective]. Peu sauront être à la hauteur de son héritage. Son successeur, Hans Vogel, prend désormais les rênes du pays. Espérons que sa présidence sera digne de celle de Wels.\n\nOtto Wels sera inhumé dans les prochains jours, alors que le pays est encore en deuil. Sa pierre tombale portera une citation de son dernier discours en 1933, avant l’adoption de la loi des pleins pouvoirs :"
r56.ger.61.a:0 "« Vous pouvez nous prendre notre liberté et notre vie, mais jamais notre dignité ! »"

r56.ger.63.t:0 "Hans Vogel meurt à 58 ans"
r56.ger.63.desc:0 "Le président est mort. Il s’est éteint paisiblement dans son sommeil à l’âge de 58 ans. Bien que relativement jeune, il a mené une vie accomplie, dédiée à l’Allemagne et à sa prospérité.\n\nMilitant syndical dès son jeune âge, il a été une figure incontournable de la politique allemande durant plusieurs décennies. En 1931, il devient coprésident du SPD avec Otto Wels et Arthur Crispien. Après la mort de Wels en 1939, il accède à la présidence et conduit l’Allemagne vers un avenir radieux.\n\nSon successeur, Kurt Schumacher, deviendra officiellement président dans les prochains jours, tandis que l’ancien président sera enterré dans un cimetière berlinois."
r56.ger.63.a:0 "Repose en paix. Schumacher sera un digne successeur."

r56.ger.65.t:0 "Hitler se suicide"
r56.ger.65.desc:0 "Alors que notre défaite semble inévitable, Adolf Hitler a choisi la mort plutôt que le risque d’être capturé, en se suicidant dans son bunker de commandement.\n\nDans son testament, l’amiral Karl Dönitz est désigné comme nouveau président [GER.GetAdjective] et prend le commandement de ce qu’il reste de nos forces. Bien qu’il ait affirmé vouloir « obtenir la paix la plus favorable possible » pour son pays, cela risque de peser bien peu face à la gravité de notre situation."
r56.ger.65.a:0 "[GER.GetNameDef] prévaudra !"

