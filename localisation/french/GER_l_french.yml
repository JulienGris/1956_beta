l_french:
#NE PAS SUPPRIMER LES ANCIENNES CLÉS ! ON NE SAIT PAS OÙ ELLES PEUVENT APPARAÎTRE !

 #Raccourci
 GER_kill_hitler_shortcut:0 "$GER_kill_hitler$"

#Personnages
 GER_bernhard_rogge:0 "Bernhard Rogge"
 GER_helmuth_walter:0 "Helmuth Walter"
 
#Compagnies / MIO
 GER_deutsche_forschungsanstalt_fur_segelflug:0 "DFS"
 GER_deutsche_forschungsanstalt_fur_segelflug_desc:0 "Deutsche Forschungsanstalt für Segelflug"
 GER_erma_werke:0 "Erma Werke"
 GER_erma_werke_desc:0 "Maschinenfabrik Geipel"
 GER_hanomag:0 "Hanomag"
 GER_hanomag_desc:0 "Hannoversche Maschinenbau"
 GER_mio_trait_mechanized_simplification:0 "Simplification des conceptions"
 GER_mio_trait_mg34:0 "Mitrailleuses MG 34"
 GER_porsche_improved_tt:0 "§GDisponible§! comme §YScientifique§! : §YFerdinand Porsche§!"

#Arbre de priorités
 GER_begin_depression_recovery:0 "Commencer la sortie de crise"
 GER_begin_depression_recovery_desc:0 "La gestion de la Grande Dépression par la République de Weimar a encore aggravé l’économie. Nous devons commencer à réparer les dégâts causés par les ennemis de [GER.GetNameDef]."
 GER_begin_reinhardt:0 "Lancer le programme Reinhardt"
 GER_begin_reinhardt_desc:0 "La première étape du redressement économique est de soutenir la croissance des entreprises. En utilisant des incitations indirectes, comme des réductions fiscales, nous stimulerons le développement industriel privé."
 GER_finish_reinhardt:0 "Achever le programme Reinhardt"
 GER_finish_reinhardt_desc:0 "Les investissements directs du programme Reinhardt dans les infrastructures porteront leurs fruits."
 GER_privatize_reichsbahn:0 "Privatiser la Reichsbahn"
 GER_privatize_reichsbahn_desc:0 "La première étape du redressement de nos infrastructures sera la revitalisation du réseau ferroviaire par la privatisation."
 GER_privatize_stahlwerke:0 "Privatiser la Vereinigte Stahlwerke"
 GER_privatize_stahlwerke_desc:0 "Pour rendre notre puissance militaire comparable à celle d’avant-Versailles, nous devons rendre nos aciéries plus efficaces."
 GER_synth_oil_research:0 "Rechercher le pétrole synthétique"
 GER_synth_oil_research_desc:0 "Comme [GER.GetNameDef] dispose de peu de sources naturelles de pétrole et de caoutchouc, nous devons compter sur la production de pétrole synthétique pour renforcer nos réserves de ces ressources précieuses."
 GER_oil_refinery_development:0 "Construire des raffineries"
 GER_oil_refinery_development_desc:0 "Puisque notre recherche et nos technologies en matière de pétrole synthétique se sont améliorées, nous pouvons construire des raffineries plus avancées."
 GER_establish_peenmunde:0 "Établir le laboratoire de Peenemünde"
 GER_establish_peenmunde_desc:0 "La création d’un nouveau laboratoire central fera progresser nos connaissances scientifiques et nos recherches vers de nouveaux sommets."
 GER_establish_SS:0 "Fonder la SS"
 GER_establish_SS_desc:0 "La seule façon de protéger la direction de [GER.GetNameDef] contre les menaces extérieures est de disposer d’une garde d’élite. Cette garde, la SS, assurera le bon fonctionnement du gouvernement et s’occupera de ceux qui chercheraient à lui nuire."
 GER_aux_police_SS:0 "Utiliser la SS comme police auxiliaire"
 GER_aux_police_SS_desc:0 "Le rôle de la SS peut naturellement s’étendre à la sphère civile, tant dans la Grande Allemagne que dans les territoires occupés. Espérons qu’elle saura gérer les menaces de partisans et de terroristes qui attaquent les troupes de la Wehrmacht."
 GER_elite_soldiers_SS:0 "Déployer la SS en première ligne"
 GER_elite_soldiers_SS_desc:0 "L’entraînement unique et l’endoctrinement des soldats de la SS les rendent bien supérieurs aux unités standard pour des missions exigeant davantage de dévouement et de loyauté envers la patrie."
 GER_combine_SS_gestapo:0 "Fusionner la SS et la Gestapo"
 GER_combine_SS_gestapo_desc:0 "La fusion de la SS et de la Gestapo nous donnera une force capable d’opérations militaires, de maintien de l’ordre et d’opérations antiterroristes."
 GER_purge_political_opponents:0 "Éliminer les opposants politiques"
 GER_purge_political_opponents_desc:0 "La seule manière de gérer l’influence indéniable des autres partis est de les supprimer complètement. Alors seulement nous pourrons renforcer l’unité nationale et conduire [GER.GetNameDef] à la victoire."
 GER_strengthen_german_state:0 "Rediriger les efforts de police"
 GER_strengthen_german_state_desc:0 "La situation politique intérieure étant sécurisée, nous devrions employer la police militaire ailleurs, réduisant ainsi son influence."
 GER_operation_ikarus:0 "Opération Ikarus"
 GER_operation_ikarus_desc:0 "L’Islande est trop importante comme base pour le trafic maritime de l’Atlantique Nord pour rester inoccupée. Nous devons la saisir immédiatement !"
 GER_sweden_war:0 "Guerre contre [SWE.GetNameDef]"
 GER_sweden_war_desc:0 "Nous importons du tungstène et du fer de Suède depuis des années ; la menace ennemie pesant sur [SWE.GetNameDef] est aussi une menace pour l’armée et l’expansion de [GER.GetNameDef]. Nous devons sécuriser [SWE.GetNameDef] pour que ces ressources vitales ne tombent pas aux mains de l’ennemi."
 GER_finland_friend:0 "Se rapprocher de [FIN.GetNameDef]"
 GER_finland_friend_desc:0 "[FIN.GetNameDefCap] a longtemps été un ennemi de [SOV.GetNameDef] et pourrait s’avérer être un lien vital vers le front nord et le reste de la Scandinavie."
 GER_finland_war:0 "Guerre contre [FIN.GetNameDef]"
 GER_finland_war_desc:0 "L’influence de [FIN.GetNameDefCap] en [SOV.GetNameDef] et en Scandinavie est cruciale pour l’expansion de [GER.GetNameDef]. S’emparer de ce bastion serait un coup énorme porté à nos ennemis."
 GER_prepare_france_invasion:0 "Préparer le théâtre occidental"
 GER_prepare_france_invasion_desc:0 "La France s’est opposée à notre expansion politique et militaire et a été l’un des principaux rédacteurs du maudit traité de Versailles. Nous devons donc être prêts à l’affronter à tout moment."
 GER_core_lorraine:0 "Intégrer l’Alsace-Lorraine"
 GER_core_lorraine_desc:0 "Le territoire d’Alsace-Lorraine est depuis longtemps habité par une population germanophone. La France a volé ces terres à l’Allemagne ; il est temps de les reprendre pour de bon."
 GER_mobile_warfare:0 "Guerre interarmes"
 GER_mobile_warfare_desc:0 "Nos avancées technologiques en puissance militaire, dans les airs et sur terre, peuvent être coordonnées, nous permettant d’éviter les combats lents et sanglants de la guerre de tranchées. [FRA.GetNameDefCap] sera un terrain d’entraînement grandeur nature pour notre nouvelle armée, et nous inaugurerons une nouvelle forme de guerre."
 GER_build_panzer_army:0 "Renforcer l’armée de panzers"
 GER_build_panzer_army_desc:0 "Avant de lancer toute invasion, nous devons nous assurer que nos divisions blindées sont à jour et disposent de tous les chars dont elles ont besoin."
 GER_build_panzer_quality:0 "Privilégier la qualité"
 GER_build_panzer_quality_desc:0 " "
 GER_build_panzer_quantity:0 "Privilégier la quantité"
 GER_build_panzer_quantity_desc:0 " "
 GER_captured_heavy_weapons:0 "Réutiliser les armes lourdes capturées"
 GER_captured_heavy_weapons_desc:0 "En dépit de notre production supérieure d’équipement, nous ne pouvons pas négliger les possibilités offertes par l’équipement ennemi capturé."
 GER_superior_firepower:0 "Une armée moderne"
 GER_superior_firepower_desc:0 "[GER.GetNameDefCap] doit être le premier à démontrer combien un soutien bien organisé dans ses unités est avantageux."
 GER_elite_units:0 "Unités spécialisées"
 GER_elite_units_desc:0 "En théorie, le soldat universel semble une bonne idée, mais en réalité notre formation et nos troupes ne peuvent pas tout maîtriser. Nous avons besoin d’unités spécialisées capables d’exécuter les tâches les plus complexes et d’exceller dans celles-ci."
 GER_mechanization_of_the_army:0 "Mécaniser l’armée"
 GER_mechanization_of_the_army_desc:0 "Pour ceux qui regardent au-delà de notre propagande, il n’est pas secret que notre armée repose encore largement sur les chevaux et le rail. L’un de nos objectifs principaux doit être d’accroître notre utilisation de l’infanterie motorisée et blindée."
 GER_prevent_aerial_hegemony:0 "Protéger contre les attaques aériennes"
 GER_prevent_aerial_hegemony_desc:0 "De bonnes défenses aériennes permettront de libérer des avions pour les actions offensives et de protéger nos troupes au sol."
 GER_above_maginot:0 "Au-dessus de la ligne Maginot"
 GER_above_maginot_desc:0 "Certains de notre haut commandement ont proposé d’utiliser pleinement notre nouvelle et puissante force aérienne afin d’éviter le combat sur la ligne Maginot. Avant cela, nous devons investir davantage dans les technologies permettant des opérations d’infanterie aéroportée à grande échelle."
 GER_plan_sealion:0 "Préparer l’opération Seelöwe"
 GER_plan_sealion_desc:0 "[ENG.GetNameDefCap] a longtemps été une épine dans notre flanc. La seule façon de l’ôter est de traverser la Manche et de la faire tomber par la force."
 GER_landing_craft:0 "Rechercher les péniches de débarquement"
 GER_landing_craft_desc:0 "La seule manière de mener à bien une invasion navale d’envergure est de disposer de nouvelles péniches de débarquement."
 GER_air_superiority_english_channel:0 "Dominer les cieux"
 GER_air_superiority_english_channel_desc:0 "La seule façon de protéger la patrie et d’assurer un soutien terrestre écrasant est de disposer d’une supériorité aérienne incontestable."
 GER_train_paratroopers:0 "Former les Fallschirmjäger"
 GER_train_paratroopers_desc:0 "Les divisions de Fallschirmjäger, notre infanterie aéroportée, seront le seul moyen d’envahir et de capturer des objectifs derrière les lignes ennemies ou inaccessibles par voie terrestre."
 GER_naval_superiority_english_channel:0 "Doctrine flexible"
 GER_naval_superiority_english_channel_desc:0 "La seule manière de protéger nos invasions amphibies ou notre commerce sera le déploiement intelligent de notre marine, même contre des puissances navales plus fortes."
 GER_enact_sealion:0 "Déclencher l’opération Seelöwe"
 GER_enact_sealion_desc:0 "Le moment est enfin venu : nous allons mettre en action notre plan d’invasion de la Grande-Bretagne et ôter cette épine que nous avons supportée trop longtemps."
 GER_alliance_with_italy:0 "Alliance avec [ITA.GetNameDef]"
 GER_alliance_with_italy_desc:0 "Les Italiens peuvent être peu fiables – comme ils l’ont prouvé durant la Grande Guerre – mais Mussolini et son mouvement fasciste ont montré qu’il y avait encore de l’espoir pour [ITA.GetNameDef]. [GER.GetNameDefCap] n’a qu’à gagner en s’alliant avec eux."
 GER_prepare_italian_invasion:0 "Préparer le théâtre méridional"
 GER_prepare_italian_invasion_desc:0 "Tant que nous ne saurons pas si les Suisses et les Italiens sont avec nous ou contre nous, nous devons préparer notre frontière sud pour les combattre."
 GER_core_south_tyrol:0 "Revendiquer le Tyrol du Sud"
 GER_core_south_tyrol_desc:0 "Comme Dantzig ou l’Alsace-Lorraine, le Tyrol du Sud est une province où vit une importante population germanophone. Nous devons ramener nos compatriotes exilés sous la protection [GER.GetAdjective]."
 GER_war_with_italy:0 "Guerre contre [ITA.GetNameDef]"
 GER_war_with_italy_desc:0 "Nos préparatifs sont terminés, et le moment est venu : nous devons envahir les terres de notre ancien allié."
 GER_prepare_poland_invasion:0 "Préparer le théâtre oriental"
 GER_prepare_poland_invasion_desc:0 "Après la Première Guerre mondiale, la Pologne nous a volé le port de Dantzig ; en plus de cela, elle constitue notre voie d’accès tactique vers l’Europe de l’Est. Nous devons renforcer nos infrastructures le long de la frontière [POL.GetAdjective]."
 GER_modernize_CAS:0 "Moderniser l’appui aérien"
 GER_modernize_CAS_desc:0 "Tandis que nos forces terrestres sont modernisées, nous devons les soutenir par une nouvelle force d’appui aérien rapproché."
 GER_schwerepunkt_tactics:0 "Tactiques de Schwerpunkt"
 GER_schwerepunkt_tactics_desc:0 "Concentrer nos forces mobiles, telles que les divisions blindées et motorisées, sur des points précis nous assurera de percer même les lignes défensives les plus redoutables."
 GER_soviet_friend:0 "Se rapprocher de [SOV.GetNameDef]"
 GER_soviet_friend_desc:0 "Se rapprocher de [SOV.GetNameDef] sera essentiel pour sécuriser notre flanc oriental ; une fois [POL.GetNameDef] hors de notre chemin, notre Est sera sûr, nous permettant de nous concentrer sur d’autres fronts."
 GER_unholy_alliance_tt_1:0 "Cela dissoudra le §H[ROOT.GetFactionName]§! et créera l’§HAxe Berlin-Moscou§!"
 GER_unholy_alliance_tt_2:0 "Cela créera l’§HAxe Berlin-Moscou§!"
 GER_poland_friend_r56:0 "Se rapprocher de [POL.GetNameDef]"
 GER_poland_friend_r56_desc:0 "Beaucoup dans notre gouvernement voient [POL.GetNameDef] comme un ennemi direct et un opposant idéologique de l’État [GER.GetAdjective] actuel. Avec les tensions qui montent à travers le monde, peut-être serait-il préférable d’enterrer la hache de guerre et d’embrasser ensemble un avenir prospère. Bien sûr, sous les bonnes conditions."
 GER_war_with_poland:0 "Guerre contre [POL.GetNameDef]"
 GER_war_with_poland_desc:0 "Les [POL.GetAdjective] ont récemment montré une grande hostilité envers nous, franchissant nos frontières et attaquant notre peuple à plusieurs reprises ! Nous devons mener une guerre défensive contre les [POL.GetAdjective] ! Enfin… c’est l’histoire officielle."
 GER_romania_friend:0 "Se rapprocher de [ROM.GetNameDef]"
 GER_romania_friend_desc:0 "Avoir [ROM.GetNameDef] comme allié nous permettra de contenir l’agression [SOV.GetAdjective] et de donner un nouvel élan militaire à notre camp."
 GER_romania_war:0 "Guerre contre [ROM.GetNameDef]"
 GER_romania_war_desc:0 "Nous devons sécuriser [ROM.GetNameDef] ; son imprévisibilité pourrait facilement en faire une voie d’attaque pour nos ennemis du Sud et de l’Est."
 GER_soviet_invasion:0 "Envahir les [SOV.GetAdjective]s"
 GER_soviet_invasion_desc:0 "Depuis longtemps, nous sommes en désaccord avec les [SOV.GetAdjective]s pour la domination territoriale en Europe ; la seule façon de gérer cette menace est de l’effacer totalement de la carte."
 GER_train_panzergrenadiers:0 "Former les Panzergrenadiers"
 GER_train_panzergrenadiers_desc:0 "Une grande partie de notre infanterie standard n’est pas assez formée ni équipée pour suivre nos blindés. Nous devrions moderniser certaines divisions en divisions d’élite de Panzergrenadiers pour obtenir un avantage supplémentaire sur nos adversaires."
 GER_counter_sloped_armor:0 "Contrer les blindages inclinés"
 GER_counter_sloped_armor_desc:0 "Les blindages inclinés et autres avancées ont rendu obsolètes les armes antichars simples comme les fusils ; nous aurons besoin d’armes antichars plus puissantes pour détruire les chars les plus récents."
 GER_seige_fortified_towns:0 "Assiéger les villes fortifiées"
 GER_seige_fortified_towns_desc:0 "Les [SOV.GetAdjective]s ont renforcé les défenses de plusieurs villes, comme Leningrad et Moscou. Pour les prendre, nous devons les encercler et les bombarder avec toute la puissance de feu possible."
 GER_counter_anti_tank:0 "Stratégie des canons d’assaut"
 GER_counter_anti_tank_desc:0 "Notre artillerie classique est une cible privilégiée pour les bombardements ennemis. En la rendant mobile, blindée et peut-être même équipée de plus gros obus, nous pourrons littéralement et figurativement surpasser l’artillerie ennemie."
 GER_encirclement_doctrine_desc:0 "Les [SOV.GetAdjective]s disposent de plusieurs millions d’hommes de plus que nous ; pour contrer cela, nous devons encercler et écraser leurs armées avant qu’elles ne puissent riposter."
 GER_train_marines:0 "Former les Seebataillone"
 GER_train_marines_desc:0 "Les Seebataillone nous donneront un avantage lors des invasions navales, grâce à des troupes spécialisées dans les débarquements sur les côtes ennemies."
 GER_invade_switzerland:0 "Opération Tannenbaum"
 GER_invade_switzerland_desc:0 "Les [SWI.GetAdjective] sont étroitement liés aux Allemands, au point qu’une grande partie de leur population parle notre langue. Nous devrions réunifier notre peuple et leur assurer une meilleure protection."
 GER_the_blitz:0 "Le Blitz"
 GER_the_blitz_desc:0 "La meilleure façon d’affaiblir le moral du peuple [ENG.GetAdjective] est de réduire leurs villes en cendres et en ruines ; de nouveaux investissements dans les bombardiers amélioreront notre capacité à le faire."
 GER_turkey_friend:0 "Se rapprocher de [TUR.GetNameDef]"
 GER_turkey_friend_desc:0 "Se rapprocher de [TUR.GetNameDef] nous donnera une plus grande influence au Moyen-Orient et en Afrique."
 GER_turkey_war:0 "Guerre contre [TUR.GetNameDef]"
 GER_turkey_war_desc:0 "Contrôler les terres de [TUR.GetNameDef] nous ouvrira une porte vers le Moyen-Orient et l’Afrique, étape vitale pour la conquête des colonies [ENG.GetAdjective] et [FRA.GetAdjective]. De plus, « Turkey » est aussi un plat délicieux."
 GER_war_with_spain:0 "Guerre contre l’Espagne"
 GER_war_with_spain_desc:0 "S’emparer de l’Espagne nous donnera une position tactique en Méditerranée, facilitera la prise de Gibraltar et offrira un accès rapide à l’Afrique."
 GER_foreign_volunteers:0 "Accepter les volontaires étrangers"
 GER_foreign_volunteers_desc:0 "Beaucoup d’étrangers approuvent nos politiques et positions, au point d’être prêts à se battre pour nous. Si nous n’étions pas ouverts à cela auparavant, aujourd’hui des renforts supplémentaires sont toujours utiles."
 GER_support_military_research:0 "Soutenir la recherche militaire"
 GER_support_military_research_desc:0 "La technologie nous apportera la victoire finale."
 GER_political_sphere:0 "Ouvrir la sphère politique [GER.GetAdjective]"
 GER_political_sphere_desc:0 "Après l’élection de Hitler et la consolidation du pouvoir par le NSDAP, il est temps d’ouvrir la sphère politique au changement. Soit nous poursuivrons sur le chemin du Führer, soit nous en trouverons un nouveau."
 GER_kill_hitler:0 "Se débarrasser de Hitler"
 GER_kill_hitler_desc:0 "Hitler est la figure de proue de l’Allemagne et de sa politique depuis plusieurs années. Le manque de successeurs solides au sein du NSDAP fait de lui une cible idéale pour quiconque veut stopper le fascisme allemand."
 GER_political_turmoil:0 "Exploiter l’agitation politique"
 GER_political_turmoil_desc:0 "Maintenant que Hitler est mort, il sera beaucoup plus facile d’attiser les flammes de l’instabilité en [GER.GetNameDef]."
 GER_denounce_versailles:0 "Dénoncer le traité de Versailles"
 GER_denounce_versailles_desc:0 "Une dénonciation officielle du traité de Versailles montrera clairement notre position politique au monde et suscitera le soutien de notre population."
 GER_military_industrial_complex:0 "Développer les industries militaires"
 GER_military_industrial_complex_desc:0 "En utilisant des industries militaires privées et un financement massif de l’État, nous porterons notre complexe militaro-industriel à un nouveau niveau."
 GER_restore_weimar:0 "Restaurer le gouvernement de Weimar"
 GER_restore_weimar_desc:0 "Le système démocratique de Weimar était le meilleur moyen de gérer l’État allemand ; la montée de Hitler au pouvoir a dévié l’Allemagne de sa voie pacifique. Nous devons réparer les dégâts avant qu’il ne soit trop tard."
 GER_establish_bundesrepublik:0 "Fonder la Bundesrepublik"
 GER_establish_bundesrepublik_desc:0 "Le soutien populaire à un nouveau gouvernement démocratique a rapidement augmenté ; grâce à cette faveur publique, il est temps de lancer une contre-révolution contre les fascistes."
 GER_post_fascism_recovery:0 "Sortir du fascisme"
 GER_post_fascism_recovery_desc:0 "Les années de fascisme ont causé des dommages importants à notre économie et à notre culture ; nous devons lancer des initiatives publiques pour inverser ces dégâts."
 GER_marshall_plan:0 "Renforcer les liens avec les Américains"
 GER_marshall_plan_desc:0 "Le financement occidental, en particulier de la part des [USA.GetNameDef], fera des merveilles pour notre économie et notre rétablissement après le fascisme, tout en réduisant la susceptibilité de notre peuple au communisme."
 GER_replace_reichsmark:0 "Remplacer le Reichsmark"
 GER_replace_reichsmark_desc:0 "Le chaos consécutif à la mort de Hitler et à la contre-révolution démocratique a provoqué une énorme inflation du Reichsmark. Pour contrer cela, nous devrions le remplacer par une nouvelle monnaie."
 GER_economic_miracle:0 "Le miracle économique [GER.GetAdjective]"
 GER_economic_miracle_desc:0 "La combinaison du soutien des autres démocraties et de notre nouveau système de marché libre a créé un formidable boom économique."
 GER_post_war_economics:0 "Économie de paix"
 GER_post_war_economics_desc:0 "Puisque nous ne sommes plus en économie de guerre, nous pouvons concentrer nos efforts sur la prospérité civile."
 GER_civilian_infrastructure:0 "Infrastructures civiles"
 GER_civilian_infrastructure_desc:0 "Dans la continuité de notre chemin vers une économie de paix, nous améliorerons les infrastructures nécessaires à l’essor de l’industrie et des affaires civiles."
 GER_establish_bundeswehr:0 "Fonder la Bundeswehr"
 GER_establish_bundeswehr_desc:0 "Bien que l’Allemagne ne soit plus fasciste, des menaces extérieures subsistent. Nous devrions établir une nouvelle armée, la Bundeswehr, pour y faire face."
 GER_defense_and_deterence:0 "Défense et dissuasion"
 GER_defense_and_deterence_desc:0 "Dans le prolongement de notre défense contre les menaces extérieures, nous devons adopter une politique de défense et de dissuasion afin d’assurer la sécurité de notre pays et de notre peuple."
 GER_western_science_funding:0 "Financement scientifique occidental"
 GER_western_science_funding_desc:0 "Dans la continuité du soutien précédent, les démocraties occidentales peuvent également financer nos sciences."
 GER_repeal_reichstag_fire_decree:0 "Abroger le décret de l’incendie du Reichstag"
 GER_repeal_reichstag_fire_decree_desc:0 "Le décret de l’incendie du Reichstag, une loi interdisant de fait le communisme, doit être abrogé pour permettre à notre peuple naturellement porté à gauche d’exprimer ses intérêts dans l’intérêt du pays."
 GER_fuse_the_parties:0 "Fusionner les partis"
 GER_fuse_the_parties_desc:0 "Les dernières décennies ont montré qu’un Kaiser ne pouvait pas maintenir notre nation unie et qu’une république ne pouvait pas la garder stable. Il ne reste qu’une option : une forte coalition des partis de gauche [GER.GetAdjective]. Il est temps de fusionner et de créer enfin l’Allemagne qui aurait toujours dû exister."
 GER_alliance_with_soviets:0 "Fonder le Kominform"
 GER_alliance_with_soviets_desc:0 "[SOV.GetNameDefCap] est la plus grande puissance communiste mondiale ; s’allier avec eux créerait une nouvelle superpuissance."
 GER_world_revolution:0 "Établir le socialisme [GER.GetAdjectiveCap]"
 GER_world_revolution_desc:0 "Bien que les [SOV.GetAdjective]s soient puissants, leur forme de socialisme est corrompue et contre-productive. Nous devons montrer au monde comment adopter une véritable forme de communisme, centrée sur le peuple."
 GER_spread_the_revolution:0 "Propager la révolution"
 GER_spread_the_revolution_desc:0 "Si nous voulons survivre, il est essentiel de nous entourer d’amis et non d’ennemis ; nous pouvons y parvenir par une diplomatie habile ou par la force brute. Quoi qu’il en soit, la révolution doit vivre !"
 GER_increase_influence_over_balkans:0 "Accroître l’influence dans les Balkans"
 GER_increase_influence_over_balkans_desc:0 ""
 GER_increase_influence_over_eastern_europe:0 "Accroître l’influence en Europe de l’Est"
 GER_increase_influence_over_eastern_europe_desc:0 ""
 GER_increase_influence_over_benelux:0 "Accroître l’influence sur le Benelux"
 GER_increase_influence_over_benelux_desc:0 ""
 GER_old_nemensis:0 "Notre ancien ennemi"
 GER_old_nemensis_desc:0 ""
 GER_end_british_imperial_hegemony:0 "Mettre fin à l’hégémonie impériale [ENG.GetAdjective]"
 GER_end_british_imperial_hegemony_desc:0 ""
 GER_focus_on_fascist_threat:0 "Se concentrer sur la menace fasciste"
 GER_focus_on_fascist_threat_desc:0 "Même si nous méprisons les capitalistes et les impérialistes du monde entier, il ne fait aucun doute que les fascistes demeurent la menace la plus importante ; nous devons donc mettre de côté nos différends pour détruire ce qui a maintenu notre nation sous le joug si longtemps."
 GER_pressure_austria:0 "Faire pression sur [AUS.GetNameDef]"
GER_pressure_austria_desc:0 "Un autre tyran fasciste se trouve à notre sud ; si nous voulons stopper la menace fasciste en Europe, nous devons d’abord libérer nos compatriotes germanophones."
GER_decrease_fascist_influence:0 "Réduire l’influence fasciste"
GER_decrease_fascist_influence_desc:0 "Nous ne pouvons pas permettre au fascisme de se propager davantage ; il nous a maintenus, nous et nos nations sœurs, sous son joug trop longtemps. Nous ne pouvons pas laisser cela arriver à d’autres."
GER_deal_with_the_devil:0 "Pactiser avec le diable"
GER_deal_with_the_devil_desc:0 "Bien que [FRA.GetNameDef] ait longtemps été notre ennemi historique et que nous ayons eu de nombreuses divergences, nous partageons peut-être un objectif commun : éradiquer le fascisme en Europe. Il pourrait donc être dans notre intérêt de mettre nos différends de côté."
GER_the_source_of_fascism:0 "La source du fascisme"
GER_the_source_of_fascism_desc:0 "L’idée même du fascisme est née au cœur de l’Italie ; si nous voulons l’éradiquer une fois pour toutes, ce pays doit être pacifié et libéré."
GER_bodenreform_projects:0 "Projets de réforme agraire"
GER_bodenreform_projects_desc:0 "Les projets de réforme agraire, inspirés par les idées d’Adolf Damaschke, visent à redistribuer les terres pour garantir à chacun un logement et des moyens de travail de base assurés par l’État, un des piliers d’une société communiste."
GER_hanza_steelworks:0 "Haut-fourneaux de Hanza"
GER_hanza_steelworks_desc:0 "L’industrie sidérurgique de Hanza a été négligée ces dernières années. Pour garantir des emplois à nos travailleurs tout en accédant à des ressources essentielles, nous devons investir massivement dans cette région."
GER_progress_cult:0 "Culte du progrès"
GER_progress_cult_desc:0 "Former et financer une élite scientifique par l’État nous donnera les moyens de porter nos sciences à un nouveau niveau."
GER_soviet_scientists:0 "Importer des scientifiques [SOV.GetAdjective]"
GER_soviet_scientists_desc:0 "Faire venir des scientifiques de [SOV.GetNameDef], légalement ou non, stimulera encore davantage nos avancées scientifiques."
GER_establish_stasi:0 "Fonder la Stasi"
GER_establish_stasi_desc:0 "Pour éviter que des contre-révolutionnaires ne renversent notre gouvernement de l’intérieur, nous devons créer une agence chargée d’enquêter sur ce type de menaces."
GER_recruit_grenztruppen:0 "Volontaires antifascistes"
GER_recruit_grenztruppen_desc:0 "Une partie croissante de la population est prête à participer activement pour arrêter de force l’agression fasciste."
GER_rehabilitate_military:0 "Réhabiliter l’armée"
GER_rehabilitate_military_desc:0 "Les fascistes ont transformé l’armée allemande en une bureaucratie corrompue et inefficace ; nous devons inverser cette tendance dans nos nouvelles forces armées."
GER_establish_NVA:0 "[GetNVAFocusName]"
GER_establish_NVA_desc:0 "La fondation de la Nationale Volksarmee, une armée conscrite et bien formée, nous donnera un avantage décisif sur nos ennemis."
GER_production_effort:0 "Effort d’industrialisation"
GER_production_effort_desc:0 "Après les dégâts infligés à notre industrie par le régime fasciste, nous devons étendre notre capacité industrielle et réparer ce qui a été détruit."
GER_collectivize_industry:0 "Collectiviser l’industrie"
GER_collectivize_industry_desc:0 "En complément de nos efforts d’industrialisation, nous devons progressivement collectiviser nos industries afin de garantir une efficacité maximale."
GER_total_war:0 "Guerre totale"
GER_total_war_desc:0 "Voulez-vous la guerre totale ? Si nécessaire, voulez-vous une guerre encore plus totale et radicale que tout ce que nous avons pu imaginer jusqu’à présent ?"
GER_case_anton_desc:0 "L’opération Anton, le plan visant à envahir et intégrer notre marionnette française à [GER.GetNameDef], doit être mise en œuvre afin de sécuriser le reste de la France."
GER_appoint_economic_positions:0 "Nommer des responsables économiques"
GER_appoint_economic_positions_desc:0 "La seule manière pour [GER.GetNameDef] de se relever entièrement de la Grande Dépression est d’unifier notre économie. Nous pouvons y parvenir en nommant un président à la Reichsbank et un ministre de l’Économie."
GER_appoint_economic_positions_tooltip:0 "Vous aurez le choix de nommer l’un des conseillers suivants :"
GER_two_side_economics:0 "Économie à deux volets"
GER_two_side_economics_desc:0 "Deux factions s’opposent au sein du gouvernement [GER.GetAdjective]. Les technocrates estiment que placer des spécialistes aux postes-clés et donner la priorité à l’industrie plutôt qu’à l’armée est la voie de la réussite économique. Les autarciques, eux, veulent une Allemagne autosuffisante et militairement puissante."
GER_support_technocrats_I:0 "Soutenir les technocrates"
GER_support_technocrats_I_desc:0 "Si nous voulons une [GER.GetName] économiquement forte, nous devons soutenir les technocrates."
GER_support_technocrats_II:0 "Donner des sièges aux technocrates"
GER_support_technocrats_II_desc:0 "Donner des sièges aux technocrates au gouvernement leur permettra de mettre en œuvre leurs politiques plus efficacement."
GER_exploit_trade_dependence:0 "Exploiter les dépendances commerciales"
GER_exploit_trade_dependence_desc:0 ""
GER_support_autarks_I:0 "Soutenir les autarciques"
GER_support_autarks_I_desc:0 "Si nous voulons une [GER.GetName] économiquement forte, nous devons soutenir les autarciques."
GER_support_autarks_II:0 "Donner des sièges aux autarciques"
GER_support_autarks_II_desc:0 "Donner des sièges aux autarciques au gouvernement leur permettra de mettre en œuvre leurs politiques plus efficacement."
GER_jet_research:0 "Financer la recherche sur les réacteurs"
GER_jet_research_desc:0 "Le moteur à réaction nous fera entrer dans une nouvelle ère de guerre, permettant de bombarder nos ennemis avec une précision inédite et de dominer les cieux au-dessus de [GER.GetNameDef]… du moins selon nos scientifiques."
GER_volksgemeinschaft:0 "Soutenir la Volksgemeinschaft"
GER_volksgemeinschaft_desc:0 "La Volksgemeinschaft, ou « communauté du peuple », contribuera à unir et renforcer les peuples germaniques d’Europe et du monde."
GER_deutsche_arbeitsfront:0 "Fonder la Deutsche Arbeitsfront"
GER_deutsche_arbeitsfront_desc:0 "Remplacer tous les syndicats [GER.GetAdjective] par une union unique contrôlée par l’État nous permettra d’assurer l’efficacité maximale de notre complexe industriel et de faciliter les réformes économiques."
GER_volkswagen:0 "Fonder Volkswagen"
GER_volkswagen_desc:0 "La production de masse d’une « voiture du peuple » renforcera le moral, stimulera l’industrie civile et l’infrastructure. Et puis, qui n’aime pas un bon Kübelwagen ?"
GER_steelworks_issues:0 "Problèmes dans la sidérurgie"
GER_steelworks_issues_desc:0 "La Vereinigte Stahlwerke AG est depuis longtemps le principal producteur d’acier en Allemagne, mais elle fonctionne avec très peu de contrôle gouvernemental. Pour garantir un approvisionnement suffisant, l’État doit intervenir dans l’extraction des ressources stratégiques, même si cela n’est pas rentable, afin de soutenir l’économie de guerre."
GER_nationalize_resource_industries:0 "Liquéfaction du charbon"
GER_nationalize_resource_industries_desc:0 "L’Allemagne manque de pétrole ; nous devons donc redoubler d’efforts dans le domaine du pétrole synthétique."
GER_nationalize_aviation_industry:1 "Standardiser la production aéronautique"
GER_nationalize_aviation_industry_desc:1 "Standardiser et répartir la production d’avions militaires entre les différentes entreprises sera crucial pour éliminer les inefficacités de temps de paix."
GER_reform_uranprojekt:0 "Relancer l’Uranprojekt"
GER_reform_uranprojekt_desc:0 "L’Uranprojekt, aussi appelé le « Club de l’uranium », a été pratiquement dissous après l’invasion de la Pologne et la conscription de nombreux scientifiques. Le relancer en retirant des chercheurs de l’armée pourrait valoir la peine pour notre production scientifique."
GER_rally_the_monarchists:0 "Rassembler les monarchistes"
GER_rally_the_monarchists_desc:0 "Les échecs de la république de Weimar et la corruption du régime nazi contrastent avec l’histoire impériale glorieuse de l’Allemagne. Nous devons restaurer cette grandeur impériale pour assurer notre place de puissance mondiale."
GER_return_of_conservative_exiles:0 "Retour des exilés conservateurs"
GER_return_of_conservative_exiles_desc:0 ""
GER_return_of_conservative_exiles_tt:0 "Quand la §YGuerre civile§! commencera :"
GER_contact_ludendorff:0 "Contacter Ludendorff"
GER_contact_ludendorff_desc:0 "Erich Ludendorff, ancien général en chef conservateur durant la Grande Guerre, reste un héros populaire pour le peuple [ROOT.GetAdjective]. Bien qu’il ait initialement soutenu le NSDAP, il s’en est éloigné ces dernières années. S’il ralliait notre cause, notre légitimité en serait grandement renforcée."
GER_ludendorff_will_join:0 "§YErich Ludendorff§! rejoindra notre camp en tant que §Ymaréchal§! dès le déclenchement de la §Rguerre civile§!."
GER_a_new_reich:0 "Renverser les nazis"
GER_a_new_reich_desc:0 "Après avoir rassemblé monarchistes et autres partis pro-Kaiser, il est enfin temps de prendre le pouvoir et de restaurer l’Empire allemand dans toute sa gloire !"
GER_consolidate_new_reich:0 "Consolider le Kaiserreich"
GER_consolidate_new_reich_desc:0 "Nous avons pris le Reichstag et établi un gouvernement provisoire avec notre nouveau Kaiser à sa tête. Il nous faut maintenant solidifier et consolider l’Allemagne en tant que Quatrième Reich."
GER_restore_the_empire:0 "Restaurer l’Empire"
GER_restore_the_empire_desc:0 "Après la défaite malheureuse du Second Reich lors de la Grande Guerre et la signature du traité de Versailles, de nombreux territoires légitimement allemands nous ont été arrachés. Nous devons entamer le long processus de leur reconquête."
GER_european_claims:0 "Récupérer nos territoires européens"
GER_european_claims_desc:0 "Avant tout, nous devons reprendre les territoires centraux du Reich allemand, en particulier l’Alsace-Lorraine désormais [FRA.GetAdjective] et la ville [POL.GetAdjective] de Dantzig."
GER_african_claims:0 "Récupérer nos colonies africaines"
GER_african_claims_desc:0 "Les [ENG.GetAdjective] et [FRA.GetAdjective] ont utilisé le traité de Versailles pour justifier leur mainmise sur les nations et colonies africaines, preuve de leur impérialisme corrompu. Reprendre ces territoires rétablira la puissance [GER.GetAdjective] dans la région et offrira un contrepoids essentiel à leur expansionnisme."
GER_fufill_the_clay_of_mittelafrika:0 "Réaliser le rêve du Mittelafrika"
GER_fufill_the_clay_of_mittelafrika_desc:0 "Depuis trop longtemps, [ROOT.GetNameDef] rêve d’une grande colonie africaine s’étendant de [CHA.GetNonIdeologyName] à [ZAM.GetNonIdeologyName], appelée « Mittelafrika ». Le moment est venu de réaliser ce rêve et d’asseoir notre statut de puissance coloniale."
GER_asian_claims:0 "Récupérer nos colonies asiatiques"
GER_asian_claims_desc:0 "Comme en Afrique, les anciens Alliés ont utilisé le traité de Versailles pour justifier leur impérialisme et le vol des possessions du peuple allemand. Nous devons entamer le processus de reconquête de nos colonies d’Asie et du Pacifique."
GER_reclaiming_our_colonies:0 "Restaurer nos possessions impériales"
GER_reclaiming_our_colonies_desc:0 "Le traité de Versailles nous a forcés à renoncer à notre souveraineté sur les territoires impériaux que l’Allemagne possédait avant la Grande Guerre, nous réduisant d’une superpuissance mondiale à une simple puissance régionale.\nMais maintenant que le Kaiser est de retour, il est temps de reconquérir notre empire une bonne fois pour toutes !"
GER_interest_in_the_carribean:0 "Intérêt pour les Caraïbes"
GER_interest_in_the_carribean_desc:0 "Nos forces navales ont toujours envisagé d’établir des bases dans les îles des Caraïbes, mais Otto von Bismarck lui-même s’y était opposé. Maintenant qu’il n’est plus un obstacle, nous pouvons enfin réaliser ces ambitions."
GER_restore_klein_venedig:0 "Restaurer Klein-Venedig"
GER_restore_klein_venedig_desc:0 "Klein-Venedig fut le territoire le plus important de la colonisation [GER.GetAdjective] en Amérique jusqu’à ce qu’il nous soit volé par d’autres puissances coloniales. Il est temps de reprendre nos droits et de renouer avec nos frères [GER.GetAdjective] du sud !"
GER_establish_imperial_german_army:0 "Réorganiser le Deutsches Heer"
GER_establish_imperial_german_army_desc:0 "Réanimer le Deutsches Heer sur le modèle de la Wehrmacht nazie donnera sans aucun doute au Quatrième Reich l’une des forces armées les plus puissantes et efficaces du monde."
GER_support_landwehr:0 "Soutenir la Landwehr"
GER_support_landwehr_desc:0 "Soutenir la Landwehr garantira une armée plus professionnelle et efficace, même si sa taille sera réduite."
GER_galvanize_german_militarism:0 "Galvaniser le militarisme [GER.GetAdjective]"
GER_galvanize_german_militarism_desc:0 "Le militarisme est un élément clé de l’identité et de la place de [GER.GetNameDef] en tant que nation. Il est naturel que nous l’exploitions pour renforcer notre moral."
GER_support_freikorps:0 "Soutenir les Freikorps"
GER_support_freikorps_desc:0 "Soutenir les Freikorps donnera à notre armée un appui plus large dans la population, facilitant le recrutement de civils. Cela rendra cependant plus difficile le maintien des standards professionnels."
GER_support_freikorps_tt:0 "3 divisions de §YFreikorps§! rejoindront notre camp au déclenchement de la §Yguerre civile§!."
GER_gott_mit_uns:0 "Gott Mit Uns"
GER_gott_mit_uns_desc:0 "Une devise impériale, expression de l’unité religieuse, politique et ethnique du peuple [ROOT.GetAdjective]. L’union de l’autel, du trône et du Volk."
GER_alliance_with_austria_hungary:0 "Alliance avec l’Autriche-Hongrie"
GER_alliance_with_austria_hungary_desc:0 "Nous devons restaurer la grande alliance qui nous liait aux Habsbourg."
GER_alliance_with_the_ottomans:0 "Alliance avec l’Empire ottoman"
GER_alliance_with_the_ottomans_desc:0 "Comme nous, les Ottomans ont été maltraités par l’Entente à la fin du Weltkrieg. Il est temps de restaurer ensemble notre place dans le monde."
GER_draft_new_constitution:0 "Rédiger une nouvelle constitution"
GER_draft_new_constitution_desc:0 "Pour garantir l’unité nationale et empêcher les extrémistes de prendre le pouvoir, nous devons veiller à ce que notre monarchie soit constitutionnellement et démocratiquement responsable. Ce n’est qu’alors que le Quatrième Reich deviendra un phare pour le reste du monde."
GER_prioritize_infrastructure:0 "Donner la priorité aux infrastructures"
GER_prioritize_infrastructure_desc:0 "Maintenir nos infrastructures à jour garantira que notre machine industrielle fonctionne plus efficacement dans tous les secteurs."
GER_prioritize_civilian_industry:0 "Donner la priorité à l’industrie civile"
GER_prioritize_civilian_industry_desc:0 "Assurer une industrie civile solide permettra d’améliorer la qualité de vie de notre peuple et d’accélérer le développement dans d’autres secteurs."
GER_prioritize_military_industry:0 "Donner la priorité à l’industrie militaire"
GER_prioritize_military_industry_desc:0 "La seule voie vers une armée forte est un soutien solide de l’industrie militaire. Une industrie militaire robuste ouvrira de nouvelles opportunités pour notre expansion militaire."
GER_prioritize_defensive_construction:0 "Donner la priorité aux constructions défensives"
GER_prioritize_defensive_construction_desc:0 "[GER.GetNameDefCap] court le plus grand risque d’invasion hostile extérieure dans ces temps politiques turbulents. Ainsi, pour assurer la stabilité et la sécurité du peuple [GER.GetAdjective], nous devons donner la priorité aux constructions défensives."
GER_kaiser_wilhelm_society:0 "Revitaliser la Société Kaiser Wilhelm"
GER_kaiser_wilhelm_society_desc:0 "Entre la conscription et les lois antisémites de Nuremberg, la base scientifique de [GER.GetNameDef] a eu du mal à poursuivre une recherche efficace. Revitaliser la Société Kaiser Wilhelm permettra à nos recherches militaires et civiles de s’élever vers de nouveaux sommets."
GER_return_scientists:0 "Exempter les scientifiques du service militaire"
GER_return_scientists_desc:0 "De nombreux anciens scientifiques ont été incorporés dans l’armée par la conscription ou d’autres systèmes obligatoires. En les exemptant de ces programmes, nous réduirons notre réserve de main-d’œuvre, mais nous assurerons que nos recherches restent à la pointe."
GER_enigma:0 "Améliorer Enigma"
GER_enigma_desc:0 "Poursuivre les recherches sur les méthodes de chiffrement Enigma pourrait donner des résultats étonnants, nous permettant de dissimuler davantage nos communications stratégiques à l’ennemi."
GER_volkssturm:0 "Former le Volkssturm"
GER_volkssturm_desc:0 "Bien que la guerre tourne à notre désavantage, nous avons encore une chance si nous, [GER.GetAdjective]s, nous unissons et combattons l’envahisseur de front ! C’est le dernier élément de notre guerre totale, et avec le Volkssturm, [GER.GetNameDef] ne sera jamais vaincu !"
GER_iraq_friend:0 "Se rapprocher de [IRQ.GetNameDef]"
GER_iraq_friend_desc:0 "[IRQ.GetNameDefCap] occupe une position stratégique avantageuse au Moyen-Orient et dispose d’un vaste réservoir de ressources nécessaires à la machine de guerre [GER.GetAdjective]. Se lier d’amitié avec ce pays pourrait s’avérer un choix judicieux qui nous évitera d’ouvrir un nouveau front."
GER_iraq_war:0 "Envahir [IRQ.GetNameDef]"
GER_iraq_war_desc:0 "[IRQ.GetNameDefCap] occupe une position stratégique avantageuse au Moyen-Orient et dispose d’un vaste réservoir de ressources nécessaires à la machine de guerre [GER.GetAdjective]. Envahir ce pays nous permettra de tenir cette position clé et d’exploiter pleinement ses ressources."
GER_iran_friend:0 "Se rapprocher de [PER.GetNameDef]"
GER_iran_friend_desc:0 "[PER.GetNameDefCap] possède une longue frontière avec [SOV.GetNameDef] et une position très stratégique en tant que porte d’entrée vers l’Asie. Se lier d’amitié avec ce pays sera un investissement fructueux qui ne détournera pas de ressources nécessaires de notre campagne principale."
GER_iran_war:0 "Envahir [PER.GetNameDef]"
GER_iran_war_desc:0 "[PER.GetNameDefCap] possède une longue frontière avec [SOV.GetNameDef] et une position très stratégique en tant que porte d’entrée vers l’Asie. Envahir ce pays nous permettra d’exercer une pression à travers le continent asiatique et d’ouvrir un nouveau front stratégique au sud de la Russie."
GER_influence_brazil:0 "Influencer [BRA.GetNameDef]"
GER_influence_brazil_desc:0 "En plus de ses ressources naturelles, [BRA.GetNameDef] occupe une position stratégique dans les Amériques. Avoir un allié proche de pays sud-américains vulnérables et à portée de frappe de [USA.GetNameDef] mérite toute notre attention."
GER_revive_brest_litovsk:0 "Ressusciter le traité de Brest-Litovsk"
GER_revive_brest_litovsk_desc:0 "Pour l’instant, notre guerre contre les [SOV.GetAdjective]s est un succès, mais notre armée est requise sur d’autres fronts. Ressusciter le traité de Brest-Litovsk nous permettra de faire la paix avec les [SOV.GetAdjective]s et d’obtenir nos gains territoriaux souhaités."
GER_5_factor:0 "Enigma à 5 rotors"
GER_5_factor_desc:0 "Passer à 5 rotors améliorera considérablement notre chiffrement."
GER_8_factor:0 "Enigma à 8 rotors"
GER_8_factor_desc:0 "Passer à 8 rotors rendra notre chiffrement pratiquement impossible à casser !"
GER_demand_northern_schleswig:0 "Revendiquer le Schleswig du Nord"
GER_demand_northern_schleswig_desc:0 "Le Schleswig du Nord nous a été enlevé et donné aux Danois par le traité de Versailles. Nous devons exiger la restitution de cette terre !"
GER_resolve_the_balkan_flank:0 "Régler le flanc balkanique"
GER_resolve_the_balkan_flank_desc:0 "Une chose est de nous inquiéter de [ITA.getnamedef] au sud. C’en est une autre de devoir composer avec la politique étrangère imprévisible de [YUG.getnamedef]. Il est temps de les aligner à notre camp, définitivement."
GER_emphasize_mine_warfare:0 "Mettre l’accent sur la guerre des mines"
GER_emphasize_mine_warfare_desc:0 "Les vastes côtes de notre nation sont extrêmement difficiles à défendre sans une énorme flotte de surface. Une proposition intéressante venue de notre Département de l’innovation et du développement naval suggère d’investir massivement dans la technologie de mouillage de mines, ce qui permettra de sécuriser davantage de littoral sans diviser nos rares forces navales."
GER_ally_greece_vanilla:0 "S’allier à [GRE.GetNameDef]"
GER_ally_greece_vanilla_desc:0 "Avec notre influence croissante dans la région, il est vital de garantir l’allégeance d’un acteur majeur au Sud. Leur soutien sera crucial pour faire pression sur les grandes puissances du Moyen-Orient et permettra à la Kriegsmarine d’opérer plus librement en mer Égée et en mer Noire."
GER_air_innovation_3:0 "Renforcer la Luftwaffe"
GER_air_innovation_3_desc:0 "Nos courageux as et nos équipes de mécaniciens professionnels recevront un soutien accru et renforceront leur coopération avec nos conglomérats de recherche afin de garantir que nos tactiques et équipements soient à jour."
GER_extra_tech_slot:0 "Étendre le financement scientifique"
GER_extra_tech_slot_desc:0 "Nous pouvons élargir considérablement notre réseau de recherche actuel afin de répondre aux besoins croissants de nos secteurs économiques et politiques. Nous encouragerons les jeunes hommes et femmes à rejoindre les nouvelles installations à travers notre nation prospère."
GER_train_colonial_troops:0 "Former des troupes coloniales"
GER_train_colonial_troops_desc:0 "Des spécialistes coloniaux doivent être formés pour sécuriser nos possessions d’outre-mer."
GER_the_breitspurbahn:0 "La Breitspurbahn"
GER_the_breitspurbahn_desc:0 "Bientôt, un immense réseau ferroviaire couvrira toute l’Europe, renforçant l’hégémonie [GER.GetAdjective]."
GER_the_anglo_german_naval_agreement:0 "L’Accord naval anglo-allemand"
GER_the_anglo_german_naval_agreement_desc:0 "En juin 1935, nous avons signé l’Accord naval anglo-allemand, autorisant la construction d’une marine limitée. Il est temps d’y jeter un nouveau regard..."
GER_adhere_to_the_agreement:0 "Respecter l’accord"
GER_adhere_to_the_agreement_desc:0 "Il vaut mieux ne pas provoquer les Britanniques : si la guerre éclate en Europe, nous ne pouvons pas nous permettre de les défier, car nous serions aussitôt soumis à un autre blocus. En respectant l’accord, nous pourrons concentrer nos ressources ailleurs."
GER_denounce_the_agreement:0 "Dénoncer l’accord"
GER_denounce_the_agreement_desc:0 "Il ne fait aucun doute que nous n’avions aucune intention réelle de maintenir le statu quo exigé par la Grande-Bretagne. L’Allemagne ne sera pas limitée dans ses ambitions !"
GER_scale_down_naval_projects:0 "Réduire les projets navals"
GER_scale_down_naval_projects_desc:0 "En annonçant une réduction massive de nos projets navals, davantage de ressources seront disponibles pour le secteur industriel, ce qui nous permettra de nous concentrer sur nos plans européens plutôt que de gaspiller sang, sueur et acier dans des navires fragiles."
GER_reopen_wilhelmshaven_shipyards:0 "Rouvrir les chantiers navals de Wilhelmshaven"
GER_reopen_wilhelmshaven_shipyards_desc:0 "Les chantiers navals de Wilhelmshaven ont été fermés après la Grande Guerre. Peut-être est-il temps de les rouvrir afin de renforcer nos projets de construction de convois."
GER_expand_blohm_voss_shipyards:0 "Agrandir les chantiers navals Blohm+Voss"
GER_expand_blohm_voss_shipyards_desc:0 "Blohm+Voss se sont déjà révélés de talentueux constructeurs de navires ; un petit investissement gouvernemental garantirait que leurs capacités soient pleinement exploitées."
GER_naval_plan_z:0 "Plan naval Z"
GER_naval_plan_z_desc:0 "L’Empire allemand possédait autrefois l’une des plus belles marines du monde. La Grande Guerre y mit fin, et le traité de Versailles en interdit la renaissance. Mais, avec le Plan Z, nous aurons de nouveau une flotte capable de rivaliser avec celle des Britanniques."
GER_naval_aviation_patrols:0 "Patrouilles aéronavales"
GER_naval_aviation_patrols_desc:0 "Plutôt que de compter sur la marine marchande pour protéger nos côtes, nous pouvons développer notre aviation navale, permettant à notre force aérienne de jouer un rôle dissuasif. Après tout, un avion coûte moins cher qu’un navire."
GER_simplify_convoy_construction:0 "Simplifier la construction des convois"
GER_simplify_convoy_construction_desc:0 "En réduisant le confort des convois et en les standardisant, nous pourrons en produire davantage, facilitant ainsi le flux de notre commerce."
GER_the_bismarck_class:0 "La classe Bismarck"
GER_the_bismarck_class_desc:0 "Après la Grande Guerre, nos anciens ennemis se sont encore plus entravés avec de nouveaux traités, limitant la taille de leurs navires. Nous ne sommes pas soumis à ces contraintes et savons ce qu’il faut faire pour les surpasser."
GER_fortify_the_coast:0 "Fortifier la côte"
GER_fortify_the_coast_desc:0 "En construisant des fortifications côtières et des installations anti-aériennes le long de la mer du Nord, nous garantirons que quiconque tente de débarquer rencontrera une résistance acharnée, qu’elle vienne de la mer ou du ciel."
GER_emergency_naval_program:0 "Programme naval d’urgence"
GER_emergency_naval_program_desc:0 "La guerre est arrivée en Allemagne et ce que nous avions espéré pour nous protéger n’est pas suffisant. Nous devons abandonner l’accord et, si nous ne pouvons pas construire une grande flotte de surface, une flotte de sous-marins devra suffire."
GER_the_o_class:0 "La classe O"
GER_the_o_class_desc:0 "Si Bismarck et Tirpitz seront les joyaux de notre flotte de l’Atlantique, ils doivent être accompagnés de navires capables. La classe O est conçue pour les compléter et ensemble, ils formeront le cœur de notre marine."
GER_abandon_plan_z:0 "Abandonner le Plan Z"
GER_abandon_plan_z_desc:0 "Dans les circonstances actuelles, nous ne pouvons pas nous permettre de maintenir le Plan Z : les navires coûtent trop cher et prennent trop de temps à construire. En nous concentrant sur une flotte sous-marine, nous pourrons toujours dominer l’Atlantique."
GER_rule_the_naval_skies:0 "Dominer les cieux navals"
GER_rule_the_naval_skies_desc:0 "La Grande Guerre a prouvé que l’aviation était le prochain champ de bataille à dominer, même en mer. Nous devons veiller à ce que nos navires capitaux disposent de l’escorte nécessaire, y compris aérienne."
GER_scout_cruisers:0 "Croiseurs de reconnaissance"
GER_scout_cruisers_desc:0 "Bien que la flotte principale soit capable de couler convois, croiseurs et cuirassés, nous avons besoin d’unités capables de traquer et de couler efficacement les convois ennemis tout en évitant l’engagement."
GER_the_m_class:0 "La classe M"
GER_the_m_class_desc:0 "Contrairement aux croiseurs de reconnaissance, la classe M accompagnera la flotte principale, fournissant un écran défensif aux cuirassés et affrontant croiseurs et destroyers ennemis tentant de nous forcer à combattre."
GER_trade_route_interdiction:0 "Interdiction des routes commerciales"
GER_trade_route_interdiction_desc:0 "La lame invisible est la plus mortelle : en frappant sous la surface, nous pourrons couler convoi après convoi, affamant nos ennemis de ravitaillements et de renforts."
GER_modular_submarine_construction:0 "Construction modulaire de sous-marins"
GER_modular_submarine_construction_desc:0 "En simplifiant la construction de nos sous-marins, nous pourrons en produire davantage en moins de temps. Cela nous permettra de déployer nos chasseurs silencieux à travers l’Atlantique sans entraves."
GER_the_h_class:0 "La classe H"
GER_the_h_class_desc:0 "Prochaine étape dans l’évolution de la classe Bismarck, la classe H doit être assez puissante pour projeter la force allemande non seulement dans l’Atlantique, mais au-delà !"
GER_reach_across_the_atlantic:0 "Atteindre l’Atlantique"
GER_reach_across_the_atlantic_desc:0 "Le temps est venu pour les navires de guerre allemands de traverser l’Atlantique dans une démonstration de force qui reléguera les flottes américaine et britannique dans l’ombre."


