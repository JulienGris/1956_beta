 HOL_economic_recovery:0 "Redressement économique"
 HOL_economic_recovery_desc:0 "La Grande Dépression nous a profondément affectés ; le chômage a frappé plus de 40 % de la population active. Notre situation est critique, nous devons donc tenter tout ce qui est possible pour relancer notre économie."
 HOL_technological_modernization:0 "Modernisation technologique"
 HOL_technological_modernization_desc:0 "Pour garantir que notre industrie reste compétitive dans la prochaine décennie, nous devons moderniser nos machines-outils et adopter de nouvelles méthodes de fabrication."
 HOL_electronic_innovations:0 "Innovations électroniques"
 HOL_electronic_innovations_desc:0 "Non seulement notre industrie de la radio garantira que nos troupes puissent communiquer efficacement, mais les composants électroniques joueront sans aucun doute un rôle vital dans certaines technologies de pointe."
 HOL_research_breakthrough:0 "Percée technologique"
 HOL_research_breakthrough_desc:0 "Avec notre économie qui se redresse jour après jour, nous pouvons capitaliser sur les éléments les plus innovants de notre industrie afin d’assurer notre développement."
 HOL_civilian_production:0 "Production civile"
 HOL_civilian_production_desc:0 "Nous devons relancer l’économie civile pour sortir de la récession. Des mesures ciblées pour favoriser l’investissement permettront aux usines de produire à nouveau davantage de biens et de réduire partiellement le chômage."
 HOL_expand_the_curacao_refineries:0 "Agrandir la raffinerie de Curaçao"
 HOL_expand_the_curacao_refineries_desc:0 "En raison du manque de capacités de raffinage au Venezuela et des difficultés de transport du pétrole des marais du nord-ouest du pays vers une autre raffinerie, Caribbean Petroleum (filiale de la Royal Dutch Shell) a construit une raffinerie sur l’île de Curaçao. Celle-ci peut être utilisée comme station de ravitaillement pour les navires se dirigeant vers le canal de Panama."
 HOL_fishing_industry:0 "Développer l’industrie de la pêche"
 HOL_fishing_industry_desc:0 "Nous nous sommes toujours tournés vers la mer, qui doit faire partie de notre développement économique. L’augmentation de notre flotte de pêche sera l’un des nombreux moyens de créer de la prospérité."
 HOL_conservative_government:0 "Un gouvernement conservateur"
 HOL_conservative_government_desc:0 "Une fois encore, le Parti antirévolutionnaire d’Hendrikus Colijn a remporté les élections et mènera les négociations pour former un nouveau gouvernement de coalition dirigé par les conservateurs."
 HOL_maintain_neutrality:0 "Maintenir la neutralité"
 HOL_maintain_neutrality_desc:0 "Pour éviter les nuages sombres qui s’amoncellent dans le ciel d’Europe, nous devons être comme une île protégée par nos canaux. Nous voulons rester en dehors de tout conflit européen. Néanmoins, certains analystes militaires ont averti notre gouvernement que la menace d’une possible intervention [ENG.GetAdjective] pourrait pousser les [GER.GetAdjective] à intervenir de manière préventive."
 HOL_deterrence:0 "Préparation militaire"
 HOL_deterrence_desc:0 "Même si nous ne souhaitons pas entrer en guerre, nous devons appliquer l’ancien dicton : les actes sont plus forts que les mots. Nous devons donc nous préparer à affronter toute menace étrangère si nous voulons les dissuader de nous attaquer."
 HOL_anti_revolutionary_measures:0 "Mesures antirévolutionnaires"
 HOL_anti_revolutionary_measures_desc:0 "S’il existe un objectif politique clair pour le Parti antirévolutionnaire, c’est bien, logiquement, de prévenir l’avènement d’une révolution aux [HOL.GetNameDef]. En luttant contre l’extrémisme des communistes comme des fascistes, la société civile évite d’être affaiblie par des idéologies autoritaires. L’une des principales mesures consiste à exclure les membres de ces partis de l’armée. Ensuite, le service secret doit surveiller les membres clés de ces organisations afin de s’assurer qu’ils ne soient pas des agents de puissances étrangères."
 HOL_mobilization_propaganda:0 "Propagande de mobilisation"
 HOL_mobilization_propaganda_desc:0 "Pour accroître le moral de notre population et lui faire prendre conscience que nous vivons une époque difficile, nous devons mettre en place un programme de propagande de mobilisation. Ce programme passera par divers médias : affiches, articles de presse et chansons, qui garantiront que les soldats mobilisés n’oublient pas leur devoir, même dans les moments de distraction."
 HOL_control_indonesian_intellectuals:0 "Contrôler les intellectuels indonésiens"
 HOL_control_indonesian_intellectuals_desc:0 "L’agitation des nationalistes indonésiens représente une menace importante pour l’intégrité de notre domaine colonial. En cette période de crise, un tel risque devient une menace potentiellement existentielle. Nous devons donc envoyer des instructions claires au Département de renseignement politique des Indes orientales pour contrôler ces individus turbulents."
 HOL_join_belgo_luxembourgian_customs_union:0 "Rejoindre l’union douanière"
 HOL_join_belgo_luxembourgian_customs_union_desc:0 "Pour renforcer notre économie, nous devrions approcher nos voisins du sud et négocier notre adhésion à l’union douanière [BEL.GetAdjective]-[LUX.GetAdjective] afin de former l’Union douanière du Benelux."
 HOL_diplomatic_cooperation:0 "Coopération diplomatique"
 HOL_diplomatic_cooperation_desc:0 "Éviter la guerre est notre objectif principal, et pour cela nous devons renforcer notre position diplomatique. Si ce plan réussit, nous pourrions même tenter de négocier un compromis et éviter la destruction d’une nouvelle génération dans les champs d’Europe."
 HOL_foreign_guarantees:0 "Garanties étrangères"
 HOL_foreign_guarantees_desc:0 "Même si la diplomatie peut tenter d’empêcher une guerre, nous devons tout de même être prêts à la possibilité d’un échec de notre médiation. Nous devons donc demander à des puissances étrangères de garantir notre indépendance."
 HOL_british_alliance:0 "Rejoindre [ENG.GetAdjective]"
 HOL_british_alliance_desc:0 "Pour protéger nos institutions démocratiques des menaces étrangères, nous devons accroître notre collaboration militaire avec [ENG.GetNameDef], tant en mer du Nord qu’en Asie orientale."
 HOL_british_naval_cooperation:0 "Coopération avec la marine [ENG.GetAdjective]"
 HOL_british_naval_cooperation_desc:0 "Notre marine n’est peut-être pas suffisante pour affronter seule nos ennemis, mais avec le soutien de la Royal Navy [ENG.GetAdjective], nous devrions être en mesure de prendre l’avantage sur les sept mers."
 HOL_the_new_ideal:0 "Le Nouvel Idéal"
 HOL_the_new_ideal_desc:0 "[GER.GetNameDefCap] a causé trop de dégâts au monde, et à nous en particulier. Ils doivent désormais en payer le prix en déplaçant leurs frontières vers l’est."

 HOL_support_trade:0 "Soutenir le commerce"
 HOL_support_trade_desc:0 "Contrairement à la croyance fasciste en un État autarcique homogène, notre histoire montre que le commerce est essentiel pour exercer une influence. Nous devons soutenir nos capacités commerciales et renforcer notre économie jusqu’à son niveau d’avant la crise."
 HOL_industrial_cooperation:0 "Coopération industrielle"
 HOL_industrial_cooperation_desc:0 "Coopération industrielle"

 HOL_technology_sharing:0 "Partage technologique"
 HOL_technology_sharing_desc:0 "Nous ne pourrons pas surmonter nos ennemis seuls et devons rassembler toute l’aide possible auprès de nos alliés."
 HOL_form_benelux:0 "Alliance militaire du Benelux"
 HOL_form_benelux_desc:0 "Avec notre inclusion dans l’union douanière, nous pouvons nous concentrer sur notre posture diplomatique en cas de conflit [FRA.GetAdjective]-[GER.GetAdjective]. Une coopération entre les pays de l’union douanière nous permettrait de protéger ensemble notre position et de coordonner notre préparation militaire."
 HOL_benelux_scientific_commission:0 "Commission scientifique du Benelux"
 HOL_benelux_scientific_commission_desc:0 "Après avoir mis en place des coopérations économiques et de défense, l’étape logique suivante est de coordonner nos recherches militaires."
 HOL_communist_electoral_success:0 "Succès électoral communiste"
 HOL_communist_electoral_success_desc:0 "Le peuple a appelé à la fin de la tyrannie corrompue de l’élite bourgeoise. Le chômage et la pauvreté doivent cesser, et la révolution doit triompher pour assurer un avenir radieux où il n’y aura plus de classes – un avenir de véritable liberté individuelle."
 HOL_communism_east_indies:0 "Propager le communisme aux Indes orientales"
 HOL_communism_east_indies_desc:0 "Les forces impérialistes corporatocratiques ont opprimé les Indes orientales depuis que la Compagnie néerlandaise des Indes orientales s’est emparée des îles au XVIIe siècle. Il est temps que les Indonésiens comprennent leur exploitation telle que révélée par Marx et se libèrent de la domination coloniale."
 HOL_autonomy_for_the_east_indies:0 "Autonomie pour les Indes orientales"
 HOL_autonomy_for_the_east_indies_desc:0 "Même si nous avons mis fin à la domination coloniale aux Indes orientales, il est clair que la société indonésienne n’est pas une société industrielle prête pour une véritable révolution telle qu’imaginée par Marx, Engels et Lénine. Nous devons donc maintenir une présence dans la région, tout en accordant une autonomie locale mais en guidant leur processus d’industrialisation."
 HOL_independence_for_the_east_indies:0 "Indépendance pour les Indes orientales"
 HOL_independence_for_the_east_indies_desc:0 "Nous devons appliquer le slogan des campagnes politiques précédentes dès que possible après l’installation d’un gouvernement communiste. Nous devons accorder la liberté à l’Indonésie et mettre fin à la domination impérialiste occidentale dans la région."
 HOL_social_reforms:0 "Réformes sociales"
 HOL_social_reforms_desc:0 "Pour assurer le bonheur des travailleurs et leur soutien au nouveau régime communiste, nous devons mettre en œuvre des réformes profondes afin de donner du travail aux chômeurs et d’améliorer les conditions de vie desdits travailleurs."
 HOL_nationalization:0 "Nationalisations"
 HOL_nationalization_desc:0 "Les capitalistes ont été incapables de gérer les usines sans opprimer les aspirations de leurs travailleurs et détourner les profits à leur profit au nom d’une cupidité éhontée et d’une pure dépravation morale."
 HOL_railroad_investments:0 "Investissements ferroviaires"
 HOL_railroad_investments_desc:0 "Les infrastructures sont un élément essentiel pour accroître la productivité et acheminer les records de production inattendus là où ils seront les plus utiles."
 HOL_invest_heavy_industry:0 "Investir dans l’industrie lourde"
 HOL_invest_heavy_industry_desc:0 "Seule l’augmentation de la production d’acier nous permettra de progresser et d’accélérer l’avènement d’un véritable communisme sans classes."
 HOL_rearmement_program:0 "Programme de réarmement"
 HOL_rearmement_program_desc:0 "Nous ne souhaitons pas combattre, mais nous devons protéger la liberté des travailleurs et la règle du parti à tout prix contre l’alliance des fascistes et des capitalistes."
 HOL_align_the_military:0 "Aligner l’armée"
 HOL_align_the_military_desc:0 "Trop longtemps, l’armée a été un instrument de l’élite bourgeoise dans la répression du prolétariat. Avec notre ascension, nous ne devons pas oublier que les conscrits sont l’émanation du prolétariat et doivent être la base d’une nouvelle armée, combattant pour le peuple au lieu de contre lui."
 HOL_state_security:0 "Organiser le service de sécurité"
 HOL_state_security_desc:0 "Comme la défense du parti et du prolétariat est indispensable au succès de la révolution, il est vital d’investir dans notre service de sécurité afin de garantir que les ennemis potentiels du peuple ne préparent pas la contre-révolution."
 HOL_join_comintern:0 "Pacte militaire communiste"
 HOL_join_comintern_desc:0 "La révolution doit se protéger contre ses ennemis. Cette époque sera sans aucun doute marquée par la guerre, et seule une grande alliance de tous les protecteurs du prolétariat permettra à notre classe de triompher des oppresseurs bourgeois."
 HOL_soviet_military_mission:0 "Mission militaire [SOV.GetAdjective]"
 HOL_soviet_military_mission_desc:0 "La modernisation de notre armée est un processus long et difficile. Une aide étrangère de nos alliés sera donc un complément bienvenu pour enrichir notre programme."

 HOL_NSB_electoral_success:0 "Victoire électorale du NSB"
 HOL_NSB_electoral_success_desc:0 "Le temps est venu pour la renaissance de notre unité nationale. Le peuple a appelé le NSB et Anton Mussert à gouverner les Pays-Bas et à sauver la nation des parasites bolcheviques."
 HOL_reinforce_grasp_on_the_colonies:0 "Renforcer notre emprise sur les colonies"
 HOL_reinforce_grasp_on_the_colonies_desc:0 "Depuis trop longtemps, le faible gouvernement démocratique a toléré l’agitation des éléments indigènes perturbateurs sous l’influence de Moscou. Nous devons prendre des mesures de sécurité efficaces pour les arrêter et mettre fin à la propagation de leur poison idéologique néfaste."
 HOL_mussert_guard:0 "Garde Mussert"
 HOL_mussert_guard_desc:0 "En tant qu’élite de notre mouvement, la Garde Mussert doit être le principal agent de la volonté du chef. L’avant-garde de notre mouvement doit être l’exemple éclatant du futur radieux qui apportera notre renaissance nationale."
 HOL_military_youth:0 "Nationale Jeugdstorm"
 HOL_military_youth_desc:0 "Notre chef, Anton Mussert, croit en la jeunesse car elle est notre avenir. Ce sera la première génération purgée des parasites de l’esprit que sont le capitalisme libéral [ENG.GetAdjective] et le bolchevisme internationaliste [SOV.GetAdjective]."
 HOL_influence_the_army:0 "Influencer l’armée"
 HOL_influence_the_army_desc:0 "Nous devons assurer le soutien de la classe des officiers si nous voulons réaliser notre projet et fonder le Dietsland."
 HOL_prepare_population_for_war:0 "Préparer la population à la guerre"
 HOL_prepare_population_for_war_desc:0 "Nos ennemis idéologiques nous menacent quotidiennement en toute impunité. Nous devons répondre à cette menace et mobiliser notre peuple pour renforcer sa volonté de combattre et d’anéantir les ennemis de notre révolution nationale."
 HOL_unite_dietschland:0 "Unifier le Dietsland"
 HOL_unite_dietschland_desc:0 "L’unité du Dietsland doit être l’objectif de tout [HOL.GetAdjective] ! Les Pays-Bas ont été morcelés parce que nous n’avons pas su tenir notre position à Bruxelles et Anvers face aux Espagnols. Lorsque l’unité fut restaurée en 1815, la bourgeoisie francophone nous a trahis et s’est révoltée après quelques années. Dans ce processus, ils nous ont opprimés pendant plus d’un siècle. Nous devons libérer la Flandre ! Nous devons restaurer l’unité ! Hou-zee !"
 HOL_invade_luxembourg:0 "Envahir le Luxembourg"
 HOL_invade_luxembourg_desc:0 "Envahir le Luxembourg"
 HOL_fate_of_wallonia:0 "Le sort de la Wallonie"
 HOL_fate_of_wallonia_desc:0 "Le sort de la Wallonie"
 HOL_support_diets_fascists:0 "Accord avec les fascistes du Diets"
 HOL_support_diets_fascists_desc:0 "Si nous pouvions obtenir un accord avec le Verdinaso, un parti désireux d’unir les Pays-Bas comme nous, nous pourrions fonder le deuxième plus grand empire colonial de la Terre sans tirer un seul coup de feu."
 HOL_armement_investments:0 "Investissements dans l’armement"
 HOL_armement_investments_desc:0 "Seule une forte industrie de guerre nous permettra de déployer une armée encore plus puissante."
 HOL_nederlandse_arbeidsdienst:0 "Nederlandse Arbeidsdienst"
 HOL_nederlandse_arbeidsdienst_desc:0 "Nous devons mobiliser les sections de travailleurs contre leur volonté pour garantir que la production continue malgré les destructions de la guerre."
 HOL_defense_of_the_fatherland:0 "Défense de la patrie"
 HOL_defense_of_the_fatherland_desc:0 "Votre pays a besoin de vous !"
 HOL_claim_heritage_of_ruyter:0 "Revendiquer l’héritage de De Ruyter"
 HOL_claim_heritage_of_ruyter_desc:0 "L’amiral Michiel de Ruyter a détruit la flotte britannique durant l’âge d’or néerlandais. Une fois encore, les [ENG.GetAdjective] nous menacent, et il est temps pour un nouveau grand amiral de libérer la mer de la tyrannie de l’Albion."
 HOL_join_axis:0 "S’allier aux nazis"
 HOL_join_axis_desc:0 "[GER.GetNameDefCap] nous a montré notre modèle idéologique car notre peuple fait également partie de la famille germanique. Nos intérêts ethniques et politiques s’alignent sur les objectifs [GER.GetAdjective], et nous devons pousser à une coopération totale."
 HOL_german_military_coop:0 "Coopération militaire avec [GER.GetNameDef]"
 HOL_german_military_coop_desc:0 "Pour assurer le triomphe de notre alliance, nous devons demander l’aide des spécialistes [GER.GetAdjective] afin de faciliter notre processus de modernisation."
 HOL_requirements_of_the_land_troops:0 "Besoins des troupes terrestres"
 HOL_requirements_of_the_land_troops_desc:0 "De nombreux changements doivent être apportés pour mettre nos troupes au niveau de nos voisins, car le budget de la défense est resté inférieur aux recommandations de l’armée depuis 1916. Maintenant que nous pouvons enfin lancer un programme de modernisation, nous devons évaluer les besoins les plus urgents de nos troupes et répartir nos fonds en conséquence."
 HOL_modernize_military_tactics:0 "Moderniser les tactiques militaires"
 HOL_modernize_military_tactics_desc:0 "Bien que de nombreuses armes soient assez similaires à celles utilisées pendant la Grande Guerre, l’évolution de certains armements, comme les avions et les chars légers, a ouvert de nouveaux potentiels tactiques que nous devons comprendre si nous voulons agir efficacement contre ces menaces potentielles."
 HOL_modernize_the_field_artillery:0 "Moderniser l’artillerie de campagne"
 HOL_modernize_the_field_artillery_desc:0 "Pour garantir une puissance de feu suffisante, nous devons développer de meilleurs modèles d’artillerie. En tant que seul producteur [HOL.GetAdjective] d’artillerie, H.I.H. sera logiquement à l’avant-garde de ce programme."
 HOL_AT_guns:0 "Acquérir des canons antichars"
 HOL_AT_guns_desc:0 "Les chars ont joué un rôle majeur dans les dernières offensives de 1918 et n’ont cessé d’être modernisés ces dernières années. Un conscrit ne peut pas faire grand-chose contre un blindé avec un simple fusil, il est donc crucial de soutenir notre infanterie avec de petites pièces d’artillerie conçues pour percer les blindages."
 HOL_modernize_the_infantry:0 "Moderniser l’infanterie"
 HOL_modernize_the_infantry_desc:0 "Si nous voulons améliorer l’efficacité au combat de nos conscrits, nous devons non seulement améliorer leur entraînement mais aussi leur fournir un équipement adéquat."
 HOL_bicycle_infantry:0 "Infanterie cycliste"
 HOL_bicycle_infantry_desc:0 "Les bicyclettes sont notre moyen de transport favori qui permettra à notre infanterie de gagner une mobilité indispensable."
 HOL_infantry_motorization:0 "Motorisation de l’infanterie"
 HOL_infantry_motorization_desc:0 "La motorisation est une étape essentielle dans la modernisation d’une force militaire, car elle permet une progression rapide en territoire ennemi ou un déploiement rapide lorsqu’une brèche apparaît sur notre ligne de front ou celle de l’ennemi."
 HOL_new_weapons_new_tactics:0 "Nouvelles armes, nouvelles tactiques"
 HOL_new_weapons_new_tactics_desc:0 "Ces dernières années ont vu l’introduction de nombreux nouveaux types d’équipements, et nous devons adapter nos doctrines militaires afin d’utiliser ces nouvelles armes à leur plein potentiel."
 HOL_tanks:0 "Corps blindé"
 HOL_tanks_desc:0 "Depuis des années, les blindés ont prouvé leur utilité comme plateforme de soutien pour l’infanterie ou comme fer de lance d’une offensive terrestre. Il est temps pour nous de développer notre corps de chars afin d’apporter une puissance de feu supplémentaire indispensable sur le front."
 HOL_convert_werkspoor_train_factory:0 "Convertir l’usine de trains Werkspoor"
 HOL_convert_werkspoor_train_factory_desc:0 "Partout en Europe, de nombreux fabricants de trains ont été reconvertis en fabricants de blindés. Cela ne devrait pas surprendre puisqu’ils construisaient déjà des véhicules en acier complexes avant leur reconversion. Nous devons suivre cette voie et transformer l’usine de trains Werkspoor en fer de lance de notre programme de production de chars."
 HOL_thomassen_motor_factory:0 "Usine de moteurs Thomassen"
 HOL_thomassen_motor_factory_desc:0 "Située près d’Arnhem en Gueldre, nous devons mobiliser l’usine Thomassen Motors pour produire des moteurs pour nos camions, chars et avions."
 HOL_ammunitions_production:0 "Production de munitions"
 HOL_ammunitions_production_desc:0 "Notre production d’armes peut être limitée, mais nous pouvons tout de même produire rapidement des munitions supplémentaires pour approvisionner nos troupes."
 HOL_AA_needs:0 "Se protéger contre la menace aérienne"
 HOL_AA_needs_desc:0 "La peur d’une annihilation totale par des bombardements intenses est la peur de notre époque. D’immenses escadrons de bombardiers pourraient probablement anéantir aussi bien des armées que des villes. Nous devons nous équiper des moyens de riposter."
 HOL_private_support_of_AA_defenses:0 "Chercher un soutien privé pour les défenses antiaériennes"
 HOL_private_support_of_AA_defenses_desc:0 "Pour renforcer nos défenses antiaériennes, nous devons demander le soutien d’entreprises privées afin qu’elles contribuent à l’acquisition de batteries antiaériennes."
 HOL_coastal_defensive_line:0 "Ligne défensive côtière"
 HOL_coastal_defensive_line_desc:0 "Pour nous protéger de la menace d’une invasion [ENG.GetAdjective], nous devons mettre en place des défenses le long de notre côte et nous préparer à affronter l’ennemi sur nos plages, nos digues et dans nos ports."
 HOL_water_defensive_line:0 "Notre pire ennemi est notre meilleure défense"
 HOL_water_defensive_line_desc:0 "L’eau est notre ennemie. Nous avons besoin de digues pour éviter les inondations dévastatrices et gagner des terres sur la mer. Mais en cas de besoin, elle peut aussi devenir notre alliée. Nous pouvons créer une solide ligne défensive en inondant des parties stratégiques du pays et en y installant des défenses préparées."
 HOL_military_modernization:0 "Modernisation militaire"
 HOL_military_modernization_desc:0 "Nous devons encourager la coopération entre les fabricants et rassembler nos capacités industrielles pour explorer de nouveaux modèles et de nouveaux domaines de savoir. La percée technologique qui en résultera nous permettra d’améliorer considérablement la qualité de nos armes et donc de nos forces armées."

 HOL_aviation_buildup:0 "Renforcement de l’aviation"
 HOL_aviation_buildup_desc:0 "Avec la menace d’une nouvelle guerre qui se profile à l’horizon, une force aérienne moderne doit être établie afin de garantir que notre ciel reste bleu. Espérons que nous pourrons compter sur nos constructeurs d’avions pour nous aider dans cette entreprise."
 HOL_small_airframes:0 "Cellules légères"
 HOL_small_airframes_desc:0 "Pour protéger le ciel de notre pays, nous devrions nous concentrer sur le développement de petites cellules. Ces conceptions permettraient la création de petits avions agiles pour équiper nos forces de chasseurs."
 HOL_large_airframes:0 "Cellules lourdes"
 HOL_large_airframes_desc:0 "En donnant la priorité aux cellules plus grandes, nous serons en mesure de développer des avions à plus grande autonomie. Cette caractéristique est essentielle si nous voulons contrôler l’immensité de notre domaine colonial."
 HOL_develop_different_plane_types:0 "Compléter les modèles précédents"
 HOL_develop_different_plane_types_desc:0 "Compléter les modèles précédents."
 HOL_buy_planes_abroad:0 "Acheter des avions à l’étranger"
 HOL_buy_planes_abroad_desc:0 "Comme notre production est limitée, nous devons contacter des fabricants étrangers pour acquérir des avions modernes."
 HOL_licensed_planes:0 "Avions sous licence"
 HOL_licensed_planes_desc:0 "Grâce aux contacts établis avec des fabricants étrangers, nous serons en mesure d’obtenir de plus gros contrats de licence afin de nous libérer de la nécessité de développer directement de nouveaux avions."
 HOL_aviation_industry:0 "Développer l’industrie aéronautique"
 HOL_aviation_industry_desc:0 "Nos fabricants d’avions doivent accroître leur productivité à tout prix si nous voulons mettre suffisamment d’appareils dans le ciel pour faire face aux menaces ennemies."
 HOL_dogfight_competitions:0 "Compétitions de combat aérien"
 HOL_dogfight_competitions_desc:0 "Comme moyen d’entraînement, les pilotes devraient « s’affronter » et exécuter des manœuvres acrobatiques pour gagner. Ils n’hésiteront pas à utiliser des acrobaties risquées pour l’emporter en combat aérien."
 HOL_standardize_the_designs:0 "Standardiser les modèles"
 HOL_standardize_the_designs_desc:0 "Standardiser les modèles."
 HOL_radar:0 "Radar"
 HOL_radar_desc:0 "Le savoir est une forme de pouvoir. Savoir où se trouvent les avions ennemis ne les fera pas tomber, mais savoir où tirer facilitera grandement le processus."
 HOL_modern_air_doctrine:0 "Doctrine aérienne moderne"
 HOL_modern_air_doctrine_desc:0 "Pour suivre le nouveau développement révolutionnaire dans la gestion des escadrons aériens et l’utilisation tactique des avions, nous devons repenser nos conceptions de la guerre aérienne afin de surpasser nos adversaires."


 HOL_aviolanda_de_schelde_flyingboats:0 "Hydravions Aviolanda et De Schelde"
 HOL_aviolanda_de_schelde_flyingboats_desc:0 "Le constructeur aéronautique Aviolanda et le chantier naval De Schelde doivent coopérer pour construire des avions capables d’atterrir et de décoller en mer, surveiller la vaste zone maritime et transmettre les informations à la marine."
 HOL_naval_rearmement:0 "Réarmement naval"
 HOL_naval_rearmement_desc:0 "Comme notre budget de défense a été réduit au cours des 20 dernières années, il faudra un effort considérable et la coopération des plus grands chantiers navals du pays pour développer de nouvelles classes de navires et déployer une force prête à défendre notre sécurité en utilisant notre véritable ennemi : la mer."
 HOL_O19_class:0 "Développer le O 19"
 HOL_O19_class_desc:0 "Pour compléter notre flotte de sous-marins, nous devrions ajouter une nouvelle classe de submersibles poseurs de mines."
 HOL_O21_class:0 "Sous-marin de nouvelle génération"
 HOL_O21_class_desc:0 "Sous-marin de nouvelle génération"
 HOL_new_light_cruiser_class:0 "Moderniser la conception des croiseurs légers"
 HOL_new_light_cruiser_class_desc:0 "Moderniser la conception des croiseurs légers"
 HOL_new_destroyer_class:0 "Repenser les plans des destroyers"
 HOL_new_destroyer_class_desc:0 "Repenser les plans des destroyers"
 HOL_naval_doctrine:0 "Formaliser la doctrine navale"
 HOL_naval_doctrine_desc:0 "Pour assurer la coordination de la flotte, nous devons veiller à ce que tous les officiers comprennent la doctrine qui guide nos opérations navales."
 HOL_replace_the_soerabaja:0 "Remplacer le Soerabaja"
 HOL_replace_the_soerabaja_desc:0 "Le Soerabaja fut pendant des années le navire amiral de notre flotte des Indes orientales. Mais depuis la mutinerie de 1930, il a perdu une partie de son prestige et est également devenu un navire obsolète selon les standards actuels."
 HOL_modern_naval_tactics:0 "Tactiques navales modernes"
 HOL_modern_naval_tactics_desc:0 "Notre capacité à combattre en mer est directement liée aux compétences de nos capitaines. Ils doivent donc être au fait des dernières innovations et se coordonner parfaitement pour agir efficacement."
 HOL_our_own_carrier:0 "Notre propre porte-avions"
 HOL_our_own_carrier_desc:0 "Nous devons expérimenter les porte-avions pour amener notre aviation avec notre flotte sans dépendre des hydravions. Peut-être devrions-nous commencer le programme en construisant un pont plat sur un pétrolier et le convertir en petit porte-avions."
 HOL_increase_shipyards_production:0 "Augmenter la production des chantiers navals"
 HOL_increase_shipyards_production_desc:0 "Pour garantir la victoire en mer, des investissements supplémentaires dans nos chantiers navals sont nécessaires."
 HOL_marine_infantry:0 "Infanterie de marine"
 HOL_marine_infantry_desc:0 "L’influence de la marine en mer est inutile si elle ne peut être projetée à terre. Des hommes sélectionnés doivent donc être choisis et formés pour effectuer des invasions amphibies et tenir jusqu’à l’arrivée des renforts."

 indonesian_nationalism_suppressed:0 "Répression du nationalisme indonésien"

 netherlands.1.t:0 "Le Premier ministre a une liaison avec une Allemande !"
 netherlands.1.desc:0 "Un journal a allégué dans son édition du jour que le Premier ministre lui-même entretenait une relation avec une Allemande nommée Hella Schultz. Selon la source du journal, il a été vu avec elle en train de dîner à Nice, et ils se sont rendus dans le même hôtel à Londres quelques mois plus tard. De plus, la sécurité d’État néerlandaise estime que, même si elle a été officiellement expulsée d’Allemagne, elle pourrait être un agent allemand."
 netherlands.1.a:0 "C’était une affaire privée, je l’ai aidée à s’installer en Argentine."
 netherlands.1.b:0 "Tout nier !"

 netherlands.2.t:0 "Le Premier ministre refuse la coalition avec les catholiques"
 netherlands.2.desc:0 "Dans un tournant surprenant, le Premier ministre Hendrikus Colijn a annoncé qu’il n’avait pas pu parvenir à un accord avec le parti catholique. Le gouvernement est désormais minoritaire et, à moins que les négociations ne reprennent dans les prochains jours, une démission de l’exécutif actuel est probable."
 netherlands.2.a:0 "Continuer à négocier."
 netherlands.2.b:0 "Nous ne trahirons pas notre électorat."

 netherlands.3.t:0 "Le Premier ministre exprime des opinions défaitistes"
 netherlands.3.desc:0 "Aujourd’hui, Dirk Jan de Geer a confié à la reine qu’il pense que le pays est perdu. Le gouvernement est en exil et les chances de victoire dans cette guerre sont au mieux très minces."
 netherlands.3.a:0 "La libération des Pays-Bas est notre seul objectif."

 netherlands.4.t:0 "Compétition de chasseurs"
 netherlands.4.desc:0 "Une étude récente du combat aérien moderne a révélé une faiblesse critique dans notre force aérienne. Nos chasseurs accusent un retard considérable par rapport aux développements des autres pays. Le ministère de l’Air a lancé un programme d’urgence pour acquérir un chasseur moderne dès que possible. Comme un développement national prendrait un temps inacceptable, il a été décidé d’acheter une licence à l’étranger. Un budget supplémentaire a été autorisé.\n\nLes experts ne s’accordent pas sur le type d’avion qui conviendrait le mieux pour moderniser nos escadrons de chasse."
 netherlands.4.a:0 "Un intercepteur léger qui sera construit par Fokker ou Koolhoven"
 netherlands.4.b:0 "Un chasseur lourd qui sera construit par Fokker."
 netherlands.5.t:0 "Compétition de chasseurs légers"
 netherlands.5.desc_light_fighter:0 "Le ministère de la Défense recherche un nouveau chasseur léger qui nous permettrait de protéger notre espace aérien. Le ministère des Affaires étrangères ne s’est pas opposé au projet mais a suggéré que les considérations politiques et diplomatiques devraient également jouer un rôle dans la décision du pays auprès duquel acheter."
 netherlands.5.desc_light_fighter_refused:0 "Invoquant la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous aurons peut-être plus de chances ailleurs, ou nous pourrons envisager de moderniser nos avions existants comme solution de secours."
 netherlands.5.a:0 "Se tourner vers [GER.GetNameDef]."
 netherlands.5.b:0 "Se tourner vers [ITA.GetNameDef]."
 netherlands.5.c:0 "Se tourner vers [FRA.GetNameDef]."
 netherlands.5.d:0 "Se tourner vers [ENG.GetNameDef]."
 netherlands.5.e:0 "Se tourner vers [USA.GetNameDef]."
 netherlands.5.f:0 "Utiliser l’expérience acquise grâce à la compétition pour améliorer nos propres avions."
 netherlands.6.t:0 "Compétition de chasseurs lourds"
 netherlands.6.desc_heavy_fighter:0 "Le ministère de l’Air cherche à se procurer un nouveau chasseur lourd pour l’interception à long rayon d’action et l’escorte de bombardiers, mais le ministère des Affaires étrangères a suggéré que les considérations politiques et diplomatiques devraient également jouer un rôle dans la décision du pays auprès duquel acheter."
 netherlands.6.desc_heavy_fighter_refused:0 "Invoquant la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous aurons peut-être plus de chances ailleurs, ou nous pourrons envisager de moderniser nos avions existants comme solution de secours."
 netherlands.7.t:0 "Compétition de chasseurs [From.GetAdjective]"
 netherlands.7.desc:0 "La force aérienne [From.GetAdjective] organise actuellement des essais pour un nouveau chasseur léger. Selon notre attaché aérien, notre dernier modèle est en bonne position pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue sous peu.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des préoccupations de sécurité nationale existent concernant la vente de notre équipement le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
 netherlands.7.a:0 "Absolument."
 netherlands.7.b:0 "Nous ne pouvons pas risquer de fuites."
 netherlands.8.desc:0 "La force aérienne [From.GetAdjective] organise actuellement des essais pour un nouveau chasseur lourd. Selon notre attaché aérien, notre dernier modèle est en bonne position pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue sous peu.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des préoccupations de sécurité nationale existent concernant la vente de notre équipement le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
 netherlands.9.t:0 "Compétition de chasseurs terminée"
 netherlands.9.desc:0 "À la suite de négociations avec le constructeur et les responsables de l’État, nous avons réussi à obtenir une licence de production pour un nouveau chasseur. Un exemplaire de l’avion est déjà arrivé pour former les mécaniciens à son entretien, et un ensemble complet de plans et de schémas est attendu sous peu. La production peut commencer à tout moment."
 netherlands.9.a:0 "Parfait."
 netherlands.10.t:0 "Compétition de bombardiers"
 netherlands.10.desc:0 "Une étude du ministère de l’Air a révélé que nos forces aériennes sont mal équipées pour soutenir l’armée. Les frappes aériennes à longue portée et l’appui aérien rapproché ont été identifiés comme des domaines clés dans lesquels nous sommes gravement déficients. Le gouvernement a débloqué des fonds pour un programme d’urgence visant à acquérir un bombardier moderne, mais nous devons décider quel type d’avion nous devrions nous procurer."
 netherlands.10.a:0 "Un petit bombardier pour l’appui rapproché."
 netherlands.10.b:0 "Un avion plus grand avec plus d’autonomie."
netherlands.11.t:0 "Compétition de bombardiers légers"
netherlands.11.desc_cas:0 "Le ministère de l’Air cherche à se procurer un nouveau bombardier léger pour l’appui rapproché des forces terrestres, mais le ministère des Affaires étrangères a suggéré que les considérations politiques et diplomatiques devraient également jouer un rôle dans le choix du pays auprès duquel acheter."
netherlands.11.desc_cas_refused:0 "Invoquant la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous aurons peut-être plus de chances ailleurs, ou nous pourrons envisager de moderniser nos avions existants comme solution de secours."
netherlands.11.a:0 "Se tourner vers [GER.GetNameDef]."
netherlands.11.b:0 "Se tourner vers [ITA.GetNameDef]."
netherlands.11.c:0 "Se tourner vers [FRA.GetNameDef]."
netherlands.11.d:0 "Se tourner vers [ENG.GetNameDef]."
netherlands.11.e:0 "Se tourner vers [USA.GetNameDef]."

netherlands.12.t:0 "Compétition de bombardiers moyens"
netherlands.12.desc_tac:0 "Le ministère de l’Air cherche à se procurer un nouveau bombardier moyen pour l’interdiction à longue portée et les frappes tactiques, mais le ministère des Affaires étrangères a suggéré que les considérations politiques et diplomatiques devraient également jouer un rôle dans le choix du pays auprès duquel acheter."
netherlands.12.desc_tac_refused:0 "Invoquant la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous aurons peut-être plus de chances ailleurs, ou nous pourrons envisager de moderniser nos avions existants comme solution de secours."
netherlands.12.a:0 "Se tourner vers [GER.GetNameDef]."
netherlands.12.b:0 "Se tourner vers [ITA.GetNameDef]."
netherlands.12.c:0 "Se tourner vers [FRA.GetNameDef]."
netherlands.12.d:0 "Se tourner vers [ENG.GetNameDef]."
netherlands.12.e:0 "Se tourner vers [USA.GetNameDef]."

netherlands.13.t:0 "Compétition de bombardiers [From.GetAdjective]"
netherlands.13.desc:0 "La force aérienne [From.GetAdjective] organise actuellement des essais pour un nouveau bombardier léger. Selon notre attaché aérien, notre dernier modèle est en bonne position pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue sous peu.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des préoccupations de sécurité nationale existent concernant la vente de notre équipement le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
netherlands.13.a:0 "Montrons-leur nos plans."
netherlands.13.b:0 "Nous n’avons aucun intérêt."

netherlands.14.t:0 "Compétition de bombardiers [From.GetAdjective]"
netherlands.14.desc:0 "La force aérienne [From.GetAdjective] organise actuellement des essais pour un nouveau bombardier moyen. Selon notre attaché aérien, notre dernier modèle est en bonne position pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue sous peu.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des préoccupations de sécurité nationale existent concernant la vente de notre équipement le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
netherlands.14.a:0 "Montrons-leur nos plans."
netherlands.14.b:0 "Nous n’avons aucun intérêt."

netherlands.15.t:0 "Compétition de bombardiers terminée"
netherlands.15.desc:0 "À la suite de négociations avec le constructeur et les responsables de l’État, nous avons réussi à obtenir une licence de production pour un nouveau bombardier. Un exemplaire de l’avion est déjà arrivé pour former les mécaniciens à son entretien, et un ensemble complet de plans et de schémas est attendu sous peu. La production peut commencer à tout moment."
netherlands.15.a:0 "Parfait."

netherlands.16.t:0 "[HOL.GetNameDefCap] exige notre protection"
netherlands.16.desc:0 "Des représentants de [ENG.GetNameDef] ont contacté notre service diplomatique pour voir si nous pouvions les rencontrer et garantir publiquement leurs frontières. Ainsi, nous annoncerions clairement notre intention de protéger le droit des petites nations contre les menaces idéologiques étrangères."
netherlands.16.a:0 "Cela protégera la liberté et le commerce avec un partenaire précieux."
netherlands.16.b:0 "Nous devons éviter les promesses creuses."

netherlands.17.t:0 "Le gouvernement [ENG.GetAdjective] a accepté notre proposition"
netherlands.17.desc:0 "Les négociations entre les ministres des Affaires étrangères [ENG.GetAdjective] et [HOL.GetAdjective] ont mené avec succès à la signature d’une déclaration officielle garantissant les frontières de notre pays. Cette déclaration consacre notre neutralité actuelle comme une position sacrée."
netherlands.17.a:0 "[ENG.GetNameDefCap] est à nos côtés."

netherlands.18.t:0 "Le gouvernement [ENG.GetAdjective] a refusé de nous garantir !"
netherlands.18.desc:0 "Hier, un sommet s’est tenu à Londres entre des représentants [HOL.GetAdjective] et [ENG.GetAdjective] pour discuter de la possibilité d’une garantie [ENG.GetAdjective] sur [HOL.GetNameDef]. La perspective d’un engagement [ENG.GetAdjective] en faveur de la protection des petites nations d’Europe et de leur liberté a tourné à la désillusion, le sommet s’étant terminé sans position claire du côté [ENG.GetAdjective]."
netherlands.18.a:0 "Une énorme déception."

netherlands.19.t:0 "[HOL.GetNameDefCap] exige notre protection"
netherlands.19.desc:0 "Des représentants de [HOL.GetNameDef] ont contacté notre service diplomatique pour voir si nous pouvions les rencontrer et garantir publiquement leurs frontières. Ainsi, nous annoncerions clairement notre intention de protéger le droit des petites nations contre les menaces idéologiques étrangères."
netherlands.19.a:0 "Nous devons protéger le droit des petites nations."
netherlands.19.b:0 "Nous devons éviter les promesses creuses."

netherlands.20.t:0 "[FRA.GetNameDefCap] garantit nos frontières"
netherlands.20.desc:0 "Les négociations entre les représentants [FRA.GetAdjective] et [HOL.GetAdjective] ont mené avec succès à la signature d’une déclaration officielle garantissant les frontières de notre pays."
netherlands.20.a:0 "[FRA.GetNameDefCap] est à nos côtés."

netherlands.21.t:0 "Le gouvernement [FRA.GetAdjective] a refusé de nous garantir !"
netherlands.21.desc:0 "Hier, un sommet s’est tenu à Amsterdam entre des représentants [HOL.GetAdjective] et [FRA.GetAdjective] pour discuter de la possibilité de garanties. Cependant, aucun accord n’a été conclu puisque l’ambassadeur [FRA.GetAdjective] n’a fait que de vagues promesses."
netherlands.21.a:0 "Une énorme déception."

netherlands.22.t:0 "[HOL.GetNameDefCap] veut rejoindre l’union douanière du Benelux"
netherlands.22.desc:0 "Plus fortement touché par la Grande Dépression que ses voisins, [HOL.GetNameDef] envisage de renforcer ses liens avec nous et de transformer l’union douanière [BEL.GetAdjective]-[LUX.GetAdjective] en une union douanière du Benelux."
netherlands.22.a:0 "Cela profiterait à tout le monde !"
netherlands.22.b:0 "Nous n’avons pas besoin de cela."

netherlands.23.t:0 "Le gouvernement [BEL.GetAdjective] a approuvé notre proposition de libre-échange !"
netherlands.23.desc:0 "Désireux d’améliorer la situation économique de nos pays après des années de difficultés financières, le gouvernement [BEL.GetAdjective] a approuvé la signature d’un accord transformant l’union douanière entre [BEL.GetNameDef] et [LUX.GetNameDef], établie en 1921, en une alliance commerciale tripartite."
netherlands.23.a:0 "C’est une opportunité historique."

netherlands.24.t:0 "[HOL.GetNameDefCap] rejoint notre union douanière avec [BEL.GetNameDef]"
netherlands.24.desc:0 "Après des négociations avec le gouvernement [BEL.GetAdjective], les [HOL.GetAdjective] ont rejoint notre union douanière avec [BEL.GetNameDef] et formé l’union douanière du Benelux."
netherlands.24.a:0 "Cela profitera à tout le monde !"

netherlands.25.t:0 "Le gouvernement [BEL.GetAdjective] a refusé notre proposition de libre-échange !"
netherlands.25.desc:0 "Malgré nos meilleurs efforts et le potentiel bénéfique pour tous les participants, le gouvernement [BEL.GetAdjective] a refusé de supprimer les droits de douane sur les marchandises échangées à travers notre frontière."
netherlands.25.a:0 "C’est une honte."

netherlands.26.t:0 "Le gouvernement [HOL.GetAdjective] discute d’une nouvelle politique étrangère !"
netherlands.26.desc:0 "Après l’échec des négociations avec [BEL.GetNameDef] et [LUX.GetNameDef], il semble clair que l’avenir de [HOL.GetNameDef] ne réside pas dans le renforcement des liens avec [BEL.GetNameDef]. Coincé dans une impasse diplomatique, le gouvernement doit désormais explorer de nouvelles opportunités et réorienter sa politique étrangère."
netherlands.26.a:0 "Nous devons compter sur nous-mêmes."
netherlands.26.b:0 "Nous devons essayer de nous allier avec [ENG.GetNameDef]."

netherlands.27.t:0 "La reine réagit à la prise de pouvoir communiste"
netherlands.27.desc:0 "Il est bien connu que la montée du communisme dans le pays a profondément préoccupé la reine. Elle voit logiquement le communisme comme une idéologie incompatible avec le pouvoir héréditaire de la maison d’Orange-Nassau. Il n’est donc pas surprenant que la rumeur se répande selon laquelle la reine pense de plus en plus à quitter le pays."
netherlands.27.a:0 "Nous verrons."
netherlands.27.b:0 "Espionnez-la."

netherlands.28.t:0 "La reine part en exil"
netherlands.28.desc:0 "La reine n’est plus dans son palais. Craignant les foules communistes en colère, elle a discrètement fui le pays avec l’aide de complices réactionnaires."
netherlands.28.a:0 "La monarchie est le dernier vestige du féodalisme."

netherlands.29.t:0 "Wilhelmina arrêtée !"
netherlands.29.desc:0 "En tentant de fuir le pays, Wilhelmina van Orange-Nassau a été capturée par des agents loyaux au parti communiste. Elle a rapidement été arrêtée et emprisonnée en tant que principale dirigeante du régime capitaliste corrompu du passé."
netherlands.29.a:0 "Vive la révolution !"

netherlands.30.t:0 "La Zwarte Brigade rejoint le combat !"
netherlands.30.desc:0 "Des fascistes flamands désireux de soutenir notre lutte se sont soulevés à Anvers et à Gand. La rumeur dit que nos partisans ont déjà sécurisé la gare centrale et tentent de contrôler tout le centre-ville. Nous devons espérer qu’ils sécuriseront rapidement les casernes. Pendant ce temps, à Gand, l’hôtel de ville a été attaqué à l’aube, et un récent rapport annonce que le drapeau du Verdinaso et notre drapeau flottent ensemble au sommet du château des comtes de Flandre."
netherlands.30.a:0 "Hou Zee !"

netherlands.31.t:0 "La Zwarte Brigade se révolte à Gand et à Anvers !"
netherlands.31.desc:0 "Des traîtres flamands voulant unir la Flandre et les Pays-Bas pour former le soi-disant « Dietsland » ont organisé une révolte armée à Anvers et à Gand. La rumeur dit qu’ils ont déjà sécurisé la gare centrale et que les miliciens noirs tentent de prendre le contrôle de tout le centre-ville. Plus inquiétant encore, nous n’avons pas pu communiquer avec la garnison des forts entourant la ville. Pendant ce temps, à Gand, ils ont occupé l’hôtel de ville et plusieurs autres lieux stratégiques."
netherlands.31.a:0 "Ces traîtres seront écrasés !"

netherlands.32.t:0 "Le sort de la Wallonie"
netherlands.32.desc:0 "Nous avons enfin sécurisé les Pays-Bas, mais cette domination n’est qu’apparente. Les Wallons craignent pour leur droit de pratiquer leur langue. Si leurs politiciens refusent de soutenir l’unification des Pays-Bas sous notre règle, cela pourrait recréer les conditions d’une nouvelle révolte belge, comme en 1830."
netherlands.32.a:0 "Jouons « Maria van Bourgondië » à l’opéra de Bruxelles."
netherlands.32.b:0 "Accordons une certaine autonomie aux Wallons."

netherlands.33.t:0 "[HOL.GetNameDef] demande le contrôle de la Flandre"
netherlands.33.desc:0 "Dans son désir de réaliser la grande union néerlandaise, [HOL.GetLeader] nous a formellement demandé de céder le contrôle du territoire belge de la Flandre, qu’il considère comme une partie intégrante de sa nation."
netherlands.33.a:0 "Si c’est ce qu’ils veulent."
netherlands.33.b:0 "Non ! C’est à nous."

netherlands.34.t:0 "La Flandre a été restituée !"
netherlands.34.desc:0 "Nos compétences diplomatiques inégalées ont conduit à la libération de la Flandre, opprimée pendant des siècles par les Espagnols, les Autrichiens, les Français et les Belges."
netherlands.34.a:0 "Hou Zee !"

netherlands.35.t:0 "Une occasion gâchée"
netherlands.35.desc:0 "Malgré nos meilleurs efforts, nos tentatives d’obtenir la restitution de la Flandre et d’unir enfin le Dietsland diplomatiquement ont été rejetées."
netherlands.35.a:0 "L’Histoire montrera que nous avions raison !"

netherlands.36.t:0 "[HOL.GetLeader] propose un pacte"
netherlands.36.desc:0 "Conscients que nos modèles de chars sont supérieurs aux leurs, [From.GetNameDef] nous a proposé de partager nos plans afin qu’ils puissent constituer un bastion du communisme en Europe occidentale."
netherlands.36.a:0 "Accepter."
netherlands.36.b:0 "Refuser."

tdlra.1.t:0 "[From.GetNameDefCap] veut que nous rejoignions le Benelux"
tdlra.1.d:0 "[From.GetNameDefCap] cherche à renforcer leur alliance en nous faisant rejoindre."
tdlra.1.a:0 "Accepter."
tdlra.1.b:0 "Refuser."

tdlra.2.t:0 "[From.GetNameDefCap] refuse"
tdlra.2.d:0 "[From.GetNameDefCap] a malheureusement refusé notre offre d’alliance."
tdlra.2.a:0 "Nous avons besoin d’eux, d’une manière ou d’une autre !"

tdlra.3.t:0 "[From.GetNameDefCap] accepte !"
tdlra.3.d:0 "[From.GetNameDefCap] a accepté notre offre d’alliance et fait désormais partie de [Root.GetFactionName]."
tdlra.3.a:0 "Excellente nouvelle."

tdlra.4.t:0 "[From.GetNameDefCap] propose un pacte"
tdlra.4.d:0 "Conscients que nos modèles de chars sont supérieurs aux leurs, [From.GetNameDef] nous a proposé de partager nos plans afin qu’ils puissent constituer un bastion du communisme en Europe occidentale."
tdlra.4.a:0 "Accepter."
tdlra.4.b:0 "Refuser."

tdlra.5.t:0 "[From.GetNameDefCap] accepte notre pacte proposé"
tdlra.5.d:0 "Conscients de notre importance stratégique au cœur de l’Europe occidentale, [From.GetNameDef] nous a transmis des modèles de chars technologiquement supérieurs afin que nous puissions nous défendre des influences extérieures."
tdlra.5.a:0 "Au travail avec ces nouveaux plans."

tdlra.6.t:0 "[From.GetNameDefCap] refuse notre pacte proposé !"
tdlra.6.d:0 "[From.GetNameDefCap] n’a pas signé notre pacte proposé, qui aurait renforcé nos capacités blindées. Nous devrons le faire seuls !"
tdlra.6.a:0 "Qu’il en soit ainsi."

tdlra.8.t:0 "Les Pays-Bas veulent rejoindre [Root.GetFactionName]"
tdlra.8.d:0 "Conscients qu’ils ne pourraient pas contenir l’agression [GER.GetAdjective], [From.GetNameDef] craint une invasion imminente et demande notre protection."
tdlra.8.a:0 "Accepter."
tdlra.8.b:0 "Refuser."

tdlra.9.t:0 "[From.GetNameDefCap] accepte"
tdlra.9.d:0 "Les [ENG.GetAdjective], conscients que le Benelux est stratégiquement situé pour une guerre contre [GER.GetNameDef], ont décidé d’étendre leur protection à notre nation."
tdlra.9.a:0 "Excellente nouvelle !"

tdlra.10.t:0 "[From.GetNameDefCap] refuse"
tdlra.10.d:0 "Les [ENG.GetAdjective] ne considèrent pas le Benelux comme nécessaire, puisqu’ils ne nous défendront pas contre les incursions ennemies."
tdlra.10.a:0 "Maudits Britanniques !"

tdlra.11.t:0 "Lancer le processus de dépilarisation"
tdlra.11.d:0 "Le modèle politique actuel de pilier a divisé la population en blocs strictement séparés, menant à l’instabilité politique et à un système inefficace. Pour surmonter ces défis, une proposition a été avancée afin de lancer un processus de dépilarisation, démantelant ces divisions rigides et favorisant une approche plus unifiée et coopérative de la gouvernance."
tdlra.11.a:0 "Adopter la dépilarisation."

HOL_develop_different_plane_types_tooltip:0 "L’effet dépend du focus précédent. Si vous avez choisi de privilégier les petits fuselages, vous recevrez une §Grecherche réduite de 50 %§! pour les §Ychasseurs lourds§! et une §Grecherche réduite de 25 %§! pour les §Yavions d’appui aérien rapproché§!. En revanche, si vous avez choisi de privilégier les grands fuselages, vous recevrez une §Grecherche réduite de 50 %§! pour les §Ychasseurs§! et une §Grecherche réduite de 25 %§! pour les §Ybombardiers navals§!."
HOL_fietsinfanterie_tooltip:0 "Obtenez une petite unité d’infanterie cycliste \n"
FLA_fascist_rebels_tooltip:0 "En cas de succès, une décision vous permettra d’ordonner la révolte des §Yfascistes flamands§! après la §Ydéclaration de guerre§! au coût de 30£command_power."

HOL_infantry_equipment_0:0 "Geweer M.95"
HOL_infantry_equipment_0_short:0 "Geweer M.95"

HOL_gw_tank_equipment:0 "Carden Loyd Mk.VI"
HOL_gw_tank_equipment_short:0 "V-CL Mk.VI"
HOL_gw_tank_equipment_desc:0 "L’armée royale néerlandaise ne disposait que d’une poignée de voitures blindées obsolètes ou usées, de douze excellents camions blindés DAF M39 à six roues, et de cinq tankettes Carden Loyd Mark VI nommées Lynx, Poema, Jaguar, Panter et Luipaard."
HOL_light_tank_equipment_1:0 "Vickers Light Tank Mk.IV"
HOL_light_tank_equipment_1_short:0 "V-LT Mk.IV"
HOL_light_tank_equipment_1_desc:0 "Seuls 22 Vickers Light Tank Mk.IV furent utilisés par le KNIL (Armée royale des Indes orientales néerlandaises)."
HOL_light_tank_destroyer_equipment_2:0 "DAF M39 Pantserwagen"
HOL_light_tank_destroyer_equipment_2_short:0 "DAF M39"
HOL_light_tank_destroyer_equipment_2_desc:0 "Pour son époque, le DAF M39 était une conception moderne avec une construction monocoque entièrement soudée et une utilisation intensive du blindage incliné. La tourelle, équipée d’un canon relativement puissant de 37 mm, fut produite en Suède par Landsverk. Le type était légèrement blindé et relativement rapide, avec une bonne capacité tout-terrain."
HOL_light_tank_equipment_2:0 "CTMS-1TB1"
HOL_light_tank_equipment_2_short:0 "CTMS-1TB1"
HOL_light_tank_equipment_2_desc:0 "Marmon-Herrington lança le projet CTMS-1TB1 pour produire un char léger à trois hommes pour l’armée néerlandaise. Il était armé d’un canon automatique de 37 mm et d’une mitrailleuse coaxiale M1919. Ils prévoyaient initialement d’en envoyer 600 dans les Indes orientales néerlandaises. Cependant, la campagne se termina trop tôt pour que les prototypes soient envoyés."
HOL_light_tank_aa_equipment_3:0 "Braat AA"
HOL_light_tank_aa_equipment_3_short:0 "Braat AA"
HOL_light_tank_aa_equipment_3_desc:0 "Un canon antiaérien monté sur le châssis d’un Braat Overvalwagen."
HOL_medium_tank_equipment_1:0 "MTLS-1G14"
HOL_medium_tank_equipment_1_short:0 "MTLS-1G14"
HOL_medium_tank_equipment_1_desc:0 "Le projet MTLS-1G14 fut lancé simultanément avec le CTMS-1TB1 pour produire un char moyen à quatre hommes pour l’armée néerlandaise. Il était armé de deux canons automatiques de 37 mm. Il était également équipé de cinq mitrailleuses M1919 : trois montées sur la coque, une coaxiale et une sur le dessus de la tourelle. Le blindage était boulonné et mesurait entre 13 et 38 mm."

HOL_CAS_equipment_1:0 "Fokker C.X"
HOL_CAS_equipment_1_short:0 "Fokker C.X"
HOL_CAS_equipment_1_desc:0 "Le Fokker C.X fut initialement conçu pour l’armée royale des Indes orientales néerlandaises afin de remplacer le Fokker C.V. Comme tous les avions Fokker de l’époque, il était de construction mixte, avec des ailes en bois et une structure de fuselage en tubes d’acier soudés, recouverts de plaques d’aluminium à l’avant et de toile à l’arrière. Le prototype fut construit en 1934 avec un moteur Rolls-Royce Kestrel V."
HOL_CAS_equipment_2:0 "Douglas 8A-3N"
HOL_CAS_equipment_2_short:0 "8A-3N"
HOL_CAS_equipment_2_desc:0 "En raison du manque d’armement, ils furent utilisés comme chasseurs lors de l’invasion allemande. Ils subirent de lourdes pertes et, combinées avec les opérations aéroportées allemandes qui incluaient une de leurs bases (Ockenburg AFB), cela entraîna la perte totale de tous les 8A-3N."
HOL_cv_CAS_equipment_1:0 "Fokker C.X-cv"
HOL_cv_CAS_equipment_1_short:0 "Fokker C.X-cv"

HOL_fighter_equipment_0:0 "Koolhoven F.K.51"
HOL_fighter_equipment_0_short:0 "F.K.51"
HOL_fighter_equipment_0_desc:0 "Alors que la majorité des F.K.51 furent utilisés comme avions d’entraînement élémentaire aux Pays-Bas ou pour des missions de reconnaissance par la Royal Netherlands Air Force dans les Indes orientales néerlandaises, vingt-huit furent clandestinement vendus au gouvernement républicain pendant la guerre civile espagnole, malgré un embargo néerlandais sur la vente d’armes aux deux camps."
HOL_fighter_equipment_1:0 "Fokker D.XXI"
HOL_fighter_equipment_1_short:0 "Fokker D.XXI"
HOL_fighter_equipment_1_desc:0 "Lors de son entrée en service, le D.XXI représenta un bond significatif pour le groupe d’aviation de l’armée néerlandaise, dont la force de chasse se composait de biplans vieillissants à cockpit ouvert. Le nouveau Fokker prouva rapidement être un avion extrêmement robuste, capable d’atteindre une vitesse de 700 km/h en piqué. Une poignée de chasseurs finlandais D.XXI revendiquèrent près de deux cents victoires aériennes contre l’armée de l’air soviétique pendant les deux guerres finno-soviétiques."
HOL_fighter_equipment_2:0 "Koolhoven F.K.58"
HOL_fighter_equipment_2_short:0 "F.K.58"
HOL_fighter_equipment_2_desc:0 "Le Koolhoven F.K.58 était un avion de chasse-intercepteur monomoteur conçu et principalement fabriqué par NV Koolhoven aux Pays-Bas sous contrat français. Prévu pour l’Armée de l’air, le F.K.58 ne servit que de manière limitée lors de la bataille de France."
HOL_fighter_equipment_3:0 "Koolhoven F.K.59"
HOL_fighter_equipment_3_short:0 "F.K.59"
HOL_fighter_equipment_3_desc:0 "Le dernier modèle Koolhoven fut un chasseur-bombardier polyvalent destiné à remplir des rôles d’aviation navale pour des États comme le Portugal, la Suède et la Norvège. Aucune commande ne suivit, et le développement fut interrompu par Fall Gelb."
HOL_cv_fighter_equipment_0:0 "Fokker D.XVII"
HOL_cv_fighter_equipment_0_short:0 "Fokker D.XVII"
HOL_cv_fighter_equipment_0_desc:0 "Le D.XVII était un biplan néerlandais conçu par Fokker. Le prototype était propulsé par un moteur Curtiss Conqueror de plus de 500 ch non suralimenté. Un modèle ultérieur fut équipé d’un Rolls-Royce Kestrel de 600 ch, et des plans furent faits pour une variante Hispano-Suiza Xbre. Le 18 janvier 1935, il établit un record d’altitude néerlandais."
HOL_cv_fighter_equipment_1:0 "Fokker D.XXI-cv"
HOL_cv_fighter_equipment_1_short:0 "Fokker D.XXI-cv"
HOL_cv_fighter_equipment_2:0 "Koolhoven F.K.58C"
HOL_cv_fighter_equipment_2_short:0 "F.K.58C"
HOL_cv_fighter_equipment_3:0 "Buffalo 339-23"
HOL_cv_fighter_equipment_3_short:0 "B-339-23"
HOL_cv_fighter_equipment_3_desc:0 "Comme les Brewster B-339 utilisés par le ML-KNIL étaient plus légers que les B-339E modifiés employés par d’autres forces alliées, ils pouvaient affronter efficacement les Japonais. Lors d’un affrontement majeur, huit chasseurs néerlandais Brewster interceptèrent une formation d’environ 35 bombardiers japonais escortés par une vingtaine de Zeros. Les pilotes néerlandais détruisirent 11 avions japonais et perdirent quatre Brewsters ; deux pilotes néerlandais furent tués."
HOL_jet_fighter_equipment_1:0 "Gloster Meteor F.4"
HOL_jet_fighter_equipment_1_short:0 "Meteor F.4"
HOL_jet_fighter_equipment_2:0 "Fokker S.14"
HOL_jet_fighter_equipment_2_short:0 "Fokker S.14"
HOL_jet_fighter_equipment_2_desc:0 "Les caractéristiques externes du S.14 étaient courtes et larges, et ses ailes légèrement effilées lui valurent rapidement le surnom de « la Planche ». Cependant, tous les pilotes ayant volé sur le S.14 louèrent ses excellentes qualités de vol."

HOL_nav_bomber_equipment_1:0 "Fokker T.IVa"
HOL_nav_bomber_equipment_1_short:0 "Fokker T.IVa"
HOL_nav_bomber_equipment_1_desc:0 "Le Fokker T.IV fut développé pour répondre aux besoins de la marine royale néerlandaise en matière d’avion de patrouille maritime et de bombardier-torpilleur pour les Indes orientales néerlandaises. L’appareil pouvait transporter soit une torpille, soit 800 kg de bombes, et possédait trois mitrailleuses défensives en positions de nez, dorsale et ventrale."
HOL_nav_bomber_equipment_2:0 "Fokker C.XIw"
HOL_nav_bomber_equipment_2_short:0 "Fokker C.XIw"
HOL_nav_bomber_equipment_2_desc:0 "Le Fokker C.XI était un hydravion de reconnaissance conçu pour opérer depuis des navires de guerre. Après des essais réussis de catapultage, une commande fut passée pour équiper les croiseurs HNLMS Tromp et HNLMS De Ruyter opérant dans les eaux européennes ; mais la plupart furent envoyés aux Indes orientales néerlandaises pour équiper la marine locale."
HOL_nav_bomber_equipment_3:0 "Fokker T.VIIIw"
HOL_nav_bomber_equipment_3_short:0 "Fokker T.VIIIw"
HOL_nav_bomber_equipment_3_desc:0 "Le Fokker T.VIII était un hydravion torpilleur et de reconnaissance bimoteur néerlandais, qui servit dans les forces aériennes néerlandaises, britanniques et allemandes. L’appareil fut initialement développé à la demande du service d’aviation navale néerlandais pour être utilisé dans les eaux métropolitaines et dans les Indes orientales."
HOL_cv_nav_bomber_equipment_1:0 "Koolhoven F.K.52C"
HOL_cv_nav_bomber_equipment_1_short:0 "F.K.52C"
HOL_cv_nav_bomber_equipment_1_desc:0 "Pendant la guerre d’Hiver, deux F.K.52 furent achetés par le comte suédois Carl Gustav von Rosen et donnés à l’armée de l’air finlandaise. Les appareils furent acheminés en Finlande le 18 janvier 1940. Deux mois plus tard, ils bombardèrent et mitraillèrent les troupes soviétiques attaquant sur la glace vers Virolahti. À Londres, le gouvernement néerlandais commanda des F.K.52 pour leur aviation des Indes, mais les avions, expédiés aux États-Unis, n’y arrivèrent jamais."
HOL_cv_nav_bomber_equipment_2:0 "Fokker C.XI"
HOL_cv_nav_bomber_equipment_2_short:0 "Fokker C.XI"
HOL_cv_nav_bomber_equipment_3:0 "Fokker T.VIII"
HOL_cv_nav_bomber_equipment_3_short:0 "Fokker T.VIII"

HOL_heavy_fighter_equipment_1:0 "Fokker G.1"
HOL_heavy_fighter_equipment_1_short:0 "Fokker G.1"
HOL_heavy_fighter_equipment_1_desc:0 "Le Fokker G.1 était un chasseur lourd bimoteur avec un design révolutionnaire : double fuselage et huit mitrailleuses frontales dans le nez. Outre l’armée de l’air néerlandaise, plusieurs forces aériennes étrangères manifestèrent leur intérêt pour le G.1, en tant que chasseur ou bombardier en piqué. Le prototype fut équipé de freins aérodynamiques actionnés hydrauliquement sous les ailes pour tester son potentiel comme bombardier en piqué. Les essais révélèrent que le G.1 était capable de plonger à plus de 644 km/h."
HOL_heavy_fighter_equipment_2:0 "Fokker D.XXIII"
HOL_heavy_fighter_equipment_2_short:0 "Fokker D.XXIII"
HOL_heavy_fighter_equipment_2_desc:0 "Le Fokker D.XXIII fut conçu comme un avion monoplane monoplace à deux moteurs. Pour surmonter les problèmes de vol asymétrique, il possédait un moteur tractif à l’avant et un moteur propulsif à l’arrière. Le D.XXIII était un monoplan cantilever avec double empennage monté sur poutres. Le pilote avait un cockpit fermé situé entre les moteurs tractif et propulsif, et l’appareil disposait d’un train d’atterrissage tricycle escamotable."
HOL_heavy_fighter_equipment_3:0 "Fokker G.3"
HOL_heavy_fighter_equipment_3_short:0 "Fokker G.3"
HOL_heavy_fighter_equipment_3_desc:0 "On sait peu de choses sur ce modèle ni sur les conceptions initiales du G.2, car le développement fut interrompu par l’invasion des Pays-Bas."
HOL_tac_bomber_equipment_0:0 "Fokker C.V D/E"
HOL_tac_bomber_equipment_0_short:0 "Fokker C.V D/E"
HOL_tac_bomber_equipment_0_desc:0 "Le Fokker C.V était un biplan néerlandais de reconnaissance légère et de bombardement fabriqué par Fokker. Il pouvait être produit en différentes versions ; le client pouvait choisir parmi cinq constructions d’ailes différentes (variantes en envergure). Les moteurs radiaux pouvaient fournir entre 336 et 723 kW (451–970 ch), et le train d’atterrissage pouvait être changé de roues en flotteurs."
HOL_tac_bomber_equipment_1:0 "Fokker T.V"
HOL_tac_bomber_equipment_1_short:0 "Fokker T.V"
HOL_tac_bomber_equipment_1_desc:0 "Conçu comme un avion polyvalent selon le concept de 'luchtkruiser' (croiseur aérien), le T.V avait pour rôle principal d’intercepter et de détruire les formations de bombardiers ennemis, et comme rôle secondaire celui de bombardier à long rayon d’action. Comme il ne possédait pas de réservoirs auto-obturants, il s’est forgé une réputation de prendre feu rapidement lorsqu’il était touché par des tirs ennemis."
HOL_tac_bomber_equipment_2:0 "Fokker T.IX"
HOL_tac_bomber_equipment_2_short:0 "Fokker T.IX"
HOL_tac_bomber_equipment_2_desc:0 "Le Fokker T.IX était un bombardier bimoteur néerlandais conçu et construit par Fokker pour la force aérienne royale des Indes néerlandaises, afin de remplacer leurs bombardiers obsolètes construits par Martin. L’invasion allemande des Pays-Bas mit fin à son développement."

HOL_strat_bomber_equipment_1:0 "Fokker T.VI"
HOL_strat_bomber_equipment_1_short:0 "Fokker T.VI"
HOL_strat_bomber_equipment_1_desc:0 "Entre août 1934 et février 1935, les travaux commencèrent sur l’'Ontwerp 115' (Projet 115), un bombardier lourd à long rayon d’action qui reçut le nom de T.VI. On ne sait pas clairement à qui cet appareil était destiné. Les Pays-Bas, qui s’étaient alors déclarés neutres dans le conflit européen, ne voulaient pas d’un tel avion. Il ne fut jamais construit."

