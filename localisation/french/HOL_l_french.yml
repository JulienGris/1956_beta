 HOL_abandon_the_gold_standard_not_MTG:0 "Abandonner l’étalon-or"
 HOL_abandon_the_gold_standard_not_MTG_desc:0 "Les Pays-Bas furent l’un des derniers pays à maintenir l’étalon-or. S’il a permis d’éviter l’inflation, le manque de masse monétaire a étouffé l’économie et, couplé à la crise économique, a provoqué un taux de chômage record."
 HOL_finish_the_noordoostpolder_not_MTG:0 "Achever le Noordoostpolder"
 HOL_finish_the_noordoostpolder_not_MTG_desc:0 "Commencé en 1936, le processus de poldérisation de la zone de l’IJsselmeer, près de la province d’Overijssel, est enfin proche de son achèvement. Mais même terminé, ce seront encore des terres vierges qui devront être peuplées et exploitées."
 HOL_finish_the_twentekanaal:0 "Achever le canal de Twente"
 HOL_finish_the_twentekanaal_desc:0 "L’achèvement du canal de Twente est nécessaire pour relier certaines parties de la Gueldre à l’Overijssel. Avec ce projet, le commerce se développera entre ces régions vitales de notre nation."
 r56_HOL_daf_pantrado:0 "DAF Pantrado 3"
 r56_HOL_daf_pantrado_desc:0 "Basé sur le design du système de suspension du camion Trado. Le Pantrado 3 sera une voiture blindée ultramoderne qui remplacera nos véhicules blindés étrangers."
 r56_HOL_reorganize_the_engineer_regiment:0 "Réorganiser le régiment du génie"
 r56_HOL_reorganize_the_engineer_regiment_desc:0 "En réorganisant le régiment du génie, nous pourrons mieux le préparer aux futurs combats de la prochaine guerre."
 r56_HOL_van_kinsbergen:0 "Commander le Van Kinsbergen"
 r56_HOL_van_kinsbergen_desc:0 "Le Van Kinsbergen est une corvette unique construite pour protéger nos convois contre les sous-marins de tout pays hostile."
 r56_HOL_mobile_tanks_for_the_colonies:0 "Chars mobiles pour les colonies"

