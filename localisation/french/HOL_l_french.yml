 HOL_red_volunteers:0 "Volontaires rouges"
 HOL_red_volunteers_desc:0 "Pour faire avancer la cause de la révolution mondiale et de l’internationalisme prolétarien, nous devons être prêts à soutenir tous les mouvements communistes à travers le globe. Créer une force de volontaires dédiée, déployée pour combattre pour la classe ouvrière à l’étranger, serait une bonne étape."
