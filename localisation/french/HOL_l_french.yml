mtg_netherlands.80.t:0 "[FROM.GetNameDefCap] propose une alliance"
mtg_netherlands.80.d:0 "[FROM.GetNameDefCap] a proposé une alliance entre nos nations ; cet arrangement signifierait un contrôle amical sur les stratégiques Indes orientales, garantissant presque notre accès à leur pétrole et à leur caoutchouc sans risquer un conflit majeur."
mtg_netherlands.80.a:0 "Ce serait bénéfique."
mtg_netherlands.80.b:0 "Nous pourrions mieux gérer ces ressources."
HOL_JAP_new_faction:0 "Alliance néerlando-japonaise renouvelée"
HOL_restore_naval_cooperation:0 "Rétablir la coopération navale"
HOL_restore_naval_cooperation_desc:0 "Les Néerlandais ont aidé à mettre en place la marine japonaise ; aujourd’hui, la situation a changé et nous sommes en retard dans le développement naval. Une coopération avec le Japon dans ce domaine pourrait renforcer nos forces navales."
HOL_jap_research_name:0 "Échange technologique néerlando-japonais"
HOL_jap_research_desc:0 "Réduction du temps de recherche pour les technologies déjà étudiées par les autres membres de la faction"

#Dutch Revanchism Decision Category
HOL_dutch_revanchism:0 "Revanchisme néerlandais"
HOL_dutch_revanchism_desc:0 "Au fil des siècles, les Néerlandais ont tenu de nombreux territoires à travers les basses terres et outre-mer, dont trop ont été perdus au fil du temps. C’est peut-être maintenant notre chance de réparer les erreurs de la révolution, de la guerre et des autres transferts qui, au fil des ans, ont trop affaibli notre empire."
HOL_vlaanderen_opnieuw_van_ons:0 "Vlaanderen, Opnieuw van Ons !"
HOL_vlaanderen_opnieuw_van_ons_desc:0 "La Révolte belge de 1830, confirmée neuf ans plus tard par le Traité de Londres, a brisé notre emprise sur la Flandre néerlandophone. Si nous les reprenons sous notre contrôle, peut-être pourront-ils être réintégrés, montrant à nouveau au monde la volonté d’un Pays-Bas uni !"
HOL_reintegrate_wallonia:0 "Réintégrer la Wallonie"
HOL_reintegrate_luxembourg:0 "Réintégrer le Luxembourg"
HOL_unshackle_the_boers:0 "Libérer les Boers !"
HOL_unshackle_the_boers_desc:0 "Il y a plusieurs siècles, la Compagnie néerlandaise des Indes orientales a établi plusieurs colonies au Cap en Afrique du Sud, les étendant au fil des ans. Bien que la plupart de notre contrôle ait été indirect, de nombreux colons néerlandais vivent aujourd’hui sous domination étrangère, nous libérerons nos frères !"
HOL_liberate_french_flanders:0 "Libérer la Flandre française"
HOL_disavow_the_anglo_dutch_treaty_of_1870_1871:0 "Désavouer le traité anglo-néerlandais de 1870-1871"
HOL_disavow_the_anglo_dutch_treaty_of_1870_1871_desc:0 "Les traités anglo-néerlandais de 1871 nous ont forcés, entre autres, à céder le poste commercial stratégique de la Côte-de-l’Or en Afrique de l’Ouest. Nous désavouerons ce coup inégal porté à notre empire !"
HOL_claim_former_east_indies_possessions:0 "Revendiquer les anciennes possessions des Indes orientales"
HOL_claim_former_east_indies_possessions_desc:0 "La Compagnie néerlandaise des Indes orientales contrôlait autrefois plusieurs postes commerciaux et îles clés en Asie, qui, au fil des siècles, sont passés sous domination étrangère. Nous n’accepterons plus cette perte de notre territoire légitime !"
hol_expand_the_guianas_possession:0 "Étendre la possession des Guyanes"
no_shell_shocked_spectator_tt:0 "Ne possède pas §YSpectateur choqué de la Grande Guerre§!"
hol_unlocks_integration_decisions_tt:0 "§GDébloque§! des décisions pour intégrer ou revendiquer plusieurs territoires historiques §YNéerlandais§!."
walloon_partisans:0 "Partisans wallons"

HOL_mio_trait_van_trappen_suspension:0 "Suspension Van Trappen"

HOL_reclaim_the_crown_jewel:0 "Reprendre le joyau de la couronne"
HOL_reclaim_the_crown_jewel_desc:0 "La colonie joyau de la couronne est bien trop importante pour que nous laissions échapper, même si cela signifie écraser une rébellion ouverte contre elle."
HOL_sunda_islands_staging_area:0 "Zone de déploiement des îles de la Sonde"
HOL_sunda_islands_staging_area_desc:0 "Pour gérer le déploiement des forces en [INS.GetNameDef], nous devons construire l’infrastructure nécessaire pour combattre efficacement dans la région."
HOL_jungle_rangers:0 "Rangers de la jungle"
HOL_jungle_rangers_desc:0 "Une grande partie du terrain en [INS.GetNameDef] est recouverte de jungles épaisses. Si nous voulons y combattre efficacement, nous devons former des forces spécialisées capables de naviguer dans ces terrains hostiles."
HOL_anti_partisan_effort:0 "Effort anti-partisans"
HOL_anti_partisan_effort_desc:0 "Les partisans dans nos colonies perturbent nos forces. Nous devons redoubler d’efforts pour les traquer."
HOL_evacuate_colonial_assets:0 "Évacuer les actifs coloniaux"
HOL_evacuate_colonial_assets_desc:0 "Avec nos colonies perdues ou en rébellion ouverte, il est temps de rapatrier les investissements que nous y avons faits pour notre propre bénéfice."
