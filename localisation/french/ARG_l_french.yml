latin_peace:0 "Paix en Amérique Latine"
latin_peace_desc:0 "Il est difficile mais pas impossible de trouver la paix en ces temps difficiles."
argentina.1.t:0 "À la recherche de conseillers militaires étrangers"
argentina.1.d:0 "Les grandes puissances du monde ont fait des avancées significatives en matière de tactiques militaires. Il serait judicieux de demander à l'une de ces nations de nous aider à moderniser notre armée."
argentina.1.eng:0 "L'armée [ENG.getAdjective] pourrait nous enseigner la planification avancée"
argentina.1.ger:0 "L'armée [GER.getAdjective] pourrait nous apprendre à utiliser les chars"
argentina.1.sov:0 "L'armée [SOV.getAdjective] pourrait partager avec nous leur théorie de la 'guerre en profondeur'."
argentina.1.usa:0 "L'armée [USA.getAdjective] pourrait nous apprendre à utiliser la puissance de feu à notre avantage."
argentina.2.t:0 "[ARG.GetNameDefCap] exige les [299.GetName]"
argentina.2.d:0 "Au cours des derniers mois, les forces [ARG.getAdjective] se sont mobilisées à travers le pays, menaçant une guerre totale si nous ne leur cédons pas les [299.GetName]."
argentina.2.cede:0 "Ce ne sont que quelques rochers de l'autre côté du monde de toute façon..."
argentina.2.deny:0 "L'Empire doit être défendu !"
argentina.3.t:0 "Ultimatum [ARG.getAdjective]"
argentina.3.d:0 "Avec un nombre menaçant de troupes à nos frontières, les diplomates [ARG.getAdjective] ont présenté un ultimatum exigeant que nous cédions à leur occupation, menaçant la guerre si nous refusons."
argentina.3.cede:0 "Nous devons accepter l'inévitable."
argentina.3.deny:0 "Nous ne céderons pas aux tyrans !"
argentina.4.t:0 "Un accord de recherche [ARG.getAdjective] ?"
argentina.4.d:0 "Les diplomates [ARG.getAdjective] sont venus avec une proposition d'accord de recherche entre nos nations. Ce projet pourrait non seulement être bénéfique sur le plan scientifique, mais aussi renforcer les liens entre nos deux pays."
argentina.4.accept:0 "Accepter la proposition"
argentina.4.refuse:0 "Refuser l'offre"
argentina.5.t:0 "Le gouvernement [ARG.getAdjective] cherche de l'aide"
argentina.5.d:0 "Les forces armées [ARG.getAdjective] doivent être modernisées. Pour atteindre cet objectif, ils ont demandé notre aide. Cela pourrait nous permettre d'accroître notre influence sur eux."
