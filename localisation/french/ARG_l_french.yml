argentina.9.t:0 "Le gouvernement [ARG.getAdjective] cherche de l'aide"
argentina.9.d:0 "Malgré les efforts de nos diplomates, notre nation s'est vue refuser de l'aide."
argentina.9.help:0 "Nous pourrions demander à l'une des autres nations possibles"
argentina.9.refuse:0 "Nous le ferons nous-mêmes alors..."
argentina.10.t:0 "Conseillers [ENG.getAdjective]"
argentina.10.d:0 "[ENG.GetNameDefCap] a accepté de nous conseiller et de nous aider dans notre quête de modernisation militaire en nous enseignant ce qu'ils ont appris lors de la Grande Guerre, en échange d'une influence sur notre politique intérieure."
argentina.10.a:0 "Toute opération réussie commence par un plan."
argentina.11.t:0 "Conseillers [GER.getAdjective]"
argentina.11.d:0 "[GER.GetNameDefCap] a accepté de nous conseiller et d'assister dans la modernisation de notre armée en partageant ses tactiques militaires avancées, en échange d'une influence sur notre politique intérieure."
argentina.11.a:0 "Donc, le mouvement est la clé de la victoire, mhm ?"
argentina.12.t:0 "Conseillers [SOV.getAdjective]"
argentina.12.d:0 "[SOV.GetNameDefCap] a accepté de former notre armée et de nous aider à moderniser nos forces, en nous apprenant à déplacer des troupes par milliers, en échange d'une influence sur notre politique intérieure."
argentina.12.a:0 "La profondeur de l'ennemi doit être atteinte et détruite."
argentina.13.t:0 "Conseillers [USA.getAdjective]"
argentina.13.d:0 "[USA.GetNameDefCap] a accepté d'aider à moderniser notre armée, affirmant qu'une plus grande puissance de feu pourrait sécuriser les Amériques contre de futures menaces, en échange d'une influence politique."
argentina.13.a:0 "Plus de canons et plus de munitions !"
argentina.16.t:0 "[ARG.GetNameDefCap] demande les [299.GetName]"
argentina.16.d:0 "Les diplomates [ARG.getAdjective] nous ont contactés aujourd'hui pour demander la cession des [299.GetName], affirmant que cela allégerait notre charge administrative et qu'ils ont le droit de gouverner ces îles."
argentina.16.a:0 "Approuver leur demande"
argentina.16.b:0 "Les [299.GetName] sont à nous !"
argentina.17.t:0 "[ARG.GetNameDefCap] demande [720.GetName]"
argentina.17.d:0 "Les diplomates de [ARG.GetNameDef] sont venus aujourd'hui avec une demande spéciale. Ils souhaitent que nous leur cédions l'administration territoriale de [720.GetName], affirmant que cela allégerait notre charge et qu'ils ont le droit de gouverner l'île."
argentina.17.a:0 "Approuver leur demande"
argentina.17.b:0 "Refuser de leur confier le gouvernement de l'île"
argentina.18.t:0 "[ARG.GetNameDefCap] exige [720.GetName]"
argentina.18.d:0 "Malgré le traité récent par lequel nous leur avons cédé les Malouines, [ARG.getLeader] semble obsédé par l'idée de prendre toutes les terres qu'il considère comme appartenant à son pays."
argentina.18.a:0 "Si c'est nécessaire pour préserver la paix..."
argentina.18.b:0 "C'est un territoire britannique !"
argentina.23.t:0 "Proposition de coopération [ARG.getAdjective]"
argentina.23.d:0 "Le gouvernement [ARG.getAdjective] a envoyé une équipe de professionnels et de diplomates pour faire une proposition bénéfique pour les deux parties et augmenter le développement industriel du sud du Brésil et de nos régions du nord-est."
argentina.23.a:0 "Accepter la proposition"
argentina.23.b:0 "Refuser l'offre"
argentina.24.t:0 "Un traité de non-agression [ARG.getAdjective] ?"
argentina.24.d:0 "Des diplomates [ARG.getAdjective] sont venus avec une proposition de traité de non-agression, affirmant que cela augmenterait la stabilité politique et économique de la région."
argentina.24.a:0 "Signer le traité"
argentina.24.b:0 "Refuser tout accord de ce type"
argentina.25.t:0 "[ARG.GetNameDefCap] veut rejoindre les Alliés"
argentina.25.d:0 "Les diplomates [ARG.getAdjective] sont arrivés aujourd'hui pour proposer de faire cause commune avec notre gouvernement afin de contribuer à la stabilité internationale."
argentina.25.a:0 "Toute aide est la bienvenue"
argentina.25.b:0 "Nous préférons ne pas accepter leur aide"
argentina.26.t:0 "Les [299.GetName] nous ont été cédées !"
argentina.26.d:0 "Incapables de résister à la pression [ARG.getAdjective] et réticents à nous engager dans une nouvelle guerre, les forces présentes sur les Malvinas ont été évacuées, laissant le territoire à nos glorieux troupes."
argentina.26.a:0 "¡Les Malvinas sont argentines !"
argentina.27.t:0 "Les [299.Owner.GetNameDefCap] ont rejeté nos demandes concernant les Malvinas !"
argentina.27.d:0 "Malgré la force de notre armée et les efforts de nos diplomates, les [299.Owner.GetAdjective] semblent réticents à reconnaître notre revendication légitime sur les Malvinas, nous laissant aucune autre option que de les prendre par la force."
argentina.27.a:0 "¡Les Malvinas sont argentines !"
argentina.28.t:0 "Les [720.GetName] nous ont été cédées !"
argentina.28.d:0 "Grâce à la puissance de notre armée et dans un effort pour éviter la guerre, [720.GetName] a été reconnue comme faisant partie de notre grande nation."
argentina.28.a:0 "C'est un triomphe national !"
argentina.29.t:0 "Les [720.Owner.GetNameDefCap] ont rejeté nos demandes concernant les [720.GetName] !"
argentina.29.d:0 "Malgré le bien-fondé de notre revendication et la puissance de notre armée, les Britanniques ont décidé de refuser notre ultimatum. Nous devrons les prendre par la force."
argentina.29.a:0 "La Géorgie du Sud sera nôtre d'une manière ou d'une autre"
argentina.30.t:0 "Les Britanniques cèdent les Malvinas"
argentina.30.d:0 "Grâce à nos liens avec la Grande-Bretagne et au travail de nos diplomates, les Britanniques ont accepté de transférer la propriété des Malvinas à notre nation."
argentina.30.a:0 "¡Les Malvinas sont argentines !"
argentina.31.t:0 "Les Britanniques refusent notre demande concernant les Malvinas"
argentina.31.d:0 "Malgré nos liens avec la Grande-Bretagne et le travail de nos diplomates à Londres, les Britanniques ont décidé qu'il valait mieux que les Malvinas restent sous domination britannique."
argentina.31.a:0 "Nous n'oublierons pas cela"
argentina.32.t:0 "Les Britanniques cèdent la Géorgie du Sud"
argentina.32.d:0 "Grâce à nos liens avec la Grande-Bretagne et au travail de nos diplomates à Londres, les Britanniques ont accepté notre demande de gouvernance sur la Géorgie du Sud."
argentina.32.a:0 "Nous récupérons ce qui nous revient de droit"
argentina.33.t:0 "Les Britanniques refusent notre demande concernant la Géorgie du Sud"
argentina.33.d:0 "Malgré nos liens avec la Grande-Bretagne et le travail de nos diplomates à Londres, les Britanniques ont décidé qu'il valait mieux que la Géorgie du Sud reste sous domination britannique."
argentina.33.a:0 "Une insulte pour tous les Argentins"
argentina.34.t:0 "Le Brésil accepte la proposition de coopération"
argentina.34.d:0 "Le Brésil a accepté de faire un effort conjoint avec nous pour stimuler l'industrie en Amérique du Sud."
argentina.34.a:0 "Unis, nous sommes forts"
argentina.35.t:0 "Le Brésil refuse la proposition de coopération"
argentina.35.d:0 "Malgré les avantages mutuels que la coopération entre nos pays apporterait, le Brésil n'a montré aucun intérêt pour notre initiative."
argentina.35.a:0 "Qu'il en soit ainsi"
argentina.36.t:0 "Le Brésil accepte le pacte de non-agression"
argentina.36.d:0 "La Nation du Brésil a accepté de signer un pacte de non-agression avec nous. Cela favorisera la paix et réduira les tensions en Amérique du Sud."
argentina.36.a:0 "Cela peut être le début de quelque chose de plus grand"
argentina.37.t:0 "Le Brésil refuse le pacte de non-agression"
argentina.37.d:0 "La Nation du Brésil, doutant peut-être de nos véritables intentions, a décidé de rejeter notre proposition."
argentina.37.a:0 "Quel dommage"
argentina.38.t:0 "L'Uruguay se rend"
argentina.38.d:0 "Grâce à notre puissante armée, l'Uruguay a décidé d'accepter notre ultimatum. Nous contrôlons maintenant l'Uruguay."
argentina.38.a:0 "Excellent"
argentina.39.t:0 "L'Uruguay résiste"
argentina.39.d:0 "Malgré notre forte présence militaire dans la région, les autorités uruguayennes ont décidé de rejeter notre ultimatum."
argentina.39.a:0 "Alors c'est la guerre"
argentina.40.t:0 "Les Soviétiques acceptent la proposition"
argentina.40.d:0 "L'Union soviétique a décidé d'accepter notre proposition d'accord de recherche entre nos nations. Les domaines de recherche concernent principalement l'électronique, et nos deux pays espèrent obtenir de grands avantages technologiques."
argentina.40.a:0 "Excellente nouvelle"
argentina.41.t:0 "Les Soviétiques refusent la proposition"
argentina.41.d:0 "Nos diplomates à Moscou nous informent que l'Union soviétique a décidé de rejeter notre accord de recherche proposé."
argentina.41.a:0 "Quel dommage"
argentina.42.t:0 "Nous sommes acceptés dans l'Axe"
argentina.42.d:0 "La grande nation allemande a décidé de nous accepter dans l'Axe. Nous espérons qu'à travers cette alliance, nous atteindrons la grandeur que mérite l'Argentine."
argentina.42.a:0 "Nous accomplirons de grandes choses ensemble"
argentina.43.t:0 "L'Allemagne refuse"
argentina.43.d:0 "Malgré nos liens étroits et notre volonté d'aider l'Allemagne, elle a décidé qu'il n'était pas dans son intérêt de nous accepter dans l'Axe."
argentina.43.a:0 "Ils perdent un allié puissant"
argentina.44.t:0 "Nous sommes acceptés dans le Komintern"
argentina.44.d:0 "L'Union soviétique a décidé de nous accepter dans le Komintern et nous faisons désormais partie de la Troisième Internationale. Fascistes et capitalistes n'ont aucune chance face au pouvoir du peuple."
argentina.44.a:0 "Nous sommes maintenant unis"
argentina.45.t:0 "L'URSS dit non"
argentina.45.d:0 "Malgré notre alignement politique et nos bonnes relations, l'Union soviétique a décidé qu'il valait mieux que chaque nation suive sa propre voie."
argentina.45.a:0 "Qu'il en soit ainsi"
argentina.46.t:0 "Nous sommes acceptés dans les Alliés"
argentina.46.d:0 "Nouvelles de Londres ! La Grande-Bretagne nous a acceptés dans les Alliés. Nous pouvons enfin jouer notre rôle pour maintenir la paix internationale."
argentina.46.a:0 "Nous ferons de notre mieux"
argentina.47.t:0 "La Grande-Bretagne dit non"
argentina.47.d:0 "Malgré nos relations avec la Grande-Bretagne, elle a décidé que ce n'était pas le moment pour nous de rejoindre les Alliés, peut-être plus tard."
argentina.47.a:0 "Si ce n'est pas maintenant, quand ?"

latin.1.t:0 "Traité anti-guerre"
latin.1.d:0 "Dans une tentative de promouvoir la paix et l'unité en Amérique latine, l'Argentine organise une série de réunions pour établir des règles entre nos pays afin d'éviter les confrontations militaires."
latin.1.a:0 "Signer le traité"
latin.1.b:0 "Ne pas signer le traité"
latin.2.t:0 "La Patria Grande"
latin.2.d:0 "L'Argentine a décidé que la paix ne suffit pas. Pour faire face à un monde de plus en plus dangereux et repousser tout envahisseur potentiel, l'Argentine propose une grande alliance entre toutes les nations latino-américaines : la Patria Grande."
latin.2.a:0 "Rejoindre la Patria Grande"
latin.2.b:0 "Ne pas rejoindre la Patria Grande"

ARG_FM2:0 "Fabricaciones Militares (FM)"
ARG_AFNE:0 "Compagnie de navigation argentine (AFNE)"
