# Modifications et ajouts de l’arbre vanilla inappropriés à mettre dans /replace
ARG_south_atlantic_islands:0 "Îles du Sud-Atlantique"
ARG_south_atlantic_islands_desc:0 "Les îles Malouines et Géorgie du Sud sont des territoires souverains de [ENG.GetName] depuis de nombreuses années. Malgré nos propres revendications sur ces îles, situées si près de [ARG.GetName], elles restent sous domination [ENG.GetAdjective]. Avec notre nouvelle alliance avec [ENG.GetName], peut-être pourrons-nous négocier un transfert de ces îles sous notre contrôle. Après tout, nous pourrions mieux les protéger dans cette guerre."
ARG_establishing_a_foothold:0 "Établir une Tête de Pont"

l_french:
# 56 Focus Tree
ARG_end_of_economic_depresion:0 "Fin de la Dépression Économique"
ARG_end_of_economic_depresion_desc:0 "Pour que notre nation prospère, nous devons nous affranchir de l'ombre de la Grande Dépression."
ARG_imports_substitution:0 "Substitution aux Importations"
ARG_imports_substitution_desc:0 "Nous ne pouvons pas satisfaire la demande nationale pour de nombreux biens. Il nous faut inverser cette situation et remplacer toutes nos importations civiles par une production locale."
ARG_law_11729:0 "Loi 11.729"
ARG_law_11729_desc:0 "En tant que moteur de la nation, les travailleurs méritent reconnaissance. Cette loi garantira de meilleures conditions de travail."
ARG_inmigrant_wave:0 "Vague d'Immigration"
ARG_inmigrant_wave_desc:0 "Avec la menace imminente d’une nouvelle Grande Guerre et l’agression [GER.GetAdjective] croissante, l’immigration est devenue une option souhaitable pour de nombreux Européens. Si nous investissons pour devenir un phare d’espoir pour ceux qui souhaitent échapper aux ravages de la guerre, nous en tirerons de grands bénéfices."
ARG_infrastructure_development:0 "Développement des Infrastructures"
ARG_infrastructure_development_desc:0 "Si nous voulons entreprendre des projets ou constructions avancés, nous aurons besoin d’infrastructures adéquates."
ARG_infrastructure_development_2:0 "Développement des Autoroutes"
ARG_infrastructure_development_2_desc:0 "Le besoin d’infrastructures meilleures augmente sans cesse, et les avantages justifient l’investissement."
ARG_technological_initiative:0 "Initiative Technologique"
ARG_technological_initiative_desc:0 "Nous sommes technologiquement en retard. Si nous voulons devenir une nation moderne, un investissement considérable est nécessaire."
ARG_industrial_census:0 "Recensement Industriel"
ARG_industrial_census_desc:0 "Si nous espérons développer notre économie, nous devons connaître notre capacité industrielle actuelle. Pour cela, un recensement industriel est requis."
ARG_establish_the_bcra:0 "Création de la BCRA"
ARG_establish_the_bcra_desc:0 "La création d’une banque centrale pour [ARG.GetNameDef] aidera à développer l’économie nationale."
ARG_invest_in_YPF:0 "Investir dans YPF"
ARG_invest_in_YPF_desc:0 "Actuellement, YPF produit une part considérable du pétrole dont notre pays a besoin. Si nous y investissons suffisamment, nous pourrions couvrir tous nos besoins en pétrole."
ARG_industrial_development:0 "Développement Industriel"
ARG_industrial_development_desc:0 "Nos centres de production actuels sont principalement ruraux, nécessitant d’importantes importations pour compenser. Une augmentation de notre production industrielle nous aiderait à inverser cette situation."
ARG_industrial_development_2:0 "Expansion Industrielle"
ARG_industrial_development_2_desc:0 "Un développement industriel supplémentaire serait bénéfique pour notre pays, transformant [ARG.GetNameDef] en une puissance montante aux yeux du monde."
ARG_industrial_development_3:0 "Achever l'Industrialisation"
ARG_industrial_development_3_desc:0 "Pour concurrencer les grandes puissances, nous avons besoin d’une plus grande capacité industrielle."
ARG_mil_production_effort:0 "Réarmement Militaire"
ARG_mil_production_effort_desc:0 "Notre production militaire est déficiente. Il serait sage de l’augmenter."
ARG_mil_production_effort_2:0 "Expansion Militaire Supplémentaire"
ARG_mil_production_effort_2_desc:0 "Satisfaire les besoins de l’armée nécessitera une expansion significative de l’industrie militaire."
ARG_mil_production_effort_3:0 "Achever le Secteur Militaire"
ARG_mil_production_effort_3_desc:0 "De plus en plus de demandes parviennent au gouvernement pour obtenir un soutien et un équipement militaire moderne. Cela peut être réalisé par la construction de davantage d’usines militaires."
ARG_barn_of_the_world:0 "Grange du Monde"
ARG_barn_of_the_world_desc:0 "Alors que la plupart des pays sont actuellement frappés par des troubles économiques ou la guerre, nous sommes le plus grand producteur de céréales du monde. Profitons-en financièrement."
ARG_pioneers:0 "Pionniers"
ARG_pioneers_desc:0 "Si nous voulons nous tenir aux côtés des autres puissances mondiales, nous avons besoin de scientifiques capables de fournir des innovations à leur niveau."
ARG_secret_weapons:0 "Armes Secrètes"
ARG_secret_weapons_desc:0 "Aussi tentant que soit d’investir toutes nos ressources dans le développement de nouveaux chars et avions, le secret pour gagner les guerres réside ailleurs : électronique, fusées et recherches nucléaires."
ARG_nuclear_committe:0 "Comité Nucléaire"
ARG_nuclear_committe_desc:0 "Nous sommes à l’aube d’une découverte capable de bouleverser le monde et ne pouvons nous permettre de rester à la traîne. Il nous faut créer un comité pour coordonner toutes nos recherches nucléaires."
ARG_atomic_center:0 "Centre Atomique"
ARG_atomic_center_desc:0 "Il serait judicieux d’investir davantage dans la recherche atomique."
ARG_balseiro_institute:0 "Institut Balseiro"
ARG_balseiro_institute_desc:0 "Créer un lieu de rassemblement pour nos esprits les plus brillants nous aidera à augmenter notre production technologique."
ARG_infamous_decade:0 "Décennie Infâme"
ARG_infamous_decade_desc:0 "C’est une période sombre pour le gouvernement [ARG.GetAdjective], marquée par des fraudes électorales massives et des persécutions politiques. Bien que cela nous donne plus de liberté d’action, cela pèse lourdement sur le moral du peuple."
ARG_argentinas_destiny:0 "Le Destin de l'Argentine"
ARG_argentinas_destiny_desc:0 "L’Argentine est née pour de grandes choses ; nous le savons. Il est temps que le monde le sache également."
ARG_land_of_the_worker:0 "Terre des Travailleurs"
ARG_land_of_the_worker_desc:0 "Nous devons nous libérer et libérer nos amis de l'oligarchie. Nous seuls pouvons y parvenir."
ARG_nationalism:0 "Nationalisme"
ARG_nationalism_desc:0 "[ARG.GetNameDef] est la plus grande nation d'Amérique Latine. Il est temps de montrer notre puissance au monde."
ARG_malvinas_argentinas:0 "Malvinas Argentinas"
ARG_malvinas_argentinas_desc:0 "Les Malouines nous reviennent de droit. Il est temps de les récupérer, quel qu'en soit le prix."
ARG_claim_uruguay:0 "Revendiquer l'Uruguay"
ARG_claim_uruguay_desc:0 "Beaucoup d'entre nous considèrent l'Uruguay comme faisant partie de [ARG.GetNameDef]. Peut-être est-il temps de le faire."
ARG_uruguay_ocupation:0 "Occupation de l'Uruguay"
ARG_uruguay_ocupation_desc:0 "L'Uruguay appartient légitimement à [ARG.GetNameDef]. Il est temps de le confirmer en envoyant un rappel amical à Montevideo."
ARG_claim_paraguay:0 "Revendiquer le Paraguay"
ARG_claim_paraguay_desc:0 "[PAR.GetNameDef] est faible ; il ne faudrait pas beaucoup d'efforts pour revendiquer leurs terres."
ARG_claim_bolivia:0 "Revendiquer la Bolivie"
ARG_claim_bolivia_desc:0 "Grâce aux luttes internes de [BOL.GetNameDef] après leur récente défaite face au Paraguay, ils sont une cible facile pour nous."
ARG_claim_chile:0 "Revendiquer le Chili"
ARG_claim_chile_desc:0 "[CHL.GetNameDefCap] n'est qu'une tâche à côté de nous. Le peuple nous presse de prendre ce qui devrait déjà nous appartenir."
ARG_german_joint_military_operations:0 "Opérations militaires conjointes avec [GER.GetNameDef]"
ARG_german_joint_military_operations_desc:0 "En menant des opérations militaires conjointes avec [GER.GetNameDef], nous apprendrons des leçons qu'eux seuls peuvent nous enseigner."
ARG_national_fanatism:0 "Vive la Patrie"
ARG_national_fanatism_desc:0 "Notre peuple est conscient de la grandeur de notre nation et donnerait volontiers sa vie pour elle."
ARG_break_roca_runciman_treaty:0 "Rompre le traité Roca-Runciman"
ARG_break_roca_runciman_treaty_desc:0 "Le peuple [ENG.GetAdjective] cherche à nous tromper avec un accord injuste. Nous ne le tolérerons pas."
ARG_contest_monroe_doctrine:0 "Contester la doctrine Monroe"
ARG_contest_monroe_doctrine_desc:0 "[USA.GetNameDefCap] cherche à intervenir dans les affaires des pays d'Amérique Latine comme si nous leur appartenions. Nous ne pouvons pas les laisser faire."
ARG_ussr_coop:0 "Coopération [SOV.GetAdjective]"
ARG_ussr_coop_desc:0 "Nous poserons les bases d'une amitié durable avec [SOV.GetNameDef] en coopérant avec eux."
ARG_ussr_research_agreement:0 "Accord de recherche [SOV.GetAdjective]"
ARG_ussr_research_agreement_desc:0 "Un accord de recherche principalement basé sur l'ingénierie serait très bénéfique pour [SOV.GetNameDef] et pour nous."
ARG_ussr_four_year_plan:0 "Plan quadriennal"
ARG_ussr_four_year_plan_desc:0 "Nous visons à moderniser notre industrie grâce à une série de décisions à long terme et à coopérer avec d'autres nations communistes dans le monde."
ARG_join_the_comintern:0 "Rejoindre le Komintern"
ARG_join_the_comintern_desc:0 "Pour instaurer un monde sans classes sociales, nous avons besoin d'alliés. Rejoindre le Komintern est notre meilleure option."
ARG_south_americas_talks:0 "Discussions sud-américaines"
ARG_south_americas_talks_desc:0 "Notre continent est grand, et les nations qui le composent le sont aussi. Le monde change à un rythme alarmant ; nous devons travailler ensemble pour nous protéger des menaces extérieures."
ARG_south_americas_talks_tt:0 "Améliore les relations avec les nations sud-américaines."
ARG_anti_war_treaty:0 "Traité anti-agression"
ARG_anti_war_treaty_desc:0 "Un traité pro-paix avec nos voisins renforcerait nos relations et la stabilité, favorisant le développement régional."
ARG_anti_war_treaty_tt:0 "Les voisins sont invités à signer un traité empêchant la guerre dans la zone."
ARG_anti_war_treaty_2:0 "Conférence géopolitique"
ARG_anti_war_treaty_2_desc:0 "Étendre nos pourparlers pro-paix avec les autres nations sud-américaines ne peut être que bénéfique."
ARG_anti_war_treaty_2_tt:0 "Le reste de l'Amérique du Sud est invité à signer un traité empêchant la guerre dans la zone."
ARG_anti_war_treaty_3:0 "Influence caribéenne"
ARG_anti_war_treaty_3_desc:0 "Toute l'Amérique Latine est une grande famille. Étendons nos pourparlers pro-paix."
ARG_anti_war_treaty_3_tt:0 "Les nations des Caraïbes sont invitées à signer un traité empêchant la guerre dans la zone."
ARG_la_patria_grande:0 "La Patria Grande"
ARG_la_patria_grande_desc:0 "Les traités de paix ne suffisent pas. L'Amérique Latine doit former un front uni pour se tenir face au monde."
la_patria_grande_faction:0 "Traité de la Plata"
ARG_la_patria_grande_tt:0 "Les nations latino-américaines sont invitées à rejoindre le traité de la Plata."
ARG_the_will_of_the_people_focus:0 "La Volonté du Peuple"
ARG_the_will_of_the_people_focus_desc:0 "Un pays n'est rien sans son peuple, et ce dernier doit le guider."
ARG_one_mind:0 "Une Seule Volonté"
ARG_one_mind_desc:0 "Notre peuple partage des buts et des objectifs, s'unissant pour accomplir des choses toujours plus grandes."
ARG_integrate_native_tribes:0 "Intégrer les Tribus Autochtones"
ARG_integrate_native_tribes_desc:0 "Les descendants des habitants originels de l'Argentine ont été tenus à l'écart de notre société bien trop longtemps. Il est temps de changer cela."
ARG_liberty_focus:0 "Liberté"
ARG_liberty_focus_desc:0 "La démocratie est le gouvernement du peuple. Nous devons entendre chaque voix."
ARG_befriend_uruguay:0 "Se lier d'amitié avec [URG.GetNameDef]"
ARG_befriend_uruguay_desc:0 "Se lier d'amitié avec [URG.GetNameDef]"
ARG_befriend_bolivia:0 "Se lier d'amitié avec [BOL.GetNameDef]"
ARG_befriend_bolivia_desc:0 "Se lier d'amitié avec [BOL.GetNameDef]"
ARG_befriend_paraguay:0 "Se lier d'amitié avec [PAR.GetNameDef]"
ARG_befriend_paraguay_desc:0 "Se lier d'amitié avec [PAR.GetNameDef]"
ARG_befriend_chile:0 "Se lier d'amitié avec [CHL.GetNameDef]"
ARG_befriend_chile_desc:0 "Se lier d'amitié avec [CHL.GetNameDef]"
ARG_brazil_coop:0 "Coopération [BRA.GetAdjective]"
ARG_brazil_coop_desc:0 "Nous poserons les bases d'une amitié durable entre nos pays en coopérant avec [BRA.GetNameDef]."
ARG_external_help_focus:0 "Aide extérieure"
ARG_external_help_focus_desc:0 "Nous pouvons améliorer notre faible développement technologique et notre économie médiocre en sollicitant l'aide internationale."
ARG_neutrality_foc:0 "Neutralité"
ARG_neutrality_foc_desc:0 "Les grandes puissances mondiales sont au bord de la guerre ; peut-être que rien de mal ne nous arrivera si nous restons à l'écart."
ARG_usa_coop:0 "Coopération [USA.GetAdjective]"
ARG_usa_coop_desc:0 "Nous poserons les bases d'une amitié durable entre nos pays en coopérant avec [USA.GetNameDef]."
ARG_uk_coop:0 "Coopération [ENG.GetAdjective]"
ARG_uk_coop_desc:0 "Nous poserons les bases d'une amitié durable entre nos pays en coopérant avec [ENG.GetNameDef]."
ARG_usa_military_coop:0 "Coopération militaire [USA.GetAdjective]"
ARG_usa_military_coop_desc:0 "[USA.GetNameDefCap] connaît la guerre et est prêt à nous enseigner."
ARG_usa_technological_coop:0 "Coopération technologique [USA.GetAdjective]"
ARG_usa_technological_coop_desc:0 "L'expertise technologique de [USA.GetNameDef] est inégalée. Coopérer avec leurs équipes de recherche ne peut que nous bénéficier."
ARG_eden_malbran_treaty:0 "Traité Eden Malbran"
ARG_eden_malbran_treaty_desc:0 "Parfois, certains sacrifices sont nécessaires au nom des relations internationales. La signature de ce traité nous placera dans une situation visible, mais nos relations avec [ENG.GetNameDef] s'amélioreront sans aucun doute."
ARG_uk_industrial_coop:0 "Coopération industrielle [ENG.GetAdjective]"
ARG_uk_industrial_coop_desc:0 "Un partenariat avec [ENG.GetNameDef] permettra une croissance industrielle sans précédent dans notre pays."
ARG_uk_naval_coop:0 "Coopération navale [ENG.GetAdjective]"
ARG_uk_naval_coop_desc:0 "La production des chantiers navals [ENG.GetAdjective] est supérieure à la nôtre, donc demander leur soutien technique nous serait grandement bénéfique."
# ARG_join_the_allies:0 "Rejoindre les Alliés"  #Localisé dans le fichier JUNO, ne pas écraser
# ARG_join_the_allies_desc:0 "Le monde est au bord du chaos. Rejoindre les Alliés est notre meilleure chance de rétablir la paix et de mettre fin à ceux qui veulent nous asservir."  #Localisé dans le fichier JUNO, ne pas écraser
ARG_militarism:0 "Militarisme"
ARG_militarism_desc:0 "Ceux qui considèrent l'armée comme un mal nécessaire hésiteront face à la guerre. Nous devons militariser notre culture pour devenir une force de combat efficace."
ARG_military_youth:0 "Jeunesse militaire"
ARG_military_youth_desc:0 "Des organisations pour promouvoir la discipline et l'éducation politique de notre jeunesse favoriseront la loyauté et le sacrifice de soi."
ARG_paramilitarism:0 "Paramilitarisme"
ARG_paramilitarism_desc:0 "Les principes militaires ont des applications en dehors de l'armée. Plus de personnes auront une formation militaire grâce au développement d'unités semi-militarisées pour compléter nos forces armées."
ARG_political_correctness:0 "Correctitude politique"
ARG_political_correctness_desc:0 "Les personnes ayant des opinions légèrement controversées ou embarrassantes semblent préoccupées par une conspiration à grande échelle. Cela semble être une excellente idée."
ARG_indoctrination_focus:0 "Endoctrinement"
ARG_indoctrination_focus_desc:0 "Une fois établi que notre idéologie est basée sur la vérité, elle peut être enseignée comme telle. L'éducation et les médias doivent refléter cette leçon."
ARG_political_commissars:0 "Commissaires politiques"
ARG_political_commissars_desc:0 "Pour garantir que nos politiques soient suivies dans la pratique militaire, nous introduirons des officiels nommés politiquement dans les rangs militaires."
ARG_army_reform:0 "Réforme de l'armée"
ARG_army_reform_desc:0 "Nos armées sont dans un état honteux. Nous devons réformer complètement notre structure militaire."
ARG_external_advisors:0 "Conseillers militaires étrangers"
ARG_external_advisors_desc:0 "Nous manquons d'expérience, mais d'autres en ont en abondance. Nous pourrions leur demander de l'aide dans nos efforts pour réformer notre armée."
ARG_military_academy:0 "Académie militaire nationale"
ARG_military_academy_desc:0 "Dépendre d'autres nations pour former nos officiers nous affaiblirait politiquement, nous devons donc développer notre propre méthode de formation."
ARG_motorized_army:0 "Armée motorisée"
ARG_motorized_army_desc:0 "La mobilité et la protection sont cruciales pour déplacer l'infanterie en toute sécurité sur le terrain. Se concentrer sur ces développements nous permettra d'agir rapidement."
ARG_study_foreign_tanks:0 "Étudier les chars étrangers"
ARG_study_foreign_tanks_desc:0 "Certaines nations possèdent des véhicules blindés avancés. Nous pouvons analyser leurs conceptions pour améliorer nos futurs véhicules blindés."
ARG_mechanized_experiments:0 "Expériences mécanisées"
ARG_mechanized_experiments_desc:0 "En repensant les possibilités de l'infanterie motorisée, nous pouvons repousser les limites des véhicules que nous pouvons construire aujourd'hui."
ARG_tanks_experiments:0 "Expériences sur les chars"
ARG_tanks_experiments_desc:0 "En repensant les possibilités des véhicules blindés, nous pouvons repousser les limites de ce que nous pouvons construire aujourd'hui."
ARG_tanks_modernization:0 "Modernisation des chars"
ARG_tanks_modernization_desc:0 "Notre armée a besoin de chars modernes pour avoir l'avantage sur le champ de bataille. Nos ingénieurs sont sûrs de pouvoir atteindre un blindage aussi bon que celui des grandes puissances."
ARG_cruiser_tanks_experiments:0 "Expériences sur les chars de croisière"
ARG_cruiser_tanks_experiments_desc:0 "Avec les bases de la conception des chars en place, nous pouvons nous concentrer sur des idées novatrices pour mieux concevoir nos chars."
ARG_heavy_tanks_experiments:0 "Expériences sur les chars lourds"
ARG_heavy_tanks_experiments_desc:0 "Avec les bases de la conception des chars en place, nous pouvons nous concentrer sur les chars lourds qui agiront comme des têtes de pont pour nos armées."
ARG_study_foreign_equipment:0 "Étudier l'équipement étranger"
ARG_study_foreign_equipment_desc:0 "Certaines nations ont développé des armes avancées. Analyser leurs conceptions améliorera nos futures armes."
ARG_equipment_modernization:0 "Modernisation de l'équipement"
ARG_equipment_modernization_desc:0 "Un soldat n'est rien sans arme. Pour moderniser notre armée, nous devons d'abord mettre à jour notre équipement."
ARG_standarized_equipment:0 "Équipement standardisé"
ARG_standarized_equipment_desc:0 "En standardisant l'équipement de nos soldats, nous pouvons optimiser notre industrie pour produire cet équipement à un rythme plus élevé."
ARG_equipment_innovation:0 "Innovation en matière d'équipement"
ARG_equipment_innovation_desc:0 "De meilleures armes signifient de meilleurs soldats ; si nous voulons triompher, nous devons rester en avance sur la technologie des armes."
ARG_special_forces:0 "Forces spéciales"
ARG_special_forces_desc:0 "Nous avons besoin de forces d'élite ; les troupes de montagne et les parachutistes doivent être notre priorité."
ARG_artillery_modernization:0 "Modernisation de l'artillerie"
ARG_artillery_modernization_desc:0 "Une bataille ne se résume pas aux soldats qui s'affrontent ; un soutien d'artillerie moderne est nécessaire si nous voulons que nos divisions soient efficaces."
ARG_specialized_artillery:0 "Artillerie spécialisée"
ARG_specialized_artillery_desc:0 "Nos soldats affrontent souvent l'ennemi en désavantage, que ce soit sur terre ou dans les airs ; nos armées doivent avoir les moyens de remédier à cette situation."
ARG_new_officers_programme:0 "Programme des nouveaux officiers"
ARG_new_officers_programme_desc:0 "La colonne vertébrale d'une armée, ce sont ses généraux ; pour réformer correctement notre armée, de nouveaux officiers sont nécessaires."
ARG_volunteer_corps:0 "Corps de volontaires"
ARG_volunteer_corps_desc:0 "En envoyant nos soldats combattre dans d'autres conflits, nous acquerrons une expérience précieuse pour les conflits futurs."
ARG_navy_reform:0 "Réforme de la marine"
ARG_navy_reform_desc:0 "Notre marine est dans un état honteux ; nos navires ne sauraient où naviguer. Une restructuration complète est nécessaire."
ARG_state_dockyards:0 "Chantiers navals d'État"
ARG_state_dockyards_desc:0 "Pour déployer une marine puissante, nous devons avoir un lieu pour construire nos navires."
ARG_naval_development_I:0 "Développement naval"
ARG_naval_development_I_desc:0 "Le développement de notre capacité de construction navale doit se poursuivre."
ARG_naval_development_II:0 "Développement naval II"
ARG_naval_development_II_desc:0 "Le développement de notre capacité de construction navale doit se poursuivre."
ARG_naval_base_development:0 "Développement des bases navales"
ARG_naval_base_development_desc:0 "Notre marine grandit, nous avons maintenant besoin de nouvelles bases à partir desquelles nos nouveaux navires pourront opérer."
ARG_overseas_officer_training:0 "Formation des officiers à l'étranger"
ARG_overseas_officer_training_desc:0 "Si le moment vient où nos navires devront combattre, leurs capitaines doivent savoir quoi faire ; ils ne peuvent l'apprendre qu'en situation de guerre ; les envoyer à l'étranger aidera à cet apprentissage."
ARG_naval_exercises:0 "Exercices navals"
ARG_naval_exercises_desc:0 "Quelle meilleure façon pour nos marins d'apprendre le comportement en combat que par des exercices et des simulations."
ARG_fleet_modernization:0 "Modernisation de la flotte"
ARG_fleet_modernization_desc:0 "La plupart des conceptions de nos navires sont anciennes ; nous devrons moderniser nos conceptions si nous ne voulons pas perdre chaque bataille."
ARG_screening_ships_modernization:0 "Modernisation des navires d'escorte"
ARG_screening_ships_modernization_desc:0 "Bien que les grands navires apportent un grand pouvoir, ils sont coûteux à construire. Nous pourrions plutôt nous concentrer sur une marine plus grande et meilleure."
ARG_cruisers_modernization:0 "Modernisation des croiseurs"
ARG_cruisers_modernization_desc:0 "Les croiseurs sont des navires importants ; ils constituent un compromis entre coût et puissance."
ARG_submarines_modernization:0 "Modernisation des sous-marins"
ARG_submarines_modernization_desc:0 "Même si notre ennemi possède une marine plus grande, nous pouvons infliger de graves dommages à son industrie en privant ses importations."
ARG_submarines_experiments:0 "Expériences sur les sous-marins"
ARG_submarines_experiments_desc:0 "Les sous-marins avancés doivent être une priorité si nous ne pouvons pas affronter directement l'ennemi."
ARG_capital_ships_development:0 "Développement des navires de ligne"
ARG_capital_ships_development_desc:0 "Notre marine a besoin de puissants navires de ligne pour affirmer sa domination en mer. Concevoir et construire des cuirassés et croiseurs modernes nous donnera une supériorité stratégique."
ARG_capital_ships_development_desc:0 "Des navires plus puissants signifient une marine plus puissante, et nos ingénieurs en sont conscients."
ARG_capital_ships_modernization:0 "Modernisation des navires de ligne"
ARG_capital_ships_modernization_desc:0 "En concevant des navires puissants, nous aurons le contrôle des mers."
ARG_carrier_development:0 "Développement des porte-avions"
ARG_carrier_development_desc:0 "Nous pouvons développer des porte-avions qui nous permettront de déployer des avions loin de chez nous."
ARG_carrier_modernization:0 "Modernisation des porte-avions"
ARG_carrier_modernization_desc:0 "Nos porte-avions sont loin d'être modernes ; nous pouvons nous concentrer sur leur mise à jour."
ARG_naval_doctrine:0 "Doctrine navale"
ARG_naval_doctrine_desc:0 "Réformer la marine ne consiste pas seulement à avoir des navires ; il s'agit aussi de savoir comment les utiliser."
ARG_air_force_reform:0 "Réforme de l'armée de l'air"
ARG_air_force_reform_desc:0 "Notre armée de l'air est dans un état honteux, nos avions tombent en panne avant même de décoller, et il y a peu de pilotes formés parmi nos rangs."
ARG_bomber_modernization:0 "Modernisation des bombardiers"
ARG_bomber_modernization_desc:0 "Perturber l'économie de notre ennemi est d'une importance capitale ; cela l'empêchera de fournir des approvisionnements à ses armées, permettant à nos troupes d'avancer."
ARG_cas_innovation:0 "Innovation en appui aérien rapproché"
ARG_cas_innovation_desc:0 "L'appui aérien rapproché est vital sur le champ de bataille ; au-delà des dégâts infligés aux lignes ennemies, il augmente considérablement le moral de nos soldats."
ARG_light_fighter_modernization:0 "Modernisation des chasseurs légers"
ARG_light_fighter_modernization_desc:0 "Pour mener correctement des opérations aériennes, il faut assurer la supériorité aérienne. Pour cela, des avions rapides et agiles sont nécessaires."
ARG_heavy_fighter_modernization:0 "Modernisation des chasseurs lourds"
ARG_heavy_fighter_modernization_desc:0 "Pour protéger nos bombardiers lorsqu'ils survolent des zones dangereuses ou pour abattre les bombardiers ennemis cherchant à endommager nos industries, nous pouvons nous concentrer sur un type de chasseur plus lourd et puissant."
ARG_aviation_schools:0 "Écoles d'aviation"
ARG_aviation_schools_desc:0 "Les pilotes formés sont en nombre limité. En établissant des écoles d'aviation, nous pourrions résoudre ce problème."
ARG_air_innovations:0 "Innovations aériennes"
ARG_air_innovations_desc:0 "Les guerres modernes ne peuvent être gagnées sans dominer les cieux. Nous devons tout faire pour développer l'armée de l'air."
ARG_air_base_dev:0 "Développement des bases aériennes"
ARG_air_base_dev_desc:0 "Un plan pour établir davantage de bases aériennes sur notre territoire est nécessaire pour augmenter notre nombre d'aéronefs."
ARG_air_doctrine:0 "Doctrine aérienne"
ARG_air_doctrine_desc:0 "Pour dominer les cieux, nous devons améliorer nos tactiques aériennes."
ARG_air_heroes:0 "Héros de l'air"
ARG_air_heroes_desc:0 "En idolâtrant certains de nos as, les jeunes générations seront encouragées à suivre leurs pas."
ARG_nav_innovation:0 "Innovation navale"
ARG_nav_innovation_desc:0 "Les Américains ont démontré l'efficacité des frappes aériennes contre des cibles navales dès 1921. Nous ne devons pas négliger cette branche de l'armée de l'air si nous avons l'intention de faire la guerre à une puissance navale."
ARG_internationalism:0 "Internationalisme"
ARG_internationalism_desc:0 "L'idéologie n'a pas de frontières. Nos idéaux sont au-dessus de la souveraineté."
ARG_demand_georgia:0 "Revendiquer la Géorgie du Sud"
ARG_demand_georgia_desc:0 "La Géorgie du Sud est [ARG.GetAdjective]. Qui est [ENG.GetNameDef] pour nous l'enlever ? S'ils ne veulent pas la rendre, nous la prendrons."
ARG_brazil_non_agression:0 "Pacte de non-agression avec le Brésil"
ARG_brazil_non_agression_desc:0 "Une confrontation avec [BRA.GetNameDef] n'est pas dans notre intérêt. Pour améliorer nos relations avec le gouvernement [BRA.GetAdjective], nous pouvons proposer un pacte de non-agression entre nos nations."
ARG_brazil_joint_exercises:0 "Exercices conjoints [ARG.GetAdjective]-[BRA.GetAdjective]"
ARG_brazil_joint_exercises_desc:0 "Nos deux nations connaissent un essor grâce à la situation en Europe. Nous devrions aider nos voisins pour montrer que nous les soutenons."
ARG_ask_for_georgia:0 "Demander la Géorgie du Sud"
ARG_ask_for_georgia_desc:0 "La Géorgie du Sud et les îles Sandwich du Sud sont légitimement [ARG.GetAdjective]. Nos liens récemment établis avec [ENG.GetNameDef] pourraient nous permettre de trouver une solution diplomatique."
ARG_ask_for_malvinas:0 "Demander les Malvinas"
ARG_ask_for_malvinas_desc:0 "Les Malvinas sont légitimement [ARG.GetAdjective]. Nos liens récemment établis avec [ENG.GetNameDef] pourraient nous permettre de trouver une solution diplomatique."
ARG_proving_grounds:0 "Terrain d'essai"
ARG_proving_grounds_desc:0 "Si nous voulons créer les armes de demain, nous devons avoir un endroit pour tester les prototypes."
ARG_political_repression:0 "Répression politique"
ARG_political_repression_desc:0 "Pour assurer notre stabilité politique et l'unité de notre pays, nous devons nous assurer que les éléments radicaux de la société soient tenus à l'écart du gouvernement, même si nous devons recourir à des méthodes néfastes."

ARG_occupy_uruguay:0 "Occuper l'Uruguay"
ARG_occupy_uruguay_desc:0 "Le gouvernement uruguayen actuel est un obstacle à l'unification des Républiques du Platine. Conquérons-les pour sécuriser notre sphère d'influence."

ARG_occupy_paraguay:0 "Occuper le Paraguay"
ARG_occupy_paraguay_desc:0 "Le Paraguay refuse de coopérer avec nous dans notre utopie communiste glorieuse et doit donc être traité."

ARG_spanish_civil_war_involvement:0 "Participation à la guerre civile espagnole"
ARG_spanish_civil_war_involvement_desc:0 "Nous ne pouvons pas laisser nos frères espagnols se battre sans nous impliquer d'une manière ou d'une autre."
r56_ARG_spanish_civil_war_involvement:0 "Participation à la guerre civile espagnole"

ARG_national_catholicism:0 "Catholicisme national"
ARG_national_catholicism_desc:0 "L'Église catholique est l'Église de Dieu et rien ne peut être au-dessus."

ARG_political_corruption_idea:0 "Corruption politique"
ARG_political_corruption_idea_desc:0 "Depuis de nombreuses années, [ARG.GetNameDef] est gangréné par une corruption fervente au sein de son gouvernement. Malgré la formation de la Concordancia, les fraudes électorales et l'intimidation des électeurs persistent."

ARG_corruption_crackdown_idea:0 "Lutter contre la corruption"
ARG_corruption_crackdown_ideas_desc:0 "La corruption qui gangrenait notre gouvernement était inacceptable. Grâce aux politiques de Roberto María Ortiz, nous avons enfin commencé à mettre fin aux activités frauduleuses de nos politiciens."

ARG_anti_corruption_idea:0 "Politique anti-corruption"
ARG_anti_corruption_idea_desc:0 "La corruption qui gangrenait notre gouvernement était inacceptable. Grâce aux politiques de Marcelo T. de Alvear, nous avons enfin commencé à mettre fin aux activités frauduleuses de nos politiciens."

ARG_growing_nationalism_idea:0 "Mouvement nationaliste croissant"
ARG_growing_nationalism_idea_desc:0 "Le Parti nationaliste argentin gagne en popularité et attire de plus en plus de soutien. Le nationalisme argentin vise à restaurer l'identité [ARG.GetAdjective] et à s'imposer comme puissance dominante en Amérique du Sud."

ARG_instituto_aerotecnico_de_cordoba:0 "Instituto Aerotécnico de Córdoba"

ARG_american_oil_concern:0 "Compagnie pétrolière industrielle"
ARG_american_oil_concern_desc:0 "Nos réserves de pétrole peuvent être développées grâce à l'expertise [USA.GetAdjective]."

ARG_american_industrial_investments:0 "Investissements industriels [USA.GetAdjective]"
ARG_american_industrial_investments_desc:0 "Le capital [USA.GetAdjective] peut aider à développer notre pays et à renforcer notre importance stratégique."

ARG_join_the_defense_of_the_hemisphere:0 "Rejoindre la défense de l'hémisphère"
ARG_join_the_defense_of_the_hemisphere_desc:0 "[USA.GetNameDefCap] est la force principale dans la défense des Amériques ; pour assurer la paix que nous chérissons, nous devons les assister."

