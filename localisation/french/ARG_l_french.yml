denied_malvinas:0 "Malouines refusées"
denied_south_georgia:0 "Géorgie du Sud refusée"
refused_coop:0 "Coopération refusée"
arg_economic_depresion:0 "Dépression économique"
arg_economic_depresion_desc:0 "L'économie de notre pays traverse une période difficile à cause de la Grande Dépression aux [USA.GetNameDef]."
arg_std_equipment:0 "Équipement standardisé"
arg_std_equipment_desc:0 "Grâce au dévouement de nos ingénieurs et à l'optimisation de nos industries, nous avons conçu du matériel facile à produire pour nos soldats."
arg_overseas_officers:0 "Officiers à l'étranger"
arg_overseas_officers_desc:0 "Des officiers navals sont envoyés à l'étranger pour se former au commandement, tandis que nous ne nous engageons pas directement dans un conflit."
arg_naval_exercises:0 "Exercices navals"
arg_naval_exercises_desc:0 "La marine se modernise, mais il faut connaître les performances des navires en haute mer. Pour cela, nous menons actuellement des exercices navals."
arg_aviation_schools:0 "Écoles d'aviation"
arg_aviation_schools_desc:0 "Pour triompher dans les airs, nos pilotes doivent être préparés ; ils doivent savoir voler, et le meilleur moyen d'y parvenir est de les former à l'avance."
arg_air_heroes:0 "Héros de l'air"
arg_air_heroes_desc:0 "Les pilotes montrent un grand enthousiasme, et de nombreux as sont nés dans des batailles aériennes ; ces as inspirent les jeunes générations à combattre et à être reconnus."
imports_substitution:0 "Substitution des importations"
imports_substitution_desc:0 "Notre industrie est déficiente ; si nous voulons nous affirmer, nous devons remplacer toutes les importations civiles."
law_11729:0 "Loi 11.729"
law_11729_desc:0 "Les travailleurs ont besoin de reconnaissance ; ils sont le moteur de la nation, et sans eux, il n'y aurait pas de production. Cette loi garantit de meilleures conditions de travail."
arg_industrial_census:0 "Recensement industriel"
arg_industrial_census_desc:0 "Une économie ne peut pas être optimisée sans connaître le niveau de développement de l'industrie ; un recensement doit être effectué."
establish_the_bcra:0 "BCRA"
establish_the_bcra_desc:0 "La Banque centrale de [ARG.GetNameDef] est la principale banque d'État ; créer cette institution aidera à développer l'économie nationale."
barn_of_the_world:0 "Grenier du monde"
barn_of_the_world_desc:0 "Alors que la plupart des pays sont affectés par des problèmes économiques ou la guerre, nous sommes maintenant le principal producteur de céréales au monde, ce qui aidera notre économie."
infamous_decade:0 "Décennie infâme"
infamous_decade_desc:0 "Le gouvernement [ARG.GetNameDef] traverse une période sombre, avec fraude électorale et persécution de l'opposition ; cela donne plus de liberté d'action au gouvernement, mais pèse sur le peuple."
viva_la_patria:0 "Viva la Patria"
viva_la_patria_desc:0 "Le peuple [ARG.GetAdjective] a traversé de nombreux défis, mais garde foi en sa nation ; avec cette détermination, [ARG.GetNameDef] triomphera malgré les obstacles."
arg_four_year_plan:0 "Plan quadriennal"
arg_four_year_plan_desc:0 "À travers une série de décisions à long terme, nous visons à moderniser notre industrie et à coopérer avec d'autres nations communistes."
arg_the_will_of_the_people:0 "Volonté du peuple"
arg_the_will_of_the_people_desc:0 "Un pays n'existe pas sans son peuple ; il est logique que le peuple gouverne le pays."
one_mind:0 "Une seule volonté"
one_mind_desc:0 "Le peuple sait ce qu'il veut, partage des objectifs, s'entraide, et le pays s'unit pour accomplir des choses extraordinaires."
arg_liberty:0 "Liberté"
arg_liberty_desc:0 "La démocratie est le moyen adéquat pour que le peuple gouverne ; chacun a son mot à dire."
arg_external_help:0 "Assistance extérieure"
arg_external_help_desc:0 "Le manque de connaissances et une économie défaillante peuvent être résolus en demandant de l'aide à d'autres nations."
industrial_coop:0 "Coopération industrielle"
industrial_coop_desc:0 "Le développement n'a pas toujours besoin d'être fait seul. Parfois, demander de l'aide est bénéfique pour les deux parties."
naval_coop:0 "Coopération navale"
naval_coop_desc:0 "Certaines nations savent mieux construire chantiers navals et ports ; c'est une bonne raison de demander leur aide pour ce type de structures."
arg_malbran:0 "Traité Eden-Malbran"
arg_malbran_desc:0 "Parfois, certains sacrifices sont nécessaires pour se faire apprécier par les puissants ; en signant ce traité, [ARG.GetNameDef] se trouvait dans une situation difficile, mais les relations avec [ENG.GetNameDef] se sont améliorées."
arg_british_advisors:0 "Conseillers [ENG.GetAdjective]"
arg_british_advisors_desc:0 "[ENG.GetNameDef] aide [ARG.GetNameDef] à moderniser son armée grâce à des conseillers."
arg_german_advisors:0 "Conseillers [GER.GetAdjective]"
arg_german_advisors_desc:0 "[GER.GetNameDef] aide [ARG.GetNameDef] à moderniser son armée grâce à des conseillers."
arg_soviet_advisors:0 "Conseillers [SOV.GetAdjective]"
arg_soviet_advisors_desc:0 "[SOV.GetNameDef] aide [ARG.GetNameDef] à moderniser son armée grâce à des conseillers."
arg_american_advisors:0 "Conseillers [USA.GetAdjective]"
arg_american_advisors_desc:0 "[USA.GetNameDef] aide [ARG.GetNameDef] à moderniser son armée grâce à des conseillers."
arg_inmigrant_wave:0 "Vague d'immigration"
arg_inmigrant_wave_desc:0 "Un nombre significatif de personnes arrive dans notre pays pour s'y installer."
arg_political_repression:0 "Répression politique"
arg_political_repression_desc:0 "Maintenir l'ordre a un coût."
ARG_supremacy_over_brazil:0 "Suprématie sur [BRA.GetNameDef]"
ARG_supremacy_over_brazil_desc:0 "En étant le pays le plus grand et le plus industrieux d'Amérique du Sud, [BRA.GetNameDef] menace notre sphère d'influence en rapide expansion. Pour préserver notre domination dans la région, nous devons établir un régime ami sous notre contrôle direct."

