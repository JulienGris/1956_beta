##politique##
MON_troika_organized:0 "« Troïka » organisée"
MON_troika_organized_desc:0 "Suivant l’exemple des troïkas révolutionnaires staliniennes, nous avons établi notre propre troïka, dirigée par Choibalsan, afin de rétablir la loi et l’ordre dans l’État."

MON_political_opposition_organizing:0 "Organisation de l’opposition politique"
MON_political_opposition_organizing_desc:0 "Conscients d’être écartés du pouvoir, les militaristes tenteront de renverser le gouvernement et d’instaurer une dictature militaire. Nous devons nous préparer à leur attaque et organiser nos propres bases de soutien !"

MON_civil_militia_idea:0 "Milice civile établie"

MON_banditry_know_how:0 "Savoir-faire du banditisme"

MON_communist_paradise_achieved:0 "Paradis communiste atteint"
MON_communist_paradise_achieved_desc:0 ""

MON_first_five_year_plan:0 "Premier plan quinquennal"

MON_volunteer_corps:0 "Corps de volontaires [ROOT.getAdjective]"

MON_powerful_choibalsan:0 "Choibalsan puissant"
MON_powerful_choibalsan_desc:0 "L’un des sept hommes ayant négocié l’indépendance mongole avec la Chine et la Russie en 1921, Choibalsan et ses partisans occupent désormais une place importante au sein du gouvernement."

MON_ministery_of_interior_reorganized:0 "Ministère de l’Intérieur réorganisé"
MON_ministery_of_interior_reorganized_desc:0 "Dans le sillage du NKVD, notre pays a réussi à améliorer considérablement les performances du Tatnuulhim fenhij Gazar (Agence générale du renseignement de Mongolie)."

MON_consolidated_power_1:0 "Pouvoir consolidé dans une zone"
MON_consolidated_power_1_desc:0 "Le pouvoir est désormais fermement tenu par un seul dirigeant : Choibalsan, opérant dans l’ombre d’Anandyn Amar."

MON_consolidated_power_2:0 "Pouvoir consolidé dans la plupart des zones"
MON_consolidated_power_2_desc:0 "Choibalsan a sécurisé de nombreux secteurs d’intérêt et exerce désormais son autorité sur [MON.getNameDef]."

MON_consolidated_power_3:0 "Pouvoir totalement consolidé"
MON_consolidated_power_3_desc:0 "Choibalsan exerce désormais un contrôle total sur [MON.getNameDef]."

Mon_intellectuals_purged:0 "Intellectuels purgés"
Mon_intellectuals_purged_desc:0 "Considérés comme « indignes de confiance », plusieurs intellectuels ont été purgés."

Mon_party_purged:0 "Parti purgé"
Mon_party_purged_desc:0 "Des remaniements et des arrestations ont eu lieu, laissant de profondes cicatrices dans la structure actuelle du parti."

Mon_lamas_purged:0 "Lamas purgés"
Mon_lamas_purged_desc:0 "De nombreux membres des institutions religieuses ont fui le pays ou ont été contraints de se cacher à la suite des purges gouvernementales récentes."

MON_border_patrols_recruitment:0 "Recrutement des patrouilles frontalières"
MON_border_patrols_recruitment_desc:0 "La sécurité de nos frontières terrestres est devenue une priorité absolue. Nous devons mobiliser toutes les ressources et tous les hommes disponibles pour préserver notre État !"

MON_volunteers_in_war:0 "Volontaires dans la guerre civile"

