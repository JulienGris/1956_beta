#Conseiller – Peljidiin Genden
MON_peljidiin_genden_desc:0 "Né dans une famille de pauvres éleveurs au tournant du siècle, Genden rejoignit rapidement le Parti révolutionnaire du peuple mongol et sut gagner le soutien de nombreux anciens dirigeants grâce à sa rhétorique simple et ouverte. Lors de la révolution populaire de 1924, ce jeune prolétaire fut nommé président du Baga Khoural, ce qui lui ouvrit la voie vers les plus hautes sphères du pouvoir. \n\nLe soutien des responsables soviétiques lui permit de devenir l’un des trois secrétaires d’État après le septième congrès du Parti de 1928. Le conseil mit alors en place une collectivisation brutale et des politiques anti-bouddhistes, provoquant des rébellions ouvertes dans le pays. Sa survie à la contre-purge fut liée à sa grande loyauté à la cause et à la supervision directe de Joseph Staline en 1932. \n\nCependant, cette relation ne dura pas longtemps : l’attitude religieuse et les manières jugées grossières de Genden le firent apparaître comme un « allié peu fiable » aux yeux de divers responsables soviétiques à l’aube de 1935..."

