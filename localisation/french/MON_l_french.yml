MON_1935_state_visit_to_moscow_category:0 "Visite d’État à Moscou en 1935"
MON_1935_state_visit_to_moscow_category_desc:0 "L’activité croissante des impérialistes [JAP.GetAdjective] et de leurs marionnettes militaristes a alerté l’élite gouvernementale dirigée par Peljidiin Genden. Accompagné du ministre de la Guerre, Gelegdorjiin Demid, il se rendit en décembre 1935 à Moscou pour discuter de la possibilité d’obtenir une aide militaire et industrielle [SOV.getAdjective], en raison des tensions persistantes sur la frontière orientale de notre vaste nation. \nLes discussions devraient avoir lieu bientôt, et une question se pose : quels sujets devons-nous y aborder ?"

