#Armée#
MON_organize_army_inspection:0 "Organiser une inspection de l’armée"
MON_organize_army_inspection_desc:0 "Malgré un budget de défense immense, notre armée reste dans un état extrêmement médiocre en raison du manque d’équipement moderne, de la dépendance à des tactiques obsolètes et d’une forte politisation du personnel militaire. Si nous voulons entrer dans l’ère moderne, nous devons commencer à l’améliorer par tous les moyens nécessaires."

MON_mobilize_the_reserves:0 "Mobiliser les réserves"
MON_mobilize_the_reserves_desc:0 "Les précédents ordres de mobilisation ont montré leur inefficacité, seulement 2000 hommes s’étant présentés au lieu des 20000 prévus. Nous avons quelques réservistes capables de se battre, mais un tel enrôlement serait extrêmement impopulaire en temps de paix."

MON_field_hospital_initiative:0 "Initiative d’hôpitaux de campagne"
MON_field_hospital_initiative_desc:0 "Le coût de la guerre pèse lourdement sur les épaules des parents des soldats : non seulement ceux qui ne sont pas revenus, mais aussi ceux qui furent blessés sans recevoir l’aide appropriée. Nous instaurerons des hôpitaux de campagne capables de préserver la vie des soldats pour le lendemain et la prochaine bataille."

MON_desperate_measures:0 "Mesures désespérées"
MON_desperate_measures_desc:0 "Des temps désespérés appellent des mesures désespérées. Nous avons besoin de chaque recrue possible pour la victoire de la Patrie ! Une vaste campagne de recrutement sera financée pour combler les rangs manquants de nos forces armées."

MON_demids_legacy:0 "L’héritage de Demid"
MON_demids_legacy_desc:0 "Gelegdorjiin Demid a longtemps défendu la motorisation et la mécanisation des forces armées, affirmant que la cavalerie avait dépassé son utilité comme force de première ligne et convenait désormais surtout à des fins logistiques dans certains terrains difficiles. Nous suivrons ses pas et achèverons la réforme entamée."

MON_improve_coordination_capabilities:0 "Améliorer les capacités de coordination"
MON_improve_coordination_capabilities_desc:0 "La communication entre divers régiments de combat devient de plus en plus importante sur de grands champs de bataille où les commandants ne peuvent coordonner leurs activités ni visuellement ni par messagers. La radio doit être introduite à grande échelle pour que cette modernisation réussisse."

MON_lessons_from_1934_rebellion:0 "Leçons de la rébellion de 1934"
MON_lessons_from_1934_rebellion_desc:0 "L’affaire Lkhumbe et les soulèvements paysans de la même année ont montré que les milices civiles et les régiments de bandits résistaient mal face aux véhicules blindés, notamment aux voitures et camions anti-infanterie rapides. De tels véhicules peuvent aussi être utilisés à des fins de reconnaissance."

MON_foundation_for_special_task_battalion:0 "Création d’un bataillon de missions spéciales"
MON_foundation_for_special_task_battalion_desc:0 "Avec un effectif limité, nous ne pouvons nous permettre d’équiper et de maintenir une grande armée. Pourtant, nos intérêts intérieurs et extérieurs exigent d’être défendus. Le corps des officiers a déjà élaboré des plans pour former un régiment d’élite [ROOT.getAdjective] de missions spéciales, qui n’attend plus que l’approbation politique."

MON_mountainous_specialization:0 "Spécialisation montagneuse"
MON_mountainous_specialization_desc:0 "Avec des montagnes s’étendant du nord-ouest au sud-est et de nombreuses chaînes au nord du pays, il est naturel que nos forces spéciales établissent des camps et terrains d’entraînement en zones rocheuses, affirmant la spécialisation élite de notre pays dans les terrains montagneux."

MON_gobi_training_facilities:0 "Installations d’entraînement dans le Gobi"
MON_gobi_training_facilities_desc:0 "Toute notre frontière sud est recouverte des dunes du désert de Gobi. Ces environnements hostiles sont des lieux parfaits pour des entraînements en conditions extrêmes, qui seront organisés prochainement. Il est également essentiel de former des commandants capables d’opérer dans de telles conditions."

MON_equipment_recovery_teams:0 "Équipes de récupération d’équipement"
MON_equipment_recovery_teams_desc:0 "Nos forces spéciales rapportent que de nombreux équipements sont endommagés ou perdus lors des entraînements en raison des conditions environnementales des camps. Si nous ne pouvons changer le climat, nous pouvons former des équipes spécialisées dans la récupération du matériel endommagé, réduisant ainsi les pertes potentielles."

MON_expand_the_general_staff:0 "Élargir l’état-major"
MON_expand_the_general_staff_desc:0 "Notre état-major compte des membres compétents et expérimentés, mais il manque de financements et d’une organisation à grande échelle comme dans les grands pays. Pour l’instant, nous envisagerons d’élargir notre état-major afin de répondre aux normes modernes. Cette initiative séduira aussi les jeunes diplômés des écoles militaires."

MON_ratify_battleplans:0 "Ratifier les plans de bataille défensifs"
MON_ratify_battleplans_desc:0 "Pour que l’État soit prêt aux campagnes militaires en cours, nous devons créer un département dédié à la conception, l’organisation et l’exécution de plans de bataille. Alors que la guerre gagne les pays voisins, nous pouvons envoyer des observateurs avancés pour prévoir les manœuvres ennemies."

MON_old_heritage:0 "Vieil héritage"
MON_old_heritage_desc:0 "La cavalerie était, est et restera l’élément clé de nos forces armées. Peu importe l’évolution des doctrines militaires et les stratèges visionnaires, nous préserverons nos racines et resterons les maîtres du cheval."

MON_soldier_devotion:0 "Dévouement des soldats"
MON_soldier_devotion_desc:0 "Le monde change. Les armées de terre se composent désormais surtout d’infanterie, moins mobile que la cavalerie mais bien plus fiable et solide sur le plan organisationnel. Soutenir cette approche nous donnera un avantage sur le champ de bataille."

MON_legacy_of_tachanka:0 "Héritage de la tachanka"
MON_legacy_of_tachanka_desc:0 "L’ingéniosité humaine durant la guerre civile russe ne connut pas de limites pour inventer de nouvelles techniques : la charrette tirée par des chevaux, armée d’une mitrailleuse, capable de parcourir de longues distances avec une puissance de feu immense, est une base sur laquelle nos armées doivent s’appuyer !"

MON_support_old_officers_corps:0 "Soutenir l’ancien corps des officiers"
MON_support_old_officers_corps_desc:0 "Beaucoup de nos officiers sont des commandants expérimentés ayant combattu pour l’indépendance nationale, et restent populaires parmi la population. Les soutenir et leur assurer une place solide dans notre armée nous apportera des généraux compétents et des soldats loyaux. Certains sont encore vieux et conservateurs, mais est-ce vraiment un problème ?"

MON_favour_young_officers:0 "Favoriser les jeunes officiers"
MON_favour_young_officers_desc:0 "Le monde change, tout comme les tactiques militaires. Une nouvelle génération de commandants revient actuellement au pays après avoir étudié dans des académies militaires étrangères. Peut-être ont-ils quelque chose de nouveau à apporter ?"

MON_revive_forgotten_doctrines:0 "Raviver les doctrines oubliées"
MON_revive_forgotten_doctrines_desc:0 "Au début du XXe siècle, notre pays se battit courageusement pour son indépendance contre les puissances impérialistes dans ce qu’on ne peut décrire autrement que comme une guérilla. Les milices et petites escouades protégeaient nos foyers et nos cœurs. Leur héritage doit être poursuivi par l’adaptation de cette guerre redoutablement efficace."

MON_bolster_national_awareness:0 "Renforcer la conscience nationale"
MON_bolster_national_awareness_desc:0 "Peu importe la guerre, nous la menons pour la gloire et la prospérité de notre nation. Chaque citoyen doit être prêt à faire un petit sacrifice pour atteindre cet objectif, renforçant ainsi notre effort de guerre !"

MON_expand_universal_military_act:0 "Élargir la loi sur le service militaire universel"
MON_expand_universal_military_act_desc:0 "La loi sur le service militaire universel impose des restrictions strictes sur l’âge et le sexe des recrues. Assouplir certains critères et exigences dans nos documents administratifs permettra de recruter une plus grande partie de la population sans entraver sévèrement l’administration de l’État."

MON_improve_militia_formations:0 "Améliorer les formations de milice"
MON_improve_militia_formations_desc:0 "Les milices locales peuvent combattre plus efficacement si elles sont placées sous le commandement de chefs locaux connaissant les capacités de leurs hommes et femmes."

MON_ideological_loyalty_of_the_masses:0 "Loyauté idéologique des masses"
MON_ideological_loyalty_of_the_masses_desc:0 "Le peuple doit savoir pourquoi il se bat et ce qui est en jeu. Un peu de propagande diffusée dans chaque recoin du pays ne ferait de mal à personne."

MON_good_old_new_ways:0 "De bonnes vieilles nouvelles méthodes"
MON_good_old_new_ways_desc:0 "La centralisation du commandement, de l’administration et des stratégies de notre armée autour d’une utilisation intensive des milices nous a offert une expérience précieuse qui peut être transposée et adoptée par les formations de l’armée régulière."

MON_rely_on_soviet_tactics:0 "S’appuyer sur les tactiques [SOV.getAdjective]"
MON_rely_on_soviet_tactics_desc:0 "Les conseillers [SOV.getAdjective] préconisent l’adoption de la doctrine de la « bataille en profondeur », axée sur la suppression et la désorganisation de l’ennemi sur plusieurs zones du champ de bataille, suivies de succès tactiques permettant d’encercler et de détruire ses formations. Très efficace si un grand nombre de troupes est appliqué."

MON_weapon_prototype_development:0 "Développement de prototypes d’armes"
MON_weapon_prototype_development_desc:0 "Les affrontements frontaliers constants nous ont appris une leçon : l’inefficacité flagrante des fusils à un coup que possèdent nos troupes en masse. Nous devrions solliciter nos alliés pour obtenir des plans d’armes modernes."

MON_mass_firearm_production:0 "Production massive d’armes à feu"
MON_mass_firearm_production_desc:0 "Avoir une grande force sans armes à feu rend toute défense ou attaque inutile, peu importe la morale ou l’endoctrinement. Puisque nous sommes l’État, nous devons fournir, sinon pour le peuple, au moins pour les soldats."

MON_focus_on_infantry:0 "Mettre l’accent sur l’infanterie"
MON_focus_on_infantry_desc:0 "L’infanterie a toujours été et restera l’élément clé de toute armée terrestre, quelle que soit la doctrine, le régime politique ou l’idéologie. Nous renforcerons cette base par tous les moyens nécessaires."

MON_the_inevitable_counterblow:0 "Le contre-coup inévitable"
MON_the_inevitable_counterblow_desc:0 "Aussi bonne que soit une offensive, elle sera toujours suivie d’une contre-attaque ennemie, à moins que ses forces ne soient totalement détruites dès la première vague. Cette leçon, apprise au prix fort, est vitale pour chaque soldat."

MON_suitable_high_command:0 "Haut commandement adapté"
MON_suitable_high_command_desc:0 "Un soldat est un instrument pour transmettre les ordres du haut commandement. Si ce dernier est inexpérimenté ou incapable, il doit être soit remplacé, soit formé. Le choix nous appartient…"

MON_the_grand_stratagem:0 "Le grand stratagème"
MON_the_grand_stratagem_desc:0 "« La victoire aime la préparation », disait un sage. Pour une victoire décisive et finale, nous devons donc disposer d’un stratagème capable de surpasser les meilleurs planificateurs et stratèges du monde !"

MON_favour_stronghold_defenses:0 "Privilégier les défenses de forteresse"
MON_favour_stronghold_defenses_desc:0 "Chaque bataillon devra devenir une forteresse capable de tenir longtemps jusqu’à l’ordre de contre-attaquer. Alors, la forteresse se déplacera à travers le champ de bataille…"

MON_advanced_fortification_studies:0 "Études avancées en fortification"
MON_advanced_fortification_studies_desc:0 "Nos ingénieurs peuvent recevoir une formation supplémentaire pour réparer d’anciennes et construire de nouvelles fortifications plus rapidement. Ce savoir sera précieux pour préparer des points d’appui."

MON_support_tactical_decision_freedom:0 "Soutenir la liberté de décision tactique"
MON_support_tactical_decision_freedom_desc:0 "La position ennemie et ses contre-attaques rapides impliquent que certains ordres du quartier général pourraient être interceptés. Donner une liberté limitée aux commandants locaux améliorera les performances globales de nos troupes."

MON_optimize_infantry_formations:0 "Optimiser les formations d’infanterie"
MON_optimize_infantry_formations_desc:0 "Le potentiel maximum de nos forces terrestres peut être atteint si les commandants locaux reçoivent des directives claires sur la formation et l’utilisation des troupes de la part de l’état-major."

MON_unified_operational_command:0 "Commandement opérationnel unifié"
MON_unified_operational_command_desc:0 "Des rapports récents indiquent que le haut commandement a émis des ordres contradictoires à différentes branches, nuisant à l’efficacité des soldats. L’unification et la solidification des ordres élimineront ce problème."

MON_adopt_tsogs_methods:0 "Adopter les méthodes de Tsog"
MON_adopt_tsogs_methods_desc:0 "Butochiyn Tsog, diplômé de l’école d’artillerie de Soumy, a apporté un souffle nouveau aux tactiques classiques de notre état-major, nous permettant de mieux exploiter le potentiel de l’artillerie."

MON_investigate_improvement_opportunities:0 "Étudier les opportunités d’amélioration de l’artillerie"
MON_investigate_improvement_opportunities_desc:0 "Beaucoup de nos pièces d’artillerie datent encore de la révolution Xinhai et de l’indépendance de 1911. De nouveaux modèles de nos alliés pourraient être appliqués dans nos installations."

MON_feature_compact_mortar_designs:0 "Adopter des mortiers compacts"
MON_feature_compact_mortar_designs_desc:0 "Les mortiers sont l’élément clé de notre puissance de feu. Ils doivent être disponibles pour tous ceux qui en ont besoin. Cela nécessitera des modifications d’équipement industriel irréversibles…"

MON_strengthen_air_land_links:0 "Renforcer les liens air-terre"
MON_strengthen_air_land_links_desc:0 "Nos artilleurs ont besoin de coordonnées, obtenues soit par reconnaissance aérienne soit terrestre. Les premiers sont rapides, les seconds plus discrets. Nous renforcerons leur coopération !"

MON_combined_arms_operations:0 "Opérations interarmes"
MON_combined_arms_operations_desc:0 "Ce n’est que par une frappe combinée air, mer et terre que l’on peut infliger des dégâts maximums à l’ennemi. Tandis que nos aigles planeront, nos tigres frapperont à courte portée, semant la terreur dans leurs rangs !"

MON_the_ultimate_weapon:0 "L’arme ultime"
MON_the_ultimate_weapon_desc:0 "Les armes de destruction massive impressionnent, mais une bonne pièce d’artillerie dans les mains d’un soldat bien entraîné peut faire le travail plus vite et à moindre coût. Renforçons ce fondement en valorisant ce type d’armement !"

MON_experimental_mobility:0 "Mobilité expérimentale"
MON_experimental_mobility_desc:0 "Une doctrine émergente à l’Ouest met en avant l’usage de véhicules à haute mobilité pour déplacer rapidement des troupes et frapper en territoire ennemi. Difficile à appliquer à grande échelle, mais le potentiel pour une force limitée est grand !"

MON_study_motorized_equipment:0 "Étudier l’équipement motorisé"
MON_study_motorized_equipment_desc:0 "En coopération avec l’URSS, une société mixte Mongoltrans fut créée pour développer les routes et fournir des véhicules civils et militaires. Nous pouvons saisir certains véhicules pour un usage militaire."

MON_specialization_on_vehicle_production:0 "Spécialisation dans la production de véhicules"
MON_specialization_on_vehicle_production_desc:0 "Nous pouvons diversifier notre industrie et appliquer des techniques modernes pour améliorer nos installations de production de véhicules civils et militaires."

MON_acquire_foreign_tank_designs:0 "Acquérir des modèles étrangers de chars"
MON_acquire_foreign_tank_designs_desc:0 "La coopération étrangère nous a déjà apporté des armes, pièces d’artillerie et outils industriels modernes. Cette base peut être renforcée pour obtenir de nouveaux modèles de chars d’origine [ROOT.getAdjective]."

MON_utilize_new_designs_strength:0 "Exploiter la force des nouveaux modèles"
MON_utilize_new_designs_strength_desc:0 "Avec une industrie limitée, nous ne pouvons produire en masse tous les types de blindés. Mais nous pouvons spécialiser nos usines pour fabriquer des modèles spécifiques, au prix de pénalités dans d’autres domaines."

MON_train_specialized_crews:0 "Former des équipages spécialisés"
MON_train_specialized_crews_desc:0 "Un bon équipage de char ne peut être choisi parmi des soldats aléatoires qui risqueraient de détruire la machine précieuse et leurs vies. Nous avons besoin des bonnes personnes aux bons postes, avec une vraie expertise."

#Marine
MON_establish_the_trade_fleet:0 "Établir la flotte marchande"
MON_establish_the_trade_fleet_desc:0 "En tant que pays enclavé depuis des siècles, nous avons oublié les principes du commerce naval international. Avec quelques investissements, nous pourrions acheter des navires civils usagés pour le commerce et le ravitaillement. Cela suffira pour commencer."

MON_lease_foreign_dockyards:0 "Louer des chantiers navals étrangers"
MON_lease_foreign_dockyards_desc:0 "Notre industrie ne peut construire de chantiers navals. Mais nous pouvons coopérer avec des puissances étrangères et utiliser leurs installations."

MON_joint_naval_academy:0 "Académie navale conjointe"
MON_joint_naval_academy_desc:0 "L’étape logique suivante est de fonder une académie navale où nos recrues apprendront auprès de marins étrangers expérimentés."

MON_naval_integration:0 "Intégration navale"
MON_naval_integration_desc:0 "Nous avons soumis une puissance navale étrangère en tant qu’État fantoche obéissant à Oulan-Bator. Leur marine pourrait être utilisée par nos forces, en échange d’une plus grande autonomie dans d’autres domaines."

MON_ensure_branches_independence:0 "Assurer l’indépendance des branches"
MON_ensure_branches_independence_desc:0 "Nous ne pouvons confier l’établissement d’une industrie navale à des étrangers avides d’exploiter nos marins inexpérimentés. Une branche indépendante avec investissements gouvernementaux est nécessaire."

MON_local_specialists:0 "Spécialistes locaux"
MON_local_specialists_desc:0 "Nous avons beaucoup à apprendre de l’étranger, mais certains jeunes amiraux locaux sont prêts à partager leur savoir avec nos marins."

MON_fund_mongolian_naval_forces:0 "Financer les forces navales [ROOT.getAdjective]"
MON_fund_mongolian_naval_forces_desc:0 "Un pays enclavé souffre d’un manque total d’expérience maritime. Des fonds doivent être alloués pour corriger cette situation."

MON_maritime_infantry:0 "Infanterie maritime [MON.getAdjective]"
MON_maritime_infantry_desc:0 "Quelques hommes et femmes dévoués peuvent faire la différence lors de franchissements de rivières ou de débarquements. Un camp d’entraînement secret pourrait être établi au lac Uvs."

MON_improve_naval_doctrines:0 "Améliorer les doctrines navales"
MON_improve_naval_doctrines_desc:0 "Les tactiques navales évoluent sans cesse. Nous ne devons pas ignorer les nouveautés, car elles pourraient être vitales."

MON_amphibious_effort:0 "Effort amphibie"
MON_amphibious_effort_desc:0 "L’échec des invasions de 1274 et 1281 hante encore nos citoyens. Les techniques modernes ne dépendent plus de la météo : investissons-y."

MON_prioritize_small_vessels:0 "Prioriser les petits navires"
MON_prioritize_small_vessels_desc:0 "Construire une grande flotte est séduisant, mais irréaliste. Concentrons-nous d’abord sur les petites unités."

MON_support_the_mechants:0 "Soutenir les marchands"
MON_support_the_mechants_desc:0 "Nos marchands ont besoin de protection contre les sous-marins ennemis. Nous pouvons améliorer nos navires existants pour les protéger."

MON_modernize_escort_tactics:0 "Moderniser les tactiques d’escorte"
MON_modernize_escort_tactics_desc:0 "En finalisant la doctrine de défense des convois, nous améliorerons la sécurité de nos routes maritimes et assurerons le flux des ressources."

MON_sea_raiders:0 "Raiders des mers"
MON_sea_raiders_desc:0 "Nous n’avons pas besoin de ressources, mais nos ennemis oui. Leurs navires naviguent en toute confiance. Nos raiders leur apprendront l’humilité."

MON_emphasise_naval_blockades:0 "Mettre l’accent sur les blocus"
MON_emphasise_naval_blockades_desc:0 "L’ennemi croit que ses destroyers protégeront ses convois. Mais de nouveaux torpilles peuvent renverser la bataille."

MON_large_ships_effort:0 "Effort pour les grands navires"
MON_large_ships_effort_desc:0 "Au XIIIe siècle, notre marine était l’une des plus grandes du monde. Il est temps de rappeler cette gloire et d’investir dans de grandes flottilles capables d’impressionner les puissances navales."

#Air
MON_establish_provisional_airforce:0 "Établir une armée de l’air provisoire"
MON_establish_provisional_airforce_desc:0 "Le pays manque de personnel apte à assurer des missions aériennes. Il est nécessaire de jeter les bases d’une armée de l’air mongole officielle, vu le rôle croissant de l’aviation dans le transport et la reconnaissance."

MON_situational_aerial_presence:0 "Présence aérienne situationnelle"
MON_situational_aerial_presence_desc:0 "Il est impossible de maintenir une grande flotte aérienne couvrant tout notre territoire. La tactique privilégiée consiste à établir de petites bases aériennes réparties, où quelques escadrilles pourront sécuriser le ciel."

MON_focus_on_local_engagements:0 "Se concentrer sur les engagements locaux"
MON_focus_on_local_engagements_desc:0 "Les bases aériennes ont une capacité limitée et conviennent surtout aux avions légers. Nos efforts de développement devront donc se concentrer sur ces modèles."
MON_institute_air_landing_batallions:0 "Créer des bataillons aéroportés"
MON_institute_air_landing_batallions_desc:0 "Les forces spéciales nouvellement établies bénéficieraient grandement de la création d’un régiment de parachutistes d’élite, capable de mener des invasions aéroportées dans des conditions extrêmes et hostiles."

MON_foreign_air_equipment_coordination:0 "Coordination de l’équipement aérien étranger"
MON_foreign_air_equipment_coordination_desc:0 "Nos équipes de recherche nationales ont beaucoup à gagner de leurs collègues étrangers, en particulier dans le domaine de l’aviation où nous manquons cruellement d’expérience pratique. Prolonger certains traités de coopération nous apportera de nombreuses améliorations dans la conception d’avions."

MON_improve_air_doctrine:0 "Améliorer la doctrine aérienne"
MON_improve_air_doctrine_desc:0 "De bons avions et des pilotes expérimentés peuvent gagner bien des combats, mais à long terme le facteur décisif reste la doctrine aérienne moderne. Affiner et consolider ces stratagèmes donnera à nos as un avantage dans les cieux."

MON_air_recon_and_intelligence_protection:0 "Reconnaissance aérienne et protection du renseignement"
MON_air_recon_and_intelligence_protection_desc:0 "Une guerre moderne est une guerre de tromperie, où le renseignement joue un rôle clé. La reconnaissance aérienne prenant de plus en plus d’importance pour l’observation rapide et la collecte d’informations, nous devons en tirer avantage par tous les moyens possibles !"

MON_strengthen_air_navy_cooperation:0 "Renforcer la coopération air-marine"
MON_strengthen_air_navy_cooperation_desc:0 "Nous avons l’opportunité de coordonner notre aviation récemment développée avec l’embryon de notre marine, en concevant des avions capables de frapper efficacement les forces navales ennemies."

MON_capital_operations_focus:0 "Se concentrer sur les opérations capitales"
MON_capital_operations_focus_desc:0 "De petites escadrilles mobiles peuvent être trop dispersées pour combattre efficacement une aviation ennemie supérieure. Nous devons donc établir un poing aérien cohérent, capable de frapper massivement dans la zone souhaitée."

MON_wastness_devours:0 "L’immensité dévore"
MON_wastness_devours_desc:0 "Les vastes territoires de notre nation ne peuvent être protégés efficacement par de simples chasseurs légers dont l’autonomie est insuffisante. Les fabricants suggèrent que l’amélioration des avions à long rayon d’action résoudra ce problème et permettra à nos appareils de dominer le ciel sans opposition."

#Industrie#
MON_transfer_the_funds_of_mongolbank:0 "Transférer les fonds de la Mongolbank"
MON_transfer_the_funds_of_mongolbank_desc:0 "Fondée en 1924 comme société anonyme entre investisseurs [SOV.getAdjective] et [MON.getAdjective], la Mongolbank resta une coopérative 50-50 visant à développer l’économie nationale, superviser le secteur bancaire et gérer les réserves d’or du pays. Nous devons prendre le contrôle de ses fonds pour poursuivre le développement de la Mongolie proprement dite."

MON_build_the_railroads:0 "Construire les chemins de fer"
MON_build_the_railroads_desc:0 "Le développement du transport ferroviaire a ouvert de nouvelles possibilités pour acheminer rapidement et efficacement de grandes quantités de marchandises. Une partie des nouveaux fonds gouvernementaux peut être consacrée à établir un réseau reliant notre capitale aux régions périphériques."

MON_expand_elementary_schools:0 "Élargir les écoles primaires"
MON_expand_elementary_schools_desc:0 "Le taux d’analphabétisme élevé découle d’un manque d’écoles primaires financées par l’État, où les hommes et femmes ordinaires apprennent à lire, écrire et compter — des capacités dont beaucoup de nos citoyens manquent malheureusement."

MON_strengthen_tugrik:0 "Renforcer le tugrik"
MON_strengthen_tugrik_desc:0 "Les réserves d’or du pays reposent encore sur diverses monnaies utilisées dans les opérations financières : rouble russe, dollar d’argent mongol, yuan chinois, yen japonais, dollars américains… Le tugrik étant lié au rouble à parité, nous imposerons des restrictions sur l’usage des autres devises afin de renforcer le rôle de notre monnaie nationale."

MON_encourage_foreign_trade:0 "Encourager le commerce extérieur"
MON_encourage_foreign_trade_desc:0 "La faible croissance économique remonte à 1924, quand l’État a nationalisé les actifs des investisseurs et restreint le commerce étranger. Cela a freiné le développement des affaires internationales au nom de la sécurité nationale. Nous devons rouvrir nos marchés pour inciter certains investisseurs à revenir."

MON_improve_machine_tools:0 "Améliorer les machines-outils"
MON_improve_machine_tools_desc:0 "Nos installations nationales ne respectent pas les quotas, principalement à cause de leur faible efficacité, de leur dépendance au travail manuel et du manque de main-d’œuvre. Si ce dernier problème ne peut être résolu immédiatement, les deux premiers peuvent l’être en achetant l’équipement nécessaire à l’étranger."

MON_study_foreign_radio_equipment:0 "Étudier l’équipement radio étranger"
MON_study_foreign_radio_equipment_desc:0 "Nous ne disposons d’aucune installation capable de produire du matériel radio et électronique moderne. Il est sage d’apprendre de nos voisins et d’étudier comment améliorer la situation."

MON_pastures_into_farms:0 "Transformer les pâturages en fermes"
MON_pastures_into_farms_desc:0 "L’agriculture nous a bien servis jusqu’ici, nul besoin de développer des techniques industrielles complexes qui nuiraient aux processus naturels. Nous pouvons cependant moderniser certaines terres en exploitations agricoles capables de produire davantage de biens pour la population."

MON_end_reliance_on_animal_husbandry:0 "Mettre fin à la dépendance à l’élevage"
MON_end_reliance_on_animal_husbandry_desc:0 "Obsolète et dépassé, notre système économique reposait trop sur l’élevage extensif. Bien qu’une telle décision soit impopulaire, nous devons établir une véritable base industrielle pour notre pays."

MON_support_arats:0 "Soutenir les Arats"
MON_support_arats_desc:0 "Ce groupe social prometteur de pasteurs est présent partout et fournit divers produits agricoles. Ils constituent un pilier de notre société industrielle et doivent recevoir quelques privilèges pour souligner leur importance."

MON_expand_woolwashing_facilities:0 "Élargir les installations de lavage de laine"
MON_expand_woolwashing_facilities_desc:0 "La laine étant une ressource essentielle fournie par les arats, il est primordial que les installations capables de la traiter soient correctement financées et agrandies."

MON_build_energokombinat:0 "Construire un Energokombinat"
MON_build_energokombinat_desc:0 "Avec l’électricité atteignant de plus en plus de villes, la question d’un approvisionnement stable se pose. Un secteur aussi vital ne peut rester aux mains des étrangers : il doit être construit et entretenu par notre population."

MON_build_mechanical_factory:0 "Construire une usine mécanique"
MON_build_mechanical_factory_desc:0 "Les nouveaux outils agricoles nécessitent des pièces de rechange coûteuses et difficiles à obtenir. Une initiative citoyenne a levé des fonds pour établir une usine proche d’Oulan-Bator."

MON_industrial_expansion:0 "Expansion industrielle"
MON_industrial_expansion_desc:0 "Grâce au développement de nos industries, nous pouvons encourager les citoyens à rejoindre des initiatives ouvrières visant à améliorer la qualité et l’efficacité de la production."

MON_new_veterinary_facilities:0 "Nouvelles installations vétérinaires"
MON_new_veterinary_facilities_desc:0 "Les maladies peuvent frapper le bétail des fermiers. Les risques peuvent être réduits en construisant des installations vétérinaires et en menant des inspections régulières financées par l’État."

MON_ulan_bator_promcombinat:0 "Combinat industriel d’Oulan-Bator"
MON_ulan_bator_promcombinat_desc:0 "Ériger Oulan-Bator comme centre industriel est une étape vitale : la ville deviendra la plus grande installation de production civile, offrant du travail à des milliers de citoyens."

MON_improve_mining_facilities:0 "Améliorer les installations minières"
MON_improve_mining_facilities_desc:0 "Les mines de charbon d’Aduunchuluun et de Khushuut figurent parmi les plus grandes du pays, fournissant fer et charbon à nos usines. Des fonds gouvernementaux doivent leur être alloués pour améliorer leur production."

MON_armament_expansion:0 "Expansion de l’armement"
MON_armament_expansion_desc:0 "Notre développement industriel s’est surtout concentré sur les biens civils, au détriment du militaire, ce qui est inacceptable. Pour la stabilité de la nation, nous devons construire des usines d’armement."

MON_southern_development_focus:0 "Accent sur le développement du Sud"
MON_southern_development_focus_desc:0 "Le désert de Gobi est connu pour son climat rude. Les habitants doivent avoir accès à l’eau, au gaz et à l’électricité. Un nouveau programme gouvernemental y pourvoira."

MON_southwest_resource_prospection_area:0 "Zone de prospection du Sud-Ouest"
MON_southwest_resource_prospection_area_desc:0 "Le Sud-Ouest, riche en ressources, doit faire l’objet de plans de prospection minière et matérielle."

MON_encourage_southern_agriculture:0 "Encourager l’agriculture du Sud"
MON_encourage_southern_agriculture_desc:0 "Les anciens territoires de la clique Ma étaient considérés comme sans potentiel. Forts de notre expérience dans la lutte contre l’avancée du désert, nous pourrons créer des zones de plantations et développer de nouvelles terres agricoles."

MON_expand_chahars_processing_region:0 "Développer la région de transformation du Chahar"
MON_expand_chahars_processing_region_desc:0 "Les régions de Mongolie-Intérieure conviennent à l’élevage. Des installations de lavage de laine et des abattoirs doivent y être établis pour offrir des emplois."

MON_ordos_plateau_exploitation:0 "Exploiter le plateau d’Ordos"
MON_ordos_plateau_exploitation_desc:0 "Cette région recevra des subventions gouvernementales permettant aux fabricants locaux d’agrandir leurs installations et de développer l’économie régionale."

MON_utilize_available_spaces:0 "Utiliser les espaces disponibles"
MON_utilize_available_spaces_desc:0 "Les nouveaux programmes d’industrialisation ont libéré des espaces pour de nouvelles installations, renforçant ainsi la puissance économique de notre État prospère."

MON_new_research_centres:0 "Créer de nouveaux centres de recherche"
MON_new_research_centres_desc:0 "Nos capacités industrielles croissantes offrent une occasion unique de bâtir un réseau scientifique incluant recherche, développement, outils, matériaux, électronique, jeunes chercheurs et industrie militaire."

MON_modernize_transportation_system:0 "Moderniser le système de transport"
MON_modernize_transportation_system_desc:0 "Pour les nomades, les routes n’étaient pas essentielles, et les anciens gouvernements ne les développaient pas. Mais avec l’expansion de l’État, un réseau centralisé est vital."

MON_assist_subsidized_region:0 "Aider les régions subventionnées"
MON_assist_subsidized_region_desc:0 "La région autonome de Touva est lourdement subventionnée et manque d’industrialisation et de terres agricoles. Même un petit investissement y ouvrirait des opportunités."

MON_develop_mongolia_proper:0 "Développer la Mongolie proprement dite"
MON_develop_mongolia_proper_desc:0 "Aucune région ne doit être oubliée. La Mongolie intérieure, cœur de l’État, bénéficiera aussi de programmes industriels qui renforceront le soutien local."

MON_improve_baigaal_dalai_industries:0 "Améliorer les industries de Baïgal Dalai"
MON_improve_baigaal_dalai_industries_desc:0 "La Bouriatie, avec ses industries d’Irkoutsk, Tchita et Oulan-Oude, ses routes et son exploitation forestière, peut encore être améliorée par des dons ciblés de l’État."

MON_develop_the_rear:0 "Développer l’arrière"
MON_develop_the_rear_desc:0 "De nombreuses provinces de l’Est manquent de fonds malgré un potentiel économique élevé. Renforcer notre présence y permettra d’exploiter ces ressources."

MON_military_industries_expansion:0 "Expansion des industries militaires"
MON_military_industries_expansion_desc:0 "L’État peut investir dans le secteur militaire en finançant la création d’installations, ce qui renforcera fortement nos forces armées."
############################POLITICAL FOCUSES #################################################
MON_hold_plenum_of_central_committee:0 "Tenir le Plénum du Comité central"
MON_hold_plenum_of_central_committee_desc:0 "Les résultats de la conférence montrent clairement que le camarade [SOV.getLeader] est prêt à protéger l’État [MON.getAdjective] en temps de péril et à lutter pour les moyens de la révolution. Cependant, le chef de notre délégation avait en tête certaines ambitions personnelles et doit donc être remplacé par quelqu’un ayant une vision plus « fiable » de l’avenir."

MON_deal_with_genden:0 "Régler le cas de Genden"
MON_deal_with_genden_desc:0 "Genden conserve encore un soutien considérable, surtout parmi les pauvres et les populations rurales. Son insubordination envers nos camarades [SOV.getAdjective] ne peut être ignorée. Mais la question demeure : comment punir son comportement provocateur ?"

MON_invite_frinovsky:0 "Inviter Frinovsky"
MON_invite_frinovsky_desc:0 "Mikhaïl Frinovsky est un officier bien connu du NKVD [SOV.getAdjective], dont les méthodes de l’« organisation Troïka » se sont révélées extrêmement efficaces pour démasquer les ennemis de la révolution en URSS et à l’étranger. Son aide à notre Révolution serait d’une grande importance pour le succès du régime actuel."

MON_secure_the_transition_of_power:0 "Assurer la Transition du Pouvoir"
MON_secure_the_transition_of_power_desc:0 "Le nouveau gouvernement a besoin des membres éminents du parti qui ont démontré leur véritable dévouement au parti et à [MON.getNameDef] ! Ces héros de la Révolution doivent être mis en avant comme exemples dans une nouvelle campagne de propagande organisée par l’État !"

MON_prepare_leftist_takeover:0 "Préparer la Prise de Pouvoir des Gauches"
MON_prepare_leftist_takeover_desc:0 "Genden et Demid ont déjà disparu, tout comme leurs homologues de gauche qui dirigeaient le pays en 1933, ou encore les membres de l’opposition de droite expulsés en 1928. Une autre purge se profile à l’horizon, et nous devons tout faire pour empêcher un nouveau dictateur de s’élever !"

MON_learn_from_lkhumbe_affair:0 "Tirer les Leçons de l’Affaire Lkhumbe"
MON_learn_from_lkhumbe_affair_desc:0 "L’échec du soulèvement de 1934, connu sous le nom d’« Affaire Lkhumbe », s’explique surtout par l’accès limité des rebelles aux armes et aux munitions, alors que les forces gouvernementales disposaient de fusils, mortiers, véhicules blindés et même de quelques avions. La création d’ateliers clandestins profiterait grandement à l’opposition en cas de révolte armée."

MON_partial_religious_compromise:0 "Compromis Religieux Partiel"
MON_partial_religious_compromise_desc:0 "L’Église bouddhiste compte de nombreux partisans à travers le pays, et si le régime précédent les a ignorés quelque temps, nous devons chercher un compromis afin de renforcer le soutien populaire au changement de gouvernement. Pour l’instant, les monastères peuvent devenir un allié précieux."

MON_arm_civil_militia:0 "Armer les Milices Civiles"
MON_arm_civil_militia_desc:0 "L’immensité de notre territoire nécessite la formation de régiments indépendants capables de tenir le terrain jusqu’à l’arrivée de nos troupes régulières et de les aider à repousser l’envahisseur. En distribuant des armes à la population, nous pouvons obtenir le soutien d’hommes adultes prêts à mourir pour notre cause."

MON_invite_political_exiles:0 "Rappeler les Exilés Politiques"
MON_invite_political_exiles_desc:0 "En 1933, un brusque changement de politique d’État a conduit à l’exil de nombreux membres de gauche et à la répression d’un plus grand nombre encore. Nous avons réussi à contacter les survivants et leur proposons des postes dans notre gouvernement. Leur retour garantira que le nouveau pouvoir puisse gouverner efficacement une fois la prise de contrôle réussie."

MON_ensure_control_over_the_railways:0 "Assurer le Contrôle des Chemins de Fer"
MON_ensure_control_over_the_railways_desc:0 "En déguisant nos partisans en ouvriers et en les affectant à la construction du réseau ferroviaire du pays, nous pouvons prendre le contrôle des points logistiques stratégiques en vue d’une future guerre, ce qui nous permettra de saisir du matériel étranger au profit de la révolution."

MON_contact_the_bandits:0 "Contacter les Bandits"
MON_contact_the_bandits_desc:0 "Les régions méridionales peu peuplées abritent la menace du désert sous la forme de bandes de brigands irréguliers difficiles à détecter et à combattre avec de grandes formations. En faisant appel à leurs chefs, nous pouvons apprendre quelques leçons utiles et recevoir leur soutien limité en hommes et en expérience, au prix d’un mécontentement parmi notre population."

MON_confiscate_soviet_weaponry:0 "Confisquer l’Armement [SOV.getAdjective]"
MON_confiscate_soviet_weaponry_desc:0 "Avec les chemins de fer sous notre contrôle, nous pouvons établir des postes de contrôle supplémentaires et confisquer le matériel non enregistré qui y transite. Pour le bien du commerce libre et équitable, bien sûr !"

MON_seize_the_power:0 "Prendre le Pouvoir"
MON_seize_the_power_desc:0 "Avec nos troupes recrutées et armées, nos centres logistiques préparés et nos membres loyaux au gouvernement, nous proclamerons qu’une nouvelle Mongolie est sortie des cendres des révolutionnaires corrompus, et qu’une nouvelle ère commence dès aujourd’hui !"

MON_begin_the_collectivization:0 "Lancer la Collectivisation"
MON_begin_the_collectivization_desc:0 "Le nouveau gouvernement étant assuré, il est temps de reprendre les réformes de 1928-1933, qui avaient vu les exportations et importations croître et la capitale nationale se développer considérablement. Une collectivisation d’une ampleur sans précédent doit maintenant commencer."

MON_seize_our_advantages:0 "Saisir Nos Atouts"
MON_seize_our_advantages_desc:0 "Genden a tenté d’apaiser les propriétaires de capitaux avec sa politique du « Devenez riche », visant à enrichir les riches et à corrompre les pauvres. Pour nous, il ne saurait plus y avoir de différences : nous sommes créés égaux. Nous devons donc saisir ces biens et les redistribuer aux ouvriers et aux paysans."

MON_reassure_the_soviets:0 "Rassurer les [SOV.getAdjective]s"
MON_reassure_the_soviets_desc:0 "Notre agenda interne sera beaucoup plus efficace si nous recevons des directives directement de Moscou, permettant à nos politiciens, diplomates et espions de se concentrer sur l’extérieur. Il est naturel de demander aux responsables de [SOV.getNameDef] de nous réintégrer au Komintern en tant que république égale sous la direction [SOV.getAdjective]. Une telle action limitera certes nos initiatives politiques immédiates, mais elle sera bénéfique sur le long terme."

MON_end_political_opportunism:0 "Mettre Fin à l’Opportunisme Politique"
MON_end_political_opportunism_desc:0 "Trop longtemps, la Mongolie a été le laquais d’une puissance étrangère ! Nous sommes un peuple brave et fier, capable de se défendre seul et de poursuivre son propre destin dans ce monde. En tant que membre du Komintern, bien sûr."

MON_reorganize_state_agenda:0 "Réorganiser l’Agenda de l’État"
MON_reorganize_state_agenda_desc:0 "Comme les choses ont changé ! Ceux qui opprimaient et manipulaient l’homme et la femme ordinaires ont disparu ou ont été bannis de notre utopie communiste prospère. Pourtant, certains gardent encore en mémoire ces idées empoisonnées et subissent des influences extérieures. La propagande athée assurera la loyauté et la clarté d’esprit de notre peuple."

MON_make_use_of_monastery_assets:0 "Exploiter les Biens des Monastères"
MON_make_use_of_monastery_assets_desc:0 "Les monastères sont désormais vides ou en ruines après nos attaques contre l’Église bouddhiste. Ainsi, un décret spécial de [MON.getLeader] nationalise les biens restants des institutions religieuses, fournissant au gouvernement les fonds nécessaires pour alimenter la machine de paix comme celle de guerre."

MON_example_of_communist_paradise:0 "Exemple de Paradis Communiste"
MON_example_of_communist_paradise_desc:0 "Le paysage politique et économique de notre pays a changé à jamais depuis que [MON.getLeader] a pris le pouvoir. Fidèles aux principes du marxisme-léninisme, nous pouvons proclamer la fondation d’une nouvelle République soviétique en Asie centrale, afin que les regards envieux de nos voisins soient encore plus braqués sur nous !"

MON_thinking_out_of_bounds:0 "Penser Hors des Limites"
MON_thinking_out_of_bounds_desc:0 "Bien que la politique intérieure et extérieure de l’État soit dictée depuis Moscou, nous restons au pouvoir d’individus ambitieux et créatifs qui détiennent de l’influence et des contacts dans toute la Plaine centrale de Chine. Un usage judicieux de notre agenda permettra à notre État satellite soviétique de s’assurer que la Chine reste dévouée à la Révolution du Peuple, sans nécessiter une intervention directe [SOV.getAdjective]."

MON_means_of_propaganda:0 "Moyens de Propagande"
MON_means_of_propaganda_desc:0 "L’agenda de l’État peut se diffuser de multiples façons, et l’une d’elles est l’usage massif de la propagande, qui serait encore plus efficace si nous construisions des institutions capables de former et d’entraîner activement du personnel à cet effet."

MON_destabilize_the_central_plain:0 "Déstabiliser la Plaine Centrale"
MON_destabilize_the_central_plain_desc:0 "Les régions centrales de Chine ont connu des soulèvements paysans depuis des décennies, que ce soit contre les valets impérialistes, les fonctionnaires corrompus du Kuomintang ou les administrations oppressives des seigneurs de guerre locaux. Mais tous ont échoué pour une simple raison : une organisation médiocre et une mauvaise planification. Avec l’aide [MON.getAdjective], ils ne failliront pas !"

MON_fruits_of_revolution:0 "Fruits de la Révolution"
MON_fruits_of_revolution_desc:0 "Les graines de la Révolution ont donné des fruits prêts à être cueillis. Et avec la Plaine centrale embrasée par les soulèvements paysans, il est logique que nous aidions le nouveau régime communiste par tous les moyens possibles, même si cela implique de les rallier par la force."

MON_industrial_relocation:0 "Relocalisation Industrielle"
MON_industrial_relocation_desc:0 "Un envahisseur a franchi les frontières et menace la Mère patrie [SOV.getAdjective] ! Plusieurs rapports indiquent déjà que l’industrie est transférée d’Ukraine, de Biélorussie et des pays baltes vers les régions centrales de la Russie et l’Oural. Et si l’ennemi atteignait l’Oural et menaçait l’industrie relocalisée de nos frères ? Nous devons contacter les [SOV.getAdjective] et leur proposer un déplacement encore plus à l’Est."

MON_new_comintern_beacon:0 "Nouveau Flambeau du Komintern"
MON_new_comintern_beacon_desc:0 "Il est clair que le vent a tourné et que c’est désormais à nous de protéger [SOV.getNameDef] de l’ennemi. Alors que l’État [SOV.getAdjective] s’effondre, nous devons prendre les rênes de la Troisième Internationale et assumer le rôle de Protecteur révolutionnaire !"

MON_one_union_government:0 "Un Gouvernement Unique de l’Union"
MON_one_union_government_desc:0 "Le monde change. Qui peut désormais se dresser contre les armées de [ROOT.getNameDef] et de [SOV.getNameDef] ? Qui oserait défier la puissance de [ROOT.getLeader] et de [SOV.getLeader], et l’union de nos deux États ? Ensemble, mon ami [SOV.getLeader], nous dirigerons ce monde vers la Révolution."
#Nous avons tout fait pour les aider, mais cela ne suffit pas : l’État [SOV.getAdjective] semble voué à s’effondrer tôt ou tard sous le poids écrasant de ses envahisseurs. La seule solution applicable dans ces circonstances est de proposer un gouvernement unitaire chargé désormais de la lutte révolutionnaire !

MON_struggle_for_communal_liberation:0 "La Lutte pour la Libération Commune"
MON_struggle_for_communal_liberation_desc:0 "Contrairement à nos frères soviétiques, nous encouragerons la lutte de toutes les nations au sein de la nouvelle Union afin de combattre l’envahisseur et de repousser son avancée par tous les moyens possibles !"

#choibalsan focuses#
MON_appoint_soviet_protege:0 "Nommer le Protégé [SOV.getAdjective]"
MON_appoint_soviet_protege_desc:0 "L’un des plus anciens et des plus fidèles révolutionnaires, Khorloogiin Choibalsan, est considéré à Moscou comme le successeur désigné à la direction de [MON.getNameDef]. Il occupe déjà les postes de ministre de l’Intérieur, ministre de l’Économie et chef de l’armée. Lui donner encore plus de pouvoir ne devrait évidemment causer aucun problème à l’avenir."

MON_deal_with_religious_centre:0 "Démanteler le Centre Religieux"
MON_deal_with_religious_centre_desc:0 "Les comités de la Troïka ont découvert un Centre bouddhiste antirévolutionnaire composé de lamas venus de monastères de tout le pays. Leur plan reste flou, mais certains membres ont cherché à obtenir l’aide des responsables [JAP.getAdjective], ce qui en fait une menace pour la stabilité interne et nécessite leur élimination immédiate de toute influence."

MON_reorganize_homeland_security:0 "Réorganiser la Sécurité intérieure"
MON_reorganize_homeland_security_desc:0 "Notre dépendance envers l’aide [SOV.getAdjective] en contre-espionnage et en renseignements nous lie aux informations qu’ils nous transmettent. La création d’un Bureau de Sécurité intérieure garantira la réduction des risques d’infiltration et permettra à nos agents d’avoir accès aux données les plus récentes."

MON_the_great_terror:0 "La Grande Terreur"
MON_the_great_terror_desc:0 "Comme en [SOV.getNameDef], notre gouvernement est gangrené par des fonctionnaires corrompus d’origine douteuse, des révolutionnaires destructeurs avides de pouvoir et des révisionnistes droitiers. Nous devons faire ce qui doit être fait : pour le bien commun, ces éléments doivent être éradiqués."

MON_new_generation_of_intelligentsia:0 "Nouvelle Génération d’Intelligentsia"
MON_new_generation_of_intelligentsia_desc:0 "Les temps changent et appellent de nouveaux hommes. Nous disposons de nombreux jeunes capables de mener une guerre intellectuelle et idéologique. Leur éducation et leur loyauté, forgées dans les meilleures universités de [SOV.getNameDef], seront essentielles pour combler le vide laissé après les récents événements."

MON_new_party_elite:0 "Former une Nouvelle Élité du Parti"
MON_new_party_elite_desc:0 "L’appareil d’État a besoin d’hommes et de femmes prêts à se salir les mains pour le bien commun. Certains commandants et bureaucrates locaux ont montré une loyauté exemplaire envers Choibalsan et doivent être promus à leurs postes."

MON_remove_nominal_leadership:0 "Écarter la Direction Nominale"
MON_remove_nominal_leadership_desc:0 "Aussi aimé soit-il du peuple, Amar est devenu un dirigeant dangereux, capable de détruire tout ce que Choibalsan a construit et projeté pour l’État [MON.getAdjective]. Pour la stabilité intérieure et la sécurité gouvernementale, il doit être neutralisé immédiatement."

MON_true_hero_for_the_people:0 "Véritable Héros du Peuple"
MON_true_hero_for_the_people_desc:0 "Son dévouement absolu aux principes du marxisme-léninisme et l’absence totale d’opposition à son pouvoir montrent à quel point [MON.getLeader] est aimé et populaire ! Cela est encore plus évident aujourd’hui, alors que des rumeurs sur son génie tactique dans la lutte contre les agresseurs [JAP.getAdjective] se répandent parmi la population. Gloire à notre grand [MON.getLeader] !"

MON_first_five_year_plan_focus:0 "Premier Plan Quinquennal"
MON_first_five_year_plan_focus_desc:0 "La politique du Nouveau Cours est par tous les moyens une politique dangereuse et dépassée, destinée à semer la confusion dans l’esprit du peuple. Nous devons suivre l’exemple [SOV.getAdjective] et établir notre propre premier Plan quinquennal afin de répondre aux besoins de notre peuple."

MON_changing_times:0 "Les Temps Changent"
MON_changing_times_desc:0 "L’ancienne direction semble encore capable de gouverner le pays, mais son état physique et mental se détériore sans cesse, rendant de plus en plus laborieux l’exercice du pouvoir. Peut-être est-il temps de promouvoir de nouveaux cadres du parti à la plus haute élite ?"

MON_join_the_big_brother:0 "Rejoindre le Grand Frère"
MON_join_the_big_brother_desc:0 "Notre État a peut-être accompli sa mission, car l’objectif du Comité est enfin atteint. La prise de conscience de ce fait par les jeunes communistes nous permet de demander officiellement l’union avec nos grands amis et bienfaiteurs, [SOV.getNameDef]."

#assisting Soviets#
MON_support_the_red_army_focus:0 "Soutenir l’Armée rouge"
MON_support_the_red_army_focus_desc:0 "[SOV.getNameDef] et la Révolution ont de nombreux ennemis à l’étranger. Par tous les moyens, nous devons soutenir nos frères et sœurs dans cette lutte pour le succès de la Révolution. Bien que nous soyons incapables de déployer de grandes armées comme nos amis, nous pouvons offrir une aide industrielle et humanitaire en fournissant chevaux, nourriture, laine et viande à nos alliés."

MON_vessels_of_the_future_war:0 "Les Armes de la Guerre Future"
MON_vessels_of_the_future_war_desc:0 "L’efficacité des blindés sur le champ de bataille montre qu’ils seront d’une importance capitale, sinon la force principale de demain. Et bien que nous n’ayons pas les moyens de construire nos propres divisions de chars, nous pouvons rassembler des fonds pour en équiper une. Coûteux, mais nécessaire."

MON_aerial_support_initiative:0 "Initiative de Soutien Aérien"
MON_aerial_support_initiative_desc:0 "L’initiative ratifiée par le Comité central prévoit que le peuple [MON.getAdjective] accumule des fonds pour acheter et équiper une escadrille aérienne composée de prototypes de chasseurs modernes. Un lourd investissement en faveur de la Victoire des Travailleurs."

MON_improve_transportation_network:0 "Améliorer le Réseau Ferroviaire"
MON_improve_transportation_network_desc:0 "Nos efforts pour soutenir [SOV.getNameDef] rencontreront encore moins d’obstacles si nous établissons un réseau de transport approprié entre Oulan-Bator et le Transsibérien. Quelques vieux trains devraient aussi être achetés pour éviter toute pénurie de matériel roulant de notre côté du réseau."

#Amar socialist focuses#
MON_reject_choibalsan_advances:0 "Rejeter les Avances de Choibalsan"
MON_reject_choibalsan_advances_desc:0 "Choibalsan est un opportuniste avide de pouvoir, qui ne cherche qu’à l’obtenir pour satisfaire ses désirs personnels. Avec Amar au pouvoir, son influence pourra être progressivement réduite jusqu’à ce qu’il ne reste rien de lui."

MON_separate_army_and_politics:0 "Séparer Armée et Politique"
MON_separate_army_and_politics_desc:0 "La structure de l’armée socialiste repose lourdement sur l’endoctrinement idéologique du personnel, donnant aux politiciens une forte influence sur l’armée et inversement. Un tel système empêche l’État de fonctionner et de répondre correctement aux tentatives de coup d’État."

MON_local_command_structure:0 "Structure de Commandement Locale"
MON_local_command_structure_desc:0 "L’état-major n’a pas besoin d’être présent directement sur le terrain pour assurer la bonne conduite des opérations. Des commandants locaux peuvent être affectés à des divisions ou même à des bataillons, améliorant ainsi grandement les performances de nos forces terrestres."

MON_decrease_defense_budget:0 "Réduire le Budget de la Défense"
MON_decrease_defense_budget_desc:0 "Les responsables [SOV.getAdjective] ne cessent de faire pression sur notre gouvernement pour augmenter les dépenses militaires malgré les pénuries déjà subies par notre peuple. Ces dernières années, elles ont atteint 40 %, affaiblissant le tugrik et dévalorisant encore plus notre monnaie sur le marché."

MON_finalize_army_reform:0 "Finaliser la Réforme de l’Armée"
MON_finalize_army_reform_desc:0 "Les réformes mises en place pour améliorer la situation de l’armée semblent fonctionner correctement. Avec un personnel militaire concentré sur son devoir envers la Mère patrie, l’état général de nos forces armées s’est grandement amélioré."

MON_tolerate_religious_groups:0 "Tolérer les Groupes Religieux"
MON_tolerate_religious_groups_desc:0 "Il y a seulement quelques années, l’Église bouddhiste a souffert des réformes dites « progressistes » des gauchistes, qui visaient à séparer le peuple de sa religion pour soumettre son esprit à une nouvelle idéologie. Ces efforts ont seulement détruit la spécificité nationale du bouddhisme [MON.getAdjective]. Le gouvernement actuel est prêt à reconnaître les erreurs du passé en offrant un compromis religieux."

MON_establish_socialist_society:0 "Établir une Société Socialiste"
MON_establish_socialist_society_desc:0 "Un régime révolutionnaire tel que le nôtre est fragile et vulnérable aux influences étrangères. Cet argument est valide, mais utilisé hors contexte, il ouvre la porte à l’exploitation et aux abus, comme le font certains responsables. En rétrogradant ces individus et en décourageant les attaques ciblées contre certains groupes, il sera peut-être possible de former un nouveau gouvernement, véritablement socialiste."

MON_workers_focus:0 "Les Travailleurs..."
MON_workers_focus_desc:0 "Les travailleurs de notre nation ont été négligés par les régimes passés. Mettre en avant leur importance en construisant de nouvelles infrastructures ne fera que renforcer leur foi dans la légitimité de notre régime."

MON_peasants_focus:0 "... et les Paysans"
MON_peasants_focus_desc:0 "La collectivisation a conduit de nombreuses familles à perdre leur bétail, leur maison et leurs économies, ce qui s’apparente à une trahison de la part des responsables actuels et doit être corrigé au plus vite. Pour le bien de la nation, des réformes sont nécessaires."

MON_workers_and_peasants_unite_focus:0 "... Unissez-vous !"
MON_workers_and_peasants_unite_focus_desc:0 "« Divisés nous tombons, unis nous sommes forts ! » – tel doit être le mot d’ordre connu de chaque homme et femme de notre nation. La coopération entre ouvriers et paysans donnera de grands résultats si elle est correctement appliquée. Et Amar le sait !"

MON_a_socialist_republic:0 "Une République Socialiste Moderne"
MON_a_socialist_republic_desc:0 "Les réformes socialistes menées dans notre pays montrent combien de choses ont changé depuis le règne de Genden. Avec la position socialiste solidifiée en Mongolie, le pays peut s’ouvrir aux étrangers et embrasser son destin dans le monde moderne."

MON_sideline_the_left:0 "Écarter la Gauche"
MON_sideline_the_left_desc:0 "La gauche et la droite au sein du gouvernement sont divisées depuis le VIIe congrès du parti en 1928. Les réformes actuelles ne peuvent être menées en toute sécurité sans l’implication des gauchistes dans les affaires publiques. De plus, certains de leurs leaders s’opposent ouvertement à notre législation. Il est donc nécessaire de les écarter du pouvoir."

MON_liberalize_trade_policies:0 "Libéraliser la Politique Commerciale"
MON_liberalize_trade_policies_desc:0 "Les « Déviations gauchistes » du début des années 30 ont instauré le monopole d’État sur le commerce extérieur, notamment avec les [CHI.getAdjective]. Maintenant que nous avons consolidé notre État, nous devons nous tourner vers le monde et nous ouvrir à lui."

MON_increase_border_patrols:0 "Augmenter les Patrouilles Frontalières"
MON_increase_border_patrols_desc:0 "Nos vastes frontières sont constamment violées par des bandits, des milices rebelles et des agents ennemis. Mobiliser des troupes à la frontière est nécessaire pour notre sécurité et le développement correct de l’État."

MON_affirm_rearmament_program:0 "Confirmer le Programme de Réarmement"
MON_affirm_rearmament_program_desc:0 "Alors que les tensions à l’Est atteignent un sommet, nous restons fortement dépendants de l’aide [SOV.getAdjective]. Cela ne durera cependant pas éternellement, et nous devons nous préparer à la tempête qui s’annonce."

MON_tackle_the_eastern_threat:0 "Faire Face à la Menace de l’Est"
MON_tackle_the_eastern_threat_desc:0 "Les violations frontalières des troupes [MAN.getAdjective] ont atteint un niveau inédit qu’il est impossible d’ignorer ! Ils affirment que la frontière entre la Mongolie intérieure et extérieure s’étend profondément sur nos terres, en se basant sur des cartes périmées que nous n’avons jamais vues. Le moment est venu de leur donner une leçon, et nos amis [SOV.getAdjective] sont prêts à nous aider dans cette entreprise."

MON_assist_the_revolutionary_struggle:0 "Soutenir la Lutte Révolutionnaire"
MON_assist_the_revolutionary_struggle_desc:0 "Les luttes internes de direction ont provoqué l’éclatement de l’un des conflits les plus dévastateurs, qui devrait engloutir l’ensemble de [SOV.getNameDef] dans les flammes de la guerre. En tant que membre le plus fiable du Komintern, nous avons la possibilité d’atteindre divers objectifs diplomatiques."

MON_rebuke_1932_mediation_issue:0 "Rejeter le Litige de Médiation de 1932"
MON_rebuke_1932_mediation_issue_desc:0 "Dans leur effort prétentieux pour obtenir davantage de terres, [TAN.getNameDef] a fait appel à l’URSS en 1932 et a réussi à obtenir les mines de sel stratégiques de la région du mont Dus-Dag, qui sont des terres légitimement [MON.getAdjective] ! Avec les [SOV.getAdjective] actuellement occupés, nous pouvons utiliser la situation de manière opportuniste pour réunifier nos territoires perdus."
#soviet cooperation#
MON_ratify_mutual_assistance_treaty:0 "Ratifier le Traité d’Assistance Mutuelle"
MON_ratify_mutual_assistance_treaty_desc:0 "Notre claire allégeance envers [SOV.getNameDef] ne nécessite plus que quelques signatures de nos responsables pour être officiellement ratifiée, ouvrant la voie à une coopération forte et mutuellement bénéfique. [CHI.getNameDefCap] n’en sera pas ravi, mais qu’importe ?"

MON_invite_soviet_advisors:0 "Inviter les Conseillers [SOV.getAdjective]"
MON_invite_soviet_advisors_desc:0 "Dans le cadre du traité d’assistance mutuelle, les troupes [SOV.getAdjective] sont désormais autorisées à stationner sur le territoire de notre pays, dans des zones stratégiques clés. La coopération militaire peut être renforcée en invitant la mission militaire [SOV.getAdjective] à participer au développement de l’armée et à assister nos commandants lors d’exercices et de manœuvres."

MON_approach_soviet_planners:0 "Approcher les Planificateurs [SOV.getAdjective]"
MON_approach_soviet_planners_desc:0 "Dans le cadre de notre coopération économique, un groupe de planificateurs [SOV.getAdjective] a été invité en Mongolie afin d’aider au développement industriel du pays. Face au climat rude et au faible niveau d’urbanisation, leur mission a évolué de la construction de bâtiments vers le partage des innovations industrielles [SOV.getAdjective] avec nos techniciens."

MON_joint_technological_development:0 "Développement Technologique Conjoint"
MON_joint_technological_development_desc:0 "Il est dans notre meilleur intérêt d’accroître notre coopération avec les scientifiques et techniciens [SOV.getAdjective]. Bien que nous puissions offrir peu de soutien matériel, ils peuvent nous fournir des outils précieux pour améliorer nos installations de recherche."

MON_intensify_cooperation:0 "Intensifier la Coopération"
MON_intensify_cooperation_desc:0 "Oulan-Bator est actuellement incapable de fournir une base solide pour une production stable et fiable de composants électroniques en Mongolie. Mais avec l’aide [SOV.getAdjective], la situation peut être renversée : de nouvelles techniques et pièces développées, et des dispositifs informatiques introduits dans notre pays."

MON_student_exchange_program:0 "Programme d’Échange Étudiant"
MON_student_exchange_program_desc:0 "[SOV.getNameDefCap] dispose d’un vaste réseau institutionnel capable de former des milliers de jeunes issus de diverses républiques de l’Union. Nous pouvons envoyer certains de nos meilleurs étudiants participer au programme d’échange afin d’apprendre de nos bienfaiteurs."

MON_reform_national_script:0 "Réformer l’Alphabet National"
MON_reform_national_script_desc:0 "L’écriture [MON.getAdjective] actuelle est composée de plusieurs alphabets, dont certains sont utilisés par les ennemis de notre peuple. Grâce à l’influence [SOV.getAdjective] et à la présence de leurs linguistes, une nouvelle version de l’écriture a été mise au point en étroite collaboration avec nos spécialistes. Basée sur l’alphabet cyrillique, elle contribuera grandement à la lutte contre l’analphabétisme."

MON_solidify_language_institutes:0 "Consolider les Instituts de Langue"
MON_solidify_language_institutes_desc:0 "La dépendance à l’égard des alphabets et transcriptions étrangers a fait de notre nation le jouet de divers régimes au cours du siècle passé. Avec la proclamation de l’indépendance, de nombreux efforts ont été entrepris pour unir les différents dialectes et systèmes d’écriture dans un cadre cohérent au service du peuple."

MON_ulaanbaatar_national_university:0 "Université Nationale d’Oulan-Bator"
MON_ulaanbaatar_national_university_desc:0 "Une résolution gouvernementale a été adoptée il y a quelques mois afin d’établir « un établissement d’enseignement supérieur », qui pourra ensuite servir de fondation à l’Université nationale de Mongolie. Avec les fonds disponibles et des étudiants avides de savoir, le succès est assuré !"

#Greater Mongolia#
MON_dream_of_greater_mongolia:0 "Le Rêve d’une Grande Mongolie"
MON_dream_of_greater_mongolia_desc:0 "Pendant de nombreuses années, nous avons nourri le rêve d’unir la population mongole sous la bannière d’un seul État, non pas en tant que satellite colonial ou province arriérée, mais comme un État dirigé par des Mongols ! L’heure est venue de transformer ce rêve en réalité et de rassembler nos terres perdues !"

MON_gather_ulaanbaatar_conference:0 "Convoquer la Conférence d’Oulan-Bator"
MON_gather_ulaanbaatar_conference_desc:0 "L’équilibre des forces en Asie centrale et orientale est une affaire délicate entre trois acteurs majeurs de la région : les [SOV.getAdjective]s, les [JAP.getAdjective] et les [CHI.getAdjective]. En les invitant à se rencontrer sur un « terrain neutre », nous pouvons mettre la question du peuple [MON.getAdjective] sur la table et espérer une résolution pacifique."

MON_divide_spheres_of_influence:0 "Diviser les Sphères d’Influence"
MON_divide_spheres_of_influence_desc:0 "Les grandes puissances sont sans doute choquées par notre alliance imprévue avec la RPC, mais le temps des décisions impulsives est passé. Nous devons maintenant renforcer notre coopération en divisant les zones véritablement mongoles et chinoises, séparant ainsi nos sphères d’influence et assurant le contrôle de la région et de nos intérêts mutuels."

MON_secure_hexi_corridor:0 "Sécuriser le Corridor du Hexi"
MON_secure_hexi_corridor_desc:0 "Le contrôle de cette route commerciale et de ce passage stratégique vers le Sinkiang est tombé entre les mains de la Clique Ma lorsque les milices locales ont saisi la région durant l’Expédition du Nord de 1926. Avec notre nouvel allié, nous pouvons frapper l’ennemi par les flancs nord et est, disperser ses forces et permettre à nos troupes principales de sécuriser les zones disputées sans trop de difficultés."

MON_joint_pilgrimage_to_mount_wutai:0 "Pèlerinage Conjoint au Mont Wutai"
MON_joint_pilgrimage_to_mount_wutai_desc:0 "L’une des quatre montagnes sacrées du bouddhisme chinois est actuellement sous le contrôle de seigneurs de guerre opportunistes qui exploitent les pèlerins en quête de bénédictions. Aux côtés de notre nouvel allié, nous pouvons envoyer quelques escortes pour les soutenir en cas de problèmes bureaucratiques."

MON_secure_the_rear:0 "Sécuriser Nos Arrières"
MON_secure_the_rear_desc:0 "Les dirigeants du Sinkiang et du Turkestan oriental changent constamment d’allégeance, oscillant entre pro-chinois, pro-soviétiques ou pro-fascistes selon l’évolution politique. Si nous voulons nous concentrer sur la Plaine centrale sans craindre un coup de poignard dans le dos, nous devons sécuriser cette région immédiatement."

MON_reignite_the_civil_war:0 "Raviver la Guerre Civile"
MON_reignite_the_civil_war_desc:0 "Maintenant que les zones vitales sont sécurisées et les routes d’approvisionnement établies, nous pouvons viser plus haut et frapper directement au cœur de la structure pourrie qui détourne le peuple de la vraie révolution : le Kuomintang ! L’heure est venue d’abattre cette bête assoiffée de pouvoir !"

MON_the_second_northern_expedition:0 "La Seconde Expédition du Nord"
MON_the_second_northern_expedition_desc:0 "La première Expédition du Nord a démontré la réussite du gouvernement central dans l’écrasement des cliques de seigneurs de guerre de la région du Fengtian. Et puisque le Kuomintang a échoué à détruire les restes de bandits et a abandonné le Nord, nous marcherons et sécuriserons la région au profit du nouvel Axe Oulan-Bator–Shaanxi !"

MON_a_pragmatic_diplomacy:0 "Une Diplomatie Pragmatique"
MON_a_pragmatic_diplomacy_desc:0 "Il est clair que nous sommes seuls dans la reconquête des terres essentielles pour atteindre l’unité de l’État [MON.getAdjective]. La guerre n’est pas une option pour l’instant, mais peut-être qu’une approche plus subtile existe ?"

MON_disagreements_with_sinkiang:0 "Désaccords avec le Sinkiang"
MON_disagreements_with_sinkiang_desc:0 "Notre frontière sud est constamment menacée par [SIK.getLeader] et ses bandits. De plus, de nombreux Mongols vivant en Dzoungarie et à Dabancheng ont fui à cause des répressions locales ! Ce serait un acte noble que de récupérer ces terres et de les réintégrer."

MON_one_mongolia_policy:0 "La Politique d’Une Seule Mongolie"
MON_one_mongolia_policy_desc:0 "La Région autonome de Mongolie intérieure a toujours été une construction étrange aux yeux des diplomates. Son autonomie sous domination [MAN.getAdjective] et [CHI.getAdjective], sa lutte pour l’indépendance et son alliance avec le Japon pour préserver son statut ne sont rien d’autre qu’un opportunisme politique dû à l’absence de véritable volonté d’autodétermination. Ce problème peut et doit être résolu..."

MON_gobi_border_realignment:0 "Réajustement de la Frontière du Gobi"
MON_gobi_border_realignment_desc:0 "De nombreuses zones du sud sont habitées par des tribus mongoles souhaitant être rattachées à la Mongolie proprement dite. Ces terres appartenaient depuis longtemps à [SHX.getNameDef] et [XSM.getNameDef], qui ont nié tout droit à l’autodétermination, ce qui constitue une insulte envers notre peuple. Il est temps de montrer à ces dirigeants autoproclamés de la Plaine centrale ce que goûte le sable."

MON_delegation_to_tuva:0 "Délégation au Touva"
MON_delegation_to_tuva_desc:0 "Depuis sa déclaration nominale d’indépendance en 1922, [TAN.getNameDef] entretient des relations tendues avec notre État, non seulement à cause des migrations constantes de population, mais aussi en raison des mines de sel stratégiques du mont Dus-Dag. Notre héritage culturel et historique commun peut servir à resserrer nos liens et peut-être à former un État unitaire sur cette base."

MON_a_unity_with_buryats:0 "Union avec les Bouriates"
MON_a_unity_with_buryats_desc:0 "L’année 1934 a vu de nombreux changements dans nos relations avec les Bouriates, car les responsables [SOV.getAdjective] se sont empressés d’invoquer des « raisons idéologiques, culturelles et historiques » pour nous séparer et dresser nos dirigeants les uns contre les autres. Mais les temps ont changé, et nous pouvons désormais forger notre propre Union bouriate-mongole afin de réaliser le rêve d’unir le peuple mongol sous une seule bannière."

MON_incorporate_new_lands:0 "Incorporer les Nouvelles Terres"
MON_incorporate_new_lands_desc:0 "Nos ambitions sont grandes, mais elles sont sur le point de se réaliser pleinement ! Que le monde sache que le peuple [MON.getAdjective] se tiendra uni en un seul État national fort !"
########## National Strength Mongolia###############
MON_rely_on_national_strength:0 "Compter sur la Force Nationale"
MON_rely_on_national_strength_desc:0 "Le peuple doit comprendre que nous ne pouvons pas nous reposer entièrement sur le soutien [SOV.getAdjective] si notre nation devait entrer en conflit armé avec un autre État. Quelques campagnes de propagande et un peu d’encouragement patriotique peuvent faire des merveilles entre de bonnes mains."

MON_limited_research_cooperation:0 "Coopération de Recherche Limitée"
MON_limited_research_cooperation_desc:0 "Malgré nos meilleurs efforts nationalistes, nous ne pouvons nier que notre État manque d’équipements et de personnel adaptés pour fonctionner correctement à l’ère moderne. Certains sacrifices doivent être faits si nous voulons sortir renforcés à la fin."

MON_strengthen_existing_industrial_contracts:0 "Renforcer les Contrats Industriels Existants"
MON_strengthen_existing_industrial_contracts_desc:0 "Annuler certains vieux accords et les renouveler sur la base d’une coopération mutuellement bénéfique ouvre de nouvelles perspectives d’investissement, nous permettant d’acquérir des outils modernes pour notre industrie en développement."

MON_subvert_soviet_control:0 "Subvertir le Contrôle [SOV.getAdjective]"
MON_subvert_soviet_control_desc:0 "Nous ne pouvons mener une politique étrangère totalement indépendante sans risquer une intervention [SOV.getAdjective] ou un coup d’État soutenu par [SOV.getAdjective]. Cependant, il semble possible pour quelques hommes bien placés de modifier subtilement le cours des événements et de réduire progressivement notre dépendance envers le Grand Frère rouge."

MON_expel_choibalsan:0 "Expulser Choibalsan"
MON_expel_choibalsan_desc:0 "Les agents staliniens sont encore présents dans diverses sphères de notre gouvernement, y compris parmi l’élite du pays, incarnée par le « Grand Révolutionnaire » Choibalsan. Bien que son allégeance à la Mongolie ne fasse aucun doute, il empêche le peuple de choisir son destin. Les purges droitières de 1928 et l’Affaire Lkhumbe ont déjà montré ses erreurs. Il est temps de nous en débarrasser."

MON_sabotage_great_khural:0 "Saboter le Grand Khoural"
MON_sabotage_great_khural_desc:0 "Le changement de politique gouvernementale requiert l’approbation du Grand Khoural d’État, dont la session sera bientôt convoquée. Alors que le soutien à une Mongolie indépendante grandit parmi le peuple, les officiels pourraient encore rejeter la nouvelle législation et poursuivre une ligne pro-[SOV.getAdjective] comme par le passé. Toutefois, si une attaque devait survenir de la part d’un radical d’extrême gauche ou de droite pendant la session…"

MON_faciliate_cooperation_with_china:0 "Faciliter la Coopération avec la Chine"
MON_faciliate_cooperation_with_china_desc:0 "[CHI.getNameDef] reste l’un de nos principaux partenaires commerciaux en ces temps difficiles malgré les différences idéologiques qui ont divisé nos pays. Sans aucun doute, leurs responsables ont exploité notre nation par le passé, mais peut-être est-il temps d’ouvrir nos esprits et nos cœurs à une coopération mutuellement bénéfique ?"

MON_expand_the_role_of_urga_national_library:0 "Renforcer le Rôle de la Bibliothèque Nationale d’Ourga"
MON_expand_the_role_of_urga_national_library_desc:0 "Fondée en 1921, la Bibliothèque nationale de notre capitale demeure le principal réceptacle du savoir ancien et moderne, encore difficilement accessible à la population. Ouvrir de nouvelles salles de lecture et distribuer de la littérature contribuera à accroître le niveau d’alphabétisation du peuple."

###democratic focuses###
MON_stabilize_the_country:0 "Stabiliser le Pays"
MON_stabilize_the_country_desc:0 "L’attaque dévastatrice contre le Grand Khoural a laissé de profondes cicatrices dans notre société, avec beaucoup de citoyens remettant en cause la légitimité du régime actuel et proposant de s’éloigner de l’URSS et de son agenda. Bien que cela puisse sembler attrayant, nous devons viser à stabiliser ce qui reste du système socialiste actuel."

MON_reach_out_to_moscow:0 "Se Rapprocher de Moscou"
MON_reach_out_to_moscow_desc:0 "Il ne fait aucun doute que les responsables [SOV.getAdjective] doutent de notre loyauté après les récents événements survenus dans notre pays. Nous enverrons un émissaire à Moscou et confirmerons notre soutien en invitant leurs diplomates et officiers de sécurité à visiter notre État pour prouver sa stabilité."

MON_ensure_mvd_loyalty:0 "Assurer la Loyauté du MVD"
MON_ensure_mvd_loyalty_desc:0 "Nous savons pertinemment que des agents [SOV.getAdjective] se trouvent dans nos rangs, notamment au ministère de l’Intérieur, capables de perturber la vie des citoyens s’ils recevaient des ordres d’en haut. Des moyens existent pour les convaincre, s’ils sont employés correctement, de fournir des informations précieuses à notre usage personnel…"

MON_support_the_rebels:0 "Soutenir les Rebelles"
MON_support_the_rebels_desc:0 "De nombreuses nations ont décidé de s’opposer à la domination [SOV.getAdjective] et ont déclaré leur indépendance en ces temps incertains ! Nous rejoindrons leur lutte contre les oppresseurs du peuple qui ne recherchent que le pouvoir sur les nations d’Asie centrale et d’Extrême-Orient ! Aux armes, frères et sœurs, que notre glorieuse marche vers l’Ouest ne soit jamais oubliée !"

MON_formalize_the_treaty:0 "Formaliser le Traité"
MON_formalize_the_treaty_desc:0 "Un à un, nous pourrions être défaits, mais unis, nous sommes forts ! Pour assurer la sécurité des pays émergents, il est préférable de transformer le traité d’assistance mutuelle officieux en alliance officielle !"

MON_contest_the_insurgents:0 "Combattre les Insurgés"
MON_contest_the_insurgents_desc:0 "Les troubles civils en URSS ont conduit à l’éclatement de l’un des conflits les plus dévastateurs des temps modernes ! Et tandis que la lutte interne paralyse nos frères, certains nationalistes opportunistes en profitent pour assouvir leurs ambitions impérialistes. Alignés sur Moscou, nous pouvons neutraliser certains de ces régimes pour leur compte ! À un certain prix, bien sûr…"

MON_form_the_rightist_cabinet:0 "Former un Cabinet Droitier"
MON_form_the_rightist_cabinet_desc:0 "L’ère du soi-disant « opportunisme de droite » a pris fin en 1928 avec une nouvelle vague de purges, mais son héritage perdure ! Certains politiciens ont échappé à l’œil inquisiteur du NKVD et peuvent maintenant être rappelés pour former un second cabinet droitier, marquant le quatrième changement radical en dix ans."

MON_denounce_politizised_army:0 "Dénoncer l’Armée Politicisée"
MON_denounce_politizised_army_desc:0 "Les régimes communistes cherchent généralement à instaurer un système où le parti supervise l’armée et où celle-ci influence directement la politique de l’État. Une telle pratique est inacceptable, car ces deux domaines sont de nature totalement différente ! En dénonçant ouvertement ce comportement, nous permettrons à l’appareil gouvernemental de rester indépendant et libre dans ses choix politiques."

MON_compromise_with_lamas:0 "Compromis avec les Lamas"
MON_compromise_with_lamas_desc:0 "Le bouddhisme représente une partie intégrante de la société [ROOT.getAdjective], servant de pont entre le monde matériel de la révolution socialiste et les valeurs abstraites d’un pouvoir supérieur régissant le monde. Nous respecterons leurs choix et veillerons à ce que notre agenda ne les contredise pas."

MON_secularization_of_education:0 "Séculariser l’Éducation"
MON_secularization_of_education_desc:0 "On ne doit pas oublier que, malgré leurs bonnes intentions, les institutions religieuses ne doivent pas dicter la politique éducative de l’État. La sécularisation de l’éducation est un effort notable pour poursuivre une politique socialiste tout en restant ancrée dans la réalité de la Mongolie moderne."

MON_repay_old_debths:0 "Rembourser les Vieilles Dettes"
MON_repay_old_debths_desc:0 "De nombreuses entreprises étrangères ont quitté la Mongolie après la révolution de 1921, leurs biens ayant été nationalisés et leurs dettes annulées par l’Armée du Peuple afin de financer l’instauration du régime communiste et d’assurer la défense contre les menaces étrangères. En contactant certains de leurs représentants et en remboursant ces anciennes dettes, nous pouvons obtenir leur soutien pour notre cause."

MON_invite_foreign_investors:0 "Inviter les Investisseurs Étrangers"
MON_invite_foreign_investors_desc:0 "Après avoir reconnu les erreurs du passé, certains investisseurs voient désormais la Mongolie comme un pays en développement capable de devenir un havre sûr dans la région. Nous devons les rassurer en signant des contrats de cinq ou dix ans."

MON_prepare_for_the_inevitable:0 "Se Préparer à l’Inévitable"
MON_prepare_for_the_inevitable_desc:0 "Malgré nos meilleures intentions, il est clair que la paix dans la région ne pourra pas durer longtemps. Nous devons donc nous préparer à la tempête imminente qui engloutira l’Asie centrale et l’Extrême-Orient."

MON_frontline_infrastructure:0 "Infrastructure de Front"
MON_frontline_infrastructure_desc:0 "Si nous voulons affronter nos ennemis potentiels en Sibérie sur un pied d’égalité, nous devons établir des centres logistiques et des bases d’approvisionnement autour de nos frontières ! C’est la seule manière d’assurer notre victoire dans ces conditions difficiles."

MON_excessive_military_build_up:0 "Renforcement Militaire Excessif"
MON_excessive_military_build_up_desc:0 "Un programme financé par l’État, dédié à l’établissement d’une force militaire forte et moderne, sera coûteux et gourmand en ressources, mais les bénéfices à long terme seront immenses. Il nous suffit de survivre à la phase initiale de l’invasion, si elle devait se produire."

MON_peace_and_prosperity:0 "Paix et Prospérité"
MON_peace_and_prosperity_desc:0 "Il est difficile d’imaginer que notre pays entre dans un conflit militaire dans un avenir proche. Concentrons-nous sur le développement industriel et la sécurité de nos citoyens sur leurs lieux de travail !"

MON_stay_on_guard:0 "Rester sur nos Gardes"
MON_stay_on_guard_desc:0 "Les ambitions impérialistes étrangères et les luttes révolutionnaires ont longtemps ébranlé les terres de nombreuses nations asiatiques. Restons vigilants et veillons à ce que nos frontières soient protégées de toutes parts et que nos installations soient entièrement dotées et prêtes pour un éventuel combat."
#democratic aggressive#
MON_central_asia_defensive_pact:0 "Pacte Défensif d’Asie Centrale"
MON_central_asia_defensive_pact_desc:0 "Ces dernières années, nous avons réussi à consolider notre position dans la région en tant que puissance régionale visant à protéger les citoyens de notre pays. Le moment est venu d’affirmer nos ambitions de maintien de la paix en défendant des valeurs communes à tous en Asie centrale."

MON_mengjian_issue:0 "Question du Mengjiang"
MON_mengjian_issue_desc:0 "L’État sécessionniste du Mengjiang continue d’exister malgré l’absence de reconnaissance internationale ! Leur conception de l’indépendance inclut également la Mongolie extérieure comme faisant partie intégrante de leur territoire. Pas officiellement, certes… mais le peuple devrait-il être informé de cette petite incohérence ?"

MON_intervene_in_sinkiang:0 "Intervenir au Sinkiang"
MON_intervene_in_sinkiang_desc:0 "Les provocations frontalières constantes et les raids de cavalerie ennemie dans les aimags de Bayan-Ölgii, Khovd et Govi-Altai démontrent la menace que représente le Sinkiang pour la région. Leurs bandes de bandits se renforcent à chaque raid, tandis que notre peuple perd ses biens et ses vies. Il est temps d’en finir avec cette menace."

MON_expand_the_treaty:0 "Élargir le Traité"
MON_expand_the_treaty_desc:0 "Combattre seul contre l’oppression est sans doute un combat honorable aux yeux du peuple, mais les grandes guerres ne peuvent être gagnées sans assistance extérieure. Certains pays voisins partagent nos valeurs et nos principes, ce qui nous permettrait d’acquérir des alliés idéologiques essentiels."

MON_oppose_soviet_colonialism:0 "S’opposer au Colonialisme [SOV.getAdjective]"
MON_oppose_soviet_colonialism_desc:0 "Ils se présentent comme des protecteurs du peuple, mais ils ne sont rien de plus qu’une puissance coloniale prédatrice du siècle dernier ! Notre faiblesse passée ne nous permettait pas de le dire, mais désormais nous pouvons dénoncer ouvertement la direction [SOV.getAdjective] et ses ambitions impérialistes en Asie centrale et en Extrême-Orient ! Qu’ils sachent que nous arrivons !"

MON_support_east_siberian_independists:0 "Soutenir les Indépendantistes de Sibérie Orientale"
MON_support_east_siberian_independists_desc:0 "La guerre civile russe a vu de nombreuses régions de l’Extrême-Orient, comme l’Ukraine verte et la République d’Extrême-Orient, se ranger du côté de l’Entente dans leur lutte contre le flot rouge. De nombreux soutiens existent encore pour notre cause, il ne leur faut qu’un peu d’aide pour déclencher un soulèvement."

MON_plea_to_the_russian_far_east:0 "Appel à l’Extrême-Orient Russe"
MON_plea_to_the_russian_far_east_desc:0 "L’Extrême-Orient est connu pour être l’une des dernières annexions de l’Empire russe, ce qui implique que le soutien à la cause russe y est au plus bas, ce qui nous convient parfaitement."

MON_weaken_soviet_control_over_northwestern_siberia:0 "Affaiblir le Contrôle [SOV.getAdjective] sur la Sibérie"
MON_weaken_soviet_control_over_northwestern_siberia_desc:0 "Les vastes territoires de la Sibérie n’ont presque jamais vu une botte russe s’y poser, offrant un terrain idéal pour nos groupes d’infiltration. Il ne nous faut que du temps et quelques ressources pour y solidifier notre influence."

MON_infiltrate_transural_region:0 "Infiltrer la Région Transouralienne"
MON_infiltrate_transural_region_desc:0 "Les parties asiatiques de la région de l’Oural, avec leurs vastes territoires et leurs paysages de marécages, n’ont jamais attiré l’attention de la Russie, ce qui est à notre avantage et à celui de nos infiltrés prêts à y établir des bases provisoires."

MON_expand_influence_into_greater_steppe:0 "Étendre notre Influence dans la Grande Steppe"
MON_expand_influence_into_greater_steppe_desc:0 "Les mencheviks ont échoué à obtenir le soutien populaire en Asie centrale durant la guerre civile. Avec notre héritage commun et notre position géographique, il est possible de nouer des liens plus étroits avec les populations de la région et de recruter des partisans jusque dans les anciennes RSS d’Asie les plus éloignées."

MON_increase_presence_in_caucasus:0 "Accroître notre Présence dans le Caucase"
MON_increase_presence_in_caucasus_desc:0 "Les braves héros de Transcaucasie ont combattu les hordes russes et ottomanes pendant des siècles. Nous pourrons sans aucun doute trouver du soutien pour notre cause dans ces régions !"

MON_launch_peoples_uprising:0 "Lancer le Soulèvement Populaire"
MON_launch_peoples_uprising_desc:0 "Nos saboteurs sont en place, les dépôts de munitions sabotés et les partisans armés des armes nécessaires : il est temps de lever les véritables bannières dans les villages et les villes d’Asie centrale et d’Extrême-Orient, marquant la fin de la domination oppressive russe sur ces régions !"

#democratic rather peaceful#
MON_declare_official_neutrality:0 "Déclarer la Neutralité Officielle"
MON_declare_official_neutrality_desc:0 "Tout conflit militaire qui éclaterait sur le sol [ROOT.getAdjective] aurait des conséquences dévastatrices pour toutes les branches de notre société. Nous devons annoncer publiquement que notre pays sera une île dans ces mers tumultueuses."

MON_open_up_the_country:0 "Ouvrir le Pays"
MON_open_up_the_country_desc:0 "Notre attachement aux principes du socialisme démocratique nous permet de resserrer nos liens avec de nombreuses institutions démocratiques à travers le monde, renforçant ainsi notre fondation démocratique et garantissant la préservation des libertés du peuple."

MON_riders_of_the_storm:0 "Cavaliers de la Tempête"
MON_riders_of_the_storm_desc:0 "Nous autoriserons la formation et le déploiement de forces spéciales stratégiques capables d’assurer la protection des institutions démocratiques à travers le monde. Ce groupe de combattants restera dans l’ombre et conservera un nom discret."

MON_appeal_to_european_democracies:0 "Appel aux Démocraties Européennes"
MON_appeal_to_european_democracies_desc:0 "Alors que le monde sombre dans le chaos, certains voisins opportunistes pourraient revendiquer nos terres comme faisant partie de leur « sphère d’influence ». Avec l’appui de solides démocraties européennes, nous pourrons sécuriser notre position diplomatique."

MON_appeal_for_overseas_protection:0 "Appel à une Protection Outre-Mer"
MON_appeal_for_overseas_protection_desc:0 "Nous devons renforcer notre coopération avec d’autres puissances démocratiques à travers le monde. Les Européens se sont révélés trop peu fiables sur les questions de colonialisme et de protection extérieure. Il serait sage de chercher du soutien au-delà des océans."

MON_seek_democratic_alliances:0 "Chercher des Alliances Démocratiques"
MON_seek_democratic_alliances_desc:0 "Les institutions démocratiques de la Mongolie exigent non seulement des promesses diplomatiques, mais aussi une protection économique et militaire. La situation autour de nous se déstabilise de jour en jour et nous aurons besoin d’aide étrangère si elle devient disponible."

MON_democratic_foundation_of_mongolia:0 "Fondation Démocratique de la Mongolie"
MON_democratic_foundation_of_mongolia_desc:0 "Il est difficile de dépendre de puissances étrangères si éloignées de nous ! Nous devons renforcer notre propre voie démocratique et diffuser nos valeurs autour de nous !"

MON_provide_shelter_for_refugees:0 "Offrir un Refuge aux Réfugiés"
MON_provide_shelter_for_refugees_desc:0 "Alors que la guerre fait rage autour de nous, nous demeurons un havre de paix pour ceux qui ont besoin de protection. Il est temps d’ouvrir nos frontières à tous ceux qui cherchent aide et sécurité pour vivre en paix."

MON_offer_facilities_for_exiled_scientists:0 "Offrir des Installations aux Scientifiques Exilés"
MON_offer_facilities_for_exiled_scientists_desc:0 "Nous pourrions fournir divers instituts scientifiques en fonds supplémentaires, espaces de travail et installations de recherche. Notre développement technologique profiterait également de cette coopération mutuellement bénéfique."

MON_forge_asian_self_determination:0 "Forger l’Autodétermination Asiatique"
MON_forge_asian_self_determination_desc:0 "Nous n’oublierons jamais comment diverses puissances étrangères ont tenté d’opprimer et de subvertir les idées démocratiques en Asie centrale. Maintenant que certains territoires sont sous notre contrôle, nous devons rétablir les institutions démocratiques dans la région !"

MON_bulwark_against_fascist_threat:0 "Bastion contre la Menace Fasciste"
MON_bulwark_against_fascist_threat_desc:0 "De nombreux pays d’Asie ont déjà succombé au fléau brun, qui utilise tous les moyens possibles pour répandre ses idées venimeuses en se présentant comme une « solution à la menace rouge ». Tout ce qu’ils cherchent, c’est le pouvoir, l’influence et les ressources, pas la protection du peuple ! Nous devons devenir le principal bastion capable de résister à leurs manœuvres insidieuses !"

MON_strike_against_communist_menace:0 "Frapper la Menace Communiste"
MON_strike_against_communist_menace_desc:0 "Il y a quelques années, de nombreuses régions d’Asie sont tombées sous l’influence du Komintern et des valeurs socialistes, mais elles se trompent profondément dans leur interprétation de la Révolution du Peuple, qui n’apporte que chaos et dévastation à l’économie et à la vie des gens. Nous soutiendrons toute idée démocratique dans ces terres qui souffrent de l’oppression communiste !"

#pro-Chinese/democratic alternative path
MON_adopt_sun_yat_sen_principles:0 "Adopter les Principes de Sun Yat-Sen"
MON_adopt_sun_yat_sen_principles_desc:0 "Le fondateur de la démocratie [CHI.getAdjective] a formulé un concept philosophique basé sur trois principes visant à améliorer la vie des hommes et femmes du peuple dans la Plaine centrale. Si nous voulons être un gouvernement responsable, il est de notre devoir d’appliquer un « gouvernement du peuple, par le peuple et pour le peuple » avec des caractéristiques nationales."

MON_welfare_focus:0 "Bien-Être"
MON_welfare_focus_desc:0 "L’un des trois principes fondamentaux consiste à fournir des biens à notre peuple, dans une logique de développement économique anticapitaliste et de diplomatie anti-impérialiste. La première étape est le développement économique de notre nation."

MON_codify_democratic_principles:0 "Codifier les Principes Démocratiques"
MON_codify_democratic_principles_desc:0 "La fondation démocratique prend bien plus de force si elle est codifiée dans le système législatif et appliquée par la loi à tous les niveaux du pouvoir. Nous pourrions traverser une période d’instabilité politique, mais ces changements en valent la peine."

MON_five_races_under_one_union:0 "Cinq Races sous une Union"
MON_five_races_under_one_union_desc:0 "Les échos de cette nouvelle théorie philosophique se répandent dans toute la nation, tandis que l’héritage noble de la Révolution de Xinhai s’enracine dans les esprits et les cœurs de notre peuple ! Réinterpréter ces anciens concepts renforcera nos liens avec les Hans, Mandchous, Hui et Tibétains !"

MON_cooperation_with_kuomintang:0 "Coopération avec le Kuomintang"
MON_cooperation_with_kuomintang_desc:0 "L’orientation démocratique du gouvernement [CHI.getAdjective] actuel montre clairement qu’il réévalue les erreurs du passé et pourrait être prêt à coopérer, et non à soumettre, ses anciens sujets, régions autonomes et États tributaires. Nous devons rechercher la réconciliation, du moins sur le plan diplomatique."

MON_nationalism:0 "Nationalisme"
MON_nationalism_desc:0 "En suivant les traces du Kuomintang, nous adopterons le deuxième élément clé des Trois Principes du Peuple et embrasserons notre identité nationale : car nous ne sommes ni Chinois, ni Russes, ni Mandchous, mais des Khalkhas Mongols, et les autres nations doivent respecter notre droit à l’autodétermination !"

MON_put_an_end_to_the_arat_system:0 "Mettre Fin au Système des Arats"
MON_put_an_end_to_the_arat_system_desc:0 "Le système des arats nous a bien servi lors des premières étapes de la révolution socialiste, mais avec les orientations actuelles du gouvernement, il est devenu évident qu’il doit être entièrement réformé. En coopération avec nos amis chinois, nous pouvons appliquer le système des bannières de Mongolie intérieure, améliorant considérablement l’administration de la région !"

MON_revoke_the_kyakhta_treaty:0 "Révoquer le Traité de Kiakhta"
MON_revoke_the_kyakhta_treaty_desc:0 "Compromis et concessions n’ont pas de limites, et nous sommes prêts à embrasser à nouveau notre destin sous la protection de la République. Ayant retrouvé notre autodétermination, nous nous allierons étroitement avec les plus grandes puissances de la Plaine centrale."

MON_confrontations_with_warlords:0 "Affrontements avec les Seigneurs de Guerre"
MON_confrontations_with_warlords_desc:0 "Divisée entre des cliques en guerre, toutes avides de pouvoir, la Plaine centrale reste un endroit extrêmement dangereux et instable où les puissances étrangères chercheront probablement à exercer leur influence. Avec des ressources limitées, nous pouvons chercher à nouer des liens avec certains de ces pouvoirs régionaux afin d’élargir notre sphère d’influence."

MON_the_battle_for_tuva_uriankai:0 "La Bataille pour le Touva Uriankhai"
MON_the_battle_for_tuva_uriankai_desc:0 "Nous partageons un héritage commun avec le peuple touvain uriankhai, mais la révolution russe et l’impérialisme chinois ont créé des frontières artificielles qui nous ont séparés en deux États. Nous pouvons envisager un programme visant à réintégrer cet État dans notre domaine, mais il est très improbable que [SOV.getAdjective] accepte facilement ce problème."

#Genden path
MON_strong_leader_genden:0 "Genden, Chef Fort"
MON_strong_leader_genden_desc:0 "Maintenant que notre dirigeant bien-aimé gouverne de nouveau le pays, il est nécessaire qu’un tel génie d’homme concentre tout le pouvoir entre ses mains. Son règne inaugurera une nouvelle ère, un nouvel âge pour la Mongolie !"

MON_independent_army_structure:0 "Structure Indépendante de l’Armée"
MON_independent_army_structure_desc:0 "Certains officiers de l’armée prétendent encore que la direction de Genden n’est qu’une farce au regard de l’interprétation de la Révolution. Avec les commissaires politiques exerçant encore leur influence, il est difficile de mener un agenda idéologique sans leur ingérence. Ils représentent une grande menace pour notre régime."

MON_ensure_soldier_loyalty:0 "Assurer la Loyauté des Soldats"
MON_ensure_soldier_loyalty_desc:0 "Nous réformerons le système d’endoctrinement politique pour mieux l’adapter aux objectifs du gouvernement actuel et non plus à l’idéologie de masse. Les soldats sauront ce qu’ils combattent et pour qui."

MON_reform_the_high_command:0 "Réformer le Haut Commandement"
MON_reform_the_high_command_desc:0 "Les officiers supérieurs ne peuvent être laissés de côté lors de ces réformes progressives, d’autant que leur loyauté oscille constamment entre diverses forces et régimes politiques."

MON_mongolian_peoples_army:0 "Armée Populaire [ROOT.getAdjective]"
MON_mongolian_peoples_army_desc:0 "La nouvelle structure de l’armée incarne la perfection dans son essence : des soldats loyaux obéissant aux ordres d’officiers supérieurs dévoués à la cause — un mélange parfait pour le véritable peuple mongol."

MON_incorporate_buddhism:0 "Intégrer le Bouddhisme"
MON_incorporate_buddhism_desc:0 "Dans l’un de ses premiers écrits, Genden disait avoir deux idoles qu’il suivrait toujours : Vladimir Ilitch Lénine et Bouddha. Beaucoup s’interrogent sur la façon dont un tel mélange d’idéologies peut coexister. La clé réside dans l’intégration du bouddhisme dans l’agenda de l’État, ce qui renforcera considérablement le soutien populaire au dirigeant actuel."

MON_dealing_with_soviet_sympathisers:0 "Traiter avec les Sympathisants [SOV.getAdjective]"
MON_dealing_with_soviet_sympathisers_desc:0 "La stabilité et la sécurité de notre gouvernement sont constamment menacées par des éléments pro-[SOV.getAdjective] révisionnistes infiltrant nos réunions, conférences et congrès. Si nous voulons ancrer nos nouvelles valeurs dans le parti, certains de ces traîtres doivent payer pour les erreurs du passé."

MON_continue_new_course_policy:0 "Poursuivre la Politique du Nouveau Cours"
MON_continue_new_course_policy_desc:0 "La Politique du Nouveau Cours représente une adaptation de la « Nouvelle Politique Économique » de Lénine des années 20, avec des spécificités mongoles. Certains de ses éléments peuvent être renforcés pour mieux servir l’économie nationale."

MON_get_rich:0 "Enrichissez-Vous !"
MON_get_rich_desc:0 "Longtemps attendue et promise, la politique coopérative de Peljidiin Genden, « Enrichissez-vous ! », vise à permettre aux hommes et femmes du peuple d’accumuler des richesses indépendamment du contrôle et de la supervision de l’État, permettant à [ROOT.getNameDef] de tirer parti des meilleurs éléments du capitalisme pour développer le socialisme !"

MON_empower_hudonets:0 "Donner du Pouvoir aux Hudonets"
MON_empower_hudonets_desc:0 "Originaires des régions pauvres de divers aimags, les hudons, aussi appelés hudonets, sont nombreux à siéger au gouvernement, sous la direction du plus hudonet de tous, Genden. Leur accorder plus de pouvoir nous garantira une forte croissance économique dans les régions défavorisées."

MON_provide_for_the_people:0 "Pourvoir aux Besoins du Peuple"
MON_provide_for_the_people_desc:0 "Du riche au pauvre, du pauvre au riche, l’argent finit toujours par retomber dans les mains du gouvernement. Nous devons mettre en place des moyens adéquats pour chacun, quel que soit son niveau de richesse ou son statut social."

MON_abolish_the_secretary_system:0 "Abolir le Système des Secrétaires"
MON_abolish_the_secretary_system_desc:0 "Le système de direction collégiale par trois secrétaires du parti, instauré en 1928, a fait son temps. Le partage du pouvoir a mené le pays dans la crise politique et économique des dernières années, et afin d’éviter une nouvelle prise de pouvoir, il doit être aboli une bonne fois pour toutes."

MON_subsidise_the_military:0 "Subventionner l’Armée"
MON_subsidise_the_military_desc:0 "L’industrie de l’armement a connu un fort recul ces dernières années, mais grâce à quelques subventions étatiques, elle peut être modernisée et étendue, nous permettant de renforcer nos capacités militaires et d’équiper correctement nos armées."

MON_leader_of_the_equal:0 "Le Chef des Égaux"
MON_leader_of_the_equal_desc:0 "Genden a prouvé au peuple qu’il était capable de diriger le pays dans ces temps difficiles. Sous sa direction, [ROOT.getNameDef] suivra la voie du socialisme religieux et recherchera l’unification de peuples similaires sous un seul État."

MON_promote_religious_socialism:0 "Promouvoir le Socialisme Religieux"
MON_religious_socialism_desc:0 "Nous avons triomphé de nos luttes passées, ce qui nous permet désormais de renforcer et de promouvoir nos valeurs dans le cœur du peuple grâce à une nouvelle entité émergeant sur l’échiquier politique : le socialisme religieux, parfaitement adapté à notre nation prospère."

MON_support_buddhist_monasteries:0 "Soutenir les Monastères Bouddhistes"
MON_support_buddhist_monasteries_desc:0 "Notre cause étant noble et non oppressive, nous pouvons rechercher la coopération de nombreuses institutions religieuses du pays, qui apporteront leur soutien à notre régime et garantiront que le nouveau système sera solidement enraciné dans ses valeurs."

#ANCOM
MON_oust_genden:0 "Renverser Genden"
MON_oust_genden_desc:0 "Le règne de Genden n’a apporté que ruine à l’économie, à l’industrie et aux institutions sociales [ROOT.getAdjective]. Le peuple est las des dictateurs oppressifs et des changements de régime incessants. Peut-être vaut-il mieux ne pas avoir de gouvernement du tout."

MON_changes_within:0 "Changements Internes"
MON_changes_within_desc:0 "La première étape vers l’état d’esprit anarchiste passe par des changements internes dans la structure économique héritée de l’État. Nous encouragerons les idées de propriété communale, le service civil gratuit et des échanges commerciaux limités avec nos voisins les plus proches."

MON_spread_of_anarcho_communism:0 "Diffuser l’ANCOM à l’Étranger"
MON_spread_of_anarcho_communism_desc:0 "Les idées de révolution anarchiste imminente ne sauraient être limitées par des lignes tracées sur une carte par quelques politiciens d’autrefois. Répandons la nouvelle : la Révolution de l’Esprit arrive !"

MON_full_social_equality:0 "Égalité Sociale Totale"
MON_full_social_equality_desc:0 "Les anciennes structures gouvernementales insistaient sur une répartition inégale des richesses, des biens et des rôles sociaux. Quelle absurdité pour les communes populaires de Mongolie !"

MON_abolish_the_currency:0 "Abolir la Monnaie"
MON_abolish_the_currency_desc:0 "La monnaie n’a plus de raison d’être si les échanges se font localement et sont régulés localement. Oui, ce n’est pas toujours efficace, mais est-ce vraiment important si cela fonctionne pour l’instant ?"

MON_workers_control_and_discipline:0 "Contrôle et Discipline des Travailleurs"
MON_workers_control_and_discipline_desc:0 "Sans institution de régulation supérieure, certains travailleurs semblent avoir oublié l’objectif de la révolution anarcho-communiste, où ils travaillent pour leur propre bien et celui de la commune. Renforcer ces idées par des assemblées communales annuelles est un effort utile."

MON_eradicate_private_property:0 "Éradiquer la Propriété Privée"
MON_eradicate_private_property_desc:0 "La propriété privée incarne toute la logique du capitalisme, qui cherche à contrôler les moyens de production et de distribution, une déviation hostile aux processus naturels de la société. Les citoyens n’ont toutefois rien à craindre : la propriété personnelle restera entre les mains de leurs légitimes propriétaires."

MON_remove_hierarchical_structures:0 "Supprimer les Structures Hiérarchiques"
MON_remove_hierarchical_structures_desc:0 "Nul homme ou femme libre ne sera arrêté, emprisonné, banni, exilé ou détruit de quelque manière que ce soit, ni poursuivi, sauf par le jugement légal de ses pairs — la plus haute autorité revenant à la commune populaire."

MON_finalize_state_reforms:0 "Finaliser les Réformes de l’État"
MON_finalize_state_reforms_desc:0 "Beaucoup voient notre petite Révolution comme la première étape d’une entreprise plus vaste, visant à répandre et à établir nos valeurs au-delà des frontières, jusqu’aux régions les plus lointaines du monde, pour qu’un jour la Révolution communale y éclate aussi."

#Anti-Soviet focuses
MON_form_the_provisional_government:0 "Former un Gouvernement Provisoire"
MON_form_the_provisional_government_desc:0 "Notre gouvernement est en péril : la délégation des plus hauts responsables a été arrêtée à Moscou et leur sort est inconnu. Nous devons former un régime provisoire dont le but sera d’assurer la stabilité de l’État pour le moment."

MON_assists_deviants_struggle:0 "Soutenir la Lutte des Déviants"
MON_assists_deviants_struggle_desc:0 "La nouvelle de l’emprisonnement de Genden est parvenue à Oulan-Bator il y a quelques jours, et un tel esprit ne peut être laissé à pourrir dans une cellule de la Loubianka. Nous devons soutenir le héros de la Mongolie par tous les moyens possibles."

MON_infiltrate_the_railway_system:0 "Infiltrer le Réseau Ferroviaire"
MON_infiltrate_the_railway_system_desc:0 "Nous connaissons sa localisation, mais reste à savoir quel itinéraire sera choisi pour l’envoyer en train vers le sud. Il est préférable de réveiller de vieilles connexions au Commissariat du peuple aux voies de communication soviétique afin d’obtenir des informations vitales sur le trajet prévu vers la « retraite »."

MON_return_of_prodigal_son:0 "Retour du Fils Prodigue"
MON_return_of_prodigal_son_desc:0 "Nous avons réussi à obtenir les plans du possible itinéraire de Genden vers son nouveau « lieu de réhabilitation » en Crimée. Il est temps d’utiliser tous les fonds à notre disposition pour garantir son retour en toute sécurité dans la Mère Patrie."

MON_appeal_to_china:0 "Appel à la Chine"
MON_appeal_to_china_desc:0 "Alors que les [SOV.getAdjective] ont abandonné notre dirigeant et que les [JAP.getAdjective] suivent leur propre destin, nous n’avons d’autre choix que de faire appel à ceux qui nous ont jadis gouvernés et de rechercher une coopération mutuellement bénéfique."

MON_matters_of_internal_affairs:0 "Questions d’Affaires Intérieures"
MON_matters_of_internal_affairs_desc:0 "Avec le déclin du soutien populaire au régime stalinien dans tout le pays, il serait sage de chercher d’autres moyens d’améliorer la stabilité interne de notre nation en péril."

MON_strengthen_buddhist_community:0 "Renforcer la Communauté Bouddhiste"
MON_strengthen_buddhist_community_desc:0 "Le bouddhisme [ROOT.getAdjective] peut être décrit uniquement comme pacifique et anti-révolutionnaire, de nombreux lamas exprimant leur soutien à l’établissement d’un gouvernement plus conservateur et protecteur, qui ne chercherait pas à opprimer la plus grande et la plus forte communauté religieuse du pays."
MON_search_new_bogd_khan:0 "Rechercher le nouveau Bogd Khan"
MON_search_new_bogd_khan_desc:0 "Interdite d’abord par les autorités [SOV.getAdjective], puis par les autorités communistes [ROOT.getAdjective], la recherche de la 9e réincarnation du Jebtsundamba Khutughtu peut désormais se mener en secret, si nous cherchons à rétablir à court terme la monarchie constitutionnelle cérémonielle."

MON_proclaim_the_second_bogd_khanate:0 "Proclamer le Second Khanat Bogd"
MON_proclaim_the_second_bogd_khanate_desc:0 ""

MON_guard_southern_border:0 "Protéger la frontière sud"
MON_guard_southern_border_desc:0 "Les rapports des aïmags de Govi-Altai, Ömnögovi et Dornogovi témoignent de la perfidie de groupes locaux profitant de la faible emprise du gouvernement sur cette frontière méridionale étendue pour s’enrichir par des raids et le pillage incessant de villages innocents. Nous devons dépêcher quelques-unes de nos nouvelles escadrilles pour mettre fin à cette menace."

MON_ensure_rural_support:0 "Assurer le soutien rural"
MON_ensure_rural_support_desc:0 "La population des campagnes ignore en grande partie ce qui se trame dans les hautes sphères de l’administration, et certains se sentent inquiets face aux changements en cours dans le pays. Nous devrons chercher à nous réconcilier avec de nombreux anciens locaux en investissant dans leur développement. Une entreprise coûteuse, mais nécessaire."

MON_shelter_the_banished:0 "Accueillir les bannis"
MON_shelter_the_banished_desc:0 "Nos forces déployées dans les aïmags du Sud signalent un afflux de réfugiés politiques en provenance d’États voisins, parmi lesquels certains membres de gauche et d’anciens hauts responsables du parti [PRC.getNameDef], preuve de profonds bouleversements gouvernementaux. Plutôt que de les ignorer, nous pourrions utiliser leur aide pour bâtir une nouvelle forme d’État communiste."

MON_the_new_chairman:0 "Le nouveau président"
MON_the_new_chairman_desc:0 ""

MON_rally_the_radicals:0 "Rassembler les radicaux"
MON_rally_the_radicals_desc:0 "Le pan-mongolisme est un mouvement présent dans chaque recoin de notre vaste pays, mais beaucoup de ces radicaux manquent d’organisation et du soutien d’une opposition encore trop faible sur la scène politique. En employant les moyens nécessaires, nous pouvons nous assurer que ces voix se feront entendre de plus en plus fort."

MON_host_emergency_great_khural_assembly:0 "Convoquer une assemblée d’urgence du Grand Khural"
MON_host_emergency_great_khural_assembly_desc:0 "Nous avons longtemps redouté ce moment, mais c’est désormais officiel : [SOV.getNameDef] et ses représentants déclarent ne plus vouloir soutenir la défense de notre État contre les menaces extérieures. Le Grand Khural doit immédiatement se réunir pour débattre de la politique intérieure et de l’orientation diplomatique du régime actuel."

MON_approach_japan:0 "Se rapprocher du Japon"
MON_approach_japan_desc:0 "Les rumeurs circulent rapidement, et nous nous retrouvons exposés à toutes sortes d’ingérences politiques et militaires de nos voisins, directs comme indirects. La peur d’une nouvelle occupation [CHI.getAdjective] de nos terres est grande. Pour y faire face, nous pourrions nous tourner vers les ennemis de nos ennemis : [JAP.getNameDef], et solliciter leur soutien dans notre lutte politique naissante."

MON_invite_pince_su:0 "Inviter le prince Su"
MON_invite_pince_su_desc:0 "Nous sommes convaincus que l’intérêt [JAP.getAdjective] pour nos terres n’est pas seulement expansionniste, mais aussi partenarial. Certains de leurs agents ont déjà approché divers responsables gouvernementaux récemment, proposant une part des bénéfices si les investisseurs [JAP.getAdjective] pouvaient aider économiquement notre État et si leurs conseillers appuyaient le développement de notre armée."

MON_launch_a_coup:0 "Lancer un coup d’État"
MON_launch_a_coup_desc:0 ""
#events#
mongol.2.t:0 "La Mongolie propose un traité d’assistance mutuelle"
mongol.2.d:0 "La réunion prévue ce soir devait être animée, mais nul n’imaginait qu’elle prendrait une telle tournure. Après le toast habituel porté par [SOV.getLeader] « aux travailleurs et paysans de [MON.getNameDef] et de [SOV.getNameDef] », la discussion s’est engagée sur l’avenir commun de l’URSS et de la Mongolie.\nAlors que [MON.getLeader] défendait l’idée de l’indépendance [MON.getAdjective], à la lumière d’une présence et d’une influence [SOV.getAdjective] croissantes, le chef d’état-major Gelegdorjiin Demid s’est tourné vers le Vozhd et a proposé d’approfondir la coopération entre les deux nations. \n\nLe visage stupéfait de [MON.getLeader] et la réaction satisfaite de [SOV.getLeader] ont soulevé bien des questions sur le sort futur des relations entre les deux dirigeants. Dans ses explications, Demid a souligné que l’« Accord de gentlemen » de 1934 nécessitait une révision urgente, compte tenu de la présence alarmante des [JAP.getAdjective] en [MEN.getNameDef] et des tensions accrues après la bataille du temple de Khalkhin l’an passé. L’accord devrait inclure une coopération industrielle et militaire mutuellement bénéfique, ainsi que des garanties d’indépendance en cas de conflit armé avec une autre nation. \n\nQuelle sera la décision du Gensek ?"
mongol.2.a:0 "Accepter de fournir une assistance"
mongol.2.b:0 "Abandonner la Mongolie"

mongol.3.t:0 "L’URSS accepte le traité"
mongol.3.d:0 "La proposition de Demid a été accueillie avec un grand enthousiasme parmi les [SOV.getAdjective]. [SOV.getLeader] a chaleureusement tapoté l’épaule du jeune général souriant, avant de discuter avec lui de certains détails du traité : investissements économiques, transferts d’armes et d’équipements, logements pour les soldats [SOV.getAdjective], centres d’entraînement militaire, éventuelles lignes défensives, supervision des patrouilles frontalières, et bien plus encore. \n\n[MON.getLeader], apparemment oublié de tous, sauf du chef du NKVD Yagoda qui notait quelques remarques dans son carnet, s’est retrouvé à boire seul le cognac apporté par un général [SOV.getAdjective]. Quelques minutes plus tard, la discussion s’est poursuivie en cercle élargi sur d’autres thèmes révolutionnaires."
mongol.3.a:0 "Nous sommes heureux qu’ils aient accepté."

mongol.4.t:0 "L’URSS nous abandonne !"
mongol.4.d:0 "Déclarant que « [SOV.getNameDef] doit faire face à des urgences liées à sa stabilité intérieure ainsi qu’à de vives tensions à l’Ouest, et ne peut donc se concentrer actuellement sur le développement de l’Extrême-Orient », [SOV.getLeader] a refusé de signer le « Traité d’amitié et de coopération » dans les circonstances présentes. \n\nDéçu, Demid a ensuite été vu en train de discuter discrètement avec un [MON.getLeader] enthousiaste des priorités que la Mongolie devrait désormais adopter lors des prochaines négociations."
mongol.4.a:0 "Très bien, si tel est leur choix"

mongol.5.t:0 "La Mongolie prône l’autosuffisance"
mongol.5.d:0 "La délégation [MON.getAdjective], conduite par [MON.getLeader], plaide depuis longtemps pour le principe d’autosuffisance [MON.getAdjective] en matière de dépenses de défense et de relations internationales en Extrême-Orient. Bien qu’étant de jure un État indépendant, elle reste de facto fortement dépendante de nos orientations économiques, industrielles et militaires — en d’autres termes, un État sous tutelle.\nCompte tenu de la présence croissante des [JAP.getAdjective] en Mandchourie et de leur appétit pour nos régions riches en ressources de Transbaïkalie, nous pourrions être tentés d’accroître notre présence et de stationner des troupes sur le sol [MON.getAdjective]. Mais une telle action risquerait d’accentuer des tensions déjà préoccupantes avec [JAP.getNameDef]. \nPesant le pour et le contre, [SOV.getLeader] a décidé que..."
mongol.5.a:0 "...ces termes sont acceptables."
mongol.5.b:0 "...il vaut mieux soutenir nos « frères »."

mongol.6.t:0 "Les [SOV.GetAdjective] approuvent la demande"
mongol.6.d:0 "Après réflexion, [SOV.getLeader] a affirmé avec conviction que la politique intérieure et les dépenses gouvernementales [MON.getAdjective] étaient « d’origine [MON.getAdjective] et ne devraient être guidées que par eux », approuvant ainsi notre demande d’autonomie dans ces domaines. Une partie du contingent militaire [SOV.getAdjective] restera dans les zones vitales pendant quelques mois afin d’assurer la sécurité des régions frontalières vulnérables. \nGrâce à ce succès, nous pouvons enfin orienter [MON.getAdjective] vers la voie politique souhaitée, sans risque d’ingérence [SOV.getAdjective], du moins pour l’instant."
mongol.6.a:0 "Excellent !"

mongol.7.t:0 "L’URSS envisage toujours d’envoyer du soutien"
mongol.7.d:0 "« Aucune cause n’est plus urgente que la défense de la révolution des peuples et la sécurité des régimes communistes de nos États frères » — tel fut le discours de [SOV.getLeader], indiquant clairement qu’il n’y avait aucune raison de nous accorder la moindre autonomie, même limitée. \nDéçu, [MON.getLeader] a cherché du soutien parmi les autres membres de la délégation [MON.getAdjective], la plupart visiblement abattus, à l’exception du commandant en chef Demid, favorable à une coopération militaire plus étroite entre [SOV.getAdjective] et [MON.getAdjective]."
mongol.7.a:0 "Très bien alors"

mongol.8.t:0 "Menacer [SOV.getLeader] avec le Japon ?"
mongol.8.d:0 "Les [SOV.getAdjective] semblent encore sous-estimer la menace que [JAP.getNameDef] représente depuis quelques années. Il serait sage de leur rappeler qui est le véritable ennemi de la révolution et le principal impérialiste d’Asie orientale.\n\nCependant, compte tenu du caractère impulsif et indépendant d’esprit de [MON.getLeader], qui risque de lancer cette déclaration de façon peu commune et provocatrice, il vaudrait peut-être mieux ne pas aborder le sujet : [SOV.getLeader] n’est peut-être pas disposé à entendre de tels propos."
mongol.8.a:0 "Faisons-le !"
mongol.8.b:0 "Réfléchissons-y à deux fois"

mongol.9.t:0 "[MON.getLeader] nous menace avec le Japon"
mongol.9.d:0 "La conversation lente et calme sur les moyens révolutionnaires dans nos deux États, suivie du récit de [SOV.getLeader] sur son activité prolétarienne, fut soudainement interrompue par un [MON.getLeader] ivre qui se leva de sa chaise et hurla au visage du Vozhd : « Espèce de Géorgien de malheur, tu es devenu un tsar russe de pacotille ! » Il s’avança ensuite vers le Gensek, le gifla et cria : « Même les [JAP.getAdjective] sont de meilleurs alliés que toi ! », plongeant la salle dans un silence de mort. \n\nJamais personne n’avait osé un tel affront envers le Gensek, soulevant la question : comment [SOV.getLeader] va-t-il réagir ?"
mongol.9.a:0 "Reconnaître que la menace est réelle"
mongol.9.b:0 "Ignorer ces propos"
mongol.9.c:0 "Genden est-il un agent pro-japonais ?"

mongol.10.t:0 "Les [SOV.GetAdjective] envoient de l’aide"
mongol.10.d:0 "Le discours percutant de [MON.getLeader] sur le « tsar moderne [SOV.getAdjective] » préoccupé avant tout par son intérêt personnel, a conduit de nombreuses délégations étrangères à comprendre que leur vision de l’Extrême-Orient était erronée. Après quelques échanges, la délégation [MON.getAdjective], soulagée, a été invitée à signer un accord renforçant la coopération entre nos deux nations ! \n\n[MON.getLeader] fut incontestablement le héros de la soirée, malgré l’agacement manifeste de [SOV.getLeader], qui resta silencieux presque tout le reste du temps, assis dans un fauteuil sombre au coin de la salle et discutant avec Genrikh Yagoda de « questions internes sans importance »."
mongol.10.a:0 "Ça a marché ? Hourra !"

mongol.11.t:0 "La direction soviétique ignore la menace"
mongol.11.d:0 "En bourrant lentement sa nouvelle pipe de tabac, [SOV.getLeader] désigna [MON.getLeader] et exprima ses profondes inquiétudes quant à l’état mental du représentant actuel de [MON.getNameDef], soulignant que l’excès d’alcool et les bagarres n’apporteraient aucun diplomate dans un débat. De plus, ces méthodes inutiles ne serviraient qu’à ces petits fauteurs de troubles de l’Est. \n\nQuelques minutes plus tard, [SOV.getLeader] ordonna de notifier au haut commandement de l’Union que la menace orientale était de la plus basse importance et que les responsables [SOV.getAdjective] avaient « des affaires plus sérieuses à traiter », témoignant clairement d’un mépris à l’égard d’un ennemi aussi redoutable que [JAP.getNameDef]."
mongol.11.a:0 "Il semble que nous soyons seuls"

mongol.12.t:0 "Les [SOV.GetAdjective] emprisonnent Genden ?!"
mongol.12.d:0 "La réponse du Gensek fut lente et posée, comme si le silence ambiant lui donnait plus de poids. \nD’abord, il souligna l’inutilité de tels arguments, rappelant que le NKVD travaillait sur ce dossier bien avant que [MON.getLeader] n’accède à sa fonction. \nEnsuite, [SOV.getLeader] s’interrogea sur la « singulière » phrase évoquant « l’amitié avec le Japon », doutant que les [MON.getAdjective] songent réellement à solliciter la protection de ceux qui oppriment la classe ouvrière. Enfin, il fixa [MON.getLeader] dans les yeux, observant son visage effrayé, et questionna sa loyauté envers la Révolution et le Père des Nations, Vladimir Ilitch Lénine. \n\nQuelques minutes plus tard, des officiers du NKVD, menés par Genrikh Yagoda, entrèrent dans la salle et prièrent poliment le [MON.getLeader] ivre de les accompagner pour une discussion privée sur ce sujet brûlant. La délégation restante devrait bientôt quitter Moscou pour apporter la nouvelle à Oulan-Bator."
mongol.12.a:0 "Que pouvons-nous faire maintenant ?"

mongol.13.t:0 "La délégation [MON.GetAdjective] rentre à Oulan-Bator"
mongol.13.d:0 "La délégation composée de [MON.getLeader], Gelegdorjiin Demid et de quelques autres responsables du parti est enfin rentrée de Moscou, après près d’un mois d’absence dans les structures gouvernementales. Elle a d’abord voyagé en train jusqu’à Irkoutsk, où quelques véhicules et camions [SOV.getAdjective] leur ont été fournis pour assurer leur retour sûr jusqu’à la capitale [MON.getAdjective]. \n\nAprès toutes ces négociations, manœuvres diplomatiques, offres et contre-offres, ils sont enfin de retour dans leurs bureaux et convoquent la septième Assemblée du Grand Khural d’État pour discuter des résultats de la conférence et définir la nouvelle orientation du pays pour les années à venir."
mongol.13.a:0 "Quelles nouvelles seront annoncées bientôt ?"

mongol.14.t:0 "Le train [MON.GetAdjective] revient vide"
mongol.14.d:0 "L’escorte de la délégation, composée de douze gardes du corps et de quelques assistants supplémentaires, attendait déjà depuis plusieurs jours à la gare principale d’Irkoutsk. Le train de la délégation est finalement arrivé, mais certains membres ont déclaré que Genden était resté à Moscou pour discuter de « questions urgentes et indispensables » dans un hôtel du quartier de la Loubianka, selon des responsables [SOV.getAdjective]. \n\nL’un des gardes du corps de Genden, se souvenant de son séjour d’études à Moscou, a immédiatement exprimé son inquiétude : le bâtiment du siège du NKVD porte le même nom, laissant entendre que notre courageux dirigeant y a été emprisonné..."
mongol.14.a:0 "Où est notre dirigeant ?!"

mongol.15.t:0 "Assemblée du Grand Khural de [GetYear]"
mongol.15.d:0 "Jamais la septième Assemblée du Grand Khural d’État n’avait été aussi pleine qu’aujourd’hui. De nombreux ministres, représentants, fonctionnaires subalternes et membres de la presse fixent le podium principal où siège la délégation, prête à annoncer le résumé de jours et d’heures de discussions avec leurs homologues [SOV.getAdjective] à Moscou. \n\nAprès une salve d’ovations, le chef de la délégation, [MON.getLeader], se lève, des centaines de regards curieux et impatients braqués sur la posture solide du Premier ministre. Il s’approche du micro et prononce une seule phrase..."
mongol.15.a:0 "Les [SOV.GetAdjective] nous ont apporté leur aide !"
mongol.15.b:0 "Notre autosuffisance a été garantie !"
mongol.15.c:0 "Ils nous ont abandonnés !"

#### RAIDS EVENTS #################

mongol.19.t:0 "Mouvements excessifs de troupes [MON.getAdjective] détectés"
mongol.19.d:0 "Nos patrouilles frontalières signalent un nombre accru de troupes [MON.getAdjective] massées à notre frontière ces derniers jours. Des communications radio récemment interceptées suggèrent qu’elles préparent une opération militaire sur nos terres. \nSi leur objectif exact demeure inconnu, il est clair que ces régiments ne présagent rien de bon : une réaction rapide et résolue est nécessaire pour défendre efficacement contre cette menace émergente."
mongol.19.a:0 "Ordonnez de tenir les positions à tout prix !"
mongol.19.b:0 "Nous avons d’autres affaires à traiter que ces bandits."

mongol.20.t:0 "Petit raid réussi"
mongol.20.d:0 "L’escouade envoyée a percé efficacement le périmètre défensif ennemi et, rencontrant peu ou pas de résistance, a réussi à infiltrer un village local déguisée en milice, à s’emparer d’armes mal gardées dans des dépôts, à les charger sur des chevaux et à disparaître dans la nuit sans alerter ni blesser les civils. \n\nDe retour à la base, nos soldats ont signalé des variantes d’armes qui pourraient améliorer nos propres conceptions — un ajout des plus utiles pour nos prochains raids."
mongol.20.a:0 "Rapportez les trophées et étudiez-les !"

mongol.21.t:0 "Petit raid échoué"
mongol.21.d:0 "Le détachement a avancé comme prévu et, sans rencontrer d’opposition, a franchi la frontière disputée avant l’aube, dans l’objectif d’atteindre une localité. Mais nos forces sont soudain tombées dans une embuscade soigneusement préparée, comme si chacun de leurs mouvements avait été anticipé. \n\nNos troupes ont réussi à se frayer un passage sûr et à se replier rapidement. Plusieurs blessés, de nombreuses armes perdues, et un moral sévèrement entamé face à un ennemi apparemment supérieur."
mongol.21.a:0 "Le moral de nos soldats est brisé..."

mongol.22.t:0 "Offensive stoppée"
mongol.22.d:0 "Un mouvement suspect a été aperçu à l’horizon alors que notre groupe de raid pénétrait en territoire ennemi. Quelques heures plus tard, il a affronté une unité adverse : un bref échange a dégénéré en bataille lorsque des soldats impatients ont ouvert le feu des deux côtés. \n\nLes tirs ont duré plusieurs heures, avant que les deux parties ne se replient pour se réorganiser, reprendre des forces et refaire leurs munitions. L’objectif n’a malheureusement pas été atteint, mais certaines tactiques et manœuvres exécutées nous ont offert une expérience précieuse."
mongol.22.a:0 "Très bien. Nos troupes ont appris une leçon."

mongol.23.t:0 "Petit raid repoussé"
mongol.23.d:0 "La mobilisation rapide de nos réserves et le déploiement éclair de nos forces ont permis d’éviter un désastre. \nAlors que les troupes [MON.getAdjective] s’avançaient plus profondément, nos régiments frontaliers les ont suivies et observées, tandis que les troupes régulières préparaient le terrain pour un affrontement. \n\nJuste avant que l’engagement principal prévu ne débute, l’un de nos commandants, trop impulsif, a donné l’ordre d’attaquer, permettant aux pillards de fuir l’encerclement probable et de disparaître dans la nuit — en laissant toutefois de nombreuses armes derrière eux, que nous pourrons exploiter."
mongol.23.a:0 "Une victoire pour notre peuple !"

mongol.24.t:0 "Un petit détachement [MON.GetAdjective] a franchi nos frontières"
mongol.24.d:0 "Un détachement de patrouille frontalière a découvert ce jour des traces d’une escouade ennemie ayant traversé notre frontière il y a quelques jours à peine. Les empreintes et traces de sabots suggèrent qu’il s’agissait de quelques dizaines d’hommes légèrement armés, accompagnés d’une cavalerie. Ils ont suivi la route menant à un dépôt de munitions local, neutralisé les gardes sans méfiance et, la nuit suivante, emporté la plupart des munitions. \n\nLa rumeur des « Cavaliers fantômes » commence déjà à se répandre parmi la population. Un petit poste de police doit être envoyé pour surveiller la zone contestée dans les semaines à venir."
mongol.24.a:0 "Nous avons perdu des hommes et des ressources précieuses !"

mongol.25.t:0 "Impasse atteinte"
mongol.25.d:0 "Un détachement ennemi a été repéré par des paysans, qui ont immédiatement prévenu le capitaine de la police locale. Ce dernier a envoyé une escouade afin de ralentir l’avancée ennemie. \n\nAprès une courte négociation, les deux camps ont ouvert le feu, chacun affirmant ne faire que défendre ses intérêts. Les combats ont duré jusqu’à la nuit, avant que l’ennemi ne regroupe ses forces et se retire, laissant nos soldats soigner leurs blessures et tirer les leçons de l’affrontement."
mongol.25.a:0 "Très bien. Nos troupes ont appris une leçon."

mongol.26.t:0 "Raid de moyenne envergure réussi"
mongol.26.d:0 "Des semaines de planification et de préparation minutieuses ont porté leurs fruits : plusieurs de nos divisions ont percé la frontière ennemie en différents points, se sont regroupées, ont vaincu la garnison locale d’une base militaire, infiltré les entrepôts de munitions et récupéré divers modèles d’équipement moderne à notre profit. \n\nAprès le déclenchement de l’alerte, nos unités ont dissimulé les armes obtenues et les ont transférées en toute sécurité de l’autre côté de la frontière par des couloirs établis et sécurisés. Le commandant local rapporte avec enthousiasme que ce matériel peut équiper nos troupes ou être utilisé à des fins scientifiques."
mongol.26.a:0 "Encore plus d’équipement ! Magnifique !"
mongol.26.b:0 "Très bien. Utilisons-les pour des tests."

mongol.27.t:0 "Raid de moyenne envergure repoussé"
mongol.27.d:0 "L’avance rapide et quelque peu téméraire de nos forces a été interceptée par une patrouille de sécurité frontalière ennemie, qui a immédiatement ouvert le feu. Nos troupes ont tenté de conserver l’avantage du terrain et d’organiser une ligne défensive avant l’arrivée des renforts adverses. \n\nMais l’ennemi connaissait visiblement nos tactiques : avant que notre contre-attaque ne commence, une manœuvre de flanc exécutée par une cavalerie ennemie a semé le chaos sur nos flancs mal défendus et décimé une partie de nos forces au corps-à-corps. Le reste de l’unité a dû rassembler les survivants, établir une tête de pont en direction de notre territoire et battre en retraite à la nuit tombée."
mongol.27.a:0 "Aujourd’hui, de nombreuses mères pleureront leurs fils..."
mongol.28.t:0 "Avancée du détachement de raid retardée"
mongol.28.d:0 "La première phase de l’opération s’est déroulée comme prévu dans la plupart des zones d’intérêt, à une exception près mais cruciale. Le régiment devait progresser vers une position ennemie fortifiée et couper les lignes de communication, donnant ainsi au reste de nos forces le temps nécessaire pour infiltrer la zone contestée sans trop de difficultés. \n\nMais l’alerte rouge fut déclenchée lorsqu’un fusil enrayé d’un de nos soldats tira un coup apparemment accidentel, forçant l’ennemi à engager un combat rapproché avec nos troupes. La fenêtre d’opportunité s’est refermée et, faute de signal pour poursuivre, les forces restantes ont dû battre en retraite vers leurs positions initiales, tandis que l’escouade déjà retranchée réussissait à évacuer la totalité du contingent militaire pour rendre compte au commandement de ce fâcheux incident."
mongol.28.a:0 "Améliorons nos régiments."
mongol.28.b:0 "Bien. Trouvons une autre tactique à apprendre."

mongol.29.t:0 "Raid de moyenne envergure détruit"
mongol.29.d:0 "Ces envahisseurs naïfs pensaient pouvoir pénétrer nos terres et menacer notre peuple par de misérables attaques contre des cibles civiles et militaires ! Mais les patrouilles de sécurité frontalière rapportent la destruction complète du détachement ennemi qui voulait piller nos contrées ! \n\nLeurs mouvements ont été détectés et interceptés dans une zone où l’avantage stratégique était de notre côté, permettant à une escouade de cavalerie courageuse de les prendre à revers et de frapper au cœur de ce fléau, forçant les survivants à battre en retraite. Les trophées sont remis aux soldats, tandis que le commandant local reçoit une nouvelle médaille !"
mongol.29.a:0 "Nous sommes fiers de notre milice et de notre armée !"

mongol.30.t:0 "Des divisions [MON.GetAdjective] pillent nos dépôts de munitions"
mongol.30.d:0 "Après l’échec de la garnison locale à répondre par les canaux habituels de communication, la mobilisation générale des forces armées de la région fut décrétée et la loi martiale instaurée, avant que la panique ne se répande parmi la population. \n\nQuelques heures plus tard seulement, l’arrivée de notre cavalerie révéla toute l’ampleur de l’horreur : l’installation entière ne contenait plus ni matériaux de production, ni machines, ni équipements récemment fabriqués et stockés. Face à de tels dégâts pour l’économie et nos capacités militaires, il est vital de veiller à ce qu’une telle tragédie ne se reproduise jamais."
mongol.30.a:0 "Nous aurons beaucoup à reconstruire désormais."

mongol.31.t:0 "Raid intercepté"
mongol.31.d:0 "L’une de nos régions fortifiées a déclenché l’alerte générale lorsqu’un détachement ennemi infiltré tira un coup de feu d’origine inconnue. Quoi qu’il en soit, des soldats furent déployés pour repousser l’ennemi de nos lignes de défense retranchées. \n\nLes combats se sont poursuivis plusieurs heures sans qu’aucun camp ne prenne l’avantage, jusqu’à ce que l’ennemi se replie, laissant le garnison locale s’interroger sur les véritables motivations d’un raid aussi téméraire. D’autres patrouilles frontalières signalent également une augmentation de l’activité ennemie dans leurs secteurs."
mongol.31.a:0 "Nous sommes toujours prêts à repousser leurs assauts !"
mongol.31.b:0 "Parfait ! Tirons les leçons de l’ennemi."

####################### ÉVÉNEMENTS POLITIQUES ####################

mongol.35.t:0 "Que faire de Genden ?"
mongol.35.d:0 "Lors de la récente Assemblée du Grand Khural, les protocoles de notre mission diplomatique furent rendus publics, révélant toute la controverse entourant les négociations et les méthodes de certains membres de la délégation. \n\nUn nom fut mentionné plus que les autres : celui de l’ancien Premier ministre Peljidiin Genden. Si certains voient dans son attitude un signe de volonté de fer et d’indépendance, d’autres considèrent ses manières provocantes comme une marque d’incompétence, d’ignorance et de manque de finesse, suggérant qu’un tel homme ne peut occuper de hautes fonctions politiques à l’avenir. \n\nPlusieurs options s’offrent à nous : quelle sera la décision du sage [MON.getLeader] ?"
mongol.35.a:0 "Le maintenir en poste comme ministre des Affaires étrangères."
mongol.35.b:0 "Le forcer à une retraite anticipée."
mongol.35.c:0 "Un tel comportement est intolérable : arrêtez-le… ou mieux, éliminez-le !"

mongol.36.t:0 "Mort de Gelegdorjiin Demid"
mongol.36.d:0 "Ce matin, le gouvernement a reçu une nouvelle terrifiante depuis la gare ferroviaire de Taïga, à Novossibirsk : l’ensemble de la délégation, comprenant le stratège militaire Gelegdorjiin Demid, le commandant de corps G. Djantsanhororlos, le secrétaire de l’ambassade [MON.getAdjective] en [SOV.getNameDef] Gombosuren, le traducteur en chef de l’armée T. Dorjiiev et son épouse L. Dagsma, a été retrouvé mort dans les wagons-lits du train la veille au soir. \n\nSelon le rapport des experts criminels [SOV.GetAdjective], la cause du décès serait une intoxication alimentaire due à du poisson en conserve mal stocké. Un drame terrible pour notre pays… mais peut-être une aubaine pour quelqu’un d’autre ? L’avenir nous le dira..."
mongol.36.a:0 "Une coïncidence suspecte ?!"

mongol.37.t:0 "Bat-Ochiryn Eldev-Ochir exprime ses inquiétudes"
mongol.37.d:0 "L’un des chefs de l’opposition de gauche, Bat-Ochiryn Eldev-Ochir, s’est présenté ce soir au bureau de [MON.getLeader] après la fin de la journée de travail pour discuter d’un « sujet très urgent ». \n\nÉclairé par la lampe de bureau, Eldev-Ochir expliqua à voix basse que de nombreux cadres du parti craignaient pour leur vie, compte tenu de l’évolution rapide du climat politique. Il évoqua aussi le danger qu’un nouveau poste, militaire ou gouvernemental, confié à Choibalsan, n’accroisse encore son emprise de fer sur le pays, et que, combinée à ses contacts au NKVD, celle-ci ne plonge à nouveau la nation dans une décennie de violences politiques. Cela doit être empêché."
mongol.37.a:0 "Choibalsan est trop dangereux, préparons une insurrection."
mongol.37.b:0 "Rassurez-le, tout va bien."

mongol.38.t:0 "Les gauchistes s’emparent du pouvoir !"
mongol.38.d:0 "La séance matinale du Khural d’État fut interrompue par une foule rassemblée devant le bâtiment pour protester contre les lois récemment adoptées, jugées favorables uniquement à l’élite gouvernementale et non au peuple. La garde parlementaire fut rapidement renforcée pour éviter toute nouvelle intrusion dans le processus législatif. \n\nAprès plusieurs heures de cris, les meneurs de la foule s’avancèrent et accusèrent les députés d’agir pour leur intérêt personnel, preuves de corruption à l’appui. Profitant de la diversion, quelques hommes armés s’infiltrèrent dans le bâtiment, coupèrent les communications et dispersèrent la séance. Peu après, [MON.getLeader] démissionna de son poste de Premier ministre et transmit ses pouvoirs au ministre « provisoire » Bat-Ochiryn Eldev-Ochir."
mongol.38.a:0 "C’est pour le bien commun."

mongol.39.t:0 "Choibalsan lance un coup d’État !"
mongol.39.d:0 "En dépit de l’annonce officielle du Petit Khural d’État selon laquelle la politique du pays s’orienterait de nouveau vers la gauche pour les cinq années à venir, une partie importante de la population rurale, sous l’influence d’éléments pro-[SOV.getAdjective], organisa de vastes manifestations à travers le pays. Heurtant la police, certains manifestants s’emparèrent d’armes et commencèrent à piller des dépôts de munitions mal défendus, prétendument pour former des milices irrégulières contre le régime légitime ! \n\nNous ne pouvons permettre que des militants imposent leur volonté par la force. Le moment est venu de rétablir l’ordre sur les terres que nous sommes destinés à gouverner !"
mongol.39.a:0 "Aux armes !"

mongol.40.t:0 "La Mongolie cherche des liens plus étroits"
mongol.40.d:0 "Conscient de la fragilité de son régime nouvellement établi, [MON.getNameDef] a envoyé une mission diplomatique afin de convaincre nos responsables que leur interprétation du communisme s’accorde avec la nôtre. \n\nLa délégation a également présenté plusieurs projets de traité pour renforcer les liens entre nos deux pays et aligner la ligne politique de la Mongolie sur celle définie par [ROOT.getNameDef] et son dirigeant [SOV.getLeader], transformant de fait leur régime en État sous notre supervision."
mongol.40.a:0 "Très bien, le moment est venu."
mongol.40.b:0 "Ce n’est pas un enjeu stratégique."

mongol.41.t:0 "Les [SOV.getAdjective] acceptent des liens plus étroits"
mongol.41.d:0 "Notre proposition de coopération renforcée entre nos deux pays a été accueillie avec enthousiasme par les officiels [SOV.getAdjective]. Après plusieurs tours de discussions sur la conduite des affaires internes et externes, il fut convenu de signer le « Traité de guidance et d’assistance [SOV.getAdjective]-[MON.getAdjective] » le lendemain. \n\nCet accord consacre le contrôle [SOV.getAdjective] sur notre appareil d’État, nous permettant de réorienter nos efforts gouvernementaux vers le renforcement de notre position sur la scène internationale et l’influence de nos voisins directs, tout en promouvant la cause révolutionnaire à l’étranger."
mongol.41.a:0 "Excellente nouvelle."

mongol.42.t:0 "Les Soviétiques rejettent la demande"
mongol.42.d:0 "En dépit de nos meilleurs efforts et de nos promesses sincères d’alliance perpétuelle, [SOV.getLeader] a rejeté notre humble proposition, affirmant que « l’interprétation [MON.getAdjective] des principes du marxisme-léninisme comporte trop de différences idéologiques » pour permettre actuellement un renforcement de la coopération entre nos gouvernements. \n\nFace à ce refus inattendu, il nous faudra renforcer notre propre base diplomatique et promouvoir nos idéaux communistes par nos propres moyens."
mongol.42.a:0 "Alors nous le ferons seuls."

mongol.49.t:0 "La conspiration cachée ?"
mongol.49.d:0 "Les moyens révolutionnaires de notre régime communiste sont depuis longtemps remis en cause par certaines masses populaires, dont beaucoup sont d’origine étrangère, de tradition religieuse ou d’esprit non conformiste. Malgré nos efforts pour détourner leurs élites des idées capitalistes, impérialistes ou autocratiques, leurs voix continuent de résonner et d’ébranler la loyauté du peuple. \n\nLes premières enquêtes indiquent que cette propagande peut être attribuée à un cercle restreint de personnalités populaires toutes liées d’une manière ou d’une autre. \n\nSoupçonnant une coordination, le ministre de l’Intérieur Khorloogiin Choibalsan a élaboré un plan pour décapiter la conspiration et préserver l’État de nouvelles révoltes."
mongol.49.a:0 "Le moment est venu."

mongol.50.t:0 "La question de l’intelligentsia"
mongol.50.d:0 "L’instruction de notre population progresse mieux que jamais, mais de nouveaux livres et manuels semblent avoir semé des idées capitalistes ou nationalistes dans l’esprit de certains citoyens. \nDe jeunes spécialistes revenus d’échanges en [SOV.GetNameDef] enrichissent nos écoles, instituts et centres de recherche. Mais une question demeure : quelle est leur loyauté ? \n\nCombien portent en eux les germes de la révolution, et combien sont dignes de confiance ? Nous devons en avoir le cœur net, et les méthodes existent..."
mongol.50.a:0 "Lancer de vastes inspections par troïkas."
mongol.50.b:0 "Nous avons d’autres priorités."

mongol.51.t:0 "Remaniement du parti"
mongol.51.d:0 "Notre parti est divisé entre gauchistes comme Choibalsan, droitiers comme Anandyn Amar, et « modérés » tels que l’ancien Premier ministre Peljidiin Genden. Ces divisions extrêmes ont mené aux réformes capitalistes de 1926-1928 puis aux dévastations causées par la collectivisation d’extrême gauche de 1928-1932. \n\nDe tels revirements nuisent à la vie du peuple. Les causes sont multiples, mais une est évidente : notre parti est infiltré par des agents et collaborateurs de [JAP.GetNameDef] ou de [CHI.GetNameDef]. Cela est intolérable : certains membres suspects devront être écartés du gouvernement, d’une manière ou d’une autre."
mongol.51.a:0 "Examiner chacun et vérifier sa loyauté."
mongol.51.b:0 "Et si le problème venait de notre vision des choses ?"

mongol.52.t:0 "Le problème des lamas"
mongol.52.d:0 "Le bouddhisme est profondément enraciné dans l’esprit et le cœur de nos citoyens : 10 % de la population du pays est composée de lamas et de moines. Ce bloc de pouvoir ne peut être ignoré : les rébellions de 1932 et le complot Lkhümbe de 1933 montrent clairement la nécessité d’intervenir avant que la situation ne s’aggrave. Heureusement, nous avons déjà l’expérience de la limitation du pouvoir lamaïque depuis l’ascension de Choibalsan. \n\nRester fidèle aux [SOV.getAdjective], à leur dirigeant [SOV.getLeader] et aux principes du communisme implique que nous devrons mener cette opération dès que possible."
mongol.52.a:0 "Nous n’avons pas d’autre choix."
mongol.52.b:0 "Le bouddhisme porte le véritable esprit du peuple [MON.getAdjective] !"

mongol.53.t:0 "La question du leadership"
mongol.53.d:0 "Nos informateurs ont découvert un complot de prise de pouvoir orchestré par des collaborateurs pro-[JAP.getAdjective], qui ont introduit des armes par des zones frontalières mal gardées et les ont stockées en des lieux connus. Certaines télégrammes mentionnent de « hauts échelons du pouvoir », tandis qu’une lettre récemment saisie désigne l’actuel chef du pays, [MON.getLeader]. \n\nDes enquêtes plus poussées ont également révélé que d’autres politiciens entretenaient des contacts réguliers avec des éléments contre-révolutionnaires. \n\nAvec ces preuves en main, nous devons poursuivre les responsables et nommer un nouveau président pour les temps incertains à venir."
mongol.53.a:0 "Choibalsan est le seul choix logique."

mongol.54.t:0 "[MON.getLeader] est tombé malade !"
mongol.54.d:0 "Hier soir, [MON.getLeader] travaillait comme à l’accoutumée sur un décret gouvernemental concernant la situation intérieure de notre nation prospère. Comme il ne répondait plus à son secrétaire, ce dernier entra dans le bureau et trouva le « Géant de la pensée » effondré sur le sol. \n\nTransporté d’urgence à l’hôpital d’Oulan-Bator, il fut examiné par les médecins locaux, qui diagnostiquèrent une grave affection l’empêchant de gouverner efficacement à l’avenir. \n\nOn ignore si son état s’aggravera, mais il vaut mieux rester vigilants."
mongol.54.a:0 "Que pouvons-nous y faire ?"

mongol.55.t:0 "Un nouveau successeur au parti ?"
mongol.55.d:0 "Depuis longtemps, des rumeurs circulent sur la santé physique et mentale de [MON.getLeader], sur la manière dont elle affecte ses décisions et sur le prestige international du pays représenté par [MON.getHerHis]. \n\nIl semble que notre dirigeant ait anticipé et envisagé de transférer le pouvoir à une nouvelle génération de communistes, dont certains devraient bientôt redéfinir la politique de l’État. \n\nAprès mûre réflexion, [MON.getLeader] a décidé que le président du parti serait..."
mongol.55.a:0 "Tsedenbal, car il a montré sa loyauté à la Cause."
mongol.55.b:0 "Un président ? Pourquoi pas une présidente ?"

mongol.56.t:0 "La Mongolie demande son annexion !"
mongol.56.d:0 "Nos liens économiques et notre influence politique ont atteint un sommet inédit : le nouveau gouvernement [MON.getAdjective] a publié un décret où sa jeune Assemblée annonce sa volonté de rejoindre [SOV.getNameDef] en tant que république intégrée ou okroug autonome. \n\nMalgré nos liens fraternels, il est essentiel de préserver notre réputation de Grande Puissance non oppressive. Si nous ne voulons pas que les autres nations nous voient en impérialistes, mieux vaut laisser ces âmes pures à leur destin."
mongol.56.a:0 "Et pourquoi pas ?"
mongol.56.b:0 "Nous ne sommes en aucun cas des impérialistes !"

mongol.57.t:0 "Les [SOV.getAdjective] ont rejeté notre demande"
mongol.57.d:0 "Affirmant que la fraternité entre nos nations sera plus profitable si les deux États conservent leur indépendance, [SOV.getLeader] a poliment décliné la demande de notre jeune Assemblée. \n\nDans un télégramme secret, l’Autorité centrale nous a fait savoir que la pression internationale sur le gouvernement [SOV.getAdjective] est déjà trop forte : ils préfèrent donc maintenir le statu quo diplomatique."
mongol.57.a:0 "Si tel est leur souhait..."

#Khalkhin Gol
mongol_khalkin_gol.1.t:0 "Préparatifs de manœuvres [MON.getAdjective] détectés !"
mongol_khalkin_gol.1.d:0 "Il y a quelques heures, notre quartier général local a reçu un rapport indiquant qu’une petite escouade de cavalerie d’origine apparemment [MON.getAdjective], composée d’environ 70 à 90 hommes, avait franchi la frontière près de la rivière Nomonhan et s’y était installée, signifiant clairement que la zone est désormais sous leur contrôle. \n\nQuelques heures plus tard, notre régiment de cavalerie les a forcés à battre en retraite, mais les envahisseurs sont revenus plus nombreux encore. Les renseignements indiquent un important regroupement de troupes de leur côté de la frontière, semblant prêtes à lancer une opération militaire dans la région."
mongol_khalkin_gol.1.a:0 "Demander une aide étrangère"
mongol_khalkin_gol.1.b:0 "Mobiliser les forces !"

mongol_khalkin_gol.2.t:0 "Victoire [MON.getAdjective] à Khalkhin Gol !"
mongol_khalkin_gol.2.d:0 "Nos revers initiaux face aux impérialistes ont fini par désillusionner le haut commandement de [761.Controller.getNameDef], puisque dans les jours suivants, certains de leurs généraux imprudents ont lancé à leurs soldats des ordres suicidaires, les forçant à attaquer encore et encore des positions retranchées de nos soldats protégés par quelques mitrailleuses bien placées… avec pour résultat de lourdes pertes humaines et matérielles. \n\nNous avons également réussi à capturer quelques chars et à les étudier pour développer ou améliorer nos propres modèles blindés."
mongol_khalkin_gol.2.a:0 "L’affaire est enfin réglée"
mongol_khalkin_gol.2.b:0 "Une grande victoire pour notre peuple !"

mongol_khalkin_gol.3.t:0 "Victoire [761.Controller.getAdjective] à Khalkhin Gol !"
mongol_khalkin_gol.3.d:0 "La phase initiale de l’invasion fut brillamment menée par les troupes [MON.getAdjective], qui avancèrent rapidement dans la zone contestée de Nomonhan et occupèrent la rive gauche du fleuve Khalkhin Gol, remplaçant les bornes frontalières et renforçant les fortifications locales. \n\nCela n’a toutefois pas empêché les forces armées de [761.Controller.getNameDef] de reprendre les positions quelques jours plus tard et de repousser toutes les contre-attaques, affirmant ainsi leur domination dans la région. \n\nAprès plusieurs semaines de combat, les ambassadeurs [MON.getAdjective] ont présenté leurs excuses et accepté l’état de la frontière tel quel, signifiant une victoire décisive de [761.Controller.getAdjective]."
mongol_khalkin_gol.3.a:0 "Le conflit est terminé. Pour l’instant."
mongol_khalkin_gol.3.b:0 "Nous aurons besoin de temps pour nous en remettre !"

mongol_khalkin_gol.4.t:0 "Aucune victoire décisive obtenue..."
mongol_khalkin_gol.4.d:0 "La rotation constante des troupes, combinée à l’utilisation intensive des radios, à la reconnaissance aérienne et à la bonne gestion des troupes de soutien, a empêché chaque camp de percer les lignes ennemies et donc d’obtenir une percée décisive susceptible de faire basculer la bataille. \n\nDes semaines de combat ont épuisé les deux parties, qui ont convenu d’un cessez-le-feu et accepté l’ancienne ligne de démarcation, prolongeant ainsi le statu quo."
mongol_khalkin_gol.4.a:0 "Ce différend frontalier reviendra sûrement."

mongol_khalkin_gol.5.t:0 "Escalade à Khalkhin Gol !"
mongol_khalkin_gol.5.d:0 "On ignore qui eut l’idée le premier, mais certains soldats téméraires ont décidé de déborder l’ennemi déjà débordé et se sont engagés sur de nouveaux fronts ! Ce comportement a conduit le conflit à s’étendre à d’autres zones, aggravant la situation et forçant notre armée à envoyer toujours plus de troupes dans la région contestée. \n\nCe matin, un ambassadeur étranger a livré une note exigeant que nos troupes quittent la zone disputée sous peine d’une déclaration de guerre officielle dans les prochaines heures si nous refusons. \n\nDe toute évidence, notre ennemi veut la guerre, et nous allons lui montrer comment on règle ces affaires !"
mongol_khalkin_gol.5.a:0 "Mobilisez toutes les forces disponibles !"

mongol_khalkin_gol.6.t:0 "Intérêt [SOV.getAdjective] pour les manœuvres"
mongol_khalkin_gol.6.d:0 "Les rapports de nos partenaires [SOV.getNameDef] indiquent que leurs responsables suivent de près les tensions entre nos forces et celles de [761.Controller.getAdjective] dans la région. Si l’une ou l’autre des parties augmente sa présence dans les jours ou semaines à venir, ils sont prêts à envoyer un petit contingent pour nous aider. \n\nTout a un prix, cependant, et une telle intervention renforcerait inévitablement leur influence dans nos forces armées, que nous le souhaitions ou non. À moins que nous soyons capables de gérer seuls cette menace grandissante..."
mongol_khalkin_gol.6.a:0 "Inviter les conseillers [SOV.getAdjective]"
mongol_khalkin_gol.6.b:0 "Nous pouvons régler cela seuls"

#Événements Mongolie démocratique
mongol_democratic.1.t:0 "Attaque contre le Grand Khural !"
mongol_democratic.1.d:0 "Les troubles civils dans les campagnes ont suscité de graves inquiétudes chez les représentants des différents aimags, réunis pour une session extraordinaire du Grand Khural annoncée il y a quelques semaines. \n\nTout se déroulait normalement, jusqu’à ce que les délégués de Khentii et Dornod prennent la parole pour un discours passionné sur les moyens révolutionnaires et la fidélité aux idéaux communistes, interrompu soudainement par un groupe d’hommes armés qui abattirent plusieurs gardes du Khural et lancèrent des grenades dans la foule paniquée. \n\nDans le chaos, de nombreux députés furent tués avant que les intrus ne soient abattus par les gardes restants. \n\nUn tel acte ne peut signifier qu’une chose :"
mongol_democratic.1.a:0 "Un attentat terroriste !"
mongol_democratic.1.b:0 "Une intervention !"

mongol_democratic.2.t:0 "Tentative de coup d’État soutenue par les [SOV.getAdjective]"
mongol_democratic.2.d:0 "Déçus par les récentes politiques, divers groupes ont ouvertement commencé à protester et à organiser des manifestations exigeant un changement de régime et l’abandon des réformes de [ROOT.getLeader] ! \n\nSi auparavant la police avait réussi à disperser les manifestants par des moyens pacifiques ou non, cette fois certains étaient armés et disposaient d’engins incendiaires d’origine inconnue, forçant la police à se replier vers le quartier gouvernemental d’Oulan-Bator. La foule installa alors des tentes devant le bureau du Premier ministre, exigeant sa démission. \n\nQuelques jours plus tard, la police, renforcée par des milices locales, réussit à disperser la foule et à arrêter les meneurs, qui avouèrent préparer une rébellion pro-[SOV.getAdjective] dans l’Ouest du pays ! Nos informateurs confirment que l’ennemi doit être écrasé d’un seul coup par nos forces armées."
mongol_democratic.2.a:0 "Il est temps de trancher la tête du serpent !"

mongol_democratic.3.t:0 "[From.GetNameDefCap] demande des garanties"
mongol_democratic.3.d:0 "Prétendant que les fondements démocratiques n’ont jamais eu de prise solide en Asie centrale, les diplomates [FROM.getAdjective] ont approché nos ambassadeurs lors d’une réunion internationale et ont demandé une garantie officielle de soutien « pour la stabilité et la prospérité de la région ». \n\nMalgré certaines divergences idéologiques, la distance géographique et des différends passés, leur gouvernement semble prêt à renforcer ses institutions diplomatiques et à entrer sur la scène mondiale sous la protection de [ROOT.getNameDef]. Il ne reste qu’à annoncer publiquement notre soutien."
mongol_democratic.3.a:0 "Ils seront un grand allié à l’avenir"
mongol_democratic.3.b:0 "Pardon, QUI demande notre soutien ?"

mongol_democratic.4.t:0 "[FROM.getNamedefCap] accepte de nous protéger"
mongol_democratic.4.d:0 "Affirmant l’importance de sécuriser les institutions démocratiques à travers le monde, l’ambassadeur [FROM.getAdjective] a livré un accord signé stipulant : \n\n« Dès à présent et jusqu’à l’aube de la civilisation, tant que [ROOT.getNamedef] s’efforcera de préserver la démocratie en son sein et autour d’elle, [FROM.getNamedef] mettra toute sa puissance militaire et économique au service de la liberté et de l’autodétermination, respectera les frontières et poursuivra des liens diplomatiques plus étroits ! » \n\nUne victoire diplomatique claire et une nouvelle garantie pour notre sécurité intérieure sur la scène mondiale, hourra !"
mongol_democratic.4.a:0 "La diplomatie triomphe !"

mongol_democratic.5.t:0 "[FROM.getNamedefCap] refuse de nous protéger"
mongol_democratic.5.d:0 "Malgré nos efforts, l’ambassadeur étranger a regretté d’informer notre délégation que [FROM.getNamedef] n’a aucun moyen diplomatique ou militaire d’assurer la protection des institutions démocratiques en [ROOT.getNamedef]. \n\nCertains députés radicaux doutent même que [FROM.getLeader] soit capable de situer notre pays sur une carte, vu la réponse officielle transmise par leur administration."
mongol_democratic.5.a:0 "On dirait que nous sommes seuls..."
mongol_democratic.6.t:0 "[MON.getNamedefCap] rappelle ses diplomates"
mongol_democratic.6.d:0 "Ce matin, une épaisse fumée noire a été aperçue s’élevant au-dessus de l’ambassade [MON.getAdjective], indiquant clairement que certains de leurs fonctionnaires brûlaient ou détruisaient des documents de leur pays. \n\nÀ la demande officielle d’explications, les représentants de [MON.getNameDef] ont présenté un décret spécial ordonnant « la fermeture immédiate de tous les consulats et ambassades de [MON.getNameDef] présents en [ROOT.getNameDef] », signifiant ainsi la rupture officielle des relations diplomatiques entre nos deux nations de leur propre initiative."
mongol_democratic.6.a:0 "La guerre approche-t-elle ?"

mongol_democratic.7.t:0 "[MON.getNamedefCap] rappelle ses diplomates de [FROM.getNamedefCap]"
mongol_democratic.7.d:0 "La position [MON.getAdjective] face aux ennemis du peuple n’a rien de nouveau, mais leur récente décision diplomatique a stupéfié beaucoup de nos citoyens : [MON.getNamedefCap] a publiquement annoncé qu’il ne mènerait plus aucune négociation diplomatique avec des régimes similaires à celui de [FROM.getNamedefCap]. \n\nDe plus, les forces armées [MON.getAdjective] semblent mobiliser une part importante de leurs réserves, tandis que les diplomates quittent activement le pays désormais isolé sur le plan international."
mongol_democratic.7.a:0 "Il est temps d’en finir avec cette menace"

mongol_democratic.8.title:0 "Mission diplomatique [MON.getAdjective] ouvre des négociations d’alliance"
mongol_democratic.8.desc:0 "\nNos services de renseignement signalent une activité accrue du ministère [MON.getAdjective] des Affaires étrangères, ses diplomates voyageant dans d’autres pays dans ce qui semble être un effort pour établir des relations amicales avec de potentiels alliés. \n\nOn ignore encore si ces négociations aboutiront ou non, mais nous devons rester attentifs à l’évolution de la situation et nous préparer au pire pour nous-mêmes."
mongol_democratic.8.a:0 "Restons vigilants"

mongol_democratic.10.t:0 "La Mongolie demande une réconciliation"
mongol_democratic.10.d:0 "Une délégation mongole a établi des contacts avec la Commission des affaires mongoles et tibétaines, tentant de résoudre les différends persistants concernant le rôle de la Mongolie extérieure et nos revendications à son égard. \n\nBien que officiellement neutre, [MON.getNamedef] semble peu à peu dériver vers notre sphère d’influence, offrant une opportunité unique d’allier la plus grande nation des steppes centrales, qui détient la clé de l’Extrême-Orient russe. \n\nDevons-nous mettre nos ambitions de côté et garantir la stabilité de la frontière nord ?"
mongol_democratic.10.a:0 "Mettons nos différends de côté, pour l’instant"
mongol_democratic.10.b:0 "Nous avons d’autres projets pour eux"

mongol_democratic.11.t:0 "[FROM.getNamedefCap] accepte la réconciliation"
mongol_democratic.11.d:0 "Reconnaissant l’importance stratégique de notre pays et souhaitant maintenir notre loyauté à leur cause, les responsables [FROM.getAdjective] de la Commission mongole ont annoncé la fin des hostilités passées et le rétablissement de relations, sinon amicales, du moins neutres entre nos deux nations. \n\nSe mettre à l’écart de la Chine pourrait aliéner d’autres puissances régionales, mais est-ce vraiment important ?"
mongol_democratic.11.a:0 "La diplomatie triomphe !"

mongol_democratic.12.t:0 "[FROM.getNamedefCap] n’est pas intéressé par notre initiative de réconciliation"
mongol_democratic.12.d:0 "Notre délégation a reçu un refus poli de la part des représentants [FROM.getAdjective], qui reconnaissent la lutte de notre peuple pour la reconnaissance et l’autodétermination, mais dont le gouvernement a actuellement « des affaires plus urgentes à traiter et ne peut donc se consacrer à ces initiatives diplomatiques ». \n\nNous avons fait de notre mieux pour raisonner le gouvernement central, et s’ils ne veulent pas coopérer, peut-être que d’autres puissances régionales le voudront."
mongol_democratic.12.a:0 "Nous envisagerons d’autres options"

mongol_democratic.15.t:0 "[FROM.getNamedefCap] fait appel à nos responsables pour rejeter les revendications"
mongol_democratic.15.d:0 "Les responsables [FROM.getAdjective], cherchant à renforcer la coopération entre nos nations, ont lancé un appel à la Commission des affaires mongoles et tibétaines, annonçant leur désir d’apaiser les tensions entre nos deux nations afin d’assurer une coexistence pacifique et prospère. \n\nLe chef de la délégation a déclaré que, depuis d’innombrables années, [ROOT.getNameDef] revendique les terres de la Mongolie extérieure comme une région autonome de la Chine proprement dite, une question débattue au regard des principes d’autodétermination dans leur pays. \n\nPréférant le rapprochement à l’escalade, leur nation est prête à offrir certaines concessions pour revoir ces revendications. Un accord mutuellement bénéfique, semble-t-il."
mongol_democratic.15.a:0 "Exiger une démonstration de soutien politique"
mongol_democratic.15.b:0 "Demander des livraisons d’armes"
mongol_democratic.15.c:0 "Demander des concessions industrielles"
mongol_democratic.15.e:0 "Exiger le transfert de l’industrie militaire"

mongol_democratic.16.t:0 "[FROM.getNamedefCap] exige une démonstration de soutien politique"
mongol_democratic.16.d:0 "La loyauté est essentielle en ces temps incertains et [FROM.getLeader], en en prenant conscience, a exigé une preuve publique de fidélité à la lutte politique de [FROM.getNameDef] sous la forme d’une visite diplomatique de vassalité. \n\nBien qu’elle semble coûteuse, nous avons été assurés que d’autres formes de « paiement » auraient pu être encore plus dures pour nous."
mongol_democratic.16.a:0 "Un engagement nécessaire"

mongol_democratic.17.t:0 "[FROM.getNamedefCap] demande des armes"
mongol_democratic.17.d:0 "Souhaitant renforcer son armée permanente, [FROM.getLeader] nous a demandé de fournir du matériel militaire et une force de garnison composée des « meilleurs des meilleurs », qui seraient envoyés comme volontaires pour combattre dans les guerres [FROM.getAdjective]. \n\nNos diplomates ont toutefois réussi à négocier la seconde partie, nous permettant de n’envoyer que les armes demandées."
mongol_democratic.17.a:0 "Un bon accord ?"

mongol_democratic.18.t:0 "[FROM.getNamedefCap] demande la relocalisation d’une usine civile"
mongol_democratic.18.d:0 "La nationalisation de notre industrie au début de la décennie a fait fuir les capitaux [FROM.getAdjective] et ruiné nombre de commerçants de [FROM.getNameDef]. \n\nPrétendant que ce développement malheureux doit être corrigé, [FROM.getLeader] a demandé que les « biens légitimes » leur soient restitués..."
mongol_democratic.18.a:0 "Un sacrifice nécessaire"

mongol_democratic.19.t:0 "[FROM.getNamedefCap] exige le transfert d’usines militaires"
mongol_democratic.19.d:0 "La clique militaire de [FROM.getNameDef] semble avoir une influence considérable sur le gouvernement, car ses responsables exigent le transfert d’installations militaires dans la région d’intérêt si nous voulons que leurs visées expansionnistes soient abandonnées. \n\nDans ces conditions, ils renonceraient à toute idée d’expansion… pour ce prix exorbitant."
mongol_democratic.19.a:0 "Eh bien..."

mongol_democratic.20.t:0 "[FROM.getNameDefCap] demande protection"
mongol_democratic.20.d:0 "Nous avons reçu une demande particulière de [FROM.getNameDef], dont les responsables, adoptant une position fortement pro-[ROOT.getAdjective], ont exprimé leur désir de rejoindre le royaume de [ROOT.getNameDef] en tant que région autonome, contribuant grandement à la sécurité de la frontière extérieure et étendant notre influence dans la Grande Steppe. \n\nQuelle sera la décision finale ? Accepterons-nous de réintégrer cette région séparatiste ?"
mongol_democratic.20.a:0 "Bien sûr, pourquoi refuser ?"
mongol_democratic.20.b:0 "Nous ne sommes pas intéressés"

mongol_democratic.21.t:0 "Statut de protectorat confirmé"
mongol_democratic.21.d:0 "La haute autorité de [FROM.getLeader] nous a assuré que notre demande avait été examinée et acceptée immédiatement, sans aucune hésitation ! \n\nDans son discours matinal à la nation, [FROM.getLeader] a annoncé une journée de célébration pour le retour d’une partie de l’ancienne frontière extérieure dans le royaume de la Grande Chine. Cette région contribuera désormais pleinement à la croissance économique, à la puissance militaire et à la réunification de toute la nation chinoise ! Une foule en liesse a accueilli ses « frères et sœurs perdus depuis longtemps » sous la bannière de l’union chinoise !"
mongol_democratic.21.a:0 "Un grand jour pour notre peuple !"

mongol_democratic.22.t:0 "Statut de protectorat rejeté"
mongol_democratic.22.d:0 "Nos meilleurs diplomates et leurs promesses sincères n’ont pas réussi à convaincre les obstinés responsables [FROM.getAdjective] de nous intégrer comme région autonome. \n\nPrétendant que « ce n’est pas dans leur intérêt de subvertir le contrôle sur une ancienne province séparatiste », notre deuxième demande fut elle aussi rejetée !"
mongol_democratic.22.a:0 "Ils ne sont pas intéressés ?!"

mongol_democratic.24.t:0 "La Mongolie soulève la question de la Touva"
mongol_democratic.24.d:0 "La rhétorique agressive des responsables [MON.getAdjective] envers leurs voisins, combinée à leur position pro-chinoise, a suscité de vives inquiétudes parmi nos politiciens. \n\nIl semble que [MON.getNameDef] intensifie sa propagande en faveur d’un État mongol unifié dans les frontières de 1911, incluant l’Okrug d’Ouriankhai, patrie de nombreux Touvains et Russes. \n\nNous devons tout mettre en œuvre pour maintenir cette région dans nos mains en ces temps incertains et dangereux."
mongol_democratic.24.a:0 "Nous ferons de notre mieux pour les contenir"
#Événements de Genden
mongol_genden.1.t:0 "Annonce de la politique « Enrichissez-vous »"
mongol_genden.1.d:0 "La politique économique du « Nouveau Tournant » et ses succès furent largement freinés par l’abolition du programme gouvernemental officieux « Enrichissez-vous », qui encourageait tous les citoyens du pays à accumuler du capital pour la stabilité personnelle et collective.\n\nCherchant à renforcer de nouveau sa position dans le pays, Genden veut unir et enrichir son peuple par tous les moyens possibles, peu importe la dureté des conséquences potentielles.\n\nLa nouvelle politique annoncée devrait être appliquée à travers tout le pays pendant un an, en aidant les paysans pauvres et les ouvriers, le Comité central supervisant sa mise en œuvre au moyen de rapports économiques mensuels.\n\nSeul l’avenir dira si elle sera couronnée de succès."
mongol_genden.1.a:0 "En avant, camarades !"

mongol_genden.2.t:0 "Des citoyens fondent un nouvel atelier"
mongol_genden.2.d:0 "Certains de nos camarades enthousiastes ont fondé un atelier civil capable de produire des biens de consommation, réduisant ainsi la dépendance économique des aimags vis-à-vis de la capitale.\n\nDes habitants rejoignent déjà la main-d'œuvre, tandis que des contremaîtres élus localement supervisent la production et la redistribution des biens pour les besoins civils sous le contrôle strict du gouvernement central."
mongol_genden.2.a:0 "Excellent travail !"

mongol_genden.3.t:0 "Nouvelle fabrique d’armement construite"
mongol_genden.3.d:0 "Face aux pénuries logistiques qui entravent l’approvisionnement de la garnison locale et à son besoin urgent d’armes modernes, des citoyens responsables ont réussi à rassembler assez de fonds pour financer la construction d’un dépôt de munitions et d’infrastructures destinées à fournir fusils et équipements militaires aux besoins du peuple.\n\nCertains modèles d’armes semblent d’un niveau égal, voire supérieur, à ceux de nos fabricants officiels !"
mongol_genden.3.a:0 "Des armes entre les mains du peuple !"

mongol_genden.4.t:0 "Expansion du réseau routier local"
mongol_genden.4.d:0 "Grâce aux généreuses donations de nos citoyens, diverses entreprises de construction ont pu améliorer les connexions routières à travers le pays, renforçant la maîtrise du peuple sur la nature sauvage de la région.\n\nCes travaux devraient avoir un impact positif sur la performance de nos forces terrestres, qui bénéficieront de logistiques modernes."
mongol_genden.4.a:0 "Nous irons toujours plus loin ainsi !"

mongol_genden.5.t:0 "Le peuple fortifie ses maisons"
mongol_genden.5.d:0 "Désireux de protéger leur capital accumulé, certains citoyens inquiets ont agrandi leurs caves et bâti une série de fortifications dans et autour de leurs maisons. Une tournure inattendue, surtout quand on sait qu’ils sont déjà protégés par nos glorieuses forces armées.\n\nCes fortifications pourraient néanmoins s’avérer utiles si nos défenseurs venaient à en avoir besoin en temps de guerre."
mongol_genden.5.a:0 "Ils ont fait QUOI ?"

mongol_genden.6.t:0 "Un système de corruption découvert"
mongol_genden.6.d:0 "L’analyse des flux de capitaux du mois dernier a révélé que certains fonds publics avaient transité par différents registres de la Sbaerkassa avant de finir sur les livrets d’épargne de plusieurs de nos députés.\n\nUne enquête plus poussée du Comité de lutte contre la corruption a clairement mis en lumière un système de détournement bien dissimulé.\n\nNos enquêteurs demandent toutefois plus de temps et de moyens pour finaliser leurs analyses et rédiger leur rapport. Que devons-nous faire ?"
mongol_genden.6.a:0 "Poursuivons les responsables !"
mongol_genden.6.b:0 "Lançons un long procès officiel."

mongol_genden.7.t:0 "Disparition de matériaux de production"
mongol_genden.7.d:0 "Un contremaître d’usine a signalé la disparition de matériaux de production. Le problème est apparu lorsque la station d’emballage n’a pas pu remplir les cinq derniers conteneurs sur deux cents.\n\nOn ignore encore qui pourrait être le saboteur, mais de nombreux ouvriers se sont déjà déclarés prêts à travailler quelques heures supplémentaires pour répondre aux demandes du gouvernement. Quelle bravoure et quel sens des responsabilités !"
mongol_genden.7.a:0 "Il faudra augmenter les quotas de ce mois-ci."

mongol_genden.8.t:0 "L’inflation augmente"
mongol_genden.8.d:0 "Avec l’accumulation massive de capital par la population, les agences gouvernementales doivent intervenir pour réguler le marché et éviter l’effondrement de la monnaie nationale.\n\nUne telle intervention est coûteuse et chronophage, et seule la Banque centrale peut en assumer la régulation à l’avenir."
mongol_genden.8.a:0 "Le Mongolbank en souffrira."

mongol_genden.10.t:0 "Problème des sympathisants [SOV.getAdjective]"
mongol_genden.10.d:0 "Observant les récents développements politiques en [SOV.getNameDef], [ROOT.getLeader], au terme de longues réflexions philosophiques avec lui-même et ses subordonnés, a compris que la construction du communisme repose sur des agents internes et externes capables de soutenir le « dirigeant légitime » dans son ascension au pouvoir, tant à l’intérieur qu’à l’extérieur du pays.\n\nVu le rôle important qu’ont joué les politiciens [SOV.getAdjective] dans l’établissement du communisme en Mongolie, la question demeure : certains membres du gouvernement national poursuivent-ils encore un agenda pro-[SOV.getAdjective] pour atteindre leurs objectifs personnels ou collectifs ?\n\nAprès mûre réflexion, [ROOT.getLeader] a décidé de régler ce problème une bonne fois pour toutes."
mongol_genden.10.a:0 "Nous ne sommes pas comme eux, aucune purge ne sera menée !"
mongol_genden.10.b:0 "Écartons seulement les éléments les plus radicaux."
mongol_genden.10.c:0 "N’épargnons personne pour garantir la sécurité !"

mongol_genden.14.t:0 "Retour de Genden en Mongolie !"
mongol_genden.14.d:0 "Après toutes les épreuves traversées, la nouvelle de son retour est enfin parvenue à Oulan-Bator !\n\nAccompagné de quatre gardes, il a quitté le transport qui l’avait amené jusqu’à la frontière [SOV.getAdjective]-[MON.getAdjective], franchie avant l’aube. Marchant à nouveau sur la terre de sa patrie, le héros de notre survie a été vu saluant joyeusement la foule, les larmes aux yeux, malgré son visage fatigué.\n\nUne cérémonie officielle a eu lieu le lendemain, au cours de laquelle il a proclamé son retour devant des milliers de citoyens, déterminé à restaurer le pays qu’il avait été forcé de quitter en des temps difficiles !"
mongol_genden.14.a:0 "Nous sommes tous heureux de te revoir !"

mongol_genden.15.t:0 "Genden exécuté en URSS !"
mongol_genden.15.d:0 "Un résident du NKVD a transmis au cabinet de [ROOT.getLeader] une petite note classée « Absolument secret ». Elle contenait les procès-verbaux de l’arrestation et de l’interrogatoire de Genden, reconnu dans une gare par un fonctionnaire [SOV.getAdjective] attentif.\n\nDans ses derniers jours, Genden fut jugé coupable d’activités contre-révolutionnaires, de sabotage de nombreuses missions diplomatiques et d’espionnage au profit du [JAP.getNameDef] et de ses régimes fantoches. Tous ces faits furent confirmés et signés par lui-même.\n\nMalgré les efforts de nos diplomates, son procès fut expéditif et sa peine inévitable..."
mongol_genden.15.a:0 "Il nous manquera."
mongol_genden.15.b:0 "Bon débarras."

mongol_genden.16.t:0 "Route occidentale découverte !"
mongol_genden.16.d:0 "Les plans ferroviaires obtenus indiquent que Genden sera envoyé vers sa « zone de vacances » en Crimée par un train partant de Moscou dans les prochaines semaines, via la voie ferrée occidentale traversant les villes suivantes :\nKaluga\nBryansk\nChostka\nKiev\nKirovograd\nDnipropetrovsk\nSébastopol\n\nNos agents ont déjà établi des contacts avec certains groupes tactiques de la région, qui suggèrent de provoquer des troubles publics dans la capitale [UKR.getAdjective] Kiev, offrant ainsi à notre bien-aimé Genden une occasion parfaite de s’évader dans le chaos."
mongol_genden.16.a:0 "Kiev sera donc la cible."

mongol_genden.17.t:0 "Route méridionale découverte !"
mongol_genden.17.d:0 "Le train prévu devrait emprunter la ligne méridionale, passant par plusieurs grands centres de district :\nTula\nOrel\nKoursk\nBelgorod\nKharkov\nStalino\nSébastopol\n\nCet itinéraire présente quelques points faibles, mais en raison de la nature du réseau ferré et de la forte présence du NKVD, attaquer directement le train ou la gare serait imprudent. Nous avons toutefois trouvé des contacts parmi certains fonctionnaires opportunistes, notamment à Kharkov, qui semble le plus prometteur.\n\nEn échange d’un pot-de-vin conséquent, les autorités locales pourraient organiser la réorganisation de plusieurs trains, nous permettant soit de faire monter Genden dans un autre convoi, soit de rediriger le sien."
mongol_genden.17.a:0 "Kharkov recevra donc une généreuse « donation »."

mongol_genden.18.t:0 "Route sud-est découverte !"
mongol_genden.18.d:0 "Cet itinéraire particulier, récemment ouvert, part des faubourgs sud-est de Moscou et traverse exclusivement des territoires russes, contournant totalement l’Ukraine.\n\nLe train doit atteindre les villes de :\nLipetsk\nVoronej\nMillerovo\nRostov\nKrasnodar\nNovorossiïsk\nPuis Genden sera transféré en Crimée par bateau, rendant toute tentative de sauvetage impossible.\n\nLa région de Rostov, malgré sa sécurité apparente, abrite toutefois des habitants expérimentés dans les frappes rapides sur cibles mobiles depuis la Grande Guerre et la Révolution rouge..."
mongol_genden.18.a:0 "Rostov ? Qui avons-nous là-bas ?"

mongol_genden.19.t:0 "Gare de Kiev détruite !"
mongol_genden.19.d:0 "Un matin ordinaire à la gare de Kiev s’est transformé en chaos total quand, après quelques secousses, les murs de béton se sont fissurés, les poutres métalliques pliant sous le poids du plafond avant que la majeure partie du bâtiment ne s’effondre, détruisant plusieurs trains de marchandises.\n\nHeureusement, l’alarme a retenti à temps, permettant à certains employés d’évacuer, tandis que le NKVD et la militsia bouclaient la zone pour enquêter.\n\nUn garde fut retrouvé inconscient, se souvenant seulement de quelques ombres surgissant derrière lui avant de perdre connaissance.\n\n« Un incident à examiner de plus près » — selon le zampolit local."
mongol_genden.19.a:0 "QUOI ?!"
mongol_genden.19.b:0 "Oh non ! Enfin bref, à propos de Genden..."

mongol_genden.21.t:0 "Chaos bureaucratique à Kharkov"
mongol_genden.21.d:0 "Une mallette contenant fonds et instructions fut laissée au dépôt ferroviaire de Kharkov, où elle fut présentée au contremaître par l’un de nos agents.\n\nAprès mûre « réflexion » et quelques arguments persuasifs, le contremaître accepta de faire converger les horaires de plusieurs trains arrivant à Kharkov les jours suivants.\n\nAvec ces retards, il fut relativement aisé de séparer Genden de son accompagnateur du NKVD et de le faire partir sur un autre train sous l’alias d’un professeur de sciences et littérature d’Asie orientale en route vers l’Asie centrale.\n\nIl ne nous reste plus qu’à suivre le convoi et nous assurer qu’il arrive à destination."
mongol_genden.21.a:0 "Un travail bien accompli."

mongol_genden.22.t:0 "Des cosaques attaquent un train près de Rostov !"
mongol_genden.22.d:0 "Des nouvelles dévastatrices se répandent dans la Volga et l’est de l’Ukraine : une escouade de cavaliers inconnus a intercepté et pillé un train civil en route vers Novorossiïsk.\n\nVenus du côté du soleil couchant, ils exigèrent un « paiement » pour laisser passer le convoi. À l’expiration de l’ultimatum, certains montèrent à bord et commencèrent à dépouiller les passagers.\n\nEn tentant de désarmer un politruk, un coup partit accidentellement, plongeant la scène dans la panique : civils fuyant, officiers du NKVD combattant au corps-à-corps. Inférieurs en nombre, ils périrent en héros. Les bandits posèrent ensuite des explosifs et incendièrent le train avant de disparaître dans la nuit."
mongol_genden.22.a:0 "Pardon, QUOI ?!"
mongol_genden.22.b:0 "Ça leur servira de leçon."

# Grande Mongolie
mongol_greater_mongolia.1.t:0 "Opération réussie"
mongol_greater_mongolia.1.d:0 "L’invasion et la saisie de la zone disputée se sont déroulées conformément au plan.\n\nAprès que nos gardes-frontières ont « échoué à répondre » à l’alerte, nos officiels ont lancé une enquête officielle, tout en envoyant des requêtes diplomatiques pour rechercher les coupables. Nos escadrons ont pris le contrôle des infrastructures vitales : poste, chemins de fer, routes, télégraphe et lignes téléphoniques. La garnison locale a dû déposer les armes et se soumettre à l’interrogatoire et à l’endoctrinement.\n\nUne partie de la population proteste encore, mais faiblement et sans organisation."
mongol_greater_mongolia.1.a:0 "Un grand jour pour le peuple [ROOT.getAdjective] !"

mongol_greater_mongolia.2.t:0 "Désastre au sud"
mongol_greater_mongolia.2.d:0 "Encouragées par le succès initial, nos forces ont sécurisé quelques villages frontaliers, empêchant la formation de milices hostiles.\n\nMais alors que nous préparions l’avancée en profondeur, une contre-offensive de grande ampleur a dévasté les flancs de notre armée surexposée. Avec les partisans coupant nos lignes de ravitaillement, nos troupes ont dû improviser, abandonnant hommes et matériel pour sauver le gros de l’armée.\n\nLes soldats revenus pansent leurs blessures et se préparent aux prochains combats."
mongol_greater_mongolia.2.a:0 "Nous avons surestimé nos forces."

mongol_greater_mongolia.3.t:0 "Impasse militaire"
mongol_greater_mongolia.3.d:0 "Malgré le succès initial, notre avance a été stoppée par une forte ligne défensive. Nos soldats ont dû s’enterrer, tandis que la police militaire sécurisait l’arrière face aux partisans.\n\nAprès des échanges indécis, les commandants locaux suggèrent d’abandonner cette opération avant que la situation ne devienne critique, l’ennemi renforçant la zone alors que nous ne pouvons consacrer plus de ressources à ce qui devait être un court conflit."
mongol_greater_mongolia.3.a:0 "Nous en tirerons des leçons."

mongol_greater_mongolia.4.t:0 "Forces ennemies repoussées"
mongol_greater_mongolia.4.d:0 "D’innombrables ennemis ont envahi nos terres, prétendant qu’elles leur revenaient de droit !\n\nTandis qu’ils pillaient nos campagnes, nos guerriers se sont rassemblés sous nos meilleurs généraux et ont infligé une défaite décisive aux envahisseurs.\n\nIncapables de résister à l’effort combiné de notre armée et de nos partisans, les lâches ont fui, abandonnant matériel et prisonniers."
mongol_greater_mongolia.4.a:0 "Nous réduirons leur armée en cendres jusqu’au dernier homme."

mongol_greater_mongolia.5.t:0 "Nos terres saisies !"
mongol_greater_mongolia.5.d:0 "Nos généraux ont peut-être commis une erreur, ou nos observateurs avancés, ou bien la réaction de nos troupes fut trop lente... Toujours est-il que nous avons perdu toute communication avec une région avancée. L’ennemi a sécurisé ses lignes et perturbé les nôtres, empêchant toute mobilisation efficace.\n\nDésormais il est trop tard : une partie de notre territoire est tombée aux mains de ces maudits envahisseurs. Nous reviendrons quand le moment sera venu !"
mongol_greater_mongolia.5.a:0 "Comment affronter le regard de notre peuple ?"

mongol_greater_mongolia.6.t:0 "Impasse militaire"
mongol_greater_mongolia.6.d:0 "L’ennemi, avançant rapidement, a conquis quelques villages frontaliers. Mais notre garnison, renforcée par l’armée mobilisée, a établi une ligne infranchissable ces dernières semaines.\n\nTandis que nos partisans harcèlent leurs arrières et que nos forces bloquent leur progression, l’ennemi, désillusionné, entame une retraite tactique, laissant derrière lui villages dévastés et champs pillés.\n\nUn succès décisif, mais coûteux."
mongol_greater_mongolia.6.a:0 "Nous tiendrons encore longtemps !"

mongol_greater_mongolia.10.t:0 "La Mongolie demande l’union avec les Bouriates"
mongol_greater_mongolia.10.d:0 "Souhaitant raviver les liens ancestraux qui unissaient les deux peuples avant la Révolution rouge et l’idéologie des États-nations, les diplomates [MON.getAdjective] proposent la réunification des Mongols bouriate et khalkha.\n\nEn plus d’une représentation adéquate au Grand et Petit Khoural, ils promettent de respecter l’identité nationale et les droits des Bouriates et autres habitants de la région.\n\nSi nous refusons, ils pourraient même se retourner contre nous. Allons-nous les laisser récupérer ces terres ?"
mongol_greater_mongolia.10.a:0 "Moins de problèmes pour nous."
mongol_greater_mongolia.10.b:0 "Jamais sans combat."
mongol_greater_mongolia.10.c:0 "Acceptons contre des sièges au Khoural."

mongol_greater_mongolia.11.t:0 "La Mongolie veut incorporer Touva"
mongol_greater_mongolia.11.d:0 "Pour rétablir son autorité sur les terres mongolophones, la délégation [MON.getAdjective] a approché nos responsables à Kyzyl pour proposer un plébiscite sur la réintégration de l’administration de Touva à la Mongolie.\n\nOutre les promesses habituelles d’autonomie et d’égalité des minorités, ils offrent d’investir dans l’économie stagnante de la région, pour que la population profite des avantages sociaux et économiques de [MON.GetRulingIdeology].\n\nComment répondre ?"
mongol_greater_mongolia.11.a:0 "Un problème de moins."
mongol_greater_mongolia.11.b:0 "Pourquoi accepterions-nous ?"
mongol_greater_mongolia.11.c:0 "Acceptons contre représentation au Khoural."

mongol_greater_mongolia.12.t:0 "La demande d’unification acceptée !"
mongol_greater_mongolia.12.d:0 "Pour résoudre les tensions, [FROM.getNameDef] a signé le traité et transféré l’administration. Nos fonctionnaires s’installent déjà, et nos ingénieurs commencent à réintégrer la région à nos infrastructures.\n\nLors de la marche cérémonielle, le dernier bataillon local a salué nos forces, symbolisant le transfert complet du pouvoir !"
mongol_greater_mongolia.12.a:0 "Parfait !"
mongol_greater_mongolia.12.b:0 "Une véritable union !"

mongol_greater_mongolia.13.t:0 "[FROM.getNameDefCap] accepte un statut d’autonomie"
mongol_greater_mongolia.13.d:0 "Après quelques jours de négociations, il a été décidé que fusionner complètement les gouvernements serait trop complexe. Les [FROM.getAdjective] acceptent donc un statut spécial d’autonomie sous notre mandat.\n\n« Avec des charges économiques et militaires partagées, nos nations deviendront chaque semaine plus fortes ! » a déclaré leur chef de délégation.\n\nNous pouvons commencer à rapprocher nos peuples !"
mongol_greater_mongolia.13.a:0 "Très bien."

mongol_greater_mongolia.14.t:0 "Échec des négociations"
mongol_greater_mongolia.14.d:0 "Malgré nos efforts, [FROM.getAdjective] a rejeté notre offre de coopération pan-mongole !\n\nDans un discours ce matin, [FROM.getLeader] a affirmé que « les lâches [ROOT.getAdjective] veulent asservir leurs voisins et restaurer l’empire mongol corrompu ».\n\nFace à un tel mépris, nos ambassadeurs ont quitté la table des négociations. Avec la répression grandissante contre nos compatriotes, une seule voie reste possible pour sécuriser la région..."
mongol_greater_mongolia.14.a:0 "Nous reviendrons."

mongol_greater_mongolia.15.t:0 "Prochaine conférence d’Oulan-Bator"
mongol_greater_mongolia.15.d:0 "L’Asie centrale fut toujours un champ de bataille pour les puissances rivales. Maintenant que nous avons stabilisé notre gouvernement et montré une fraction de notre force, il est dans notre intérêt de chercher la coopération des grandes puissances régionales pour unir le peuple mongol.\n\nUn tel projet est coûteux, mais il pourrait nous être très bénéfique."
mongol_greater_mongolia.15.a:0 "Que les préparatifs commencent !"
mongol_greater_mongolia.15.b:0 "C’est trop ambitieux."

mongol_greater_mongolia.16.t:0 "Inviter les officiels [SOV.getAdjective] ?"
mongol_greater_mongolia.16.d:0 "Malgré certaines politiques douteuses visant à séparer Khalkhas et Bouriates, les [SOV.getAdjective] furent souvent des alliés. Leur soutien sauva jadis le Khanat de Bogd des militaristes [CHI.getAdjective].\n\nIls ont aussi contribué à instaurer le communisme dans notre pays. Soucieux de protéger leur Transsibérien, ils voudront probablement notre appui dans leurs futurs conflits — à un prix, bien sûr."
mongol_greater_mongolia.16.a:0 "Invitons nos frères [SOV.getAdjective]."
mongol_greater_mongolia.16.b:0 "Ce n’est pas dans notre intérêt."

mongol_greater_mongolia.17.t:0 "Inviter les diplomates [CHI.getAdjective] ?"
mongol_greater_mongolia.17.d:0 "Bien qu’ils se soient longtemps déchirés, les [CHI.getAdjective] cherchent encore à sécuriser leurs frontières extérieures face aux [SOV.getAdjective], [JAP.getAdjective] ou autres puissances. Nos ancêtres furent ennemis durant des siècles. Mais peut-être la diplomatie peut-elle surpasser la poudre et l’acier ?"
mongol_greater_mongolia.17.a:0 "Voyons ce qu’ils disent."
mongol_greater_mongolia.17.b:0 "Jamais nous ne coopérerons avec ces oppresseurs."

mongol_greater_mongolia.18.t:0 "Reconnaître la RPC en l’invitant ?"
mongol_greater_mongolia.18.d:0 "Cherchant à libérer la Chine des oppresseurs, [PRC.getLeader] et son peuple ont fondé un nouvel ordre capable de résister au gouvernement central. Ils promettent de respecter l’autodétermination des Mongols.\n\nCela pourrait être la base d’une relation fructueuse entre nos pays. Bien sûr, cela irritera le [CHI.GetRulingParty], mais qu’importe si cela sert nos buts à long terme ?"
mongol_greater_mongolia.18.a:0 "Absolument."
mongol_greater_mongolia.18.b:0 "Trop risqué."
mongol_greater_mongolia.19.t:0 "Inviter les militaristes [JAP.getAdjective] ?"
mongol_greater_mongolia.19.d:0 "La croissance industrielle et économique fulgurante du [JAP.getNameDef] en a fait une puissance à prendre en compte si nous voulons sécuriser notre frontière nationale. De plus, leurs ambitions dans la plaine centrale et le Pacifique sud-est pourraient jouer en notre faveur si nous concluons un accord bien pensé avec eux.\n\nEn revanche, l’établissement de « régimes protecteurs » chez nos voisins immédiats ne contribue pas à réduire les tensions régionales. Qui sait où leurs ambitions mèneront l’Asie de l’Est ?"
mongol_greater_mongolia.19.a:0 "Cela aidera à résoudre les différends locaux."
mongol_greater_mongolia.19.b:0 "Ils cachent peut-être d’autres ambitions."

mongol_greater_mongolia.20.t:0 "Les officiels [MON.getAdjective] nous invitent à la conférence d’Oulan-Bator"
mongol_greater_mongolia.20.d:0 "Cherchant à régler les litiges concernant la Mongolie intérieure et extérieure, redistribuer la population selon recensements et plébiscites, et assurer l’héritage d’une Mongolie unifiée, les diplomates [MON.getAdjective] organisent la conférence d’Oulan-Bator et nous ont invités, « en tant que Grande Puissance », à y prendre part.\n\nNos analystes suggèrent d’y participer : nous pourrions accroître notre influence et rallier [MON.getNameDef] et ses dirigeants à notre cause.\n\nLa foi est bonne, mais le contrôle est meilleur."
mongol_greater_mongolia.20.a:0 "Nous y assisterons."
mongol_greater_mongolia.20.b:0 "Ils plaisantent, j’espère !"

mongol_greater_mongolia.21.t:0 "La délégation [FROM.getAdjective] participera à la conférence"
mongol_greater_mongolia.21.d:0 "Après réflexion, les députés [FROM.getAdjective] ont annoncé lors de la visite de notre ambassadeur qu’ils souhaitent participer à la conférence visant à « résoudre pacifiquement les litiges et apaiser les conflits ».\n\nNous devons préparer les meilleurs hébergements possibles pour leur séjour à notre capitale. Les préparatifs sont déjà en cours."
mongol_greater_mongolia.21.a:0 "La stabilité régionale doit être maintenue !"

mongol_greater_mongolia.22.t:0 "Les députés [FROM.getAdjective] refusent de participer"
mongol_greater_mongolia.22.d:0 "La longue lettre remise à notre ambassadeur contenait une déclaration d’amitié éternelle entre nos deux nations, de prospérité pour nos peuples… et, cachée à la fin, la phrase que [FROM.getNameDef] a des affaires urgentes et ne peut donc envoyer de délégation.\n\nRestons vigilants, car ce pays n’est pas encore prêt à assumer la responsabilité de garantir la stabilité régionale..."
mongol_greater_mongolia.22.a:0 "Tant pis pour eux."

mongol_greater_mongolia.23.t:0 "Ouverture de la conférence d’Oulan-Bator"
mongol_greater_mongolia.23.d:0 "Les préparatifs touchent à leur fin, les diplomates arrivent à Oulan-Bator dans les prochains jours.\n\nAprès avoir réglé le protocole, nous avons pu placer les sièges de manière à n’offenser aucune délégation. Il ne manque plus qu’une atmosphère saine dans notre capitale pour assurer un climat propice aux discussions."
mongol_greater_mongolia.23.a:0 "Que les débats commencent."

mongol_greater_mongolia.24.t:0 "Fusillade dans la salle de conférence"
mongol_greater_mongolia.24.d:0 "Le premier tour de discussions se déroulait comme prévu : après le discours de [MON.getLeader], toutes les délégations prirent place. Mais certains délégués étrangers et leurs gardes avaient introduit des armes, prétendument « pour leur protection ».\n\nQuand un député lança : « Comment assurer la sécurité régionale si l’autre camp mène une guerre offensive contre nous, juste derrière ces portes ? », ses adversaires s’emportèrent. Un radical, d’origine inconnue, ouvrit le feu, déclenchant une fusillade générale.\n\nQuelques heures plus tard, les blessés furent évacués, chaque délégation regagnant son pays en guerre. La conférence avait totalement échoué."
mongol_greater_mongolia.24.a:0 "Quelle négligence de notre part !"

mongol_greater_mongolia.25.t:0 "Reconnaissance mutuelle et alliance"
mongol_greater_mongolia.25.d:0 "Notre position fragile sur la scène internationale a longtemps été soutenue par nos camarades du [SOV.getNameDef].\n\nPuisque nous avons déjà reconnu officieusement le [PRC.getNameDef] en les invitant à la conférence, nous pourrions renforcer nos liens par un protocole secret : reconnaissance mutuelle et partage des sphères d’influence en Asie centrale. La conférence serait annulée, bien sûr.\n\nLes Grandes Puissances y verront peut-être une « alliance des indésirables », mais c’est mieux que rien."
mongol_greater_mongolia.25.a:0 "Notre seule chance !"
mongol_greater_mongolia.25.b:0 "Et attirer la colère de nos voisins ?"

mongol_greater_mongolia.26.t:0 "Demande d’alliance acceptée"
mongol_greater_mongolia.26.d:0 "Conscients de la fragilité de nos nations, [PRC.getLeader] a accepté la proposition risquée et signé l’accord secret visant à rééquilibrer les forces régionales en notre faveur.\n\nDes diplomates furieux quittent déjà Oulan-Bator pour dénoncer l’« imprévisibilité des politiciens [MON.getAdjective] ».\n\nNos généraux espèrent entamer un partage d’expériences entre nos armées."
mongol_greater_mongolia.26.a:0 "Hourra !"

mongol_greater_mongolia.27.t:0 "Mission diplomatique échouée"
mongol_greater_mongolia.27.d:0 "[PRC.getLeader] a informé notre délégué que, malgré l’intérêt de notre proposition, ils privilégient actuellement leur coopération avec les Grandes Puissances. L’annonce, comme notre offre, a été transmise par canaux sécurisés, à l’insu des autres diplomates.\n\nNous pouvons néanmoins poursuivre nos efforts pour rallier les grands acteurs d’Asie centrale."
mongol_greater_mongolia.27.a:0 "Comment ? Pourquoi ?"

mongol_greater_mongolia.28.t:0 "Conférence infructueuse"
mongol_greater_mongolia.28.d:0 "Malgré nos efforts pour instaurer un climat positif, toutes les discussions ont échoué : certains se plaignant d’un traitement inégal, d’autres restant neutres sur les sujets principaux.\n\nNos tentatives d’obtenir leur allégeance furent vaines : ils exigeaient toujours plus de concessions, impossibles à fournir.\n\nÀ la clôture, [MON.getLeader] tenta de réconcilier les camps, sans succès. La conférence fut un échec total pour notre diplomatie."
mongol_greater_mongolia.28.a:0 "Nous avons pourtant tout donné…"

mongol_greater_mongolia.29.t:0 "Les Grandes Puissances nous soutiennent"
mongol_greater_mongolia.29.d:0 "Après des semaines de négociations, nous avons satisfait toutes les délégations, qui ont proclamé notre État « protégé par les Grandes Puissances ».\n\nConsidérant la Mongolie comme État-tampon, elles garantissent notre sécurité, à condition que nous restions neutres dans notre politique étrangère.\n\nMais nous pourrions exploiter cette formulation pour revendiquer des « territoires mongols légitimes » auprès de ces puissances."
mongol_greater_mongolia.29.a:0 "Nos diplomates ont accompli l’impossible !"

mongol_greater_mongolia.30.t:0 "La Mongolie réclame ses droits légitimes"
mongol_greater_mongolia.30.d:0 "Désireux de réunir les [MON.getAdjective] sous un seul État, et s’appuyant sur les accords d’Oulan-Bator, [MON.getLeader] exige le transfert du territoire sous son contrôle.\n\nCéder préserverait l’équilibre régional sans nuire à long terme, affirment-ils.\n\nMais nous risquons d’être vus comme oppresseurs et fauteurs de guerre, offrant un prétexte d’intervention militaire aux autres puissances..."
mongol_greater_mongolia.30.a:0 "Ils recevront ce qui leur revient."
mongol_greater_mongolia.30.b:0 "Ce n’était pas ce qui avait été convenu."

mongol_greater_mongolia.31.t:0 "[FROM.getAdjective] refuse d’appliquer les accords d’Oulan-Bator"
mongol_greater_mongolia.31.d:0 "Notre demande diplomatique a été ignorée, puis rejetée, accusant nos dirigeants « d’escalader dangereusement la situation ».\n\nNotre troisième requête, exigeant des concessions, a été rendue publique et tournée en dérision. Une humiliation que nous ne pouvons tolérer ! Ou bien… ?"
mongol_greater_mongolia.31.a:0 "Passons à la manière forte."
mongol_greater_mongolia.31.b:0 "La guerre est impossible pour l’instant."

mongol_greater_mongolia.32.t:0 "Transfert de territoire confirmé"
mongol_greater_mongolia.32.d:0 "Notre demande a suscité quelques inquiétudes, mais [FROM.getAdjective] a répondu favorablement : dans le but de préserver la paix, ils acceptent de réaligner les frontières, permettant à [MON.getNameDef] de conserver son statut en Asie centrale.\n\nLes préparatifs militaires et administratifs sont déjà en cours."
mongol_greater_mongolia.32.a:0 "Comme prévu."

mongol_greater_mongolia.33.t:0 "Transfert refusé"
mongol_greater_mongolia.33.d:0 "Dans leur effort vain pour préserver un empire vacillant, [FROM.getAdjective] a rejeté notre demande de restitution des territoires mongols !\n\nIls prétendent que ces terres leur appartiennent « de plein droit », oubliant les accords d’Oulan-Bator.\n\nNos forces armées déclarent être prêtes à agir par la force."
mongol_greater_mongolia.33.a:0 "Personne ne nous niera aujourd’hui !"

mongol_greater_mongolia.34.t:0 "Notre bienfaiteur refuse de nous soutenir"
mongol_greater_mongolia.34.d:0 "Les officiels de [FROM.getNameDef] nous ont annoncé qu’ils ne pouvaient pas soutenir notre cause, faute de moyens humains et matériels pour « une nouvelle guerre de libération ».\n\nIls promettent toutefois un soutien futur en cas de nouveaux litiges frontaliers."
mongol_greater_mongolia.34.a:0 "Peu fiables !"

mongol_greater_mongolia.40.t:0 "[FROM.getNameDefCap] propose de diviser les sphères d’influence"
mongol_greater_mongolia.40.d:0 "L’objectif de l’alliance était de s’émanciper des Grandes Puissances et de bâtir un bloc indépendant. Mais un problème demeure : la Mongolie intérieure et le nord du Sinkiang comptent de nombreux Mongols marginalisés.\n\n[MON.getLeader] réclame leur unification et nous presse de diviser les sphères d’influence, ce qui impliquerait d’abandonner nos politiques de sinisation dans ces régions."
mongol_greater_mongolia.40.a:0 "C’est préférable."
mongol_greater_mongolia.40.b:0 "Non, ce n’est pas dans notre intérêt."

mongol_greater_mongolia.41.t:0 "[FROM.getNameDefCap] accepte la division"
mongol_greater_mongolia.41.d:0 "Pour renforcer l’alliance, [FROM.getAdjective] a renoncé à ses revendications et cessera toute politique de sinisation dans la région contestée.\n\nNotre peuple jouira de plus de liberté et nous pourrons poursuivre l’unification des Mongols."
mongol_greater_mongolia.41.a:0 "Comme prévu."

mongol_greater_mongolia.42.t:0 "Demande rejetée !"
mongol_greater_mongolia.42.d:0 "[FROM.getAdjective] considère encore ces régions comme son domaine légitime. Nos efforts d’unification pourront se poursuivre, mais leurs partisans nous gêneront si nous devons conquérir ces terres.\n\nQuelle erreur de calcul ! Nous avons désormais moins d’alliés."
mongol_greater_mongolia.42.a:0 "Maudits soient-ils !"

mongol_greater_mongolia.50.t:0 "Renaissance de [FROM.getNameDef]"
mongol_greater_mongolia.50.d:0 "Les récentes conquêtes de [FROM.getAdjective] couvrent de vastes territoires peuplés de Mongols, offrant une opportunité unique. Ce matin, [FROM.getLeader] a annoncé publiquement la création d’une nouvelle entité politique, représentant la volonté unifiée du peuple mongol et visant à protéger ses intérêts."
mongol_greater_mongolia.50.a:0 "Le rêve d’une Asie centrale unifiée."
mongol_greater_mongolia.50.b:0 "Un nouvel empire mongol ?"
mongol_greater_mongolia.50.c:0 "Juste un contretemps."

mongol_soviet_puppet.2.t:0 "Activité suspecte détectée"
mongol_soviet_puppet.2.d:0 "Un groupe d’étudiants a été arrêté, soupçonné d’être des agents envoyés par [MON.getAdjective] pour déstabiliser notre arrière-pays. Après interrogatoire, l’un des meneurs a admis servir [MON.getNameDef]. Ces actions effrontées doivent être punies. Nos diplomates proposent plusieurs options.\n\nQuelle sera la décision de [ROOT.getLeader] ?"
mongol_soviet_puppet.2.a:0 "Pas notre problème."
mongol_soviet_puppet.2.b:0 "Protestons diplomatiquement."
mongol_soviet_puppet.2.c:0 "Fermons les frontières."
mongol_soviet_puppet.2.e:0 "Envoyons un ultimatum."

mongol_soviet_puppet.3.t:0 "[FROM.getNameDefCap] proteste"
mongol_soviet_puppet.3.d:0 "Une note de protestation a été remise, affirmant que nos actions effrontées en faveur du communisme nuisent à nos relations. Elle prévient que toute future activité d’espionnage ne sera pas tolérée et fera l’objet de mesures drastiques. [ROOT.getLeader] a choisi de reporter la question."
mongol_soviet_puppet.3.a:0 "Oh non ! Enfin bref…"

mongol_soviet_puppet.4.t:0 "[FROM.getNameDefCap] nous impose un embargo !"
mongol_soviet_puppet.4.d:0 "Un train de marchandises n’est pas arrivé, suscitant une enquête. Il se trouve bloqué dans la région frontalière de [FROM.getNameDef], les autorités ayant fermé la frontière et imposé des sanctions. L’ambassade a confirmé qu’aucun train ne passera sans excuses officielles."
mongol_soviet_puppet.4.a:0 "Peu importe."
mongol_soviet_puppet.4.b:0 "Pitié, envoyons des excuses."

mongol_soviet_puppet.5.t:0 "[FROM.getNameDefCap] s’excuse"
mongol_soviet_puppet.5.d:0 "Pour se réconcilier, [FROM.getAdjective] a envoyé des excuses officielles. Ils promettent d’arrêter toute propagande chez nous et d’indemniser les troubles causés.\n\nMais pouvons-nous leur faire confiance ?"
mongol_soviet_puppet.5.a:0 "Très bien."
mongol_soviet_puppet.5.b:0 "On ne nous achète pas si facilement."

mongol_soviet_puppet.6.t:0 "[FROM.getNameDefCap] accepte un compromis"
mongol_soviet_puppet.6.d:0 "Une lettre de réconciliation indique que [FROM.getAdjective] arrêtera nos agents, mais autorisera la libre circulation des marchandises, sauf incident futur. Quelques heures plus tard, le train problématique est arrivé à destination, évitant une crise économique."
mongol_soviet_puppet.6.a:0 "Petite crise évitée."
mongol_soviet_puppet.7.t:0 "[FROM.getNameDefCap] refuse de négocier"
mongol_soviet_puppet.7.d:0 "Malgré nos appels à la réconciliation, [FROM.getAdjective] refuse de lever les sanctions commerciales, affirmant qu’une telle mesure n’empêchera pas les propagateurs étrangers d’agir sur leurs terres.\n\nDe plus, des rumeurs circulent selon lesquelles ils encourageraient d’autres nations voisines à imposer également un embargo contre nous !\n\nNe pouvant ni confirmer ni infirmer ces rumeurs, nous devrions envisager de rendre nos actions plus discrètes en [FROM.getNameDef] avant qu’un ultimatum plus sévère ne nous soit adressé."
mongol_soviet_puppet.7.a:0 "Cela n’augure rien de bon..."

mongol_soviet_puppet.8.t:0 "[FROM.getNameDefCap] envoie un ultimatum : abandonnez toute ingérence"
mongol_soviet_puppet.8.d:0 "Au nom de la préservation de leur stabilité interne et de leur sphère d’influence, le gouvernement [FROM.getAdjective] a décrété la mobilisation générale de ses forces armées !\n\nSe préparant clairement à la guerre, ils exigent que nous arrêtions toute propagande sur leur sol, nous accusant d’être responsables des troubles récents et de la montée du soutien communiste parmi les masses rurales.\n\nCes va-t-en-guerre prétendent vouloir « écraser la menace communiste » si nous n’obtempérons pas. Que faire ?"
mongol_soviet_puppet.8.a:0 "Qu’ont-ils l’intention de faire ? Nous déclarer la guerre ?"
mongol_soviet_puppet.8.b:0 "Cédons."

mongol_soviet_puppet.9.t:0 "Ultimatum rejeté"
mongol_soviet_puppet.9.d:0 "Malgré les preuves claires que nous avons présentées, les officiels [FROM.getAdjective] ont rejeté toutes les accusations, affirmant qu’elles étaient falsifiées et que la véritable menace venait simplement de l’incompétence de notre gouvernement !\n\nDe telles accusations sont intolérables. Nous devons préparer nos forces armées à écraser ce pays importun une bonne fois pour toutes !\n\nNos patrouilles frontalières sont déjà renforcées par de nouvelles recrues, et il ne nous faut que du temps pour être prêts. À la guerre ! La gloire du [ROOT.getAdjective] l’exige !"
mongol_soviet_puppet.9.a:0 "Passons à la manière forte."

mongol_soviet_puppet.10.t:0 "[FROM.getNameDefCap] cède à nos exigences"
mongol_soviet_puppet.10.d:0 "Nos ultimatums ont impressionné et effrayé les officiels étrangers, qui ont envoyé une délégation cérémonielle à notre capitale, annonçant leur désir de paix perpétuelle !\n\nAprès une série de discussions, ils ont juré d’abandonner toute ingérence et ont fourni des informations sur l’ensemble du réseau d’agents qui troublait nos citoyens avec des idées communistes.\n\nUn jour glorieux pour le [ROOT.getNameDef] et son peuple !"
mongol_soviet_puppet.10.a:0 "Comme prévu."

mongol_soviet_puppet.11.t:0 "La Mongolie soutient une révolte communiste"
mongol_soviet_puppet.11.d:0 "La nouvelle d’une rébellion communiste visant à « libérer le prolétariat et établir une république ouvrière » est parvenue à notre quartier général ce matin.\n\nQuelques heures plus tard, [MON.getLeader] annonça au monde que les dirigeants du nouveau gouvernement révolutionnaire avaient demandé le soutien [MON.getAdjective] et voté unanimement pour devenir un régime guidé dans leur lutte pour l’indépendance !\n\n[MON.getNameDefCap] se pose désormais en garant solide du paradis communiste dans la région, prêt à rallier toujours plus de régimes sous sa direction."
mongol_soviet_puppet.11.a:0 "Ils ont fait QUOI ?!"
mongol_soviet_puppet.11.b:0 "Bienvenue, frères et sœurs !"
mongol_soviet_puppet.11.c:0 "À quoi pensent-ils ?!"
mongol_soviet_puppet.11.e:0 "Notre nouveau destin nous attend !"
mongol_soviet_puppet.11.f:0 "Intéressant, en effet."

mongol_soviet_puppet.12.t:0 "[FROM.getNameDefCap] propose un programme de relocalisation industrielle"
mongol_soviet_puppet.12.d:0 "Pour protéger nos industries de l’ennemi en progression, les officiels [MON.getAdjective] ont proposé de transférer des usines depuis l’Oural et l’Asie centrale vers le cœur de la Mongolie.\n\nNous n’aurons peut-être pas d’accès direct aux usines, mais nos frères [MON.getAdjective] promettent de partager une partie de leurs capacités industrielles en échange.\n\nQuelle sera la décision du Stavka ? Faut-il éloigner encore davantage notre industrie de l’ennemi ?"
mongol_soviet_puppet.12.a:0 "Relocaliser une usine militaire."
mongol_soviet_puppet.12.b:0 "Transférer un complexe civil en sécurité."
mongol_soviet_puppet.12.c:0 "Ces usines sont sûres ici."

mongol_soviet_puppet.13.t:0 "[FROM.getAdjective] délocalise une usine militaire"
mongol_soviet_puppet.13.d:0 "Le Stavka a signalé qu’une de leurs usines d’armement est prête à être déplacée plus à l’est, renforçant ainsi nos capacités militaires en échange de quelques compensations industrielles de notre part.\n\nNos capacités croissantes aideront grandement nos amis [SOV.getAdjective], mais aussi nous-mêmes."
mongol_soviet_puppet.13.a:0 "Parfait !"

mongol_soviet_puppet.14.t:0 "[FROM.getAdjective] a transféré un complexe industriel"
mongol_soviet_puppet.14.d:0 "Un rapport indique que le complexe industriel est déjà en route vers un site sécurisé en Mongolie.\n\nLe Stavka précise que nous devons respecter notre part du marché en signant un contrat industriel pour assister nos frères."
mongol_soviet_puppet.14.a:0 "Très bien !"

mongol_soviet_puppet.15.t:0 "Demande refusée"
mongol_soviet_puppet.15.d:0 "Le Stavka rapporte qu’il est actuellement impossible d’établir une route sûre et fiable pour nous. Nous devrons renouveler notre demande plus tard si nous voulons relocaliser un autre complexe industriel.\n\nCertains de nos habitants suggèrent que cela pourrait réduire leur influence sur nous, ce qui ne serait pas forcément une mauvaise chose."
mongol_soviet_puppet.15.a:0 "Peut-être une autre fois ?"

mongol_soviet_puppet.16.t:0 "Nouveau phare du communisme"
mongol_soviet_puppet.16.d:0 "Estimant nécessaire un changement dans l’Internationale communiste, les politiciens [MON.getAdjective] ont annoncé publiquement leurs inquiétudes face à l’instabilité politique et aux défaites militaires du [SOV.getNameDef].\n\n« Pour le bien commun, il faut coordonner les efforts alliés depuis un lieu défendu et renforcé », déclara [MON.getLeader], assumant officiellement la direction de l’alliance [MON.getFactionName]."
mongol_soviet_puppet.16.a:0 "C’est nous qui guiderons désormais."
mongol_soviet_puppet.16.b:0 "Ils se préparent à ce qui vient."
mongol_soviet_puppet.16.c:0 "Cela ne les sauvera pas !"
mongol_soviet_puppet.16.e:0 "La guerre s’intensifie..."
mongol_soviet_puppet.16.f:0 "Notre alliance se renforce."

mongol_soviet_puppet.17.t:0 "[FROM.getNameDefCap] propose un gouvernement d’union unique"
mongol_soviet_puppet.17.d:0 "Dans son discours aujourd’hui, [FROM.getLeader] a déclaré publiquement :\n« Le monde change. Qui peut désormais se dresser face aux armées de [FROM.getNameDef] et [ROOT.getNameDef] ? Face à la puissance de [FROM.getLeader] et [ROOT.getLeader], et à l’union de nos deux États ? Ensemble, mon ami [ROOT.getLeader], nous dirigerons ce monde vers la Révolution. »\n\nDiscours discutable, mais acclamé par des milliers de Mongols à travers [MON.getNameDef]. Beaucoup de nos citoyens réclament un gouvernement d’Union unique capable de défendre les valeurs de [ROOT.getFactionName] dans le monde entier. Quelle sera la réponse du commandement suprême ?"
mongol_soviet_puppet.17.a:0 "Une Union, indivisible."
mongol_soviet_puppet.17.b:0 "Nous nous suffisons à nous-mêmes."

mongol_soviet_puppet.18.t:0 "[FROM.getAdjective] accepte notre demande"
mongol_soviet_puppet.18.d:0 "Les politiciens [FROM.getAdjective], cherchant désespérément à résoudre l’effondrement militaire et administratif de leur pays, ont accepté notre proposition de former un gouvernement unifié [FROM.getAdjective]-[ROOT.getAdjective].\n\nL’état-major renforcé élabore déjà de nouveaux plans de bataille pour repousser l’ennemi et regagner les territoires perdus. Nos représentants sont dépêchés dans les nouvelles zones pour y rétablir l’ordre bureaucratique."
mongol_soviet_puppet.18.a:0 "Tout se déroule comme prévu."

mongol_soviet_puppet.19.t:0 "[FROM.getNameDefCap] semble reconsidérer notre demande"
mongol_soviet_puppet.19.d:0 "Le haut commandement [FROM.getAdjective] nous a informés que le discours charismatique de [ROOT.getLeader] avait renforcé leurs sentiments patriotiques et leur foi en la révolution. Mais ils estiment que l’unification administrative ne ferait qu’aggraver la situation au front. [FROM.getLeader] a donc poliment refusé l’offre honorable.\n\nIls semblent croire qu’ils peuvent encore résoudre la crise et sauver leur pays grâce à leurs forces armées et au soutien populaire. Voyons si c’est vrai."
mongol_soviet_puppet.19.a:0 "Nous avons fait de notre mieux."

mongol_rp_advisor.1.t:0 "Premier rapport au commandement"
mongol_rp_advisor.1.d:0 "Salut, camarade, et félicitations pour ta récente nomination comme conseiller personnel de Peljidiin Genden !\n\nAvec des personnes comme toi, Genden espère guider notre grand [MON.getName] vers un avenir prospère. Je suis Dald Zövlökh, conseiller expérimenté en sécurité intérieure, chargé d’accompagner les jeunes commandants comme toi.\n\nNos terres sont encore considérées par [CHI.getNameDef] comme faisant partie de leur territoire, bien que leur gouvernement n’y exerce aucun pouvoir réel. Les impérialistes [JAP.getAdjective] ont accru leur activité dans l’Est après avoir pris les avoirs de la clique de Fengtian en 1932. Notre seul véritable allié reste l’URSS, qui nous soutient depuis la révolution de 1924.\n\nAvec Genden et Demid actuellement à Moscou, nous pouvons encore envoyer des télégrammes pour indiquer quels sujets ils devraient aborder. Le temps presse !\n\nJe te laisse préparer. Zövlökh, terminé."
mongol_rp_advisor.1.a:0 "J’attends d’autres rapports à l’avenir."
mongol_rp_advisor.1.b:0 "Je sais ce que je fais, Dald. Plus de rapports."

mongol_anti_soviet.1.t:0 "Gouvernement provisoire formé"
mongol_anti_soviet.1.d:0 "Après l’échec catastrophique de notre délégation dans sa quête d’identité nationale, les structures gouvernementales ont réussi à rallier diverses factions de l’élite du parti et à former un régime provisoire.\n\nCertains groupes d’intérêt rivaux compliquent la tâche, mais au moins ils proposent de nombreuses solutions.\n\nNous devons désormais chercher un leadership stable et solide, ou tenter de sauver Genden s’il en est encore temps."
mongol_anti_soviet.1.a:0 "Ils dirigeront pour le moment."

mongol_anti_soviet.2.t:0 "Nous l’avons trouvé !"
mongol_anti_soviet.2.d:0 "La recherche du 9e Jebtsundamba Khutughtu, réincarnation moderne du Bogd Khan mort en 1924, a porté ses fruits.\n\nNos moines ont rassemblé tous les garçons de 2 à 5 ans du village et effectué trois séries de tests. Les résultats ont permis d’identifier le véritable réincarné : Jampal Namdol Chökyi Gyaltsen. Informé de son identité, il fut reconnu comme l’esprit qui unissait les bouddhistes de Mongolie extérieure. Ses parents jurèrent de garder le secret tant que la situation politique ne serait pas stabilisée."
mongol_anti_soviet.2.a:0 "Formidable ! Mais gardons-le secret pour l’instant."

mongol_anti_soviet.3.t:0 "Aucun candidat retenu"
mongol_anti_soviet.3.d:0 "Village après village, aucun enfant n’a réussi les tests destinés à identifier la réincarnation du 9e Jebtsundamba Khutughtu.\n\nNos équipes ne poursuivront plus les recherches ici, suggérant que la réincarnation se trouve ailleurs sur le plateau tibétain. À nous de décider si l’effort, coûteux en temps et en ressources, doit continuer."
mongol_anti_soviet.3.a:0 "Rien ? Mais nous n’abandonnons pas !"
mongol_anti_soviet.3.b:0 "Rien ? Cet effort devient trop lourd."

mongol_anti_soviet.4.t:0 "Nommer un nouveau président"
mongol_anti_soviet.4.d:0 ""
mongol_anti_soviet.4.a:0 "Chen Duxiu mènera le pays vers un nouveau communisme !"
mongol_anti_soviet.4.b:0 "Iosyef Satalinkhan assurera le pouvoir provisoirement."
mongol_anti_soviet.4.c:0 "Président ? Pourquoi pas une présidente ?"
#army events

mongol_army.1.t:0 "Programme de réajustement de la production"
mongol_army.1.d:0 "Avec des ressources limitées à notre disposition, nous ne pouvons pas concentrer pleinement nos efforts industriels sur la production de masse de véhicules blindés spécialisés.\n\nUne nouvelle proposition de notre équipe de recherche suggère de réajuster nos lignes de production afin de développer des chars à usage précis : soit fiables au combat mais plus lents, soit mieux armés mais coûteux, soit bon marché mais fragiles, soit capables de parcourir de grandes distances à vive allure.\n\nNous pourrons toujours revoir nos plans plus tard, mais ce sera un effort coûteux et long."
mongol_army.1.a:0 "Privilégier la fiabilité."
mongol_army.1.b:0 "Soutenir la qualité."
mongol_army.1.c:0 "Réduire les coûts avant tout."
mongol_army.1.e:0 "Un char, c’est pour la vitesse, pas pour le combat !"

mongol_army.2.t:0 "Un général prometteur"
mongol_army.2.d:0 "Notre état-major en expansion a un besoin urgent de nouveaux candidats enthousiastes, ouverts d’esprit et capables d’apporter des tactiques inédites. Un récent décret a ouvert un concours pour de nouveaux postes de colonels et de généraux.\n\nParmi les candidats issus des écoles militaires, un nom se démarque : Sandivyn Ravdan, connu pour sa dévotion et ses services actifs dans diverses garnisons. Un atout de taille pour notre état-major."
mongol_army.2.a:0 "Engageons-le !"

mongol_army.3.t:0 "Demande de transfert de navires"
mongol_army.3.d:0 "Nos bienfaiteurs ont décrété que certains navires de nos forces navales doivent être transférés sous le commandement direct d’un de leurs amiraux. Bien que présenté comme « temporaire », nos informateurs rapportent que des équipages composés surtout de marins [MON.getAdjective] sont déjà en préparation.\n\nFournir ces navires pourrait accroître notre autonomie en montrant notre contribution à l’effort de guerre, mais nous pourrions aussi envisager de saborder certains navires si nous refusons de les céder à nos nouveaux maîtres."
mongol_army.3.a:0 "Le temps nous est compté."

mongol_army.4.t:0 "La Mongolie demande des conseillers"
mongol_army.4.d:0 "La ratification du traité d’assistance mutuelle a permis à nos forces armées de stationner en territoire [MON.getAdjective], mais les contacts avec leurs officiers restent rares.\n\nDésireux d’accroître la coopération, leurs généraux demandent davantage de personnel [SOV.getAdjective] afin de mener manœuvres et exercices réguliers, renforçant ainsi notre emprise dans la région tout en maintenant l’armée [MON.getAdjective] loyale.\n\nQuelle sera notre réponse ?"
mongol_army.4.a:0 "Envoyons une mission complète."
mongol_army.4.b:0 "Une petite mission suffira."
mongol_army.4.c:0 "Nos hommes sont nécessaires ailleurs."

mongol_army.5.t:0 "[SOV.getAdjective] accepte d’envoyer une mission"
mongol_army.5.d:0 "Notre demande a reçu un large soutien : l’état-major [SOV.getAdjective] a accepté d’envoyer une mission complète et bien équipée pour nous assister dans le développement de nos doctrines.\n\nUn protocole additionnel précise que leurs hommes superviseront aussi la modernisation et l’entraînement de notre armée."
mongol_army.5.a:0 "Excellente nouvelle !"

mongol_army.6.t:0 "Assistance limitée des [SOV.getAdjective]"
mongol_army.6.d:0 "Nos camarades [SOV.getAdjective] ont décidé de limiter leur mission militaire à quelques conseillers chargés de superviser le développement de nos forces et leur rééquipement.\n\nNos généraux ont soumis plusieurs requêtes supplémentaires, mais la plupart ont été ignorées ou repoussées dans les méandres de la bureaucratie.\n\nC’est toujours mieux que rien, mais peu efficace."
mongol_army.6.a:0 "Très bien."

mongol_army.7.t:0 "Aucune mission militaire envoyée"
mongol_army.7.d:0 "Affirmant qu’une implication accrue renforcerait les tensions régionales, [SOV.getLeader] a déclaré que la coopération militaire serait « renforcée dans un futur proche lorsque les circonstances seront plus favorables ».\n\nUn développement désastreux… mais peut-être pourrons-nous tirer quelques enseignements gratuits des discussions déjà tenues ?"
mongol_army.7.a:0 "Quelle horreur !"

#foreign influence events

mongol_foreign_influence.2.t:0 "Intégration administrative de la Mongolie"
mongol_foreign_influence.2.d:0 "Notre influence en [MON.getNameDef] a atteint un niveau où leur politique interne et externe dépend largement de notre soutien.\n\nFace aux difficultés du peuple [MON.getAdjective], [ROOT.getLeader] envisage de nommer un gouvernement loyal qui consolidera notre contrôle dans ces temps incertains."
mongol_foreign_influence.2.a:0 "Envoyons un émissaire pour annoncer la nouvelle autorité."
mongol_foreign_influence.2.b:0 "Ce n’est pas dans notre intérêt."

mongol_foreign_influence.3.t:0 "La Mongolie sympathise avec notre cause !"
mongol_foreign_influence.3.d:0 "Nous avons reçu un télégramme secret de [MON.getNameDef] où [MON.getLeader] déclare son allégeance à notre cause. Voyant la lutte révolutionnaire de notre peuple, leurs ambassadeurs proposent un traité d’assistance mutuelle et de coopération.\n\nDevons-nous les considérer comme des amis, ou rester neutres ?"
mongol_foreign_influence.3.a:0 "Très bien !"
mongol_foreign_influence.3.b:0 "Pas intéressés."

mongol_foreign_influence.4.t:0 "Les [FROM.getAdjective] acceptent l’accord"
mongol_foreign_influence.4.d:0 "Nos délégations se sont rencontrées ce matin pour conclure un accord d’assistance mutuelle. Signé par les deux parties, le traité officialise notre alliance avec [FROM.getNameDef] et son dirigeant [FROM.getLeader], ouvrant la voie à divers avantages diplomatiques."
mongol_foreign_influence.4.a:0 "Que la coopération soit fructueuse !"

mongol_foreign_influence.5.t:0 "Accord [FROM.getAdjective]-[ROOT.getAdjective] refusé"
mongol_foreign_influence.5.d:0 "Malgré nos efforts, [FROM.getLeader] n’a pas été convaincu par nos « vagues promesses et menaces creuses », insinuant que nous cherchions à profiter du traité à notre avantage.\n\nLes négociations ayant échoué, nos diplomates rentrent bredouilles à la capitale, apportant de sombres nouvelles."
mongol_foreign_influence.5.a:0 "Tant pis."

mongol_foreign_influence.6.t:0 "[MON.getAdjective] annonce vouloir intervenir dans la guerre civile"
mongol_foreign_influence.6.d:0 "Affirmant vouloir « résoudre définitivement le conflit en Union soviétique », [MON.getLeader] a publiquement annoncé que le peuple [MON.getAdjective] est prêt à se battre pour l’héritage de la Révolution russe et les idéaux communistes.\n\nPrétendant que l’heure n’est plus de se cacher derrière le géant, [MON.getNameDef] prépare ses forces pour entrer dans la guerre civile russe."
mongol_foreign_influence.6.a:0 "Oh non ! Enfin bref..."

mongol_foreign_influence.10.t:0 "La Mongolie nous invite à sécuriser un seigneur de guerre"
mongol_foreign_influence.10.d:0 "Reconnaissant notre rôle majeur dans la guerre civile chinoise, les diplomates [MON.getAdjective] nous ont proposé de partager les sphères d’influence et de diviser un État seigneur de guerre voisin.\n\nLe plan : tracer les zones stratégiques et satellites à revendiquer, puis lancer un ultimatum exigeant soit une réconciliation, soit leur isolement et destruction rapide.\n\nLe peuple s’interroge : allons-nous rejoindre ce projet et gagner des territoires ? Quelle sera la décision de [ROOT.getLeader] ?"
mongol_foreign_influence.10.a:0 "Nous participerons avec plaisir !"
mongol_foreign_influence.10.b:0 "D’autres affaires priment."

mongol_foreign_influence.11.t:0 "Les [FROM.getAdjective] déploient leurs forces"
mongol_foreign_influence.11.d:0 "[FROM.getLeader] a annoncé l’envoi de diplomates et de troupes pour sécuriser la région sécessionniste.\n\nIl ne reste plus qu’à partager les zones d’influence avec nos alliés, puis à lancer l’ultimatum qui redessinera les plaines centrales à notre avantage, par diplomatie ou par la guerre..."
mongol_foreign_influence.11.a:0 "Splendide !"

mongol_foreign_influence.12.t:0 "Les [FROM.getAdjective] ne sont pas intéressés"
mongol_foreign_influence.12.d:0 "Ne pouvant consacrer de ressources à notre « dangereuse entreprise », [FROM.getLeader] a décliné notre proposition.\n\nNous ne pourrons pas compter sur leur aide, mais est-elle vraiment nécessaire ? Notre ministre des affaires étrangères estime que leur refus nous laisse plus de liberté de manœuvre."
mongol_foreign_influence.12.a:0 "Tant pis pour eux."

mongol_foreign_influence.13.t:0 "Les [FROM.getAdjective] nous présentent un ultimatum !"
mongol_foreign_influence.13.d:0 "Une délégation menée par [MON.getAdjective] nous a remis une liste de revendications où la division de nos terres est discutée !\n\nSelon eux, « l’ère des seigneurs de guerre appartient au passé, et les plaines centrales doivent être réorganisées selon les besoins des puissances régionales capables d’unir des nations fragmentées ».\n\nNotre ministre fut choqué par l’arrogance de ces demandes et le nombre de concessions exigées pour assurer la « coexistence pacifique ».\n\nIl semble que nos ennemis aient minutieusement préparé leur plan..."
mongol_foreign_influence.13.a:0 "Nous céderons."
mongol_foreign_influence.13.b:0 "Jamais nous ne capitulerons !"

mongol_foreign_influence.14.t:0 "Les [FROM.getAdjective] acceptent l’inévitable"
mongol_foreign_influence.14.d:0 "Incapable de résister à la pression diplomatique de la coalition, [FROM.getLeader] a dû démissionner et céder son pouvoir à un gouvernement provisoire qui a redessiné l’administration du pays.\n\nAprès quelques jours difficiles, les territoires ont été transférés aux alliés et l’administration nationale s’est dissoute."
mongol_foreign_influence.14.a:0 "Tout s’est passé comme prévu."

mongol_foreign_influence.15.t:0 "Les [FROM.getAdjective] se mobilisent !"
mongol_foreign_influence.15.d:0 "Pour sauver ce qui reste de leur pays en ruine, [FROM.getLeader] a choisi l’honneur plutôt que « la honte », déclarant la loi martiale et fermant les institutions diplomatiques.\n\nAvec les forces de la coalition à leurs frontières, toute ingérence étrangère est réduite au minimum avant que l’annonce de notre invasion ne parvienne aux diplomates du monde.\n\nLe temps nous est compté, utilisons-le à bon escient."
mongol_foreign_influence.15.a:0 "Ils ont choisi leur destin."
