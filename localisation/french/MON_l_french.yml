MON_demotivated_army_desc:0 ""

MON_anti_raiding_defense:0 "Stratagèmes anti-raid"
MON_anti_raiding_defense_desc:0 ""

MON_deprived_army:0 "Armée privée de moyens"
MON_deprived_army_desc:0 ""

