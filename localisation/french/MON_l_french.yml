#Industrie#
MON_ill_educated_population_idea:0 "Population peu instruite"
MON_ill_educated_population_idea_desc:0 "En raison de sa situation géographique et de la spécificité de sa langue, le pays ne dispose pas d’un système éducatif centralisé capable de soutenir les jeunes esprits curieux. Le taux d’alphabétisation de la nation était estimé à seulement 10 % au début des années 1930."

MON_population_learning_idea:0 "Apprentissage de la population"
MON_population_learning_idea_desc:0 "Les réformes éducatives des dernières années se sont révélées plutôt efficaces. Le niveau global d’alphabétisation s’améliore et de plus en plus de personnes souhaitent accéder au savoir."

Mon_elementary_schools_idea:0 "Écoles primaires étendues"
Mon_elementary_school_ideas_desc:0 "Des fonds publics ont été alloués pour élargir considérablement les standards éducatifs à travers le pays."

Mon_tech_coop_idea:0 "Coopération technologique"
Mon_tech_coop_idea_desc:0 "Nous avons beaucoup à apprendre de nos partenaires. Que cette coopération soit plus fructueuse que jamais !"

Mon_soviet_advisors_idea:0 "Conseillers militaires [SOV.getAdjective]"
Mon_soviet_advisors_idea_desc:0 "Des spécialistes militaires [SOV.getAdjective] ont été envoyés sur notre sol dans le cadre du traité d’assistance mutuelle."

Mon_soviet_crew_idea:0 "État-major militaire [SOV.getAdjective]"
Mon_soviet_crew_idea_desc:0 "Plusieurs généraux et théoriciens [SOV.getAdjective] assistent notre état-major."

MON_changed_script_idea:0 "Réforme de l’écriture"
MON_changed_script_idea_desc:0 "L’ancien alphabet mongol comportait différentes formes d’écriture, ce qui freinait fortement l’apprentissage de nos enfants. Les changements apportés permettent désormais à la population d’apprendre plus efficacement."

MON_script_reform_in_progress_idea:0 "Réforme de l’écriture en cours"
MON_script_reform_in_progress_idea_desc:0 "D’importants efforts sont entrepris pour unifier le système d’écriture désorganisé de [MON.getNameDef]."

MON_weak_currency_idea:0 "Monnaie faible"
MON_weak_currency_idea_desc:0 "Malgré l’introduction de la monnaie nationale en 1925, le tugrik reste impopulaire parmi la population, qui préfère utiliser le yuan chinois, le rouble soviétique, le dollar américain ou mexicain et une dizaine d’autres devises de faible valeur circulant sur le marché noir."

MON_new_course_policy_idea:0 "Politique du nouveau cours"
MON_new_course_policy_idea_desc:0 "Les politiques de collectivisation inhumaines appliquées au début des années 1930 ont presque provoqué une insurrection dans l’Ouest du pays, rapidement réprimée par l’armée et par des promesses de meilleures conditions de vie connues sous le nom de « Politique du nouveau cours », comparable à la NEP de Lénine."

MON_buddhist_opposition:0 "Opposition bouddhiste"
MON_buddhist_opposition_desc:0 "La religion est profondément enracinée dans la société mongole et de nombreuses institutions religieuses utilisent leur pouvoir pour s’opposer ouvertement aux politiques de l’État et aux directives du Comité central. Une grande partie des hommes des campagnes ont consacré leur vie aux monastères et refusent de participer aux affaires de l’État."

MON_dominated_animal_husbandry_idea:0 "Élevage dominant"
MON_dominated_animal_husbandry_idea_desc:0 "Le mode de vie nomade est courant dans les vastes plaines du pays, et les appels à l’industrialisation n’ont atteint qu’une poignée d’individus au sommet du pouvoir."

MON_animal_husbandry_prioritised_idea:0 "Élevage priorisé"
MON_animal_husbandry_prioritised_idea_desc:0 "Notre héritage et notre réussite reposent sur l’élevage : ce qui a fonctionné pendant des siècles fonctionnera aussi dans l’avenir."

MON_industrial_growth_prioritised_idea:0 "Croissance industrielle priorisée"
MON_industrial_growth_prioritised_idea_desc:0 "Des siècles d’exploitation animale doivent être inversés dans un effort conjoint visant à atteindre les objectifs de la révolution industrielle nationale !"

MON_encourage_trade_idea:0 "Commerce encouragé"
MON_encourage_trade_idea_desc:0 "Notre marché bénéficie grandement des nouveaux accords commerciaux conclus !"

MON_improved_mining_facilities_idea:0 "Installations minières améliorées"
MON_improved_mining_facilities_idea_desc:0 "Avec quelques investissements publics, notre industrie d’extraction et d’exploitation est capable de fournir davantage de ressources au marché national."

MON_focus_on_south:0 "Se concentrer sur le Sud"

MON_modernizing_transportation_system:0 "Modernisation du système de transport"

Mongolbank_very_high_funds:0 "§HMongolbank – Fonds très élevés§!"
Mongolbank_very_high_funds_desc:0 "Il est difficile de gérer correctement le système bancaire, mais l’économie est florissante !"

Mongolbank_high_funds:0 "§HMongolbank – Fonds élevés§!"
Mongolbank_high_funds_desc:0 "La gestion des finances reste problématique, mais l’industrie en tire de grands bénéfices."

Mongolbank_moderate_funds:0 "§HMongolbank – Fonds modérés§!"
Mongolbank_moderate_funds_desc:0 "Une approche équilibrée de la gouvernance et du soutien à l’industrie."

Mongolbank_low_funds:0 "§HMongolbank – Fonds faibles§!"
Mongolbank_low_funds_desc:0 "Le peu d’argent et de prêts potentiels freine la croissance économique du pays."

Mongolbank_bankrupt:0 "§HMongolbank – Faillite§!"
Mongolbank_bankrupt_desc:0 "En faillite et incapable d’accorder de nouveaux prêts. Une intervention directe du gouvernement est nécessaire !"

MON_foreign_tribute_idea:0 "Tribut étranger"
MON_soviet_NKVD_agents:0 "Agents soviétiques du NKVD"
MON_soviet_NKVD_agents_desc:0 "L’héritage de la révolution de 1924 a vu l’instauration d’un système de parti unique reposant fortement sur le soutien et la supervision d’experts civils et militaires soviétiques. Certains de ces spécialistes exercent une emprise étroite sur la politique du pays."

