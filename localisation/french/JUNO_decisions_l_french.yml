 ARG_appease_the_axis: "Apaiser l’Axe"
 ARG_economic_tax_reforms_decisions: "Réformes fiscales économiques"
 ARG_economic_tax_reforms_decisions_desc: "En réformant notre système fiscal actuel, nous pourrions être en mesure d’apporter une aide aux zones rurales de [ARG.GetName]. Créer des infrastructures viables pour nos communautés agricoles ne pourra qu’accroître la prospérité de notre pays !"
 ARG_economic_tax_reforms_decisions_tt: "Débloque les décisions de §Yréforme fiscale économique§!."
 ARG_economic_reform_in_state: "Réforme fiscale en [FROM.GetName]."
 ARG_balancing_act_decisions: "Équilibre diplomatique"
 ARG_balancing_act_decisions_desc: "Alors que notre nouveau gouvernement se remet sur pied, nous sommes de nouveau confrontés au défi de maintenir des relations à la fois avec les Alliés et avec l’Axe. Cette guerre ne semble pas près de se terminer, il est donc crucial de gérer nos alliances avec prudence. Favoriser un camp risque fort de mécontenter l’autre."
 ARG_balancing_act_decisions_tt: "Débloque les décisions d’§Yéquilibre diplomatique§!, permettant de choisir entre apaiser [USA.GetFlag]§Y[USA.GetName]§! et [ENG.GetFlag]§Y[ENG.GetName]§! ou bien [GER.GetFlag]§Y[GER.GetName]§! et [ITA.GetFlag]§Y[ITA.GetName]§!. L’apaisement procurera des §Ysubventions en équipement§! sur le §Ymarché international§!."
 ARG_military_coup_decisions: "Dissidence militaire"
 ARG_military_coup_decisions_desc: "Alors que notre nouveau gouvernement fête sa victoire électorale, un sentiment de mécontentement grandit au sein de l’armée. Avec tant de corruption dans la Concordancia et de nombreux officiers cherchant à accroître leur pouvoir, ce n’est qu’une question de temps avant qu’ils ne marchent sur Buenos Aires."
 ARG_military_coup_attempt: "Tentative de coup d’État militaire imminente"
 military_coup_attempt_happened: "Une tentative de coup d’État militaire a eu lieu"
 ARG_military_state_absorption_mission: "L’armée rallie du soutien"
 ARG_military_state_absorption_timer_tt: "Un État de [ARG.GetName] se ralliera à l’armée."
 ARG_military_owned_state: "Présence de cellules militaires"
 ARG_military_owned_state_desc: "Cet État est connu pour abriter de nombreuses cellules militaires rebelles. Si nous laissons cette situation perdurer, le risque de coup d’État augmentera."
 ARG_sanction_the_generals: "Sanctionner les généraux"
 ARG_sanction_the_generals_tt: "Augmente le délai avant le lancement de la tentative de coup d’État, laissant moins de temps de préparation aux officiers rebelles."
 ARG_consolidating_power_tt: "§RCela provoquera la colère de l’armée et réduira le délai avant le lancement de la tentative de coup d’État.§!"
 ARG_increase_military_salaries: "Augmenter les salaires militaires"
 ARG_federal_intervention_tt: "Mettre en place une intervention fédérale dans un État empêchera la faction militaire de l’absorber lors d’un coup d’État et d’une éventuelle guerre civile."
 ARG_south_american_unity_decisions_tt: "Débloque les décisions d’§Yunité sud-américaine§!, permettant d’intégrer les territoires conquis dans notre nation."
 ARG_south_american_unity_decisions: "Unité sud-américaine"
 ARG_south_american_unity_decisions_desc: "Maintenant que nous avons uni les peuples d’Amérique du Sud sous une même bannière, nous pouvons affirmer notre domination sur le continent en intégrant les territoires des anciennes grandes nations, un par un."
 ARG_core_conquered_state: "Intégrer [FROM.GetName]"
 ARG_island_negotiations_decisions_tt: "Débloque les décisions de §Ynégociations insulaires§!, qui nous permettront de négocier la paix avec ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) si nous ne sommes pas impliqués dans un conflit d’ampleur plus large."
 ARG_island_negotiations_decisions: "Négociations insulaires"
 ARG_island_negotiations_decisions_desc: "Les îles de l’Atlantique Sud sont un territoire contesté, et le débat sur la souveraineté ne cesse de se poursuivre. Cette guerre pourrait aller bien au-delà de ce qui serait souhaitable, et nous devrions saisir toute occasion de négocier une paix."
 ARG_peace_out: "Négocier avec [ENG.GetNameDef]"
 ARG_england_demands_peace: "Négocier avec [ARG.GetNameDef]"
 ARG_united_workers_decisions_tt: "Débloque les décisions d’§Yunification des travailleurs§!."
 ARG_unite_the_workers_decisions: "Unifier les travailleurs"
 ARG_unite_the_workers_decisions_desc: "L’épine dorsale du mouvement communiste a toujours été le prolétariat travailleur et opprimé. Alors que le paysage politique [ARG.GetAdjective] s’oriente désormais vers la gauche, il revient au PCA de déclencher des grèves ouvrières dans certaines de nos grandes villes afin de rallier le peuple à notre glorieuse révolution !"
 ARG_instigate_worker_strike: "Déclencher une grève ouvrière en [FROM.GetName]"
 ARG_uniting_workers_in_progress: "Grève ouvrière en cours"
 ARG_support_the_farmers_decisions_tt: "Débloque les décisions de §Ysoutien aux paysans§!."
 ARG_support_the_farmers_decisions: "Soutenir les paysans"
 ARG_support_the_farmers_decisions_desc: "Alors que nous établissons un standard d’égalité pour tous dans notre nouvel État communiste, il est primordial de ne pas oublier le prolétariat qui a travaillé dur pendant des décennies dans les champs de [ARG.GetNameDef]. Nous devons investir pour soutenir les paysans afin de leur offrir autant de chances d’avoir une vie décente que ceux qui vivent en ville."
 ARG_implement_rural_reforms: "Mettre en œuvre des réformes rurales"
 ARG_implemented_rural_reforms: "Réformes rurales appliquées"
 ARG_osmar_hellmuth_event_tt: "Déclenche l’événement « §YLa question d’Osmar Hellmuth§! », qui nous permet de décider de le libérer et de l’employer comme §Yagent§! ou de le laisser en prison."

