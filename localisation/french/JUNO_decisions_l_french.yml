 PRU_pastaza_conflict: "Tensions en Amazonie"
 PRU_pastaza_conflict_desc: "Bien que nos dirigeants aient réglé les différends frontaliers avec la Colombie grâce au Protocole de Rio de 1934, le conflit avec les Équatoriens demeure. Ils continuent de revendiquer des zones aux propriétaires de facto ambigus, telles que les régions de Napo Pastaza et Santiago Zamora. Si l’occasion se présente, nous devrions nous emparer de ces territoires, par la force si nécessaire."

