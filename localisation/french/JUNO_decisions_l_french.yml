 ARG_international_loan_decisions: "Prêts internationaux"
 ARG_international_loan_decisions_desc: "Afin de restaurer l’économie [ROOT.GetAdjective], il serait judicieux de solliciter les grandes puissances mondiales pour obtenir un prêt et relancer notre processus de redressement. Cependant, nous devons veiller à ne pas trop nous endetter."
 ARG_international_loan_decisions_tt: "Débloque les décisions de §YPrêt international§!. Si les nations ciblées acceptent, le [ROOT.GetNonIdeologyName] gagne :\n$ARG_international_loan_tt$"
 ARG_international_loan_tt: "Ajoute §Y$ARG_international_loan_modifier$§! qui confère :\nCoût quotidien en pouvoir politique : §R-20.0%§!\nEfficacité d’extraction des ressources : §G+5.0%§!\nVitesse de construction : §G+4.0%§!\nProduction d’usines : §G+6.0%§!\nProduction de chantiers navals : §G+6.0%§!\n"
