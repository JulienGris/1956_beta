 PRU_has_ended_their_invasion_lost: "Déjà retiré d’Amazonie"

 hispaniola_category: "L’unification d’Hispaniola"
 hispaniola_category_desc: "Malgré une histoire longue et relativement similaire, l’ouest et l’est d’Hispaniola ne sont pas unifiés depuis bien longtemps. Aujourd’hui cependant, le temps est venu d’unifier l’île !"

 unite_hispaniola: "Unifier Hispaniola"

 peru_bolivia_category: "La Confédération péruano-bolivienne"
 peru_bolivia_category_desc: "Bien que la Confédération péruano-bolivienne n’ait duré que de 1836 à 1839, elle reste gravée dans la mémoire de notre peuple. Si nous restaurons une grande partie des anciennes frontières, il ne serait pas inconcevable de raviver cet État perdu et de nous proclamer ses nouveaux dirigeants."

 reunite_peru_bolivia: "Raviver la Confédération"

 guianas_category: "Unifier la Guyane"
 guianas_category_desc: "La région guyanaise est depuis longtemps morcelée entre différentes puissances coloniales, occupant les sous-régions de Cayenne, Guyana, Amapá, Suriname et Guayana. Il est grand temps que la région soit libérée des forces qui l’occupent !"

 unite_guiana: "Unifier les Guyanes"

 drill_for_oil_in_chaco_boreal: "Forer du pétrole dans le Chaco"
 drill_for_oil_in_chaco_boreal_desc: "La compagnie américaine Standard Oil avait découvert du pétrole dans la région à la fin des années 20, mais choisit de ne pas pousser l’exploration, jugeant cela trop coûteux. Si nous le souhaitons, nous pourrions entreprendre l’effort qu’ils n’avaient pas osé tenter à l’époque."

