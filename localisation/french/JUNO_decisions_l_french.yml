 ARG_intervenciones_federales_decisions: "Intervenciones Federales"
 ARG_intervenciones_federales_decisions_desc: "La menace croissante de coups d’État contre notre nouveau cabinet a entraîné l’activation des intervenciones federales. Nous devons choisir les États dans lesquels appliquer cette nouvelle législation. Cela nous permettra de mobiliser et soutenir plus efficacement les personnes prêtes à défendre leur gouvernement."
 ARG_intervenciones_federales_decisions_tt: "Débloque les décisions §YIntervenciones Federales§!, qui nous permettent de contrer les §Ycellules militaires§! issues de la §Ytentative de coup d’État militaire imminente§!."
 ARG_federal_intervention_in_state: "Intervenir en [FROM.GetName]"
 ARG_federal_intervention_modifier: "Intervention fédérale"
 ARG_federal_intervention_modifier_desc: "Une intervention fédérale a été mise en place dans cet État, ce qui nous a permis de le protéger contre toute dissidence et rébellion croissantes."
