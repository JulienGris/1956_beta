## Cairo Conference ##
cairoC.1.t:0 "Organiser une conférence avec [CHI.GetName] et [ENG.GetName] ?"
cairoC.1.d:0 "Avec notre guerre en cours contre [JAP.GetName], il est logique que nous nous unissions pour faire face à la menace [JAP.GetAdjective]. Pour ce faire, nous devrions discuter avec leurs dirigeants et chercher une collaboration plus étroite."
cairoC.1.a:0 "Envoyer le message."
cairoC.1.b:0 "Inutile."
cairoC.2.t:0 "Message de [From.GetName]"
cairoC.2.d:0 "[From.GetLeader] a envoyé un message à [Root.GetLeader] exprimant son désir d’une collaboration plus étroite entre ceux capables de freiner les ambitions de [JAP.GetName]. [CHI.GetLeader] est également invité."
cairoC.2.d_2:0 "[From.GetLeader] a envoyé un message à [Root.GetLeader] exprimant son désir d’une collaboration plus étroite entre ceux capables de freiner les ambitions de [JAP.GetName]. [ENG.GetLeader] est également invité."
cairoC.2.a:0 "Nous pourrions en tirer profit."
cairoC.2.b:0 "Nous pouvons vaincre [JAP.GetName] sans eux."
cairoC.3.t:0 "[From.GetName] accepte"
cairoC.3.d:0 "[From.GetLeader] a répondu à [Root.GetLeader] et a confirmé sa participation à la conférence."
cairoC.3.a:0 "Nous sommes plus forts ensemble."
cairoC.4.t:0 "[From.GetLeader] refuse"
cairoC.4.d:0 "[From.GetLeader] a refusé notre invitation et déclaré que notre collaboration n’était même pas nécessaire."
cairoC.4.a:0 "Quelle déception."
cairoC.5.t:0 "Les conditions"
cairoC.5.d:0 "Avec tous les participants présents et tout prêt, les discussions commencent. Les termes suivants ont été présentés et attendent une approbation."
cairoC.5.a:0 "Cela semble acceptable."
cairoC.5.b:0 "Est-ce une arnaque !?"
cairoC.6.t:0 "Conférence de [CairoC_venue.GetName]"
cairoC.6.d_fail:0 "Malgré la tentative de [USA.GetLeader] d’obtenir une collaboration plus étroite entre ceux capables d’arrêter les ambitions de [JAP.GetName], l’idée a complètement échoué. La discussion n’a jamais abouti et certains pensent que cela pourrait mener à de futurs conflits après la défaite de [JAP.GetName]."
cairoC.6.d_noUS:0 "Bien que ce soit l’idée de [USA.GetLeader], la conférence s’est terminée sans sa participation. [CHI.GetLeader] et [ENG.GetLeader] ont trouvé un accord que [USA.GetLeader] n’a pas pu accepter. Cependant, [ENG.GetLeader] semble écœuré par le fait que [CHI.GetName] puisse tirer un avantage politique des termes.\n\nCertains experts disent que cette conférence pourrait rapidement détériorer les relations entre [ENG.GetName] et [USA.GetName] et même provoquer des divisions dans le monde démocratique."
cairoC.6.d_noBR:0 "[CHI.GetLeader] et [USA.GetLeader] ont trouvé un accord pour lutter contre la menace [JAP.GetAdjective]. Cependant, [ENG.GetLeader], également invité, a quitté la conférence avant de signer pour des raisons inconnues.\n\nOn soupçonne que [ENG.GetLeader] est parti car les termes discutés nuisaient à ses intérêts coloniaux dans la région et profitaient largement à [CHI.GetName]."
cairoC.6.d_noCN:0 "Après un débat houleux, [CHI.GetLeader] a quitté la conférence, mécontent, jugeant les termes « inacceptables ». De retour à [CairoC_venue.GetName], [ENG.GetLeader] et [USA.GetLeader] ont signé un accord qui contribuera à l’effort de guerre contre [JAP.GetName]."
cairoC.6.d_suc:0 "Tous les dirigeants invités ont trouvé un accord pour une collaboration plus étroite contre la menace [JAP.GetAdjective]. Certains experts disent que cette conférence marquera la chute de [JAP.GetName] dans un futur proche, car trois des nations les plus puissantes du monde se sont unies contre lui."
cairoC.6.a:0 "À bas les chiens [JAP.GetAdjective] !"
cairoC.6.b:0 "Des enfantillages..."
cairoC.6.c:0 "Un développement intéressant..."
cairoC.8.d:0 "Les termes suivants ont été approuvés et nous allons maintenant lutter ensemble contre la menace [JAP.GetAdjective] !"
KMT_no_seperate_peace_with_JAP:0 "Ne pourra pas signer de paix séparée avec [JAP.GetName]\n"

