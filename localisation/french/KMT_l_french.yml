 ### Événements jyutgwai ###
 #jyutgwai.1.t:0 "Mort de Hu Hanmin"
 #jyutgwai.1.d:0 "Hu Hanmin, l’un des premiers dirigeants conservateurs de droite du Kuomintang durant la Chine révolutionnaire, est malheureusement décédé. Ses funérailles sont prévues dans 5 jours. De nombreuses figures importantes devraient y assister, dont Chiang."
 #jyutgwai.1.a:0 "Ses actions ne seront pas oubliées."

 #jyutgwai.2.t:0 "Funérailles de Hu Hanmin"
 #jyutgwai.2.d:0 "Avec la mort de Hu Hanmin, ses funérailles auront lieu quelques jours plus tard. Chiang a prévu de rencontrer [YUT.GetLeader] là-bas et de solliciter son aide pour détruire la Nouvelle Clique du Guangxi ainsi que ses rivaux politiques, Li Zongren."
 #jyutgwai.2.a:0 "Un plan judicieux."
 #jyutgwai.2.b:0 "Pas besoin de cette approche, notre armée fera le travail."
 #jyutgwai.2.c:0 "Nous devrions plutôt nous concentrer sur la menace japonaise."

 #jyutgwai.3.t:0 "Proposition de Chiang"
 #jyutgwai.3.d:0 "Après avoir rencontré [CHI.GetLeader] durant les funérailles de Hu Hanmin, [Root.GetLeader] a reçu une proposition – ou un ultimatum, comme certains l’appelleraient – de sa part. Le détail est de solliciter notre aide pour détruire la clique de [GXC.GetLeader]. [Root.GetLeader] craint que si la Nouvelle Clique du Guangxi est détruite, sa propre clique subira le même sort."
 #jyutgwai.3.a:0 "Contacter [GXC.GetLeader] pour un front uni !"
 #jyutgwai.3.b:0 "Nous prendrons Nankin et renverserons le régime de [CHI.GetLeader] !"
 #jyutgwai.3.c:0 "Se soumettre avant qu’il ne soit trop tard !"

 #jyutgwai.4.t:0 "Proposition de [YUT.GetLeader]"
 #jyutgwai.4.d:0 "[YUT.GetLeader] a révélé le plan de [CHI.GetLeader] visant à détruire notre clique. Cependant, craignant de connaître le même sort si nous étions détruits, il cherche maintenant une alliance avec nous au lieu d’aider le [CHI.GetRulingParty]."
 #jyutgwai.4.a:0 "Nous lutterons ensemble contre une telle tyrannie."
 #jyutgwai.4.b:0 "Ils ne font que nous mener en bateau."

 #jyutgwai.5.t:0 "Alliance acceptée"
 #jyutgwai.5.d:0 "[GXC.GetLeader] a accepté notre proposition d’alliance et prépare désormais ses troupes !"
 #jyutgwai.5.a:0 "Mort à [CHI.GetLeader] !"

 #jyutgwai.6.t:0 "Alliance rejetée"
 #jyutgwai.6.d:0 "[GXC.GetLeader] a rejeté notre proposition d’alliance !"
 #jyutgwai.6.a:0 "Comment osent-ils !"

 #jyutgwai.7.t:0 "[YUT.GetName] refuse de se soumettre"
 #jyutgwai.7.d:0 "[YUT.GetLeader] a refusé de nous aider à détruire la clique de [GXC.GetLeader] !"
 #jyutgwai.7.a:0 "Essayons de soudoyer certains de leurs hommes."
 #jyutgwai.7.b:0 "En y repensant, nous devrions peut-être arrêter cela."

 #jyutgwai.8.t:0 "Yu Hanmou"
 #jyutgwai.8.d:0 "Certains de nos hommes ont été soudoyés par [From.GetLeader] et ont fait défection vers l’ennemi. Le gouvernement central a également relevé Chen Jitang de ses fonctions. Désormais, Yu Hanmou, partisan de Chiang, a accédé à son poste. Un ultimatum est envoyé à Chen Jitang pour qu’il renonce à son pouvoir sur l’armée et se soumette au gouvernement central."
 #jyutgwai.8.a:0 "Aider Chen Jitang à fuir à Hong Kong !"
 #jyutgwai.8.b:0 "Convaincre Chen Jitang de rejoindre la Nouvelle Clique du Guangxi !"
 #jyutgwai.8.c:0 "Ce salaud de traître !"

 #jyutgwai.9.t:0 "La Nouvelle Clique du Guangxi"
 #jyutgwai.9.d:0 "Avec Chen Jitang et son comportement rebelle écartés, seuls [GXC.GetLeader] et ses hommes s’opposent à nous. Nos tentatives de corruption se sont révélées infructueuses. Il semble que nous devions trouver une autre voie."
 #jyutgwai.9.a:0 "Essayons de les soudoyer."
 #jyutgwai.9.b:0 "Nous devrions concentrer nos efforts sur les Japonais."

 #jyutgwai.10.t:0 "Recrutement d’urgence"
 #jyutgwai.10.d:0 "Le [CHI.GetRulingParty] a entrepris certaines actions, leurs pots-de-vin ont semé la dissension au sein de la Clique du Yue. Nous devrions préparer nos hommes au cas où une guerre éclaterait !"
 #jyutgwai.10.a:0 "Nous devons envoyer des représentants à Nankin pour une solution plus pacifique."
 #jyutgwai.10.b:0 "Jaak3 si2 laa1, zoeng2 gaai3 sek6"

 #jyutgwai.11.t:0 "Pression des médias"
 #jyutgwai.11.d:0 "Avec les tensions persistantes entre nous et [GXC.GetLeader], la majorité des médias soutiennent [GXC.GetLeader] plutôt que nous. Cela est dû en grande partie à notre politique actuelle de priorité à la stabilité interne plutôt qu’à la menace japonaise."
 #jyutgwai.11.a:0 "Nous devons d’abord éliminer la maladie du cœur !"
 #jyutgwai.11.b:0 "Si nous continuons ainsi, nous risquons de perdre encore plus de soutien populaire."

 #jyutgwai.12.t:0 "Incident résolu"
 #jyutgwai.12.d:0 "Après de longues discussions entre les représentants des deux parties, un consensus a été trouvé. Le soi-disant « incident du Liangguang » est désormais réglé."
 #jyutgwai.12.a:0 "C’est pour le bien du peuple chinois."

 #jyutgwai.13.t:0 "[From.GetName] envoie des représentants"
 #jyutgwai.13.d:0 "Des représentants de [From.GetName] sont arrivés à [Root.Capital.GetName]. Ils ont déclaré que leur mission ici est de trouver une solution pacifique à la situation actuelle."
 #jyutgwai.13.a:0 "Voyons ce qu’ils ont à offrir."
 #jyutgwai.13.b:0 "Arrêtez ces conspirateurs !"

 #jyutgwai.14.t:0 "Hostilité de [From.GetLeader]"
 #jyutgwai.14.d:0 "[From.GetLeader] a décidé de résoudre la situation actuelle par la force."
 #jyutgwai.14.a:0 "Très bien alors."

 #jyutgwai.15.t:0 "Chen Jitang se soumet"
 #jyutgwai.15.d:0 "Chen Jitang a décidé de se soumettre au gouvernement central."
 #jyutgwai.15.a:0 "Une sage décision."
 #jyutgwai.15.b:0 "Nous reprendrons bientôt le contrôle de la plaine centrale."
 #KMT_may_war:0 "§RCela mènera très probablement à la guerre§!\n"
 #GXC_reject_1_tt:0 "§YNous prendrons le contrôle du Guangdong s’ils acceptent cette contre-proposition§!"
 #CHI_reject_1_tt:0 "§YIls deviendront nos marionnettes s’ils acceptent cette contre-proposition§!"

 #jyutgwai.16.t:0 "Une opportunité ?"
 #jyutgwai.16.d:0 "Avec la guerre en cours entre le [CHI.GetRulingParty] de [CHI.GetLeader] et le [GXC.GetRulingParty] de [GXC.GetLeader], le gouvernement central ne prête pas attention à nous. Nous pourrions saisir cette occasion pour lancer une offensive et tenter de renverser leur régime à [CHI.Capital.GetName]."
 #jyutgwai.16.a:0 "Prochaine étape, [CHI.Capital.GetName] !"
 #jyutgwai.16.b:0 "Où est mon oolong déjà ?"

 #jyutgwai.17.t:0 "[From.GetLeader] accepte de négocier"
 #jyutgwai.17.d:0 "Après mûre réflexion, [From.GetLeader] a accepté d’organiser une réunion avec nos représentants afin de discuter d’une solution plus pacifique pour régler la situation actuelle."
 #jyutgwai.17.a:0 "Nous devons être prêts à tout."
 #negotiate_in_20:0 "§YUn événement se déclenchera dans environ 35 jours.§!\n\n"

 #jyutgwai.18.t:0 "Représentants arrêtés"
 #jyutgwai.18.d:0 "Nos représentants envoyés pour négocier avec le [CHI.GetRulingParty] ont été arrêtés. Il semble que [CHI.GetLeader] veuille régler cela sur le champ de bataille."
 #jyutgwai.18.a:0 "Très bien, nos hommes se battront jusqu’au dernier souffle !"

 #jyutgwai.19.t:0 "[From.GetName] lance une offensive"
 #jyutgwai.19.d:0 "Pensant que nous sommes distraits par notre conflit actuel avec le [GXC.GetRulingParty] de [GXC.GetLeader], [From.GetLeader] a décidé de nous attaquer !"
 #jyutgwai.19.a:0 "Traître !"

 #jyutgwai.20.t:0 "Exigences des deux camps"
 #jyutgwai.20.d:0 "Après un long débat, les représentants des deux parties ont trouvé un consensus.\n\nRésultat de la discussion :\n\n[CHI.GetName] et [GXC.GetName] retireront leurs troupes.\nLe gouvernement central n’interviendra pas dans les affaires du Liangguang.\n[GXC.GetName] devra obéir absolument aux ordres du gouvernement central une fois la guerre déclenchée.\n\nCependant, [CHI.GetLeader] et [GXC.GetLeader] devront tous deux accepter ces termes pour qu’ils prennent effet."
 #jyutgwai.20.a:0 "Acceptable"
 #jyutgwai.20.b:0 "Humiliant !"

 #jyutgwai.22.t:0 "Contre-proposition de [CHI.GetName]"
 #jyutgwai.22.d:0 "Considérant les termes comme inégaux et humiliants, [CHI.GetLeader] a ordonné une contre-proposition exigeant que notre clique se place directement sous son contrôle."
 #jyutgwai.22.a:0 "Finissons-en simplement."
 #jyutgwai.22.b:0 "Fang shen me gou pi !"

 #jyutgwai.23.t:0 "Contre-proposition de [GXC.GetName]"
 #jyutgwai.23.d:0 "Considérant les termes comme inégaux et humiliants, [GXC.GetLeader] a ordonné une contre-proposition exigeant que la région du Liangguang passe sous leur contrôle direct comme compensation."

 #jyutgwai.24.t:0 "Contre-proposition rejetée"
 #jyutgwai.24.d:0 "Notre contre-proposition a été rejetée, il ne semble rester qu’une seule option."
 #jyutgwai.24.a:0 "Préparez-vous !"

 #jyutgwai.25.t:0 "Contre-proposition acceptée"
 #jyutgwai.25.d:0 "À notre surprise, notre contre-proposition a été acceptée."
 #jyutgwai.25.a:0 "Au moins nous évitons la guerre."

 #jyutgwai.26.t:0 "Échec de la négociation"
 #jyutgwai.26.d:0 "Les deux camps ont rejeté les termes. Une autre négociation semble impossible, les deux parties ont commencé à mobiliser leurs troupes."
 #jyutgwai.26.a:0 "Nous le savions !"

 #jyutgwai.27.t:0 "Situation résolue"
 #jyutgwai.27.d:0 "Les deux camps ont retiré leurs troupes, la tension est désormais apaisée."
 #jyutgwai.27.a:0 "Bon pour tout le monde."

 #jyutgwai.29.t:0 "[From.GetRulingParty] décide de nous laisser tranquilles"
 #jyutgwai.29.d:0 "D’une manière ou d’une autre, les responsables de [From.GetRulingParty] ont décidé de nous laisser partir et de ne pas agir davantage contre nous."
 #jyutgwai.29.a:0 "Heu... quoi ? Sont-ils sérieux ?"

 #jyutgwai.30.t:0 "Tentative de corruption échouée"
 #jyutgwai.30.d:0 "Malgré notre générosité, les généraux et soldats de [From.GetName] ne semblent pas vouloir abandonner leur maître. Notre tentative de corruption a échoué."
 #jyutgwai.30.a:0 "Alors, recourons à la violence."
 #jyutgwai.30.b:0 "Nous les écraserons par la force !"
 #jyutgwai.30.c:0 "Attendons de voir comment les choses évolueront."

 #jyutgwai.31.t:0 "Corruption acceptée"
 #jyutgwai.31.d:0 "Notre pot-de-vin a été bien accueilli par la plupart des généraux de [From.GetName] et beaucoup ont fait défection à notre camp."
 #jyutgwai.31.a:0 "Cela prouve simplement leur faiblesse."

 #jyutgwai.32.t:0 "Nos hommes ont résisté à la corruption"
 #jyutgwai.32.d:0 "Nos hommes ont résisté aux pots-de-vin de [From.GetLeader]. Nous sommes maintenant plus unis que jamais !"
 #jyutgwai.32.a:0 "La justice triomphera !"

 #jyutgwai.33.t:0 "Incident du Liangguang"
 #jyutgwai.33.d:0 "Avec l’incident du Liangguang en cours, [CHI.GetLeader] est désormais occupé à gérer les problèmes dans le sud. C’est l’occasion pour nous d’agir : nous pouvons d’abord chercher la paix avec les communistes pour préserver nos hommes."
 #jyutgwai.33.a:0 "Appeler à une trêve."
 #jyutgwai.33.b:0 "Non, le communisme est un fléau pour le peuple chinois."

 #jyutgwai.34.t:0 "[From.GetLeader] veut une trêve"
 #jyutgwai.34.d:0 "[From.GetLeader] a envoyé un représentant pour appeler à une trêve entre nos troupes. Avec [CHI.GetLeader] occupé au sud, nous pouvons profiter de cette occasion pour récupérer."
 #jyutgwai.34.a:0 "Très bien"
 #jyutgwai.34.b:0 "C’est sûrement un piège !"

 #jyutgwai.35.t:0 "[From.GetName] accepte"
 #jyutgwai.35.d:0 "[From.GetName] a accepté une trêve, nous pouvons désormais nous remettre et avancer dans nos plans."
 #jyutgwai.35.a:0 "Brillant !"

 #jyutgwai.36.t:0 "[From.GetLeader] refuse"
 #jyutgwai.36.d:0 "[From.GetName] a refusé l’accord de trêve, nous devons continuer à nous battre."
 #jyutgwai.36.a:0 "Ce n’est pas bon."

 #jyutgwai.37.t:0 "Zhang Xueliang cesse d’attaquer"
 #jyutgwai.37.d:0 "Nous avons appris que Zhang Xueliang a cessé d’attaquer les communistes. Il doit penser que nous sommes trop occupés par les seigneurs de guerre du sud pour lui prêter attention, et il tente sans doute une manigance."
 #jyutgwai.37.a:0 "Nous nous occuperons d’eux plus tard…"

 #jyutgwai.38.t:0 "Un dilemme"
 #jyutgwai.38.d:0 "Avec les forces de [CHI.GetLeader] approchant de notre frontière et le représentant de [GXC.GetLeader] tentant de persuader [Root.GetLeader], nous sommes désormais dans un dilemme entre le [CHI.GetRulingParty] et le [GXC.GetRulingParty]. Si nous nous allions à l’un d’eux, l’autre sera mécontent. Et la neutralité nous est interdite."
 #jyutgwai.38.a:0 "Essayons de duper [CHI.GetLeader] en plaçant ses forces en première ligne."
 #jyutgwai.38.b:0 "S’allier au [CHI.GetRulingParty]"
 #jyutgwai.38.c:0 "S’allier au [GXC.GetRulingParty]"

 #jyutgwai.39.t:0 "Proposition de [From.GetLeader]"
 #jyutgwai.39.d:0 "Pris dans une situation de dilemme, [From.GetLeader] a tenté de s’allier à nous et a envoyé une proposition stipulant que les forces de [Root.GetLeader] devraient être placées en première ligne pour une frappe efficace dans l’offensive à venir."
 #jyutgwai.39.b:0 "C’est clairement un plan pour affaiblir nos forces !"
 #jyutgwai.39.a:0 "Ça semble bien."

 #jyutgwai.40.t:0 "Proposition acceptée"
 #jyutgwai.40.d:0 "[From.GetLeader] a approuvé notre proposition et placé ses forces en première ligne."
 #jyutgwai.40.a:0 "Quelle chance pour nous."

 #jyutgwai.41.t:0 "Proposition rejetée"
 #jyutgwai.41.d:0 "[From.GetLeader] a vu clair dans la ruse de He Jian et est désormais furieux. He Jian a été relevé de ses fonctions."
 #jyutgwai.41.a:0 "Tant pis…"

 #jyutgwai.42.t:0 "[From.GetName] nous rejoint"
 #jyutgwai.42.d:0 "Sous pression des deux côtés, [From.GetLeader] a décidé de nous rejoindre !"
 #jyutgwai.42.a:0 "Bien."

 #jyutgwai.43.t:0 "[From.GetName] rejoint notre ennemi"
 #jyutgwai.43.d:0 "Sous pression des deux côtés, [From.GetLeader] a décidé de rejoindre notre ennemi !"
 #jyutgwai.43.a:0 "Comment osent-ils !"

 #jyutgwai.44.t:0 "Nos hommes ont été soudoyés"
 #jyutgwai.44.d:0 "Nos hommes ont été soudoyés par [CHI.GetLeader], et un nouveau dirigeant pro-[CHI.GetLeader] a été nommé."
 #jyutgwai.44.a:0 "Comment cela a-t-il pu arriver !"

 #jyutgwai.45.t:0 "[From.GetName] nous déclare la guerre"
 #jyutgwai.45.d:0 "[From.GetName] a décidé de résoudre nos problèmes actuels sur le champ de bataille."
 #jyutgwai.45.a:0 "Qu’il en soit ainsi."

 #jyutgwai.46.t:0 "Préserver nos forces"
 #jyutgwai.46.d:0 "Bien que nous nous soyons alliés au [CHI.GetRulingParty], [Root.GetLeader] ne veut pas vraiment s’impliquer dans le différend de [CHI.GetLeader] avec [GXC.GetLeader]. Il a maintenant élaboré un plan pour préserver nos forces et affaiblir celles de [CHI.GetLeader] en cas de guerre."
 #jyutgwai.46.a:0 "Envoyer la proposition."
 #jyutgwai.46.b:0 "Nous aurions des ennuis s’ils découvraient nos intentions !"

## NOT IN USE YET ##
 chi_jap.1.t:0 "Trahison de [CHI.GetLeader]"
 chi_jap.1.d:0 "[CHI.GetLeader] a trahi sa nation et son peuple en s’alliant avec les vils Japonais ! Nous devons agir avant qu’il ne soit trop tard !"
 chi_jap.1.a:0 "Nous devons travailler avec les seigneurs de guerre !"
 chi_jap.1.b:0 "Nous agirons seuls."

 chi_jap.2.t:0 "Message de [From.GetName]"                             #這個nation指民族(das Volk)
 chi_jap.2.d:0 "Concernant la récente trahison de [CHI.GetName] envers la nation chinoise, [From.GetLeader] a envoyé un message demandant notre collaboration pour former un front uni contre cette menace."
 chi_jap.2.a:0 "Debout, vous qui refusez d’être esclaves !"
 chi_jap.2.b:0 "Nous aurons peut-être un avenir meilleur en collaborant avec le Soleil."
 chi_jap.2.c:0 "Jamais !"

 chi_jap.3.t:0 "Seigneur de guerre chinois - [From.GetLeader]"
 chi_jap.3.d:0 "[From.GetLeader] a envoyé un message exprimant son désir de rejoindre la Sphère de coprospérité."
 chi_jap.3.a:0 "Ils savent sûrement de quel côté souffle le vent."
 chi_jap.3.b:0 "Ils ne méritent pas une place dans la Sphère de coprospérité."

 chi_jap.4.t:0 "Demande acceptée"
 chi_jap.4.d:0 "[From.GetName] nous a accordé une place dans la Sphère de coprospérité !"
 chi_jap.4.a:0 "La Sphère de coprospérité s’agrandit !"

 chi_jap.5.t:0 "Demande refusée"
 chi_jap.5.d:0 "Notre demande de rejoindre le [From.GetFactionName] a été refusée !"
 chi_jap.5.a:0 "Nous nous sommes mis dans une impasse..."

 chi_jap.6.t:0 "[From.GetName] nous rejoint dans notre cause"
 chi_jap.6.d:0 "[From.GetLeader] a également vu la menace que représentent le traître [CHI.GetLeader] et les Japonais, et nous a rejoints dans notre effort pour les éliminer."
 chi_jap.6.a:0 "Les Chinois doivent rester unis !"

 chi_jap.7.t:0 "[From.GetName] refuse de nous rejoindre"
 chi_jap.7.d:0 "[From.GetLeader] a refusé de nous rejoindre dans notre effort pour sauver la nation !"
 chi_jap.7.a:0 "C’est juste une autre forme de trahison !"

 PRC_kang_ri_jiu_wang_manpower:0 "Résistance nationale et salut"
 PRC_kang_ri_jiu_wang_economy:0 "Résistance nationale et salut"
