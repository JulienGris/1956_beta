 ###################### DÉCISIONS ###########################
 CHI_improve_the_army_situation:0 "Améliorer la situation de l’armée"
 CHI_improve_the_army_situation_desc:0 "L’Armée nationale révolutionnaire est dans un état déplorable à cause de la corruption endémique et de l’entraînement très insuffisant des soldats, ce qui la rend très inefficace.\n\nSi nous ne voulons pas que la Chine soit réduite en poussière, il sera nécessaire de mettre en œuvre des réformes pour faire de la NRA une véritable force entraînée et correctement commandée."
 CHI_improve_the_NRA:0 "Améliorer la NRA"
 chi_improve_the_nra_decision:0 "§H100§!£army_experience"
 chi_improve_the_nra_decision_blocked:0 "§R100§!£army_experience"

 CHI_war_of_resistance:0 "Guerre de résistance"
 CHI_war_of_resistance_desc:0 "La guerre fait de nouveau rage dans notre patrie, et la plaine centrale n’est plus sûre pour le peuple. L’agression [JAP.getAdjective] pourrait engloutir toute l’Asie de l’Est si nous ne stoppons pas ces impérialistes bellicistes et avides de pouvoir !\n\nSi nous voulons protéger le cher Zhongguo, nous devons être prêts à tout pour assurer sa sécurité."

 CHI_Huayuankou_embankment_breach_incident:0 "Provoquer l’incident de la brèche de la digue de Huayuankou"
 CHI_Huayuankou_embankment_breach_incident_desc:0 "L’ennemi est désormais très proche de Zhengzhou ; peut-être pourrions-nous ouvrir les digues du fleuve Jaune et utiliser l’inondation pour décourager nos ennemis."

 CHI_scorched_earth_policy_map:0 "Ces États sont actuellement disponibles pour la politique de §HTerre brûlée§!."
 CHI_scorched_earth_policy:0 "Tactiques de terre brûlée à [FROM.getName]"
 CHI_scorched_earth_policy_desc:0 "Les envahisseurs progressent et occupent nos villes et villages, forçant nos armées à battre en retraite pour préserver leurs forces. Cependant, nous pouvons leur ordonner de détruire les infrastructures locales avant de quitter [FROM.getName], ralentissant ainsi les progrès de nos ennemis."

 CHI_redirect_investments_for_burma_road:0 "Rediriger les investissements pour la route de Birmanie"
 CHI_redirect_investments_for_burma_road_desc:0 "Certains experts conseillent que nous pourrions détourner des ressources pour construire une série de forts dans le sud du Yunnan, ce qui permettrait de repousser efficacement nos ennemis s’ils décidaient de nous envahir par le sud."

 CHI_prioritize_external_threat:0 "Donner priorité à la menace extérieure"
 CHI_prioritize_external_threat_desc:0 "Les Japonais ont lancé une offensive alors que nous luttons encore contre la menace intérieure ! Devons-nous baisser nos armes contre nos compatriotes pour les tourner contre les envahisseurs impérialistes ?"
CHI_prepare_provisional_capital:0 "Préparer une capitale provisoire"
CHI_prepare_provisional_capital_desc:0 "L’ennemi avance rapidement sur Nankin ! Il ne peut pas capturer notre direction. Nous devons établir une base pour une capitale provisoire au cœur de l’intérieur du pays afin de gouverner la nation en ces temps difficiles ; cependant, ce ne sera pas chose facile."

CHI_join_united_front:0 "Rejoindre le Front uni"
CHI_join_united_front_desc:0 "[JAP.getNameDefCap] a lancé son offensive et décidé d’anéantir la nation chinoise de la surface de la Terre. Nous devons soutenir le Front uni par tous les moyens nécessaires afin d’assurer la sécurité de la Chine proprement dite !"

CHI_strife_for_survival:0 "Lutter pour la survie !"
CHI_strife_for_survival_desc:0 "De plus en plus de nos soldats et de nos généraux comprennent qu’ils ne peuvent remporter la guerre actuelle qu’en s’y consacrant entièrement ; cela a globalement amélioré les performances de notre armée sur le terrain."

CHI_most_desperate_hours:0 "Les heures les plus désespérées !"
CHI_most_desperate_hours_desc:0 "Notre nation est au bord de l’effondrement sous l’assaut de l’ennemi envahisseur ! La survie de la civilisation [CHI.getAdjective] dépend de notre peuple courageux !"

CHI_united_front_strategy:0 "Stratégie du Front uni"
CHI_united_front_strategy_desc:0 "Comme un chat, le Japon a avancé et pris la Corée. Il a cherché à nous humilier avec ses vingt-et-une demandes, il a occupé la Mandchourie, et maintenant il avance encore. Assez ! La Chine se battra jusqu’au bout pour être libre. Dans un discours au peuple, [Root.GetLeader] appellera tous les [Root.GetAdjective] à s’unir, ou à affronter seuls une mort certaine."

CHI_unequal_treaties:0 "Les traités inégaux"
CHI_unequal_treaties_desc:0 "Vestiges de l’humiliation infligée aux Qing sur la scène internationale, les ports de traité symbolisent les ambitions des impérialistes européens et japonais en Chine, cherchant à exploiter et à asservir le peuple [ROOT.getAdjective] dans un moment de faiblesse.\n\nEn tirant parti de la situation, nous pouvons resserrer nos liens avec ceux qui partagent nos valeurs et renverser les régimes illégitimes occupant nos terres légitimes !"
CHI_dealing_with_trade_port_decision:0 "[FROM.getName]"

CHI_success_chance_depends_on_stability_tt:0 "Une §Hstabilité plus élevée§! garantit de meilleures chances pour un §Gcoup d’État réussi§!!"
hk_returned_tp:0 "Port de traité restitué"

CHI_liberation_of_asia:0 "Libération de l’Asie"
CHI_liberation_of_asia_desc:0 "De nombreuses nations d’Asie du Sud et du Sud-Est souffrent actuellement sous la domination oppressive des colonialistes européens.\nBien que nous ayons réussi à préserver notre indépendance et à consolider notre domination sur la plaine centrale, nous n’avons pas oublié la lutte de nos frères et sœurs d’armes ! Aux armes, camarades, votre libération vous attend !"
CHI_liberate_country:0 "Libérer [FROM.getNameDef]"
CHI_raises_three_miltiia_divisions_tt:0 "Lève trois divisions de §Y5 bataillons de milice§!."
CHI_raises_five_miltiia_divisions_tt:0 "Lève cinq divisions de §Y5 bataillons de milice§!."
CHI_raises_ten_miltiia_divisions_tt:0 "Lève dix divisions de §Y5 bataillons de milice§!."
CHI_liberation_of_asia_here_tt:0 "La libération de ces territoires serait possible"

CHI_asia_decolonized:0 "Asie décolonisée"
CHI_asia_decolonized_desc:0 "Nos victoires militaires et idéologiques ont conduit à une situation précaire où nous ne pouvons atteindre les métropoles européennes et américaines. Pourtant, nos ennemis sont également incapables de reprendre leurs colonies.\nMaintenant que nous avons enfin atteint notre objectif de libérer l’Asie, quelle sera la décision de [ROOT.getLeader] ? Devons-nous chercher la paix avec ces importuns colonisateurs ?"

CHI_expand_industrial_capabilities:0 "Développer les capacités industrielles"
CHI_expand_industrial_capabilities_desc:0 "Le potentiel économique des vastes terres de la Chine proprement dite a longtemps été négligé par les autorités. Les récents progrès technologiques et économiques nous offrent une occasion unique de renforcer la puissance industrielle de notre nation et d’atténuer les effets de la stagnation économique de ces dernières années."

CHI_weapons_purchases_category:1 "Acheter des armes [USA.GetAdjective]"
CHI_weapons_purchases_category_desc:0 "Notre industrie étant encore à la traîne, se tourner vers l’étranger pour obtenir des armes modernes pourrait être le seul moyen de mettre nos forces armées au niveau des standards actuels."
