political.9.d_nl:0 "Certains diront qu’ils l’avaient vu venir. Ceux qui mettaient en garde contre les dangers du fascisme comme ceux qui l’encensaient comme le sauveur de [Root.GetName] voient aujourd’hui leurs prophéties réalisées, alors que [Root.GetLeader] à [Root.Capital.GetName] a annoncé que [CHI.GetName] suivra la voie fasciste. Toute opposition est réduite au silence en quelques heures.\n\n[Root.GetLeader] n’a pas l’intention de laisser la résistance s’organiser. La loi martiale a été déclarée et, avec les changements en cours, il est peu probable que ce qui suivra soit très différent."
political.18.d_nl:1 "Le mouvement fasciste [Root.GetAdjective], en pleine croissance, n’a jamais affirmé avoir besoin d’un soutien majoritaire avant de saisir le pouvoir. Cependant, il semble que leur popularité ait fortement augmenté. [Root.GetLeader] appelle désormais à une transition vers le fascisme.\n\nL’appel à un référendum a été rejeté par certains membres du [Root.GetRulingParty] comme une tentative de perturber le système, mais cela a fortement irrité [Root.GetLeader]. Si nous n’agissons pas maintenant, [Root.GetLeader] pourrait choisir la lutte violente comme voie d’accès au pouvoir."
political.10.d_nl:1 "Alors que les tentatives du mouvement fasciste de raviver le sentiment nationaliste ont rencontré un certain succès, la résistance à ces idées reste forte. [Root.GetLeader] est déçu du manque de confiance que la population [Root.GetAdjective] semble avoir dans le [Root.GetRulingParty].\n\n[Root.GetLeader] reste convaincu que le peuple retrouvera finalement sa fierté, mais hésite sur la marche à suivre. Certains partisans réclament un coup d’État maintenant, avant que les ennemis de [Root.GetName] n’agissent. Cependant, agir alors que le soutien populaire est limité plongerait la nation dans une guerre civile."

