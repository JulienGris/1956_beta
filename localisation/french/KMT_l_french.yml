############## UNUSED FOCUSES ##################
#KMT_science_effort:0 "Diffuser la culture Haipai"
#KMT_science_effort_desc:0 "La culture Haipai de Shanghai, bien que décadente à l’extrême, a également produit de nombreux scientifiques, écrivains et intellectuels grâce à son accent sur le progrès. Nous devrions essayer d’étendre les bons aspects de ce mouvement au reste de la Chine afin de générer une population plus instruite."

#KMT_become_communism:0 "Vers le communisme"
#KMT_become_communism_desc:0 "Après un long débat entre les officiels, nous avons décidé que le communisme est la voie de l’avenir. Nous devons unir nos forces avec le camarade Mao."

#KMT_neutrality_focus:0 "Retour à l’isolement"
#KMT_neutrality_focus_desc:0 "Alors que d’autres affirment qu’il faut du courage et de la sagesse pour prendre parti dans un conflit mondial, nous savons qu’il en faut davantage pour refuser."

#KMT_interventionism_focus:0 "Exporter la révolution nationale"
#KMT_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples, pas seulement de nos citoyens. Si empêcher la tyrannie signifie la guerre, qu’il en soit ainsi."

#KMT_deterrence:0 "Dissuasion"
#KMT_deterrence_desc:0 "Seuls, nous tirons rarement profit de la guerre. Heureusement, nous savons que la meilleure défense est si bien connue qu’il n’est jamais nécessaire de l’utiliser."

#KMT_volunteer_corps:0 "Les Brigades Sun Yat-sen"
#KMT_volunteer_corps_desc:0 "Forcer notre peuple à mourir pour les idéaux de liberté serait un exercice d’ironie, mais établir des moyens pour ceux qui souhaitent aider à l’étranger ne l’est pas."

#KMT_foreign_expeditions:0 "Le Corps expéditionnaire national de l’amitié"
#KMT_foreign_expeditions_desc:0 "Avec nos ennemis prêts à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."

#KMT_recognize_maos_government:0 "Reconnaître le gouvernement de Mao"
#KMT_recognize_maos_government_desc:0 "Reconnaître leur gouvernement est un excellent moyen d’améliorer nos relations et d’apaiser les tensions."

#KMT_privilege_to_proletarians:0 "Des privilèges pour les prolétaires"
#KMT_privilege_to_proletarians_desc:0 "Les travailleurs ont été exploités trop longtemps. Il est temps de les libérer et de leur donner tous les privilèges qu’ils méritent."

#KMT_integration_of_government:0 "Intégration du gouvernement"
#KMT_integration_of_government_desc:0 "Avec les deux nations sous la direction de Mao, deux gouvernements ne feront plus qu’un."

#KMT_join_comintern:0 "Rejoindre le Komintern"
#KMT_join_comintern_desc:0 "Entourés d’ennemis, il est sage de trouver une sécurité dans les rangs de nos camarades d’autres nations. En rejoignant le Komintern, nous pouvons sécuriser notre position et faire progresser la cause du communisme à l’échelle mondiale."

#kmt_integrate_mao_tt:0 "Définir le parti au pouvoir comme communiste"

#KMT_socialist_science:0 "Science socialiste"
#KMT_socialist_science_desc:0 "Le monde, comme l’esprit, est en mouvement constant. La nature est en progrès perpétuel, en révolution même. Les principes du matérialisme dialectique peuvent s’appliquer aux sciences naturelles aussi bien qu’aux sciences sociales..."

#KMT_boycott_the_comitern:0 "Boycotter le Komintern"
#KMT_boycott_the_comitern_desc:0 "Le Komintern est un enfer puant rempli de cochons révisionnistes. Nous créerons notre propre faction et suivrons la véritable voie du marxisme-léninisme."

#KMT_sinkiang_integration:0 "Le sort du Sinkiang"
#KMT_sinkiang_integration_desc:0 "Le Sinkiang est une terre chinoise légitime. Maintenant que nous sommes tous deux sous la direction de la grande Union soviétique, nous pouvons saisir l’occasion de demander le retour du Sinkiang à la Chine."

#KMT_invite_sik:0 "Inviter le Sinkiang"
#KMT_invite_sik_desc:0 "Si nous devons suivre la véritable voie du marxisme-léninisme, nous devons chercher des alliés pour nous opposer aux cochons révisionnistes du Komintern."

#KMT_war_with_sik:0 "Guerre contre le Sinkiang"
#KMT_war_with_sik_desc:0 "Le Sinkiang n’est sans aucun doute qu’une autre nation infectée par des cochons révisionnistes. Nous devons l’éliminer !"

#KMT_trade_port_commie_comintern:0 "Demander une présence soviétique"
#KMT_trade_port_commie_comintern_desc:0 "Si le monde occidental ne fait pas de compromis sur la question des ports commerciaux, nous devons demander la présence de l’Union soviétique pour renforcer nos chances."

#KMT_trade_port_commie_own:0 "Revendiquer les ports commerciaux"
#KMT_trade_port_commie_own_desc:0 "Nous devons reprendre les ports commerciaux au monde occidental, car ils nous appartiennent de droit."

#KMT_yangtze_partition:0 "Partition du Yangtze"
#KMT_yangtze_partition_desc:0 "La guerre contre les communistes ne se déroule pas en notre faveur, mais le fleuve Yangtze nous fait gagner du temps. Nous pouvons l’utiliser pour proposer une trêve et partager la Chine en l’utilisant comme frontière. Cela nous donnera un temps précieux pour nous rétablir et préparer une contre-offensive."

#KMT_retreat_to_taiwan:0 "Retraite à Taïwan"
#KMT_retreat_to_taiwan_desc:0 "Nous avons perdu cette guerre ! Nous devons ordonner une retraite générale à Taïwan et nous y réorganiser !"

#KMT_retake_the_mainland:0 "Reprendre le continent"
#KMT_retake_the_mainland_desc:0 "Le continent est à nous ! Débarrassons-nous des parasites communistes !"

#KMT_resisist:0 "Résister au communisme"
#KMT_resisist_desc:0 "Si nous laissons le communisme s’implanter dans notre société, le rêve de Sun ne sera jamais accompli et il n’y aura jamais de véritable démocratie pour la Chine !"

#KMT_sov_advisors:0 "Conseillers soviétiques"
#KMT_sov_advisors_desc:0 "Nous pouvons demander l’aide de quelques conseillers à nos amis bolcheviks pour soutenir notre armée."

#KMT_spread_the_revolution:0 "Propager la révolution"
#KMT_spread_the_revolution_desc:0 "Alors que nos frères asiatiques sont opprimés par les colonisateurs occidentaux diaboliques, nous devons leur enseigner la voie du communisme et chasser le démon venu de l’ouest !"

#KMTwarlords_continuous_naval_production:0 "Production navale"
#KMTwarlords_continuous_naval_production_desc:0 "En concentrant les ressources sur nos chantiers navals et en exemptant les constructeurs de navires qualifiés du service militaire, nous pouvons réduire considérablement le temps de production des navires."

#KMTwarlords_continuous_air_production:0 "Production aéronautique"
#KMTwarlords_continuous_air_production_desc:0 "Nous pouvons réorganiser notre industrie aéronautique afin d’éliminer le gaspillage et de rationaliser la production."

#KMTwarlords_continuous_non_factory_construct:0 "Génie civil"
#KMTwarlords_continuous_non_factory_construct_desc:0 "Il reste encore beaucoup de marge dans notre industrie de la construction. En nous y concentrant, nous pouvons obtenir une amélioration significative de la vitesse de construction. Malheureusement, la production d’outils mécaniques constitue un goulet d’étranglement majeur pour l’expansion de notre industrie lourde, de sorte qu’ils ne bénéficieront pas de ces efforts."

#KMTwarlords_continuous_reduce_training_time:0 "Entraînement de l’armée"
#KMTwarlords_continuous_reduce_training_time_desc:0 "En créant des unités d’entraînement spécialisées et avancées au sein de chaque division, nous pouvons déployer au front des divisions qui auraient auparavant dû attendre la fin de leur entraînement."

#KMTwarlords_continuous_suppression:0 "Répression de la résistance"
#KMTwarlords_continuous_suppression_desc:0 "En infiltrant les principaux groupes de résistance dans les territoires occupés et en retournant leurs dirigeants, nous pouvons réduire considérablement les dégâts qu’ils peuvent causer."

#KMTwarlords_continuous_repair:0 "Réparation des infrastructures"
#KMTwarlords_continuous_repair_desc:0 "Nous formerons des équipes spécialisées de réparation à partir des ouvriers des usines et du bâtiment et contrôlerons centralement leur déploiement afin d’améliorer la reconstruction des infrastructures endommagées."

#KMTwarlords_continuous_tech_share:0 "Partage technologique"
#KMTwarlords_continuous_tech_share_desc:0 "Nous encouragerons nos instituts de recherche et nos universités à entrer en contact avec leurs homologues des pays alliés. Cela nous procurera un bonus de partage technologique."

#KMTwarlords_continuous_boost_freedom:0 "Accroître l’autonomie"
#KMTwarlords_continuous_boost_freedom_desc:0 "En réorganisant notre bureaucratie coloniale et en recrutant des administrateurs locaux, nous pourrons, avec le temps, prendre en main nos propres affaires."

#KMTwarlords_continuous_restrict_freedom:0 "Réprimer les sujets"
#KMTwarlords_continuous_restrict_freedom_desc:0 "Nos sujets coloniaux ont pris de bien étranges idées comme « autodétermination » ou « indépendance nationale ». Il est temps de les détromper."

#KMTwarlords_claim_central_government_con_focus:0 "Revendiquer la position de gouvernement central"
#KMTwarlords_claim_central_government_con_focus_desc:0 "La Chine doit passer sous notre autorité !"

#KMT_claim_central_government_con_focus:0 "Revendiquer la position de gouvernement central"
#KMT_claim_central_government_con_focus_desc:0 "La Chine doit passer sous notre autorité !"
