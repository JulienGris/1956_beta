 #KMT_will_stop_civil_war_tt:0 "Mettra fin à la guerre civile et créera un front uni contre l’envahisseur japonais.\n"
 #KMT_will_release_chiang_tt:0 "Chiang Kai-shek sera libéré.\n"
 #accept_all_demand:0 "Accepter"
 #KMT_chiang_return_tt:0 "Chiang Kai-shek sera libéré."
 #demand.t:0 "Liste des exigences"
 #demand.d:0 "Les exigences formulées par les deux parties sont les suivantes : "
 #reject_all_demand_and_war:0 "Tout rejeter et déclarer la guerre."
 #demand_rejected_war.t:0 "GUERRE !"
 #demand_rejected_war.d:0 "[From.GetName] a perdu toute patience et a décidé de recourir à la guerre pour résoudre la situation actuelle. Ils ont lancé l’offensive et nous devons maintenant préparer nos hommes !"
 #demand_rejected_war.a:0 "Barbares incivilisés !"
 #KMT_chi_stop_civil_war_demand_rejected_tt:0 "[From.GetName] a rejeté notre exigence de mettre fin à la guerre civile et de créer un front uni.\n"
 #KMT_chi_demand_submission_tt:0 "[From.GetName] a exigé notre soumission.\n"
 #KMT_will_submit_to_chiang_tt:0 "Se soumettra à [CHI.GetName].\n"
 #KMT_chi_demand_submission_rejected_tt:0 "[From.GetName] a rejeté notre exigence de soumission.\n"
 #resolved.t:0 "Incident résolu"
 #resolved.d:0 "Les deux parties sont tombées d’accord sur tous les termes, le problème est résolu.\n\nLes termes sont les suivants : "
 #xian.1.t:0 "Zhang Xueliang"
 #xian.1.d:0 "Comme Zhang Xueliang a cessé d’attaquer les bandits communistes sans l’accord du gouvernement central, la progression de l’élimination des communistes a ralenti. [Root.GetLeader] a décidé de rendre visite à Zhang à Xi’an."
 #xian.1.a:0 "Cela leur montrera qui commande."
 #xian.1.b:0 "Ce n’est pas important."

 #xian.2.t:0 "Arrivée de [CHI.GetLeader]"
 #xian.2.d:0 "[CHI.GetLeader] est arrivé à Xi’an pour rencontrer [Root.GetLeader]. [CHI.GetLeader] a déclaré que nous devons détruire tous les communistes dans les trois mois, sinon ils prendront le relais."
 #xian.2.a:0 "Détenons [CHI.GetLeader] en otage et exigeons l’arrêt de la guerre civile !"
 #xian.2.b:0 "Nous ne pouvons rien y faire."
 #KMT_will_Die_tt:0 "§RVous serez annexé si vous échouez à éliminer les communistes dans les trois mois.§!\n"

 #xian.3.t:0 "Chiang Kai-shek pris en otage"
 #xian.3.d:0 "Zhang Xueliang a lancé une attaque là où Chiang séjournait à Xi’an et l’a capturé. Désormais, Zhang exige que nous mettions fin à la guerre civile et que nous nous concentrions sur les Japonais. Si nous acceptons ces termes, ils libéreront Chiang."
 #xian.3.a:0 "Envoyons quelqu’un négocier avec eux !"
 #xian.3.b:0 "Nous reprendrons Chiang par la force !"

 #xian.4.t:0 "[From.GetRulingParty] envoie un représentant"
 #xian.4.d:0 "Un représentant de [CHI.GetRulingParty] est arrivé pour discuter de la situation actuelle.\n\nNous formulerons ces exigences : "
 #xian.4.a:0 "Très bien"

 #xian.5.t:0 "[CHI.GetRulingParty] lance une offensive !"
 #xian.5.d:0 "[CHI.GetRulingParty] a décidé de reprendre Chiang par la force !"
 #xian.5.a:0 "Préparez nos hommes !"

 #xian.6.t:0 "Incident de Xi’an"
 #xian.6.d:0 "Zhang Xueliang a pris Chiang Kai-shek en otage dans l’espoir qu’il se concentre sur les Japonais plutôt que sur les communistes de [PRC.GetLeader]."
 #xian.6.a:0 "Ce n’est pas ce que nous voulons voir."
 #xian.6.b:0 "Nous devrions encourager l’effort de Zhang."

 #xian.7.d:0 "Zhang Xueliang a pris Chiang Kai-shek en otage dans l’espoir qu’il se concentre sur les Japonais plutôt que sur nous."
 #xian.7.a:0 "Nous espérons qu’il réussira."

 #xian.8.t:0 "[SOV.GetName] mécontent"
 #xian.8.d:0 "[SOV.GetName] n’est pas très content de notre action de retenir Chiang en otage et nous a demandé de le libérer immédiatement."
 #xian.8.a:0 "Nous ne devons pas céder !"

 #xian.9.t:0 "Message de [SOV.GetName]"
 #xian.9.d:0 "[SOV.GetName] semble être très satisfait de notre initiative visant à instaurer un front uni et nous encourage à ne pas reculer."
 #xian.9.a:0 "Ils ont notre gratitude."

 #xian.10.t:0 "[CHI.GetRulingParty] prend le relais"
 #xian.10.d:0 "Nous avons échoué à éliminer les communistes en trois mois, [CHI.GetRulingParty] a désormais pris le relais."
 #xian.10.a:0 "..."

 #xian.11.t:0 "Nous avons pris le relais"
 #xian.11.d:0 "Nous avons pris le contrôle de l’armée du Nord-Est car elle a échoué à éliminer les communistes dans les trois mois impartis."
 #xian.11.a:0 "Nous mettrons fin aux communistes."

 #xian.100.a:0 "Nous ne collaborerons pas avec les communistes !"
 #xian.100.b:0 "Nous exigerons leur soumission !"
 #xian.100.c:0 "Nous ne nous soumettrons jamais !"
 #KMT_ROOT_NAME_TT:0 "[Root.GetName] : \n"

 #xian.12.t:0 "Arrêter Zhang ?"
 #xian.12.d:0 "Zhang Xueliang a suivi Chiang à Nankin, mais ses actions n’ont pas encore été pardonnées. Chiang prévoit maintenant de le mettre en résidence surveillée afin de le contrôler."
 #xian.12.a:0 "Il doit bien savoir que cela finirait par lui arriver."
 #xian.12.b:0 "Ce n’est pas nécessaire."

 #KMT_chi_stop_civil_war_demand_again_tt:0 "Ils insistent pour que la guerre civile cesse.\n"

 #xian.100.d:0 "Nous exigeons un front uni !"
 #KMT_chiang_returns_tt:0 "Chiang Kai-shek disponible comme maréchal de camp"

 #xian.13.t:0 "Chiang Kai-shek libéré"
 #xian.13.d:0 "Après la destruction des forces de Zhang, nos soldats ont retrouvé Chiang et l’ont libéré."
