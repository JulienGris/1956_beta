 xian_incident_started:0 "L’incident de Xi’an a commencé"
 cdx_returned:0 "Chen Duxiu est revenu"
 PRC_yes_truce:0 "Accord pour mettre fin à toutes les guerres civiles."
 has_pact_with_jap:0 "A conclu un pacte avec le Japon"


 ################  IDÉES  ###############################
 PRC_defeatism_1:0 "Défaitisme"
 PRC_defeatism_1_desc:0 "Certains de nos camarades pensent que si nous combattons les Japonais, nous deviendrons la prochaine Abyssinie. Une telle pensée mine grandement la volonté du peuple."

 PRC_underestimation:0 "Sous-estimer le Japon"
 PRC_underestimation_desc:0 "Certains de nos camarades sont trop optimistes à propos des Japonais. Ils affirment même qu’ils n’atteindront jamais le Shanxi. Une telle arrogance nuira gravement à notre effort de guerre."

 PRC_integrated_army:0 "Armée incorporée"
 PRC_integrated_army_desc:0 "L’Armée rouge communiste a accepté d’être intégrée à notre armée ; grâce à ce soutien supplémentaire, la guerre pourrait devenir moins difficile."

 PRC_initiative_idea:0 "Initiative en temps de guerre"
 PRC_initiative_idea_desc:0 "Le désarmement d’un soldat résulte du fait qu’il perd sa liberté d’action en étant forcé dans une position passive. Il en va de même pour la défaite d’une armée. C’est pourquoi les deux camps font tout pour obtenir l’initiative et éviter la passivité."

 PRC_protracted_war_idea:0 "Guerre prolongée"
 PRC_protracted_war_idea_desc:0 "Nous devons retarder les Japonais aussi longtemps que possible afin de gagner du temps pour une aide internationale."

 PRC_devastating_long_march:0 "La dévastation de la Longue Marche"
 PRC_devastating_long_march_desc:0 "Après la Longue Marche, nous nous sommes finalement installés dans le Shaanxi. Cependant, la blessure béante qu’elle a laissée n’est pas encore cicatrisée. Est-ce notre fin ?"

 PRC_devastating_long_march_1:0 "Se relever de la Longue Marche"
 PRC_devastating_long_march_1_desc:0 "Nous reprenons désormais notre rythme, l’effet de la Longue Marche sera bientôt atténué."

 PRC_guerilla_warfare:0 "Guerre de guérilla"
 PRC_guerilla_warfare_desc:0 "Nous sommes loin de pouvoir être appelés une « nation » ou un « pays », notre mouvement n’est qu’un groupe de combattants de guérilla contre le Kuomintang.\n"

 PRC_lack_skilled_personnel:0 "Manque de personnel qualifié"
 PRC_lack_skilled_personnel_desc:0 "De nombreux camarades sont morts durant la Longue Marche, provoquant un manque de personnel qualifié dans nos rangs. Cela rendra difficile tout progrès technologique."

 PRC_swift_victory_idea:0 "Doctrine de victoire rapide"
 PRC_swift_victory_idea_desc:0 "Si nous voulons gagner la guerre contre les envahisseurs japonais, nous devons agir vite et frapper avant qu’ils ne s’en rendent compte."

 propaganda_recruits:0 "Recrues par propagande"
 propaganda_recruits_desc:0 "Nous comptons actuellement sur la propagande pour attirer du sang neuf dans nos rangs. Ce n’est pas très efficace, mais cela renforcera néanmoins la volonté de notre peuple.\n"

 PRC_mc_corporation:0 "Coopération civilo-militaire"

 PRC_wrongly_purged_comrades:0 "Excès de purge"

 PRC_sov_assistance_in_industry:0 "Aide industrielle soviétique"

 PRC_soviet_style_education:0 "Système éducatif de style soviétique"

 PRC_red_beacon:0 "Le nouveau phare rouge"

 PRC_good_good_study_idea:0 "Bien étudier, progresser chaque jour"

 PRC_save_the_soviet_people:0 "Sauver le peuple soviétique"

 PRC_ndcprc_idea:0 "NDCPRC"

 PRC_cultural_revolution:0 "La Révolution culturelle"

 PRC_cultural_revolution_aftermath:0 "Les séquelles de la Révolution culturelle"

 lin_biao_generalissimo:0 "Lin Biao"

 political_mobilisation_idea:0 "Mobilisation politique"

 PRC_uncertainty_of_new_theory:0 "Incertitude face à la nouvelle doctrine"
 PRC_uncertainty_of_new_theory_desc:0 "Adopter une nouvelle doctrine qui abandonne toutes les stratégies précédentes a suscité des inquiétudes à son sujet."

 PRC_maybe_theory_is_ok:0 "Confiance dans la nouvelle doctrine"
 PRC_maybe_theory_is_ok_desc:0 "La doctrine nouvellement adoptée s’avère être un succès, notre armée s’est pleinement adaptée à ce nouveau style de combat.\n\n§RSi la guerre venait à tourner à votre désavantage, votre armée pourrait perdre confiance en elle.§!"

 PRC_enemy_partisan:0 "Partisans ennemis derrière notre front"
 PRC_enemy_partisan_desc:0 "Les partisans ennemis se sont implantés profondément derrière notre front, causant des dégâts aux lignes de ravitaillement et ralentissant nos troupes.\n\n§RCet esprit national disparaîtra lorsque la guerre contre le PCC sera terminée.§!\n\n§RDégâts périodiques aux bâtiments dans les États centraux chinois que nous contrôlons§!"

 PRC_exploit_our_enemys_mistake_idea:0 "Exploiter les erreurs de l’ennemi"
 PRC_exploit_our_enemys_mistake_idea_desc:0 "Les opérations de front de notre ennemi sont mal coordonnées, nous pouvons en tirer profit autant que possible.\n\n§RCet esprit national disparaîtra lorsque la guerre contre le Japon sera terminée.§!"

 improper_frontline_command:0 "Défaillances du commandement frontal"
 improper_frontline_command_desc:0 "Les défauts de nos opérations de front commencent à apparaître, et l’ennemi commence à les exploiter à son avantage."

 PRC_until_the_bitter_end:0 "Jusqu’au bout amer"

 PRC_land_reform_stimulated_our_farmers:0 "Soulèvement paysan"
 PRC_land_reform_stimulated_our_farmers_desc:0 "La réforme agraire communiste a stimulé de nombreux paysans de notre nation. Ces paysans se rebellent désormais contre leurs propriétaires et rejoignent la menace communiste."

