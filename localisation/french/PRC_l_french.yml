 KMT_hundred_flowers_tt:0 "C’est un complot pour exposer les fauteurs de troubles, cependant, leurs critiques §Rpeuvent influencer la volonté du peuple§! car il pourrait être attiré par d’autres partis §Gavant que nous n’arrêtions ces malfaiteurs§!."

 PRC_great_leap_timespan:0 "Le §YGrand Bond en Avant§! devrait durer §Gplusieurs§! années, mais il pourrait être interrompu après §Run an§! si cela est désastreux pour notre économie..."

