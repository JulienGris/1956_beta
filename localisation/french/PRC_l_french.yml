 ############## DÉCISIONS ##################
 PRC_solidifying_our_revolution:0 "Consolider notre révolution"
 PRC_solidifying_our_revolution_desc:0 "[PRC.getNameDefCap] a affronté de nombreuses épreuves ces dernières années. Le traître Kuomintang a tenté d’écraser toute opposition socialiste en 1935, ce qui a forcé notre mouvement autrefois populaire auprès des paysans à se disperser dans les campagnes de la plaine centrale. Retrouver notre force prendra du temps et des efforts, mais nous triompherons dans cette lutte !"

 PRC_question_of_our_capital_decision:0 "Régler la question de la capitale"
 PRC_question_of_our_capital_decision_desc:0 "La Révolution populaire gagnera encore plus de soutien parmi les ouvriers et paysans si nous proclamons officiellement l’établissement de [PRC.getNameDef] dans notre nouvelle capitale."

 PRC_the_new_communist_beacon:0 "Le nouveau phare communiste"
 PRC_the_new_communist_beacon_desc:0 "La lutte révolutionnaire ne cessera jamais tant que des oppresseurs, colonisateurs, impérialistes et ennemis du peuple existeront ! \nEn quelques coups décisifs, nous pouvons détruire les cellules antigouvernementales à l’extérieur comme à l’intérieur de [ROOT.getNameDef]. \nLe temps est venu pour Da Zhonghua Diqu de s’élever et de prospérer !"

 PRC_hundred_flowers_campaign_progress:0 "Progression de la campagne des Cent Fleurs"

 PRC_offer_a_separate_peace_to_japan:0 "Proposer une paix séparée au Japon"
 PRC_offer_a_separate_peace_to_japan_desc:0 "La menace impérialiste a été vaincue et nous contrôlons désormais la majeure partie de la frontière nord de la Chine. Leurs armées sont décimées et les nationalistes occupés à se battre dans la plaine centrale : nous pouvons contraindre l’ennemi vaincu à accepter l’inévitable et cesser les hostilités. Pour l’instant."


