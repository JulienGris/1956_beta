PAK_voice_of_the_muslims:0 "Voix des musulmans"

pakistan.3.t:0 "Un politicien bangladais éminent meurt"
pakistan.3.d:0 "Après une longue lutte à l’hôpital, le Bangladesh a perdu l’un de ses dirigeants les plus importants. Le peuple attend désormais votre réaction pour surmonter cette perte tragique."

pakistan.4.t:0 "La controverse linguistique"
pakistan.4.d:0 "La langue du Pakistan oriental, le bengali, a longtemps été une épine dans le pied du Pakistan. Une réforme de l’éducation a récemment émergé et les Bengalis demandent : « Serons-nous instruits en bengali ? »"

pakistan.5.t:0 "Un cyclone dévastateur est sur le point de frapper le Pakistan oriental"
pakistan.5.d:0 "La côte bengalie paraît plus agitée que d’habitude, mais les nouvelles annonçant qu’un cyclone dévastateur pourrait frapper d’une minute à l’autre font paniquer la population, qui implore l’aide de son dirigeant."

