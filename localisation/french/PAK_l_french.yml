communist_revolution:0 "Révolution communiste"
communist_revolution_desc:0 "Une révolution réussie ne peut être menée que si la majorité du pays soutient le nouveau gouvernement. Nous devons rallier les provinces à la cause communiste, sans quoi notre gouvernement nouvellement fondé ne serait qu’une faible excuse."

fascist_power_base:0 "Influence fasciste à [From.GetName]"
fascist_coup:0 "Coup d’État fasciste"
fascist_coup_desc:0 "Un coup d’État réussi ne peut être mené que si la majorité du pays soutient le nouveau gouvernement. Nous devons rallier les provinces à la cause fasciste, sans quoi notre gouvernement nouvellement fondé ne serait qu’une faible excuse."

choose_fascism:0 "Vers le fascisme"
choose_communism:0 "Vers le communisme"

PAK_Liaquat_Ali_Khan:0 "Liaquat Ali Khan"
PAK_Mian_Iftikharuddin:0 "Mian Iftikharuddin"

bangladesh_liberation:0 "Libération du Bangladesh"
bangladesh_liberation_desc:0 "Les Bengalis du Pakistan oriental se sentent désillusionnés et sous-représentés à Karachi. Les forces nationalistes commencent à se former et à gagner un soutien populaire préoccupant.\n\nL’attitude de l’Inde vis-à-vis de l’indépendance du Bangladesh est [Root.PAK_indian_support]\nLe §Ydésir de liberté§! actuel du Bangladesh est de : §R[?bangladesh_freedom]§!\nCe nombre peut être influencé par la §Yconstruction d’infrastructures§!, de §Yusines civiles§!, la §Yprésence militaire§! ou encore par des §Yévénements et décisions§!.\nSi le §Ydésir de liberté§! approche de §R100§!, une guerre civile éclatera."

pak_mus_unity:0 "Permet de §Yrevendiquer comme noyau§! tout État étant le noyau d’un §Ypays musulman§!"
support_loyalist_militias:0 "Soutenir les milices loyalistes"
support_loyalist_militias_desc:0 "La situation dans l’est de notre pays se détériore et la violence semble désormais la seule mesure capable de réprimer un soulèvement."

increase_federalism:0 "Proposer davantage de fédéralisme"
increase_federalism_desc:0 "Bien que nous ne puissions pas faire de promesses concrètes pour le moment, de vagues notions d’une autonomie accrue une fois les tensions apaisées pourraient réduire le militantisme et la conscience politique de la population bengalie."

bangladesh_liberation_disable:0 "Les tensions s’apaisent"
bangladesh_liberation_disable_desc:0 "Après des mois de manœuvres politiques prudentes, nous avons convaincu une large majorité de la population bengalie que rester au sein du Pakistan présente plus d’avantages que de suivre leur propre voie."

communism_chosen:0 "Communisme choisi"

appeal_to_the_proletariat:0 "Appel au prolétariat"
appeal_to_the_proletariat_desc:0 "Notre situation politique, culturelle et géographique défavorable en tant que pays ne signifie pas que les travailleurs de l’Ouest et de l’Est doivent s’opposer. Nous devons libérer les masses des notions oppressives de nationalisme."

integrate_muslim_states:0 "Intégrer [From.GetName]"

pak_very_sympathetic:0 "§RTrès sympathisants§!\nCela signifie qu’ils envisageront de les rejoindre si une guerre éclatait.\n"
pak_sympathetic:0 "§OSympathisants§!\nCela signifie qu’ils les aideront probablement si une guerre éclatait.\n"
pak_opposed:0 "§GOpposés§!\nCela signifie qu’ils nous soutiendront passivement si une guerre éclatait.\n"
pak_neutral:0 "§YNeutres§!\nCela signifie qu’ils resteront à l’écart de tout conflit.\n"

