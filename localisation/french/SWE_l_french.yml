 SWE_swedish_disarmament_idea:0 "Désarmement suédois"
 SWE_swedish_disarmament_idea_desc:0 "Depuis la Grande Guerre, de sévères coupes ont été opérées dans le budget militaire, une grande armée permanente paraissant superflue. Les fonds ont plutôt servi à lutter contre la Grande Dépression et à financer des travaux publics. Cependant, avec la guerre qui gronde à l’horizon, il serait peut-être temps de revoir une nouvelle fois le budget militaire."
 SWE_swedish_disarmament_1_idea:0 "Réarmement initial"
 SWE_nationalist_military_garrisons:0 "Garnisons militaires nationalistes"
 SWE_nationalist_military_garrisons_desc:0 "Bien que la plupart des garnisons suédoises aient été dissoutes, l’influence fasciste imprègne encore la région. De larges pans de l’armée souhaitent aussi que le roi prenne le contrôle, ou que quelqu’un fasse ce qu’il faut pour s’opposer aux communistes."
