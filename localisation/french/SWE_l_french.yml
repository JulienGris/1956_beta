## Unification for non WTT
 SWE_unify_scandinavia:0 "Unifier la Scandinavie"
 SWE_unify_scandinavia_desc:0 "Enfin, les trois frères sont réunis sous une même bannière. Il est temps de nous dresser de nouveau, non pas comme trois nations, mais comme une seule !"
 SWE_unify_the_nordics:0 "Unifier les Nordiques"
 SWE_unify_the_nordics_desc:0 "Ce qui n’était que logique est finalement arrivé : le quatrième frère nous a rejoints, et avec la Finlande à nos côtés, nous serons plus forts que jamais !"

