### Focuses
 SWE_swedish_defence_act:0 "Loi de défense suédoise"
 SWE_swedish_defence_act_desc:0 "Les temps changent et nous devons être prêts à défendre notre pays. Il est du devoir de chaque homme et de chaque femme de faire sa part pour protéger la patrie."
 SWE_the_coastal_artillery_program:0 "Programme d’artillerie côtière"
 SWE_the_coastal_artillery_program_desc:0 "Notre littoral est très long ; en bâtissant des fortifications à des emplacements clés, nous pourrons dissuader la plupart des assauts navals."
 SWE_air_defence_fortifications:0 "Fortifications de défense aérienne"
 SWE_air_defence_fortifications_desc:0 "L’aviation prenant de plus en plus d’importance, nous devons savoir détecter une attaque venue du ciel et l’intercepter avant qu’elle ne puisse infliger des dégâts majeurs à la nation."
 SWE_lottorna:0 "Lottorna"
 SWE_lottorna_desc:0 "Tandis que les hommes protègent nos frontières, la société doit continuer de tourner. En ouvrant aux femmes des secteurs qui leur étaient jusque-là fermés, nous allégerons la pression sur l’économie de guerre."
 SWE_recycling:0 "Recyclage"
 SWE_recycling_desc:0 "Le recyclage nous permettra de réutiliser d’anciennes ressources, de leur trouver de nouveaux usages ou de les transformer, réduisant ainsi nos déchets."
 SWE_the_swedish_defence_research_agency:0 "Agence suédoise de recherche pour la défense"
 SWE_the_swedish_defence_research_agency_desc:0 "En fondant la Försvarets Forskningsanstalt (Agence de recherche pour la défense), nous disposerons d’un organisme entièrement dédié à l’étude de nouveaux équipements défensifs."
 SWE_the_swedish_nuclear_program:0 "Programme nucléaire suédois"
 SWE_the_swedish_nuclear_program_desc:0 "L’arme nucléaire est une idée terrifiante. Mais pour savoir nous en protéger, nous devons comprendre comment elle se conçoit."

