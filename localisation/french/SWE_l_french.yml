### Focuses
 SWE_stockholms_orlogsvarv:0 "Stockholms Örlogsvarv"
 SWE_stockholms_orlogsvarv_desc:0 "Stockholms Örlogsvarv a été vital pour nos programmes navals ; pour bâtir une flotte capable de nous protéger, nous devons agrandir nos bassins de radoub."
 SWE_evaluate_naval_doctrine:0 "Réévaluer la doctrine navale"
 SWE_evaluate_naval_doctrine_desc:0 "Nos doctrines ont des décennies de retard. Reconsidérons le passé et tournons-nous vers l’avenir."
 SWE_swedish_marines:0 "Marines suédois"
 SWE_swedish_marines_desc:0 "Notre pays est coincé entre les montagnes à l’ouest et la Baltique à l’est. Si nous voulons envisager des opérations outre-mer, nous devons améliorer nos troupes de marine."
 SWE_submarine_flotilla:0 "Flottille de sous-marins"
 SWE_submarine_flotilla_desc:0 "Frapp­er depuis les profondeurs est une méthode létale. Améliorons nos sous-marins pour renforcer la menace contre quiconque tenterait de nous attaquer."
 SWE_swedish_hunterkillers:0 "Chasseurs-tueurs suédois"
 SWE_swedish_hunterkillers_desc:0 "Pour protéger nos côtes, assurons-nous que nos destroyers sont à jour. En tirant les leçons britanniques et allemandes, nous concevrons des navires capables de défendre notre indépendance."
 SWE_new_naval_estimates:0 "Nouvelles estimations navales"
 SWE_new_naval_estimates_desc:0 "Nouvelles estimations navales."
 SWE_bofors_naval_guns:0 "Artillerie navale Bofors"
 SWE_bofors_naval_guns_desc:0 "Bofors développant de nouveaux canons terrestres et maritimes, nous disposons d’un fournisseur d’artillerie navale pour rattraper notre retard."
 SWE_protect_merchant_sailors:0 "Protéger les marins du commerce"
 SWE_protect_merchant_sailors_desc:0 "Une grande part de notre économie dépend des exportations : si nous ne protégeons pas les marins qui transportent nos marchandises, notre économie s’effondrera."
 SWE_new_cruiser_designs:0 "Nouveaux croiseurs"
 SWE_new_cruiser_designs_desc:0 "Nos croiseurs sont très dépassés, presque obsolètes. Avec des fonds, nous pourrons lancer des conceptions plus modernes."
 SWE_swedish_battlecruiser:0 "Croiseur de bataille suédois"
 SWE_swedish_battlecruiser_desc:0 "Le concept de Pansarskepp a bien servi à notre défense, mais pour sortir de la Baltique, explorons de nouveaux types de navires. Un cuirassé complet dépasse sans doute notre budget ; un croiseur de bataille conviendra."

### Ideas
 SWE_extensive_naval_project_funding:0 "Financement étendu des projets navals"

