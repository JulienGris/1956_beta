### Focuses
 SWE_abandon_neutrality:0 "Abandonner la neutralité"
 SWE_abandon_neutrality_desc:0 "Le XXe siècle ne sera pas paisible ; nous ne devons pas rester des canards assis attendant le chasseur. Pour que la Suède survive, nous devons agir les premiers."
 SWE_sven_olov_addresses_aland_convention:0 "Sven-Olov évoque la convention d’Åland"
 SWE_sven_olov_addresses_aland_convention_desc:0 "Dans un discours, Sven-Olov Lindholm a évoqué la convention d’Åland de 1921, qui maintient les îles sous souveraineté finlandaise, alors qu’environ 90 % de la population y était suédoise. Vu l’état du monde, nous devrions révoquer la convention pour protéger les Suédois d’Åland."
 SWE_demand_aland:0 "Exiger Åland"
 SWE_demand_aland_desc:0 "Les Finlandais sont pris entre le marteau et l’enclume. Åland, archipel à majorité suédoise, appartient à la Finlande. Ils ne peuvent affronter à la fois les Russes et nous pour un « petit » archipel…"
 SWE_swedish_brownshirts:0 "Chemises brunes suédoises"
 SWE_swedish_brownshirts_desc:0 "Notre position sur Åland a enhardi la NSAP. Leur soutien dans la population et — plus inquiétant — dans l’armée croît. Pour garder le contrôle, le parti au pouvoir devra les inclure dans la coalition."
 SWE_stormtroopers:0 "Troupes d’assaut"
 SWE_stormtroopers_desc:0 "Maintenant que nous avons brisé les chaînes de la démocratie, il faut agrandir l’armée. Créons une formation paramilitaire opérant aux côtés de l’armée."
 SWE_swedish_volunteers:0 "Volontaires suédois"
 SWE_swedish_volunteers_desc:0 "Partout, des peuples prennent les armes contre la menace bolchevique. Soyons prêts à envoyer ceux qui veulent rejoindre la lutte contre la menace rouge."
 SWE_improve_the_stormtroops:0 "Améliorer les troupes d’assaut"
 SWE_improve_the_stormtroops_desc:0 "Notre pouvoir étant consolidé, perfectionnons nos paramilitaires et intégrons-les à l’armée officielle."
 SWE_bring_finland_back:0 "Ramener la Finlande"
 SWE_bring_finland_back_desc:0 "Depuis la perte de la Finlande, nous rêvons de la reprendre aux Russes. Après la chute de l’Empire russe, la Finlande est née indépendante ; pour protéger ce jeune pays, nous devons intervenir et la ramener sous notre main."
 SWE_return_to_european_scene:0 "Retour sur la scène européenne"
 SWE_return_to_european_scene_desc:0 "Après près de deux siècles, nous sommes prêts à revenir sur le devant de la scène : finis les rôles de spectateurs du Nord — renouons avec notre histoire glorieuse."
 SWE_approach_germany:0 "Se rapprocher de l’Allemagne"
 SWE_approach_germany_desc:0 "Nous avons modelé notre fascisme sur celui de l’Allemagne ; nul ne s’étonnera que, de retour sur la scène mondiale, nous cherchions son alliance."
 SWE_press_aland_claim:0 "Faire valoir la revendication sur Åland"
 SWE_press_aland_claim_desc:0 "Les îles d’Åland sont séparées de la Suède depuis longtemps, mais leurs habitants parlent suédois et se sentent suédois. La Finlande n’a d’autre titre que des papiers."
 SWE_divide_denmark:0 "Diviser le Danemark"
 SWE_divide_denmark_desc:0 "Le Danemark a souvent été une épine dans notre flanc, même s’il est notre frère nordique. Les temps changent : en garantissant à l’Allemagne l’accès naval et le retour du Schleswig, nous contraindrons le Danemark à la sujétion — ou à l’annexion."
 SWE_return_to_livonia:0 "Retourner en Livonie"
 SWE_return_to_livonia_desc:0 "La Livonie fut suédoise et a une grande valeur stratégique pour verrouiller la Baltique et lancer une invasion vers l’est. En sécurisant nos anciens territoires, nous pourrons pénétrer profondément en Russie."
 SWE_march_alongside_the_british_blackshirts:0 "Marcher aux côtés des Chemises noires britanniques"
 SWE_march_alongside_the_british_blackshirts_desc:0 "À la surprise générale, les Britanniques ont eux aussi rejeté la démocratie. Profitons-en pour nous allier à eux, puis tournons-nous vers l’Europe centrale."
 SWE_the_northern_front:0 "Le Front du Nord"
 SWE_the_northern_front_desc:0 "À l’heure des mutations européennes, la Suède doit prendre la tête. En fondant notre propre faction, nous rallierons ceux qui veulent écraser le communisme et freiner la frénésie du capitalisme."
 SWE_legacy_of_great_northern_war:0 "Héritage de la Grande Guerre du Nord"
 SWE_legacy_of_great_northern_war_desc:0 "Avec nos nouveaux alliés, nous pouvons conjurer le spectre de la Grande Guerre du Nord, qui marqua le déclin de notre ancien empire. Cette fois, nous sortirons vainqueurs."
 SWE_establish_new_protectorates:0 "Établir de nouveaux protectorats"
 SWE_establish_new_protectorates_desc:0 "La jeune Allemagne vaincue, nous pouvons la diviser de nouveau et ramener sous notre coupe des morceaux plus… gérables de l’aigle allemand."
 SWE_proclaim_greater_sweden:0 "Proclamer la Grande Suède"
 SWE_proclaim_greater_sweden_desc:0 " "
 SWE_reclaim_ingermanland:0 "Reprendre l’Ingermanland"
 SWE_reclaim_ingermanland_desc:0 "L’Ingermanland — les territoires autour de Leningrad — fut aussi suédois. Il le redeviendra."
 SWE_secure_the_government:0 "Sécuriser le gouvernement"
 SWE_secure_the_government_desc:0 "Nous ne pouvons rester inactifs pendant que le monde change. Si la Suède veut sortir renforcée de la tempête, nous devons agir maintenant : étouffons les partis qui fracturent la nation et menacent sa ruine."
 SWE_sweden_first:0 "La Suède d’abord"
 SWE_sweden_first_desc:0 "Trop longtemps nous avons regardé le monde changer. Alors que le destin de l’Europe vacille, nous devons nous lever et rappeler à tous ce dont la Suède est capable."
 SWE_host_fascist_exiles:0 "Accueillir des exilés fascistes"
 SWE_host_fascist_exiles_desc:0 " "
