sweden_nap.32.a:0 "Bien regrettable…"

sweden_mill_access.1.t:0 "[SWE.GetNameDefCap] offre un accès militaire"
sweden_mill_access.1.d:0 "Tôt ce matin, un envoyé suédois est arrivé à [ROOT.Capital.GetCapitalVictoryPointName] avec une proposition : nous permettre de faire transiter nos troupes par leur territoire, en échange de notre promesse de ne pas leur témoigner d’hostilité. Quelle doit être notre réponse ?"
sweden_mill_access.1.a:0 "Cela nous est bénéfique, signons."
sweden_mill_access.1.b:0 "Nous avons d’autres moyens d’obtenir l’accès."

sweden_mill_access.11.t:0 "[FROM.GetNameDefCap] signe le traité"
sweden_mill_access.11.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une excellente nouvelle : [FROM.GetNameDef] a signé notre traité."
sweden_mill_access.11.a:0 "Parfait !"

sweden_mill_access.12.t:0 "[FROM.GetNameDefCap] ne signe pas le traité"
sweden_mill_access.12.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une mauvaise nouvelle : les [FROM.GetAdjective] ont refusé de signer notre traité. Nous devrons nous en méfier à l’avenir."
sweden_mill_access.12.a:0 "Bien regrettable…"

sweden_soviet.1.t:0 "La Suède cherche à rejoindre [SOV.GetFactionName]"
sweden_soviet.1.d:0 "Depuis que les travailleurs suédois ont pris leur avenir en main, leurs politiciens se sont rapprochés de nous. Aujourd’hui, des responsables suédois nous ont approchés pour rejoindre [SOV.GetFactionName]. Un tel allié pourrait verrouiller la Baltique, mais cela comporte aussi des risques : les Allemands pourraient se sentir menacés. Quelle doit être notre réponse ?"
sweden_soviet.1.a:0 "Avec leur aide, la révolution ne faiblira pas !"
sweden_soviet.1.b:0 "Ils ne sont qu’un fardeau."

sweden_soviet.2.t:0 "Les Soviétiques acceptent notre demande"
sweden_soviet.2.d:0 "Après quelques heures de discussions à huis clos à Moscou, nos diplomates ont transmis une excellente nouvelle à Stockholm : ils acceptent notre adhésion à [SOV.GetFactionName], estimant que cela servira nos intérêts communs."
sweden_soviet.2.a:0 "Vive la Révolution !"

sweden_soviet.3.t:0 "Moscou refuse notre demande"
sweden_soviet.3.d:0 "Alors que nos envoyés s’adressaient aux Soviétiques, nous nous attendions à un accueil chaleureux. Pourtant, ils ont déclaré qu’ils n’avaient aucune intention d’« inviter des Allemands de pacotille » dans [SOV.GetFactionName]. Cela a suscité des remous en interne, mais ce n’est pas la première fois que nous recevons un refus."
sweden_soviet.3.a:0 "Nous patienterons…"

sweden_soviet.4.t:0 "La Suède soulève la question des Åland"
sweden_soviet.4.d:0 "Tôt ce matin, un télégramme de Stockholm est arrivé à Moscou au sujet de l’État autonome des Åland, actuellement sous contrôle finlandais. Il soulignait leur valeur stratégique et affirmait qu’elles renforceraient considérablement nos positions communes en Baltique. Quelle doit être notre réponse ?"
sweden_soviet.4.a:0 "Ils ont raison."
sweden_soviet.4.b:0 "Nous avons d’autres projets pour Åland."

sweden_soviet.5.t:0 "Les Soviétiques acceptent"
sweden_soviet.5.d:0 "En réponse à notre message, Moscou a exprimé son intérêt et reconnu l’importance stratégique des Åland."
sweden_soviet.5.a:0 "Notre plan continue."

sweden_soviet.6.t:0 "Les Soviétiques refusent"
sweden_soviet.6.d:0 "Hier soir, nous avons reçu un télégramme de Moscou indiquant leur désintérêt pour ces petites îles baltiques, laissant de fait Åland dans notre sphère d’influence."
sweden_soviet.6.a:0 "Dommage, mais il y a toujours un côté positif."

sweden_soviet.7.t:0 "La Suède exige des concessions"
sweden_soviet.7.d:0 "Tôt ce matin, un envoyé de Stockholm est arrivé à Helsinki, rencontrant le gouvernement et présentant un ultimatum : accepter une réorganisation territoriale ou faire face à de « graves conséquences »."
sweden_soviet.7.a:0 "Nous ne pouvons pas nous opposer… pas encore…"
sweden_soviet.7.b:0 "Non ! Le territoire finlandais reste finlandais !"
sweden_soviet.7.c:0 "Pour la sécurité de notre peuple… nous acceptons."

sweden_soviet.8.t:0 "Les Soviétiques exigent des territoires"
sweden_soviet.8.d:0 "À la suite des exigences formulées par Stockholm, Moscou a désormais envoyé des revendications pour une portion importante de territoires à l’est."
sweden_soviet.8.a:0 "Nous devons accepter, sous peine d’anéantissement…"
sweden_soviet.8.b:0 "Plus aucune concession ! La victoire ou la mort !"

sweden_soviet.9.t:0 "La Finlande cède [148.GetName]"
sweden_soviet.9.d:0 "Aujourd’hui, la Finlande a transféré une partie de ce qui nous appartenait autrefois : les territoires de [148.GetName]. Cela permet d’unir davantage de population sámi à notre nation et d’établir une frontière avec notre allié à l’est."
sweden_soviet.9.a:0 "Ah, victoire !"

sweden_soviet.10.t:0 "La Finlande refuse de céder [148.GetName]"
sweden_soviet.10.d:0 "Lors d’une conférence de presse, le Premier ministre finlandais a annoncé qu’ils ne céderaient jamais de territoires à une autre nation et que, si les Suédois voulaient les prendre, ils devraient le faire par la force."
sweden_soviet.10.a:0 "S’ils veulent la guerre…"

sweden_soviet.11.t:0 "La Finlande abandonne des terres"
sweden_soviet.11.d:0 "Reconnaissant la folie de s’accrocher à des territoires que l’idée actuelle de la nation finlandaise revendique comme siens, les Finlandais ont transféré le contrôle des États demandés."
sweden_soviet.11.a:0 "Formidable !"

sweden_soviet.12.t:0 "Les Finlandais bloquent nos exigences"
sweden_soviet.12.d:0 "Il semble que les Finlandais soient trop obstinés pour comprendre la situation dans laquelle ils se trouvent. Ils ont refusé de céder les États réclamés par nos politiciens et ont mobilisé leurs forces armées vers la frontière. D’une façon ou d’une autre, nous obtiendrons ce territoire."
sweden_soviet.12.a:0 "Il est temps de passer aux manœuvres militaires…"

sweden_soviet.13.t:0 "La Suède s’empare du pouvoir"
sweden_soviet.13.d:0 "Nos territoires ayant été saisis par la Suède et l’Union soviétique, les Suédois ont déclaré que la Finlande n’était plus en état de survivre par elle-même. Ils ont clairement affiché leur intention d’assurer la survie du peuple finlandais face aux guerres à venir en Europe."
sweden_soviet.13.a:0 "Nous devons nous incliner…"

sweden_soviet.91.t:0 "La Finlande cède [148.GetName]"
sweden_soviet.91.d:0 "Comme les Suédois s’y attendaient, les Finlandais ont cédé [148.GetName] sous la pression et face à la menace d’une guerre sur deux fronts."
sweden_soviet.91.a:0 "Maintenant, c’est notre tour."

sweden_soviet.101.t:0 "La Finlande refuse les exigences suédoises"
sweden_soviet.101.d:0 "De façon surprenante, mais pas totalement improbable, les Finlandais ont refusé de céder les terres revendiquées par la Suède. Nous allons maintenant voir de quoi notre nouvel allié est réellement capable."
sweden_soviet.101.a:0 "Intéressant…"

sweden_soviet.111.t:0 "La Finlande cède face aux [SOV.GetAdjective]"
sweden_soviet.111.d:0 "Sans la moindre surprise, après avoir été contrainte de nous donner [148.GetName], la Finlande a préféré céder d’autres territoires plutôt que de risquer une invasion. Mais bientôt, la Finlande ne sera de toute façon plus un problème."
sweden_soviet.111.a:0 "Prévisible."

sweden_soviet.112.t:0 "La Finlande reste défiance"
sweden_soviet.112.d:0 "Il s’avère que les Finlandais ne sont pas aussi faciles à soumettre que nous l’avions pensé. Ils devront maintenant affronter la colère soviétique. Il sera étonnant que la Finlande survive plus d’un mois."
sweden_soviet.112.a:0 "Pourquoi gaspiller du sang ainsi, Finlande ?"

sweden_soviet.30.t:0 "[SWE.GetName] propose l’unification"
sweden_soviet.30.d:0 "[SWE.GetName] nous a adressé une offre diplomatique visant à unir nos pays en un seul, afin de nous dresser ensemble contre l’Union soviétique."
sweden_soviet.30.a:0 "Ensemble, nous sommes plus forts !"
sweden_soviet.30.b:0 "Nous préférons conserver notre indépendance."

sweden_soviet.31.t:0 "[From.GetName] rejoint notre union !"
sweden_soviet.31.d:0 "[From.GetName] a accepté notre offre et a été intégré dans l’Union nordique des Républiques socialistes !"
sweden_soviet.31.a:0 "Bienvenue, camarades !"

sweden_soviet.32.t:0 "[From.GetName] décline l’invitation"
sweden_soviet.32.d:0 "[From.GetName] a refusé notre invitation à rejoindre notre glorieuse union. Cependant, nous pouvons rester alliés et résister ensemble aux menaces extérieures !"
sweden_soviet.32.a:0 "Quel dommage…"

sweden_soviet.33.t:0 "[SWE.GetName] nous invite dans le [SWE.GetFactionName]"
sweden_soviet.33.d:0 "Un communiqué officiel en provenance de Stockholm est arrivé aujourd’hui, nous proposant une invitation à rejoindre le [SWE.GetFactionName]. Le message mentionne la volonté de résister à l’agression venant de l’est, en particulier du [SOV.GetName]. Quelle doit être notre réponse ?"
sweden_soviet.33.a:0 "Un rempart contre l’est ? Nous acceptons."
sweden_soviet.33.b:0 "Et provoquer l’Ours russe ? Non."

sweden_soviet.34.t:0 "[FROM.GetName] accepte l’invitation"
sweden_soviet.34.d:0 "[FROM.GetName] a accepté notre invitation. Notre rempart contre la menace du [SOV.GetName] se renforce !"
sweden_soviet.34.a:0 "Bienvenue !"

sweden_soviet.35.t:0 "[FROM.GetName] refuse l’invitation"
sweden_soviet.35.d:0 "Malheureusement, nos amis [FROM.GetName] ont refusé l’invitation à protéger l’Europe contre le [SOV.GetName]. Malgré cela, nous les protégerons face à la menace orientale."
sweden_soviet.35.a:0 "C’est regrettable."

sweden_soviet.40.t:0 "Les ouvriers lancent un coup d’État !"
sweden_soviet.40.d:0 "Après plusieurs mois de préparation, nos ouvriers sont prêts à déclencher le soulèvement ! Que notre victoire soit rapide et que la flamme révolutionnaire ne s’éteigne jamais !"
sweden_soviet.40.a:0 "Debout, travailleurs !"

sweden_soviet.60.t:0 "La famille royale suédoise a disparu"
sweden_soviet.60.d:0 "À mesure que la politique suédoise changeait, le roi de Suède s’est montré de plus en plus critique face à la voie radicale empruntée par le pays.\n\nCependant, depuis sa dernière apparition il y a un peu plus d’un mois, la famille royale est restée totalement silencieuse. Le nouveau Premier ministre suédois a déclaré publiquement que cette disparition était préoccupante, mais il ne fait aucun secret que le nouveau régime est hostile à la royauté. Certains experts craignent le pire."
sweden_soviet.60.a:0 "Quelle horreur !"

sweden_sca_unite.1.t:0 "[FROM.GetNameDefCap] propose l’unification scandinave"
sweden_sca_unite.1.d:0 "Lors d’une réunion aujourd’hui, [FROM.GetLeader] a évoqué la possibilité d’une Scandinavie unifiée. Il a souligné que culturellement et historiquement, les pays scandinaves ont toujours été proches, et qu’avec l’Europe au bord d’une nouvelle grande guerre, il pourrait être bénéfique de s’unir en une seule entité politique afin de repousser plus facilement les menaces potentielles."
sweden_sca_unite.1.a:0 "Ils marquent un point."
sweden_sca_unite.1.b:0 "Si l’un tombe, tous tombent ?"

sweden_sca_unite.2.t:0 "[FROM.GetNameDefCap] accepte la proposition"
sweden_sca_unite.2.d:0 "[FROM.GetLeader] a accepté la proposition et annoncé que [FROM.GetNameDef] rejoindra la formation du Conseil scandinave."
sweden_sca_unite.2.a:0 "Nous savions qu’ils comprendraient les avantages."

sweden_sca_unite.3.t:0 "[FROM.GetNameDefCap] refuse la proposition"
sweden_sca_unite.3.d:0 "[FROM.GetLeader] a déclaré que la formation d’un Conseil scandinave pourrait être perçue comme un acte d’agression potentiel par d’autres puissances européennes et menacer l’équilibre des forces. Ils ont donc décliné l’invitation."
sweden_sca_unite.3.a:0 "Nous sommes plus faibles sans eux…"

sweden_sca_unite.4.t:0 "[FROM.GetNameDefCap] invite [THIS.GetNameDefCap] au Conseil scandinave"
sweden_sca_unite.4.d:0 "Aujourd’hui, [THIS.GetLeader] a eu une longue conversation téléphonique avec [FROM.GetLeader]. Au cours de cette discussion, [FROM.GetLeader] a proposé que nous rejoignions le Conseil scandinave. Bien que nous ne soyons pas en Scandinavie, nos liens historiques, culturels et économiques font de nous un candidat légitime pour y participer."
sweden_sca_unite.4.a:0 "Pour l’avenir de la Scandinavie !"
sweden_sca_unite.4.b:0 "Après avoir gagné notre indépendance, allons-nous déjà l’abandonner ?"

sweden_sca_unite.5.t:0 "[FROM.GetNameDefCap] accepte l’invitation"
sweden_sca_unite.5.d:0 "Aujourd’hui, nous avons appris que [FROM.GetNameDef] a accepté l’invitation à rejoindre le conseil et a commencé les préparatifs pour intégrer son économie, ses forces armées et son marché civil avec les nôtres."
sweden_sca_unite.5.a:0 "Formidable !"

sweden_sca_unite.6.t:0 "[FROM.GetNameDefCap] refuse l’invitation"
sweden_sca_unite.6.d:0 "Malheureusement, [FROM.GetNameDef] nous a informés qu’ils n’avaient aucun réel intérêt à rejoindre le conseil, affirmant qu’après avoir obtenu leur indépendance, ils ne souhaitaient pas la perdre aussitôt."
sweden_sca_unite.6.a:0 "Quel malheur."

SWE_foreign_politics_events.1.t:0 "Pression [SWE.GetAdjective] sur le gouvernement"
SWE_foreign_politics_events.1.desc:0 "Le ministre des Affaires étrangères [FROM.GetAdjective] est arrivé dans la capitale pour des consultations urgentes avec [THIS.GetLeader]. La délégation [FROM.GetAdjective] est venue avec une longue liste de dossiers en suspens, allant de la sécurité frontalière à des représentations peu flatteuses de [FROM.GetLeader] dans la presse locale. Lors d’une conférence de presse, le ministre a souligné l’importance de la coopération et de la collaboration pacifique, mais a noté que [FROM.GetLeader] « aurait du mal à accepter un [THIS.GetNameDef] hostile ou peu amical »."
SWE_foreign_politics_events.1.a:0 "Nous sommes prêts à rejoindre leur faction, si nous gardons notre constitution."
SWE_foreign_politics_events.1.b:0 "Nous devons aligner notre gouvernement sur le leur."
SWE_foreign_politics_events.1.c:0 "Nous ne céderons pas d’un pouce."

SWE_foreign_politics_events.2.t:1 "Manifestations pro-[SWE.GetAdjective] dans la capitale"
SWE_foreign_politics_events.2.desc:0 "Plusieurs groupes politiques ont annoncé des manifestations dans la capitale cette semaine. Ils ne semblent pas avoir de revendications précises, si ce n’est une volonté générale d’améliorer nos relations avec [SWE.GetNameDef] et d’écarter tout politicien critique de l’administration [SWE.GetAdjective] des postes de pouvoir.\n\nIl est possible que ces manifestations soient de simples expressions spontanées de l’opinion populaire, mais il est remarquable que plusieurs organisateurs clés aient récemment voyagé à Stockholm et aient commencé à agiter pour cette cause à leur retour."
SWE_foreign_politics_events.2.a:0 "Eh bien, c’est leur droit."
SWE_foreign_politics_events.2.b:0 "Envoyons la police casser quelques têtes !"
