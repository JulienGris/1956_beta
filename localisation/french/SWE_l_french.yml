### Focuses
 SWE_swedish_army_staff:0 "État-major de l’armée suédoise"
 SWE_swedish_army_staff_desc:0 "Pour que notre armée fonctionne comme un tout cohérent, nous établirons l’Arméstaben, l’office de l’état-major, chargé de l’instruction, des tactiques, de l’organisation et des achats d’équipement."
 SWE_begin_initial_rearmament:0 "Lancer le réarmement initial"
 SWE_begin_initial_rearmament_desc:0 "Lancer le réarmement initial."
 SWE_expand_the_military_budget:0 "Augmenter le budget militaire"
 SWE_expand_the_military_budget_desc:0 "Augmenter le budget militaire."
 SWE_fund_carl_gustafs_gevarsfaktori:0 "Financer Carl Gustafs Gevärsfaktori"
 SWE_fund_carl_gustafs_gevarsfaktori_desc:0 "En accordant des fonds supplémentaires au Gevärsfaktoriet, nous moderniserons plus vite notre arsenal. Leurs usines locales aideront aussi au réarmement national."
 SWE_hire_scania_vabis:0 "Solliciter Scania-Vabis"
 SWE_hire_scania_vabis_desc:0 "Malgré son jeune âge, Scania-Vabis a prouvé son succès. Offrons-leur un financement en échange de nouveaux véhicules pour l’armée."
 SWE_winter_equipment:0 "Équipement hivernal"
 SWE_winter_equipment_desc:0 "Les hivers suédois sont longs, rudes et glacials. Assurons-nous que nos soldats y sont mieux préparés que nos ennemis."
 SWE_nationalize_landsverk:0 "Nationaliser Landsverk"
 SWE_nationalize_landsverk_desc:0 "Nous connaissons les arrangements discrets entre la société allemande GHH et AB Landsverk. Tirons parti des connaissances acquises durant cette coopération et demandons-leur de concevoir des blindés capables de rivaliser avec les Allemands !"
 SWE_nationalize_landsverk_strv_m38_tt:0 "Avoir recherché un §HChâssis de char léger amélioré§! nous conférera le modèle §HStridsvagn m/38§! (char léger).\n"
 SWE_modern_command_structure:0 "Structure de commandement moderne"
 SWE_modern_command_structure_desc:0 "En modernisant la chaîne de commandement, nous serons moins vulnérables aux pertes de communications. Si une section connaît son objectif, elle n’a pas besoin qu’on le lui répète et doit être libre de l’atteindre par les moyens qu’elle juge adaptés."
 SWE_royal_military_academy:0 "Académie militaire royale"
 SWE_royal_military_academy_desc:0 "La création d’une académie militaire nous fournira davantage d’officiers et de chefs compétents. Il est vital que notre armée soit dirigée par l’élite."
 SWE_artilleriskjutskolan:0 "Artilleriskjutskolan"
 SWE_artilleriskjutskolan_desc:0 "À quoi sert l’artillerie si vos artilleurs ne touchent rien ? Au XVIIe siècle, notre roi Gustave Adolphe a jeté les bases de l’usage de l’artillerie. Nous avons pris du retard : rattrapons-le et prouvons à nouveau que l’artillerie suédoise est à craindre."
 SWE_bofors_kanoner:0 "Bofors-kanoner"
 SWE_bofors_kanoner_desc:0 "Bofors produit parmi les meilleurs canons au monde. Encourageons le développement d’armes plus performantes pour prendre l’avantage."
 SWE_armens_jagarskola:0 "Arméns Jägarskola"
 SWE_armens_jagarskola_desc:0 "La Suède est couverte de forêts. Formons nos troupes à s’y déplacer efficacement et à s’y retrancher. Petite nation, nous devons rejeter tout débarquement ennemi au plus vite."
 SWE_armens_jagarskola_tt:0 "Débloque §HSvenska Jägare§!\n§HJaegers\n    Attaque douce : §G+5%§!\n    Défen­se : §G+5%§!\n    Forêt :\n        Défense : §G+10%§!\n        Mouvement : §G+5%§!§!"
 SWE_state_of_disarmament:0 "État de désarmement"
 SWE_state_of_disarmament_desc:0 "Depuis la loi de défense de 1926, nous avons choisi de nous désarmer — non par traité ni pression extérieure. Mais le monde change : devons-nous rester désarmés et laisser le destin décider ?"
 SWE_the_budgetary_question:0 "La question budgétaire"
 SWE_the_budgetary_question_desc:0 "Avec une nouvelle guerre peut-être imminente en Europe, nous devons réexaminer notre budget. L’extension d’urbanisme à Stockholm et Göteborg est prévue, mais l’usage précis des chantiers reste à arrêter."
 SWE_jumpstart_the_arms_industry:0 "Relancer l’industrie d’armement"
 SWE_jumpstart_the_arms_industry_desc:0 "Notre production d’armes, modeste mais régulière, ne suffira pas à long terme. Il faut étendre le secteur afin qu’il nous protège efficacement si la guerre nous atteint."
 SWE_expand_airfleet_capabilities:0 "Étendre les capacités aériennes"
 SWE_expand_airfleet_capabilities_desc:0 "Nos capacités actuelles sont insuffisantes. En finançant la création et l’agrandissement de nouveaux aérodromes, nous poserons une base solide pour notre future armée de l’air."
 SWE_conclude_rearmament:0 "Achever le réarmement"
 SWE_conclude_rearmament_desc:0 "Nous avons désormais dépassé les limites fixées par la loi de 1926. Si la guerre arrive chez nous, nous serons prêts."
 SWE_fighter_designs:0 "Conceptions de chasseurs"
 SWE_fighter_designs_desc:0 "L’évolution rapide des chasseurs depuis la Grande Guerre montre qu’il faut accentuer nos efforts sur ces appareils mobiles, sous peine de perdre le contrôle de notre ciel."
 SWE_strike_craft_designs:0 "Conceptions d’appareils d’assaut"
 SWE_strike_craft_designs_desc:0 "À partir de nos chasseurs, nous pourrons monter des armements plus lourds, moins adaptés aux cibles aériennes mais efficaces contre les cibles terrestres et navales."
 SWE_medium_frame_craft:0 "Cellules de taille moyenne"
 SWE_medium_frame_craft_desc:0 "Aussi utiles que soient les petits appareils agiles, nous ne devons pas ignorer les missions lointaines. Des cellules plus grandes offriront plus d’autonomie, au prix d’un peu d’agilité."
 SWE_motorization_initiative:0 "Initiative de motorisation"
 SWE_motorization_initiative_desc:0 "Les manœuvres et les leçons de la Grande Guerre l’ont montré : la logistique hippomobile appartient au passé. L’avenir est au camion, qui transporte plus, plus loin et plus vite. Si la guerre revient, nous devons être prêts."
# SWE_nationalize_landsverk ...
 SWE_respect_landsverk_independence:0 "Respecter l’indépendance de Landsverk"
 SWE_respect_landsverk_independence_desc:0 "En laissant Landsverk AB indépendante, nous préserverons l’expertise et l’innovation du privé, tout en imposant des normes strictes de qualité pour l’équipement de défense."
 SWE_bicycle_infantry_regiments:0 "Régiments d’infanterie cycliste"
 SWE_bicycle_infantry_regiments_desc:0 "La motorisation est l’avenir, mais certains terrains restent inaccessibles aux camions alors que la vitesse demeure cruciale. En intégrant le vélo à nos forces, nous améliorerons reconnaissance et patrouilles là où les camions ne passent pas."
 SWE_fund_tank_research:0 "Financer la recherche sur les chars"
 SWE_fund_tank_research_desc:0 "Malgré la nouveauté des chars, leur développement est fulgurant : des mastodontes de la Grande Guerre aux modèles modernes. Ne pas suivre, c’est prendre un retard dangereux."
 SWE_the_lynx:0 "Le Lynx"
 SWE_the_lynx_desc:0 "Les chars sont puissants et franchissent presque tout, mais certains terrains réclament des véhicules plus légers et agiles. Finançons une automitrailleuse apte aux terrains accidentés pour soutenir au mieux notre infanterie."
 SWE_mechanized_battalions:0 "Bataillons mécanisés"
 SWE_mechanized_battalions_desc:0 "L’évolution logique de la guerre de mouvement mène des unités motorisées aux unités mécanisées. En dotant l’infanterie de véhicules proches des chars, nous lui fournirons un appui permanent au combat."

