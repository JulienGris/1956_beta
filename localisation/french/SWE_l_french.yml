### Focuses
 SWE_swedish_industrial_reinvigoration:0 "Relance de l’industrie suédoise"
 SWE_swedish_industrial_reinvigoration_desc:0 "Depuis que la Grande Dépression a atteint l’Europe, nous avons dû ajourner ou annuler des projets industriels. Il est temps de relancer et revigorer notre économie avec de nouvelles industries."
 SWE_expand_husqvarnas_factories:0 "Étendre les usines Husqvarna"
 SWE_expand_husqvarnas_factories_desc:0 "Husqvarna a prouvé ses capacités ; avec un petit coup de pouce de l’État, l’avenir de l’entreprise sera un investissement rentable."
 SWE_gotaverken_shipyards:0 "Chantiers navals Götaverken"
 SWE_gotaverken_shipyards_desc:0 "Plus grand chantier du monde par tonnage lancé, Götaverken s’est avéré un investissement précieux. Des fonds supplémentaires feront croître notre flotte marchande au-delà de nos attentes."
 SWE_infrastructure_development:0 "Développement des infrastructures"
 SWE_infrastructure_development_desc:0 "Nombre de nos routes reliant la côte à l’intérieur ont pris du retard sur les normes européennes ; il ne devrait pas être trop difficile de les remettre à niveau."
 SWE_refurbish_duved:0 "Rénovation de Duved"
 SWE_refurbish_duved_desc:0 "La centrale hydroélectrique de Duved approche d’une modernisation nécessaire ; en installant de nouvelles turbines et de nouveaux systèmes de contrôle, nous produirons davantage d’électricité tout en créant des emplois."
 SWE_swedish_state_railways:0 "Chemins de fer de l’État suédois"
 SWE_swedish_state_railways_desc:0 "Les Statens Järnvägar sont vitales pour le transport de la logistique et des matières premières, tout en offrant des trajets confortables aux appelés et aux civils. En développant des axes clés, le trafic ferroviaire gagnera encore en fluidité."
 SWE_sako:0 "SAKO"
 SWE_sako_desc:0 "Le Svenska Aluminiumkompaniet est notre seul producteur d’aluminium. Aidons son expansion pour devenir plus autonomes dans ce métal précieux."
 SWE_kiruna_mine:0 "Mine de Kiruna"
 SWE_kiruna_mine_desc:0 "Les mines de Kiruna sont inestimables pour notre économie : leur minerai de fer de très haute qualité fait de nous l’un des plus grands exportateurs d’acier et de fer de qualité."
 SWE_final_infrastructure_funding:0 "Financement d’infrastructure final"
 SWE_final_infrastructure_funding_desc:0 "Après avoir financé les routes intérieures du nord, profitons-en pour mettre aussi à jour les infrastructures du sud."
 SWE_civilian_sector_expansion:0 "Expansion du secteur civil"
 SWE_civilian_sector_expansion_desc:0 "Le secteur civil est l’épine dorsale de notre économie. En créant des emplois pour tous, nous stimulerons l’activité et pourrons mener davantage de projets."
 SWE_resource_utilization:0 "Valorisation des ressources"
 SWE_resource_utilization_desc:0 "Nos ressources brutes étant l’un des piliers de notre économie, assurons-nous de les exploiter correctement."
 SWE_industrial_research_program:0 "Programme de recherche industrielle"
 SWE_industrial_research_program_desc:0 "Financer le développement et la recherche industriels est capital. Nous ne pouvons nous permettre de prendre du retard sur nos voisins européens."

### Ideas
