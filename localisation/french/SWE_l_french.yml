### Events
 sweden_winter_war.1.t:0 "La Suède propose des concessions"
 sweden_winter_war.1.d:0 "Des diplomates suédois nous ont envoyé, via l’Allemagne, une offre : céder Gotland en échange d’une fin des hostilités. Il semble qu’ils n’avaient pas anticipé la reddition rapide des Finlandais et souhaitent revenir à l’état de paix d’avant-guerre."
 sweden_winter_war.1.a:0 "Très bien ; Gotland sera à nous."
 sweden_winter_war.1.b:0 "Non, ils ont commencé cette guerre. Nous la terminerons."
 sweden_winter_war.2.t:0 "Les Soviétiques refusent notre offre de paix"
 sweden_winter_war.2.d:0 "Invoquant la réaction agressive de la Suède à la guerre finno-soviétique, l’Union soviétique a refusé notre offre d’échanger Gotland contre la paix. Préparons-nous au courroux à venir."
 sweden_winter_war.2.a:0 "Qu’avons-nous fait…"

 SWE_agree_peace:0 "La Suède accepte de céder §YGotland§! en échange de la paix !"

