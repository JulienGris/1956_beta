### Focuses
 SWE_modernizing_the_air_force:0 "Moderniser l’Armée de l’air"
 SWE_modernizing_the_air_force_desc:0 "L’Armée de l’air suédoise est petite, même à l’échelle d’une armée suédoise déjà modeste, et pire encore, composée de petits lots de modèles étrangers disparates. Si nous voulons qu’elle constitue une menace, nous devons corriger ses lacunes."
 SWE_contract_cvm:0 "Contrat avec le CVM"
 SWE_contract_cvm_desc:0 "La Centrala Flygverkstaden Malmslätt a été essentielle pour la réparation et l’entretien de nos avions. Un financement dédié lui permettrait d’étendre son champ d’action, de la maintenance au développement de l’aviation navale."
 SWE_hire_junkers:0 "Engager Junkers"
 SWE_hire_junkers_desc:0 "Grâce à l’aide de Junkers, nous avons posé les bases de notre programme de bombardiers en piqué. Nous devrions leur proposer d’ouvrir un bureau permanent en Suède afin de mieux exploiter leur savoir-faire."
 SWE_torpedo_bombers:0 "Bombardiers torpilleurs"
 SWE_torpedo_bombers_desc:0 "Dans la mer Baltique, les torpilleurs sont redoutés : ils peuvent couler un navire capital pour une fraction du coût. En concentrant R&D sur ce domaine, nous pourrons maîtriser les mers !"
 SWE_contract_ffvs:0 "Contrat avec la FFVS"
 SWE_contract_ffvs_desc:0 "La dernière guerre a démontré l’importance de la supériorité aérienne. Des appareils ennemis pourraient infliger d’énormes dégâts au territoire suédois ; disposer de chasseurs modernes pour les repousser doit être une priorité."
 SWE_license_republic_aviation:0 "Licencier Republic Aviation"
 SWE_license_republic_aviation_desc:0 "Bien que nous n’ayons pas encore reçu les P-35 commandés à Republic Aviation, nous pourrions leur demander de nous autoriser à produire leurs conceptions sous licence."
 SWE_flygverkstaderna:0 "Flygverkstäderna"
 SWE_flygverkstaderna_desc:0 ""
 SWE_work_with_hawker:0 "Collaborer avec Hawker"
 SWE_work_with_hawker_desc:0 "L’achat de Hawker Hart s’est révélé fructueux pour notre jeune aviation. Mais la recherche progresse sans cesse : pour ne pas prendre de retard, collaborer avec Hawker à la conception et à la production d’avions pour notre usage serait une bonne manière d’avancer tout en laissant nos entreprises locales se concentrer ailleurs."
 SWE_dual_engine_planes:0 "Avions bimoteurs"
 SWE_dual_engine_planes_desc:0 "Nos capacités de production aéronautique étant limitées, nous ferions bien de concevoir des appareils capables d’aller plus loin et de frapper plus fort."
 SWE_swedish_nine:0 "Le « Swedish Nine »"
 SWE_swedish_nine_desc:0 "En regroupant nos bombardiers en piqué en 3 groupes de 3 et en concentrant leurs attaques sur une cible depuis plusieurs directions, nous accroîtrons nos chances de couler des convois ennemis tout en limitant les pertes."
 SWE_northern_airfields:0 "Aérodromes du Nord"
 SWE_northern_airfields_desc:0 "Nos terres du Nord sont vastes et les distances longues ; pour éviter la destruction de nos mines vitales, nous devons offrir des aérodromes à notre jeune aviation dans la région."
 SWE_southern_airfields:0 "Aérodromes du Sud"
 SWE_southern_airfields_desc:0 "Les détroits danois et le sud de la Baltique sont des zones où nous devons contrôler à la fois la mer et le ciel. En agrandissant nos aérodromes du Sud, nous pourrons mieux dominer notre espace aérien méridional."
 SWE_found_saab:0 "Fonder SAAB"
 SWE_found_saab_desc:0 "En créant SAAB, Svenska Aeroplan Aktiebolaget, nous disposerons d’une production aéronautique domestique."
 SWE_domestic_aircraft_designs:0 "Conceptions aéronautiques nationales"
 SWE_domestic_aircraft_designs_desc:0 "En finançant le développement d’avions nationaux, nous pourrons concevoir des appareils faits par nous et pour nous, sans dépendre de fabricants étrangers ni d’envois de pièces détachées."
 SWE_foreign_aircraft_designs:0 "Conceptions aéronautiques étrangères"
 SWE_foreign_aircraft_designs_desc:0 "Au lieu d’investir dans des projets qui pourraient n’aboutir à rien, mieux vaudrait adopter un appareil déjà développé et éprouvé — peut-être pas parfait, mais suffisamment adapté."
 SWE_low_altitude_bombers:0 "Bombardiers à basse altitude"
 SWE_low_altitude_bombers_desc:0 "En volant bas et vite, nos pilotes pourront éviter l’essentiel de la DCA par l’effet de surprise, et effectuer des frappes plus précises contre des cibles clés — un atout décisif."
 SWE_the_future_of_aviation:0 "L’avenir de l’aviation"
 SWE_the_future_of_aviation_desc:0 "Comme pour les blindés, l’aviation évolue à toute vitesse. Pour rester à la pointe, il nous reste énormément de travail."
 SWE_the_flying_barrel:0 "Le « tonneau volant »"
 SWE_the_flying_barrel_desc:0 "Surnommé « le tonneau volant » en raison de sa forme, le J 29 est notre première véritable tentative de chasseur à réaction de pure race. Aucun doute : le futur de l’aviation est à la propulsion à réaction."
 SWE_rocket_propulsion:0 "Propulsion par fusée"
 SWE_rocket_propulsion_desc:0 "En misant sur la propulsion par fusée, nous prendrons l’avantage dans ce domaine : des armes antichars portatives aux intercepteurs à fusée, presque tout devient possible."

### Ideas
 SWE_swedish_nine_tactic:0 "Tactique « Swedish Nine »"
 SWE_swedish_nine_tactic_desc:0 "En regroupant nos bombardiers en piqué en 3 groupes de 3 et en attaquant une cible unique sous plusieurs angles, nous augmentons nos chances de couler les convois ennemis tout en limitant les pertes."
 SWE_low_altitude_bombers_idea:0 "Bombardiers à basse altitude"

