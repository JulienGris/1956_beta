##### Events
r56.news_event.906.t:0 "La Suède révoque la Convention des Îles Åland !"
r56.news_event.906.d:0 "La Convention des Åland, signée en 1921, stipulait que les îles éponymes seraient administrées par la Finlande. En contrepartie, la région obtenait non seulement une autonomie, mais devait aussi rester entièrement démilitarisée. Considérant que cet accord ne sert plus ses intérêts, la plus grande nation nordique a de nouveau revendiqué les îles. En réponse, la Finlande a remilitarisé l’archipel, et les relations diplomatiques entre les deux pays se détériorent rapidement."
r56.news_event.906.a:0 "Tout ça pour quelques îles."
r56.news_event.906.b:0 "Enfin !"

sweden_german_trade.1.t:0 "Notre commerce avec l’Allemagne"
sweden_german_trade.1.d:0 "Nous avons signé le traité commercial suédo-allemand il y a quelques années. Cependant, alors que les tensions mondiales augmentent, nous devons réexaminer ce traité et décider de la marche à suivre.\n\nDevons-nous poursuivre notre voie actuelle, viser l’autosuffisance ou accroître encore notre commerce avec les Allemands ?"
sweden_german_trade.1.a:0 "Intéressant…"

sweden_aland.1.t:0 "La Suède réclame Åland"
sweden_aland.1.d:0 "Hier, le gouvernement suédois, ayant déjà réaffirmé sa revendication sur Åland, est passé à l’étape suivante : il en a exigé la cession pure et simple. Les représentants de Stockholm avancent que les îles sont majoritairement peuplées de Suédois, mais notre présence en mer Baltique serait considérablement réduite. Le sous-entendu est clair : l’alternative, c’est la guerre… et pouvons-nous survivre à une invasion ?"
sweden_aland.1.a:0 "Accepter les exigences."
sweden_aland.1.b:0 "Åland est à nous de plein droit !"

sweden_aland.12.t:0 "La Finlande accepte les exigences !"
sweden_aland.12.d:0 "Aujourd’hui, pour la première fois depuis 1809, le drapeau suédois a remplacé les étendards finlandais flottant sur Åland. Bien que la population locale ait été plutôt indifférente, le gouvernement suédois s’est réjoui de cette victoire diplomatique, en particulier de l’acquisition de la base navale la plus importante du golfe de Botnie. À l’inverse, l’humeur en Finlande est sombre, et il est notable que malgré l’abandon des îles, la Finlande continue de les revendiquer."
sweden_aland.12.a:0 "Enfin !"

sweden_aland.13.t:0 "Les Finlandais refusent !"
sweden_aland.13.d:0 "Les Finlandais ont pris la décision discutable de risquer la vie de leur peuple pour une petite chaîne d’îles. Peut-être souhaitent-ils redevenir un jour partie intégrante de notre nation… Quelles que soient leurs raisons, la guerre semble désormais inévitable."
sweden_aland.13.a:0 "Scandaleux !"

sweden_aland.2.t:0 "La Suède propose des garanties pour Åland"
sweden_aland.2.d:0 "Arrivés aujourd’hui à [ROOT.Capital.GetCapitalVictoryPointName], les diplomates suédois ont formulé une proposition : céder les îles Åland en échange d’une garantie d’assistance militaire en cas d’attaque extérieure."
sweden_aland.2.a:0 "Cela semble équitable. Nous acceptons."
sweden_aland.2.b:0 "Non ! La Convention des Åland doit tenir."

sweden_aland.21.t:0 "La Finlande transfère Åland"
sweden_aland.21.d:0 "Aujourd’hui, les îles Åland sont revenues sous administration suédoise, après avoir longtemps été sous domination finlandaise puis russe. Nous sommes désormais liés par notre engagement à protéger la Finlande en cas d’agression."
sweden_aland.21.a:0 "Välkommna Hem !"

sweden_aland.22.t:0 "La Finlande refuse notre offre d’aide"
sweden_aland.22.d:0 "Invoquant le maintien de la Convention des Åland, le gouvernement finlandais a rejeté notre offre d’assistance militaire en échange des îles."
sweden_aland.22.a:0 "Dommage…"

sweden_fascism.1.t:0 "La Suède exige la soumission"
sweden_fascism.1.d:0 "Hier, le gouvernement suédois a déclaré publiquement que le Danemark devait se soumettre à la domination suédoise afin d’assurer la prospérité future. Cette exigence inclut l’indépendance de l’Islande et une mainmise suédoise sur le Danemark ainsi que sur sa politique étrangère."
sweden_fascism.1.a:0 "Accepter les exigences."
sweden_fascism.1.b:0 "Le Danemark restera danois !"

sweden_fascism.12.t:0 "Le Danemark accepte les exigences !"
sweden_fascism.12.d:0 "Aujourd’hui marque un jour glorieux de notre histoire : le drapeau suédois flotte sur Copenhague, puisque le Danemark a accepté la domination suédoise."
sweden_fascism.12.a:0 "Enfin !"

sweden_fascism.13.t:0 "Les Danois refusent !"
sweden_fascism.13.d:0 "Les Danois ont pris la décision discutable de se dresser contre notre puissance. Ils tomberont rapidement sous nos bottes."
sweden_fascism.13.a:0 "Scandaleux !"

sweden_auth.1.t:0 "La Suède exige l’annexion"
sweden_auth.1.d:0 "Aujourd’hui, le monarque suédois a exigé que nous rétablissions la domination suédoise sur notre pays. Plus d’un siècle s’est écoulé depuis notre séparation. S’il existe encore quelques partisans d’un retour à cette époque, la majorité aspire à l’indépendance. Cependant, ses propos contiennent des menaces à peine voilées."
sweden_auth.1.a:0 "Accepter les exigences."
sweden_auth.1.b:0 "Non ! [FROM.GetNameDefCap] restera indépendant !"

sweden_auth.12.t:0 "[FROM.GetName] accepte les exigences !"
sweden_auth.12.d:0 "Il semble que [FROM.GetNameDef] ait réalisé la situation délicate dans laquelle il se trouvait. En fin de compte, il est plus sûr de faire partie de la Suède que de tenter de survivre seul face aux bouleversements de l’Europe."
sweden_auth.12.a:0 "Enfin !"

sweden_auth.13.t:0 "[FROM.GetNameDefCap] refuse !"
sweden_auth.13.d:0 "Sans surprise, les [FROM.GetAdjective] ont refusé notre… « demande ». Nous nous y attendions, et il n’est pas étonnant que nous devions désormais prendre les armes pour récupérer ce qui nous revient."
sweden_auth.13.a:0 "Prévisible…"

sweden_auth.2.t:0 "[FROM.GetName] réclame un référendum"
sweden_auth.2.d:0 "Tôt ce matin, le monarque suédois, Carl Gustaf VI, a prononcé une déclaration publique invitant le peuple danois à voter pour l’unification avec la Suède, évoquant la gloire passée de l’Union de Kalmar. Par souci de bienveillance, il a proposé que les Danois puissent décider par référendum s’ils souhaitent rejoindre la Suède à nouveau."
sweden_auth.2.a:0 "Le peuple a parlé, nous obéirons."
sweden_auth.2.b:0 "Non, nous préférons rester nous-mêmes."

sweden_auth.22.t:0 "Les [FROM.GetAdjective] votent pour l’unification"
sweden_auth.22.d:0 "À la surprise générale, le peuple danois a voté en faveur de l’unification avec la Suède. Il semble qu’ils cherchent la sécurité au sein d’une grande nation partageant leur vision."
sweden_auth.22.a:0 "Välkomna hem, bröder !"

sweden_auth.23.t:0 "Les [FROM.GetAdjective] refusent le référendum"
sweden_auth.23.d:0 "Sans surprise, les [FROM.GetAdjective] ont refusé le référendum et ont préparé leurs forces en cas d’attaque. Il est temps de mesurer leur valeur au combat."
sweden_auth.23.a:0 "Prévisible."

sweden_nap.1.t:0 "[SWE.GetName] propose un traité d’assistance mutuelle"
sweden_nap.1.d:0 "Tôt ce matin, un envoyé suédois est arrivé à [ROOT.Capital.GetCapitalVictoryPointName] avec la proposition d’un traité « d’assistance mutuelle ». Le principe en est simple : ni eux ni nous n’engagerons de conflit l’un contre l’autre, et si l’un de nous est attaqué, l’autre lui viendra en aide."
sweden_nap.1.a:0 "Cela nous sera bénéfique à tous deux, signons."
sweden_nap.1.b:0 "Nous ne voulons pas être liés par de l’encre sur du papier…"

sweden_nap.11.t:0 "[FROM.GetName] signe le traité"
sweden_nap.11.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une excellente nouvelle : [FROM.GetNameDef] a signé notre traité."
sweden_nap.11.a:0 "Parfait !"

sweden_nap.12.t:0 "[FROM.GetName] ne signe pas le traité"
sweden_nap.12.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une mauvaise nouvelle : les [FROM.GetAdjective] ont refusé de signer notre traité. Nous devrons nous en méfier à l’avenir."
sweden_nap.12.a:0 "Bien regrettable…"

sweden_nap.2.t:0 "[SWE.GetName] propose un pacte de non-agression"
sweden_nap.2.d:0 "Tôt ce matin, un envoyé suédois est arrivé à [ROOT.Capital.GetCapitalVictoryPointName] avec une proposition de pacte de non-agression. Le principe est que tant que le pacte tient, ni eux ni nous n’initierons de conflit l’un contre l’autre."
sweden_nap.2.a:0 "Avec cela, notre front nord est sécurisé."
sweden_nap.2.b:0 "Nous ne voulons pas être liés par de l’encre sur du papier…"

sweden_nap.21.t:0 "[FROM.GetName] signe le traité"
sweden_nap.21.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une excellente nouvelle : les [FROM.GetAdjective] ont signé notre traité."
sweden_nap.21.a:0 "Parfait !"

sweden_nap.22.t:0 "[FROM.GetName] ne signe pas le traité"
sweden_nap.22.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une mauvaise nouvelle : les [FROM.GetAdjective] ont refusé de signer notre traité. Nous devrons nous en méfier à l’avenir."
sweden_nap.22.a:0 "Bien regrettable…"

sweden_nap.3.t:0 "[SWE.GetName] suggère un pacte de non-agression"
sweden_nap.3.d:0 "Tôt ce matin, un envoyé suédois est arrivé à [ROOT.Capital.GetCapitalVictoryPointName] avec une proposition de pacte de non-agression. Le principe est que tant que le pacte tient, ni eux ni nous n’initierons de conflit l’un contre l’autre."
sweden_nap.3.a:0 "Entretenir des relations amicales avec les [SWE.GetAdjective] serait bénéfique."
sweden_nap.3.b:0 "Nous avons d’autres projets…"

sweden_nap.31.t:0 "[FROM.GetName] signe le traité"
sweden_nap.31.d:0 "Nos diplomates sont revenus de [FROM.Capital.GetCapitalVictoryPointName] avec une excellente nouvelle : les [FROM.GetAdjective] ont signé notre traité."
sweden_nap.31.a:0 "Parfait !"

