### Focuses
 SWE_royalist_return:0 "Le retour des royalistes"
 SWE_royalist_return_desc:0 "La monarchie suédoise a été dépouillée de ses pouvoirs en 1917 par une coalition libérale et sociale-démocrate dirigée par Nils Edén. Or, le monde est de plus en plus instable, et les atermoiements des gouvernements démocratiques mettent l’avenir de la Suède en péril."
 SWE_king_gustafs_government:0 "Le gouvernement du roi Gustaf"
 SWE_king_gustafs_government_desc:0 "Le roi Gustaf V règne depuis la mort de son père Oscar II en 1907. Farouchement opposé au communisme et partisan d’une alliance pan-scandinave, il observe avec inquiétude l’ascension de Lénine et de Staline. Avec le retour du pouvoir royal, le roi doit gouverner seul à nouveau."
 SWE_prince_gustafs_coup:0 "Le coup du prince Gustaf"
 SWE_prince_gustafs_coup_desc:0 "Bien que la Suède ait un roi, Gustaf V est âgé et incapable de l’action décisive nécessaire pour sauver le royaume des prédations communistes. Pour survivre, la Suède a besoin d’un roi jeune et dynamique : Gustaf Adolf, fils de l’héritier du trône, doit monter sur le trône — par la force si nécessaire."
 SWE_return_to_sweden_norway:0 "Retour à la Suède-Norvège"
 SWE_return_to_sweden_norway_desc:0 "La séparation de la Suède et de la Norvège, liées par le sang et par traité pendant près d’un siècle, fut une grave erreur. Sans la Norvège, nous sommes coincés dans la Baltique ; sans la Suède, la Norvège ne peut se défendre seule si la guerre atteint la Scandinavie. Corrigeons cette erreur."
 SWE_the_finnish_crown:0 "La couronne finlandaise"
 SWE_the_finnish_crown_desc:0 "Pendant six siècles, jusqu’à la guerre de Finlande, la Finlande a protégé notre flanc oriental du bear russe. Aujourd’hui ballotée par les tempêtes de la politique mondiale, elle voit l’ours se rapprocher de ses frontières. Il faut sauver la Finlande des Russes et sécuriser à nouveau notre flanc est !"
 SWE_expand_livgardet:0 "Étendre le Livgardet"
 SWE_expand_livgardet_desc:0 "Le Livgardet, ou Gardes du Corps, est l’une des unités les plus anciennes encore en service, fondée durant la guerre de Libération en 1521. Chargés de défendre Stockholm et la famille royale, ils sont l’élite de l’armée. Avec la fin du désarmement démocratique, étendons-les pour renforcer le noyau de nos forces."
 SWE_modern_caroleans:0 "Caroliniens modernes"
 SWE_modern_caroleans_desc:0 "Les Caroliniens de Charles XII inspiraient la terreur. Carolus Rex n’est plus, mais son héritage demeure — rétablissons les Caroliniens à leur juste place et faisons trembler les ennemis de la Suède !"
 SWE_claim_the_danish_throne:0 "Revendiquer le trône danois"
 SWE_claim_the_danish_throne_desc:0 "Le royaume de Danemark fut jadis notre suzerain durant l’Union de Kalmar. Les temps ont changé : la Suède est désormais la plus forte, tandis que le Danemark languit sous des politiciens querelleurs, aveugles aux dangers à ses frontières. En tant que souverains légitimes de toute la Scandinavie, le trône danois doit nous revenir !"
 SWE_demand_danish_referendum:0 "Exiger un référendum danois"
 SWE_demand_danish_referendum_desc:0 "Offrons aux Danois une chance de résoudre pacifiquement notre… différend. S’ils acceptent un référendum sur leur avenir, nous n’imposerons pas notre revendication par la force. À moins, bien sûr, qu’ils refusent…"
 SWE_march_across_the_belts:0 "Marcher à travers les Belts"
 SWE_march_across_the_belts_desc:0 "Le trône du Danemark nous revient de droit et nous ne tolérerons aucune ingérence. L’armée danoise, minée par des années de négligence et de pacifisme, sera une proie facile."
 SWE_swedish_french_ties:0 "Liens franco-suédois"
 SWE_swedish_french_ties_desc:0 "La Suède et la France entretiennent des liens étroits depuis le XVIIIe siècle. Notre famille royale descend du général français Jean-Baptiste Jules Bernadotte (Charles XIV). La France redevenue monarchique, resserrons nos liens."
 SWE_nordic_solidarity:0 "Solidarité nordique"
 SWE_nordic_solidarity_desc:0 "Depuis les guerres napoléoniennes, la Suède a souvent été reléguée au rang de partenaire mineur. Cela doit cesser. En fondant notre propre alliance, nous montrons que nous n’acceptons plus d’être regardés de haut."
 SWE_stockholm_paris_agreement:0 "Accord Stockholm-Paris"
 SWE_stockholm_paris_agreement_desc:0 "Les Allemands sont un ennemi commun. Nous soutiendrons les revendications françaises sur la rive gauche du Rhin en échange de la reconnaissance de nos revendications sur le Schleswig du Nord. Combattons à nouveau côte à côte pour reconquérir ce que nous avons perdu."
 SWE_retake_pomerania:0 "Reprendre la Poméranie"
 SWE_retake_pomerania_desc:0 "La Poméranie fut suédoise avant d’être cédée au Danemark contre la Norvège en 1814. Nous n’avons jamais oublié nos droits, quoi qu’en disent les Allemands. L’Empire suédois sera restauré dans son intégralité — fût-ce au prix d’une guerre avec l’Allemagne."
 SWE_fortet_gotland:0 "Fortifier Gotland"
 SWE_fortet_gotland_desc:0 "Plus grande île de la Baltique, Gotland est une vulnérabilité clé : un envahisseur pourrait y établir une tête de pont. Évitons cela — planifions fortifications et batteries anti-aériennes aux points de débarquement probables."
 SWE_negotiate_with_norway:0 "Négocier avec la Norvège"
 SWE_negotiate_with_norway_desc:0 "Le littoral norvégien est long et mal défendu. En combinant nos forces, nous assurerons mieux la défense de nos deux nations contre toute invasion future."
 SWE_discussions_with_denmark:0 "Discussions avec le Danemark"
 SWE_discussions_with_denmark_desc:0 "La frontière danoise avec l’Allemagne, notamment le Jutland, est vulnérable. Au nom de l’unité scandinave, nous ne laisserons pas les Danois sans défense — quitte à risquer la guerre avec l’Allemagne."
 SWE_aland_for_guarantees:0 "Åland contre garanties"
 SWE_aland_for_guarantees_desc:0 "Åland est disputé depuis la Grande Guerre. Nous proposerons aux Finlandais : s’ils nous cèdent Åland, nous soutiendrons leur lutte contre les Russes."
 SWE_the_northern_lights:0 "Les Aurores boréales"
 SWE_the_northern_lights_desc:0 "Les bases d’une alliance défensive scandinave étant posées, consacrons ces garanties dans un traité formel : menacer l’un, c’est affronter tous."
 SWE_secure_our_southern_border:0 "Sécuriser notre frontière sud"
 SWE_secure_our_southern_border_desc:0 "Malgré nos différences, les Allemands souhaitent rester en bons termes en échange de notre tungstène et de notre minerai de fer. Proposons un pacte de non-agression — nous pourrons nous concentrer à l’est…"
 SWE_defend_the_baltics:0 "Défendre les pays baltes"
 SWE_defend_the_baltics_desc:0 "Comme les Finlandais, les Baltes sont menacés par un renouveau russe. Nous ne pouvons laisser l’histoire se répéter — envoyons des délégations à Riga, Kaunas et Tallinn pour les intégrer à notre alliance."
 SWE_ally_the_kaiserreich:0 "S’allier au Kaiserreich"
 SWE_ally_the_kaiserreich_desc:0 "Le retour du Kaiser, ami de longue date de notre famille royale, offre l’occasion d’une alliance des monarchies contre la Russie. Nous avons évité la Grande Guerre ; nous n’éviterons pas la menace russe. Envoyons une délégation à Berlin."
 SWE_joint_panzer_development:0 "Développement conjoint de panzers"
 SWE_joint_panzer_development_desc:0 "Les Allemands comptent parmi les meilleurs concepteurs de chars. Pour nous préparer à l’épreuve contre la Russie, envoyons une équipe technique pour concevoir des blindés communs."
 SWE_baltic_foothold:0 "Tête de pont en Baltique"
 SWE_baltic_foothold_desc:0 "Les « États baltes » sont faibles et entourés de voisins prédateurs. Prenons l’initiative et rétablissons une présence suédoise en Baltique pour la première fois depuis la Grande Guerre du Nord."
 SWE_prepare_for_the_march_east:0 "Préparer la marche vers l’est"
 SWE_prepare_for_the_march_east_desc:0 "La route de Moscou sera longue et rude, et le climat russe impitoyable. Ne répétons pas les erreurs du passé : préparons une campagne prolongée et un ravitaillement assuré, quelle que soit la distance."
 SWE_reclaim_the_imperial_east:0 "Reprendre l’Orient impérial"
 SWE_reclaim_the_imperial_east_desc:0 "C’est l’heure. Nous ne regarderons plus la Russie croître impunément. La Suède doit agir pour garantir son avenir — impérial. À la guerre !"
 SWE_prepare_for_soviet_aggression:0 "Se préparer à l’agression soviétique"
 SWE_prepare_for_soviet_aggression_desc:0 " "
 SWE_anti_comintern_signatory:0 "Signataire de l’Anti-Comintern"
 SWE_anti_comintern_signatory_desc:0 " "
 SWE_join_barbarossa:0 "Rejoindre Barbarossa"
 SWE_join_barbarossa_desc:0 " "
 SWE_unite_scandinavia:0 "Unifier la Scandinavie"
 SWE_unite_scandinavia_desc:0 "La guerre se profile ; il est temps d’assurer notre sécurité. Unis, nous tiendrons — divisés, nous tomberons."
 SWE_the_second_brother:0 "Le deuxième frère"
 SWE_the_second_brother_desc:0 "Notre histoire récente avec la Norvège fut tumultueuse ; pansons les plaies laissées par la dissolution de l’union."
 SWE_the_third_brother:0 "Le troisième frère"
 SWE_the_third_brother_desc:0 "Le Danemark fut tour à tour suzerain et allié. Rappelons nos liens de parenté et œuvrons ensemble à notre protection."
 SWE_the_fourth_brother:0 "Le quatrième frère"
 SWE_the_fourth_brother_desc:0 "Les Finlandais, à peine libérés des Russes, sont vulnérables. Montrons-leur ce que signifie être un égal."
 SWE_the_scandinavian_council:0 "Le Conseil scandinave"
 SWE_the_scandinavian_council_desc:0 "Nos frères rassurés, nous pouvons nous dire scandinaves d’une seule voix."
 SWE_the_honorary_scandinavian:0 "Le Scandinave d’honneur"
 SWE_the_honorary_scandinavian_desc:0 "L’Estonie fit partie de notre empire sous le nom de Livonie. Offrons-leur une place dans notre union naissante, s’ils le souhaitent."
 SWE_integrate_iceland:0 "Intégrer l’Islande"
 SWE_integrate_iceland_desc:0 "Malgré la distance, l’Islande est culturellement et historiquement scandinave. Il est logique de lui proposer l’intégration."
 SWE_decentralized_command_structure:0 "Structure de commandement décentralisée"
 SWE_decentralized_command_structure_desc:0 "En répartissant le commandement, nous devenons plus difficiles à vaincre. Donner plus d’autonomie aux commandants régionaux améliore la défense et l’adaptation locale."
 SWE_centralized_command_structure:0 "Structure de commandement centralisée"
 SWE_centralized_command_structure_desc:0 "Un centre unique facilite l’orientation des approvisionnements et des plans. Des ordres unifiés assurent la cohérence des opérations."
 SWE_north_sea_supremacy:0 "Suprématie en mer du Nord"
 SWE_north_sea_supremacy_desc:0 "En dominant la mer du Nord, nous protégeons nos routes et l’accès à la Baltique, et empêchons les débarquements ennemis sur nos longues côtes."
 SWE_nordic_joint_air_command:0 "Commandement aérien nordique conjoint"
 SWE_nordic_joint_air_command_desc:0 "Centraliser l’aviation améliore précision des frappes et logistique aérienne jusque dans les régions les plus éloignées."
 SWE_the_northern_crowns:0 "Les Couronnes du Nord"
 SWE_the_northern_crowns_desc:0 "Un cuirassé ne règne jamais seul : même le plus puissant a besoin de ses frères — comme nous."
 SWE_regional_capital_development:0 "Développement des capitales régionales"
 SWE_regional_capital_development_desc:0 "En développant les capitales de nos États constitutifs, nous retardons un effondrement rapide si Stockholm tombait et améliorons la cohésion de l’union."
 SWE_central_military_industry:0 "Industrie militaire centralisée"
 SWE_central_military_industry_desc:0 "La planification centrale de l’armement donne une base plus solide à des forces dont les besoins évoluent."
 SWE_scandinavian_volunteers:0 "Volontaires scandinaves"
 SWE_scandinavian_volunteers_desc:0 "Après une longue neutralité, permettons à nos forces de partir comme volontaires à l’étranger pour influencer l’Europe sans entrer directement en guerre."
 SWE_centralized_industrial_planning:0 "Planification industrielle centralisée"
 SWE_centralized_industrial_planning_desc:0 "Une planification plus efficace produit de meilleurs résultats, du sud au nord, sur le long terme."
 SWE_baltic_supremacy:0 "Suprématie baltique"
 SWE_baltic_supremacy_desc:0 "La Baltique est vitale. En fortifiant nos îles, nul ne la traversera sans notre assentiment."
 SWE_nordic_center_of_research:0 "Centre de recherche nordique"
 SWE_nordic_center_of_research_desc:0 "En réunissant les meilleurs esprits sous un même toit, nous accélérons l’innovation commune."

