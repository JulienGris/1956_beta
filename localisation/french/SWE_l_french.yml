### Tooltips
 SWE_divide_germany_france_tt:0 "Accepter de diviser l’§RAllemagne§!. La §YFrance§! obtient des revendications sur la Rhénanie et la §YSuède§! obtient des revendications sur le littoral §Rallemand§!."
 SWE_second_brother_tt:0 "À l’achèvement du focus §YLe Conseil scandinave§!, nous gagnerons des cœurs sur la §YNorvège§! si ce focus a été terminé au préalable."
 SWE_third_brother_tt:0 "À l’achèvement du focus §YLe Conseil scandinave§!, nous gagnerons des cœurs sur le §YDanemark§! si ce focus a été terminé au préalable."
 SWE_fourth_brother_tt:0 "À l’achèvement du focus §YLe Conseil scandinave§!, nous gagnerons des cœurs sur la §YFinlande§! si ce focus a été terminé au préalable."
 SWE_unite_scandinavia_tt:0 "Les membres §Yscandinaves§! de notre faction seront consultés sur l’unification. S’ils acceptent, nous les §Yannexerons§! et les intégrerons dans les §Yfocus§! ci-dessous."

 sweden.66.t:0 "Les Soviétiques refusent notre offre !"
 sweden.66.d:0 "Les Soviétiques ont décliné notre proposition. Un coup dur pour les intérêts communistes en Scandinavie."
 sweden.66.a:0 "Faux communistes !"

 sweden.67.t:0 "Les Soviétiques acceptent notre offre !"
 sweden.67.d:0 "Les sages dirigeants de l’URSS ont accepté et se tiennent fièrement à nos côtés dans la lutte contre le capitalisme."
 sweden.67.a:0 "Excellente nouvelle !"

 sweden.70.t:0 "Le roi convoque le gouvernement"
 sweden.70.d:0 "Gustaf V a réuni plusieurs figures politiques suédoises de premier plan, notamment celles du NSAP. Inquiet des vues autoritaires du NSAP, il ne considère pas, bien qu’opposé au communisme, que celui-ci soit une menace aussi pressante que le prétend le NSAP. Si l’on parvient à convaincre le roi du danger bolchevique, ce serait un sérieux atout pour la popularité du NSAP…"
 sweden.70.a:0 "Lui montrer les méfaits du communisme."
 sweden.70.b:0 "Son opinion n’a aucune importance."

 sweden.72.t:0 "Journaux royalistes"
 sweden.72.d:0 "Il semble que le roi Gustaf n’ait pas pris cette histoire d’exil avec la bonne humeur que nous espérions. Il s’est joint à un groupe de dissidents pour publier des calomnies contre notre gouvernement ! Ce vieux fou est simplement jaloux de ne plus avoir de siège de pouvoir."
 sweden.72.a:0 "Saisir et brûler ces publications !"
 sweden.72.b:0 "Cela ne vaut pas l’effort."

 sweden.75.t:0 "Unir les Finlande-Suédois"
 sweden.75.d:0 "Certains de nos nouveaux territoires en Finlande sont majoritairement suédophones et seraient plus naturellement gouvernés par la Suède proprement dite plutôt qu’en tant que partie de la Finlande. Bien sûr, cela affaiblirait un éventuel État fantoche finlandais, si nous choisissons d’en créer un…"
 sweden.75.a:0 "Aux Suédois, la Suède."
 sweden.75.b:0 "Le risque n’en vaut pas la peine."

 sweden.90.t:0 "Le cabinet royal"
 sweden.90.d:0 "Le roi a défié la politique de longue date de Per Albin Hansson consistant à éviter toute alliance étrangère en concluant un pacte avec la Finlande, ouvrant une fracture entre les deux anciens alliés. Juridiquement, le roi peut renvoyer Hansson et le remplacer, mais cela déplairait assurément aux républicains. Gustaf V doit-il aller au bout de ce plan ?"
 sweden.90.a:0 "Que le roi forme son Conseil."
 sweden.90.b:0 "Uniquement s’il remporte les élections."

 sweden.100.t:0 "Le communiqué de Stockholm"
 sweden.100.d:0 "Le roi de Suède Gustaf V a invité les dirigeants de Norvège et du Danemark à une conférence pour discuter de nos relations, de l’avenir de l’Europe et de la position de nos nations en cas de guerre. Y assister nous rapprocherait tous, mais est-ce vraiment ce que nous voulons ?"
 sweden.100.a:0 "Assister à la conférence"
 sweden.100.b:0 "Non, ce n’est pas dans notre intérêt"

 sweden.105.t:0 "Opération Stella Polaris"
 sweden.105.d:0 "Les Soviétiques dominent trop notre pauvre pays, au point que nous risquons de perdre des informations sensibles — et de beaucoup perdre si ces documents tombaient entre les mains de « Papa Joe ». Nos agents suggèrent de transférer nos opérations en Suède, base plus sûre et plus éloignée du conflit, au prix d’une certaine perte d’efficacité."
 sweden.105.a:0 "Les envoyer en Suède"
 sweden.105.b:0 "Ils sont nécessaires ici !"

 sweden.106.t:0 "Opération Stella Polaris"
 sweden.106.d:0 "Un homme non identifié, en imperméable noir, a rencontré de nuit notre chef de gouvernement au ministère finlandais. D’une voix grave et artificielle, il a expliqué que la déroute finlandaise face aux Soviétiques mettait en danger des informations sensibles. Sa proposition : les abriter en Suède, contre le droit d’en consulter une partie et l’amélioration de nos relations. Les Russes n’approuveraient jamais une telle chose."
 sweden.106.a:0 "Mener l’opération"
 sweden.106.b:0 "Non, trop risqué"

 finland.40.t:0 "Demander l’aide de la Suède ?"
 finland.40.d:0 "Notre pays a sombré dans la guerre civile contre une force manifestement soutenue par l’Union soviétique, et nous devons chercher des alliés. La Suède est un parrain évident — si nous obtenons son assistance, ce serait un atout majeur. Bien sûr, le statut d’Åland reste en question et, bien que regrettable, il a été jugé une compensation équitable…"
 finland.40.a:0 "Demander à la Suède de nous rejoindre"
 finland.40.b:0 "Non, c’est NOTRE guerre !"

 finland.41.t:0 "La Finlande appelle à l’aide"
 finland.41.d:0 "La Garde blanche finlandaise demande notre aide contre les communistes qui tentent de prendre le pouvoir. Elle nous promet aussi Åland en compensation — un échange de grande valeur ! Mais des vies suédoises doivent-elles être sacrifiées dans une guerre étrangère ?"
 finland.41.a:0 "Rejoindre la guerre civile"
 finland.41.b:0 "Nous ne pouvons pas rejoindre"

 sweden.43.t:0 "Åland se soulève !"
 sweden.43.d:0 "Des citoyens patriotes d’Åland ont rejoint la lutte contre la menace communiste et marchent avec ardeur vers le front… en tant que membres de l’armée suédoise. C’est malgré tout préférable à la domination rouge."
 sweden.43.a:0 "Quelle aubaine !"

 finland.45.t:0 "La Suède refuse de rejoindre"
 finland.45.d:0 "Les Suédois n’ont pas la volonté nécessaire pour entrer dans notre guerre, c’est très malheureux !"
 finland.45.a:0 "Trahison !"

 exileunits.2.t:0 "Polistrupper recrutés et entraînés"
 exileunits.2.d:0 "Les Polistrupper danois et norvégiens sont formés et prêts au combat. En attendant le jour où ils retourneront dans leurs patries, ils combattront aux côtés de notre armée."
 exileunits.2.a:0 "Un excellent renfort"

 iceland.1.t:0 "Mutinerie islandaise"
 iceland.1.d:0 "Une mutinerie fasciste a éclaté ! Après de brefs contrôles, il est clair qu’ils sont approvisionnés. Alors que le pays entier est en émeute, quelle position adopter ? Réprimer ou non ? Réprimer pourrait pousser leur fournisseur à agir lui-même. Les suspects les plus probables sont l’Allemagne ou la Suède."
 iceland.1.a:0 "Réprimer le soulèvement !"
 iceland.1.b:0 "Nous n’avons d’autre choix que de capituler."

 iceland.11.t:0 "L’Islande réprime le soulèvement !"
 iceland.11.d:0 "Notre soulèvement prévu en Islande n’a pas eu l’effet escompté : le gouvernement a réussi à l’étouffer avec ses ressources limitées. Que faisons-nous maintenant ? Nous pourrions lancer une invasion militaire totale, mais il faudrait alors compter avec le Danemark et très probablement le Groenland."
 iceland.11.a:0 "Alors, invasion !"
 iceland.11.b:0 "Nous ferons marche arrière pour l’instant."

 iceland.2.t:0 "L’Islande déclare son indépendance !"
 iceland.2.d:0 "Coup de théâtre : le petit détachement danois en Islande a été chassé par un groupe restreint mais bien armé de nationalistes. La domination danoise vacille — nous devons rétablir l’ordre ! À moins que nous ne puissions épargner les hommes… ou que notre conscience nous en empêche."
 iceland.2.a:0 "Leur accorder la souveraineté"
 iceland.2.b:0 "Déclarer la guerre et reprendre l’Islande !"

 iceland.3.t:0 "Le Danemark nous déclare la guerre"
 iceland.3.d:0 "Le gouvernement danois juge illégale notre tentative d’indépendance et envoie une invasion pour mettre fin à la fête. La Suède nous a promis son soutien, mais il serait plus impressionnant, bien que plus difficile, de gagner seuls…"
 iceland.3.a:0 "Combattre par nos propres moyens !"
 iceland.3.b:0 "Demander l’aide des Suédois"

 iceland.4.t:0 "L’Islande demande de l’aide"
 iceland.4.d:0 "Comme prévu, l’Islande nous demande du soutien contre les Danois — une occasion parfaite d’abattre le Danemark ! Nous pourrions aussi les laisser perdre du temps en Islande, mais une telle opportunité risque de ne pas se représenter…"
 iceland.4.a:0 "Qu’ils se débrouillent"
 iceland.4.b:0 "Combattre pour l’Islande !"

 iceland.5.t:0 "Les Suédois interviennent"
 iceland.5.d:0 "Les Suédois ont décidé de se battre à nos côtés et espèrent vaincre les Danois pour notre compte. Nos efforts n’ont pas été vains : cela en valait la peine."
 iceland.5.a:0 "La gloire et la souveraineté approchent !"

 iceland.7.t:0 "Le Danemark recule"
 iceland.7.d:0 "Le Danemark a accepté l’indépendance de l’Islande, affirmant simplement que si c’est le désir du peuple islandais, les Danois ne s’y opposeront pas. Toute l’Europe spécule sur la vraie raison, mais, quoi qu’il en soit, l’Islande est indépendante sans la moindre victime."
 iceland.7.a:0 "Inattendu"

 iceland.10.t:0 "Armer les Fjölnismenn"
 iceland.10.d:0 "Nous avons acheminé armes et officiers aux nationalistes islandais. Les Fjölnismenn, comme ils se nomment, ont accueilli notre aide avec enthousiasme et se préparent à la rébellion. Sommes-nous prêts à aller jusqu’au bout ?"
 iceland.10.a:0 "Oh que oui !"

 ### Idées
 SWE_monarchist_fervor:0 "Ferveur monarchiste"
 SWE_livgardet:0 "Livgardet"
 SWE_modern_caroleans_idea:0 "Caroliniens modernes"
 SWE_industrial_ramp_up:0 "Montée en puissance industrielle"
 SWE_industrial_ramp_up_decs:0 "Les heures supplémentaires imposées et l’augmentation des quotas font grimper la production, mais la volonté du peuple s’étiole en ces temps difficiles."

 ######################################################
 # Localisation communiste suédoise (Norrman)
 ######################################################

 #### Focus
 SWE_swedish_communism:0 "Communisme suédois"
 SWE_swedish_communism_desc:0 "Si nous voulons que notre nation survive au siècle prochain, nous devons infléchir notre cap politique. En influençant les ouvriers des villes et les paysans des villages, nous obtiendrons bientôt le poids nécessaire."
 SWE_unite_the_cells:0 "Unifier les cellules"
 SWE_unite_the_cells_desc:0 "Tandis que nous tissons des liens avec ouvriers et paysans, il nous faut relier les différentes cellules disséminées sur le territoire. Les unir en un parti unique nous permettra de rivaliser avec les formations établies."
 SWE_snap_election:0 "Élections anticipées"
 SWE_snap_election_desc:0 "Avec la majorité de la population de notre côté, nous pouvons forcer des élections anticipées — et, vu notre paysage politique, nous les gagnerons. Le roi n’approuvera peut-être pas, mais nous avons des plans pour lui."
 SWE_swedish_marxism:0 "Marxisme suédois"
 SWE_swedish_marxism_desc:0 "Notre nouveau gouvernement en place, nous devons entretenir de bonnes relations avec les Soviétiques à l’est, sous peine d’affronter leur colère. Avec ces liens renforcés, nous serons à l’abri des menaces de nos voisins."
 SWE_scandinavian_socialism:0 "Socialisme scandinave"
 SWE_scandinavian_socialism_desc:0 "Tout en consolidant notre emprise, rassurons l’Europe : nous ne sommes pas des expansionnistes oppressifs comme l’Union soviétique. Que nos voisins sachent que notre virage politique vise à nous protéger — eux compris."
 SWE_approach_soviets:0 "Se rapprocher des Soviétiques"
 SWE_approach_soviets_desc:0 "Nos relations avec les Soviétiques s’améliorent depuis des mois. En signant un traité de non-ingérence, nous pourrons prospérer."
 SWE_apply_the_nkvd_model:0 "Appliquer le modèle du NKVD"
 SWE_apply_the_nkvd_model_desc:0 ""
 SWE_establish_red_army:0 "Fonder notre Armée rouge"
 SWE_establish_red_army_desc:0 "Notre armée est faible. Pour ne pas rester en arrière face au réarmement européen, nous devons établir notre propre Armée rouge : en augmentant la conscription, nous recruterons davantage, quitte à ce qu’ils combattent d’abord moins efficacement — cela se corrigera."
 SWE_joint_research:0 "Recherche conjointe"
 SWE_joint_research_desc:0 "Nous avons tenté de rester dans la course, mais les Soviétiques nous devancent dans plusieurs domaines. Tirons parti de leur savoir — et enseignons-leur deux ou trois choses au passage."
 SWE_joint_tank_research:0 "Programme conjoint de chars"
 SWE_joint_tank_research_desc:0 "Apparu pendant la Grande Guerre, le char est un champ technologique à part entière. Avec les Soviétiques, rattrapons les grandes puissances pour ne pas être distancés."
 SWE_aviation_exercises:0 "Exercices aériens"
 SWE_aviation_exercises_desc:0 "Comme le char, le chasseur a fait ses preuves durant la Grande Guerre. Des exercices conjoints avec les Soviétiques ne peuvent que profiter à nos deux nations."
 SWE_factories_of_revolution:0 "Usines de la Révolution"
 SWE_factories_of_revolution_desc:0 "La guerre se profile ; il nous faut accroître nos capacités de production. Installer des usines d’armement supplémentaires en Laponie les gardera loin des mains ennemies, tout en forgeant les outils de la révolution."
 SWE_soviet_industrial_assistance:0 "Assistance industrielle [SOV.GetAdjective]"
 SWE_soviet_industrial_assistance_desc:0 "En une décennie, les Soviétiques se sont industrialisés à un rythme incroyable — une leçon dont nous pouvons nous inspirer."
 SWE_socialist_industry:0 "Industrie socialiste"
 SWE_socialist_industry_desc:0 "En adaptant certaines méthodes soviétiques, nous pourrons élargir notre base industrielle. Ce n’est pas l’industrialisation totale, mais un bon début."
 SWE_war_infrastructure:0 "Infrastructures de guerre"
 SWE_war_infrastructure_desc:0 "Pour propager la révolution, nos infrastructures doivent supporter les mouvements de nos armées. Le sud y pourvoit déjà ; le nord exige des investissements."
 SWE_the_aland_situation:0 "La question des Åland"
 SWE_the_aland_situation_desc:0 "Depuis la convention d’Åland, nous cherchons à les ramener dans notre giron. Mais les Soviétiques les convoitent aussi ; si nous pensons qu’Åland nous revient, nous pouvons utiliser la Finlande comme monnaie d’échange."
 SWE_pressure_finland:0 "Faire pression sur la Finlande"
 SWE_pressure_finland_desc:0 "Nos exigences prêtes, présentons-les au gouvernement finlandais. Il devrait saisir la position délicate qui est la sienne et, si nous n’anticipons pas forcément la guerre, nous ne devons pas l’exclure."
 SWE_close_the_straits:0 "Fermer les détroits"
 SWE_close_the_straits_desc:0 "Les Belts danois sont vitaux : qui les contrôle contrôle la Baltique. Assurons-nous d’en avoir la maîtrise pour prévenir tout débarquement ennemi."
 SWE_turn_the_baltic_red:0 "Rougir la Baltique"
 SWE_turn_the_baltic_red_desc:0 "Les États baltes appartenaient à l’Empire russe — avant cela, nous les avons tenus. Sécuriser le littoral balte facilitera notre contrôle de la mer Baltique."
 SWE_improve_red_army:0 "Améliorer l’Armée rouge"
 SWE_improve_red_army_desc:0 "Nos frontières immédiates sécurisées, améliorons notre armée. Nous avons beaucoup appris et sommes mieux placés qu’auparavant."
 SWE_forced_abdication:0 "Abdication forcée"
 SWE_forced_abdication_desc:0 "Notre nouveau gouvernement en place, le roi se révèle gênant et nuit activement à nos affaires politiques. Il doit partir."
 SWE_finish_finland:0 "En finir avec la Finlande"
 SWE_finish_finland_desc:0 "La Finlande étant en piteux état après nos exigences, nous devons veiller à ce que ses travailleurs soient bien protégés. Pour prévenir toute agression de l’armée finlandaise contre la population civile, nous interviendrons et les guiderons désormais."
 SWE_nordic_collaboration:0 "Collaboration nordique"
 SWE_nordic_collaboration_desc:0 "Nous devons prouver à nos voisins et futurs alliés que notre modèle de socialisme n’a rien à voir avec la vile oppression qui sévit à l’Est."
 SWE_stockholm_internationale:0 "L’Internationale de Stockholm"
 SWE_stockholm_internationale_desc:0 "Pour montrer au monde que nous sommes sérieux dans notre opposition à [SOV.GetNameDef], nous fonderons notre propre faction."
 SWE_strength_in_union:0 "La force dans l’union"
 SWE_strength_in_union_desc:0 "Pour devenir un véritable rempart contre l’Est, nous devons pousser notre coopération plus loin. En unissant nos pays en une seule glorieuse union, nous pourrons tenir tête aux Russes et à leurs pions."
 SWE_alliance_with_finland:0 "Alliance avec la Finlande"
 SWE_alliance_with_finland_desc:0 "Nous avons autrefois régné sur la Finlande. Elle est ensuite devenue sujette des Russes avant d’obtenir son indépendance. Rassurons-la : nous ne cherchons pas à la dominer de nouveau, mais à assurer sa sécurité — et nous avons besoin de son aide pour nous protéger de ce qu’a engendré la Révolution russe."
 SWE_secure_baltic_sea:0 "Sécuriser la mer Baltique"
 SWE_secure_baltic_sea_desc:0 "En tirant parti des évolutions de la guerre navale, nous pourrons sécuriser la Baltique contre quiconque tenterait de la traverser. Les Finlandais ont déjà entamé des recherches sur les mines navales ; nous pourrions apprendre d’eux."
 SWE_influence_baltics:0 "Influencer les pays baltes"
 SWE_influence_baltics_desc:0 "À la chute de l’Empire russe, les États baltes sont devenus indépendants. Leur liberté est à nouveau menacée par l’ours russe. Avec leur aide et leur connaissance intime du terrain russe, nous deviendrons un rempart encore plus puissant contre la menace moscovite."
 SWE_influence_our_neighbours:0 "Influencer nos voisins"
 SWE_influence_our_neighbours_desc:0 "Les pays scandinaves ont longtemps été des amis proches malgré nos guerres passées. On parle de querelles entre frères ; il nous faut maintenant les convaincre de se joindre à nous pour repousser celui qui menace la famille scandinave."
 SWE_joint_jaeger_training:0 "Entraînement conjoint de jägers"
 SWE_joint_jaeger_training_desc:0 "Comme la Suède, les pays baltes sont couverts de forêts épaisses ; des entraînements conjoints avec eux profiteront autant à eux qu’à nous."
 SWE_scandinavian_ranger_training:0 "Entraînement des rangers scandinaves"
 SWE_scandinavian_ranger_training_desc:0 "Nos nations abritent d’immenses forêts, des montagnes imposantes et de nombreux fjords. Pour tenir face à nos futurs ennemis, nous devons apprendre à manœuvrer et combattre au mieux dans ces terrains."
 SWE_break_the_sickle:0 "Briser la faucille"
 SWE_break_the_sickle_desc:0 "Toutes les préparations étant achevées, nous sommes prêts à porter le fer aux Russes. Que notre victoire soit rapide et que la justice suive notre sillage."
 SWE_tackle_fascism:0 "S’attaquer au fascisme"
 SWE_tackle_fascism_desc:0 " "
 SWE_invite_the_polish:0 "Inviter les Polonais"
 SWE_invite_the_polish_desc:0 " "
 SWE_rallying_the_workers:0 "Rallier les travailleurs"
 SWE_rallying_the_workers_desc:0 "Notre gouvernement désormais assuré, nous devons préparer le pays à une guerre potentielle. En diffusant de la propagande et en mobilisant les travailleurs contre nos ennemis possibles, nous préparerons la population à ce qui pourrait venir, même si cela implique une baisse temporaire de l’efficacité ouvrière."
 SWE_workers_war_economy:0 "Économie de guerre des travailleurs"
 SWE_workers_war_economy_desc:0 "Un adage dit : « Si tu veux la paix, prépare la guerre. » Nous sommes au bord d’un nouveau grand conflit ; nous devons nous y préparer."
 SWE_clip_the_wings:0 "Couper les ailes"
 SWE_clip_the_wings_desc:0 "Nos préparatifs achevés, nous sommes prêts à porter le premier coup. Nous veillerons à ce que l’Allemagne ne jette pas le monde dans le chaos ni ne cause d’innombrables destructions. Même s’il faut, en chemin, sacrifier quelques vies : le peu doit se sacrifier pour le plus grand nombre."
 SWE_learn_from_the_baltics:0 "Apprendre des Baltes"
 SWE_learn_from_the_baltics_desc:0 "Malgré leur indépendance récente, les États baltes possèdent un immense savoir dans divers domaines dont nous pourrions grandement bénéficier. En concluant un accord, nous pourrions tirer parti de leurs spécialités."
 SWE_estonian_oil_industry:0 "Industrie pétrolière estonienne"
 SWE_estonian_oil_industry_desc:0 "On ne pense pas spontanément à l’Estonie parmi les nations productrices de pétrole. Pourtant, des gisements ont été trouvés à Kohtla-Järve. Envoyons des chercheurs apprendre auprès des Estoniens et tirer parti de leur savoir."
 SWE_latvian_bomber_sights:0 "Viseurs de bombardiers lettons"
 SWE_latvian_bomber_sights_desc:0 "Les Lettons semblent avoir découvert un moyen d’améliorer les viseurs de bombardement, avec un potentiel supérieur même aux britanniques. En les aidant dans leurs recherches, nous pourrions améliorer nos propres conceptions."
 SWE_lithuanian_agrarian_industry:0 "Industrie agraire lituanienne"
 SWE_lithuanian_agrarian_industry_desc:0 "Sous l’Empire russe, les Lituaniens disposaient de vastes champs qui approvisionnaient la Russie en blé. Si l’« grenier de l’Europe » fut l’Ukraine, les Lituaniens possèdent eux aussi un savoir impressionnant dans ce domaine."
 SWE_rally_worker_unions:0 "Mobiliser les syndicats"
 SWE_rally_worker_unions_desc:0 "Certains se disent communistes mais préfèrent prier pour un changement pacifique où le gouvernement en place renoncerait soudainement au pouvoir. Nous savons, nous, que le changement se force. Nous rassemblerons les travailleurs et les préparerons à la lutte qui vient !"
 SWE_launch_red_coup:0 "Lancer le coup rouge"
 SWE_launch_red_coup_desc:0 "Tout le monde n’est pas prêt, mais il faut saisir l’occasion. En s’emparant de Stockholm, nous pourrons propager la Révolution vers le sud comme vers le nord ! La Révolution commence maintenant !"
 SWE_fortification_studies:0 "Études de fortification"
 SWE_fortification_studies_desc:0 " "
 SWE_norge_linjen:0 "Norgelinjen"
 SWE_norge_linjen_desc:0 "Pour garantir la souveraineté de notre nation, nous devons préparer nos frontières. Après l’est, il faut désormais sécuriser celle de l’ouest."
 SWE_baltic_wall:0 "Mur baltique"
 SWE_baltic_wall_desc:0 "La Suède possède un long littoral qu’il sera difficile de défendre dans son intégralité. En fortifiant les points clés, nous protégerons nos villes les plus importantes et pourrons y établir des bases pour nos propres assauts navals."
