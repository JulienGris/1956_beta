### Focuses
 SWE_swedish_internal_policy:0 "Politique intérieure suédoise"
 SWE_swedish_internal_policy_desc:0 "La période précédant l’élection est tendue chez nous comme en Europe. Avant de regarder au dehors, regardons en nous."
 SWE_hansson_iii_cabinet:0 "Troisième cabinet Hansson"
 SWE_hansson_iii_cabinet_desc:0 "Ce sera le troisième cabinet d’Hansson, Premier ministre populaire qui a guidé la nation après la Grande Dépression."
 SWE_gosta_bagge_i_cabinet:0 "Premier cabinet Gösta Bagge"
 SWE_gosta_bagge_i_cabinet_desc:0 "Adversaire en vue de Per Albin Hansson et des sociaux-démocrates, Gösta Bagge forme son premier cabinet. Puisse-t-il bien diriger la nation."
 SWE_the_red_menace:0 "La menace rouge"
 SWE_the_red_menace_desc:0 "La menace communiste grandit. En affichant publiquement notre opposition à leurs méthodes révolutionnaires, nous pourrions être vus comme un allié potentiel contre ce danger."
 SWE_not_a_european_abyssinia:0 "Pas une Abyssinie européenne"
 SWE_not_a_european_abyssinia_desc:0 "L’invasion italienne de l’Abyssinie ne doit jamais se reproduire en Suède. C’est l’un des points qui ont mené à la victoire de Gösta Bagge ; en augmentant le budget militaire, nous éviterons ce destin."
 SWE_swedish_foreign_policy:0 "Politique étrangère suédoise"
 SWE_swedish_foreign_policy_desc:0 "À l’issue de la Grande Guerre, nous avons réaffirmé notre neutralité. Mais les temps changent : reconsidérons notre politique extérieure et ce que signifie être neutre."
 SWE_scandinavian_collaboration:0 "Collaboration scandinave"
 SWE_scandinavian_collaboration_desc:0 "Malgré des désaccords passés, un sentiment de fraternité unit les pays scandinaves. En tendant la main à nos voisins, nous préserverons cette fraternité face à l’orage qui gronde."
 SWE_fight_unemployment:0 "Lutter contre le chômage"
 SWE_fight_unemployment_desc:0 "Si la §RGrande Dépression§! nous a moins touchés que d’autres, ses effets se sont fait sentir. Grâce à des investissements et subventions ciblés, nous aiderons les régions en difficulté."
 SWE_export_based_economy:0 "Économie fondée sur l’exportation"
 SWE_export_based_economy_desc:0 "Notre économie repose largement sur l’exportation, qu’il s’agisse des Allemands au sud ou d’autres clients pour notre minerai de fer. Profitons-en tant que possible."
 SWE_skanelinjen:0 "Skånelinjen"
 SWE_skanelinjen_desc:0 "Les Danois ne sont peut-être pas la plus grande menace, mais ils contrôlent l’un des rares axes terrestres depuis l’Europe centrale vers la Suède. En améliorant la Skånelinjen, nous pourrons, espérons-le, repousser toute invasion depuis le Danemark."
 SWE_the_saltsjobaden_agreement:0 "Accord de Saltsjöbaden"
 SWE_the_saltsjobaden_agreement_desc:0 "L’esprit du Folkhemmet est notre idéal, mais la réalité diffère.\n\nUn accord entre syndicats et employeurs nous rapprochera de notre objectif."
 SWE_prepare_defensive_militias:0 "Préparer des milices défensives"
 SWE_prepare_defensive_militias_desc:0 "Officiellement neutres, nous devons tout de même nous préparer au pire. Accroître la conscription pourrait être vu comme agressif ; préparons plutôt des milices bien équipées pour défendre leur foyer."
 SWE_state_of_selective_neutrality:0 "Neutralité sélective"
 SWE_state_of_selective_neutrality_desc:0 "En proclamant une neutralité armée, nous affirmons ne vouloir combattre pour aucun camp, mais être prêts à lutter bec et ongles si nous sommes attaqués. Espérons que cela ne sera pas nécessaire."
 SWE_the_frivilligkaren_divisions:0 "Divisions de la Frivilligkåren"
 SWE_the_frivilligkaren_divisions_desc:0 "Après les capitulations, nous avons accueilli des réfugiés encore prêts à se battre. Avec leur aide, nous pourrions soutenir des résistances en territoires occupés tout en conservant notre neutralité officielle."
 SWE_military_access_for_ensured_safety:0 "Accès militaire contre sécurité garantie"
 SWE_military_access_for_ensured_safety_desc:0 "L’Allemagne mène la guerre sur le continent et pourrait chercher à s’assurer nos ressources — et notre position stratégique en Baltique. En lui offrant le passage de troupes, nous éviterons peut-être l’anéantissement."
 SWE_gmaskinen:0 "G-Maskinen"
 SWE_gmaskinen_desc:0 "Avec la guerre et notre neutralité, l’Allemagne demande l’usage de notre réseau de communications. Bien que chiffrées, ces transmissions pourraient être décryptées par §YArne Beurling§!, fournissant des renseignements vitaux aux bonnes personnes."
 SWE_operation_radda_danmark:0 "Opération Rädda Danmark"
 SWE_operation_radda_danmark_desc:0 "Le peuple danois souffre trop longtemps sous l’occupation allemande. Alors que la marée tourne contre les §YAllemands§!, il est de notre devoir d’aider nos frères du sud."
 SWE_the_finlands_sak_ar_var_recruitment_drive:0 "Campagne « Finlands sak är vår »"
 SWE_the_finlands_sak_ar_var_recruitment_drive_desc:0 "Ce que nous redoutions est arrivé : l’Union soviétique s’en prend à la Finlande. L’élan pour combattre à ses côtés grandit et le slogan « Finlands sak är vår ! » remporte un immense succès. Nous ne retiendrons pas ceux qui veulent défendre la souveraineté de nos frères finlandais."
 SWE_intervention_in_the_winter_war:0 "Intervenir dans la Guerre d’Hiver"
 SWE_intervention_in_the_winter_war_desc:0 "Nous ne pouvons rester inactifs tandis que les Finlandais saignent face à l’ours russe. Nos forces sont prêtes à rejoindre officiellement les combats.\n\nFinlands sak är vår !"
 SWE_operation_stella_polaris:0 "Opération Stella Polaris"
 SWE_operation_stella_polaris_desc:0 "Les Finlandais disposent de renseignements de grande qualité sur les Russes. En offrant un emploi à leurs décrypteurs en Suède, ils poursuivront leur travail sans craindre la capture."
 SWE_neutral_no_more:0 "La neutralité, c’est fini"
 SWE_neutral_no_more_desc:0 "La Suède ne peut plus rester spectatrice pendant que l’autoritarisme piétine les libertés. Pour la Suède et l’avenir de l’humanité, nous abandonnons notre neutralité et, avec les démocraties d’Europe, nous repousserons le fascisme."
 SWE_denounce_fascist_aggression_europe:0 "Dénoncer l’agression fasciste en Europe"
 SWE_denounce_fascist_aggression_europe_desc:0 "Le cancer du fascisme s’est trop longtemps propagé. Il est temps d’affirmer notre position : nos ressources ne nourriront plus ses machines de guerre !"
 SWE_gunther_molotov_agreement:0 "Accord Günther–Molotov"
 SWE_gunther_molotov_agreement_desc:0 " "
 SWE_baltic_sea_hegemony:0 "Hégémonie en mer Baltique"
 SWE_baltic_sea_hegemony_desc:0 " "

### Decisions + Categories
 SWE_defensive_militias_category:0 "Préparer des milices défensives"
 SWE_defensive_militias_category_desc:0 "La guerre se profile : prenons des mesures pour être prêts à défendre le pays."
 SWE_prepare_militias:0 "Préparer des milices"
 SWE_raise_militia:0 "Lever des milices"
 SWE_the_swedish_german_trade_situation_category:0 "Situation commerciale suédo-germanique"
 SWE_the_swedish_german_trade_situation_category_desc:0 "Nous avons signé le traité commercial suédo-allemand il y a quelques années. Avec la montée des tensions, réexaminons-le :\n\nFaut-il poursuivre, viser l’autosuffisance ou accroître nos échanges avec l’Allemagne ?"
 SWE_find_other_trade_partners:0 "Trouver d’autres partenaires commerciaux"
 SWE_halt_german_trade:0 "Suspendre le commerce avec l’Allemagne"
 SWE_expand_german_trade_influence:0 "Accroître l’influence commerciale allemande"
 SWE_rely_on_germany_for_trade:0 "S’appuyer sur l’Allemagne pour le commerce"
 SWE_reestablish_trade_with_germany:0 "Rétablir le commerce avec l’Allemagne"
 SWE_the_winter_war_category:0 "La Guerre d’Hiver"
 SWE_the_winter_war_category_desc:0 "L’Union soviétique a tourné son regard vers nos frères finlandais. Bien que neutres, certains souhaitent combattre pour la Finlande.\n\nNe les en empêchons pas et tâchons d’acheminer du matériel pour aider à repousser la menace rouge."
 SWE_nationalist_military_garrisons_category:0 "Garnisons militaires nationalistes"
 SWE_crackdown_on_nationalism_in_the_army:0 "Réprimer le nationalisme dans l’armée"

 SWE_empower_nationalist_garrisons:0 "Renforcer les garnisons nationalistes"
 SWE_aid_finland_in_their_fight:0 "Aider la Finlande dans son combat"
 SWE_send_guns_to_finland:0 "Envoyer des fusils à la Finlande"
 SWE_send_artillery_to_finland:0 "Envoyer de l’artillerie à la Finlande"
 SWE_nordic_resistance_fighters_category:0 "Combattants de la résistance nordique"
 SWE_fund_norwegian_resistance_fighters:0 "Financer la résistance norvégienne"
 SWE_fund_danish_resistance_fighters:0 "Financer la résistance danoise"
 SWE_support_equipment_to_the_norwegian_resistance:0 "Équipement de soutien pour la résistance norvégienne"
 SWE_support_equipment_to_the_danish_resistance:0 "Équipement de soutien pour la résistance danoise"
 SWE_heavy_guns_to_the_norwegian_resistance:0 "Armes lourdes pour la résistance norvégienne"
 SWE_heavy_guns_to_the_danish_resistance:0 "Armes lourdes pour la résistance danoise"
 SWE_fighting_unemployment_category:0 "Lutte contre le chômage"
 SWE_fighting_unemployment_category_desc:0 "Dans le sillage de la Grande Dépression, le chômage a augmenté parmi la population civile. En subventionnant des secteurs précis de la main-d’œuvre, nous pouvons garantir que nos usines continuent de produire les biens dont notre pays a besoin."
 SWE_factory_subsidies:0 "Subventions aux usines"
 SWE_dockyard_subsidies:0 "Subventions aux chantiers navals"
 SWE_integrate_aland:0 "Intégrer Åland"
 SWE_find_an_alliance_category:0 "Trouver une alliance"
 SWE_find_an_alliance_category_desc:0 "Tandis que le monde est en tumulte, certains restent fidèles aux vraies valeurs de la démocratie. Tissons des liens avec eux pour former une alliance : ensemble nous défendrons la liberté et ferons front face au fascisme."
 SWE_join_demo_from_factionname:0 "Rejoindre [FROM.getFactionName]"
 SWE_join_demo_from_factionname_tt:0 "Débloque des §Hdécisions§! pour §Hrejoindre§! diverses factions §Ydémocrates§! en §YEurope§!"
 SWE_reintegrate_the_empire_category:0 "Réintégrer l’Empire"
 SWE_reintegrate_state_into_empire:0 "Réintégrer [FROM.GetName]."
 SWE_integrate_southern_norway:0 "Intégrer la §YNorvège méridionale§!"
 SWE_integrate_northern_norway:0 "Intégrer la §YNorvège septentrionale§!"
 SWE_integrate_sjaelland_and_fyn:0 "Intégrer §YSjælland§! et §YFionie§!"
 SWE_integrate_jutland:0 "Intégrer le §YJutland§!"
 SWE_integrate_schleswig:0 "Intégrer le §YSchleswig§!"
 SWE_integrate_northern_finland:0 "Intégrer la §YFinlande du Nord§!"
 SWE_integrate_southern_finland:0 "Intégrer la §YFinlande du Sud§!"
 SWE_integrate_northern_estonia:0 "Intégrer le §YNord de l’Estonie§!"
 SWE_integrate_russian_territories:0 "Intégrer les §Yterritoires russes§!"
 SWE_integrate_german_territories:0 "Intégrer les §Yterritoires allemands§!"
 SWE_reestablish_the_livonian_protectorate:0 "Rétablir le protectorat de Livonie"
 SWE_cede_kurzeme_to_livonia:0 "Céder §Y[190.GetName]§! à §Y[EST.GetNameDefCap]§!"
