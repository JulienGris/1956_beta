 SCO_generic_army_chief_off:0 "Roy Urquhart"
 SCO_generic_army_chief_def:0 "Kenneth Loch"
 SCO_generic_air_close_air_sup:0 "Norman Macmillan"
 SCO_generic_navy_chief_decisive_bat:0 "William Scott Chalmers"

 SCO_cavalry:0 "Cavalerie [ROOT.getAdjective]"
 SCO_home_guard:0 "Infanterie [ROOT.getAdjective]"

 SCO_idea_designers_innovations:0 "Innovations des concepteurs"
 SCO_idea_shipbuilding_contacts:0 "Contacts dans la construction navale"
 SCO_idea_national_admiralty:0 "Amirauté nationale"

 SCO_generic_industrial_concern:0 "David Colville & Sons"
 SCO_generic_electronics_concern:0 "Ferranti"
 SCO_parson_peebles_engineering_works:0 "Parsons Peebles Engineering Works"
 SCO_alexander_stephen_and_sons:0 "Alexander Stephen and Sons"
 SCO_generic_naval_aircraft_manufacturer:0 "William Beardmore and Company"
 SCO_generic_medium_aircraft_manufacturer:0 "Scottish Aviation"
 SCO_generic_heavy_aircraft_manufacturer:0 "William Beardmore and Company"
 SCO_rof_dalmuir:0 "ROF Dalmuir"
 SCO_edingham_munitions_factory:0 "Edingham Munitions Factory"
 SCO_albion_motors:0 "Albion Motors"
 SCO_north_british_locomotive_company:0 "North British Locomotive Company"

 SCO_generic_infantry_equipment_organization:0 "Edingham Munitions Factory"
 SCO_generic_artillery_organization:0 "ROF Dalmuir"
 SCO_generic_motorized_mechanized_organization:0 "Albion Motors"

 SCO_king_douglas:0 "Douglas Ier"
 SCO_king_henry:0 "Henry Ier"
 SCO_king_rupprecht:0 "Rupprecht Ier"
 SCO_parliamentarianism:0 "Parlementarisme"
 SCO_womens_army_service:0 "Service féminin de l’armée"
 SCO_absence_of_the_stone_of_scone:0 "Absence de la Pierre du Destin"
 SCO_absence_of_the_stone_of_scone_desc:0 "La Pierre du Destin, dite Pierre de Scone, selon son lieu d’origine, a servi pour le couronnement des rois des Écossais jusqu’à ce qu’Édouard Ier d’Angleterre la prenne et fasse bâtir un trône pour la garder sous son postérieur velu. Son absence réduit la légitimité de nos monarques et pourrait laisser entendre que nous devrions de nouveau être sous le joug anglais, ce qui serait absurde."
 SCO_cunning_plans:0 "Plans machiavéliques"

 SCO_establish_the_army:0 "Établir l’armée"
 SCO_establish_the_army_desc:0 "Avec notre nouveau statut politique, il est temps d’organiser nos propres unités, sur la base des anciens régiments britanniques."
 SCO_industrial_modernization:0 "Modernisation industrielle"
 SCO_industrial_modernization_desc:0 "[ROOT.GetNonIdeologyName] doit conserver son statut de pays industriel moderne afin d’affirmer sa place dans le monde."
 SCO_dingham_ammunition_factory:0 "Usine de munitions de Dingham"
 SCO_dingham_ammunition_factory_desc:0 "Pour approvisionner nos troupes, une usine de munitions doit être établie à Dingham."
 SCO_redesign_small_arms:0 "Reconcevoir les armes légères"
 SCO_redesign_small_arms_desc:0 "Pour garantir l’efficacité de notre infanterie, les armes individuelles doivent être constamment améliorées."
 SCO_motorization_plan:0 "Plan de motorisation"
 SCO_motorization_plan_desc:0 "L’exploitation rapide d’une percée peut dissoudre un front. C’est ce qui a manqué durant la Grande Guerre."
 SCO_convert_north_british_locomotive_factory:0 "L’usine North British Locomotive"
 SCO_convert_north_british_locomotive_factory_desc:0 "Cette usine de locomotives peut être reconvertie pour produire des véhicules blindés."
 SCO_dalmuir_shells:0 "Obus de Dalmuir"
 SCO_dalmuir_shells_desc:0 "Notre artillerie sera approvisionnée en obus produits à Dalmuir."
 SCO_artillery_modernization:0 "Modernisation de l’artillerie"
 SCO_artillery_modernization_desc:0 "L’artillerie tue, l’infanterie occupe."
 SCO_new_tactics:0 "Nouvelles tactiques"
 SCO_new_tactics_desc:0 "Si les charges frontales des Highlanders fonctionnaient autrefois, la Grande Guerre a signé leur déclin. Seul un fou partirait aujourd’hui au combat avec une claymore et un arc."
 SCO_planning_staff:0 "État-major de planification"
 SCO_planning_staff_desc:0 "Un plan préparé est probablement un meilleur plan."
 SCO_expand_the_construction_sector:0 "Étendre le secteur du bâtiment"
 SCO_expand_the_construction_sector_desc:0 "Construire une meilleure nation exige de solides capacités de construction."
 SCO_northern_mining:0 "Mines du Nord"
 SCO_northern_mining_desc:0 "Le sous-sol des Highlands recèle de grandes richesses à exploiter en ces temps difficiles."
 SCO_support_steel_sector:0 "Soutenir la sidérurgie"
 SCO_support_steel_sector_desc:0 "De l’acier ! De l’acier pour les canons, pour les chars, pour les navires — pour toutes les armes de la guerre !"
 SCO_support_light_industry:0 "Soutenir l’industrie légère"
 SCO_support_light_industry_desc:0 "L’industrie légère est essentielle pour équilibrer sainement notre économie."
 SCO_ferranti_instruments:0 "Instruments Ferranti"
 SCO_ferranti_instruments_desc:0 "Ce fabricant d’équipements électroniques pourrait être essentiel si nous lui accordons des subventions de recherche."
 SCO_connect_extraction_and_production_areas:0 "Relier extraction et production"
 SCO_connect_extraction_and_production_areas_desc:0 "Des mines au milieu des Highlands ne servent à rien sans un bon réseau d’infrastructures."
 SCO_industrial_research:0 "Recherche industrielle"
 SCO_industrial_research_desc:0 "Nous devons améliorer notre industrie."
 SCO_develop_aluminium_industry:0 "Traiter le minerai d’aluminium"
 SCO_develop_aluminium_industry_desc:0 "Un minerai d’aluminium non traité est inutile à l’effort de guerre."
 SCO_develop_the_shale_oil_sector:0 "Développer le schiste bitumineux"
 SCO_develop_the_shale_oil_sector_desc:0 "Le pétrole de schiste écossais, bien que difficile à extraire, est essentiel pour assurer notre autosuffisance."
 SCO_substitution_technologies:0 "Technologies de substitution"
 SCO_substitution_technologies_desc:0 "Les importations pouvant être menacées par la guerre, des technologies de substitution comme la liquéfaction du charbon doivent être envisagées."
 SCO_establish_special_forces:0 "Créer des forces spéciales"
 SCO_establish_special_forces_desc:0 "Les plus braves — ou les plus fous — seront sélectionnés pour former des unités d’élite capables d’éliminer l’ennemi en silence, à l’arc si nécessaire."
 SCO_highlander_spirit:0 "Esprit des Highlanders"
 SCO_highlander_spirit_desc:0 "Si leur équipement est dépassé, les Highlanders peuvent encore servir d’exemple de courage au combat."
 SCO_modern_logistics:0 "Logistique moderne"
 SCO_modern_logistics_desc:0 "Sans ravitaillement, une armée ne peut combattre. La logistique moderne est donc vitale."
 SCO_signal_companies:0 "Compagnies de transmissions"
 SCO_signal_companies_desc:0 "Communications, communications, communications."
 SCO_field_hospitals:0 "Hôpitaux de campagne"
 SCO_field_hospitals_desc:0 "Un soldat soigné peut encore servir la société. Un mort, non."
 SCO_mechanization_effort:0 "Mécanisation"
 SCO_mechanization_effort_desc:0 "Un compromis entre un char et un camion peut mener nos troupes rapidement et efficacement au combat."

 SCO_scottish_aviation_air_academy:0 "Académie aérienne de Scottish Aviation"
 SCO_scottish_aviation_air_academy_desc:0 "Scottish Aviation doit être le point de départ de notre infrastructure aérienne."
 SCO_build_trainer_aircrafts:0 "Construire des avions-écoles"
 SCO_build_trainer_aircrafts_desc:0 "Avant de concevoir un véritable chasseur, il serait sans doute plus sage de commencer par un prototype d’entraînement."
 SCO_bimotor_aircrafts:0 "Avions bimoteurs"
 SCO_bimotor_aircrafts_desc:0 "Les appareils massifs sont l’avenir. N’a-t-on pas dit que le bombardier passerait toujours ?"
 SCO_train_pilots:0 "Former les pilotes"
 SCO_train_pilots_desc:0 "Sans pilotes, comment espérer une force aérienne opérationnelle ?"
 SCO_train_mechanics:0 "Former les mécaniciens"
 SCO_train_mechanics_desc:0 "Sans mécaniciens, comment espérer une force aérienne opérationnelle ?"
 SCO_support_designers_innovations:0 "Soutenir les innovations des concepteurs"
 SCO_support_designers_innovations_desc:0 "Des prototypes expérimentaux peuvent parfois mener à des améliorations remarquables."
 SCO_naval_aviation:0 "Aviation navale"
 SCO_naval_aviation_desc:0 "À l’ère des porte-avions, des avions adaptés à la guerre navale deviennent indispensables."
 SCO_refine_air_doctrine:0 "Affiner la doctrine aérienne"
 SCO_refine_air_doctrine_desc:0 "L’expérience nous donne une meilleure compréhension de la guerre aérienne."
 SCO_radar_network:0 "Réseau radar"
 SCO_radar_network_desc:0 "Détecter l’ennemi tôt nous permet de traiter la menace beaucoup plus efficacement."

 SCO_the_shipyard_of_the_world:0 "Le chantier naval du monde"
 SCO_the_shipyard_of_the_world_desc:0 "Avec ses immenses chantiers capables de construire des navires marchands et de guerre pour le monde entier, l’Écosse est véritablement le chantier naval du monde."
 SCO_shipbuilding_contacts:0 "Contacts de la construction navale"
 SCO_shipbuilding_contacts_desc:0 "Le soutien des chantiers est essentiel si nous voulons contribuer à l’effort de guerre."
 SCO_national_admiralty:0 "Amirauté nationale"
 SCO_national_admiralty_desc:0 "Notre marine a besoin d’un équivalent de notre état-major."
 SCO_the_fleet_of_old:0 "La flotte d’antan"
 SCO_the_fleet_of_old_desc:0 "Les cuirassés seront le cœur de notre marine."
 SCO_battleship_focus:0 "Priorité aux cuirassés"
 SCO_battleship_focus_desc:0 "De gros canons pour de gros navires : quatre tourelles triples, deux à l’avant et deux à l’arrière."
 SCO_the_biggest_battleship:0 "Le plus grand cuirassé"
 SCO_the_biggest_battleship_desc:0 "Pourquoi imiter les cuirassés des autres puissances si nous pouvons en construire un encore plus grand ?"
 SCO_the_blocade_doctrine:0 "Doctrine du blocus"
 SCO_the_blocade_doctrine_desc:0 "Si nous coulons suffisamment de convois ennemis, nous paralyserons leur économie."
 SCO_silent_service:0 "Service silencieux"
 SCO_silent_service_desc:0 "Des sous-marins modernes sont nécessaires à la réussite du plan."
 SCO_stealth_upgrades:0 "Améliorations de furtivité"
 SCO_stealth_upgrades_desc:0 "Des sous-marins plus discrets seront plus efficaces pour approcher des convois ennemis sans défense."
 SCO_carrier_strikes:0 "Frappes embarquées"
 SCO_naval_air_groups:0 "Groupes d’aviation navale"
 SCO_lessons_for_the_air_force:0 "Leçons pour l’armée de l’air"
 SCO_cruiser_focus:0 "Croiseurs modernes"

 SCO_destroyer_focus:0 "Destroyers modernes"
 SCO_increase_naval_production:0 "Accroître la production navale"
 SCO_a_s_warfare:0 "Guerre ASM"
 SCO_naval_mine_warfare:0 "Guerre des mines navales"

 SCO_provisional_government:0 "Le gouvernement provisoire"
 SCO_provisional_government_desc:0 "Le gouvernement provisoire"
 SCO_favour_republicanism:0 "Favoriser le républicanisme"
 SCO_favour_republicanism_desc:0 "Favoriser le républicanisme"
 SCO_scottish_democratic_fascist_party:0 "Parti fasciste démocratique écossais"
 SCO_scottish_democratic_fascist_party_desc:0 "Le Parti fasciste démocratique écossais prétend être le véritable représentant de la volonté populaire et donc l’unique voie vers la souveraineté populaire, puisqu’il ne divise pas la société en classes."
 SCO_perfect_the_propaganda:0 "Parfaire la propagande"
 SCO_perfect_the_propaganda_desc:0 "Les affiliations successives du chef du parti pourraient faire croire au public qu’il n’est qu’un opportuniste. Or, le projet du parti n’a rien de tel : une campagne médiatique bien conçue rassurera la population."
 SCO_scottish_corporate_commonwealth:0 "Commonwealth corporatif écossais"
 SCO_scottish_corporate_commonwealth_desc:0 "Grâce à la dénonciation fasciste du capitalisme comme de la lutte des classes, nous pouvons organiser la main-d’œuvre par professions au sein de structures contrôlées par l’État."
 SCO_reject_catholicism:0 "Rejeter le catholicisme"
 SCO_reject_catholicism_desc:0 "L’État doit rejeter les corruptions papistes irlandaises."
 SCO_implement_the_total_war_theory:0 "Appliquer la théorie de la guerre totale"
 SCO_implement_the_total_war_theory_desc:0 "Inventée à l’origine en Allemagne, la théorie de la guerre totale soumet l’économie entière aux objectifs militaires de l’État. Si nous voulons peser dans le monde, suivons cet exemple."
 SCO_propagate_the_importance_of_struggle:0 "Propager l’importance de la lutte"
 SCO_propagate_the_importance_of_struggle_desc:0 "Le concept de lutte est un élément central du fascisme ; notre compréhension de celui-ci assurera notre supériorité."
 SCO_join_the_axis:0 "Rejoindre l’Axe"
 SCO_join_the_axis_desc:0 "Nous avons besoin d’alliés puissants."
 SCO_Forced_Conscription:0 "Conscription forcée"
 SCO_Forced_Conscription_desc:0 "Seule la mobilisation de tous nos hommes garantira la victoire."
 SCO_forge_our_own_path:0 "Forger notre propre voie"
 SCO_forge_our_own_path_desc:0 "Nous devons créer notre propre alliance si nous voulons surmonter l’épreuve actuelle et garantir notre avenir."
 SCO_militarized_police:0 "Police militarisée"
 SCO_militarized_police_desc:0 "Des forces de police et paramilitaires adaptées sont nécessaires pour protéger l’État."
 SCO_celtic_liberation:0 "Libération celtique"
 SCO_celtic_liberation_desc:0 "L’unification du monde celtique nous attend !"
 SCO_push_for_brittany:0 "Pousser vers la Bretagne"
 SCO_push_for_brittany_desc:0 " "
 SCO_the_scottish_workers_republican_party:0 "Parti républicain des travailleurs écossais"
 SCO_the_scottish_workers_republican_party_desc:0 "Le parti portait une ligne unique, prônant à la fois l’indépendance écossaise et le marxisme. À présent que l’indépendance est acquise, force est de constater que cette voie était la bonne."
 SCO_political_batallions:0 "Bataillons politiques"
 SCO_political_batallions_desc:0 "Des unités formées de militants loyaux offriront une fiabilité politique absolue et une forte motivation."
 SCO_political_commissars:0 "Commissaires politiques"
 SCO_political_commissars_desc:0 "Les membres les plus dévoués des bataillons politiques peuvent être promus commissaires politiques, chacun veillant à la loyauté d’une unité."
 SCO_red_army:0 "Notre propre Armée rouge"
 SCO_red_army_desc:0 "Il est temps d’avoir notre propre Armée rouge, prête à défendre les idéaux de la révolution, chez nous comme à l’étranger."
 SCO_revolutionary_guards:0 "Gardes révolutionnaires"
 SCO_revolutionary_guards_desc:0 "Des spécialistes de la contre-révolution doivent protéger notre révolution et assurer l’avenir des travailleurs."
 SCO_ideological_propaganda:0 "Propagande idéologique"
 SCO_ideological_propaganda_desc:0 "La conscience des travailleurs du monde doit être éveillée aux principes de la lutte des classes."
 SCO_one_union_for_all_workers:0 "Un seul syndicat pour tous"
 SCO_one_union_for_all_workers_desc:0 "L’État révolutionnaire étant l’ultime représentant du pouvoir des travailleurs, seules les organisations du parti sont légitimes pour défendre leurs intérêts."
 SCO_encourage_the_proletariat:0 "Héros du prolétariat"
 SCO_encourage_the_proletariat_desc:0 "Il faut sélectionner — et, si besoin, créer — des ouvriers exemplaires pour promouvoir la valeur du dur labeur au sein du prolétariat."
 SCO_reeducate_the_bourgeoisie:0 "Rééduquer la bourgeoisie"
 SCO_reeducate_the_bourgeoisie_desc:0 "Les compétences des ennemis de classe bourgeois peuvent encore servir, pourvu qu’ils soient correctement éduqués aux vertus et aux bénéfices du socialisme."
 SCO_join_the_comintern:0 "Rejoindre le Komintern"
 SCO_join_the_comintern_desc:0 "Moscou est le cœur de la révolution mondiale et notre modèle."
 SCO_a_new_international:0 "Une nouvelle Internationale"
 SCO_a_new_international_desc:0 "Les compromissions de l’URSS ont rendu la IIIe Internationale illégitime pour diriger les travailleurs du monde. Une nouvelle Internationale doit donc naître."
 SCO_choose_a_monarch:0 "Choisir un monarque"
 SCO_choose_a_monarch_desc:0 "Si nous voulons restaurer la monarchie, nous devons inviter un souverain à coiffer notre couronne."
 SCO_democratic_constitutionalism:0 "Constitutionnalisme démocratique"
 SCO_democratic_constitutionalism_desc:0 "La tradition parlementaire remonte à avant l’Acte d’Union avec l’Angleterre. Elle prévient les abus de pouvoir et protège les droits des citoyens."
 SCO_promote_the_chemical_industry:0 "Promouvoir l’industrie chimique"
 SCO_promote_the_chemical_industry_desc:0 "Notre industrie chimique nous aidera à produire du caoutchouc synthétique et à réduire notre vulnérabilité face à un éventuel blocus."
 SCO_support_trade:0 "Soutenir le commerce"
 SCO_support_trade_desc:0 "Dès La Richesse des Nations d’Adam Smith, il était clair que l’échange profite aux deux parties. Cette mentalité est au cœur de notre prospérité et doit être encouragée."
 SCO_promote_chemical_industry:0 "Promouvoir l’industrie chimique"
 SCO_promote_chemical_industry_desc:0 " "
 SCO_research_grants:0 "Subventions à la recherche"
 SCO_research_grants_desc:0 "Favoriser l’innovation est essentiel pour prendre un avantage, quel que soit le domaine technologique."
 SCO_attract_investors:0 "Attirer les investisseurs"
 SCO_attract_investors_desc:0 "Les investissements étrangers peuvent donner un puissant élan à notre économie ; ne les rejetons pas au nom d’une autarcie insensée."
 SCO_economic_optimization:0 "Optimisation économique"
 SCO_economic_optimization_desc:0 "Des réformes permettront à notre économie de fonctionner plus souplement et d’atteindre son plein potentiel."
 SCO_coalition_building:0 "Construire des coalitions"
 SCO_coalition_building_desc:0 "Nous ne pouvons rester seuls dans ce monde troublé. Participons à la défense du monde libre."
 SCO_deterrence:0 "Dissuasion"
 SCO_deterrence_desc:0 "Renforcer notre défense peut suffire à éviter des pressions étrangères hostiles."
 SCO_the_volunteer_corps:0 "Le corps des volontaires"
 SCO_the_volunteer_corps_desc:0 "Plutôt que de nous contenter des rapports des correspondants de guerre, envoyons des corps expéditionnaires pour infléchir l’équilibre mondial et défendre les idéaux démocratiques contre leurs nombreux ennemis."
 SCO_economic_mobilization:0 "Mobilisation économique"
 SCO_economic_mobilization_desc:0 "Il sera essentiel d’orienter notre économie vers la guerre si nous voulons atteindre nos objectifs d’approvisionnement."
 SCO_women_army_service:0 "Service militaire féminin"
 SCO_women_army_service_desc:0 " "
 SCO_womens_suffrage:0 "Suffrage féminin"
 SCO_womens_suffrage_desc:0 " "
 SCO_grant_power_to_the_crown:0 "Accorder les pleins pouvoirs à la Couronne"
 SCO_grant_power_to_the_crown_desc:0 "Donner le pouvoir absolu à un noble tout juste arrivé au pays… qu’est-ce qui pourrait mal tourner, vraiment ?"
 SCO_the_church_question:0 "La question religieuse"
 SCO_the_church_question_desc:0 "La relation du monarque avec l’Église catholique ou l’Église d’Écosse influencera fortement sa légitimité."
 SCO_kings_guard:0 "La garde du roi"
 SCO_kings_guard_desc:0 "Des soldats triés sur le volet, organisés en unités d’élite, sont le meilleur rempart de notre souverain."
 SCO_monarchist_officer_corps:0 "Corps d’officiers monarchiste"
 SCO_monarchist_officer_corps_desc:0 "Des officiers issus de l’aristocratie — ou en créant une nouvelle — peuvent former l’épine dorsale d’une armée loyale à la couronne."
 SCO_demand_the_stone_of_scone:0 "Exiger la Pierre de Scone"
 SCO_demand_the_stone_of_scone_desc:0 "La Pierre de Scone est nécessaire au véritable couronnement de tout monarque écossais. Les Anglais l’ont prise et placée sous leur trône afin de se couronner d’office souverains d’Écosse. Pour garantir notre légitimité, il est impératif de la récupérer."
 SCO_royal_aeronautical_patronage:0 "Mécénat aéronautique royal"
 SCO_royal_aeronautical_patronage_desc:0 " "
 SCO_alliance_with_norway:0 "Alliance avec la Norvège"
 SCO_alliance_with_norway_desc:0 "Par le passé, l’appui norvégien a compté pour contrebalancer l’influence anglaise. Aujourd’hui, il pourrait aussi nous aider à contrôler la mer du Nord."
 SCO_restore_the_auld_alliance:0 "Restaurer l’Auld Alliance"
 SCO_restore_the_auld_alliance_desc:0 "La « Vieille Alliance » avec la France fut, au Moyen Âge, l’axe de la géostratégie écossaise pour contenir l’expansionnisme anglais. Elle pourrait grandement sécuriser notre position."
 SCO_free_bavaria:0 "Libérer la Bavière"
 SCO_free_bavaria_desc:0 "La maison de Wittelsbach est la souveraine légitime de l’Écosse et de la Bavière. Celle-ci ne peut rester sous l’oppression prussienne de Berlin."
 SCO_ally_bavaria:0 "S’allier à la Bavière"
 SCO_ally_bavaria_desc:0 "Nos liens avec la Bavière font de cette alliance une voie logique."
 SCO_restore_order_in_bavaria:0 "Rétablir l’ordre en Bavière"
 SCO_restore_order_in_bavaria_desc:0 " "
 SCO_split_germany_with_france:0 "Partager l’Allemagne avec la France"
 SCO_split_germany_with_france_desc:0 "Pour garantir la liberté de la Bavière, un accord avec la France sur la dissolution de la menace nord-allemande en Europe est peut-être notre meilleure chance."
 SCO_devise_cunning_plans:0 "Échafauder des plans machiavéliques"
 SCO_devise_cunning_plans_desc:0 "Pour atteindre nos objectifs par des opérations secrètes, nous devons former des agents aussi retors que des espions diplômés de l’Université de la Ruse."

 r56_scotland.1.t:0 "L’élection royale écossaise"
 r56_scotland.1.desc:0 "L’attachement des représentants à une monarchie a ouvert la voie à ce jour : l’élection d’un nouveau roi des Écossais. Si certains envisagent les prétendants jacobites de la maison bavaroise de Wittelsbach, d’autres proposent l’élection d’un noble local."
 r56_scotland.1.a:0 "Élire l’héritier jacobite Rupprecht von Wittelsbach"
 r56_scotland.1.b:0 "Élire Heinrich, second fils de Rupprecht"
 r56_scotland.1.c:0 "Élire le duc de Hamilton comme Douglas Ier"

 r56_scotland.2.t:0 "Les [SCO.Getadjective] exigent la restitution de la Pierre de Scone"
 r56_scotland.2.desc:0 "Le gouvernement écossais de [SCO.GetLeader] a demandé que nous restituions la Pierre de Scone, qui repose sous la Chaise du Couronnement depuis sa création en 1307."
 r56_scotland.2.a:0 "Très bien, ce n’est qu’un caillou après tout…"
 r56_scotland.2.b:0 "Scandaleux"

 r56_scotland.3.t:0 "Les [ENG.Getadjective] ont refusé !"
 r56_scotland.3.desc:0 "Arguant qu’elle est à eux depuis des siècles — bien qu’elle nous ait été prise comme symbole de leur domination —, le gouvernement [ENG.Getadjective] nous a fait savoir qu’il n’était pas prêt à rendre la Pierre du Destin. Ils ont insulté la monarchie en retenant un élément essentiel de la légitimité de la couronne. Ils ont, une fois encore, craché sur l’Écosse et son histoire."
 r56_scotland.3.a:0 "Ralliez tous les clans !"
 r56_scotland.3.b:0 "La guerre est inutile, j’ai un plan…"

 r56_scotland.4.t:0 "[ENG.GetNameDefCap] rend la Pierre du Destin"
 r56_scotland.4.desc:0 "Le représentant [ENG.GetAdjective] nous a informés que la Pierre du Destin est en effet un artefact essentiel pour les Écossais et nécessaire au couronnement de nos monarques. Les préparatifs d’un transfert sous escorte jusqu’à la frontière ont déjà commencé. Il ne reste qu’à régler les détails de la cérémonie de réception."
 r56_scotland.4.a:0 "Excellent !"

 r56_scotland.5.t:0 "La Pierre du Destin a été volée !"
 r56_scotland.5.desc:0 "Un groupe de vils voleurs s’est introduit par effraction à l’abbaye de Westminster la nuit dernière et a dérobé la Pierre du Destin dans son compartiment sous la Chaise du Couronnement. Étant donné les demandes précédentes du gouvernement [SCO.Getadjective], nous soupçonnons fortement leur implication. La sécurité a été renforcée, mais les cambrioleurs sont toujours en fuite et la pierre demeure introuvable."
 r56_scotland.5.a:0 "Quel désagrément !"

 r56_scotland.6.t:0 "La Pierre du Destin est de retour !"
 r56_scotland.6.desc:0 "Après l’audacieuse action de nos agents, la Pierre du Destin est enfin revenue en Écosse. Elle a aussitôt servi à confirmer le couronnement légitime de notre monarque. Idéalement, elle devrait retourner à Scone, mais la tension avec [ENG.GetNameDef] rend cela trop dangereux. Nous avons désormais un souverain légitime, le premier roi des Écossais dûment couronné sur notre terre depuis des siècles."
 r56_scotland.6.a:0 "Longue vie au roi !"

 SCO_unlocks_cunning_plan_tt:0 "Déverrouille la priorité §YPlans machiavéliques§! vous permettant de récupérer la pierre et de reprendre le contrôle de la cérémonie du couronnement par des moyens rusés."

 operation_steal_the_stone_of_scone:0 "Récupérer la Pierre de Scone"
 operation_steal_the_stone_of_scone_desc:0 "Voler la Pierre du Destin et la ramener à Scone nous permettrait de restaurer la légitimité de notre monarchie tout en évitant des victimes inutiles."
 targeted_take_the_stone_of_scone:0 "Saisir la Pierre de Scone"
 targeted_take_the_stone_of_scone_desc:0 "Les agents doivent entrer discrètement dans l’abbaye de Westminster et extraire la pierre de 335 livres de la Chaise du Couronnement. Un camion est prévu pour l’exfiltration hors de Londres, et une équipe d’exfiltration est prête."
