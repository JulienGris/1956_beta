 #DÉCISIONS

 JOR_tribes_desc:0 "Notre structure politique récemment mise en place comprend un monarque régnant et un conseil de représentants tribaux qui maintient la cohésion du pays et renforce l’unité de nos peuples. Cependant, cela rend difficiles les efforts de l’Émir pour obtenir un soutien politique ou renforcer son autorité. De plus, les tribus suivent une forme de conservatisme marqué, freinant les projets de modernisation de la Jordanie dans l’armée, l’industrie et la politique étrangère, pourtant soutenus par le peuple. Tout changement de ce système pourrait causer de futurs problèmes.\n\nHowitat : [JORGetHowitat]\nAl-Utaybah : [JORGetUtaybah]\nBani Sakhr : [JORGetBaniSakhr]\nBani Hamida : [JORGetBaniHamida]\n\n\n§WSoutien tribal total : §Y[?JOR_tribal_support]%"
