 #ÉVÉNEMENTS

 jordan.1.t:0 "La Seconde Conférence nationale"
 jordan.1.desc:0 "L’émir transjordanien Abdallah s’est exprimé aujourd’hui au sujet du système du conseil tribal mis en place pour apaiser les populations bédouines et les puissantes tribus autrefois dominantes. Mais la Transjordanie est entrée dans une nouvelle ère, où elle ne fait plus face aux menaces de révoltes tribales ou d’incursions wahhabites. L’Émir doit donc décider quelle tribu privilégier."
 jordan.1.a:0 "Utaybah, les guerriers."
 jordan.1.b:0 "Bani Sakhr, les loyaux."
 jordan.1.c:0 "Howitat, l’élite."
 jordan.1.d:0 "L’armée doit rester au centre, sans l’ingérence des tribus !"

 jordan.2.t:0 "[JOR.GetNameDefCap] demande des livraisons d’armes"
 jordan.2.d:0 "Des rumeurs venues de [JOR.GetNameDef] affirment que certains éléments de la nation préparent un renversement du gouvernement pro-[JOR.OVERLORD.GetAdjective]. Ces insurgés sollicitent notre aide pour armer leurs forces. Nous devons décider si cela mérite notre soutien."
 jordan.2.a:0 "Un allié vital dans la région."
 jordan.2.b:0 "Nous déclinons respectueusement."

 jordan.3.t:0 "[JOR.GetNameDefCap] demande des livraisons d’armes"
 jordan.3.d:0 "Des rumeurs venues de [JOR.GetNameDef] affirment que certains éléments de la nation préparent un renversement du gouvernement pro-[JOR.OVERLORD.GetAdjective]. Ces insurgés sollicitent notre aide pour armer leurs forces. Nous devons décider si cela mérite notre soutien."
 jordan.3.a:0 "Un allié vital dans la région."
 jordan.3.b:0 "Nous déclinons respectueusement."

 jordan.4.t:0 "Livraisons d’armes irakiennes"
 jordan.4.d:0 "Peu après l’envoi de plusieurs messages codés au gouvernement irakien, celui-ci a accepté de nous faire parvenir un lot d’armes par Mafraq."
 jordan.4.a:0 "Merveilleux."

 jordan.5.t:0 "Livraisons d’armes saoudiennes"
 jordan.5.d:0 "Peu après l’envoi de plusieurs messages codés au gouvernement saoudien, celui-ci a accepté de nous faire parvenir un lot d’armes par Ma’an."
 jordan.5.a:0 "Merveilleux."

 jordan.6.t:0 "La loi d’apaisement"
 jordan.6.d:0 "À la suite d’un vif débat entre l’Émir Abdallah et son ministre, Sa Majesté a annoncé publiquement son apaisement et son soutien accru aux conseils tribaux, qui sombrent peu à peu dans l’oubli et divisent davantage l’Émirat. [JOR.GetLeader] prévoit de réformer le système et est parvenu à renforcer les relations avec la tribu Utaybah, écartant ainsi la menace d’une nouvelle révolte d’Adwan."
 jordan.6.a:0 "Une menace de moins."

 jordan.7.t:0 "[JOR.GetNameDefCap] demande la renégociation du traité"
 jordan.7.d:0 "Un émissaire [JOR.GetAdjective] est arrivé à [GetCapital.GetCapitalVictoryPointName] pour rencontrer le Haut-commissaire au sujet du traité de 1928 et de ses restrictions concernant l’armée, la bureaucratie et l’autonomie de la Transjordanie. [JOR.GetLeader] demande un assouplissement de ces restrictions. Bien que cela réduirait notre emprise sur la région, cela pourrait valoir la peine afin d’en faire un allié loyal."
 jordan.7.a:0 "Cela ne nous ferait aucun mal."
 jordan.7.b:0 "Fous ! Pour qui se prennent-ils ?"

 jordan.8.t:0 "Refus britannique"
 jordan.8.d:0 "[ENG.GetLeader] et le Haut-commissaire ont refusé d’assouplir le traité de 1928, déclarant qu’ils le considèrent déjà comme très clément."
 jordan.8.a:0 "Ils ne nous contrôlent pas !"
 jordan.8.b:0 "Ne provoquons pas l’ours."

 jordan.9.t:0 "Renégociation du traité de 1928"
 jordan.9.d:0 "À la suite du voyage de notre émissaire à Jérusalem, le Haut-commissaire britannique de Palestine a accepté d’assouplir les restrictions du traité de 1928. C’est un immense succès pour l’Émir, et le peuple est en liesse !"
 jordan.9.a:0 "Jamais nous ne serons esclaves."

 jordan.10.t:0 "Lutte de pouvoir d’après-guerre"
 jordan.10.d:0 "Notre guerre pour l’indépendance est terminée et nous avons réussi à assurer notre place sur la scène mondiale. Toutefois, bien que l’armée et les tribus aient coopéré durant la guerre, elles ont commencé à s’affronter.\n\nÀ travers le pays, des escarmouches ont éclaté, mais alors que le soleil se couche sur le désert, il apparaît clairement que..."
 jordan.10.a:0 "L’armée a réussi à écraser les révoltes."
 jordan.10.b:0 "Les tribus ont réussi à dominer l’armée !"

