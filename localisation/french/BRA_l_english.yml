BRA_uiracu_desc:0 "L’harpie féroce, également appelée faucon royal et, par les indigènes, Uiraçu, est un rapace plus grand, plus agressif et plus imposant que le pygargue à tête blanche tant vénéré par les Américains. Comme ce faucon qui règne sur notre sol, le Brésil doit être le prédateur de son habitat, et le peuple brésilien, les unificateurs de leur continent."
