 brazilian_focus:0 "Arbre de priorités national brésilien"

 BRA_integrate_uruguay:0 "Intégrer l’Uruguay"
 BRA_take_uruguay:0 "Reprendre l’Uruguay"
 BRA_take_uruguay_desc:0 "Depuis que l’Uruguay a déclaré son indépendance en 1828, il reste un souvenir douloureux d’une région vitale nous ayant échappé. Il est désormais temps de reprendre ce qui nous revient de droit !"
 POR_lisbon_pact:0 "Pacte de Lisbonne"

 # Modifications + ajouts à l'arbre de priorités Vanilla qui ne vont pas dans /replace
 BRA_license_with_the_soviets:0 "Accords de licence avec les [SOV.GetAdjective]s"
 BRA_license_with_the_soviets_desc:0 "Notre recherche accuse un retard par rapport aux grandes puissances. Combler ce fossé prendra du temps, mais d’ici là, nous pourrions obtenir l’autorisation de produire du matériel provenant de [SOV.GetNameDef] en [BRA.GetNameDef]. Vu le coût d’un tel accord, nous devrions tenter de négocier une légère réduction."
 BRA_license_with_the_soviets_tt:0 "([SOV.GetFlag]§Y[SOV.GetName]§!) obtient l’événement « §Y[BRA.GetNameDefCap] cherche un accord de production sous licence§! » \n \n Ils seront plus enclins à accepter s’ils ont une §Yopinion élevée de nous !§!"

 BRA_the_latin_american_socialist_cooperative:0 "La Coopérative socialiste latino-américaine"
 BRA_the_latin_american_socialist_cooperative_desc:0 "De nombreux autres partagent notre vision de la société communiste. Il est grand temps que nous coopérions avec ces nations pour, ensemble, défendre notre cause !"

 BRA_establish_ulasr:0 "Fonder l’ULASR"
 BRA_establish_ulasr_desc:0 "Notre mouvement révolutionnaire continue d’éroder les structures de la société bourgeoise à travers le continent. Il est clair que nous ne sommes plus un mouvement uniquement [ROOT.GetAdjective], mais sud-américain. Nos structures politiques doivent désormais refléter ce changement."
 BRA_end_south_american_capitalism:0 "Mettre fin au capitalisme sud-américain"
 BRA_end_south_american_capitalism_desc:0 "La démocratie bourgeoise et le capitalisme continuent de saper les droits et les conditions de vie de nombreux Sud-Américains. Nous devons tout faire pour libérer nos camarades de leurs oppresseurs."

 # Arbre de priorités du mod The Road to 56
 BRA_2_comunist_putsch:0 "2ᵉ putsch communiste"
 BRA_2_comunist_putsch_desc:0 "En 1935, l’Alliance nationale de libération a affaibli le pouvoir de Getúlio. Aujourd’hui, avec un soutien populaire considérable, les communistes ont à nouveau l’occasion de transformer le Brésil en un État socialiste."
 BRA_2_integralist_levant:0 "Soulèvement intégraliste"
 BRA_2_integralist_levant_desc:0 "Les Intégralistes ont longtemps soutenu Getúlio. Désormais, il revient aux nationalistes de prendre la place qui leur revient comme maîtres de l’avenir du Brésil."
 bra_2_prestes_column:0 "2ᵉ putsch communiste"
 BRA_2_prestes_column:0 "2ᵉ colonne Prestes"
 bra_2_prestes_column_desc:0 "L’Alliance nationale de libération a tenté un coup d’État contre le président Vargas. Aujourd’hui, avec le soutien des travailleurs et du peuple, les marxistes ont l’occasion de forger au Brésil une glorieuse république socialiste égalitaire !"
 bra_abertura:0 "Non Dvcor Dvco"
 bra_abertura_desc:0 "Ce que je ne comprends pas, c’est comment une nation comme le Brésil, après plus d’un siècle de vie constitutionnelle et de libéralisme, a pu régresser vers une dictature sans freins ni limites, qui nous dégrade et nous appauvrit aux yeux du monde civilisé !"
 bra_acominas:0 "USIMINAS"
 bra_acominas_desc:0 "Usinas Siderúrgicas de Minas Gerais SA sera un leader dans la production et la commercialisation d’acier laminé à chaud et à froid, de bobines, de plaques et de produits revêtus, principalement pour les secteurs des biens d’équipement et de consommation, ainsi que pour l’industrie automobile."
 bra_almirantado:0 "La révolte de l’Armada"
 BRA_almirantado:0 "Étudier la « Révolta da Armada »"
 bra_almirantado_desc:0 "Nous devons réajuster le comportement des navires [BRA.GetAdjective] et les tactiques des commandants navals pour la guerre maritime moderne. Nous pouvons prendre pour exemple la révolte navale de 1893."
 bra_amigo_alemanha:0 "Souveraineté diplomatique"
 bra_amigo_alemanha_desc:0 "Tant que nous n’aurons pas vu [BRA.GetNameDef] réorganisé, débarrassé du mal du partisanship égoïste, l’État brésilien représentant les classes et dirigeant la nation grâce à ses élites, nous ne cesserons pas la propagande que nous imposons."
 bra_amigo_aliados:0 "La cause alliée"
 bra_amigo_aliados_desc:0 "Comme nous l'avons toujours fait, nous nous positionnerons en faveur de la cause alliée de la liberté et du libéralisme."
 bra_amigo_argentina:0 "Notre plus grand ennemi ?"
 bra_amigo_argentina_desc:0 "Notre plus grand ennemi, [ARG.GetNameDef], fait face aux mêmes dilemmes que nous. Il est temps de mettre de côté nos différends pour l’indépendance de nos nations."
 bra_amigo_eua:0 "Nommer Osvaldo Aranha"
 bra_amigo_eua_desc:0 "Nous pouvons orienter Osvaldo Aranha vers une politique visant à apaiser les tensions avec les démocraties dans le monde."
 bra_amigo_portugal:0 "Notre ancien maître"
 bra_amigo_uk:0 "Traité de commerce et de navigation"
 bra_amigo_uk_desc:0 "Nous pouvons renouveler le Traité de commerce et de navigation, initialement signé par Dom João VI avec l’Angleterre, pour garantir davantage de ressources à notre industrialisation et, pour eux, nourrir la machine de guerre [ENG.GetAdjective]."
 bra_amigo_urss:0 "Chercher une alliance avec les Soviétiques"
 bra_amigo_urss_desc:0 "Chercher une alliance avec [SOV.GetNameDef] est impératif pour assurer le triomphe du communisme dans nos deux pays."
 BRA_ana_guerra_civil:0 "Analyse de la guerre civile de 1932"
 bra_ana_guerra_civil:0 "Analyse de la guerre Paulista"
 bra_ana_guerra_civil_desc:0 "La guerre civile brésilienne a servi de terrain d’essai pour tester des tactiques de combat potentiellement efficaces."
 bra_ana_mineira:0 "Doctrine militaire du Minas Gerais"
 BRA_ana_mineira:0 "Doctrine militaire du Minas Gerais"
 bra_ana_mineira_desc:0 "Pendant le conflit, les troupes et officiers du Minas Gerais ont compris que São Paulo ne pourrait maintenir la guerre longtemps. Les Mineiros ont donc creusé. Des mitrailleuses fixes soutenaient leurs tranchées et le feu de l'artillerie nationale a aidé leurs avancées lentes mais sûres."
 bra_ana_paulista:0 "Doctrine militaire de São Paulo"
 BRA_ana_paulista:0 "Doctrine militaire de São Paulo"
 bra_ana_paulista_desc:0 "Les forces publiques paulista ont adopté la guerre mobile et le blitz pendant le conflit. Les plans de l’État de São Paulo prévoyaient un mouvement rapide et fulgurant vers Rio de Janeiro via la vallée du Paraíba, la protection arrière étant assurée par l’appui des autres États."
 bra_anhanguera:0 "Via Anhanguera"
 BRA_anhanguera:0 "Via Anhanguera"
 bra_anhanguera_desc:0 "Plus vaste que la plupart des sections de l’Autobahn allemande, la 'Via Anhanguera' sera le plus grand complexe autoroutier du pays, reliant l’ensemble du territoire avec une circulation fluide exceptionnelle."
 bra_anhanguera_tooltip:0 "La construction de la SP-330, la Via Anhanguera, débutera. Elle sera étendue pour devenir la BR-050, reliant Goiás à São Paulo. Cette construction maximisera l’infrastructure de l’État de São Paulo, développera considérablement celle de Goiás et Mato Grosso et facilitera l’expansion industrielle du pays en 1 emplacement."
 BRA_armor:0 "'Tanques de Guerra'"
 bra_armor:0 "Tanques de Guerra"
 bra_armor_desc:0 "Pendant la guerre civile, les deux camps ont utilisé des tanks. La victoire de l’Union a été en partie décidée par l’usage du FT-17. Moderniser ces modèles sera un avantage considérable pour l’armée."
 bra_art:0 "CBC"
 BRA_art:0 "Artillerie lourde"
 bra_art_desc:0 "Disposant de plus de ressources que son adversaire, l’Union a importé de l’artillerie. Précises, les pièces ont anéanti une escouade paulista d’un seul tir. Nous pouvons aider nos entreprises militaires à développer leurs centres industriels à un niveau jamais atteint."
 bra_aviso_tooltip:0 "§RPasser d’une idéologie à une autre par tous les moyens, sauf en permettant aux élites politiques de participer au changement en rassemblant un soutien suffisant pour un coup d’État, en étant manipulé par un autre pays ou par tout autre changement de gouvernement sera perçu par ces élites comme une attaque contre leurs intérêts. Elles regretteront leur absence de participation et refuseront de participer à tous les projets.§!"
 bra_a_voz_do_brasil:0 "La Voix du Brésil"
 BRA_a_voz_do_brasil:0 "Diffuser 'A Voz do Brasil'"
 BRA_a_voz_do_brasil_desc:0 "'La Voix du Brésil' est un bulletin d’information obligatoire de l’État diffusé quotidiennement sur toutes les radios publiques au Brésil à 19h (GMT), d’une durée d’une heure. Il a été créé par le gouvernement brésilien pour diffuser les réalisations de l’État."
 bra_barragem:0 "Doctrine d’attrition"
 bra_barragem:0 "Doctrines d’attrition"
 bra_barragem_desc:0 "Avec patience, supériorité technologique et l’utilisation de balles plutôt que d’hommes, les troupes du Minas Gerais ont été les plus efficaces, offrant au Brésil une victoire rapide sur les Paulistas. Il ne faut pas nier l’héritage des Mineiros."
 bra_basta:0 "Basta !"
 bra_basta_desc:0 "Nous ne supporterons plus les crises, les coups d’État, la limitation du développement industriel par les importations, l’exploitation de nos ressources naturelles, l’oppression transcontinentale et l’arrogance diplomatique. Ça suffit !"
 bra_bb:0 "Banque fédérale économique"
 bra_bb_desc:0 "La Caixa Econômica Federal (CEF), également connue sous le nom de Caixa, est une institution financière sous forme de société publique du gouvernement fédéral [BRA.GetAdjective]. Ses actifs et son autonomie administrative sont présents dans tout le pays."
 bra_belem_porto:0 "Chantier naval de Belém"
 BRA_belem_porto:0 "Construire le chantier naval de Belém"
 bra_belem_porto_desc:0 "La construction du port de Belém fournit au pays une base stratégique au nord, capable de soutenir les vastes flottes de la Fédération et servant de base pour des opérations d’invasion au nord de l’Équateur."
 BRA_blitz:0 "Doctrine de choc"
 bra_blitz:0 "Doctrines de choc"
 bra_blitz_desc:0 "Les Paulistas nous ont montré que, même en infériorité numérique, la rapidité et l’autonomie des troupes garantissent le succès au combat. Adoptant ces tactiques, nous assurerons une meilleure efficacité et une victoire rapide sur nos ennemis !"
 bra_bndes:0 "BNDES"
 bra_bndes_desc:0 "La Banque nationale de développement économique et social est une société publique fédérale basée à Rio de Janeiro et dont l’objectif principal est de financer des investissements à long terme dans tous les segments de l’économie, sociale, régionale et environnementale."
 BRA_bombardeiro:0 "Doctrine 'Eduardo Gomes'"
 bra_bombardeiro:0 "Doctrine d’Eduardo Gomes"
 bra_bombardeiro_desc:0 "Bien que les bombardiers aient été utilisés par l’Union pendant la guerre civile, ils sont devenus plus précis et létaux depuis la dernière utilisation par le Brésil. Le brigadier Eduardo Gomes, durant ce conflit, a bombardé Campinas, affaiblissant une grande partie des infrastructures de la ville avec un escadron réduit. Nous l’instituerons comme chef de l’Armée de l’air."
 BRA_brasilia:0 "Brasília"
 bra_brasilia:0 "Brasília"
 bra_brasilia_desc:0 "Le transfert de la capitale vers l’intérieur du pays était un des objectifs nationaux depuis l’Empire de Pedro II. Cela permettait non seulement de sécuriser la capitale contre d’éventuelles invasions navales, mais aussi de favoriser le développement de l’intérieur. Commencez dès maintenant la construction de cette nouvelle capitale."
 bra_brasilia_tooltip:0 "Passage à l’Ère Républicaine Intermédiaire. De nouveaux partis politiques sont en place, une nouvelle classe politique naît."
 BRA_brazilian_action:0 "Action brésilienne"
 bra_brazilian_action:0 "Le soulèvement intégraliste"
 bra_brazilian_action_desc:0 "Pendant longtemps, les Intégralistes ont soutenu Getúlio. Il est maintenant temps pour nous de prendre nos positions légitimes en tant que dirigeants de la République."
 BRA_brazilian_action_desc:0 "Similaire à l’Action Française, l’Action Brésilienne Globale est un mouvement réactionnaire brésilien, inspiré des grandes gloires et traditions passées de cette nation. Sa réflexion sur le centre éducatif et culturel du pays sera cruciale pour l’identité patriotique nationale."
 BRA_caca:0 "Ministère de l’Aéronautique"
 bra_caca:0 "Ministère de l’Aéronautique"
 bra_caca_desc:0 "Avec la création du Ministère de l’Aéronautique, le gouvernement pourra gérer cette nouvelle branche des Forces armées de la République."
 BRA_CAS:0 "Soutien aérien de bataille"
 bra_CAS:0 "Lagoa Santa"
 bra_casacivil:0 "Casa Civil"
 bra_casacivil_desc:0 "La nouvelle Casa Civil se verra déléguer toutes les responsabilités liées au conseil du président de la République, en assurant qu’il communique efficacement avec ses ministres et le Parlement, et puisse coordonner avec tous les domaines fédéraux."
 bra_CAS_desc:0 "La réactivation et la modernisation de notre usine d’avions à Lagoa Santa, dans la région métropolitaine de Belo Horizonte, aidera à accroître la taille de notre force aérienne."
 BRA_cepsn:0 "Plan sidérurgique national"
 bra_chsf:0 "Compagnie hydroélectrique de São Francisco"
 bra_chsf_desc:0 "La Compagnie hydroélectrique de São Francisco est une société cotée en bourse qui produit et transmet de l’énergie en haute et très haute tension, exploitant le bassin du fleuve São Francisco."
 bra_ciclocana:0 "La ceinture sucrière"
 bra_ciclocana_desc:0 "Avec l’introduction de la chaux et de l’irrigation localisée, malgré un sol acide et l’air sec, nous pouvons créer dans le Triângulo Mineiro et le Bas Goiás une nouvelle région hyper-productrice de canne à sucre. Obsolète depuis des siècles, elle a un potentiel pour l’usage industriel de l’alcool et comme carburant."
 bra_ciclosoja:0 "La ceinture du soja"
 bra_ciclosoja_desc:0 "Avec l’introduction de méthodes de drainage avancées et la mécanisation de l’agriculture à l’échelle nationale, il est possible de cultiver du soja dans le Mato Grosso, région isolée. Le soja n’a jamais été cultivé sur le sol national. Il représente un potentiel alimentaire, d’exportation et un moyen de colonisation de l’intérieur."
 BRA_cmsp:0 "'Grande São Paulo'"
 bra_cmsp:0 "São Paulo métropolitain"
 bra_cmsp_desc:0 "São Paulo métropolitain est le plus grand centre industriel du pays, d’Amérique latine, et, avec le soutien du gouvernement, de tout le continent américain."
 bra_cmvrg:0 "Grande Vallée"
 BRA_cmvrg:0 "Complexe militaire de la vallée du Grande"
 bra_cmvrg_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du Rio Grande, englobant l’Oeste Paulista et le Triângulo Mineiro."
 BRA_cmvrparana:0 "Complexe militaire de la vallée du Paraná"
 bra_cmvrparana:0 "Vallée du Paraná"
 bra_cmvrparana_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du fleuve Paraná, couvrant une partie du sud de São Paulo et presque tout l’État du Paraná."
 BRA_cmvrparnaiba:0 "Complexe militaire de la vallée du Parnaíba"
 bra_cmvrparnaiba:0 "Vallée du Parnaíba"
 bra_cmvrparnaiba_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du fleuve Parnaíba, dans le nord-est du Brésil."
 bra_consegnac:0 "Conseil national de défense"
 bra_consegnac_desc:0 "Le Conseil national de défense est un organe consultatif du président du Brésil sur la sécurité nationale, la politique étrangère et les stratégies de défense, créé par le dernier président de la 1re République, Washington Luis. Il conseille le président en cas de déclaration de guerre, d’établissement de la paix, d’état de défense, d’état de siège ou d’interventions fédérales."
 bra_cosipa:0 "COSIPA"
 bra_cosipa_desc:0 "La Companhia Siderúrgica Paulista produira des produits en acier plats non revêtus destinés aux secteurs stratégiques de l’économie, tels que l’automobile, le ferroviaire, la construction navale et civile, l’agriculture, l’emballage, la mécanique, l’électronique, l’électroménager, la machinerie et la distribution."
 bra_cosmopolitanism:0 "Multiculturalisme & Cosmopolitisme"
 BRA_cosmopolitanism:0 "Multiculturalisme & Cosmopolitisme"
 BRA_cosmopolitanism_desc:0 "Le Brésil est une nation multiraciale. La diversité culturelle et ethnique du pays constitue un atout pour en faire un bastion de la Révolution. La mise en œuvre de la pensée gramscienne à travers le système éducatif national sera avantageuse pour l’État révolutionnaire."
 bra_cosmopolitanism_desc:0 "La diversité culturelle et ethnique de [BRA.GetNameDefCap] et son rôle de tête de file dans les mouvements sociaux-libéraux et néo-marxistes constituent un avantage en tant que bastion de la Révolution ouvrière. L’endoctrinement de la pensée gramscienne via le système éducatif national profitera à l’État révolutionnaire."
 BRA_cruzadores:0 "'Cuirassés'"
 bra_cruzadores:0 "Cuirassés"
 bra_cruzadores_desc:0 "Depuis son indépendance, le Brésil possède les plus grands monstres maritimes dans son arsenal. Nous ne ferons pas différemment."
 bra_csn:0 "Compagnie sidérurgique nationale"
 bra_csn_desc:0 "Nous avons établi le Plan sidérurgique national pour définir les zones d’extraction du fer et implanter des centres de production d’acier au Brésil."
 bra_CTEF_CLT:0 "Conseil technique pour l’économie et les finances"
 BRA_CTEF_CLT:0 "Conseil technique pour l’économie et les finances"
 bra_CTEF_CLT_desc:0 "Le Conseil technique pour l’économie et les finances a été créé pour assister le président dans les décisions économiques et stratégiques du pays."
 bra_cuba_rev:0 "Libérer Cuba"
 bra_cuba_rev_desc:0 "La cour arrière des [USA.GetNameDef] ne le sera plus. Nous libérerons Cuba de ses oppresseurs et l’utiliserons pour mener des opérations amphibies sur le territoire [USA.GetAdjective]."
 bra_diplomacia:0 "Itamaraty"
 bra_diplomacia_desc:0 "Nous pouvons étendre les activités de l’Itamaraty pour nous concentrer sur les affaires mondiales."
 bra_dofa_tooltip:0 "Obtient un cœur et un objectif de guerre contre l’Uruguay et le Paraguay"
 BRA_dreams_of_an_empire:0 "Saudosismo impérial"
 bra_dreams_of_an_empire:0 "Manifeste d’octobre"
 BRA_dreams_of_an_empire_desc:0 "L’Empire du Brésil, prédécesseur de la République actuelle, était une grande puissance internationale et suprême sur le continent. Le Brésil moderne semble asservi aux volontés et plaisirs d’États étrangers. Il est temps que la nation brésilienne se relève de ses cendres et retrouve sa place parmi les grands empires de la civilisation."
 bra_dreams_of_an_empire_desc:0 "La nation [BRA.GetAdjective] doit être organisée, unie, indivisible, forte, puissante, riche, prospère et heureuse. Pour cela, tous les [BRA.GetAdjective] doivent être unis. Mais [BRA.GetNameDef] ne pourra atteindre l’union intime et parfaite de ses enfants tant qu’il existera des États dans l’État et des partis fractionnant la Nation."
 bra_eixo:0 "Le principe d’autorité"
 bra_eixo_desc:0 "En rejoignant [GER.GetNameDef], nous pouvons sécuriser notre expansion continentale. Certains députés influents de Santa Catarina évoquent un futur forgé à travers un empire commun."
 bra_elet_1:0 "ENERGISA/CPFL"
 BRA_elet_1:0 "Expansion du réseau électrique"
 bra_elet_1_desc:0 "L’extension du réseau électrique dans toutes les capitales d’État et les centres urbains tels que l’Ouest Paulista et l’Espírito Santo améliorera la qualité de vie des [BRA.GetAdjective]s et l’efficacité de l’industrie nationale."
 bra_elet_2:0 "CESP/CEMIG"
 BRA_elet_2:0 "Expansion du réseau électrique II"
 bra_elet_2_desc:0 "Étendre le réseau électrique vers des régions industriellement peu développées, comme le Triângulo Mineiro, le Paraná et la Bahia, pourrait créer de nouveaux centres de production augmentant encore le progrès de notre nation."
 BRA_end_the_occupation:0 "Mettre fin à l’occupation"
 BRA_end_the_occupation_desc:0 "Les États de [498.GetName] et [1004.GetName] ont été sous loi martiale depuis que les rébellions communistes dans la région ont été écrasées fin 1935. Avec la stabilité désormais rétablie, il est temps de restaurer la vie normale dans ces États."
 BRA_eng_mart:0 "Héritage Martinelli"
 bra_eng_mart:0 "Héritage Martinelli"
 bra_eng_mart_desc:0 "L’immigrant Giuseppe Martinelli a fait fortune au Brésil grâce au commerce transatlantique. À São Paulo, il visait à construire le plus haut immeuble d’Amérique latine. Ses ajustements sur l’usine ont permis d’éviter de poser les fondations, économisant temps et ressources et garantissant la construction du monument. Nous pouvons en tirer beaucoup d’enseignements."
 bra_entrar_comintern:0 "La Révolution mondiale !"
 bra_entrar_comintern_desc:0 "[SOV.GetNameDefCap] et [BRA.GetNameDef] ont consolidé une véritable révolution mondiale du prolétariat. Nous devons consolider notre alliance pour protéger nos travailleurs et libérer les opprimés."
 BRA_equip_ind:0 "'Armes d’infanterie'"
 bra_equip_ind:0 "IMBEL"
 bra_equip_ind_desc:0 "Au lieu de motoriser leur infanterie, les Mineiros ont augmenté leur efficacité au combat. L’équipement de l’infanterie légaliste était plus moderne, rapide et précis comparé aux Paulistas, facilitant la défense des tranchées. Nous pouvons signer des contrats avec nos fabricants d’armes pour moderniser de nouveau notre infanterie."
 bra_estado_novo:0 "L’Estado Novo"
 bra_estado_novo_desc:0 "Dans sa sagesse complète et son avant-gardisme industriel, un État central est capable d’assurer le bien-être général des citoyens et la prospérité des entrepreneurs. Ce lien éternel entre les travailleurs, guerriers et entrepreneurs de la République garantira une union [BRA.GetAdjective] durable."
 bra_etanol:0 "Proálcool"
 bra_etanol_desc:0 "Jamais auparavant l’agriculture n’a représenté un tel potentiel pour l’économie et la machine de guerre [BRA.GetAdjective]. Avec l’implantation du soja et de la canne à sucre à l’intérieur du pays, il est désormais possible, grâce aux recherches des universités fédérales et soutenues par les grands propriétaires, de remplacer partiellement l’essence par l’éthanol raffiné. PROÁLCOOL sera un programme du gouvernement fédéral visant à garantir que les véhicules produits en [BRA.GetNameDef] roulent à l’alcool."
 BRA_feb:0 "Força Expedicionária Brasileira"
 bra_feb:0 "Forces expéditionnaires [BRA.GetAdjective]"
 BRA_feb_desc:0 "Nous avons la capacité logistique, tactique, organisationnelle, industrielle et numérique d’organiser des expéditions à l’étranger pour défendre les intérêts de la République contre ceux qui osent attaquer."
 bra_federalism:0 "Fédéralisme"
 bra_federalism:0 "Unitarisme"
 BRA_federalism_desc:0 "Le Brésil est culturellement, géographiquement et économiquement divisé. Accorder une autonomie relative aux différentes unités fédératives est un moyen efficace d’assurer la liberté de ses citoyens et le respect de leurs droits constitutionnels."
 bra_federal_institutes:0 "Instituts fédéraux"
 BRA_federal_institutes:0 "Instituts fédéraux"
 bra_federal_institutes_desc:0 "Les Instituts fédéraux sont des branches des universités dédiées exclusivement à l’innovation technologique pratique."
 bra_federal_universities:0 "Universités fédérales"
 BRA_federal_universities:0 "Universités fédérales"
 bra_federal_universities_desc:0 "Les universités fédérales sont à la fois des centres éducatifs et des pôles d’innovation technologique. Leur exploitation optimale est un atout pour les efforts du gouvernement."
 BRA_federal_universities_desc:0 "Les universités fédérales sont à la fois des centres éducatifs et des pôles d’innovation technologique. L’exploitation correcte de leurs fruits est intéressante pour les efforts gouvernementaux."
 BRA_fiesp:0 "FIESP"
 bra_fiesp:0 "FIESP"
 bra_fiesp_desc:0 "La Fédération des Industries de l’État de São Paulo représente des milliers de syndicats et d’entreprises à travers l’État. Articuler les plans du gouvernement selon sa volonté permet d’unir l’utile à l’agréable, favorisant notre capacité à lancer de nouveaux projets industriels et à innover en temps de paix comme de guerre."
 bra_foro_de_sao_paulo_focus:0 "Congrès des travailleurs d’Amérique Latine"
 bra_foro_de_sao_paulo_focus_desc:0 "Le Foro de São Paulo est une conférence de partis politiques de gauche et un séminaire international invitant d’autres partis et organisations de la gauche américaine à discuter des alternatives aux politiques libérales."
 BRA_fundar_petrobras:0 "'Petrobrás'"
 BRA_fundar_vale:0 "'Vale do Rio Doce'"
 bra_gerdau:0 "GERDAU"
 bra_gerdau_desc:0 "Gerdau S.A., ou Groupe Gerdau, est une société sidérurgique [BRA.GetAdjective]. Engager Gerdau pour développer notre secteur sidérurgique et notre infrastructure trans-industrielle est à l’étude."
 BRA_glory_to_brasil:0 "Contester la doctrine Monroe"
 BRA_ideological_propaganda:0 "Propagande idéologique"
 BRA_ideological_propaganda_desc:0 "Tout mouvement communiste est une cellule potentielle prête à organiser les masses."
 bra_industrial_innovations:0 "Innovations industrielles"
 bra_industrial_innovations_desc:0 "Notre industrie désormais largement modernisée est prête à relever les défis de notre époque : concevoir et produire du matériel moderne pour garantir notre victoire sur le terrain."
 bra_inimigo_eua:0 "Nommer Afrânio de Mello"
 bra_inimigo_eua_desc:0 "Nous pouvons désigner Afrânio de Mello pour une politique garantissant les intérêts nationaux."
 bra_inimigo_eua_tooltip:0 "Les diplomates réussiront à obtenir suffisamment de soutien d’autres puissances pour faire pression sur [USA.GetNameDef] afin qu’il n’intervienne pas dans les affaires sud-américaines."
 BRA_IRFM:0 "Indústrias Reunidas Fábricas Matarazzo"
 bra_IRFM:0 "Usines unies Matarazzo"
 bra_IRFM_desc:0 "L’immigrant Francesco Matarazzo a fondé les Indústrias Reunidas Matarazzo dans les années 1920. Nous pouvons étendre les 360 usines produisant une grande variété de biens pour répondre à la majeure partie de la demande industrielle du pays."
 bra_itabira:0 "Itabira"
 BRA_itabira:0 "Itabira"
 bra_itabira_desc:0 "Les mines d’Itabira, Minas Gerais, font partie du Quadrilátero Ferrífero, le plus grand gisement de fer et de bauxite du pays et l’un des plus importants au monde. Garantir que les minéraux extraits soient exclusivement utilisés par [BRA.GetNameDef] assurera notre souveraineté minérale."
 bra_itaipu:0 "Centrale hydroélectrique d’Itaipu"
 bra_itaipu_desc:0 "La centrale hydroélectrique d’Itaipu est le projet le plus ambitieux imaginé par le gouvernement fédéral à ce jour. Elle sera construite dans le bassin du Paraná et produira toute l’électricité des régions Sud et Sud-Est. Ce prodige hydroélectrique est prévu pour devenir le plus vaste et le plus efficace au monde, la plus grande prouesse de l’ingénierie et de l’ingéniosité [BRA.GetAdjective]."
 BRA_iti:0 "Institut de technologie industrielle"
 bra_iti:0 "Ministère du Travail, du Commerce et de l’Industrie"
 bra_iti_desc:0 "Le Ministère du Travail, du Commerce et de l’Industrie assistera le gouvernement dans l’expansion et la modernisation industrielle."
 bra_liga_nacoes:0 "Rejoindre la guerre"
 bra_liga_nacoes_desc:0 "Le Brésil s’est retiré de la Société des Nations en 1926 sous l’administration d’Arthur Bernardes. Rejoindre à nouveau cette organisation, même symbolique, peut affirmer notre volonté de contenir l’autoritarisme mondial."
 bra_lobato:0 "Lobato"
 BRA_lobato:0 "Lobato"
 bra_lobato_desc:0 "Un incident entre deux voisins à Lobato, Bahia, a contesté la déclaration du gouvernement selon laquelle il n’y aurait pas de pétrole sur les terres [BRA.GetAdjective]."
 bra_mec:0 "ENGESA"
 BRA_mec:0 "Mécanisation"
 bra_mec_desc:0 "L'une des réalisations les plus incroyables de l'État de São Paulo pendant la guerre fut la construction de trains blindés. Répartis parmi les cargaisons de café en conflit, les trains étaient dotés d’épaisses plaques de métal, leurs fenêtres étaient équipées de mitrailleuses et, à l’avant, d’un canon. Nous pouvons aider certains fabricants de camions à créer une entreprise pour répondre à notre besoin d’unités mécanisées."
 bra_mercosul_expansao_focus:0 "Champions de la démocratie"
 bra_mercosul_expansao_focus_desc:0 "'Nous sommes les champions de la démocratie dans l’hémisphère sud et nous considérons comme notre devoir commun de protéger nos voisins contre l’oppression des radicaux, à l’intérieur comme à l’extérieur. Ainsi, nous étendons désormais notre aide à tous nos frères de l’hémisphère sud, non seulement au nom de la liberté, mais aussi au nom de la paix !'"
 bra_mercosul_focus:0 "Initiative commerciale sud-américaine"
 bra_mercosul_focus_desc:0 "Le DefenSul est une organisation intergouvernementale regroupant les démocraties d’Amérique du Sud, visant la protection mutuelle, le confinement du radicalisme sur le continent et la formation d’une politique fiscale favorisant le commerce continental."
 bra_mercosul_militar_focus:0 "Consolider le DefenSul"
 bra_mercosul_militar_focus_desc:0 "Consolider DefenSul en tant qu’organisation est nécessaire ; dans un monde où les radicaux et les bellicistes surgissent de tous les coins, nous devons défendre l’Amérique du Sud et nos foyers contre les attaques étrangères et locales. Si nous devons mener la guerre jusqu’aux portes de nos ennemis pour y parvenir, qu’il en soit ainsi !"
 bra_mercosul_militar_tooltip:0 "Étend le traité de défense DefenSul en une organisation de défense conjointe plus large axée sur l’hémisphère sud."
 bra_mex_rev:0 "Rébellion mexicaine"
 BRA_milicias:0 "Avant-garde nationale"
 BRA_military_projects:0 "Projets militaires"
 bra_military_projects:0 "École supérieure de guerre"
 bra_military_projects_desc:0 "L’École supérieure de guerre (ESG) vise à développer et consolider les connaissances nécessaires à l’exercice de fonctions de gestion et de conseil supérieur pour la planification de la Défense nationale, incluant les aspects fondamentaux de la sécurité et du développement."
 BRA_mobilizacao_ind:0 "Décret de mobilisation nationale"
 bra_mobilizacao_ind:0 "Décret de mobilisation nationale"
 bra_mobilizacao_ind_desc:0 "Grâce à des actions, décrets et sous-sections de la Constitution, l’Union peut augmenter la rapidité et l’ampleur de l’État de siège, étendant considérablement la capacité de [BRA.GetNameDef] à répondre à la guerre."
 BRA_modernizacao_aerea:0 "Aviation militaire"
 bra_modernizacao_aerea:0 "Force aérienne brésilienne"
 bra_modernizacao_aerea_desc:0 "Instituer les forces aériennes comme une partie significative des forces armées de la République est essentiel pour garantir la puissance [BRA.GetAdjective] dans le ciel."
 BRA_modernizacao_armadas:0 "Ministère des forces armées"
 BRA_modernizacao_marinha:0 "'Florianisme'"
 bra_modernizacao_marinha:0 "Florianisme"
 bra_modernizacao_marinha_desc:0 "Moderniser la marine est essentiel pour garantir la puissance [BRA.GetAdjective] sur la mer. Floriano Peixoto fut le premier président-amiral de la République. Sous son règne, il a maintenu notre grand héritage naval. Nous devons le préserver."
 bra_mod_mad_mamo:0 "BR-230"
 BRA_mod_mad_mamo:0 "Modernisation de la Madeira-Mamoré"
 bra_mod_mad_mamo_desc:0 "Le projet Transamazonien représente l’un des plus grands défis de notre nation : l’occupation de la forêt amazonienne. La réalisation de cette route augmenterait la mobilité de nos troupes dans le Nord."
 bra_mod_sb:0 "BR-163"
 BRA_mod_sb:0 "Modernisation de la Catarinense"
 bra_mod_sb_desc:0 "La BR-163 sera centrale pour le développement et l’occupation du Mato Grosso et de l’Amazonie méridionale. De petits villages y émergeront, pouvant devenir à terme de grands centres agricoles."
 bra_mod_soroc:0 "BR-116"
 BRA_mod_soroc:0 "Modernisation de la Sorocabana"
 bra_mod_soroc_desc:0 "La BR-116 reliera l’État du Ceará au Sud du Brésil. Ces deux régions sont des centres importants de production et de consommation et correspondent à la zone la plus sensible militairement pour [BRA.GetNameDef], bordée par deux de nos ennemis historiques et cœur de l’armée [BRA.GetAdjective]. Améliorer cette liaison est essentiel pour la défense et la production."
 bra_monarquia_focus:0 "Impérialisme"
 bra_monarquia_focus_desc:0 "Depuis 1889, la question royale fait débat dans nos cercles intellectuels. Nous pouvons rappeler notre empereur pour diriger le Brésil une fois de plus."
 bra_monarquia_tooltip:0 "Invoque notre empereur, D Pedro III, pour diriger le Brésil."
 bra_more_federal_universities:0 "Expansion des campus fédéraux"
 BRA_more_federal_universities:0 "Étendre les universités"
 bra_more_federal_universities_desc:0 "Plus d’universités signifient plus d’apprenants et plus de progrès. Transformer de petites facultés de l’intérieur du pays en centres éducatifs majeurs devrait être une priorité du gouvernement."
 bra_mot:0 "FNM"
 BRA_mot:0 "Motorisation"
 bra_mot_desc:0 "Pendant la guerre civile, l’armée Paulista mobilisa les grands centres de production automobile de la capitale. Elle utilisa cette production pour déplacer rapidement ses soldats entre les tranchées légalistes. Nous pouvons créer un nouveau fabricant de véhicules basé à Duque de Caxias."
 bra_natal_porto:0 "Chantier naval de Natal"
 bra_natal_porto_desc:0 "À Natal, un chantier naval offrira au Nord-Est du Brésil une nouvelle ouverture sur la scène mondiale. Nous pouvons prévoir le transport de tonnes de marchandises importées et exportées. Le port sera principalement à usage civil, mais pourra servir à des fins militaires."
 bra_national_institutes:0 "Instituts nationaux"
 BRA_national_institutes:0 "Instituts nationaux"
 bra_national_institutes_desc:0 "La création d’instituts nationaux en tant que centres de recherche avancée accélérera significativement le progrès technologique du pays."
 bra_national_security_law:0 "Loi sur la sécurité nationale"
 BRA_national_security_law:0 "Loi sur la sécurité nationale"
 BRA_national_security_law_desc:0 "La loi sur la sécurité nationale marque l’une des transitions entre la guerre civile du patrimoine légal de 1932 et la Nouvelle politique brésilienne, mise en œuvre pour maintenir l’unité nationale."
 BRA_new_constitution:0 "2ème Assemblée constitutionnelle"
 bra_new_constitution:0 "Non Dvcor Dvco"
 bra_new_constitution_desc:0 "Je ne comprends pas comment une nation comme [BRA.GetNameDef], après plus d’un siècle de vie constitutionnelle et de libéralisme, a régressé vers une dictature sans frein ni limites, nous dégradant et nous appauvrissant aux yeux du monde civilisé !"
 bra_noronha_tooltip:0 "Crée le chef de la marine : Isaías de Noronha"
 BRA_nuclear_research_bureau:0 "Centre fédéral de recherche nucléaire"
 bra_nuclear_research_bureau:0 "Programme parallèle"
 bra_nuclear_research_bureau_desc:0 "Notre esprit et nos armes sont inutiles si tout notre pays peut être anéanti par nos ennemis en quelques secondes."
 bra_obras_exterior:0 "Routes fédérales"
 BRA_obras_exterior:0 "Nationaliser les infrastructures majeures"
 bra_obras_exterior_desc:0 "Construites principalement par les Britanniques et les Américains, certaines infrastructures sont vitales pour le fonctionnement du pays et la génération de profits importants. Le gouvernement doit s’assurer que leurs bénéfices reviennent aux nationaux et non aux étrangers par décret."
 bra_pan_americano:0 "Panaméricain"
 bra_pan_americano_desc:0 "Le Pacte de défense panaméricain garantira le triomphe de la révolution dans notre partie du globe !"
 bra_pan_americano_fascism:0 "Frappes contre nos ennemis idéologiques"
 BRA_patriotic_effort:0 "Effort patriotique"
 bra_patriotic_effort:0 "Pro Brasilia Fiant Eximia"
 bra_patriotic_effort_desc:0 "La nation [BRA.GetAdjective] exige que tous ses citoyens se consacrent à son maintien, sa défense et son développement. Les [BRA.GetAdjective] doivent répondre à ces aspirations, que ce soit pour le bien national ou pour leurs libertés nationales."
 BRA_paulista_revanchism:0 "Pro Brasilia Fiant Eximia"
 bra_petrobras:0 "Petrobrás"
 bra_petrobras_desc:0 "Petrobras sera l’entreprise publique du pétrole brésilien, responsable de l’exploration, du raffinage et de l’expansion des puits à travers le pays."
 BRA_petroleo_salvador:0 "Salvador"
 BRA_plan_cohen:0 "Plan Cohen"
 bra_plan_cohen:0 "Ferrer les poules vertes"
 BRA_plan_cohen_desc:0 "Le plan Cohen, forgé par le capitaine integraliste Olimpio Mourao Filho, a été inventé par le mouvement fasciste pour accuser les communistes d’une tentative de coup d’État. La manœuvre échoua, et la divulgation de cette farce integraliste augmente le soutien populaire à l’idéologie communiste."
 bra_plan_cohen_desc:0 "Les Poules Vertes (comme nous appelons les Integralistes) s’opposent violemment à la juste prise de pouvoir du peuple au Brésil. Pour garantir la victoire de la révolution, nos dirigeants doivent personnellement mener nos armées contre le fascisme !"
 BRA_polaca:0 "Instaurer la 'Polaca'"
 bra_polaca:0 "Polaca"
 BRA_polaca_desc:0 "La Quatrième Constitution du Brésil a été promulguée par Getúlio Vargas afin de mettre en place un système centré sur le Président. Elle est reconnue comme la première étape de la consolidation de l'État Nouveau."
 bra_polaca_desc:0 "Nous pouvons instaurer une Quatrième Constitution brésilienne visant à établir un système focalisé sur le Président de la République."
 BRA_politechnical_colleges:0 "Collèges polytechniques"
 bra_politechnical_colleges:0 "Collèges polytechniques"
 bra_politechnical_colleges_desc:0 "La construction de collèges polytechniques dans les grands centres urbains du pays formera des milliers de jeunes capables de servir le pays dans leurs fonctions productives respectives."
 bra_populism_focus:0 "Populisme"
 BRA_populism_focus:0 "Populisme"
 BRA_populism_focus_desc:0 "Les grands dirigeants brésiliens mobilisent le soutien des masses grâce à des discours idéologiques radicaux qui influencent l’opinion collective."
 bra_populism_focus_desc:0 "Les grands dirigeants de la République doivent rallier les grandes masses à travers des discours radicalement idéologiques qui modifient l’opinion publique nationale."
 BRA_preemptive_strike_tt:0 "§CCe focus accordera des objectifs de guerre contre certains pays voisins s’ils sont communistes.§!"
 BRA_prospect:0 "Prospection de ressources"
 BRA_prospect_desc:0 "Notre pays regorge de richesses naturelles, il nous suffit de les rechercher."
 BRA_prospect_oil:0 "Prospection pétrolière"
 BRA_prospect_oil_desc:0 "Si nous concentrons notre recherche de ressources uniquement sur le pétrole, nous avons plus de chances d’obtenir des résultats."
 bra_quereismo:0 "Département de presse et propagande"
 BRA_quereismo:0 "Quereismo varguiste"
 bra_quereismo_desc:0 "Getúlio Vargas, dirigeant magnanime de [BRA.GetNameDef] et du peuple [BRA.GetAdjective], est le plus grand espoir pour garantir le bien-être profond de notre nation et de son peuple. Sa permanence au pouvoir est essentielle pour le développement du pays et la prospérité de tous ses citoyens, assurée par les actions du nouveau Département de presse et propagande (DIP), dirigé par M. Filinto Muller."
 bra_reclaim_uruguay:0 "Cisplatine"
 bra_reclaim_uruguay_desc:0 "L’Uruguay fut une province brésilienne jusqu’à son indépendance contestée en 1825. Le Brésil, capable de contrer l’insubordination, préféra tolérer son existence à l’époque. Aujourd’hui, sans la Doctrine Monroe et reconnu comme une grande nation sur le plan international, nous devons récupérer ce qui nous appartient !"
 bra_regionalism:0 "9 juillet 1932"
 BRA_regionalism:0 "Régionalisme"
 bra_regionalism_desc:0 "Le 9 juillet 1932, l’État de São Paulo, étouffé par les conséquences de la Révolution de 1930, n’eut d’autre choix que de déclarer la guerre au régime de Vargas. Aujourd’hui, nous percevons des vérités indiscutables dans les cris des Paulistes depuis les tranchées. La dictature de Vargas est une offense à l’honneur d’un pays aussi divers culturellement et libre que [BRA.GetNameDef] : il est temps de redémocratiser la République."
 BRA_r_s_1:0 "UFMG"
 BRA_r_s_2:0 "USP"
 bra_sae:0 "Secrétariat aux affaires stratégiques"
 bra_sae_desc:0 "Le Secrétariat aux affaires stratégiques sera un organe de la Présidence de la République chargé de formuler des politiques publiques à long terme pour le développement économique et social de [BRA.GetNameDef]. Le SAE se verra déléguer la planification nationale à long terme et le développement de stratégies nationales pour assurer notre pouvoir et la maîtrise de nos territoires."
 bra_salte:0 "Plan SALTE"
 bra_salte_desc:0 "Le plan SALTE (Santé, Alimentation, Transports et Éducation) vise à stimuler et améliorer le développement des secteurs de la santé, de l’alimentation, des transports et de l’énergie dans tout [BRA.GetNameDef], contribuant ainsi à améliorer les conditions de vie de la population [BRA.GetAdjective]."
 bra_salvador:0 "Conseil national du pétrole"
 bra_salvador_desc:0 "Le gouvernement peut nationaliser les nouveaux puits de pétrole découverts à Salvador, garantissant la souveraineté du pays sur cette ressource essentielle."
 bra_secret_research:0 "Ministère des sciences et technologies"
 BRA_secret_research:0 "Département de recherches secrètes"
 bra_secret_research_desc:0 "La création de centres technologiques exclusivement dédiés aux projets essentiels des forces armées sera cruciale pour le maintien de la sécurité nationale."
 BRA_selva_tech_effect:0 "Crée le §YCentre d’instruction de guerre en jungle - CIGS§! dédié à la formation de notre armée pour défendre notre trésor national le plus précieux. Les unités §YInfanterie régulière§! se déplaceront et combattront dans la forêt tropicale comme si elles étaient dans leur arrière-cour. Toutes les autres §YForces spéciales§! gagnent un léger bonus pour leurs déplacements en jungle. Les bataillons §YMécanisés§! et §YMotorisés§! subissent un §HPénalité de combat§! de 0,25x."
 bra_sem_eixo:0 "Pacte de Rio"
 bra_sem_eixo_desc:0 "Nous, [BRA.GetAdjective]s unis de toutes les provinces, proposons de créer une culture, une civilisation, un mode de vie véritablement [BRA.GetAdjective]. Nous voulons rendre notre droit public conforme à nos réalités et aspirations. Ce gouvernement garantit l’unité de toutes les provinces, l’harmonie de toutes les classes, les initiatives de tous les individus, la supervision de l’État et la construction nationale."
 bra_sem_urss:0 "Notre révolution !"
 bra_sem_urss_desc:0 "Nous n’avons besoin d’aucune puissance globale génocidaire ; nous, [BRA.GetAdjective]s, serons le carburant de notre révolution !"
 bra_strike_dem_focus:0 "Diffuser le sentiment nationaliste"
 BRA_submarinos:0 "Sous-marins"
 bra_submarinos:0 "Sous-marins"
 bra_submarinos_desc:0 "Les sous-marins sont un moyen efficace de patrouiller les côtes et de couler les navires ennemis en haute mer."
 bra_sub_priv:0 "CLT"
 BRA_sub_priv:0 "Développer l’industrie privée"
 bra_sub_priv_desc:0 "Article 1 : Cette consolidation établit les normes régissant les relations et conditions de travail individuelles et collectives qui y sont définies."
 bra_sudam:0 "SUDAM"
 bra_sudam_desc:0 "La Superintendence de développement amazonien est un organe autonome du gouvernement fédéral [BRA.GetAdjective] chargé de promouvoir le développement de la région amazonienne, en générant des incitations fiscales et financières spéciales pour attirer des investisseurs privés nationaux et internationaux."
 bra_sudene:0 "SUDENE"
 bra_sudene_desc:0 "La Superintendence pour le développement du Nord-Est est une entité spéciale, administrative et financièrement autonome, dont la mission institutionnelle est de promouvoir le développement inclusif et durable de sa zone d’activité et l’intégration compétitive de sa base de production régionale dans l’économie nationale et internationale."
 BRA_technical_schools:0 "Écoles techniques"
 bra_technical_schools:0 "Écoles techniques"
 bra_technical_schools_desc:0 "Le parrainage d’écoles techniques par l’État formera davantage de techniciens et de spécialistes axés sur la production industrielle au [BRA.GetNameDef]."
 bra_tecnocratic_reform:0 "Technocratie institutionnelle"
 BRA_tecnocratic_reform:0 "Réinstaurer le système technocratique"
 bra_tecnocratic_reform_desc:0 "Pendant la Première République, la méritocratie et les sciences étaient très valorisées par les institutions privées et publiques. Le progrès scientifique de cette époque est indéniable, avec l’introduction de l’électricité et de l’acier par de grands entrepreneurs. Avec l’avènement de nouvelles technologies, la réadoption de ces valeurs bénéficiera considérablement au progrès technologique du pays."
 bra_tenenge:0 "TENENGE"
 bra_tenenge_desc:0 "La National Engineering Technique est une entreprise d’ingénierie électromécanique et de construction industrielle lourde axée sur les infrastructures portuaires et la gestion des voies navigables au [BRA.GetNameDef]. Nous pouvons la contracter pour étendre les opérations de Vale do Rio Doce et de Petrobrás à plus grande échelle."
 bra_territoriosfederais:0 "Installations fédérales en Amazonie"
 bra_territoriosfederais_desc:0 "Le Centre d’instruction de guerre en jungle (CIGS) est une organisation militaire de l’armée [BRA.GetAdjective] basée à Manaus, conçue pour former les chefs militaires de petites fractions, tels que les guerriers de la jungle, capables d’effectuer des missions militaires dans les zones les plus inhospitalières de la forêt amazonienne brésilienne et dans des environnements similaires."
 BRA_tiro_de_guerra:0 "Développer le 'Tiro de Guerra'"
 bra_tiro_de_guerra:0 "Tiro de Guerra"
 bra_tiro_de_guerra_desc:0 "Le 'Tiro de Guerra' a été institué comme politique de l’armée en 1916, consistant en la formation de base des réserves du pays en cas de déclaration de l’état de siège. L’extension de ce programme garantit que les colonnes de l’armée sont composées d’hommes mieux formés et plus proches d’être aptes au combat."
 bra_transatlantico:0 "Le pacte transatlantique"
 bra_tropas_1932_tooltip:0 "§YSoumettre à notre armée les vétérans de la guerre paulista.§!"
 bra_uiracu_tooltip:0 "Débloque les décisions d’annexion du bassin platine."
 bra_vale:0 "Vale do Rio Doce"
 bra_vale_desc:0 "Vale do Rio Doce sera l’entreprise d’État extractrice des minerais les plus divers, tels que la bauxite et le fer, et les retraitera en aluminium et acier."
 bra_ve_tooltip:0 "Acquiert le statut de province et un objectif de guerre contre l’Argentine, le Venezuela et la Bolivie"
 BRA_vital_espace:0 "Espace vital brésilien"
 bra_vital_espace:0 "L’État intégral"
 BRA_vital_espace_desc:0 "Les Brésiliens se sont montrés les plus dignes et nobles parmi ceux qui n’ont jamais foulé ce monde. La suprématie brésilienne sur le continent est incontestable. Le Brésil est une règle naturelle, absolue et indiscutable, doté du droit complet de conquête de ses voisins inférieurs."
 bra_vital_espace_desc:0 "Pour progresser en paix, voir ses efforts fructifier et atteindre du prestige à l’intérieur comme à l’extérieur, une nation doit avoir une parfaite conscience du principe d’autorité. Nous avons besoin d’une autorité capable de prendre des initiatives au bénéfice de tous, partout."
 bra_vitrine_tooltip:0 "Les effets de ce focus ne seront révélés que lorsque vous choisirez votre chemin spécifique sur le futur de Vargas."
 bra_zfm:0 "Zone franche de Manaus"
 bra_zfm_desc:0 "La zone franche de Manaus sera une zone industrielle [BRA.GetAdjective] à Manaus pour stimuler le développement économique de l’Amazonie occidentale. Le centre industriel prévoit d’accueillir environ 700 entreprises."
 BRA_2_prestes_column_desc:0 "La Deuxième colonne Prestes inclut un soulèvement populaire, dirigé par lui-même, parcourant le pays à la recherche du soutien politique de la classe ouvrière en faveur des idéologies marxistes révolutionnaires."
 BRA_almirantado_desc:0 "Le comportement des navires brésiliens et les tactiques des commandants de la Marine doivent être réajustés à la guerre navale moderne. Nous pouvons prendre pour expérience la Révolte de l’Armada de 1893."
 BRA_ana_guerra_civil_desc:0 "La guerre civile brésilienne s’est avérée être un terrain d’essai possible et efficace pour les tactiques de combat."
 BRA_ana_mineira_desc:0 "Pendant le conflit, les troupes du Minas Gerais et les officiers miniers qui dirigeaient l’armée loyaliste étaient conscients de l’incapacité de São Paulo à maintenir la guerre longtemps. Ainsi, les mineurs ont creusé des tranchées à Minas et Rio, soutenues par des mitrailleuses fixes, et leur progression lente mais constante était soutenue par le feu de l’artillerie nationale."
 BRA_ana_paulista_desc:0 "Pendant le conflit, les forces publiques paulistes ont adopté la guerre mobile, et les plans 'blitz' paulistes prévoyaient un mouvement rapide et fulgurant vers Rio de Janeiro par la vallée de Paraíba, soutenu par l’aide que pourraient apporter les autres États."
 BRA_anhanguera_desc:0 "L’autoroute Via Anhanguera sera le plus grand complexe du pays, et ses routes 'affluentes' relieront l’ensemble du pays avec une capacité jamais vue auparavant."
 BRA_armor_desc:0 "Pendant la guerre civile, les deux camps ont utilisé des chars de combat. La victoire de l’Union a été en partie décidée par l’usage de ces monstres au combat. Leurs modèles futurs seront d’un énorme bénéfice pour l’armée."
 BRA_art_desc:0 "Disposant de plus de ressources que son adversaire, l’artillerie de l’Union, importée de l’étranger, était précise et capable de réduire à néant une escouade entière à São Paulo en un seul tir."
 BRA_barragem_desc:0 "Avec patience, supériorité technologique et l’utilisation de balles plutôt que d’hommes, les troupes de Minas Gerais furent les plus efficaces de la guerre, offrant au Brésil une victoire rapide sur les Paulistes. L’héritage minier ne doit pas être nié."
 BRA_belem_porto_desc:0 "La construction du port de Belém offre au pays une base stratégique au nord, capable de soutenir les vastes flottes de l’Union et de servir de base aux opérations d’invasion au nord de l’équateur."
 BRA_blitz_desc:0 "Les Paulistes nous ont prouvé que, même en étant en infériorité numérique, la vitesse et l’autonomie des troupes garantissent le succès au combat. Adoptons ces tactiques pour assurer une meilleure efficacité et une victoire rapide sur nos ennemis."
 BRA_bombardeiro_desc:0 "Utilisés pendant la guerre civile par l’Union, les bombardiers sont devenus plus précis et létaux. Brigadier Eduardo Gomes, lors du bombardement de Campinas, a affaibli une grande partie de l’infrastructure de la ville avec une escouade minime. Nous l’établirons comme leader de l’Armée de l’air."
 BRA_brasilia_desc:0 "Déplacer la capitale vers l’intérieur était l’un des objectifs nationaux depuis l’Empire de Pierre II, non seulement pour la sécurité nationale, empêchant la capitale d’être sujette aux invasions navales, mais aussi pour garantir le développement de l’intérieur. Commençons dès maintenant la construction de cette nouvelle capitale."
 BRA_caca_desc:0 "Avec la création du ministère de l’Air, le gouvernement peut gérer l’expansion de cette nouvelle branche des Forces armées de la République."
 BRA_CAS_desc:0 "Des avions volant à quelques mètres du sol, avec de puissantes mitrailleuses et une vitesse inégalée. Rien de plus létal."
 BRA_cepsn_desc:0 "Le Plan national de l’acier a été établi pour définir les régions d’extraction du fer et mettre en œuvre la construction de centres sidérurgiques au Brésil."
 BRA_cmsp_desc:0 "La métropole de São Paulo est le plus grand centre industriel du pays, d’Amérique latine et, avec le soutien du gouvernement, l’un des plus grands, sinon le plus grand, d’Amérique."
 BRA_cmvrg_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du Rio Grande, couvrant le triangle ouest paulista et mineiro."
 BRA_cmvrparana_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du Rio Paraná, couvrant le sud de São Paulo et presque l’intégralité du Paraná."
 BRA_cmvrparnaiba_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du Rio Parnaíba, dans le nord-est du Brésil."
 BRA_cruzadores_desc:0 "Depuis l’indépendance, le Brésil possédait les plus grandes bêtes de mer dans son arsenal. Nous ne ferons pas autrement."
 BRA_CTEF_CLT_desc:0 "Le Conseil technique des économies et finances a été établi pour conseiller le Président sur les décisions économiques et stratégiques du pays."
 BRA_elet_1_desc:0 "L’extension du réseau électrique dans toutes les capitales et les centres urbains comme l’Ouest Paulista et l’Esprit Saint améliorera la qualité de vie des Brésiliens et l’efficacité de l’industrie nationale."
 BRA_elet_2_desc:0 "Étendre le réseau aux régions peu industrialisées telles que le Triangulo Mineiro, le Paraná et Bahia permettra de créer de nouveaux centres de production et de progrès."
 BRA_eng_mart_desc:0 "L’immigrant Giuseppe Martinelli a fait fortune au Brésil grâce au commerce transatlantique à São Paulo. Il visait à construire le plus haut bâtiment d’Amérique latine, optimisant les charges et ressources pour assurer la construction du monument. Nous pouvons beaucoup en apprendre."
 BRA_equip_ind_desc:0 "Au lieu de motoriser leur infanterie, les mineurs ont choisi d’augmenter leur efficacité au combat. L’équipement de l’infanterie légaliste était plus moderne, rapide et précis que celui des Paulistes, facilitant la défense des tranchées."
 BRA_federal_institutes_desc:0 "Les instituts fédéraux sont des branches universitaires conçues uniquement pour l’innovation technologique pratique."
 BRA_fiesp_desc:0 "La Fédération des industries de l’État de São Paulo représente des milliers de syndicats et entreprises, articulant les plans du gouvernement et unissant affaires et innovation, encourageant notre capacité à créer de nouveaux résultats industriels et innovations de consommation et militaires."
 BRA_fundar_petrobras_desc:0 "Petrobras sera la compagnie pétrolière nationale, responsable de l’exploration, du raffinage et de l’expansion des puits de pétrole à l’échelle nationale."
 BRA_fundar_vale_desc:0 "Vale do Rio Doce sera la compagnie minière nationale pour divers minéraux tels que bauxite et fer, ainsi que pour le retraitement en aluminium et acier de la République."
 BRA_glory_to_brasil_desc:0 "Le Brésil est un pays craint, respecté et admiré par toutes les nations. Son rôle historique aux côtés d’alliés et rivaux, notamment les États-Unis, prouve qu’il doit protéger et contrôler sa portion du continent américain. Contester la doctrine Monroe en Amérique du Sud est l’objectif de nos diplomates."
 BRA_IRFM_desc:0 "Les usines Industrias Reunidas Matarazzo ont été fondées par l’immigrant Francesco Matarazzo dans les années 20. Le groupe de 360 usines de fabrication peut être étendu pour répondre à la majeure partie de la demande industrielle du pays."
 BRA_itabira_desc:0 "Les mines d’Itabira-MG font partie du Quadrilatère du Fer, le plus grand gisement de fer et de bauxite du pays et l’un des plus grands au monde. Garantir que les minéraux extraits soient utilisés uniquement par le Brésil assure notre souveraineté minérale."
 BRA_iti_desc:0 "L’Institut de technologie industrielle mène l’innovation des technologies de production nationale. Le gouvernement fédéral peut le soutenir pour accroître significativement la taille et l’efficacité des industries nationales."
 BRA_lobato_desc:0 "Un incident entre voisins à Lobato, Bahia, a remis en question l’affirmation de l’État selon laquelle il n’y a pas de pétrole dans le pays."
 BRA_mec_desc:0 "Une des plus grandes réalisations de l’État de São Paulo pendant la guerre fut la construction de trains blindés pour le transport du café. Équipés de plaques métalliques, mitrailleuses et canons, ces trains constituaient une première mondiale."
 BRA_milicias_desc:0 "Les milices populaires sont un mécanisme efficace d’intégration militaire populaire, renforcé par l’exposition intense à la propagande de ces organisations."
 BRA_military_projects_desc:0 "Les complexes éducatifs du pays peuvent être utiles pour l’avancement des technologies de guerre."
 BRA_mobilizacao_ind_desc:0 "Par des actions, décrets et clauses constitutionnelles, l’Union peut augmenter la vitesse et l’ampleur de l’état d’urgence, améliorant considérablement la capacité du Brésil à répondre à une guerre."
 BRA_modernizacao_aerea_desc:0 "L’institution des forces aériennes est essentielle pour garantir la domination brésilienne dans le ciel."
 BRA_modernizacao_armadas_desc:0 "La création d’un ministère intégrant toutes les armes des forces armées permettra la manœuvre politique de l’armée et évitera les conflits futurs entre leurs dirigeants pour des intérêts politiques."
 BRA_modernizacao_marinha_desc:0 "Moderniser la Marine est essentiel pour garantir la puissance brésilienne en mer. Floriano Peixoto fut le premier président-amiral et préserva notre héritage naval, que nous devons conserver."
 BRA_mod_mad_mamo_desc:0 "Le Madeira-Mamoré fut construit par Percival Farquhar pour interconnecter l’Amérique. Moderniser et étendre ces lignes peut accroître la mobilité de nos troupes dans le Nord."
 BRA_mod_sb_desc:0 "La Santa Catarina relie l’État du Rio Grande do Sul au Sud-Est. Ces centres, à forte production et consommation, ainsi que zones sensibles militairement et frontalières de nos ennemis historiques, constituent le cœur de l’armée brésilienne. Améliorer cette connexion est essentiel pour la défense et la production."
 BRA_mod_soroc_desc:0 "La Sorocabana, partie du réseau ferroviaire de São Paulo et Paraná, fait partie du plus grand réseau du pays. L’élargir signifie augmenter notre capacité de flux et de mouvement militaire."
 BRA_more_federal_universities_desc:0 "Plus d’universités signifie plus d’étudiants et plus de progrès. Transformer de petites facultés de l’intérieur en grands centres éducatifs devrait être une priorité du gouvernement."
 BRA_mot_desc:0 "Pendant la guerre civile, l’armée pauliste a approprié les principaux centres de production automobile de la capitale pour déplacer rapidement ses troupes à travers les tranchées loyalistes."
 BRA_national_institutes_desc:0 "Créer des instituts nationaux comme centres de recherche avancés en grande quantité accélère le progrès technologique du pays."
 BRA_new_constitution_desc:0 "Le Président de la République, dont le corps d’officiers est issu d’un coup d’État en 1930, ignore la volonté nationale et les cris du peuple brésilien pour la liberté et le droit de choisir ses représentants. La régulation industrielle centralisée est devenue inefficace et lourde. Il incombe au Brésil de rédiger sa propre Magna Carta."
 BRA_nuclear_research_bureau_desc:0 "Avec un centre de recherche nucléaire, le Brésil peut développer à la fois la capacité de destruction de ses ennemis et le potentiel d’énergie infinie."
 BRA_obras_exterior_desc:0 "Ayant été principalement construit par les Britanniques et Américains, certaines infrastructures essentielles au fonctionnement du pays et générant de grands profits doivent bénéficier aux nationaux. Le gouvernement doit le garantir par décret."
 BRA_patriotic_effort_desc:0 "La glorieuse nation brésilienne exige de ses citoyens un engagement pour le maintien, la protection et le développement du pays. Les Brésiliens doivent répondre à ces besoins, en valorisant le bien national et leurs propres libertés."
 BRA_paulista_revanchism_desc:0 "Les entrepreneurs de São Paulo ont toujours été parmi les plus dévoués et travailleurs pour l’expansion industrielle. Leur esprit pionnier doit être adopté comme politique d’État, avec l’avis du président pour construire l’infrastructure nationale."
 BRA_petroleo_salvador_desc:0 "Le gouvernement peut nationaliser les nouveaux puits de pétrole découverts à Salvador, garantissant la souveraineté du pays sur cette ressource essentielle."
 BRA_politechnical_colleges_desc:0 "La construction de collèges polytechniques dans les grands centres urbains permettra de former des milliers de jeunes aptes à servir le pays dans leurs fonctions productives."
 BRA_quereismo_desc:0 "Getúlio Vargas, dirigeant magnanime du Brésil et des Brésiliens, est le meilleur espoir pour garantir les biens de la nation. Sa permanence au pouvoir est essentielle pour le développement du pays."
 BRA_reclaim_uruguay_desc:0 "L’Uruguay fut une province brésilienne jusqu’à son indépendance contestable en 1825. Le Brésil, capable de contrer l’insubordination, préféra tolérer son existence. Aujourd’hui, sans la Doctrine Monroe et reconnu comme une grande nation internationale, nous devons récupérer ce qui nous appartient !"
 BRA_regionalism_desc:0 "Les nombreuses parties intégrantes du territoire national ne sont pas égales ; leurs différences intrinsèques sont avantageuses pour elles-mêmes et leurs habitants. Le séparatisme n’est qu’un reflet de la privation des libertés individuelles, comme démontré en 1932. Garantir ces libertés pour le bien de l’État et de la nation est nécessaire."
 BRA_r_s_1_desc:0 "L’Université du Minas Gerais comprend un ensemble de petites facultés capables de former de grands génies pour le pays. Ses professionnels et scientifiques façonneront le Brésil."
 BRA_r_s_2_desc:0 "L’Université de São Paulo est le complexe académique le plus important d’Amérique latine et l’un des leaders du développement technologique national, ainsi que le plus grand centre d’innovation du pays."
 BRA_secret_research_desc:0 "La création de centres technologiques exclusivement dédiés aux projets importants des forces armées sera essentielle pour le maintien de la sécurité nationale."
 BRA_submarinos_desc:0 "Les sous-marins sont un moyen efficace de patrouiller les côtes et de couler les navires ennemis en haute mer."
 BRA_sub_priv_desc:0 "Par des garanties et exonérations, le gouvernement fédéral peut encourager la création de nouveaux ateliers et manufactures à travers le pays."
 BRA_technical_schools_desc:0 "Le parrainage des écoles techniques par l’État forme au Brésil davantage de techniciens et d’experts axés sur la production industrielle."
 BRA_tecnocratic_reform_desc:0 "Pendant la Première République, la méritocratie et les sciences étaient extrêmement valorisées par les institutions privées et publiques. Le progrès scientifique de cette époque est indéniable, avec l’introduction de l’électricité et de l’acier. Avec l’avènement de nouvelles technologies, la réadoption de ces valeurs bénéficiera significativement au progrès technologique du pays."
 BRA_tiro_de_guerra_desc:0 "La guerre de Tyre fut instituée comme politique de l’armée en 1916, consistant en la formation de base des réserves non appelées. L’expansion de ce programme garantit que les colonnes de l’armée soient composées d’hommes mieux formés et aptes au combat."

 bra_naval_logistics_desc:0 "La mer nous appelle, le moment est venu pour une transformation radicale."
 bra_shared_naval_experience_desc:0 "Pour dominer l’Atlantique, nous devrons partager notre expérience avec nos alliés."
 bra_shared_naval_experience_tt:0 "§Y[ROOT.GetNameDefCap]§! et ses §Yalliés avec une flotte§! obtiendront :"

 bra_african_initiative_desc:0 "Nous devons chercher des alliés de l’autre côté du continent ; ces pays peuvent être plus pauvres, mais ensemble ils pourraient contribuer significativement."
 bra_invite_south_africa_desc:0 "En tant que pays développé gardant le passage entre l’Atlantique et l’océan Indien, l’Afrique du Sud pourrait être un excellent allié."
 bra_invite_canada_desc:0 "En tant que pays développé gardant le passage entre l’Atlantique et l’océan Indien, le Canada pourrait être un excellent allié."
 bra_carribean_diplomacy_desc:0 "Les pays des Caraïbes sont clés pour contrôler non seulement leur environnement mais aussi la mer des Sargasses."
 BRA_invite_andean_countries:0 "Inviter les pays andins"
 BRA_invite_andean_countries_desc:0 "Voyons si nous pouvons rallier le Pérou, le Chili et la Bolivie."
 BRA_invite_platine_countries:0 "Inviter les pays platines"
 BRA_invite_platine_countries_desc:0 "Nos voisins du Sud devraient devenir nos alliés."
 BRA_allies_in_the_north:0 "Alliés dans le Nord"
 BRA_allies_in_the_north_desc:0 "Nos voisins du Nord devraient devenir nos alliés."
 BRA_invite_central_american_countries:0 "Inviter les pays d’Amérique centrale"
 BRA_invite_central_american_countries_desc:0 "Nos voisins du Nord devraient devenir nos alliés."
bra_rural_elite:0 "Les barons du café"
bra_rural_elite_desc:0 "Malgré l'inauguration de Vargas comme président, les élites rurales contrôlent encore la politique au niveau municipal et détiennent presque tout le pouvoir économique du pays. Ce monopole sur les finances de la république empêche l'utilisation du capital pour développer le secteur industriel."
bra_industrial_elite:0 "Entreprises de construction"
bra_industrial_elite_desc:0 "Un pays rural comme le nôtre trouve coûteux d'investir dans le développement des infrastructures et de l'industrie. Pour garantir la croissance, le gouvernement doit surtaxer l'économie et imposer des contraintes budgétaires pour payer ses entrepreneurs."
bra_tank_designer_2:0 "Ingénieurs spécialisés S.A"
bra_refining_concern:0 "Petrobrás S/A"
bra_1930:0 "La révolution de 1930"
bra_1930_2:0 "La révolution de 1930"
bra_instabilidade:0 "Politique partisane"
bra_instabilidade_desc:0 "Depuis la fondation de l'Empire du Brésil le 7 septembre 1822, la voix dans les décisions politiques a toujours été exclusive aux grands propriétaires terriens, aux hommes d'affaires influents et aux politiciens de la haute société. Ce n'est que récemment, avec l'introduction de la Constitution de 1934, que les [BRA.GetAdjective]s des classes inférieure et moyenne ont l'opportunité de se faire entendre. Cette rupture abrupte avec l'ancien ordre a entraîné une division absolue et radicale de l'opinion publique entre l'ANL, l'UDN, l'AIB et l'État nouveau."
bra_1930_desc:0 "En 1930, les anciennes élites de la république ont été expulsées du pouvoir par les Tenenentistas de Vargas. Le coup d'État et la constitution qui a suivi ont déclenché la guerre civile brésilienne. Que la prise de pouvoir de Getúlio ait été pour le bien ou le mal, elle divise encore aujourd'hui l'opinion de nombreux [BRA.GetAdjective]s."
bra_1930_2_desc:0 "En 1930, les anciennes élites de la république ont été expulsées du pouvoir par les Tenenentistas de Vargas. Le coup d'État et la constitution qui a suivi ont déclenché la guerre civile brésilienne. Que la prise de pouvoir de Getúlio ait été pour le bien ou le mal, elle divise encore aujourd'hui l'opinion de nombreux [BRA.GetAdjective]s."
bra_eficiencia_1:0 "Conseils industriels"
bra_eficiencia_1_desc:0 "Nous avons des conseils de magnats de l'industrie de l'ancienne république qui nous aident à gérer notre économie."
bra_eficiencia_2:0 "Techniciens industriels"
bra_eficiencia_2_desc:0 "Nous avons des économistes et des techniciens spécialisés et expérimentés qui nous aident à planifier notre expansion industrielle."
bra_eficiencia_3:0 "Entrepreneurs industriels"
bra_eficiencia_3_desc:0 "Nous avons des magnats industriels étrangers et des leaders industriels nationaux administrant le fonctionnement et l'organisation de nos complexes industriels."
bra_eficiencia_4:0 "Réseaux industriels"
bra_eficiencia_4_desc:0 "Nous avons des groupes nationaux entiers, sociétés et entrepreneurs responsables de presque toute notre machine de guerre et nos industries civiles, avec des investissements se comptant en milliards de dollars."
bra_eficiencia_bndes:0 "Développement national"
bra_eficiencia_bndes_desc:0 "Le projet national-développementaliste porte l'espoir d'étendre largement les bénéfices économiques, politiques et sociaux de la modernité à l'ensemble de la société [BRA.GetAdjective]. Nous résoudrons cette dualité par l'industrialisation, conséquence du développement, de la mobilisation de capitaux et de l'incorporation du progrès technique."
bra_eficiencia_gerdau_1:0 "Développement national"
bra_eficiencia_gerdau_1_desc:0 "Le projet national-développementaliste porte l'espoir d'étendre largement les bénéfices économiques, politiques et sociaux de la modernité à l'ensemble de la société [BRA.GetAdjective]. Nous résoudrons cette dualité par l'industrialisation, conséquence du développement, de la mobilisation de capitaux et de l'incorporation du progrès technique."
bra_eficiencia_gerdau_2:0 "Le miracle économique [BRA.GetAdjective]"
bra_eficiencia_gerdau_2_desc:0 "L'établissement de nos industries lourdes, l'organisation d'un solide marché de consommation national, l'abondance d'une main-d'œuvre technique et l'urbanisation résultant de la mécanisation des champs ont rendu l'économie nationale irrésistible. Désormais, personne ne peut freiner ce pays."
bra_eficiencia_tenenge_1:0 "Développement national"
bra_eficiencia_tenenge_1_desc:0 "Le projet national-développementaliste porte l'espoir d'étendre largement les bénéfices économiques, politiques et sociaux de la modernité à l'ensemble de la société [BRA.GetAdjective]. Nous résoudrons cette dualité par l'industrialisation, conséquence du développement, de la mobilisation de capitaux et de l'incorporation du progrès technique."
bra_eficiencia_tenenge_2:0 "Le miracle économique [BRA.GetAdjective]"
bra_eficiencia_tenenge_2_desc:0 "L'établissement de nos industries lourdes, l'organisation d'un solide marché de consommation national, l'abondance d'une main-d'œuvre technique et l'urbanisation résultant de la mécanisation des champs ont rendu l'économie nationale irrésistible. Désormais, personne ne peut freiner ce pays."
bra_eficiencia_5:0 "Réseau électrique modernisé"
bra_eficiencia_5_desc:0 "Notre réseau dans les grandes zones métropolitaines a été modernisé et réorganisé pour être plus efficace."
bra_eficiencia_6:0 "Réseau électrique étendu"
bra_eficiencia_6_desc:0 "Nous avons installé un réseau électrique moderne dans nos zones rurales et périphériques."
bra_eficiencia_7:0 "Réseau électrique étendu et modernisé"
bra_eficiencia_7_desc:0 "Notre réseau électrique national est maintenant pleinement étendu et fonctionnel dans les zones critiques du pays."
bra_eficiencia_8:0 "[BRA.GetNameDefCap] : Aimez-le ou quittez-le"
bra_eficiencia_8_desc:0 "Avec notre industrie réorganisée, étendue et modernisée, nous pouvons désormais mobiliser pleinement nos complexes industriels pour répondre aux besoins de la guerre."
bra_influencia_comunista_idea:0 "Influence [BRA.GetAdjective]"
bra_influencia_comunista_idea_desc:0 "[BRA.GetNameDefCap] influence notre politique à travers la propagande et le commerce."

bra_polaca_idea:0 "La Polaca"
bra_polaca_idea_desc:0 "Cette nouvelle constitution imposée par Son Excellence, le Président de la République Getúlio Vargas, consolide son pouvoir selon un modèle paternaliste et, selon l'ANL et les titans du PRP disparu, fasciste. Cela garantira au Président la marge nécessaire pour mener à bien les réformes indispensables et construire un ministère fonctionnel et efficace."

bra_mercosul_outro:0 "Membre du DefenSul"
bra_mercosul_outro_desc:0 "Ce pays est membre du traité de défense de l'hémisphère sud."

bra_ciclocana_idea:0 "Première expansion de la frontière agricole"
bra_ciclosoja_idea:0 "Deuxième expansion de la frontière agricole"
bra_etanol_idea:0 "Programme national de l'alcool"

bra_antropofagia:0 "Anthropophagie culturelle"
bra_antropofagia_desc:0 "Bien que récemment décrite par les Modernistes, l'absorption des coutumes d'autres cultures et leur adaptation à la réalité nationale constitue le fondement central de l'identité [BRA.GetAdjective]. [BRA.GetNameDefCap] n'est pas un pays formé par différentes cultures coexistant dans un même espace, mais par une seule culture [BRA.GetAdjective], organisée par l'hybridation des cultures européennes, africaines, asiatiques et indigènes. Un [BRA.GetAdjective], donc, ne peut pas être identifié par sa race ou ses coutumes, mais seulement par l'utilisation de la langue maternelle et le sentiment d'appartenance à [BRA.GetNameDef]. Cette singularité a forgé un peuple désenchanté et un gouvernement indifférent aux affaires extérieures, mais très résilient et tolérant envers les autres cultures et citoyens loyaux à l'unicité [BRA.GetAdjective]."

bra_bandeirantes:0 "Bandeirantes"
bra_bandeirantes_desc:0 "L'armée brésilienne n'a pas été organisée dans une optique impérialiste ou de conquête, et n'a pas adopté les méthodes européennes modernes de guerre. Les axiomes principaux de l'armée proviennent des Bandeirantes, colons et expéditionnaires ayant ouvert la colonisation de l'intérieur du Brésil en utilisant les sentiers indigènes et l'aide des populations locales durant l'époque coloniale. L'armée [BRA.GetAdjective] est donc spécialisée dans le combat sur et pour les terres [BRA.GetAdjective], dont la plupart restent encore vierges."

