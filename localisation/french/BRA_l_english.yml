#ÉVÉNEMENTS
bra.1:0 "La fameuse petite caisse d’Adhemar"
bra.1.t:0 "La fameuse petite caisse d’Adhemar"
bra.1.d:0 "Alors que nous sommes enfin au seuil d’une nouvelle démocratisation, nous devons choisir qui sera notre dirigeant pour les cinq prochaines années. Adhemar de Barros, ancien intervenant de São Paulo : il a construit des routes, développé les industries et reconstruit l’État. Armando Sales, défenseur acharné de la démocratie : il a gouverné São Paulo en offrant à l’État les meilleurs standards éducatifs du continent. Le brigadier Eduardo Gomes, ancien membre de l’Armée de l’air brésilienne : figure centrale des Tenentistes encore actifs. Júlio Prestes, élu président en 1930 avant d’être déposé lors du coup d’État de 1930 : membre de l’élite agraire et ancien chef du PRP. L’heure est venue de décider."
bra.1.a:0 "S’il a reconstruit São Paulo, pourquoi ne pourrait-il pas reconstruire [BRA.GetNameDef] ?"
bra.1.b:0 "Pour notre démocratie, il nous faut quelqu’un qui ne l’a jamais abandonnée."
bra.1.c:0 "Ce que je ne comprends pas, c’est comment une nation comme le Brésil, après des années de tradition démocratique, a pu régresser vers une dictature qui nous humilie aux yeux du monde civilisé !"
bra.1.e:0 "Pour nous, la sagesse se construit à travers les conséquences de nos choix."
bra.1.f:0 "L’avenir n’est pas ce que nous craignons ; c’est ce que nous osons atteindre !"
bra.2:0 "Le plan Cohen"
bra.2.t:0 "Le plan Cohen"
bra.2.d:0 "Par l’intermédiaire du capitaine Mourão, un document théoriquement rédigé par l’ANL est arrivé entre vos mains. Il contient un plan détaillé visant à assassiner les candidats aux élections de 1938, Armando Sales et José Américo. Nous devons agir, même si nos services de renseignement ne peuvent confirmer la véracité de ce document."
bra.2.a:0 "Apportez le micro ! Nous ne pouvons pas perdre plus de temps."
bra.2.b:0 "Arrêtez le capitaine et brûlez ce document ! Cette farce ne doit pas devenir endémique."
bra.2.c:0 "Nous devons adapter l’organisme politique aux nécessités de la patrie."
bra.2.e:0 "Nous ne pouvons pas les priver de leurs libertés en réponse à un document probablement faux !"

bra.3:0 "Le Congrès dissous !"
bra.3.t:0 "Le Congrès dissous !"
bra.3.d:0 "Face à la menace communiste révélée par le très honorable capitaine Mourão, le président Getúlio Vargas a décidé de prendre la mesure ultime pour prévenir un futur coup d’État socialiste sur notre territoire. Après que le maréchal Dutra et le général Góes Monteiro ont poussé le Congrès à déclarer l’état de siège, Son Excellence a choisi de fermer purement et simplement le Congrès. Il a ainsi proclamé une nouvelle constitution, déchirant la seconde en sept ans. La *Polaca* élargira les pouvoirs du Président, criminalisera les partis politiques et démantèlera les forces socialistes au sein du Congrès national."
bra.3.a:0 "Nous répondons aux aspirations légitimes du peuple [BRA.GetAdjective]."

bra.5:0 "L’Empereur du Brésil"
bra.5.t:0 "L’Empereur du Brésil"
bra.5.d:0 "Maintenant que l’Empereur a été acclamé par son peuple, sa ligne idéologique est questionnée. Les Intégralistes affirment qu’il est un expansionniste visionnaire qui restaurera la gloire du Brésil. D’autres estiment qu’un Empereur, quelle que soit son idéologie, doit rester avant tout prudent et modéré. Qui a raison ?"
bra.5.b:0 "Pour l’amour du Christ, c’est un Empereur, pas un politicien !"
bra.5.a:0 "Un Empereur doit être sage et prudent, avant tout."

bra.6:0 "Invitation de [BRA.GetNameDefCap] à rejoindre leur faction"
bra.6.t:0 "Invitation de [BRA.GetNameDefCap] à rejoindre leur faction"
bra.6.d:0 "Après une percée en diplomatie internationale et son accession au rang de nouvelle grande puissance, [BRA.GetNameDef] nous invite à rejoindre sa faction afin de garantir prospérité et défense assurée. Allons-nous accepter ?"
bra.6.a:0 "Bien sûr !"
bra.6.b:0 "Plutôt pas."

bra.7:0 "Demande de [BRA.GetNameDefCap] pour rejoindre notre faction"
bra.7.t:0 "[BRA.GetNameDefCap] veut rejoindre notre faction"
bra.7.d:0 "[BRA.GetNameDefCap] nous demande d’intégrer notre faction pour nous assister sur la scène mondiale. En pleine guerre, nous devons nous demander : avons-nous besoin du soutien sud-américain ?"
bra.7.a:0 "Oui, évidemment !"
bra.7.b:0 "Nous n’avons pas besoin d’eux !"

bra.8:0 "Invitation de [BRA.GetNameDefCap] à rejoindre leur faction"
bra.8.t:0 "[BRA.GetNameDefCap] propose une alliance"
bra.8.d:0 "Après une percée en diplomatie internationale et son accession au rang de nouvelle grande puissance, [BRA.GetNameDef] nous invite à rejoindre sa faction afin de garantir prospérité et défense assurée. Allons-nous accepter ?"
bra.8.a:0 "Bien sûr !"
bra.8.b:0 "Plutôt pas."

bra.10:0 "Ô chère patrie"
bra.10.t:0 "Ô chère patrie"
bra.10.d:0 "Nous sommes en 1936, 114ᵉ année d’Indépendance et 47ᵉ de la République. Il y a six ans, M. Getúlio Vargas a assumé avec honneur la présidence de la République des États-Unis du Brésil. Depuis, la guerre civile de 1932 a eu lieu, suivie par l’industrialisation rapide du noble État de São Paulo. En ce moment, dans les premiers pas de son industrialisation, [BRA.GetNameDef] dispute à ses voisins inférieurs le contrôle de l’Atlantique Sud. En Europe, [GER.GetLeader] a réveillé [GER.GetNameDef] et promis le salut. Aux [USA.GetNameDef], la crise affame des milliers de personnes et en laisse d’autres sans abri. En Afrique et en Asie, [FRA.GetNameDef] et [ENG.GetNameDef] luttent pour maintenir leurs empires en vie. C’est notre heure : périr ou régner. Gloire à [BRA.GetNameDef] !"
bra.10.a:0 "Éternellement couché dans un berceau splendide, au son de la mer et sous la lumière profonde du ciel."

bra.12:0 "Déchirons le vert et jaune"
bra.12.t:0 "Déchirons le vert et jaune"
bra.12.d:0 "Alors que le nouveau gouvernement national se forme, guidé uniquement par nos politiciens et notre peuple, l’État fédéral installé se retire, cherchant l’exil sur le continent brésilien. Avec lui disparaît leur idéologie tordue, imposée durant tout notre temps en tant que sujets du DIP. Désormais, notre destin est entre nos mains."
bra.12.a:0 "Libres ! Enfin !"

bra.13:0 "Vargas assassiné !"
bra.13.t:0 "Vargas assassiné !"
bra.13.d:0 "Lors de la suprême manifestation de libération du Prolétariat, des dizaines de partisans, soutenus par des milliers d’autres dans les rues de Rio de Janeiro, ont encerclé et envahi le Palácio do Cacete. En quelques heures, le chef bourgeois Getúlio Vargas était mort, et M. Luís Carlos Prestes était déclaré nouveau président de la République."
bra.13.a:0 "Do svidaniya, monsieur Vargas."

bra.14:0 "Vargas exilé !"
bra.14.t:0 "Vargas exilé !"
bra.14.d:0 "Lors de la suprême manifestation de la citoyenneté de tous les peuples et races, des milliers d’Intégralistes ont encerclé et menacé d’envahir le Palácio do Cacete. En quelques heures, le président Vargas s’est réfugié au Rio Grande do Sul et le Dr. Plínio Salgado a pris son poste en tant que nouveau président de la République."
bra.14.a:0 "Anauê !"

bra.15:0 "Vargas retranché !"
bra.15.t:0 "Vargas retranché !"
bra.15.d:0 "Créé pour coordonner la propagande de l’État national, le Département de la Presse et de la Propagande, associé aux secteurs de renseignement du gouvernement fédéral, garantira la perpétuation au pouvoir du président de la République, M. Getúlio Vargas."
bra.15.a:0 "Le régime constitutionnel a perdu toute valeur pratique."

bra.16:0 "Vargas destitué !"
bra.16.t:0 "Vargas destitué !"
bra.16.d:0 "Lors de la suprême manifestation de liberté de la patrie, les secteurs associés de l’armée, de la marine et de l’aviation ont encerclé le Palácio do Cacete en soutien au Congrès national. En quelques heures, M. Getúlio Vargas a rendu la République au Congrès national et au peuple [BRA.GetAdjective], sous la pression d’un corps restreint de généraux et d’amiraux."
bra.16.a:0 "Pour nous autres mortels, la sagesse se construit à travers les conséquences de nos choix."

bra.17.t:0 "Une épidémie ravage la plantation de Belterra"
bra.17.d:0 "La plantation de caoutchouc de Belterra a été créée par la société Ford afin de produire du caoutchouc pour ses usines et ne pas dépendre de fournisseurs extérieurs. Il s’agissait en fait de la seconde plantation du pays, la première, Fordlândia, ayant fermé en 1934. La nouvelle devait être plus rentable en plantant les hévéas plus serrés, augmentant ainsi la production par surface. Mais cette pratique s’est retournée contre eux lorsqu’une maladie contagieuse a soudainement ravagé presque toute la plantation, bloquant la production pour au moins cinq ans. Il semble que le caoutchouc de plantation ne pourra pas contribuer à la production d’équipement militaire dans un avenir proche, à moins d’envoyer des travailleurs récolter du caoutchouc sauvage, une tâche bien plus ardue."
bra.17.a:0 "Quelle tragédie."
