#Politicians#
POLITICS_DUTRA_DESC:0 "Eurico Gaspar Dutra est né dans la petite ville de Cuiabá, dans la province du Mato Grosso. Son intérêt pour l’armée et sa grande volonté de servir l’ont poussé à falsifier des documents pour s’engager à 19 ans et entrer à l’Académie militaire de Praia Vermelha, à Rio de Janeiro, qu’il termine avec succès à 23 ans.\n\nSa carrière militaire est marquée par sa spécialisation dans l’artillerie, le génie militaire et les tactiques de l’armée, ainsi que par sa loyauté envers la République brésilienne et ses dirigeants, en réprimant diverses révoltes et soulèvements dans l’arrière-pays.\n\nSa montée en grade, jusqu’à colonel puis commandant en chef de l’armée, l’a conduit à occuper le poste de ministre de la Guerre depuis 1936."

