 r56_CHL_arrest_Jorge_tt:0 "§WL’imminent§! §YSoulèvement des Nacistas§! §Wsera§! §Gstoppé§!§W.§!\n"
 CHL_uprising_called_off:0 "§WL’imminent§! §YSoulèvement des Nacistas§! §Wa été§! §Gstoppé§!§W.§!"
 r56_chl_big_oof_cw:0 "§WLes§! §YNacistas§! §Wont lancé leur§! §Rsoulèvement§!§W.§!"
 r56_CHL_concessions_1:0 "Concessions aux Nacistas"
 r56_CHL_concessions_1_desc:0 "Des concessions à l’extrême droite pourraient nous donner plus de temps pour gérer la menace Nacista."
 r56_CHL_arrest_Jorge:0 "Arrêter Jorge González von Marées"
 chile.39.t:0 "Insurrection Nacista dans la capitale"
 chile.39.d:0 "À la suite des récents événements politiques dans le pays, les Nacistas se sont montrés de plus en plus mécontents du gouvernement actuel. Ce mécontentement s’est concrétisé ce matin, lorsqu’un petit groupe de fascistes armés dirigé par Jorge González von Marées a tenté de renverser notre gouvernement par un coup d’État.\n\nHeureusement, leur mouvement n’a pas pris d’ampleur et le nombre actuel de rebelles Nacistas est supposé très faible. Ils se sont retranchés dans quelques bâtiments gouvernementaux à Santiago.\n\nBien qu’ils aient repoussé la police locale, une intervention militaire formelle devrait les écraser."
 chile.39.a:0 "Écrasons cette petite farce."
 chile.40.t:0 "Soulèvement massif des Nacistas"
 chile.40.d:0 "À la suite des récents événements politiques dans le pays, les Nacistas se sont montrés de plus en plus hostiles et combatifs envers le gouvernement actuel. Ce mécontentement s’est matérialisé ce matin, lorsqu’un grand nombre de fascistes armés dirigés par Jorge González von Marées a tenté de renverser notre gouvernement par un coup d’État.\n\nNous avons réussi à sécuriser notre armée dans le nord et préparons une riposte. Il semble que nous ayons gravement sous-estimé la force de leur mouvement, de nombreux anciens officiers et même certains de nos jeunes officiers ayant rejoint leur cause. Ils ont actuellement pris la capitale Santiago et ses environs, ont vaincu la police et les garnisons locales, et se sont emparés d’équipements militaires. Nous devons mobiliser l’armée et les forces antifascistes pour écraser ce soulèvement.\n\nMalheureusement, les affrontements entre nos forces se sont transformés au cours des dernières vingt-quatre heures en une véritable guerre civile."
 chile.40.a:0 "Par la force, nous triompherons."
 chile.41.t:0 "Mort de Pedro Aguirre Cerda"
 chile.41.d:0 "Le chef du Parti démocratique, Pedro Aguirre Cerda, est mort dans son sommeil à l’hôpital central de Santiago. Maintenant qu’il est parti et que beaucoup honorent son nom, les démocrates élisent un nouveau dirigeant."
 chile.41.a:0 "Juan Antonio Ríos prendra ses fonctions."
 CHL_preemptive_strike_tt:0 "§CCe focus accordera des objectifs de guerre contre certains pays voisins s’ils sont fascistes ou communistes.§!"
 CHL_growing_communist_faction_t:0 "Propagation agressive du communisme"
 CHL_ideological_propaganda:0 "Propagande idéologique"
 CHL_ideological_propaganda_desc:0 "Chaque mouvement communiste est une cellule potentielle prête à organiser les masses."
 R56_chile_fascist_scw_given_tag:0 "§WIl s’agit du soulèvement Nacista.§!"
 CHL_the_spread_of_fascism_t:0 "Renforcement du mouvement Nacista"
 chile.43.t:0 "Incident du Seguro Obrero"
 chile.43.d:0 "Craignant des mesures contre son mouvement, vers 12h30 aujourd’hui, Jorge González a tenté un coup d’État avec ses nationaux-socialistes chiliens soutenus par [GER.GetAdjective]. Ce coup a échoué après une fusillade avec la police [CHL.GetAdjective]. Les rebelles ont brièvement tenu deux bâtiments, mais la police locale a forcé un groupe à battre en retraite, tandis que les autres se rendaient. Environ 60 rebelles nationaux-socialistes furent exécutés par un peloton d’exécution après leur reddition, malgré la promesse du gouvernement de leur épargner la vie. Seuls quatre hommes parvinrent à échapper au massacre. On murmure que [CHL.GetLeader] aurait ordonné cette exécution."
 chile.43.a:0 "Un tournant ‘fâcheux’."
 CHL_invite_red_uruguay:0 "Inviter l’Uruguay"
 CHL_invite_red_uruguay_desc:0 "Le gouvernement communiste de [URG.getnameDef] est notre frère et doit se joindre à notre lutte pour la révolution ouvrière à travers l’Amérique du Sud."
 CHL_invite_red_paraguay:0 "Inviter le Paraguay"
 CHL_invite_red_paraguay_desc:0 "Le gouvernement communiste de [PAR.getnameDef] est notre frère et doit se joindre à notre lutte pour la révolution ouvrière à travers l’Amérique du Sud."
 CHL_invite_red_bolivia:0 "Inviter la Bolivie"
 CHL_invite_red_bolivia_desc:0 "Le gouvernement communiste de [BOL.getnameDef] est notre frère et doit se joindre à notre lutte pour la révolution ouvrière à travers l’Amérique du Sud."

 chile_communist_faction:0 "Union des États communistes latino-américains"
 CHL_fascism_partyv2:0 "VPS"
 CHL_fascism_partyv2_long:0 "Vanguardia Popular Socialista"
 CHL_isi:0 "ISI"
 CHL_isi_desc:0 "Des politiques de substitution aux importations ont été mises en place pour encourager notre industrie à être autonome."
 CHL_corfo:0 "CORFO"
 CHL_corfo_desc:0 "Avoir une entreprise nationale de construction facilite la réalisation de nos projets."
 CHL_dissident_activity:0 "Activité dissidente"
 CHL_dissident_activity_desc:0 "Toutes sortes de dissidents perturbent [CHL.GetNameDef]. Entre les communistes et les nationaux-socialistes, il n’y a pas de paix."
 CHL_command_economy:0 "Économie dirigée"
 CHL_command_economy_desc:0 "En nationalisant l’ensemble de l’industrie de [CHL.GetNameDef], nous pouvons décider de ce qu’elle produit, plutôt que de laisser ce choix aux capitalistes."
 CHL_communist_influence:0 "Influence [CHL.GetAdjective]"
 CHL_communist_influence_desc:0 "[CHL.GetNameDef] propage le communisme dans cette nation."
 CHL_revolution:0 "Révolution communiste"
 CHL_revolution_desc:0 "Le feu de la révolution brûle dans cette nation."
 CHL_communist_militia_idea:0 "Milices communistes"
 CHL_communist_militia_idea_desc:0 "En intégrant les milices communistes à nos forces, nous les avons renforcées."
 CHL_communist_ban:0 "Communisme interdit"
 CHL_communist_ban_desc:0 "En interdisant le communisme, il est devenu plus difficile pour ces mouvements d’opérer dans le pays."
 CHL_fascist_ban:0 "Fascisme interdit"
 CHL_fascist_ban_desc:0 "Avec le fascisme proscrit, ses mouvements radicaux sont presque totalement réprimés."
 CHL_republican_guard_idea:0 "Garde républicaine"
 CHL_republican_guard_idea_desc:0 "La réorganisation de la Garde républicaine en une organisation paramilitaire dévouée à l’État nous a donné une force supplémentaire."
 CHL_expanded_private_sector:0 "Secteur privé étendu"
l_french:
 CHL_expanded_private_sector_desc:0 "L’expansion du secteur privé a entraîné une concurrence accrue et une amélioration de l’efficacité au sein de l’économie."
 CHL_preemptive_idea:0 "Préparatifs pour la guerre"
 CHL_preemptive_idea_desc:0 "Alors que la guerre se profile à l’horizon, des mesures ont été prises pour sécuriser les frontières du pays."
 CHL_crackdown_idea:0 "Répression politique"
 CHL_crackdown_idea_desc:0 "Le gouvernement réprime sans pitié les mouvements radicaux dans le pays."
 CHL_spread_of_fascist:0 "Renforcement des Nacistas"
 CHL_spread_of_fascist_desc:0 "Le mouvement Nacista se répand dans le pays, bien que beaucoup s’y opposent encore."
 CHL_patriotic_leagues_idea:0 "Ligues patriotiques"
 CHL_patriotic_leagues_idea_desc:0 "La reformation des Ligues patriotiques en tant qu’organisation paramilitaire nous a donné une armée plus importante."
 CHL_spread_the_revolution_idea:0 "Propager la révolution"
 CHL_spread_the_revolution_idea_desc:0 "Nous devons porter la révolution au monde entier ! Nous devons soutenir les révolutionnaires à l’étranger."
 CHL_home_of_latin_revolution:0 "Berceau de la révolution latino-américaine"
 CHL_home_of_latin_revolution_desc:0 "[CHL.GetNameDef] est le berceau de la révolution communiste en Amérique latine, et à ce titre, un fort sentiment d’unité et de détermination y règne."
 CHL_pacts_of_may_idea:0 "Les Pactes de mai"
 CHL_pacts_of_may_idea_desc:0 "Signés en 1902, les Pactes de mai prévoyaient un accord avec l’Argentine limitant nos opérations au Pacifique et les leurs à l’Atlantique."
 CHL_central_bank_idea:0 "Banque centrale élargie"
 CHL_central_bank_idea_desc:0 "En développant notre banque centrale, nous pouvons plus facilement financer les projets d’infrastructure publique."
 CHL_popular_front_frail:0 "Coalition fragile"
 CHL_popular_front_frail_desc:0 "Le Front populaire est une coalition entre socialistes, centristes et communistes. Une alliance aussi large est fragile par nature."
 CHL_volunteer_corps_focus_republican:0 "Soutenir l’Espagne républicaine"
 CHL_volunteer_corps_focus_republican_desc:0 "Nous devons envoyer des soldats pour aider nos frères en Espagne. Nous devrions probablement poursuivre cet effort ailleurs par la suite."
 CHL_volunteer_corps_focus_nationalist:0 "Soutenir l’Espagne nationaliste"
 CHL_volunteer_corps_focus_nationalist_desc:0 "Nous devons envoyer des soldats pour aider nos frères en Espagne. Nous devrions probablement poursuivre cet effort ailleurs par la suite."
 lion_of_tarapaca:0 "Lion du Tarapacá"
 CHL_soviet_assistance:0 "Conseillers [SOV.GetAdjective]"
 CHL_german_assistance:0 "Conseillers [GER.GetAdjective]"
 CHL_the_leader_idea:0 "Un parti, un chef"
 CHL_the_leader_idea_desc:0 "Le concept de « Jefe » (chef), un dirigeant doté d’un pouvoir absolu sur le pays et son parti au pouvoir, servait souvent de principe unificateur dans les dictatures latino-américaines et les mouvements d’extrême droite."
 CHL_extirpation_idea:0 "Éradication des indésirables"
 CHL_extirpation_idea_desc:0 "Les ennemis de l’État doivent être expulsés de notre nation."
 CHL_communist_conquest_idea:0 "Cavaliers du communisme"
 CHL_anti_american_idea:0 "Sentiment anti-[USA.GetAdjective]"
 CHL_anti_capitalist_idea:0 "Éradication des capitalistes"
 CHL_peronist_support:0 "Soutien [CHL.GetAdjective] aux péronistes"
 CHL_consolidate_the_government:0 "Renforcer la position d’Alessandri"
 CHL_consolidate_the_government_desc:0 "Notre pays souffre encore des conséquences du coup d’État de 1925. Les mouvements radicaux imprègnent la nation et ne peuvent être tolérés. Il est temps de reprendre les rênes du pays et de lui donner une direction nouvelle et indomptable."
 CHL_the_popular_front:0 "Le Front populaire"
 CHL_the_popular_front_desc:0 "Alessandri a eu son temps ; le massacre du Seguro Obrero est la goutte d’eau qui fait déborder le vase. Bien que le pays se soit stabilisé sous son autorité, un tel dirigeant brutal n’est plus nécessaire. Il est temps qu’un gouvernement plus libéral prenne place, avec une coalition des partis socialistes et libéraux pour nous émanciper."
 CHL_supress_the_nacistas:0 "Réprimer les Nacistas"
 CHL_supress_the_nacistas_desc:0 ""
 CHL_win_the_liberals:0 "Rallier les libéraux"
 CHL_win_the_liberals_desc:0 "La gauche comme la droite menacent de replonger la nation dans le chaos ; cela ne peut être permis. Un peu de sang versé est un prix minime à payer pour la sécurité des citoyens. Les libéraux comprendront, et nous gagnerons leur soutien."
 CHL_isi_idea:0 "Économie de substitution aux importations"
 CHL_isi_idea_desc:0 "La Grande Dépression a laissé l’économie chilienne exsangue. Nous ne pouvons plus pratiquer une économie libérale aussi imprudente. [CHL.GetNameDefCap] doit être autosuffisant pour se protéger des turbulences économiques étrangères. Nous devons développer l’industrie essentielle et les capacités de production de [CHL.GetNameDef] pour y parvenir."
 CHL_cap_steel:0 "Sidérurgie nationale"
 CHL_cap_steel_desc:0 "Nous devrions créer une société sidérurgique nationale. [CHL.GetNameDefCap] possède déjà une industrie de l’acier que nous devrions étendre en la nationalisant partiellement pour des raisons de sécurité. Nous lancerons la Compañía de Acero del Pacífico comme sidérurgie nationale."
 CHL_enap:0 "Développer l’industrie pétrolière et électrique"
 CHL_enap_desc:0 "L’Empresa Nacional del Petróleo (ENAP) et l’Empresa Nacional de Electricidad (ENDESA) seront de nouvelles industries sous l’autorité de la CORFO, et veilleront à la prospérité de ces secteurs au sein de [CHL.GetNameDef]."
 CHL_liberalism_over_socialism:0 "Parlementarisme plutôt que socialisme"
 CHL_liberalism_over_socialism_desc:0 "Bien que nous ayons formé une coalition avec les socialistes et même les communistes, ce n’est pas la voie que suivra [CHL.GetNameDef]. Le Chili sera une social-démocratie. Les communistes ne valent pas mieux que les juntes et dictateurs d’antan. La liberté et la sécurité seront les objectifs de ce gouvernement."
 CHL_a_truly_radical_party:0 "Un parti vraiment radical"
 CHL_a_truly_radical_party_desc:0 "La nation est encore en crise. Cette coalition fragile entre bourgeois et socialistes ne tiendra pas. Le moment est venu pour la révolution communiste de [CHL.GetNameDef]. Usurpons la présidence et instaurons un gouvernement véritablement égalitaire et libérateur."
 CHL_remove_the_right:0 "Éliminer l’extrême droite"
 CHL_remove_the_right_desc:0 "L’extrême droite menace la stabilité du Chili depuis des décennies. Il est temps d’éradiquer cette menace une bonne fois pour toutes. Trouvons von Marées et ses nationaux-socialistes, et éliminons-les. Il n’y aura plus jamais de coup d’État manqué au Chili."
 CHL_support_republican_spain:0 "Soutenir l’Espagne républicaine"
 CHL_support_republican_spain_desc:0 "Depuis longtemps, le Chili entretient des liens étroits avec l’Espagne. Les républicains appellent à l’aide des internationalistes du monde entier, et nous devons leur répondre. Bientôt, le monde entier sera communiste."
 CHL_support_nationalist_spain:0 "Soutenir l’Espagne nationaliste"
 CHL_support_nationalist_spain_desc:0 "Notre mère patrie, l’Espagne, appelle à l’aide. Comme nous autrefois, elle lutte contre les communistes et anarchistes qui veulent détruire tout ce qui est espagnol pour le remplacer par l’internationalisme. Nous ne pouvons pas rester inactifs et laisser les terres de nos ancêtres tomber dans les ténèbres. Nous devons l’aider."
 CHL_urbanisation_focus:0 "Encourager l’urbanisation"
 CHL_urbanisation_focus_desc:0 "Le moment est venu de faire passer [CHL.GetNameDef] d’une société principalement rurale et agricole à une véritable économie moderne. Des infrastructures urbaines plus développées et des incitations au déplacement vers les villes encourageront le développement industriel et nous aideront à nous remettre de la dépression."
 CHL_land_reform_auth:0 "Confisquer les haciendas"
 CHL_land_reform_auth_desc:0 "Les hacendados se sont révélés être des seigneurs insupportables. Ils doivent être punis et remis à leur place. Confisquer une partie de leurs terres et introduire une nouvelle législation devrait résoudre le problème."
 CHL_land_reform:0 "Réforme agraire"
 CHL_land_reform_desc:0 "Le secteur agricole de [CHL.GetNameDef] est asservi aux hacendados et à leur système quasi féodal. Bien que leur influence rende la tâche difficile, nous devons résoudre ce problème pour mettre fin à cette crise agricole. La législation seule ne suffira pas ; la coercition sera également nécessaire."
 CHL_full_recovery:0 "Reprise économique totale"
 CHL_full_recovery_desc:0 "L’économie de [CHL.GetNameDef] a été revitalisée grâce aux divers investissements et avancées économiques. De plus, [CHL.GetNameDef] ne dépend plus entièrement des économies étrangères pour sa prospérité. À l’avenir, nous serons mieux préparés aux crises économiques."
 CHL_efe_rail:0 "Revitaliser les chemins de fer"
 CHL_efe_rail_desc:0 "L’Empresa de Ferrocarriles del Estado, la compagnie nationale de chemins de fer fondée en 1884, couvre tout le Chili. Cependant, il y a longtemps que nous n’avons pas modernisé nos infrastructures ferroviaires. Investissons dans cette compagnie pour en faire bénéficier toutes les industries et la population."
 CHL_steel:0 "Étendre la sidérurgie"
 CHL_steel_desc:0 "La sidérurgie nationale s’est révélée être une entreprise des plus rentables. Il est logique d’investir davantage là où nous avons les ressources. Construisons une aciérie géante à Huachipato – la région dispose de matières premières et d’un étrange enthousiasme pour le football."
 CHL_oil_in_the_tierra_del_fuego:0 "Pétrole en Terre de Feu"
 CHL_oil_in_the_tierra_del_fuego_desc:0 "Tout au sud se trouvent des ressources qui pourraient nous mener à l’indépendance énergétique."
 CHL_mining_technologies:0 "Technologies minières"
 CHL_mining_technologies_desc:0 "Notre économie dépend fortement du secteur minier ; des technologies modernes d’extraction du minerai sont donc essentielles."
 CHL_the_spread_of_fascism:0 "Soutenir les Nacistas"
 CHL_the_spread_of_fascism_desc:0 "Un sentiment nationaliste croissant se développe dans l’armée et parmi le peuple de [CHL.GetNameDef], menaçant de renverser la république. Il est probable qu’ils prennent le pouvoir tôt ou tard. Mieux vaut nous allier à eux maintenant pour éviter un bain de sang."
 CHL_appropriate_land_com:0 "Libérer les paysans"
 CHL_appropriate_land_com_desc:0 "L’aristocratie tyrannique qui possède la majeure partie des terres de [CHL.GetNameDef] doit disparaître. Il est temps d’attribuer ces terres aux fermiers travailleurs qui y ont peiné pendant des années."
 CHL_el_ariostazo:0 "El Ariostazo"
 CHL_el_ariostazo_desc:0 "Il est temps de renverser la république. La démocratie est faible et facilement manipulable. Un gouvernement militaire fort est ce dont [CHL.GetNameDef] a besoin en ces temps troublés. Un coup d’État va frapper ce gouvernement ; cette fois, il ne sera pas un échec."
 CHL_the_pacts_of_may:0 "Abolir les Pactes de mai"
 CHL_the_pacts_of_may_desc:0 "Les Pactos de Mayo signés en 1902 définissaient les relations militaires entre le Chili et l’Argentine. Il est peut-être temps de revoir notre relation avec les [ARG.GetAdjective]."
 CHL_claims_on_argentina:0 "Prendre la Terre de Feu"
 CHL_claims_on_argentina_desc:0 "Notre frontière avec les Argentins a été définie en 1902, mais nous devons aussi revoir cette délimitation. La Terre de Feu est un archipel au sud de la Patagonie. Actuellement partagée avec les [ARG.GetAdjective], cette situation doit prendre fin. [CHL.GetNameDefCap] doit contrôler le cap Horn."
 CHL_claims_on_uruguay:0 "Sécuriser l’Atlantique Sud"
 CHL_claims_on_uruguay_desc:0 "Avec l’Argentine sous notre contrôle, la majeure partie de l’Atlantique Sud est également sous notre influence. Nous partageons le stratégique fleuve Rio de la Plata avec les [URG.GetAdjective], ce qui est inacceptable. Nous devons contrôler la région et le Rio de la Plata."
 CHL_hispanic_pan_nationalism:0 "Pan-nationalisme hispanique"
 CHL_hispanic_pan_nationalism_desc:0 "Nous sommes la véritable nation de l’Amérique du Sud hispanique. Que tous les peuples hispaniques soient unis et triomphants."
 CHL_reform_the_army:0 "Réarmer les Fuerzas"
 CHL_reform_the_army_desc:0 "L’ombre de la guerre plane à nouveau sur le monde – nous devons nous préparer et moderniser notre armée bien trop obsolète."
 CHL_andean_warfare:0 "Guerre andine"
 CHL_andean_warfare_desc:0 "[CHL.GetNameDefCap] est presque entièrement situé sur une chaîne de montagnes. Nous devons spécialiser notre armée pour les combats dans un tel terrain, non seulement en défense mais aussi en attaque, car nous ne sommes pas seuls avec ce type de géographie en Amérique du Sud."
 CHL_mobility_focus:0 "Priorité à la mobilité"
l_french:
 CHL_mobility_focus_desc:0 "L’avenir de la guerre réside dans la mobilité. Les chars représentent un changement majeur dans l’art de la guerre, et nous devons nous adapter ou être balayés par le courant de l’histoire. [CHL.GetNameDefCap] sera à l’avant-garde de la guerre de troisième génération et montrera la voie en Amérique."
 CHL_infantry_focus:0 "Priorité à l’infanterie"
 CHL_infantry_focus_desc:0 "Les chars sont peut-être une expérience intéressante, mais [CHL.GetNameDef] n’a pas l’industrie nécessaire pour se lancer dans de telles aventures. Nous devrions nous appuyer sur les méthodes éprouvées de la guerre : l’infanterie et l’artillerie."
 CHL_restore_the_navy:0 "Développer l’Armada"
 CHL_restore_the_navy_desc:0 "Le Chili possédait autrefois la flotte la plus puissante du Pacifique, surpassant même celle des États-Unis. Ce qui fut peut redevenir : nous dominerons à nouveau les vagues de notre océan."
 CHL_naval_aviation_focus:0 "Aviation navale"
 CHL_naval_aviation_focus_desc:0 "L’aviation a fait d’incroyables progrès au cours de la dernière décennie. La guerre navale traditionnelle va devenir obsolète avec son avènement, car de grands cuirassés sombreront impuissants sans avoir tiré un seul coup."
 CHL_surface_fleet_focus:0 "Flotte de surface"
 CHL_surface_fleet_focus_desc:0 "Les méthodes éprouvées de la guerre navale nous conviennent parfaitement. Aucun obstacle ne peut résister à la canonnade d’un cuirassé."
 CHL_destroyer_focus:0 "Priorité aux destroyers"
 CHL_destroyer_focus_desc:0 "Les destroyers sont la base de notre flotte : sans eux, un navire de ligne est nu et vulnérable. Nous devons investir dans de nouveaux modèles pour assurer leur efficacité."
 CHL_cruiser_focus:0 "Priorité aux croiseurs"
 CHL_cruiser_focus_desc:0 "L’essor de l’aviation navale exige une meilleure couverture aérienne pour nos flottes. Les croiseurs légers sont parfaits pour ce rôle et serviront d’écrans efficaces à nos navires plus imposants."
 CHL_naval_bomber_focus:0 "Nouveaux modèles de bombardiers-torpilleurs"
 CHL_naval_bomber_focus_desc:0 "Il est bon d’avoir des porte-avions modernes, mais ils sont inutiles sans avions modernes. Nous devons moderniser nos modèles de bombardiers-torpilleurs pour garantir leur efficacité et leur capacité de frappe dévastatrice."
 CHL_expand_talcahuano:0 "Agrandir le chantier naval de Talcahuano"
 CHL_expand_talcahuano_desc:0 "Notre plus grand chantier naval se trouve à Talcahuano, mais il ne répond plus à nos besoins. Nous devons accroître notre capacité navale afin de pouvoir construire des navires plus imposants."
 CHL_expand_magallanes_valparasio:0 "Agrandir Magallanes et Valparaíso"
 CHL_expand_magallanes_valparasio_desc:0 "Nos chantiers secondaires de Magallanes et de Valparaíso doivent eux aussi être agrandis pour augmenter notre capacité de construction navale. Nous y construirons nos navires d’escorte."
 CHL_expand_our_arsenal:0 "Agrandir notre arsenal"
 CHL_expand_our_arsenal_desc:0 "L’armée [CHL.GetAdjective] est professionnelle et indomptable. Toutefois, elle n’est pas aussi grande que nous le souhaiterions. Nous devons agrandir l’arsenal national pour permettre une force plus importante."
 CHL_invest_further_in_electronics:0 "Investir davantage dans l’électronique"
 CHL_invest_further_in_electronics_desc:0 "ENDESA s’est avérée un investissement très rentable – nous devrions investir davantage dans l’électronique et voir ce qu’il en résulte ; nul doute que ce sera bénéfique."
 CHL_nuclear_focus:0 "Fendre l’atome"
 CHL_nuclear_focus_desc:0 "Nos scientifiques nous parlent d’une puissance incommensurable emprisonnée jusque dans les atomes. Bien que cela paraisse fantastique, il convient d’enquêter : si c’est vrai, les récompenses potentielles sont immenses."
 CHL_famae:0 "Investir dans la FAMAE"
 CHL_famae_desc:0 "Les Fábricas y Maestranzas del Ejército sont le plus ancien fabricant d’armes de toute l’Amérique latine. Nous devrions investir dans cette entreprise prestigieuse et développer de nouvelles armes pour surpasser nos rivaux."
 CHL_universities:0 "Investir dans les universités"
 CHL_universities_desc:0 "Créons deux nouvelles universités : Bío Bío et Playa Ancha. [CHL.GetNameDefCap] doit être à la pointe des sciences, civiles comme militaires, pour rester compétitive. Ces institutions nous le permettront."
 CHL_military_research_institute:0 "Fonder l’ICIA"
 CHL_military_research_institute_desc:0 "Notre armée a grandi, tout comme notre expérience – il est temps de fonder un institut de recherche militaire. Appelons-le l’Institución Chilena de Investigación Avanzada, ou Institut chilien de recherche avancée."
 CHL_mechanized:0 "Effort mécanisé"
 CHL_mechanized_desc:0 "Les chars ne peuvent opérer seuls – ils nécessitent éclaireurs et unités de soutien. Les unités motorisées étant limitées, nous devrions concevoir de nouveaux véhicules combinant la protection et la puissance de feu blindée avec la polyvalence de l’infanterie."
 CHL_armour_effort:0 "Effort blindé"
 CHL_armour_effort_desc:0 "Les chars sont le marteau de notre armée mobile. Nous devons développer de nouveaux modèles pour surpasser nos adversaires et rendre leurs armes inefficaces contre notre blindage."
 CHL_armour_more:0 "Modèles de blindés avancés"
 CHL_armour_more_desc:0 "Nos nouvelles universités nous ont apporté un flot d’innovations. Profitons-en pour concevoir les chars les plus avancés du monde !"
 CHL_doctrine:0 "Avancée doctrinale"
 CHL_doctrine_desc:0 "Notre nouvelle armée est moderne et bien équipée. Il est temps de repenser nos tactiques à la lumière de ce nouvel équipement et de développer des manœuvres qui en tirent pleinement parti."
 CHL_artillery_f:0 "Effort d’artillerie"
 CHL_artillery_f_desc:0 "Notre stratégie repose sur le bombardement intensif de l’ennemi jusqu’à sa reddition. Il est donc naturel de développer de nouveaux modèles d’artillerie pour frapper plus précisément et plus puissamment."
 CHL_support:0 "Effort de soutien"
 CHL_support_desc:0 "L’infanterie seule est inefficace. Elle a besoin non seulement de soutien en armement, mais aussi de soutien logistique, de reconnaissance et de spécialistes. Ces éléments de notre armée ne doivent pas être négligés."
 CHL_rockets:0 "Fusées"
 CHL_rockets_desc:0 "Nos chercheurs nous proposent une idée enthousiasmante : les fusées. Selon eux, l’avenir de l’artillerie passe par leur exploitation. Nous n’allons certainement pas refuser un moyen encore plus efficace de bombarder nos ennemis. Étudions ces armes pour en évaluer le potentiel."
 CHL_naval_doctrine:0 "Avancée doctrinale navale"
 CHL_naval_doctrine_desc:0 "Nos nouveaux navires nécessitent de nouvelles tactiques. Nous devons nous entraîner avec eux et découvrir les avantages qu’ils peuvent offrir."
 CHL_marines_focus:0 "Marines [CHL.GetAdjective]"
 CHL_marines_focus_desc:0 "Notre nouvelle flotte domine les mers qui nous entourent. Il est donc logique de l’exploiter en utilisant des marines pour capturer les côtes ennemies. Nous devons élargir nos forces spéciales pour ces opérations."
 CHL_nationalise_all:0 "Nationaliser toute l’industrie"
 CHL_nationalise_all_desc:0 "Depuis trop longtemps, la bourgeoisie s’engraisse sur le travail des classes populaires. Nous ne tolérerons plus des contremaîtres indolents et des maîtres tyranniques. Il est temps de redistribuer toute l’industrie [CHL.GetAdjective] aux travailleurs et au peuple. Plus aucun effort ne sera gaspillé dans des frivolités."
 CHL_comintern:0 "Rejoindre le Komintern"
 CHL_comintern_desc:0 "[CHL.GetNameDefCap] doit rejoindre les communistes du monde entier dans la révolution mondiale."
 CHL_internationalism:0 "Propager la révolution"
 CHL_internationalism_desc:0 "Nous devons répandre la révolution chez nos voisins puis dans le monde entier ! Bientôt, tous se réuniront sous une seule union humaine."
 CHL_communist_argentina_influence:0 "Influencer [ARG.GetNameDef]"
 CHL_communist_argentina_influence_desc:0 "[ARG.GetNameDefCap] est l’État le plus proche de nous. Nous devons porter la révolution chez eux en premier. Les travailleurs [ARG.GetAdjective] connaîtront bientôt la liberté véritable."
l_french:
 CHL_growing_communist_faction:0 "Propager la révolution à nos voisins"
 CHL_growing_communist_faction_desc:0 "La bourgeoisie opprime nos voisins – nous devons les émanciper comme nous l’avons fait pour nous-mêmes."
 CHL_communist_argentina_war:0 "Libérer les [ARG.GetAdjective]"
 CHL_communist_argentina_war_desc:0 "Les travailleurs [ARG.GetAdjective] crient leur désir de liberté. Nous devons les libérer du joug de l’oppression capitaliste."
 CHL_communist_argentina_alliance:0 "Alliance avec [ARG.GetNameDef]"
 CHL_communist_argentina_alliance_desc:0 "Les travailleurs [ARG.GetAdjective] se sont libérés ; collaborons avec eux pour propager le mouvement dans toutes les Amériques."
 CHL_communist_bolivia_paraguay_war:0 "Propager la révolution au nord"
 CHL_communist_bolivia_paraguay_war_desc:0 "[PAR.GetNameDefCap] n’est pas véritablement communiste, car leur gouvernement ne vaut guère mieux qu’une dictature fasciste. Nous devons libérer les [BOL.GetAdjective] et les [PAR.GetAdjective] en les accueillant dans notre camp."
 CHL_communist_brazil_war:0 "Propager la révolution à [BRA.GetNameDef]"
 CHL_communist_brazil_war_desc:0 "[BRA.GetNameDefCap] est le plus grand État d’Amérique du Sud. Nous devons libérer le peuple [BRA.GetAdjective] et obtenir l’hégémonie sur le continent. Le reste suivra rapidement."
 CHL_preemptive_measures:0 "Mesures préventives"
 CHL_preemptive_measures_desc:0 "Nous devons nous préparer à l’inévitable : la guerre. [PRU.GetNameDefCap] représente la menace la plus immédiate, mais nous devons être prêts à toute éventualité."
 CHL_join_allies:0 "Rejoindre les Alliés"
 CHL_join_allies_desc:0 "Seul, [CHL.GetNameDef] est vulnérable face aux puissances extérieures. Nous devons trouver des Alliés pour défendre notre démocratie et garantir la liberté partout."
 CHL_trade_deals:0 "Nouveaux accords commerciaux"
 CHL_trade_deals_desc:0 "[CHL.GetNameDefCap] est trop lié à [GER.GetNameDef] et aux autres puissances fascistes. Nous devons rechercher de nouvelles opportunités commerciales avec les démocraties du monde."
 CHL_expand_private_sector:0 "Développer le secteur privé"
 CHL_expand_private_sector_desc:0 "Une trop grande partie de l’économie [CHL.GetAdjective] est publique. Réduisons l’implication de l’État pour accroître la concurrence et l’efficacité, au bénéfice du peuple et de l’économie."
 CHL_communist_militias:0 "Intégrer les milices à l’armée"
 CHL_communist_militias_desc:0 "Le prolétariat souhaite ardemment nous aider à propager la révolution. Nous n’avons aucune raison de le leur refuser. Intégrons ces milices à notre armée."
 CHL_crackdown:0 "Réprimer les dissidents"
 CHL_crackdown_desc:0 "L’extrême gauche et l’extrême droite sèment le désordre depuis trop longtemps. Le gouvernement ne peut plus se contenter de réagir à leurs coups d’État et violences. Nous devons traquer et éliminer cette menace politique."
 CHL_ties_with_argentina:0 "Renforcer les liens avec [ARG.GetNameDef]"
 CHL_ties_with_argentina_desc:0 "Même si nos relations avec [ARG.GetNameDef] n’ont pas toujours été bonnes, nous sommes finalement frères. Renforçons notre amitié pour garantir la paix dans la région."
 CHL_central_bank:0 "Développer la banque centrale"
 CHL_central_bank_desc:0 "Alessandri a créé notre banque centrale, mais elle est insuffisante en ces temps troublés. Assurons la stabilité financière de notre pays."
 CHL_patriotic_leagues:0 "Rétablir les Ligues patriotiques"
 CHL_patriotic_leagues_desc:0 "Les Ligues patriotiques étaient une organisation paramilitaire protégeant l’esprit nationaliste du Chili. Dissoutes il y a une dizaine d’années, elles devraient être rétablies et encouragées."
 CHL_ban_communism:0 "Réprimer le communisme"
 CHL_ban_communism_desc:0 "La menace communiste a trop longtemps été tolérée. Il faut interdire cette idéologie et éradiquer sa présence pour être à l’abri de ses manigances."
 CHL_preemptive_strike:0 "Frappe préventive"
 CHL_preemptive_strike_desc:0 "Nous devons porter un coup préventif aux fascistes [PRU.GetAdjective]. Cette dictature menace la paix en Amérique du Sud ; si nous n’agissons pas, elle pourrait frapper la première."
 CHL_argentine_alliance:0 "Alliance avec les [ARG.GetAdjective]"
 CHL_argentine_alliance_desc:0 "Formaliser une alliance avec les [ARG.GetAdjective] garantirait la sécurité de nos deux nations. Ensemble, nous serons une force sans égale sur le continent."
 CHL_expand_alliance:0 "Élargir l’alliance"
 CHL_expand_alliance_desc:0 "Nous devrions inviter nos voisins à rejoindre notre alliance pour nous renforcer mutuellement. [URG.GetNameDefCap] est stratégiquement important dans l’Atlantique, mais incapable de se défendre seul."
 CHL_paraguayan_threat:0 "La menace [PAR.GetAdjective]"
 CHL_paraguayan_threat_desc:0 "[PAR.GetNameDefCap] ne peut rester à notre frontière. Leur régime communiste menace l’équilibre de l’Amérique du Sud. Si nous n’agissons pas, ils pourraient envoyer des agents contre nous."
 CHL_establish_the_airforce:0 "Investir dans Línea Aérea Nacional"
 CHL_establish_the_airforce_desc:0 "Fondée en 1932 par Carlos Ibáñez del Campo, Línea Aérea Nacional n’a encore qu’une petite flotte. Les cieux seront un champ de bataille essentiel, et l’aviation un investissement prioritaire. Ne pouvant entretenir une immense armée de l’air, optimisons l’usage de nos appareils."
 CHL_bomber_focus:0 "Priorité aux bombardiers"
 CHL_bomber_focus_desc:0 "Nous devrions concentrer nos efforts aériens sur les bombardiers, polyvalents et dotés d’une charge utile puissante."
 CHL_cas_focus:0 "Priorité à l’appui aérien"
 CHL_cas_focus_desc:0 "L’aviation a un rôle de soutien à l’armée. Développons des appareils excellant dans cette mission."
 CHL_air_doctrine:0 "Effort doctrinal aérien"
 CHL_air_doctrine_desc:0 "Nos nouveaux modèles exigent de nouvelles tactiques. Expérimentons avec nos avions pour perfectionner leur emploi."
 CHL_heavy_bomber_focus:0 "Bombardiers stratégiques"
 CHL_heavy_bomber_focus_desc:0 "Investissons dans le développement de bombardiers lourds à long rayon d’action pour soumettre nos ennemis par les airs."
 CHL_bomber_focus_2:0 "Bombardiers tactiques"
 CHL_bomber_focus_2_desc:0 "Polyvalents, les bombardiers tactiques sont idéaux pour [CHL.GetNameDefCap], dont l’industrie ne permet pas de maintenir une immense armée de l’air."
 CHL_heavy_fighter_focus:0 "Chasseurs lourds"
 CHL_heavy_fighter_focus_desc:0 "Les bombardiers ennemis harcèlent [CHL.GetNameDef] comme un essaim de guêpes. Les chasseurs lourds seront parfaits pour les éliminer et assurer la supériorité aérienne dans les zones reculées."
 CHL_fighter:0 "Chasseurs"
 CHL_fighter_desc:0 "Les chasseurs sont la base de toute armée de l’air et ne doivent pas être négligés. Développons de nouveaux modèles pour surpasser nos adversaires."
 CHL_jet_focus:0 "Effort sur les avions à réaction"
 CHL_jet_focus_desc:0 "Nos universités parlent de moteurs à réaction, capables de propulser une nouvelle génération d’avions bien plus performants. Ces promesses sont trop séduisantes pour être ignorées."
 CHL_paratroopers:0 "Parachutistes"
 CHL_paratroopers_desc:0 "Utilisons pleinement notre nouvelle aviation en déployant des parachutistes."
 CHL_naval_fighter_focus:0 "Priorité aux chasseurs embarqués"
 CHL_naval_fighter_focus_desc:0 "Un porte-avions est inutile sans avions, et des bombardiers seuls sont vulnérables. Développons des chasseurs embarqués pour protéger nos porte-avions et nos bombardiers-torpilleurs."
 CHL_northern_expansion:0 "Expansion vers le nord"
 CHL_northern_expansion_desc:0 "Nous devons sécuriser nos frontières nord. [BRA.GetNameDefCap] menace notre hégémonie ; assurons une zone tampon entre eux et nous."
 CHL_expel_america:0 "Expulser l’Amérique"
 CHL_expel_america_desc:0 "L’Amérique du Sud est libre de la menace [USA.GetAdjective]. Avec la révolution en marche sur le continent, leur influence n’est plus pertinente."
 CHL_spread_revolution_idea:0 "Propager la révolution"
 CHL_spread_revolution_idea_desc:0 "Renforçons nos efforts pour propager la révolution à l’étranger !"
 CHL_soviet_ties:0 "Faire appel à [SOV.GetNameDef]"
 CHL_soviet_ties_desc:0 "Notre régime est jeune et inexpérimenté. Demandons l’aide des [SOV.GetAdjective], communistes les plus établis."
 CHL_german_ties:0 "Demander des conseillers à [GER.GetNameDef]"
 CHL_german_ties_desc:0 "L’armée [GER.GetAdjective] est très avancée, bien plus que la nôtre. Puisque nous partageons les mêmes idées, sollicitons leur aide."
 CHL_japan_accord:0 "Accord avec [JAP.GetNameDef]"
l_french:
 CHL_japan_accord_desc:0 "Le Chili a longtemps été une puissance navale majeure dans le Pacifique. Les [JAP.GetAdjective] sont récemment devenus une force redoutable dans la région. Nous devrions leur proposer un accord pour éviter tout conflit futur : ils contrôleront le Pacifique Ouest et Nord, tandis que nous contrôlerons le Sud et le Sud-Est."
 CHL_fascist_constitution:0 "Réécrire la constitution"
 CHL_fascist_constitution_desc:0 "L’actuelle constitution est obsolète et faible. Elle est vulnérable face aux communistes comme aux capitalistes. Nous devons rédiger un nouveau texte, plus solide et conforme aux idéaux [CHL.GetAdjective]."
 CHL_the_leader:0 "El Jefe"
 CHL_the_leader_desc:0 "Le pouvoir du Leader doit être absolu pour garantir que la direction de la nation reste indomptable. Avec une nouvelle constitution rédigée, nous pouvons consolider formellement les pouvoirs d’El Jefe. La démocratie est faible et sujette à la subversion, mais désormais notre autorité sera incontestable et nous protégera des éléments subversifs."
 CHL_extirpation:0 "Extirper les indésirables"
 CHL_extirpation_desc:0 "Le Chili est depuis trop longtemps accosté par des individus douteux. Le peuple [CHL.GetAdjective] est d’une moralité et d’une constitution exemplaires. Nous devons éliminer ceux qui ne répondent pas à nos exigences et réquisitionner leurs ressources pour la santé morale et physique de la nation."
 CHL_communist_conquest:0 "Libérer l’Amérique du Sud"
 CHL_communist_conquest_desc:0 "Les autres régimes d’Amérique du Sud sont oppressifs et capitalistes – il n’y a aucun espoir pour eux. Nous devons libérer nos voisins par la force et inaugurer une nouvelle ère d’abondance."
 CHL_anti_americanism_desc:0 "[USA.GetNameDefCap] est décadent et corrompu. L’influence [USA.GetAdjective] sur [CHL.GetNameDef] est intolérable. Nous devons éradiquer les idées faibles et absurdes que [USA.GetNameDef] propage, sous peine de tomber nous-mêmes dans leur décadence."
 CHL_japan_faction:0 "Alliance avec [JAP.GetNameDef]"
 CHL_japan_faction_desc:0 "Après avoir convenu de partager le Pacifique avec [JAP.GetNameDef], nous devrions formaliser une alliance pour sécuriser cet océan. [USA.GetNameDef] sera repoussé à sa place, et nous régnerons à nouveau sur ces eaux."
 CHL_axis:0 "Rejoindre [GER.GetNameDef]"
 CHL_axis_desc:0 "[GER.GetNameDefCap] combat nos ennemis communs : l’américanisme et le communisme. Nous devrions demander à les rejoindre officiellement pour accroître nos chances de victoire."
 CHL_ban_capitalism:0 "Éradiquer le capitalisme"
 CHL_ban_capitalism_desc:0 "Même sous notre régime, des insurgés capitalistes continuent de marchander et de commercer. Nous devons les éradiquer définitivement afin que tout relève de notre autorité, car le collectif est plus fort que l’individu."
 CHL_support_peronism:0 "Soutenir le péronisme en [ARG.GetNameDef]"
 CHL_support_peronism_desc:0 "Un mouvement populiste de masse émerge en [ARG.GetNameDef] et pourrait devenir un allié proche. Bien que Perón ne partage pas nos vues sur la communauté sémite et le caractère de notre peuple, il reste un populiste et un nationaliste."
 CHL_support_argentinian_coup:0 "Soutenir un coup d’État en [ARG.GetNameDef]"
 CHL_support_argentinian_coup_desc:0 "Les péronistes jouissent d’un large soutien populaire en [ARG.GetNameDef], mais le gouvernement ne les laissera pas prendre le pouvoir. Nous devrions soutenir un putsch en Argentine pour assurer leur victoire."
 CHL_fascist_faction:0 "Alliance avec les péronistes"
 CHL_fascist_faction_desc:0 "Après les avoir aidés à accéder au pouvoir, nous sommes déjà étroitement liés aux péronistes. Nous devrions formaliser une alliance avec eux pour assurer notre sécurité sur le continent."
 CHL_arg_northern_expansion:0 "Avancer ensemble vers le nord"
 CHL_arg_northern_expansion_desc:0 "[ARG.GetNameDef] et [CHL.GetNameDef] sont tous deux menacés par [BRA.GetNameDef] et les autres puissances du nord. Marchons ensemble vers le nord pour assurer notre sécurité collective."
 CHL_give_arg_urg:0 "Contrôle [ARG.GetAdjective] du Rio de la Plata"
 CHL_give_arg_urg_desc:0 "[ARG.GetNameDefCap] contrôle l’océan Atlantique Sud, et le fleuve Rio de la Plata est essentiel à ce contrôle. Actuellement partagé avec [URG.GetNameDef], nous devrions changer cela."
 CHL_shared_hegemony:0 "Hégémonie partagée"
 CHL_shared_hegemony_desc:0 "Avec [ARG.GetNameDef], nous partageons l’hégémonie sur l’Amérique du Sud hispanophone. Nos nations se sont renforcées l’une grâce à l’autre, et cela continuera."
 CHL_expand_alliance_bol:0 "Rendre le Tarapacá à [BOL.GetNameDef]"
 CHL_expand_alliance_bol_desc:0 "Nous avons conquis le Tarapacá à [BOL.GetNameDef] après la guerre du Pacifique en 1904 par le traité de paix et d’amitié. Malheureusement, cela n’a pas vraiment apporté l’amitié. Peut-être devrions-nous rendre ces terres en échange d’une alliance durable et d’une paix réelle."
 CHL_expand_alliance_pru:0 "Rendre Arica à [PRU.GetNameDef]"
 CHL_expand_alliance_pru_desc:0 "Arica faisait partie de la province péruvienne du Tarapacá jusqu’en 1883, lorsque nous l’avons conquise après la guerre du Pacifique. Nous avons rendu Tacna en 1929 à la demande de l’Amérique pour préserver la paix, mais pas Arica. La seule manière d’assurer la stabilité est de rendre ce qui ne nous appartient pas."
 trade_deal_relations:0 "Accords commerciaux"
 chile_argentina_relations_1:0 "Relations améliorées avec [CHL.GetNameDef]"
 chile_argentina_relations_2:0 "Alliance avec [CHL.GetNameDef]"
 argentina_chile_relations_1:0 "Relations améliorées avec [ARG.GetNameDef]"
 argentina_chile_relations_2:0 "Alliance avec [ARG.GetNameDef]"
 chile_relations_bonus:0 "Efforts diplomatiques [CHL.GetAdjective]"
 CHL_revolution_spread:0 "Assistance pendant la révolution"
 CHL_advisors:0 "Envoi de conseillers"
 CHL_pacific_accord:0 "Accord du Pacifique"
 CHL_pacific_accord_no:0 "Refus de compromis"
 CHL_supported_peronism:0 "Soutien au péronisme"
 CHL_famae_bonus:0 "FAMAE nous propose de nouveaux modèles de fusils à évaluer."
 CHL_doctrine_bonus:0 "De nouvelles avancées militaires ont conduit à des développements doctrinaux."
 CHL_andean_bonus:0 "Montagnards andins"
 CHL_corfo_tech:0 "La CORFO a des idées pour améliorer l’industrie nationale."
 CHL_depression1:0 "La Grande Dépression"
 CHL_depression1_desc:0 "La Grande Dépression a eu un impact significatif sur l’économie chilienne."
 CHL_depression2:0 "La Grande Dépression"
 CHL_depression2_desc:0 "Les investissements publics ont atténué les effets de la Grande Dépression, mais elle reste sévère."
 CHL_depression3:0 "La Grande Dépression"
 CHL_depression3_desc:0 "[CHL.GetNameDefCap] s’est en grande partie remis de la Grande Dépression, mais le chômage et la pauvreté restent répandus."
 CHL_agrarian_reform:0 "Les Hacendados fous"
 CHL_agrarian_reform_desc:0 "Les Hacendados, grands propriétaires terriens, sont comme des tyrans pour les paysans des campagnes [CHL.GetAdjective]."
 CHL_land:0 "Réforme agraire"
 CHL_land_desc:0 "D’importantes réformes agraires ont considérablement amélioré l’efficacité de presque toutes les activités rurales."
 CHL_endesa:0 "ENDESA a permis des avancées dans l’électronique."
 CHL_endesa2:0 "De nouveaux investissements dans ENDESA ont porté leurs fruits."
