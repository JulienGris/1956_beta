 ################### MODIFICATEURS DYNAMIQUES ###################

 r56_MEN_industry_ns:0 "Industrie nationale insuffisante"
 r56_MEN_industry_ns_desc:0 "La faible industrie de notre pays se développe lentement, car ni les [JAP.GetAdjective] ni les [CHI.GetAdjective] ne souhaitent investir dans nos capacités manufacturières. Leur objectif est de maintenir notre peuple et notre économie centrés sur la production de matières premières et de produits agricoles, que les consommateurs [JAP.GetAdjective] ou [CHI.GetAdjective] peuvent acheter à bas prix, laissant les pauvres fermiers [ROOT.GetAdjective] sans rien ! Mais combien de temps notre peuple pourra-t-il supporter cet esclavage économique ?"
 r56_MEN_industry_ns_1:0 "Secteur industriel [ROOT.GetAdjective]"
 r56_MEN_industry_ns_1_desc:0 "Il est devenu clair pour le gouvernement [ROOT.GetAdjective] que le développement économique, en particulier dans le secteur industriel, est indispensable pour sortir les paysans et ouvriers [ROOT.GetAdjective] de la pauvreté. D’importants investissements, politiques comme économiques, devront être orientés vers l’industrie dans un avenir proche, pour le bien de notre peuple et de notre nation !"

