 ################### EVENTS ###################

 men.10.t:0 "La réunion de Zhangbei"
 men.10.d:0 "Alors que la peur monte parmi les élites et que les Japonais s’immiscent peu à peu, des figures clés du Comité politique autonome mongol et du Kuomintang — Nima-odsor, Ünenbayan, Serengdongrub et Demchugdongrub — se sont réunies à Zhangbei pour rencontrer l’influent Jodbajab. Les tensions étaient vives lors de l’examen des récents événements dans le Chahar septentrional : des troupes mandchoues, sous le commandement de Li Shouxin, avaient franchi les six comtés démilitarisés par l’accord Qin-Doihara, fragilisant encore la paix déjà précaire de la région.\n\nJodbajab révéla sa réponse : le déploiement de cavaliers de police pour protéger les frontières vulnérables du nord du Chahar. Mais alors que les Japonais s’enfoncent toujours plus dans la Chine du Nord et en Mandchourie afin d’étendre leur influence, un sentiment d’incertitude grandit. Chacun savait que cette nouvelle violation pouvait annoncer quelque chose de bien plus grave, risquant d’entraîner les différentes factions et puissances de la région dans un conflit inévitable...\n\nAlors que la réunion se conclut et que les représentants s’apprêtent à partir, nul ne sait ce qui les attend, ni s’ils reviendront un jour."
 men.10.a:0 "Conclure la réunion, demain est un autre jour."
 men.10.b:0 "Rester vigilants, l’ennemi rôde dans l’ombre..."

 men.11.t:0 "Nima-Odsor assassiné"
 men.11.d:0 "Tragédie pour la fragile clique de Mongolie intérieure : Nima-odsor, nationaliste pro-Kuomintang et figure majeure prônant l’autonomie mongole et l’opposition au Japon, a été assassiné. Des témoins affirment que cet acte brutal aurait été orchestré par les Japonais afin d’affaiblir la direction de la région et de briser toute résistance unifiée face à leur influence grandissante. Sa mort provoque une onde de choc et de peur au sein du mouvement. Les alliés se demandent qui sera la prochaine cible, tandis que d’autres s’inquiètent de voir le rêve d’une Mongolie indépendante et unifiée s’éteindre. Dans ces temps incertains, il reste à choisir : renforcer la lutte contre l’ingérence étrangère, ou devenir les instruments d’un empire étranger."
 men.11.a:0 "Ne pas voler trop près du soleil rouge..."

 men.12.t:0 "L’incident de Kälgän"
 men.12.d:0 "À la fin de la réunion de Zhangbei, Nima-odsor reprit la route vers Kälgän pour reprendre ses fonctions. À 8h45, il monta dans un bus accompagné de deux gardes du Corps de sécurité local. Mais le trajet fut brusquement interrompu lorsque deux officiers japonais stoppèrent le bus et exigèrent d’y monter. En quelques secondes, un échange de tirs éclata entre les gardes mongols et les officiers japonais. L’un des gardes parvint à blesser un assaillant, forçant les deux Japonais à fuir. Très vite, la rumeur courut qu’il s’agissait d’une tentative d’assassinat contre Nima-odsor, patriote farouche et provocateur anti-japonais. Heureusement, il s’en sortit indemne."
 men.12.a:0 "Un tournant inattendu..."

 men.13.t:0 "Les suites du long hiver"
 men.13.d:0 "L’hiver 1936 fut une saison d’une souffrance inédite, un siège implacable de glace et de neige qui mit la Mongolie intérieure et notre peuple à genoux. Pendant près de trois mois, les températures chutèrent en dessous de -30 °C, paralysant la vie quotidienne. Déjà accablés, nos habitants furent frappés de famine, leurs troupeaux périrent, les pâturages devinrent stériles. Nombre de villages restèrent isolés par des congères, coupés de toute ressource vitale, et l’économie nationale vacilla au bord de l’effondrement.\n\nAlors que le dégel commence, les conséquences se révèlent : des communautés entières sont déstabilisées, l’autorité des dirigeants s’affaiblit, et la peur gagne notre peuple. Tous réclament un plan de redressement clair pour survivre aux prochains mois. Certains prônent l’autosuffisance, d’autres veulent chercher de l’aide à l’étranger. Mais une chose est sûre : si la Mongolie intérieure doit perdurer, il faut agir vite pour reconstruire notre nation fragilisée."
 men.13.a:0 "Nous affronterons cette tempête, ensemble !"

 men.14.t:0 "Le pari de la Mongolie intérieure"
 men.14.d:0 "Alors que l’Armée du Kwantung resserre son emprise sur la Chine du Nord, l’inquiétude gagne les élites de Mongolie intérieure. Dans deux semaines, les principaux acteurs — Comité politique autonome mongol, Kuomintang, et les leaders Nima-odsor, Ünenbayan, Serengdongrub et le prince Demchugdongrub — doivent se réunir à Zhangbei avec l’influent Jodbajab pour définir la marche à suivre. L’incursion récente de troupes mandchoues dirigées par Li Shouxin dans les comtés démilitarisés du Chahar, en violation de l’accord Qin-Doihara, a rompu la paix fragile.\n\nParmi les voix discordantes, Nima-odsor, allié proche de Tchang Kaï-chek, se distingue comme principal opposant aux intérêts japonais en Mongolie intérieure. Son influence croissante nourrit un sentiment anti-japonais menaçant nos plans. L’Armée du Kwantung prépare une opération secrète pour le faire taire ; il ne manque plus qu’un ordre."
 men.14.a:0 "Défier l’Empereur, quelle folie !"
 men.14.b:0 "Les intérêts du Japon sont ailleurs..."

 men.15.t:0 "Nima-Odsor assassiné"
 men.15.d:0 "Nima-odsor, nationaliste mongol pro-Kuomintang et ardent défenseur de l’autonomie, a été assassiné avec succès. Selon le haut commandement du Kwantung, deux soldats ont arrêté un bus dans lequel il voyageait vers Kälgän et l’ont abattu de deux balles. Sa mort provoque une onde de choc et de peur dans la région, exactement comme prévu par le Kwantung. Les élites se demandent désormais qui sera la prochaine cible, et certains craignent de voir disparaître le rêve d’une Mongolie unifiée. Peut-être comprendront-ils enfin que seule une loyauté absolue envers [JAP.Capital.GetCapitalVictoryPointName] leur permettra de sauver leur tête..."
 men.15.a:0 "Ne pas voler trop près du soleil rouge..."

 men.16.t:0 "L’incident de Kälgän"
 men.16.d:0 "À la fin de la réunion de Zhangbei, Nima-odsor repartit pour Kälgän. À 8h45, il monta dans un bus avec deux gardes du Corps de sécurité local. Mais deux officiers japonais, envoyés par le Kwantung pour l’assassiner, stoppèrent le véhicule. Un échange de tirs éclata, et un garde mongol parvint à blesser l’un des officiers, les forçant à fuir. Rapidement, des rumeurs circulèrent sur notre implication dans cette tentative d’assassinat contre Nima-odsor, farouche patriote et provocateur anti-japonais. Malheureusement, il s’en sortit indemne."
 men.16.a:0 "Maudits incapables !"
 men.16.b:0 "Nous avons essayé la manière douce, passons à la dure..."

 men.17.t:0 "[MEN.GetNameDefCap] demande le contrôle de [621.GetName] et [746.GetName]"
 men.17.d:0 "Une requête du gouvernement [MEN.GetAdjective] est arrivée aujourd’hui aux autorités [ROOT.GetAdjective] de [MEN.Capital.GetCapitalVictoryPointName], puis transmise à [ROOT.Capital.GetCapitalVictoryPointName]. Cette demande vise le transfert des régions nord de [621.GetName] et [746.GetName], provinces prospères et vitales à notre économie. On ignore si cette ‘requête’ pourrait devenir un ultimatum, menaçant d’invasion en cas de refus..."
 men.17.a:0 "Par précaution, acceptons..."
 men.17.b:0 "Pourquoi écouter cette bande de fous !"

 men.18.t:0 "[FROM.GetNameDefCap] accepte"
 men.18.d:0 "La requête [MEN.GetAdjective] a été transmise et, après réflexion, les autorités [FROM.GetAdjective] ont décidé d’abandonner le contrôle des zones demandées et nous ont notifié leur choix."
 men.18.a:0 "Merveilleux !"

 men.19.t:0 "[FROM.GetNameDefCap] refuse"
 men.19.d:0 "La requête [MEN.GetAdjective] a été transmise et, après réflexion, les autorités [FROM.GetAdjective] ont décidé de ne pas céder le contrôle des zones demandées, et nous l’ont notifié."
 men.19.a:0 "Rien ne peut entraver l’unité mongole !"

 men.20.t:0 "[MEN.GetNameDefCap] propose l’unification mongole"
 men.20.d:0 "Avec les communistes désormais au pouvoir à [MEN.GetNameDefCap], [MEN.GetLeader], révolutionnaire influent, propose l’unification des gouvernements de [MEN.Capital.GetCapitalVictoryPointName] et de [MON.Capital.GetCapitalVictoryPointName]. Beaucoup y voient une occasion unique de créer enfin un État pour tous les Mongols."
 men.20.a:0 "Un peuple, une nation !"
 men.20.b:0 "Balivernes, nous ne plierons pas devant ces imposteurs de [MEN.Capital.GetCapitalVictoryPointName] !"

 men.21.t:0 "[FROM.GetNameDefCap] accepte"
 men.21.d:0 "Les autorités [FROM.GetAdjective] de [MON.Capital.GetCapitalVictoryPointName] ont accepté notre proposition, et l’intégration des systèmes de [MEN.Capital.GetCapitalVictoryPointName] et [MON.Capital.GetCapitalVictoryPointName] a commencé. Bientôt, un État pour tous les Mongols naîtra, par le sang ou par la paix !"
 men.21.a:0 "L’unité enfin !"

 men.22.t:0 "[FROM.GetNameDefCap] refuse"
 men.22.d:0 "Les autorités [FROM.GetAdjective] de [MON.Capital.GetCapitalVictoryPointName] ont décliné notre proposition. La raison n’est pas publique, mais on spécule sur une division politique ou économique entre [MEN.Capital.GetCapitalVictoryPointName] et [MON.Capital.GetCapitalVictoryPointName]..."
 men.22.a:0 "Quelle bande d’idiots !"

 men.23.t:0 "[FROM.GetNameDefCap] demande des territoires mongols"
 men.23.d:0 "Les autorités [FROM.GetAdjective] de [MEN.Capital.GetCapitalVictoryPointName] nous ont demandé le transfert de ‘territoires mongols’, couvrant des zones de Mongolie, du nord de la Chine ou d’autres terres peuplées de Mongols. Étant donné leur loyauté et leur utilité stratégique, militaire et économique, devons-nous accéder à leur demande ?"
 men.23.a:0 "Qu’on leur accorde."
 men.23.b:0 "Le Japon ne peut risquer une administration inefficace !"

 men.24.t:0 "[FROM.GetNameDefCap] accepte"
 men.24.d:0 "Les autorités [FROM.GetAdjective] de [JAP.Capital.GetCapitalVictoryPointName] ont accepté notre proposition, voyant sans doute notre loyauté et notre aide, et nous ont accordé notre souhait d’unifier le peuple mongol !"
 men.24.a:0 "Un pas de plus..."

 men.25.t:0 "[FROM.GetNameDefCap] refuse"
 men.25.d:0 "Les autorités [FROM.GetAdjective] de [JAP.Capital.GetCapitalVictoryPointName] ont refusé notre proposition. La raison n’est pas publique, mais on spécule sur un fossé stratégique ou politique entre [MEN.Capital.GetCapitalVictoryPointName] et [JAP.Capital.GetCapitalVictoryPointName]..."
 men.25.a:0 "Quelle honte..."

 men.26.t:0 "Les forces [SHX.GetAdjective] se retirent du Suiyuan"
 men.26.d:0 "Nos forces militaires ont montré leur supériorité lors de la bataille du Suiyuan. L’ennemi a été repoussé et contraint à la retraite. Nous contrôlons désormais presque tout le Suiyuan, bien que nous n’ayons pu avancer plus loin. Ces escarmouches nous offrent beaucoup à apprendre."
 men.26.a:0 "Voilà qui leur servira de leçon !"

 men.27.t:0 "Les forces [ROOT.GetAdjective] se retirent du Suiyuan"
 men.27.d:0 "Nos forces ont été décimées et vaincues lors de la bataille du Suiyuan. Malgré notre résistance, l’ennemi avait la supériorité du moral et de la charge. Mais nous pouvons encore tirer des leçons de ces combats..."
 men.27.a:0 "Un véritable désastre..."
l_french:
 men.28.t:0 "Impasse au Suiyuan"
 men.28.d:0 "Nos forces militaires n’ont pas pu progresser lors de la bataille du Suiyuan. Nous avons repoussé de nombreuses attaques ennemies, mais nos charges offensives et notre moral n’étaient pas suffisants pour briser leurs lignes. Toutefois, nous pouvons encore tirer des enseignements et des informations de ces escarmouches..."
 men.28.a:0 "Un gaspillage de sang et de larmes..."

 men.29.t:0 "Les forces [MEN.GetAdjective] se retirent du Suiyuan"
 men.29.d:0 "Nos forces militaires ont montré leur supériorité lors de la bataille du Suiyuan. Nous avons repoussé l’ennemi et avancé davantage, provoquant sa débâcle et sa retraite massive. Nous contrôlons désormais presque tout le Suiyuan, mais nous n’avons pas pu aller plus loin. Ces escarmouches nous offrent tout de même beaucoup à apprendre."
 men.29.a:0 "Voilà qui leur servira de leçon !"

 men.30.t:0 "Les forces [ROOT.GetAdjective] se retirent du Suiyuan"
 men.30.d:0 "Nos forces militaires ont été décimées et vaincues lors de la bataille du Suiyuan. Bien que nous ayons repoussé plusieurs attaques, la charge et le moral de l’ennemi se sont révélés supérieurs, forçant notre retraite massive et la perte de larges portions de la province. Toutefois, nous pouvons encore tirer des enseignements de ces escarmouches..."
 men.30.a:0 "Un véritable désastre..."

 men.31.t:0 "Impasse au Suiyuan"
 men.31.d:0 "Nos forces militaires n’ont pas pu progresser lors de la bataille du Suiyuan. Nous avons repoussé de nombreuses attaques ennemies, mais nos charges offensives et notre moral n’étaient pas suffisants pour briser leurs lignes. Toutefois, nous pouvons encore tirer des enseignements et des informations de ces escarmouches..."
 men.31.a:0 "Un gaspillage de sang et de larmes..."

 men.32.t:0 "Le Japon mobilise le Kwantung !"
 men.32.d:0 "Nos sources rapportent que le Japon a commencé à mobiliser l’Armée du Kwantung, ainsi que d’autres formations paramilitaires en Mongolie intérieure, comme la 1ʳᵉ et 2ᵉ armée de cavalerie de Li Shouxin et la Grande Armée vertueuse Han de Wang Ying, qui ont coupé toute communication avec notre haut commandement à [MON.Capital.GetCapitalVictoryPointName]. Une invasion japonaise semble imminente, nous devons nous préparer..."
 men.32.a:0 "David contre Goliath..."

 men.33.t:0 "Le plan d’industrialisation [ROOT.GetAdjective]"
 men.33.d:0 "Les récents plans d’industrialisation visant à transformer notre pays d’une économie agraire en une économie partiellement industrialisée sont prometteurs, mais très coûteux. Proposés par des industriels influents à [MEN.Capital.GetCapitalVictoryPointName], ils rappellent fortement le schéma du plan quinquennal [SOV.GetAdjective], dont l’efficacité a déjà été prouvée ailleurs.\n\nCependant, avec nos ressources limitées, détourner trop longtemps notre attention pourrait réduire considérablement l’efficacité de ce plan et retarder les progrès. Si nous jugeons que c’est la meilleure voie pour [MEN.GetNonIdeologyName], nous devons nous y engager pleinement !"
 men.33.a:0 "Nous devons nous engager dans ce plan !"

 ################### DÉCISIONS ###################

 MEN_inner_mongolian_gambit:0 "Le pari de la Mongolie intérieure"
 MEN_inner_mongolian_gambit_desc:0 "Alors que l’Armée du Kwantung étend progressivement son emprise sur la Chine du Nord et que le gouvernement chinois est trop faible pour résister, la Mongolie intérieure se retrouve isolée et sans défense, une opportunité mûre pour ceux qui oseront la saisir. Nos terres possèdent des ressources précieuses convoitées par les Japonais, et notre position stratégique offrirait un point d’appui crucial contre la Chine. Mais pour l’heure, notre avenir reste incertain..."

 MEN_imminent_japanese_invasion:0 "Invasion japonaise imminente"

 ################### IDÉES ###################

 MEN_kwantungs_invisible_hand:0 "La main invisible du Kwantung"
 MEN_kwantungs_invisible_hand_desc:0 "L’influence du Kwantung imprègne chaque aspect de notre armée et de notre gouvernance, nous liant aux objectifs stratégiques du Japon. Par des conseillers et un contrôle occulte, le Kwantung cherche à faire de notre nation un État fantoche, alignant nos forces, notre économie et notre direction sur ses ambitions expansionnistes. Bien que notre pays soit autonome sur le papier, l’emprise du Kwantung reste ferme, une force invisible dictant notre avenir."

 MEN_mongol_raids:0 "Raids mongols"
 MEN_mongol_raids_desc:0 "Nos terres sont ravagées par des centaines de bandits mongols, lançant des raids rapides à nos frontières, perturbant le commerce et mettant à l’épreuve notre force. Ces groupes de maraudeurs, vestiges d’un empire disparu, laissent nos villages sans défense et fragilisent la stabilité locale. Pour assurer notre avenir, nous devons mettre fin à ces incursions incessantes."

 MEN_disorganized_military:0 "Armée désorganisée"
 MEN_disorganized_military_desc:0 "Nos forces, bien que nombreuses, manquent de discipline et de cohésion. Un entraînement insuffisant, des commandants divisés et un manque d’équipement entraînent une structure chaotique, incapable de maintenir l’ordre au combat. Tant que nous n’imposerons pas la discipline et n’unifierons pas nos opérations, notre armée restera un instrument émoussé, vulnérable face à une opposition déterminée."

 MEN_the_long_winter:0 "Le long hiver"
 MEN_the_long_winter_desc:0 "L’hiver 1936 a été sans précédent : des températures inférieures à -30 °C pendant près de trois mois, forçant notre peuple à lutter pour survivre. Le bétail a péri, les pâturages sont restés stériles, les champs ensevelis sous la neige et les transports presque paralysés. La survie est devenue presque impossible pour les non préparés, déstabilisant notre tranquillité politique et économique. Alors que la souffrance s’étend, il nous faut trouver un plan de redressement, même si cela implique de chercher une aide étrangère."

 MEN_aftermath_of_the_long_winter:0 "Les suites du long hiver"

 MEN_fuel_for_the_war_machine_idea:0 "Carburant pour la machine de guerre"
 MEN_fuel_for_the_war_machine_idea_desc:0 "Nos ressources doivent devenir l’épine dorsale des ambitions japonaises en Asie de l’Est, nos terres transformées en vastes sites d’extraction pour alimenter leur économie de guerre insatiable. Alors que notre peuple travaille à remplir les quotas japonais, notre économie devient de plus en plus dépendante, enfermée dans un cycle de servitude."

 MEN_rapid_industrialization:0 "Industrialisation rapide"
 MEN_rapid_industrialization_desc:0 "Sous la pression des puissances étrangères et dans un effort pour moderniser notre économie, nous avons lancé un programme ambitieux d’expansion industrielle. De nouvelles usines et infrastructures surgissent presque du jour au lendemain. Bien que cette frénésie industrielle épuise notre peuple et nos ressources, elle promet de transformer notre pays d’arriéré en acteur productif majeur."

 MEN_rebuilding_the_disaster_of_suiyan:0 "Leçons de la campagne du Suiyuan"
 MEN_rebuilding_the_disaster_of_suiyan_desc:0 ""

 MEN_the_bank_of_mengjiang:0 "Banque du Chahar"

 MEN_the_joint_committee:0 "Comité conjoint [ROOT.GetAdjective] pour l’industrie"
 MEN_the_joint_committee_desc:0 "Une extension du gouvernement [ROOT.GETNAME] chargée de diriger la politique industrielle du pays. Sa mission est de satisfaire l’armée [JAP.GETNAME] et ses compagnies opérant dans nos frontières."

