GRE_strengthened_klaras:0 "Klaras renforcé"
GRE_politophylaki:0 "Politophylaki"
GRE_volunteer_corps:0 "Corps de volontaires [GRE.GetAdjective]"
GRE_opla:0 "O.P.L.A"
GRE_restaffed_army:0 "Armée réorganisée"
GRE_reformed_agrarian_economy:0 "Réformes économiques communistes"
GRE_controlled_stocks:0 "Réformes économiques communistes"
GRE_enforced_nationalization:0 "Réformes économiques communistes"
GRE_com_support:0 "Soutien communiste [GRE.GetAdjective]"
GRE_renewed_economic_plan:0 "Réformes économiques communistes"
GRE_protected_northern_minorities:0 "Minorités du Nord protégées"
GRE_utopia:0 "Utopie ouvrière"
GRE_resist_the_occupiers:0 "Résistance"
GRE_metaxism:0 "Métaxisme"
GRE_asphaleia:0 "Asphaleia"
GRE_yre:0 "La YPE"
GRE_Metaxas_unions:0 "Corporatisme"
