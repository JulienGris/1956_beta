#Décisions
GRE_divided_nation_category:0 "Nation en crise"
GRE_divided_nation_category_desc:0 "Notre nation est au bord de l’effondrement ; beaucoup craignent une guerre civile imminente, d’autres tentent d’abandonner le pays pour une vie meilleure à l’étranger. Pour nous relever, nous devrons prendre des décisions difficiles."

GRE_work_on_stability:0 "Rassurer la nation"
GRE_work_on_stability_desc:0 "Nous devons nous assurer que le peuple reste à nos côtés durant cette épreuve."

GRE_work_on_economy:0 "Accélérer notre redressement"
GRE_work_on_economy_desc:0 "Nous pouvons raccourcir notre période de reprise en adoptant de nouvelles lois, en négociant de meilleurs accords commerciaux et en attirant les investissements étrangers."

GRE_work_on_government:0 "Rétablir la confiance dans le gouvernement"
GRE_work_on_government_desc:0 "Nous peinons à sortir de cette situation car nos ministres sont faibles et inexpérimentés, incapables de gérer une telle crise."

GRE_honor_byzantium:0 "Honorer Byzance"
GRE_honor_byzantium_desc:0 "L’Empire byzantin est une fierté pour nous, Grecs. Même si nous ne pouvons le restaurer dans toute sa grandeur, nous pouvons l’honorer afin qu’il ne soit pas oublié."

GRE_honor_byzantium_category:0 "Honorer les Byzantins"
GRE_honor_byzantium_category_desc:0 "L’Empire byzantin est une fierté pour nous, Grecs. Même si nous ne pouvons le restaurer dans toute sa grandeur, nous pouvons l’honorer afin qu’il ne soit pas oublié."

GRE_constantinople_capital:0 "Déplacer la capitale à Constantinople"
