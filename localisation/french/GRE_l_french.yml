GRE_integrate_north_epirus:0 "Intégrer l’Épire du Nord"
GRE_integrate_north_epirus_desc:0 "Depuis 1914, l’Albanie occupe illégitimement nos terres légitimes au nord de l’Épire. Mais désormais, nous avons enfin ramené notre peuple chez lui ! Cependant, nous devons encore faire face aux soi-disant « Gjirokastrites », qui prétendent que l’Épire du Nord est partie intégrante de l’État albanais."

GRE_enosis_of_cyprus:0 "Énosis de Chypre"
#Événements
greece.5.t:0 "Mort de Demertzis"
greece.5.d:0 "Notre Premier ministre Konstantinos Demertzis est décédé d’une crise cardiaque. Durant son mandat, il a contribué à la croissance économique du pays et jouissait d’une grande popularité. Son remplaçant est le vieux général Ioánnis Metaxás, chargé de poursuivre son héritage et de préserver la Grèce en ces temps troublés.\n\n(Pour aller vers le §Rcommunisme§!, choisissez n’importe quel Premier ministre, mais n’avancez pas dans ses priorités. Attendez plutôt que les grèves éclatent.)"
greece.5.a:0 "Metaxás est nommé Premier ministre."
greece.5.b:0 "Le roi s’empare du pouvoir."
greece.5.c:0 "Il nous faut un leadership plus radical."
greece.5.e:0 "Le Parti populaire dirigera le nouveau gouvernement."

greece.6.t:0 "[FROM.GetNameDefCap] refuse"
greece.6.d:0 "Les [FROM.GetAdjective] ont rejeté nos revendications sur le Dodécanèse et les ont qualifiées d’outrageuses. Nous faisons face à deux choix : déclarer la guerre à [FROM.GetLeader] ou reculer."
greece.6.a:0 "Les îles du Dodécanèse sont [GRE.GetAdjective] !"
greece.6.b:0 "Nous ne pouvons pas nous permettre une guerre avec [FROM.GetNameDef]. Reculons."

greece.7.t:0 "[ENG.GetNameDefCap] refuse"
greece.7.d:0 "Les représentants [ENG.GetAdjective] ont refusé notre ultimatum et exigé que Chypre reste une base militaire d’importance majeure. Ils ont qualifié notre démarche de « geste insensé »."
greece.7.a:0 "Frappons fort !"
greece.7.b:0 "Arrêtez ! Nous ne pouvons pas affronter la Royal Navy [ENG.GetAdjective]."

greece.10.t:0 "[TUR.GetNameDefCap] refuse"
greece.10.d:0 "Le Premier ministre [TUR.GetAdjective] a qualifié nos revendications de « grotesques » et indignes de son attention. C’est une insulte à notre nation, et une guerre imminente entre nos pays semble inévitable. Nous avons déjà tenté de réaliser la « Megali Idea » suivant les plans expansionnistes de Venizélos et de reprendre la véritable ville grecque de Constantinople. La campagne se solda par un désastre, mené par des dirigeants et des généraux incompétents. Mais aujourd’hui, nous avons rassemblé l’esprit grec et nous vengerons 1453 !"
greece.10.a:0 "Ce n’était qu’une trêve temporaire."

greece.8.t:0 "Offres [TUR.GetAdjective]"
greece.8.d:0 "Nos ennemis veulent un compromis : ils proposent Constantinople et un paiement, mais rien de plus. Ensuite, nous serons forcés d’accepter un pacte de non-agression avec eux, garantissant la paix dans la région."
greece.8.a:0 "Soit."
greece.8.b:0 "Jamais nous ne commettrons une telle folie !"

greece.11.t:0 "[ENG.GetNameDefCap] refuse"
greece.11.d:0 "Le Premier ministre britannique a refusé de nous donner une place dans leur alliance. Nous ne pensions pas que cela finirait ainsi."
greece.11.a:0 "Quoi !?"

greece.12.t:0 "[ENG.GetNameDefCap] refuse"
greece.12.d:0 "Il semble que nos alliés ne soient pas disposés à nous rendre Chypre, malgré l’alliance conclue."
greece.12.a:0 "Et maintenant ?"

greece.13.t:0 "Refus des [SOV.GetAdjective]"
greece.13.d:0 "Malgré notre offre généreuse, les [SOV.GetAdjective] ont refusé et déclaré qu’ils ne souhaitaient pas « provoquer de différends avec [ITA.GetNameDef] »."
greece.13.a:0 "Sérieusement !?"

greece.14.t:0 "Coup d’État militaire !"
greece.14.d:0 "Tôt ce matin, de nombreux soldats et une cinquantaine de chars ont pris d’assaut la maison de Metaxás ainsi que l’ancien parlement hellénique, exigeant la reddition du gouvernement [GRE.GetAdjective] et proclamant leur autorité sur le pays ! La nation tout entière est stupéfaite d’apprendre que l’état-major militaire, autrefois digne de confiance, s’est emparé du pouvoir et a renversé Metaxás. La question est désormais : où se dirige [GRE.GetNameDef] ? Beaucoup craignent le pire."
greece.14.a:0 "Comment cela va-t-il finir ?"

greece.9.t:0 "Traité d’Athènes"
greece.9.d:0 "Le traité d’Athènes vise à régler le différend qui nous oppose à [TUR.GetNameDef] au sujet de nos revendications légitimes en Anatolie. Ce traité stipule que [TUR.GetNameDef] cédera la région de Smyrne à [GRE.GetNameDef], que l’administration [GRE.GetAdjective] traitera toute la population comme égale, que [TUR.GetNameDefCap] reconnaîtra la domination hellénique sur Smyrne et que Constantinople et la Thrace orientale seront démilitarisées."
greece.9.a:0 "Magnifique !"
greece.15.t:0 "Scandale féminin au Mont Athos"
greece.15.d:0 "Aujourd’hui, une jeune femme nommée Zoé Saradopoulou a tenté d’entrer dans la région autonome du Mont Athos. Cette région abrite vingt monastères sous la juridiction directe du Patriarche œcuménique de Constantinople. L’une des règles les plus strictes de ce lieu est que les femmes n’y sont jamais admises, la tradition affirmant que la dernière à avoir foulé ce sol fut la Théotokos (Marie, mère de Jésus) elle-même. Zoé a déclaré que nous vivons dans une société moderne et égalitaire, et que les femmes devraient pouvoir y accéder sans restriction."
greece.15.a:0 "Cela a provoqué des remous."

greece.16.t:0 "Opération Restauration"
greece.16.d:0 "Avec le soutien du haut commandement militaire, notre gouvernement a décidé de pousser plus loin en Anatolie et de reconquérir des terres perdues comme Nicomédie et la ville de nos cœurs, Constantinople. Bien que cela accroisse considérablement les tensions mondiales, c’est notre seule chance de réaliser notre rêve. Nous pourrions demander de l’aide à [ENG.GetNameDef] et [FRA.GetNameDef], mais il ne faut pas en attendre trop : cela pourrait même se retourner contre nous."
greece.16.a:0 "Il vaudrait mieux demander de l’aide d’abord."
greece.16.b:0 "Ne les impliquons pas."

greece.17.t:0 "[GRE.GetNameDefCap] demande une intervention"
greece.17.d:0 "Aujourd’hui, alors que les forces helléniques se préparent à attaquer la frontière [TUR.GetAdjective], l’ambassadeur [GRE.GetAdjective] dans notre capitale a suggéré que nous intervenions dans la guerre imminente entre eux et [TUR.GetNameDef]. Cela provoquerait une vive inquiétude chez nos voisins et nuirait à notre réputation."
greece.17.a:0 "Oui, honorons notre alliance avec les [GRE.GetAdjective]."
greece.17.b:0 "Ce n’est pas ce que prévoyait le traité d’Athènes !"

greece.18.t:0 "Intervention rejetée !"
greece.18.d:0 "En dépit des efforts de notre ambassadeur, nous n’avons pu parvenir à un accord. Ils ne nous aideront certainement pas, et ont même refusé de protéger notre pays contre de futurs ennemis possibles, au motif que nous n’avions pas respecté le traité d’Athènes."
greece.18.a:0 "Merde alors !"

greece.19.t:0 "Traité de Rome"
greece.19.d:0 "Les [ITA.GetAdjective] ont accepté de nous soutenir dans le nouveau différend qui a éclaté entre nous et la Turquie, en échange de territoires pour les [ITA.GetAdjective]. C’est le seul moyen d’obtenir leur aide, et même ainsi, ils y ont longuement hésité."
greece.19.a:0 "Bravo Il Duce !"

greece.20.t:0 "[GRE.GetNameDefCap] demande une intervention [ITA.GetAdjective]"
greece.20.d:0 "L’ambassadeur [GRE.GetAdjective] à Rome a appelé à un soutien total de la campagne anatolienne [GRE.GetAdjective]. Cela semble périlleux, mais c’est peut-être notre seule chance de relancer la campagne d’Anatolie !"
greece.20.a:0 "Oui, c’est notre chance !"
greece.20.b:0 "Quoi ? Certainement pas."

greece.21.t:0 "Constantinople reconquise !"
greece.21.d:0 "Enfin ! Constantinople est à nouveau à nous ! La région est enfin libérée de l’oppression [TUR.GetAdjective], et nous avons le droit de lui rendre son véritable nom."
greece.21.a:0 "Enfin !"

greece.22.t:0 "Smyrne reconquise !"
greece.22.d:0 "Après notre dernière campagne en Anatolie, une reconquête de Smyrne par les forces helléniques semblait hautement improbable. Et pourtant, nous avons accompli notre rêve : rebaptiser « Izmir » en Smyrne, comme il se doit, et établir une administration hellénique solide."
greece.22.a:0 "Fantastique !"

greece.23.t:0 "Prousa reconquise !"
greece.23.d:0 "Après toutes ces années, nous avons enfin repris Prousa et y avons instauré une nouvelle administration hellénique. Notre rêve de restaurer l’empire est enfin à portée de main !"
greece.23.a:0 "Merveilleux."

greece.24.t:0 "Nicomédie reconquise !"
greece.24.d:0 "Les forces [GRE.GetAdjective] ont capturé « Düzce », et nous exerçons désormais un contrôle quasi total sur la région. Nous pouvons lui rendre ses noms d’origine."
greece.24.a:0 "J’y louerais bien une maison un jour."

greece.28.t:0 "[GRE.GetAdjective] veut rejoindre l’Axe"
greece.28.d:0 "Aujourd’hui, le ministre des Affaires étrangères [GRE.GetAdjective] a rencontré nos représentants et proposé d’intégrer l’Axe. Cela pourrait nuire à nos relations avec [ITA.GetNameDef] si nous acceptons, mais nous pourrions exploiter leurs bases aériennes pour de futures campagnes en Afrique du Nord et menacer la Royal Navy [ENG.GetAdjective]."
greece.28.a:0 "Oui, qu’ils nous rejoignent."
greece.28.b:0 "Non, ne risquons pas de froisser [ITA.GetLeader]."

greece.31.t:0 "[GRE.GetNameDefCap] revendique le Dodécanèse"
greece.31.d:0 "Aujourd’hui, le ministre des Affaires étrangères [GRE.GetAdjective] a exigé que Rhodes ainsi que les autres îles du Dodécanèse, « légitimement [GRE.GetAdjective] » selon lui, soient immédiatement restituées. Bien entendu, céder une base aussi vitale serait une folie."
greece.31.a:0 "Oui, qu’ils les reprennent."
greece.31.b:0 "Non, le Dodécanèse restera nôtre !"

greece.25.t:0 "[GRE.GetNameDefCap] revendique Chypre"
greece.25.d:0 "Aujourd’hui, le ministre des Affaires étrangères [GRE.GetAdjective] a rencontré nos représentants pour discuter d’un grave différend qui affecte profondément nos relations avec [GRE.GetNameDef]. Le ministre [GRE.GetAdjective] a exigé que l’île de Chypre soit immédiatement restituée à [GRE.GetNameDef]. Perdre une base d’une telle importance stratégique serait de la pure folie, mais ils pourraient bénéficier du soutien des [GER.GetAdjective]."
greece.25.a:0 "Oui, nous ne voulons pas d’affrontement militaire avec [GRE.GetNameDef]."
greece.25.b:0 "Quoi ? Non, Chypre doit être défendue !"

greece.26.t:0 "[GRE.GetNameDefCap] cherche à rejoindre les Alliés"
greece.26.d:0 "Aujourd’hui, l’ambassadeur [GRE.GetAdjective] à Londres a rencontré notre Premier ministre pour lui exprimer l’admiration du peuple [GRE.GetAdjective] envers [ENG.GetNameDef] et proposer une alliance entre nos deux nations. Cela pourrait nous être utile, puisque la Crète servirait de base navale majeure en Méditerranée et réduirait l’influence [ITA.GetAdjective] dans les Balkans."
greece.26.a:0 "Oui, qu’ils nous rejoignent."
greece.26.b:0 "Mieux vaut éviter."

greece.27.t:0 "[GRE.GetNameDefCap] réclame Chypre"
greece.27.d:0 "Les [GRE.GetAdjective] n’ont pas oublié la promesse que nous leur avions faite de céder Chypre s’ils rejoignaient la Grande Guerre, et insistent pour que nous la leur donnions. C’est une base d’une importance militaire capitale, mais nous pourrions toujours l’utiliser même s’ils sont dans notre faction. Faut-il vraiment la leur céder ?"
greece.27.a:0 "Nous tenons nos promesses."
greece.27.b:0 "Je ne me souviens d’aucune promesse."

greece.29.t:0 "Ultimatum [GRE.GetAdjective]"
greece.29.d:0 "Le ministre des Affaires étrangères [GRE.GetAdjective] a rencontré notre président pour exiger un traité stipulant que plusieurs régions, telles qu’Izmir, Izmit, Istanbul et d’autres, soient cédées à leur « propriétaire légitime ». Nous ne pouvons pas les prendre au sérieux. De telles revendications insensées ne valent pas notre temps. Mais peut-être pourrions-nous trouver un compromis en échange de fonds."
greece.29.a:0 "Jamais !"
greece.29.b:0 "Offrons-leur « Constantinople », mais rien de plus !"

greece.30.t:0 "Les [GRE.GetAdjective] proposent de rejoindre notre faction"
greece.30.d:0 "Aujourd’hui, le représentant [GRE.GetAdjective] à Moscou a rencontré notre ministre des Affaires étrangères et proposé de rejoindre notre faction pour nous aider. Mais cela pourrait provoquer un conflit avec [ITA.GetLeader] ou [GER.GetLeader], qui cherchent à étendre leur influence dans les Balkans. Soit nous sécurisons le sud des Balkans, soit nous l’abandonnons."
greece.30.a:0 "Oui, qu’ils nous rejoignent."
greece.30.b:0 "Non, inutile de prendre ce risque."
greece.32.t:0 "La Troisième Civilisation hellénique"
greece.32.d:0 "Aujourd’hui, Metaxas et ses hommes politiques se sont rassemblés au centre d’Athènes, devant le Parlement, pour proclamer la Troisième Civilisation hellénique. C’était son objectif principal depuis le début de son règne : moderniser et renforcer la nation grecque. La proclamation fut suivie par les acclamations de la foule et les chants de « Doxa ston Metaxa ! » (Gloire à Metaxas !)."
greece.32.a:0 "Doxa ston Metaxa !"

greece.33.t:0 "Qui dirigera les fascistes ?"
greece.33.d:0 "Geórgios Merkouris est actuellement à la tête du Parti fasciste. Toutefois, nous pourrions le remplacer par un autre candidat. Konstantínos Logothetópoulos a prouvé sa valeur et sa ruse ; cela ne met pas Merkouris hors-jeu pour autant, mais il s’est montré aussi habile que Logothetópoulos."
greece.33.a:0 "Merkouris doit diriger le Parti fasciste !"
greece.33.b:0 "Rállis prend la tête du Parti fasciste."
greece.33.c:0 "Logothetópoulos pour le fascisme !"

greece.34.t:0 "La Grande Grèce"
greece.34.d:0 "Ensemble, nous nous sommes levés et avons conquis les terres légitimement [GRE.GetAdjective]. Nous allons instaurer une nouvelle fête nationale, car c’est un accomplissement véritablement historique. Cela aura un retentissement mondial. Peut-être serons-nous considérés comme une grande puissance, mais nous, [GRE.GetAdjective], resterons toujours unis et prêts à tout."
greece.34.a:0 "Pour la gloire de l’Hellás !"

greece.35.t:0 "[GRE.GetNameDefCap] exige Istanbul"
greece.35.d:0 "Le roi Georges II de Grèce a récemment exigé de notre gouvernement la restitution des terres « légitimement [GRE.GetAdjective] » en Thrace orientale, incluant des villes comme Edirne et l’ancienne capitale, Istanbul. Comment devons-nous répondre à cet ultimatum ?"
greece.35.a:0 "Cédons aux exigences [GRE.GetAdjective]."
greece.35.b:0 "Ils pensent vraiment que nous allons céder aussi facilement ?"

greece.37.t:0 "Réponse [TUR.GetAdjective]"
greece.37.d:0 "Les [TUR.GetAdjective] ont cédé à nos exigences et accepté le retour de la Thrace orientale. Cela va renforcer le nationalisme et améliorer notre efficacité industrielle grâce à l’importance économique de la région."
greece.37.a:0 "Constantinople est à nous, encore une fois !"

greece.36.t:0 "Réponse [TUR.GetAdjective]"
greece.36.d:0 "Les [TUR.GetAdjective] ont rejeté nos exigences concernant la restitution de la Thrace orientale. Le ministre des Affaires étrangères [TUR.GetAdjective] a déclaré qu’ils n’accepteraient jamais une telle demande et que la Thrace orientale resterait [TUR.GetAdjective]."
greece.36.a:0 "Ils nous sous-estiment."

greece.38.t:0 "Les [GRE.GetAdjective] veulent acheter Chypre"
greece.38.d:0 "[GRE.GetNameDefCap] nous a proposé une aide financière considérable pour l’achat de Chypre. Cette fois, [GRE.GetNameDef] a clairement fait comprendre qu’ils n’oseraient pas nous attaquer si nous refusons. Quelle doit être notre réponse ?"
greece.38.a:0 "Acceptons !"
greece.38.b:0 "À quoi pensent-ils ? Bien sûr que nous refusons !"

greece.39.t:0 "Transaction réussie !"
greece.39.d:0 "Les [ENG.GetAdjective] ont accepté notre offre ; Énosis, enfin !"
greece.39.a:0 "Unis à jamais !"

greece.40.t:0 "Rejet [ENG.GetAdjective]"
greece.40.d:0 "Les [ENG.GetAdjective] ont rejeté notre offre exceptionnellement généreuse. Cette réponse outrageante aura des conséquences, même sans notre intervention directe."
greece.40.a:0 "Malediction !"

greece.41.t:0 "Mort de Panagis Tsaldaris"
greece.41.d:0 "Panagis Tsaldaris nous a malheureusement quittés aujourd’hui. Son leadership populaire durant les jours de la Seconde République hellénique va cruellement manquer. Mais au-delà du deuil, sa disparition a ouvert un vide politique : la direction du Parti populaire conservateur passe à son neveu, Konstantínos Tsaldaris."
greece.41.a:0 "Peut-être que du sang neuf est ce qu’il fallait aux conservateurs."

greece.42.t:0 "Mort de Ioánnis Metaxás"
greece.42.d:0 "La mort a encore frappé notre nation : cette fois, c’est notre dirigeant Ioánnis Metaxás qui s’est éteint. Le pays est silencieux ; nul n’attendait que ce jour vienne si tôt. Sa succession est cependant plus simple qu’on ne l’imaginait, puisqu’il avait préparé son successeur bien avant sa disparition. Le nouveau Premier ministre, Aléxandros Koryzis, fut l’un des premiers informés de son décès. Il a déjà formé son gouvernement et se dit prêt à diriger [GRE.GetNameDef] dans la continuité de son prédécesseur."
greece.42.a:0 "[GRE.GetNameDefCap] est en deuil."

greece.43.t:0 "Élections législatives de 1936"
greece.43.d:0 "Les élections prévues aujourd’hui ont vu Demertzis et son cabinet affronter les partis Populaire et Libéral, chacun récoltant une part des voix. Cependant, il est prévu que Demertzis poursuive son mandat, puisque le roi Georges le soutient."
greece.43.a:0 "Demertzis et son cabinet restent en place."
greece.43.b:0 "Le Parti populaire l’emporte."

greece.46.t:0 "Guerre civile !"
greece.46.d:0 "Après la mort de Panagis Tsaldaris, figure influente de la Seconde République hellénique et chef du court gouvernement de transition après le défunt Premier ministre Konstantínos Demertzis, des groupes fascistes et communistes se sont soulevés dans toute la Grèce, chacun cherchant à prendre le pouvoir. Toutefois, Geórgios Merkouris est parvenu à unir la plupart des groupes d’extrême-droite contre les communistes. La victoire est probable, mais elle ne viendra pas sans effusion de sang."
greece.46.a:0 "En avant, patriotes !"

greece.47.t:0 "Fin de la guerre civile"
greece.47.d:0 "La guerre civile qui ravageait notre pays est enfin terminée. Nous espérons un avenir meilleur avec notre nouveau gouvernement établi."
greece.47.a:0 "Dieu soit loué."

greece.48.t:0 "L’offre de Klaras"
greece.48.d:0 "Athanasios Klaras, également connu sous le nom d’« Aris Véloukhiótis », nous a contactés pour proposer de prendre le commandement de notre armée. Vu le manque d’état-major, son offre est tentante."
greece.48.a:0 "Ce n’est pas le moment de faire les difficiles !"
greece.48.b:0 "Il ne causera que des problèmes."

greece.49.t:0 "Fin de la guerre civile"
greece.49.d:0 "La guerre civile qui ravageait notre pays est enfin terminée. Nous espérons un avenir meilleur avec notre nouveau gouvernement établi."
greece.49.a:0 "Dieu soit loué."

greece.50.t:0 "Mort du roi"
greece.50.d:0 "Aujourd’hui, le roi Georges II est mort d’artériosclérose. Au départ, beaucoup ont cru à une farce du 1er avril, mais lorsque la vérité fut révélée, le peuple a pleuré l’ancien roi. Il guida le pays dans des temps difficiles et ne songea jamais à abdiquer."
greece.50.a:0 "Le trône a un nouvel occupant !"

greece.51.t:0 "Victoire socialiste éclatante"
greece.51.d:0 "Les fascistes ont échoué à briser le rêve d’une utopie communiste [GRE.GetAdjective] ! Jamais plus les travailleurs ne seront torturés par les capitalistes. En avant, camarades, vers un avenir rouge !"
greece.51.a:0 "Ce n’est que le commencement !"

greece.52.t:0 "Que faire de Klaras ?"
greece.52.d:0 "Lorsque nous avons accepté l’offre d’Athanasios Klaras durant la guerre civile, il est devenu commandant suprême de notre armée. Cela pose aujourd’hui quelques problèmes : nous devons décider comment gérer cette situation."
greece.52.a:0 "Légitimons son contrôle."
greece.52.b:0 "Réprimons-le."

greece.53.t:0 "[GRE.GetNameDefCap] cherche à se rapprocher"
greece.53.d:0 "La toute nouvelle République socialiste de Grèce nous a proposé un rapprochement diplomatique. Devons-nous accepter ?"
greece.53.a:0 "Vers un monde communiste !"
greece.53.b:0 "Non, ils valent à peine mieux que les fascistes."

greece.54.t:0 "Un nouvel ami"
greece.54.d:0 "Les [SOV.GetAdjective] ont accepté notre offre. Cela ne peut qu’apporter des avantages."
greece.54.a:0 "Parfait."

greece.55.t:0 "Ils ont refusé"
greece.55.d:0 "Les [SOV.GetAdjective] ont décliné notre proposition de rapprochement."
greece.55.a:0 "Avait-il seulement une raison ?"

greece.56.t:0 "Former un gouvernement stalinien"
greece.56.d:0 "Le dirigeant soviétique Iossif Staline a développé sa doctrine politique, le « stalinisme », dont l’un des principaux piliers est le développement industriel. Depuis son arrivée au pouvoir dans les années 1920, l’industrie soviétique a littéralement explosé. Il est préférable que nous adoptions nous aussi ce système."
greece.56.a:0 "[GRE.GetNameDefCap] n’aura plus jamais de problème économique !"

greece.57.t:0 "[GRE.GetNameDefCap] veut rejoindre le Komintern"
greece.57.d:0 "[GRE.GetNameDefCap] a demandé à rejoindre l’alliance du Komintern. Devons-nous accepter ?"
greece.57.a:0 "Bienvenue dans le Komintern."
greece.57.b:0 "Cela ne ferait que nous affaiblir."
greece.58.t:0 "Les [SOV.GetAdjective] acceptent"
greece.58.d:0 "Les [SOV.GetAdjective] ont accepté ; nous faisons officiellement partie du Komintern."
greece.58.a:0 "Excellent !"

greece.59.t:0 "Les [SOV.GetAdjective] refusent"
greece.59.d:0 "Les [SOV.GetAdjective] ont refusé ; nous ne rejoignons donc pas le Komintern."
greece.59.a:0 "Peu importe."

greece.60.t:0 "[GRE.GetNameDefCap] nous invite dans son alliance"
greece.60.d:0 "[GRE.GetNameDefCap] nous a envoyé une invitation à sa nouvelle faction visant à unir les Balkans sous le socialisme. Devons-nous accepter ?"
greece.60.a:0 "Bien sûr !"
greece.60.b:0 "Encore une ruse fasciste."

greece.61.t:0 "Ils ont accepté"
greece.61.d:0 "L’un des nouveaux régimes communistes a accepté notre invitation à rejoindre notre alliance."
greece.61.a:0 "Les fascistes vont trembler."

greece.62.t:0 "Ils ont refusé"
greece.62.d:0 "Le nouvel État communiste balkanique a refusé notre invitation à rejoindre notre faction."
greece.62.a:0 "Nous survivrons sans eux."

greece.63.t:0 "[GRE.GetNameDefCap] nous invite dans son alliance"
greece.63.d:0 "[GRE.GetNameDefCap] nous a envoyé une invitation à sa nouvelle faction visant à unir les Balkans sous le socialisme. Devons-nous accepter ?"
greece.63.a:0 "Bien sûr !"
greece.63.b:0 "Encore une ruse fasciste."

greece.64.t:0 "Nommer un nouveau chef de l’armée"
greece.64.d:0 "Depuis l’aube de ce nouveau jour, nous travaillons à recruter et promouvoir des officiers pour diriger l’armée. Nous avons presque achevé cette tâche, mais il reste à désigner un nouveau chef d’état-major de l’armée. Nous avons rassemblé plusieurs candidats."
greece.64.a:0 "L’expert en attaque, Athanasios Klaras"
greece.64.b:0 "L’expert en défense, Stéfanos Sarafis"

greece.65.t:0 "Sort de la famille royale"
greece.65.d:0 "La monarchie grecque, créée au début du XIXe siècle, a toujours œuvré pour l’inégalité et favorisé les classes supérieures tout en condamnant les travailleurs. Nous devons décider comment la punir pour tout cela."
greece.65.a:0 "Exécutez-les !"
greece.65.b:0 "Exilez-les !"

greece.66.t:0 "Nous avons capitulé"
greece.66.d:0 "Nous avons été chassés de notre patrie, mais la lutte continue depuis les territoires insulaires restants !"
greece.66.a:0 "Nous ne capitulerons jamais."

greece.69.t:0 "Révolte crétoise !"
greece.69.d:0 "Le mouvement vénizéliste est né en Crète à la fin du XIXe siècle lorsqu’ils tentèrent de libérer l’île et de l’unir au premier royaume de Grèce dirigé par le roi Georges Ier. Aujourd’hui, certains officiers vénizélistes et politiciens locaux tentent de renverser notre gouvernement et de rétablir un régime vénizéliste. Nous ne pouvons évidemment pas laisser faire."
greece.69.a:0 "Envoyez l’armée les écraser."

greece.70.t:0 "Les rebelles écrasés"
greece.70.d:0 "Il y a quelques semaines, les vénizélistes crétois ont tenté un coup d’État en Crète. Nous avons envoyé l’armée contre eux et ils ont été écrasés."
greece.70.a:0 "Justice est faite."

greece.71.t:0 "Piller les arsenaux ennemis"
greece.71.d:0 "Nos armées manquent d’équipement et notre industrie est insuffisante pour y remédier. Mais l’ennemi, qui contrôle les zones industrielles, en possède. Nous allons envoyer des milices de guérilla tenter de piller les dépôts et ainsi rééquiper nos troupes."
greece.71.a:0 "Allez-y."

greece.72.t:0 "Raid réussi"
greece.72.d:0 "Nos guérillas ont réussi à piller les réserves ennemies et à saisir de nombreux fusils. Cela nous aidera énormément."
greece.72.a:0 "C’est déjà ça de gagné."

greece.73.t:0 "Raid raté"
greece.73.d:0 "Nos guérillas ont échoué dans leur tentative de pillage des dépôts ennemis."
greece.73.a:0 "Malediction."

greece.74.t:0 "Nommer un nouveau chef de l’armée"
greece.74.d:0 "Depuis l’aube de ce nouveau jour, nous travaillons à recruter et promouvoir des officiers pour diriger l’armée. Nous avons presque achevé cette tâche, mais il reste à désigner un nouveau chef d’état-major de l’armée. Nous avons rassemblé plusieurs candidats."
greece.74.a:0 "Le spécialiste de l’offensive, Manólis Mantakás"
greece.74.b:0 "L’expert en défense, Stéfanos Sarafis"

gre_news.1.t:0 "Guerre civile en Grèce !"
gre_news.1.d:0 "Bien que ce conflit couvait depuis des mois, la mort du Premier ministre provisoire fut l’élément déclencheur. Personne ne sait combien de temps durera cette guerre, mais tous espèrent qu’elle prendra fin rapidement."
gre_news.1.a:0 "Et la dette, alors ?"
gre_news.1.b:0 "Que ça finisse vite."

gre_news.2.t:0 "La guerre civile grecque est terminée !"
gre_news.2.d:0 "La Grèce vient d’être ravagée par une sanglante guerre civile qui a déchiré le pays. Les hostilités ont cessé avec l’établissement d’un nouveau gouvernement et le désarmement des dernières milices d’opposition. Si le calme semble revenu, la tension reste forte et le peuple grec espère que les combats ne reprendront pas."
gre_news.2.a:0 "Et la dette, toujours ?"
gre_news.2.b:0 "Enfin !"

gre_news.3.t:0 "La Grèce rejoint le [ITA.GetFactionName]"
gre_news.3.desc:0 "Dans un communiqué conjoint, [ITA.GetLeader] et [GRE.GetLeader] ont annoncé que leurs gouvernements étaient parvenus à un accord pour régler leur différend frontalier et cimenter une alliance perpétuelle. Tandis que [GRE.GetNameDef] rejoindra le [ITA.GetFactionName], le gouvernement [ITA.GetAdjective] cédera les îles du Dodécanèse à [GRE.GetNameDef]."
gre_news.3.a:0 "Intéressant."
gre_news.3.b:0 "Nous sommes plus forts ensemble."

greece.75.t:0 "Chypre contre la guerre !"
greece.75.d:0 "À présent que les [ENG.GetAdjective] sont en guerre avec les [GER.GetAdjective], une opportunité s’offre à nous. Nos troupes ont fait preuve de bravoure et d’habileté, et Chypre, longtemps sous contrôle [ENG.GetAdjective], n’attend que de nous rejoindre. Nous pouvons demander à [ENG.GetNameDef] de nous restituer l’île en échange de notre loyauté garantie envers les Alliés."
greece.75.a:0 "Envoyons la proposition."
greece.75.b:0 "Mieux vaut rester en dehors de tout ça."

greece.76.t:0 "Une offre du gouvernement [GRE.GetAdjective]"
greece.76.d:0 "L’île de Chypre a toujours été difficile à maintenir. Sa proximité avec les membres de l’Axe complique sa logistique. Mais une solution se présente : le gouvernement [GRE.GetAdjective] propose de reprendre Chypre en échange de sa fidélité à notre alliance et de son engagement militaire contre [GER.GetNameDef]. Accepter, c’est une charge en moins pour le Haut Commandement, mais perdre un avant-poste stratégique. Il faut trancher."
greece.76.a:0 "Un échange acceptable."
greece.76.b:0 "Nous n’avons pas besoin de leur aide."

greece.77.t:0 "Les [ENG.GetAdjective] acceptent"
greece.77.d:0 "Enfin, nous sommes réunis ! Nos généreux alliés [ENG.GetAdjective] nous ont rendu Chypre ! Mais il nous faut préparer nos hommes, car nous sommes désormais en guerre contre l’Axe. Pour la Grèce !"
greece.77.a:0 "Magnifique."

greece.78.t:0 "Les [ENG.GetAdjective] refusent"
greece.78.d:0 "Les [ENG.GetAdjective] ont rejeté notre proposition ! Malgré notre offre généreuse, ils refusent de restituer Chypre. C’est un coup dur pour les relations [GRE.GetAdjective]-[ENG.GetAdjective]."
greece.78.a:0 "Quel dommage."

greece.79.t:0 "Notre orientation dans les Balkans"
greece.79.d:0 "Le moment est venu de choisir notre voie pour répandre le communisme chez nos voisins : soit adopter une approche plus lente mais moins coûteuse, soit les envahir et libérer nos frères et sœurs balkaniques."
greece.79.a:0 "Nous contacterons les groupes communistes voisins."
greece.79.b:0 "Préparez les plans d’invasion, nous partons en guerre."

greece.80.t:0 "Dictature proclamée !"
greece.80.d:0 "Après les récentes grèves agricoles et industrielles dans le nord, le Premier ministre Ioánnis Metaxás a décidé de suspendre le Parlement et certaines parties de la Constitution. Dans un discours radiophonique, il a déclaré une dictature antidémocratique : tous les pouvoirs sont désormais concentrés entre ses mains."
greece.80.a:0 "Plus de retour en arrière possible."

greece.81.t:0 "Mai sanglant"
greece.81.d:0 "Le KKE a mobilisé des travailleurs dans les villes du nord du pays pour protester contre les récents développements politiques."
greece.81.a:0 "Réprimons les grévistes. Nous devons rester unis."
greece.81.b:0 "Soutenons les grévistes. Il est temps que le prolétariat s’unisse !"

greece.82.t:0 "[GRE.GetNameDefCap] propose sa protection"
greece.82.d:0 "Les [ITA.GetAdjective] représentent aujourd’hui la plus grande menace pour notre indépendance, et les [GRE.GetAdjective] semblent partager cette inquiétude : leur Premier ministre nous offre leur protection contre [ITA.GetNameDef], en échange d’une influence accrue dans notre pays. Quelle doit être notre réponse ?"
greece.82.a:0 "C’est notre dernière chance."
greece.82.b:0 "Hors de question."

greece.83.t:0 "[ALB.GetNameDefCap] se soumet"
greece.83.d:0 "[ALB.GetNameDefCap] a accepté notre offre de protection."
greece.83.a:0 "Parfait !"

greece.84.t:0 "[ALB.GetNameDefCap] reste indépendant"
greece.84.d:0 "Bien que nous leur ayons généreusement offert notre protection, les entêtés [ALB.GetAdjective] ont refusé. Devons-nous imposer par la force la question de l’Épire du Nord ?"
greece.84.a:0 "La paix pour notre temps !"
greece.84.b:0 "Ils ont eu leur chance. À nous de jouer."

greece.85.t:0 "[GRE.GetNameDefCap] propose un pacte de non-agression"
greece.85.d:0 "Le gouvernement [GRE.GetAdjective] a proposé de signer un pacte de non-agression. Bien que ce traité n’apporte guère d’avantages à [ITA.GetNameDef], il pourrait ouvrir la voie à une influence grandissante par la diplomatie plutôt que par la force."
greece.85.a:0 "Recevons leur ambassadeur."
greece.85.b:0 "Ignorons la demande."
greece.86.t:0 "[ITA.GetNameDefCap] accepte"
greece.86.d:0 "Le gouvernement [ITA.GetAdjective] a accepté notre demande, et [ITA.GetLeader] a reçu notre ambassadeur pour confirmer qu’un traité d’amitié éternelle entre nos deux pays est essentiel afin de garantir la paix en Méditerranée et dans les Balkans."
greece.86.a:0 "Excellent !"

greece.87.t:0 "[ITA.GetLeader] rejette notre proposition"
greece.87.d:0 "Le gouvernement [ITA.GetAdjective] a même refusé d’envisager notre proposition de pacte, ce qui a provoqué la colère de notre ambassadeur."
greece.87.a:0 "Quel dommage."

greece.88.t:0 "[GRE.GetNameDefCap] propose une alliance"
greece.88.d:0 "Dans une longue lettre envoyée par l’ambassadeur [GRE.GetAdjective], [GRE.GetLeader] a suggéré que [GRE.GetNameDef] rejoigne le [ITA.GetFactionName] si notre gouvernement acceptait d’abandonner le Dodécanèse. Ils nous assurent toutefois que nous pourrions conserver des droits de port dans les îles et qu’ils garantiraient les droits des colons locaux pour faciliter la transition.\n\nLa lettre précise aussi que les investissements économiques [ITA.GetAdjective] dans le pays pourraient renforcer un tel traité."
greece.88.a:0 "De nouveaux alliés sont toujours les bienvenus."
greece.88.b:0 "Quelle folie."

greece.89.t:0 "[ITA.GetLeader] nous accueille dans le [ITA.GetFactionName]"
greece.89.d:0 "Le gouvernement [ITA.GetAdjective] a accepté notre proposition d’échange et nous a accueillis au sein du [ITA.GetFactionName]. Dans le même temps, nous avons hissé le drapeau [GRE.GetAdjective] à Rhodes, sous les acclamations de la population."
greece.89.a:0 "Un territoire de plus récupéré !"

greece.90.t:0 "[ITA.GetLeader] rejette notre proposition"
greece.90.d:0 "Le gouvernement [ITA.GetAdjective] a même refusé d’envisager notre proposition de pacte, ce qui a provoqué la colère de notre ambassadeur."
greece.90.a:0 "C’est insensé."

# Idées
GRE_engineering_push:0 "Effort industriel"

GRE_depression_1:0 "« Megali Ifesi »"
GRE_depression_1_desc:0 "Megali Ifesi signifie Grande Dépression en grec. La République hellénique a été durement frappée après l’échec de la campagne militaire en Anatolie, entraînant une catastrophe économique et une crise migratoire colossale. Le gouvernement doit déployer d’énormes efforts pour remettre l’économie sur pied."

GRE_depression:0 "« Megali Ifesi »"
GRE_depression_desc:0 "Megali Ifesi signifie Grande Dépression en grec. La République hellénique a été durement frappée après l’échec de la campagne militaire en Anatolie, entraînant une catastrophe économique et une crise migratoire colossale. Le gouvernement doit déployer d’énormes efforts pour remettre l’économie sur pied."

GRE_depression_recovery:0 "Relance après la dépression"
RE_depression_recovery_desc:0 "Le gouvernement s’efforce de mettre fin à notre crise économique."

GRE_naval_arsenal:0 "Arsenal naval amélioré"
GRE_naval_arsenal_desc:0 "Pour doubler la taille de notre marine, nous avons choisi d’améliorer notre arsenal naval plutôt que de soutenir les chantiers civils. Cela nous aidera à nous préparer à une éventuelle invasion maritime."

GRE_civilian_shipbuilders:0 "Chantiers civils satisfaits"
GRE_civilian_shipbuilders_desc:0 "Compter sur notre marine civile fut l’une des meilleures décisions que nous ayons jamais prises. Nous en tirerons de grands bénéfices, tant économiques que diplomatiques."

GRE_collecting_from_trade:0 "Bénéfices du commerce"
GRE_collecting_from_trade_desc:0 "Nous pouvons désormais récolter les fruits de nos investissements et récupérer ce qui nous revient de droit."

GRE_motorized_effort:0 "Une armée motorisée"
GRE_motorized_effort_desc:0 "Notre armée dispose désormais de camions et d’équipements motorisés, ce qui permet de renforcer plus rapidement nos lignes de front et de tenir le terrain."

GRE_infantry_weapons:0 "Production de fusils"
GRE_infantry_weapons_desc:0 "Des entreprises étrangères nous ont fourni de meilleures méthodes de production d’armes d’infanterie, nous permettant de fabriquer plus d’armes en moins de temps."

GRE_autarky_focus:0 "Abandon de la démocratie"
GRE_autarky_focus_desc:0 "Le pays est au bord de l’effondrement. Nous devons rétablir l’ordre immédiatement !"

GRE_recruitment_effort:0 "Agences de recrutement"
GRE_recruitment_effort_desc:0 "Chaque homme doit se battre pour la gloire de notre pays. Nous ne pourrons retrouver nos anciennes gloires que par la conquête et l’action militaire."

GRE_national_youth_organisation:0 "Organisation nationale de la jeunesse"

GRE_IKA:0 "Mesures économiques"

GRE_national_split:0 "Schisme national"

GRE_democratic_support:0 "Soutien démocratique"

GRE_foreign_investments:0 "Investissements étrangers"
GRE_foreign_investments_desc:0 "Le gouvernement a décidé d’autoriser davantage d’entreprises étrangères à investir dans le pays pour stimuler l’économie."

GRE_low_stability:0 "Instabilité nationale"
GRE_low_stability_desc:0 "Le peuple a perdu confiance dans notre gouvernement. Il faut agir !"

GRE_economic_downfall:0 "Effondrement économique"
GRE_economic_downfall_desc:0 "Des taux d’intérêt colossaux et des exportations faibles ont plongé notre ministère des Finances dans le chaos. Nous devons négocier de nouveaux accords économiques avant de sombrer complètement dans la faillite !"

GRE_government_crisis:0 "Gouvernement faible"
GRE_government_crisis_desc:0 "Notre nouveau leadership doit affronter des taux d’intérêt élevés et une récession. La Grande Dépression de 1929 a également eu un impact majeur sur notre économie. La population accuse nos dirigeants d’avoir mal géré la crise."

GRE_patriarch_support:0 "Soutien du patriarche"

GRE_metaxas_plan:0 "Corporatisme"

GRE_third_hellenic_civ:0 "Troisième civilisation hellénique"
GRE_third_hellenic_civ_desc:0 "Le peuple s’est levé et a fait de la Grèce une nouvelle puissance. La Troisième civilisation hellénique durera de nombreuses années !"

GRE_greater_greece_idea:0 "Grande Grèce proclamée"

GRE_greek_payments:0 "Paiements [GRE.GetAdjective]"

GRE_british_exchange:0 "Échanges [ENG.GetAdjective]"

GRE_semi_constitutional_monarchy:0 "Monarchie semi-constitutionnelle"

GRE_strong_kingdom:0 "Monarchie renforcée"

GRE_naval_industry_rivalary:0 "Industrie navale divisée"
GRE_naval_industry_rivalary_desc:0 "Notre industrie navale est divisée entre deux factions principales : l’arsenal militaire et les chantiers civils. Nous devons satisfaire le secteur civil si nous voulons bâtir une puissante marine."
GRE_divided_nation_1:0 "Nation divisée"
GRE_divided_nation_1_desc:0 "Le pays est divisé entre de nombreuses factions idéologiques ! Nous devons agir vite !"
GRE_shadow_of_1921:0 "Ombre de 1922"
GRE_shadow_of_1921_desc:0 "Après la campagne d’Anatolie, nos nouveaux officiers manquent d’expérience et de volonté de combattre. De nouveaux plans et réformes sont nécessaires pour protéger notre nation des menaces extérieures, à l’est comme au nord."
GRE_general_staff:0 "État-major général"
GRE_idea_transition_government:0 "Gouvernement de transition"
GRE_klaras_army_grip:0 "Mainmise de Klaras sur l’armée"
GRE_civil_war_exhaustion:0 "Destruction due à la guerre civile"
GRE_securing_the_government:0 "Consolider le nouveau régime"
GRE_securing_the_government_fascism:0 "Consolider le nouveau régime"
