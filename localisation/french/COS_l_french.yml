l_french:
  r56_costa_rica_focus:0 "Arbre de priorités du Costa Rica"

  costa_rica.1.t:0 "Élections générales de 1936"
  costa_rica.1.d:0 "Après quatre années de gouvernement du PRN, les très attendues élections générales de 1936 sont enfin arrivées. Bien que de nombreux proches alliés du président Ricardo Jiménez Oreamuno lui aient conseillé d’ignorer la constitution et de se représenter, il a constamment refusé ces offres et appels, ne voulant pas compromettre le fragile système politique de son pays. Il savait que le mépris flagrant des valeurs démocratiques entacherait à jamais même une victoire éclatante. Ainsi, León Cortés Castro décida de prendre la relève et de se présenter pour le Partido Republicano Nacional, tandis que le juge Octavio Béeche Argüello fut choisi pour être le principal candidat de l’opposition sous la bannière du Partido Nacional.\n\nCes élections furent considérées comme une curiosité historique, marquées par plusieurs événements inhabituels : la quasi-disparition du Partido Nacional et la montée surprenante en popularité du Partido Comunista de Costa Rica. Cependant, les institutions du [COS.GetNonIdeologyName] sont bien trop stables pour être ébranlées par un seul scrutin."
  costa_rica.1.a:0 "Le Partido Republicano Nacional obtient une réélection !"
  costa_rica.1.b:0 "Victoire inattendue pour le Partido Nacional récemment relancé !"

