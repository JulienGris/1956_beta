# Priorités
COL_embrace_our_catholic_heritage:0 "Adopter notre héritage catholique"
COL_embrace_our_catholic_heritage_desc:0 "Nous devons embrasser notre héritage catholique et maintenir de bonnes relations avec l’Église."

COL_legalize_the_pcc:0 "Légaliser le PCC"
COL_legalize_the_pcc_desc:0 "Afin que la voix des travailleurs soit entendue, nous devons légaliser le PCC."

COL_hermano_bolivariano:0 "Los Hermanos Bolivarianos"
COL_hermano_bolivariano_desc:0 "Notre passé bolivarien nous appelle à devenir une nation nouvelle et forte !"

COL_industrial_effort:0 "Renforcer l’industrie"
COL_industrial_effort_desc:0 "Concentrons tous nos efforts politiques sur le développement de l’industrie civile dans un grand bond en avant."

COL_acerias_pdr:0 "Moderniser les Acerías Paz del Río"
COL_acerias_pdr_desc:0 "Nous avons à la fois du charbon et du fer. Avec des investissements étrangers, nous pouvons produire plus d’acier."

COL_puerto_buenaventura:0 "Axe Buenaventura-Cali"
COL_puerto_buenaventura_desc:0 "Il est temps de relier les plaines fertiles du Valle del Cauca au port en eau profonde de Buenaventura."

COL_indumil:0 "Industria Militar de Colombia"
COL_indumil_desc:0 "La création d’une entreprise publique chargée de la fabrication de munitions, fusils et explosifs permettra de mieux équiper notre armée."

COL_infrastructure_caribe:0 "Relier l’Atlántico"
COL_infrastructure_caribe_desc:0 "De nombreux efforts peuvent être entrepris pour relier le fleuve Magdalena à Carthagène, améliorer le port de Barranquilla et soutenir l’industrie croissante de Medellín."

COL_indumil_2:0 "Étendre l’Industria Militar"
COL_indumil_2_desc:0 "La situation actuelle exige l’expansion de nos capacités de production d’armes pour répondre aux besoins croissants de notre armée."

COL_fortify_caribe:0 "Fortifier la côte caraïbe"
COL_fortify_caribe_desc:0 "La côte caraïbe est l’endroit où nous sommes le plus vulnérables, notamment face aux invasions navales. L’installation de fortifications côtières nous permettra de réduire ces risques."

COL_fortify_caribe_aa:0 "Protéger le ciel du nord"
COL_fortify_caribe_aa_desc:0 "Notre côte est également vulnérable à d’éventuelles attaques aériennes. Nous devrions installer des batteries anti-aériennes pour garantir une protection supplémentaire."

COL_infrastructure_harsh:0 "Améliorer les infrastructures nationales"
COL_infrastructure_harsh_desc:0 "De nombreuses régions de [COL.GetNameDef] restent mal reliées. Des travaux importants et une extension des infrastructures permettront d’exploiter leur potentiel économique."

COL_industry_effort_2:0 "Acquérir des machines modernes"
COL_industry_effort_2_desc:0 "De nouvelles techniques industrielles ont émergé ces dernières années. La modernisation de nos équipements permettra d’améliorer notre potentiel économique."

COL_war_with_andeans:0 "Guerre contre les Andins"
COL_war_with_andeans_desc:0 "Il est temps de convaincre [PRU.GetNameDef] de rejoindre notre grande cause. Les Andes sont difficiles à conquérir, mais notre nouvelle division de parachutistes Condor aidera à cette campagne."

COL_etnocacerismo:0 "Suivre les ethnocacéristes"
COL_etnocacerismo_desc:0 "Notre reconquête de la Grande Colombie est désormais une véritable croisade pour unir les peuples des Andes !"

COL_etnocacerismo_2:0 "Ethnocacérisme accompli"
COL_etnocacerismo_2_desc:0 "Nous sommes désormais proches de devenir une immense nation indivisible."
COL_etnocacerismo_2_tt:0 "§YEthnocacérisme§!"

COL_altillanura_ress:0 "Explorer l’Orénoquie"
COL_altillanura_ress_desc:0 "Il est temps d’investir dans la région de l’Orénoquie, d’améliorer la production de caoutchouc et d’exploiter les gisements de bauxite."

COL_gran_colombia:0 "Revendiquer la Grande Colombie"
COL_gran_colombia_desc:0 "Seule une grande nation est garantie de survivre aux menaces du monde."

COL_nuclear_effort:0 "Programme nucléaire"
COL_nuclear_effort_desc:0 "À l’aube d’une découverte qui changera le monde, nous ne pouvons laisser d’autres allumer le feu qui pourrait un jour consumer la Terre."

COL_extra_tech_slot:0 "Financer les universités"
COL_extra_tech_slot_desc:0 "Notre expansion industrielle et nos récents progrès nous permettent de mener davantage de recherches en parallèle."

COL_extra_tech_slot_2:0 "Subventions à la recherche"
COL_extra_tech_slot_2_desc:0 "L’industrialisation rapide de notre nation a ouvert de nouvelles opportunités de recherche que nous devons exploiter."

COL_technology_sharing:0 "Partage technologique"
COL_technology_sharing_desc:0 "En partageant nos avancées technologiques avec nos alliés, toute notre faction mènera plus efficacement ses recherches en temps de guerre."

COL_secret_weapons:0 "Armes secrètes"
COL_secret_weapons_desc:0 "Il serait tentant de consacrer toutes nos ressources supplémentaires au développement de chars et d’avions, mais le secret pour gagner les guerres réside dans de nouveaux domaines scientifiques : électronique, fusées et recherche nucléaire."

COL_political_effort:0 "Congrès de Colombie"
COL_political_effort_desc:0 "Pour changer le monde, nous devons commencer par changer notre pays. Renforcer notre position politique doit être la priorité."

COL_collectivist_ethos:0 "S’opposer aux réformes de López"
COL_collectivist_ethos_desc:0 "Nos ennemis peuvent diviser et conquérir les nations les plus faibles, mais notre peuple restera uni – tous pour un et un pour tous."

COL_militarism:0 "Militariser l’État"
COL_militarism_desc:0 "Ceux qui considèrent l’armée comme un mal nécessaire sont condamnés à hésiter face à la guerre. Nous ancrerons le militarisme dans notre culture pour devenir un peuple de soldats."

COL_political_correctness:0 "Nationaliser l’industrie"
COL_political_correctness_desc:0 "Pour libérer les travailleurs des chaînes capitalistes, nous devons commencer par prendre le contrôle des moyens de production."

COL_neutrality_focus:0 "Priorité à la neutralité"
COL_neutrality_focus_desc:0 "Certains prétendent qu’il faut du courage et de la sagesse pour prendre parti dans un conflit mondial ; nous savons qu’il en faut encore plus pour refuser."

COL_interventionism_focus:0 "Priorité à l’interventionnisme"
COL_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples, pas seulement celle de nos citoyens. Si empêcher la tyrannie signifie la guerre, qu’il en soit ainsi."

COL_military_youth:0 "Jeunesse militaire"
COL_military_youth_desc:0 "Des organisations destinées à promouvoir la discipline et l’éducation politique des jeunes de notre nation encourageront la loyauté et l’esprit de sacrifice dès le plus jeune âge."

COL_deterrence:0 "Dissuasion"
COL_deterrence_desc:0 "Isolés, nous tirons rarement profit de la guerre. Heureusement, nous savons que la meilleure défense est celle qui est si connue qu’il n’est jamais nécessaire de l’utiliser."

COL_volunteer_corps:0 "Corps de volontaires"
COL_volunteer_corps_desc:0 "Forcer notre peuple à mourir pour des idéaux de liberté serait un comble, mais offrir à ceux qui le souhaitent les moyens d’aider les peuples à l’étranger ne l’est pas."

COL_paramilitarism:0 "Fonder la Juventud Leopardo"
COL_paramilitarism_desc:0 "Les principes militaires trouvent des applications au-delà de l’armée. Si nous développons des unités semi-militarisées pour compléter nos forces armées, davantage de citoyens recevront une formation militaire."

COL_join_the_comintern:0 "Rejoindre le Komintern"
COL_join_the_comintern_desc:0 "Nous devons aider nos camarades socialistes du monde entier à vaincre le capitalisme. [SOV.GetNameDefCap] est la force motrice de ce combat ; nous devons donc nous tenir à ses côtés."

COL_soviet_technological_cooperation:0 "Coopération technologique [SOV.GetAdjective]"
COL_soviet_technological_cooperation_desc:0 "[SOV.GetNameDefCap] a réalisé de grands progrès scientifiques. Maintenant que nous combattons côte à côte, nous pouvons profiter de leur expertise."

COL_indoctrination_focus:0 "Introduire les commissaires politiques"
COL_indoctrination_focus_desc:0 "L’introduction de commissaires politiques dans les rangs de l’armée nous permettra de rappeler à nos troupes la noble cause pour laquelle elles se battent."

COL_foreign_expeditions:0 "Expéditions à l’étranger"
COL_foreign_expeditions_desc:0 "Puisque nos ennemis sont prêts à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."

COL_why_we_fight:0 "Pourquoi nous combattons"
COL_why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple doit voir les atrocités commises par ceux qui convoitent le pouvoir. Nous rallierons la nation à notre cause et veillerons à ce que chacun soit prêt à se battre pour notre liberté."

COL_political_commissars:0 "Commissaires politiques"
COL_political_commissars_desc:0 "Pour garantir l’application de nos politiques dans la pratique militaire, nous introduirons des responsables nommés politiquement dans les rangs de l’armée."

COL_internationalism_focus:0 "La Revolución Popular"
COL_internationalism_focus_desc:0 "L’idéologie ne connaît pas de frontières. Une autre nation peut se dire souveraine, mais nos convictions priment sur de telles prétentions."

COL_nationalism_focus:0 "Coup d’État des Leopardos"
COL_nationalism_focus_desc:0 "Notre nation est unique, et nos réussites politiques n’auraient pu se produire ailleurs. Nous devons la défendre à tout prix."

COL_ideological_fanaticism:0 "Fanatisme idéologique"
COL_ideological_fanaticism_desc:0 "Nos valeurs et objectifs politiques établis valent autant la peine de mourir que n’importe quelle foi ancienne. Tout fidèle doit être prêt à affronter la mort, et ceux qui s’en écartent doivent aussi s’y préparer."

COL_mosquitos:0 "Légitimer la Grande Colombie"
COL_mosquitos_desc:0 "Avec le Panama, l’Équateur et le Venezuela sous notre contrôle, nous devons commencer à intégrer leur administration à la Grande Colombie."

COL_axis_leanings_focus:0 "Se lier d’amitié avec les Allemands"
COL_axis_leanings_focus_desc:0 "L’Axe offre certains avantages technologiques."

COL_axis_leanings_focus_2:0 "Échange de ressources [GER.GetAdjective]"
COL_axis_leanings_focus_2_desc:0 "Plus de technologies, au prix de quelques exportations."

COL_axis_leanings_focus_3:0 "Rejoindre l’Axe"
COL_axis_leanings_focus_3_desc:0 "Si les ambitions de la Colombie sont gravées dans la pierre, nous devons nous aligner sur l’Axe et en finir avec nos ennemis !"

COL_montana_effort:0 "Effort Alta Montaña"
COL_montana_effort_desc:0 "Il est temps de nous préparer à la guerre dans les Andes."

COL_intensify_exports:0 "Intensifier nos exportations"
COL_intensify_exports_desc:0 "Notre économie repose fortement sur l’exportation de biens, et nous avons décidé que c’était la meilleure voie vers la réussite économique. Nous devons donc intensifier encore davantage notre commerce et nos exportations."

COL_explore_amazonia:0 "Exploiter l’Amazonie"
COL_explore_amazonia_desc:0 "L’État ne contrôle pas pleinement la production de caoutchouc à Guaviare. Il est temps que notre État légitime en prenne la charge. Par ailleurs, nos troupes peuvent y apprendre quelques notions de survie en jungle."

COL_minning:0 "Exploitation minière à grande échelle"
COL_minning_desc:0 "Les premières prospections de notre territoire indiquent qu’il contient une quantité importante de minerai, prête à être extraite. Nous devons construire les infrastructures pour faciliter cette exploitation."

COL_hidroelectrics:0 "Développer l’hydroélectricité"
COL_hidroelectrics_desc:0 "La géographie montagneuse se prête parfaitement à la construction de barrages. Nos besoins en énergie augmentant, le moment est venu d’en profiter."

COL_coffe_growth:0 "Maintenir la dépendance au café"
COL_coffe_growth_desc:0 "Le café est l’une de nos principales exportations. Nous veillerons à en vendre toujours plus en négociant de nouveaux accords commerciaux."

# Menaces
COL_war_with_andean_threat:0 "Ambitions bolivariennes dans les Andes"
