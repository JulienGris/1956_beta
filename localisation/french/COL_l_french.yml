colombia.1.t:0 "Entraînement dans la jungle"
colombia.1.d:0 "Le climat équatorial chaud des forêts amazoniennes au sud du pays, ainsi que les zones boisées des provinces côtières à l’ouest de Carthagène, créent des conditions difficiles pour la population et constituent un obstacle sérieux pour nos troupes, en particulier en matière d’entraînement et de performance militaire.\n\nQuelques réductions budgétaires nous permettent d’étendre nos infrastructures d’entraînement en zones de jungle et de nommer les nouveaux commandants issus de l’académie militaire à leurs postes respectifs, pour lesquels ils ont été spécifiquement formés. Les jungles de [COL.GetNameDef] deviendront notre terrain de combat, où notre armée, aux côtés des guérilleros, pourra repousser un ennemi supérieur."
colombia.1.a:0 "Mettons en place ces camps d’entraînement."

colombia.2.t:0 "La reformation de la Grande Colombie !"
colombia.2.d:0 "Les récents changements dans la structure gouvernementale de [COL.GetNameDef] ont suscité de nombreuses interrogations sur leurs intentions parmi nos officiels à Caracas et nos ambassadeurs à Bogota.\n\nCe matin, le gouvernement de [VEN.GetLeader] a reçu une demande officielle pour la reformation de l’alliance [VEN.GetAdjective]-[COL.GetAdjective] sous la direction de cette dernière, dans le but de restaurer l’héritage perdu de la Grande Colombie.\n\nLes officiels [COL.GetAdjective] déclarent que si l’accord est accepté, le gouvernement [VEN.GetAdjective] sera intégré efficacement à l’appareil d’État avec une représentation appropriée au parlement. En cas de refus, les diplomates [COL.GetAdjective] menacent de franchir notre frontière avec leur armée."
colombia.2.a:0 "Unissons-nous pour le bien commun."
colombia.2.b:0 "Nous voulons préserver notre indépendance."

colombia.3.t:0 "Hermano Bolivariano"
colombia.3.d:0 "La demande d’intégration arrivait à expiration à 18 h aujourd’hui. Heureusement, nous avons reçu une réponse officielle du gouvernement de [VEN.GetLeader] dix heures avant la fin de l’ultimatum.\n\nLe télégramme de [VEN.GetNameDef] stipulait : « L’influence croissante de [USA.GetNameDef] en Amérique du Sud inquiète également le gouvernement et les officiels [VEN.GetAdjective]. Seul un État unifié et puissant tel que la Grande Colombie peut rivaliser avec le géant endormi du Nord. »\n\nAprès un siècle, nos frères [VEN.GetAdjective] ont accepté avec joie de redevenir partie intégrante de la Grande Colombie."
colombia.3.a:0 "Hermanos, bienvenue en Grande Colombie !"

colombia.4.t:0 "L’invasion de [VEN.GetNameDef]"
colombia.4.d:0 "La demande d’intégration arrivait à expiration à 18 h aujourd’hui. N’ayant reçu aucune réponse officielle des autorités [VEN.GetAdjective], nous pouvons supposer que leur faible gouvernement tente de gagner du temps pour mobiliser davantage de forces.\n\nNos éclaireurs signalent une activité accrue des troupes [VEN.GetAdjective] à notre frontière. Ils préparent leurs défenses et mobilisent leurs réserves. Même si toutes nos forces ne sont pas encore en place, nous devons frapper maintenant, alors que l’ennemi s’y attend le moins.\n\nAux armes, peuple de [COL.GetNameDef] ! L’heure est venue de reprendre les territoires perdus de la Grande Colombie !"
colombia.4.a:0 "En avant !"

colombia.6.t:0 "Le Panama reconquis"
colombia.6.d:0 "Nous sommes le pays que nous savons être"
colombia.6.a:0 "Juste à temps"

colombia.11.t:0 "Nouvelle unité amphibie créée"
colombia.11.d:0 "Les récentes recherches et développements d’équipements de soutien ont inspiré notre équipe scientifique à une idée brillante : lever des fonds pour établir une unité militaire moderne composée de bataillons d’infanterie amphibie soutenus par de l’artillerie, des ingénieurs, des éclaireurs et des équipes hospitalières de campagne.\n\nL’entraînement d’une telle unité spécialisée demandera beaucoup plus de temps et d’efforts qu’un régiment d’infanterie standard. Cependant, elle devrait offrir d’excellentes performances lors des opérations amphibies et dans les environnements humides."
colombia.11.a:0 "Ajoutez la proposition documentée au registre de nos forces armées."
colombia11_tt:0 "Nous recevrons un modèle d’élite de marines appelé §YInfantes de Marina§!."

colombia.12.t:0 "Les généraux soutiennent la création d’une unité de parachutistes"
colombia.12.d:0 "La coopération étroite entre notre département R&D et l’état-major a abouti à une proposition visant à établir une unité spéciale capable de débarquer par les airs derrière les lignes ennemies et d’opérer dans leurs zones arrière. La technologie des parachutistes pourrait devenir un atout décisif si nous obtenons la supériorité aérienne dans la région.\n\nDes améliorations supplémentaires incluent la formation spécialisée d’ingénieurs, des canons aéroportés et un régiment radio léger supplémentaire capable d’utiliser les fréquences ennemies pour les communications de nos troupes sans être détecté."
colombia.12.a:0 "Ajoutez le dossier de cette unité pour utilisation par nos forces armées."
colombia12_tt:0 "Nous recevrons un modèle de parachutistes §YUnidad Condor§! avec cinq régiments de parachutistes et plusieurs compagnies de soutien."

colombia.13.t:0 "Proposition concernant la police militaire"
colombia.13.d:0 "Toute rébellion ouverte ou action de protestation menée par l’opposition radicale et les combattants terroristes ne peut rester impunie. L’emprise du gouvernement sur le pays restera incontestée tant qu’elle suivra la volonté du peuple.\n\nSi nous voulons réprimer plus efficacement les guérillas et les partisans, nos experts militaires suggèrent de former un nouveau régiment de police militaire dont l’unique objectif sera d’assurer l’ordre et la stabilité dans nos zones sensibles.\n\nCette unité sera composée de cinq unités de cavalerie avec des instructeurs spécialisés, formés spécifiquement pour lutter contre la résistance."
colombia.13.a:0 "Nous devons commencer à former le personnel immédiatement !"
colombia13_tt:0 "Le modèle de police militaire §YPolicía Militar§! avec cinq unités de cavalerie et un soutien de police militaire est désormais disponible."

colombia.1001.t:0 "Nouveau pacte de défense formé"
colombia.1001.d:0 "Constatant les ambitions croissantes de Grande Colombie du gouvernement [COL.GetAdjective], des responsables inquiets de [ECU.GetNameDef] et [PAN.GetNameDef] ont entamé de vives négociations visant à former un pacte défensif contre la résurgence de l’État plus que défunt de la Grande Colombie.\n\nLes deux pays massent des troupes aux frontières, prêts à se battre jusqu’au dernier homme pour leur indépendance."
colombia.1001.a:0 "Cela assurera la sécurité de nos États pour un certain temps !"

