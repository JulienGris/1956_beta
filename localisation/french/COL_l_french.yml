COL_spanish_civil_war_involvement:0 "Implication dans la guerre civile espagnole"
COL_spanish_civil_war_involvement_desc:0 "Nous ne pouvons pas laisser nos frères espagnols combattre sans nous impliquer d’une manière ou d’une autre."
r56_COL_spanish_civil_war_involvement:0 "Implication dans la guerre civile espagnole"
r56_ECU_COL_counter_faction:0 "Pacte de défense de Guayaquil"

COL_affirm_state_role_in_the_economy:0 "Réaffirmer le rôle économique de l’État"
COL_affirm_state_role_in_the_economy_desc:0 "De nombreux économistes, notamment John Maynard Keynes, soutiennent la théorie selon laquelle l’État doit intervenir dans l’économie pour garantir qu’elle reste équitable envers la population."
COL_continue_constitutional_reforms:0 "Poursuivre les réformes constitutionnelles"
COL_continue_constitutional_reforms_desc:0 "La réforme constitutionnelle a établi la définition de la propriété par sa fonction sociale. L’un des effets les plus notoires de cette nouvelle règle est le droit de l’État d’exproprier des terres, selon le principe d’utilité publique, notamment dans les vastes territoires inexploités des grands propriétaires."
COL_workers_protection:0 "Renforcer les droits des travailleurs"
COL_workers_protection_desc:0 "Pour garantir la protection des travailleurs, nous devons défendre le droit de grève et encourager les ouvriers à s’organiser en syndicats."
COL_educational_reform:0 "Réforme de l’éducation"
COL_educational_reform_desc:0 "Principalement lancées par l’écrivain Jorge Zalamea, ministre de l’Éducation, de nombreuses réformes ont été mises en place pour améliorer l’accès à l’instruction."
COL_join_the_allies:0 "Rejoindre les Alliés"
COL_join_the_allies_desc:0 "Notre place est aux côtés de [ENG.GetNameDef], le gardien du libéralisme, de la démocratie et de la liberté en ces temps troublés."
COL_liberty_ethos:0 "La Révolution en marche"
COL_liberty_ethos_desc:0 "Alfonso López Pumarejo a lancé de nombreuses réformes économiques et sociales, surnommées la Revolución en Marcha, ou Révolution en marche."

COL_agrarian_economy:0 "Économie agraire"
COL_agrarian_economy_desc:0 "L’économie colombienne repose profondément sur l’agriculture, les plantations de café dominant nos exportations et fournissant des devises indispensables. Cependant, cette dépendance à une seule culture nous rend vulnérables aux fluctuations des prix mondiaux, et la richesse reste concentrée entre les mains des élites rurales. Bien que les hautes terres fertiles soient en plein essor, le manque d’infrastructures industrielles freine notre modernisation. L’investissement dans la production manufacturière nationale reste limité, la majeure partie de la main-d’œuvre étant liée aux champs. Pour sécuriser notre avenir, nous devons décider : renforcer nos atouts agricoles ou emprunter la voie difficile de l’industrialisation ?"
COL_coffee_dependent_economy:0 "Économie dépendante du café"
COL_coffee_dependent_economy_desc:0 "L’économie colombienne repose profondément sur l’agriculture, les plantations de café dominant nos exportations et fournissant des devises indispensables. Cependant, cette dépendance à une seule culture nous rend vulnérables aux fluctuations des prix mondiaux, et la richesse reste concentrée entre les mains des élites rurales. Bien que les hautes terres fertiles soient en plein essor, le manque d’infrastructures industrielles freine notre modernisation. L’investissement dans la production manufacturière nationale reste limité, la majeure partie de la main-d’œuvre étant liée aux champs. Pour sécuriser notre avenir, nous devons décider : renforcer nos atouts agricoles ou emprunter la voie difficile de l’industrialisation ?"
COL_coffee_dependent_economy_2:0 "Économie dépendante du café"
COL_coffee_dependent_economy_2_desc:0 "L’économie colombienne repose profondément sur l’agriculture, les plantations de café dominant nos exportations et fournissant des devises indispensables. Cependant, cette dépendance à une seule culture nous rend vulnérables aux fluctuations des prix mondiaux, et la richesse reste concentrée entre les mains des élites rurales. Bien que les hautes terres fertiles soient en plein essor, le manque d’infrastructures industrielles freine notre modernisation. L’investissement dans la production manufacturière nationale reste limité, la majeure partie de la main-d’œuvre étant liée aux champs. Pour sécuriser notre avenir, nous devons décider : renforcer nos atouts agricoles ou emprunter la voie difficile de l’industrialisation ?"
COL_coffee_dependent_economy_3:0 "Économie semi-autarcique"

COL_workers_protection_idea:0 "Protection des travailleurs"
COL_revolution_on_the_march:0 "Révolution en marche"
COL_revolution_on_the_march_desc:0 "Les vents du changement soufflent fortement sur la Colombie tandis que la « Révolution en marche » du président Alfonso López Pumarejo anime les esprits de la nation. Des éléments radicalisés de la société exigent des changements profonds, motivés par la justice sociale, les droits des travailleurs et les réformes économiques. Mais sous la vision de Pumarejo, ces idéaux promettent aussi de nouvelles opportunités : redistribution des terres pour améliorer la vie des communautés rurales, accès élargi à l’éducation et voix renforcée pour la classe ouvrière colombienne. À mesure que les tensions augmentent, l’espoir grandit, créant une époque à la fois pleine de risques et de potentiels immenses."
COL_political_correctness_idea:0 "Industrie nationalisée"
COL_militarism_idea:0 "Militarisme d’État"
COL_paramilitarism_idea:0 "La Juventud Leopardo"
COL_growing_political_resistance:0 "Opposition politique croissante"
COL_growing_political_resistance_desc:0 "Après des décennies de domination conservatrice, le nouveau gouvernement libéral colombien fait face à une opposition grandissante dans sa tentative de réformer une société divisée entre élites puissantes et ouvriers appauvris. Les réformes agraires, les droits des travailleurs et les initiatives éducatives défient le statu quo, suscitant la colère des propriétaires, du clergé et des rivaux politiques. Des grèves éclatent à la campagne comme dans les villes, et les mouvements de gauche gagnent du terrain parmi les désillusionnés."
COL_raspar_olla:0 "Lobbyiste extractiviste"
COL_tupac_amaru:0 "Ethnocacérisme accompli"
COL_yarumos_idea:0 "Yarumos"
COL_yarumos_idea_desc:0 "En utilisant les cendres de l’arbre Yarumo, notre pays peut mieux résister aux environnements hostiles."
COL_support_focus:0 "Soutenir la production"
COL_support_focus_desc:0 "Du soutien pour tout le monde."
COL_simacota_idea:0 "Vengeance accomplie"
COL_simacota_idea_desc:0 "Maintenant que nous avons repris ce qui nous appartient, il est temps de le défendre."
COL_CAS_focus:0 "Production de CAS"
COL_CAS_focus_desc:0 "Des CAS pour tous."
COL_NAV_focus:0 "Production de bombardiers navals"
COL_NAV_focus_desc:0 "Des bombardiers navals pour tous."
COL_submarines_focus:0 "Production de sous-marins"
COL_submarines_focus_desc:0 "Des sous-marins pour tous."
COL_cruisers_focus:0 "Production de croiseurs"
COL_cruisers_focus_desc:0 "Des croiseurs pour tous !"

