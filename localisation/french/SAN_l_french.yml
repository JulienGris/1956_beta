 SAN_the_eternal_republic:0 "La république éternelle"
 SAN_the_eternal_republic_desc:0 "Selon la légende, Saint-Marin fut fondée en 301 apr. J.-C., sous l’empereur Dioclétien, et n’a jamais cessé d’exister depuis. Cette petite nation, éternelle, et son peuple ont tout traversé : Saint-Marin est considérée comme la plus ancienne république continue au monde. C’est par un mélange de chance et de remarquables manœuvres diplomatiques qu’elle a conservé sa souveraineté à travers la période pontificale, les guerres napoléoniennes et l’unification italienne…"
