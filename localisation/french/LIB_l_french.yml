LIB_supernatural_warfare:0 "Guerre surnaturelle"
LIB_supernatural_warfare_desc:0 "Lorsqu’ils affrontent les tribus de l’arrière-pays, les soldats de la Force frontalière du Liberia utilisent deux types d’armes : physiques et surnaturelles. Les premières ont connu de grandes améliorations en un siècle, tandis que les secondes reposent sur des sorts, des charmes, etc. destinés à infliger des dégâts ou à les éviter. Un cas mentionne le contrôle d’une tempête par des guerriers Kru, dissipée grâce aux charmes des soldats de la LFF."

