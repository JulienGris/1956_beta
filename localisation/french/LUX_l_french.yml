#Events
luxembourg.1.t:0 "Une invitation au Benelux"
luxembourg.1.d:0 "Bien que de petite taille, le Luxembourg est devenu assez actif politiquement ces dernières années, en raison du caractère de plus en plus belliqueux de ses voisins. Le Premier ministre Joseph Bech a soutenu que les pays du Benelux devraient s’unir avant que notre destin ne soit décidé à notre place."
luxembourg.1.a:0 "Un toast à l’Union Benelux !"
luxembourg.1.b:0 "Une alliance ? Ridicule !"
luxembourg.2.t:0 "[From.GetName] rejoint le Benelux"
luxembourg.2.d:0 "[From.GetLeader] a accepté de rejoindre l’union, notre alliance se renforce !"
luxembourg.2.a:0 "Fêtons cela !"
luxembourg.3.t:0 "[From.GetName] refuse notre offre."
luxembourg.3.d:0 "Nos diplomates sont revenus de [From.GetName] avec de tristes nouvelles : malgré nos efforts, aucune alliance ne verra le jour."
luxembourg.3.a:0 "Qu’ils meurent seuls, alors."
luxembourg.10.t:0 "Le Luxembourg cherche à nous rejoindre"
luxembourg.10.d:0 "Damian Kratzenberg a envoyé des diplomates à Berlin pour discuter de l’adhésion possible du Luxembourg à l’Axe. Bien que minuscule, cette nation est très motivée."
luxembourg.10.a:0 "Un allié de plus dans la lutte pour le nationalisme allemand !"
luxembourg.10.b:0 "Leur protection aura un prix."
luxembourg.10.c:0 "Luxem… quoi déjà ?"
luxembourg.11.t:0 "L’Allemagne accepte !"
luxembourg.11.d:0 "Des émissaires venus de Berlin sont arrivés à Luxembourg-ville pour discuter de l’alliance du Luxembourg avec les puissances de l’Axe. Un grand jour de célébration !"
luxembourg.11.a:0 "Gloire au Führer !"
luxembourg.12.t:0 "L’Allemagne accepte..."
luxembourg.12.d:0 "Des émissaires venus de Berlin sont arrivés à Luxembourg-ville pour discuter de l’intégration partielle du Luxembourg dans le Reich allemand. Il semble que l’accord ait changé."
luxembourg.12.a:0 "Un petit prix à payer pour la protection."
luxembourg.13.t:0 "L’Allemagne refuse."
luxembourg.13.d:0 "Nos lettres sont restées sans réponse, nos diplomates ont été éconduits. Il semble que les nazis aient des préoccupations plus importantes que le sort de notre pays."
luxembourg.13.a:0 "Qu’ils soient tous maudits."
luxembourg.14.t:0 "Les élections de 1937."
luxembourg.14.d:0 "Bien que des nuages d’orage s’accumulent dans le monde entier, la politique luxembourgeoise suit son cours. Les élections de 1937 verront une forte mobilisation pour le Rietspartei et les sociaux-démocrates. Cependant, la proposition du parti conservateur, la loi Maulkuerfgesetz, visant à freiner la popularité grandissante du KPL, n’a pas rencontré le succès escompté. [ROOT.GetLeader] a lié le sort de cette loi à un référendum. Le vote final devrait être extrêmement serré."
luxembourg.14.d.alt:0 "Bien que des nuages d’orage s’accumulent dans le monde entier, la politique luxembourgeoise suit son cours. Les élections de 1937 verront une forte mobilisation pour le Rietspartei et les sociaux-démocrates. Avec l’adoption récente de la loi Maulkuerfgesetz par le Rietspartei, [ROOT.GetLeader] devrait conserver son leadership avec l’aide d’un des partis de droite minoritaires."
luxembourg.14.a:0 "Le référendum échoue."
luxembourg.14.b:0 "Le référendum réussit."
luxembourg.14.c:0 "La politique est un jeu étrange."

# rework
luxembourg.200.t:0 "Les syndicats s’organisent"
luxembourg.200.d:0 "Suite au report de la loi sur le Conseil national du travail en décembre dernier, le gouvernement a fait face à une vive opposition, tant de la part de ses adversaires que du peuple. À présent, les syndicats ont organisé une grève. Cet événement a même rapproché syndicats chrétiens et socialistes, donnant lieu à une manifestation de 40 000 participants.\n\nIls exigent la levée immédiate du report, ce qui entraînerait la création du Conseil national du travail, organe d’arbitrage, la reconnaissance légale des syndicats ainsi qu’une hausse générale des salaires."
luxembourg.200.a:0 "Ils n’ont pas tort."
luxembourg.200.b:0 "Nous ne céderons pas au chantage."
luxembourg.201.t:0 "Le référendum sur la Maulkuerfgesetz"
luxembourg.201.d:0 "Le communisme est une menace pour le Luxembourg ! Le Premier ministre l’a constaté depuis la Grande Guerre. Le KPL avait obtenu son premier succès électoral en 1934 en décrochant un siège à la Chambre des députés. Joseph Bech en avait eu assez et avait invalidé le résultat.\n\nAfin d’en finir avec l’influence communiste, Bech a proposé une nouvelle loi, la Maulkuerfgesetz. Adoptée par la Chambre, elle fut cependant soumise à référendum. Contre toute attente, le référendum échoua de peu, empêchant l’entrée en vigueur de la loi et sauvant le KPL.\n\nBech annonça alors sa démission, un véritable revers pour les conservateurs."
luxembourg.201.a:0 "Le peuple a parlé."
luxembourg.202.t:0 "La Maulkuerfgesetz"
luxembourg.202.d:0 "Le communisme est une menace pour le Luxembourg ! Le Premier ministre l’a constaté depuis la Grande Guerre. Le KPL avait obtenu son premier succès électoral en 1934 en décrochant un siège à la Chambre des députés. Joseph Bech en avait eu assez et avait invalidé le résultat.\n\nAujourd’hui, Bech tente de nouveau d’affaiblir le communisme. Son gouvernement a proposé la loi Maulkuerfgesetz, qui bannirait tout parti cherchant à saper la constitution, ce qui viserait directement le KPL. La Chambre a voté en faveur de la loi, qui est donc adoptée. Mais nous pouvons encore organiser un référendum pour en confirmer la légitimité."
luxembourg.202.a:0 "Elle doit passer, au diable la démocratie !"
luxembourg.202.b:0 "Nous devons consulter le peuple, préparons un référendum."
luxembourg.210.t:0 "Élections imminentes"
luxembourg.210.d:0 "Les élections de 1937 approchent. Elles pourraient décider de l’avenir du Luxembourg comme jamais auparavant. Le continent est loin d’être en paix et notre neutralité pourrait être compromise.\n\nSont en jeu les sièges de la Chambre des députés, le parlement de [ROOT.GetNonIdeologyName]. Les partis en lice sont le conservateur PD, actuellement au pouvoir, le social-libéral PRL, également au gouvernement, le socialiste/social-démocrate LSAP et le communiste KPL. Tous peuvent obtenir un soutien gouvernemental pour faire campagne. Mais attention : il faudra aussi maintenir une forte participation et la confiance des électeurs, sous peine de voir l’élection invalidée, ce qui pourrait ouvrir la voie aux idéologies extrêmes.\n\nQuoi qu’il en soit, les politiciens de tous bords commencent leur campagne et sillonnent le pays. Voyons comment ces élections vont se dérouler."
luxembourg.210.a:0 "Préparer les bureaux de vote."

luxembourg.211.t:0 "Le Rietspartei remporte les élections !"
luxembourg.211.d:0 "La domination du Rietspartei se poursuit. Un nouveau succès électoral s’ajoute à son palmarès.\nLe seul revers semble avoir été l’échec de la Maulkuerfgesetz et la démission de Joseph Bech.\n\nNéanmoins, le nouveau gouvernement dirigé par Pierre Dupong devrait assurer une transition en douceur."
luxembourg.211.a:0 "Un nouveau mandat conservateur."
luxembourg.212.t:0 "Le PRL remporte les élections !"
luxembourg.212.d:0 "Avec ce succès électoral, le PRL accède enfin à la tête du gouvernement, après avoir longtemps été simple partenaire minoritaire, comme sous Bech.\nLe parti est dirigé par Gaston Diderich, un social-libéral compétent, qui a su imposer sa ligne face aux influences libérales classiques.\n\nIl célèbre d’abord avec son parti, puis sera investi Premier ministre dans les semaines à venir."
luxembourg.212.a:0 "Les efforts du parti portent enfin leurs fruits."
luxembourg.213.t:0 "Le LSAP remporte les élections !"
luxembourg.213.d:0 "Malgré ses succès passés, les sociaux-démocrates n’avaient jamais dirigé ni participé à un gouvernement. C’est désormais chose faite : le LSAP obtient pour la première fois la majorité.\nLa direction du parti a promis de tenir ses engagements électoraux. Si tel est le cas, l’avenir du Luxembourg s’annonce radieux !"
luxembourg.213.a:0 "Une nouvelle ère pour le pays !"
luxembourg.214.t:0 "Le KPL remporte les élections !"
luxembourg.214.d:0 "Dans un bouleversement inattendu, le parti communiste a remporté les élections ! Personne n’avait prévu un tel résultat. Nombreux sont ceux, notamment parmi les classes aisées, à avoir fui le pays ou transféré leurs richesses à l’étranger.\nL’avenir est incertain avec Charles Marx, farouche opposant à la monarchie, à la tête du pays."
luxembourg.214.a:0 "Le peuple a vraiment parlé."
luxembourg.215.t:0 "Résultats électoraux indécis"
luxembourg.215.d:0 "À la suite des élections, de nombreux citoyens ont remis en question les résultats. Rien n’indique avec certitude qu’ils représentent réellement la volonté du peuple luxembourgeois. Quelques options s’offrent à nous : continuer comme si de rien n’était, au risque d’un fort mécontentement populaire ; demander à la Grande-Duchesse d’assurer un gouvernement de transition ; ou bien voir nos grands voisins profiter de la situation..."
luxembourg.215.a:0 "Quelqu’un doit intervenir !"
luxembourg.216.t:0 "Organiser des élections anticipées ?"
luxembourg.216.d:0 "Avec l’interdiction du KPL, les critiques du gouvernement s’amplifient. Beaucoup qualifient la Maulkuerfgesetz « d’anti-démocratique » ou « d’inconstitutionnelle ». Il est clair qu’il faut agir.\n\nUne nouvelle idée circule au sein du gouvernement : [ROOT.GetLeader] pourrait convoquer des élections anticipées, laissant peu de temps aux autres partis pour s’y préparer. Le PD, plus grand parti de [ROOT.GetNameDef], serait presque assuré de l’emporter. Il faudrait justifier une telle décision, mais cela reste possible."
luxembourg.216.a:0 "C’est la seule chance de sauver [ROOT.GetNonIdeologyName] tel que nous le connaissons."
luxembourg.216.b:0 "Nous ne devons pas recourir à de telles manœuvres."

LUX_elections_PD_winner_tt:0 "§2Rietspartei§! a remporté les élections !"
LUX_elections_PRL_winner_tt:0 "§YRadikal-Liberal Partei§! a remporté les élections !"
LUX_elections_LSAP_winner_tt:0 "§0Lëtzebuerger Sozialistesch Aarbechterpartei§! a remporté les élections !"
LUX_elections_KPL_winner_tt:0 "§tKommunistesch Partei vu Lëtzebuerg§! a remporté les élections !"

luxembourg.220.t:0 "[LUX.GetNameDefCap] souhaite réaffirmer le traité de Londres"
luxembourg.220.d:0 "Face à la montée des tensions dans le monde, [LUX.GetNameDef] s’efforce de rester neutre. Elle nous a désormais sollicités afin de réaffirmer le traité de Londres de 1867, garantissant sa neutralité et son indépendance auprès des signataires.\n\nNous pouvons accepter et préserver la paix, mais il nous faudrait défendre ce pays en cas de guerre."
LUX_reaffirm_treaty_of_london_accept_tt:0 "Nous allons §Hgarantir§! le Luxembourg et §Hle défendre§! en cas de §Rguerre§!."
luxembourg.220.a:0 "Évidemment, nous acceptons."
luxembourg.220.b:0 "Nous ne pouvons pas nous engager pour l’instant."
luxembourg.221.t:0 "[FROM.GetNameDefCap] a accepté notre proposition."
luxembourg.221.d:0 "Par télégramme, le ministère des affaires étrangères [FROM.GetAdjectiveCap] nous a annoncé une excellente nouvelle : nous avons obtenu leur soutien ! Une étape cruciale vers notre objectif final !"
luxembourg.221.a:0 "Splendide."
luxembourg.222.t:0 "[FROM.GetNameDefCap] a décliné notre proposition."
luxembourg.222.d:0 "Tristes nouvelles pour notre ministère des affaires étrangères : [FROM.GetNameDef] ne nous soutiendra pas dans la réaffirmation du traité de Londres.\n\nCela signifie que tout le projet tombe à l’eau, car il fallait l’accord de tous les signataires pour le légitimer."
luxembourg.222.a:0 "Bande d’imbéciles !"
luxembourg.223.t:0 "Réaffirmation du traité de Londres"
luxembourg.223.d:0 "Notre initiative a réussi : nous avons réuni tous les signataires originaux du traité de 1867 afin de réaffirmer notre indépendance perpétuelle.\n\nComme [GER.GetNameDef] n’était pas signataire, il faudra négocier un accord séparé avec eux."
luxembourg.223.a:0 "Un grand jour pour [ROOT.GetNonIdeologyName] !"
luxembourg.224.t:0 "Échec de la réaffirmation"
luxembourg.224.d:0 "Nous étions proches, mais pas assez : certains anciens signataires ont refusé de parapher notre proposition. Nous ne pouvons qu’espérer que [ROOT.GetNonIdeologyName] saura gérer la menace que représente [GER.GetNameDef]."
luxembourg.224.a:0 "Nous étions si près du but."
luxembourg.225.t:0 "Réaffirmation du traité de Londres"
luxembourg.225.d:0 "[LUX.GetNonIdeologyName] vient d’annoncer la réussite de la réaffirmation du traité de Londres, signé en 1867, garantissant la neutralité perpétuelle du pays. Cela devrait l’aider à préserver son indépendance, désormais protégée par plusieurs grandes puissances.\n\nBeaucoup espèrent que cet exemple apaisera les tensions en Europe et guidera d’autres pays vers une diplomatie plus pacifique.\n\nCe jour appartient à [LUX.GetNonIdeologyName], qui célèbre sa nouvelle sécurité."
luxembourg.225.a:0 "Un grand pas pour [LUX.GetNonIdeologyName] et pour l’Europe."
luxembourg.225.b:0 "Une étape nécessaire pour la paix."
luxembourg.226.t:0 "Échec du nouveau traité de Londres"
luxembourg.226.d:0 "Invités à [LUX.capital.GetCapitalVictoryPointName] pour discuter d’une possible réaffirmation du traité de 1867, nous venons d’apprendre par le ministre [LUX.GetAdjectiveCap] des Affaires étrangères que celle-ci a échoué, certains pays ayant refusé de signer.\n\nNous sommes libres de repartir pour [ROOT.capital.GetCapitalVictoryPointName]. Ce revers est de mauvais augure pour l’avenir de l’Europe, car une chance de calmer les tensions vient de disparaître."
luxembourg.226.a:0 "Un jour bien triste pour l’Europe entière."
luxembourg.226.b:0 "[LUX.GetNonIdeologyName] ne vaut pas la peine d’être protégé."
luxembourg.228.t:0 "[LUX.GetNameDefCap] est attaqué"
luxembourg.228.d:0 "Avec l’attaque contre [LUX.GetNameDef], nous devons choisir : devons-nous les défendre ou non ? En tant que signataires du traité de Londres, nous avons l’obligation de les aider à rester indépendants. Mais intervenir risquerait de nous entraîner dans une guerre. Refuser signifierait passer pour des alliés peu fiables, ce qui ternirait nos relations internationales."
luxembourg.228.a:0 "[LUX.GetNonIdeologyName] sera défendu !"
luxembourg.228.b:0 "Cela ne nous concerne pas."

luxembourg.250.t:0 "Les fruits de notre labeur"
luxembourg.250.d:0 "Nous savions qu’adopter une économie collectivisée serait difficile. Nous savions que le peuple aurait besoin d’une période d’adaptation. Nous savions qu’il y aurait une résistance bourgeoise à la saisie des moyens de production.\n\nPourtant, nous, prolétaires de [ROOT.GetNonIdeologyName], avons persévéré. Par notre dur labeur, par le travail de milliers d’ouvriers, d’intellectuels et de planificateurs, nous pouvons désormais proclamer que notre économie révolutionnaire est achevée."
luxembourg.250.a:0 "Nous existons dans le contexte de tout ce qui nous entoure et de ce qui nous a précédés."

luxembourg.270.t:0 "Une nouvelle doctrine étrangère"
luxembourg.270.d:0 "Avec l’échec des négociations pour réaffirmer le traité de Londres, notre pays est dans une position très vulnérable. Il est évident que certains étrangers préparent des plans pour déstabiliser ou conquérir [ROOT.GetNonIdeologyName].\n\nPour résoudre ce problème, notre ministre des Affaires étrangères a suggéré une nouvelle stratégie : se rapprocher de nos deux puissants voisins, [GER.GetNameDef] et [FRA.GetNameDef], afin d’obtenir leur soutien à un [ROOT.GetNameDef] neutre et indépendant.\n\nCette proposition n’est pas sans risques. Un nouvel échec affaiblirait encore notre crédibilité, tandis qu’un succès pourrait être vu comme une entorse à notre neutralité absolue."
luxembourg.270.a:0 "Tentons cette approche."
luxembourg.270.b:0 "Cela n’en vaut pas la peine."
luxembourg.271.t:0 "[FROM.GetNameDefCap] demande une garantie"
luxembourg.271.d:0 "Après l’échec de la réaffirmation du traité de Londres, il semble que [LUX.GetNameDef] n’est pas resté inactif.\n\nIls nous ont approchés pour demander une garantie de leur indépendance. Cela pourrait sembler simple, mais leur proposition inclut également [GER.GetNameDef]. Nous devons agir avec prudence pour préserver l’équilibre des forces tout en servant nos intérêts."
luxembourg.271.a:0 "Nous devons les soutenir."
luxembourg.271.b:0 "Demandons un accès militaire en compensation."
luxembourg.271.c:0 "[ROOT.GetNonIdeologyName] ne défendra pas [FROM.GetNonIdeologyName]."
luxembourg.272.t:0 "[FROM.GetNameDefCap] demande une garantie"
luxembourg.272.d:0 "Après l’échec de la réaffirmation du traité de Londres, [LUX.GetNameDef] n’est pas resté inactif.\n\nIls nous demandent de garantir leur indépendance, aux côtés de [FRA.GetNameDefCap]. Pour que l’accord nous soit aussi bénéfique, nous pourrions exiger une compensation, mais cela risque de ne pas être accepté."
luxembourg.272.a:0 "Oui, peu importe."
luxembourg.272.b:0 "Assurons-nous que cela nous soit aussi profitable."
luxembourg.272.c:0 "Nous ne nous engagerons pas pour l’indépendance d’un autre pays."
luxembourg.273.t:0 "[FROM.GetNameDefCap] accepte sans conditions"
luxembourg.273.d:0 "Il semble que [FROM.GetNameDef] ne nous ait pas abandonnés : ils ont accepté notre demande sans rien exiger en retour. Nos diplomates, qui craignaient que convaincre [FROM.GetNonIdeologyName] soit l’étape la plus difficile, sont soulagés."
luxembourg.273.a:0 "Excellente nouvelle."
luxembourg.274.t:0 "[FROM.GetNonIdeologyName] envoie des exigences"
luxembourg.274.d:0 "Ce que beaucoup redoutaient est arrivé : [FROM.GetNonIdeologyName] n’a pas strictement refusé de nous protéger, mais a envoyé des exigences pour stationner des troupes en [ROOT.GetNonIdeologyName]. Déjà, des voix s’élèvent au ministère des Affaires étrangères pour appeler à interrompre les négociations, tandis que d’autres avertissent qu’il s’agit de notre seule chance de survie."
luxembourg.274.a:0 "Nous devons céder à leurs exigences."
luxembourg.274.b:0 "Nous ne pouvons pas compromettre notre neutralité."

luxembourg.275.t:0 "[FROM.GetNameDefCap] refuse de nous protéger"
luxembourg.275.d:0 "Ces dernières heures, il est devenu évident que [FROM.GetNonIdeologyName] n’a aucun intérêt à protéger notre petite nation. Sans accord bilatéral, toute garantie de [GER.GetNameDef] sera inutile."
luxembourg.275.a:0 "Nous pourrions bien disparaître de l’Histoire."

luxembourg.276.t:0 "[FROM.GetNameDefCap] n’impose aucune exigence"
luxembourg.276.d:0 "Une nouvelle inattendue nous parvient de nos diplomates à [FROM.capital.GetCapitalVictoryPointName]. [FROM.GetNameDefCap] a accepté de protéger [ROOT.GetNameDef] sans poser la moindre condition. Aussi surprenant que cela soit, c’est une aide bienvenue."
luxembourg.276.a:0 "Une surprise, certes, mais bienvenue."

luxembourg.277.t:0 "[FROM.GetNameDefCap] exige des soldats"
luxembourg.277.d:0 "En négociant les termes de la protection [FROM.GetAdjectiveCap], ils ont exigé 2000 hommes pour servir dans leur armée. Cela peut sembler peu pour eux, mais c’est énorme pour nous. De plus, cela nous lierait davantage à leurs futures politiques, puisque nos citoyens serviraient sous leurs drapeaux."
luxembourg.277.a:0 "Un mal nécessaire pour notre survie."
luxembourg.277.b:0 "Nous ne pouvons pas céder à de telles exigences."
luxembourg.277.c:0 "Nous n’avons tout simplement pas assez d’hommes."

luxembourg.278.t:0 "[FROM.GetNameDefCap] refuse de nous protéger"
luxembourg.278.d:0 "Malheureusement, [FROM.GetNameDef] a annoncé qu’il ne nous protégerait pas. C’était l’issue la plus probable de ces négociations, et nous nous y étions préparés, mais nous n’avons toujours aucune alternative. Il nous faudra nous préparer à ce qui vient."
luxembourg.278.a:0 "Le résultat attendu."

luxembourg.279.t:0 "Succès des négociations"
luxembourg.279.d:0 "Nous – ou plutôt nos diplomates – avons réussi. Ils ont convaincu [GER.GetNameDef] et [FRA.GetNameDef] de garantir notre indépendance et de nous protéger en cas de guerre !\n\nCela a déjà apporté une stabilité à [ROOT.GetNonIdeologyName], mais nos perspectives diplomatiques futures en seront aussi grandement renforcées. Le ministre des Affaires étrangères a officieusement annoncé une fête pour célébrer son succès, et le Premier ministre doit prononcer un discours à la Chambre des députés.\n\nEn somme, même si l’échec des négociations autour du traité de Londres fut amer, nous avons persévéré et trouvé une nouvelle solution."
luxembourg.279.a:0 "L’avenir s’annonce radieux pour [ROOT.GetNameDef] !"

luxembourg.280.t:0 "Échec des négociations"
luxembourg.280.d:0 "Notre ministère des Affaires étrangères ajoute un nouvel échec à son palmarès. Ce qui aurait pu être le traité le plus important de ces dernières années restera dans les livres d’Histoire comme le dernier clou dans notre cercueil.\n\nCependant, nous devons aller de l’avant et nous préparer à tout ce qui pourrait arriver. Après tout, « Mir wëlle bleiwe wat mir sinn »."
luxembourg.280.a:0 "Un sombre jour pour [ROOT.GetNonIdeologyName]."

luxembourg.281.t:0 "Négociations fructueuses avec [FROM.GetNonIdeologyName]"
luxembourg.281.d:0 "Des nouvelles de [FROM.capital.GetCapitalVictoryPointName] viennent d’arriver : les négociations pour protéger [FROM.GetNameDef] se sont bien déroulées et divers traités dictant l’avenir de nos relations ont été signés.\n\nBien que risquées, ces discussions ont rapproché [GER.GetNameDef] et [FRA.GetNameDef] dans la protection de cette petite nation. Reste à voir si cela profitera à tous les signataires ou si un futur événement viendra rompre l’équilibre des forces."
luxembourg.281.a:0 "Un résultat souhaitable."

luxembourg.282.t:0 "Échec des négociations avec [FROM.GetNonIdeologyName]"
luxembourg.282.d:0 "Les pourparlers sont terminés, mais rien n’a été signé : [FROM.GetNameDef] restera sans protection encore un moment. Après l’échec des négociations autour du traité de Londres, c’est un nouveau revers pour [FROM.GetNameDef].\n\nReste à voir si cela affectera ou non l’avenir du continent."
luxembourg.282.a:0 "Rien de perdu, rien de gagné."

LUX_will_fail_negotiations_tt:0 "§RCela entraînera l’échec des négociations.§!"

luxembourg.230.t:0 "[FROM.GetNameDefCap] demande des garanties"
luxembourg.230.d:0 "[FROM.GetNameDefCap] a récemment abandonné sa neutralité, un nouveau gouvernement ayant remporté les élections. Évidemment, ils ne peuvent pas se défendre seuls et cherchent tôt ou tard une protection.\n\nCe jour est arrivé : un diplomate [FROM.GetAdjectiveCap] a sollicité la protection [ROOT.GetAdjectiveCap] contre les menaces pesant sur leur indépendance et leur souveraineté."
luxembourg.230.a:0 "Nous les protégerons."
luxembourg.230.b:0 "[ROOT.GetNameDefCap] n’est pas prêt à s’engager."

luxembourg.231.t:0 "[FROM.GetNameDefCap] a accepté de nous protéger"
luxembourg.231.d:0 "Notre diplomate est revenu avec la nouvelle que [FROM.GetNameDef] a accepté de nous protéger.\n\nCette grande nouvelle se répand déjà dans le pays et devrait faire la une des journaux dès demain."
luxembourg.231.a:0 "Quel soulagement."

luxembourg.232.t:0 "[FROM.GetNameDefCap] refuse de nous protéger"
luxembourg.232.d:0 "Un télégramme diplomatique nous est parvenu : [FROM.GetNameDef] a déclaré qu’il ne nous protégerait pas, n’étant pas prêt à s’engager dans de tels accords."
luxembourg.232.a:0 "Dommage."

luxembourg.240.t:0 "[FROM.GetNameDefCap] veut fédéraliser le Benelux"
luxembourg.240.d:0 "L’idée circule depuis des années, mais n’a jamais été mise en œuvre. Après la formation du Benelux, [FROM.GetAdjectiveCap] semble avoir enfin décidé de pousser à l’unification des Pays-Bas.\n\nAccepter une telle proposition mettrait fin à l’existence de [ROOT.GetNameDef], mais cela renforcerait l’ensemble de la région.\nQuoi qu’il en soit, nous devons examiner la question avec soin, car c’est l’avenir des Pays-Bas qui est en jeu."
luxembourg.240.a:0 "L’union fait la force !"
luxembourg.240.b:0 "Nous ne renoncerons pas à notre indépendance."

luxembourg.241.t:0 "[FROM.GetNameDefCap] a accepté de fédéraliser"
luxembourg.241.d:0 "Enfin, le grand jour de l’unification est arrivé. Des délégués de [FROM.GetNameDef] ont informé le Premier ministre qu’ils rejoindraient la Fédération du Benelux.\n\nBien que les grandes lignes aient déjà été légiférées, certains problèmes restent à résoudre, comme l’avenir de la monarchie."
luxembourg.241.a:0 "Un grand jour pour nous tous."

luxemourg.242.t:0 "[FROM.GetNameDefCap] refuse de rejoindre l’Union"
luxembourg.242.d:0 "Malgré nos efforts pour promouvoir cette cause, [FROM.GetNameDef] a refusé d’entrer dans une Fédération du Benelux. Nous ne pouvons qu’espérer que leur décision leur sera favorable, ainsi qu’à nous.\n\nIl reste un espoir de défendre les Pays-Bas : nous devons persévérer coûte que coûte !"
luxembourg.242.a:0 "Dommage."

luxembourg.243.t:0 "La Fédération du Benelux"
luxembourg.243.d:0 "Après de longues négociations avec nos alliés, nous avons enfin obtenu la percée tant attendue. La décision est prise et les préparatifs sont en cours : la Fédération du Benelux est enfin fondée.\n\nJournée historique pour l’avenir des Pays-Bas comme pour l’Europe entière, elle restera dans l’Histoire comme un moment de joie et de coopération politique. Puissions-nous créer un monde meilleur pour nos successeurs !"
luxembourg.243.a:0 "« Fédération du Benelux ». Oui, cela sonne bien."

luxembourg.244.t:0 "Échec de la Fédération"
luxembourg.244.d:0 "Nos diplomates épuisés rentrent des négociations d’unification. Ils ont déjà informé le Premier ministre de leur échec.\n\nFinalement, [ROOT.GetNonIdeologyName] restera tel quel : [ROOT.GetNameDef] et rien de plus. Il nous faut désormais réorienter notre politique étrangère, puisque notre objectif principal n’a pas été atteint."
luxembourg.244.a:0 "Nous avons échoué."

luxembourg.350.t:0 "Coup d’État nazi en [LUX.GetNonIdeologyName]"
luxembourg.350.d:0 "Des nouvelles nous parviennent de [LUX.GetOldNameDef] : le palais grand-ducal a été pris d’assaut par des nazis allemands. Ils ont pu réussir grâce au soutien croissant obtenu ces derniers mois. Reste à voir si ce nouveau gouvernement parviendra à maintenir son emprise sur le pays.\n\n[GER.GetNameDefCap] a déjà stationné des troupes dans leur nouvel État vassal, annoncé comme étroitement intégré à leur nation. Seul l’avenir dira si cela bouleversera l’équilibre des forces en Europe et si [LUX.GetNonIdeologyName] existera encore dans quelques années."
luxembourg.350.a:0 "Nous leur souhaitons bonne chance."
luxembourg.350.b:0 "Inquiétant."
### marqueur de localisation manquante ###
luxembourg.260.t:0 "[FROM.GetNameDefCap] demande l’invasion de [PREV.GetNameDef]"
luxembourg.260.d:0 "Nos alliés [FROM.GetAdjectiveCap] nous pressent de lancer une invasion contre [PREV.GetNameDef]. Ils prétendent que cette action est nécessaire pour le succès de la révolution et comptent sur notre soutien."
luxembourg.260.a:0 "Tout pour la révolution."
luxembourg.260.b:0 "Cette invasion ne sera pas autorisée."

luxembourg.261.t:0 "[FROM.GetNameDefCap] a accepté l’invasion"
luxembourg.261.d:0 "Après de longues discussions, [FROM.GetNameDefCap] a finalement accepté de soutenir l’invasion de [PREV.GetNameDef]. Le plan d’attaque est déjà en cours de préparation et l’enthousiasme est palpable."
luxembourg.261.a:0 "Vive la révolution !"

luxembourg.262.t:0 "[FROM.GetNameDefCap] refuse l’invasion"
luxembourg.262.d:0 "[FROM.GetNameDefCap] a décidé de ne pas soutenir notre projet d’invasion de [PREV.GetNameDef]. Sans leur appui, il nous sera impossible d’aller de l’avant."
luxembourg.262.a:0 "Nous ne pouvons rien y faire."

luxembourg.263.t:0 "[FROM.GetNameDefCap] veut envahir le Benelux"
luxembourg.263.d:0 "Une demande formelle a été transmise : [FROM.GetNameDefCap] souhaite organiser une invasion coordonnée du Benelux. Si nous acceptons, cette action bouleversera l’équilibre régional."
 
luxembourg.400.t:0 "[FROM.GetNameDefCap] veut administrer plus de terres"
luxembourg.400.d:0 "[FROM.GetNameDefCap] a exprimé le désir d’administrer davantage de territoires conquis. Ils prétendent que cela renforcera la cause commune, mais certains craignent que cela affaiblisse notre peuple."
luxembourg.400.a:0 "Tout pour nos frères [ROOT.GetAdjectiveCap]."
luxembourg.400.b:0 "Cela affaiblirait le peuple [ROOT.GetAdjectiveCap]."

luxembourg.401.t:0 "[FROM.GetNameDefCap] a accepté notre proposition"
luxembourg.401.d:0 "Notre proposition a été accueillie favorablement par [FROM.GetNameDefCap]. Les préparatifs pour l’administration commune des nouveaux territoires peuvent commencer immédiatement."
luxembourg.401.a:0 "Mettons-nous au travail."

luxembourg.402.t:0 "[FROM.GetNameDefCap] a rejeté notre proposition"
luxembourg.402.d:0 "[FROM.GetNameDefCap] a rejeté notre proposition concernant l’administration des territoires. Cette décision est un revers sérieux pour nos plans."
luxembourg.402.a:0 "Un vrai revers pour le Gau."

luxembourg.405.t:0 "[FROM.GetNameDefCap] veut s’étendre davantage"
luxembourg.405.d:0 "[FROM.GetNameDefCap] nous presse de céder encore plus de territoires à leur administration. Ils assurent que c’est pour le bien de la cause, mais cela pourrait fragiliser notre position."
luxembourg.405.a:0 "Tout pour nos frères [ROOT.GetAdjectiveCap]."
luxembourg.405.b:0 "Cela affaiblirait le peuple [ROOT.GetAdjectiveCap]."

luxembourg.406.t:0 "[FROM.GetNameDefCap] a accepté notre proposition"
luxembourg.406.d:0 "Nos efforts diplomatiques ont porté leurs fruits : [FROM.GetNameDefCap] a accepté nos conditions pour la gestion des nouveaux territoires."
luxembourg.406.a:0 "Mettons-nous au travail."

luxembourg.407.t:0 "[FROM.GetNameDefCap] a rejeté notre proposition"
luxembourg.407.d:0 "Nos espoirs se sont éteints : [FROM.GetNameDefCap] a refusé notre offre concernant la redistribution des territoires."
luxembourg.407.a:0 "Un vrai revers pour le Gau."

luxembourg.410.t:0 "[FROM.GetNameDefCap] demande l’occupation de [965.GetName]"
luxembourg.410.d:0 "[FROM.GetNameDefCap] exige de prendre en charge l’occupation de [965.GetName]. Certains y voient une opportunité de partager le fardeau, d’autres une perte stratégique."
luxembourg.410.a:0 "Nous leur transférerons le fardeau."
luxembourg.410.b:0 "[ROOT.GetNameDefCap] a besoin de toutes ses terres occupées."

luxembourg.411.t:0 "[FROM.GetNameDefCap] a transféré [965.GetName]"
luxembourg.411.d:0 "Les autorités [FROM.GetAdjectiveCap] ont accepté de nous céder l’administration de [965.GetName]."
luxembourg.411.a:0 "Un pas de plus vers la domination [ROOT.GetAdjectiveCap]."

luxembourg.412.t:0 "[FROM.GetNameDefCap] refuse de transférer [965.GetName]"
luxembourg.412.d:0 "Malgré nos demandes, [FROM.GetNameDefCap] a refusé de nous céder [965.GetName]."
luxembourg.412.a:0 "Un petit revers."

luxembourg.415.t:0 "[FROM.GetNameDefCap] demande le transfert de notre occupation [BEL.GetAdjectiveCap]"
luxembourg.415.d:0 "[FROM.GetNameDefCap] estime que les territoires [BEL.GetAdjectiveCap] sous notre contrôle leur reviennent de droit. La question est de savoir si nous devons céder ou non."
luxembourg.415.a:0 "Nous ne pouvons pas leur refuser ce qui leur appartient."
luxembourg.415.b:0 "Les terres [BEL.GetAdjectiveCap] sont à juste titre [ROOT.GetAdjectiveCap]."

luxembourg.416.t:0 "[FROM.GetNameDefCap] a transféré ses terres [BEL.GetAdjectiveCap]"
luxembourg.416.d:0 "[FROM.GetNameDefCap] a accepté de céder ses territoires [BEL.GetAdjectiveCap]."
luxembourg.416.a:0 "Ils ont fait le bon choix."

luxembourg.417.t:0 "[FROM.GetNameDefCap] refuse de se retirer de [BEL.GetNonIdeologyName]"
luxembourg.417.d:0 "[FROM.GetNameDefCap] a catégoriquement refusé de se retirer de [BEL.GetNonIdeologyName]."
luxembourg.417.a:0 "Qu’ils soient maudits !"

luxembourg.420.t:0 "[FROM.GetNameDefCap] veut occuper les terres [HOL.GetAdjectiveCap]"
luxembourg.420.d:0 "[FROM.GetNameDefCap] réclame désormais l’occupation des territoires [HOL.GetAdjectiveCap]."
luxembourg.420.a:0 "Accordons-leur ce souhait."
luxembourg.420.b:0 "Nous ne céderons pas nos conquêtes."

luxembourg.421.t:0 "[FROM.GetNameDefCap] a transféré ses terres [HOL.GetAdjectiveCap]"
luxembourg.421.d:0 "[FROM.GetNameDefCap] nous a officiellement transféré l’administration des territoires [HOL.GetAdjectiveCap]."
luxembourg.421.a:0 "Splendide !"

luxembourg.422.t:0 "[FROM.GetNameDefCap] a refusé notre demande"
luxembourg.422.d:0 "Notre demande a été rejetée par [FROM.GetNameDefCap]."
luxembourg.422.a:0 "Dommage."

luxembourg.425.t:0 "[FROM.GetNameDef] a demandé des terres [FRA.GetAdjectiveCap]"
luxembourg.425.d:0 "[FROM.GetNameDef] nous demande de céder nos territoires [FRA.GetAdjectiveCap]. Certains pensent que nous pouvons nous en passer, d’autres craignent que cela ne les rende trop puissants."
luxembourg.425.a:0 "Nous n’avons aucune utilité pour ces terres de toute façon."
luxembourg.425.b:0 "Ils deviennent trop puissants !"

luxembourg.426.t:0 "[FROM.GetNameDefCap] a cédé à notre demande"
luxembourg.426.d:0 "[FROM.GetNameDefCap] a finalement accepté de nous céder les terres demandées."
luxembourg.426.a:0 "Nos nouvelles terres renforceront la nation."

luxembourg.427.t:0 "[FROM.GetNameDefCap] a ignoré notre demande"
luxembourg.427.d:0 "Malgré nos efforts, [FROM.GetNameDefCap] a totalement ignoré notre requête concernant les territoires [FRA.GetAdjectiveCap]."
luxembourg.427.a:0 "Tant pis, nous les obtiendrons autrement."

#Idées
#  LUX_charlotte:0 "Grande-Duchesse Charlotte I" # identique au vanilla
LUX_charlotte_desc:0 "Avec la constitution de 1919, les pouvoirs de la Duchesse ont été réduits à un rôle purement cérémoniel. Malgré cela, la Grande-Duchesse Charlotte reste une figure populaire de la démocratie de [ROOT.GetNameDef] et du maintien de son indépendance."
r56_LUX_charles_marx:0 "Charles Marx"
LUX_camille_dennemeyer:0 "Camille Dennemeyer"
LUX_prince_jean:0 "Prince Jean"
r56_LUX_evacuate_the_treasury:0 "Trésor Évacué"
LUX_formalize_our_resistance:0 "Résistance Luxembourgeoise"
r56_LUX_operation_bastogne:0 "Opération Bastogne"
r56_LUX_royalist_militarism:0 "Militarisme Royaliste"
r56_LUX_creative_military_solutions:0 "Doctrine des Parachutistes"
r56_LUX_our_own_destiny:0 "Notre propre destin"
r56_LUX_embrace_autarky:0 "Autarcie Luxembourgeoise"
r56_LUX_favor_the_royalist:0 "Enracinement Royaliste"
r56_LUX_favor_the_fasicts:0 "Jeunesses Incorporées"
r56_legacy_of_luxembourg_crisis:0 "Héritage de la Crise Luxembourgeoise"
r56_legacy_of_luxembourg_crisis_desc:0 "Depuis la crise de 1867, le Luxembourg a suivi une politique de neutralité. Cependant, l’occupation allemande durant la Grande Guerre et leurs campagnes récentes de réarmement ont provoqué un effritement du soutien à cette neutralité."
r56_lux_stand_agaisnt_authoritarianism:0 "Résister à l’Autoritarisme"
r56_LUX_politcal_safe_heaven:0 "Havre Politique"
r56_LUX_coaltition_with_kpl:0 "Syndicats Élevés"
r56_LUX_strengthen_rietspartei_position:0 "Technocrates Élevés"
r56_LUX_armed_republic:0 "Loi de Défense Nationale"
r56_LUX_export_our_doctrine:0 "Agents Politiques Luxembourgeois"
r56_LUX_export_our_doctrine_native:0 "Exporter Notre Doctrine"
r56_LUX_export_our_doctrine_native_LaR:0 "Exporter Notre Doctrine"
lux_victor_idea:0 "Lux Victor !"
lux_victor_idea_desc:0 "Nous avons été pesés, mesurés, et ne manquons de rien. Vive la Duchesse et vive le Luxembourg !"
auxiliaries_idea:0 "Auxiliaires"
auxiliaries_idea_desc:0 "À la veille de la guerre, chaque citoyen volontaire doit être prêt à se battre. En renforçant nos forces actuelles avec des auxiliaires, nous pourrions avoir une chance dans le conflit à venir."
gendarmerie_idea:0 "Gendarmerie Grand-Ducale"
gendarmerie_idea_desc:0 "Une brigade de maintien de l’ordre assurera la sécurité de nos civils dans les rues, et sera appelée à défendre la nation si nécessaire."
volunteer_army_idea:0 "Volontaires"
volunteer_army_idea_desc:0 "Chaque citoyen doit faire sa part."
quality_over_quantity_idea:0 "La qualité avant la quantité"
quality_over_quantity_idea_desc:0 "Bien que nous manquions d’espace, l’artisanat luxembourgeois peut devenir légendaire avec des efforts : chaque balle un coup de pinceau, chaque fusil un chef-d’œuvre."
foreign_experts_idea:0 "Experts Étrangers"
foreign_experts_idea_desc:0 "En invitant les meilleurs et les plus brillants dans nos institutions, nous pouvons accomplir des avancées technologiques dépassant largement celles de nos voisins plus grands."
LUX_communism_idea:0 "Influence Communiste"
LUX_communism_idea_desc:0 "Les banquiers et hommes d’affaires de l’élite ont trop longtemps opprimé le peuple luxembourgeois. Désormais, nous allons reprendre notre pays !"
LUX_fascism_idea:0 "Influence Fasciste"
LUX_fascism_idea_desc:0 "Notre nation s’est soumise aux traités démocratiques et au désarmement, transformant notre grand pays en risée. C’est seulement par l’ardeur nationaliste que nous pourrons restaurer l’honneur de la nation."
LUX_democratic_idea:0 "Influence Démocratique"
LUX_democratic_idea_desc:0 "L’avenir du Luxembourg repose sur la démocratie. Joseph Bech et le Rietspartei ont guidé notre nation jusqu’ici et bénéficient du plein soutien du pays."
LUX_neutrality_idea:0 "Influence Royaliste"
LUX_neutrality_idea_desc:0 "La neutralité a longtemps été la voie du Luxembourg, avec un succès variable. Cette fois, ce n’est pas par choix mais par nécessité que nous devons rester en dehors des conflits à venir."
communist_neighbours:0 "Voisins Communistes"
communist_neighbours_desc:0 "La présence d’un État communiste voisin rend notre pays plus vulnérable à l’influence communiste."
LUX_armed_deterrence:0 "Dissuasion Armée"
LUX_armed_deterrence_desc:0 "Mettez vos armées à l’épreuve contre les murs du Luxembourg, car il n’y aura aucune reddition."
BEL_defense_of_the_benelux:0 "Défense du Benelux"
LUX_steel_mills:0 "Aciéries Réunies de Burbach-Eich-Dudelange"
LUX_steel_mills_desc:0 "Les Aciéries Réunies de Burbach-Eich-Dudelange, ou ARBED, sont un conglomérat sidérurgique fondé au début du siècle. Il est rapidement devenu un producteur majeur et opère désormais dans plusieurs pays, au-delà même de l’Europe."
LUX_sola:0 "Société Luxembourgeoise d’Armes"
LUX_atelier_de_petange:0 "Les Ateliers de Pétange"
LUX_hadir:0 "Hauts-Fourneaux et Aciéries de Differdange, St-Ingbert, Rumelange"
LUX_esch_archette_aerodrome:0 "S.A. pour l’Aménagement et l’Exploitation de l’Aérodrome d’Esch/Alzette"
LUX_luxair:0 "Luxair"
LUX_radio_luxembourg:0 "Compagnie Luxembourgeoise de Radiodiffusion"
LUX_radio_luxembourg_desc:0 "Avec l’arrivée progressive de la radio, les émissions semi-légales n’ont pas tardé à apparaître. La Compagnie Luxembourgeoise de Radiodiffusion, ou CLR, est née de ces initiatives. Ses prédécesseurs furent des pionniers du multilinguisme, ce qui assure un brillant avenir à la CLR récemment fondée."
LUX_train_manufacturer:0 "Société Nationale des Chemins de Fer Luxembourgeois"
LUX_train_manufacturer_desc:0 "Cette société publique fut créée après la nationalisation et la fusion de plusieurs compagnies ferroviaires privées en une entité unique."
LUX_construction_company:0 "Karp-Kneip Luxembourg"
LUX_construction_company_desc:0 "Fondée en 1898 par Corneille Karp-Kneip, cette entreprise de construction s’est forgée une réputation de partenaire fiable, notamment dans le domaine routier."
LUX_lou_hemmer:0 "Lou Hemmer"
LUX_henri_stein:0 "Henri Stein"
LUX_edouard_kremmer:0 "Édouard Kremmer"
BEL_LUX_customs_union:0 "Union Économique Belgo-Luxembourgeoise"
LUX_prepareforwar:0 "Se Préparer à la Guerre"
LUX_prepareforwar_desc:0 "La guerre qui devait mettre fin à toutes les guerres n’a rien réglé. Alors que les grandes puissances à l’est et à l’ouest se mobilisent à nouveau, le Luxembourg doit être prêt à défendre son peuple."

LUX_boostindustry:0 "Stimuler l’Industrie"
LUX_boostindustry_desc:0 "Une nation sans industrie florissante est condamnée à s’effondrer sous son propre poids. Avec la guerre qui approche, il est essentiel que le Luxembourg dispose de ses propres moyens pour soutenir ses efforts de défense."

LUX_radioluxembourg:0 "Radio Luxembourg"
LUX_radioluxembourg_desc:0 "Basée dans notre grande ville, Radio Luxembourg permet aux diffuseurs d’atteindre des audiences dans toute l’Europe, brisant le monopole de la BBC et ramenant la radio commerciale au Royaume-Uni et en Irlande."

LUX_feierwon:0 "Feierwon"
LUX_feierwon_desc:0 "'Venez de France, de Belgique, de Prusse,\nnous voulons vous montrer notre patrie\nDemandez dans toutes les directions,\nNous voulons rester ce que nous sommes.'"

LUX_realism:0 "Réalisme"
LUX_realism_desc:0 "Bien que son esprit soit fort, le Luxembourg ne peut se permettre une posture agressive en temps de guerre. Nous avancerons avec considération pour notre peuple et pour notre neutralité."

LUX_idealism:0 "Idéalisme"
LUX_idealism_desc:0 "La passivité est synonyme de mort en ces temps. Si nous n’agissons pas les premiers, nous serons submergés par l’une des puissances qui nous entourent. Sous la direction d’Émile Speller, le Luxembourg ne sera pas sous-estimé."

LUX_lucilinburhuc:0 "Lucilinburhuc"
LUX_lucilinburhuc_desc:0 "La forteresse de Luxembourg fut longtemps la pierre angulaire de notre nation. Bien que les traités nous aient forcés à démanteler la plupart de nos fortifications, la sécurité de notre grande forteresse est plus nécessaire que jamais."

LUX_luxvictor:0 "Lux Victor"
LUX_luxvictor_desc:0 "Nous avons été pesés, mesurés, et ne manquons de rien. Vive la Duchesse et vive le Luxembourg !"

LUX_joseph_schusterline:0 "Ligne Schuster"
LUX_joseph_schusterline_desc:0 "Les hostilités venant de l’est doivent être repoussées. Joseph Schuster a conçu une ligne de défense à notre frontière orientale pour protéger notre territoire et notre souveraineté."

LUX_grandducalgendarmerie:0 "Gendarmerie Grand-Ducale"
LUX_grandducalgendarmerie_desc:0 "Une brigade de maintien de l’ordre gardera nos rues sûres pour les civils et sera appelée à défendre la nation en cas de besoin."

LUX_restoretheauxiliaries:0 "Rétablir les Auxiliaires"
LUX_restoretheauxiliaries_desc:0 "À la veille de la guerre, chaque citoyen volontaire doit être prêt à se battre. En renforçant nos forces avec des auxiliaires, nous pouvons espérer tenir dans le conflit à venir."

LUX_volunteerarmy:0 "Armée de Volontaires"
LUX_volunteerarmy_desc:0 "Le Luxembourg dépend de ses citoyens courageux pour défendre la nation contre les menaces extérieures, aujourd’hui plus que jamais."

LUX_expandthesteelworks:0 "Étendre les Aciéries"
LUX_expandthesteelworks_desc:0 "Notre terre est réputée depuis longtemps pour son acier de qualité. Bien que nos ressources soient limitées, un meilleur usage des aciéries assurera la compétitivité du Luxembourg sur le marché mondial."

LUX_modernizetherails:0 "Moderniser les Rails"
LUX_modernizetherails_desc:0 "L’identité de notre pays est liée aux chemins de fer transnationaux reliant les grandes puissances. Il est dans notre intérêt de moderniser notre réseau ferroviaire dans les années à venir."

LUX_sandweilerairport:0 "Soutenir les Meetings Aériens"
LUX_sandweilerairport_desc:0 "Le Luxembourg est petit et ne dispose pour l’instant que d’une seule piste d’aviation, mais l’organisation de meetings aériens pourrait stimuler l’intérêt pour l’aviation."

LUX_war:0 "Prêt pour la Guerre"
LUX_war_desc:0 "Que Dieu nous protège tous."

LUX_arcelormittal:0 "ARBED"
LUX_arcelormittal_desc:0 "En nationalisant les aciéries de l’ARBED, notre petite nation deviendra l’envie du monde industriel."

LUX_beneluxair:0 "Soutenir les Constructeurs Locaux"
LUX_beneluxair_desc:0 "Notre seul espoir de développer nos propres avions repose sur quelques inventeurs compétents capables de copier et d’améliorer les modèles étrangers."

LUX_princehenrinetwork:0 "Réseau Prince-Henri"
LUX_princehenrinetwork_desc:0 "Depuis cent ans, le réseau Prince-Henri sert notre peuple. Mais ces dernières années, les profits ont diminué et la concurrence a augmenté. En nationalisant les rails, nous pourrons maintenir l’efficacité dont notre réseau ferroviaire a besoin."

LUX_maximiseefficiency:0 "Maximiser l’Efficacité"
LUX_maximiseefficiency_desc:0 "L’efficacité est la clé pour répondre aux besoins croissants du pays : des balles aux bandages, nos usines seront irréprochables."

LUX_qualityoverquantity:0 "La Qualité avant la Quantité"
LUX_qualityoverquantity_desc:0 "Bien que nous manquions d’espace, l’artisanat luxembourgeois peut devenir légendaire avec des efforts : chaque balle un coup de pinceau, chaque fusil un chef-d’œuvre."

LUX_militaryfocus:0 "Priorité à l’Armée"
LUX_militaryfocus_desc:0 "Si nous ne développons pas notre industrie militaire, il ne restera rien de notre nation. Tous nos efforts doivent se concentrer sur la machine de guerre luxembourgeoise."

LUX_civilianfocus:0 "Priorité aux Civils"
LUX_civilianfocus_desc:0 "Notre peuple est plus important que les machinations de guerre. Une forte industrie civile peut assurer la vie, sinon la liberté."

LUX_foreignexperts:0 "Experts Étrangers"
LUX_foreignexperts_desc:0 "En invitant les meilleurs et les plus brillants, nous pouvons accomplir des avancées technologiques surpassant celles de nos voisins plus grands."

LUX_universititvultzebuerg:0 "Universitéit vu Lëtzebuerg"
LUX_universititvultzebuerg_desc:0 "Une université théorique a été proposée pour rassembler les plus grands esprits du pays. Nous pouvons faire de cette idée une réalité."

LUX_luxembourgcanintospace:0 "Le Luxembourg Conquiert l’Espace"
LUX_luxembourgcanintospace_desc:0 "Si nous sommes allés jusque-là, il n’y a plus de retour possible."

LUX_rietspartei:0 "Rietspartei"
LUX_rietspartei_desc:0 "L’avenir du Luxembourg repose sur la démocratie. Joseph Bech et le Rietspartei ont guidé notre nation jusqu’ici et bénéficient du plein soutien du pays."

LUX_strengthenties:0 "Renforcer les Liens"
LUX_strengthenties_desc:0 "La démocratie ne peut prospérer seule. Si nous voulons rester libres, nous devons bien choisir nos alliés."

LUX_benelux:0 "Benelux"
LUX_benelux_desc:0 "Des amis dans le besoin…"

LUX_protectorsofliberte:0 "Protecteurs de la Liberté"
LUX_protectorsofliberte_desc:0 "Les Alliés sont à la fois nos amis et nos protecteurs. Une alliance avec eux est le seul moyen de préserver notre souveraineté."

LUX_friendsnear:0 "Amis Proches"
LUX_friendsnear_desc:0 "Les pays du bas sont nos alliés immédiats, partageant notre culture et nos préoccupations. Il serait bénéfique de resserrer nos liens avec eux."

LUX_friendsafar:0 "Amis Lointains"
LUX_friendsafar_desc:0 "Bien que nous soyons restés neutres lors de la dernière guerre, notre souveraineté fut violée par l’occupation allemande, et seule la libération alliée nous rendit notre liberté. Cette fois, nous ferons le bon choix."

LUX_bastion_of_democracy:0 "Bastion de la Démocratie"
LUX_bastion_of_democracy_desc:0 "Le règne de terreur d’Hitler nous menace tous ! Tout le Luxembourg est uni dans un seul but : mettre fin à la menace fasciste en Europe."

LUX_luxembourgneutrality:0 "Neutralité Luxembourgeoise"
LUX_luxembourgneutrality_desc:0 "La neutralité a longtemps été la voie du Luxembourg, avec un succès variable. Cette fois, ce n’est pas par choix mais par nécessité que nous devons rester en dehors des conflits."

LUX_luxembourgianrevanchism:0 "Revanchisme Luxembourgeois"
LUX_luxembourgianrevanchism_desc:0 "Bien que dérisoire aujourd’hui, le Luxembourg fut autrefois une nation importante dans l’histoire de l’Europe. Et en ces temps troublés, pourquoi ne le redeviendrait-il pas ?"

LUX_theduchess:0 "La Duchesse"
LUX_theduchess_desc:0 "La décision de retirer ses pouvoirs à notre monarque fut une erreur. En ces temps troublés, la seule véritable dirigeante du Luxembourg est notre Duchesse, Fir Gott an Duchesse !"

LUX_easternwinds:0 "Vents d’Est"
LUX_easternwinds_desc:0 "Les banquiers et hommes d’affaires de l’élite ont trop longtemps opprimé le peuple luxembourgeois. Désormais, nous allons reprendre notre pays !"

LUX_supporttheright:0 "Soutenir la Droite"
LUX_supporttheright_desc:0 "Notre nation s’est soumise aux traités démocratiques et au désarmement, transformant notre grand pays en risée. Seule l’ardeur nationaliste peut restaurer l’honneur de notre nation."

LUX_deterrence:0 "Dissuasion"
LUX_deterrence_desc:0 "Nous avons durement souffert de nos efforts lors des guerres passées, et le Luxembourg a retenu la leçon. Désormais, nous ne combattrons que pour nous-mêmes."

LUX_armeddeterrence:0 "Dissuasion Armée"
LUX_armeddeterrence_desc:0 "L’Allemagne n’a aucune intention de respecter notre neutralité, et la France convoite nos terres depuis longtemps. Si personne ne respecte notre neutralité, nous la leur imposerons."

LUX_kommunisteschparteiltzebuerg:0 "Kommunistesch Partei Lëtzebuerg"
LUX_kommunisteschparteiltzebuerg_desc:0 "Moscou est trop loin pour nous offrir quoi que ce soit. Le Luxembourg, seul, apportera la révolution à l’Europe."

LUX_frenchinsurrectionists:0 "Insurrectionnistes Français"
LUX_frenchinsurrectionists_desc:0 "L’esprit révolutionnaire est fort chez nos frères français. Un soutien mutuel entre le KPL et la Commune française servira notre cause."

LUX_spreadtherevolution:0 "Ré répandre la Révolution"
LUX_spreadtherevolution_desc:0 "Entends-tu, frère belge et sœur néerlandaise ? C’est le son de la Révolution !"

LUX_friendsveryafar:0 "Amis Très Lointains"
LUX_friendsveryafar_desc:0 "Moscou est le foyer du communisme, un allié puissant et un camarade digne. Bien que nos pays soient éloignés, nos esprits sont proches !"

LUX_rexluxembourg:0 "Regina Luxembourg"
LUX_rexluxembourg_desc:0 "Notre Duchesse ne s’inclinera devant aucun dictateur ! Le glorieux règne du Luxembourg a enfin commencé."

LUX_volksdeutschebewegung:0 "Volksdeutsche Bewegung"
LUX_volksdeutschebewegung_desc:0 "Des discussions ont eu lieu, des plans ont été préparés. Pour la sécurité de notre nation, nous devons nous unir à Hitler, égaux ou non."

LUX_retakebitburg:0 "Reprendre Bitburg"
LUX_retakebitburg_desc:0 "La machine de guerre allemande n’effraie pas notre courageuse nation. Nous reprendrons les terres que les Prussiens nous ont volées, ou nous mourrons en essayant !"

LUX_retakemoselle:0 "Reprendre la Moselle"
LUX_retakemoselle_desc:0 "Les terres volées sont détenues par les Français depuis trop longtemps. Après près de 400 ans, le Luxembourg réparera cette injustice."

LUX_retakeareleland:0 "Reprendre l’Arlonnais"
LUX_retakeareleland_desc:0 "Notre perte la plus cruelle, infligée par les révolutionnaires belges, n’a pas été oubliée. Bien que le Benelux nous lie ensemble, cette injustice ne peut être effacée."

LUX_military:0 "Effort Militaire"
LUX_military_desc:0 "Avec notre industrie et nos infrastructures prêtes, nous pouvons concentrer nos efforts sur la préparation du Luxembourg à la guerre moderne."

LUX_tank:0 "Conceptions Théoriques de Chars"
LUX_tank_desc:0 "Un avantage à avoir des voisins militaristes est de pouvoir observer de près les dernières terreurs technologiques."

LUX_navy:0 "Effort Naval"
LUX_navy_desc:0 "Le Luxembourg n’a jamais connu la mer, encore moins une puissance navale. Aujourd’hui, nous allons remédier à cela."

LUX_destroyer:0 "Destroyers"
LUX_destroyer_desc:0 "Aussi agréable serait-il de construire des colosses navals terrorisant les mers, commençons par quelque chose de plus modeste."

LUX_benelux_military_cooperation:0 "Coopération Militaire du Benelux"
LUX_benelux_military_cooperation_desc:0 "Dépendant du soutien militaire de nos voisins, nous devons mettre en place un état-major commun spécialisé dans la défense contre ces mêmes voisins, qui sont aussi nos ennemis probables."

