LUX_chamberofdeputies_KPL_info_desc_text:0 "En tant que parti communiste du Luxembourg, le KPL appelle à une révolution socialiste pour renverser les systèmes tyranniques du passé et instaurer un État ouvrier. Aujourd’hui, il est principalement influencé par les tendances staliniennes de son président."
