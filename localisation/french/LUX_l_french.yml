r56_LUX_cut_back_workers_rights:0 "Réduire les Droits des Travailleurs"
r56_LUX_strengthened_agriculture:0 "Agriculture Renforcée"
r56_LUX_ministry_of_economics_i:0 "Ministère de l’Économie"
r56_LUX_ministry_of_labour_i:0 "Ministère du Travail"
r56_LUX_ministry_of_interior_i:0 "Ministère de l’Intérieur"
r56_LUX_ministry_of_foreign_affairs_i:0 "Ministère des Affaires Étrangères"
r56_LUX_ministry_of_army_i:0 "Ministère de l’Armée"

r56_LUX_economic_dependence:0 "Dépendance Économique"
r56_LUX_economic_dependence_desc:0 "L’industrie luxembourgeoise n’est pas assez grande pour subvenir seule à ses besoins. Elle dépend donc des importations de fer en provenance de France et des exportations d’acier vers l’Allemagne."

r56_LUX_polarized_society:0 "Société Polarisée"
r56_LUX_polarized_society_desc:0 "Depuis le référendum sur la Maulkuerfgesetz, le pays est divisé entre ceux qui voulaient interdire le KPL et ceux qui s’y opposaient. Il faudra un grand effort pour combler cette fracture."

r56_LUX_farm_subsidies:0 "Subventions Agricoles"
r56_LUX_farm_subsidies_desc:0 "Épine dorsale de tout pays, les agriculteurs méritent reconnaissance et moyens pour assurer un revenu stable. Ces subventions le rendent possible."

r56_LUX_strengthened_rural_communities:0 "Communautés Rurales Renforcées"

r56_LUX_policy_of_free_hands:0 "Politique des Mains Libres"
r56_LUX_policy_of_free_hands_desc:0 "Pour rester neutres, nous devons conclure des accords avec tout le monde et ne pas laisser les différences idéologiques compromettre notre indépendance."

r56_LUX_defensive_focus:0 "Priorité Défensive"
r56_LUX_defensive_focus_desc:0 "Nous n’avons pas les moyens d’attaquer en cas de guerre, nous devons donc concentrer tous nos efforts sur la défense de notre pays."

r56_LUX_focused_radio_efforts:0 "Effort Radar et Radio Ciblé"
r56_LUX_focused_radio_efforts_desc:0 "Nous avons interrompu la plupart des transmissions civiles afin que notre armée puisse défendre plus efficacement le pays."

r56_LUX_banned_aid:0 "Aide Internationale Interdite"
r56_LUX_banned_aid_desc:0 "Pour démontrer notre engagement envers la neutralité, nous avons interdit l’aide internationale, afin qu’aucune arme [ROOT.GetAdjectiveCap] ne tombe entre les mains des nations belligérantes."

r56_LUX_union_against_extremism:0 "Union contre l’Extrémisme"
r56_LUX_union_against_extremism_desc:0 "Les socialistes ont polarisé le pays, ils représentent une menace pour [ROOT.GetNameDef] et ne peuvent pas être autorisés à exercer une influence."

r56_LUX_motto:0 "Mir Wëlle Bleiwe Wat Mir Sinn"
r56_LUX_motto_desc:0 "La devise nationale de [ROOT.GetName] remonte à 1859 et se traduit approximativement par « Nous voulons rester ce que nous sommes »."

r56_LUX_continuing_the_fight:0 "Continuer le Combat"
r56_LUX_continuing_the_fight_desc:0 "Bien que nous ayons capitulé, nous ne nous sommes pas rendus. [ROOT.GetNameDefCap] persévérera et libérera un jour son territoire de l’occupation !"

r56_LUX_peace_in_our_times:0 "La Paix pour Notre Temps"
r56_LUX_peace_in_our_times_desc:0 "Les années de neutralité ont porté leurs fruits. [ROOT.GetNonIdeologyName] a préservé la paix et assuré sa durabilité."

r56_LUX_capital_of_europe:0 "Capitale de l’Europe"
r56_LUX_capital_of_europe_desc:0 "[ROOT.GetNameDefCap] est le cœur de l’Europe, avec trois langues officielles et un rôle clé dans la diplomatie européenne ainsi qu’à la Société des Nations."

r56_LUX_privatising_industry:0 "Privatisation de l’Industrie"
r56_LUX_privatising_industry_desc:0 "Le nouveau gouvernement libéral a enfin l’occasion de mener à bien des privatisations et de promouvoir la propriété privée."

r56_LUX_lowered_taxes:0 "Fiscalité Allégée"
r56_LUX_lowered_taxes_desc:0 "Des impôts faibles soulagent la population et augmentent la circulation du capital, ce qui conduit en fin de compte à une croissance économique."

r56_LUX_initial_rearmament:0 "Réarmement Initial"
r56_LUX_initial_rearmament_desc:0 "Défendre [ROOT.GetNameDef] nécessite une bonne armée. Des décennies de désarmement ont presque détruit notre capacité militaire. Nous devons inverser ce processus."

r56_LUX_benelux_customs_union:0 "Union Économique du Benelux"
r56_LUX_benelux_customs_union_desc:0 "Après la création de [ROOT.GetFactionName], ses membres ont décidé d’abolir les contrôles frontaliers au profit du libre-échange."

r56_LUX_unified_command:0 "Commandement Unifié"
r56_LUX_unified_command_desc:0 "Un bon commandement doit fonctionner de manière parfaitement cohérente. Nous y sommes parvenus, rien ne nous arrêtera désormais."

r56_LUX_united_and_ready:0 "Unis et Prêts"
r56_LUX_united_and_ready_desc:0 "Les Pays-Bas méridionaux tiennent fièrement tête à tout adversaire. Nous persévérerons et prospérerons ensemble."

r56_LUX_beating_the_giant:0 "Vaincre le Géant"
r56_LUX_beating_the_giant_desc:0 "Seuls, nous sommes impuissants face à [GER.GetNameDef]. Mais ensemble, nous pouvons gagner et mettre fin à la menace venue de l’est."

r56_LUX_benelux_alliance:0 "Membre du Benelux"
r56_LUX_benelux_alliance_desc:0 "Ce pays a rejoint le Benelux pour défendre ses intérêts et sa sécurité."

r56_LUX_increased_education_budget:0 "Budget Éducatif Accru"
r56_LUX_increased_education_budget_desc:0 "Investir dans la prochaine génération, voilà la plus grande responsabilité de l’État."

r56_LUX_agressive_benelux:0 "Politique Étrangère Aggressive"
r56_LUX_agressive_benelux_desc:0 "Nous nous sommes unifiés, mais pas encore tous les hommes et toutes les femmes qui se disent Beneluxiens sous un même drapeau."

r56_LUX_fair_economy:0 "Économie Équitable"
r56_LUX_fair_economy_desc:0 "Le peuple ne doit pas servir l’économie, c’est l’économie qui doit servir le peuple."

r56_LUX_abolished_monarchy:0 "Monarchie Abolie"
r56_LUX_abolished_monarchy_desc:0 "Nous sommes enfin libérés du joug monarchique. Nous avons laissé le passé derrière nous et l’avenir nous est désormais ouvert."

r56_LUX_socialist_future:0 "Avenir Socialiste"
r56_LUX_socialist_future_desc:0 "Les chaînes du passé ont été brisées, le prolétariat est désormais libre de façonner son avenir !"

r56_LUX_republican_humanism:0 "Humanisme Républicain"
r56_LUX_republican_humanism_desc:0 "Bien que la monarchie ait dirigé injustement [ROOT.GetNonIdeologyName], ses membres restent des êtres humains, dignes de respect et de droits comme tout un chacun."

r56_LUX_socialist_constitution:0 "Constitution Socialiste"
r56_LUX_socialist_constitution_desc:0 "Pour faire avancer la révolution ouvrière, il a fallu adapter la constitution en faveur des socialistes et du prolétariat."

r56_LUX_volunteers:0 "Forces Volontaires [ROOT.GetAdjectiveCap]"
r56_LUX_volunteers_desc:0 "Afin de protéger nos intérêts à l’étranger et d’aider nos alliés, nous devons être prêts à envoyer des troupes dans tout conflit qui pourrait éclater."

r56_LUX_nationalised_companies:0 "Entreprises Nationalisées"
r56_LUX_nationalised_companies_desc:0 "Beaucoup de grandes entreprises ont exploité leurs ouvriers pour accumuler du capital. Leurs propriétaires doivent désormais rejoindre le prolétariat puisqu’ils ne possèdent plus ces sociétés."

r56_LUX_struggle_for_equality:0 "Lutte pour l’Égalité"
r56_LUX_struggle_for_equality_desc:0 "L’égalité n’est pas un état, c’est un processus qu’il faut constamment maintenir. Mais l’effort en vaut la peine."

r56_LUX_collectivized_economy:0 "Économie Collectivisée"
r56_LUX_collectivized_economy_desc:0 "Pour que chaque travailleur profite de l’économie, il doit posséder les usines et les fermes."

r56_LUX_soviet_dominated_trade:0 "Commerce Dominé par les Soviétiques"
r56_LUX_soviet_dominated_trade_desc:0 "Puisque [SOV.GetNameDef] est un allié idéologique, nous avons pu négocier de bons accords commerciaux avec eux."

r56_LUX_developing_autarkic_economy:0 "Vers l’Autarcie"
r56_LUX_developing_autarkic_economy_desc:0 "Nous viserons l’autarcie afin d’être plus indépendants que jamais."

r56_LUX_autarkic_economy:0 "Économie Autarcique"
r56_LUX_autarkic_economy_desc:0 "Pour préserver notre indépendance économique, et donc politique, nous avons adopté un modèle autarcique."

r56_LUX_socialist_society:0 "Société Socialiste"
r56_LUX_socialist_society_desc:0 "Nous sommes enfin passés d’une société capitaliste à une société socialiste, étape naturelle de notre évolution vers le communisme."

r56_LUX_via:0 "VIA"
r56_LUX_via_desc:0 "Le VIA, ou Volkskommissariat für innere Angelegenheiten, est la police secrète de [ROOT.GetNameDef], réputée et crainte dans le monde entier."

r56_LUX_socialist_science:0 "Science Socialiste"
r56_LUX_socialist_science_desc:0 "Dans le monde moderne, la science est essentielle. Mais elle n’est rien sans le cadre idéologique du socialisme."

r56_LUX_patriotic_constitution:0 "Constitution Patriotique"
r56_LUX_patriotic_constitution_desc:0 "Pour garantir que le pays reste sous l’égide du communisme, la constitution doit renforcer le contrôle de l’État."

r56_LUX_antifascist_volunteers:0 "Volontaires Antifascistes"
r56_LUX_antifascist_volunteers_desc:0 "Le combat le plus important aujourd’hui est celui contre le fascisme. Il menace les nations, les peuples et l’égalité de chaque homme et chaque femme."

r56_LUX_agitated_youth:0 "Jeunesse Agitée"
r56_LUX_agitated_youth_desc:0 "La Luxemburger Volksjugend est une organisation similaire aux Jeunesses hitlériennes en [GER.GetNameDef]. Elle diffuse des idées fascistes et s’assure du soutien de la prochaine génération."

r56_LUX_dennemeyers_propaganda:0 "Propagande de Dennemeyer"
r56_LUX_dennemeyers_propaganda_desc:0 "Camille Dennemeyer est un génie de la propagande, il sait convaincre les gens et les toucher émotionnellement, une qualité précieuse pour diffuser le fascisme."

r56_LUX_political_support:0 "Soutien Politique"
r56_LUX_political_support_desc:0 "Avec un nouveau parti formé, nous avons les moyens d’entrer en scène et d’obtenir le soutien du peuple et du gouvernement."

r56_LUX_german_funding:0 "Financement Allemand"
r56_LUX_german_funding_desc:0 "L’industrie [GER.GetAdjectiveCap] plus développée peut soutenir la nôtre, ce qui accroît aussi la popularité [GER.GetAdjectiveCap] auprès du peuple [ROOT.GetAdjectiveCap]."

r56_LUX_anti_french_sentiments:0 "Sentiments Anti-Français"
r56_LUX_anti_french_sentiments_desc:0 "La France a influencé l’histoire de [ROOT.GetNameDef], c’est évident. Mais il devient clair pour le peuple que cette influence détruit l’identité et les racines [GER.GetAdjectiveCap] de la nation."

r56_LUX_fascist_army:0 "Recrutement Fasciste dans l’Armée"
r56_LUX_fascist_army_desc:0 "L’armée a été infiltrée par des fascistes qui recrutent désormais d’autres personnes partageant leur idéologie."

r56_LUX_all_luxembourgish_societies:0 "Sociétés Nationalistes Luxembourgeoises"
r56_LUX_all_luxembourgish_societies_desc:0 "Nous assistons à une résurgence de sociétés nationalistes jurant de protéger la nation et son identité à tout prix."

r56_LUX_professional_army:0 "Armée Professionnelle"
r56_LUX_professional_army_desc:0 "L’armée professionnelle de [GER.GetNonIdeologyName] est redoutée au combat et presque sans égale en expertise."

r56_LUX_political_army:0 "Armée Politique"
r56_LUX_political_army_desc:0 "Une nation forte a besoin d’une armée forte, loyale au gouvernement et appliquant sa volonté sans question."

r56_LUX_unbeaten_in_battle:0 "Invaincus au Combat"
r56_LUX_unbeaten_in_battle_desc:0 "« Im Felde Unbesiegt », ou « Invaincus au Combat », est la devise des forces armées [ROOT.GetAdjectiveCap], symbolisant notre puissance et notre volonté."

r56_LUX_taxes_germany:0 "Impôts à [GER.GetNameDef]"
r56_LUX_taxes_germany_desc:0 "En tant que partie intégrante de [GER.GetNameDef], nous devons verser des impôts au gouvernement central. Toutefois, avec une production accrue, les effets de ces impôts pourraient être atténués."

r56_LUX_german_manpower:0 "Main-d’œuvre [GER.GetAdjectiveCap]"
r56_LUX_german_manpower_desc:0 "Pour maintenir notre contrôle sur le pays, [GER.GetNameDef] nous envoie des hommes afin de renforcer notre appareil sécuritaire."

r56_LUX_treaty_of_london_signatory:0 "Signataire du Traité de Londres"
r56_LUX_treaty_of_london_signatory_desc:0 "Ce pays s’est engagé à défendre [LUX.GetNameDef] en cas d’attaque."
r56_LUX_treaty_of_london_signatory_tt:0 "§RSi [LUX.GetNameDef] est attaqué, nous devrons le défendre ou être vus comme des alliés indignes de confiance.§!"

r56_LUX_untrustworthy_ally:0 "Allié Peu Fiable"
r56_LUX_untrustworthy_ally_desc:0 "[ROOT.GetNameDefCap] est connu comme peu fiable, car il n’a pas défendu [LUX.GetNameDef] malgré son obligation."

r56_LUX_restored_neutrality:0 "Neutralité Restaurée"
r56_LUX_restored_neutrality_desc:0 "Avec un pays défendable, [ROOT.GetNameDef] a restauré sa neutralité en tant que nation inébranlable."

r56_LUX_total_neutrality:0 "Neutralité Totale"
r56_LUX_total_neutrality_desc:0 "En tant que garant de la paix, une neutralité totale a été proclamée."

# décisions
LUX_looming_strikes:0 "Grèves Imminentes"
LUX_looming_strikes_desc:0 "La situation au Luxembourg est tendue. Le gouvernement n’a pas su régler correctement les questions de justice sociale. Le peuple exige désormais des actions concrètes. Une grève semble désormais inévitable."
LUX_chamberofdeputies:0 "La Chambre des Députés"
LUX_ministries:0 "Les Ministères"
LUX_form_government_mission:0 "Former un Gouvernement"
LUX_ally_socialists_tt:0 "Débloque des §Hministres communistes§! et §Hsocial-démocrates§!."
LUX_maintain_governmental_positions_tt:0 "Débloque des §Hministres libéraux§! et §Hconservateurs§!."
LUX_ally_socialists:0 "S’allier aux Socialistes"
LUX_allied_socialists:0 "A §Hs’est allié aux Socialistes§!"
LUX_maintain_governmental_positions:0 "Maintenir les Postes Gouvernementaux"
LUX_maintained_governmental_positions:0 "A §Hmaintenu les Postes Gouvernementaux§!"
LUX_start_talks_with_left:0 "Entamer des Discussions avec la Gauche"
LUX_started_talks_with_left:0 "A §Hentamé des Discussions avec la Gauche§!"
LUX_negotiate_with_former_ministers:0 "Négocier avec les Anciens Ministres"
LUX_negotiated_with_former_ministers:0 "A §Hnégocié avec les Anciens Ministres§!"
LUX_form_government_mission_trigger:0 "A §Hnommé 5 ministres§!"
LUX_gain_new_iron_sources:0 "Acquérir de Nouvelles Sources de Fer"
LUX_gain_new_iron_sources_desc:0 "Le fer est un pilier de notre industrie, et plus encore de la sidérurgie. Nous devons assurer un approvisionnement constant de cette ressource précieuse pour maintenir notre production."
LUX_find_new_export_partners:0 "Trouver de Nouveaux Partenaires d’Exportation"
LUX_find_new_export_partners_desc:0 "Notre partenariat avec l’Allemagne est ancien, mais ne peut durer. Nous devons diversifier nos exportations pour préserver notre indépendance économique."
LUX_import_belgian_raw_materials:0 "Importer des Matières Premières de Belgique"
LUX_import_belgian_raw_materials_desc:0 "L’Union Économique belgo-luxembourgeoise a ouvert une ère de coopération entre nos pays. Une étape supplémentaire serait d’utiliser le fer belge dans nos usines. Allons-y !"

LUX_neutrality_balance_convert_factories:0 "Convertir les Usines Militaires"
LUX_neutrality_balance_convert_factories_desc:0 "En tant que nation neutre, nous pouvons nous concentrer sur notre population civile sans crainte d’intervention militaire. Nous devrions donc convertir certaines usines militaires en usines civiles."
LUX_neutrality_balance_continue_disarmament:0 "Poursuivre le Désarmement"
LUX_neutrality_balance_continue_disarmament_desc:0 "Nous n’avons pas besoin d’armée puisque nous sommes neutres et donc à l’abri d’une invasion. En réintégrant nos soldats dans l’économie, nous pouvons compter sur leur apport en main-d’œuvre."
LUX_neutrality_balance_promise_peace:0 "Promettre la Paix"
LUX_neutrality_balance_promise_peace_desc:0 "Si nous voulons que la population de [ROOT.GetNonIdeologyName] soutienne la neutralité, nous devons la convaincre qu’elle n’est pas en danger."
LUX_neutrality_balance_strengthen_foreign_office:0 "Renforcer les Affaires Étrangères"
LUX_neutrality_balance_strengthen_foreign_office_desc:0 "Le meilleur moyen de gagner une guerre est de l’empêcher d’éclater. La diplomatie est notre arme la plus efficace."
LUX_neutrality_balance_convert_civilian_factory:0 "Convertir les Usines Civiles"
LUX_neutrality_balance_convert_civilian_factory_desc:0 "Nous ne pouvons pas nous permettre le luxe de la production civile face aux menaces étrangères. Les usines civiles doivent désormais produire pour l’armée afin de protéger notre indépendance !"
LUX_neutrality_balance_divert_workers:0 "Rediriger les Travailleurs vers l’Armée"
LUX_neutrality_balance_divert_workers_desc:0 "Beaucoup de travailleurs [ROOT.GetAdjectiveCap] sont employés dans des secteurs qui n’auront plus d’avenir en cas d’invasion. Ils doivent être intégrés dans l’armée afin de servir utilement la nation."
LUX_neutrality_balance_prepare_defenses:0 "Préparer les Défenses"
LUX_neutrality_balance_prepare_defenses_desc:0 "[ROOT.GetNameDefCap] est un pays naturellement défendable, mais reste vulnérable à cause de sa petite population et de sa faible armée. Construire des fortifications renforcera nos chances."
LUX_neutrality_balance_prepare_for_war:0 "Se Préparer à la Guerre"
LUX_neutrality_balance_prepare_for_war_desc:0 "Même si le gouvernement veut réarmer et défendre le pays, une partie du peuple reste hésitante. Nous devons les convaincre que le réarmement sert l’intérêt de tous."

LUX_open_border_agreement_france:0 "Accord Frontière Ouverte avec [FRA.GetNonIdeologyName]"
LUX_open_border_agreement_france_desc:0 "[ROOT.GetNonIdeologyName] et [FRA.GetNonIdeologyName] ont joui d’un partenariat prospère. Nous allons renforcer nos accords commerciaux pour réduire notre dépendance à leur fer."
LUX_open_border_agreement_belgium:0 "Accord Frontière Ouverte avec [BEL.GetNonIdeologyName]"
LUX_open_border_agreement_belgium_desc:0 "[BEL.GetNonIdeologyName] est un partenaire de longue date. Il est temps de conclure de nouveaux accords pour importer leur fer à moindre coût."
LUX_open_border_agreement_netherlands:0 "Accord Frontière Ouverte avec [HOL.GetNonIdeologyName]"
LUX_open_border_agreement_netherlands_desc:0 "Bien que [HOL.GetNameDef] ait autrefois régné sur [ROOT.GetNonIdeologyName], nos relations restent bonnes. C’est l’occasion parfaite d’approfondir nos liens commerciaux."

LUX_currently_developing:0 "Aucun développement en cours"
LUX_regional_development_decision:0 "Développement Régional à [FROM.GetName]"
LUX_regional_development_decision_desc:0 "Nous devons garantir un niveau de vie décent à notre population. Investissons dans les régions pour faciliter cela."

r56_LUX_revolutionary_army:0 "Armée Révolutionnaire"
r56_LUX_revolutionary_army_desc:0 "L’armée peut être un outil de réalignement politique. Ainsi, elle sera loyale au gouvernement et à la révolution."
r56_LUX_politicised_army:0 "Armée Politisée"
r56_LUX_politicised_army_desc:0 "L’armée doit être considérée comme une extension de l’État, imposant le socialisme et protégeant la révolution."
r56_LUX_red_army:0 "Armée Rouge [ROOT.GetAdjectiveCap]"
r56_LUX_red_army_desc:0 "Alors que les socialistes consolident leur pouvoir, l’armée devient l’Armée Rouge, reflet des idéaux socialistes de la nation."

LUX_integrate_western_lands:0 "Intégrer les Terres de l’Ouest"
LUX_integrate_western_lands_desc:0 "Les territoires voisins à l’ouest sont culturellement [ROOT.GetAdjectiveCap]. Ils doivent être intégrés à [GER.GetNameDef]."

LUX_fascist_balance_fascist_propaganda:0 "Propager la Propagande Fasciste"
LUX_fascist_balance_fascist_propaganda_desc:0 "Notre appareil de propagande est efficace pour diffuser nos idées et rallier des soutiens."
LUX_fascist_balance_fascist_propaganda_tt:0 "Évolution quotidienne de l’équilibre des pouvoirs vers §HIdentité allemande§! : £BoP_right_texticon §H0.30%§!"

LUX_fascist_balance_continued_army_infiltration:0 "Poursuivre l’Infiltration de l’Armée"
LUX_fascist_balance_continued_army_infiltration_desc:0 "Sans le soutien total de l’armée, nos efforts risquent d’échouer. Assurer sa loyauté est vital."

LUX_fascist_balance_additional_funding:0 "Obtenir des Fonds Supplémentaires"
LUX_fascist_balance_additional_funding_desc:0 "Même si [GER.GetNameDef] finance la majorité de nos activités, certaines restent non couvertes. Un soutien du NSDAP résoudrait ce problème."

LUX_fascist_balance_import_nazis:0 "Faire Passer des Allemands en Contrebande"
LUX_fascist_balance_import_nazis_desc:0 "Nous avons besoin de personnel compétent pour influencer l’opinion publique. L’expertise des membres du NSDAP [GER.GetAdjectiveCap] rendra cela possible."

LUX_fascist_balance_bind_army_to_country:0 "Assurer la Loyauté de l’Armée envers [ROOT.GetNonIdeologyName]"
LUX_fascist_balance_bind_army_to_country_desc:0 "Pour contrer les influences étrangères, l’armée doit rester loyale au pays, à tout prix."

LUX_fascist_balance_show_national_unity:0 "Montrer l’Unité Nationale"
LUX_fascist_balance_show_national_unity_desc:0 "Notre pays n’est pas uniforme, mais nous restons un peuple uni. La population et nos opposants doivent le comprendre."

LUX_fascist_balance_lobby_for_political_support:0 "Obtenir un Soutien Politique"
LUX_fascist_balance_lobby_for_political_support_desc:0 "La représentation politique est vitale pour nos efforts. Sans elle, nous échouerons. Il faut donc y consacrer beaucoup d’énergie."

LUX_fascist_balance_romanticise_past:0 "Idéaliser Notre Passé"
LUX_fascist_balance_romanticise_past_desc:0 "Beaucoup tentent de démystifier notre glorieux passé et d’y répandre des mensonges. Il est temps de reprendre ce qui nous appartient."

