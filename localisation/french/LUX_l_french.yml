# Ministères
LUX_ministries_desc_text:0 "Le gouvernement de [ROOT.GetNameDef] est composé de plusieurs postes ministériels. Chaque ministre a des responsabilités différentes reflétées dans son titre.\n\nChoisir le bon ministre pour le poste peut être difficile, mais il est utile d’examiner les §Gcompétences des ministres§! puisque cela détermine ce qu’un ministre pourra accomplir. De plus, §Hl’appartenance politique§! joue un rôle crucial. Si un ministre est membre d’un parti, ce parti sera considéré comme partie prenante du gouvernement. Certains partis §Rnécessitent plus de négociations§! pour se voir attribuer un poste ministériel, en fonction du §Hpremier ministre§!. Certains ministres ont leurs propres idées. De nombreux ministres potentiels de l’économie, par exemple, sont §Hinfluencés par la ligne de leur parti§!, il faut donc garder à l’esprit que nommer différents ministres peut influencer §Hl’avenir politique du pays§!."

