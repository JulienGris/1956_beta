l_french:

 luxembourg_tree:0 "Arbre national luxembourgeois"
 #Focalisations et info-bulles associées
 LUX_support_arbed:0 "Soutenir l’ARBED"
 LUX_support_arbed_desc:0 "ARBED est une entreprise relativement nouvelle, mais qui montre beaucoup de promesses. Soutenir une telle société en plein essor portera sûrement ses fruits à long terme."
 LUX_nationalise_railway_companies:0 "Nationaliser les compagnies ferroviaires"
 LUX_nationalise_railway_companies_desc:0 "Notre réseau ferroviaire est presque entièrement privé. C’est un risque évident pour des raisons de sécurité, car l’État ne peut pas contrôler un secteur vital du transport en cas de guerre."
 LUX_establish_national_labour_council:0 "[GetStrikeFocusName]"
 LUX_establish_national_labour_council_desc:0 "La question de la justice sociale est brûlante au Luxembourg. Les ouvriers sont connus pour leur penchant à gauche, et céder à leurs demandes pourrait enfin les apaiser. Mais cela reviendrait à céder aux socialistes et aux communistes."
 LUX_focus_autocompletion_tt:0 "Cet objectif sera §Hbypassé début 1937§!.\n"
 strike_demands_accepted_tt:0 "La §Hloi du Conseil national du travail§! sera promulguée.\n\nCela affectera notre §Hpaysage politique futur§!."
 delayed_nlc_tt:0 "La §Hloi du Conseil national du travail§! sera encore retardée.\n\nCela affectera notre §Hpaysage politique futur§!."
 LUX_revert_worker_immigration:0 "Inverser l’immigration ouvrière"
 LUX_revert_worker_immigration_desc:0 "La Grande Dépression n’a pas frappé le Luxembourg aussi durement que d’autres nations, en grande partie grâce à notre politique de priorité donnée aux citoyens luxembourgeois pour l’emploi, allant même jusqu’à renvoyer des travailleurs étrangers dans leur pays d’origine. Si nous continuons ainsi, le Luxembourg restera à flot dans un monde qui ne fait que commencer sa reconstruction après la Grande Dépression."
 LUX_strengthen_agricultural_industry:0 "Renforcer l’agriculture"
 LUX_strengthen_agricultural_industry_desc:0 "Même si le pays s’est industrialisé au cours du dernier siècle, une grande partie du Luxembourg dépend encore de l’agriculture et des emplois qu’elle procure. Il ne fait aucun doute que nous devons soutenir ce secteur primaire."
 LUX_repair_belgian_relations:0 "Réparer les relations belges"
 LUX_repair_belgian_relations_desc:0 "Historiquement, le Luxembourg a toujours été plus proche des Pays-Bas. Avec son voisin la Belgique, les relations ont cependant été tendues. L’Union économique belgo-luxembourgeoise a quelque peu aidé, mais nous pouvons pousser ce partenariat plus loin."
 LUX_begin_election_preparations:0 "Lancer la saison électorale"
 LUX_begin_election_preparations_tt:0 "Le terminer plus tôt vous donnera §Hplus de temps§! à la §HChambre des députés§!."
 LUX_begin_election_preparations_desc:0 "Les élections de 1937 approchent. Elles façonneront probablement l’avenir du Luxembourg. Il est naturel que de nombreux politiciens commencent leur campagne tôt."
 LUX_unlock_chamberofdeputies_tt:0 "Débloque la §HChambre des députés§!"
 LUX_the_maulkuerfgesetz:0 "Le Maulkuerfgesetz"
 LUX_the_maulkuerfgesetz_tt:0 "Cet objectif sera §Hbypassé§! à la §Hconclusion des élections§!.\nAdopter le §HMaulkuerfgesetz§! §Rrenforcera significativement les forces fascistes§! dans le pays."
 LUX_the_maulkuerfgesetz_desc:0 "Dès son élection, Joseph Bech a tenté de réduire l’influence communiste. Le dernier de ces efforts est le Maulkuerfgesetz, une loi visant à interdire tout parti cherchant à modifier violemment la constitution. Si cette loi passe, elle bannira de fait le KPL, le Parti communiste luxembourgeois."
 LUX_maulkuerfgesetz_passed_tt:0 "Le §HMaulkuerfgesetz§! sera §Hadopté§!."
 LUX_maulkuerfgesetz_didnt_pass_tt:0 "Le référendum §Rne fera pas passer§! le §HMaulkuerfgesetz§!."
 LUX_maulkuerfgesetz_passed:0 "Le Maulkuerfgesetz a été adopté"
 LUX_elections_over:0 "Les élections sont terminées"
 LUX_appoint_new_prime_minister:0 "Nommer le nouveau Premier ministre"
 LUX_appoint_new_prime_minister_desc:0 "Les élections sont terminées et le vainqueur a été proclamé. Le nouveau gouvernement doit diriger le pays pour plusieurs années, il est donc préférable que la transition du pouvoir se fasse sans heurts."
 LUX_the_dupong_ministry:0 "Le cabinet Dupong"
 LUX_the_dupong_ministry_desc:0 "Avec la démission de Joseph Bech, ce nouveau ministère dirigé par Pierre Dupong a fort à faire pour assurer la stabilité des dernières décennies. Nous leur souhaitons bonne chance !"
 LUX_elections_PD_winner:0 "§HPD§! a remporté les élections"
 LUX_liberal_victory:0 "La torche libérale brille"
 LUX_liberal_victory_desc:0 "Les partis libéraux ont toujours été une constante dans la politique luxembourgeoise. Ils ont participé à des gouvernements comme le précédent, mais n’avaient jamais réussi à obtenir la majorité. Aujourd’hui, cela change ! Le PRL sera un excellent parti dirigeant."
 LUX_elections_PRL_winner:0 "§HPRL§! a remporté les élections"
 LUX_first_social_democratic_government:0 "Le premier gouvernement social-démocrate"
 LUX_first_social_democratic_government_desc:0 "Le LSAP est un vieux parti, mais toujours resté dans l’opposition, malgré plus d’un quart des voix. Après son récent succès électoral, il accède enfin au pouvoir."
 LUX_elections_LSAP_winner:0 "§HLSAP§! a remporté les élections"
 LUX_begin_workers_revolution:0 "Commencer la révolution ouvrière"
 LUX_begin_workers_revolution_desc:0 "L’attente est enfin terminée ! Tous les efforts pour entraver la volonté du peuple ont échoué : le socialisme triomphe enfin au Luxembourg ! Nous allons abolir les reliques du passé et mener le Luxembourg vers un avenir socialiste radieux."
 LUX_elections_KPL_winner:0 "§HKPL§! a remporté les élections"
 LUX_invalidate_election:0 "Invalider les élections"
 LUX_invalidate_election_desc:0 "Les élections ont été un désastre. La constitution permet à la Grande-Duchesse de les invalider et de décider elle-même de la manière de résoudre la crise. Nous devons utiliser cette possibilité et laisser notre bien-aimée Duchesse décider de ce qui est le mieux pour le Luxembourg."
 LUX_invalidate_election_trigger_tt:0 "Moins de §H20,0%§! de participation"
 LUX_contest_election_results:0 "Contester les résultats électoraux"
 LUX_elections_indecisive:0 "Résultats électoraux indécis"
 LUX_contest_election_results_desc:0 "Le Luxembourg est allemand et le peuple luxembourgeois le sait ! Dès lors, il est évident que les élections ont été truquées pour maintenir la façade de la « démocratie ». Nous devons saisir le pouvoir et faire comprendre à chacun son appartenance allemande !"
 LUX_maintain_status_quo:0 "Maintenir le statu quo"
 LUX_maintain_status_quo_desc:0 "Beaucoup d’experts s’attendaient à un autre résultat, mais les conservateurs et les libéraux ont résisté. Espérons une transition de pouvoir fluide et une formation rapide du gouvernement pour que le Luxembourg soit entre de bonnes mains au plus vite."
 LUX_socialist_victory:0 "Victoire socialiste"
 LUX_socialist_victory_desc:0 "L’échec du Maulkuerfgesetz et la campagne électorale phénoménale des socialistes leur ont valu une victoire bien méritée. Une nouvelle ère commence pour le Luxembourg !"
 LUX_finalise_government_formation:0 "Finaliser la formation du gouvernement"
 LUX_finalise_government_formation_desc:0 "Le gouvernement a été formé et la transition de pouvoir achevée. Il est temps de déclarer officiellement la fin de la période électorale."
 LUX_finalise_government_formation_tt:0 "Verrouille les décisions §HLes ministères§!."
LUX_expand_farm_subsidies:0 "Élargir les subventions agricoles"
LUX_expand_farm_subsidies_desc:0 "L’agriculture a toujours été une industrie vitale pour le Luxembourg, notamment dans le nord du pays. Subventionner les agriculteurs est une évidence, c’est pourquoi nous devons élargir ce dispositif."
LUX_strengthen_rural_communities:0 "Renforcer les communautés rurales"
LUX_strengthen_rural_communities_desc:0 "L’urbanisation du XIXe siècle a conduit de nombreuses communautés rurales à la pauvreté et à l’endettement. Nous devons inverser cette tendance et accorder davantage d’attention à ces villages laissés pour compte par l’industrialisation."
LUX_invigorate_mining:0 "Revitaliser l’industrie minière"
LUX_invigorate_mining_desc:0 "Malheureusement, le Luxembourg dépend des importations de fer et de l’Union économique belgo-luxembourgeoise pour soutenir ses industries nationales, en particulier l’acier. D’où la nécessité de développer notre propre industrie minière."
LUX_another_declaration_of_neutrality:0 "Renforcer notre neutralité"
LUX_another_declaration_of_neutrality_desc:0 "Dans l’état précaire où se trouve le monde, nous devons rester fermes et préserver ce qui est le plus bénéfique à notre indépendance."
LUX_reaffirm_treaty_of_london:0 "Réaffirmer le Traité de Londres"
LUX_reaffirm_treaty_of_london_desc:0 "Le Traité de Londres, signé en 1867, a été d’une aide précieuse pour notre pays. Nous devons veiller à ce qu’il soit respecté par tous les signataires !"
LUX_renegotiate_trade_agreements:0 "Renégocier les accords commerciaux"
LUX_renegotiate_trade_agreements_desc:0 "Afin de réduire notre dépendance économique vis-à-vis des autres pays, nous devons lancer une initiative pour renégocier nos accords commerciaux avec nos voisins."
LUX_science_funding:0 "Augmenter le financement scientifique"
LUX_science_funding_desc:0 "Un investissement dans la science est un investissement dans l’avenir. Augmenter les financements scientifiques améliorera notre production de recherche et propulsera [ROOT.GetNonIdeologyName] vers le futur."
LUX_policy_of_free_hands:0 "La politique des mains libres"
LUX_policy_of_free_hands_desc:0 "Nous devons rester indépendants à tout prix, même si cela implique de conclure des accords avec les fascistes ou les communistes."
LUX_ban_international_aid:0 "Interdire l’aide internationale"
LUX_ban_international_aid_desc:0 "Notre neutralité totale doit rester intacte. Autoriser une intervention dans d’autres pays montrerait que nous ne sommes pas pleinement engagés dans la neutralité. Nous devons donc l’interdire dès le départ."
LUX_increase_border_security:0 "Renforcer la sécurité des frontières"
LUX_increase_border_security_desc:0 "Nous devons empêcher tout acte pouvant être considéré comme agressif. Cela inclut l’interdiction de la chasse dans les zones frontalières et un renforcement global des patrouilles frontalières."
LUX_control_radio_transmissions:0 "Contrôler toutes les transmissions radio"
LUX_control_radio_transmissions_desc:0 "En interdisant les transmissions radio civiles, nous pouvons coordonner plus facilement notre armée. Cela offre également une sécurité supplémentaire en empêchant les puissances étrangères d’utiliser la radio comme outil de propagande ou comme arme."
LUX_oust_socialists_trigger_tt:0 "N’a aucun §Hsocialiste§! au gouvernement."
LUX_demonstrate_our_will:0 "Affirmer notre volonté"
LUX_demonstrate_our_will_desc:0 "Notre pays a une histoire de résistance et de persévérance. Nous avons résisté à l’assimilation culturelle et nous restons une nation fière de son identité. Assurons-nous qu’il en reste ainsi !"
LUX_oust_socialists:0 "Écarter les socialistes"
LUX_oust_socialists_desc:0 "Le Maulkuerfgesetz a polarisé la population. Les socialistes, en particulier, ont diffusé leur agenda et sapé l’unité nationale. Nous devons y mettre fin au plus vite."
LUX_commemorate_independence:0 "Commémorer notre indépendance"
LUX_commemorate_independence_desc:0 "Nous sommes un peuple fier avec une histoire tout aussi fière. S’il y a bien une chose qui unit le pays, c’est notre volonté collective de rester libres de toute puissance étrangère."
LUX_continue_the_fight:0 "Poursuivre le combat"
LUX_continue_the_fight_desc:0 "Nous avons perdu, mais le combat n’est pas terminé. Nous devons libérer notre terre à tout prix !"
LUX_peace_in_our_times:0 "La paix de notre temps"
LUX_peace_in_our_times_desc:0 "La paix règne depuis longtemps déjà et aucune menace immédiate ne semble peser sur ce beau pays. Nous pouvons maintenant assouplir nos mesures de défense."
LUX_future_of_europe:0 "L’avenir de l’Europe"
LUX_future_of_europe_desc:0 "L’Europe est la plus forte lorsqu’elle est unie. En tant que cœur de l’Europe, cette unification doit venir de nous."
LUX_privatisation_drive:0 "Plus libre est l’économie..."
LUX_privatisation_drive_desc:0 "Enfin, un gouvernement libéral nous permet de lancer des réformes afin d’accroître la liberté du marché et celle du peuple. Après tout, plus le marché est libre, plus le peuple l’est également."
LUX_open_border_agreements:0 "Établir des accords de libre circulation"
LUX_open_border_agreements_desc:0 "La dépendance envers les autres pays a trop longtemps pesé sur [ROOT.GetNameDef]. Nous devons profiter de cette occasion pour négocier de nouveaux accords commerciaux afin d’obtenir de meilleurs prix à l’importation et à l’exportation."
LUX_lower_taxes:0 "Réduire les impôts"
LUX_lower_taxes_desc:0 "Personne ne peut contester que des impôts plus bas sont bénéfiques pour le peuple. Cela stimule la croissance économique et réduit la pauvreté. Une véritable victoire pour la population !"
LUX_academy_of_science:0 "Fonder une académie des sciences"
LUX_academy_of_science_desc:0 "Afin de rester à la pointe scientifiquement, nous devons investir dans la R&D. Une nouvelle académie nous aidera dans cette tâche."
LUX_abandon_neutrality:0 "Abandonner la neutralité"
LUX_abandon_neutrality_desc:0 "L’état actuel du monde prouve que [ROOT.GetNonIdeologyName] ne peut pas rester neutre. Nous devons nous réarmer aussi vite que possible."
LUX_seek_protection:0 "Chercher protection"
LUX_seek_protection_desc:0 "Une menace contre [ROOT.GetNonIdeologyName] submergerait rapidement notre armée. Il est vital d’obtenir le soutien d’une autre nation capable de nous défendre !"
LUX_begin_rearmament:0 "Commencer le réarmement"
LUX_begin_rearmament_desc:0 "Des décennies de désarmement doivent être annulées si nous voulons survivre à la tempête qui s’annonce."
LUX_research_cooperation:0 "Coopération en recherche"
LUX_research_cooperation_desc:0 "Les partenariats de recherche ont prouvé qu’ils augmentaient considérablement l’innovation. Unissons nos forces pour accomplir de véritables merveilles scientifiques et techniques."
LUX_join_allies:0 "Rejoindre les Alliés"
LUX_join_allies_desc:0 "Trop longtemps [ROOT.GetNameDef] est resté seul. Désormais, nous rejoindrons les démocraties d’Europe et les aiderons dans leur lutte contre le fascisme et le communisme."
LUX_extend_maginot:0 "Étendre la ligne Maginot"
LUX_extend_maginot_desc:0 "Plus grande fortification d’Europe, la ligne Maginot nous assurera une protection contre les menaces venant de l’est."
LUX_british_funding:0 "Financement militaire britannique"
LUX_british_funding_desc:0 "L’armée britannique est l’une des plus avancées à ce jour. Si nous obtenons son soutien, nous sommes assurés de réussir sur le champ de bataille."
LUX_arms_purchases:0 "Acheter des armes"
LUX_arms_purchases_desc:0 "Avec une industrie démobilisée, nous n’avons pas eu le temps de produire les armes nécessaires. Heureusement, nos alliés sont là pour nous aider."
LUX_preventive_intervention:0 "Intervention préventive"
LUX_preventive_intervention_desc:0 "Nous savons ce que les idéologies extrémistes entraînent. Nous devons agir maintenant, avant qu’elles n’aient la chance de nous frapper."
LUX_benelux_alliance:0 "Alliance du Benelux"
LUX_benelux_alliance_desc:0 "Nous pouvons gagner en force en nous alliant à nos partenaires les plus proches dans les Pays-Bas méridionaux. Ensemble, nous pourrons résister à l’invasion sans nous soumettre à l’influence des grandes puissances occidentales."
LUX_decentralised_alliance:0 "Décentraliser l’alliance"
LUX_decentralised_alliance_desc:0 "Chaque nation a ses propres atouts ; utilisons ces différences et spécialisons chaque membre du Benelux."
LUX_unified_command:0 "Établir un commandement unifié"
LUX_unified_command_desc:0 "La défense étant l’affaire de tous nos alliés, nous devons travailler ensemble dans ce domaine."
LUX_liberate_lowlands:0 "Libérer les Pays-Bas méridionaux"
LUX_liberate_lowlands_desc:0 "Nos efforts pour unifier les Pays-Bas méridionaux n’ont pas encore abouti. Nous devons achever cette unification."
LUX_expand_the_customs_union:0 "Étendre l’union douanière"
LUX_expand_the_customs_union_desc:0 "L’Union économique belgo-luxembourgeoise s’est révélée bénéfique à tous. Nous devrions établir un pacte similaire au sein du Benelux."
LUX_joint_economic_development:0 "Développement économique conjoint"
LUX_joint_economic_development_desc:0 "Nos industries unies sont puissantes, mais nous profitons rarement des industries des autres pays. La création d’un programme d’investissement conjoint pourrait y remédier."
LUX_united_and_ready:0 "Unis et prêts"
LUX_united_and_ready_desc:0 "Unis, nous sommes plus forts, unis, nous sommes prêts à tout !"
LUX_strike_the_german_threat:0 "Frapper la menace [GER.GetAdjectiveCap]"
LUX_strike_the_german_threat_desc:0 "[GER.GetNameDefCap] menace les Pays-Bas méridionaux depuis trop longtemps. Nous frapperons sans attendre et nous libérerons enfin de ce péril."
LUX_resisted_federalisation:0 "A résisté à la fédéralisation"
LUX_regional_development:0 "Développement régional"
LUX_regional_development_desc:0 "Notre économie commence à rencontrer ses premières limites. Il n’y a tout simplement pas assez de terres aménagées pour y bâtir des usines. Le développement de ces terres doit désormais devenir une priorité."
LUX_dreams_of_federation:0 "Rêves de fédération"
LUX_dreams_of_federation_desc:0 "Sortis d’une relative obscurité, nous avons aujourd’hui la possibilité d’accomplir quelque chose de véritablement spectaculaire : unifier les Pays-Bas méridionaux en un seul pays !"
LUX_merge_industries:0 "Fusionner les industries"
LUX_merge_industries_desc:0 "La nouvelle nation a été séparée trop longtemps ; nous devons réunifier son industrie pour n’être véritablement qu’un seul pays."
LUX_fortify_border_regions:0 "Fortifier les régions frontalières"
LUX_fortify_border_regions_desc:0 "Entourés de menaces potentielles, préparons-nous à une invasion, au cas où."
LUX_establish_free_university:0 "Éducation primaire gratuite"
LUX_establish_free_university_desc:0 "L’essor de notre économie nous permet désormais d’établir une éducation primaire gratuite pour tous."
LUX_agressive_stance:0 "Politique étrangère agressive"
LUX_agressive_stance_desc:0 "Bien que les principaux pays des Pays-Bas méridionaux soient unis, de nombreux habitants souhaitent encore rejoindre cette nation. Ils doivent eux aussi être réunis."
LUX_establish_european_claims:0 "Établir des revendications européennes"
LUX_establish_european_claims_desc:0 "Nous sommes une nation européenne, et beaucoup de nos compatriotes vivent encore sous la domination de puissances étrangères. Ils seront libérés et intégrés à ce nouvel État."
LUX_announce_colonial_claims:0 "Annoncer des revendications coloniales"
LUX_announce_colonial_claims_desc:0 "Les Pays-Bas et la Belgique sont longtemps restés dans l’ombre des grandes puissances. À présent que nous pouvons nous-mêmes prétendre à ce statut, nous pouvons étendre notre influence outre-mer."
LUX_greater_benelux:0 "La Grande Fédération du Benelux"
LUX_restore_neutrality:0 "Rétablir la neutralité"
LUX_restore_neutrality_desc:0 "Nous avons atteint notre objectif ; nous pouvons désormais revenir à un état de neutralité, en sachant que nous serons capables de nous défendre."
LUX_total_neutrality:0 "Établir une neutralité totale"
LUX_total_neutrality_desc:0 "Si nous voulons vraiment être neutres, nous ne devons pas reculer et déclarer une neutralité totale afin de ne pas être attaqués."
LUX_fair_economy:0 "Une économie équitable"
LUX_fair_economy_desc:0 "De nombreux citoyens marginalisés ont tranché lors de l’élection. Nous devons répondre à leurs attentes et rendre l’économie plus juste pour consolider notre base électorale et, surtout, faire ce qui est juste."
LUX_promote_small_businesses:0 "Soutenir les petites entreprises"
LUX_promote_small_businesses_desc:0 "Les grandes entreprises n’ont pas besoin de notre soutien. Concentrons-nous plutôt sur les petites, afin de les maintenir à flot."
LUX_expand_social_net:0 "Renforcer le filet social"
LUX_expand_social_net_desc:0 "Aider les plus démunis permet non seulement de ramener plus de monde dans l’économie, mais constitue aussi une politique populaire."
LUX_ensure_minimum_wage:0 "Garantir le salaire minimum"
LUX_ensure_minimum_wage_desc:0 "Le salaire minimum assure la stabilité des revenus, stimule la croissance économique et profite à tous."
LUX_legislative_reforms:0 "Réformes législatives"
LUX_legislative_reforms_desc:0 "Nous avons enfin l’occasion de modifier la constitution en faveur du prolétariat, afin qu’il puisse façonner l’avenir de [ROOT.GetNonIdeologyName]."
LUX_abolish_monarchy:0 "Abolir la monarchie"
LUX_abolish_monarchy_desc:0 "Les spectres du passé ont trop longtemps hanté ce pays. La monarchie a constitué un frein majeur à l’égalité véritable ; il est temps d’en finir."
LUX_erase_monarchist_legacy:0 "Effacer notre passé monarchiste"
LUX_erase_monarchist_legacy_desc:0 "Les monarchies ont toujours opprimé le prolétariat ; elles représentent tout ce que nous rejetons. Le moment est venu de détruire définitivement leur héritage."
LUX_grant_citizenship:0 "Accorder la citoyenneté aux royaux"
LUX_grant_citizenship_desc:0 "Bien qu’ils aient injustement régné sur le pays pendant des siècles, ils méritent une chance de s’intégrer dans la vision socialiste de notre nation."
LUX_socialist_volunteers:0 "Volontaires socialistes"
LUX_socialist_volunteers_desc:0 "Nous, socialistes, ne sommes pas seulement un mouvement national. Nos idées traversent les continents et toutes les classes. Ensemble, nous sommes inarrêtables."
LUX_lessons_from_spain:0 "Aider la cause espagnole"
LUX_lessons_from_spain_desc:0 "Nous avons combattu brillamment lors de la guerre civile espagnole. L’expérience acquise pourra nous aider à mieux nous défendre chez nous."
LUX_begin_collective_ownership_campaign_tt:0 "Dans §H2 ans§!, cet esprit national sera §Hamélioré§! en :"
LUX_find_new_trade_partners_tt:0 "Cet esprit national sera §Hretiré§! une fois que nous disposerons de §G15§! §Husines civiles§!."
LUX_find_new_trade_partners_autarky_tt:0 "Dans §H1 an§!, cet esprit national sera §Hremplacé§! par :"
LUX_oust_capitalists:0 "Écarter les capitalistes"
LUX_oust_capitalists_desc:0 "Le capitalisme opprime les travailleurs, renforce l’autocratie et crée des conflits de classes. Nous devons y mettre fin."
LUX_elevate_trade_unions:0 "Valoriser les syndicats"
LUX_elevate_trade_unions_desc:0 "Les syndicats de [ROOT.GetNameDef] se battent depuis longtemps pour les droits des travailleurs. Ils doivent être reconnus et récompensés pour leur contribution à la révolution."
LUX_begin_collective_ownership_campaign:0 "Commencer la collectivisation"
LUX_begin_collective_ownership_campaign_desc:0 "Comme l’a dit Marx lui-même : les moyens de production doivent être saisis par le prolétariat. Maintenant qu’il dirige le pays, il peut aussi gouverner l’économie."
LUX_struggle_for_equality:0 "La lutte pour l’égalité"
LUX_struggle_for_equality_desc:0 "Aucune victoire n’est facile, et il en va de même pour notre quête d’une véritable égalité. Nous devons nous battre fermement pour atteindre cet objectif."
LUX_find_new_trade_partners:0 "[GetCommunistTradePartnerFocusName]"
LUX_find_new_trade_partners_desc:0 "Afin de nous débarrasser une fois pour toutes de notre dépendance économique, nous devons trouver des moyens de produire nos propres matières premières ou négocier des accords commerciaux plus avantageux."
LUX_peoples_university:0 "Fonder l’université du peuple"
LUX_peoples_university_desc:0 "L’éducation a longtemps été un domaine dominé par la bourgeoisie. Nous y remédierons en créant une académie par et pour le peuple."
LUX_unite_the_country:0 "Unifier le pays"
LUX_unite_the_country_desc:0 "Grâce aux politiques menées ces dernières années, nous pouvons enfin dire que le pays est unifié. Le peuple est désormais uni par la révolution des travailleurs socialistes."
LUX_abandon_the_foolish_policy:0 "Abandonner cette politique insensée"
LUX_abandon_the_foolish_policy_desc:0 "La neutralité est totalement inadaptée dans un monde de conflits et de luttes de classes. Cette politique du passé ne ferait que freiner la prospérité de [ROOT.GetNameDef] et de son peuple."
LUX_european_revolution:0 "Pousser la révolution européenne"
LUX_european_revolution_desc:0 "Nous sommes le cœur de l’Europe ; nous devons désormais en devenir le cœur de la révolution européenne."
LUX_follow_moscow_line:0 "Suivre la ligne de Moscou"
LUX_follow_moscow_line_desc:0 "Le véritable socialisme ne peut être atteint qu’à travers la coopération avec l’Internationale. Nous devons nous aligner sur [SOV.capital.GetCapitalVictoryPointName] pour que le socialisme triomphe."
LUX_expand_conscription_tt:0 "Modifier soit §HArmée politisée§! soit §HArmée rouge [ROOT.GetAdjectiveCap]§! par\nPopulation mobilisable : §H+1.50 %§!"
LUX_revolutionise_army:0 "Révolutionner l’armée"
LUX_revolutionise_army_desc:0 "Pour assurer notre emprise sur l’armée, nous devons l’intégrer à notre idéologie."
LUX_incorporate_political_comissars:0 "Incorporer des commissaires politiques"
LUX_incorporate_political_comissars_desc:0 "En tant que partie intégrante de notre gouvernement, l’armée doit aussi être subordonnée au socialisme. Nous garantirons sa loyauté en nommant des commissaires politiques à des postes clés."
LUX_true_red_army:0 "Une véritable armée rouge"
LUX_true_red_army_desc:0 "La mission première de l’armée est de défendre le peuple, le socialisme et la révolution internationale."
LUX_expand_conscription:0 "Élargir la conscription"
LUX_expand_conscription_desc:0 "La révolution doit se défendre et a besoin de plus d’hommes. Il vaut la peine de conscrire une partie de la main-d’œuvre pour cet effort."
LUX_expand_benelux_trigger_tt:0 "Est l’§HUnion socialiste du Benelux§!"
LUX_found_secret_service:0 "Fonder notre service secret"
LUX_found_secret_service_desc:0 "Nous suivrons l’exemple de notre grand allié, [SOV.GetNameDef], et créerons notre propre police secrète afin d’assurer la réussite durable de la révolution."
LUX_expand_via_capabilities:0 "Renforcer les capacités du VIA"
LUX_expand_via_capabilities_desc:0 "Nous devons nous assurer que le VIA dispose des moyens suffisants pour neutraliser efficacement les menaces à la révolution internationale."
LUX_invade_benelux:0 "Envahir le Benelux"
LUX_invade_benelux_desc:0 "En tant que petit pays, nous ne pourrons pas nous défendre si nous ne nous étendons pas et ne formons pas une entité transnationale."
LUX_bring_revolution_south:0 "Porter la révolution au sud"
LUX_bring_revolution_south_desc:0 "Constituant une menace constante pour notre indépendance, [FRA.GetNameDef] sera désormais mis au pas et intégré à l’Internationale."
LUX_head_east:0 "Marcher vers l’est"
LUX_head_east_desc:0 "[GER.GetNameDefCap] sera libérée de son gouvernement oppressif afin que le peuple puisse enfin être libre."
LUX_expand_benelux:0 "Étendre notre union"
LUX_expand_benelux_desc:0 "Il est naturel qu’une nation née de la diversité puisse intégrer plus de territoires. Nous le ferons avec certains États conquis."
LUX_socialist_science:0 "Pionnier de la science socialiste"
LUX_socialist_science_desc:0 "La science sera désormais un nouveau levier pour faire progresser le peuple vers un brillant avenir socialiste. Le passé capitaliste doit être laissé derrière nous."
LUX_comintern_research_exchange:0 "Échanges de recherche du Komintern"
LUX_comintern_research_exchange_desc:0 "En tant qu’idéologie internationale, les communistes collaborent pour créer quelque chose de plus grand que chaque individu seul. C’est particulièrement utile pour les scientifiques."
LUX_adopt_soviet_policies:0 "Adopter les politiques [SOV.GetAdjectiveCap]"
LUX_adopt_soviet_policies_desc:0 "L’ancien président du parti a freiné l’alignement avec le Komintern et ses politiques. Cela va désormais changer sous la direction du nouveau président."
LUX_follow_destalinisation:0 "Suivre la déstalinisation"
LUX_follow_destalinisation_desc:0 "La nouvelle orientation est claire : annuler toutes les politiques staliniennes du passé. Ce changement de cap après la mort de Staline sera adopté ici, en [ROOT.GetNameDef]."
LUX_establish_personality_cult:0 "Établir un culte de la personnalité"
LUX_establish_personality_cult_desc:0 "Le grand dirigeant de [ROOT.GetNonIdeologyName] sera honoré pour ce qu’il a accompli pour cette grande nation."
LUX_increase_defense_production:0 "Augmenter la production de défense"
LUX_increase_defense_production_desc:0 "En tant que pays relativement sans défense, il est vital d’assurer notre survie par le biais d’infrastructures militaires."
LUX_bastion_of_antifascism:0 "Bastion de l’antifascisme"
LUX_bastion_of_antifascism_desc:0 "[ROOT.GetNameDefCap] a toujours été un creuset pour toutes sortes d’idéologies et d’activisme politique. Nous devons aller plus loin et appeler ouvertement des volontaires antifascistes à venir à [ROOT.GetNonIdeologyName] et aider nos forces armées."
LUX_lead_the_opposition:0 "Mener l’opposition"
LUX_lead_the_opposition_desc:0 "Ce qui nous manque en unité, nous le compensons par notre détermination ! L’opposition internationale à [SOV.capital.GetCapitalVictoryPointName] doit désormais s’unir pour renverser l’hégémonie [SOV.GetAdjectiveCap]."
LUX_destroy_stalinism:0 "Détruire le stalinisme"
LUX_destroy_stalinism_desc:0 "Staline est un fasciste et mérite d’être traité comme tel. Nous devons unir nos forces pour vaincre la menace que représente le stalinisme pour le mouvement socialiste international."
LUX_attack_alliance_francaise:0 "Attaquer l’Alliance Française"
LUX_attack_alliance_francaise_desc:0 "L’Alliance Française est un outil qui mine notre langue et nos racines [GER.GetAdjectiveCap]. Elle doit être stoppée."
LUX_raid_french_stores:0 "Piller les commerces français"
LUX_raid_french_stores_desc:0 "Ce pays est dirigé par des aristocrates soutenus par [FRA.GetNameDef]. Si nous détruisons leur base de pouvoir, les magasins et entreprises [FRA.GetAdjectiveCap], nous affaiblirons également le gouvernement déjà fragile."
LUX_rejuvenate_the_luxembourgish_identity:0 "Raviver l’identité nationale"
LUX_rejuvenate_the_luxembourgish_identity_desc:0 "Si [LUX.GetNameDef] doit être préservé et perdurer, nous devons raviver l’identité nationale [LUX.GetAdjective]. Sans une identité nationale [LUX.GetAdjective] claire, il n’y aurait pas de [LUX.GetNonIdeologyName] !"
LUX_rejuvenate_the_luxembourgish_identity_tt:0 "Modifie soit §HSentiments antifrançais§! soit §HSociétés pan-luxembourgeoises§! par\nStabilité : §G+5.00%§!\nSoutien quotidien à la démocratie : §R-0.02§!\n\n"
LUX_fully_counter_french_influence:0 "Contrer totalement l’influence [FRA.GetAdjectiveCap]"
LUX_fully_counter_french_influence_desc:0 "Pour préserver notre nation, les influences [FRA.GetAdjectiveCap] ne sont pas les bienvenues car elles sapent notre identité nationale. [LUX.GetNonIdeologyName] est [GER.GetAdjectiveCap] !"
LUX_integrate_french_organisations:0 "Intégrer les organisations [FRA.GetAdjectiveCap]"
LUX_integrate_french_organisations_desc:0 "Même si ces organisations sont un outil du [FRA.GetAdjectiveCap], ce pays doit reconnaître l’importance qu’a eue la langue [FRA.GetAdjectiveCap] dans notre histoire et notre culture."
LUX_found_lnp:0 "Fonder le LNP"
LUX_found_lnp_desc:0 "Pour obtenir un soutien politique et une reconnaissance, nous avons besoin d’une branche politique à notre mouvement. Fonder un parti nous aidera à atteindre ces objectifs."
LUX_request_german_funding:0 "Demander un financement [GER.GetAdjectiveCap]"
LUX_request_german_funding_desc:0 "Puisque nous serons bientôt une partie de [GER.GetNameDef], nous pouvons accélérer ce processus en obtenant des fonds pour faciliter une unification plus rapide."
LUX_utilise_lvj:0 "Soutenir le LVJ"
LUX_utilise_lvj_desc:0 "Le Luxemburger Volksjugend, ou simplement Volksjugend, est un club de la prochaine génération de bons enfants [GER.GetAdjectiveCap], prêts à se lever pour leur peuple. Ils ont déjà eu de grands succès, raison de plus pour les soutenir."
LUX_utilise_dennemeyer:0 "Utiliser Dennemeyer"
LUX_utilise_dennemeyer_desc:0 "Camille Dennemeyer est un génie de la propagande. Il peut rallier les masses et les mettre au pas. Son expertise est vitale pour unir le pays sous le drapeau [GER.GetAdjectiveCap]."
LUX_subvert_armed_forces:0 "Subvertir les forces armées"
LUX_subvert_armed_forces_desc:0 "Tout gouvernement a besoin du soutien de l’armée. Le nôtre aussi, nous devons donc les rallier dès maintenant pour ne pas perdre le contrôle plus tard."
LUX_organise_street_rallies:0 "Organiser des rassemblements de rue"
LUX_organise_street_rallies_desc:0 "Dans une démocratie, les manifestations et rassemblements ont une grande influence. Nous pouvons exploiter cela et rallier le peuple sous le drapeau du peuple [GER.GetAdjectiveCap]."
LUX_replace_the_government:0 "Remplacer le gouvernement faible"
LUX_replace_the_government_desc:0 "L’ancien gouvernement est faible et n’a fait que poursuivre ses propres objectifs, laissant le peuple de côté et dépourvu d’identité. Cela doit changer maintenant !"
LUX_politicise_army_tt:0 "Deux généraux aléatoires obtiennent :\n§H   Lié politiquement§!\n - Gain d’expérience du dirigeant : §R-10.0%§!\n - Coût de promotion : §G-50.0%§!"
LUX_kratzenbergs_luxemburg:0 "Le Luxembourg de Kratzenberg"
LUX_kratzenbergs_luxemburg_desc:0 "Damian Kratzenberg a conduit le peuple de [ROOT.GetNameDef] dans une nouvelle ère, une ère de germanité. Il est le candidat idéal pour assurer la continuité de la direction de [ROOT.GetNameDef]."
LUX_complete_integration:0 "Intégration complète"
LUX_complete_integration_desc:0 "Même si nous avons une histoire d’indépendance, l’avenir de [ROOT.GetNameDef] se trouve dans [GER.GetNameDef]. Nous devons être intégrés dès que possible pour nous rapprocher de l’unification et de la domination totale [GER.GetAdjectiveCap]."
LUX_expand_the_gau:0 "Élargir le Gau"
LUX_expand_the_gau_desc:0 "Notre place légitime est au sein de [GER.GetNameDef], pourtant nous restons quelque peu autonomes. Nous pouvons nous unir avec d’autres [GER.GetAdjectiveCap] à l’ouest du Rhin pour obtenir une base industrielle plus large."
LUX_request_further_expansion:0 "Demander une expansion supplémentaire"
LUX_request_further_expansion_desc:0 "En tant que Gau Moselland, nous pouvons exercer un grand contrôle sur la région, et devenir encore plus influents en demandant le contrôle du nord du Rhin."
LUX_annex_conquered_lands:0 "Annexer les terres conquises"
LUX_annex_conquered_lands_desc:0 "La guerre se déroule bien, en tant qu’entité voisine, il est de notre responsabilité de nous unir aux [GER.GetAdjectiveCap] à l’ouest."
LUX_industrialise_west_rhine:0 "Industrialiser la rive ouest du Rhin"
LUX_industrialise_west_rhine_desc:0 "Les forêts à l’ouest du Rhin ont laissé de nombreuses terres inexploitées. Nous pouvons y remédier et développer notre industrie et notre production d’armes en utilisant ces espaces."
LUX_german_intellect:0 "Exploiter l’intellect allemand"
LUX_german_intellect_desc:0 "Nous, [GER.GetAdjective], sommes à l’apogée de l’intellect, nos scientifiques peuvent accomplir ce dont les autres ne peuvent que rêver. Il est temps de l’exploiter et d’étendre nos laboratoires de recherche."
LUX_aid_the_warmachine:0 "Soutenir la machine de guerre"
LUX_aid_the_warmachine_desc:0 "La guerre faisant rage, nous devons nous tourner vers la production militaire. En contribuant à la défense de la patrie et à l’expansion de [GER.GetNonIdeologyName], le Führer sera des plus satisfaits."
LUX_establish_ss:0 "Établir la SS"
LUX_establish_ss_desc:0 "La SS est une partie clé de l’appareil d’État en [GER.GetNameDef]. Leur influence doit s’étendre à [ROOT.GetNameDef] afin que nos ennemis soient éradiqués."
LUX_professionalise_army:0 "Professionnaliser l’armée"
LUX_professionalise_army_desc:0 "La Prusse est synonyme de professionnalisme. Notre histoire est façonnée par de grands soldats combattant pour leur patrie. Cet héritage doit être honoré et poursuivi."
LUX_politicise_army:0 "Politiser l’armée"
LUX_politicise_army_desc:0 "Nous, nationaux-socialistes, devons considérer l’armée comme une extension de l’État et non comme une entité distincte."
LUX_maneuver_warfare:0 "Guerre de mouvement"
LUX_maneuver_warfare_desc:0 "L’avenir de la guerre réside dans la vitesse et le blindage. Pour obtenir la victoire, ces aspects de notre armée doivent être renforcés."
LUX_unbeaten_in_battle:0 "Invaincus au combat"
LUX_unbeaten_in_battle_desc:0 "Nous, [GER.GetAdjectiveCap], n’avons jamais perdu une bataille. Cette tradition sera maintenue pour que nous atteignions la victoire ultime."
LUX_arrest_dennemeyer:0 "Arrêter Dennemeyer"
LUX_arrest_dennemeyer_desc:0 "Bien qu’il soit un partisan du national-socialisme, il a une grande popularité et est donc dangereux : il doit être éliminé."
LUX_kratzenbergs_luxemburg_tt:0 "§RNous empêche de relever l’autonomie au-delà du niveau§! §HReichsprotectorate§!§R.§!"
LUX_invalidate_election_unfinished_tt:0 "§RCette partie de l’arbre des priorités est inachevée et donc actuellement inaccessible. Elle sera ajoutée dans une mise à jour ultérieure.§!"

