### Idées

 POR_civil_war_surrender_debuff:0 "Métropole divisée"
 POR_civil_war_surrender_debuff_desc:0 "Nous ne pouvons pas compter excessivement sur l’Outre-mer dans cette guerre. Le Portugal sera l’endroit où tout se jouera."

