### Événement : adhésion aux Alliés
portugal.30.t:0 "Le Portugal demande à rejoindre les Alliés"
portugal.30.d:0 "Aujourd’hui, lors d’une visite de leur ambassadeur, [FROM.GetNameDefCap] a officiellement demandé à rejoindre les Alliés. Les [POR.GetAdjective] étant parmi les plus fidèles alliés de l’Angleterre, que devons-nous répondre à nos vieux amis ?"
portugal.30.a:0 "Tous ceux qui peuvent contribuer sont les bienvenus dans notre faction"
portugal.30.b:0 "Nous étions mieux avec leur neutralité."
portugal.32.t:0 "La Grande-Bretagne accepte notre demande"
portugal.32.d:0 "Notre demande d’adhésion aux Alliés a officiellement été acceptée par la Grande-Bretagne. Nos vieux amis combattront à nouveau à nos côtés dans les conflits à venir !"
portugal.32.o:0 "L’alliance anglo-portugaise reste solide !"
portugal.31.t:0 "La Grande-Bretagne rejette notre adhésion"
portugal.31.d:0 "Notre demande d’adhésion aux Alliés a officiellement été rejetée par les Britanniques. Étant pourtant parmi nos plus anciens amis, nous devons nous demander pourquoi ils ne veulent pas de notre soutien."
portugal.31.o:0 "Ils devraient se sentir chanceux de nous avoir."
news.704.t:0 "[POR.GetNameDefCap] rejoint les Alliés"
news.704.d:0 "L’influence des Alliés s’est accrue aujourd’hui avec l’adhésion officielle du Portugal. Seul l’avenir dira ce que cela signifie pour les affaires mondiales."
news.704.o:0 "Le Portugal et la Grande-Bretagne alliés ? Rien de nouveau."
news.705.t:0 "Les Alliés rejettent l’adhésion du [POR.GetAdjective]"
news.705.d:0 "Il nous est parvenu que le Portugal a demandé à rejoindre les Alliés, demande étonnamment rejetée par leur vieil allié britannique. Les Britanniques ont déclaré que ce refus était dû à des raisons stratégiques, qualifiant cela « d’erreur » au vu de la situation actuelle."
news.705.o:0 "Après tout ce temps ?"


### Événement : adhésion à l’Axe
portugal.10.t:0 "Le Portugal veut rejoindre l’Axe"
portugal.10.d:0 "Nous venons de recevoir la visite du ministre portugais des Affaires étrangères, qui nous a exprimé leur désir de rejoindre notre glorieuse alliance."
portugal.10.a:0 "Tous ceux qui peuvent contribuer sont les bienvenus dans notre faction."
portugal.10.b:0 "Ils sont seuls."
portugal.12.t:0 "L’Allemagne accepte la demande d’adhésion à l’Axe"
portugal.12.d:0 "Notre demande d’adhésion à l’Axe a été acceptée ! Ce jour sera longtemps mémorable pour le Portugal. Dans le conflit à venir, nous serons heureux d’avoir ces nouveaux amis à nos côtés."
portugal.12.o:0 "Ensemble, nous sommes forts."
portugal.11.t:0 "L’Allemagne rejette la demande portugaise"
portugal.11.d:0 "Nos diplomates n’ont pas réussi à convaincre l’Allemagne d’accepter le Portugal au sein de l’Axe. Dommage, qui sait ce qui aurait pu se passer ?"
portugal.11.o:0 "Alors, l’Axe ne bénéficiera pas de notre soutien."
news.706.t:0 "L’Axe s’agrandit"
news.706.d:0 "L’influence de l’Axe s’est accrue aujourd’hui avec l’adhésion du Portugal. Les conséquences à long terme pour la stabilité géopolitique restent encore incertaines."
news.706.o:0 "Qui l’aurait cru ?"
news.707.t:0 "L’Allemagne rejette la demande portugaise"
news.707.d:0 "Il nous est parvenu que le Portugal voulait rejoindre l’Axe. Cependant, l’Allemagne a rejeté cette demande, déclarant que ce ne serait pas une décision judicieuse pour l’une ou l’autre des parties dans la situation actuelle."
news.707.o:0 "C’était peut-être mieux ainsi."

