l_french:
 r56_portuguese_focus:0 "Arbre des priorités portugaises"
 portuguese_focus:0 "Arbre national portugais (vanilla)"
 POR_become_portugal:0 "Redevenir le Portugal"
 POR_luso_imperial_and_royal_armies:0 "Les Forces armées royales et impériales"
 POR_luso_imperial_and_royal_armies_desc:0 "Nos forces sont séparées par un océan, mais cela ne signifie pas que nous ne pouvons pas apprendre les unes des autres. Nos différences font notre force, tout comme notre attachement à nos racines portugaises."
 POR_luso_monarchist_military_cooperation:0 "Les Armées royales et impériales"
 POR_luso_monarchist_military_cooperation_desc:0 "Nos forces sont séparées par un océan, mais cela ne signifie pas que nous ne pouvons pas apprendre les unes des autres. Nos différences font notre force, tout comme notre attachement à nos racines portugaises."
 POR_luso_monarchist_cooperation:0 "Coopération luso-monarchiste"
 POR_luso_monarchist_cooperation_desc:0 "Notre alliance doit être cimentée et célébrée de chaque côté de l’océan."
 POR_remember_olivenca:0 "Venger Olivença"
 POR_remember_olivenca_desc:0 "Depuis deux siècles, l’Espagne nous refuse la souveraineté sur Olivença. Peu importe le nombre de traités signés pour mettre fin à cette injustice, nos terres légitimes nous sont sans cesse refusées. Désormais, nous les reprendrons selon nos propres termes et, pour leur entêtement infondé, nous irons plus loin et récupérerons la Galice ainsi que nos terres du Maroc !"
 POR_desenvolver_o_interior:0 "Développer l’intérieur du pays"
 POR_desenvolver_o_interior_desc:0 "Le gouvernement portugais veillera à ce que l’industrie reçoive le soutien nécessaire en matière d’infrastructures sur l’ensemble du pays."
 POR_construir_fabricas:0 "Construire des usines I"
 POR_construir_fabricas_desc:0 "Le gouvernement portugais a promis d’augmenter la production au Portugal. Il est temps de tenir cette promesse."
 POR_construir_fabricas_2:0 "Construire des usines militaires I"
 POR_construir_fabricas_2_desc:0 "Si le Portugal veut redevenir une grande puissance, il doit accroître sa production d’armement. Ainsi soit-il."
 POR_acores:0 "Développer les Açores"
 POR_acores_desc:0 "Les Açores sont un groupe d’îles stratégiques de l’Atlantique. Nous devons les développer si nous voulons contrôler l’océan."
 POR_acores_fort:0 "Fortifier les Açores"
 POR_acores_fort_desc:0 "Les Açores sont un groupe d’îles stratégiques de l’Atlantique. Nous devons les fortifier si nous voulons contrôler l’océan."
 POR_madeira:0 "Développer Madère"
 POR_madeira_desc:0 "Madère n’est peut-être pas aussi stratégique que les Açores, mais elle doit également être développée. Elle servira de base de soutien dans l’Atlantique."
 POR_extra_tech_slot:0 "Emplacement de recherche supplémentaire I"
 POR_extra_tech_slot_desc:0 "La recherche est cruciale et ne doit pas être négligée. Cela nous permettra d’atteindre des niveaux technologiques inédits."
 POR_extra_tech_slot2:0 "Emplacement de recherche supplémentaire II"
 POR_extra_tech_slot2_desc:0 "La recherche est cruciale et ne doit pas être négligée. Cela nous permettra d’atteindre des niveaux technologiques inédits."
 POR_minas_de_ferro:0 "Mines de fer d’Aljustrel"
 POR_minas_de_ferro_desc:0 "Les mines de fer d’Aljustrel furent un site minier important durant la Seconde Guerre mondiale. Elles furent ouvertes en 1847 après la découverte d’un gisement de fer."
 POR_minas_de_cromio:0 "Mines de chrome de Grândola"
 POR_minas_de_cromio_desc:0 "Les mines de chrome de Grândola furent un site minier important durant la Seconde Guerre mondiale. Elles furent ouvertes en 1900 après la découverte d’un gisement de chrome."
 POR_prospect_for_oil:0 "L’Outre-mer"
 POR_prospect_for_oil_desc:0 "Nous devons étendre notre politique de développement aux colonies. L’« Ultramar » était le terme désignant les colonies portugaises lorsque la guerre éclata en Angola en 1961. Ce conflit prit fin avec la révolution de 1974."
 POR_angola_refineries:0 "Construire des raffineries en Angola"
 POR_angola_refineries_desc:0 "Pour garantir de nouvelles ressources à notre Empire, nous devons construire des raffineries, en commençant par l’Angola."
 POR_timor:0 "Développer le Timor oriental"
 POR_timor_desc:0 "Le Timor est un bastion en Océanie. Il serait judicieux de le développer afin de renforcer notre présence militaire dans la région."
 POR_angola_fabricas:0 "Usines militaires en Angola"
 POR_angola_fabricas_desc:0 "Il est recommandé de renforcer davantage notre bastion africain. La construction d’usines militaires augmentera nos capacités."
 POR_timor_2:0 "Caoutchouc au Timor oriental"
 POR_timor_2_desc:0 "Nous avons découvert une petite source de caoutchouc au Timor oriental. Nous devrions construire une installation pour l’exploiter."
 POR_army_primacy:0 "L’Armée portugaise"
 POR_army_primacy_desc:0 "Une armée forte fait une nation redoutable. Nous devons développer notre armée tant sur le plan technologique que dans la production d’équipement."
 POR_modernized_artillery:0 "Armes de soutien"
 POR_modernized_artillery_desc:0 "L’amélioration de notre artillerie et de nos équipements antichars est vitale pour notre armée."
 POR_modernized_army:0 "Nouvelles tactiques militaires"
 POR_modernized_army_desc:0 "L’accent doit être mis sur les doctrines terrestres ainsi que sur les compagnies de reconnaissance."
 POR_special_forces:0 "Forces spéciales"
 POR_special_forces_desc:0 "Nous avons besoin de troupes d’élite : les troupes de montagne et les parachutistes doivent être notre priorité."
 POR_armored_effort:0 "Effort blindé"
 POR_armored_effort_desc:0 "En appliquant ce que nous avons appris en mécanisant notre infanterie, nous pouvons également améliorer nos véhicules blindés."
 POR_mare_nostrum:0 "Héros de la mer"
 POR_mare_nostrum_desc:0 "Par le passé, nous avons forgé un puissant empire grâce à la conquête du Nouveau Monde. Aujourd’hui, nous nous relèverons."
 POR_carrier_effort:0 "Effort sur les porte-avions"
 POR_carrier_effort_desc:0 "Les flottes modernes seront centrées sur les porte-avions, et non les cuirassés. La suprématie aérienne en mer a déjà été démontrée par les Américains en 1921 !"
 POR_capital_ships:0 "Effort sur les navires capitaux"
 POR_capital_ships_desc:0 "La nation qui possède le plus de cuirassés dominera les océans. Nous ne devons pas permettre à la Royal Navy de nous surpasser en Méditerranée…"
 POR_bomber_effort:0 "Effort sur les bombardiers"
 POR_bomber_effort_desc:0 "L’époque où une armée pouvait gagner une guerre sans dominer le ciel est révolue. Nous devons développer nos bombardiers tactiques pour appuyer nos soldats."
 POR_atlantic_fleet:0 "La flotte atlantique"
 POR_atlantic_fleet_desc:0 "Une fois libérés de la cage britannique, nous devrons projeter notre puissance à travers les océans. Cela doit être notre priorité."
 POR_marines_and_landing_craft:0 "Marines et péniches de débarquement"
 POR_marines_and_landing_craft_desc:0 "Les guerres ne se gagnent pas uniquement grâce à la puissance navale ; nous devons aussi pouvoir transporter nos armées par mer et les débarquer en sécurité."
 POR_jet_engine_effort:0 "Effort sur les moteurs à réaction"
 POR_jet_engine_effort_desc:0 "Le Portugal devrait être à l’avant-garde du développement des moteurs à réaction grâce aux brillants travaux de Secondo Campini. Nous devons lui fournir toutes les ressources nécessaires pour perfectionner ses conceptions."
 POR_light_ship_effort:0 "Effort sur les navires légers"
 POR_light_ship_effort_desc:0 "Les convois vers nos territoires d’outre-mer doivent être protégés. Nous devons développer de nouvelles doctrines ainsi que des destroyers modernes."
 POR_escort_effort:0 "Effort d’escorte"
 POR_escort_effort_desc:0 "Nous devons accentuer nos efforts pour protéger nos convois vulnérables dans l’Atlantique."
 POR_sea_wolves:0 "Loups de mer"
 POR_sea_wolves_desc:0 "Nos alliés allemands ont mis au point des sous-marins terriblement efficaces et des doctrines de « meute de loups ». Nous devrions nous en inspirer."
 POR_air_innovation:0 "Innovations aériennes"
 POR_air_innovation_desc:0 "Les guerres modernes ne peuvent être gagnées sans dominer le ciel. Nous devons tout faire pour développer notre force aérienne !"
 POR_air_innovation_2:0 "Innovations aériennes II"
 POR_air_innovation_2_desc:0 "Tout avantage aérien est précieux. Nous devons concentrer nos efforts sur le développement de nos chasseurs."
 POR_naval_air_effort:0 "Aviation navale"
 POR_naval_air_effort_desc:0 "Les Américains ont démontré l’efficacité des frappes aériennes contre les cibles navales dès 1921. Nous ne devons pas négliger cette branche de l’aviation si nous voulons affronter une puissance navale."
 POR_submarine_effort:0 "Effort sur les sous-marins"
 POR_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus marquant depuis l’invention des torpilleurs. Nous devons nous protéger des sous-marins et les utiliser contre le commerce ennemi."

 POR_salazar:0 "Jeux politiques"
 POR_salazar_desc:0 "Le Portugal est toujours une scène de luttes de pouvoir. Profitons-en pour renforcer notre influence."
 POR_collectivist_ethos:0 "Le Portugal d’abord"
 POR_collectivist_ethos_desc:0 "Nos ennemis peuvent diviser et conquérir les nations faibles, mais notre peuple restera uni : tous pour un, un pour tous."
 POR_liberty_ethos:0 "Souvenirs de la Première République"
 POR_liberty_ethos_desc:0 "Malgré son instabilité, la Première République fut aussi la première expérience de démocratie républicaine pour le Portugal. Il est temps que la dictature de Salazar tombe et que, des cendres de l’Estado Novo, renaisse une démocratie corrigeant les erreurs du passé."
 POR_militarism:0 "Militarisme catholique"
 POR_militarism_desc:0 "L’identité catholique est l’un des concepts centraux du Mouvement national-syndicaliste. La nécessité de défendre l’Église par les armes renforcera l’activité militaire au Portugal."
 POR_political_correctness:0 "Rectitude politique"
 POR_political_correctness_desc:0 "Les personnes tenant des opinions légèrement controversées ou embarrassantes semblent préoccupées par un vaste complot dirigé contre elles. Cela semble être une excellente idée."
 POR_neutrality_focus:0 "Neutralité internationale"
 POR_neutrality_focus_desc:0 "Tandis que d’autres prétendront qu’il faut du courage et de la sagesse pour choisir un camp dans un conflit mondial, nous savons qu’il en faut encore plus pour refuser."
 POR_interventionism_focus:0 "Interventionnisme"
 POR_interventionism_focus_desc:0 "Nous défendons la liberté de tous les peuples, pas seulement de nos citoyens. Si empêcher la tyrannie signifie la guerre, alors qu’il en soit ainsi."
 POR_military_youth:0 "Jeunesse salazariste"
 POR_military_youth_desc:0 "Des organisations visant à promouvoir la discipline et l’éducation politique de la jeunesse renforceront la loyauté et l’esprit de sacrifice dès le plus jeune âge."
 POR_deterrence:0 "Ministère de la Défense"
 POR_deterrence_desc:0 "Isolés, nous ne tirons que rarement profit de la guerre. Heureusement, nous savons que la meilleure défense est celle que l’on n’a jamais besoin d’utiliser."
 POR_volunteer_corps:0 "Corps de volontaires"
 POR_volunteer_corps_desc:0 "Forcer notre peuple à mourir pour les idéaux de liberté serait un exercice d’ironie, mais donner les moyens à ceux qui souhaitent aider les peuples étrangers ne l’est pas."
 POR_paramilitarism:0 "Camisas Azuis"
 POR_paramilitarism_desc:0 "Les « Camisas Azuis », ou « Chemises bleues », sont la branche paramilitaire du Mouvement national-syndicaliste. Développer cette organisation permettrait d’imposer la domination du mouvement et d’ancrer le militarisme dans l’esprit portugais."
 POR_indoctrination_focus:0 "Endoctrinement"
 POR_indoctrination_focus_desc:0 "Puisque notre idéologie est fondée sur la vérité, elle doit être enseignée comme telle. L’éducation et les médias doivent en témoigner."
 POR_foreign_expeditions:0 "Expéditions à l’étranger"
 POR_foreign_expeditions_desc:0 "Puisque nos ennemis se préparent à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."
 POR_why_we_fight:0 "Pourquoi nous combattons"
 POR_why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple doit voir les atrocités commises par ceux qui convoitent le pouvoir. Nous rallierons la nation à notre cause et veillerons à ce que chacun soit prêt à se battre pour notre liberté."
 POR_political_commissars:0 "Commissaires politiques"
 POR_political_commissars_desc:0 "Pour garantir que nos politiques soient appliquées dans la pratique militaire, nous introduirons des responsables politiques nommés au sein des rangs militaires."
 POR_internationalism_focus:0 "Montée du PCP"
 POR_internationalism_focus_desc:0 "Interdit depuis le coup d'État de 1926, le Parti communiste portugais a dû se réorganiser en cellules clandestines sous l’égide de Bento Gonçalves, son secrétaire général depuis 1929. Nous devons profiter de la grande désunion des opposants à l’Estado Novo pour les unir derrière les principes du marxisme-léninisme, afin de libérer le Portugal de l’oppression capitaliste de Salazar."
 por_nationalism_focus2:0 "Soutenir le MNS"
 por_nationalism_focus2_desc:0 "Le Mouvement national-syndicaliste promeut la création d’un État totalitaire et corporatiste au Portugal, en opposition tant au capitalisme qu’au communisme. Inspiré principalement par le fascisme italien et la Phalange espagnole, le mouvement a tenté un coup d’État en 1935, sans succès. Mais avec un soutien populaire plus large, une seconde tentative pourrait réussir."
 POR_nationalism_focus:0 "Renforcer l’Estado Novo"
 POR_nationalism_focus_desc:0 "Le régime d’António de Oliveira Salazar, appelé « Estado Novo », a été largement positif pour le Portugal, ayant mis fin à l’instabilité de la Première République et restauré la confiance de la population, en particulier des milieux religieux."
 POR_ideological_fanaticism:0 "Fanatisme idéologique"
 POR_ideological_fanaticism_desc:0 "Nos valeurs et objectifs politiques établis valent autant la peine de mourir que n’importe quelle foi ancienne. Tout partisan doit être prêt à affronter la mort, et ceux qui s’en écartent doivent s’y préparer aussi."
 POR_technology_sharing:0 "Partage de technologie"
 POR_technology_sharing_desc:0 "En partageant nos avancées technologiques avec nos alliés, toute notre faction mènera la recherche et développement en temps de guerre de manière plus efficace."
 POR_deus_patria_familia:0 "Dieu, Patrie et Famille"
 POR_deus_patria_familia_desc:0 "Nos valeurs et objectifs politiques établis valent autant la peine de mourir que n’importe quelle foi ancienne. Tout partisan doit être prêt à affronter la mort, et ceux qui s’en écartent doivent s’y préparer aussi."
 POR_policia_estado:0 "PVDE"
 POR_policia_estado_desc:0 "La PVDE, ou plus tard Police internationale et de défense de l’État (Polícia Internacional e de Defesa do Estado), était une agence de sécurité portugaise sous le régime de l’Estado Novo de Salazar. Officiellement, son rôle principal était le contrôle des frontières, de l’immigration et de l’émigration ainsi que la sécurité interne et externe de l’État. Cependant, elle devint surtout connue pour ses activités de police politique."
 POR_befriend_spain:0 "Le traité de Lisbonne"
 POR_befriend_spain_desc:0 "Plutôt que de nous aligner sur les grandes puissances, nous devrions chercher à forger une alliance avec nos voisins espagnols, nous permettant de défendre uniquement les intérêts ibériques tout en sécurisant notre frontière terrestre."
 POR_demand_ceuta:0 "Revendiquer Ceuta à l’Espagne"
 POR_demand_ceuta_desc:0 "Ceuta était un territoire portugais en 1415. Nous l’avons perdu au profit de l’Espagne lorsque notre roi Philippe II a trahi le véritable souverain de Ceuta. Nous devons la réclamer à nouveau."
 POR_demand_rhodesia:0 "Revendiquer la Rhodésie au Royaume-Uni"
 POR_demand_rhodesia_desc:0 "La Rhodésie était un territoire portugais au siècle dernier. Nous l’avons perdue lorsque notre faible roi D. Carlos Ier a cédé sous le chantage espagnol. Nous devons la réclamer à nouveau."
 POR_demand_ceylon:0 "Revendiquer Ceylan au Royaume-Uni"
 POR_demand_ceylon_desc:0 "Ceylan était un territoire portugais au siècle dernier. Nous l’avons perdue lorsque notre faible roi D. Carlos Ier a cédé sous le chantage espagnol. Nous devons la réclamer à nouveau."
 POR_ceuta:0 "Développer Ceuta"
 POR_ceuta_desc:0 "Ceuta est un bastion stratégique en Afrique du Nord. Nous devons la sécuriser et la développer si nous voulons contrôler l’Afrique."
 POR_rhodesia:0 "Développer la Rhodésie"
 POR_rhodesia_desc:0 "La Rhodésie est un bastion stratégique en Afrique. Nous devons la sécuriser et la développer si nous voulons contrôler l’Afrique."
 POR_ceylon:0 "Développer Ceylan"
 POR_ceylon_desc:0 "Ceylan est un bastion stratégique en Afrique. Nous devons la sécuriser et la développer si nous voulons contrôler l’Afrique."
 POR_brazil:0 "Annexer le Brésil"
 POR_brazil_desc:0 "Les Brésiliens sont nos frères. Nous partageons la même langue et une histoire commune. Il est temps d’être unis en une seule nation pour le bien de notre peuple."
 POR_join_allies:0 "Alliance anglo-portugaise"
 POR_join_allies_desc:0 "Alors que la situation politique en Europe se détériore et que l’ombre de la guerre se rapproche, il serait judicieux de conclure une alliance avec la Grande-Bretagne pour nous protéger."
 POR_join_allies2:0 "Alliance anglo-portugaise"
 POR_join_allies2_desc:0 "Alors que la situation politique en Europe se détériore et que l’ombre de la guerre se rapproche, il serait judicieux de conclure une alliance avec la Grande-Bretagne pour nous protéger."
 POR_join_axis:0 "Rejoindre l’Axe"
 POR_join_axis_desc:0 "L’ordre européen change et les nations jadis vaincues deviennent de plus en plus menaçantes. Il est dans notre intérêt de rejoindre l’Allemagne afin de garantir au Portugal une place dans la nouvelle Europe."
 POR_join_comintern:0 "Rejoindre le Komintern"
 POR_join_comintern_desc:0 "Pour garantir la survie du nouveau régime communiste, nous devons nous allier à l’Union soviétique, dont l’efficacité militaire n’est plus à prouver."
 POR_nationalist_spain:0 "Revendiquer Ceuta à l’Espagne"
 POR_nationalist_spain_desc:0 "Ceuta était un territoire portugais en 1415. Nous l’avons perdu au profit de l’Espagne lorsque notre roi Philippe II a trahi le véritable souverain de Ceuta. Nous devons la réclamer à nouveau."
 POR_nationalist_spain2:0 "Revendiquer Ceuta à l’Espagne"
 POR_nationalist_spain2_desc:0 "Ceuta était un territoire portugais en 1415. Nous l’avons perdu au profit de l’Espagne lorsque notre roi Philippe II a trahi le véritable souverain de Ceuta. Nous devons la réclamer à nouveau."
 POR_call_of_arms:0 "Appel aux armes"
 POR_call_of_arms_desc:0 "Le Portugal fut et restera une puissance respectée dans le monde. Accomplissons notre destin !"
 POR_befriend_brazil:0 "Le traité de Rio de Janeiro"
 POR_befriend_brazil_desc:0 "Nos relations avec le Brésil ont toujours été bonnes. Il serait dans notre intérêt de les inviter à rejoindre notre alliance."

 POR_progress_cult:0 "Culte du progrès"
 POR_progress_cult_desc:0 "Nous devrions célébrer les innovations de nos brillants scientifiques portugais et encourager la bonne forme de pensée libre. L’URSS sera toujours en avance sur l’Occident décadent en matière de nouveaux domaines scientifiques audacieux ; il suffit de regarder le brillant travail du camarade Manuel !"
 POR_socialist_science:0 "Science socialiste"
 POR_socialist_science_desc:0 "Le monde, comme l’esprit, est en perpétuel mouvement. La nature est en constante progression, en révolution même. Les principes du matérialisme dialectique peuvent s’appliquer aux sciences naturelles autant qu’aux sciences sociales…"
 POR_transpolar_flights:0 "Culte de l’aviation"
 POR_transpolar_flights_desc:0 "Le Portugal impressionnera le monde par des exploits aériens extraordinaires. Nos pilotes héroïques sont les chevaliers du Portugal chevauchant leurs destriers ailés."
 POR_women_pilots:0 "Femmes dans l’aviation"
 POR_women_pilots_desc:0 "La camarade Maria, notre héroïque aviatrice de longue distance, devrait être autorisée à former des régiments aériens exclusivement féminins par le biais de son programme Aviation Groupe 69."
 POR_socialist_realism:0 "Réalisme socialiste"
 POR_socialist_realism_desc:0 "Toutes les œuvres d’art au Portugal doivent viser à éduquer le peuple sur les objectifs et le sens du communisme, en représentant le prolétariat dans des scènes réalistes et typiques de la vie quotidienne. Les artistes portugais sont les ingénieurs des âmes !"

 POR_naval_aviation:0 "Aviation navale"
 POR_naval_aviation_desc:0 "Les flottes modernes seront centrées sur les porte-avions, et non les cuirassés. La suprématie aérienne en mer a déjà été démontrée par les Américains en 1921 !"
 POR_silent_service:0 "Service silencieux"
 POR_silent_service_desc:0 "La guerre sous-marine est le développement naval le plus marquant depuis l’invention du torpilleur. Nous devons nous protéger des sous-marins et les utiliser contre le commerce ennemi."

 POR_elastic_defense:0 "Défense élastique"


