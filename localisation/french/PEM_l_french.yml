### Événement : rapprochement avec l’Espagne
news.710.t:0 "Mission diplomatique portugaise en [SPR.GetName]"
news.710.d:0 "Plutôt que d’affronter [SPR.GetName] au sujet des populations italiennes sur la côte dalmate, [From.GetName] a annoncé l’établissement d’une mission diplomatique permanente auprès de [YUG.GetName]. Selon une déclaration du ministère des Affaires étrangères [From.GetAdjective], les deux pays ont tellement d’histoire commune et d’intérêts partagés que la compréhension mutuelle est bien plus importante qu’un simple différend frontalier.\n\nAvec les tensions qui montent en Europe, on ne peut qu’espérer que d’autres pays suivent cet exemple."
news.710.a:0 "Nos nations unies comme amies."
news.710.b:0 "Il y aura la paix en Ibérie."
news.710.c:0 "Voyons où cela nous mènera."

portugal.t1.t:0 "Revendi­cations territoriales [POR.getAdjective]."
