### Événement sur Ceuta
 portugal.1.t:0 "Le Portugal revendique Ceuta"
 portugal.1.d:0 "Le Portugal propose que nous signions un traité avec lui, qui lui donnerait Ceuta ! Ils affirment en être les véritables propriétaires. Que devons-nous faire ?"
 portugal.1.a:0 "Accepter l’inévitable…"
 portugal.1.b:0 "Ils devront prendre nos terres par la force !"
 portugal.3.t:0 "L’Espagne cède Ceuta"
 portugal.3.d:0 "Nous avons réussi à convaincre l’Espagne de notre cause légitime sur Ceuta. Elle a accepté de céder Ceuta à l’administration portugaise. Si nous jouons bien nos cartes, nous pourrions utiliser cela pour accroître notre influence sur le continent africain."
 portugal.3.o:0 "Nous accueillons Ceuta"
 portugal.2.t:0 "L’Espagne rejette les revendications portugaises"
 portugal.2.d:0 "Il est évident que l’Espagne ne reconnaît pas la légitimité de notre revendication. Lorsque nous lui avons demandé, elle semblait à peine se rappeler que Ceuta nous appartenait au XVe siècle et a refusé de la céder. Nous sommes désormais convaincus que Ceuta doit être transférée au Portugal par la force, si nécessaire."
 portugal.2.o:0 "Nous devons libérer la population de Ceuta"
 news.700.t:0 "L’Espagne cède Ceuta au Portugal"
 news.700.d:0 "Reconnaissant leur erreur, le Portugal a annoncé que l’Espagne avait choisi de céder le contrôle de Ceuta. Cet événement a surpris la majeure partie du monde. Les journaux ibériques spéculent sur les revendications portugaises et rappellent que Ceuta était gouvernée par le Portugal autrefois."
 news.700.o:0 "Ainsi soit-il."
 news.701.t:0 "L’Espagne rejette les revendications portugaises"
 news.701.d:0 "Les journaux du monde entier rapportent les revendications légitimes du Portugal, exigeant que l’Espagne lui restitue Ceuta afin qu’elle rejoigne à nouveau l’administration portugaise."
 news.701.o:0 "Nous pourrions avoir la guerre en Ibérie"
### Événement : revendication de la Rhodésie
portugal.4.t:0 "Le Portugal revendique la Rhodésie"
portugal.4.d:0 "Le Portugal propose que nous signions un traité avec lui, qui lui céderait la Rhodésie ! Ils affirment en être les véritables propriétaires. Que devons-nous faire ?"
portugal.4.a:0 "Accepter l’inévitable…"
portugal.4.b:0 "Ils devront prendre nos terres par la force !"
portugal.6.t:0 "Le Royaume-Uni cède la Rhodésie"
portugal.6.d:0 "Nous avons réussi à convaincre le Royaume-Uni de notre cause légitime sur la Rhodésie. Ils ont accepté de transférer la Rhodésie sous administration portugaise. Si nous jouons bien nos cartes, nous pourrions utiliser cela pour accroître notre influence sur le continent africain."
portugal.6.o:0 "Nous accueillons la Rhodésie"
portugal.5.t:0 "Le Royaume-Uni rejette les revendications portugaises"
portugal.5.d:0 "Il est évident que le Royaume-Uni ne reconnaît pas la légitimité de notre revendication. Lorsque nous leur avons demandé, ils semblaient à peine se rappeler que la Rhodésie avait été sous notre domination pendant des siècles avant qu’ils ne nous l’arrachent. Nous sommes désormais convaincus que la Rhodésie doit être transférée au Portugal par la force, si nécessaire."
portugal.5.o:0 "Nous devons libérer la population de la Rhodésie !"
news.702.t:0 "Le Royaume-Uni cède la Rhodésie au Portugal"
news.702.d:0 "Reconnaissant leur erreur, le Portugal a annoncé que le Royaume-Uni avait choisi de céder le contrôle de la Rhodésie. Cet événement a surpris la majeure partie du monde. Les journaux internationaux spéculent sur les revendications portugaises et rappellent que la Rhodésie était gouvernée par le Portugal autrefois."
news.702.o:0 "Ainsi soit-il."
news.703.t:0 "Le Royaume-Uni rejette les revendications portugaises"
news.703.d:0 "Les journaux du monde entier rapportent les revendications légitimes du Portugal, exigeant que le Royaume-Uni lui restitue la Rhodésie afin qu’elle rejoigne à nouveau l’administration portugaise."
news.703.o:0 "Nous risquons d’avoir la guerre en Afrique"

