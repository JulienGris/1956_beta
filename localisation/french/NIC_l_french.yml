l_french:
nicaraguan_focus:0 "Arbre des priorités du Nicaragua"

#Focus
NIC_president_Somoza_Garcia:0 "Consolidation de Somoza"
NIC_president_Somoza_Garcia_desc:0 "Maintenant que l’ère des présidents fantoches est révolue, il est temps pour Somoza de prendre le contrôle total du Nicaragua."
NIC_The_preservation_of_true_democracy:0 "Préserver la véritable démocratie"
NIC_reinstate_national_guard_control:0 "Rétablir le contrôle de la Guardia Nacional"
NIC_reinstate_national_guard_control_desc:0 "Maintenant que les limites imposées aux candidats ne sont plus à l’ordre du jour, Somoza peut reprendre son rôle à la tête de la Guardia Nacional qui, combiné à la présidence, devrait lui donner le contrôle total des forces armées du Nicaragua."
NIC_nkvd_assistance:0 "Assistance du NKVD"
NIC_nkvd_assistance_desc:0 "Nous pouvons apprendre beaucoup du NKVD, dont l’efficacité n’est plus à prouver. Maintenant que nos relations avec l’Union soviétique sont au beau fixe, nous pourrions demander l’envoi de hauts responsables de leurs services secrets pour former les nôtres."
NIC_the_strength_of_moscow:0 "La force de Moscou"
NIC_the_strength_of_moscow_desc:0 "Une alliance avec les États-Unis, tout comme avec l’Allemagne, pourrait finir par menacer notre souveraineté et surtout la légitimité de Somoza. Une alliance avec l’Union soviétique, aussi improbable qu’elle soit, pourrait bien être la plus bénéfique."
NIC_begin_a_political_crackdown:0 "Lancer une purge de l’opposition"
NIC_begin_a_political_crackdown_desc:0 "Quelques voix continuent de douter de la légitimité de Somoza malgré une victoire électorale très claire. Nous pouvons tolérer une petite opposition tant qu’elle n’affecte pas ou peu les élites, mais pour les plus radicaux, ils subiront le même sort que Sandino."
NIC_supervise_large_enterprises:0 "Superviser les grandes entreprises"
NIC_supervise_large_enterprises_desc:0 "Sans interférer dans leurs opérations, nous devons nous assurer que les principales entreprises du Nicaragua soient alignées sur les intérêts et objectifs du gouvernement."
NIC_judicial_control:0 "Contrôle judiciaire"
NIC_judicial_control_desc:0 "De nombreux proches de Somoza ont été nommés à des postes judiciaires, assurant ainsi notre pleine coopération avec ce pouvoir."
NIC_take_over_the_national_radio:0 "Prendre le contrôle de la radio nationale"
NIC_take_over_the_national_radio_desc:0 "Le contrôle de la radio nationale par la famille Somoza permettra de diffuser de la propagande pro-régime à l’ensemble de la population."
NIC_support_of_the_psn:0 "Soutien du PSN"
NIC_support_of_the_psn_desc:0 "Paradoxalement, le Partido Socialista Nicaragüense a proclamé son soutien à Anastasio Somoza García, le voyant comme un allié antifasciste. Avec leur appui, notre régime sera probablement mieux vu non seulement par la gauche nicaraguayenne, mais aussi par le monde."
NIC_begin_forcibly_annexing_nicaraguan_german_land:0 "Saisir les terres germano-nicaraguayennes"
NIC_begin_forcibly_annexing_nicaraguan_german_land_desc:0 "Nous pouvons profiter de la guerre contre l’Allemagne pour forcer la petite mais influente communauté allemande du Nicaragua à vendre ses possessions et ses terres pour une bouchée de pain, afin qu’elles puissent être achetées par les proches de Somoza."
NIC_the_somoza_family_fortune:0 "La fortune de la famille Somoza"
NIC_the_somoza_family_fortune_desc:0 "Le contrôle quasi total de la famille Somoza sur l’économie et la politique du Nicaragua lui a permis d’amasser une fortune substantielle et de contrôler une immense partie des terres."
NIC_soviet_economic_assistance:0 "Aide économique [SOV.GetAdjective]"
NIC_soviet_economic_assistance_desc:0 "Le succès industriel de l’URSS est incontestable. Peut-être que nous aussi, en tant que petite nation agricole, pourrions devenir un pays pleinement industrialisé en suivant le modèle russe ?"
NIC_combat_fruit_industries_influence:0 "Combattre l’influence de l’industrie fruitière"
NIC_combat_fruit_industries_influence_desc:0 "L’influence de l’United Fruit Company sur le Nicaragua commence à devenir gênante, non seulement pour la famille Somoza mais aussi pour nos alliés soviétiques. Il est temps d’y mettre fin."
NIC_look_to_washington_once_again:0 "Se tourner à nouveau vers Washington"
NIC_look_to_washington_once_again_desc:0 "Dans ce conflit mondial, notre place est auprès de l’Amérique, sans qui Somoza ne se serait jamais retrouvé dans sa position actuelle."
NIC_lend_lease_for_docking_rights:0 "Lend-Lease contre droits portuaires"
NIC_lend_lease_for_docking_rights_desc:0 "En échange d’une aide en armement, nous pourrions offrir aux États-Unis le droit de stationner leurs navires dans nos ports afin de les aider à contrôler les Caraïbes."
NIC_foreign_concessions_on_gold_exploitation:0 "Concessions étrangères sur l’exploitation de l’or"
NIC_foreign_concessions_on_gold_exploitation_desc:0 "En accordant des concessions aux entreprises américaines pour l’or, le caoutchouc et le bois, nous pourrions assurer un soutien économique solide au Nicaragua."
NIC_ally_the_champion_of_europe:0 "S’allier au champion d’Europe"
NIC_ally_the_champion_of_europe_desc:0 "Il est clair que l’Allemagne est la nouvelle puissance dominante en Europe. En nous alliant avec elle, nous pourrions obtenir notre part du nouvel ordre."
NIC_push_south:0 "Frapper vers le sud"
NIC_push_south_desc:0 "Au sud se trouve le Costa Rica, une nation faible dirigée par un gouvernement tout aussi faible. En l’envahissant, nous pourrions prouver l’efficacité de l’armée nicaraguayenne à nos nouveaux alliés."
NIC_steel_trade:0 "Commerce d’acier"
NIC_steel_trade_desc:0 "Un contrat commercial avec l’Allemagne pour le fer et l’acier nous permettra de faire tourner nos usines plus efficacement et à moindre coût."
NIC_control_immigration:0 "Contrôler l’immigration"
NIC_control_immigration_desc:0 "Alors que le Nicaragua traverse une période de troubles, des restrictions à l’immigration sont nécessaires afin de nous laisser le temps de rétablir la stabilité interne."
NIC_expanded_national_guard_powers:0 "Étendre les pouvoirs de la Guardia Nacional"
NIC_expanded_national_guard_powers_desc:0 "La Guardia Nacional représente l’épine dorsale du pouvoir de Somoza. L’élargissement de ses prérogatives, et donc de l’influence de Somoza, renforcera son contrôle sur le Nicaragua."
NIC_uproot_banditry:0 "Éradiquer le banditisme"
NIC_uproot_banditry_desc:0 "Le relief cruel du Nicaragua a permis à des groupes de bandits de se former et d’attaquer facilement le gouvernement central. Il est temps d’y mettre un terme."
NIC_regulate_the_national_railroads:0 "Réguler les chemins de fer nationaux"
NIC_regulate_the_national_railroads_desc:0 "En se nommant directeur du chemin de fer du Pacifique, Somoza pourra s’assurer de la bonne gestion de celui-ci ainsi que des autres lignes du pays."
NIC_health_services:0 "Services de santé"
NIC_health_services_desc:0 "L’accès à des soins décents reste limité dans certaines régions du Nicaragua, et une population malade est une population faible. Il est temps d’étendre l’accès aux soins de santé."
NIC_local_intelligence_cooperation:0 "Assistance locale avec le SSGN"
NIC_local_intelligence_cooperation_desc:0 "Pour mieux contrôler la région et préparer une poussée vers le sud, nous devons renforcer et consolider notre agence de renseignement : le Servicio de Seguridad de la Guardia Nacional."
NIC_nicaraguan_diplomacy:0 "Sécurité diplomatique nicaraguayenne"
NIC_marine_national_guard_cooperation:0 "Coopération Marine–Guardia Nacional"

