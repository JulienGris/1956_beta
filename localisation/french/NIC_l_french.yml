#Events
nicaragua.1.t:0 "Somoza s’empare du pouvoir"
nicaragua.1.d:0 "Ce ne fut une surprise pour personne lorsque ce matin Anastasio Somoza García a demandé à [ROOT.getleader] de démissionner de la présidence du Nicaragua. Somoza et la Guardia Nacional sous son contrôle ont mené une campagne d’assassinats et de terrorisme contre ses opposants politiques depuis l’accord de partage du pouvoir de 1933. Le pays est plongé dans une crise présidentielle depuis le milieu de 1935, crise que beaucoup pensaient voir dégénérer en chaos. [ROOT.getleader] a choisi d’éviter une guerre civile possible et de se retirer, plutôt que d’essayer de maintenir son emprise sur le pouvoir. Les [USA.getname], qui avaient négocié l’accord de 1933, se lavent désormais les mains de la situation et se désintéressent de ce qui est pour beaucoup la fin de la démocratie au Nicaragua.\n \n Anastasio Somoza García a nommé un président temporaire, simple marionnette à son service. De nouvelles élections seront organisées, mais beaucoup soupçonnent déjà une fraude électorale qui favorisera naturellement Somoza."
nicaragua.1.a:0 "Le pouvoir est tenu dans un fusil chargé, Sacasa"

nicaragua.2.t:0 "Le Nicaragua demande à rejoindre le Komintern"
nicaragua.2.d:0 "Le Nicaragua a demandé à rejoindre le Komintern et donc à participer à la guerre contre l’Allemagne."
nicaragua.2.a:0 "Absolument"
nicaragua.2.b:0 "Non"

nicaragua.3.t:0 "Les Soviétiques disent oui !"
nicaragua.3.d:0 "L’URSS nous a acceptés au sein du Komintern et attend désormais notre déclaration de guerre à l’Allemagne, comme promis."
nicaragua.3.a:0 "Merveilleux"

nicaragua.4.t:0 "Les Soviétiques disent non"
nicaragua.4.d:0 "L’URSS nous a répondu par un refus, préférant prendre ses distances avec nous."
nicaragua.4.a:0 "Un désastre"

nicaragua.5.t:0 "L’assassinat de Pedro Altamirano"
nicaragua.5.d:0 "Pedro Altamirano, ennemi de l’État et partisan de Sandino, a été tué d’un coup de fusil à l’aube aujourd’hui. C’est assurément une victoire pour Anastasio Somoza García et pour le peuple du Nicaragua."
nicaragua.5.a:0 "Une occasion à célébrer"

nicaragua.6.t:0 "Le Nicaragua demande à rejoindre notre faction"
nicaragua.6.d:0 "Le Nicaragua a demandé à rejoindre notre alliance et, par conséquent, à entrer en guerre contre l’Allemagne."
nicaragua.6.a:0 "Absolument"
nicaragua.6.b:0 "Nous nous en sortirons mieux sans eux"

nicaragua.7.t:0 "Les Américains disent oui !"
nicaragua.7.d:0 "Les États-Unis nous ont acceptés dans leur alliance et attendent désormais notre déclaration de guerre à l’Allemagne, comme promis."
nicaragua.7.a:0 "Merveilleux"

nicaragua.8.t:0 "Les Américains disent non"
nicaragua.8.d:0 "Les États-Unis ont répondu par la négative, souhaitant prendre leurs distances avec nous."
nicaragua.8.a:0 "Un désastre"

nicaragua.9.t:0 "Le Nicaragua demande à rejoindre notre faction"
nicaragua.9.d:0 "Le Nicaragua a demandé à rejoindre notre alliance."
nicaragua.9.a:0 "Absolument"
nicaragua.9.b:0 "Nous nous en sortirons mieux sans eux"

nicaragua.10.t:0 "Les Allemands disent oui !"
nicaragua.10.d:0 "L’Allemagne nous a acceptés dans son alliance."
nicaragua.10.a:0 "Merveilleux"

nicaragua.11.t:0 "Les Allemands disent non"
nicaragua.11.d:0 "L’Allemagne a répondu par la négative, souhaitant prendre ses distances avec nous."
nicaragua.11.a:0 "Un désastre"

r56.news_event.1100.t:0 "Somoza s’empare du pouvoir au [NIC.getnamedef]"
r56.news_event.1100.d:0 "Ce ne fut une surprise pour personne lorsque, ce matin, Anastasio Somoza García a demandé au président Sacasa de démissionner de la présidence du Nicaragua. Somoza et la Guardia Nacional sous son contrôle ont mené une campagne d’assassinats et de terreur contre ses opposants politiques depuis l’accord de partage du pouvoir de 1933. Le pays est plongé dans une crise présidentielle depuis le milieu de 1935, crise que beaucoup pensaient voir dégénérer en chaos. Sacasa a choisi d’éviter une possible guerre civile et de se retirer, plutôt que de tenter de maintenir son emprise sur le pouvoir. Les [USA.getname], qui avaient négocié l’accord de 1933, se lavent désormais les mains de la situation et se désintéressent de ce qui est pour beaucoup la fin de la démocratie au Nicaragua."
r56.news_event.1100.a:0 "Quel gâchis"
r56.news_event.1100.b:0 "Espérons qu’il reste tranquille"

