  var_ENG_count_blackshirt_marches:0 "Nombre de §Ymarches des Chemises noires§! organisées"
  ENG_harold_harmsworth_tt:0 "Nombre de §Ymarches des Chemises noires§! organisées > §Y4§!"

  ENG_embrace_royal_german_heritage:0 "Assumer l’héritage royal [GER.GetAdjective]"
  ENG_embrace_royal_german_heritage_desc:0 "Trop longtemps, nous avons renié nos racines royales liées à [GER.GetNameDef]. Il est temps de faire tomber le masque et de reprendre le nom d’origine, le seul véritable, de notre maison royale."

  ENG_speech_against_war:0 "Discours contre la guerre"
  ENG_speech_against_war_desc:0 "Le sang de notre plus belle jeunesse ne sera pas versé en vain pour des querelles étrangères. La Grande-Bretagne doit rester en paix si elle veut perdurer. Notre voix doit être entendue dans toutes les rues. Nous exigeons la paix ! Mais nous serons prêts à défendre notre sol, armés contre les envahisseurs étrangers. À ceux qui prétendent que nous voulons semer le trouble ou déclencher des guerres, nous répondons d’une seule voix unanime : la Grande-Bretagne vit et avance, dans la paix !"

