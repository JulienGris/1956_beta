#Traits

  #Misc
  british_alternate_focus:0 "Arbre de priorités de l’Empire britannique"
  british_alternate_focus_tt:0 "§RUn autre arbre de priorités se chargera après l’achèvement de celui-ci, contenant toutes les priorités fascistes de Road to 56. Il n’y aura pas de retour en arrière ! Choisissez avec soin.§!"
  ENG_anti_communist_commanders_exile_tt:0 "§RLes commandants aristocratiques disparaîtront ou partiront en exil.§!"
  revolutionary_scientific_congress_name:0 "Congrès scientifique révolutionnaire"

  r56_eng.1.t:0 "Seul le fascisme peut préserver la paix !"
  r56_eng.1.desc:0 "Le fascisme signifie la paix, car lui seul combat la véritable cause de la guerre. Une politique d’autarcie forte permettrait d’échapper à l’insoutenable concurrence pour les marchés, responsable de tant de guerres. Voilà pourquoi paix et Empire sont compatibles. Ils vont de pair pour garantir l’indépendance économique !"
  r56_eng.1.a:0 "Nous empêcherons la guerre !"

  r56_eng.2.t:0 "Des guerres étrangères"
  r56_eng.2.desc:0 "Les Britanniques ne doivent combattre que pour la Grande-Bretagne ! Voir les fils de notre nation quitter nos rivages pour mourir dans des querelles étrangères doit devenir une simple note dans les livres d’histoire. Les Britanniques doivent se battre uniquement pour la patrie et la défense de l’Empire."
  r56_eng.2.a:0 "Nous ne mourrons pas sur des rivages étrangers !"

  r56_eng.3.t:0 "Les exilés militaires britanniques demandent asile"
  r56_eng.3.desc:0 "D’anciens membres de l’armée britannique, fuyant les communistes, sont arrivés et demandent l’asile. En réalité, ils pourraient très bien servir dans nos forces armées."
  r56_eng.3.a:0 "Nous avons toujours besoin de personnel expérimenté !"

  r56_eng.4.t:0 "Des survivants de la famille royale se réfugient dans notre pays"
  r56_eng.4.desc:0 "Ayant échappé aux événements tragiques qui ont décimé la famille royale, les survivants demandent à pouvoir s’établir dans notre pays, dans l’espoir de restaurer un jour la monarchie en Grande-Bretagne."
  r56_eng.4.a:0 "Ce n’est pas Westminster, mais nous ferons de notre mieux."

  r56_eng.7.t:0 "Les élections de [GetYear]"
  r56_eng.7.d:0 "Cinq ans se sont écoulés depuis les dernières élections, et il est à nouveau temps pour le peuple de [ENG.GetNameDef] de voter pour son gouvernement.\n\nCes dernières années, le Parti travailliste a vivement critiqué le soutien des conservateurs à la politique d’apaisement, tandis que le Parti conservateur défendait ses choix en affirmant que [ENG.GetNameDef] n’était pas prête à faire la guerre à ce moment-là. Pour le reste, les partis mènent leurs campagnes habituelles, la plateforme social-démocrate des travaillistes s’opposant aux politiques plus à droite des conservateurs.\n\nQui le peuple [ENG.GetAdjective] jugera-t-il digne de le diriger ?"
  r56_eng.7.a:0 "Les conservateurs savent ce qu’ils font."
  r56_eng.7.b:0 "Les travaillistes mèneront [ENG.GetNameDef] vers l’avenir !"

  r56_eng.8.t:0 "Des élections en temps de guerre ?"
  r56_eng.8.d:0 "Cinq ans se sont écoulés depuis les dernières élections, et l’heure du vote a sonné. Cependant, [ENG.GetNameDef] est actuellement en guerre contre une grande puissance, et beaucoup pensent que des élections à ce moment ne feraient qu’affaiblir la nation dans son heure la plus sombre.\n\nQue doit-on faire ?"
  r56_eng.8.a:0 "Le peuple a le droit d’être entendu."
  r56_eng.8.b:0 "Cela peut attendre jusqu’à la victoire."

  r56_eng.9.t:0 "[ENG.GetLeader] remporte les élections [ENG.GetAdjective]"
  r56_eng.9.d.a:0 "Cinq ans se sont écoulés depuis les dernières élections [ENG.GetAdjective], et hier, le peuple s’est à nouveau rendu aux urnes pour décider de l’avenir de son gouvernement.\n\nLes bulletins étant comptés, il apparaît que le Parti travailliste, mené par Clement Attlee, a remporté le pouvoir, promettant de s’opposer à l’apaisement et de faire progresser les réformes sociales dans la société [ENG.GetAdjective].\n\nSeul l’avenir dira si ce nouveau gouvernement tiendra."
  r56_eng.9.d.b:0 "Cinq ans se sont écoulés depuis les dernières élections [ENG.GetAdjective], et hier, le peuple s’est à nouveau rendu aux urnes pour décider de l’avenir de son gouvernement.\n\nLes bulletins étant comptés, il apparaît que le Parti conservateur, dirigé par [ENG.GetLeader], a remporté le pouvoir, sa campagne reposant sur la continuité des politiques protectionnistes et le maintien de l’Empire.\n\nSeul l’avenir dira si ce nouveau gouvernement tiendra."
  r56_eng.9.a:0 "Beau spectacle."
  r56_eng.9.b:0 "Sera-t-il différent de l’administration précédente ?"

  r56_eng.11.t:0 "Évacuer le gouvernement ?"
  r56_eng.11.d:0 "Avec la chute de Londres face aux troupes [126.controller.GetAdjective] et la capitulation imminente du gouvernement britannique, nous devons décider si le gouvernement et l’armée évacueront vers nos dominions ou continueront à se battre jusqu’au bout."
  r56_eng.11.a:0 "Ils vivront pour se battre un autre jour."
  r56_eng.11.b:0 "Nous reviendrons. (Jouer le Canada)"
  r56_eng.11.c:0 "Nous combattrons jusqu’au bout !"

  r56_eng.12.t:0 "Les exilés britanniques arrivent à [Capital.GetCapitalVictoryPointName]"
  r56_eng.12.d:0 "Après l’effondrement de la métropole britannique, la famille royale et des exilés du gouvernement britannique se sont réfugiés dans notre nation pour poursuivre la lutte. Cependant, alors que nos armées restantes battent en retraite d’Europe, les protestations contre la guerre s’intensifient, paralysant le pays."
  r56_eng.12.a:0 "Nous continuerons la lutte !"
  r56_eng.12.b:0 "Peut-être devons-nous admettre la défaite."

  r56_eng.13.t:0 "Effondrement de la métropole britannique"
  r56_eng.13.d:0 "Après la chute de Londres et la fuite de la famille royale, l’Empire tel que nous le connaissions touche à sa fin. Nous avons pris le contrôle des territoires britanniques voisins et attendons la décision de [faction_leader.GetNameDef] quant à la poursuite du combat."
  r56_eng.13.a:0 "La fin d’une époque."

  r56_eng.14.t:0 "Effondrement de la métropole britannique"
  r56_eng.14.d:0 "Après la chute de Londres et la fuite de la famille royale, l’Empire tel que nous le connaissions touche à sa fin. Nous avons pris le contrôle des territoires britanniques voisins, mais la majorité de notre population réclame de quitter cet empire en ruine et de déclarer l’indépendance."
  r56_eng.14.a:0 "Nous resterons aux côtés de nos loyaux alliés."
  r56_eng.14.b:0 "L’Inde est enfin libre !"

  r56_eng.15.t:0 "Effondrement de la métropole britannique"
  r56_eng.15.d:0 "Après la chute de Londres et la fuite de la famille royale, l’Empire tel que nous le connaissions touche à sa fin. Nous avons pris le contrôle des territoires britanniques voisins, mais la majorité de notre population réclame de quitter cet empire en ruine et de déclarer l’indépendance."
  r56_eng.15.a:0 "Nous resterons aux côtés de nos loyaux alliés."
  r56_eng.15.b:0 "Nous ne voyons aucune raison de poursuivre cette guerre perdue."

  r56_eng.16.t:0 "S’emparer des Malouines ?"
  r56_eng.16.d:0 "Après la chute de Londres et la fuite de la famille royale, les territoires d’outre-mer de l’Empire britannique sont à prendre. Nous pourrions saisir cette occasion pour occuper les îles Malouines et la Géorgie du Sud. Les Canadiens ne réagiraient peut-être même pas, mais une telle opération comporte le risque d’une riposte."
  r56_eng.16.a:0 "¡Las Malvinas son argentinas!"
  r56_eng.16.b:0 "N’allumons pas une guerre que nous ne pourrions gagner."

  r56_eng.17.t:0 "[ARG.GetNameDefCap] s’empare des îles Falkland"
  r56_eng.17.d:0 "Profitant de notre faiblesse, [ARG.GetLeader] a lancé une opération militaire pour prendre le contrôle des îles Falkland. Il pourrait être sage de ne pas riposter, car les récents événements ont profondément déstabilisé notre nation."
  r56_eng.17.a:0 "Nous leur prouverons qu’ils ont tort !"
  r56_eng.17.b:0 "Hélas, ils avaient raison."

  r56_eng.18.t:0 "Effondrement de l’Empire britannique"
  r56_eng.18.d:0 "Avec la chute de Londres et la capitulation inévitable de la métropole, le gouvernement, l’armée et la famille royale du Royaume-Uni ont décidé d’évacuer.\n\nBien que le Roi ait proclamé depuis [ENG_commonwealth_successor.Capital.GetCapitalVictoryPointName] que l’Empire poursuivra la lutte jusqu’à la libération de la métropole, beaucoup y voient la fin de l’Empire britannique tel que nous le connaissions."
  r56_eng.18.a:0 "Le soleil s’est enfin couché."

  r56_eng.19.t:0 "$ENG_winston_churchill$ prend sa retraite"
  r56_eng.19.d:0 "Après de graves soucis de santé, Sir $ENG_winston_churchill$ a pris sa retraite de la tête du Parti conservateur, laissant $ENG_anthony_eden$ assumer ses fonctions. Ce passage de témoin avait été envisagé plus tôt, mais $ENG_anthony_eden$ souffrait lui-même de problèmes de santé."
  r56_eng.19.a:0 "Il nous manquera."

  ENG_collapse_of_the_empire_tt:0 "§YLe gouvernement et la famille royale se réfugieront dans notre plus grand dominion. Nos territoires d’outre-mer ainsi qu’une partie de notre armée et de notre marine seront saisis par d’autres nations de l’Empire, qui gagneront leur indépendance.§!"
  ENG_got_territories_from_collapse:0 "§YNous prendrons le contrôle des territoires voisins de l’Empire.§!"

