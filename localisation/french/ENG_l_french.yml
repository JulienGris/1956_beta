l_french:
  #CHARACTERS
  ENG_elizabeth_ii:0 "Élisabeth II"
  ENG_charles_edward_of_albany:0 "Charles Édouard d'Albany"
  ENG_r56_percy_hobart:0 "Percy Hobart"
  ENG_anthony_eden:0 "Anthony Eden"

 #Focus Shortcuts
  ENG_communism_sc:0 "Politique : Communisme"
  ENG_fascism_sc:0 "Politique : Fascisme"
  ENG_king_sc:0 "Politique : Monarchie"
  ENG_democracy_sc:0 "Politique : Démocratie"
  ENG_decolonize_sc:0 "Colonies : Décolonisation"
  ENG_colonial_affairs_sc:0 "Colonies : Impérialisme"
  ENG_rearmament_sc:0 "Réarmement"

  #Country Stuff
  ENG_establish_the_colony_of_aden:0 "Établir la colonie d’Aden"
  ENG_establish_the_colony_of_aden_desc:0 "Le port d’Aden est l’un des plus importants pour le commerce entre l’Inde, l’Europe et l’Extrême-Orient. Le Government of India Act de 1935 a transféré directement son contrôle au gouvernement de Londres, alors qu’il était auparavant administré comme une province de commissaire en chef. Les préparatifs finaux sont désormais achevés pour l’établissement d’Aden en tant que colonie distincte."

  uk_industrial_focus:0 "Développer l’industrie du nord de l’Angleterre"
  uk_industrial_focus_desc:0 "Le nord de l’Angleterre était rempli de villes en plein essor durant la Révolution industrielle. Cette gloire est déjà en train de disparaître sous nos yeux.\nArrêtons cela !"

  uk_extra_tech_slot:0 "Soutenir la recherche de l’Université d’Oxford"
  uk_extra_tech_slot_desc:0 "L’Université d’Oxford est notre plus ancienne et la plus prestigieuse. Sa division de recherche peut contribuer à notre sécurité nationale si nous la soutenons."

  uk_naval_gunnery:0 "Artillerie navale"
  uk_naval_gunnery_desc:0 "Améliorons l’efficacité de notre équipement naval pour frapper plus fort et dominer les mers."

  ENG_tube_alloys:0 "Tube Alloys"
  ENG_tube_alloys_desc:0 "Les équations physiques montrent que la fission de l’uranium pourrait libérer une quantité d’énergie gigantesque. Cela pourrait potentiellement mener à la création d’une bombe d’une puissance presque inconcevable."

  ENG_admiralty_naval_staff_desc:0 "L’état-major de la Royal Navy constitue le véritable cœur de notre marine, une organisation capable de coordonner et d’influencer les opérations de nos navires dans le monde entier."

  ENG_tank_variant_focus:0 "Développer des variantes de chars"
  ENG_tank_variant_focus_desc:0 "Les chars peuvent remplir bien plus de rôles que le simple combat direct. Ils peuvent être rendus amphibies, équipés de pièces d’artillerie pour détruire les défenses ennemies, ou transformés en plateformes antiaériennes afin de protéger nos troupes des attaques aériennes."

  ENG_agents_of_the_revolution:0 "Agents de la Révolution"
  ENG_agents_of_the_revolution_desc:0 "Les opérations clandestines sont essentielles pour protéger la Révolution."

  ENG_french_alliance:0 "Alliance française"
  ENG_french_alliance_desc:0 "Seuls [ROOT.GetNameDef] et [FRA.GetNameDef] demeurent de l’ancienne Triple-Entente, la Russie ayant changé à jamais. Si l’histoire est vouée à se répéter, nous devons nous assurer que ces deux nations, bastions de démocratie et de liberté en Europe, restent alliées."

  ENG_the_home_army:0 "L’Armée intérieure"
  ENG_the_home_army_desc:0 "Alors que la menace d’un conflit sur notre territoire devient toujours plus claire, il est idéal de former une milice intérieure composée en grande partie de vétérans de la Grande Guerre, afin de ralentir toute invasion étrangère le temps que nos troupes professionnelles puissent se réorganiser et contre-attaquer."

  ENG_special_operations_executive:0 "Special Operations Executive"
  ENG_special_operations_executive_desc:0 "La création d’un département dédié au sein de notre agence de renseignement, chargé d’assister les organisations de résistance étrangères et d’infiltrer les institutions ennemies, nous aidera grandement à prendre l’avantage et à préparer nos futures opérations."

  ENG_reconciliation_with_ussr:0 "Réconciliation avec les [SOV.GetAdjective]s"
  ENG_reconciliation_with_ussr_desc:0 "Malgré nos différences et le mépris mutuel que nous nourrissons, [SOV.GetNameDef] représente une étape vitale pour contrer la plus grande menace qui pèse sur la paix mondiale. Nous devons mettre nos différends de côté et apprendre à travailler ensemble pour atteindre un objectif commun, du moins pour l’instant."

  ENG_permit_plane_leasement:0 "Autoriser le prêt d’avions aux [SOV.GetAdjective]s"
  ENG_permit_plane_leasement_desc:0 "Dans le cadre de notre effort de guerre commun, prêter des avions à [SOV.GetNameDef] les aidera dans leur lutte contre notre ennemi commun."

  ENG_embargo_china:0 "Imposer un embargo à la Chine"
  ENG_embargo_china_desc:0 ""
  ENG_influence_japan:0 "Influencer le Japon"
  ENG_influence_japan_desc:0 ""
  ENG_conquer_guanxi:0 "Conquérir le Guangxi"
  ENG_conquer_guanxi_desc:0 ""
  ENG_war_with_china:0 "Guerre contre la Chine"
  ENG_war_with_china_desc:0 ""

  ENG_cable_street:0 "Bataille de Cable Street"
  ENG_cable_street_desc:0 "La bataille de Cable Street a révélé l’évolution de l’opinion dans le pays. Les mouvements communistes et les échecs du gouvernement ont entraîné une forte réaction et accru le sentiment nationaliste. Nous devrions nous rapprocher de ce mouvement."

  ENG_blackshirts:0 "Hourra pour les Chemises noires !"
  ENG_blackshirts_desc:0 "La propagande est véritablement un outil extraordinaire. Maintenant que le Daily Mail s’est rallié à ce mouvement nationaliste d’extrême droite, nous pouvons atteindre une majorité de la population et diffuser notre message."

  ENG_visit_italy:0 "Visite d’État en Italie"
  ENG_visit_italy_desc:0 "Nous devons beaucoup aux fascistes en Italie : après tout, ils furent parmi les pionniers du fascisme et du nationalisme en Europe après la Grande Guerre. Nous devrions effectuer une visite d’État et témoigner notre solidarité au peuple italien."

  ENG_visit_germany:0 "Visite d’État en Allemagne"
  ENG_visit_germany_desc:0 "Les Allemands sont un peuple fort et fier. Nous avons été insensés de les combattre durant la Grande Guerre au lieu de nous allier à eux contre les Français et les Russes. Unis, nous pouvons accomplir n’importe quoi."

  ENG_right_wing_rhetoric:0 "Rhétorique de droite"
  ENG_right_wing_rhetoric_desc:0 "L’objectif est clair : frontières fermées, armée puissante, et peuple britannique uni derrière un leader fort et charismatique. Il n’y a pas de place pour la faiblesse ni pour quoi que ce soit que nous jugerions indésirable sur les îles Britanniques."

  ENG_join_germany:0 "Pacte de Londres"
  ENG_join_germany_desc:0 "Il est naturel que la cause de l’Empire britannique s’aligne sur celle des Allemands. Nous sommes un peuple fier et, unis, tous craindront notre triomphe."

  ENG_new_empire:0 "Un nouvel empire"
  ENG_new_empire_desc:0 "Si nous aimons croire que notre empire inspire la crainte, la réalité est tout autre. Des cendres de l’ancien Empire britannique s’élèvera un nouvel empire — glorieux et redouté."

  ENG_militarism_focus:0 "Militarisme"
  ENG_militarism_focus_desc:0 "Pour être perçu comme fort, il faut l’être réellement. Nous ne pouvons pas permettre à nos troupes de rester reléguées au second plan au profit d’autres domaines. L’armée sera toujours notre priorité numéro un."

  ENG_subjugate_colonials:0 "Soumettre les colonies"
  ENG_subjugate_colonials_desc:0 "Nous avons d’importantes colonies pleines d’hommes et de femmes qui doivent être prêts à travailler pour l’Empire. Ils doivent se souvenir à qui ils obéissent."

  ENG_road_war:0 "La route vers la guerre"
  ENG_road_war_desc:0 "Que cela plaise ou non, la guerre s’apprête à embraser le monde. La seule question est de savoir si la Grande-Bretagne y sera prête."

  ENG_improved_screen_ships_two:0 "Navires d’escorte améliorés"
  ENG_improved_screen_ships_two_desc:0 "Les navires de guerre sont extrêmement vulnérables s’ils ne sont pas escortés correctement. Disposer de destroyers et de croiseurs modernes est indispensable."

  ENG_convoy_tactics:0 "Tactiques de convoi"
  ENG_convoy_tactics_desc:0 "En tant qu’empire possédant de nombreuses colonies lointaines et dépendant de leurs ressources, nous devons nous assurer que notre marine puisse défendre nos routes commerciales."

  ENG_escort_focus:0 "Production de navires d’escorte"
  ENG_escort_focus_desc:0 "Nous devrions concentrer notre production sur les navires d’escorte afin de protéger à la fois nos bâtiments de guerre et nos lignes de ravitaillement."

  ENG_capital_focus:0 "Production de navires capitaux"
  ENG_capital_focus_desc:0 "Nous disposons de navires capitaux modernes, mais leur production n’est pas à la hauteur de nos besoins. Nous devons y remédier."

  ENG_euro_focus:0 "Focus continental"
  ENG_euro_focus_desc:0 "Depuis des siècles, nous avons maintenu une politique fragile d’équilibre des puissances européennes. Nous avons vu les puissants empires français, allemand et russe s’étendre tandis que nous devions regarder ailleurs. Il est temps que ce soit enfin notre tour de régner sur le continent."

  ENG_imperial_focus:0 "Ambitions impériales"
  ENG_imperial_focus_desc:0 "Même si nous contrôlons déjà un vaste empire, cela ne suffit pas à étancher notre soif. Il existe des nations, fortes ou faibles, qui doivent nous succomber."

  ENG_war_propaganda_two:0 "Propagande de guerre"
  ENG_war_propaganda_two_desc:0 "En diabolisant l’ennemi et en encourageant le patriotisme à travers une campagne de propagande soigneusement planifiée, nous pouvons accroître le soutien à la guerre et inciter les jeunes hommes à s’engager et à se battre pour leur pays."

  ENG_western:0 "Focus occidental"
  ENG_western_desc:0 "L’Europe de l’Ouest regorge de nations rivales possédant de vastes empires coloniaux et des terres riches prêtes à être prises. Nous devrions commencer à planifier leur chute."

  ENG_belgium_friend:0 "Se rapprocher de la Belgique"
 ENG_belgium_friend_desc:0 "Les Néerlandais ont toujours été une épine dans notre flanc. Nous devrions nous aligner sur les Belges et les isoler."
 ENG_antagonize_holland:0 "Antagoniser les Pays-Bas"
 ENG_antagonize_holland_desc:0 "Les Belges ont demandé que nous les rejoignions dans l’imposition de sanctions contre la Hollande. Nous sommes heureux d’accepter."
 ENG_holland_friend:0 "Se rapprocher des Pays-Bas"
 ENG_holland_friend_desc:0 "Ces ridicules Belges ont reçu une nation qu’ils ne méritaient pas. Nous convenons que ces terres conviendraient mieux aux Néerlandais… ou à nous."
 ENG_antagonize_belgium:0 "Antagoniser la Belgique"
 ENG_antagonize_belgium_desc:0 "Les Néerlandais sont disposés à imposer des sanctions aux Belges, dès que nous serons prêts à donner le feu vert."
 ENG_ireland_friend:0 "Se rapprocher de l’Irlande"
 ENG_ireland_friend_desc:0 "Beaucoup de sang a coulé — irlandais comme britannique — dans un long conflit entre nos nations. Nous pensons que la réconciliation et l’influence pour amener les Irlandais à accepter notre nouveau mode de vie valent mieux que la guerre."
 ENG_demand_ireland:0 "Réclamer l’Irlande"
 ENG_demand_ireland_desc:0 "Dans un moment de faiblesse, nous avons accordé l’indépendance aux Irlandais, mais il est temps à présent de reprendre ce don généreux."
 ENG_burn_french:0 "Brûler les œuvres littéraires françaises"
 ENG_burn_french_desc:0 "Depuis plus d’un siècle, les Français ne cessent de clamer leurs idées de liberté, et les voilà désormais qui sympathisent avec les communistes. Nous devons promouvoir activement la francophobie dans l’Empire."
 ENG_war_france:0 "Guerre contre la France"
 ENG_war_france_desc:0 "Le fascisme n’a pas su s’imposer en France. Les idéaux libéraux et communistes y sont trop puissants. C’est donc à nous qu’il revient de libérer les Français de leur faiblesse."
 ENG_med:0 "Focus méditerranéen"
 ENG_med_desc:0 "Bien que nous contrôlions l’entrée et la sortie de la Méditerranée, notre position s’est largement affaiblie par notre hésitation à la renforcer. Il n’en sera désormais plus ainsi."
 uk_rock_focus_two:0 "Fortifier le Rocher"
 uk_rock_focus_two_desc:0 "En plus de contrôler l’entrée de la Méditerranée, Gibraltar offre un port fortement défendu d’où nos navires peuvent opérer tant dans l’Atlantique que dans la Méditerranée. Il est donc impératif qu’il soit solidement gardé."
 uk_spain_focus_two:0 "Se rapprocher de l’Espagne"
 uk_spain_focus_two_desc:0 "Les Espagnols connaissent mieux que quiconque la puissance de la Royal Navy, mais un petit rappel ne ferait sans doute pas de mal…"
 ENG_war_spain:0 "Attaquer l’Espagne"
 ENG_war_spain_desc:0 "Les Espagnols n’ont pas répondu favorablement à nos efforts diplomatiques. Nous n’avons donc pas d’autre choix que de leur déclarer la guerre."
 ENG_ally_portugal:0 "Alliance avec le Portugal"
 ENG_ally_portugal_desc:0 "Les Portugais sont nos alliés depuis des siècles, et nous sommes certains de pouvoir les guider vers un avenir plus radieux."
 uk_malta_focus_two:0 "Fortifier Malte"
 uk_malta_focus_two_desc:0 "Malte occupe une excellente position en Méditerranée centrale, un relais vital sur notre ligne de vie passant par l’Égypte et le canal de Suez vers l’Inde et l’Extrême-Orient. Le temps consacré à la fortifier davantage ne sera jamais du temps perdu."
 ENG_turkey_friend:0 "Contraindre la Turquie"
 ENG_turkey_friend_desc:0 "Les Turcs occupent un emplacement stratégique majeur et peuvent constituer un excellent allié contre les Italiens et les Soviétiques."
 ENG_greece_friend:0 "Se rapprocher de la Grèce"
 ENG_greece_friend_desc:0 "Les Grecs furent nos alliés durant la Grande Guerre. Nous pensons qu’ils pourraient aussi nous être utiles lors d’un futur conflit européen."
 ENG_war_greece:0 "Guerre contre la Grèce"
 ENG_war_greece_desc:0 "Pour solidifier notre position en Méditerranée, nous devons nous assurer que la Turquie et la Grèce soient dans notre sphère d’influence. La Turquie l’est déjà, il est temps que la Grèce se soumette."
 ENG_war_turkey:0 "Attaquer la Turquie"
 ENG_war_turkey_desc:0 "Contrairement aux Grecs, les Turcs se sont montrés déraisonnables et peu coopératifs. Ils apprendront bientôt la folie de leur choix."
 ENG_woo_italy:0 "Courtiser l’Italie"
 ENG_woo_italy_desc:0 "Les Italiens furent parmi les premiers à adopter le fascisme et nous leur devons beaucoup. Nous devrions nous tenir fièrement aux côtés de nos frères et sœurs italiens en ces temps troublés."
 ENG_war_italy:0 "Sécuriser l’Italie"
 ENG_war_italy_desc:0 "Tôt ou tard, les Italiens nous trahiront, aveuglés par leurs rêves délirants de bâtir un empire méditerranéen. Ce qu’ils ne réalisent pas, c’est que ce rêve, nous pouvons le réaliser — mais pour nous-mêmes."
 ENG_army_innov:0 "Innovations militaires"
 ENG_army_innov_desc:0 "En temps d’incertitude ou de guerre, l’Empire britannique a besoin d’une armée de premier ordre. Il n’y a aucune excuse pour moins que cela."
 ENG_equipment_effort_two:0 "Effort en armement"
 ENG_equipment_effort_two_desc:0 "Nos soldats ont besoin de meilleures armes. Depuis trop longtemps, nous utilisons un matériel obsolète qui serait un handicap en cas de guerre."
 ENG_motorized_focus_two:0 "Une armée motorisée"
 ENG_motorized_focus_two_desc:0 "Récemment, l’Armée a expérimenté des unités d’infanterie entièrement motorisées. Elles n’ont pas encore formé de divisions complètes, mais avec le bon mot au secrétaire d’État à la Guerre, cela pourrait bientôt devenir réalité."
 ENG_tank_focus:0 "Royal Tank Regiment"
 ENG_tank_focus_desc:0 "La Grande-Bretagne a inventé le char. Le Royal Tank Regiment devrait donc être doté des meilleurs chars du monde — ce qui n’est actuellement pas le cas. Le Special Vehicle Development Committee propose de concevoir et développer un modèle moderne afin de maintenir la Grande-Bretagne à l’avant-garde du développement des chars."
 royal_ordinance_focus:0 "Usines Royal Ordnance"
 royal_ordinance_focus_desc:0 "L’arsenal royal de Woolwich est cruellement insuffisant pour produire toutes les munitions et armes légères dont nous avons besoin. Nous devrions établir de nombreuses autres usines à travers le pays, de préférence dans des zones relativement sûres."
 ENG_tank_focus_two:0 "Divisions blindées"
 ENG_tank_focus_two_desc:0 "La Grande-Bretagne a inventé le char. Le Royal Tank Regiment devrait donc être doté des meilleurs chars du monde — ce qui n’est actuellement pas le cas. Le Special Vehicle Development Committee propose de concevoir et développer un modèle moderne afin de maintenir la Grande-Bretagne à l’avant-garde du développement des chars."
 ENG_special_forces_two:0 "Forces spéciales"
 ENG_special_forces_two_desc:0 "Tous les soldats ne reçoivent pas la même formation ni n’ont les mêmes aptitudes au combat. Certains disposent de spécialisations et de compétences particulières qui peuvent être mises à profit pour accomplir d’autres missions. Nous devrions tirer parti de cette diversité."
 ENG_royal_marines:0 "Royal Marines"
 ENG_royal_marines_desc:0 "Dominer les mers est une chose, mais parfois il faut aussi mouiller ses bottes. Une attention particulière doit être accordée à la formation et à l’équipement appropriés des Royal Marines."
 ENG_northern:0 "Focus septentrional"
 ENG_northern_desc:0 "Les pays scandinaves sont sans alliances et faibles. Nous devrions les inclure dans notre sphère afin d’empêcher que leurs bases ne soient utilisées contre nous."
 ENG_north_sea:0 "Manœuvres navales en mer du Nord"
 ENG_north_sea_desc:0 "Notre complaisance aurait pu causer notre perte si elle n’avait été corrigée. Nous devons montrer au monde que nous sommes une force avec laquelle il faut compter."
 ENG_north_fascism:0 "Soutenir les révolutionnaires fascistes"
 ENG_north_fascism_desc:0 "Inutile de faire la guerre aux pays scandinaves. Il leur suffit d’un petit coup de pouce dans la bonne direction pour que leurs intérêts s’alignent sur les nôtres."
 ENG_north_war:0 "Soutenir la guerre ouverte"
 ENG_north_war_desc:0 "Il est impossible de raisonner avec les nations scandinaves. Elles se bouchent les oreilles et refusent de renoncer à leurs voies démocratiques. La guerre ouverte est la seule option."
 ENG_denmark_revolution:0 "Révolution danoise"
 ENG_denmark_revolution_desc:0 "Le peuple danois a bien suivi notre exemple, et le moment est venu de reprendre leur pays à ceux qui cherchent à le détruire de l’intérieur."
 ENG_norway_revolution:0 "Révolution norvégienne"
 ENG_norway_revolution_desc:0 "Nos frères norvégiens sont prêts à se battre pour instaurer un régime fasciste en Norvège. Nous devons leur offrir tout le soutien possible."
 ENG_sweden_revolution:0 "Révolution suédoise"
 ENG_sweden_revolution_desc:0 "Les Suédois ont été accablés par la faiblesse depuis bien trop longtemps. Mais désormais, le peuple est prêt à redevenir fort."
 ENG_war_denmark:0 "Guerre contre le Danemark"
 ENG_war_denmark_desc:0 "Les Danois se sont montrés agaçants dans leur résistance à nos efforts diplomatiques, mais il est peu probable qu’ils fassent de même lorsque nous déclarerons la guerre."
 ENG_war_norway:0 "Guerre contre la Norvège"
 ENG_war_norway_desc:0 "Nos eaux septentrionales doivent être à l’abri de toute puissance étrangère. Des bases en Norvège nous aideront à maintenir notre suprématie."
 ENG_war_sweden:0 "Guerre contre la Suède"
 ENG_war_sweden_desc:0 "Nous ne pouvons plus permettre que les ressources suédoises servent à alimenter l’effort de guerre de nos ennemis. Ils comprendront rapidement leur erreur."
 ENG_war_finland:0 "Guerre contre la Finlande"
 ENG_war_finland_desc:0 "Bien que les Finlandais n’aient aucune sympathie pour le communisme, ils ont refusé de coopérer avec nous. Nous ne voyons pas d’autre option que de les forcer à entrer dans notre sphère."
 ENG_war_soviets:0 "Frapper le Komintern"
 ENG_war_soviets_desc:0 "Dire que les Soviétiques sont égarés serait un euphémisme. Le Komintern est une folie, et nous serons fiers de mener le monde à détruire le communisme à jamais."
 ENG_eastern:0 "Focus oriental"
 ENG_eastern_desc:0 "Les pays d’Europe de l’Est ont besoin de notre aide pour lutter contre les idéaux du communisme et de la démocratie ! Ils doivent être fiers de leur nation et travailler en étroite collaboration avec nous."
 ENG_draw_germany:0 "Se rapprocher de l’Allemagne"
 ENG_draw_germany_desc:0 "Les Allemands sont nos alliés naturels contre tous ceux qui nous veulent du mal. Nous devons leur montrer que nous irons jusqu’au bout."
 ENG_draw_poland:0 "Se rapprocher de la Pologne"
 ENG_draw_poland_desc:0 "L’histoire nous a montré que les Allemands sont nos ennemis naturels. Même si nous partageons les mêmes idéaux, ils ne sont pas dignes de confiance. La Pologne est un État fort qui pourrait être un allié utile contre la menace allemande."
 ENG_axis_help:0 "Coopération militaire allemande"
 ENG_axis_help_desc:0 "Les Allemands se préparent à la guerre depuis un certain temps et leur état-major pourrait nous apprendre une chose ou deux."
 ENG_woo_poland:0 "Alliance avec la Pologne"
 ENG_woo_poland_desc:0 "Mener une guerre sur deux fronts est difficile. Pour réussir contre les Allemands, ouvrir un second front est nécessaire. Heureusement pour nous, les Polonais sont prêts à rejoindre une alliance."
 ENG_war_poland:0 "Guerre contre la Pologne"
 ENG_war_poland_desc:0 "Nous partageons l’avis des Allemands : les Polonais ne méritent pas d’avoir leur propre État. Ces terres serviraient bien mieux sous notre influence."
 ENG_war_germany:0 "Guerre contre l’Allemagne"
 ENG_war_germany_desc:0 "La plus grande menace pour l’Empire britannique, ce sont les Allemands. Chaque seconde perdue les rend plus forts. Nous devons les éliminer au plus vite."
 ENG_belgium_war:0 "Attaquer la Belgique"
 ENG_belgium_war_desc:0 "Conquérir la Belgique nous donnerait un point d’appui sur le continent européen. Il est clair que l’amour entre l’Empire britannique et les Belges n’a jamais existé : cela sera donc facile à justifier."
 ENG_dutch_war:0 "Attaquer les Pays-Bas"
 ENG_dutch_war_desc:0 "Les Pays-Bas sont une épine dans notre flanc depuis bien trop longtemps. Ils devront se soumettre à notre puissance supérieure, qu’ils le veuillent ou non."
 uk_protect_suez_two:0 "Affirmer notre position en Égypte"
 uk_protect_suez_two_desc:0 "Le contrôle du canal de Suez fait partie des moyens par lesquels l’Empire britannique conserve sa maîtrise des mers. Perdre cette région serait catastrophique. Des mesures doivent être prises pour la fortifier."
 ENG_pressure_iraq:0 "Faire pression sur l’Irak"
 ENG_pressure_iraq_desc:0 "L’Irak s’est peu à peu éloigné de nous et il ne peut plus en être ainsi. Nous devons veiller à ce que ses intérêts s’alignent sur les nôtres."
 ENG_pressure_iran:0 "Faire pression sur l’Iran"
 ENG_pressure_iran_desc:0 "L’Iran s’est peu à peu éloigné de nous et il ne peut plus en être ainsi. Nous devons veiller à ce que ses intérêts s’alignent sur les nôtres."
 singapore_focus_two:0 "Fortifier Singapour"
 singapore_focus_two_desc:0 "Singapour doit rester notre principale base navale en Orient. Hong Kong pourrait tomber face aux Japonais, mais Singapour doit rester imprenable jusqu’à l’arrivée de la flotte principale, qui pourra alors vaincre l’ennemi de façon décisive."
 hongkong_focus_two:0 "Fortifier Hong Kong"
 hongkong_focus_two_desc:0 "Notre plan doit être plus audacieux et reposer sur une base beaucoup plus proche du Japon. Avec suffisamment de fortifications et d’infrastructures, Hong Kong jouera parfaitement ce rôle !"
 ENG_war_japan:0 "Frapper le Japon"
 ENG_war_japan_desc:0 "L’Empire impérial japonais continue de menacer nos possessions coloniales en Extrême-Orient. Nous ne leur permettrons plus de se renforcer à nos dépens."
 ENG_woo_japan:0 "Courtiser le Japon"
 ENG_woo_japan_desc:0 "La Royal Navy seule ne pourrait peut-être pas rivaliser avec l’US Navy, mais si nous renouvelions l’alliance anglo-japonaise…"
 ENG_mexico_fascism:0 "Soutenir l’Union synarchiste mexicaine"
 ENG_mexico_fascism_desc:0 "Nous avons travaillé en étroite collaboration avec le Mexique par le passé, et nous estimons qu’il est temps pour eux d’adopter la rhétorique nationaliste et de s’unir à nous pour combattre les États-Unis."
 ENG_mexico_revolution:0 "Révolution mexicaine"
 ENG_mexico_revolution_desc:0 "L’heure est venue ! Nous devons soutenir l’Union nationale synarchiste dans sa révolution contre tous ceux qui cherchent à contrôler le Mexique !"
 ENG_war_USA:0 "Attaquer les Américains"
 ENG_war_USA_desc:0 "Notre ancienne colonie pourrait bientôt devenir la nation la plus puissante que le monde ait jamais connue. La Grande Dépression les a affaiblis, mais chaque jour les voit se relever. Nous devons les frapper au plus vite, de peur qu’ils ne stoppent indéfiniment notre progression."
 ENG_ally_venezuela:0 "Alliance avec le Venezuela"
 ENG_ally_venezuela_desc:0 "Les capitalistes aux États-Unis et les communistes en Union soviétique contrôlent une grande partie du pétrole dont nous avons besoin pour faire tourner notre armée. Une alliance avec le Venezuela nous garantira de sécuriser son pétrole pour notre cause."

