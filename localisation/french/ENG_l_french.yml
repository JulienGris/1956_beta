  ENG_enforced_economic_reorganization_desc:0 "Réorganisation économique"
  ENG_challenge_stalinism:0 "Défier le stalinisme"
  ENG_challenge_stalinism_desc:0 "La doctrine de Staline est une tyrannie voilée de rouge !"
  ENG_dont_challenge_party_line:0 "Ne pas défier la ligne du parti"
  ENG_dont_challenge_party_line_desc:0 "Le parti a toujours raison ! L’Internationale nous mènera à la révolution mondiale !"
  ENG_revolutionary_scientific_congress:0 "Congrès scientifique révolutionnaire"
  ENG_revolutionary_scientific_congress_desc:0 "La révolution offre l’occasion unique de permettre aux scientifiques et aux travailleurs du monde entier de partager leurs connaissances et d’éradiquer la science réactionnaire appelée génétique."

  ENG_retake_the_african_jewel:0 "Reprendre le joyau africain"
  ENG_retake_the_african_jewel_desc:0 "Un Égypte indépendante représente un risque trop grand pour nos intérêts en Asie et en Afrique. Elle sera de nouveau placée sous notre contrôle."
  uk_egypt_focus:0 "Développement en Égypte"
  uk_egypt_focus_desc:0 "Les Égyptiens sont au cœur de nos intérêts en Afrique et en Méditerranée. Il est dans notre intérêt qu’ils disposent de capacités défensives propres, tout en maintenant de bonnes relations avec eux en prévision d’un conflit futur."
ENG_take_the_reactionaries_out_of_their_nest:0 "Déloger les réactionnaires de leur nid"
ENG_take_the_reactionaries_out_of_their_nest_desc:0 "Déloger les réactionnaires de leur nid"

ENG_anti_american_rhetoric:0 "Rhétorique anti-américaine"
ENG_anti_american_rhetoric_desc:0 "Rhétorique anti-américaine"

ENG_liberate_the_american_workers:0 "Libérer les travailleurs américains"

ENG_welcome_british_exiles:0 "Accueillir les exilés britanniques"
ENG_welcome_british_exiles_desc:0 "Accablés par les événements qui secouent la Grande-Bretagne et ayant souvent tout perdu, ils n’ont jamais perdu leur talent…"

ENG_recruit_volunteers:0 "Recruter des volontaires"
ENG_recruit_volunteers_desc:0 "L’afflux de réfugiés britanniques a amené beaucoup de gens prêts à se battre pour reconquérir la terre de leur enfance plutôt que de vivre à l’étranger."

ENG_british_agents:0 "Agents britanniques"
ENG_british_agents_desc:0 "Certains de ces réfugiés pourraient devenir d’excellents agents secrets."

ENG_landing_exercices:0 "Exercices de débarquement"
ENG_landing_exercices_desc:0 "Envahir à travers l’immensité de la mer n’est pas une tâche aisée : nous devons être certains d’être prêts technologiquement, logistiquement et moralement pour cette entreprise."

ENG_reclaim_the_british_isles_exile:0 "Reconquérir les îles [ENG.GetAdjective]"
ENG_reclaim_the_british_isles_exile_desc:0 "Les révolutionnaires ont profané la monarchie et le parlement, apportant tyrannie et misère au peuple [ENG.GetAdjective]. C’est notre devoir, en tant que membre du Commonwealth, de lutter pour la restauration de la Grande-Bretagne. La rumeur dit que le roi lui-même aurait déclaré qu’il était impatient de « reconquérir son héritage de naissance »."

# New stuff
ENG_northern_ireland_for_assistance:0 "[119.GetName] en échange d’une assistance"
ENG_northern_ireland_for_assistance_desc:0 "Avec des menaces qui pèsent partout dans le monde, il n’est pas dans notre intérêt de poursuivre notre différend frontalier avec [IRE.GetNameDef]. Peut-être pouvons-nous offrir le territoire disputé aux [IRE.GetAdjective] en échange de leur engagement total à nous assister."

ENG_secure_ireland:0 "Sécuriser [IRE.GetNonIdeologyName]"
ENG_secure_ireland_desc:0 "Un [IRE.GetNonIdeologyName] sous influence ou contrôle hostile servirait de point de départ parfait pour des attaques sur nos frontières terrestres, ce qui est totalement inacceptable. Nous avons accordé aux [IRE.GetAdjective] leur indépendance, mais nous pourrions tout aussi bien la leur retirer."

ENG_the_wartime_cabinet_committee:0 "Le comité du cabinet de guerre"
ENG_the_wartime_cabinet_committee_desc:0 "Des temps difficiles sont devant nous. Nous devons prendre toutes les mesures nécessaires pour que nos forces soient organisées et dirigées de manière efficace."

ENG_evacuate_colonial_assets:0 "Évacuer les avoirs coloniaux"
ENG_evacuate_colonial_assets_desc:0 "Maintenant que nos anciennes colonies tracent leur propre chemin, il est temps pour nous de récupérer nos investissements."

ENG_unify_the_isles:0 "Unifier les îles"
ENG_unify_the_isles_desc:0 "[ROOT.GetNonIdeologyName] doit être unifié ! La direction depuis Londres sera directe."

ENG_edward_viii:0 "Édouard VIII"
ENG_elisabeth_ii:0 "Élisabeth II"

r56_eng.5.t:0 "La mort de George VI"
r56_eng.5.desc:0 "George VI est mort tragiquement, plongeant la nation dans un profond chagrin. Lui qui nous guida à travers ces années difficiles restera dans la mémoire du peuple britannique. Il revient maintenant à la princesse Élisabeth de lui succéder et de porter la Couronne impériale d’État. Espérons qu’elle fera preuve des mêmes qualités qu’Élisabeth et Victoria. Vive la Reine !"
r56_eng.5.a:0 "Vive la Reine !"

r56_eng.6.t:0 "L’avenir de Terre-Neuve en question"
r56_eng.6.desc:0 "Avec la reprise des activités économiques en [NFL.GetNonIdeologyName], la question de son avenir revient au premier plan. Au début des années 1930, le pays, frappé de plein fouet par la Grande Dépression, demanda le retour à l’administration directe britannique en échange d’un soutien financier. Cet événement marqua la fin de l’ère du « gouvernement responsable ». Ce débat, interrompu par les années de guerre, refait surface. Le territoire est désormais à la croisée des chemins : il pourrait devenir son propre dominion ou être fédéré au Canada — ce qui, en pratique, serait une annexion."
r56_eng.6.a:0 "Le territoire doit être administré par le Canada"
r56_eng.6.b:0 "Restaurer le dominion [NFL.getAdjective]"

r56_eng.10.t:0 "Gilbert Stephenson"
r56_eng.10.d:0 "Lorsque Gilbert Stephenson prit sa retraite de la Royal Navy en 1929 avec le grade de contre-amiral, il était l’un des principaux experts britanniques en guerre anti-sous-marine. Quand la guerre éclata de nouveau, il fut rappelé au service. Malgré son âge (il était né en 1878), il resta en forme, énergique et capable d’appliquer son esprit incisif aux missions que l’Amirauté lui confia.\n\nHistoriquement, sa contribution majeure fut la gestion du centre d’entraînement des escortes à Tobermory (baie de Tobermory, illustrée ci-dessous), où lui et son équipe formèrent 911 navires à travers 1 132 cours. Il participa également à la coordination de l’évacuation de Dunkerque en 1940 et servit comme commodore sur plusieurs convois au début de la guerre.\n\nTobermory, sous la direction de Stephenson, joua un rôle crucial dans la bataille de l’Atlantique, permettant aux escortes d’être opérationnelles rapidement avec une formation efficace. Ses méthodes innovantes mais exigeantes influencèrent les procédures de formation de la Royal Navy après-guerre, tout en lui valant le surnom de « la Terreur de Tobermory »."
r56_eng.10.a:0 "Confier à Stephenson la mise en place de Tobermory"
r56_eng.10.b:0 "Donner à Stephenson un commandement en mer"

ENG_for_the_good_of_the_revolution_idea:1 "Pour le bien de la révolution"
ENG_for_the_good_of_the_revolution_idea_desc:1 "Tous doivent être prêts à faire des sacrifices de confort pour le bien de l’État. Le peuple [ROOT.getAdjective] gardera la tête haute face au rationnement, convaincu que cela assurera notre victoire finale."

newsmod.3.t:0 "L’Allemagne accepte l’Empire britannique dans l’Axe"
newsmod.3.d:0 "Au cours de l’année passée, les mouvements fascistes ultra-nationalistes ont explosé en Grande-Bretagne. La voie démocratique est devenue minoritaire tandis que la nation embrasse le fascisme. De plus, les Britanniques ont décidé de rejoindre une alliance avec Hitler et le Reich allemand, menaçant ainsi la stabilité de l’Europe. Les dominions ont également été contraints de rejoindre l’Axe, mais ils sont réticents et estiment que le moment est venu de prendre leurs distances avec la Grande-Bretagne…"
newsmod.3.a:0 "Un véritable tournant dans notre histoire !"
newsmod.3.b:0 "Bienvenue à nos amis britanniques !"
newsmod.3.c:0 "Nous n’acceptons pas cela !"
newsmod.3.e:0 "Inquiétant."


englandmod.1.t:0 "L’Angleterre demande à rejoindre l’Axe"
englandmod.1.d:0 "Un représentant de [ENG.GetName] vient d’arriver. [ENG.GetName], récemment traversée par un puissant mouvement ultra-nationaliste, souhaite rejoindre le Reich et l’Axe pour guider l’avenir du monde."
englandmod.1.a:0 "Accepter"
englandmod.1.b:0 "Refuser"

englandmod.5.t:0 "Les Britanniques exigent notre annexion"
englandmod.5.d:0 "Un délégué britannique est arrivé ce matin à Dublin. Les effets du mouvement ultra-nationaliste en Grande-Bretagne atteignent enfin notre seuil : Londres exige notre annexion immédiate. Nous ignorons si les Français ou les Américains viendront à notre secours, et devons prendre une décision difficile."
englandmod.5.a:0 "Céder à leurs exigences."
englandmod.5.b:0 "Pas question."

englandmod.6.t:0 "L’Irlande cède !"
englandmod.6.d:0 "Notre délégué de Dublin est revenu avec une excellente nouvelle ! Les faibles Irlandais ont accepté notre exigence d’annexion immédiate. Nous pouvons désormais passer à la prochaine étape de notre plan."
englandmod.6.a:0 "Un choix judicieux."

englandmod.7.t:0 "L’Irlande refuse nos exigences !"
englandmod.7.d:0 "Dans une ultime tentative pathétique de bravoure, le gouvernement irlandais a refusé notre demande d’annexion. Pire encore, ils ont décidé de mobiliser leurs forces armées en cas d’attaque britannique."
englandmod.7.a:0 "Sont-ils suicidaires ?"

englandmod.8.t:0 "Les Britanniques proposent une alliance"
englandmod.8.d:0 "Un délégué britannique est arrivé ce matin à Lisbonne. Comme si leur ingérence dans la politique espagnole ne suffisait pas, ils cherchent désormais à influencer la nôtre en nous proposant une alliance."
englandmod.8.a:0 "Nous acceptons !"
englandmod.8.b:0 "Nous n’y prendrons aucune part."

englandmod.9.t:0 "Le Portugal accepte !"
englandmod.9.d:0 "Le Portugal a accepté notre proposition d’alliance ! Une fois de plus, Portugais et Britanniques se tiennent côte à côte face à leurs adversaires !"
englandmod.9.a:0 "Hourra !"

englandmod.10.t:0 "Le Portugal refuse !"
englandmod.10.d:0 "Le Portugal a refusé notre offre d’alliance ! Ils se révèlent inutiles à notre cause."
englandmod.10.a:0 "Qui n’est pas avec nous est contre nous."

englandmod.11.t:0 "Les Britanniques proposent une alliance"
englandmod.11.d:0 "Un délégué britannique est arrivé ce matin à Rome. Les Britanniques concentrent désormais leurs efforts sur la Méditerranée et souhaitent proposer une alliance. Cependant, accepter pourrait compromettre certaines de nos revendications..."
englandmod.11.a:0 "Nous acceptons !"
englandmod.11.b:0 "Hors de question."

englandmod.12.t:0 "L’Italie accepte !"
englandmod.12.d:0 "L’Italie a accepté notre proposition d’alliance ! Ensemble, nous partagerons l’hégémonie !"
englandmod.12.a:0 "Hourra !"

englandmod.13.t:0 "L’Italie refuse !"
englandmod.13.d:0 "L’Italie a refusé notre proposition d’alliance ! Ils se révèlent inutiles à notre cause."
englandmod.13.a:0 "Qui n’est pas avec nous est contre nous."

englandmod.14.t:0 "Les Britanniques proposent une alliance"
englandmod.14.d:0 "Un délégué britannique est arrivé ce matin à Varsovie. Les Britanniques s’attendent à ce que l’Allemagne déclare tôt ou tard la guerre à l’un de ses voisins, probablement à nous. Ils proposent une alliance pour dissuader les Allemands, mais nous craignons qu’ils ne nous entraînent sur une voie sombre..."
englandmod.14.a:0 "Nous acceptons !"
englandmod.14.b:0 "Hors de question."

englandmod.15.t:0 "La Pologne accepte !"
englandmod.15.d:0 "La Pologne a accepté notre proposition d’alliance ! Ensemble, nous vaincrons les Allemands !"
englandmod.15.a:0 "Hourra !"

englandmod.16.t:0 "La Pologne refuse !"
englandmod.16.d:0 "La Pologne a refusé notre proposition d’alliance ! Ils se révèlent inutiles à notre cause."
englandmod.16.a:0 "Qui n’est pas avec nous est contre nous."

englandmod.17.t:0 "Proposition d’alliance britannique"
englandmod.17.d:0 "Un délégué britannique est arrivé hier à Tokyo. Les Britanniques estiment qu’un renouvellement de l’alliance anglo-japonaise profiterait aux deux pays. Songent-ils également à une guerre contre les États-Unis ?"
englandmod.17.a:0 "Nous acceptons de renouveler l’alliance."
englandmod.17.b:0 "Nous n’avons pas besoin d’eux."

englandmod.18.t:0 "Les Japonais acceptent !"
englandmod.18.d:0 "Bonne nouvelle ! Le Japon a accepté notre proposition d’alliance ! Avec nos forces combinées, les Américains tomberont à coup sûr !"
englandmod.18.a:0 "Hourra !"

englandmod.19.t:0 "Les Japonais refusent !"
englandmod.19.d:0 "Mauvaise nouvelle ! Le Japon a refusé notre proposition d’alliance. Ne comprennent-ils pas que le géant endormi va bientôt se réveiller ?"
englandmod.19.a:0 "Tant pis pour eux."

englandmod.20.t:0 "Proposition d’alliance britannique"
englandmod.20.d:0 "Un délégué britannique est arrivé hier à Caracas. Les Britanniques estiment qu’une alliance militaire entre nos deux nations serait mutuellement bénéfique. Songent-ils aussi à une guerre contre les États-Unis ?"
englandmod.20.a:0 "Nous acceptons de rejoindre !"
englandmod.20.b:0 "Non merci."

englandmod.21.t:0 "Le Venezuela accepte !"
englandmod.21.d:0 "Bonne nouvelle ! Le Venezuela a accepté notre offre d’alliance ! Ils seront un atout précieux comme base pour frapper l’hémisphère occidental."
englandmod.21.a:0 "Hourra !"

englandmod.22.t:0 "Le Venezuela refuse !"
englandmod.22.d:0 "Mauvaise nouvelle ! Le Venezuela a refusé notre offre d’alliance. Ne comprennent-ils pas que le géant endormi va bientôt se réveiller ?"
englandmod.22.a:0 "Peu importe."

englandmod.23.t:0 "Le statut du fascisme anglais"
englandmod.23.d:0 "Bien que nos anciens maîtres anglais aient tenté d’imposer le fascisme à notre pays, nous ne sommes plus obligés de tolérer cette ingérence. Devons-nous éliminer l’influence fasciste introduite par les Britanniques ?"
englandmod.23.a:0 "Oui, il est temps de se débarrasser de cette idéologie ridicule."
englandmod.23.b:0 "Non merci, j’aime bien le fascisme."

