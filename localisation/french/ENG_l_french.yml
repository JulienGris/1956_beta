  ENG_admiralty_naval_staff:0 "État-major de la Royal Navy"
  ENG_royal_family_remnants:0 "Vestiges de la famille royale"
  ENG_royal_family_remnants_desc:0 "Alors que la plupart des membres de la famille royale ont été exécutés par ces démons communistes, il reste toujours un héritier, impatient de se débarrasser de ce nouveau parlement fantoche et de restaurer le trône britannique."
  ENG_mi6_ns:0 "MI6"

  #Events
  englandmod.99.t:0 "Archibald Wavell arrive en Inde"
  englandmod.99.d:0 "Le général Archibald Wavell vient d’être promu pour prendre le commandement de l’armée des Indes britanniques. Il devrait arriver d’ici quelques jours."
  englandmod.99.a:0 "Bien compris."

  britain.25.t:0 "Le [ENG.GetName] propose une alliance"
  britain.25.d:0 "Avec les tensions croissantes à travers le monde et un climat de plus en plus dangereux, les [ENG.GetAdjective] et les [FRA.GetAdjective] sont parmi les derniers bastions de démocratie en Europe. À présent, [ENG.GetNameDef] a proposé une alliance entre nos deux nations.\n\nComment devons-nous répondre ?"
  britain.25.a:0 "Unis, nous résistons."
  britain.25.b:0 "Nous n’avons pas besoin des [ENG.GetAdjective]."

  britain.26.t:0 "Les [FRA.GetName] acceptent notre alliance"
  britain.26.d:0 "« L’histoire a montré tout ce que nos grandes nations pouvaient accomplir côte à côte. Dans l’esprit de l’Entente cordiale, nous sommes fiers de vous accueillir non seulement comme amis, mais comme Alliés. Ensemble, nous serons un phare de liberté dans un monde assombri par les ténèbres de l’oppression ! »\n\nNotre demande de rejoindre les [FRA.GetAdjective] a été acceptée. Nous pouvons compter sur leur plein soutien dans les temps troublés qui s’annoncent."
  britain.26.a:0 "Ensemble, nous tiendrons la ligne !"

  britain.27.t:0 "Les [FRA.GetName] refusent notre alliance."
  britain.27.d:0 "« Bien que nous ayons eu de bonnes relations par le passé, nous ne pouvons pas risquer une escalade avec les Allemands à notre frontière. Si nous devions être entraînés dans un nouveau conflit, cela engendrerait une autre guerre dévastatrice que nous ne pouvons nous permettre. La paix doit toujours rester l’objectif de toute nation démocratique. »\n\nNotre demande de rejoindre les [FRA.GetAdjective] a été refusée. Le gouvernement [FRA.GetAdjective] ne souhaite pas provoquer davantage [GER.GetNonIdeologyName] et ne mettra pas en péril la paix actuelle."
  britain.27.a:0 "Leur « paix » n’est qu’un autre mot pour « capitulation »."

  britain.28.t:0 "[ENG.GetNameDefCap] cherche une réconciliation diplomatique"
  britain.28.d:0 "[ENG.GetNameDefCap] nous a présenté un pacte de réconciliation malgré notre mépris mutuel. Les [ENG.GetAdjective] ont affirmé qu’en raison de notre ennemi commun, il est vital d’apprendre à coopérer via un pacte de non-agression et de mettre nos différends de côté, pour l’instant."
  britain.28.a:0 "Si c’est le prix à payer."
  britain.28.b:0 "Nous n’avons aucun intérêt pour de tels accords."

  britain.29.t:0 "[SOV.GetNameDefCap] accepte la réconciliation diplomatique"
  britain.29.d:0 "[SOV.GetNameDefCap] a accepté notre proposition de pacte de réconciliation, estimant que notre ennemi commun prime sur le mépris mutuel entre nos deux nations. Ils acceptent de coopérer avec nous dans les affaires les concernant et promettent en outre qu’il n’y aura pas d’hostilités entre nous d’ici là."
  britain.29.a:0 "Nous devrons travailler ensemble, pour l’instant."

  britain.30.t:0 "[SOV.GetNameDefCap] rejette la réconciliation diplomatique"
  britain.30.d:0 "[SOV.GetNameDefCap] a rejeté notre proposition de pacte de réconciliation et l’a écartée sans ménagement, affirmant que le mépris mutuel entre nos deux nations ne permettrait aucune coopération sincère. Les [SOV.GetAdjective] n’ont aucun intérêt à promettre l’absence d’hostilités entre nos nations."
  britain.30.a:0 "Ils sont aussi mauvais que nous le pensions."

  #Decisions
  ENG_weapons_purchases_category:1 "Acheter des armes [USA.GetAdjective]"
  ENG_weapons_purchases_category_desc:0 "Notre industrie ayant encore du retard à combler, se tourner vers l’étranger pour des armes modernes pourrait être le seul moyen de mettre nos forces armées au niveau."
