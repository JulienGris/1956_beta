l_french:
 saudi_focus:0 "Arbre de priorités de l’Arabie saoudite"

 SAU_solve_the_jafurah_dispute:0 "Résoudre le différend de Jafurah"
 SAU_solve_the_jafurah_dispute_desc:0 "Depuis la convention anglo-ottomane de 1913 et la fin de la Grande Guerre, la frontière anglo-saoudienne au sud-est n’a jamais été délimitée. Des négociations ont débuté dans les derniers mois de 1935, mais sans résultat : Ibn Saoud n’a pas cédé. Pour notre propre bien, concentrons-nous enfin sur la résolution du différend de Jafurah afin de régler au moins ce problème."
 SAU_reject_the_riyadh_line:0 "Rejeter la ligne de Riyad"
 SAU_reject_the_riyadh_line_desc:0 "Depuis la convention anglo-ottomane de 1913 et la fin de la Grande Guerre, la frontière anglo-saoudienne au sud-est n’a jamais été délimitée. Des négociations ont commencé fin 1935, mais les Britanniques ne nous proposèrent qu’un maigre ensemble de concessions, appelé « la ligne de Riyad ». Pour le bien de notre peuple, nous ne pouvons accepter « la ligne de Riyad » ni laisser les Britanniques dicter nos frontières !"
 SAU_improve_our_infrastructure:0 "Améliorer nos infrastructures"
 SAU_improve_our_infrastructure_desc:0 "Notre pays est jalonné de déserts et de hautes montagnes rocailleuses. Cela ne doit pas nous empêcher d’intégrer nos régions les plus rurales : améliorer nos infrastructures nous aidera à connecter la nation et son peuple."
 SAU_invite_foreign_investors:0 "Inviter des investisseurs étrangers"
 SAU_liberalize_the_market:0 "Libéraliser le marché"
 SAU_liberalize_the_market_desc:0 "Plus le marché est libre, plus le peuple l’est — dit-on. Pour nous rapprocher de l’Occident, nous devons libéraliser le marché et le rendre plus attractif pour les grandes entreprises telles qu’ARAMCO."
 SAU_placate_the_tribes:0 "Apaiser les tribus"
 SAU_placate_the_tribes_desc:0 "Nous ne devons jamais oublier ce que notre peuple traverse en ces temps difficiles, ni qui détient les véritables clés du pays : les chefs tribaux. Pour stabiliser la nation et rester au pouvoir, nous devons les apaiser comme il se doit."
 SAU_diplomacy_in_the_sand:0 "Diplomatie dans le sable"
 SAU_continue_hakimovs_legacy:0 "La proposition d’Hakimov"
 SAU_continue_hakimovs_legacy_desc:0 "Karim Hakimov, ami personnel du roi d’Arabie saoudite et diplomate de l’URSS, exerce une grande influence politique et sociale en [ROOT.GetNameDef]. Il propose un accord : une alliance avec l’Union soviétique et une idéologie nouvelle, fusion de notre système actuel et du stalinisme."
 SAU_seek_german_arms:0 "Chercher des armes [GER.GetAdjective]"
 SAU_seek_german_arms_desc:0 "Pour préserver notre neutralité, nous devons nous réarmer au mieux : personne ne respectera notre neutralité sans force militaire derrière. Il serait donc avisé de chercher des armes en [GER.GetNameDef] ; ils pourraient s’avérer de précieux alliés…"
 SAU_introduce_the_constitution:0 "Introduire la constitution de [GetYear]"
 SAU_introduce_the_constitution_desc:0 "Le mouvement constitutionnel a été plutôt faible durant toute l’existence de [ROOT.GetNameDef]. Toutefois, il s’est ravivé ces derniers mois et de plus en plus de voix réclament la rédaction d’une constitution."
 SAU_expand_the_riyadh_university:0 "Élargir l’université de Riyad"
 SAU_expand_the_riyadh_university_desc:0 "Un peuple éduqué est un peuple productif. Améliorer et agrandir l’université de Riyad nous aidera à sortir la nation de l’illétrisme."
 SAU_enocurage_the_hajj:0 "Encourager le hajj"
 SAU_enocurage_the_hajj_desc:0 "[ROOT.GetNameDefCap], qui contrôle deux des plus grandes villes saintes de l’islam, profite grandement des pèlerinages annuels de musulmans du monde entier accomplissant le hajj. Il pourrait être judicieux de l’encourager, voire de le taxer : plus de pèlerins, c’est plus de revenus."
 SAU_democraticize_the_administration:0 "Démocratiser l’administration"
 SAU_democraticize_the_administration_desc:0 "Bien que [ROOT.GetLeader] soit un réformateur prudent, il a confiance en son peuple — et son peuple a confiance en lui. Il s’efforcera toujours d’agir pour le bien commun ! Un mode de gouvernement démocratique sera donc instauré en [ROOT.GetNameDef], avec [ROOT.GetLeader] à sa tête."
 SAU_enforce_the_zakat:0 "Appliquer la zakat"
 SAU_enforce_the_zakat_desc:0 "La zakat est un pilier de l’islam : ceux qui le peuvent doivent contribuer financièrement aux pauvres et aux démunis. Une idée véritablement sociale — voire collectiviste — si l’on y pense ; et si nous l’appliquions strictement ?"
 SAU_reform_the_tax_system:0 "Réformer le système fiscal"
 SAU_reform_the_tax_system_desc:0 "Notre fiscalité est archaïque et inefficace. Pour le bien de la nation et du peuple, il serait sage de la réformer et de la moderniser."
 SAU_influence_the_king:0 "Influencer le roi"
 SAU_influence_the_king_desc:0 "Sous l’influence de Karim Hakimov et d’autres agents [SOV.GetAdjective] en [ROOT.GetNameDef], nous pourrions convertir [ROOT.GetLeader] en un authentique socialiste révolutionnaire — avec ses propres principes, bien sûr."
 SAU_enact_censorship:0 "Instaurer la censure des médias"
 SAU_enact_censorship_desc:0 "Nous devons cultiver le culte de la personnalité du roi : réprimer et censurer la presse anti-étatique et antimonarchiste pourrait nous y aider, transformant [ROOT.GetNameDef] en un véritable État réactionnaire et conservateur."
 SAU_five_year_plan:0 "Le plan quinquennal"
 SAU_five_year_plan_desc:0 "Une économie planifiée pourrait bénéficier à [ROOT.GetNameDef]… ou s’avérer inapplicable. Mais nous ne pourrons pas dire que nous avons essayé si nous n’essayons pas, n’est-ce pas ?"
 SAU_form_a_volunteer_force:0 "Former une force de volontaires"
 SAU_form_a_volunteer_force_desc:0 "Même si nous sommes officiellement neutres et non-alignés, nous ne pouvons empêcher nos citoyens de partir rejoindre des conflits étrangers, n’est-ce pas ?"
 SAU_autonomy_for_south_arabia:0 "Autonomie pour l’Arabie du Sud"
 SAU_autonomy_for_south_arabia_desc:0 "Il est crucial d’accorder une autonomie limitée aux populations d’Arabie du Sud : elles coopéreront plus volontiers à l’avenir et leur intégration à [ROOT.GetNameDef] sera facilitée."
 SAU_crush_the_golden_square:0 "Écraser le Carré d’or"
 SAU_crush_the_golden_square_desc:0 "Les fascistes du Carré d’or au nord doivent être écrasés pour notre sécurité — et celle de tout le Moyen-Orient !"
 SAU_develop_anti_tank_capabilities:0 "Développer des capacités antichars"
 SAU_develop_anti_tank_capabilities_desc:0 "Contrer les blindés ennemis avec nos propres canons antichars est crucial pour défendre notre sol."
 SAU_concessions_to_standard_oil:0 "Concessions à Standard Oil of California"
 SAU_concessions_to_standard_oil_desc:0 "Par le passé, nous avons signé avec Standard Oil California des accords de concession pour l’exploration pétrolière. À présent que nous avons découvert de grands gisements, ces accords peuvent être étendus à leur exploitation."
 SAU_deal_with_bp:0 "Accord avec BP"
 SAU_deal_with_bp_desc:0 "Par le passé, nous avions conclu des concessions avec Standard Oil California pour l’exploration pétrolière. Maintenant que de larges réserves ont été découvertes, il pourrait être avisé d’inviter la British Petroleum Company à en assurer l’exploitation."
 SAU_force_tribes_to_settle:0 "Contraindre les tribus à se sédentariser"
 SAU_force_tribes_to_settle_desc:0 "Le nomadisme appartient au passé. Nous devrions obliger nos tribus itinérantes à se fixer dans des villes afin de faciliter l’administration et d’accroître le potentiel industriel."
 SAU_invite_brabag:0 "Inviter Brabag"
 SAU_invite_brabag_desc:0 "Par le passé, nous avons accordé des concessions à Standard Oil California pour l’exploration. À présent que de grands gisements ont été découverts, il peut être bénéfique d’inviter la Braunkohle-Benzin AG allemande à reprendre l’exploitation des champs pétrolifères."
 SAU_request_german_reinforcements:0 "Demander des renforts allemands"
 SAU_request_german_reinforcements_desc:0 "En invitant des compagnies pétrolières allemandes à exploiter nos nouveaux gisements, nous nous sommes attiré des inimitiés. Nous pouvons demander à l’Allemagne des renforts pour protéger nos intérêts communs."
 SAU_provide_shelter_for_fritz_gobba:0 "Abriter Fritz Grobba"
 SAU_provide_shelter_for_fritz_gobba_desc:0 "Fritz Grobba a été expulsé d’Irak après avoir attisé le sentiment antibritannique dans le pays. Son implication dans l’attaque d’un oléoduc britannique l’a contraint à l’exil. Il trouvera chez nous un accueil chaleureux."
 SAU_move_toward_german_alignment:0 "S’aligner sur l’Axe"
 SAU_move_toward_german_alignment_desc:0 "Les Britanniques se mêlent du Moyen-Orient depuis trop longtemps. Il est temps que cela change. Alignons-nous sur l’Allemagne pour chasser les envahisseurs du monde arabe."
 SAU_support_from_loyal_tribes:0 "Soutien des tribus loyales"
 SAU_support_from_loyal_tribes_desc:0 "En accordant des terres aux tribus loyales, nous pouvons garantir leur fidélité durable."
 SAU_western_alignment:0 "Alignement occidental"
 SAU_western_alignment_desc:0 "Les Britanniques furent nos alliés durant la Grande Guerre, nous aidant à chasser les Ottomans d’Arabie. Une fois encore, un ennemi commun nous réunira."
 SAU_the_unifier:0 "Le Unificateur"
 SAU_the_unifier_desc:0 "Ibn Saoud mena plus de trois siècles de conquêtes : d’abord la reprise de Riyad, la ville de ses ancêtres, puis la consolidation d’une grande partie de l’Arabie sous son règne, donnant naissance au troisième État saoudien, le royaume d’Arabie saoudite."
 SAU_our_rightful_domain:0 "Notre domaine légitime"
 SAU_our_rightful_domain_desc:0 "La crainte du grand empire britannique nous força à accepter sa présence humiliante dans bien des terres que nous rêvions d’intégrer. Il est temps de réparer cette injustice."
 SAU_request_german_guns:0 "Demander le soutien [GER.GetAdjective]"
 SAU_request_german_guns_desc:0 "En sollicitant du matériel et du savoir-faire allemands, nous améliorerons nos capacités durant le conflit."
 SAU_increase_oil_exports_to_the_allies:0 "Exporter du pétrole aux Alliés"
 SAU_increase_oil_exportations_to_the_allies:0 "Exporter du pétrole aux Alliés"
 SAU_increase_oil_exportations_to_the_allies_desc:0 "La demande croissante de pétrole des Alliés nous offre une occasion lucrative. Accroître notre production pour répondre à cette demande nous bénéficiera financièrement sur le long terme."
 SAU_USS_quincy_meeting:0 "Entretien à bord de l’USS Quincy"
 SAU_USS_quincy_meeting_desc:0 "Nous avons invité des conseillers navals et militaires américains pour nous aider à moderniser nos forces armées."
 SAU_maintain_international_neutrality:0 "Maintenir la neutralité internationale"
 SAU_maintain_international_neutrality_desc:0 "L’Arabie se porte mieux seule sur la scène mondiale. Évitons de prendre parti dans des conflits qui ne nous concernent pas."

 saudi.1.t:0 "L’Arabie saoudite demande des troupes"
 saudi.1.d:0 "Arguant de la nécessité de protéger les concessions pétrolières et du fait que le gouvernement saoudien est entouré de potentiels ennemis de l’Allemagne, celle-ci demande l’envoi de troupes sur leur territoire afin de garantir leur souveraineté, leur défense et la protection des intérêts allemands."
 saudi.1.a:0 "Nous ne pouvons pas perdre ce pétrole"
 saudi.1.b:0 "Nos troupes resteront au pays"

 saudi.2.t:0 "L’Allemagne accepte d’envoyer des troupes"
 saudi.2.d:0 "Le gouvernement allemand a accepté d’envoyer cinq divisions pour aider notre armée à défendre notre territoire."
 saudi.2.a:0 "Excellent"

 saudi.3.t:0 "L’Allemagne refuse d’envoyer des troupes"
 saudi.3.d:0 "Invoquant notamment la priorité donnée à la défense de son propre territoire, l’Allemagne a refusé d’envoyer des troupes pour défendre l’Arabie saoudite."
 saudi.3.a:0 "Nous devrons nous défendre seuls"

 ############################
 #######LOCALISATION ARMÉE###
 ############################

 SAU_army_focus_1:0 "L’armée saoudienne"
 SAU_army_focus_1_desc:0 "Il est temps de lancer des programmes et d’allouer des ressources pour améliorer notre technologie et les performances de notre armée."

 SAU_army_infantry:0 "Améliorer notre armement"
 SAU_army_infantry_desc:0 "L’équipement de notre infanterie doit être modernisé pour de meilleures performances ; nous devons investir dans de nouveaux modèles."

 SAU_army_infantry_desert:0 "Équipement désertique"
 SAU_army_infantry_desert_desc:0 "L’armée saoudienne doit être solidement préparée au combat dans l’environnement naturel de l’Arabie — le désert. Donnons à nos soldats l’équipement nécessaire à cette tâche."

 SAU_artillery:0 "Accroître notre puissance de feu"
 SAU_artillery_desc:0 "Nos forces doivent disposer de pièces d’artillerie adéquates pour rivaliser avec les nations du monde."

 SAU_land_doctrine1:0 "Nouvelles tactiques"
 SAU_land_doctrine1_desc:0 "Innovons dans nos tactiques militaires pour renforcer l’ensemble de l’appareil militaire saoudien."

 SAU_desert_buff:0 "Spécialisation désertique saoudienne"
 SAU_desert_buff_desc:0 "Redoublons d’efforts pour préparer véritablement l’armée saoudienne au combat dans l’environnement naturel de l’Arabie."

 SAU_yemen_lessons:0 "Étudier la guerre de 1934"
 SAU_yemen_lessons_desc:0 "Souvenons-nous de notre expérience de la guerre contre le Yémen en 1934 et commençons à adopter des tactiques nouvelles qui nous prépareront mieux à une situation similaire."

 SAU_strengthen_weakness:0 "Notre revers au Yémen"
 SAU_strengthen_weakness_desc:0 "L’un des rares avantages des Yéménites en 1934 fut l’expérience de leurs troupes en montagne. Mettons en place des mesures pour mieux préparer nos soldats à ce type de terrain."

 SAU_romanticize_army:0 "Valoriser le service militaire"
 SAU_romanticize_army_desc:0 "Faisons du service militaire une aventure prestigieuse : cela encouragera toujours plus d’engagements."

 SAU_military_academies:0 "Créer des académies militaires"
 SAU_military_academies_desc:0 "L’expertise et la bravoure militaires de nos ancêtres se sont estompées ; remettons à l’honneur la planification et le savoir-faire tactique arabes."

 SAU_cavalry_focus:0 "L’ancienne cavalerie"
 SAU_cavalry_focus_desc:0 "La cavalerie arabe et les chevaux sont encore employés en grand nombre, au détriment de doctrines plus récentes. Modernisons activement notre cavalerie."

 SAU_incorporate_nomad_tactics:0 "Intégrer les tactiques de cavalerie nomade"
 SAU_incorporate_nomad_tactics_desc:0 "Les tactiques nomades des tribus arabes peuvent nous être utiles si nous théorisons des moyens de les intégrer aux doctrines militaires modernes."

 SAU_special_forces_focus:0 "Forces spéciales saoudiennes"
 SAU_special_forces_focus_desc:0 "Nous devons concentrer de grands efforts sur la formation d’hommes dépassant les limites de la guerre conventionnelle — des hommes que les autres nations craignent. Nos forces spéciales doivent compter parmi les meilleures au monde."

 SAU_motorization:0 "Motoriser l’armée"
 SAU_motorization_desc:0 "Prenons des mesures pour doter l’armée saoudienne de moyens motorisés afin de rivaliser avec les autres puissances, y compris européennes."

 SAU_tank_focus:0 "De l’acier sous le soleil"
 SAU_tank_focus_desc:0 "Nous devons investir dans la conception de chars capables de rivaliser avec ceux des puissances européennes."

 SAU_tank_innovations:0 "Innovations en matière de chars"
 SAU_tank_innovations_desc:0 "N’ayant ni la même capacité ni la même base industrielle que les puissances européennes pour produire autant de chars, travaillons à des méthodes de production fiables mais moins coûteuses."

 SAU_general_army_buff:0 "Armée saoudienne revigorée"
 SAU_general_army_buff_desc:0 "Nous sommes sur le point d’achever la création d’une armée saoudienne puissante et revigorée grâce aux efforts consentis dans notre doctrine et nos technologies."

 SAU_desert_buff1:0 "Spécialisation désertique saoudienne"
 SAU_desert_buff1_desc:0 "L’armée saoudienne est fortement préparée au combat dans les environnements désertiques."

 SAU_romanticize_army1:0 "Service militaire idéalisé"
 SAU_romanticize_army1_desc:0 "Le peuple saoudien considère l’engagement et le combat au sein de l’armée comme une entreprise noble et inspirante."

 SAU_tank_innovations1:0 "Innovations en matière de chars"
 SAU_tank_innovations1_desc:0 "Nous avons mis au point de nouvelles méthodes, plus économiques, de production des chars."

 SAU_general_army_buff1:0 "Armée saoudienne revigorée"
 SAU_general_army_buff1_desc:0 "Grâce à nos efforts en matière de technologies et de doctrine, l’armée saoudienne est désormais une force de combat puissante et revigorée."

 SAU_incorporate_nomad_tactics1:0 "Tactiques nomades intégrées"
 SAU_incorporate_nomad_tactics1_desc:0 "Nous avons intégré des éléments de la guerre nomade arabe à notre doctrine militaire moderne."

 SAU_encourage_general_creativity:0 "Encourager de nouvelles tactiques d’infanterie"
 SAU_encourage_general_creativity_desc:0 "Donnons davantage de liberté à nos généraux au lieu de nous en tenir aux anciennes tactiques arabes, la guerre ayant changé de nature."

 SAU_creative_generals:0 "Généraux créatifs"
 SAU_creative_generals_desc:0 "Nos généraux disposent d’une plus grande latitude pour juger de la bonne marche à suivre."

 SAU_support_companies:0 "Compagnies de soutien"
 SAU_support_companies_desc:0 "Nous devons œuvrer à l’intégration de compagnies de soutien dans notre armée."

 SAU_radio_innovations:0 "Innovations radio"
 SAU_radio_innovations_desc:0 "Nous connaissons déjà l’importance de la radio dans la guerre ; renforçons maintenant son emploi par l’armée saoudienne."

 SAU_radio_innovations1:0 "Innovations radio"
 SAU_radio_innovations1_desc:0 "Nous avons renforcé l’usage de la radio au sein de l’armée saoudienne."

 #############################
 SAU_2_Invite_the_Soviet_oil_barons:0 "Inviter des compagnies pétrolières soviétiques"
 SAU_2_Invite_the_Soviet_oil_barons_desc:0 "Un changement de cap s’impose. Les Soviétiques pourront nous aider à nous industrialiser."
 SAU_change_law:0 "Mobilisation économique"
 SAU_change_law_desc:0 "Il est temps de sortir de notre isolement et de nous tourner vers l’extérieur."
 SAU_request_soviet_investment:0 "Demander des investissements soviétiques"
 SAU_request_soviet_investment_desc:0 "Nos alliés soviétiques devraient pouvoir nous aider dans nos efforts de modernisation."
 SAU_communmism_001:0 "Poursuivre l’action de Karim Hakimov"
 SAU_communmism_001_desc:0 ""
 SAU_arabian_spring:0 "Notre propre voie"
 SAU_arabian_spring_desc:0 "Notre indépendance diplomatique est primordiale !"
 SAU_restore_constitutionalism:0 "Une constitution arabienne"
 SAU_restore_constitutionalism_desc:0 "L’élargissement du Conseil de la shura s’est avéré un grand succès. Nous pourrions envisager d’évoluer vers une monarchie constitutionnelle."
 SAU_restore_the_caliphate:0 "L’esprit des Ikhwan"
 SAU_restore_the_caliphate_desc:0 "Le califat fut dissous par Mustafa Kemal Atatürk après la guerre d’indépendance turque. Nous ne le rétablirons peut-être pas, mais nous pouvons rallumer le mouvement Ikhwan pour affermir notre domination et rallier le monde musulman."
 SAU_invite_western_advisors:0 "Inviter des conseillers occidentaux"
 SAU_invite_western_advisors_desc:0 "Inviter des conseillers occidentaux."
 SAU_join_the_comintern:0 "Rejoindre le Komintern"
 SAU_join_the_comintern_desc:0 "Demandons aux Soviétiques de nous admettre au Komintern."
 SAU_political_correctness:0 "Commissaires politiques"
 SAU_political_correctness_desc:0 "Introduire une structure politico-militaire à la [SOV.GetAdjective] assurera stabilité et meilleure organisation du politique comme du militaire."
 SAU_ussr_four_year_plan:0 "Le plan quadriennal"
 SAU_ussr_four_year_plan_desc:0 "Il faut élaborer un nouveau plan pour accélérer l’industrialisation du pays."
 SAU_deterrence:0 "Dissuasion"
 SAU_deterrence_desc:0 "La neutralité ne se maintient qu’au fil de l’épée. Préparons la défense de nos frontières : forts et bunkers feront réfléchir deux fois tout agresseur potentiel."
 SAU_spread_islam_force:0 "Propager l’islamisme"
 SAU_spread_islam_force_desc:0 "Nous devons diffuser la parole de l’islam auprès de nos sujets. Une fois la vérité comprise, ils accepteront plus facilement notre autorité."
 SAU_destabilize_the_east:0 "Déstabiliser le Moyen-Orient"
 SAU_destabilize_the_east_desc:0 "L’accord Sykes-Picot a découpé le Moyen-Orient entre Britanniques et Français. Il est temps d’y mettre fin !"
 SAU_ask_british_colonies:0 "Réclamer les colonies arabiennes"
 SAU_ask_british_colonies_desc:0 "La Grande-Bretagne possède plusieurs territoires en Arabie. Nous devrions demander qu’ils nous soient justement restitués."
 SAU_awoken_generation:0 "Génération éveillée"
 SAU_awoken_generation_desc:0 "Une nouvelle génération se lève en Arabie : progressistes et libéraux. Finis les jours de l’autocratie et du despotisme."
 SAU_old_traditions:0 "Rétablir les anciennes traditions"
 SAU_old_traditions_desc:0 "Les traditions sont vitales, surtout pour les Arabes. Préservons autant que possible nos traditions et notre culture."
 SAU_war_with_yemen_and_oman:0 "Unifier l’Arabie"
 SAU_war_with_yemen_and_oman_desc:0 "Nos jeunes voisins pensent pouvoir rester indépendants. Ils se trompent : aucun petit chef tribal ne peut s’opposer au rêve d’une péninsule arabique unifiée."
 SAU_attack_iran:0 "De l’autre côté du golfe Persique"
 SAU_attack_iran_desc:0 "Les Iraniens représentent une menace constante. Frappons les premiers avant qu’ils ne deviennent trop puissants."
 SAU_attack_turkey:0 "Dominer l’Anatolie"
 SAU_attack_turkey_desc:0 "Les Ottomans contrôlaient autrefois la majeure partie des côtes arabes. Il est temps de prendre notre revanche !"
 SAU_claim_the_sinai:0 "Revendiquer le Sinaï"
 SAU_claim_the_sinai_desc:0 "Les Britanniques détiennent le monopole sur le canal de Suez. Nous pourrions réclamer la péninsule du Sinaï pour revendiquer un contrôle partiel du canal. Ils refuseront sans doute, ce qui nous donnerait un casus belli."
 SAU_establish_labor_camps:0 "Établir des camps de travail"
 SAU_establish_labor_camps_desc:0 "La mise en place de camps de travail, où des citoyens fournissent un service prolongé à l’industrie, garantira la capacité nécessaire pour soutenir notre pays et nos guerres."
 SAU_integrate_yemen:0 "Intégrer [YEM.GetNonIdeologyName]"
 SAU_integrate_aden:0 "Intégrer [659.GetName]"
 SAU_integrate_oman:0 "Intégrer [OMA.GetNonIdeologyName]"
 SAU_integrate_syria:0 "Intégrer [SYR.GetNonIdeologyName]"
 SAU_integrate_palestine:0 "Intégrer [PAL.GetNonIdeologyName]"
 SAU_integrate_jordan:0 "Intégrer [JOR.GetNonIdeologyName]"
 SAU_integrate_qatar:0 "Intégrer [QAT.GetNonIdeologyName]"
 SAU_integrate_bahrain:0 "Intégrer [BHR.GetNonIdeologyName]"
 SAU_integrate_dubai:0 "Intégrer [UAE.GetNonIdeologyName] dans [JOR.GetNonIdeologyName]"
 SAU_claim:0 "Expansionnisme saoudien"

 SAU_camelry_expertise:0 "Expertise en cavalerie chamelière"
