 SAU_oil_production_increases:0 "Hausse de la production pétrolière à [859.GetName]"
 SAU_oil_production_increases_desc:0 "Pas à pas, la production pétrolière à [859.GetName] augmentera, année après année, jour après jour, jusqu’à faire de [ROOT.GetNameDef] l’un des plus grands exportateurs de pétrole au monde !"
 SAU_the_oil_industry:0 "L’industrie pétrolière [ROOT.GetAdjective]"
 SAU_the_oil_industry_desc:0 "Après la découverte de gisements à [859.GetName], de nombreuses sociétés étrangères affluent vers [ROOT.GetNameDef], achetant des terres près des puits et stimulant grandement l’économie [ROOT.GetAdjective]. Cela fera aussi de [ROOT.GetNameDef] un allié stratégique de premier plan."
