 #Décisions
 SAU_east_destabilized:0 "Le Printemps arabe"
 SAU_east_destabilized_desc:0 "Depuis mille ans, les fidèles du message de Muhammad attendent. Depuis mille ans, ils aspirent à l’indépendance et à la liberté pour tous les Arabes, et pour les musulmans. Depuis mille ans, ils souffrent sous le joug d’empires et d’armées. Après mille ans, notre heure est enfin venue…"
 SAU_east_destabilized_tt:0 "Ces décisions nous permettront de §Yprovoquer des rébellions§! dans les pays §Yarabes§!."

