 ARAB_expand_the_recruitment_pool:0 "Élargir le vivier de recrutement"
 ARAB_expand_the_recruitment_pool_desc:0 "Abaisser le seuil d’entrée dans l’armée peut s’avérer nécessaire si nous voulons prendre l’avantage et l’emporter."

 #Événements
 arabia.1.t:0 "L’Arabie réclame nos colonies"
 arabia.1.d:0 "Aujourd’hui, le diplomate saoudo-arabien Ahmut al Pasha nous a apporté une proposition de leur roi : placer nos colonies de la péninsule Arabique sous leur contrôle. Après les récentes découvertes de pétrole dans la région, dire non signifierait risquer de ne plus en recevoir. Que faisons-nous ?"
 arabia.1.a:0 "Accepter la proposition"
 arabia.1.b:0 "Quelle audace !"

 arabia.2.t:0 "[FROM.GetName] a cédé à nos exigences"
 arabia.2.d:0 "Après des négociations amicales, [FROM.GetNameDef] a décidé de nous céder ses colonies de la péninsule Arabique en échange du droit d’exporter et d’exploiter le pétrole dans notre région."
 arabia.2.a:0 "L’Arabie est de nouveau entière !"

 arabia.3.t:0 "[FROM.GetName] rejette nos exigences"
 arabia.3.d:0 "[FROM.GetNameDefCap] a refusé nos demandes ; ils ne nous laissent d’autre choix que de mettre fin au commerce pétrolier avec eux et de prendre ces terres par la force."
 arabia.3.a:0 "Nous prendrons ce qui nous revient !"

 arabia.4.t:0 "Découverte de pétrole en quantités commerciales"
 arabia.4.d:0 "Après cinq années de forages infructueux, le puits n°7 a finalement atteint du pétrole le 3 mars 1938. Cette découverte fut la première d’une longue série, révélant in fine la plus grande réserve de pétrole brut au monde. Elle allait bouleverser durablement les relations politiques au Moyen-Orient."
 arabia.4.a:0 "Intéressant"
 arabia.4.b:0 "C’est de l’or noir !"

 arabia.6.t:0 "Invitation de l’Arabie"
 arabia.6.d:0 "Aujourd’hui, le diplomate du Califat arabe Mehmet al Pasha nous a présenté une proposition : former une alliance défensive entre nos pays islamiques."
 arabia.6.a:0 "Nous acceptons !"
 arabia.6.b:0 "Nous resterons seuls !"

 arabia.7.t:0 "[PER.GetNameDef] rejoint notre pacte"
 arabia.7.d:0 "Chercher des alliés en ces temps imprévisibles est une sage décision. Nous, fils de Muhammad, devons rester unis et répandre l’enseignement de l’islam à travers le monde."
 arabia.7.a:0 "Bienvenue !"

 arabia.8.t:0 "[PER.GetNameDef] rejette notre pacte"
 arabia.8.d:0 "L’Iran a refusé notre pacte."
 arabia.8.a:0 "Imbéciles"

 arabia.9.t:0 "Accord de concession pétrolière signé"
 arabia.9.d:0 "Aujourd’hui, après la signature d’un accord de concession pétrolière entre l’Arabie saoudite et la Standard Oil Company, deux géologues américains ont débarqué dans le petit port de Jubail. Ils sont venus ouvrir la prospection pétrolière dans la péninsule Arabique, relançant d’anciens forages et offrant du travail à nombre de nos concitoyens."
 arabia.9.a:0 "Un accord gagnant-gagnant"

 arabia.11.t:0 "L’Arabie nous invite"
 arabia.11.d:0 "Aujourd’hui, le diplomate du Califat arabe Mehmet al Pasha nous a présenté une proposition : former une alliance défensive entre nos pays islamiques."
 arabia.11.a:0 "Nous acceptons !"
 arabia.11.b:0 "Nous resterons seuls !"

 arabia.12.t:0 "[TUR.GetNameDef] rejoint notre pacte"
 arabia.12.d:0 "Après réception de notre proposition, la Turquie a accepté notre invitation."
 arabia.12.a:0 "Bienvenue, frères !"

 arabia.13.t:0 "[TUR.GetNameDef] rejette notre pacte"
 arabia.13.d:0 "La Turquie a refusé notre pacte."
 arabia.13.a:0 "Imbéciles"

 arabia.17.t:0 "L’Arabie réclame le Sinaï"
 arabia.17.d:0 "Aujourd’hui, le diplomate saoudo-arabien Ahmut al Pasha nous a transmis une demande de leur roi : ils exigent que nous leur cédions le contrôle de la péninsule du Sinaï. Il est clair qu’ils cherchent à accroître leur emprise sur le canal de Suez. Que faisons-nous ?"
 arabia.17.a:0 "Cela évitera un conflit."
 arabia.17.b:0 "Certainement pas !"

 arabia.18.t:0 "Les Britanniques ont cédé à nos exigences"
 arabia.18.d:0 "Après des négociations tendues, la Grande-Bretagne a décidé de nous céder la péninsule du Sinaï en échange d’un pacte de non-agression."
 arabia.18.a:0 "Parfait !"

 arabia.19.t:0 "La Grande-Bretagne rejette nos exigences"
 arabia.19.d:0 "Les Britanniques ont refusé nos demandes ; ils ne nous laissent pas d’autre choix que de prendre ces terres par la force."
 arabia.19.a:0 "Nous prendrons ce qui nous revient !"

 arabia.20.t:0 "Le différend de Jafurah"
 arabia.20.d:0 "[FROM.GetLeader] a récemment revendiqué les terres de Jafurah, allant jusqu’à prétendre que certaines parties du Qatar appartiennent à [FROM.GetNameDef], sous prétexte qu’elles auraient été cédées par le cheikh du Qatar il y a quelque temps. Cependant, ce dernier a rejeté les revendications de [FROM.GetLeader]. La zone convoitée par les [SAU.GetAdjective]s est un désert stérile, à la population insignifiante. Il pourrait être dans notre intérêt de céder à leurs demandes et, peut-être, qu’en temps voulu [FROM.GetNameDef] nous rendra la pareille."
 arabia.20.a:0 "Nous cèderons, pour cette fois…"
 arabia.20.b:0 "La ligne de Riyad : à prendre ou à laisser !"

 arabia.21.t:0 "Les [ENG.GetAdjective] cèdent"
 arabia.21.d:0 "Après des négociations méticuleuses et tendues, dans le prolongement de celles de 1935, le différend de Jafurah a été réglé : [FROM.GetNameDef] a cédé et accordé à [ROOT.GetNameDef] la propriété légale du désert de Jafurah. Une grande victoire stratégique pour [ROOT.GetLeader]."
 arabia.21.a:0 "L’Arabie, toujours plus proche de l’unité…"

 arabia.22.t:0 "Les [ENG.GetAdjective] refusent"
 arabia.22.d:0 "Après des négociations minutieuses et tendues, dans le prolongement de celles de 1935, le différend de Jafurah n’a fait que se prolonger : [FROM.GetLeader] a déclaré qu’ils n’iront pas au-delà de la ligne de Riyad."
 arabia.22.a:0 "Ces salauds !"

 arabia.23.t:0 "Découverte de pétrole à [859.GetName]"
 arabia.23.d:0 "On nous informe que du pétrole a été découvert au puits n°7 de [859.GetName], il y a quelques jours à peine. D’après ARAMCO, la compagnie titulaire de la concession, « une réserve massive de pétrole a été découverte juste sous nos pieds », l’une des plus grandes — sinon la plus grande — de la région. Cette découverte apportera des bénéfices économiques et sociaux non seulement à [859.GetName], mais à l’ensemble de [ROOT.GetNameDef]. Avec cela en tête, [ROOT.GetNameDef] pourra s’élancer sur le marché mondial et devenir une puissance influente au Moyen-Orient."
 arabia.23.a:0 "Un grand jour pour la nation !"

