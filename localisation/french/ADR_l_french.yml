 #events

 andorra.1.t:0 "[ADR.GetName] demande des garanties"
 andorra.1.d:0 "Maintenant que notre guerre civile est terminée, [ADR.GetNameDef] s'adresse de nouveau à nous pour solliciter une protection politique et militaire, comme par le passé."
 andorra.1.a:0 "Nous aurons toujours des amis parmi le peuple [ADR.GetAdjective]."
 andorra.1.b:0 "Nous ne sommes plus intéressés par Andorre."
 andorra.2.t:0 "L'Espagne rétablit sa garantie"
 andorra.2.d:0 "Le gouvernement espagnol a accepté de rétablir sa garantie de protection militaire envers notre nation, comme autrefois."
 andorra.2.a:0 "L'amitié perdure."
 andorra.3.t:0 "L'Espagne refuse de rétablir sa garantie"
 andorra.3.d:0 "Le gouvernement espagnol a refusé de rétablir sa garantie de protection; il semble clair qu'il a d'autres projets."
 andorra.3.a:0 "Peut-être devrions-nous regarder ailleurs..."

