l_french:

RULE_HISTORICAL_LIE_AI_DESC:0 "Le Liechtenstein restera démocratique et neutre. Il cherchera à établir un commerce de l’or et à renforcer ses liens avec la Suisse."
LIE_AI_BEHAVIOR:0 "@LIE Liechtenstein"

#idées

LIE_liechtenstein_red_cross_idea:0 "La Croix-Rouge [ROOT.GetNonIdeologyName]"
LIE_franz_i:0 "Franz Ier"
LIE_franz_i_desc:0 "Bien que le prince de [LIE.GetNonIdeologyName] ne fasse que des visites occasionnelles dans sa principauté, il reste une figure populaire dans le pays et la population se réjouit de sa présence."
LIE_franz_ii:0 "Franz Joseph II"
LIE_franz_ii_desc:0 "Franz Joseph II est le premier prince [LIE.GetNonIdeologyName] à résider dans sa principauté à plein temps ; ainsi, il est extrêmement proche et populaire auprès de la population. Il est également perçu comme un grand unificateur, notamment au sein de l’establishment politique en période difficile."
LIE_czechoslovak_properties:0 "Biens [CZE.GetAdjective]"
LIE_customs_union_idea:0 "Union douanière de [LIE.GetNonIdeologyName]"
LIE_alaska_payments:0 "Paiements de l’Alaska"
LIE_legacy_of_1866:0 "Héritage de 1866"
LIE_legacy_of_1866_desc:0 "L’impopularité de la participation à la guerre austro-prussienne conduisit finalement à la dissolution de l’armée en 1868, et le pays n’a plus maintenu d’armée depuis. Ainsi, toute idée de réarmement au [LIE.GetNonIdeologyName] est loin d’être bien accueillie par la majorité de la population."
LIE_the_rotter_curse:0 "La malédiction Rotter"
LIE_the_rotter_curse_desc:0 "L’enlèvement des Rotter au début de 1933 par des sympathisants nazis a provoqué une onde de choc à travers [LIE.GetNonIdeologyName], le pays découvrant un niveau de violence politique jusqu’alors inédit. Mais en même temps, cela a permis au nazisme de s’implanter dans le pays, entraînant une augmentation inquiétante et progressive du soutien."
LIE_reintroduce_conscription_idea:0 "Conscription réintroduite"
LIE_production_quotas_idea:0 "Quotas de production"
LIE_royal_guard_idea:0 "Garde royale"
LIE_monarchist_support_idea:0 "Soutien monarchiste croissant"
LIE_monarchist_investment_idea:0 "Investissement [LIE.GetNameDef]"
LIE_monarchist_militias_idea:0 "Milices monarchistes"
LIE_growing_monarchist_army_support_idea:0 "Soutien militaire monarchiste"
LIE_liechtensteiner_autarky:0 "Autarcie [LIE.GetAdjective]"
LIE_foreign_recruitment_idea:0 "Recrutement étranger au [LIE.GetNonIdeologyName]"
LIE_foreign_recruitment_idea_desc:0 "Le [LIE.GetNameDefCap] diffuse des campagnes de propagande fascistes dans tout notre pays. Les plus naïfs de notre population se laissent convaincre de migrer vers la principauté afin de renforcer leurs rangs. Cela pourrait rapidement échapper à tout contrôle si aucune mesure n’est prise."

