LIE_embrace_the_white_russian_tradition_desc:0 "Depuis la chute des forces russes blanches en 1923, [ROOT.GetNameDef] est devenu un lieu d’exil idéal pour les anciens soldats et dirigeants. Bien que nous utilisions déjà les services de certains de leurs anciens commandants, il est temps d’assumer pleinement ce statut afin d’en tirer le maximum de bénéfices."
