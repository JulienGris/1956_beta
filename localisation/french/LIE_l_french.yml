#événements

liechtenstein.1.t:0 "Mort de François Ier"
liechtenstein.1.d:0 "Le peuple de [ROOT.GetNonIdeologyName] est en deuil après la mort prématurée de notre bien-aimé monarque, François Ier. La nouvelle de son décès s’est rapidement répandue dans tout le pays, et les rues sont remplies de gens qui lui rendent hommage et expriment leur chagrin.\n\nEn tant que dirigeant de notre pays depuis près d’une décennie, François Ier a été un pilier de force et de stabilité, nous guidant à travers certaines de nos périodes les plus difficiles, tout comme son prédécesseur Jean II. Sa disparition laisse un vide dans nos cœurs et dans notre gouvernement qui ne sera pas facilement comblé.\n\nLe petit-neveu de François, François-Joseph, lui succédera immédiatement sous le nom de François-Joseph II et reprendra les fonctions de son père en conséquence."
liechtenstein.1.a:0 "Vive François-Joseph II !"

liechtenstein.2.t:0 "[FROM.GetNameDefCap] propose une coopération renforcée"
liechtenstein.2.d:0 "Nous avons reçu une proposition de [FROM.GetNameDef] visant à accroître la coopération militaire entre nos deux pays afin de mieux défendre notre neutralité et indépendance communes. Cela fait partie d’une coûteuse expansion de politique étrangère promue par [FROM.GetLeader]. Selon eux, il s’agit d’un pas positif vers la sécurité et la stabilité de notre région.\n\nEn tant que deux petites nations au cœur de l’Europe, nous et [FROM.GetNonIdeologyName] faisons face à de nombreuses menaces potentielles venant de puissances étrangères. En travaillant ensemble, nous pouvons mettre en commun nos ressources et expertises afin de mieux nous défendre contre ces défis."
liechtenstein.2.a:0 "Nous resterons proches de notre plus proche voisin."
liechtenstein.2.b:0 "La situation est stable telle qu’elle est."

liechtenstein.3.t:0 "[FROM.GetNameDefCap] accepte une coopération renforcée"
liechtenstein.3.d:0 "Le gouvernement [FROM.GetAdjective] a accepté d’accroître la coopération militaire avec nous afin de mieux défendre notre neutralité et indépendance communes contre d’éventuelles menaces extérieures. Ils reconnaissent les avantages de travailler ensemble pour assurer la sécurité et la stabilité de notre région.\n\nDans le cadre de ce nouvel accord, nos deux pays intensifieront les exercices militaires conjoints, le partage de renseignements et la planification coordonnée de la défense. Nous travaillerons également à améliorer notre communication et notre coordination en cas de crise ou de menace potentielle.\n\nLe gouvernement [SWI.GetAdjective] estime que cette coopération accrue contribuera à renforcer nos défenses collectives et à démontrer à la communauté internationale que nous sommes capables de défendre notre neutralité et notre souveraineté."
liechtenstein.3.a:0 "Unis ensemble, nous restons forts."

liechtenstein.4.t:0 "[FROM.GetNameDefCap] refuse une coopération renforcée"
liechtenstein.4.d:0 "Le gouvernement [FROM.GetAdjective] a décidé de ne pas accroître la coopération militaire avec nous face aux menaces extérieures potentielles. Bien que nous reconnaissions les avantages d’une telle collaboration, les Suisses semblent déterminés à maintenir la situation actuelle.\n\nDe plus, le gouvernement [FROM.GetAdjective] considère que préserver leur indépendance et leur souveraineté est primordial et qu’une coopération excessive pourrait mettre en péril leur neutralité ainsi que la nôtre."
liechtenstein.4.a:0 "Décevant."

liechtenstein.5.t:0 "[LIE.GetNameDefCap] propose de rétablir la coopération"
liechtenstein.5.d:0 "[LIE.GetNameDefCap] a proposé de rétablir la coopération militaire avec nous, invoquant les avantages potentiels d’une collaboration plus étroite face aux menaces extérieures. Cette proposition intervient après une période de coopération réduite entre nos deux pays depuis la Grande Guerre.\n\n[LIE.GetNonIdeologyName] estime que travailler ensemble avec l’Autriche pourrait améliorer la préparation militaire, le partage de renseignements et la coordination en cas de crise ou de menace potentielle."
liechtenstein.5.a:0 "Nous avons perdu une fois, mais nous reviendrons."
liechtenstein.5.b:0 "C’était l’[AUS.GetNonIdeologyName] d’autrefois, nous ne sommes pas intéressés."

liechtenstein.6.t:0 "[AUS.GetNameDefCap] accepte une coopération renforcée"
liechtenstein.6.d:0 "[AUS.GetNameDefCap] a accepté notre proposition de rétablir la coopération militaire entre nos deux pays. Ils estiment qu’une collaboration plus étroite entre nos forces armées pourrait améliorer la préparation militaire, le partage de renseignements et la coordination en cas de crise. Les [AUS.GetAdjective] ont montré un vif intérêt à rétablir nos anciens traités, peut-être dans le but de réaffirmer leur influence sur nous et la région."
liechtenstein.6.a:0 "Unis ensemble, nous restons forts."

liechtenstein.7.t:0 "[AUS.GetNameDefCap] refuse une coopération renforcée"
liechtenstein.7.d:0 "[AUS.GetNameDefCap] a refusé la proposition du Liechtenstein visant à rétablir la coopération militaire entre nos deux pays. Les [AUS.GetAdjective] semblent déterminés à maintenir leur position actuelle vis-à-vis de notre nation et ne sont pas intéressés par la reprise d’anciens traités."
liechtenstein.7.a:0 "Décevant."

liechtenstein.8.t:0 "[SWI.GetNameDefCap] se prépare à intervenir militairement"
liechtenstein.8.d:0 "Nous avons été informés que [SWI.GetNameDef] se prépare à intervenir militairement dans notre petit pays afin d’empêcher les partis extrémistes de s’implanter dans notre politique.\n\nNous avons toujours apprécié notre relation avec [SWI.GetNameDef] et avons souvent coopéré par le passé. Toutefois, cette décision n’est rien de moins qu’un acte d’agression, pris sans nous consulter ni considérer les risques et conséquences."
liechtenstein.8.a:0 "Nous devons nous préparer immédiatement !"

liechtenstein.9.t:0 "Intervention réussie au [LIE.GetNameDef]"
liechtenstein.9.d:0 "Notre intervention militaire au [LIE.GetNameDef] a été un succès. Nos forces armées ont neutralisé rapidement et efficacement toute menace posée par les partis extrémistes.\n\nL’opération a causé peu de pertes et peu de dégâts aux infrastructures ou aux biens du [LIE.GetNonIdeologyName]. Nous avons restauré la stabilité et empêché les extrémistes de s’ancrer. Des efforts sont en cours pour établir un nouveau gouvernement."
liechtenstein.9.a:0 "Un travail bien fait."

liechtenstein.10.t:0 "Intervention ratée au [LIE.GetNameDef]"
liechtenstein.10.d:0 "Malgré nos efforts, nous n’avons pas réussi à intervenir avec succès au [LIE.GetNameDef]. Nos forces ont rencontré une résistance inattendue des milices locales et n’ont pas pu neutraliser la menace extrémiste. Le [LIE.GetNonIdeologyName] reste sous influence extrémiste, pour l’instant."
liechtenstein.10.a:0 "C’est un désastre !"

liechtenstein.11.t:0 "[SWI.GetNameDefCap] échoue à intervenir dans notre pays"
liechtenstein.11.d:0 "Nous avons opposé une résistance farouche aux tentatives [SWI.GetAdjective] d’intervenir militairement. Les pertes subies les ont forcés à se retirer et à abandonner leurs plans. Pour l’instant, toute ingérence de [SWI.GetNameDef] a été repoussée."
liechtenstein.11.a:0 "Rentrez chez vous, Schätzli !"

liechtenstein.12.t.a:0 "[SWI.GetNameDefCap] mène une intervention réussie dans notre pays"
liechtenstein.12.t.b:0 "[AUS.GetNameDefCap] mène une intervention réussie dans notre pays"
liechtenstein.12.d.a:0 "L’intervention militaire de [SWI.GetNameDef] chez nous a réussi. Leurs forces armées ont rapidement neutralisé toute menace extrémiste.\n\nLe gouvernement [SWI.GetAdjective] insiste sur le fait qu’il ne s’agit pas d’un acte d’agression, mais uniquement de l’éradication des partis extrémistes. Néanmoins, ils ont déjà commencé à installer un nouveau gouvernement."
liechtenstein.12.d.b:0 "L’intervention militaire de [AUS.GetNameDef] chez nous a réussi. Leurs forces armées ont rapidement neutralisé toute menace extrémiste.\n\nLe gouvernement [AUS.GetAdjective] insiste sur le fait qu’il ne s’agit pas d’un acte d’agression, mais uniquement de l’éradication des partis extrémistes. Néanmoins, ils ont déjà commencé à installer un nouveau gouvernement."
liechtenstein.12.a:0 "C’est inquiétant."

liechtenstein.13.t:0 "Intervention [ROOT.GetAdjective] non concluante"
liechtenstein.13.d:0 "L’intervention militaire de [SWI.GetNameDef] au [LIE.GetNameDef] n’a pas abouti. Malgré les efforts pour neutraliser la menace extrémiste, la situation reste incertaine."
liechtenstein.13.a:0 "Soit."

liechtenstein.14.t:0 "Un invité inattendu apparaît"
liechtenstein.14.d:0 "Otto de Habsbourg, chef actuel de la maison royale des Habsbourg et prétendant au trône austro-hongrois, est apparu dans notre pays comme invité de François Ier au château de Vaduz. Bien que François ait affirmé qu’il ne s’agissait que d’une « rencontre entre vieux amis », certains craignent qu’il ne cherche à se rapprocher de l’[AUS.GetNameDef] en cas de restauration de la monarchie.\n\nMalgré la nature discutable de sa présence, sa popularité parmi le peuple de [ROOT.GetNonIdeologyName] est indéniable, ce qui pourrait en faire un atout pour remonter le moral national."
liechtenstein.14.a:0 "Bienvenue en [LIE.GetNonIdeologyName] !"
liechtenstein.14.b:0 "Laissons-le tranquille."

liechtenstein.15.t:0 "[FROM.GetNameDefCap] cherche à acheter [463.GetName]"
liechtenstein.15.d:0 "Des diplomates de [LIE.GetNameDefCap] nous ont approchés pour acheter le territoire de [463.GetName] contre une grosse somme, probablement issue de leur récente richesse. Ils affirment que les Russes avaient prévu de leur vendre en 1867, mais qu’ils en furent privés par des manœuvres diplomatiques.\n\n[LIE.GetNonIdeologyName] s’étant engagé à une neutralité stricte, il n’y aurait pas de risque immédiat à ce que ce territoire soit utilisé contre nous, et la somme offerte pourrait dépasser sa valeur réelle. Mais devons-nous vraiment permettre à l’une des plus petites nations du monde de s’agrandir de plus de 6000 fois ?"
liechtenstein.15.a:0 "S’ils y tiennent tant."
liechtenstein.15.b:0 "Le prince voit trop grand."

liechtenstein.16.t:0 "[463.Owner.GetNameDefCap] accepte de nous vendre [463.GetName]"
liechtenstein.16.d:0 "Notre généreuse offre pour acheter [463.GetName] a été accueillie favorablement par [463.Owner.GetNameDef], qui, après délibération, a accepté de nous céder ce territoire.\n\nBeaucoup saluent cet événement historique, car notre pays s’est agrandi plus de 6000 fois, tandis que d’autres critiquent le prix payé pour cette expansion."
liechtenstein.16.a:0 "[ROOT.GetLeader], le nouveau prince de [463.GetName] !"

liechtenstein.17.t:0 "[463.Owner.GetNameDefCap] refuse de nous vendre [463.GetName]"
liechtenstein.17.d:0 "Notre généreuse offre pour acheter [463.GetName] a été tournée en ridicule par [463.Owner.GetNameDef], qui a promptement refusé et ignoré notre proposition."
liechtenstein.17.a:0 "C’est 1867 qui recommence."

liechtenstein.18.t:0 "[LIE.GetNameDefCap] met fin au commerce d’or"
liechtenstein.18.d:0 "[LIE.GetNameDefCap] a décidé de mettre fin à l’accord de commerce d’or conclu entre nos deux pays. Nous ne bénéficierons plus de cet accord, sauf s’ils choisissent de le rétablir."
liechtenstein.18.a:0 "Très bien."

liechtenstein.19.t:0 "Formation d’un gouvernement de coalition"
liechtenstein.19.d:0 "[ROOT.GetLeader] a annoncé être prêt à réduire son propre pouvoir monarchique et à permettre à des institutions démocratiques plus libérales de prévaloir, afin de mieux affronter les temps troublés que traverse notre pays et ses voisins.\n\nLes deux principaux partis politiques, le FBP et le VU, seront soumis à des élections nationales pour élire le premier dirigeant national, aux côtés de la monarchie."
liechtenstein.19.a:0 "Faisons ce qu’il faut."

liechtenstein.20.t:0 "Le sort de [ROOT.GetNeutralParty]"
liechtenstein.20.d:0 "Avec la réussite de notre transition vers un gouvernement communiste, nous devons maintenant décider du sort de l’ancienne famille royale, et en particulier du prince [ROOT.GetNeutralLeader]. Ils n’ont pas leur place dans la société égalitaire que nous construisons. Mais que doit-on faire d’eux ?"
liechtenstein.20.a:0 "Les exiler."
liechtenstein.20.b:0 "Ils doivent être exterminés."

