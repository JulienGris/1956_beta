LIE_gold_trade_with_liechtenstein:0 "Commerce d’or du Liechtenstein"
LIE_gold_trade_with_liechtenstein_desc:0 "La banque privée avec des actifs au [LIE.GetNameDef] nous permet de canaliser les réserves d’or et de devises à un rythme plus soutenu. Bien que ce ne soit pas grand-chose, cela s’est révélé bénéfique pour l’économie."
LIE_liechtenstein_gold_market:0 "Marché de l’or du Liechtenstein"
LIE_foreign_gold_trading_category:0 "Commerce d’or étranger"
LIE_foreign_gold_trading_category_desc:0 "Entourés d’envahisseurs potentiels, nous devons veiller à ne pas briser notre neutralité précaire, au risque de perdre notre patrie et notre indépendance face aux marées montantes de la guerre. En créant de solides liens financiers avec les pays qui nous entourent, peut-être seront-ils dissuadés de chercher l’agression contre nous."
