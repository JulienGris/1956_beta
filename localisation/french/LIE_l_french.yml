LIE_the_rotter_opportunity:0 "L’opportunité Rotter"
LIE_the_rotter_opportunity_desc:0 "Nous devrions cesser de voir l’enlèvement des Rotter comme une malédiction et davantage comme une bénédiction. Avec cet état d’esprit, nous pourrons prendre notre place parmi les puissances fascistes du monde."
LIE_coup_the_government:0 "Coup d’État"
LIE_coup_the_government_desc:0 "Avec notre soutien assuré au sein de l’État liechtensteinois, nous devons exiger la fin d’un gouvernement incompétent et laxiste qui a affaibli notre nation beaucoup trop longtemps. Nous devons frapper tant que le fer est chaud."
LIE_full_german_military_integration:0 "Intégration militaire totale [GER.GetAdjective]"
LIE_full_german_military_integration_desc:0 "L’Allemagne prouvant une fois de plus qu’elle est la puissance la plus vitale d’Europe, nous devrions chercher son aide pour intégrer pleinement nos capacités militaires aux siennes."
LIE_german_equipment:0 "Équipement [GER.GetAdjective]"
LIE_german_equipment_desc:0 "Une intégration plus poussée dans la Wehrmacht allemande doit inclure la distribution standard de leurs équipements d’infanterie les plus performants. Nous devrions envoyer un émissaire à Berlin pour demander officiellement l’autorisation de commencer la production domestique de leurs armements."
LIE_brothers_in_arms:0 "Frères d’armes"
LIE_brothers_in_arms_desc:0 "Avec nos forces armées fortement intégrées et les relations germano-liechtensteinoises au beau fixe, le moment est venu de demander notre entrée officielle dans l’Axe."
LIE_eradicate_communism:0 "Éradiquer le communisme"
LIE_eradicate_communism_desc:0 "Ce n’est un secret pour personne : le fascisme est idéologiquement opposé au communisme. Nous chercherons donc à l’éradiquer non seulement dans notre pays mais dans le monde entier."
LIE_invade_the_soviets:0 "Envahir les [SOV.GetAdjective]"
LIE_invade_the_soviets_desc:0 "La plus grande menace continentale pour toute l’Europe vient des [SOV.GetAdjective]. Nous devons donc frapper les premiers afin d’éviter une Europe dominée par la Russie."
LIE_alliance_with_the_industrialists:0 "Alliance avec les industriels"
LIE_alliance_with_the_industrialists_desc:0 "En forgeant une alliance avec les rares industriels de la nation, nous pourrons nationaliser des biens en toute sécurité afin de mieux servir l’État dans son ensemble."
LIE_radical_autarky:0 "Autarcie radicale"
LIE_radical_autarky_desc:0 "L’idée d’autarcie est populaire parmi le peuple allemand, et nous devons à notre tour chercher à l’imiter afin de mieux préserver l’État."
LIE_eliminate_the_vestiges:0 "Éliminer les vestiges"
LIE_eliminate_the_vestiges_desc:0 "Toute résistance restante du gouvernement et de ses partisans doit être rapidement éradiquée afin de sécuriser notre position au pouvoir."
LIE_the_liechtenstein_ss:0 "La SS [ROOT.GetAdjective]"
LIE_the_liechtenstein_ss_desc:0 "La SS allemande est l’une des nombreuses réussites issues de la nouvelle Allemagne. Avec la menace communiste omniprésente, nous devons imiter cette idée dans toute son ampleur, ce qui renforcera également nos capacités militaires."
LIE_ministry_of_public_enlightenment:0 "Ministère de l’Éducation du peuple"
LIE_ministry_of_public_enlightenment_desc:0 "La propagande est une force puissante dans tout pays, et le Liechtenstein n’y fait pas exception. Nous devons inciter notre population à se battre pour la sécurité de la nation."
LIE_social_welfare:0 "Protection sociale"
LIE_social_welfare_desc:0 "En investissant dans l’expansion de la protection sociale, nous aurons les moyens de renforcer les esprits du Liechtenstein."
