LIE_prince_no_more:0 "Prince, plus jamais"
LIE_prince_no_more_desc:0 "Les échecs des Habsbourg ont clairement démontré qu’on ne peut plus leur faire confiance pour défendre nos intérêts. Il est temps que la maison de Liechtenstein libère son véritable potentiel et prenne sa place comme leader en Europe."
