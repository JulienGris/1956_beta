l_french:
 philippines_focus:0 "Arbre de priorités national des Philippines"
 PHI_develop_anti_air_capabilities:0 "Développer les capacités antiaériennes"
 PHI_post_indenpence_stabilization:0 "Réorganiser le gouvernement"
 PHI_post_indenpence_stabilization_desc:0 "Le paysage politique de notre pays est devenu chaotique ; fascistes, communistes et démocrates se disputent le pouvoir. Il est temps d’y mettre fin et de commencer à bâtir une nouvelle nation pour notre peuple, en réorganisant le gouvernement et l’État de droit !"
 PHI_a_new_regime:0 "Saisir l’opportunité"
 PHI_a_new_regime_desc:0 "Nous avons choisi de suivre les idéologies autoritaires de l’Occident."
 PHI_fighting_filipinos:0 "Les Philippins combattants"
 PHI_fighting_filipinos_desc:0 "Certains de nos ministres ont proposé de lancer une nouvelle campagne de propagande militaire : « Les Philippins combattants ». Nous devrions l’appliquer immédiatement."
 PHI_filipino_irrdentism:0 "Irrédentisme philippin"
 PHI_filipino_irrdentism_desc:0 "Avec le soutien accru à notre idéologie et à notre armée, le peuple est désormais prêt à reprendre ce qui nous appartient quand le moment sera venu."
 PHI_support_the_ganap_party:0 "Soutenir la Phalange"
 PHI_support_the_ganap_party_desc:0 "Si nous soutenons le parti Ganap, il promet une Philippines plus unie et une meilleure transparence gouvernementale."
 PHI_huk_revolutionaries:0 "Héritage de la rébellion Katipunan"
 PHI_huk_revolutionaries_desc:0 "Nous avons actuellement des révolutionnaires communistes qui terrorisent notre peuple, mais si nous leur donnons plus d’autonomie et de pouvoir parlementaire, les choses pourraient changer."
 PHI_ideological_fanaticism:0 "Propagande anti-[USA.GetAdjective]"
 PHI_ideological_fanaticism_desc:0 "Avec une population zélée, ils défendront les îles jusqu’au dernier homme."
 PHI_reach_out_to_spain:0 "Tendre la main à l’Espagne"
 PHI_reach_out_to_spain_desc:0 "Nous devrions obtenir le soutien d’autres nations fascistes."
 PHI_soviet_trade_mission:0 "Contacter les [SOV.GetAdjective]"
 PHI_soviet_trade_mission_desc:0 "Nous sommes seuls en Asie du Sud-Est à défendre la cause socialiste. Nous devons obtenir le soutien des Soviétiques afin d’assurer notre indépendance nouvellement acquise."
 PHI_militarized_police:0 "Constabulary philippine"
 PHI_militarized_police_desc:0 "La Constabulary philippine nouvellement fondée réprimera toutes les émeutes et tous ceux qui s’opposent au gouvernement."
 PHI_may_2nd_uprising:0 "Le coup d’État phalangiste"
 PHI_may_2nd_uprising_desc:0 "L’heure est venue, frères ! Aujourd’hui, les Sakdalistas se lèveront !"
 PHI_hukbalap_rebellion:0 "La seconde révolution [ROOT.GetAdjective]"
 PHI_hukbalap_rebellion_desc:0 "Avec l’autonomie accordée au Hukbalahap, ils ont pu lever une grande armée communiste pour renverser le gouvernement !"
 PHI_peace_keeping_youth:0 "Sangguniang Pangkabataan"
 PHI_peace_keeping_youth_desc:0 "En créant le Sangguniang Pangkabataan (Conseil de la jeunesse), nous donnerons à la nouvelle génération l’occasion de participer aux processus démocratiques de notre nouveau gouvernement et d’éviter leur rébellion."
 PHI_covert_NKVD_operations:0 "Opérations secrètes du NKVD"
 PHI_covert_NKVD_operations_desc:0 "Les Soviétiques sont prêts à utiliser le NKVD pour purger toute opposition politique dans le pays, mais seulement si nous le leur permettons..."
 PHI_greater_philippines_concept:0 "Le concept de Grande Philippines"
 PHI_greater_philippines_concept_desc:0 "Depuis des temps immémoriaux, nos sultans, rajahs et chefs possédaient toutes les îles situées au nord de l’équateur dans cette région. Nous affirmerons notre souveraineté sur l’État de Sabah et sur les anciennes îles de la Capitainerie générale des Philippines afin de corriger les injustices historiques commises par nos colonisateurs."
 PHI_demand_guam:0 "Référendum à Guam"
 PHI_demand_guam_desc:0 "Nous pouvons utiliser notre agence de renseignement et nos forces spéciales pour organiser un référendum dans les îles de Guam afin de légitimer notre annexion."
 PHI_demand_spanish_captaincy_general_islands:0 "Îles de la Capitainerie générale espagnole"
 PHI_demand_spanish_captaincy_general_islands_desc:0 "Tout comme les Espagnols dirigeaient ces îles, nous le ferons aussi ! Nous poursuivrons et intensifierons nos opérations clandestines jusqu’à ce qu’elles deviennent nôtres !"
 PHI_demand_sabah:0 "Occuper Sabah"
 PHI_demand_sabah_desc:0 "Alors que les Britanniques sont occupés en Europe et en Afrique, nous pouvons reprendre Sabah à ses véritables propriétaires : le sultan de Sulu et le peuple philippin."
 PHI_island_infrastrcture:0 "Infrastructures insulaires"
 PHI_island_infrastrcture_desc:0 "Les anciens propriétaires de nos nouvelles possessions ont négligé leurs infrastructures et leurs populations. Nous devons développer nos villes et nos campagnes pour commencer l’industrialisation."
 PHI_island_industry:0 "Industrie insulaire"
 PHI_island_industry_desc:0 "Nos industries indigènes, basées sur l’agriculture, la pêche et la métallurgie, seront l’épine dorsale de notre industrialisation."
 PHI_greater_philippines_established:0 "Grande Philippines restaurée"
 PHI_greater_philippines_established_desc:0 "Nous avons enfin repris ce qui nous avait été pris ! Nous pouvons désormais entrer dans une ère de paix et de prospérité."
 PHI_follow_the_american_way:0 "Suivre la voie américaine"
 PHI_follow_the_american_way_desc:0 "Les Américains nous ont enseigné la liberté et la démocratie. Nous devons continuer sur cette voie pour garantir notre indépendance."
 PHI_elect_new_congressmen:0 "Élire de nouveaux congressistes"
 PHI_elect_new_congressmen_desc:0 "Nous organiserons de nouvelles élections pour remplacer les congressistes de l’ancien gouvernement colonial par de nouveaux dirigeants responsables uniquement devant le peuple philippin."
 PHI_european_intervention:0 "Intervention européenne"
 PHI_european_intervention_desc:0 "En tant que première démocratie d’Asie, il est de notre devoir de défendre les aspirations de tous ceux qui souhaitent devenir indépendants, même s’ils furent autrefois nos oppresseurs."
 PHI_ally_funded_development:0 "Investissements alliés"
 PHI_ally_funded_development_desc:0 "Grâce à nos efforts en Europe, les Alliés nous envoient désormais des dons et une aide pour développer la patrie."
 PHI_the_filipino_corridor:0 "Le corridor philippin"
 PHI_the_filipino_corridor_desc:0 "Les Alliés ont besoin d’un tremplin pour l’invasion du Japon. Les Philippines sont l’endroit idéal."
 PHI_worldwide_intervention:0 "Intervention mondiale"
 PHI_worldwide_intervention_desc:0 "La guerre s’étend dans le monde et davantage de nations libres ont besoin de notre aide. La première démocratie d’Asie doit défendre les idéaux de liberté et de justice plus que jamais."
 PHI_fascist_defense:0 "Défense fasciste"
 PHI_fascist_defense_desc:0 "Les îles sont ouvertes à une invasion japonaise. Nous devons construire des fortifications terrestres et navales pour neutraliser cette menace."
 PHI_accept_refugees:0 "Accepter les réfugiés"
 PHI_accept_refugees_desc:0 "En raison des conflits armés en Asie, beaucoup cherchent un refuge sûr sans moyen de transport. Nous ouvrirons nos îles à ces réfugiés et leur offrirons un passage sûr."
 PHI_refugee_voluteers:0 "Volontaires réfugiés"
 PHI_refugee_voluteers_desc:0 "Beaucoup de réfugiés veulent nous remercier pour notre hospitalité. Nous formerons davantage de divisions de volontaires pour soutenir leurs luttes armées."
 PHI_bring_democracy_to_japan:0 "Apporter la démocratie au Japon"
 PHI_bring_democracy_to_japan_desc:0 "Il est temps de passer à l’offensive contre la menace impérialiste japonaise."
 PHI_the_industrialized_islands_plan:0 "Plan des îles industrialisées"
 PHI_the_industrialized_islands_plan_desc:0 "Nos industries indigènes ne nous ont menés que jusque-là. Nous devons intensifier notre développement industriel si nous voulons progresser en tant que nation."
 PHI_urbanize_the_islands:0 "Urbaniser les îles"
 PHI_urbanize_the_islands_desc:0 "Notre géographie archipélagique ne permet pas de vastes zones agricoles ou industrielles. Pour construire de grands secteurs industriels, nous transformerons les Philippines en une utopie industrielle compacte."
 PHI_manila_central_railway:0 "Gare centrale de Manille"
 PHI_manila_central_railway_desc:0 "Maintenant que nous avons reconstruit les Chemins de fer nationaux philippins, il est temps de relier toutes les villes à une gare centrale."
 PHI_fund_armscor:0 "Financer Armscor"
 PHI_fund_armscor_desc:0 "Un certain Don Celso Tuason a acheté une société américaine d’armement avant l’indépendance et l’a transformée en un fabricant philippin d’armes. Nous la financerons et en ferons notre partenaire clé pour équiper nos forces armées."
 PHI_seize_illegal_weapons_manufacturer:0 "Saisir les usines d’armes illégales"
 PHI_seize_illegal_weapons_manufacturer_desc:0 "Les guérillas avaient installé des usines clandestines d’armes, mais nous pouvons les reprendre et les utiliser pour nous-mêmes."
 PHI_national_defence_fund:0 "Fonds de défense nationale"
 PHI_national_defence_fund_desc:0 "Si nous réservons des fonds à un Fonds de défense nationale, nous pourrons acheter de nouvelles usines et de l’équipement."
 PHI_expanded_chromium_mining:0 "Développer l’extraction de chrome"
 PHI_expanded_chromium_mining_desc:0 "Les îles ont toujours exploité de petites quantités de chrome, mais des géologues ont récemment découvert un grand gisement à Mindanao. Il est temps d’élargir notre industrie minière."
 PHI_develop_palawan:0 "Développer Palawan"
 PHI_develop_palawan_desc:0 "L’île peu peuplée de Palawan dispose de vastes terres inexploitées et d’une bonne côte pour y construire des ports. Elle a un grand potentiel pour devenir un bastion industriel fortifié."
 PHI_develop_mindano:0 "Développer Mindanao"
 PHI_develop_mindano_desc:0 "La « terre de promesse » regorge de ressources agricoles, industrielles et humaines inexploitées, et offre suffisamment d’espace pour plus d’industrie. Cette île doit être encore plus développée pour répondre aux besoins du pays."
 PHI_additional_research_slot1:0 "Programme éducatif unifié"
 PHI_additional_research_slot1_desc:0 "Pour progresser technologiquement, nous devons étendre nos programmes de recherche en investissant dans davantage d’universités et de centres de recherche."
 PHI_american_computer_imports:0 "Importer des ordinateurs américains"
 PHI_american_computer_imports_desc:0 "Nous devons étudier les ordinateurs existants pour comprendre leur conception et les reproduire. Ce n’est qu’ensuite que nous pourrons créer les nôtres."
 PHI_synth_oil:0 "Technologies de substitution"
 PHI_synth_oil_desc:0 "Comme nous n’avons pas de pétrole exploitable en quantité suffisante, des programmes de substitution sont nécessaires."
 PHI_study_enemy_ciphers:0 "Étudier les codes ennemis"
 PHI_study_enemy_ciphers_desc:0 "Les progrès en cryptographie et cryptanalyse ont rendu nos machines obsolètes. Nous devons développer de nouveaux systèmes."
 PHI_research_new_enegry_options:0 "Programme philippin d’énergie atomique"
 PHI_research_new_enegry_options_desc:0 "L’énergie atomique s’impose comme l’énergie du futur. Nos scientifiques veulent être pionniers dans ce domaine et demandent notre soutien."
 PHI_additional_research_slot2:0 "Université des Philippines"
 PHI_additional_research_slot2_desc:0 "Nous établirons une université de recherche qui formera des scientifiques, travailleurs et dirigeants capables d’améliorer notre nation grâce à la science, animés d’un profond patriotisme."
 PHI_teachings_of_the_usaffe:0 "Loi sur la défense nationale de [GetYear]"
 PHI_teachings_of_the_usaffe_desc:0 "L’USAFFE (United States Army Forces in the Far East) avait entraîné notre armée avant l’indépendance, et nos forces actuelles sont fortement inspirées de la structure militaire américaine. Nous devrions maintenir cette organisation et laisser nos généraux formés par les Américains améliorer nos doctrines."
 PHI_defense_of_manila:0 "La défense de Luçon"
 PHI_defense_of_manila_desc:0 "Nous sommes encerclés par des ennemis à l’intérieur comme à l’extérieur. De plus, notre géographie archipélagique rend la défense totale presque impossible. Nous devons construire des fortifications dans la capitale pour assurer sa défense à tout prix."
 PHI_island_hopping_strategy:0 "Stratégie du saut d’île"
 PHI_island_hopping_strategy_desc:0 "Si nous planifions une offensive, nous devrions étudier les tactiques de saut d’île des Américains et des Japonais."
 PHI_american_doctrines:0 "Doctrines américaines"
 PHI_american_doctrines_desc:0 "Notre armée succède à l’USAFFE, il est donc dans notre intérêt de mener des exercices militaires avec les Américains et de maintenir leurs traditions militaires."
 PHI_japanese_doctrines:0 "Doctrines japonaises"
 PHI_japanese_doctrines_desc:0 "Les Japonais ont cru à la suprématie terrestre et navale, et cela s’est avéré plus efficace que nos doctrines actuelles. Nous devrions suivre la voie du Soleil levant."
 PHI_american_imports:0 "Importations d’armes américaines"
 PHI_american_imports_desc:0 "La plupart de nos armes sont du matériel américain d’anciennes générations. Il est dans notre intérêt de demander de l’équipement plus moderne."
 PHI_lighting_warfare:0 "Guerre éclair"
 PHI_lighting_warfare_desc:0 "Nous devrions développer une doctrine de combat propre aux Philippines, inspirée de la Blitzkrieg allemande et des tactiques de saut d’île, axée sur les opérations amphibies rapides et la suprématie navale."
 PHI_study_european_tanks:0 "Étudier les chars [GER.GetAdjective]"
 PHI_study_european_tanks_desc:0 "La guerre en Europe a été un terrain d’essai pour la technologie blindée. Nous devrions développer nos propres modèles à partir de leur expérience."
 PHI_create_main_battle_tanks:0 "Prioriser la recherche sur les chars modernes"
 PHI_create_main_battle_tanks_desc:0 "La conception des chars doit évoluer avec le temps. Il est essentiel de développer nos véhicules blindés pour les batailles futures."
 PHI_import_new_howitzers:0 "Importer de nouveaux obusiers"
 PHI_import_new_howitzers_desc:0 "Notre artillerie vieillissante n’est plus adaptée. Nous devons importer de nouveaux obusiers."
 PHI_anti_tank_guns:0 "Canons antichars"
 PHI_anti_tank_guns_desc:0 "Pour contrer les nouveaux chars lourds, nous devons développer nos propres canons antichars."
 PHI_army_modernisation:0 "Modernisation de l’armée"
 PHI_army_modernisation_desc:0 "La guerre a radicalement changé depuis l’époque des Katipuneros. Il est impératif de moderniser les Forces armées philippines et de nous préparer aux conflits futurs."
 PHI_air_base_expansion:0 "Expansion des bases aériennes"
 PHI_air_base_expansion_desc:0 "Nous devrions étendre nos bases aériennes civiles et militaires si nous voulons dominer le ciel."
 PHI_fighter_modernisation:0 "Modernisation des chasseurs"
 PHI_fighter_modernisation_desc:0 "Nos vieux chasseurs d’entre-deux-guerres sont inférieurs à ceux de demain."
 PHI_air_innovations:0 "Innovations aériennes"
 PHI_air_innovations_desc:0 "Le chef d’état-major a proposé de nouvelles tactiques et formations au gouvernement. Nous devons mettre en œuvre ces idées pour rester au niveau des autres nations."
 PHI_heavy_fighter_concept:0 "Concept de chasseur lourd"
 PHI_heavy_fighter_concept_desc:0 "Si nous sommes contraints de passer à l’offensive, nous aurons besoin d’un nouveau type de chasseur capable d’opérer longtemps en territoire hostile."
 PHI_naval_bomber_experiments:0 "Expérimentations de bombardiers navals"
 PHI_naval_bomber_experiments_desc:0 "La suprématie aérienne est aussi importante en mer que sur terre. Des avions spécialisés pour la guerre navale sont un moyen d’atteindre cet objectif."
 PHI_medium_bomber_focus:0 "Accent sur les bombardiers moyens"
 PHI_medium_bomber_focus_desc:0 "Une extension de la philosophie du bombardement de précision, adaptée à un rayon d’action étendu pour être utilisée en soutien."
 PHI_light_bomber_focus:0 "Accent sur les bombardiers légers"
 PHI_light_bomber_focus_desc:0 "La valeur de l’utilisation des bombardiers en piqué pour l’appui rapproché ne doit pas être sous-estimée."
 PHI_air_modernisations_program:0 "Programme de modernisation aérienne"
 PHI_air_modernisations_program_desc:0 "La théorie aéronautique est aussi importante que la technologie. De nouvelles stratégies pour nos pilotes attendent encore d’être découvertes."
 PHI_rocket_development:0 "Développement des fusées"
 PHI_rocket_development_desc:0 "La vitesse est l’attribut sur lequel reposent tous les autres dans l’aviation. Les moteurs-fusées et à réaction pourraient théoriquement nous permettre de dépasser toutes les limites précédentes."
 PHI_shipyard_expansion:0 "Expansion des chantiers navals"
 PHI_shipyard_expansion_desc:0 "En tant que nation insulaire, nous avons besoin d’une forte industrie navale pour assurer notre place en mer."
 PHI_license_foreign_ships:0 "Licencier des navires étrangers"
 PHI_license_foreign_ships_desc:0 "De nouveaux types de navires sont continuellement développés par nos voisins. Nous devons en obtenir les licences, les étudier, puis développer des modèles adaptés à nos besoins stratégiques et tactiques."
 PHI_anti_sub_defense_force:0 "Une marine de croiseurs"
 PHI_anti_sub_defense_force_desc:0 "Des navires de plus en plus grands seront nécessaires pour concrétiser nos ambitions maritimes."
 PHI_import_submarine_techology:0 "Importer la technologie sous-marine"
 PHI_import_submarine_techology_desc:0 "Un retard sous-marin est inacceptable. Nous aurons la technologie, même si nous devons l’acheter."
 PHI_commerce_attack:0 "Tactiques d’attaque du commerce"
 PHI_commerce_attack_desc:0 "En privant l’ennemi de ses ressources grâce aux sous-marins et aux destroyers légers, nous pouvons assurer la suprématie navale malgré la petitesse de notre flotte."
 PHI_study_allied_and_axis_naval_tactics:0 "Étudier les tactiques navales alliées"
 PHI_study_allied_and_axis_naval_tactics_desc:0 "En nous concentrant sur les contre-tactiques nécessaires pour affronter nos ennemis les plus probables, nous garderons l’avantage dans les combats navals."
 PHI_island_defense:0 "Défense insulaire"
 PHI_island_defense_desc:0 "Une force navale défensive mobile à courte portée pourrait potentiellement remplacer de nombreuses fois les fortifications fixes."
 PHI_strike_force:0 "Force de frappe"
 PHI_strike_force_desc:0 "En cas d’infériorité numérique, nous avons besoin d’une flotte de guerre rapidement déployable pour frapper l’ennemi quand et où il est le plus faible."
 PHI_pacific_navy:0 "Grande marine du Pacifique"
 PHI_pacific_navy_desc:0 "Un effort approfondi pour réinventer notre stratégie navale sera crucial si nous voulons utiliser efficacement nos navires dans le Pacifique."
 PHI_the_pan_malayan_confederation:0 "La Confédération pan-malaise"
 PHI_the_pan_malayan_confederation_desc:0 "Les ancêtres du peuple philippin sont les Indonésiens et les Malais. Depuis longtemps, nous rêvons d’unir tous les Malais sous un seul État-nation, malgré les chemins séparés de nos pays. Aujourd’hui, ce rêve devient réalité."
 PHI_invite_indonesia:0 "Inviter l’Indonésie"
 PHI_invite_indonesia_desc:0 "Unir le Nusantara et nos îles est la première étape vers l’unification malaise."
 PHI_invite_malaysia:0 "Inviter la Malaisie"
 PHI_invite_malaysia_desc:0 "La Fédération de Malaisie a besoin du soutien de ses frères ancestraux pour survivre. Nous les inviterons dans notre faction et unirons enfin tous les Malais en un seul « balangay »."

 PHI_american_way:0 "La voie américaine"
 PHI_american_way_desc:0 "Notre système politique a été influencé par notre ancien gouvernement fantoche, les États-Unis d’Amérique."
 PHI_greater_philipines:0 "La Grande Philippines"
 PHI_greater_philipines_desc:0 "Pour la gloire de notre peuple, nous avons repris ce qui nous revient de droit ! Que ce soit par ferveur nationaliste ou par les vents de la révolution."
 PHI_stablized_state:0 "État stabilisé ?"
 PHI_stablized_state_desc:0 "Nous avons survécu aux premières années fragiles de notre indépendance, et nous continuerons encore longtemps."
 PHI_fighting_filipinos_focus:0 "Les Philippins combattants"
 PHI_fighting_filipinos_focus_desc:0 "Notre nouvelle campagne de propagande en temps de guerre, « Les Philippins combattants », a solidifié le soutien à l’armée et à notre idéologie."
 PHI_filipino_irredentism:0 "Irrédentisme philippin"
 PHI_filipino_irredentism_desc:0 "Avec le soutien de l’armée et un petit ferment nationaliste, c’est notre moment de tenir bon en ces temps incertains."
 PHI_industrial:0 "Îles industrialisées"
 PHI_industrial_desc:0 "Notre nouveau plan d’industrialisation rapide est bien accueilli par notre peuple."
 PHI_japanese_advisors_idea:0 "Conseillers japonais"
 PHI_japanese_advisors_idea_desc:0 "Les conseillers japonais influencent notre marine avec leurs idées de grandes flottes."
 PHI_american_advisors:0 "Conseillers américains"
 PHI_american_advisors_desc:0 "Les conseillers américains ont complètement transformé nos tactiques pour privilégier la suprématie de l’infanterie."
 PHI_island_hopping:0 "Tactiques de saut d’île"
 PHI_island_hopping_desc:0 "Après avoir étudié les tactiques de saut d’île, nous avons découvert la manière la plus efficace d’utiliser cette stratégie."
 PHI_teachings_usa:0 "Loi sur la défense nationale"
 PHI_teachings_usa_desc:0 "« Donnez-moi dix mille soldats philippins et je conquérirai le monde. » — Douglas MacArthur"
 PHI_ideological_rebels:0 "Révolutionnaires idéologiques"
 PHI_unstable_state:0 "État instable"
 PHI_unstable_state_desc:0 "Lorsque nous avons obtenu notre indépendance, de nombreux groupes se disputaient le pouvoir. Il n’en reste que trois, mais ils se battent intensément pour le contrôle."
 PHI_refugee_volunteers:0 "Volontaires réfugiés"

 PHI_expand_the_intelligence_services:0 "Développer les services de renseignement"
 PHI_expand_the_intelligence_services_desc:0 ""
 PHI_state_terror:0 "Terreur d’État"
 PHI_state_terror_desc:0 "Notre révolution ne peut être sécurisée qu’en écrasant toute opposition susceptible de s’opposer à la volonté de notre peuple et de son État."
 PHI_surveillance_state:0 "État de surveillance"
 PHI_surveillance_state_desc:0 "Le risque de subversion interne et externe rend nécessaire de surveiller les individus suspects afin de garantir la pureté, l’honneur et la loyauté de notre peuple fidèle."

 phil.1.t:0 "Mission [PHI.GetAdjective] en [SOV.GetNameDef]"
 phil.1.d:0 "Les révolutionnaires [PHI.GetAdjective] du « Hukbalahap » ont contacté notre ministère des Affaires étrangères pour discuter d’une future coopération et de notre possible aide dans leur projet de révolution aux Philippines. Ils pensent que partager la recherche militaire renforcerait la coopération entre nos peuples et les aiderait à se libérer de leurs colonisateurs."
 phil.1.a:0 "Nous accueillons nos nouveaux camarades communistes !"
 phil.1.b:0 "Pourquoi accepter un traité avec une nation aussi insignifiante ?"
 phil.2.t:0 "Mission commerciale [PHI.GetAdjective]-[SOV.GetAdjective] acceptée"
 phil.2.d:0 "Notre ambassadeur a envoyé un message enthousiaste détaillant l’accord final négocié avec [SOV.GetNameDef]. La promesse de partager leurs modèles de chars, accompagnés de quelques ingénieurs pour former les nôtres, accélérera considérablement nos recherches en matière de blindés."
 phil.2.a:0 "C’est une occasion mémorable !"
 phil.3.t:0 "Mission commerciale [PHI.GetAdjective]-[SOV.GetAdjective] rejetée"
 phil.3.d:0 "Les [SOV.GetAdjective] ont rejeté notre proposition commerciale."
 phil.3.a:0 "Un jour sombre pour les relations [PHI.GetAdjective]-[SOV.GetAdjective]."
 phil.8.t:0 "Le référendum à Guam"
 phil.8.d:0 "Le gouvernement [FROM.GetAdjective] a proposé à notre administration d’organiser un référendum à Guam pour donner aux habitants la possibilité de voter pour l’unification avec [FROM.GetNameDef]. Nous devons réfléchir à l’importance stratégique et économique de Guam avant de décider et d’informer le gouvernement [FROM.GetAdjective] de notre choix."
 phil.8.a:0 "Si c’est ce que veut le peuple..."
 phil.8.b:0 "Il n’en sera pas question !"
 phil.9.t:0 "[FROM.GetNameDefCap] a rejeté notre demande"
 phil.9.d:0 "[FROM.GetNameDefCap] a rejeté notre demande d’un référendum à Guam, arguant que les habitants n’en veulent pas. Une tournure malheureuse, tant pour le peuple [ROOT.GetAdjective] que pour celui de Guam !"
 phil.9.a:0 "Comme c’est regrettable..."
 phil.10.t:0 "[FROM.GetNameDefCap] a accepté notre demande"
 phil.10.d:0 "[FROM.GetNameDefCap] a accepté notre demande d’un référendum à Guam. Après l’annonce, la population fut informée de la tenue du scrutin. Heureusement, le vote fut largement favorable à l’intégration de Guam sous contrôle [ROOT.GetAdjective]."
 phil.10.a:0 "Une manière véritablement démocratique de régler une question importante !"

