DNZ_Schutzpolizei_Paramilitarization_tt:0 "Permet la §Hparamilitarisation de la police militaire§!\n§HPolice militaire§! :\n   Percée : §G+25%§!\n   Organisation max : §G+3§!\n\n"
DNZ_Special_Forces_Focus_tt:0 "Permet l’accent §HForces spéciales§!\n   Multiplicateur de capacité des forces spéciales : §G+10%§!\n\n"
DNZ_economic_aid:0 "Aide économique étrangère"
danzig.5.t:0 "Dantzig a déclaré son indépendance"
danzig.5.d:0 "Aujourd’hui, [DNZ.Getleader] a fait une annonce choquante en déclarant que le gouvernement de la ville était indépendant de [POL.GetNameDef], affirmant que Dantzig était la continuation de la Prusse. Reste à savoir si cette expérience folle tiendra ou si les pays voisins interviendront.\n\nPour l’instant, la petite ville reste seule. Le destin de Dantzig est incertain."
danzig.5.a:0 "Sont-ils devenus fous ?"
danzig.5.b:0 "Nous allons de l’avant."

danzig.6.t:0 "Le gouvernement de Dantzig rejoint [GER.GetNameDef]"
danzig.6.desc:0 "[DNZ.Getleader] a annoncé aujourd’hui que la ville de Dantzig était indépendante de [POL.GetNameDef]. Il a ensuite déclaré que la Ville libre prévoyait de rejoindre [GER.GetNameDef]. Il a invité [GER.GetLeader] à envoyer des troupes pour sécuriser le territoire."
danzig.6.a:0 "Quelle surprise."
