form_prussia_category:0 "Former la Prusse"
form_prussia_category_desc:0 "L’histoire de Dantzig est largement confondue avec celle de la Prusse. Maintenant que nous contrôlons les territoires historiquement associés, il est peut-être temps pour nous d’assumer notre héritage prussien."
form_prussia:0 "Former la Prusse"

DNZ_join_germany:0 "Rejoindre [GER.GetNameDef]"
r56_unite_DNZ_with_ger:0 "Dissoudre la cité-État"

r56_DNZ_prussia_legacy:0 "Dantzig a déclaré son indépendance"

danzigerwerft:0 "Danzigerwerft"
ernst_stieberitz:0 "Ernst Stieberitz"
Danzig_ist_Deutsch:0 "Dantzig est allemand !"
Danzig_ist_Deutsch_desc:0 "La ville de Dantzig est composée d’une majorité d’Allemands. Ils ne souhaitent qu’une chose : être réunis avec l’État allemand. Cependant, les politiciens locaux tentent pour l’instant de dissimuler ce sentiment."
DNZ_sean_lester:0 "Sean Lester – Haut-Commissaire"
DNZ_sean_lester_desc:0 "Sean Lester est le Haut-Commissaire de Dantzig. Nommé à ce poste par la Société des Nations en 1934, il est entré en conflit avec le gouvernement local de Dantzig et ses politiques à chaque instant. Chercher à le faire remplacer par un Haut-Commissaire plus flexible et aligné sur le gouvernement de Dantzig doit être une priorité."
DNZ_reliance_on_militia:0 "Dépendance envers la milice"
DNZ_reliance_on_militia_desc:0 "Le statut de Ville libre sous protection de la Société des Nations nous interdit d’avoir la moindre ressemblance avec des forces armées. L’ordre à l’intérieur de la ville est actuellement maintenu par la police locale, connue sous le nom de Schutzpolizei. §YParamilitariser§! ce corps assurera la sécurité de la ville face à une menace [POL.getAdjective] ou [GER.getAdjective]."
DNZ_maintain_infrastructure_idea:0 "Maintenir nos infrastructures"
DNZ_carl_jacob_burckhardt:0 "Carl Burckhardt – Haut-Commissaire"
DNZ_carl_jacob_burckhardt_desc:0 "Burckhardt sera bien plus accommodant aux besoins de Dantzig."
DNZ_invite_foreign_investors:0 "Inviter des investisseurs étrangers"
DNZ_invite_foreign_investors_desc:0 "Le mandat de la Société des Nations donne à [DNZ.GetNameDef] des droits spéciaux en matière de fiscalité et de contrôle du commerce, que nous pouvons utiliser pour encourager les investissements étrangers dans notre État."

DNZ_generic_democratic_reformer:0 "Hermann Rauschning"
DNZ_generic_fascist_demagogue:0 "Wilhelm von Wnuck"
DNZ_albert_forster:0 "Albert Forster"
DNZ_edmund_beyl:0 "Edmund Beyl"
DNZ_helmut_froboss:0 "Helmut Froböss"
DNZ_helmut_froboss2:0 "Helmut Froböss"

danzig.1.t:0 "La Ville libre de Dantzig"
danzig.1.desc:0 "Après la Grande Guerre, la Ville libre de Dantzig fut établie afin d’assurer l’accès à un port pour le nouvel État polonais renaissant. Ce compromis était nécessaire à la place d’une annexion complète car la grande majorité de la population de Dantzig est ethniquement allemande.\n\nLa montée de l’ultranationalisme en Allemagne a permis au NSDAP de prendre le contrôle total des institutions locales. Actuellement, le désir de ces politiciens nazis de rejoindre l’Allemagne est encore relativement discret, mais cela pourrait vite changer. La cité-État disparaîtrait probablement pour être annexée par la Pologne ou par l’Allemagne en cas de crise."
danzig.1.a:0 "Notre désir sera bientôt à portée de main."
danzig.3.t:0 "Dantzig veut un soutien pour remplacer le Haut-Commissaire"
danzig.3.desc:0 "La ville de Dantzig a eu de nombreux problèmes avec son Haut-Commissaire actuel, Lester. Celui-ci a activement cherché à bloquer les politiques de la ville et certaines de ses lois. Dantzig demande notre soutien pour convaincre la Société des Nations de nommer un nouveau Haut-Commissaire plus accommodant."
danzig.3.a:0 "Tout pour nos frères allemands."
danzig.3.b:0 "Il vaut mieux ne pas bouleverser l’ordre établi."
danzig.4.t:0 "Dantzig cherche à remplacer son Haut-Commissaire !"
danzig.4.desc:0 "\nLe Sénat de la ville de Dantzig s’est récemment tourné vers [GER.GetNameDef] pour obtenir de l’aide afin de remplacer Lester, le Haut-Commissaire actuel. L’Allemagne a saisi la Société des Nations au nom de Dantzig, et il est possible que la Société cède à ses exigences. Si cela arrive, la Société remplacera Lester par un nouveau Commissaire faible et docile, qui approuvera tout ce que le gouvernement local de Dantzig souhaite !\n\nIl est clair que Dantzig ne fonctionne plus comme une « Ville libre »."
danzig.4.a:0 "Il est peut-être temps d’intervenir."

### ARBRE DES PRIORITÉS ###

DNZ_danzig_senate:0 "Renforcer le contrôle du Sénat"
DNZ_danzig_senate_desc:0 "Avec un chômage à un niveau record dans la Ville libre et une importante population ethnique allemande, il devrait être facile de convaincre les habitants de Dantzig de voter pour nous. Une fois que nous aurons le contrôle officiel du Sénat, nous ne le céderons pas sans combattre ; je suis le Sénat !"
DNZ_remove_lester:0 "Chercher la destitution de Lester"
DNZ_remove_lester_desc:0 "Lester s’est constamment opposé au gouvernement local de Dantzig et à ses politiques. Obtenir son remplacement par un Haut-Commissaire plus flexible et en accord avec le gouvernement doit être une priorité."
DNZ_prussia_legacy:0 "L’héritage prussien"
DNZ_prussia_legacy_desc:0 "Nous ne pouvons pas faire confiance aux [POL.GetAdjective] ni aux [GER.GetAdjective] pour être maîtres de notre destin. Nous devons pousser pour être indépendants et seuls. Nous devons former notre propre État !"
DNZ_maintain_status_quo:0 "Maintenir le statu quo"
DNZ_maintain_status_quo_desc:0 "Bien que ce ne soit pas l’option la plus désirable, les [POL.GetAdjective] sont les seuls en qui nous puissions avoir confiance en ces temps troublés. Il serait sage d’améliorer nos relations avec eux."
DNZ_reconcile_with_lester:0 "Se réconcilier avec Lester"
DNZ_reconcile_with_lester_desc:0 "Peut-être que Lester n’est pas notre ennemi, mais plutôt une figure incomprise avec une autre vision de ce qui est le mieux pour [DNZ.GetNonIdeologyName]. Si nous essayions de coopérer avec lui au lieu de nous y opposer, cela pourrait donner une relation plus productive."
DNZ_cooperate_with_league_of_nations:0 "Coopérer avec la Société des Nations"
DNZ_cooperate_with_league_of_nations_desc:0 ""
DNZ_industrial_investments:0 "Subventionner l’industrie"
DNZ_industrial_investments_desc:0 "Si nous voulons un jour atteindre notre objectif de nous unir à [GER.GetNameDef], nous devons nous préparer en investissant dans l’industrie locale. Plus nous préparons aujourd’hui, plus notre contribution à [GER.GetNameDef] sera significative demain."
DNZ_workers_front:0 "Arbeitsfront [ROOT.GetAdjective]"
DNZ_workers_front_desc:0 "Nous suivrons le précédent établi par la patrie et créerons notre propre Arbeitsfront. Cela nous permettra de rallier à notre cause ceux qui y sont sensibles dans les milieux industriels."
DNZ_maintain_infrastructure:0 "Améliorer nos infrastructures"
DNZ_maintain_infrastructure_desc:0 "Face à l’opposition tenace des tyrans [POL.GetAdjective], nous devrons nous débrouiller seuls dans de nombreux domaines. Nous devons nous assurer que nos routes sont bien entretenues et aux dernières normes."
DNZ_building_industry:0 "Développer les ateliers locaux"
DNZ_building_industry_desc:0 "Avec l’influence sur le secteur industriel désormais sous contrôle, nous pouvons investir plus lourdement dans nos projets futurs."
DNZ_modernize_the_port:0 "Moderniser le port de Dantzig"
DNZ_modernize_the_port_desc:0 "Le port de Dantzig a été le centre de notre existence ces dernières années. Nous devons tout faire pour le moderniser et le renforcer."
DNZ_business_contacts_abroad:0 "Inviter des investisseurs étrangers"
DNZ_business_contacts_abroad_desc:0 "La reconnaissance internationale en tant qu’État souverain est primordiale pour notre survie face à l’agression [POL.GetAdjective]. Nous rencontrerons autant d’investisseurs et d’entreprises que possible pour atteindre cet objectif."
DNZ_support_german_businesses:0 "Soutenir les entreprises [GER.GetAdjective]"
DNZ_support_german_businesses_desc:0 "Quoi de mieux pour rapprocher encore plus les habitants de Dantzig de [GER.GetNameDef] que de soutenir les entreprises de la patrie sur place ? Nous allons immédiatement planifier leur implantation et leur intégration."
DNZ_german_industrial_ties:0 "Les liens qui nous unissent"
DNZ_german_industrial_ties_desc:0 "Nos liens avec la patrie ne peuvent être plus évidents aux yeux des [POL.GetAdjective]. Cela nous permettra de continuer à nous développer en tant que nation souveraine indépendante tout en patientant pour que la patrie frappe."
DNZ_german_technology:0 "Des scientifiques venus de la patrie"
DNZ_german_technology_desc:0 "Notre patrie nous a gracieusement donné accès à certains de ses chercheurs. Nous suivrons leurs conseils et créerons notre propre institut."
DNZ_hanseatic_ingenuity:0 "Ingéniosité hanséatique"
DNZ_hanseatic_ingenuity_desc:0 "Tout comme la Ligue hanséatique d’autrefois, nous ferons tout pour soutenir nos efforts de recherche et obtenir un avantage technologique sur nos ennemis."
DNZ_deutsches_physik:0 "Deutsches Physik"
DNZ_deutsches_physik_desc:0 "L’idée que des non-Aryens puissent faire partie de nos efforts de recherche est absurde. Nous veillerons à ce que nos équipes soient composées de membres de la race supérieure et poursuivrons les idées posées par Philipp Lenard."
DNZ_modernize_the_police:0 "Moderniser la Schutzpolizei"
DNZ_modernize_the_police_desc:0 "Bien que nous ne puissions officiellement aligner une armée, nous pouvons moderniser et équiper notre police au maximum. Cela nous permettra de repousser toute tentative d’agression [POL.GetAdjective] localement."
DNZ_civic_guard:0 "Créer la garde civique"
DNZ_civic_guard_desc:0 "Alors que nous continuons à développer les forces de police de la Ville libre de Dantzig, les protestations [POL.GetAdjective] contre nos forces partisanes ne cessent de croître. Nous créerons une garde civique en masquant son véritable objectif afin d’éviter les pressions internationales."
DNZ_strenghten_the_security_apparatus:0 "Renforcer la Schutzpolizei"
DNZ_strenghten_the_security_apparatus_desc:0 "Afin de poursuivre nos objectifs d’autodéfense face à l’agression localisée [POL.GetAdjective], nous étendrons les effectifs de chaque district de sécurité et ajouterons de nouveaux districts si nécessaire."
DNZ_dissolve_the_zentrum_party:0 "Dissoudre le parti Zentrum"
DNZ_dissolve_the_zentrum_party_desc:0 "Le parti Zentrum n’apporte que des idéaux inconsidérés et des croyances fragiles au débat politique. Il est temps de les éliminer entièrement du Sénat."
DNZ_planned_militarization:0 "Militariser la Schutzpolizei"
DNZ_planned_militarization_desc:0 "Pour rendre la transition d’une force de police à une force militaire la plus fluide possible, nous organiserons des réunions régulières et des cours sur les dernières tactiques et formations militaires."
DNZ_danzig_military_institute:0 "Institut militaire de Dantzig"
DNZ_danzig_military_institute_desc:0 "Nous devons suivre les avancées militaires des pays étrangers et les appliquer à notre propre armée !"
DNZ_smuggle_weapons:0 "Implanter des armes étrangères"
DNZ_smuggle_weapons_desc:0 "Alors que notre capacité à produire localement des armes n’est pas approuvée par la triste et fatigante Société des Nations, nous commencerons à acquérir des armements depuis la patrie et établirons de petits dépôts à Dantzig pour les stocker."
DNZ_home_defense_unit:0 "Force de défense de Dantzig"
DNZ_home_defense_unit_desc:0 "Alors que nos forces de Schutzpolizei continuent de se moderniser et de s’étendre, certains dirigeants du NSDAP estiment qu’elles ne seront pas suffisantes pour la lutte à venir. Certains vont même jusqu’à dire qu’elles seront défaillantes. Nous créerons notre propre force de défense, directement subordonnée au NSDAP de Dantzig."
DNZ_equipment_effort:0 "Moderniser notre équipement"
DNZ_equipment_effort_desc:0 "Les limites de ce que l’infanterie peut transporter en termes d’équipement ne cessent d’être repoussées. Nous nous concentrerons sur la fourniture des meilleurs outils disponibles à nos troupes."
DNZ_motorization_effort:0 "Motoriser l’armée"
DNZ_motorization_effort_desc:0 "La mobilité et la protection sont essentielles pour amener et retirer les troupes du terrain en toute sécurité. En nous concentrant sur ces développements, nous pourrons agir rapidement."
DNZ_doctrine_effort:0 "Concevoir de nouvelles tactiques"
DNZ_doctrine_effort_desc:0 "Les doctrines militaires qui définissaient le combat terrestre durant la Grande Guerre sont dépassées. Nous devons confier à nos plus grands esprits la tâche de façonner la pensée militaire de demain."
DNZ_equipment_effort_3:0 "Développer l’artillerie locale"
DNZ_equipment_effort_3_desc:0 "Au lieu d’imiter ou d’acheter du matériel étranger, nous devrions devenir un leader mondial dans les armes d’infanterie."
DNZ_armor_effort:0 "Concevoir des véhicules blindés"
DNZ_armor_effort_desc:0 "En appliquant ce que nous avons appris en mécanisant notre infanterie, nous pouvons également améliorer nos véhicules blindés."
DNZ_special_forces:0 "Forces spéciales"
DNZ_special_forces_desc:0 "Nous avons besoin de troupes d’élite ; les troupes de montagne et les parachutistes doivent être notre priorité."
DNZ_aviation_effort:0 "Fonder l’école aérienne"
DNZ_aviation_effort_tt:0 "Pas assez d’emplacements disponibles pour une §Ybase aérienne§!"
DNZ_aviation_effort_desc:0 "Nulle part les avancées technologiques ne sont plus rapides que dans la guerre aérienne. L’aviation est un domaine que toute nation moderne doit maîtriser."
DNZ_fighter_focus:0 "Priorité aux chasseurs"
DNZ_fighter_focus_desc:0 "Nous n’avons pas vu les derniers combats aériens de la Grande Guerre. Rester en avance dans le développement des avions de chasse nous donnera un avantage à l’avenir."
DNZ_bomber_focus:0 "Priorité aux bombardiers"
DNZ_bomber_focus_desc:0 "Lorsque les générations futures parleront de l’horreur des guerres d’aujourd’hui, le feu tombant du ciel occupera une place importante. Nous ferons tout pour que nos ennemis soient ceux qui racontent ces histoires."
DNZ_aviation_effort_2:0 "Étudier les tactiques étrangères"
DNZ_aviation_effort_2_desc:0 "Des avancées supplémentaires en aviation seront nécessaires pour bien intégrer notre force aérienne avec les autres branches de l’armée."
DNZ_CAS_effort:0 "Bombardiers en piqué"
DNZ_CAS_effort_desc:0 "Une armée moderne a besoin du soutien de véhicules au sol comme dans les airs."
DNZ_rocket_effort:0 "Moteurs-fusées"
DNZ_rocket_effort_desc:0 "Les moteurs-fusées et à réaction permettent des vitesses inédites pour les engins pilotés comme non pilotés. Être pionniers dans ces technologies nous permettra de surprendre l’ennemi."
DNZ_NAV_effort:0 "Bombardiers navals"
DNZ_NAV_effort_desc:0 "Tout comme la nouvelle guerre navale se joue sous la surface de l’eau, une partie se déroule aussi dans les airs au-dessus des océans."
DNZ_establish_the_danzig_navy:0 "Établir la marine [ROOT.GetAdjective]"
DNZ_establish_the_danzig_navy_desc:0 "L’expansion de notre marine doit être notre priorité. Allouons toutes les ressources disponibles à de nouveaux chantiers navals et à la recherche sur les navires de surface légers."
DNZ_flexible_navy:0 "Marine flexible"
DNZ_flexible_navy_desc:0 "Réinventer la guerre navale pour tenir compte des progrès de la technologie sous-marine nous permettra de frapper efficacement les convois ennemis."
DNZ_large_navy:0 "Grande marine"
DNZ_large_navy_desc:0 "Adapter nos doctrines navales pour accueillir de grands navires et assurer la sécurité de nos convois commerciaux nous apprendra beaucoup sur les navires dont nous avons besoin."
DNZ_submarine_effort:0 "Guerre sous-marine"
DNZ_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus passionnant depuis l’invention du torpilleur. Nous ferions bien de nous protéger contre les sous-marins et de les utiliser contre la flotte marchande ennemie."
DNZ_cruiser_effort:0 "Concevoir des croiseurs"
DNZ_cruiser_effort_desc:0 "Avant de se lancer dans la recherche avancée sur les cuirassés, les plus petits croiseurs doivent être remplacés."
DNZ_destroyer_effort:0 "Concevoir des destroyers"
DNZ_destroyer_effort_desc:0 "En étudiant la conception et l’usage stratégique des sous-marins, nous avons également appris à contrer ces stratégies. Les destroyers seront cruciaux pour cela."
DNZ_capital_ships_effort:0 "Intérêt pour les grands navires"
DNZ_capital_ships_effort_desc:0 "La nation possédant le plus de cuirassés dominera les océans. Les cuirassés et les porte-avions représentent à la fois l’ancien et le nouveau dans la supériorité navale."

