 r56_CAN_royal_twenty_centers:0 "[Root.GetTwentyCentersName]"
 r56_CAN_royal_twenty_centers_desc:0 "En raison de la §YGrande Dépression§!, le gouvernement a instauré un système controversé de camps à l’échelle nationale pour fournir du travail aux hommes célibataires, chômeurs et sans-abri [CAN.GetAdjective]. On les appelle les « Royal Twenty Centers » pour leur paie de 20 cents par jour. Travaillant de longues heures pour un salaire dérisoire, leur éthique de travail n’est pas exemplaire. Ces camps ont été tenus responsables de plusieurs émeutes, et d’autres pourraient survenir si nous ne les fermons pas.\n\n§YPourrait provoquer des émeutes à l’avenir.§!"
 R56_CAN_TWENTY_CENTERS_ROYAL:0 "Royal Twenty Centers"
 R56_CAN_TWENTY_CENTERS:0 "Les Twenty Centers"

 r56_CAN_royal_twenty_centers_angered:0 "[Root.GetTwentyCentersAngeredName]"
 r56_CAN_royal_twenty_centers_angered_desc:0 "En raison de la §YGrande Dépression§!, le gouvernement a instauré un système controversé de camps à l’échelle nationale pour fournir du travail aux hommes célibataires, chômeurs et sans-abri [CAN.GetAdjective]. On les appelle les « Royal Twenty Centers » pour leur paie de 20 cents par jour. Travaillant de longues heures pour un salaire dérisoire, leur éthique de travail n’est pas exemplaire. Ces camps ont été tenus responsables de plusieurs émeutes, et d’autres pourraient survenir si nous ne les fermons pas.\n\nAprès avoir utilisé la force pour réprimer leur émeute, les Twenty Centers sont encore plus en colère qu’avant. §RPourrait provoquer de graves émeutes à l’avenir.§!"
 R56_CAN_TWENTY_CENTERS_ROYAL_ANGERED:0 "Royal Twenty Centers"
 R56_CAN_TWENTY_CENTERS_ANGERED:0 "Les Twenty Centers"

 r56_CAN_royal_twenty_centers_compensated:0 "Compensation des émeutiers"

