#Focus
r56_CAN_modernize_industry:0 "Moderniser l'industrie"
r56_CAN_modernize_industry_desc:0 "Notre capacité et nos méthodes industrielles ont pris du retard ; nous devons rattraper notre retard."

r56_can_rifle_association:0 "Association de tir du Dominion du Canada"
r56_can_rifle_association_desc:0 "L’Association de tir du Dominion du Canada a été fondée en 1868 et constituée par un acte du parlement en 1900. Nous devrions soutenir l’expansion de cette organisation afin que davantage de Canadiens apprennent à manier les armes à feu."

r56_CAN_wheat_board:0 "Commission canadienne du blé"
r56_CAN_wheat_board_desc:0 "Mettre en place la Commission canadienne du blé pour fixer les prix du blé et de l’orge provenant de nos agriculteurs permettra de stabiliser les prix et d’améliorer notre économie."

r56_CAN_depression_recovery:0 "Poursuivre la sortie de crise"
r56_CAN_depression_recovery_desc:0 "La Grande Dépression nous a durement touchés ; nous devons continuer à adapter et à modifier nos politiques pour poursuivre le chemin de la reprise."

r56_CAN_national_housing_act:0 "Loi nationale sur le logement"
r56_CAN_national_housing_act_desc:0 "Les séquelles de la Grande Dépression ont laissé de nombreux Canadiens sans-abri et au chômage. Mettre en place des programmes et des règlements pour réparer et moderniser les logements existants, ainsi que construire de nouvelles habitations, aidera les personnes touchées à se rétablir."

r56_CAN_shutdown_relief_camps:0 "Fermer les camps de secours"
r56_CAN_shutdown_relief_camps_desc:0 "Les camps de secours pour chômeurs n’ont pas été un succès ; nous devrions les fermer avant que d’autres émeutes n’éclatent."

r56_CAN_dollar_a_year_men:0 "Les hommes du dollar symbolique"
r56_CAN_dollar_a_year_men_desc:0 "Plusieurs dirigeants d’entreprises expérimentés ont offert leurs services au gouvernement pour un dollar symbolique par an. Nous devrions les employer dans notre ministère de l’Armement et de l’Approvisionnement ainsi qu’au Bureau des prix et du commerce en temps de guerre, où ils pourront fournir à l’industrie canadienne l’expertise nécessaire pour mobiliser l’économie et maximiser la production."

r56_CAN_canadian_pacific_railways:0 "Chemins de fer du Canadien Pacifique"
r56_CAN_canadian_pacific_railways_desc:0 "Le Canadien Pacifique a mis ses chemins de fer et ses transports à la disposition de l’effort de guerre. Nos troupes et les fournitures nécessaires traverseront notre vaste Dominion sans délai."

r56_CAN_national_steel_car:0 "National Steel Car"
r56_CAN_national_steel_car_desc:0 "Malgré l’impact de la Dépression, National Steel Car est prêt, avec son savoir-faire, à construire les véhicules qui transporteront nos troupes et notre matériel militaire sur le réseau ferroviaire."

r56_CAN_cbc_focus:0 "La SRC"
r56_CAN_cbc_focus_desc:0 "La Société Radio-Canada est le réseau national de radiodiffusion et l’organisme de régulation des émissions au Canada. Utiliser ce réseau pour diffuser nos politiques et programmes nationaux renforcera la confiance du public envers notre gouvernement."

r56_CAN_bank_of_canada:0 "Nationaliser la Banque du Canada"
r56_CAN_bank_of_canada_desc:0 "Le besoin d’une autorité bancaire centrale s’est accru après la Grande Dépression ; en la nationalisant, nous pourrons gérer directement les finances de l’État et améliorer l’économie."

r56_CAN_john_inglis_company:0 "John Inglis and Company"
r56_CAN_john_inglis_company_desc:0 "Éprouvée par la Grande Dépression, John Inglis and Company a longtemps été essentielle à nos capacités de production. Nous devrions leur confier la fabrication de nouvelles mitrailleuses et pièces d’artillerie pour nos troupes."

r56_CAN_national_railway:0 "Étendre les chemins de fer au Québec"
r56_CAN_national_railway_desc:0 "Les efforts visant à améliorer l’infrastructure et les chemins de fer au Québec peuvent stimuler la croissance industrielle."

r56_CAN_research_grants:0 "Bourses de recherche"
r56_CAN_research_grants_desc:0 "Avec notre industrie et nos capacités de production considérablement développées, nous pouvons désormais permettre à plus de scientifiques et d’innovateurs canadiens de mener des projets de recherche et développement locaux."

r56_CAN_debt_adjustment_act:0 "Loi d’ajustement des dettes"
r56_CAN_debt_adjustment_act_desc:0 "Une vague inquiétante d’insolvabilités et de dettes a touché les agriculteurs canadiens. Il est dans l’intérêt du pays de les aider afin qu’ils puissent continuer à cultiver leurs terres."

r56_CAN_alcan:0 "Compagnie d’aluminium du Canada"
r56_CAN_alcan_desc:0 "L’aluminium est léger et inoxydable. En développant notre extraction et notre production, nous pourrons alimenter en continu nos usines."

r56_CAN_imperial_oil_focus:0 "Expansion de la raffinerie de Dartmouth"
r56_CAN_imperial_oil_focus_desc:0 "Une raffinerie de pétrole fonctionnait à Dartmouth lors du précédent conflit, approvisionnant nos besoins. L’agrandir est vital pour assurer les traversées de convois à travers l’Atlantique Nord."

r56_CAN_establish_the_polymer_corporation:0 "Fonder la Polymer Corporation"
r56_CAN_establish_the_polymer_corporation_desc:0 "Si notre accès au caoutchouc naturel est coupé, nous devons développer notre capacité à produire et raffiner du caoutchouc synthétique, utilisé dans tout, des pneus aux pièces d’avion."

r56_CAN_uranium_mining:0 "Exploitation de l’uranium"
r56_CAN_uranium_mining_desc:0 "Un minerai spécifique extrait au Canada détient la clé d’armes au potentiel destructeur incroyable. Nous prendrons l’initiative de l’exploiter au maximum."

r56_CAN_resources_for_war_effort:0 "Ressources pour l’effort de guerre"
r56_CAN_resources_for_war_effort_desc:0 "Les améliorations continues des méthodes d’extraction nous permettent d’extraire plus efficacement."

r56_CAN_enlist_the_unemployed:0 "Recruter les chômeurs"
r56_CAN_enlist_the_unemployed_desc:0 "Le service militaire est un sujet sensible au Canada. Pour répondre aux besoins en effectifs tout en évitant de diviser le pays, nous encouragerons les chômeurs à s’engager, avec l’assurance de ne pas les envoyer outre-mer."

r56_CAN_war_economy:0 "Économie tournée vers la guerre"
r56_CAN_war_economy_desc:0 "Nos industries se sont remises de la Grande Dépression. Il est temps de les orienter vers la production d’armements pour nous et nos alliés."

r56_CAN_war_measures_act:0 "Réactiver la Loi sur les mesures de guerre"
r56_CAN_war_measures_act_desc:0 "La Loi sur les mesures de guerre définit les mesures d’urgence que nous pouvons prendre en cas de guerre, d’invasion ou d’insurrection."
r56_CAN_wartime_prices_and_trade_board:0 "Commission des prix et du commerce en temps de guerre"
r56_CAN_wartime_prices_and_trade_board_desc:0 "La Commission des prix et du commerce en temps de guerre est notre première ligne de défense contre l’inflation et les troubles sociaux au [CAN.GetNameDef]. Pour éviter la spéculation et le stockage abusif, un contrôle des prix a été instauré afin que la majorité des [CAN.GetAdjective]s puissent accéder aux biens."

r56_CAN_nrma:0 "Loi sur la mobilisation des ressources nationales"
r56_CAN_nrma_desc:0 "Le Canada est vaste, avec une population dispersée en poches sur l’ensemble du territoire. Nous devrions mettre en place un système pour suivre l’emploi et localiser toute personne apte à servir à l’étranger."

r56_CAN_conscription_crisis:0 "Conscription forcée"
r56_CAN_conscription_crisis_desc:0 "Comme en 1917, nos citoyens canadiens-français du Québec s’opposent à l’instauration d’une conscription nationale pour renforcer notre armée. Nous ne resterons pas les bras croisés pendant qu’une minorité défie la volonté du [CAN.GetNameDef]."

r56_CAN_replace_men_in_the_industry:0 "Remplacer les hommes dans l’industrie par des femmes"
r56_CAN_replace_men_in_the_industry_desc:0 "Alors que nos hommes sont appelés à servir le pays à l’étranger, notre appareil industriel a toujours besoin de main-d’œuvre. Il est peut-être temps que les femmes prennent leur part dans l’effort national en fabriquant les armements que ces hommes utiliseront bientôt."

r56_CAN_department_of_munitions_and_supply:0 "Ministère de l’Armement et de l’Approvisionnement"
r56_CAN_department_of_munitions_and_supply_desc:0 "La production d’armements et d’équipements est essentielle à l’effort de guerre. Nous placerons les ressources nationales du [CAN.GetNameDef] sous la direction de C.D. Howe au ministère de l’Armement et de l’Approvisionnement."

r56_CAN_bits_and_pieces_program:0 "Programme « Pièces et morceaux »"
r56_CAN_bits_and_pieces_program_desc:0 "Le programme « Pièces et morceaux » mobilisera pour l’effort de guerre plusieurs petites usines auparavant dédiées à des biens de consommation mineurs. Même une modeste fabrique de vélos peut trouver la capacité de produire une mitrailleuse."

r56_CAN_nrc_expansion:0 "Étendre le Conseil national de recherches"
r56_CAN_nrc_expansion_desc:0 "Le CNR a prouvé son efficacité pour améliorer la qualité de vie au Canada. Fort de son histoire scientifique et technique, le besoin en chercheurs est plus pressant que jamais. Il est temps de renforcer encore davantage le CNR pour défendre le [CAN.GetNameDef]."

r56_CAN_defence_of_canada_regulations:0 "Règlements sur la défense du Canada"
r56_CAN_defence_of_canada_regulations_desc:0 "Les droits civils doivent être restreints en temps de guerre pour éviter toute subversion de l’effort national. Cela implique des limitations sur la presse, les groupes dissidents et certaines libertés juridiques."

r56_CAN_british_designs:0 "[Root.GetBritishDesignsName]"
r56_CAN_british_designs_desc:0 "[Root.GetBritishDesignsDesc]"
R56_CAN_ENG_KEY:0 "Plans [ENG.GetAdjective]"
R56_CAN_FREE_KEY:0 "Nos plans"
R56_CAN_SOV_KEY:0 "Plans [SOV.GetAdjective]"
R56_CAN_USA_KEY:0 "Plans [USA.GetAdjective]"
R56_CAN_GER_KEY:0 "Plans [GER.GetAdjective]"
R56_CAN_ENG_DESC_KEY:0 "Nous devrions importer et utiliser des plans [ENG.GetAdjective] pour nos armes d’infanterie et d’artillerie."
R56_CAN_FREE_DESC_KEY:0 "Nous devrions concevoir nous-mêmes nos armes d’infanterie et d’artillerie."
R56_CAN_SOV_DESC_KEY:0 "Nous devrions importer et utiliser des plans [SOV.GetAdjective] pour nos armes d’infanterie et d’artillerie."
R56_CAN_USA_DESC_KEY:0 "Nous devrions importer et utiliser des plans [USA.GetAdjective] pour nos armes d’infanterie et d’artillerie."
R56_CAN_GER_DESC_KEY:0 "Nous devrions importer et utiliser des plans [GER.GetAdjective] pour nos armes d’infanterie et d’artillerie."

r56_CAN_army_modernisation:0 "Modernisation de l’armée"
r56_CAN_army_modernisation_desc:0 "Trop longtemps à l’abri dans notre maison à l’épreuve du feu, loin de tout danger immédiat, le Canada a laissé son armée se contenter d’un équipement et d’un entraînement obsolètes. Nous devons moderniser avant qu’il ne soit trop tard."

r56_CAN_increase_budget:0 "Augmenter le budget militaire"
r56_CAN_increase_budget_desc:0 "Nous avons privé nos forces armées de fonds pour moderniser leur équipement et s’entraîner depuis trop longtemps. Avec le conflit qui s’annonce, il est temps de se préparer au mieux."

r56_CAN_increase_budget_more:0 "Poursuivre l’augmentation du budget militaire"
r56_CAN_increase_budget_more_desc:0 "Alors que les tensions montent dans le monde entier, il est prudent de continuer à investir dans la sécurité du [CAN.GetNameDef]."

r56_CAN_cmp_truck:0 "Camion CMP"
r56_CAN_cmp_truck_desc:0 "Le [CAN.GetNameDef] dispose d’une importante industrie automobile capable de produire en masse des véhicules qui seront utiles à nos forces armées. Notre modèle de camion CMP est polyvalent et adapté à de nombreux climats et terrains."

r56_CAN_valentine_tank:0 "Le char Valentine"
r56_CAN_valentine_tank_desc:0 "Nous avons obtenu une licence pour produire le char Valentine, un char moyen robuste de conception [ENG.GetAdjective]."

r56_CAN_retool_angus_shops:0 "Rééquiper les ateliers Angus du CPR"
r56_CAN_retool_angus_shops_desc:0 "Les ateliers Angus étaient spécialisés dans la fabrication, la réparation et la vente de wagons pour le CPR. Avec un peu d’investissement et de rééquipement, nous pourrions utiliser leurs installations et leur expertise pour fabriquer les chars dont notre armée mécanisée moderne a tant besoin."

r56_CAN_canadian_armoured_corps:0 "[Root.GetArmouredCorpsName]"
r56_CAN_canadian_armoured_corps_desc:0 "Notre industrie automobile possède désormais l’expérience nécessaire pour fabriquer des véhicules blindés. Nous pouvons tenter de développer des modèles locaux pour équiper notre corps blindé."
R56_CAN_ARMOURED_CORPS:0 "Corps blindé [CAN.GetAdjective]"
R56_CAN_ARMOURED_CORPS_ROYAL:0 "Corps blindé royal [CAN.GetAdjective]"

r56_CAN_kangaroo:0 "Le Kangaroo"
r56_CAN_kangaroo_desc:0 "Même si un char possède une puissance de feu redoutable, il reste vulnérable sans soutien d’infanterie. Nous pourrions transporter nos troupes dans ces véhicules blindés rapides pour capturer des objectifs tout en appuyant nos chars. Nous avons besoin de l’autorisation pour lancer leur fabrication."

r56_CAN_the_ram:0 "Le Ram"
r56_CAN_the_ram_desc:0 "Nous avons obtenu les plans de notre voisin du sud pour produire une variante locale d’un char fiable et correctement blindé."

r56_CAN_royal_canadian_artillery:0 "[Root.GetArtilleryCorpsName]"
r56_CAN_royal_canadian_artillery_desc:0 "Malgré le manque de canons modernes, nous devons former nos artilleurs à mener une guerre moderne, y compris avec des tactiques utilisant des canons antiaériens et de nouveaux obusiers de 25 livres."
R56_CAN_ARTILLERY_CORPS:0 "Artillerie [CAN.GetAdjective]"
R56_CAN_ARTILLERY_CORPS_ROYAL:0 "Artillerie royale [CAN.GetAdjective]"

r56_CAN_royal_canadian_corps_of_signals:0 "[Root.GetSignalCorpsName]"
r56_CAN_royal_canadian_corps_of_signals_desc:0 "[Root.GetSignalCorpsDesc]"
R56_CAN_SIGNAL_CORPS:0 "Corps des transmissions [CAN.GetAdjective]"
R56_CAN_SIGNAL_CORPS_ROYAL:0 "Corps royal des transmissions [CAN.GetAdjective]"
R56_CAN_SIGNAL_CORPS_DESC:0 "Le Corps des transmissions canadien a été fondé en 1903, et il sera encore plus utile depuis l’invention du talkie-walkie."
R56_CAN_SIGNAL_CORPS_ROYAL_DESC:0 "Le Corps royal des transmissions canadien a été fondé en 1903, et il sera encore plus utile depuis l’invention du talkie-walkie."

r56_CAN_small_arms_limited:0 "Small Arms Ltd."
r56_CAN_small_arms_limited_desc:0 "Nous avons sécurisé les fonds et recruté du personnel formé à l’étranger pour la fabrication d’armes à feu. Pour répondre à nos besoins en armement d’infanterie, cette société spécialisée disposera du terrain et des infrastructures nécessaires."

r56_CAN_camp_borden:0 "Camp Borden"
r56_CAN_camp_borden_desc:0 "Pendant la Grande Guerre, le Camp Borden a servi à entraîner les unités du Corps expéditionnaire canadien. L’agrandir pour former notre corps blindé et notre infanterie est une étape essentielle pour rendre nos troupes plus efficaces sur le terrain."

r56_CAN_land_mattress:0 "Le Land Mattress"
r56_CAN_land_mattress_desc:0 "Ces armes, bien nommées, bombardent une zone avec des roquettes, offrant une portée plus longue et une charge explosive supérieure à celle de l’artillerie classique."

r56_CAN_first_special_service_force:0 "Première Force de service spécial"
r56_CAN_first_special_service_force_desc:0 "Une unité de commandos spéciale devra être disponible pour des missions « non conventionnelles » et dangereuses. Nous formerons cette force avec l’aide de nos alliés."

r56_CAN_walkie_talkie:0 "Talkie-walkie"
r56_CAN_walkie_talkie_desc:0 "Donald Hings a inventé et est en train de breveter un nouvel appareil portatif de communication bidirectionnelle fonctionnant par ondes radio. Cela améliorera considérablement les communications et la précision des tirs."

r56_CAN_start_the_expansion_of_the_rcaf:0 "[Root.GetRCAFArmamentName]"
r56_CAN_start_the_expansion_of_the_rcaf_desc:0 "Le corps aérien canadien est la plus jeune branche des forces armées. Nous devrions former une nouvelle génération de pilotes pour nous préparer aux conflits à venir."
R56_CAN_RCAF:0 "Lancer l’expansion de l’ARC"
R56_CAN_CAF:0 "Lancer l’expansion des FAC"

r56_CAN_western_air_command:0 "Commandement aérien de l’Ouest"
r56_CAN_western_air_command_desc:0 "L’hémisphère occidental est peu peuplé et difficile à couvrir entièrement par des patrouilles. Nous devrons compter sur des systèmes d’alerte précoce, comme une chaîne de stations radar, pour détecter toute activité suspecte en provenance du Pacifique."

r56_CAN_hurricane:0 "Le Hurricane"
r56_CAN_hurricane_desc:0 "Le [ENG.GetNameDefCap] nous a autorisés à produire une série de chasseurs Hurricane. Ces appareils formeront le noyau de notre escadre aérienne."
r56_CAN_canadian_car_and_foundry:0 "Canadian Car and Foundry"
r56_CAN_canadian_car_and_foundry_desc:0 "La CC&F produit depuis longtemps des voitures et d’autres équipements motorisés. Leur fournir des ressources et des contrats pour fabriquer des cellules d’avion destinées à notre corps aérien est un pas dans la bonne direction pour notre production de guerre."

r56_CAN_fairchild_aircraft_company:0 "Fairchild Aircraft Company"
r56_CAN_fairchild_aircraft_company_desc:0 "L’usine Fairchild de Québec devrait recevoir les ressources nécessaires pour accroître la production de pièces de bombardiers. Nous pourrions ainsi augmenter l’emploi dans l’usine de plusieurs milliers de postes."

r56_CAN_victory_aircraft_company:0 "Victory Aircraft"
r56_CAN_victory_aircraft_company_desc:0 "Victory Aircraft a été chargée de construire notre flotte de bombardiers. Des Lancaster pour tout le monde !"

r56_CAN_bomber_group_no_6:0 "Groupe de bombardement n° 6"
r56_CAN_bomber_group_no_6_desc:0 "Nos courageux aviateurs ont longuement servi en bombardant les usines des nations ennemies. Nous devrions les conserver et les placer à des postes d’instruction pour former la prochaine génération de pilotes de bombardiers."

r56_CAN_toronto_island_airport:0 "Aéroport de Toronto Island"
r56_CAN_toronto_island_airport_desc:0 "Des aéroports supplémentaires remplissent un double rôle : permettre le transport civil et accueillir nos avions pour former nos pilotes."

r56_CAN_toronto_air_command:0 "Commandement aérien de Toronto"
r56_CAN_toronto_air_command_desc:0 "Nous pouvons enfin commencer à former sérieusement les aviateurs [CAN.GetAdjective] grâce à notre infrastructure et notre équipement renforcés."

r56_CAN_eastern_air_command:0 "Commandement aérien de l’Est"
r56_CAN_eastern_air_command_desc:0 "En cas de conflit mondial, nous devrons probablement protéger nos convois voyageant dans l’Atlantique Nord. Construire des bases aériennes pour accueillir nos équipages et appareils sera un investissement judicieux pour défendre cette zone stratégique."

r56_CAN_rcaf_womens_division:0 "[Root.GetRCAFWomensDivisionName]"
r56_CAN_rcaf_womens_division_desc:0 "Autoriser les femmes [CAN.GetAdjective] à servir dans l’aviation libérera davantage de main-d’œuvre masculine pour participer à encore plus de missions."
R56_CAN_RCAF_WOMEN:0 "Division féminine de l’ARC"
R56_CAN_CAF_WOMEN:0 "Division féminine des FAC"

r56_CAN_rcaf_station_borden:0 "[Root.GetRCAFStationBordenName]"
r56_CAN_rcaf_station_borden_desc:0 "L’aviation canadienne est née à Borden, en Ontario. Nous devrions utiliser cette base pour former une nouvelle génération de pilotes."
R56_CAN_RCAF_STATION_BORDEN:0 "Base de l’ARC à Borden"
R56_CAN_CAF_STATION_BORDEN:0 "Base des FAC à Borden"

r56_CAN_appoint_air_chief:0 "Nommer un chef d’état-major de l’air"
r56_CAN_appoint_air_chief_desc:0 "Bien que jeune comparée aux autres branches de nos forces armées, l’aviation est une force puissante, encore entravée par l’autorité de l’armée de terre. Nommer un chef d’état-major de l’air est la première étape pour développer et moderniser notre aviation."

r56_CAN_complete_separation_from_army:0 "Séparation complète de l’armée"
r56_CAN_complete_separation_from_army_desc:0 "L’aviation [CAN.GetAdjective] dispose désormais d’une structure et de capacités uniques ; il est temps qu’elle devienne une entité à part entière !"

r56_CAN_rebuilding_the_royal_canadian_navy:0 "[Root.GetRebuildCanadianNavyName]"
r56_CAN_rebuilding_the_royal_canadian_navy_desc:0 "Après des années de coupes budgétaires, notre marine est en piètre état. La montée des tensions internationales exige que nous la reconstruisions pour atteindre nos objectifs."
R56_CAN_REBUILD_RCN:0 "Reconstruire la Marine royale [CAN.GetAdjective]"
R56_CAN_REBUILD_CN:0 "Reconstruire la marine [CAN.GetAdjective]"

r56_CAN_halifax_shipyards:0 "Chantiers navals de Halifax"
r56_CAN_halifax_shipyards_desc:0 "Idéalement situés face à l’Europe, les docks de Halifax construisent de nouveaux navires à un rythme record. Nous pouvons remporter la bataille de l’Atlantique."

r56_CAN_sorel_shipyards:0 "Chantiers navals de Sorel"
r56_CAN_sorel_shipyards_desc:0 "La ville de Sorel possède une importante industrie métallurgique. Investir dans cette région par des contrats de construction navale stimulera l’économie et fournira à la marine de nouveaux chantiers."

r56_CAN_reopen_toronto_shipyards:0 "Rouvrir les chantiers navals de Toronto"
r56_CAN_reopen_toronto_shipyards_desc:0 "La remise en service des installations de construction navale de Toronto sera essentielle pour produire davantage de navires."

r56_CAN_sorel_industries_naval_artillery:0 "Artillerie navale de Sorel Industries"
r56_CAN_sorel_industries_naval_artillery_desc:0 "Sorel Industries combine chantiers navals et usines d’armement lourd en un seul site. Il est logique que ces canons soient installés sur des navires."

NIR_naval_grade_steel:0 "Acier naval"
NIR_naval_grade_steel_desc:0 "Grâce à de nouveaux investissements et à l’expérience acquise dans la construction navale, Sorel Industries a amélioré ses capacités métallurgiques, permettant d’équiper nos navires d’un meilleur blindage."

r56_CAN_focus_on_destroyers:0 "Miser sur les destroyers"
r56_CAN_focus_on_destroyers_desc:0 "La menace des sous-marins contre nos convois de troupes et de ravitaillement exige que nous nous concentrions sur la construction de destroyers pour traquer et éliminer ces dangers sous-marins."

r56_CAN_protect_atlantic_shipping:0 "Protéger la navigation dans l’Atlantique"
r56_CAN_protect_atlantic_shipping_desc:0 "De nouvelles tactiques et formations pour l’escorte des convois nous seront précieuses dans les batailles à venir."

r56_CAN_merchant_fleet:0 "Flotte marchande"
r56_CAN_merchant_fleet_desc:0 "Les convois seront la bouée de sauvetage pour approvisionner nos forces outre-mer et nos alliés. Nous veillerons à la constitution d’une flotte marchande."

r56_CAN_fight_the_uboats:0 "Combattre les U-Boote"
r56_CAN_fight_the_uboats_desc:0 "La menace sous-marine est indéniable. Nos forces disposeront de formations et d’équipements supplémentaires pour y faire face."

r56_CAN_degaussing:0 "Démagnétisation"
r56_CAN_degaussing_desc:0 "Nous allons commencer à démagnétiser les coques de nos navires, réduisant leur signature magnétique. Cela les protège des mines magnétiques et diminue leur profil électronique."

r56_CAN_expand_the_navy:0 "Étendre la marine"
r56_CAN_expand_the_navy_desc:0 "Construire davantage de chantiers navals nous aidera à réaliser nos projets d’expansion maritime."

r56_CAN_wrens:0 "[Root.GetWrensName]"
r56_CAN_wrens_desc:0 "La création d’une unité navale permettant aux femmes de servir contribuera à notre expansion navale et apportera plus de volontaires à la marine."
R56_CAN_WRENS_NAME:0 "Service féminin royal [CAN.GetAdjective] de la marine"
R56_CAN_WENS_NAME:0 "Service féminin [CAN.GetAdjective] de la marine"

r56_CAN_the_pacific_ocean:0 "L’océan Pacifique"
r56_CAN_the_pacific_ocean_desc:0 "Notre flanc ouest est l’océan Pacifique, vaste terrain de jeu pour nos ennemis. Nous devons nous préparer à toute éventualité."

r56_CAN_ships_for_the_pacific:0 "Navires pour le Pacifique"
r56_CAN_ships_for_the_pacific_desc:0 "Nous pouvons bâtir nos flottes autour de croiseurs légers et lourds, et nous disposons de suffisamment de ports pour rendre cette stratégie viable."

r56_CAN_invasion_transports:0 "Transports d’invasion"
r56_CAN_invasion_transports_desc:0 "Harceler les lignes maritimes ennemies ne suffira pas à réduire la menace sur le [CAN.GetNameDef]. Nous devons frapper les premiers et frapper vite avec l’équipement adéquat pour nos troupes."

r56_CAN_rural_class_carriers:0 "Porte-avions classe Rural"
r56_CAN_rural_class_carriers_desc:0 "Notre position géographique, entre deux mers et à la frontière d’une grande puissance, est unique. Pour assurer notre suprématie navale, nous devons construire des porte-avions capables d’acheminer des avions au combat et de protéger nos voies maritimes."

r56_CAN_trust_in_the_commonwealth:0 "Confiance dans le Commonwealth"
r56_CAN_trust_in_the_commonwealth_desc:0 "Nos compagnons du Commonwealth sont nos alliés les plus sûrs, et nous devons marcher ensemble pour soutenir Sa Majesté."

r56_CAN_commonwealth_air_training_plan:0 "Programme du Commonwealth de formation aérienne"
r56_CAN_commonwealth_air_training_plan_desc:0 "Nous coordonnerons l’entraînement au combat aérien avec nos alliés du Commonwealth et des Dominions. C’est plus efficace et cela peut être réalisé en masse et en toute sécurité sur nos aérodromes."

r56_CAN_build_fighters_for_the_empire:0 "Construire des chasseurs pour l’Empire"
r56_CAN_build_fighters_for_the_empire_desc:0 "L’Empire a un besoin urgent d’avions légers. Grâce à notre industrie automobile, nous pouvons les fournir et contribuer ainsi à notre Commonwealth."

r56_CAN_CAMP_X:0 "Camp X"
r56_CAN_CAMP_X_desc:0 "Nous centraliserons la collecte de renseignements et la formation des espions dans un lieu secret près d’Oshawa, bien situé pour intercepter les signaux en provenance du [ENG.GetNameDef] et du [USA.GetNameDef]."

r56_CAN_hydra:0 "Hydra"
r56_CAN_hydra_desc:0 "Benjamin deForest Bayly a construit à Camp X une station de relais télécom capable d’intercepter les communications radio des Alliés dans le monde entier. Nous pouvons désormais aussi décrypter et lire le courrier et les transmissions ennemies, loin de leurs yeux indiscrets. N’en parlez à personne, pas même au Premier ministre."

r56_CAN_permanent_joint_defence_board:0 "Commission permanente mixte de défense"
r56_CAN_permanent_joint_defence_board_desc:0 "La géographie et l’héritage commun nous lient au [USA.GetNameDef], mais le continent est trop vaste pour que l’un de nous le défende seul. Une commission mixte de défense est nécessaire pour consulter et planifier la protection de l’Amérique du Nord."

r56_CAN_british_ships:0 "Acheter des navires [ENG.GetAdjective]"
r56_CAN_british_ships_desc:0 "Nous avons un besoin urgent de navires pour protéger nos convois. Peut-être pourrions-nous en acheter à la Mère Patrie ?"

r56_CAN_forge_our_own_future:0 "Forger notre avenir"
r56_CAN_forge_our_own_future_desc:0 "Le [CAN.GetNameDefCap] est une nation souveraine, et nous seuls pouvons décider de la voie que nous suivrons dans ce monde."

r56_CAN_shadow_factories:0 "Usines de l’ombre"
r56_CAN_shadow_factories_desc:0 "Une tempête se prépare pour nous et nos alliés. Préparer notre infrastructure et notre économie à une éventuelle mobilisation de guerre sera un processus long et ardu."

r56_CAN_frogmen_of_burma:0 "Les hommes-grenouilles"
r56_CAN_frogmen_of_burma_desc:0 "Avec l’aide de nos alliés, nous pourrions créer une nouvelle unité d’élite, capable d’exploiter le potentiel stratégique des nageurs de combat. Lord Mountbatten a exprimé son intérêt pour ce projet."
r56_CAN_tizard_visit:0 "La visite Tizard"
r56_CAN_tizard_visit_desc:0 "Un scientifique venu de la Mère Patrie nous a présenté la perspective réellement prometteuse de travailler ensemble au sein d’équipes techniques et de partager des inventions capables de gagner la guerre."

r56_CAN_montreal_laboratory:0 "Le laboratoire de Montréal"
r56_CAN_montreal_laboratory_desc:0 "Le laboratoire de Montréal dispose des moyens intellectuels nécessaires pour concevoir et construire une bombe d’une puissance inimaginable, en utilisant l’uranium afin de provoquer une réaction de fission nucléaire incontrôlée. Nous allons en faire une réalité."

r56_CAN_construct_the_cape_spear_forts:0 "Construire les forts de Cape Spear"
r56_CAN_construct_the_cape_spear_forts_desc:0 "Nous pouvons nous attendre à une invasion navale sur nos côtes. La construction d’un fort maritime sera la meilleure défense et un moyen de dissuasion efficace contre cette menace."

r56_CAN_fascism:0 "Un Canada grandiose"
r56_CAN_fascism_desc:0 "Un Canada fort tire sa puissance d’un dirigeant fort. Faisons comprendre cette vérité au peuple canadien."

r56_CAN_national_social_christian_party:0 "Le Parti national social chrétien"
r56_CAN_national_social_christian_party_desc:0 "Un parti prônant l’idéal d’un Canada plus pur est apparu. Adoptons ce parti et écrasons ces insidieux communistes."

r56_CAN_the_canadian_fuhrer:0 "Le Führer [CAN.GetAdjective]"
r56_CAN_the_canadian_fuhrer_desc:0 "Un homme doté d’un amour infini pour le Canada et d’une volonté de fer pour défendre ses droits s’est levé. Gloire au parti ! Gloire à notre chef !"

r56_CAN_restrict_immigration:0 "Restreindre l’immigration"
r56_CAN_restrict_immigration_desc:0 "Le [CAN.GetNameDefCap] est pour les [CAN.GetAdjective], et il n’en sera pas autrement. Le noble peuple de ce pays ne sera pas submergé par des réfugiés à la loyauté douteuse."

r56_CAN_quell_quebec_nationalism:0 "Réprimer le nationalisme québécois"
r56_CAN_quell_quebec_nationalism_desc:0 "Le Québec est une partie inaliénable du [CAN.GetNameDef]. Il n’y a pas de question séparatiste dans ce grand pays."

r56_CAN_a_united_canada:0 "[CAN.GetAdjective]s unis"
r56_CAN_a_united_canada_desc:0 "Avec notre peuple uni, nous pouvons désormais commencer à répandre notre gloire à travers tout l’hémisphère. Vive le Grand Canada !"

r56_CAN_arrest_the_anti_fascists:0 "Arrêter les antifascistes"
r56_CAN_arrest_the_anti_fascists_desc:0 "Certains éléments de la gauche traîtresse s’organisent pour contrer l’ordre naturel des choses. Nous leur montrerons la voie véritable vers la gloire."

r56_CAN_canadian_union_of_fascists:0 "L’Union canadienne des fascistes"
r56_CAN_canadian_union_of_fascists_desc:0 "Un parti soutenant une politique de prospérité économique grâce à une alliance avec les intérêts économiques est apparu sur la scène politique. Le [CAN.GetNameDefCap] ferait bien d’aider cette faction à triompher !"

r56_CAN_arcand_in_the_government:0 "Arcand au gouvernement"
r56_CAN_arcand_in_the_government_desc:0 "Adrien Arcand est l’un des rares hommes au [CAN.GetNameDef] conscients des problèmes qui le minent tant à l’intérieur qu’à l’extérieur. Nous devrions lui offrir une place au gouvernement, malgré certaines divergences idéologiques."

r56_CAN_unite_the_fascist_parties:0 "Unir les organisations fascistes"
r56_CAN_unite_the_fascist_parties_desc:0 "Nos méthodes peuvent différer, mais notre objectif final reste le même. Nous marcherons ensemble sur ce chemin aux côtés de nos nouveaux alliés."

r56_CAN_form_the_blue_shirts:0 "Former les Chemises bleues"
r56_CAN_form_the_blue_shirts_desc:0 "Les Chemises bleues seront le bras défensif principal et l’épine dorsale idéologique de notre institution. Légaliser ce mouvement nous fournira suffisamment de cadres loyaux pour alimenter notre machine de guerre."

r56_CAN_create_youth_wing:0 "Créer une organisation de jeunesse"
r56_CAN_create_youth_wing_desc:0 "La jeunesse de l’État détient la clé pour réaliser le rêve d’un Grand Canada."

r56_CAN_a_one_party_state:0 "Un État à parti unique"
r56_CAN_a_one_party_state_desc:0 "Un État multipartite ne peut qu’engendrer la dissension et la destruction de l’intérieur. Désormais, le [CAN.GetNameDef] sera dirigé par un seul mouvement glorieux, du peuple, par le peuple et pour le peuple."

r56_CAN_anti_democracy:0 "Une nation antidémocratique"
r56_CAN_anti_democracy_desc:0 "La démocratie est une tache dans l’histoire, refusant aux nations leur droit divin à la gloire."

r56_CAN_strength_through_conquest_idea:0 "La force par la conquête"

r56_CAN_canadian_nationalism:0 "Nationalisme [CAN.GetAdjective]"
r56_CAN_canadian_nationalism_desc:0 "Le [CAN.GetNameDefCap] est désormais un État indépendant avec un peuple indépendant. Faire connaître ce fait aux citoyens renforcera leur détermination contre toute manipulation extérieure."

r56_CAN_strenght_through_conquest:0 "La force par la conquête"
r56_CAN_strenght_through_conquest_desc:0 "Seul le creuset du conflit peut permettre au [CAN.GetNameDef] de prospérer."

r56_CAN_seek_closer_ties_to_germany:0 "Chercher à se rapprocher du [GER.GetNameDef]"
r56_CAN_seek_closer_ties_to_germany_desc:0 "[GER.GetLeader] s’est révélé être un homme raisonnable, formulant des exigences raisonnables tout en rendant sa nation forte. Nous rejoindrons le [GER.GetNameDef] en solidarité pour un nouvel âge d’or."

r56_CAN_demand_newfoundland_and_labrador:0 "Réclamer Terre-Neuve-et-Labrador"
r56_CAN_demand_newfoundland_and_labrador_desc:0 "Terre-Neuve est un Dominion en faillite, contraint de redevenir colonie. Sa place naturelle est au sein du [CAN.GetNameDef]. Nous ne tolérerons plus leur contrôle sur nos terres. Nous les prendrons, quel qu’en soit le prix."

r56_CAN_form_our_own_alliance:0 "Former une alliance"
r56_CAN_form_our_own_alliance_desc:0 "La Mère Patrie a embrassé sa propre version du fascisme, et pour une fois nous partageons ses aspirations. Marchons ensemble sur cette voie, comme de bons camarades."

r56_CAN_support_the_british_union_of_fascists:0 "Soutenir l’Union britannique des fascistes"
r56_CAN_support_the_british_union_of_fascists_desc:0 "L’UBF est peut-être l’une des dernières lignes de défense contre la tyrannie des démocraties. Nous devons leur apporter un soutien total pour qu’ils l’emportent."
r56_CAN_strict_anti_communism:0 "Anticommunisme"
r56_CAN_strict_anti_communism_desc:0 "La peste rouge du bolchevisme n’aura aucun pouvoir sur [CAN.GetNameDef]. Nous traquerons les gauchistes jusque dans le moindre recoin pour les purger."

r56_CAN_follow_mosleys_ideas:0 "Suivre les idées de Mosley"
r56_CAN_follow_mosleys_ideas_desc:0 "Sir Oswald Mosley a proposé une idée économique des plus radicales qui mérite d’être appliquée dans notre Dominion. Nous profiterons ainsi de la prospérité d’un Canada renouvelé et glorieux."

r56_CAN_restructure_the_government:0 "Restructurer le gouvernement"
r56_CAN_restructure_the_government_desc:0 "Notre gouvernement est infesté de politiciens aux objectifs alignés avec ceux de spéculateurs privés cupides. Nous ne pouvons tolérer leur influence toxique plus longtemps !"

r56_CAN_full_equality_for_women:0 "Droits pour les femmes"
r56_CAN_full_equality_for_women_desc:0 "Les femmes sont la clé de voûte et le pilier de la société. Leur accorder des droits complets et égaux élèvera [CAN.GetNameDef] vers sa grandeur promise."

r56_CAN_fascist_corporatism:0 "Corporatisme fasciste"
r56_CAN_fascist_corporatism_desc:0 "Les entreprises privées fonctionnent sur les principes du laissez-faire, supposant qu’elles serviront le marché pour répondre aux besoins de la société. Cette hypothèse a été démentie après la Grande Dépression ; nous devons placer le capital privé sous le contrôle de notre intérêt national."

r56_CAN_join_the_british:0 "Rejoindre l’Empire britannique"
r56_CAN_join_the_british_desc:0 "Nos liens avec la Mère Patrie sont à jamais entrelacés. Où tu iras, j’irai, et où tu logeras, je logerai. Ton peuple sera mon peuple, et ton Dieu sera mon Dieu."

r56_CAN_secure_greenland_and_iceland:0 "Sécuriser le Groenland et l’Islande"
r56_CAN_secure_greenland_and_iceland_desc:0 "Le Groenland et l’Islande sont des points de départ potentiels pour une invasion de notre Dominion. Les saisir protégera nos flancs."

r56_CAN_ask_for_newfoundland_and_labrador:0 "Demander Terre-Neuve-et-Labrador"
r56_CAN_ask_for_newfoundland_and_labrador_desc:0 "Nous demanderons le retour de Terre-Neuve-et-Labrador à notre pays. Plus jamais notre peuple ne devra travailler sous contrôle étranger."

r56_CAN_intervene_ACW:0 "Aider dans la guerre civile américaine"
r56_CAN_intervene_ACW_desc:0 "Nos frères du sud sont dans un besoin urgent d’assistance. Nous devrions intervenir, car une maison divisée tombe."

r56_CAN_send_weapons:0 "Envoyer des armes à l’Amérique"
r56_CAN_send_weapons_desc:0 "Les guerres modernes se font avec des hommes mais se gagnent avec des outils sortis d’usine. Nous enverrons un lot de munitions cruciales à nos alliés du sud."

r56_CAN_defence_scheme_no1:0 "Plan de défense n°1"
r56_CAN_defence_scheme_no1_desc:0 "L’aigle du sud a enfin révélé ses vraies couleurs. Allons le peindre en rouge, n’est-ce pas ?"

r56_CAN_take_down_america:0 "Frapper [USA.GetNameDef]"
r56_CAN_take_down_america_desc:0 "[USA.GetNameDefCap] est désormais un obstacle à notre ordre mondial. Nous frapperons vite."

r56_CAN_join_the_axis:0 "[Root.GetFascismAllianceName]"
r56_CAN_join_the_axis_desc:0 "[Root.GetFascismAllianceDesc]"
R56_CAN_JOIN_AXIS:0 "Rejoindre l’Axe"
R56_CAN_JOIN_FASCIST_ALLIANCE:0 "Chercher une alliance"
R56_CAN_JOIN_AXIS_DESC:0 "Nous devrions chercher à rejoindre [GER.GetNameDef] et son alliance."
R56_CAN_JOIN_FASCIST_ALLIANCE_DESC:0 "Nous devrions chercher à rejoindre une alliance fasciste de nations ; cela nous rendrait puissants et nous aiderait à protéger notre pays contre toute menace étrangère."

r56_CAN_the_grizzly:0 "Le Grizzly"
r56_CAN_the_grizzly_desc:0 "Nous pouvons désormais produire assez de chars pour équiper notre division blindée avec quelques modifications locales."

r56_CAN_alliance_with_america:0 "Alliance avec [USA.GetNameDef]"
r56_CAN_alliance_with_america_desc:0 "Notre nation partage une langue, une culture et un continent communs. Il est naturel que nous créions une alliance pour nous protéger mutuellement en cas de conflit."

r56_CAN_acquire_american_ships:0 "Acquérir des navires [USA.GetAdjective]"
r56_CAN_acquire_american_ships_desc:0 "La marine américaine est l’une des plus grandes puissances maritimes que le monde ait connues. Nous devrions demander à acheter certains de leurs navires pour défendre notre Dominion."

r56_CAN_follow_american_neutrality:0 "Suivre la neutralité [USA.GetAdjective]"
r56_CAN_follow_american_neutrality_desc:0 "L’aigle a volé haut et vu les nuages d’un conflit proche, mais a adopté une position de neutralité. Nous devrions adopter une politique similaire, car nous ne cherchons pas à tirer le premier coup de feu."

r56_CAN_follow_american_interventionism:0 "Suivre l’interventionnisme [USA.GetAdjective]"
r56_CAN_follow_american_interventionism_desc:0 "L’aigle a choisi d’éteindre les braises avant que le feu n’apparaisse. Le monde n’est plus celui que nous connaissions ; nous prendrons des mesures proactives pour bâtir un nouvel ordre mondial avec les [USA.GetAdjective]s."

r56_CAN_defence_scheme_no2:0 "Plan de défense n°2"
r56_CAN_defence_scheme_no2_desc:0 "La menace à travers l’océan Pacifique grandit de jour en jour. Nous devons nous préparer à son arrivée inévitable."

r56_CAN_install_democracy_in_the_americas:0 "Sécuriser la démocratie dans les Amériques"
r56_CAN_install_democracy_in_the_americas_desc:0 "Tout gouvernement qui ne représente pas les vues de ses citoyens n’est pas un gouvernement du peuple. Nous imposerons la liberté individuelle à ces régimes tyranniques des Amériques."

r56_CAN_protect_the_coast:0 "Protéger la côte atlantique"
r56_CAN_protect_the_coast_desc:0 "Notre flanc est reste exposé et non défendu si un attaquant y débarque. Demandons à la Mère Patrie de nous permettre de le défendre."

r56_CAN_reduce_the_tariffs:0 "Réduire les tarifs"
r56_CAN_reduce_the_tariffs_desc:0 "Les tarifs imposés sur le commerce avec notre allié du sud se sont révélés trop lourds pour un libre-échange. Cela ne peut plus durer ; c’est injuste et antidémocratique."

r56_CAN_build_navy_for_defence:0 "Marine défensive"
r56_CAN_build_navy_for_defence_desc:0 "Notre marine peut sembler modeste comparée à d’autres nations, mais elle sera notre meilleure ligne de défense contre tout agresseur tentant de débarquer par la mer."

r56_CAN_get_ready_for_intervention:0 "Réarmer pour intervenir"
r56_CAN_get_ready_for_intervention_desc:0 "La situation internationale s’est révélée trop instable pour rester spectateurs. Nous suivrons l’exemple des [USA.GetAdjective]s et réarmerons pour l’inévitable."

r56_CAN_allow_free_access:0 "Ouvrir les frontières"
r56_CAN_allow_free_access_desc:0 "Il n’y a aucune raison pour qu’une frontière existe entre [USA.GetNameDef] et nous. Nous partageons une culture et une langue communes, et l’histoire qui nous sépare a été tracée arbitrairement par les impérialistes du passé."

r56_CAN_west_coast_military_command:0 "Commandement militaire de la côte ouest"
r56_CAN_west_coast_military_command_desc:0 "Notre alliance ne durera pas sans un effort coordonné vers un objectif commun. Les plans pour y parvenir sont déjà en cours."

r56_CAN_new_deal:0 "Suivre les politiques [USA.GetAdjective]"
r56_CAN_new_deal_desc:0 "Nous devrions imiter les politiques économiques réussies de notre voisin, pour le bien de notre peuple."

r56_CAN_communism:0 "Un front populaire"
r56_CAN_communism_desc:0 "Un [CAN.GetName] où tout le peuple est égal est un noble idéal. Nous devons agir pour garantir un nouveau Canada !"

r56_CAN_anti_war_policy:0 "Politique anti-guerre"
r56_CAN_anti_war_policy_desc:0 "Nous avons été entraînés de force dans la dernière guerre par les vestiges d’une puissance impérialiste. Nous corrigerons cela avec une politique ferme : ne jamais déclarer de guerre ni rejoindre d’alliances pour en mener une."

r56_CAN_organize_the_trade_unions:0 "Unifier les syndicats"
r56_CAN_organize_the_trade_unions_desc:0 "Les syndicats sont un puissant allié pour défendre les droits des travailleurs. Une entité politique unique les représentant tous est la voie à suivre."

r56_CAN_workers_rights:0 "Droits des travailleurs"
r56_CAN_workers_rights_desc:0 "Les capitalistes avares ont opprimé les travailleurs [CAN.GetAdjective] trop longtemps ! Nous protégerons leurs droits et nos besoins de production en améliorant les procédés et en écoutant les personnes qui comptent."

r56_CAN_public_ownership:0 "Moyens de production"
r56_CAN_public_ownership_desc:0 "Le capitaliste cherche à exploiter le potentiel de guerre uniquement pour le profit. Nos camarades ne peuvent plus le tolérer, et nous non plus. Nous les saisirons pour le bien de la communauté."

r56_CAN_unemployment_insurance_scheme:0 "Assurance-chômage"
r56_CAN_unemployment_insurance_scheme_desc:0 "Le chômage est le symptôme d’un système inefficace. En veillant à ce que tous ceux qui ne trouvent pas de travail soient pris en charge dans les moments difficiles, nous pouvons compter sur leur loyauté en temps meilleurs."

r56_CAN_young_communist_league_of_canada:0 "Ligue des jeunes communistes du Canada"
r56_CAN_young_communist_league_of_canada_desc:0 "Les jeunes communistes regroupent écoles et clubs représentant les travailleurs, quel que soit leur âge, croyance ou origine. Ils alertent sur la menace fasciste à travers [CAN.GetNameDef]. Nous favoriserons la croissance de cette organisation pour le bien des travailleurs."

r56_CAN_the_canadian_youth_congress:0 "Congrès de la jeunesse [CAN.GetAdjective]"
r56_CAN_the_canadian_youth_congress_desc:0 "Il est temps de donner à la jeunesse des moyens appropriés pour exprimer ses doléances et prendre des mesures directes."

r56_CAN_repeal_the_padlock_law:0 "Abolir la loi du cadenas"
r56_CAN_repeal_the_padlock_law_desc:0 "Selon la loi du cadenas, tout établissement ou bien trouvé à propager les doléances des travailleurs opprimés peut être fermé et verrouillé afin d’étouffer leurs voix. Ces lois barbares portent atteinte aux droits des travailleurs, et nous allons les abolir !"

r56_CAN_imprison_the_trotskyists:0 "Emprisonner les trotskystes"
r56_CAN_imprison_the_trotskyists_desc:0 "Les trotskystes représentent un fléau pour notre glorieuse idéologie en déstabilisant le communisme et ses applications dans le monde entier. Nous écarterons de nos rangs tous ceux qui prétendent suivre ses idées."

r56_CAN_strike_the_quebecois_anti_communists:0 "Frapper les anticommunistes québécois"
r56_CAN_strike_the_quebecois_anti_communists_desc:0 "Le réactionnaire Maurice Duplessis et ses partisans freinent la stabilité de l’État. Nous lui montrerons la gloire du communisme."

r56_CAN_form_a_canadian_red_guard:0 "Former une garde rouge [CAN.GetAdjective]"
r56_CAN_form_a_canadian_red_guard_desc:0 "Pour survivre, notre jeune État communiste doit disposer de cadres loyaux et efficaces pour protéger son existence. La garde rouge défendra [CAN.GetNameDef] jusqu’à son dernier souffle."

r56_CAN_the_mac_paps:0 "Les Mac-Paps"
r56_CAN_the_mac_paps_desc:0 "Les bataillons Mackenzie–Papineau étaient composés de Canadiens prêts à propager la gloire du communisme à travers le monde. Offrons-leur notre soutien."

r56_CAN_abandon_anti_war_policy:0 "Abandonner la politique anti-guerre"
r56_CAN_abandon_anti_war_policy_desc:0 "Il est clair que, même si nous ne cherchons pas la guerre, certaines nations veulent nous nuire. Nous devons adapter nos politiques en conséquence."

r56_CAN_plebiscite_committees:0 "Comités de plébiscite"
r56_CAN_plebiscite_committees_desc:0 "En impliquant la voix du peuple dans la mise en œuvre des politiques gouvernementales, nous pourrons atténuer les réactions négatives à certaines de nos décisions."

r56_CAN_support_the_soviets:0 "Soutenir les [SOV.GetAdjective]s"
r56_CAN_support_the_soviets_desc:0 "[SOV.GetNameDefCap] est le véritable exécuteur du communisme dans le monde. Nous ne resterons pas les bras croisés en voyant la flamme s’éteindre sans intervenir."

r56_CAN_join_the_communist_international:0 "[Root.GetCommunistAlliance]"
R56_CAN_JOIN_COMMUNISM:0 "Rejoindre l’Internationale communiste"
R56_CAN_COMMUNISM_ALLIANCE:0 "Une alliance"
r56_CAN_join_the_communist_international_desc:0 "Les flammes de la révolution se sont allumées partout sur le globe. Nous devons unir nos mains avec nos frères et sœurs pour embrasser la révolution ouvrière."

r56_CAN_destroy_imperialism:0 "Détruire l’impérialisme"
r56_CAN_destroy_imperialism_desc:0 "Nous fûmes autrefois un pays luttant sous le joug d’un maître indifférent. Il est temps d’aider toute nation désireuse de briser les chaînes de l’impérialisme, vestige d’un âge révolu."

r56_CAN_join_our_british_comrades:0 "Rejoindre nos camarades [ENG.GetAdjective]"
r56_CAN_join_our_british_comrades_desc:0 "Nos amis d’outre-mer se sont également libérés des chaînes de la misérable aristocratie. Une alliance d’États régénérés dirigés par les travailleurs sera l’alliance du siècle."

r56_CAN_strike_britain:0 "Frapper [ENG.GetNameDef]"
r56_CAN_strike_britain_desc:0 "L’ancienne Mère Patrie s’est désormais présentée comme un adversaire du glorieux [CAN.GetName]. Nous l’écraserons sous le poids du prolétariat uni."

r56_CAN_strike_mexico:0 "Sécuriser un second front"
r56_CAN_strike_mexico_desc:0 "Nous ne pouvons espérer transpercer l’aigle lors d’un combat direct. Sécuriser un autre front pour poursuivre la lutte est notre priorité absolue."

r56_CAN_strike_america:0 "Écraser [USA.GetNameDef]"
r56_CAN_strike_america_desc:0 "L’aigle en viendra à craindre la faucille et le marteau du travailleur [CAN.GetAdjective]."

r56_CAN_emergency_assembly:0 "Réunir le Parlement"
r56_CAN_emergency_assembly_desc:0 "Notre jeune démocratie indépendante est à la croisée des chemins. Nous devons réunir les représentants du peuple pour définir une feuille de route sur la manière et la direction à suivre dans ce monde nouveau."

r56_CAN_a_new_constitution:0 "Rédiger une nouvelle constitution"
r56_CAN_a_new_constitution_desc:0 "Une nation démocratique n’est rien sans une constitution instaurant des freins et contrepoids pour son gouvernement. Nous en rédigerons une pour le bien de tous."

r56_CAN_an_independent_democracy:0 "Démocratie indépendante"
r56_CAN_an_independent_democracy_desc:0 "La force de [CAN.GetNameDefCap] vient de son acceptation et de sa tolérance envers les idées et les peuples différents. La démocratie sera notre serment solennel et notre source de puissance, même en temps de crise et de conflit."

r56_CAN_post_colonial_rule:0 "Post-[ENG.GetAdjective] Influence"
r56_CAN_post_colonial_rule_desc:0 "Nous fûmes autrefois un Dominion impérial, mais nous avons gagné l’indépendance [CAN.GetAdjective] pacifiquement. Nous ferons la paix avec eux tout en affirmant haut et fort notre indépendance."

r56_CAN_secure_the_economy:0 "Sécuriser l’économie"
r56_CAN_secure_the_economy_desc:0 "Notre jeune république possède une économie fragile pour soutenir son peuple. Nous devons prendre des mesures pour résoudre ce problème."

r56_CAN_our_own_way:0 "Une voie différente"
r56_CAN_our_own_way_desc:0 "Notre démocratie sera notre chemin dans ce monde. Nous ne devons rien à qui que ce soit."

r56_CAN_development_of_new_territories:0 "Développement des nouveaux territoires"
r56_CAN_development_of_new_territories_desc:0 "Avec notre économie renforcée, nous pouvons enfin développer les terres inutilisées et sous-exploitées de [CAN.GetNameDef]."

r56_CAN_modernise_the_nation:0 "Moderniser la nation"
r56_CAN_modernise_the_nation_desc:0 "La nation a un besoin urgent d’investissements dans les infrastructures pour stimuler la croissance économique. Nous allouerons tout ce qui est nécessaire à cet effort."

r56_CAN_independent_military:0 "Armée indépendante"
r56_CAN_independent_military_desc:0 "Maintenant que notre armée est une branche indépendante, nous ne pouvons plus compter sur des changements doctrinaux imposés par un quelconque suzerain. Notre développement sera entièrement le nôtre."

r56_CAN_independent_industry:0 "Industrie indépendante"
r56_CAN_independent_industry_desc:0 "Renforcer notre capacité industrielle est l’une des priorités pour consolider notre cher [CAN.GetName]."

r56_CAN_self_sufficiency:0 "Autosuffisance"
r56_CAN_self_sufficiency_desc:0 "Alimenter notre industrie exige des minéraux et des matières premières en quantité suffisante. Nous allouerons les fonds nécessaires pour y parvenir."

r56_CAN_assert_canadian_involvment:0 "Affirmer l’implication [CAN.GetAdjective]"
r56_CAN_assert_canadian_involvment_desc:0 "Malgré notre foi en l’autodétermination, nous devrons aussi agir lorsque des nations amies seront en danger."

r56_CAN_secure_american_democracy:0 "Sécuriser la démocratie américaine"
r56_CAN_secure_american_democracy_desc:0 "L’aigle est tombé malade. Nous le guérirons et le libérerons à nouveau."

r56_CAN_reenforce_the_commonwealth:0 "Renforcer le Commonwealth"
r56_CAN_reenforce_the_commonwealth_desc:0 "Les nations s’effondrent dans l’isolement. Nous créerons une alliance qui se protège mutuellement en cas d’attaque."

r56_CAN_our_best_friend:0 "Notre meilleur ami"
r56_CAN_our_best_friend_desc:0 "[USA.GetNameDefCap] a toujours été un ami fidèle de [CAN.GetNameDef]. Nous l’inviterons à rejoindre notre pacte défensif."

r56_CAN_unite_with_the_french:0 "S’unir avec les [FRA.GetAdjective]"
r56_CAN_unite_with_the_french_desc:0 "[FRA.GetNameDefCap] a toujours défendu les idéaux libéraux et la démocratie. Nous devrions leur proposer de rejoindre notre faction."

r56_CAN_liberate_the_british_isles:0 "Libérer les îles Britanniques"
r56_CAN_liberate_the_british_isles_desc:0 "Notre ancienne Mère Patrie est tombée. Il est de notre devoir moral de libérer le peuple britannique des chaînes de ses oppresseurs."

r56_CAN_fuel_the_arms_sector:0 "Stimuler le secteur de l’armement"
r56_CAN_fuel_the_arms_sector_desc:0 "Notre paix ne durera jamais longtemps si nous ne joignons pas nos paroles aux actes. Parfois, ces actes impliquent de l’artillerie et des chars, nous devons donc maintenir une industrie capable d’en produire en temps de besoin."

r56_CAN_arms_exports:0 "Exportations d’armes"
r56_CAN_arms_exports_desc:0 "Nous ne souhaitons peut-être pas envoyer nos jeunes [CAN.GetAdjective]s mourir sur des terres étrangères, mais nous pouvons toujours envoyer des produits [CAN.GetAdjective]s pour favoriser les nations amies à nos intérêts."

r56_CAN_suppress_the_separatists:0 "Réprimer les séparatistes"
r56_CAN_suppress_the_separatists_desc:0 "Nous ne reconnaîtrons jamais l’État rebelle du Québec. Le Québec est une terre [CAN.GetAdjective], et cela ne changera pas."

r56_CAN_strengthen_british_ties:0 "Renforcer les liens [ENG.GetAdjective]"
r56_CAN_strengthen_british_ties_desc:0 "Notre loyauté va à la Mère Patrie. Nous veillerons à ce que nos politiques et nos actions soient parfaitement alignées avec les siennes."

r56_CAN_governor_general_in_power:0 "Le gouverneur général au pouvoir"
r56_CAN_governor_general_in_power_desc:0 "En ces temps troublés, nous avons besoin d’une main ferme pour tenir la barre. Nul n’est mieux placé que John Buchan, notre propre gouverneur général."

r56_CAN_empower_the_military_faction:0 "Renforcer la faction militaire"
r56_CAN_empower_the_military_faction_desc:0 "Notre force ne vient pas des comités et des discussions interminables, mais de l’action directe et des décisions tranchées. Nous donnerons du pouvoir à ceux qui incarnent ces valeurs au sein de l’appareil administratif de [CAN.GetNameDef]."

r56_CAN_strategic_nationalizations:0 "Nationalisations stratégiques"
r56_CAN_strategic_nationalizations_desc:0 "La nationalisation de certaines industries et entreprises renforcera notre popularité auprès du public et placera leur contrôle entre les mains de [CAN.GetNameDef]."

r56_CAN_integrate_the_canadian_cadet_corps:0 "Intégrer le corps des cadets [CAN.GetAdjective]"
r56_CAN_integrate_the_canadian_cadet_corps_desc:0 "La jeunesse de notre nation a montré une remarquable initiative en rejoignant des organisations qui les préparent bien aux réalités du monde. Nous devrions légitimer leur organisation au sein du Dominion, faisant de leur credo un serment que tous les jeunes Canadiens récitent chaque matin."

r56_CAN_root_out_traitors:0 "Éradiquer les traîtres"
r56_CAN_root_out_traitors_desc:0 "Ceux qui réclament plus de libertés en temps de crise entravent notre marche vers la grandeur. Nous ne tolérerons aucune dissidence au sein de [CAN.GetNameDef]."

r56_CAN_claims_on_america:0 "Revendiquer [USA.GetNameDef]"
r56_CAN_claims_on_america_desc:0 "Nous ne pouvons plus tolérer l’existence de cette nation rebelle au sud. Nous avons déjà incendié leurs villes une fois ; le moment est venu de recommencer."

r56_CAN_the_defense_of_canada:0 "La défense du Canada"
r56_CAN_the_defense_of_canada_desc:0 "La longue frontière que nous partageons avec la nation du sud est une ligne imaginaire maintenue par l’histoire. Marquons-la clairement avec des fortifications et des préparatifs militaires."

r56_CAN_national_defense_funding:0 "Financement de la défense nationale"
r56_CAN_national_defense_funding_desc:0 "Notre souveraineté ne peut être défendue que par la force des armes. Nous investirons dans notre sécurité au maximum de nos capacités."

# Événements
r56_canada.1.t:0 "Changement de lois"
r56_canada.1.d:0 "En raison de notre récent changement de gouvernement, nos lois et politiques ont été mises à jour pour refléter notre nouvelle administration."
r56_canada.1.a:0 "Un changement nécessaire."

r56_canada.4.t:0 "Problème de conscription au Québec"
r56_canada.4.d:0 "Nous avons désespérément besoin de main-d’œuvre dans notre armée, notre marine et notre aviation, mais les Canadiens français refusent la conscription forcée."
r56_canada.4.a:0 "Faisons ce qui doit être fait. Forçons la conscription."
r56_canada.4.b:0 "Peut-être pouvons-nous trouver un compromis."

r56_canada.5.t:0 "Jack Bickell revient de [ENG.GetNameDef]"
r56_canada.5.d:0 "Après avoir servi deux ans au sein du British Airplane Supply Board, Jack Bickell est revenu de [ENG.GetNameDef]. Le président du conseil de Victory Aircraft Ltd. souhaite le recruter."
r56_canada.5.a:0 "Très bien, mettons-le à profit !"

r56_canada.6.t:0 "Émeute des Vingt Cents !"
r56_canada.6.d:0 "Les travailleurs des camps de secours aux chômeurs ont déclenché une nouvelle émeute, réclamant une augmentation de leur salaire. Comment devons-nous réagir ?"
r56_canada.6.a:0 "Fermons simplement les camps."
r56_canada.6.b:0 "Utilisons la force pour réprimer les émeutes."
r56_canada.6.c:0 "Laissons-les manifester."

r56_canada.7.t:0 "Nouvelle émeute des Vingt Cents en colère !"
r56_canada.7.d:0 "Après la dernière émeute, nous avons utilisé la force pour y mettre fin. À présent, ils recommencent et exigent une compensation ainsi que la fermeture des camps."
r56_canada.7.a:0 "Réprimons l’émeute et fermons les camps pour de bon."
r56_canada.7.b:0 "Cédons à leurs demandes et indemnisons-les."

r56_canada.8.t:0 "Les manifestants continuent de se révolter"
r56_canada.8.d:0 "Les travailleurs des camps ont encore organisé une manifestation, causant des dégâts matériels."
r56_canada.8.a:0 "Dommage."

r56_canada.9.t:0 "[CAN.GetNameDefCap] réclame Terre-Neuve-et-Labrador !"
r56_canada.9.d:0 "Les [CAN.GetAdjective]s nous ont demandé de leur céder Terre-Neuve-et-Labrador, qu’ils considèrent comme leur territoire légitime."
r56_canada.9.a:0 "Qu’ils les prennent, nous avons besoin de troupes ailleurs."
r56_canada.9.b:0 "Non, ce territoire nous appartient."

r56_canada.10.t:0 "[FROM.GetNameDefCap] nous donne Terre-Neuve-et-Labrador !"
r56_canada.10.d:0 "[FROM.GetNameDefCap] a accepté de nous céder Terre-Neuve-et-Labrador après notre demande."
r56_canada.10.a:0 "Bonne nouvelle !"

r56_canada.11.t:0 "[FROM.GetNameDefCap] refuse !"
r56_canada.11.d:0 "[FROM.GetNameDefCap] a refusé de nous donner Terre-Neuve-et-Labrador."
r56_canada.11.a:0 "Dommage."
r56_canada.11.b:0 "Ils le regretteront."

r56_canada.12.t:0 "[CAN.GetNameDefCap] propose une alliance !"
r56_canada.12.d:0 "[CAN.GetNameDefCap] nous propose de former une alliance."
r56_canada.12.a:0 "C’est une bonne idée ; ensemble nous serons forts."
r56_canada.12.b:0 "Non, ils cherchent juste à profiter de notre puissance militaire."

r56_canada.13.t:0 "[USA.GetNameDefCap] accepte notre alliance !"
r56_canada.13.d:0 "[USA.GetNameDefCap] a accepté notre proposition d’alliance nord-américaine ! [USA.GetLeader] a obtenu la majorité au Congrès, estimant que cela ne menacerait pas l’indépendance diplomatique [USA.GetAdjective], mais réduirait plutôt le risque de guerre avec [ENG.GetNameDef]."
r56_canada.13.a:0 "Bonne nouvelle !"

r56_canada.14.t:0 "[USA.GetNameDefCap] refuse !"
r56_canada.14.d:0 "[USA.GetNameDefCap] a refusé notre proposition d’alliance, affirmant que nous voulons profiter de leur puissance militaire."
r56_canada.14.a:0 "Maudits [USA.GetAdjective] !"

r56_canada.15.t:0 "Droits des travailleurs"
r56_canada.15.d:0 "L’amélioration des droits des travailleurs nous a permis de bénéficier d’un moral et d’un bonheur accrus chez eux."
r56_canada.15.a:0 "Excellent !"

r56_canada.16.t:0 "Crise économique"
r56_canada.16.d:0 "On dirait que nous sommes dans de beaux draps. La population est fatiguée et agacée par le manque d’attention porté à l’économie par notre administration !"
r56_canada.16.a:0 "Les Canadiens vont devoir vivre avec la ceinture serrée un moment."

r56_canada.17.t:0 "Stabilité économique"
r56_canada.17.d:0 "Les récents investissements dans les industries essentielles et le bien-être général ont porté leurs fruits. Les [CAN.GetAdjective]s jouissent de prospérité et de sécurité en ces temps troublés."
r56_canada.17.a:0 "Excellente nouvelle !"

r56_canada_governor_general.1.t:0 "Mort du gouverneur général John Buchan"
r56_canada_governor_general.1.d:0 "Notre éminent gouverneur général, qui a longtemps soutenu le Dominion du Canada et représenté ses intérêts auprès de la Couronne, a été conduit à sa dernière demeure. Qu’il repose en paix."
r56_canada_governor_general.1.a:0 "Son héritage ne sera pas oublié."

# Événements d’actualité
r56.news_event.1001.t:0 "Tournée royale de [CAN.GetNameDef] en [GetYear]"
r56.news_event.1001.d:0 "Pour la première fois dans l’histoire du Canada, un monarque régnant du pays est venu en visite officielle, le roi George VI et la reine Elizabeth ayant entrepris une tournée de [CAN.GetNameDef]. Le couple royal est arrivé à bord du paquebot canadien « Empress of Australia », escorté par deux destroyers et deux croiseurs de la Marine royale canadienne.\n\nLeur voyage, à bord du train royal bleu et argent, doit couvrir toutes les provinces canadiennes, en commençant par Québec, suivi du Dominion de Terre-Neuve, puis les régions de l’Ouest comme Vancouver et Victoria. [CAN.GetLeader] accompagnera le couple royal tout au long de leur périple à travers le pays. La tournée se terminera par une visite à [USA.GetNameDef]."
r56.news_event.1001.a:0 "Nous sommes honorés d’une telle visite."
r56.news_event.1001.b:0 "Espérons que la visite soit agréable !"
r56.news_event.1001.c:0 "Ce n’est pas le moment pour des visites."

r56.news_event.1002.t:0 "Le « If Day »"
r56.news_event.1002.d:0 "Organisé par l’association Greater Winnipeg Victory Loan, un exercice simulant l’invasion de [CAN.GetNameDef] par les forces [GER.GetAdjective] a eu lieu aujourd’hui. Cet événement, le plus important exercice militaire à Winnipeg, a permis de récolter 3 millions de dollars en une seule journée pour l’effort de guerre. L’exercice a inclus de faux bombardements, des échanges de tirs, l’arrestation de personnes opposantes, des défilés [GER.GetAdjective] et bien d’autres choses. La journée s’est terminée par la libération des « prisonniers », des parades et des discours. L’ambassadeur de Morgenstierne a témoigné de son expérience de l’occupation [GER.GetAdjective] et a déclaré que cette simulation donnait un aperçu authentique de ce que serait une occupation [GER.GetAdjective]."
r56.news_event.1002.a:0 "La journée fut un succès."
