###Événements###
panama.1.t:0 "Arosemena « élu »"
panama.1.d:0 "La démocratie ne vaut pas la peine d’être préservée. \n\n Après avoir abandonné le parti qui l’avait fait élire en premier lieu, Harmodio Arias Madrid décida de garder le pouvoir dans son petit cercle de fidèles et apporta tout son soutien à son ministre des Affaires étrangères, Juan Demóstenes Arosemena Barreati. Bien sûr, gagner une élection contre à la fois le parti qu’il dirigeait autrefois et l’opposition habituelle aurait été un véritable défi, mais Madrid et Barreati étaient bien préparés pour l’occasion – au lieu de compter sur des électeurs paresseux et peu fiables, Madrid s’en chargea lui-même et fabriqua ses propres votes. Quelques citoyens un peu trop bruyants exprimèrent leur mécontentement, mais l’arrestation des plus influents les fit taire rapidement. \n\nLa communauté internationale est restée muette jusqu’à présent. Affirmer soutenir de grands concepts comme la « démocratie » ou la « liberté d’expression » est facile, organiser des embargos ou même des interventions militaires est difficile. En outre, la plupart des dirigeants étrangers sont satisfaits de Barreati – un régime autoritaire stable est bien plus prévisible qu’une démocratie avec des dirigeants et des valeurs en perpétuel changement."
panama.1.a:0 "¡Viva Barreati!"
