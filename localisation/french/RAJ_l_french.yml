  r56_south_asia_sikh_lion_recruitment_desc:0 "Les Lions de la Grande Guerre étaient un regroupement de bataillons sikhs ayant combattu principalement sur le continent africain durant le conflit, souvent armés de leurs armes traditionnelles. Dans leur esprit, nous recruterons une nouvelle génération de braves sikhs."

