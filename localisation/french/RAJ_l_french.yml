  india.100.t:0 "Notre administration a été scindée."
  india.100.desc:0 "Le gouvernement britannique vient d’annoncer la création de la colonie d’Aden et de la colonie de Birmanie, réduisant ainsi considérablement la taille de notre administration."

  RAJ_Tariff_Income:0 "Revenus tarifaires"
  RAJ_Increased_Trade_Volume:0 "Volume commercial accru"
  ENG_split_up_the_British_Raj:0 "Démembrer le Raj britannique"
  ENG_split_up_the_British_Raj_desc:0 "Nous établirons des colonies séparées en Birmanie et à Aden pour rendre notre administration coloniale plus efficace."
  raj_port_operation:0 "Nous travaillons actuellement à l’acquisition d’un port."
  india.295.t:0 "L’Inde nous invite à rejoindre le Komintern"
  india.295.desc:0 "L’Inde ayant récemment rejoint le Komintern après avoir chassé les colonisateurs impérialistes d’Europe, elle a étendu son influence en Asie du Sud et nous propose désormais d’entrer dans l’alliance prolétarienne mondiale."
  india.295.a:0 "Prolétaires de tous les pays, unissez-vous !"
  india.295.b:0 "Nous préférons nous écarter de la ligne de Moscou."

  india.296.t:0 "L’Inde nous invite à rejoindre le [RAJ.GetFactionName]"
  india.296.desc:0 "Après avoir chassé les colonisateurs impérialistes d’Europe, l’Inde a récemment fondé le [RAJ.GetFactionName], étendu son influence en Asie du Sud et nous propose désormais d’entrer dans cette alliance prolétarienne sud-asiatique."
  india.296.a:0 "Prolétaires de tous les pays, unissez-vous !"
  india.296.b:0 "Nous préférons nous écarter de la ligne de Delhi."

  india.400.t:0 "Murmures à Goa"
  india.400.desc:0 "Des rumeurs circulent dans la ville coloniale de Goa, des murmures d’une invasion imminente. Si n’importe qui peut imaginer un tel scénario, notre haut commandement a toutefois remarqué un déplacement subtil de divisions. Une invasion pourrait avoir des conséquences désastreuses pour la population locale, fidèle au Portugal depuis 450 ans. La communauté internationale nous soutiendra probablement si nous tenons bon, mais ce soutien suffira-t-il vraiment à repousser les troupes indiennes ? Nos forces armées sont-elles à la hauteur ? Facile de poser des questions… plus difficile d’y répondre."
  india.400.a:0 "Não passarão !"
  india.400.b:0 "Nous préférons éviter le sang versé."

  india.401.t:0 "L’Inde a pris Goa"
  india.401.desc:0 "L’un des derniers vestiges du colonialisme européen en Asie du Sud est tombé aux mains du nouveau [RAJ.GetNameDef]. L’Empire portugais semble s’effriter."
  india.401.a:0 "Dehors, les colonialistes !"
  india.401.b:0 "Un jour triste pour le Portugal."

  india.402.t:0 "L’Inde a échoué à prendre Goa"
  india.402.desc:0 "Les Portugais ont vaillamment repoussé l’assaut indien et préservé un petit pan de leur empire."
  india.402.a:0 "Maudits colonialistes."
  india.402.b:0 "Notre Empire vivra un jour de plus."

  india.403.t:0 "L’Inde pousse à un référendum en [320.GetName]"
  india.403.desc:0 "Un vaste mouvement de protestation s’est formé dans notre colonie de l’Inde française ; il semble que le nouveau gouvernement indien soit derrière cette vague d’agitation. La plupart des conseillers coloniaux suggèrent de laisser partir ces quelques ports et villes, qui n’apportent aucun bénéfice économique réel. Nous pourrions aussi tenter de réprimer le mouvement ; dans ce cas, il est conseillé de nous préparer aux conséquences imprévues."
  india.403.a:0 "Amenez-moi le gouverneur."
  india.403.b:0 "Laissons la démocratie suivre son cours."

  india.404.t:0 "Le problème de l’Inde française"
  india.404.descre:0 "Les protestations continuent de se propager tandis que nos forces de police locales s’épuisent. Dès le départ, il semblait illusoire de les étouffer. Et pourtant, sans hésitation, nous avons décidé de renforcer notre domination impériale. Une décision peu populaire parmi les administrateurs des îles, qui ont cédé aux demandes locales et remis la province à l’Inde."
  india.404.desc:0 "Sans surprise, le référendum s’est prononcé en faveur de l’unification avec l’Inde, et nous sommes impuissants à empêcher le transfert. Les troupes [Root.GetAdjective] locales se retireront, les administrateurs seront relocalisés, le drapeau [Root.GetAdjective] sera abaissé et, finalement, le drapeau indien sera hissé."
  india.404.a:0 "Nous verrons bien."
  india.404.b:0 "Plutôt anticlimatique, après tout ce que nous avons traversé."

  india.405.t:0 "La question de la Birmanie"
  india.405.desc:0 "Depuis longtemps, nous envisageons de séparer la Birmanie de l’Inde, et certains diplomates rédigent déjà des plans administratifs. Le gouvernement de [Raj.GetNameDef] a plaidé pour que le sous-continent reste divisé pour des raisons économiques et administratives. Abandonner ces plans libérera nos diplomates pour d’autres dossiers."
  india.405.a:0 "Nous avons des choses plus importantes à faire."
  india.405.b:0 "Nos diplomates poursuivront leur travail."

  india.406.t:0 "Les Britanniques ont accepté notre demande"
  india.406.desc:0 "Les diplomates britanniques qui travaillaient sur la création d’une administration birmane séparée ont été réaffectés, et notre administration demeure intacte."
  india.406.a:0 "Une décision avisée."

  india.407.t:0 "Les Britanniques ont refusé notre demande"
  india.407.desc:0 "Le gouvernement britannique a rejeté sans détour notre requête visant à maintenir l’unité de l’Inde, et ses diplomates poursuivent leurs plans pour la colonie de Birmanie."
  india.407.a:0 "Maudits Anglais."

  india.408.t:0 "La question de Ceylan"
  india.408.desc:0 "Notre nouvel allié à statut égal, l’Inde, exerce une pression croissante au sujet de ses prétendus alliés au Sri Lanka. Leurs appels à l’indépendance se sont faits plus audibles ces derniers mois, mais devons-nous vraiment céder cette partie vitale de l’empire ?"
  india.408.a:0 "Nous leur accorderons le statut de dominion."
  india.408.b:0 "Ils ne dicteront pas notre politique intérieure."

  india.409.t:0 "Les Britanniques ont accepté notre demande"
  india.409.desc:0 "Le gouvernement britannique a accordé à l’ancienne colonie de la Couronne de Ceylan le statut de dominion, sous le nouveau nom de [SRL.GetNameDef]. Une grande victoire pour les peuples d’Asie."
  india.409.a:0 "Établissons immédiatement une ambassade."

  india.410.t:0 "Les Britanniques ont refusé notre demande"
  india.410.desc:0 "Les Britanniques ont répondu qu’ils n’ont aucune intention d’abandonner la colonie de Ceylan. Un rude coup pour les peuples d’Asie."
  india.410.a:0 "Maudits Anglais."

  plead_against_seperation:0 "Faire pression contre la colonie de Birmanie"
  plead_against_seperation_desc:0 "Les Britanniques projettent depuis longtemps d’extraire une colonie birmane de notre administration. Faisons-leur connaître notre position."
  raj_prevent_state_modifier:0 "Empêchera la §YBirmanie§! de devenir une colonie distincte, ce qui nous ferait §Rperdre§! la §Ymajeure partie de ses ressources§!."
  india_remains_united_tt:0 "La §YBirmanie§! ne sera pas séparée de §Y[RAJ.GetNameDef]§!."
  india_seperate_burma_tt:0 "§RLa Birmanie sera séparée de [RAJ.GetNameDef].§!"

  RAJ_port_of_yanoan:0 "Opération Koel"
  RAJ_port_of_yanoan_desc:0 "En promettant à la population locale un référendum sur l’unification avec l’Inde, les Français n’auront aucun moyen de refuser notre demande."

  RAJ_port_of_goa:0 "Opération Vriksha Deep"
  RAJ_port_of_goa_desc:0 "L’une des dernières manifestations du colonialisme européen doit être rendue à ses propriétaires légitimes. Par la force, si nécessaire…"

  GOA_border_incident_notification:0 "Incident frontalier imminent"

  RAJ_border_incident_forgotten:0 "La guerre frontalière oubliée."
  RAJ_escalate_incident_to_border_conflict_GOA:0 "Envenimer la guerre frontalière à Goa."

  south_asian_liberation:0 "Libération sud-asiatique"
  south_asian_liberation_desc:0 "Pour semer les graines de la rébellion en Asie du Sud, nous devons envoyer une aide militaire et politique aux pays opprimés.\n\nÀ l’achèvement de tout objectif lié à un soulèvement, le soutien politique et les armes seront envoyés pour résister à toute riposte.\n\n[RAJ.GetSalVariable]"
  raj_sal_variable:0 "[SRL.GetFlag] §YFusils sri-lankais§! §Rpour le soulèvement§! : §Y[?SRL_arms]§!.\n[SRL.GetFlag] §YLanka Sama Samaja Party§! — soutien §Rau soulèvement§! : §Y[?SRL_pol]§!.\n\n[NEP.GetFlag] §YFusils népalais§! §Rpour le soulèvement§! : §Y[?NEP_arms]§!.\n[NEP.GetFlag] §YParti communiste du Népal§! — soutien §Rau soulèvement§! : §Y[?NEP_pol]§!.\n\n[SRL.GetFlag] §YFusils bhoutanais§! §Rpour le soulèvement§! : §Y[?BHU_arms]§!.\n[BHU.GetFlag] §YParti communiste du Bhoutan§! — soutien §Rau soulèvement§! : §Y[?BHU_pol]§!."
  raj_may_lead_to_war:0 "§RCela peut mener à la guerre !§!"
  ilp_bhu_uprising:0 "Le §YParti communiste du Bhoutan§! déposera [BHU.GetLeader] et instaurera un gouvernement §Ycommuniste§!."
  ilp_srl_uprising:0 "Le §YLanka Sama Samaja Party§! se soulèvera contre le gouvernement colonial de Ceylan et résistera au courroux de l’§Yimpérialisme britannique§!."
  ilp_nep_uprising:0 "Le §YParti communiste du Népal§! renversera la monarchie Rana et instaurera le §Ysocialisme§!."

  RAJ_eastern_forts:0 "Construit §Y2 forts terrestres§! sur des positions orientales facilement défendables en Birmanie."
  raj_push_even_further:0 "Aller encore plus loin"
  raj_push_even_further_desc:0 "Les droits civiques ne vont jamais « trop loin ». Nous devons corriger chaque tort commis par l’Inde par le passé, afin que notre société puisse dormir en paix."
