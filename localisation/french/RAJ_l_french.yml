  raj_legislative_situation:0 "Situation législative"
  raj_legislative_situation_desc:0 "Si notre administration veut parvenir à faire adopter la moindre loi, elle doit composer avec le Conseil législatif impérial, composé à la fois de membres élus et nommés, ainsi que de divers groupes d’intérêts. Nous devons équilibrer soigneusement leurs exigences si nous voulons obtenir un pays stable une fois les querelles politiques terminées.\n\n[RAJ.Current_Act][RAJ.Legislative_Status]"
  finalize_the_vote:0 "Finaliser le vote"
  legislative_status:0 "\n\tActuellement, l’opinion hindoue sur la loi est : [RAJ.ind_support_loc]\n\tActuellement, l’opinion musulmane sur la loi est : [RAJ.pak_support_loc]\n"

  FOCUS_FILTER_RAJ_PROVINCIAL_ELECTIONS:0 "Élections provinciales"
  legislative_railway:0 "Un débat acharné sur la Loi d’expansion ferroviaire a lieu dans les plus hautes instances du gouvernement. Ses objectifs sont définis comme la construction de liaisons ferroviaires nationalisées, non motivées par le profit, afin de soutenir nos objectifs industriels."
  legislative_agriculture:0 "Un débat acharné sur la Loi de stabilisation agricole a lieu dans les plus hautes instances du gouvernement. Nos objectifs principaux sont l’amélioration de l’irrigation locale et une production encadrée de céréales et d’importations."
  legislative_education:0 "Un débat acharné sur la Loi de réforme éducative a lieu dans les plus hautes instances du gouvernement. Nous avons présenté comme objectifs majeurs : empêcher la fuite des intellectuels indiens vers les universités anglaises et améliorer l’éducation rurale pour accroître les compétences industrielles et agricoles."
  legislative_insurance:0 "Un débat acharné sur la Loi sur les assurances a lieu dans les plus hautes instances du gouvernement. Ses partisans les plus fervents soulignent l’état déplorable des investissements indiens comme principal problème qu’ils cherchent à résoudre. Ils veulent y remédier en réglementant enfin le secteur de l’assurance."
  legislative_war:0 "Un débat acharné sur la Loi sur les pouvoirs de guerre a lieu dans les plus hautes instances du gouvernement. Le vice-roi a souligné que ce n’est pas le moment de discuter : l’Inde est en guerre et l’exécutif doit avoir l’autorité nécessaire pour mener ce conflit. Tout retard dans l’adoption de cette loi profiterait à l’ennemi !"
  legislative_idle:0 "Les couloirs du Conseil législatif impérial restent inactifs, aucune loi n’étant actuellement débattue."

  raj_sov_nuclear_name:0 "Accord sur les nouvelles technologies de défense nationale"
  raj_sov_nuclear_desc:0 "L’ère atomique est arrivée et les pays socialistes du monde ne peuvent se permettre de rester en arrière face aux États capitalistes dans le domaine nucléaire. Partager nos découvertes atomiques avec le peuple soviétique, et vice-versa, renforcera considérablement la sécurité des deux États."

