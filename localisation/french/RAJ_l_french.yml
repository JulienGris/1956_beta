  AIML_UP_COALITION:0 "Le Parti unioniste est en coalition avec la Ligue musulmane de toute l’Inde."
  aiml_up_coalition_news:0 "Leur soutien dans les provinces à majorité musulmane fut particulièrement décisif, grâce à leur alliance avec la controversée Ligue musulmane de toute l’Inde, traçant la voie d’un Pakistan indépendant."
  aiml_up_fight_news:0 "Ils ont combattu vaillamment la très populaire Ligue musulmane de toute l’Inde, qui propose un État séparé pour les musulmans et a attiré de nombreux suffrages et une grande attention par cette idée."
  aiml_up_neutral_news:0 "Ils se sont imposés comme le parti le plus soutenu par les groupes minoritaires dans leurs provinces respectives ; peut-être, juste peut-être, ce sous-continent si longtemps divisé verra-t-il enfin la paix."

