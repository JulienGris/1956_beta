  r56_RAJ_substitution_technologies_desc:0 "Privés de certaines ressources de l’Empire britannique, nous devons lancer des programmes de substitution et garantir notre indépendance autarcique."
  r56_RAJ_redistribute_properties:0 "Redistribuer les propriétés"
  r56_RAJ_redistribute_properties_desc:0 "En redistribuant les biens britanniques et en partageant la terre, nous pouvons offrir un avenir à de nombreux déshérités."
  r56_RAJ_militarized_hindutva:0 "Hindutva militarisée"
  r56_RAJ_militarized_hindutva_desc:0 "Par Shiva ! Tous les hindous doivent servir la mère Inde et défendre ses dieux contre ses ennemis."
  r56_RAJ_weapons_for_the_new_india:0 "Des armes pour la nouvelle Inde"
