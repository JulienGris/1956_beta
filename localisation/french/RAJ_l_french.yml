  RAJ_Reinforce_the_Government_of_India_Act_desc:0 "Le Government of India Act de 1935 fut une étape majeure dans la refonte du Raj ; nous l’appliquerons en conséquence."
  RAJ_Linlithgows_Reign:0 "Le règne de Linlithgow"
  RAJ_Linlithgows_Reign_desc:0 "La fonction de gouverneur général de l’Inde était occupée par Lord Willingdon depuis cinq ans ; l’administration britannique a décidé de nommer Lord Linlithgow et d’envoyer Willingdon à la retraite. Les partis d’opposition voient là une stagnation et s’opposent de plus en plus à la coopération. Si nous poursuivons ainsi, le peuple indien pourrait recourir à la violence. Monter les partis d’opposition les uns contre les autres peut toutefois nous donner l’avantage."
  RAJ_Provincial_Elections:0 "Élections provinciales"
  RAJ_Provincial_Elections_desc:0 "Avec la première élection générale indienne, de longs mois de campagne intense s’ouvrent pour tous les partis en lice."
  RAJ_assert_control_over_lhoyu:0 "Affermir le contrôle sur [434.GetName]"
  RAJ_assert_control_over_lhoyu_desc:0 "La North-East Frontier Tract est mal cartographiée depuis près de vingt ans, ce qui a permis au Tibet de contrôler la zone de notre côté de la ligne McMahon. Corrigeons les erreurs du passé et assurons-nous que l’État de [434.GetName] reste sous notre contrôle."
  RAJ_Independent_Labour_Party:0 "Parti travailliste indépendant"
  RAJ_Independent_Labour_Party_desc:0 "Notre priorité absolue est d’apporter la justice en Inde et de détruire le système des castes."
  RAJ_Indian_National_Congress:0 "Congrès national indien"
  RAJ_Indian_National_Congress_desc:0 "Unissons-nous pour nous libérer de la domination britannique."
  RAJ_Unionist_Party:0 "Parti unioniste"
  RAJ_Unionist_Party_desc:0 "Seule une action politique réfléchie et mesurée peut maintenir l’Inde stable."
  RAJ_Prepare_the_Lucknow_Session:0 "Préparer la session de Lucknow"
  RAJ_Prepare_the_Lucknow_Session_desc:0 "Rassemblons tous les membres du Congrès pour discuter des défis qui nous attendent."
  RAJ_Secure_Rural_Hindus:0 "Rallier les hindous ruraux"
  RAJ_Secure_Rural_Hindus_desc:0 "Les hindous des campagnes soutiennent le Congrès depuis sa création."
  RAJ_Broaden_our_Coalition:0 "Élargir notre coalition"
  RAJ_Broaden_our_Coalition_desc:0 "Ce n’est qu’en amenant de nouveaux visages au Congrès que nous pourrons assurer la victoire."
  RAJ_Nehrus_Campaign:0 "La campagne de Nehru"
  RAJ_Nehrus_Campaign_desc:0 "Rassemblons des fonds pour soutenir l’opération de Nehru."
  RAJ_An_Offer_for_Rajagopalachari:0 "Une offre pour Manohar"
  RAJ_An_Offer_for_Rajagopalachari_desc:0 "Nous pourrons certainement gagner du soutien si nous lui promettons un poste au cabinet une fois l’élection terminée."
  RAJ_Azads_Support:0 "Le soutien de Raisman"
  RAJ_Azads_Support_desc:0 "Loyal au Raj et le servant fidèlement, Raisman n’aurait sans doute aucun mal à servir une Inde indépendante et à mettre ses compétences au service d’un nouveau sous-continent."
  RAJ_Nehrus_Candidacy:0 "La candidature de Nehru"
  RAJ_Nehrus_Candidacy_desc:0 "Le très apprécié Jawaharlal Nehru devra diriger le Congrès national indien si nous voulons voir le visage de la victoire."
  RAJ_New_Leadership:0 "Siphonner la CSP"
  RAJ_New_Leadership_desc:0 "Le Congress Socialist Party est considéré comme l’aile « radicale » du Congrès, rassemblant des socialistes qui ont, semble-t-il, choisi l’opportunisme en rejoignant un parti composé de la petite bourgeoisie. En durcissant notre rhétorique à leur égard, nous convaincrons très certainement nombre de leurs membres de se ranger du côté de la justice."
  RAJ_Appeal_to_the_Lower_Castes:0 "S’adresser aux basses castes"
  RAJ_Appeal_to_the_Lower_Castes_desc:0 "Bien que leur droit de vote soit limité, il est crucial d’obtenir la majorité de leurs voix."
  RAJ_Subvert_Stalinist_Influence:0 "S’adresser aux travailleurs"
  RAJ_Subvert_Stalinist_Influence_desc:0 "Notre objectif électoral principal est de démanteler le système des castes ; mais ce n’est évidemment pas le seul système oppressif de la société hindoue. La relation entre prolétariat et bourgeoisie, entre employeur et employé, est profondément exploitante et doit elle aussi disparaître."
  RAJ_Pillais_Influence:0 "L’influence de Pillai"
  RAJ_Pillais_Influence_desc:0 "P. Krishna Pillai est un membre précieux du Parti communiste indien ; grâce à ses analyses, nous adopterons une meilleure stratégie."
  RAJ_Danges_Influence:0 "L’influence de Dange"
  RAJ_Danges_Influence_desc:0 "Shripad Amrit Dange, cofondateur du Parti communiste indien, possède une expérience rare et peut être vital pour atteindre notre objectif."
  RAJ_Local_Organization:0 "Coopération avec l’IIM"
  RAJ_Local_Organization_desc:0 "Tous les partis indiens respectables travaillent à l’inévitable indépendance. Oublier l’exploitation britannique serait une folie. En formant un bloc uni, l’Inde gagnera bien plus vite l’autonomie."
  RAJ_Centralize_the_Party:0 "L’esprit révolutionnaire"
  RAJ_Centralize_the_Party_desc:0 "Si nous érigeons les partis de la petite bourgeoisie en égaux dans la lutte contre l’injustice et que nous n’entretenons pas notre esprit marxiste révolutionnaire, nous nuisons à notre fin : une société socialiste débarrassée de l’exploitation."
  RAJ_Organize_a_Conference:0 "La conférence de Bombay"
  RAJ_Organize_a_Conference_desc:0 "Les organisations de gauche indiennes sont nombreuses mais n’ont guère œuvré de concert sur une cause commune. Notre succès canalise les aspirations de tous ceux qui, en Inde, désirent l’égalité."
  RAJ_A_Society_of_All_Classes:0 "Inde indivisible"
  RAJ_A_Society_of_All_Classes_desc:0 "L’Inde, diverse comme un continent, ne peut être gouvernée par ceux qui ne représentent que les hindous, les musulmans, ou même la classe supérieure. Elle doit l’être collectivement, par une coalition de toutes les cultures, langues, ethnies et castes."
  RAJ_Democracy_and_Socialism:0 "Victoire de la démocratie"
  RAJ_Democracy_and_Socialism_desc:0 "La vision fondatrice d’une Inde unie ne peut se réaliser que par un système politique fédéral et multipartite, centré sur la liberté."
  RAJ_Assemble_the_Constitutional_Assembly:0 "L’Assemblée constituante"
  RAJ_Assemble_the_Constitutional_Assembly_desc:0 "Le Raj britannique appartenant enfin au passé, nous avons le devoir et l’opportunité d’édifier à sa place un nouvel État indien."
  RAJ_Strengthen_Liberal_Elements:0 "Renforcer les éléments libéraux"
  RAJ_Strengthen_Liberal_Elements_desc:0 "Si le Congrès et ses penchants socialistes ont beaucoup fait pour l’indépendance, leurs politiques économiques sont intenables pour un pays qui se relève d’un siècle de colonialisme."
  RAJ_Nehrus_Vision_for_India:0 "La vision de Nehru pour l’Inde"
  RAJ_Nehrus_Vision_for_India_desc:0 "Jawaharlal Nehru et ses partisans au Congrès ont longtemps combattu la domination britannique et en sont sortis victorieux. Il lui revient désormais de guider l’Inde dans le monde postcolonial."
  RAJ_Cut_down_on_Tariffs:0 "Réduire les tarifs douaniers"
  RAJ_Cut_down_on_Tariffs_desc:0 "L’économie indienne a longtemps été maintenue au stade agraire par nos suzerains britanniques, nous excluant des marchés mondiaux — hormis le jute et le thé. Réintégrons l’économie mondiale en facilitant le commerce avec l’Inde."
  RAJ_Relieve_the_Administrative_Burden:0 "Alléger la charge administrative"
  RAJ_Relieve_the_Administrative_Burden_desc:0 "Par leur politique vis-à-vis des princes locaux et leur stratégie de division, les Britanniques ont rendu l’architecture du Raj d’une complexité excessive. Une administration restructurée nous préparera mieux à l’avenir."
  RAJ_Thorough_Corruption_Audits:0 "Audits anti-corruption approfondis"
  RAJ_Thorough_Corruption_Audits_desc:0 "Autre héritage marquant de la domination britannique : la corruption. Beaucoup de fonctionnaires dressent des obstacles artificiels pour s’enrichir. Nous passerons les dossiers au crible et traquerons les pires coupables."
  RAJ_Reconect_broken_up_Industries:0 "Reconnecter les industries disloquées"
  RAJ_Reconect_broken_up_Industries_desc:0 "La partition de l’Inde fut tout sauf paisible ; les ressentiments persistent entre populations pakistanaise et indienne. Cela ne doit pas nous empêcher de rechercher le mieux pour nos deux nations. De nombreuses chaînes d’approvisionnement furent sectionnées par une frontière tracée à la hâte. Faciliter les affaires transfrontalières pourrait soulager des secteurs ravagés par la partition."
  RAJ_Loosen_Rupee_Exchange:0 "Assouplir le change de la roupie"
  RAJ_Loosen_Rupee_Exchange_desc:0 "La roupie indienne est aujourd’hui arrimée à la livre sterling : facteur de stabilité, certes, mais entrave majeure à notre capacité d’emprunt extérieur — pourtant indispensable, vu notre déficit commercial. En confiant la roupie au marché, nous mettrons les voiles vers la prospérité libéralisée."
  RAJ_Reproachment_with_the_West:0 "Rapprochement avec l’Occident"
  RAJ_Reproachment_with_the_West_desc:0 "Nos relations passées avec l’Europe furent peu reluisantes, mais les bénéfices économiques de la coopération l’emportent sur les rancœurs qui subsistent au sein du gouvernement."
  RAJ_Extensive_Agricultural_Subsidies:0 "Subventions agricoles étendues"
  RAJ_Extensive_Agricultural_Subsidies_desc:0 "Le simple paysan est l’épine dorsale de l’Inde. Si notre objectif est de progresser vers une économie industrielle, les travailleurs agricoles doivent être soutenus."
  RAJ_Ties_Across_Asia:0 "Liens à travers l’Asie"
  RAJ_Ties_Across_Asia_desc:0 "La plupart des nations d’Asie partagent l’expérience du colonialisme européen. Nous exploiterons ces points communs pour approfondir notre coopération militaire, économique et politique."
  RAJ_Indo_Soviet_Friendship_Treaty:0 "Traité d’amitié indo-[SOV.GetAdjective]"
  RAJ_Indo_Soviet_Friendship_Treaty_desc:0 "[RAJ_Indo_Soviet_Treaty_Pakistan]Des relations cordiales avec [SOV.GetNameDef] profiteront grandement à notre position internationale et resserreront nos liens économiques avec l’une des plus grandes économies du monde."
  RAJ_Want_Peace_Prepare_for_War:0 "Si tu veux la paix, prépare la guerre"
  RAJ_Want_Peace_Prepare_for_War_desc:0 "Le monde devient chaque jour plus violent ; pour garantir la paix et la prospérité de notre nation, nous devons être prêts à la défendre. Cela implique de renforcer nos forces armées, de nouer des alliances et de rester vigilants face aux menaces. Ce n’est qu’en nous préparant à la guerre que nous pourrons espérer la paix."
  RAJ_war_preparation:0 "Préparation à la guerre"
  RAJ_Foster_Mining_Jobs:0 "Encourager l’emploi minier"
  RAJ_Foster_Mining_Jobs_desc:0 "Pour développer les campagnes indiennes, nous encouragerons l’implantation d’industries minières afin d’apporter la prospérité là où elle manque depuis trop longtemps."
  RAJ_Indo_Soviet_Friendship_Treaty_pakistan:0 "L’alignement du Pakistan devenant de moins en moins certain, nous devons nous assurer d’un soutien international pour conforter notre position dans le sous-continent."
  RAJ_Federalize_Education:0 "Fédéraliser l’éducation"
  RAJ_Federalize_Education_desc:0 "Nous instaurerons un programme commun dans toutes les écoles indiennes, afin que chaque Indien, quelle que soit son ethnie, sa religion ou sa langue, partage une compréhension commune du monde."
  RAJ_Reform_the_Rupee:0 "Réformer la roupie"
  RAJ_Reform_the_Rupee_desc:0 "Après un siècle de lutte pour l’indépendance, la roupie indienne demeure arrimée à la livre sterling. Nous arrimerons plutôt le taux de change aux monnaies mondiales émergentes : yen, dollar et rouble."
  RAJ_Constitutional_Minority_Protections:0 "Garanties constitutionnelles pour les minorités"
  RAJ_Constitutional_Minority_Protections_desc:0 "Probablement le sous-continent le plus divers et le plus vibrant, l’Inde compte, dans chaque région, d’importantes minorités linguistiques, religieuses et ethniques. Assurer leur sécurité et leur prospérité, c’est assurer celles de toute l’Inde."
  RAJ_Crackdown_on_Radicalism:0 "Réprimer le radicalisme"
  RAJ_Crackdown_on_Radicalism_desc:0 "La lutte est terminée : l’Inde est indépendante. Certains semblent ne pas l’avoir compris, tant subsistent des organisations révolutionnaires aux millions d’adeptes. Ramener ces personnes dans l’arène démocratique commune nous permettra de forger ensemble notre avenir."
  RAJ_India_United_under_Britain:0 "Inde unie sous la Grande-Bretagne"
  RAJ_India_United_under_Britain_desc:0 "À rebours des autres partis qui rêvent de sociétés radicales et utopiques, nous adoptons une stratégie équilibrée et posée pour faire avancer l’Inde."
  RAJ_Ally_with_the_Muslim_League:0 "S’allier à la Ligue musulmane"
  RAJ_Ally_with_the_Muslim_League_desc:0 "En promettant un Pakistan séparé, nous pourrons rallier l’AIML et combattre ensemble les socialistes."
  RAJ_Fight_the_Muslim_League:0 "Combattre la Ligue musulmane"
  RAJ_Fight_the_Muslim_League_desc:0 "L’idée d’un État musulman séparé doit être extirpée des esprits."
  RAJ_Siphon_Congress_Ministers:0 "Siphonner le soutien du Congrès"
  RAJ_Siphon_Congress_Ministers_desc:0 "Beaucoup, au Congrès, estiment que les politiques socialistes vont trop loin ; avec un peu de campagne, nous pourrions les faire changer d’allégeance."
  RAJ_Appeal_to_Anglo_Indians:0 "S’adresser aux Anglo-Indiens"
  RAJ_Appeal_to_Anglo_Indians_desc:0 "Les Anglo-Indiens sont une minorité longtemps négligée par les politiciens indiens comme britanniques — une opportunité à saisir pour gagner leurs voix."
  RAJ_Content_for_British_Rule:0 "Satisfaits de la domination britannique"
  RAJ_Content_for_British_Rule_desc:0 "On ne peut bâtir une Inde stable avec une direction radicale, imprévisible et destructrice du cœur du pays."
  RAJ_Establish_a_Precense_in_Sindh:0 "Établir une présence au Sind"
  RAJ_Establish_a_Precense_in_Sindh_desc:0 "Au sud de la province fondatrice de notre grand parti se trouve une province négligée et ethniquement diverse qui mérite davantage d’attention."
  RAJ_National_Unity:0 "Unité nationale"
  RAJ_National_Unity_desc:0 "Nous devons rassembler toute la nation — hindous, sikhs, bouddhistes et musulmans. Ce n’est qu’alors que nous pourrons connaître la paix."
  RAJ_Appeal_to_the_Peasentry:0 "S’adresser à la paysannerie"
  RAJ_Appeal_to_the_Peasentry_desc:0 "La paysannerie est le cœur vital de l’Inde ; quiconque l’ignore en paiera le prix dans les urnes."
  RAJ_Implement_Equal_Education:0 "Mettre en place l’égalité scolaire"
  RAJ_Implement_Equal_Education_desc:0 "Dans toute société divisée en classes, l’enseignement de qualité est surtout réservé aux classes supérieures ; en Inde, le système éducatif est particulièrement défavorable aux couches modestes. Notre devoir est d’égaliser enfin l’accès à l’éducation pour que les esprits brillants de toute la société puissent s’épanouir."
  RAJ_Dismantle_the_Judicial_System:0 "Démanteler le système judiciaire"
  RAJ_Dismantle_the_Judicial_System_desc:0 "Le système judiciaire hindou est un enchevêtrement complexe favorisant les classes supérieures et négligeant la majorité. La justice en Inde ne sera possible que si nos tribunaux partagent la vision de notre société révolutionnée."
  RAJ_Abolish_the_Reservation_System:0 "Abolir le système de réservations"
  RAJ_Abolish_the_Reservation_System_desc:0 "Les castes supérieures bénéficient souvent d’un traitement de faveur dans la fonction publique ; certaines places leur sont même exclusivement réservées. Cela a entraîné une baisse de l’efficacité bureaucratique."
  RAJ_Seize_Influence_from_Upper_Castes:0 "Saisir l’influence des hautes castes"
  RAJ_Seize_Influence_from_Upper_Castes_desc:0 "La classe supérieure a tenu le pouvoir d’une main de fer, même sous la domination britannique. Cette situation ne peut perdurer dans une société socialiste libérée de l’exploitation. En tant que large majorité, nous confisquerons leur influence."
  RAJ_Expand_Healthcare_Facilities:0 "Extension universitaire"
  RAJ_Expand_Healthcare_Facilities_desc:0 "Après avoir réformé et égalisé l’enseignement primaire et secondaire, nous nous attaquerons au supérieur."
  RAJ_Establish_The_Revolutionary_Guard:0 "Créer la Garde révolutionnaire"
  RAJ_Establish_The_Revolutionary_Guard_desc:0 "La Révolution doit être protégée contre les mouvements contre-révolutionnaires, à tout prix ! Nous allons établir une armée à l’image de l’Armée rouge."
  RAJ_Invite_Soviet_Planners:0 "Inviter des planificateurs soviétiques"
  RAJ_Invite_Soviet_Planners_desc:0 "« L’État est un organe de domination de classe, un organe d’oppression d’une classe par une autre ; il instaure un ordre qui légalise et perpétue cette oppression en modérant les heurts entre classes. »\n— Vladimir Lénine"
  RAJ_Invite_International_Theorists:0 "Inviter des théoriciens étrangers"
  RAJ_Invite_International_Theorists_desc:0 "« La liberté réservée aux membres du gouvernement, aux membres du parti — même s’ils sont très nombreux — n’est pas la liberté. La liberté est toujours la liberté de celui qui pense autrement. »\n— Rosa Luxemburg"
  RAJ_Agricultural_Collectivisation:0 "Collectivisation agricole"
  RAJ_Agricultural_Collectivisation_desc:0 "Notre objectif premier est d’étendre le prolétariat indien — mais qui le nourrira ? Notre système actuel d’exploitations privées est dépassé et inefficace ; nous devons regrouper les petites tenures paysannes en grandes « fermes collectives »."
  RAJ_Expand_Soviet_Aid:0 "Étendre l’aide soviétique"
  RAJ_Expand_Soviet_Aid_desc:0 "Les Soviétiques sont un peuple généreux, qui a aidé des économies agraires à bâtir de puissantes industries, comme ils l’ont fait chez eux. Demandons davantage d’aide pour accélérer notre industrialisation."
  RAJ_Rethink_Resource_Policy:0 "Repenser la politique des ressources"
  RAJ_Rethink_Resource_Policy_desc:0 "L’ancien régime colonial a focalisé l’extraction sur les produits d’exportation lucratifs, en négligeant presque totalement l’industrialisation — donc l’acier et le charbon. Nous devons renverser cette logique pour soutenir un prolétariat en pleine croissance."
  RAJ_Combat_Institutional_Corruption:0 "Combattre la corruption institutionnelle"
  RAJ_Combat_Institutional_Corruption_desc:0 "La corruption est profondément enracinée dans les institutions indiennes. Elle a prospéré sous le Raj et perdurera si nous n’y mettons pas fin."
  RAJ_Establish_a_Central_Committee:0 "Créer un comité central"
  RAJ_Establish_a_Central_Committee_desc:0 "En imposant des objectifs industriels planifiés de façon centralisée, nous récoltons l’efficacité de la rationalité… au prix de restreindre la liberté des travailleurs."
  RAJ_Incentivize_Workplace_Democracy:0 "Imposer la démocratie au travail"
  RAJ_Incentivize_Workplace_Democracy_desc:0 "En mettant l’accent sur un socialisme localisé, nous accorderons davantage de liberté aux travailleurs, quitte à sacrifier certains objectifs industriels globaux."
  RAJ_The_Liberation_of_South_Asia:0 "La libération de l’Asie du Sud"
  RAJ_The_Liberation_of_South_Asia_desc:0 "Si le prolétariat indien a obtenu l’illusion d’élections et d’un gouvernement élu, d’autres parties de l’Asie du Sud n’ont pas cette chance. Nous soutiendrons discrètement leurs mouvements ouvriers par divers moyens : acheminement d’armes, intervention militaire et subversion politique.\nVishv ke karmachaaree ekajut ho gae !"
  RAJ_Seize_the_Means:0 "Saisir les moyens…"
  RAJ_Seize_the_Means_desc:0 "Notre premier pas vers le socialisme est de saisir les moyens de production, de distribution et d’échange. Cela pourra heurter certains pans du pays si nous n’agissons pas prudemment."
  RAJ_of_Production:0 "…de production"
  RAJ_of_Production_desc:0 "La bourgeoisie s’est réservé la part du lion depuis bien trop longtemps. Il est temps que les travailleurs goûtent aux fruits de leur propre labeur."
  RAJ_of_Distribution:0 "…de distribution"
  RAJ_of_Distribution_desc:0 "Une usine n’est rien sans réseau de distribution. Nous devons nationaliser les chemins de fer privés pour le bien du peuple indien."
  RAJ_of_Exchange:0 "…d’échange"
  RAJ_of_Exchange_desc:0 "Pour coordonner le budget national, nous avons besoin d’une banque publique régulant notre monnaie, nos flux et contrepoids."
  RAJ_Connect_the_Rural_Areas:0 "Relier les campagnes"
  RAJ_Connect_the_Rural_Areas_desc:0 "Les Britanniques n’ont construit que des lignes reliant ports et ressources naturelles, laissant le pays entier ou presque à l’écart. À nous de corriger rétrospectivement ces erreurs."
  RAJ_The_Ceylon_Emergency:0 "L’urgence à Ceylan"
  RAJ_The_Ceylon_Emergency_desc:0 "Grâce aux armes et au soutien politique reçus, les Cinghalais sont prêts à se soulever contre les Britanniques — ils n’attendent plus que notre signal."
  RAJ_Overthrow_the_Rana_dynasty:0 "L’insurrection népalaise"
  RAJ_Overthrow_the_Rana_dynasty_desc:0 "Le peuple népalais s’organise depuis longtemps ; l’heure est venue de frapper le régime oppressif des Rana."
  RAJ_The_Bhutanese_Revolt:0 "La révolte bhoutanaise"
  RAJ_The_Bhutanese_Revolt_desc:0 "La dynastie Wangchuck, aussi populaire soit-elle, a failli envers les plus pauvres. Le peuple est prêt à la défier."
  RAJ_The_Remaining_Ports:0 "Les ports restants"
  RAJ_The_Remaining_Ports_desc:0 "Le sous-continent compte encore de fâcheux reliquats du colonialisme qu’il faudra reprendre — pacifiquement si possible, par la force si nécessaire."
  RAJ_Jinnahs_Kingdom:0 "Nos camarades musulmans"
  RAJ_Jinnahs_Kingdom_desc:0 "Les groupes religieux, linguistiques et culturels du sous-continent sont intimement liés. En arracher un affaiblirait gravement l’Inde. Longtemps négligés mais essentiels, les musulmans du Sind, du Pendjab et du Bengale doivent être pleinement associés."
  RAJ_A_New_Movement:0 "Un nouveau mouvement"
  RAJ_A_New_Movement_desc:0 "La Russie de Staline a échoué à instaurer une société socialiste juste ; nous devons nous en démarquer et lancer un nouveau mouvement."
  RAJ_The_Third_International:0 "La Troisième Internationale"
  RAJ_The_Third_International_desc:0 "La Russie de Staline a tenu bon des années durant. Pour survivre à notre tour, nous devons nous y aligner."
  RAJ_Asian_Anti_Colonialism:0 "Anticolonialisme asiatique"
  RAJ_Asian_Anti_Colonialism_desc:0 "Après tant d’années, il est temps d’expulser définitivement les Européens d’Asie pour garantir notre avenir."
  RAJ_Bind_South_Asia_Closer:0 "Souder l’Asie du Sud"
  RAJ_Bind_South_Asia_Closer_desc:0 "Le socialisme est établi en Asie du Sud ; il nous reste à l’aligner militairement."
  RAJ_Socialist_Science:0 "Science socialiste"
  RAJ_Socialist_Science_desc:0 "Les Soviétiques ont beaucoup progressé scientifiquement et possèdent des technologies précieuses pour l’État ouvrier indien. Des échanges scientifiques profiteraient à nos deux sociétés."
  RAJ_Military_Cooperation:0 "Coopération militaire"
  RAJ_Military_Cooperation_desc:0 "Avec nos nouveaux alliés, coordonnons notre défense et partageons nos secrets militaires."
  RAJ_Technological_Cooperation:0 "Coopération technologique"
  RAJ_Technological_Cooperation_desc:0 "Renforçons notre monde académique — et celui de nos alliés."
  RAJ_Establish_a_National_Government:0 "Établir un gouvernement national"
  RAJ_Establish_a_National_Government_desc:0 "Après la victoire électorale, mettons en place un gouvernement centralisé et formons un cabinet."
  RAJ_Battle_the_Untouchables:0 "Combattre l’« intouchabilité »"
  RAJ_Battle_the_Untouchables_desc:0 "Les plus faibles des castes ont besoin d’aide ; une Inde démocratique doit améliorer leur condition."
  RAJ_Encourage_Rural_Education:0 "Encourager l’éducation rurale"
  RAJ_Encourage_Rural_Education_desc:0 "Pour devenir une puissance industrielle, il faut promouvoir l’éducation partout et pour tous."
  RAJ_Expand_Delhi_University:0 "Étendre l’université de Delhi"
  RAJ_Expand_Delhi_University_desc:0 "La demande d’enseignement supérieur augmente ; développons notre plus grande université, Delhi University."
  RAJ_Economic_Restructuring:0 "Restructuration économique"
  RAJ_Economic_Restructuring_desc:0 "En l’état, notre économie n’est pas prête pour l’avenir. Agissons vite, ou bien nous resterons une société agraire."
  RAJ_Expand_the_Public_Sector:0 "Étendre le secteur public"
  RAJ_Expand_the_Public_Sector_desc:0 "Le meilleur moyen d’accroître nos capacités industrielles est l’intervention directe de l’État — au risque de froisser nos membres les plus conservateurs."
  RAJ_Soviet_Assistance:0 "Aide soviétique"
  RAJ_Soviet_Assistance_desc:0 "Dans le contexte géopolitique actuel, l’Union soviétique a tout intérêt à aider l’Inde à contrebalancer les puissances occidentales."
  RAJ_Agricultural_Investments:0 "Investissements agricoles"
  RAJ_Agricultural_Investments_desc:0 "En améliorant notre production agricole, nous encourageons les campagnes à se diversifier et relevons le niveau de vie de l’Indien moyen."
  RAJ_Expell_the_Socialists:0 "Exclure les socialistes"
  RAJ_Expell_the_Socialists_desc:0 "Notre parti fut longtemps une vaste coalition ; maintenant que notre objectif commun est atteint, nous en expulserons les éléments extrêmes."
  RAJ_Unify_the_Courts:0 "Unifier les tribunaux"
  RAJ_Unify_the_Courts_desc:0 "Notre système judiciaire est inutilement complexe et pluriséculaire ; unifions-le pour accroître son efficacité."
  RAJ_Concessions_to_Princes:0 "Concessions aux princes"
  RAJ_Concessions_to_Princes_desc:0 "Les princes désapprouvent notre gouvernement, certes ; mais ne laissons pas l’idéologie nous aveugler : restons pragmatiques."
  RAJ_No_Compromises:0 "Aucun compromis"
  RAJ_No_Compromises_desc:0 "Les institutions oppressives centenaires des États princiers n’ont pas leur place dans notre nation moderne. Composer avec ces vestiges féodaux est inacceptable."
  RAJ_Integrate_the_Princely_States:0 "Intégrer les États princiers"
  RAJ_Integrate_the_Princely_States_desc:0 "À mesure que nous progressons vers l’indépendance, les États princiers seront intégrés — de gré ou de force."
  RAJ_Democratize_our_Institutions:0 "Démocratiser nos institutions"
  RAJ_Democratize_our_Institutions_desc:0 "Minées par la corruption héritée de systèmes séculaires, nos institutions doivent être réorganisées et réformées pour garantir la stabilité."
  RAJ_Central_Bureau_of_Investigation:0 "Bureau central d’enquête"
  RAJ_Central_Bureau_of_Investigation_desc:0 "Nos institutions naissantes doivent être protégées contre toute menace. Voici notre réponse à l’Abwehr, au MI6 et à la CIA."
  RAJ_Reform_our_Police_Force:0 "Réformer la police"
  RAJ_Reform_our_Police_Force_desc:0 "La police impériale indienne est honnie ; notre régime le sera aussi si nous conservons ses méthodes. Abolissons le système policier britannique et créons un modèle authentiquement indien."
  RAJ_Revise_Taxation_Policies:0 "Revoir la fiscalité"
  RAJ_Revise_Taxation_Policies_desc:0 "Le Raj taxait lourdement notre population, souvent de manière injuste. Pour une économie et une société saines, remplaçons le système fiscal britannique par un modèle indien."
  RAJ_Reestablish_our_Armed_Forces:0 "Réétablir nos forces armées"
  RAJ_Reestablish_our_Armed_Forces_desc:0 "L’Armée indienne britannique existait d’abord pour protéger la domination britannique. Il nous faut une nouvelle armée au service de la nation indienne."
  RAJ_No_Resentments:0 "Sans ressentiment"
  RAJ_No_Resentments_desc:0 "Notre histoire avec les Britanniques ne fut pas paisible, mais les circonstances exigent un alignement avec l’Occident. Malgré des blessures encore vives, faisons front commun en partenaires égaux."
  RAJ_Protect_the_Arabian_Sea:0 "Protéger la mer d’Arabie"
  RAJ_Protect_the_Arabian_Sea_desc:0 "Entre nous et l’axe de défense britannique — le canal de Suez — s’étend la vaste et exposée mer d’Arabie, où pirates et sous-marins ennemis perturbent nos routes vers le Moyen-Orient et au-delà. Des stations radar et bases aériennes coordonnées nous aideront à reprendre la maîtrise de l’océan Indien."
  RAJ_Equal_Partners:0 "Partenaires d’égal à égal"
  RAJ_Equal_Partners_desc:0 "La relation colonie–métropole ayant cédé la place à un partenariat d’égal à égal, prenons une part plus grande aux affaires internationales pour défendre la liberté là où la main britannique n’atteint pas."
  RAJ_A_New_Way_Forward:0 "Une nouvelle voie"
  RAJ_A_New_Way_Forward_desc:0 "L’Inde n’a rien à gagner dans la guerre ; si nous parvenons à en empêcher ne serait-ce qu’une, nous sauverons des milliers de vies."
  RAJ_Mutual_Investments:0 "Investissements mutuels"
  RAJ_Mutual_Investments_desc:0 "Même si l’Europe est plus industrialisée, ces investissements seront mutuellement bénéfiques."
  RAJ_The_Non_Aligned_Movement:0 "Mouvement des non-alignés"
  RAJ_The_Non_Aligned_Movement_desc:0 "Faisons naître une communauté mondiale indépendante des superpuissances de notre époque et luttons ensemble pour la paix."
  RAJ_Bring_Democracy_to_South_Asia:0 "Apporter la démocratie en Asie du Sud"
  RAJ_Bring_Democracy_to_South_Asia_desc:0 "Si l’Inde est devenue un bastion éclatant de démocratie, notre continent demeure plein de tyrannies."
  RAJ_South_Asian_Economic_Integration:0 "Intégration économique sud-asiatique"
  RAJ_South_Asian_Economic_Integration_desc:0 "Le sous-continent partage, entre autres, un intérêt commun sur le marché mondial. En consolidant et en intégrant nos économies, la prospérité atteindra tous — et nos négociations commerciales internationales gagneront en efficacité."
  RAJ_Pressure_the_British_about_Ceylon:0 "Faire pression sur les Britanniques pour Ceylan"
  RAJ_Pressure_the_British_about_Ceylon_desc:0 "Les Ceylanais militent depuis longtemps pour l’indépendance, espérant que celle de l’Inde libère aussi leur île de l’exploitation britannique. Si ce ne fut pas le cas, aidons désormais leur mouvement à trouver sa voix."
  RAJ_Armed_Neutrality:0 "Neutralité armée"
  RAJ_Armed_Neutrality_desc:0 "Personne ne veut la guerre ; les dirigeants convoitent ses butins. Rendre ces butins inaccessibles doit être l’objectif d’une nation neutre et souveraine. Améliorons le moral de notre armée et renforçons notre industrie d’armement."
  RAJ_Expand_its_Competences:0 "Étendre ses compétences"
  RAJ_Expand_its_Competences_desc:0 "En élargissant et unifiant cette organisation, notre parole portera davantage et nous protégerons plus efficacement les droits des petits États."
  RAJ_Emphasise_Anti_Colonialist_Sentiment:0 "Mettre l’accent sur l’anticolonialisme"
  RAJ_Emphasise_Anti_Colonialist_Sentiment_desc:0 "Le colonialisme est une institution laide, dépassée et impopulaire — dont l’abolition est plus que tardive. Portons ce message au monde entier, sinon des décennies de souffrance inutile attendent les peuples colonisés."
  RAJ_Take_back_the_Ports:0 "Récupérer les ports"
  RAJ_Take_back_the_Ports_desc:0 "Ces ports européens sont une blessure ouverte de notre passé colonial. Nous espérons un règlement pacifique, mais ne miserons pas sur les seules paroles."
  RAJ_Launch_The_Quit_India_Movement:0 "Lancer le mouvement Quit India"
  RAJ_Launch_The_Quit_India_Movement_desc:0 "Nous employons tous les moyens pour chasser les Britanniques, mais renouer avec nos adversaires politiques et déclencher une grève générale pourrait accroître la pression."
  RAJ_Intervention_in_Pakistan:0 "Intervenir au Pakistan"
  RAJ_Intervention_in_Pakistan_desc:0 "Le frêle vernis de la « démocratie » de Jinnah s’est écaillé : une dictature s’impose aux musulmans, sikhs et hindous du Pendjab, du Sind et du Bengale. Tolérer un tel extrémisme, c’est inviter des puissances étrangères à s’emparer du sous-continent. Les forces armées indiennes doivent intervenir avant qu’il ne soit trop tard."
  RAJ_Offer_the_British_Concessions:0 "Concessions aux Britanniques"
  RAJ_Offer_the_British_Concessions_desc:0 "Le Royaume-Uni tient à l’Inde pour de nombreuses raisons — au premier rang, la richesse naturelle du sous-continent. Les négociations seront plus fluides si nous promettons de partager certaines ressources."
  RAJ_Mutual_Security:0 "Sécurité mutuelle"
  RAJ_Mutual_Security_desc:0 "Dans notre nouvelle alliance, coordonnons nos stratégies militaires pour renforcer la sécurité de tous."
  RAJ_The_Remains_of_South_Asia:0 "Les reliquats d’Asie du Sud"
  RAJ_The_Remains_of_South_Asia_desc:0 "L’Asie du Sud compte encore des régimes despotiques. Avec l’aide britannique, portons la démocratie chez ces autoritarismes."
  RAJ_Outwards_to_the_World:0 "Vers le monde"
  RAJ_Outwards_to_the_World_desc:0 "Cherchons des alliances extérieures pour sécuriser la position de l’Inde."
  RAJ_The_Womens_Status:0 "La condition des femmes"

  RAJ_The_Womens_Status_desc:0 "Les femmes ont longtemps été opprimées dans notre société. Toutes sortes de pratiques barbares et archaïques leur sont encore imposées. Si la loi ne suffit pas à tout corriger, elle est la première étape vers une Inde plus juste."
  RAJ_Caste_Reform:0 "Réforme des castes"
  RAJ_Caste_Reform_desc:0 "Le système de castes et ses discriminations planent depuis longtemps sur l’Inde et dominent encore bien des régions. Dans la société hindoue, il enferme les individus dans des groupes sociaux rigides, où les basses castes sont régulièrement exploitées."
  RAJ_Develop_the_Defense_Industry:0 "Développer l’industrie de défense"
  RAJ_Develop_the_Defense_Industry_desc:0 "Après nos récentes réformes économiques et nationalisations, il est temps de renforcer nos industries nationales de défense, au bénéfice de notre économie comme de nos forces armées."
  RAJ_Establishing_A_Indian_Navy:0 "Fonder une marine indienne"
  RAJ_Establishing_A_Indian_Navy_desc:0 "L’océan Indien est vaste et dangereux ; le patrouiller exige une importante flotte de surface, dont nous ne disposons pas encore. Il est crucial d’accélérer la production navale."
  RAJ_Unity_in_India:0 "Unité indienne"
  RAJ_Unity_in_India_desc:0 "Les musulmans d’Inde ont été marginalisés trop longtemps ; aucune société libre, démocratique et juste ne peut tolérer un tel mal. Nous devons répondre à leurs revendications pour unir la nation."
  RAJ_The_Ones_Who_Got_Away:0 "Ceux qui nous ont échappé"
  RAJ_The_Ones_Who_Got_Away_desc:0 "Malgré notre fermeté pour intégrer l’Inde, quelques princes nous ont échappé. Il est temps de sécuriser le sous-continent."
  RAJ_Relieve_Indias_Struggling_Food_Supply:0 "Soulager l’approvisionnement alimentaire de l’Inde"
  RAJ_Relieve_Indias_Struggling_Food_Supply_desc:0 "L’approvisionnement alimentaire indien dépend fortement du climat. Si la mousson est insuffisante, il faut importer des céréales. En améliorant l’irrigation et les techniques agricoles, nous pourrons prévenir de futures famines."
  RAJ_Placate_the_Nobles:0 "Apaiser la noblesse"
  RAJ_Placate_the_Nobles_desc:0 "La noblesse a prospéré sous la domination britannique et voit d’un mauvais œil notre indépendance. Nous pouvons y remédier en lui accordant certaines concessions."
  RAJ_Military_Research_Department:0 "Département de recherche militaire"
  RAJ_Military_Research_Department_desc:0 "Accroissons nos capacités militaires, non par la quantité brute comme le préconisent certains généraux, mais par une véritable supériorité technologique."
  RAJ_Sit_Down_with_the_Farmers:0 "Dialogue avec les agriculteurs"
  RAJ_Sit_Down_with_the_Farmers_desc:0 "Le paysan propriétaire, travaillant sa propre terre, est le sang vital de notre pays et mérite plus d’attention que ne lui en accordait le gouvernement colonial."
  RAJ_Token_Social_Reform:0 "Réforme symbolique des castes"
  RAJ_Token_Social_Reform_desc:0 "Le système des castes a longtemps servi l’Inde pour préserver l’ordre et la stabilité, mais le départ des Britanniques a laissé vacants de nombreux postes exigeant de hautes compétences, sans candidats des hautes castes pour les occuper. En assouplissant certaines règles, nous pourrons espérer maintenir l’efficacité d’antan."
  RAJ_Expand_our_Ordance_Industry:0 "Étendre l’industrie de l’armement"
  RAJ_Expand_our_Ordance_Industry_desc:0 "Face aux conflits qui couvent, [RAJ.GetNameDef] doit être prête à défendre ses citoyens — et, presque autant, la liberté de tous."
  RAJ_Answer_The_Call:0 "Répondre à l’appel"
  RAJ_Answer_The_Call_desc:0 "Les îles Britanniques sont engagées dans une guerre qu’elles ne peuvent se permettre de perdre ; toute reddition plongerait des millions de personnes dans la tyrannie et l’obscurité. Notre devoir moral est de combattre pour la liberté partout où elle est menacée — l’heure est venue de répondre à l’appel."
  RAJ_Institute_The_Draft:0 "Instituer la conscription"
  RAJ_Institute_The_Draft_desc:0 "Notre participation à cette guerre relève d’une obligation morale, mais tous nos citoyens n’en mesurent pas la gravité. Nous devons, hélas, mobiliser ceux qui ne se portent pas volontaires, afin de libérer les peuples du monde."
  RAJ_Industrial_Investments:0 "Investissements industriels"
  RAJ_Industrial_Investments_desc:0 "Investissons massivement dans des usines à travers le pays pour faire croître et prospérer notre économie."
  RAJ_Aquire_War_Material:0 "Acquérir du matériel de guerre"
  RAJ_Aquire_War_Material_desc:0 "Pour tenir tête à d’éventuels ennemis, il nous faut des armes modernes, bien conçues et produites en quantité, au service de nos soldats."
  RAJ_Internal_Security_Act:0 "Loi sur la sécurité intérieure"
  RAJ_Internal_Security_Act_desc:0 "Nous ne pouvons laisser des factions extrémistes démolir la nation. Nous poursuivrons la politique britannique d’arrestation de ceux qui veulent détruire la grande Inde."
  RAJ_Placate_the_British:0 "Apaiser les Britanniques"
  RAJ_Placate_the_British_desc:0 "Bien que notre indépendance soit assurée, nous dépendons encore fortement des investissements britanniques. En apaisant Londres, nous pourrions attirer davantage de capitaux."
  RAJ_Federalisation:0 "Alphabétisation publique"
  RAJ_Federalisation_desc:0 "Il faut accroître massivement le taux d’alphabétisation en développant l’éducation. L’avenir de l’Inde en dépend !"
  RAJ_A_Truly_Indian_Navy:0 "Une marine véritablement indienne"
  RAJ_A_Truly_Indian_Navy_desc:0 "L’océan Indien est vaste et dangereux ; le patrouiller exige une grande flotte de surface, dont nous manquons. Il est crucial d’accélérer la production navale."
  RAJ_Fighting_Tyranny_whereever_it_may_be:0 "Combattre la tyrannie partout"
  RAJ_Fighting_Tyranny_whereever_it_may_be_desc:0 "Nos forces armées ont surtout protégé les intérêts indiens en Asie du Sud, en perdant de vue l’enjeu mondial. Aidons la liberté partout et portons la lutte à ceux qui veulent la réduire en cendres."
  RAJ_Assemble_our_Cabinet:0 "Former notre cabinet"
  RAJ_Assemble_our_Cabinet_desc:0 "Chaque nouveau vice-roi vient avec un cabinet pour soutenir son action. Autrefois simple conseil consultatif, l’Exécutif du vice-roi a gagné en influence ; trouvons des ministres compétents."
  RAJ_Meet_with_the_Legislative:0 "Rencontrer le législatif"
  RAJ_Meet_with_the_Legislative_desc:0 "Le représentant de la Couronne dispose d’un grand pouvoir sur la législature — plus qu’au Royaume-Uni — mais nous devons tout de même nous assurer que les votes nous soient favorables."
  RAJ_Meet_with_the_Judiciary:0 "Rencontrer le judiciaire"
  RAJ_Meet_with_the_Judiciary_desc:0 "Si la common law anglaise s’applique largement, l’organisation des tribunaux reste d’inspiration locale. Nous prémunir contre leur opposition nous épargnera bien des soucis."
  RAJ_Attend_the_Imperial_Conference:0 "Assister à la Conférence impériale"
  RAJ_Attend_the_Imperial_Conference_desc:0 "Les conférences impériales sont régulières, mais celle-ci a une importance particulière. Après la, disons, controverse royale, de nombreux dominions étaient en désarroi ; Londres veut resserrer les liens de l’Empire."
  RAJ_Reinvigorate_Imperial_Shipping:0 "Revigorer la navigation impériale"
  RAJ_Reinvigorate_Imperial_Shipping_desc:0 "Les voies maritimes de l’océan Indien se sont quelque peu asséchées, au détriment des caisses du Raj. Poussons à poursuivre les investissements dans la flotte marchande impériale."
  RAJ_Common_Defence_Policy:0 "Politique commune de défense"
  RAJ_Common_Defence_Policy_desc:0 "Les tensions montent partout ; l’administration britannique propose une meilleure coordination militaire entre dominions, métropole et Inde pour sécuriser l’Empire."
  RAJ_The_Indian_Merchant_Navy:0 "La marine marchande indienne"
  RAJ_The_Indian_Merchant_Navy_desc:0 "L’Inde n’a pas la réputation d’être une grande nation maritime, mais elle dépend fortement du commerce impérial. Pour mieux valoriser nos ressources, élargissons les compétences de notre marine afin de patrouiller l’océan Indien."
  RAJ_An_Army_serving_the_Empire:0 "Une armée au service de l’Empire"
  RAJ_An_Army_serving_the_Empire_desc:0 "Notre armée a surtout opéré en Asie du Sud, puis en Afrique. La métropole souhaite des opérations plus internationales pour nos soldats."
  RAJ_Indianise_the_Royal_Indian_Navy:0 "Indianiser la Royal Indian Navy"
  RAJ_Indianise_the_Royal_Indian_Navy_desc:0 "La Royal Indian Navy est officieusement considérée comme auxiliaire de la Royal Navy, car majoritairement encadrée par des Britanniques. En promouvant davantage d’Indiens à des postes élevés, la RIN gagnera une identité propre."
  RAJ_Expand_the_Indian_Air_Force:0 "Étendre l’armée de l’air indienne"
  RAJ_Study_British_Armour:0 "Étudier les blindés britanniques"
  RAJ_Study_British_Armour_desc:0 "Notre armée, centrée sur l’infanterie, manque cruellement de véhicules blindés. Étudions des modèles étrangers pour moderniser nos forces face aux menaces extérieures."
  RAJ_Expand_the_Indian_Air_Force_desc:0 "La guerre a changé. Nombre de nos généraux vivent encore sur les lauriers de la Grande Guerre ; or, un conflit moderne se joue aussi dans les airs. Ce champ de bataille a été trop longtemps négligé : il est temps d’y remédier."
  RAJ_British_Arms_Shipments:0 "Livraisons d’armes britanniques"
  RAJ_British_Arms_Shipments_desc:0 "Nous avons quantité d’hommes prêts à mourir pour l’Empire, mais nous ne pouvons pas tous les armer. Des renforts en provenance des îles amélioreront fortement notre efficacité."
  RAJ_British_Investments:0 "Investissements britanniques"
  RAJ_British_Investments_desc:0 "L’Inde n’est pas renommée pour sa puissance industrielle, et cela ne changera pas du jour au lendemain. Mais les investissements des entreprises britanniques peuvent nous aider à progresser."
  RAJ_Our_First_Order_of_Business:0 "Notre première initiative"
  RAJ_Our_First_Order_of_Business_desc:0 "Après avoir rencontré les autres pouvoirs, nous pouvons présenter sous Linlithgow le premier projet de loi au Conseil législatif impérial pour vote."
  RAJ_New_Excavation_Companies:0 "Nouvelles sociétés d’extraction"
  RAJ_New_Excavation_Companies_desc:0 "Grâce à notre infrastructure élargie, de nouvelles entreprises peuvent s’implanter pour exploiter les riches sols indiens."
  RAJ_New_Industrial_Centers:0 "Nouveaux pôles industriels"
  RAJ_New_Industrial_Centers_desc:0 "L’extension du réseau ferroviaire nous permet d’implanter des usines partout et de faire naître une nouvelle classe ouvrière indienne."
  RAJ_Expand_Urban_Centers:0 "Étendre les centres urbains"
  RAJ_Expand_Urban_Centers_desc:0 "Notre sécurité alimentaire étant à peu près assurée, développons nos centres urbains et offrons de nouvelles perspectives aux anciennes masses rurales pauvres."

  Railway_Expansion_Act_init:0 "Lancement de la loi sur l’expansion ferroviaire"
  Railway_Expansion_Act_passed:0 "Loi sur l’expansion ferroviaire adoptée"
  Railway_Expansion_Act_failed:0 "Échec de la loi sur l’expansion ferroviaire"
  RAJ_Railway_Expansion_Act:0 "Loi d’expansion ferroviaire"
  RAJ_Railway_Expansion_Act_desc:0 "L’infrastructure nationale est déficiente dans bien des régions. Jusqu’ici, nous n’avons construit que des lignes rentables ; cela doit changer si nous voulons peser dans l’économie mondiale."
  Agricultural_Stabilisation_Act_init:0 "Lancement de la loi de stabilisation agricole"
  Agricultural_Stabilisation_Act_passed:0 "Loi de stabilisation agricole adoptée"
  Agricultural_Stabilisation_Act_failed:0 "Échec de la loi de stabilisation agricole"
  RAJ_Agricultural_Stabilisation_Act:0 "Loi de stabilisation agricole"
  RAJ_Agricultural_Stabilisation_Act_desc:0 "L’Inde est depuis toujours une société agraire, mais les sécheresses récurrentes ont ravagé l’approvisionnement alimentaire. L’aide extérieure étant souvent refusée, il est dans notre intérêt d’assurer nous-mêmes notre production céréalière."
  Educational_Reform_Act_init:0 "Lancement de la loi de réforme de l’éducation"
  Educational_Reform_Act_passed:0 "Loi de réforme de l’éducation adoptée"
  Educational_Reform_Act_failed:0 "Échec de la loi de réforme de l’éducation"
  RAJ_Educational_Reform_Act:0 "Loi de réforme de l’éducation"
  RAJ_Educational_Reform_Act_desc:0 "Nos meilleurs esprits sont partis étudier sous la couronne, dans les îles Britanniques. En développant nos universités, nous pourrons retenir davantage de talents en Inde."
  Insurance_Act_init:0 "Lancement de la loi sur l’assurance"
  Insurance_Act_passed:0 "Loi sur l’assurance adoptée"
  Insurance_Act_failed:0 "Échec de la loi sur l’assurance"
  RAJ_Insurance_Act:0 "Loi sur l’assurance"
  RAJ_Insurance_Act_desc:0 "L’assurance a été négligée en Inde, faute de cadre légal et d’incitations. Seule la marine marchande y a trouvé place ; cette loi pourrait changer la donne."
  War_Powers_Act_init:0 "Lancement de la loi sur les pouvoirs en temps de guerre"
  War_Powers_Act_passed:0 "Loi sur les pouvoirs en temps de guerre adoptée"
  War_Powers_Act_failed:0 "Échec de la loi sur les pouvoirs en temps de guerre"
  RAJ_War_Powers_Act:0 "Loi sur les pouvoirs en temps de guerre"
  RAJ_War_Powers_Act_desc:0 "Les Indiens n’ont pas été consultés sur l’entrée en guerre, mais ils soutiendront sans doute l’objectif le plus noble : vaincre l’emprise infâme du fascisme qui se répand dans le monde."

  RAJ_His_Majesties_University:0 "L’université de Sa Majesté"
  RAJ_His_Majesties_University_desc:0 "L’université de Delhi existe de longue date, mais ne suffit pas aux besoins des intellectuels indiens, qui partent encore à Londres. En facilitant l’essor du corps enseignant, nous améliorerons notre enseignement supérieur."
  RAJ_Department_of_War_Studies:0 "Département d’études de la guerre"
  RAJ_Department_of_War_Studies_desc:0 "De nombreux domaines d’étude existent, mais aucun n’est plus crucial que ceux qui aident la nation à défendre ses frontières."
  RAJ_Open_for_Business:0 "Ouverte aux affaires"
  RAJ_Open_for_Business_desc:0 "Grâce à un cadre juridique renouvelé et à l’essor des compagnies d’assurance, les hommes d’affaires internationaux pourraient voir en l’Inde un marché prometteur — une aubaine pour notre économie chancelante."
  RAJ_Healthcare_Investments:0 "Investissements de santé"
  RAJ_Healthcare_Investments_desc:0 "Il est indéniable que notre système de santé est en mauvais état. La plupart des Indiens n’ont pas les moyens de consulter, ce qui nuit à la société et à l’économie. Un gouvernement du peuple ne peut laisser perdurer cette situation : nous devons agir !"
  RAJ_Civil_Aviation_Expansion:0 "Unifier les chemins de fer"
  RAJ_Civil_Aviation_Expansion_desc:0 "Notre réseau ferroviaire est parfois morcelé et inefficace. Comblons ses lacunes pour améliorer nos flux de marchandises et de ravitaillement."
  RAJ_Wheat_Exports:0 "Exportations de blé"
  RAJ_Wheat_Exports_desc:0 "Maintenant que l’approvisionnement alimentaire est en partie stabilisé, exporter un peu de céréales ne ferait sans doute pas de mal.\nN’est-ce pas ?"
  RAJ_Primary_Education:0 "Éducation primaire"
  RAJ_Primary_Education_desc:0 "La majorité des ruraux est non scolarisée, non par choix, mais faute d’écoles primaires et secondaires. En investissant intelligemment les nouveaux fonds, nous améliorerons les compétences de l’ensemble de la main-d’œuvre."
  RAJ_Drought_Prevention_Measures:0 "Mesures de prévention des sécheresses"
  RAJ_Drought_Prevention_Measures_desc:0 "En saison des pluies, l’Inde compte parmi les terres les plus arables au monde. Le problème est l’irrégularité de la mousson, source d’insécurité alimentaire. En étendant l’irrigation, nous réduirons notre dépendance aux pluies annuelles."
  RAJ_Bolster_our_Security_Forces:0 "Renforcer nos forces de sécurité"
  RAJ_Bolster_our_Security_Forces_desc:0 "Pour que les affaires prospèrent, il faut protéger les entrepreneurs contre escrocs et voleurs. Notre incapacité à assurer cette protection a longtemps freiné les investissements étrangers — jusqu’à présent."
  RAJ_Gather_Industrial_Funds:0 "Lever des fonds industriels"
  RAJ_Gather_Industrial_Funds_desc:0 "Notre principal rival électoral, le Congrès, bénéficie du soutien des classes populaires. Nous pourrions compenser en promettant beaucoup aux propriétaires terriens et aux capitalistes d’Inde. Leurs coffres sont bien garnis et l’avenir politique du pays mérite l’investissement."
  RAJ_Arms_Industry_Expansion:0 "Extension de l’industrie d’armement"
  RAJ_Arms_Industry_Expansion_desc:0 "L’armée indienne est devenue la plus grande armée de volontaires de l’histoire, mais beaucoup de ces hommes manquent d’équipement. Après avoir compté sur les livraisons britanniques, il est temps d’implanter une industrie de défense au cœur de l’Asie du Sud."
  RAJ_Implement_Conscription:0 "Mettre en place la conscription"
  RAJ_Implement_Conscription_desc:0 "Notre armée de volontaires est grande — extraordinairement grande, diraient certains — surtout dans un contexte colonial. Mais Londres a besoin de plus d’hommes pour gagner la guerre ; s’il est bien une ressource que nous avons, c’est celle-là. La mesure sera impopulaire, mais le prix en vaut la peine."
  RAJ_The_August_Offer:0 "L’offre d’août"
  RAJ_The_August_Offer_desc:0 "Nos relations avec les populations du sous-continent ont été, au mieux, difficiles. Nous ne pouvons les exclure indéfiniment du gouvernement — surtout en temps de guerre, alors que les Indiens souffrent par millions. Éviter que le Raj ne s’abîme dans une révolte violente exige quelques concessions."
  RAJ_Expand_the_Burma_Road:0 "Étendre la route de Birmanie"
  RAJ_Expand_the_Burma_Road_desc:0 "La Chine est un allié naturel dans la lutte contre le Japon. Accroissons notre aide via la route de Birmanie pour libérer l’Asie du joug du bellicisme."
  RAJ_Border_Fortifications:0 "Fortifications frontalières"
  RAJ_Border_Fortifications_desc:0 "En Asie, plusieurs empires ont l’appétit de l’expansion. Sécuriser notre front oriental doit être la priorité : ériger des fortifications dans les montagnes et le long des rivières de Birmanie orientale y contribuera."

  raj_diverse_investments_tt:0 "Permet des investissements privés en §Yusines militaires§! et §Ylaminoirs d’aluminium§!."
  raj_invest_relations_10_tt:0 "Augmente les §Yrelations avec les investisseurs§! de §G10§!."
  raj_invest_relations_15_tt:0 "Augmente les §Yrelations avec les investisseurs§! de §G15§!."

  RAJ_Establish_the_Planning_Commission:0 "Créer la Commission de planification"
  RAJ_Establish_the_Planning_Commission_desc:0 "L’économie coloniale a été conçue pour exploiter la population au profit d’autrui. Il est temps d’engager des réformes qui placent au premier plan les besoins et le bien-être de tous les Indiens, afin de rebâtir une économie durable et équitable. Notre première étape sera de mettre en place une Commission nationale de planification, chargée d’orienter correctement notre développement tout en garantissant des salaires et des conditions de travail justes."
  RAJ_Common_Economic_Policy:0 "Politique économique commune"
  RAJ_Common_Economic_Policy_desc:0 "Comme l’a défini la Conférence impériale, les politiques économiques des différentes parties de l’Empire doivent être alignées pour favoriser la croissance inter-impériale."
  RAJ_Foster_Private_Investment:0 "Encourager l’investissement privé"
  RAJ_Foster_Private_Investment_desc:0 "Pour stimuler la croissance et le développement de l’Inde, il importe d’encourager l’investissement privé, national comme étranger. Des mesures telles que des incitations fiscales, la simplification des règles et un climat propice aux affaires y contribueront. En favorisant l’investissement privé, nous dynamiserons l’économie et l’innovation dans de nombreux secteurs."
  RAJ_Reform_the_Colonial_Economy:0 "Réformer l’économie coloniale"
  RAJ_Reform_the_Colonial_Economy_desc:0 "Par le passé, la planification économique de [RAJ.GetNameDef] a négligé les besoins de la population au profit de l’extraction des ressources et des profits. Si nous voulons conserver notre autorité en ces temps difficiles, cela doit changer."
  RAJ_Initiate_Land_Reform:0 "Lancer une réforme agraire"
  RAJ_Initiate_Land_Reform_desc:0 "La propriété et la répartition des terres en Inde sont profondément biaisées en faveur des riches et des influents. En lançant une réforme agraire, nous viserons une distribution plus équitable et la protection des droits des petits paysans et des communautés marginalisées. Cela bénéficiera à ces groupes et stimulera la croissance et le développement de l’ensemble du pays."
  RAJ_Centralise_the_Courts:0 "Centraliser les tribunaux"
  RAJ_Centralise_the_Courts_desc:0 "Hérité des royaumes précoloniaux et compliqué par l’ingérence britannique, le système judiciaire indien est un maillage inutilement complexe de juridictions, ce qui complique les affaires bien plus que nécessaire."
  RAJ_Open_our_Markets:0 "Ouvrir nos marchés"
  RAJ_Open_our_Markets_desc:0 "L’investissement étranger, hors provenance britannique, a été limité en raison de la fermeture du sous-continent. Cette nouvelle administration doit donc annoncer au monde que l’Inde accueille le commerce et les investissements à bras ouverts."
  RAJ_Rural_Education:0 "Éducation rurale"
  RAJ_Rural_Education_desc:0 "L’extension des écoles de village aidera les populations rurales à trouver de meilleures opportunités d’emploi et à contribuer au développement de leurs communautés. Une population mieux éduquée accélérera la croissance et améliorera l’administration locale, tout en réduisant pauvreté et inégalités pour bâtir une Inde meilleure."
  RAJ_Cross_Country_Railways:0 "Chemins de fer transnationaux"
  RAJ_Cross_Country_Railways_desc:0 "Relier les vastes régions de l’Inde par un réseau ferroviaire transversal améliorera grandement le transport et les communications entre villes et bourgs. Les flux de marchandises et de personnes deviendront plus efficaces, ce qui soutiendra la croissance. La construction et l’entretien créeront des emplois et dynamiseront l’économie. Investir dans ces lignes est essentiel pour moderniser et unifier la nation."
  RAJ_Electrify_the_Network:0 "Électrifier le réseau"
  RAJ_Electrify_the_Network_desc:0 "Épine dorsale de notre système de transport, le rail est crucial pour le développement. Son électrification augmentera l’efficacité et la vitesse des trains, réduira notre dépendance aux combustibles fossiles importés et, ce faisant, renforcera nettement notre économie."
  RAJ_Cooperation_with_the_Princes:0 "Coopération avec les princes"
  RAJ_Cooperation_with_the_Princes_desc:0 "Pour gouverner efficacement, nous devons entretenir des relations solides avec les princes locaux et leurs territoires. En travaillant ensemble, nous assurerons stabilité et prospérité dans toutes les régions, par le partage des ressources, l’alignement des politiques et des projets communs au service du peuple."
  RAJ_Expand_Tata_Steel:0 "Étendre Tata Steel"
  RAJ_Expand_Tata_Steel_desc:0 "Tata Steel est un pilier de l’industrialisation indienne depuis trente ans. Pour suivre le rythme de l’économie mondiale, il est essentiel de poursuivre son expansion et sa modernisation, afin d’affermir notre rang de grand producteur d’acier, de créer des emplois et de stimuler la croissance dans tout le pays."
  RAJ_Rewrite_Business_Law:0 "Diversifier les investissements privés"
  RAJ_Rewrite_Business_Law_desc:0 "À l’aube de l’indépendance, il est impératif de diversifier nos investissements privés pour garantir stabilité et croissance. En les répartissant sur divers secteurs et industries, nous nous protégerons des risques propres à chacun. Cette stratégie nous permettra d’avancer sereinement vers un avenir solide et prospère."
  RAJ_Sideline_the_Unions:0 "Écarter les syndicats"
  RAJ_Sideline_the_Unions_desc:0 "Les syndicats ont souvent été une source de perturbations. En réduisant leur influence et en trouvant d’autres moyens de répondre aux préoccupations des travailleurs, nous pourrons nous concentrer sur la modernisation et le renforcement de la nation, tout en apaisant les relations entre direction et salariés pour un monde du travail plus efficace."
  RAJ_Commercial_Port_Expansion:0 "Extension des ports commerciaux"
  RAJ_Commercial_Port_Expansion_desc:0 "À mesure que l’économie de [RAJ.GetNameDef] se développe et s’industrialise, nous devons agrandir et améliorer nos ports commerciaux. En augmentant leur capacité et leur efficacité, nous faciliterons le commerce extérieur et soutiendrons les besoins croissants de nos industries, tout en créant de nouveaux emplois."
  RAJ_Irrigation_Infrastructure:0 "Infrastructures d’irrigation"
  RAJ_Irrigation_Infrastructure_desc:0 "Pour accompagner la croissance de l’Inde, investissons dans des infrastructures modernes d’irrigation. La construction de canaux et de réservoirs garantira de l’eau aux cultures même en période de sécheresse, au bénéfice des agriculteurs, de leurs revenus et de l’économie nationale."
  RAJ_Foundations_for_the_First_Five_Year_Plan:0 "Fondations du premier plan quinquennal"
  RAJ_Foundations_for_the_First_Five_Year_Plan_desc:0 "La Commission de planification nouvellement créée a élaboré des plans de croissance susceptibles de doper l’économie indienne à long terme. Leur échec d’exécution pourrait entraîner un ralentissement."
  RAJ_Seek_Trading_Partners:0 "Accorder des concessions foncières"
  RAJ_Seek_Trading_Partners_desc:0 "Nous distribuerons permis d’aménager, acquisitions et concessions de terres à une échelle inédite sur le sous-continent. Cela stimulera fortement le développement de l’économie indienne."
  RAJ_Invite_Mining_Companies:0 "Inviter des compagnies minières"
  RAJ_Invite_Mining_Companies_desc:0 "Les ressources naturelles de l’Inde sont vastes et sous-exploitées. En invitant des compagnies minières à prospecter et investir, nous créerons des emplois et attirerons des capitaux indispensables. Leur technologie et leur expertise nous aideront à extraire et valoriser ces ressources."
  RAJ_Development_funds_for_the_States:0 "Fonds de développement pour les États"
  RAJ_Development_funds_for_the_States_desc:0 "Aider les principautés, souvent petites et peu développées, à construire infrastructures et industries renforcera sensiblement la base industrielle de l’Inde."
  RAJ_Bastions_of_Stablity:0 "Bastions de stabilité"
  RAJ_Bastions_of_Stablity_desc:0 "En période de bouleversements politiques, nous pouvons compter sur l’ordre et la continuité assurés par les États princiers, partenaires fiables pour maintenir la paix et la prospérité en leur sein et au-delà."
  RAJ_Industrial_Expertise:0 "Savoir-faire industriel"
  RAJ_Industrial_Expertise_desc:0 "Grâce à l’éducation, à l’aide étrangère et au développement intérieur, la main-d’œuvre industrielle de l’Inde a atteint un niveau d’expertise inédit dans la région."
  RAJ_Mechanized_Agriculture:0 "Agriculture mécanisée"
  RAJ_Mechanized_Agriculture_desc:0 "Nous introduirons charrues mécaniques et matériels agricoles modernes dans les plus grandes exploitations afin d’accroître fortement la production."
  RAJ_Minimum_Wage_Legislation:0 "Législation sur le salaire minimum"
  RAJ_Minimum_Wage_Legislation_desc:0 "Alors que l’Inde entre dans une nouvelle ère et que le progrès industriel gagne le pays, il est crucial de protéger les droits et les salaires de la classe ouvrière. L’instauration d’un salaire minimum garantira une rémunération équitable et contribuera à réduire la pauvreté et les inégalités."
  RAJ_Protectionist_Tariffs:0 "Tarifs protectionnistes"
  RAJ_Protectionist_Tariffs_desc:0 "Relever les droits de douane bénéficierait clairement aux entreprises indiennes : elles pourraient concurrencer plus équitablement les acteurs internationaux et seraient mieux protégées des chocs extérieurs. Cette politique soutiendra l’emploi et la croissance."
  RAJ_Integrate_Princely_Economies:0 "Intégrer les économies princières"
  RAJ_Integrate_Princely_Economies_desc:0 "Le Raj a longtemps laissé chaque État princier gérer sa propre économie, créant un patchwork de systèmes. Il est temps d’unifier ces économies en un ensemble cohérent, pour un commerce plus efficace, une croissance accrue et un sentiment d’unité nationale renforcé."
  RAJ_Solidify_Control_over_the_Banks:0 "Affermir le contrôle des banques"
  RAJ_Solidify_Control_over_the_Banks_desc:0 "Les banques indiennes furent longtemps contrôlées par des intérêts étrangers, éloignés des besoins du peuple. Il est temps d’en reprendre la main pour soutenir le développement national et veiller à ce qu’elles servent l’intérêt général, et non une minorité."
  RAJ_Broad_Union_Support:0 "Nationalisations à grande échelle"
  RAJ_Broad_Union_Support_desc:0 "En tant que nation nouvellement indépendante, nous devons reprendre la maîtrise de nos ressources et industries. La nationalisation des secteurs clés — énergie, transport, fabrication — nous permettra de façonner notre avenir et de réinvestir les profits dans le pays."
  RAJ_Ease_Agricultural_Regulations:0 "Assouplir la réglementation agricole"
  RAJ_Ease_Agricultural_Regulations_desc:0 "Des règles excessives pèsent depuis trop longtemps sur les agriculteurs. En les allégeant, nous favoriserons leur liberté d’action et la vitalité du secteur agricole en Inde."
  RAJ_Rural_Development:0 "Développement rural"
  RAJ_Rural_Development_desc:0 "Pour transformer l’Inde rurale, concentrons-nous sur les infrastructures, l’accès à l’éducation et à la santé, et la promotion du développement économique. Ces investissements sortiront des communautés de la pauvreté et renforceront notre économie."
  RAJ_Excavation_Investments:0 "Investissements d’extraction"
  RAJ_Excavation_Investments_desc:0 "En finançant des projets d’extraction à travers l’Inde, nous créerons de nouvelles opportunités de croissance. Ces investissements mettront au jour des ressources précieuses et des emplois dans les secteurs minier et d’excavation."
  RAJ_Large_Scale_Privitizations:0 "Privatisations à grande échelle"
  RAJ_Large_Scale_Privitizations_desc:0 "Pour stimuler la croissance et l’efficacité, nous privatiserons des industries publiques. L’investissement et la gestion privés apporteront idées neuves et innovation, au bénéfice de l’emploi et de la compétitivité internationale."
  RAJ_Electrification_of_India:0 "Électrification de l’Inde"
  RAJ_Electrification_of_India_desc:0 "Pour moderniser et améliorer la vie des citoyens, nous mettons en œuvre un plan d’alimentation massive de nos centres industriels : construction de centrales, extension des lignes de transport et garantie d’un accès stable au secteur productif."
  RAJ_Manufacturing_Plants:0 "Usines de fabrication"
  RAJ_Manufacturing_Plants_desc:0 "Pour soutenir la croissance et l’emploi, nous devons créer et étendre des usines dans tout le pays. Elles produiront des biens de consommation et des équipements industriels, diversifiant notre économie et offrant des opportunités à tous."
  RAJ_Arms_Foundries:0 "Forges d’armement"
  RAJ_Arms_Foundries_desc:0 "Pour répondre à la demande croissante en armement d’une armée en expansion, nous établirons des forges dans tout le pays. Elles équiperont nos soldats et soutiendront nos industries de l’acier, du charbon et du soufre."
  RAJ_Import_Industrial_Machinery:0 "Importer des machines industrielles"
  RAJ_Import_Industrial_Machinery_desc:0 "Pour tenir nos objectifs ambitieux, l’Inde doit importer les machines les plus modernes des grandes puissances industrielles. Ces équipements accroîtront la productivité et la compétitivité de nos secteurs, au service de la croissance et de la prospérité."
  RAJ_Solidify_Business_Ties:0 "Consolider les liens avec les investisseurs"
  RAJ_Solidify_Business_Ties_desc:0 "L’enthousiasme des investisseurs s’émousse face aux réalités d’une économie en rattrapage. Une série d’entretiens pour écouter leurs préoccupations et y répondre devrait raviver leur confiance."
  RAJ_International_Division_of_Labour:0 "Division internationale du travail"
  RAJ_International_Division_of_Labour_desc:0 "La division internationale du travail répartit la production selon les avantages et ressources propres à chaque pays, pour plus d’efficacité et de coûts maîtrisés. En l’adoptant, l’Inde pourra valoriser ses atouts et accélérer sa croissance."
  RAJ_Soviet_Economic_Assistance:0 "Aide économique soviétique"
  RAJ_Soviet_Economic_Assistance_desc:0 "Pour relancer l’économie et apporter la prospérité, nous solliciterons l’Union soviétique pour une aide économique et des projets de développement. Cela nous apportera des ressources, renforcera nos liens politiques et économiques et soutiendra notre modernisation."
  RAJ_Further_British_Investments:0 "Nouveaux investissements britanniques"
  RAJ_Further_British_Investments_desc:0 "À mesure que [RAJ.GetNameDef] se modernise, il est important de préserver des relations solides avec la métropole. Des investissements venus des îles Britanniques renforceront nos liens économiques et apporteront technologies et savoir-faire, au profit du sous-continent comme des îles."
  RAJ_Machinery_for_Textiles:0 "Machinerie pour le textile"
  RAJ_Machinery_for_Textiles_desc:0 "L’industrie textile indienne est immense ; avec l’introduction de métiers mécaniques et d’autres machines, sa productivité a explosé et il faut des débouchés pour écouler la production. Nous les trouverons dans les économies socialistes, où nous importerons aussi la machinerie nécessaire à notre essor industriel."
  RAJ_Raw_Material_Imports:0 "Importations de matières premières"
  RAJ_Raw_Material_Imports_desc:0 "L’Inde est riche en ressources, mais certaines sont difficiles à extraire et notre palette reste incomplète. Nous compterons sur nos frères d’outre-frontières pour importer les intrants manquants à nos chaînes de production."
  RAJ_Exchange_of_Luxury_Goods:0 "Échange de biens de luxe"
  RAJ_Exchange_of_Luxury_Goods_desc:0 "Tandis que l’Inde dispose d’importants surplus de sucre et de café, les économies d’Europe orientale sont excédentaires en bétail et en lin. Encourager le commerce de biens non essentiels améliorera le niveau de vie des deux côtés."
  RAJ_Resources_for_the_Home_Isles:0 "Ressources pour les îles Britanniques"
  RAJ_Resources_for_the_Home_Isles_desc:0 "Les menaces sur la sécurité britannique s’accroissent ; il revient à l’Empire de fournir les ressources nécessaires à la fabrication outre-Manche."
  RAJ_Agricultural_Subsidies:0 "Subventions agricoles"
  RAJ_Agricultural_Subsidies_desc:0 "L’agriculture, pilier de notre économie, fait vivre des millions d’Indiens mais reste vulnérable aux aléas climatiques et de marché. Des subventions apporteront le soutien nécessaire et garantiront la croissance continue de ce secteur vital."
  RAJ_Continued_Expansion_of_the_Ordnance_Foundries:0 "Poursuivre l’extension des fonderies d’armement"
  RAJ_Continued_Expansion_of_the_Ordnance_Foundries_desc:0 "Les fonderies d’armement indiennes sont essentielles à la production d’armes et de munitions. En poursuivant leur expansion et leur modernisation, nous offrirons à nos soldats le meilleur équipement."
  RAJ_Contributions_to_the_War_Effort:0 "Contributions à l’effort de guerre"
  RAJ_Contributions_to_the_War_Effort_desc:0 "Lors de la Grande Guerre, le soutien des principautés a pesé lourd dans la victoire contre l’Empire allemand. À l’aube d’un nouveau conflit majeur, nous pouvons compter à nouveau sur leur aide."
  RAJ_Connect_the_Remote_Provinces:0 "Développer les provinces isolées"
  RAJ_Connect_the_Remote_Provinces_desc:0 "Les zones rurales et isolées ont été négligées au profit des centres urbains. Leur développement — où l’agriculture ne dégage qu’un faible surplus — renforcera l’approvisionnement national."
  RAJ_Expand_the_Diplomatic_Corps:0 "Étendre le corps diplomatique"
  RAJ_Expand_the_Diplomatic_Corps_desc:0 "L’Inde porte une politique étrangère ambitieuse. L’extension de son réseau diplomatique lui permettra de mieux engager ses partenaires, de prendre davantage d’initiatives sur la scène mondiale et de faciliter la recherche d’un pacte de sécurité garantissant sa protection."

