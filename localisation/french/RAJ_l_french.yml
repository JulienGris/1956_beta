  raj_investor_relations:0 "Relations avec les investisseurs"
  raj_investor_relations_desc:0 "Les investisseurs étrangers, attirés par la nouvelle économie de marché indienne, ont rapidement trouvé les profits recherchés. Mais les ambitions — et les attentes — grandissent, et si nous échouons à les satisfaire, le flux d’investissements pourrait se tarir.\n\n  Leur attitude actuelle est [RAJ.GetInvestorRelations].\n  De ce fait, l’intervalle d’investissement est de :\n   [?RAJ.investors_timeout|Y0] jours (+[?RAJ.num_of_investments_days] selon le nombre d’investissements)\n  et le bonus de vitesse de construction par bâtiment est de [?RAJ.investor_bonus|G%2].\n"
