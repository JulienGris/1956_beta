  raj_intro_uprising:0 "En prolongeant le §YRaj britannique§!, nous §Rattisons la militance§! parmi la §Ypopulation indienne§! et risquons de provoquer un §Ysoulèvement nationaliste§!. §RCeci est nécessaire pour jouer la voie fasciste§!."
