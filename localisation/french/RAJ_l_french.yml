  RAJ_Reinvigorated_Imperial_Shipping:0 "Transport maritime impérial revigoré"
  RAJ_Expanding_the_Indian_Air_Force:0 "Expansion de l’IAF"
  RAJ_Expanding_the_Indian_Air_Force_desc:0 "La Force aérienne indienne intensifie actuellement la formation des pilotes et la production d’appareils pour nettoyer le ciel au-dessus du sous-continent."
  RAJ_Caste_Debuff_4:0 "Système des castes ségrégationniste"
  RAJ_Caste_Debuff_4_desc:0 "Moment gamer"
  RAJ_Caste_Debuff_3:0 "Système des castes"
  RAJ_Caste_Debuff_3_desc:0 "Certaines formes du système des castes existent depuis l’Inde antique, mais il a été transformé au fil du temps pour mieux convenir à l’empereur du moment — et le Raj britannique ne fait pas exception. Bien au contraire, le système des castes a été clairement défini et largement utilisé par l’administration britannique. Il pénètre tous les aspects de la société indienne, des admissions à l’université jusqu’à une armée fortement hiérarchisée et restrictive. Certains y voient un mal immoral, d’autres l’organisation logique de la société."
  RAJ_Caste_Debuff_3_mit:0 "Système des castes atténué"
  RAJ_Caste_Debuff_3_mit_desc:0 "Les pires excès du système des castes ont été jugulés, mais les inégalités entre communautés et classes sociales restent omniprésentes."
  RAJ_Caste_Debuff_2:0 "Système des castes réformé"
  RAJ_Caste_Debuff_2_desc:0 "Démanteler le système des castes dans une société aussi traditionaliste est ardu, mais un progrès constant vers l’égalisation conduira inévitablement à une meilleure issue."
  RAJ_Caste_Debuff_1:0 "Système des castes démantelé légalement"
  RAJ_Caste_Debuff_1_desc:0 "Malgré toutes les résistances et les protestations, nous avons finalement atteint l’égalité juridique complète et l’appliquerons avec toute la détermination nécessaire."
  RAJ_Caste_Buff:0 "Système des castes entièrement démantelé"
  RAJ_Caste_Buff_desc:0 "L’égalité juridique, c’est bien ; mais après des centaines d’années de discriminations, beaucoup de quartiers restent pauvres et peineront à s’en sortir. C’est pourquoi des mesures de discrimination positive en faveur de ces communautés sont la seule option morale."
  RAJ_Establishing_National_Government:0 "Construction d’un gouvernement national"
  RAJ_Establishing_National_Government_desc:0 "Nous rédigeons actuellement une constitution et, pour la première fois de l’histoire, bâtissons un gouvernement autochtone, démocratique et à l’échelle du sous-continent, prêt à affronter toutes les adversités."
  RAJ_Expanded_Police_Force:0 "Forces de police renforcées"
  raj_not_in_famine:0 "Actuellement ni §Yen§! §Rfamine§! ni §Yen rétablissement après§! une §Rfamine§!"
