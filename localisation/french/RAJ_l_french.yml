  r56_RAJ_invade_afghanistan_desc:0 "L’Afghanistan fut jadis sous influence indienne… il le sera de nouveau."
  r56_RAJ_the_mountain_frontier:0 "La frontière des montagnes"
  r56_RAJ_the_mountain_frontier_desc:0 "Le Népal et le Bhoutan font partie de la péninsule et doivent être intégrés à notre union parfaite."
