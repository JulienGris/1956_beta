  r56_RAJ_crush_hyderabad_desc:0 "L’élite musulmane de [HYD.GetNameDef] opprime les pieux hindous. Elle est un obstacle sur la route de la pleine liberté des hindous et de l’unification de toute l’Inde."
  r56_RAJ_join_the_axis:0 "Rejoindre l’Axe"
  r56_RAJ_join_the_axis_desc:0 "L’ennemi commun de l’impérialisme anglo-français unit l’Inde et la nouvelle Allemagne. Formons officiellement cette alliance."
  r56_RAJ_reactivate_our_japanese_contacts:0 "Réactiver nos contacts japonais"
  r56_RAJ_reactivate_our_japanese_contacts_desc:0 "L’Empire du Japon et sa Sphère de coprospérité sont les seules puissances capables de renverser les empires européens et tout ce qui va avec. Ranimons nos anciens contacts pour négocier les conditions de notre nouvelle alliance."
  r56_RAJ_new_scientific_order:0 "Nouvel ordre scientifique"
  r56_RAJ_new_scientific_order_desc:0 "Les communautés académiques de l’Inde et de nos alliés doivent rester en contact permanent pour assurer une innovation continue."
  r56_RAJ_ideological_air_force:0 "Force aérienne idéologique"
  r56_RAJ_ideological_air_force_desc:0 "Nous devons ancrer nos valeurs au sein de l’aviation afin de cultiver la coopération avec nos alliés et nos autres branches militaires."
  r56_RAJ_towards_a_post_colonial_economy:0 "Vers une économie postcoloniale"
  r56_RAJ_towards_a_post_colonial_economy_desc:0 "Des réformes économiques et la libération du potentiel indien feront émerger les entreprises indiennes."
  r56_RAJ_modernization_program:0 "Programme de modernisation"
  r56_RAJ_modernization_program_desc:0 "Les monopoles coloniaux levés, une nouvelle économie peut naître. D’ici 2020, nous serons une superpuissance !"
  r56_RAJ_indian_education:0 "Éducation indienne"
  r56_RAJ_indian_education_desc:0 "Les colonisateurs nous ont appris l’obéissance et la servilité… Rejetons ces instruments de domination et utilisons le savoir pour libérer l’Inde !"

  r56_RAJ_establish_a_general_staff:0 "L’état-major général [ROOT.GetAdjective]"
  r56_RAJ_establish_a_general_staff_desc:0 "Notre armée manque de tactique et d’organisation. La création d’un véritable état-major consolidera un établissement militaire affaibli."
  r56_RAJ_army_reform:0 "Réforme de l’armée"
  r56_RAJ_army_reform_desc:0 "La réorganisation de l’armée est un long processus. Notre nouveau personnel général recommande des manœuvres pour entraîner les soldats et former les officiers."
  r56_RAJ_doctrine_effort:0 "Effort doctrinal"
  r56_RAJ_equipment_effort:0 "Effort d’équipement"
  r56_RAJ_equipment_effort_desc:0 "Les limites du matériel pouvant être porté par l’infanterie ne cessent de reculer. Donnons à nos troupes les meilleurs outils disponibles."
  r56_RAJ_equipment_effort_2:0 "Moderniser nos armes légères"
  r56_RAJ_equipment_effort_2_desc:0 "Poursuivons nos efforts pour que l’infanterie et les troupes d’appui disposent du meilleur équipement de leur temps."
  r56_RAJ_mechanization_effort:0 "Effort de mécanisation"
  r56_RAJ_mechanization_effort_desc:0 "En repensant les possibilités de l’infanterie motorisée, nous pouvons repousser les limites des véhicules réalisables aujourd’hui."
  r56_RAJ_doctrine_effort_2:0 "Jeux de guerre"
  r56_RAJ_doctrine_effort_2_desc:0 "Le champ de bataille a changé pendant l’entre-deux-guerres et au fil des conflits récents. Réévaluons sans cesse nos doctrines."
  r56_RAJ_establish_a_military_academy:0 "Fonder une académie militaire"
  r56_RAJ_establish_a_military_academy_desc:0 "Les études doctrinales et l’échange des savoirs militaires seront facilités au sein de la nouvelle académie."
  r56_RAJ_equipment_effort_3:0 "Recherche sur les pièces de campagne"
  r56_RAJ_equipment_effort_3_desc:0 "Plutôt qu’imiter ou acheter du matériel étranger, devenons un leader mondial de l’armement d’infanterie."
  r56_RAJ_doctrine_effort_desc:0 "Les doctrines qui régissaient le combat terrestre durant la Grande Guerre sont obsolètes. Confions à nos meilleurs esprits la tâche de façonner la pensée militaire de demain."
  r56_RAJ_army_modernization:0 "Modernisation de l’armée"
  r56_RAJ_army_modernization_desc:0 "Pour supporter les manœuvres et exercices les plus exigeants, nos soldats ont besoin d’un équipement, d’instruments et d’un habillement adéquats."
  r56_RAJ_motorization_effort:0 "Effort de motorisation"
  r56_RAJ_motorization_effort_desc:0 "Mobilité et protection sont cruciales pour acheminer l’infanterie sur le champ de bataille et la ramener en sécurité. En nous concentrant sur ces développements, nous agirons plus vite."
  r56_RAJ_establish_a_armor_corp:0 "Créer un corps blindé"
  r56_RAJ_establish_a_armor_corp_desc:0 "L’achat récent de matériel étranger a inspiré nos ingénieurs à concevoir un nouveau type de véhicule blindé plus rapide, plus robuste et plus puissant que tout ce que nous imaginions."
  r56_RAJ_field_hospitals:0 "Améliorer nos hôpitaux de campagne"
  r56_RAJ_field_hospitals_desc:0 "Perdre au combat des soldats talentueux et expérimentés est un luxe que nous ne pouvons nous permettre."
  r56_RAJ_special_forces:0 "Forces spéciales"
  r56_RAJ_special_forces_desc:0 "Nous avons besoin d’unités d’élite ; troupes de montagne et parachutistes seront notre priorité."
  r56_RAJ_signal_companies:0 "Compagnies de transmissions"
  r56_RAJ_signal_companies_desc:0 "La coordination des frappes et des opérations sera bien plus efficace si nous dédions du personnel supplémentaire équipé de moyens de communication."
  r56_RAJ_modern_logistics:0 "Logistique moderne"
  r56_RAJ_modern_logistics_desc:0 "La loyauté militaire repose sur la capacité à combattre pour notre cause. Si nous ne pouvons fournir l’équipement nécessaire, nous risquons mutineries et désertions massives."

  r56_RAJ_expand_mazagon_dock:0 "Étendre le chantier Mazagon"
  r56_RAJ_expand_mazagon_dock_desc:0 "Le chantier Mazagon de Bombay est notre constructeur naval le plus important de la côte ouest. Il doit accroître sa capacité en cette période de crise mondiale."
  r56_RAJ_found_scindia_shipyard:0 "Fonder le chantier Scindia"
  r56_RAJ_found_scindia_shipyard_desc:0 "Il nous faut un chantier sur la côte est ; établir le chantier Scindia à Visakhapatnam est logique pour l’avenir de notre marine."
  r56_RAJ_royal_indian_navy:0 "Royal Indian Navy"
  r56_RAJ_royal_indian_navy_desc:0 "La Royal Indian Navy doit être rapidement agrandie. Nouvelles tactiques et nouveaux navires seront notre priorité."
  r56_RAJ_screening_effort:0 "Effort d’escorte"
  r56_RAJ_screening_effort_desc:0 "L’Inde joue un rôle crucial dans la défense de la route méridionale vers le canal de Suez. Les missions d’escorte garantiront l’acheminement des vivres et des soldats vers l’Europe et l’Afrique."
  r56_RAJ_cruiser_effort:0 "Effort croiseurs"
  r56_RAJ_cruiser_effort_desc:0 "Les croiseurs suffiront, pour l’instant, à développer la puissance navale indienne."
  r56_RAJ_submarine_effort:0 "Effort sous-marins"
  r56_RAJ_submarine_effort_desc:0 "Face à l’essor de la flotte de surface japonaise en Asie, concentrer nos efforts sous la mer, en frappant depuis des sous-marins, peut s’avérer judicieux."
  r56_RAJ_capital_ship_effort:0 "Effort grands navires"
  r56_RAJ_capital_ship_effort_desc:0 "Avant-poste britannique, l’Inde a vu la domination qu’apportent les grands bâtiments. Construisons nos propres croiseurs lourds et cuirassés."
  r56_RAJ_modernizing_navy:0 "Moderniser la marine"
  r56_RAJ_modernizing_navy_desc:0 "Meilleurs moteurs, plus d’espace pour l’équipage, vitesse accrue et artillerie plus lourde : la marine indienne rivalisera bientôt avec les meilleures du continent."
  RAJ_naval_equipment:0 "Réviser l’équipement naval"
  RAJ_naval_equipment_desc:0 "De nombreux éléments à bord de nos navires pourraient et devraient être modernisés."
  r56_RAJ_military_technologies:0 "Technologies militaires"
  r56_RAJ_military_technologies_desc:0 "Tirons parti de nos efforts de modernisation et investissons dans de nouvelles technologies."

  r56_RAJ_aviation_effort:0 "Force aérienne de l’Inde libre"
  r56_RAJ_aviation_effort_desc:0 "Nous ne devons pas seulement libérer notre terre, mais aussi nos cieux !"
  r56_RAJ_fighter_focus:0 "Développer les chasseurs"
  r56_RAJ_fighter_focus_desc:0 "L’agilité et la vitesse sont essentielles pour la supériorité aérienne."
  r56_RAJ_bomber_focus:0 "Développer les bombardiers"
  r56_RAJ_bomber_focus_desc:0 "La capacité offensive et l’autonomie sont les meilleurs moyens d’éliminer nos ennemis."
  r56_RAJ_torpedo_bombers:0 "Aéronefs d’attaque navale"
  r56_RAJ_torpedo_bombers_desc:0 "La capacité des avions à frapper une flotte avec des torpilles sera vitale pour neutraliser la Royal Navy."
  r56_RAJ_aviation_effort_2:0 "Tactiques aériennes avancées"
  r56_RAJ_aviation_effort_2_desc:0 "De nouvelles tactiques de combat aérien doivent être élaborées pour maximiser l’efficacité de chaque appareil et limiter la perte de nos pilotes."
  r56_RAJ_rocket_effort:0 "Moteurs à réaction"
  r56_RAJ_rocket_effort_desc:0 "Les moteurs à réaction sont l’avenir de l’aviation !"

  r56_RAJ_revolt_against_the_oppressors_showcase:0 "Se révolter contre les oppresseurs"
  r56_RAJ_revolt_against_the_oppressors_showcase_desc:0 "On nous a trop longtemps dénié notre héritage et notre place sous le soleil brûlant. L’heure est venue. Aux armes, frères et sœurs ! Aux armes, ouvriers et paysans ! Chaque homme, dans chaque village, bourg ou ville, doit lutter contre les colonisateurs !"
  RAJ_ignore_and_then_support_hazad_hind_to_trigger_the_civil_war:0 "Pour déverrouiller cette voie, ignorez la menace d’Azad Hind et utilisez les décisions pour renforcer sa présence."
  r56_indian_revolt_focus:0 "Arbre de priorités de la révolte d’Azad Hind"
  r56_india_generic:0 "Arbre de priorités indien générique"

  india.500.t:0 "L’intégration de l’Inde"
  india.500.desc:0 "Les Britanniques ne gouvernaient pas seuls le sous-continent indien, bien au contraire. Une large part des terres appartient encore aux dynasties d’antan. Leur richesse personnelle compte davantage pour elles que le bien de leur peuple ; il sera donc difficile de les intégrer sans compromis ni effusion de sang. Nous devons assurer l’intégration complète de ces domaines pour le bien de notre population."
  india.500.a:0 "En avant."

  india.501.t:0 "Les princes les plus faibles acceptent"
  india.501.desc:0 "Beaucoup de princes ne régnant que sur un petit domaine ont immédiatement accepté de céder toutes leurs terres à l’Inde. Il était évident pour la plupart des conseillers que des monarques ne gouvernant que quelques kilomètres carrés n’oseraient pas se dresser contre les Forces armées indiennes, mais on n’est jamais trop prudent."
  india.501.a:0 "Bien sûr qu’ils acceptent."

  india.4270.t:0 "Asaf Jah refuse l’intégration à l’Inde"
  india.4270.desc:0 "Asaf Jah VII a catégoriquement refusé d’intégrer le nouveau gouvernement indien. La dynastie nizâm est musulmane, alors que la population est majoritairement hindoue ; elle a utilisé la religion comme principal argument contre l’intégration."
  india.4270.a:0 "Un vestige d’un monde qui disparaît."

  india.4271.t:0 "Hyderabad s’intègre à l’Inde"
  india.4271.desc:0 "Ce matin, Asaf Jah VII a accepté de signer l’instrument d’accession, rejoignant ainsi l’Inde."
  india.4271.a:0 "Une victoire pour l’Inde."

  india.4410.t:0 "Le Jammu-et-Cachemire refuse de s’intégrer à l’Inde"
  india.4410.desc:0 "Il a été rapporté qu’Hari Singh a publiquement déclaré qu’il n’accepterait pas l’intégration à l’Inde dans les circonstances actuelles."
  india.4410.a:0 "Il le paiera en temps voulu."

  india.4411.t:0 "Le Jammu-et-Cachemire s’intègre volontairement à l’Inde"
  india.4411.desc:0 "Hier soir dans son palais, Hari Singh a enfin signé un instrument d’accession et accepté de céder le Jammu-et-Cachemire au nouveau gouvernement indien."
  india.4411.a:0 "Notre frontière nord est sécurisée."

  india.4250.t:0 "Mysore refuse de rejoindre l’Union indienne"
  india.4250.desc:0 "Le 25ᵉ maharaja de Mysore a mis plus de temps que beaucoup d’autres à décider du destin de son royaume, mais il a finalement pris la décision regrettable de refuser l’intégration à l’Inde."
  india.4250.a:0 "C’est trop vital pour y renoncer."

  india.4251.t:0 "Le royaume de Mysore rejoint l’Inde"
  india.4251.desc:0 "Le 25ᵉ maharaja de Mysore a mis plus de temps que beaucoup d’autres à décider du destin de son royaume, mais il a fini par comprendre que son avenir se trouve avec l’Inde."
  india.4251.a:0 "Une partie vitale de l’Inde !"

  india.10130.t:0 "Le royaume du Sikkim se dirige vers l’indépendance"
  india.10130.desc:0 "Le 11ᵉ chogyal du Sikkim a finalement répondu à nos exigences et se montre résilient."
  india.10130.a:0 "Qu’ils s’en aillent, alors."

  india.10131.t:0 "Le royaume du Sikkim rejoint l’Inde"
  india.10131.desc:0 "Le 11ᵉ chogyal du Sikkim a accepté l’intégration à l’Inde et son royaume se prépare à devenir un État de l’Union."
  india.10131.a:0 "Une partie vitale de l’Inde !"

  india.4273.t:0 "[SKM.GetNameDefCap] refuse de rejoindre l’Inde"

  india.4440.t:0 "Le Baloutchistan fait preuve de résilience"
  india.4440.desc:0 "Le khan de Kalat a aujourd’hui pris la décision hâtive et mal avisée de garder pour lui ses domaines périphériques, coupés du peuple indien."
  india.4440.a:0 "Nous devons sécuriser l’ouest."

  india.4441.t:0 "Le Baloutchistan rejoint l’Inde"
  india.4441.desc:0 "Le khan de Kalat a aujourd’hui pris la décision raisonnée d’intégrer ses terres à l’Union indienne."
  india.4441.a:0 "La frontière occidentale est sécurisée."

  india.4370.t:0 "L’État de Gwalior rejette l’unification"
  india.4370.desc:0 "Jivajirao Sindhia, de l’État de Gwalior, a bloqué toute idée d’intégration à l’Inde. Cela a fortement déstabilisé son royaume, la majorité de ses citoyens souhaitant s’unifier avec l’Inde."
  india.4370.a:0 "Nous les libérerons un jour."

  india.4371.t:0 "L’État de Gwalior accueille l’unification"
  india.4371.desc:0 "Jivajirao Sindhia, de l’État de Gwalior, a longuement réfléchi à l’avenir de son royaume et de lui-même et, grâce à nos concessions de bonne volonté, a décidé de s’intégrer à l’Inde."
  india.4371.a:0 "Un jour glorieux."

  india.4330.t:0 "L’État de Jaipur rejette l’intégration"
  india.4330.desc:0 "Le 17ᵉ maharaja de Jaipur, Man Singh II, a malheureusement décidé de conserver son contrôle total sur l’État de Jaipur, tandis que le peuple descend dans la rue pour protester contre cette décision égoïste."
  india.4330.a:0 "Quel dommage."

  india.4331.t:0 "L’État de Jaipur embrasse l’intégration"
  india.4331.desc:0 "Le 17ᵉ maharaja de Jaipur, intellectuel dans l’âme, a entendu les appels nationalistes à une Inde unifiée et reconnu qu’il était de son devoir moral d’y répondre."
  india.4331.a:0 "Un geste réellement avisé."

  india.4280.t:0 "L’État de Limbdi décline l’incorporation"
  india.4280.desc:0 "Daulatsinhji Jashwantsinhji, de l’État de Limbdi, est un membre traditionnel de la dynastie Jhala ; conservateur strict, il règne sur un territoire surtout rural. Sans surprise, il est resté fidèle à ses vues rétrogrades et a décidé contre l’unification."
  india.4280.a:0 "Triste réalité."

  india.4281.t:0 "L’État de Limbdi accepte l’annexion"
  india.4281.desc:0 "Bien que le prince de Limbdi soit un traditionaliste intransigeant, il a compris les conséquences géopolitiques d’un mauvais choix et a signé l’instrument d’accession, sauvant ainsi son peuple."
  india.4281.a:0 "Une décision sage."
