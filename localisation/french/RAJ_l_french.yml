  the_bombay_uprising:0 "L’insurrection de Bombay"
  the_bombay_uprising_desc:0 "La liberté nouvellement acquise par les populations du Bengale attire les regards, et la poudrière qu’est Bombay semble prête à exploser — il suffit d’une petite étincelle."
  RAJ_SPR_arms_smuggling:0 "Faire passer des armes à [FROM.GetNameDef]"

  RAJ_agrarian_economy:0 "Économie agraire"
  RAJ_agrarian_economy_desc:0 "Autrefois cœur manufacturier du monde, l’Inde a souffert des politiques britanniques : désindustrialisation rapide, extraction accrue des ressources et fiscalité prédatrice. Remédier à ces problèmes économiques est une tâche dont l’ampleur dépasse largement le court terme. Des pas progressifs vers la sécurité alimentaire devront être la priorité de tout gouvernement prétendant diriger l’Inde."

