  raj_military_research:0 "Recherche militaire"
  army_research_navy:0 "Priorité à la recherche navale"
  army_research_navy_desc:0 "L’Inde n’a jamais été réputée pour être une grande nation maritime, mais il est peut-être temps de revoir cela."
  army_research_airplane:0 "Priorité à la recherche aérienne"
  army_research_airplane_desc:0 "Sans un soutien aérien adéquat, nos cuirassés et nos batteries d’artillerie restent vulnérables."
  army_research_armour:0 "Priorité à la recherche blindée"
  army_research_armour_desc:0 "Pour traverser les grandes plaines et déserts de l’Inde, un appui blindé renforcerait grandement l’efficacité de nos troupes."
  army_research_artillery:0 "Priorité à la recherche en artillerie"
  army_research_artillery_desc:0 "La tactique de la charge d’infanterie est depuis longtemps obsolète et doit être remplacée par le bombardement stratégique des bastions ennemis."
  army_research_infantry:0 "Priorité à la recherche d’infanterie"
  army_research_infantry_desc:0 "Nos armes légères sont depuis longtemps à la traîne par rapport au reste du monde ; investir dans le développement des fusils nous rapprochera d’une armée hautement efficace."
  army_research_running:0 "Une priorité de recherche est déjà en cours"

