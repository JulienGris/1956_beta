  r56_raj.1.t:0 "La nomination de Lord Linlithgow"
  r56_raj.1.d:0 "Le 22e vice-roi et gouverneur général de l’Inde, Freeman Freeman-Thomas Willingdon, a été remplacé par le tout juste nommé Victor Hope, Lord Linlithgow, qui assumera sous peu la charge de 23e vice-roi. Ses contemporains le décrivent comme un politicien ambitieux, héritant sa fougue de son père, premier gouverneur général de l’Australie. Le monde a les yeux tournés vers l’Inde, se demandant comment son mandat influencera le sous-continent."
  r56_raj.1.a:0 "Reçu cinq sur cinq."

  r56_raj.2.t:0 "Les dernières heures du vice-roi"
  r56_raj.2.desc:0 "Les cinq dernières années ont épuisé le gouverneur général. Ce fut une période de troubles civils — un terrain familier pour Lord Willingdon, aguerri dans la gestion de tels mouvements depuis son mandat de gouverneur de Bombay. Les directives d’en haut prônaient la coopération, mais seulement avec ceux opérant dans le cadre légal du Raj. Suivant cette ligne, il s’est lancé dans une vague d’emprisonnements, ce qui plombe encore sa popularité. Il garde toutefois un bilan qu’il juge positif, quelle que soit l’opinion de la population indienne. Mais, comme pour tout vice-roi avant lui, son règne touche à sa fin."
  r56_raj.2.a:0 "Bonne chance à son successeur, il en aura besoin."

  r56_raj.3.t:0 "La nomination d’Archibald Wavell"
  r56_raj.3.d:0 "La tâche confiée à Lord Linlithgow n’était pas aisée : l’agitation populaire montait et ne pouvait être que temporairement apaisée par quelques concessions politiques, culminant avec les élections provinciales de 1937. Après cette forte participation indienne, nombre des meilleurs hommes politiques du pays furent invités au cabinet, surpassant pour la première fois les officiels britanniques. Mais, comme le mandat de Lord Willingdon, celui de Linlithgow doit s’achever."
  r56_raj.3.a:0 "Voici le nouveau patron…"

  r56_raj.4.t:0 "La nomination de Louis Mountbatten"
  r56_raj.4.d:0 "Les efforts de Wavell furent jugés louables par la plupart des responsables politiques indiens, mais entravés par Londres. Peu après son arrivée à la résidence du vice-roi à Delhi, il travailla à soulager quelque peu l’approvisionnement du Bengale. Il fut aussi le premier vice-roi et gouverneur général à discuter d’autonomie avec des dirigeants politiques indiens en vue — efforts sapés, à la grande déception de beaucoup, par Londres, déterminée à conserver l’Inde coûte que coûte."
  r56_raj.4.i:0 "Les efforts de Wavell furent jugés louables par la plupart des responsables politiques indiens, mais entravés par Londres. Peu après son arrivée dans l’ancienne résidence du vice-roi à Delhi, il œuvra à soulager l’approvisionnement du Bengale. Il s’est montré à la fois très coopératif avec le gouvernement indien et loyal représentant du monarque à Londres. Mais, vieille histoire de l’Empire, il sera remplacé par Louis Mountbatten."
  r56_raj.4.a:0 "…même combat que l’ancien."

  r56_raj.101.t:0 "Clôture des élections provinciales"
  r56_raj.101.desc:0 "C’était un jour redouté par le vice-roi : le Conseil législatif impérial est remanié et fraîchement élu ; des membres représentatifs et d’opposition dominent désormais notre législatif, rendant plus difficile l’imposition de notre volonté dans ces chambres."
  r56_raj.101.a:0 "Une nouvelle aube pour l’Inde."

  r56_raj.102.t:0 "Adoption de la loi d’expansion ferroviaire"
  r56_raj.102.d:0 "Après des mois de débats éreintants dans les couloirs du pouvoir à Delhi, le vice-roi annonce fièrement que d’importants fonds seront alloués à la construction de chemins de fer modernes, efficaces et majestueux, couvrant tout le sous-continent."
  r56_raj.102.a:0 "Je réserve un billet sur-le-champ !"

  r56_raj.103.t:0 "Échec de la loi d’expansion ferroviaire"
  r56_raj.103.d:0 "Le vice-roi s’est battu longtemps et durement pour faire adopter cette fichue loi, mais il n’a pas réussi à obtenir le soutien du Conseil législatif impérial. Il devrait prononcer un discours admettant à contrecœur l’échec du texte."
  r56_raj.103.a:0 "Je patienterai avant d’acheter mon billet."

  r56_raj.104.t:0 "Adoption de la loi de stabilisation agricole"
  r56_raj.104.d:0 "La loi a été saluée comme le dernier clou dans le cercueil des famines récurrentes en Inde, et le vice-roi n’a pas manqué d’en souligner les avantages. De ce fait, le soutien des législateurs hindous et musulmans fut massif, et le texte a été adopté aisément."
  r56_raj.104.a:0 "L’Inde pousse un soupir de soulagement."

  r56_raj.105.t:0 "Échec de la loi de stabilisation agricole"
  r56_raj.105.d:0 "Bien que cette loi fût perçue comme une mesure révolutionnaire contre la famine, elle a — à la grande consternation des Indiens — échoué à réunir des suffrages suffisants dans les chambres législatives pour devenir loi.\nLes plans déjà établis pour améliorer la prévention de la sécheresse sont désormais abandonnés."
  r56_raj.105.a:0 "Triste état de choses."

  r56_raj.106.t:0 "Adoption de la loi de réforme de l’éducation"
  r56_raj.106.d:0 "Les plus brillants et talentueux Indiens émigrent depuis longtemps vers les îles Britanniques pour y recevoir la meilleure éducation, laissant leur terre natale derrière eux. Le vice-roi souligne depuis longtemps l’importance d’édifier une société où les intellectuels peuvent s’épanouir ; la réforme de notre système scolaire et universitaire est la première étape logique vers cet objectif."
  r56_raj.106.a:0 "Un avenir radieux nous attend."

  r56_raj.107.t:0 "Échec de la loi de réforme de l’éducation"
  r56_raj.107.d:0 "On ignore ce qui a conduit à ce revers navrant de la loi de réforme de l’éducation, tant elle promettait. Une chose est sûre : les mains du vice-roi seront liées sur la question scolaire. L’Inde se demande ce qui aurait pu être."
  r56_raj.107.a:0 "J’irai à Londres, alors."

  r56_raj.108.t:0 "Adoption de la loi sur les assurances"
  r56_raj.108.d:0 "On compare souvent l’Inde à d’autres économies agraires et sous-développées, principalement en raison du soutien mitigé à l’urbanisation et à l’industrialisation. Cependant, des investissements étrangers sur nos marchés pourraient accélérer la croissance de notre économie. Pour cette raison, de nombreux membres de l’opposition se sont rangés derrière ce texte majeur."
  r56_raj.108.a:0 "Nous sommes ouverts aux affaires."

  r56_raj.109.t:0 "Échec de la loi sur les assurances"
  r56_raj.109.d:0 "Ce qui devait être un texte fondateur permettant d’attirer davantage d’investissements mondiaux dans notre sous-continent agraire a spectaculairement échoué à passer notre législatif. Le vice-roi a consacré beaucoup de temps et d’efforts à ce projet, mais n’a pas su convaincre nombre de membres de l’opposition de ses avantages. Les investisseurs étrangers, pourtant intéressés, prennent désormais du recul et cherchent des marchés plus stables."
  r56_raj.109.a:0 "Mon entreprise attendra."

  r56_raj.110.t:0 "Adoption de la loi sur les pouvoirs de guerre"
  r56_raj.110.d:0 "Alors que les Bf 110 allemands ravageaient la campagne britannique, il apparaissait clairement que les Îles avaient besoin de leur empire. Et l’empire a répondu, à en juger par l’adoption récente de la loi sur les pouvoirs de guerre par notre très honorable Conseil législatif. L’administration indienne est désormais autorisée à engager des moyens bien plus importants dans la Seconde Guerre mondiale."
  r56_raj.110.a:0 "En route pour la guerre !"

  r56_raj.111.t:0 "Échec de la loi sur les pouvoirs de guerre"
  r56_raj.111.d:0 "La loi était difficile à vendre pour beaucoup d’Indiens, hindous comme musulmans. Ils ont été entraînés dans cette guerre sans consultation, ni même la moindre considération — il était donc prévisible que le Conseil législatif impérial, désormais en grande partie élu, vote contre l’extension des pouvoirs de l’exécutif en temps de guerre."
  r56_raj.111.a:0 "Que pensera Londres ?"

  r56_raj.112.t:0 "Rencontre avec le législatif"
  r56_raj.112.d:0 "Bien que la plupart des membres du Conseil législatif impérial soient nommés, leur loyauté ne va pas qu’au vice-roi ; elle suit aussi leurs intérêts personnels et ceux qui financent leurs campagnes. Néanmoins, la réunion avec le Conseil fut loin d’être improductive : nous avons discuté de nombreux projets de l’administration et déjà assuré certains soutiens. Bien sûr, rien n’est gravé dans le marbre, mais nous aurons besoin de ces voix si l’administration Linlithgow veut être efficace."
  r56_raj.112.a:0 "Un jour, nous dompterons cette enceinte."

  r56_raj.113.t:0 "Rencontre avec le judiciaire"
  r56_raj.113.d:0 "Le système juridique en Inde a toujours été difficile à appréhender pour un observateur extérieur, avec ses nombreuses juridictions locales secondaires. Un premier point de contact simple reste toutefois le Conseil privé, à Londres, qui a le dernier mot en toute affaire, bien qu’il s’implique rarement dans les dossiers indiens. Notre objectif secondaire sera de rencontrer les hautes cours indigènes, qui détiennent un pouvoir important dans les provinces. Tout ce que nous pourrons faire pour assurer leur loyauté aura la plus haute priorité."
  r56_raj.113.a:0 "Un écheveau bien compliqué."

  r56_raj.114.t:0 "Notre première priorité"
  r56_raj.114.d:0 "Avec nos contacts au législatif et au judiciaire désormais assurés, il nous appartient de choisir par où commencer. Notre cabinet a avancé deux pistes : l’expansion du réseau ferroviaire ou la stabilisation de l’approvisionnement alimentaire. Quel que soit notre premier chantier, il comptera pour l’Inde."
  r56_raj.114.a:0 "Les transports ont désespérément besoin de réforme."
  r56_raj.114.b:0 "Notre situation agricole est critique."
  r56_raj.114.c:0 "Nous devons plutôt nous concentrer sur cette guerre !"

  r56_raj.115.t:0 "Le ministère de l’Industrie et du Travail"
  r56_raj.115.d:0 "Certains diront que le ministre de l’Industrie est l’un des membres les plus puissants de tout cabinet ; nous devons donc choisir avec soin la personne pour le poste."
  r56_raj.115.a:0 "Jouons la prudence."
  r56_raj.115.b:0 "Trouvons les meilleurs économistes du pays."

  r56_raj.116.t:0 "Le ministère de la Défense et de l’Approvisionnement de guerre"
  r56_raj.116.d:0 "Les tensions mondiales étant élevées, la guerre peut éclater à tout moment. Il nous faut un ministre de la Défense à la hauteur."
  r56_raj.116.a:0 "Avec un grand propriétaire, nous renforcerons la mobilisation."
  r56_raj.116.b:0 "Nous avons besoin d’un industriel pour bâtir une machine de guerre."

  r56_raj.117.t:0 "Le ministère de la Santé, de l’Éducation et des Terres"
  r56_raj.117.d:0 "Si les autres ministères font grimper les chiffres de l’industrialisation et de l’enrôlement, les ministères sociaux, eux, remplissent le cœur de l’Inde — et doivent être traités comme tels."
  r56_raj.117.a:0 "Le choix conservateur."
  r56_raj.117.b:0 "Le choix progressiste."

  RAJ_agricultural_shipments:0 "Livraisons agricoles"
  RAJ_agricultural_shipments_desc:0 "Nous avons fait notre devoir en fournissant à l’Inde des vivres en ces temps si troublés. Les vies sauvées se comptent sans doute en millions, et, à défaut d’autre chose, cela nous confère un grand prestige auprès des nations."

