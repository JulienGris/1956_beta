  ilp_concessions:0 "Concessions socialistes"
  ilp_concessions_desc:0 "La gauche indienne est divisée et poursuit des objectifs différents.\nNotre mise en avant du système des castes nous offre de nombreuses opportunités de coopération et de compromis avec divers autres groupes — parfois aux revendications contradictoires. En équilibrant nos intérêts communs, nous renforcerons grandement notre stratégie électorale."
  invade_pak_or_placate_muslims:0 "Si le §YPakistan§! est un État indépendant, nous obtiendrons un §Ybut de guerre§! contre lui. Sinon, nous apaiserons les §Ymusulmans§! dans leurs États cœurs."
