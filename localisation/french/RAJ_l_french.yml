  RAJ_Joint_Indo_Soviet_Railways:0 "Chemins de fer indo-soviétiques conjoints"
  RAJ_Joint_Indo_Soviet_Railways_desc:0 "Dans un esprit de collaboration et de coopération internationales, [RAJ.GetNameDef] et [SOV.GetNameDef] unissent leurs forces pour un projet ferroviaire commun. À long terme et d’envergure, il créera un réseau reliant nos deux pays et stimulera la croissance et le développement. Cet effort commun renforcera une relation ancienne et mutuellement bénéfique, et nous rapprochera de notre objectif partagé d’un avenir meilleur pour tous. Le seul obstacle à cette prospérité demeure la situation politique en [AFG.GetNameDef], mais la pression diplomatique devrait lever cette réserve."
