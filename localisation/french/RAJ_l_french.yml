  RAJ_a_new_indian_elite:0 "Nouvelle élite indienne"
  RAJ_british_departure:0 "Départ des Britanniques"
  RAJ_british_departure_desc:0 "Alors que l’autorité britannique s’effondre rapidement, il est temps de saisir l’instant et d’organiser notre système politique."
  RAJ_assemble_the_congress:0 "Réunir le Congrès"
  RAJ_assemble_the_congress_desc:0 "Notre liberté assurée, le Congrès indien doit se réunir et débattre des réformes."
  RAJ_concessions_to_the_untouchables:0 "Concessions aux intouchables"
  RAJ_concessions_to_the_untouchables_desc:0 "Plus basse caste, méprisés par la société entière, les intouchables représentent pourtant une force populaire à reconnaître. Le mouvement lancé par Bhimrao Ramji Ambedkar pourrait ébranler le tissu social s’il n’est pas pris en compte. Mieux vaut des concessions pragmatiques que de les voir se convertir à l’islam, au christianisme, ou adopter un communisme athée."
  RAJ_modernization_program:0 "Programme de modernisation"
  RAJ_modernization_program_desc:0 "Les monopoles coloniaux levés, une nouvelle économie peut naître. D’ici 2020, nous serons une superpuissance !"
  RAJ_a_new_indian_elite_focus:0 "Une nouvelle élite indienne"
  RAJ_a_new_indian_elite_focus_desc:0 "Les industriels indiens étaient déjà actifs sous la colonisation, mais sous contrainte. Avec le départ des Britanniques, l’heure est venue pour une élite indienne d’émerger."
  RAJ_towards_a_post_colonial_economy:0 "Vers une économie postcoloniale"
  RAJ_towards_a_post_colonial_economy_desc:0 "Des réformes et la libération du potentiel indien favoriseront l’essor de nos entreprises."
  RAJ_influence_of_the_radicals:0 "Influence des radicaux"
  RAJ_influence_of_the_radicals_desc:0 "Les radicaux de l’All India Forward Bloc gagnent en influence et contestent la doctrine non-violente du Congrès."
  RAJ_indian_socialism:0 "Socialisme indien"
  RAJ_indian_socialism_desc:0 "Bâtir une société indienne commune où religions et castes ne nous divisent plus nous conduira vers un avenir radieux."
  RAJ_religious_equality:0 "Égalité religieuse"
  RAJ_religious_equality_desc:0 "Si le marxisme prône l’abolition de la religion, nous savons qu’elle est impossible aujourd’hui ; nous pouvons toutefois en retirer le pouvoir de division."
  RAJ_popular_mobilization:0 "Mobilisation populaire"
  RAJ_popular_mobilization_desc:0 "Avec ses masses dépossédées de dalits, de paysans pauvres et de coolies exploités désormais conscientes que leur libération passe par l’œuvre au service de la révolution, il est temps de bâtir une armée prête à défendre la nouvelle Inde."
  RAJ_collectivism:0 "Collectivisme"
  RAJ_land_reform:0 "Réforme agraire"
  RAJ_land_reform_desc:0 "Redistribuer la terre !"
  RAJ_modernized_agriculture:0 "Agriculture modernisée"
  RAJ_modernized_agriculture_desc:0 "Avec des tracteurs dans les champs, nous aurons besoin de moins de paysans pour maintenir notre productivité agricole."
  RAJ_collectivism_desc:0 "Nous subissons encore les séquelles d’années de colonialisme, mais à présent que l’avenir est entre nos mains, mettre en commun ce que nous avons nous permettra de moderniser plus vite la société."
  RAJ_support_anti_imperialism_in_china:0 "Soutenir la Chine"
  RAJ_support_anti_imperialism_in_china_desc:0 "La Chine doit être défendue ! Nous avons la responsabilité d’entretenir une partie de la liaison avec la Chine afin d’assurer son avenir."
  RAJ_increased_chinese_cooperation:0 "Coopération chinoise accrue"
  RAJ_increased_chinese_cooperation_desc:0 "Pour protéger l’Asie, protégeons la Chine et joignons-nous à son effort de guerre !"
  RAJ_join_the_comintern:0 "Rejoindre le Komintern"
  RAJ_join_the_comintern_desc:0 "En tant que nation communiste, il est logique de contacter Moscou et de forger avec elle un lien indissoluble."
  RAJ_hindu_nationalism:0 "Nationalisme hindou"
  RAJ_hindu_nationalism_desc:0 "Nous devons tous aimer la mère Inde et reconnaître l’hindouisme comme ce qui nous unit."
  RAJ_substitution_technologies:0 "Technologies de substitution"
  RAJ_substitution_technologies_desc:0 "Privés de certaines ressources de l’Empire britannique, nous devons lancer des programmes de substitution et garantir notre indépendance autarcique."
  RAJ_redistribute_properties:0 "Redistribuer les propriétés"
  RAJ_redistribute_properties_desc:0 "En redistribuant les biens britanniques et en partageant la terre, nous pouvons offrir un avenir à une grande partie des déshérités."
  RAJ_militarized_hindutva:0 "Hindutva militarisée"
  RAJ_militarized_hindutva_desc:0 "Par Shiva ! Tous les hindous doivent servir la mère Inde et défendre ses dieux contre ses ennemis."
  RAJ_weapons_for_the_new_india:0 "Des armes pour la nouvelle Inde"
  RAJ_weapons_for_the_new_india_desc:0 "La révolution doit être défendue !"
  RAJ_dream_of_akhand_hindustan:0 "Rêve d’Akhand Hindustan"
  RAJ_dream_of_akhand_hindustan_desc:0 "Des étrangers ont morcelé la Grande Inde au fil des siècles ; désormais, des Indiens unis déferont leurs intrigues et accompliront l’unité indienne."
  RAJ_invade_afghanistan:0 "Envahir l’Afghanistan"
  RAJ_invade_afghanistan_desc:0 "L’Afghanistan fut jadis sous influence indienne… il le sera de nouveau."
  RAJ_the_mountain_frontier:0 "La frontière des montagnes"
  RAJ_the_mountain_frontier_desc:0 "Le Népal et le Bhoutan appartiennent à la péninsule et doivent être intégrés à notre union parfaite."
  RAJ_reclaim_treaty_ports:0 "Reprendre les ports sous traité"
  RAJ_reclaim_treaty_ports_desc:0 "Pondichéry et Goa doivent être repris et rejoindre la mère Inde."
  RAJ_bring_back_burma:0 "Ramener la Birmanie"
  RAJ_bring_back_burma_desc:0 "Territoire bouddhiste ayant fait partie du Raj, la Birmanie est aussi une composante légitime de la Grande Inde."
  RAJ_unify_dravidian_lands:0 "Unifier les terres dravidiennes"
  RAJ_unify_dravidian_lands_desc:0 "Au sud subsistent des territoires habités par des Dravidiens qui n’ont pas encore rejoint la mère Inde. Il est temps d’y remédier."
  RAJ_operation_polo:0 "Opération Polo"
  RAJ_operation_polo_desc:0 "Punissons Hyderabad pour sa déclaration d’indépendance et unifions l’Inde !"
  RAJ_tfv_land_reform:0 "Réforme agraire"
  RAJ_crush_hyderabad:0 "Écraser Hyderabad"
  RAJ_crush_hyderabad_desc:0 "L’élite musulmane de [HYD.GetNameDef] opprime les pieux hindous. Elle est un obstacle sur la route de la pleine liberté des hindous et de l’unification de toute l’Inde."
  RAJ_join_the_axis:0 "Rejoindre l’Axe"
  RAJ_join_the_axis_desc:0 "L’ennemi commun de l’impérialisme anglo-français unit l’Inde et la nouvelle Allemagne. Formons officiellement cette alliance."
  RAJ_reactivate_our_japanese_contacts:0 "Réactiver nos contacts japonais"
  RAJ_reactivate_our_japanese_contacts_desc:0 "L’Empire du Japon et sa Sphère de coprospérité sont les seules puissances capables de renverser les empires européens et tout ce qui va avec. Ranimons nos anciens contacts pour négocier les conditions de notre nouvelle alliance."
  RAJ_new_scientific_order:0 "Nouvel ordre scientifique"
  RAJ_new_scientific_order_desc:0 "Les communautés académiques de l’Inde et de nos alliés doivent rester en contact permanent pour assurer une innovation continue."
  RAJ_ideological_air_force:0 "Force aérienne idéologique"
  RAJ_ideological_air_force_desc:0 "Nous devons ancrer nos valeurs au sein de l’aviation afin de cultiver la coopération avec nos alliés et nos autres branches militaires."

  r56_RAJ_revolt_against_the_oppressors:0 "Se révolter contre les oppresseurs"
  r56_RAJ_revolt_against_the_oppressors_desc:0 "L’heure a sonné. Aux armes ! Aux armes ! Chaque homme, dans chaque village, doit lutter contre les colonisateurs !"
  r56_RAJ_hindu_nationalism:0 "Nationalisme hindou"
  r56_RAJ_hindu_nationalism_desc:0 "Nous devons tous aimer la mère Inde et reconnaître l’hindouisme comme ce qui nous unit."
