  RAJ_Demands_to_London_desc:0 "Après les sacrifices incroyables consentis par la population de [RAJ.GetNameDef] au nom du Roi, les esprits se tournent vers la question des compensations. Les vies perdues dans les deux guerres mondiales, durant lesquelles le peuple indien a fidèlement soutenu les îles britanniques, devraient assurément être récompensées par la fin du colonialisme qui domine le sous-continent depuis un siècle."
