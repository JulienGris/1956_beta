  RAJ_provincial_election_countdown_participation:0 "Fin des élections provinciales"
  RAJ_provincial_election_countdown:0 "Fin des élections provinciales"
  RAJ_provincial_election_countdown_desc:0 "Bientôt, les élections provinciales s’achèveront et les Indiens n’en seront guère mieux lotis. Les élections ne confèrent aucun réel pouvoir aux partis autochtones pour s’opposer au vice-roi. Ce constat accablant pourrait pousser la frange militante de notre population à la révolte. Avançons prudemment."
  english_departure:0 "Le §Ydrapeau indien§! est hissé sur le Fort Rouge et §Yl’Inde est libre§!."
  india.intro.t:0 "Ouverture de l’élection provinciale indienne"
  india.intro.desc:0 "Il y a tout juste un an, le Conseil législatif impérial a franchi une étape majeure en restructurant l’administration du Raj britannique. Entre autres mesures, il a prévu la première élection générale en Inde. Bien que le droit de vote reste restreint et que les propriétaires fonciers conservent un pouvoir extraordinaire, c’est un premier pas vers la démocratie. Le spectre politique qui se prépare à participer à cette première démonstration de droits démocratiques en Inde est d’une diversité sans précédent ; le citoyen indien ne manque pas d’options. Mais quel sera l’issue de ce spectacle politique unique ? Les Britanniques consolideront-ils leur domination ? Des radicaux mèneront-ils l’Inde vers l’indépendance ? Seul l’avenir le dira."
  india.intro.a:0 "La domination britannique n’est pas négociable."
  india.intro.b:0 "Cette sujétion a assez duré !"
  india.intro.c:0 "L’électoralisme est vain face à l’impérialisme."

  india.1.t:0 "Le Royaume-Uni prend le contrôle d’Aden"
  india.1.desc:0 "Le port d’Aden est l’un des plus importants pour le commerce entre l’Inde, l’Europe et l’Extrême-Orient. Le Government of India Act de 1935 prévoyait le transfert direct de ce port au gouvernement de Londres, alors qu’il relevait auparavant d’une province d’un commissaire en chef. Le gouvernement britannique a désormais officiellement pris le contrôle du port et l’a érigé en colonie distincte."
  india.1.a:0 "Comme prévu"

  india.4.t:0 "Conclusion des élections provinciales indiennes de 1937"
  india.4.desc:0 "Après une année de campagne, trois grands partis se sont distingués, luttant âprement pour asseoir leur influence sur l’avenir de l’Inde. Mais un seul a remporté un soutien suffisant dans assez de provinces pour obtenir une majorité. Il lui incombera de veiller sur l’avenir de l’Inde et de protéger ses citoyens, quoi qu’il advienne."
  india.4.a:0 "Le Congrès national indien a remporté l’élection !"
  india.4.b:0 "Le Parti unioniste a remporté l’élection !"
  india.4.c:0 "Le Parti travailliste indépendant a remporté l’élection !"

  r56_raj.5.t:0 "L’Inde libre est proclamée"
  r56_raj.5.d:0 "Subhas Chandra Bose a longtemps rallié des soutiens — particulièrement au Bengale — pour une rupture armée avec l’Empire britannique, et ces tensions ont désormais atteint leur paroxysme : l’Azad Hind se trouve en guerre contre le Raj britannique. La population indienne réagit diversement à ce soulèvement : certains critiquent la nature autoritaire de son gouvernement, d’autres louent l’avancée de la cause de l’indépendance.\n\nLe Raj britannique s’empresse d’organiser une défense digne de ce nom, mais on s’attend déjà à des actes de sabotage qui perturberont l’administration. [ENG.GetLeader] a d’ores et déjà déclaré son soutien unilatéral au Raj britannique pour écraser l’insurrection."
  r56_raj.5.a:0 "Enfin, une Inde libre."
  r56_raj.5.b:0 "Un rêve mesquin."
  r56_raj.5.c:0 "Une brèche dans l’Empire britannique."

  r56_raj.6.t:0 "Manifestations d’ampleur autour des procès de l’INA"
  r56_raj.6.d:0 "Après la défaite de facto de l’Armée nationale indienne combattant pour l’« Inde libre » illégitime, ses membres sont jugés pour sédition et crimes de guerre. Telle est la conséquence « naturelle » d’une rébellion infantile s’accrochant à de petites idées d’autodétermination, le « swaraj ». La réaction de la population indienne ne nous est toutefois pas favorable : toutes les grandes villes ont vu des manifestations, notamment organisées par le Congrès national indien — dont les membres ont défendu les accusés —, et elles se sont étendues à tout le pays, déstabilisant grandement le Raj britannique."
  r56_raj.6.a:0 "Réprimez ces émeutes."

  r56_raj.7.t:0 "Appels à l’autodétermination birmane"
  r56_raj.7.d:0 "Les combats dans les jungles brûlantes de Birmanie furent rudes, et de nombreux soldats originaires de la région ont courageusement donné leur vie. Leurs camarades survivants réclament avec plus d’insistance que la Birmanie forme un État séparé de l’Inde, mais aligné sur l’Inde libre. Répondrons-nous à leur appel ?"
  r56_raj.7.a:0 "La situation actuelle nous convient."
  r56_raj.7.b:0 "Un gouvernement fantoche s’impose."
  r56_raj.7.c:0 "Nous construirons une Birmanie véritablement libre."

  india.2.t:0 "Élections provinciales indiennes de 1937"
  india.2.desc:0 "Les partis politiques participant aux élections générales couvrent tout le spectre politique, et l’avenir de l’Inde est en jeu.\n\nQuel que soit celui qui aura l’opportunité de gouverner, il aura la lourde tâche de naviguer l’avenir troublé d’un sous-continent divisé."
  india.2.a:0 "Le Congrès national indien fera avancer notre nation."
  india.2.b:0 "Le Parti unioniste nous hissera au statut de dominion."
  india.2.c:0 "Nous avons besoin du Parti travailliste indépendant pour nous libérer de l’exploitation."
  raj_election_start:0 "Déverrouille les décisions §YAccroître l’influence locale§! grâce auxquelles des majorités doivent être conquises dans les §Yprovinces§!.\n\nLe §Yparti politique§! qui contrôle le plus de provinces pourra §Gformer un gouvernement§!."

  india.5.t:0 "Les élections provinciales indiennes sont conclues"
  india.5.d:0 "Cette semaine, [RAJ.GetLeader] a annoncé les résultats de la toute première élection générale indienne, tant attendue. Beaucoup de partis et de mouvements ont pris part à la lutte politique, mais un seul est sorti vainqueur.\n[RAJ.GetElectionNews]"
  india.5.a:0 "Une avancée importante vers l’indépendance."
  india.5.b:0 "Des efforts vains."
  india.5.c:0 "Bonne chance, camarades."
  india.5.e:0 "La démocratie à l’œuvre."
  india.5.f:0 "Intéressant."

  india.6.t:0 "L’Inde gagne son indépendance"
  india.6.d:0 "Alors que le dernier convoi britannique entre dans le port pour charger les derniers approvisionnements à bord du navire de la Royal Navy « Georgic », l’Inde pousse un soupir de soulagement. Ses jours comme Joyau de la couronne sont révolus, et les Indiens commencent à bâtir sur les ruines du Raj britannique.\n\nEt l’ampleur de la tâche saute aux yeux face aux nombreuses minorités religieuses, linguistiques et culturelles du sous-continent. Néanmoins, l’Inde guérira sans nul doute ces blessures et marchera avec confiance vers l’avenir."
  india.6.d.alt:0 "Alors que le dernier convoi britannique entre dans le port pour charger les derniers approvisionnements à bord d’un navire de la Royal Navy, il laisse derrière lui un sous-continent indien instable, divisé, voire en lambeaux.\n\nLes séparatistes musulmans ont assuré leur État, tandis que les transferts de population attisent la violence, provoquant peut-être la plus grande crise de réfugiés que le monde ait jamais connue. Quoi que l’avenir réserve, le sous-continent y fera face séparément."
  india.6.a:0 "Trois longs siècles…"
  india.6.b:0 "Peut-être que les jours de l’Empire sont comptés."
  india.6.c:0 "Quelle tragédie."
  india.6.e:0 "Intéressant."

  india.290.t:0 "La conférence de Bombay"
  india.290.desc:0 "Fort de ses récents succès électoraux, le Parti travailliste indépendant semble en bonne position pour apporter le socialisme en Inde. Le soutien des nombreuses autres organisations communistes est vital pour maintenir une Inde stable et fonctionnelle après l’instauration d’une économie socialiste. Pour rallier certains jusqu’au-boutistes, il faudra peut-être offrir des concessions.\n\nLes internationalistes du PCI exigent notre entrée dans le Komintern après l’indépendance, tandis que leur opposition — les communistes nationaux — réclame une rupture avec Moscou. L’All India Trade Union Congress exige une représentation syndicale dans les affaires gouvernementales futures. L’Association pour la libération des femmes demande l’égalité totale et complète entre les genres."
  india.290.a:0 "Nous devons naviguer prudemment dans cette toile."

  india.300.t:0 "Le CNI séduit les hindous ruraux"
  india.300.desc:0 "Notre campagne a observé les succès récents de Nehru pour rallier un groupe électoral crucial : les hindous ruraux du Nord. Une contre-campagne serait difficile, mais pourrait aider à freiner leur influence."
  india.300.a:0 "Notre campagne est déjà suffisamment sollicitée."
  india.300.b:0 "Une opportunité importante."

  india.301.t:0 "Le Parti unioniste obtient le soutien des industriels"
  india.301.desc:0 "Le petit mais influent groupe de la bourgeoisie indienne a majoritairement apporté son soutien au Parti unioniste, invoquant la promesse de stabilité comme principal motif. Avec un peu de persuasion, nous pouvons nous assurer qu’ils regardent ailleurs."
  india.301.a:0 "Nous ne braderons pas les travailleurs indiens."
  india.301.b:0 "Une opportunité à ne pas manquer."
  india.301.c:0 "Une solution pragmatique, rien de plus."

  india.302.t:0 "Soutien international au Parti travailliste indépendant"
  india.302.desc:0 "Ce que certains autoritaires — qui le soutiennent — décrivent comme « le seul parti œuvrant pour la liberté de tous les Indiens » reçoit des fonds et des orateurs extérieurs, dopant injustement sa campagne. Comment réagir ?"
  india.302.a:0 "Leur hypocrisie causera leur perte."
  india.302.b:0 "Entravez-les autant que possible."

  inc_victory_news:0 "C’est le Congrès national indien, sous la direction éclairée de Jawaharlal Nehru, qui a conquis le soutien populaire par un travail de campagne acharné à travers le sous-continent divisé, parvenant, d’une certaine manière, à le rassembler. Leur plus grand obstacle politique pour mener l’Inde vers l’avenir sera la Ligue musulmane de toute l’Inde, qui souhaite établir un pays séparé pour les musulmans."
  up_victory_news:0 "C’est le Parti unioniste qui l’emporte, grâce à son large soutien dans les provinces religieusement diverses en insistant sur l’unité et la fraternité dans ce sous-continent si disparate. Un autre pilier de soutien est venu des industriels, généralement favorables à des politiques sociales plus réactionnaires. [RAJ.GetAIMLUP]"
  ilp_victory_news:0 "C’est le Parti travailliste indépendant sur qui repose désormais la responsabilité de gouverner. Sa vision radicale de l’avenir a inquiété les bases industrielle et coloniale de la nation. Reste à voir s’il parviendra à appliquer ses politiques ; si oui, cela pourrait annoncer la fin de la domination britannique en Inde plus tôt que prévu. Tout aussi incertain demeure l’avenir du système des castes, largement honni par les couches les plus pauvres."

