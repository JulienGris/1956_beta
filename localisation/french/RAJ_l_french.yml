  post_election_struggle:0 "Lutte pour l’indépendance"
  post_election_struggle_desc:0 "Si nous voulons obtenir l’§Yindépendance§! sans effusion de sang, nous devons exercer une pression constante sur les §YBritanniques§!. Nous devons également accumuler plus d’influence que la §YLigue musulmane de toute l’Inde§!, qui cherche à détacher le Pakistan de nos frontières.\n\n\t[RAJ.GetFlag]§YInfluence actuelle de [Root.GetReigningGovernmentColor]§! : [?Root.ind_influence]\n\t[PAK.GetFlag]§YInfluence actuelle de la Ligue musulmane de toute l’Inde§! : [?Root.pak_influence]\n\nNous gagnons actuellement §Y[?Root.ind_influence_daily] d’influence§! par jour, tandis que l’AIML gagne §Y[?Root.pak_influence_daily] d’influence§! par jour.\n\nPour obtenir l’§Yindépendance§!, nous devons atteindre 100 d’influence. Mais si la §YAIML§! possède plus de 50 % de notre §Yinfluence§!, les Britanniques libéreront le Pakistan comme État séparé. Si la §YAIML§! dépasse 66 % de notre influence, elle obtiendra également le Cachemire."
  grant_10_flat:0 "Gagne §G+10§! d’influence indienne."
  daily_ind_influence_tt:0 "Influence indienne quotidienne §G+0,05§!"
  daily_ind_influence_03_tt:0 "Influence indienne quotidienne §G+0,03§!"
  raj_5_destroyers_tt:0 "§Y5 destroyers§! seront ajoutés à la §Ymarine indienne§!"
  raj3progressindependence:0 "L’Inde progressera vers l’indépendance §G+0,3 %/jour§! plus vite."
  raj_3progressindependence:0 "L’Inde progressera vers l’indépendance §G+0,3 %/jour§! plus lentement."
  india.281.a:0 "Quelle décision à courte vue."
  raj_governor_general:0 "Gouverneur général"
  feverous_marxist:0 "Marxiste fervent"
  trade_unionist:0 "Syndicaliste"
  defence_industrialist:0 "Industriel de la défense"
  pacifistic_activist:0 "Militant indépendantiste pacifiste"
  RAJ_subhas_chanda_bose_desc:0 "Le Congrès national indien a failli à la cause de l’indépendance. Il est temps de porter le combat directement aux Britanniques."
  RAJ_Krishna_Pillai:0 "P. Krishna Pillai"
  RAJ_Shripad_Amrit_Dange:0 "Shripad Armit Dange"
  RAJ_pramod_ranjan_sengupta:0 "Pramod Ranjan Sengupta"

  india.279.t:0 "La condition des femmes"
  india.279.desc:0 "Nous avons déjà traité de nombreuses politiques et injustices héritées de l’ancienne administration, mais nous avons totalement éludé la question de l’égalité des genres. Les avis divergent sur ce sujet sensible ; il est dans notre intérêt d’y répondre rapidement."
  india.279.a:0 "Ne prolongeons pas notre arrière-gardisme."
  india.279.b:0 "Ne brûlons pas les étapes."
  india.279.c:0 "Certaines traditions doivent être préservées."

  india.280.t:0 "Le vice-roi s’inquiète"
  india.280.desc:0 "Bien que la fonction de vice-roi soit censée rester à l’écart des élections provinciales, des rumeurs d’une tentative de saboter notre campagne circulent. Certes, elles n’ont pas dû être très efficaces, sans quoi nous ne serions pas ici. Il semble toutefois que le vice-roi envisage d’user de sa position pour annuler des politiques qu’il juge inappropriées et saboter notre mouvement. Avançons prudemment si nous voulons éviter les foudres du gouverneur général."
  india.280.a:0 "Au diable ses états d’âme."

  india.281.t:0 "Ingérence dans nos politiques"
  india.281.desc:0 "Les doigts coloniaux et avides de pouvoir du vice-roi ont profité de notre nationalisation des chemins de fer privés et des infrastructures pour revenir en arrière, laissant une fois de plus le réseau de distribution de l’Inde en plan — pour quoi ? Un maigre avantage politique. Si cette décision a été largement critiquée par la population, elle s’est aussi retournée contre lui : les rares autochtones croyant encore à la bonne volonté britannique les voient enfin pour ce qu’ils sont : des impérialistes prétentieux et exploiteurs."

  india.282.desc:0 "Les doigts coloniaux et avides de pouvoir du vice-roi ont profité de notre prise de contrôle des usines et entreprises, au bénéfice des employés, pour annuler la réforme et laisser l’économie indienne à la dérive — pour quoi ? Un maigre avantage politique. Très critiquée par la population, la décision s’est retournée contre lui : les quelques personnes croyant encore à la bonne volonté britannique les voient enfin pour ce qu’ils sont : des impérialistes prétentieux et exploiteurs."

  india.283.desc:0 "Les doigts coloniaux et avides de pouvoir du vice-roi ont profité de notre prise de contrôle des consortiums bancaires pour revenir en arrière, laissant le réseau de distribution de l’Inde en plan — pour quoi ? Un maigre avantage politique. Largement critiquée, la décision s’est retournée contre lui : les rares autochtones croyant encore à la bonne volonté britannique les voient désormais pour ce qu’ils sont : des impérialistes prétentieux et exploiteurs."

  india.291.t:0 "Le Sri Lanka propose une paix blanche"
  india.291.d:0 "Des délégations sri-lankaises ont rencontré les nôtres à Madurai pour franchir une étape importante vers la paix et la prospérité de nos deux nations."
  india.292.t:0 "Le Népal propose une paix blanche"
  india.292.d:0 "Des délégations népalaises ont rencontré les nôtres à Delhi pour franchir une étape importante vers la paix et la prospérité de nos deux nations."
  india.293.t:0 "Le Bhoutan propose une paix blanche"
  india.293.d:0 "Des délégations bhoutanaises ont rencontré les nôtres à Calcutta pour franchir une étape importante vers la paix et la prospérité de nos deux nations."
  india.294.t:0 "Les groupes pour les droits des femmes imposent leurs revendications"
  india.294.d:0 "Pendant la campagne électorale, nous avons promis l’égalité totale à plusieurs groupes de défense des droits des femmes. Nous avons récolté de nombreuses voix — peut-être même gagné — grâce à elles. Maintenant que nous avons trahi cette promesse, elles nous forcent de nouveau la main."
  india.294.a:0 "Ce n’était pas une brillante idée."
  india.2940.t:0 "Les groupes pour les droits des femmes exigent des réponses"
  india.2940.d:0 "Durant l’élection, nous avons sollicité l’aide d’organisations de femmes à travers le pays, promettant d’être les seuls à aller assez loin pour les droits des femmes. Notre promesse reste lettre morte, ce qui suscite des questions dans nos rangs."
  india.2940.a:0 "Nous nous en occuperons… un jour."
  women_rights_demands_tt:0 "Mieux vaudrait décréter l’égalité totale avant d’y être contraints."
  india.291.a:0 "La paix, enfin."
  india.291.b:0 "Pas de reddition, pour l’Empire."

  RAJ_Immediate_Famine_Response:0 "Réponse immédiate à la famine"
  RAJ_Further_Recovery_Efforts:0 "Poursuite des efforts de relèvement après la famine"
  grant_concessions_to_the_british:0 "Accorder des concessions aux Britanniques"
  grant_concessions_to_the_british_desc:0 "En concédant aux Britanniques un peu de nos ressources, ils seront plus enclins à nous laisser partir."
  grant_concessions_to_the_british_2:0 "Accorder davantage de concessions aux Britanniques"
  grant_concessions_to_the_british_2_desc:0 "En concédant aux Britanniques une part plus importante de nos ressources, ils seront plus enclins à nous laisser partir."
  organize_large_scale_strikes:0 "Organiser des grèves d’ampleur"
  organize_large_scale_strikes_desc:0 "L’exploitation des travailleurs n’est pas l’apanage des Britanniques, mais se libérer d’eux est la première étape. Organisons des grèves massives pour leur forcer la main."
  instigate_communal_violence:0 "Attiser les violences communautaires"
  instigate_communal_violence_desc:0 "Les autres méthodes de pression ont échoué. Il ne nous reste qu’à souffler sur les braises des villes multiethniques sous tension, en espérant que la réaction britannique jouera en notre faveur."
  promote_ethnic_harmony:0 "Promouvoir l’harmonie ethnique"
  promote_ethnic_harmony_desc:0 "Tandis que Jinnah et sa Ligue musulmane prônent la séparation, nous devons adopter la position inverse : œuvrer pour une harmonie ethnique, culturelle et religieuse continue."
  utilize_more_extrem_factions:0 "Utiliser les factions extrémistes"
  utilize_more_extrem_factions_desc:0 "Notre campagne principale se déroule bien, mais un soutien discret aux extrémistes pourrait nous donner l’avantage lors des négociations."
  concede_to_capitalists:0 "Céder aux capitalistes"
  concede_to_capitalists_desc:0 "En soutenant les riches industriels du pays, nous obtiendrons leur appui face aux délégations britanniques."
  hinder_pak_influence:0 "Entraver l’influence de l’AIML"
  hinder_pak_influence_desc:0 "Sabotons les efforts des délégations pakistanaises pour sécuriser le sous-continent."
  appeal_for_international_support:0 "Appel au soutien international"
  appeal_for_international_support_desc:0 "Nos diplomates font de leur mieux pour mettre la pression sur les Britanniques, mais ce serait plus efficace avec l’appui d’un gouvernement étranger."
  india.10.t:0 "[?RAJBACKER.GetName] réclame une Inde libre"
  india.10.e:0 "Le gouvernement [?RAJBACKER.GetAdjective] a annoncé son soutien diplomatique formel aux §Ydélégations indiennes§! qui œuvrent pour l’indépendance. Leur donner la parole pourrait faciliter leur opposition à notre domination coloniale."
  india.10.a:0 "Au moins, laissons-les s’exprimer."
  india.10.b:0 "Nous ne laisserons pas [?RAJBACKER.GetNameDef] dicter notre politique."
  indinfluence15:0 "Les §Ydélégations indiennes§! auront plus de facilités à faire pression pour l’§Yindépendance de l’Inde§!."
  increase_both_influence:0 "Coopération avec l’AIML"
  increase_both_influence_desc:0 "En unissant nos efforts, nous mettrons plus efficacement la pression sur les Britanniques pour libérer plus tôt le sous-continent du colonialisme — au risque de voir notre grande nation déchirée en deux."
  declare_independence_100_influence:0 "§Y[Root.GetReigningGovernmentColor]§! doit exercer §Y100 d’influence§! sur les Britanniques."
  ind_pak_15:0 "[PAK.GetFlag]§YPakistanais§! — Influence §Yquotidienne§! §G+0,15§!\n[RAJ.GetFlag]§YIndiens§! — Influence §Yquotidienne§! §G+0,15§!"
  pak5:0 "[PAK.GetFlag]§YPakistanais§! — Influence §Yquotidienne§! §R-0,05§!"
  pak10flat:0 "[PAK.GetFlag]§YPakistanais§! — §YInfluence§! §R-10§!"
  pak2:0 "[PAK.GetFlag]§YPakistanais§! — Influence §Yquotidienne§! §G+0,02§!"
  ind10:0 "[RAJ.GetFlag]§YIndiens§! — Influence §Yquotidienne§! §G+0,1§!"
  ind05:0 "[RAJ.GetFlag]§YIndiens§! — Influence §Yquotidienne§! §R-0,05§!"
  ind05flat:0 "[RAJ.GetFlag]§YIndiens§! — §YInfluence§! §G+5§!"
  ind02flat:0 "[RAJ.GetFlag]§YIndiens§! — §YInfluence§! §G+2§!"
  pak01flat:0 "[PAK.GetFlag]§YPakistanais§! — §YInfluence§! §R-1§!"
  ind07:0 "[RAJ.GetFlag]§YIndiens§! — Influence §Yquotidienne§! §G+0,07§!"

  indian_provincial_election:0 "Élections provinciales indiennes"
  indian_provincial_election_desc:0 "Les élections provinciales indiennes approchent ; les grands mouvements politiques se disputent l’influence dans les provinces. Le résultat de ce scrutin, encadré par le Government of India Act, déterminera l’avenir du sous-continent.\n\nLe §YCongrès national indien§! domine actuellement §Y[?inc_control]§! % des provinces.\nLe §YParti unioniste§! domine actuellement §Y[?upa_control]§! % des provinces.\nLe §YParti travailliste indépendant§! domine actuellement §Y[?ifb_control]§! % des provinces.\n§Y[?neutral_control]§! % des provinces sont contrôlées par des §gpartis minoritaires§! ou en statu quo.\n\nPlus le parti vainqueur contrôle de provinces, plus l’indépendance pacifique sera aisée."
  indian_provincial_election_map:0 "Nous pouvons accroître l’influence de notre parti dans ces États"
  indian_provincial_enemy_election:0 "Campagne du parti d’opposition"
  indian_provincial_enemy_election_desc:0 "Impossible de compter les partis et organisations en lice aux élections provinciales. Si nos campagnes ont été efficaces, l’opposition ne dort pas : rassemblements et débats se tiennent sans relâche partout en Inde."
  indian_provincial_election_enemy_map:0 "Un parti d’opposition accroît son influence dans cet État"
  congress_majority:0 "Majorité du Congrès national indien"
  congress_majority_desc:0 "§O[From.GetName]§! §West actuellement sous l’influence du §CCongrès national indien§!.\nLe §CCongrès national indien§! a une influence de §G[?From.inc_state]§!.\nLe §CParti unioniste§! a une influence de §G[?From.upa_state]§!.\nLe §CParti travailliste indépendant§! a une influence de §G[?From.ifb_state]§!.\nLes §gpartis minoritaires§! ont une influence de §G[?From.neutral]§!.\n"
  united_party_majority:0 "Majorité du Parti unioniste"
  united_party_majority_desc:0 "§O[From.GetName]§! §West actuellement sous l’influence du §CParti unioniste§!.\nLe §CCongrès national indien§! a une influence de §G[?From.inc_state]§!.\nLe §CParti unioniste§! a une influence de §G[?From.upa_state]§!.\nLe §CParti travailliste indépendant§! a une influence de §G[?From.ifb_state]§!.\nLes §gpartis minoritaires§! ont une influence de §G[?From.neutral]§!.\n"
  all_india_forward_bloc_majority:0 "Majorité du Parti travailliste indépendant"
  all_india_forward_bloc_majority_desc:0 "§O[From.GetName]§! §West actuellement sous l’influence du §CParti travailliste indépendant§!.\nLe §CCongrès national indien§! a une influence de §G[?From.inc_state]§!.\nLe §CParti unioniste§! a une influence de §G[?From.upa_state]§!.\nLe §CParti travailliste indépendant§! a une influence de §G[?From.ifb_state]§!.\nLes §gpartis minoritaires§! ont une influence de §G[?From.neutral]§!.\n"
  neutral_stalemate:0 "Contrôle minoritaire / statu quo"
  neutral_stalemate_desc:0 "§O[From.GetName]§! §West actuellement en statu quo ou contrôlé par des §gpartis minoritaires§!.\nLe §CCongrès national indien§! a une influence de §G[?From.inc_state]§!.\nLe §CParti unioniste§! a une influence de §G[?From.upa_state]§!.\nLe §CParti travailliste indépendant§! a une influence de §G[?From.ifb_state]§!.\nLes §gpartis minoritaires§! ont une influence de §G[?From.neutral]§!.\n"

  invite_george_orwell_to_speak:0 "Inviter George Orwell à prendre la parole"
  invite_george_orwell_to_speak_desc:0 "George Orwell, romancier connu notamment pour *Une histoire birmane*, a longtemps été une voix du Parti travailliste indépendant britannique. Laisser un orateur aussi aguerri monter à la tribune ne peut que servir nos idées."
  princely_state_mod:0 "État princier"
  princely_state_mod_desc:0 "Un État princier est un vassal féodal du Raj britannique, jouissant d’une certaine autonomie et d’un ordre monarchique. Il fait toujours partie du Raj et ne participe pas aux élections ; il peut résister à une éventuelle unification de l’Inde."

  princely_state_independence_mod:0 "État princier indépendant"
  princely_state_independence_mod_desc:0 "Les États princiers étaient des vassaux du Raj britannique. À présent que l’administration britannique et le gouvernement indien imposent des exigences jugées déraisonnables, les princes défient le pouvoir central et établissent leurs royaumes indépendants."

  marginalized_muslims:0 "Musulmans marginalisés"
  marginalized_muslims_0:0 "Musulmans opprimés"
  marginalized_muslims_1:0 "Musulmans marginalisés"
  marginalized_muslims_2:0 "Musulmans négligés"
  marginalized_muslims_3:0 "Musulmans protégés"
  marginalized_muslims_4:0 "Musulmans émancipés"
  marginalized_muslims_desc:0 "La cohabitation des hindous et des musulmans d’Asie du Sud au sein d’un même cadre étatique a toujours été tendue. Étant donné la majorité démographique hindoue en Inde, il faut soigneusement équilibrer les intérêts de la majorité et des minorités."

  slight_religious_minority:0 "Minorités religieuses"

  placated_muslims:0 "Musulmans apaisés"
  placated_muslims_desc:0 "Nous avons réussi à réparer nos relations avec les musulmans des régions du Sind, du Pendjab et du Bengale, et ils sont désormais bien plus enclins à coopérer."

  enraged_muslims:0 "Musulmans en colère"
  enraged_muslims_desc:0 "Les récents actes de notre administration ont mis en fureur la population musulmane et ont durablement détérioré nos relations avec elle."

  princely_state_policing_action:0 "[From.GetOperationName]"
  princely_state_policing_action_default:0 "Action de police en [From.GetName]"
  princely_state_policing_action_desc:0 "Les manœuvres de [From.GetPrinceName] ne peuvent plus durer ! Nous devons mettre un terme net à son royaume médiéval."
  operation_or_cooldown:0 "A mené, ou n’a pas récemment mené, une action de police."
  integrated_princely_states:0 "États princiers intégrés"
  prince_state_force:0 "Déverrouille des §Ydécisions§! pour prendre les §YÉtats princiers§! restants par la force."

  raj_lin_investment_running:0 "Recherche d’investissements en cours"
  RAJ_Jinnahs_Kingdom_compliance:0 "Intégration de nos camarades musulmans"
  india.411.t:0 "Une opération extrêmement réussie"
  india.411.desc:0 "La toute nouvelle armée indienne n’a eu aucun mal à percer les maigres défenses mises en place par [?current_prince_state.GetPrinceName] de [?current_prince_state.GetName], avec des pertes minimes. Son pitoyable simulacre de pays est de nouveau indien."
  india.411.a:0 "Rien n’arrête notre armée."

  india.412.t:0 "Une opération réussie"
  india.412.desc:0 "La toute nouvelle armée indienne a mené une invasion professionnelle et tactique des terres de [?current_prince_state.GetName]. Les forces de [?current_prince_state.GetPrinceName] ont été submergées et les pertes sont restées faibles."
  india.412.a:0 "Beau travail, les gars."

  india.413.t:0 "Une opération désastreuse"
  india.413.desc:0 "La toute nouvelle armée indienne, encore désorganisée, a éprouvé de grandes difficultés face aux défenses impressionnantes déployées par [?current_prince_state.GetPrinceName] de [?current_prince_state.GetName]. Après tant de vies indiennes perdues, il est temps de se réconcilier et de reconstruire l’administration locale."
  india.413.a:0 "Il faut renforcer la formation."

  india.414.t:0 "Une opération catastrophique"
  india.414.desc:0 "L’opinion publique indienne est outrée par le dernier bilan des pertes. Ce qui devait être une modeste action de police s’est mué en bataille coûteuse, des corps indiens s’entassant aux abords des frontières de [?current_prince_state.GetName]. Les observateurs internationaux sont stupéfaits par la force militaire que [?current_prince_state.GetPrinceName] a su rassembler. Certes, [?current_prince_state.GetName] est finalement tombé, mais à quel prix ?"
  india.414.a:0 "Qu’on m’amène le général."

  india.415.t:0 "Départ des Britanniques"
  india.415.desc:0 "Après le désenchevêtrement britannique du sous-continent, et fièrement après trois siècles de sujétion, le tricolore indien a flotté au-dessus du Parlement de New Delhi. Les Britanniques sont partis, et l’Inde s’éveille, déterminée à se tourner vers l’avenir et à forger son destin."
  india.415.a:0 "Un jour radieux."

  india.416.t:0 "Départ des Britanniques"
  india.416.desc:0 "Après le désenchevêtrement britannique du sous-continent, et fièrement après trois siècles de sujétion, le tricolore indien a flotté au-dessus du Parlement de New Delhi. Mais, dans le nord-ouest de l’Inde, l’histoire fut tout autre : au-dessus du bâtiment de l’Assemblée du Sind flottait un croissant islamique sur fond vert sombre — manifestement pas le drapeau indien. Malgré l’ampleur de nos efforts pour l’indépendance, la Ligue musulmane de toute l’Inde a accumulé trop d’influence pour que nous gardions nos provinces occidentales et bengalies. Tandis que le rêve d’une Inde unifiée s’effondre, tournons-nous vers l’avenir."
  india.416.a:0 "L’Inde n’est plus unie."
  india.416.b:0 "Un noble moyen de protéger les minorités."

  india.417.t:0 "Ouverture de la cinquante-deuxième session du Congrès"
  india.417.desc:0 "Cinq années constructives se sont écoulées pour le Congrès national indien sous la direction de Jawaharlal Nehru, mais beaucoup, au sein du Congrès, aspirent à un nouveau leadership après sa longue domination. Les derniers bulletins arrivent et…"
  india.417.a:0 "…Nehru rempile pour cinq ans !"
  india.417.b:0 "…Prasad fait une entrée fracassante !"

  india.418.t:0 "La question du leadership"
  india.418.desc:0 "Sikander Hayat Khan s’étant éteint, il ne peut plus assumer le fardeau de diriger l’Inde. Le Parti unioniste est en plein désarroi, tant le parti s’était structuré autour de cet homme d’État. Il nous faut pourtant regarder vers l’avenir et assurer une direction efficace pour les prochaines années."
  india.418.a:0 "Président Khizar Tiwana !"

  india.419.t:0 "Le congrès de Bhopal"
  india.419.desc:0 "En entendant des rumeurs d’un large soutien électoral au Parti communiste indien, maintenant que son objectif premier — l’abolition du système des castes — a été en grande partie atteint, Ambedkar s’est demandé si sa mission n’était pas déjà accomplie et si une nouvelle direction ne saurait pas mieux traiter des problèmes qu’il n’aurait pas vus. Il était sûr que, lors du congrès de Bhopal, il lui faudrait annoncer publiquement sa décision."
  india.419.a:0 "Encore cinq ans !"
  india.419.b:0 "Peut-être qu’un nouveau leadership servirait mieux l’Inde."

  india.420.t:0 "Rapport du CBI — Hyderabad"
  india.420.desc:0 "Le Central Bureau of Investigation vient de confirmer que de nombreuses grandes puissances vont soutenir l’indépendance d’Hyderabad, légitimant ainsi ce pitoyable simulacre de pays. Nous devons agir vite, avant qu’elles n’établissent des missions diplomatiques permanentes !"
  india.420.a:0 "Quels imbéciles."

  india.430.t:0 "Rapport du CBI — Sikkim"
  india.430.desc:0 "Le Central Bureau of Investigation vient de confirmer que de nombreuses grandes puissances vont reconnaître officiellement l’indépendance du Sikkim, légitimant ainsi ce pitoyable simulacre de pays. Nous devons agir vite, avant l’établissement de missions diplomatiques permanentes !"
  india.430.a:0 "Quels imbéciles."

  india.421.t:0 "Implication indienne"
  india.421.desc:0 "Bien que notre administration, nos navires et nos troupes se soient retirés du sous-continent, nous avons décidé de protéger, a minima, la souveraineté de l’Inde et du Pakistan durant une période transitoire. La plupart des conseillers prônent un désengagement politique total, mais garantir que l’Inde ne tombe pas entre des mains étrangères peut aussi être bénéfique."
  india.421.a:0 "Informer l’ambassadeur."
  india.421.b:0 "La situation nous est parfaitement favorable."

  india.422.t:0 "La scène internationale"
  india.422.desc:0 "Notre position interne sécurisée, il est peut-être temps d’affermir notre position internationale. Notre parti et notre pays se sont divisés sur l’adhésion à des alliances, mais sous une direction résolue, une décision a été forcée. Beaucoup de nos meilleurs diplomates attendent désormais nos ordres pour fixer leur cap."
  india.422.descalt:0 "Ce qui semble la solution la plus logique ou la plus pratique peut parfois être un piège. Les négociations se sont mal passées ; il serait sans doute plus avisé de regarder ailleurs."
  india.422.c:0 "Cap sur Nankin."
  india.422.j:0 "Cap sur Tokyo."
  india.422.s:0 "Cap sur Bangkok."
  india.422.i:0 "Cap sur Téhéran."
  india.422.e:0 "Cap sur Addis-Abeba."
  india.422.p:0 "Cap sur Karachi."
  india.422.r:0 "Cap sur Moscou."
  india.422.it:0 "Cap sur Rome."
  india.422.tu:0 "Cap sur Ankara."
  india.422.f:0 "Cap sur Paris."
  india.422.sp:0 "Cap sur Madrid."

  india.423.t:0 "L’Inde souhaite rejoindre le [Root.GetFactionName]"
  india.423.desc:0 "Après trois siècles de domination britannique, l’Inde s’est libérée des chaînes du colonialisme et emprunte désormais une nouvelle voie. Elle a établi un gouvernement démocratique et assuré sa politique intérieure, puis s’est interrogée sur sa place sur la scène internationale. Elle semble avoir conclu qu’une alliance avec nous lui serait la plus profitable. Pouvons-nous en dire autant ?"
  india.423.a:0 "Bien sûr !"
  india.423.b:0 "Une tentative opportuniste d’accroître leur influence."

  india.424.t:0 "Prise de pouvoir du [RAJ.GetReigningGovernment]"
  india.424.d:0 "Avec le soutien massif du peuple, l’installation du [RAJ.GetReigningGovernment] comme parti légitime au pouvoir en Inde était inévitable."
  india.424.a:0 "Président Nehru"
  india.424.b:0 "Président Hayat Khan"
  india.424.c:0 "Président Ambedkar"

  india.425.t:0 "Perte du statut de dominion"
  india.425.d:0 "En raison d’événements politiques récents, notre statut de [Root.GetName] n’est plus valide et l’indépendance sera obtenue sans autre préavis."
  india.425.a:0 "En avant."

  RAJ_AFG_Railway_Alignment:0 "Chemin de fer Pendjab–Tachkent"
  RAJ_AFG_Railway_Alignment_desc:0 "Notre nouvelle alliance avec Moscou exige le transport de marchandises, de soldats et d’informations entre nos deux patries. À la suite du « Grand Jeu », l’Afghanistan se trouve sur cet axe. L’aligner sur nos intérêts renforcera grandement nos liens avec les Soviétiques."

  raj_first_five_year_plan:0 "Première étape du plan quinquennal"
  RAJ_full_speed_ahead:0 "Plan quinquennal"
  RAJ_failed_five_year_plan:0 "Échec du plan quinquennal"

  RAJ_reformed_airforce_command:0 "Commandement aérien centralisé"
  RAJ_deterrence:0 "Dissuasion"

  india.426.t:0 "Une offre de la [RAJ.GetFaction]"
  india.426.d:0 "Avec l’alliance entre l’Inde et l’Union soviétique, nous avons naturellement craint une intervention conjointe visant à relier leurs économies et leurs armées. La proposition indienne actuellement sur le bureau de [ROOT.GetLeader] confirme ces craintes : la construction d’une voie ferrée reliant le Pendjab aux républiques d’Asie centrale de l’Union soviétique serait entièrement financée par les deux puissances, avec des incitations économiques supplémentaires pour notre économie. En contrepartie, Delhi et Moscou exerceraient un contrôle accru sur nous.\n\nLe [AFG.GetCommunistParty], en constante progression, exige que le gouvernement [AFG.GetRulingParty] accepte la proposition."
  india.426.a:0 "Cédons à la pression."
  india.426.b:0 "Les Soviétiques n’auront pas leur corridor."

  india.427.t:0 "Objectifs du plan quinquennal"
  india.427.d:0 "Sur le bureau de [RAJ_Leader_Description] [RAJ.GetLeader] reposent deux propositions pour l’exécution de notre premier plan quinquennal. Le premier, moins ambitieux, offre davantage de capacités de construction pour les infrastructures et la production d’armement. Beaucoup, au gouvernement, préfèrent le second, qui donne la priorité absolue à la croissance de nos secteurs de l’industrie lourde. On soutient que nous ne disposons pas encore de la puissance industrielle nécessaire pour soutenir les composantes privilégiées par la première proposition."
  india.427.a:0 "Diversifions nos objectifs."
  india.427.b:0 "Accélérons la production industrielle."

  india.428.t:0 "Orientation des fonds"
  india.428.d:0 "Les anciens États princiers doivent trouver leur place d’égal à égal au sein de l’Inde, aux côtés des anciennes provinces, en tant qu’États de l’Union. Si notre initiative s’y emploie, des conseillers économiques proposent d’investir plus profondément dans l’un de deux États en particulier. Le choix recommandé semble toutefois dépendre… de la religion du conseiller."
  india.428.a:0 "Investir dans l’État occidental."
  india.428.b:0 "Investir dans l’État central."

  raj_five_year_goal_tt:0 "Dans l’année à venir, on attendra de nous que nous développions notre industrie au-delà de §G[?projected_factories_calc]§! §Yusines civiles§!.\n\nEn cas de réussite, octroie pendant §Y1460§! jours :\n"
  RAJ_industrial_mismanagement:0 "Mauvaise gestion industrielle"
  RAJ_industrial_mismanagement_desc:0 "Après la sous-performance totale du plan quinquennal, de larges pans de la bureaucratie ont été limogés et la Commission de planification économique mettra du temps à se remettre."

  india.440.t:0 "Murmures de famine"
  india.440.desc:0 "Ces derniers temps, les terres du Bengale stagnent en matière de production agricole, alors même que la population croît régulièrement et que le travail est très recherché. Cette stagnation est souvent attribuée à l’aliénation entre les paysans et la terre qu’ils cultivent, et à la mainmise éhontée des propriétaires. Cette situation était déjà tendue, mais l’échec des pluies de mousson pourrait annoncer un sort bien pire : la famine. Il est clair que l’Inde ne peut pas fournir les récoltes nécessaires pour nourrir la population du Bengale ; notre seul espoir d’éviter la famine est donc d’importer des denrées étrangères. Il nous faut faire comprendre au monde l’ampleur de notre détresse, sans quoi nous pourrions perdre des millions d’innocents."
  india.440.a:0 "L’ours a de quoi partager."
  india.440.b:0 "Les Yankees nous couvriront."
  india.440.c:0 "Les Britanniques ont sûrement nos intérêts à cœur."
  india.440.d:0 "Des rumeurs sans fondement."

  india.441.t:0 "Famine en Inde"
  india.441.desc:0 "À cause de la mousson défaillante, l’Inde — le Bengale en particulier — se dirige vers une famine, et l’administration a lancé un appel à notre aide et à nos vivres. Si nous répondons à cet appel à l’action, le gouvernement indien et sa population verront très certainement notre nation d’un œil favorable. Au-delà de cela, acheminer des vivres est évidemment le choix moral — certains diraient même notre devoir moral. Mais ce n’est pas la morale qui décide de la disponibilité des ressources."
  india.441.sov.desc:0 "En raison d’une administration coloniale britannique irresponsable, l’Inde se dirige vers la famine et nombre de leurs responsables politiques autochtones en appellent à l’aide de notre Union prospère. Certains experts estiment que des millions de vies sont en jeu si l’Inde ne reçoit pas des approvisionnements extérieurs pour nourrir sa population frappée par la pauvreté. Outre l’interrogation morale de refuser cette demande, cela pourrait aussi éveiller le peuple indien à la négligence et à l’oppression qu’il subit depuis trois siècles. Camarade Secrétaire général, le choix vous appartient."
  india.441.a:0 "Nous ravitaillerons nos camarades en Inde !"
  india.441.b:0 "Envoyez les vivres, et un peu de démocratie avec."
  india.441.c:0 "Tout pour le Joyau."
  india.441.d:0 "Nos ressources font défaut."

  india.442.t:0 "La réponse [From.GetAdjective]"
  india.442.desc:0 "Il semble que [From.GetLeader] ait longuement réfléchi à sa réponse et, heureusement pour les millions de vies en jeu, il s’est prononcé en faveur d’envois de vivres, au prix d’un sacrifice pour sa propre économie."
  india.442.a:0 "Le Bengale pousse un soupir de soulagement"

  india.443.t:0 "La réponse [From.GetAdjective]"
  india.443.desc:0 "Nous avons reçu une réponse lâche de la part de [From.GetLeader], invoquant un prétendu manque de ressources pour justifier qu’ils laissent mourir des millions de personnes. L’Inde ne l’oubliera pas."
  india.443.a:0 "L’enfer est à nos portes."

  colony_of_burma:0 "Colonie de Birmanie"
  colony_of_burma_desc:0 "En 1937, la colonie de Birmanie a été séparée du Raj britannique et n’est plus sous son administration."

  india.444.t:0 "Ouverture de la Conférence impériale"
  india.444.desc:0 "Après leur couronnement, le roi George VI et son épouse la reine Elizabeth ont convoqué une nouvelle Conférence impériale afin de discuter des affaires de l’empire en ces temps difficiles. Des discussions sur une politique économique et militaire plus unifiée sont attendues."
  india.444.a:0 "Une offre tentante."

  india.445.t:0 "Invitation à la SAARC"
  india.445.d:0 "Le tout nouveau [RAJ.GetNameDef] a lancé la création d’une alliance économique intitulée « Association sud-asiatique pour la coopération régionale » (SAARC) afin de lutter contre l’impérialisme galopant et le sous-développement dans la région. Nous sommes invités à rejoindre ce nouveau bloc économique."
  india.445.a:0 "Une offre tentante."
  india.445.b:0 "Nous ne remplacerons pas un exploiteur par un autre."

  india.446.t:0 "Une visite en [PRC.GetNameDef]"
  india.446.desc:0 "Dans nos efforts récents pour contrecarrer le colonialisme en Asie, nous nous sommes concentrés sur nos frères opprimés directement occupés par des puissances européennes. Mais ignorer, par exemple, le peuple de Chine — miné par l’influence occidentale, une gouvernance faible et des conditions de vie misérables — serait une faiblesse critique. Jusqu’à l’alternative proposée par le mouvement communiste de Mao. Sur la terre chinoise, nous devons décider de l’aide dont le peuple chinois a le plus besoin."
  india.446.a:0 "Des armes légères pour protéger et libérer la Chine !"
  india.446.b:0 "Un soutien politique pour consolider la RPC."
  india.446.c:0 "Un soutien industriel pour élever les travailleurs."

  india.447.t:0 "Le soutien [RAJ.GetAdjective] est arrivé !"
  india.447.desc:0 "La nouvelle Inde démocratique, indépendante et socialiste nous a gratifiés d’un soutien inestimable, que le peuple chinois n’oubliera jamais."
  india.447.a:0 "Ces armes indiennes mettront les oppresseurs en échec."
  india.447.b:0 "Ce soutien politique aide grandement le PCC."
  india.447.c:0 "Ces nouvelles industries soutiendront les travailleurs chinois."

