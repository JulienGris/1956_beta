  declare_independence:0 "Déclarer l’indépendance"
  declare_independence_desc:0 "Le moment est venu ! Nous avons désormais accumulé assez d’influence auprès des Britanniques pour enfin libérer le sous-continent de la botte qui l’empêche de s’élever parmi les nations."
  demand_oaths_of_loyalty:0 "Exiger des serments de loyauté"
  demand_oaths_of_loyalty_desc:0 "Il est temps d’intégrer définitivement l’Inde et d’unifier le sous-continent sous un gouvernement unique."

  independence_granted:0 "A obtenu l’indépendance accordée par les Britanniques"

