LAT_contact_attaches:0 "Contacter les attachés étrangers"
LAT_contact_attaches_desc:0 "Attirés par la proximité du pays avec l’[SOV.GetName], les attachés militaires sont nombreux dans le pays et constituent une source vitale de renseignements sur l’innovation militaire."
LAT_discuss_with_attache:0 "Discuter avec l’attaché [From.GetAdjective]"
LAT_inquire_about_armament:0 "S’informer sur l’armement [From.GetAdjective]"
LAT_advisory_adj_army_attache:0 "Attaché militaire [From.GetAdjective] de conseil"
LAT_advisory_adj_navy_attache:0 "Attaché naval [From.GetAdjective] de conseil"
LAT_cease_adj_navy_attache_collaboration:0 "Mettre fin à la collaboration avec l’attaché naval"
LAT_cease_adj_army_attache_collaboration:0 "Mettre fin à la collaboration avec l’attaché militaire"
LAT_kegums_power_plant_construction:0 "Construction de la centrale électrique de Kegums"
LAT_kegums_power_plant_construction_desc:0 "La centrale de Kegums est l’un de nos projets de développement les plus importants depuis notre indépendance. Une fois achevée, elle garantirait notre autonomie énergétique et renforcerait notre potentiel économique."
LAT_kegums_power_plant_construction_idea:0 "Construction de la centrale de Kegums"
LAT_kegums_power_plant_construction_idea_desc:0 "La centrale de Kegums fut le projet le plus important de la Lettonie à la fin des années 1930. Une fois achevée, elle garantirait l’indépendance énergétique du pays et renforcerait son potentiel économique."
LAT_organize_public_subscription:0 "Organiser une souscription publique"
LAT_reallocate_investments:0 "Réallouer les investissements"
LAT_admiral_small_ships_training:0 "Entraînement des petits navires"
LAT_admiral_submarine_training:0 "Entraînement des sous-marins"

#focus#
#air and electronics#
LAT_VEF_radio_production:0 "Production de radios VEF"
LAT_VEF_radio_production_desc:0 "Valsts elektrotehniskā fabrika (VEF), également connue sous le nom d’Usine électrotechnique d’État, est l’une des plus grandes usines de [LAT.GetName], fondée en 1919. Aujourd’hui, elle fabrique des ampoules électriques, des appareils photo, des radios, des téléphones et d’autres équipements électroniques."
LAT_VEF_electronics_primacy:0 "Primauté de l’électronique"
LAT_VEF_electronics_primacy_desc:0 "Nous ne pouvons pas investir dans toutes les nouvelles technologies disponibles. Si nous devons choisir entre la cellule d’un avion et ses moteurs de contrôle, nous choisirons ces derniers, car ils peuvent être produits en masse dans les usines nationales."
LAT_fighter_development:0 "Développement des chasseurs"
LAT_fighter_development_desc:0 "Les avions de chasse méritent également une attention, mais avec notre priorité donnée à l’électronique, nous ne pouvons leur consacrer qu’un financement limité."
LAT_VEF_airplanes_primacy:0 "Primauté des avions"
LAT_VEF_airplanes_primacy_desc:0 "L’avenir de la guerre, ce sont les avions, et rien que les avions. Les pièces électroniques peuvent être développées plus tard ou achetées à l’étranger, tandis que les pièces principales d’avions seront produites dans nos usines locales."
LAT_VEF_electronics_sideprojects:0 "Projets secondaires en électronique"
LAT_VEF_electronics_sideprojects_desc:0 "Nos avions modernes ne peuvent pas fonctionner à pleine capacité avec des équipements électroniques obsolètes à bord. Nous devons rediriger des fonds pour améliorer également cette branche."
LAT_VEF_industrial_development:0 "Développement industriel"
LAT_VEF_industrial_development_desc:0 "Les nouveaux designs prennent la poussière en attendant que des installations appropriées soient construites. Les investissements de l’État devraient fournir une base solide pour lancer un nouveau complexe industriel."
LAT_modernized_signal_corps:0 "Corps des transmissions modernisé"
LAT_modernized_signal_corps_desc:0 "Notre attachement aux équipements électroniques nous permet d’équiper nos troupes avec des compagnies de radio et de transmission modernes, ce qui augmentera considérablement leurs performances et leur vitesse de réaction sur le terrain."
LAT_VEF_modern_cameras:0 "Appareils photo modernes"
LAT_VEF_modern_cameras_desc:0 "Les innovations technologiques dans le domaine de l’électronique peuvent être utilisées efficacement par nos troupes de reconnaissance, nos agents et nos espions, améliorant ainsi considérablement notre collecte et analyse de renseignements."
LAT_VEF_radar_experiments:0 "Expériences sur le radar"
LAT_VEF_radar_experiments_desc:0 "Détecter les avions avant même qu’ils n’atteignent le ciel sera rendu possible grâce à l’utilisation de systèmes radars nouvellement développés."
LAT_VEF_technological_breakthrough:0 "Percée technologique"
LAT_VEF_technological_breakthrough_desc:0 "L’équipe scientifique [LAT.GetAdjective] a fièrement annoncé aujourd’hui au gouvernement de [LAT.GetName] que le financement et les investissements du régime ont porté leurs fruits et que les avancées technologiques du pays peuvent être considérablement accélérées grâce à une percée dans le domaine de l’électronique et de l’aéronautique !"
LAT_VEF_larger_planes:0 "Avions plus grands"
LAT_VEF_larger_planes_desc:0 "Nous avons une possibilité unique de développer un nouveau prototype d’avion lourd, utilisable pour transporter des marchandises à travers le pays ou pour larguer le feu sur nos ennemis !"
LAT_VEF_light_bombers:0 "Bombardiers légers"
LAT_VEF_light_bombers_desc:0 "Les modèles d’avions plus légers et à courte portée nécessitent moins de ressources et sont plus faciles à produire dans nos installations locales, nous devons investir dans leur développement !"
LAT_VEF_design_bombing_sights:0 "Concevoir des viseurs de bombardement"
LAT_VEF_design_bombing_sights_desc:0 "Les experts militaires suggèrent de rediriger une partie de nos fonds pour développer de nouveaux viseurs de bombardement, ce qui augmentera l’efficacité de nos modèles de bombardiers."
LAT_modernized_air_doctrine:0 "Doctrine aérienne modernisée"
LAT_modernized_air_doctrine_desc:0 "Les performances des avions dans le ciel peuvent être améliorées systématiquement si les tactiques aériennes obsolètes de la Grande Guerre sont remplacées par des doctrines modernes de combat aérien."
LAT_trained_air_mechanics:0 "Mécaniciens aériens formés"
LAT_trained_air_mechanics_desc:0 "Le talent d’un pilote importe peu si le moteur tombe en panne ou si le réservoir fuit en plein vol. La formation d’un personnel au sol compétent augmentera la durée de vie de l’avion et de son pilote."
LAT_export_technical_experience:0 "Exporter l’expérience technique"
LAT_export_technical_experience_desc:0 "Reconnaissant la valeur de mécaniciens formés dans l’entretien des avions, nous pouvons appliquer les méthodes développées pour améliorer la qualité de notre matériel terrestre également."

#marine#
LAT_foreign_submarine_contract:0 "Contrat de sous-marins étrangers"
LAT_foreign_submarine_contract_desc:0 "Nos capacités navales sont extrêmement limitées au niveau national, mais nous pouvons toujours inviter des spécialistes étrangers pour instruire notre personnel naval sur les opérations sous-marines et les doctrines de perturbation des convois."
LAT_foreign_destroyer_contract:0 "Contrat de destroyers étrangers"
LAT_foreign_destroyer_contract_desc:0 "Des capacités limitées en mer pourraient exposer notre pays à un blocus commercial naval complet. La sécurité des convois peut être discutée avec des conseillers militaires étrangers, nos officiers recevant la formation appropriée à cette fin."
LAT_riga_shipyard:0 "Chantier naval de Riga"
LAT_riga_shipyard_desc:0 "Établi en 1913, le chantier naval de Riga est principalement axé sur la réparation, la conversion et la construction navale civile. L’élargissement de ses capacités pour répondre aux besoins militaires éventuels bénéficiera grandement à l’industrie navale [LAT.GetAdjective]."
LAT_liepaja_naval_base:0 "Construire une base navale à Liepaja"
LAT_liepaja_naval_base_desc:0 "Concentrer toute notre industrie à Riga peut sembler avantageux, mais extrêmement dangereux si notre capitale tombe ou si l’ennemi entre dans le golfe de Riga. Karosta, également connue sous le nom de Kara osta ou Port de guerre depuis la proclamation de notre indépendance en 1918, est une colonie entièrement autonome en périphérie de Liepaja. L’extension de la base renforcera notre présence en mer Baltique."
LAT_rethink_naval_doctrine:0 "Repenser la doctrine navale"
LAT_rethink_naval_doctrine_desc:0 "Avec des technologies obsolètes reléguées au passé, c’est désormais l’état actuel de notre doctrine navale qui nous handicape. Nous devons investir massivement pour moderniser ses fondements."
LAT_submarine_strategy:0 "Stratégie sous-marine"
LAT_submarine_strategy_desc:0 "La haute mer Baltique est connue pour ses archipels, ce qui rend les grands navires moins efficaces, voire inutiles, en combat naval. Nous pourrons prendre l’avantage si nous développons de petits navires manœuvrables capables de perturber les lignes de ravitaillement ennemies."
LAT_modernized_small_ships:0 "Petits navires modernisés"
LAT_modernized_small_ships_desc:0 "La basse mer Baltique est connue pour ses fonds peu profonds, ce qui rend les opérations sous-marines moins efficaces. Cependant, elles constituent une grave menace pour nos convois commerciaux et nos navires marchands, menace que nous pourrons neutraliser si ceux-ci sont escortés par de nouveaux destroyers et croiseurs légers modernes."
LAT_new_flagship:0 "Un nouveau navire amiral"
LAT_new_flagship_desc:0 "Si nous voulons imposer notre domination en mer Baltique, nous avons besoin d’un navire digne de représenter notre flotte. La construction d’un navire lourd pourrait être longue et coûteuse, mais obtenir le statut de puissance navale régionale en vaut la peine."
LAT_reinforce_the_navy_air_branch:0 "Renforcer la branche aéronavale"
LAT_reinforce_the_navy_air_branch_desc:0 "La marine et l’armée de l’air sont souvent perçues comme des rivales se disputant les financements, mais leur coopération nous permettra de construire une nouvelle génération d’avions capables d’opérations maritimes."

#industrie#
LAT_revitalize_civilian_economy:0 "Revitaliser l’économie civile"
LAT_revitalize_civilian_economy_desc:0 "La Banque de Crédit de Lettonie, récemment formée, a été chargée par l’État de contrôler les activités de crédit dans le pays et d’investir dans des entreprises clés afin de renforcer le secteur industriel."
LAT_contact_foreign_industrial_partners:0 "Contacter des partenaires industriels étrangers"
LAT_contact_foreign_industrial_partners_desc:0 "Nous devons contacter des partenaires industriels étrangers afin d’assurer un flux d’investissements stable dans notre économie en croissance. Le représentant de la firme suédoise SENTAB arrivera dans quelques semaines pour des négociations."
LAT_mobilize_the_banks:0 "Mobiliser les banques"
LAT_mobilize_the_banks_desc:0 "La juridiction de la Banque centrale peut être étendue à un contrôle complet et à la mise en œuvre de la politique monétaire dans tout le pays. Nous publierons un décret permettant à la banque de gérer les actifs extérieurs, ce qui facilitera grandement la micromanipulation de l’économie."
LAT_kegums_power_plant:0 "Construire la centrale électrique de Kegums"
LAT_kegums_power_plant_desc:0 "La construction d’un barrage près de Kegums assurerait enfin notre autonomie énergétique. Toutefois, cette tâche ne sera certainement pas facile à accomplir, car les travaux dureront sans doute plusieurs années."
LAT_devaluate_the_lats:0 "Dévaluer le lats"
LAT_devaluate_the_lats_desc:0 "La surévaluation actuelle de notre monnaie nuit à nos exportations. Afin de permettre à notre industrie manufacturière de prospérer, une réforme monétaire est indispensable."
LAT_save_ford_vairogs:0 "Sauver Ford Vairogs"
LAT_save_ford_vairogs_desc:0 "L’usine automobile Ford-Vairogs de Riga a été fondée en 1895, à l’origine comme une fabrique de wagons et mécanique dans les limites de la ville. Le récent manque de commandes et l’important nombre de capacités sous-utilisées ont conduit à sa détérioration. Nous pouvons conclure un accord avec Ford Motor Company et obtenir la licence pour produire localement plusieurs variantes de voitures. Si les négociations aboutissent, nous devrons également augmenter les financements et agrandir les installations de l’usine."
LAT_military_motorization_program:0 "Programme de motorisation militaire"
LAT_military_motorization_program_desc:0 "Les voitures blindées et les véhicules motorisés sont particulièrement demandés par l’état-major militaire du pays. Une coopération étroite entre l’armée et les instituts scientifiques pourrait conduire à l’invention d’une toute nouvelle génération de véhicules motorisés."
LAT_G_erenpreis_bicycle_factory:0 "Usine de vélos G. Erenpreis"
LAT_G_erenpreis_bicycle_factory_desc:0 "L’année 1927 a vu la création d’une nouvelle société appelée « Usine de vélos G. Erenpreis », destinée à produire des bicyclettes et leurs pièces pour répondre à la demande croissante de la population. Le fondateur de l’entreprise, Gustav Erenpreis, a déjà commencé la construction de l’usine en 1931. Avec une aide gouvernementale supplémentaire, ce projet pourra enfin être achevé."
LAT_bicycle_infantry:0 "Infanterie à vélo"
LAT_bicycle_infantry_desc:0 "Le manque de caoutchouc produit localement rend difficile pour notre armée d’atteindre une pleine motorisation avec des véhicules blindés. Les récentes améliorations des bataillons de reconnaissance ont permis d’équiper nos troupes de vélos, augmentant ainsi leur mobilité et leurs capacités de reconnaissance."
LAT_national_tank_program:0 "Programme national de chars"
LAT_national_tank_program_desc:0 "Les capacités des véhicules blindés ont été gravement sous-estimées par le passé. Maintenant que nous voyons le véritable potentiel de la guerre blindée, nous devons investir massivement dans de nouveaux prototypes de chars !"
LAT_increase_research_budget:0 "Augmenter le budget de recherche"
LAT_increase_research_budget_desc:0 "Les demandes croissantes des branches militaires et industrielles mettent nos équipes scientifiques sous forte pression. Un financement supplémentaire destiné à agrandir les instituts et installations de recherche devrait soulager nos développeurs et inventeurs."

#armée#
LAT_rely_on_foreign_attaches:0 "S’appuyer sur les attachés étrangers"
LAT_rely_on_foreign_attaches_desc:0 "En tant que petit pays isolé, nous avons toujours eu du mal à suivre les innovations militaires. Par conséquent, nous devons nous appuyer sur les attachés militaires étrangers en poste dans notre pays pour acquérir une partie des innovations récentes des grandes puissances militaires."
LAT_new_generation_of_generals:0 "Nouvelle génération de généraux"
LAT_new_generation_of_generals_desc:0 "Afin de maintenir notre haut commandement efficace et réactif aux exigences de la guerre moderne, nous devons promouvoir de manière proactive de nouveaux individus compétents au sein de notre armée afin de favoriser l’innovation."
LAT_study_foreign_firearm_prototypes:0 "Étudier des prototypes d’armes à feu étrangères"
LAT_study_foreign_firearm_prototypes_desc:0 "Après de multiples discussions avec des experts militaires étrangers, il est clair que notre armée a un besoin urgent d’armes d’infanterie modernes. Nos experts ont déjà obtenu quelques prototypes, nous devons voir comment les produire dans nos usines."
LAT_general_modernization_plan:0 "Plan de modernisation générale"
LAT_general_modernization_plan_desc:0 "Le manque d’expérience et d’entraînement sur le terrain peut être compensé si l’ensemble de l’appareil militaire de notre nation subit un processus coûteux et long de modernisation globale."
LAT_draw_new_mobilization_plans:0 "Élaborer de nouveaux plans de mobilisation"
LAT_draw_new_mobilization_plans_desc:0 "L’état-major élargi a travaillé à déterminer les sources possibles d’agression contre notre pays. Au vu des ambitions territoriales et de l’expansion des sphères d’influence de nos voisins, nous pouvons clairement identifier les deux fauteurs de troubles de la région : [GER.GetName] et [SOV.GetName]. Nous devons nous préparer en conséquence !"
LAT_fortify_the_border:0 "Fortifier la frontière"
LAT_fortify_the_border_desc:0 "Nos soldats n’auront aucune chance de résister à une attaque de l’ennemi supérieur sans défenses antiaériennes adéquates et un système de fortifications. Nous devons également fournir à nos régiments du génie un équipement à jour."
LAT_special_forces:0 "Forces spéciales"
LAT_special_forces_desc:0 "Plus de 50 % du territoire de notre pays est couvert de forêts, ce qui implique que nous devons organiser la formation d’unités spécialisées capables de combattre dans ce terrain difficile."
LAT_sellier_and_bellot_ammunitions:0 "Munitions Sellier & Bellot"
LAT_sellier_and_bellot_ammunitions_desc:0 "L’agrandissement de la seule fabrique de munitions du pays nous permettrait d’éviter d’importer des cartouches en cas de conflit."
LAT_modern_infantry:0 "Infanterie moderne"
LAT_modern_infantry_desc:0 "Les régiments d’infanterie joueront toujours un rôle crucial dans la défense de l’indépendance du pays. Leur fournir un équipement fiable et adapté renforcera leurs capacités offensives et défensives, tout en améliorant le moral général."
LAT_artillery_modernization:0 "Modernisation de l’artillerie"
LAT_artillery_modernization_desc:0 "La reconquête d’un territoire occupé ou volé ne peut se faire sans offensive contre un ennemi retranché. Nos effectifs sont trop précieux, nous devons concentrer la percée grâce à l’artillerie, qui est actuellement en cours de modernisation."
LAT_anti_tank_artillery:0 "Artillerie antichar"
LAT_anti_tank_artillery_desc:0 "L’ennemi peut utiliser des chars pour percer nos défenses, mais nous développerons une réponse adaptée : un canon antichar. Leur blindage incliné ne comptera guère si notre canon est assez proche !"
LAT_anti_air_artillery:0 "Artillerie antiaérienne"
LAT_anti_air_artillery_desc:0 "La supériorité aérienne ennemie sera brisée et dispersée sur le sol [LAT.GetAdjective] dès qu’elle rencontrera les obus de nos plus récents canons antiaériens !"
LAT_incorporate_paramilitary_units:0 "Intégrer les unités paramilitaires"
LAT_incorporate_paramilitary_units_desc:0 "Intégrer les unités paramilitaires"
LAT_mobilization_of_the_workforce:0 "Mobilisation de la main-d’œuvre"
LAT_mobilization_of_the_workforce_desc:0 "Mobilisation de la main-d’œuvre"

#Encore plus d’Ulmanis !#
LAT_enforce_the_succession_law:0 "Imposer la loi de succession"
LAT_enforce_the_succession_law_desc:0 "Afin de devenir président à la fin du mandat d’Alberts Kviesis, la loi doit être modifiée. Cela entraînera une concentration accrue du pouvoir entre les mains d’Ulmanis. Par la suite, sa dictature sera véritablement absolue."
LAT_ulmanis_in_control_of_the_government:0 "Le chef du peuple"
LAT_ulmanis_in_control_of_the_government_desc:0 "Carlis Ulmanis est maintenant président, éliminant ainsi toute opposition qu’il pouvait rencontrer au sein du gouvernement. Dès à présent, une nouvelle ère s’ouvre pour la Lettonie, une ère où Ulmanis est aux commandes."
LAT_nationalize_important_industries:0 "Nationaliser les industries importantes"
LAT_nationalize_important_industries_desc:0 "Les industries publiques peuvent nous aider à construire une économie stable et prospère sans dépendre de sponsors privés."
LAT_micromanage_the_economy:0 "Micromanager l’économie"
LAT_micromanage_the_economy_desc:0 "Notre économie, en particulier le secteur agricole, n’est pas entièrement sous notre contrôle. Le président Ulmanis a toutefois une grande expérience en économie : le laisser micromanager pourra demander des sacrifices, mais tout cela portera ses fruits à l’avenir."
LAT_corporate_statism:0 "Organisation et corporatisme d’État"
LAT_corporate_statism_desc:0 "Les mouvements ouvriers grandissent de jour en jour à travers le pays. Pour contrer les demandes croissantes des travailleurs et prévenir toute insurrection communiste, une politique de corporatisme d’État inspirée de l’Italie fasciste ou de l’Allemagne doit être mise en place."
LAT_house_of_proffesions:0 "La maison des professions"
LAT_house_of_proffesions_desc:0 "La croissance industrielle et l’indépendance économique de [LAT.GetName] ne peuvent être atteintes que par l’organisation et le soutien de la Maison des professions. La chambre nouvellement fondée a pour but de représenter les intérêts des différents groupes de travailleurs et institutions correspondantes à travers le pays."
LAT_assimilate_minorities:0 "Assimiler les minorités"
LAT_assimilate_minorities_desc:0 "Le pourcentage de Lettons ethniques était estimé à 75 % lors du recensement de 1935. Les Russes, Estoniens, Lettons et autres minorités deviendront partie intégrante de la société [LAT.GetAdjective] par le biais d’une politique d’assimilation où la langue [LAT.GetAdjective] sera enseignée dans les écoles et universités."
LAT_equal_latvia:0 "Capitale culturelle des pays baltes"
LAT_equal_latvia_desc:0 "En tant que ville la plus peuplée et la plus ancienne de la région baltique, Riga est communément appelée « la capitale culturelle des pays baltes », ce qui renforce grandement les sentiments patriotiques du peuple [LAT.GetAdjective]."
LAT_top_of_the_line_agrarianism:0 "Produits agricoles de premier choix"
LAT_top_of_the_line_agrarianism_desc:0 "L’économie de notre pays dépend fortement des exportations agricoles. Les produits agricoles [LAT.GetAdjective], tels que le blé, les céréales et le vin, sont connus comme faisant partie des meilleurs sur le marché européen."
LAT_neutral_foreign_policy:0 "Politique étrangère neutre"

#pas d’Ulmanis pour vous#
LAT_a_rejection_of_ulmanis:0 "Un rejet d’Ulmanis"
LAT_a_rejection_of_ulmanis_desc:0 "Le mandat d’Alberts Kviesis touche à sa fin, tandis que Carlis Ulmanis contrôle le gouvernement d’une main de fer. Si nous voulons garantir un changement de gouvernement en [LAT.GetName], nous devons rejeter ouvertement les avancées politiques d’Ulmanis et limiter drastiquement son influence. Nous devons agir vite avant que la loi sur la succession ne soit modifiée !"

#démocratique#
LAT_assemble_a_new_seima:0 "Convoquer un nouveau Saeima"
LAT_assemble_a_new_seima_desc:0 "Si nous voulons empêcher notre pays de sombrer dans un autre régime tyrannique et oppressif, nous devons renforcer encore davantage le pouvoir de la coalition démocratique actuelle. Le 5e parlement (Saeima), composé de cent représentants, doit être habilité à orienter le gouvernement vers une nouvelle voie démocratique."
LAT_liberal_economic_reforms:0 "Reproduire les politiques économiques occidentales"
LAT_liberal_economic_reforms_desc:0 "De nombreux investisseurs étrangers, observant les changements rapides de notre gouvernement et sa libéralisation accélérée, expriment leur volonté d’investir dans notre jeune État en développement. Nous devons leur montrer notre bonne volonté en appliquant plusieurs politiques économiques libérales adaptées au contexte baltique."
LAT_redraft_the_constitution:0 "Réviser la Satversme"
LAT_redraft_the_constitution_desc:0 "La Latvijas Republikas Satversme, ou Constitution de la République de Lettonie, fut adoptée en 1922, comprenant 115 articles et 8 chapitres, et stipulant dans son premier article : « La Lettonie est une république démocratique indépendante. » En 1934, la Satversme fut suspendue par Ulmanis lors de sa prise de pouvoir. Le 5e Saeima réintroduira la Constitution dans toute sa puissance et appliquera son premier article tel quel !"
LAT_state_intervention:0 "Intervention de l’État"
LAT_state_intervention_desc:0 "La politique actuelle de l’État est dédiée à la supervision du développement industriel et économique du pays."
LAT_a_western_ally:0 "Un allié à l’Ouest"
LAT_a_western_ally_desc:0 "Notre régime démocratique nouvellement établi risque de tomber victime de l’agression de nos voisins ou d’instabilités politiques soutenues de l’étranger si nous restons seuls. Nous devons demander une alliance à l’Angleterre ou à la France afin de préserver notre indépendance."
LAT_baltic_cooperation:0 "Coopération baltique"
LAT_baltic_cooperation_desc:0 "Signé en 1934, l’accord de l’Entente baltique visait à préserver la paix et à coordonner les politiques extérieures dans la région stratégique de la Baltique. Face aux tensions croissantes à l’Ouest comme à l’Est, nous devons transformer ce traité en une véritable alliance militaire et politique. [LIT.GetName] sera le premier pays invité à signer le traité renouvelé."
LAT_discredit_totalitarianism:0 "Discréditer le totalitarisme"
LAT_discredit_totalitarianism_desc:0 "En tant que premier acteur démocratique majeur de la région, nous renoncerons à toute oppression des peuples menée par les régimes totalitaires. Qu’ils sachent que nous défendrons nos valeurs et la sécurité du peuple !"
LAT_democratic_gem_of_eastern_europe:0 "Le joyau caché de l’Europe de l’Est"
LAT_democratic_gem_of_eastern_europe_desc:0 "Notre attachement aux institutions démocratiques et aux politiques libérales, ainsi que notre statut de l’un des premiers gouvernements républicains d’Europe de l’Est, ont encouragé les gens à surnommer [LAT.GetName] « le joyau caché de l’Europe de l’Est » !"

#communist#
LAT_coalition_with_the_communists:0 "Coalition avec les communistes"
LAT_coalition_with_the_communists_desc:0 "En ces temps de crise, seul un front populaire unissant communistes et partis démocratiques permettra de former une force politique crédible."
LAT_proclaim_the_peoples_republic:0 "Établir la République populaire de Lettonie"
LAT_proclaim_the_peoples_republic_desc:0 "Le consensus global entre communistes et partis démocratiques a été trouvé : de nombreuses manifestations étudiantes et grèves ouvrières forceront le gouvernement à organiser des élections anticipées lors desquelles l’État letton changera à jamais. Ce que les démocrates ignorent, c’est qu’ils n’obtiendront qu’une minorité des voix..."
LAT_rally_the_workers:0 "Mobiliser les travailleurs"
LAT_rally_the_workers_desc:0 "L’appareil d’État communiste exige l’égalité des chances pour tout le peuple. Les ouvriers seront initiés aux moyens de la guerre idéologique et militaire afin de mieux s’adapter au nouvel État letton."
LAT_liberate_estonia:0 "Libérer l’Estonie"
LAT_liberate_estonia_desc:0 "Les manifestations étudiantes à travers [EST.GetName] appellent clairement à la révolution ouvrière dans le pays. Leurs voix seront réduites au silence par le gouvernement bourgeois si nous n’intervenons pas. Aux armes, frères et sœurs !"
LAT_liberate_lithuania:0 "Libérer la Lituanie"
LAT_liberate_lithuania_desc:0 "La direction de [LIT.GetName] a opprimé et humilié les travailleurs depuis bien trop longtemps. Nous devons libérer le peuple [LIT.GetAdjective] et le conduire vers un avenir socialiste prospère !"
LAT_form_the_baltic_union:0 "Unification balte"
LAT_form_the_baltic_union_desc:0 "L’idée d’unir les États baltes est ambiguë mais prometteuse. Avec les territoires baltes partageant les valeurs communistes sous notre direction directe, nous pouvons imposer l’intégration culturelle, économique et scientifique de toutes ces terres au sein de la République socialiste soviétique balte !"
LAT_spread_the_revolution:0 "Révolution au-delà des pays baltes"
LAT_spread_the_revolution_desc:0 "Les pays baltes ont embrassé la Révolution dans toute sa gloire et sa puissance. Le moment est venu de libérer nos voisins et de leur imposer nos idées communistes !"
LAT_join_comintern:0 "Rejoindre le Komintern"
LAT_join_comintern_desc:0 "Partageant les valeurs et les idées de notre voisin de l’Est, nous avons déjà poursuivi de solides liens économiques et scientifiques avec [SOV.GetName]. Nos diplomates travaillent déjà sur l’idée d’une alliance formelle entre nos deux pays !"
LAT_centralize_farming_production:0 "Centraliser la production agricole"
LAT_centralize_farming_production_desc:0 "Les vastes terres agricoles de notre pays ont été divisées en 26 districts administratifs (raïons), autrefois dépendants d’infrastructures obsolètes. Le nouveau décret du LKP propose d’adopter des politiques de collectivisation afin de centraliser la base agricole de notre économie."
LAT_eliminate_capitalism:0 "Éliminer le capitalisme"
LAT_eliminate_capitalism_desc:0 "De nombreux biens industriels des habitants ruraux (« koulaks ») peuvent être nationalisés et leurs terres agricoles redistribuées plus efficacement parmi la population. Cela augmentera les capacités d’industrialisation de notre nation au prix de pertes humaines et de quelques inconvénients économiques pour notre fragile système industriel."

#fascist#
LAT_radical_opposition:0 "Opposition radicale"
LAT_radical_opposition_desc:0 "Le mouvement du Croix-de-Tonnerre s’est opposé à la dictature d’Ulmanis depuis le début. En cette période de crise, ils sont la seule force d’opposition crédible encore active."
LAT_proclaim_the_new_state:0 "Proclamer la Nouvelle Lettonie"
LAT_proclaim_the_new_state_desc:0 "1933 fut l’année où notre parti, Perkonkrusts, aussi appelé Croix-de-Tonnerre, fut fondé par Gustavs Celmiņš. Ce n’est que maintenant que nous sommes devenus une puissance redoutable capable de renverser la dictature illégitime d’Ulmanis et de ses ministres marionnettes. Le moment est venu de libérer Gustavs Celmiņš de prison et de le proclamer dirigeant légitime d’une Nouvelle Lettonie !"
LAT_hail_the_struggle:0 "Vive la lutte"
LAT_hail_the_struggle_desc:0 "Nous ne devons jamais oublier l’oppression passée de notre mouvement, la dissolution du parti en 1933 et l’emprisonnement de notre chef, Gustavs Celmiņš, en 1934. La lutte ne s’arrêtera jamais tant que nos ennemis convoiteront avidement le territoire de notre glorieuse nation !"
LAT_privatize_the_industry:0 "Soutenir les usines d’armement"
LAT_privatize_the_industry_desc:0 "Nos groupes paramilitaires ont besoin d’un armement approprié pour solidifier les positions du gouvernement dans tout le pays. Quelques entreprises d’armement ont offert un grand soutien au régime actuel, elles seront récompensées par une réduction d’impôts et une extension des fonds."
LAT_join_axis:0 "S’allier à l’Allemagne"
LAT_latvian_militarism:0 "Militarisme letton"
LAT_latvian_militarism_desc:0 "Notre jeune et fragile régime a besoin d’une armée régulière adéquate si nous voulons survivre à l’agression de nos voisins. L’instauration d’une conscription universelle sera vitale."
LAT_irridentist_youth:0 "Créer un corps de cadets"
LAT_irridentist_youth_desc:0 "L’agenda de l’État a également un fort impact sur les esprits de la jeune génération. Avec de nombreux jeunes hommes s’engageant volontairement dans l’armée, nous pouvons établir un corps de cadets afin de mieux former nos officiers et soldats. Le corps devrait également organiser une petite force volontaire prête à défendre nos valeurs et principes à travers le monde."
LAT_latvian_chauvinism:0 "Chauvinisme letton"
LAT_latvian_chauvinism_desc:0 "Peu importe jusqu’où remonte l’histoire de notre pays, le peuple [LAT.GetAdjective] a toujours semblé meilleur, plus fort et plus courageux. Nous devrions encourager ce genre de pensées, d’autant que nous disposons de suffisamment de recherches scientifiques à ce sujet."
LAT_baltics_under_one_flag:0 "Unir les pays baltes sous la Croix-de-Tonnerre"
LAT_baltics_under_one_flag_desc:0 "Nés dans la tempête de la Révolution russe de 1917-1921 en tant que trois nations indépendantes, [LAT.GetName], [LIT.GetName] et [EST.GetName] partagent un immense héritage culturel et historique. Avec notre nouvelle interprétation du concept d’Entente baltique, nous unirons tous ces pays en une seule entité sous notre direction."
LAT_mythological_diplomacy:0 "Diplomatie mythologique"
LAT_mythological_diplomacy_desc:0 "La philologie prouve que Perkūnas n’est pas seulement notre dieu suprême, il est l’héritier d’une tradition remontant à l’aube de l’humanité. De nombreux autres pays avaient une variation de ce héros caractérisé par la maîtrise de la foudre ou la possession d’une arme éclatante. Il est temps que Perkūnas, Indra, Héraclès et Thor retrouvent leur unité et frappent tous nos ennemis avec une force sacrée."

#events#
LAT_event.1.t:0 "Un dîner cordial entre officiers"
LAT_event.1.desc:0 "Au cours d’un repas à l’association des officiers, l’attaché a accepté de discuter des dernières innovations dans le domaine de l’armement."
LAT_event.1.a:0 "Lui demander au sujet des armes à feu."
LAT_event.1.b:0 "S’informer sur les canons et les obus."
LAT_event.1.c:0 "S’informer sur les méthodes d’entraînement."

LAT_event.2.t:0 "S’enquérir des doctrines"
LAT_event.2.desc:0 "Comment puis-je vous aider ?"
LAT_event.2.a:0 "Voici comment nous organisons notre armée."
LAT_event.2.b:0 "Voici comment nous organisons notre marine."
LAT_event.2.c:0 "Voici comment nous organisons notre aviation."

LAT_event.3.t:0 "La centrale de Kegums est terminée !"
LAT_event.3.desc:0 "Après des années de travail et d’investissement, le barrage est enfin opérationnel. C’est un accomplissement gigantesque et la preuve de l’ingéniosité lettone."
LAT_event.3.a:0 "Hourra !"

LAT_event.4.t:0 "La fin du mandat d’Alberts Kviesis"
LAT_event.4.desc:0 "Comme le stipule la constitution, la présidence de Kviesis touche à sa fin. Bien que la constitution précise que le président du parlement doit lui succéder, le ministre-président Ulmanis a conçu une loi lui permettant de cumuler sa fonction actuelle avec la présidence. Ainsi, il pourra concentrer encore plus de pouvoir et renforcer sa dictature."
LAT_event.4.a:0 "Le jeu était truqué depuis le début..."
LAT_event.4.b:0 "Invalidez immédiatement cette action !"

LAT_event.5.t:0 "L’invalidation d’Ulmanis"
LAT_event.5.desc:0 "Karlis Ulmanis est le dictateur de facto du pays depuis son coup d’État en 1934, son règne est resté incontesté pendant deux ans. Cependant, le président, qui avait l’habitude d’approuver toutes ses lois précédentes, a pris l’initiative d’invalider la loi de succession d’Ulmanis, l’empêchant ainsi d’obtenir la présidence. L’ancien président de la Saeima lettone, Pauls Kalniņš, est censé devenir le prochain président selon la constitution. Mais il est actuellement dans la prison d’Ulmanis, et la rivalité politique grandissante entre Ulmanis et l’opposition soutenant Kviesis pourrait mener à un effondrement politique, car plus personne n’exercerait légalement le pouvoir."
LAT_event.5.a:0 "Utiliser la légalité pour libérer Pauls Kalniņš."
LAT_event.5.b:0 "Ulmanis tentera tous les coups pour s’accaparer plus de pouvoir."

LAT_event.6.t:0 "La nouvelle Saeima"
LAT_event.6.desc:0 "Maintenant qu’Ulmanis a été écarté du pouvoir, nous pouvons enfin commencer à rétablir un système démocratique fonctionnel. Nous devons d’abord réunir une nouvelle Saeima et élire notre prochain président."
LAT_event.6.a:0 "Confirmer Pauls Kalniņš, il est le président légitime selon la constitution."
LAT_event.6.b:0 "Élire Margers Skujenieks à la place."

LAT_event.7.t:0 "Et maintenant ?"
LAT_event.7.desc:0 "La résistance d’Ulmanis et de ses sbires au rétablissement de la démocratie a été plus forte que prévu. Le président Kviesis n’a pas réussi à le chasser légalement du pouvoir et une fracture est apparue entre ce qu’il reste des institutions."
LAT_event.7.a:0 "Demander le soutien des communistes, ils sont notre dernier espoir."
LAT_event.7.b:0 "Les Perkonkrusts sauveront l’État, ils se sont opposés à Ulmanis depuis des années."

LAT_event.8.t:0 "Proclamer la République populaire"
LAT_event.8.desc:0 "Nous avons ressurgi des cendres des gouvernements autoritaires précédents avec les plus faibles des chances ! Mais nous avons désormais obtenu suffisamment de soutien pour proclamer l’établissement d’un État qui sera l’instrument du peuple letton pour la libération des travailleurs du monde. Cependant, la question de sa direction n’est pas encore réglée, les postes ministériels et présidentiels n’ayant pas encore été attribués."
LAT_event.8.a:0 "Fricis Menders assumera la présidence."
LAT_event.8.b:0 "Lacis Villis servira plutôt comme chef d’État."

