LAT_mobilization_plans:0 "Plans de mobilisation lettons"
LAT_mobilization_plans_desc:0 "Les divers plans de mobilisation établis par notre état-major nous permettront de répondre efficacement à une agression étrangère. Trois grands plans ont été préparés.\n\nLe §YPlan A§! anticipe une attaque de l’URSS par l’est et éventuellement par le nord.\n\nLe §YPlan D§! anticipe une offensive allemande par le sud.\n\nLe §YPlan K§!, considéré comme extrêmement improbable, postule une attaque simultanée de l’Allemagne et de l’Union soviétique."
