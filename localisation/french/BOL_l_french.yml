 form_peru_bolivia_category_category:0 "Rétablir la Confédération Pérou-Bolivie"
 form_peru_bolivia_category_category_desc:0 "Séparés pendant une grande partie de leur histoire, il y eut une courte période où le Pérou et la Bolivie étaient unis dans une seule confédération capable de rivaliser avec ses divers voisins. Maintenant que nos deux nations sont à nouveau réunies sous le même drapeau, nous pourrions proclamer la restauration de la Confédération Pérou-Bolivie."
