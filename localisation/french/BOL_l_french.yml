 south_american_events.63.t:0 "Mort de Germán Busch Becerra"
 south_american_events.63.d:0 "Après une pression médiatique acharnée et constante sur le gouvernement de Becerra, il a été rapporté que Germán Busch Becerra s'est donné la mort cet après-midi. De nombreux membres de sa famille ainsi que ses collègues ont déclaré qu'il n'y avait rien d'inhabituel ou d'étrange dans le comportement de Becerra. Néanmoins, cela a plongé le pays dans un état de choc total, et de nombreux rivaux politiques de Becerra se disputent déjà le pouvoir. L'avenir de la Bolivie est incertain."
 south_american_events.63.a:0 "Des élections doivent avoir lieu immédiatement !"
 south_american_events.63.b:0 "Mettre en place un gouvernement provisoire."
