r56_moldova.1.t:0 "[MOL.GetNameDef] demande l’unification."
r56_moldova.1.desc:0 "Des représentants de [MOL.GetNameDef] ont contacté notre gouvernement et annoncé que leur gouvernement avait décidé à l’unanimité d’exiger la dissolution et l’annexion de leur pays à la Roumanie."
