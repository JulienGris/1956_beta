# Idées de départ #

ARM_fading_national_identity:0 "Identité nationale en déclin"
ARM_fading_national_identity_desc:0 "Le peuple arménien possède une longue et fière histoire de résilience, marquée par une résistance farouche et de lourdes pertes lors des guerres des années 1910 et 1920. Après les horreurs de 1915-1916 et leur lutte pour la survie durant la Grande Guerre, l’Arménie connut brièvement l’indépendance avant d’être absorbée par l’Union soviétique au début des années 1920. Des décennies de régime soviétique ont grignoté l’autonomie culturelle et le sentiment national. Sous les politiques de collectivisation et de suppression de l’identité ethnique imposées par Moscou, les symboles de l’héritage et de la fierté arméniens se sont estompés, laissant place à une identité soviétique qui offre peu de place à l’histoire ou à la tradition arménienne. Aujourd’hui, l’Arménie se trouve à la croisée des chemins : le lien du peuple à ses racines s’affaiblit chaque jour, menaçant d’effacer la mémoire des combats durement menés pour la liberté et l’identité…"

ARM_fading_national_identity_democratic:0 "Renaissance de la République"
ARM_fading_national_identity_democratic_desc:0 "Le peuple arménien possède une longue et fière histoire de résilience, marquée par une résistance farouche et de lourdes pertes lors des guerres des années 1910 et 1920. Après les horreurs de 1915-1916 et leur lutte pour la survie durant la Grande Guerre, l’Arménie connut brièvement l’indépendance avant d’être absorbée par l’Union soviétique au début des années 1920. Des décennies de régime soviétique ont grignoté l’autonomie culturelle et le sentiment national. Sous les politiques de collectivisation et de suppression de l’identité ethnique imposées par Moscou, les symboles de l’héritage et de la fierté arméniens se sont estompés, laissant place à une identité soviétique qui offre peu de place à l’histoire ou à la tradition arménienne. Aujourd’hui, l’Arménie se trouve à la croisée des chemins : le lien du peuple à ses racines s’affaiblit chaque jour, menaçant d’effacer la mémoire des combats durement menés pour la liberté et l’identité…"

ARM_fading_national_identity_right:0 "Triomphe sur le bolchévisme"
ARM_fading_national_identity_right_desc:0 "Le peuple arménien possède une longue et fière histoire de résilience, marquée par une résistance farouche et de lourdes pertes lors des guerres des années 1910 et 1920. Après les horreurs de 1915-1916 et leur lutte pour la survie durant la Grande Guerre, l’Arménie connut brièvement l’indépendance avant d’être absorbée par l’Union soviétique au début des années 1920. Des décennies de régime soviétique ont grignoté l’autonomie culturelle et le sentiment national. Sous les politiques de collectivisation et de suppression de l’identité ethnique imposées par Moscou, les symboles de l’héritage et de la fierté arméniens se sont estompés, laissant place à une identité soviétique qui offre peu de place à l’histoire ou à la tradition arménienne. Aujourd’hui, l’Arménie se trouve à la croisée des chemins : le lien du peuple à ses racines s’affaiblit chaque jour, menaçant d’effacer la mémoire des combats durement menés pour la liberté et l’identité…"

