ARM_return_from_exile:0 "Proclamer la Seconde République"
ARM_return_from_exile_desc:0 "L'Arménie fut jadis libre, et avec le retour de nos frères depuis leurs refuges, elle le sera de nouveau."
ARM_the_last_claimant:0 "Réinvitons le Prince"
ARM_the_last_claimant_desc:0 "Pour retrouver la gloire de notre passé, nous devons nous rallier aux fils de Léon II."
ARM_royal_guards:0 "Fonder la Dranik Gund"
ARM_royal_guards_desc:0 "Nous devons unir nos meilleurs guerriers pour qu'ils deviennent la main droite forte de la monarchie."
ARM_ensure_church_support:0 "Rassembler Autour d’Etchmiadzine"
ARM_ensure_church_support_desc:0 "La foi est le feu dans le cœur de notre peuple. L'Église apostolique doit soutenir le nouveau monarque pour le bien de tous les [ARM.GetAdjective]s."
ARM_reestablish_the_republic:0 "Rétablir la Hanrapetutyun"
ARM_reestablish_the_republic_desc:0 "Les nouvelles technologies permettront au monde d'entendre de nouveau la voix de l'Arménie."
ARM_armenian_youth_federation:0 "Consolider les Tseghagrons"
ARM_armenian_youth_federation_desc:0 "La fraternité est le fondement de la démocratie, et elle commence dans le cœur des jeunes hommes."
ARM_implement_liberal_reforms:0 "Mettre en Place des Réformes Sociales"
ARM_implement_liberal_reforms_desc:0 "Afin de parvenir à un compromis avec les Hunchaks, nous devons instaurer des politiques et réformes sociales."
ARM_mend_the_split:0 "Réparer la Division"
ARM_mend_the_split_desc:0 "Enfin, pour unir notre nation, nous devons unir notre politique intérieure."
