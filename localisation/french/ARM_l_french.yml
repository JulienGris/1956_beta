### BRANCHE COMMUNISTE ###

ARM_socialist_governmental_autonomy:0 "Établir la RSS d’Arménie"
ARM_socialist_governmental_autonomy_desc:0 "La dissolution de la République socialiste fédérative soviétique de Transcaucasie nous offre l’occasion de donner plus de pouvoir à notre peuple."
ARM_party_involvement:0 "L’Identité Socialiste Arménienne"
ARM_party_involvement_desc:0 "L’échec des bolcheviks fut d’exploiter l’Arménie à leur profit plutôt que d’émanciper le peuple arménien. Nous ne répéterons pas cette erreur."
ARM_purge_the_trotskyist_dashnaks:0 "Purger les Dashnaks Trotskystes"
ARM_purge_the_trotskyist_dashnaks_desc:0 ""
ARM_utilize_the_nkvd:0 "Utiliser le NKVD"
ARM_utilize_the_nkvd_desc:0 ""
ARM_fund_the_armenian_workers_union:0 "Financer l’Union des Travailleurs Arméniens"
ARM_fund_the_armenian_workers_union_desc:0 ""
ARM_workers_propaganda:0 "Propagande Ouvrière"
ARM_workers_propaganda_desc:0 "La bourgeoisie de la Première République a trahi le peuple arménien. Le peuple doit s’unir contre les maux du capitalisme ou subir à nouveau le même sort."
ARM_ambitious_production_quotas:0 "Nationaliser l’Industrie"
ARM_ambitious_production_quotas_desc:0 "Ensemble, le pouvoir du peuple est irrésistible. Unis, nous pouvons élever l’Arménie à des sommets jamais atteints."
ARM_army_propaganda:0 "Propagande Militaire"
ARM_army_propaganda_desc:0 "Ensemble, les soldats du peuple peuvent protéger [ARM.GetNameDef] de la dictature de la bourgeoisie européenne et des tyrans ottomans."
ARM_protect_the_revolution:0 "Protéger la Révolution"
ARM_protect_the_revolution_desc:0 "Les flammes de Marx et Lénine consumeront les maux du capitalisme. Mais nous devons rejoindre la grande lutte populaire et sacrifier pour préserver l’étincelle de la révolution."
ARM_enforce_state_atheism:0 "Imposer l’Athéisme d’État"
ARM_enforce_state_atheism_desc:0 "Saint Grégoire et ses églises ne sont guère plus qu’un outil de la bourgeoisie pour endoctriner le peuple à abandonner son pouvoir et sa richesse."
ARM_reopen_etchmiadzin_seminary:0 "Religion Approuvée par l’État"
ARM_reopen_etchmiadzin_seminary_desc:0 "Dieu et Saint Grégoire se tiennent aux côtés du peuple de [ARM.GetNameDef], et le Catholicos peut aider à guider le peuple sur la voie de l’égalité."
ARM_mobilize_the_workers:0 "Mobiliser les Travailleurs"
