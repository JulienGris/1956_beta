ARM_synthetic_rubber_expertise_desc:0 "[ARM.GetNameDefCap] doit être aussi autosuffisante que possible, et ces nouvelles technologies pourraient rendre cela possible."
ARM_support_chemical_factories:0 "Fonder des Usines Chimiques"
ARM_support_chemical_factories_desc:0 "Bien que d’immenses gisements pétroliers se trouvent à l’est, à Bakou, nous devrions établir nos propres sources de pétrole."
ARM_improve_construction_methods:0 "Renforcer l’Industrie de Erevan"
ARM_improve_construction_methods_desc:0 "Pour établir une Arménie moderne, nous devons apprendre à construire d’une manière nouvelle."
ARM_expand_ararat_cement:0 "Agrandir l’Usine de Ciment d’Ararat"
ARM_expand_ararat_cement_desc:0 "Nous avons libéré les usines de ciment d’Ararat de l’influence communiste. Il nous faut maintenant les agrandir."
ARM_industrial_advancements:0 "Programme National d’Éducation"
ARM_industrial_advancements_desc:0 "La route vers l’avenir est pavée par les efforts des esprits les plus brillants de [ARM.GetAdjective]."
ARM_expand_the_yerevan_university:0 "Agrandir l’Université d’Erevan"
ARM_expand_the_yerevan_university_desc:0 "L’Université d’Erevan manque de personnel qualifié ; faire venir des experts de l’étranger pourrait aider nos étudiants."
ARM_plan_the_kajaran_mine:0 "Exploiter le Fer de Zanguezour"
ARM_plan_the_kajaran_mine_desc:0 "De nouvelles découvertes scientifiques indiquent que les ressources minérales près de Kajaran pourraient être bien plus importantes qu’on ne le pensait."
ARM_expand_zangezur_copper_mine:0 "Agrandir les Mines de Cuivre d’Alaverdi"
ARM_expand_zangezur_copper_mine_desc:0 ""
ARM_a_railway_to_kajaran:0 "Construire une Voie Ferrée vers Kajaran"
ARM_a_railway_to_kajaran_desc:0 "Le minerai brut est inutile tant qu’il n’est pas raffiné et acheminé vers les usines. De nouvelles voies ferrées relieront l’industrie [ARM.GetAdjective] comme jamais auparavant."
ARM_expand_the_railway_network:0 "Agrandir le Réseau Ferroviaire"
