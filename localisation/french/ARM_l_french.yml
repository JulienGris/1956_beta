ARM_royal_guards_tt:0 "Crée §Y2 divisions Dranik Gund§! d’élite à §Y[THIS.GetName]§!"

ARM_event.1.t:0 "La Mort du Catholicos Khoren I"
ARM_event.1.desc:0 "Aujourd’hui, l’Arménie pleure la disparition de Sa Sainteté Khoren I, Catholicos de tous les Arméniens, chef spirituel de notre antique nation. Guide lumineux du peuple arménien en une époque troublée, il a consacré sa vie à préserver notre foi, notre culture et notre identité. Ses conseils et sa forte direction furent le seul réconfort dans les temps d’incertitude et de division. Il restera dans les mémoires pour son dévouement désintéressé envers sa patrie et son peuple. L’Arménie a perdu son berger, et la nation prie pour un successeur qui puisse honorer et poursuivre son héritage."
ARM_event.1.a:0 "La perte d’un saint homme."
ARM_event.1.b:0 "Sans importance."

ARM_event.2.t:0 "Les Volontaires [ARM.GetAdjective] Veulent Rentrer !"
ARM_event.2.desc:0 "Les unités de volontaires se sont formées pour combattre [SOV.GetNameDef] et libérer l’Arménie. Avec la défaite de l’État [SOV.GetAdjective], ces volontaires estiment que leur mission est accomplie et souhaitent rentrer chez eux."
ARM_event.2.a:0 "Les convaincre de rester un peu plus longtemps."
ARM_event.2.b:0 "Dissoudre leur unité."

ARM_event.3.t:0 "Les Volontaires Rentent au Pays !"
ARM_event.3.desc:0 "Après un combat héroïque pour libérer notre patrie de l’oppression étrangère, les volontaires qui ont répondu à l’appel de [ARM.GetNameDef] sont rentrés chez eux. Ils ont défilé dans le centre-ville sous les acclamations de la foule."
ARM_event.3.a:0 "Nous nous sommes libérés !"

ARM_event.4.t:0 "La Grande Purge Militaire"
ARM_event.4.desc:0 "Iosif Staline, chef de l’Union soviétique, a récemment ordonné des frappes et arrestations visant de nombreux politiciens, militaires et officiers du Parti bolchevik. Les Arméniens n’ont pas été épargnés : certains responsables, notamment Movses Silikyan et Christopher Araratyan, qui ont combattu pour la Fédération révolutionnaire arménienne dans les années 1920, ont également été arrêtés pour activités antirévolutionnaires. Ils attendent actuellement leur sentence, qui sera probablement la mort, à en juger par les autres cas similaires…"
ARM_event.4.a:0 "Nous devons être prudents, ces temps sont vraiment dangereux..."

ARM_greek_armenian_friendship_modifier:0 "Lutte commune contre un ennemi partagé"
