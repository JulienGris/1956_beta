# Scission Dashnak-Hunchak #

ARM_dashnak_hunchak_split:0 "Scission Dashnak-Hunchak"
ARM_dashnak_hunchak_split_desc:0 "Le [ARM.GetDemocraticParty] et le Sots'ial Demokrat Hnch'akyan Kusakts'ut'yun (Hunchaks) ont autrefois combattu côte à côte pour l’indépendance et les droits de l’Arménie. Cependant, au fil du temps, des divergences idéologiques sont apparues. Tandis que les Dashnaks mettent l’accent sur le nationalisme arménien et l’indépendance, les Hunchaks privilégient les idéaux socialistes, la coopération avec les Soviétiques et des alliances servant des objectifs révolutionnaires plus larges. Cette scission a semé la discorde dans la politique arménienne, chaque parti défendant farouchement sa vision de l’avenir du pays. Aujourd’hui, alors que la nation fait face à de nouvelles menaces et opportunités, ces rivalités internes risquent d’entraver l’unité au moment où elle est la plus nécessaire, laissant l’Arménie divisée et vulnérable aux influences extérieures."

