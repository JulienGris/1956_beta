ARM_acquire_diaspora_funding_desc:0 ""
ARM_transfer_officers_of_armenian_descent:0 "Rappeler les Officiers"
ARM_transfer_officers_of_armenian_descent_desc:0 "Le devoir appelle nos guerriers à revenir au pays. Ils ont beaucoup appris lors de leur service à l’étranger, mais leur peuple a besoin d’eux maintenant."
ARM_the_triumph_over_communism:0 "Triomphe sur les Bolcheviks"
ARM_the_triumph_over_communism_desc:0 "Les Bolcheviks nous ont trahis au moment où nous avions le plus besoin d'eux. Nous devons nous en débarrasser."
ARM_war_propaganda:0 "Arméniens, Unis comme Un Seul !"
ARM_war_propaganda_desc:0 "Aucune nation n’a jamais gagné sa liberté sans être prête à verser le sang des envahisseurs."
ARM_planned_defense_policy:0 "Politique de Défense Planifiée"
ARM_planned_defense_policy_desc:0 "Chaque jour passé à préparer la guerre préserve des semaines de liberté pour nos fils et filles."
ARM_build_the_bek_line:0 "Construire la Ligne Davit Bek"
ARM_build_the_bek_line_desc:0 "La terre où le général Bek a jadis versé son sang est solide et constituera la pierre angulaire de notre défense."
ARM_saint_gregory_protects_our_skies:0 "Saint Grégoire Protège Nos Cieux"
ARM_saint_gregory_protects_our_skies_desc:0 "Le Saint bénira nos travaux tant qu’ils seront réalisés avec une foi sincère."
ARM_cherish_what_we_have:0 "Le Caucase est Notre Patrie"
ARM_cherish_what_we_have_desc:0 "C’est la terre de nos pères, et de leurs pères avant eux, depuis des siècles. Nous la rendrons digne de leur héritage."
ARM_irano_persian_diplomats:0 "Diplomates Irano-Persans"
ARM_irano_persian_diplomats_desc:0 "L’ennemi de nos ennemis peut être un bon voisin. Nous devrions tendre la main à notre voisin du sud."
ARM_join_iran:0 "Rejoindre [PER.GetNameDef]"
ARM_join_iran_desc:0 "La Perse a accueilli nos réfugiés pendant les jours sombres. Nous devrions nous tenir à leurs côtés maintenant que les braises du monde se rallument."
ARM_the_wilsonian_promise:0 "La Promesse Wilsonienne"
ARM_the_wilsonian_promise_desc:0 "Autrefois, le monde croyait que Trabzon, Erzurum et le lac de Van appartenaient à l’Arménie. Il avait raison."
ARM_operation_nemesis_wasn_t_enough:0 "Reprendre l’Opération Némésis"
ARM_operation_nemesis_wasn_t_enough_desc:0 "Les Turcs ont massacré nos mères, nos pères, par milliers. Notre juste vengeance n’est pas encore achevée."
ARM_assimilation:0 "Assimilation"
ARM_assimilation_desc:0 "La rétribution n’exige pas que nous devenions semblables à notre ennemi. Nous traiterons les conquis mieux que nous avons été traités."
ARM_strong_hand:0 "Une Main de Fer"
ARM_strong_hand_desc:0 "La terre que nous gouvernons désormais appartient aux Arméniens et uniquement aux Arméniens."
ARM_an_open_hand_to_turkey:0 "Chercher la Réconciliation avec l’Anatolie"
ARM_an_open_hand_to_turkey_desc:0 "Pour tous leurs torts, les révolutionnaires d’Atatürk ne sont pas les Ottomans d’autrefois et pourraient se tenir à nos côtés contre les bolcheviks."
ARM_hayk_youth:0 "Fonder le Vrevits Banak"
ARM_hayk_youth_desc:0 "Pour réaliser nos ambitions expansionnistes, nous devons créer l’« Armée de la Vengeance », plus connue sous le nom de « Vrevits Banak »."
ARM_repression_apparatus:0 "Assurer la Loyauté Politique"
ARM_repression_apparatus_desc:0 "Ceux qui ne se tiennent pas à nos côtés ne sont pas de fidèles Arméniens et ne représentent pas la volonté du peuple."
