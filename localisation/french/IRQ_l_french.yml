l_french:
  R56_iraqi_focus:0 "Arbre de priorités irakien"
  IRQ_mahmud_salman:0 "Mahmud Salman"

  IRQ_iraq_petroleum_company:0 "Iraq Petroleum Company"

  IRQ_reinforce_the_monarchy:0 "Renforcer la monarchie hachémite"
  IRQ_reinforce_the_monarchy_desc:0 "Les Hachémites, aussi connus comme la maison de Hachim, descendent du Prophète Muhammad par son petit-fils Hassan. Fermement établis dès le IXe siècle, ils régnèrent sur le Hedjaz jusqu’en 1926 et sur l’Irak depuis 1921, lorsque Fayçal Ier fut élu roi par le congrès national irakien en 1919. En 1933, Ghazi ben Fayçal fut couronné roi Ghazi Ier à la mort de son père. Jeune et panarabiste, le roi assurera sans doute l’héritage hachémite et mènera le pays vers la prospérité en ces temps incertains."
  
  IRQ_appease_the_army:0 "Apaiser l’armée"
  IRQ_appease_the_army_desc:0 "Notre programme ne peut s’appliquer librement tant qu’une épée de Damoclès menace notre régime par une armée peu loyale. Accorder plus d’autonomie aux chefs militaires garantira leur fidélité à notre cause."

  IRQ_welfare_state:0 "Mettre en place des programmes sociaux"
  IRQ_welfare_state_desc:0 "Le peuple irakien doit profiter des richesses de son pays. Assis sur un trésor, il n’en récolte pourtant aucun profit. L’éducation et la santé gratuites seraient une juste compensation pour son labeur."

  IRQ_desert_specialization:0 "Spécialisation désertique"
  IRQ_desert_specialization_desc:0 "40 % de notre territoire est désertique. Nos forces armées ont besoin d’un entraînement et de matériels adaptés pour opérer dans de telles conditions."

  IRQ_camel_corps:0 "Corps de chameaux [ROOT.GetAdjective]"
  IRQ_camel_corps_desc:0 "Les chameaux sont indispensables pour combattre dans le désert."

  IRQ_the_hashemite_diplomacy:0 "La diplomatie hachémite"
  IRQ_the_hashemite_diplomacy_desc:0 "Depuis la « solution chérifienne » de 1921, deux membres de la dynastie hachémite, Fayçal Ier et Abdallah Ier, règnent respectivement sur l’Irak et la Jordanie. Nos destins sont liés depuis des siècles et nous devons renforcer nos liens dynastiques."

  IRQ_promote_peaceful_religious_coexistence:0 "Encourager la coexistence religieuse"
  IRQ_promote_peaceful_religious_coexistence_desc:0 "Notre peuple ne connaîtra jamais l’unité tant que l’extrémisme religieux sévira. Seule une politique de coexistence pacifique permettra à la société arabe moderne de se développer et prospérer."

  IRQ_favor_shiite_officers:0 "Favoriser les officiers chiites"
  IRQ_favor_shiite_officers_desc:0 "De nombreux officiers talentueux de l’académie militaire de Rustamiyah furent rétrogradés ou exclus uniquement pour leur foi. Gagner leur soutien renforcera notre régime."

  IRQ_united_officer_corps:0 "Un corps des officiers uni"
  IRQ_united_officer_corps_desc:0 "La coopération entre civils et militaires sera encouragée. Le pays a déjà trop souffert de révoltes et de coups d’État militaires. Unis, nous sommes forts !"

  IRQ_reaffirm_supremacy_over_the_army:0 "Réaffirmer l’autorité sur l’armée"
  IRQ_reaffirm_supremacy_over_the_army_desc:0 "Après son couronnement, Ghazi Ier fut nommé amiral de la flotte, maréchal de la marine royale et maréchal de l’armée de l’air royale. Développer son prestige auprès des officiers assurera le contrôle du gouvernement sur l’armée."

  IRQ_invite_western_investors:0 "Inviter des investisseurs occidentaux"
  IRQ_invite_western_investors_desc:0 "Notre pays manque d’une base industrielle solide. Conclure des contrats prometteurs avec des investisseurs [ENG.GetAdjective] et [USA.GetAdjective] donnera un formidable élan à notre économie."

  IRQ_seek_foreign_industrial_support:0 "Chercher un soutien industriel étranger"
  IRQ_seek_foreign_industrial_support_desc:0 "Nous avons besoin de capitaux étrangers supplémentaires pour développer notre économie. Le monopole actuel de l’Iraq Petroleum Company nuit à notre image et à notre position. Mettre fin à cette exploitation et proposer des accords équitables avec les [GER.GetAdjective]s, [FRA.GetAdjective], [SOV.GetAdjective]s, [USA.GetAdjective]s et [JAP.GetAdjective] serait plus bénéfique."

  IRQ_british_embassy2:0 "L’ambassade [ENG.GetAdjective]"
  IRQ_british_embassy2_desc:0 "Nous subissons une forte influence [ENG.GetAdjective] en raison de leur présence militaire au Koweït et en Palestine, ainsi que de la domination de leurs entreprises sur nos ressources. Prolonger le mandat de leurs diplomates à Bagdad renforcera nos relations."

  IRQ_on_the_british_side:0 "Du côté [ENG.GetAdjective]"
  IRQ_on_the_british_side_desc:0 "Le sentiment anglophobe et l’instabilité politique pourraient justifier une intervention militaire [ENG.GetAdjective]. Si nous agissons vite, nous pourrions préserver notre indépendance."

  IRQ_friendship_with_turkey:0 "Amitié avec [TUR.GetNameDef]"
  IRQ_friendship_with_turkey_desc:0 "Malgré nos différences politiques, religieuses ou nationales, nous sommes tous des peuples du Moyen-Orient. En sécurisant l’amitié [TUR.GetAdjective], nous pourrions obtenir un puissant allié au Nord."

  IRQ_friendship_with_iran:0 "Amitié avec [PER.GetNameDef]"
  IRQ_friendship_with_iran_desc:0 "Notre jeune pays partage une longue frontière avec [PER.GetNameDef]. Pour sécuriser notre Nord-Est, nous devons d’abord régler le différend sur le Chatt-el-Arab. De bonnes négociations renforceront nos liens déjà solides."

  IRQ_the_sadabat_pact:0 "Le pacte de Saadabad"
  IRQ_the_sadabat_pact_desc:0 "Quatre grandes puissances du Moyen-Orient se réuniront au palais de Saadabad à Téhéran pour discuter des relations régionales. Un pacte de non-agression serait une première étape vers un avenir commun."

  IRQ_build_our_own_diplomacy_instead:0 "Forger notre propre avenir"
  IRQ_build_our_own_diplomacy_instead_desc:0 "Sans soutien extérieur, une nation s’écrase sous la pression des grandes puissances. Pour garantir notre place, nous devons fonder notre propre bloc de puissance."

  IRQ_reform_the_army:0 "Réformer l’armée"
  IRQ_reform_the_army_desc:0 "L’armée est désorganisée et indisciplinée. Adopter une doctrine terrestre spécifique renforcera son efficacité."

  IRQ_arab_industrial_revolution:0 "Révolution industrielle arabe"
  IRQ_arab_industrial_revolution_desc:0 "Avant même que nous puissions industrialiser, les [ENG.GetAdjective] ont établi un mandat restreignant nos pouvoirs. Aujourd’hui, l’heure est venue de bâtir nos propres secteurs industriels massifs."

  IRQ_the_basis_of_the_economy:0 "Les bases de l’économie"
  IRQ_the_basis_of_the_economy_desc:0 "Notre dépendance aux exportations de pétrole oblige nos instituts à développer de nouvelles techniques de raffinage et de transformation."

  IRQ_foreign_industrial_support:0 "Soutien industriel étranger"

  IRQ_modernisation_of_rural_villages:0 "Modernisation des villages ruraux"
  IRQ_modernisation_of_rural_villages_desc:0 "La province désertique d’Al-Hajara regorge de petits villages. Leur modernisation reliera la campagne à notre révolution industrielle."

  IRQ_iraqi_republic_railways:0 "Chemins de fer irakiens"
  IRQ_iraqi_republic_railways_desc:0 "Les Ottomans nous ont laissé un petit réseau ferroviaire, que la compagnie Iraqi Railways a agrandi. En la subventionnant, nous pourrons poursuivre l’expansion du réseau."

  IRQ_total_eletrification:0 "Électrification totale"
  IRQ_total_eletrification_desc:0 "Depuis 1917, seuls les bâtiments gouvernementaux sont électrifiés. L’électrification complète est la prochaine étape vers l’industrialisation."

  IRQ_rapid_industrialization:0 "Industrialisation accélérée"
  IRQ_rapid_industrialization_desc:0 "Alors que les tensions mondiales montent, chaque pays augmente sa capacité industrielle. Nous devons accélérer notre industrialisation, ou être écrasés."

  IRQ_finish_the_railyways:0 "Achever le réseau ferroviaire"
  IRQ_finish_the_railyways_desc:0 "Les IRR ont presque terminé le réseau. Un petit financement supplémentaire suffira pour finaliser les travaux."

  IRQ_rebuild_baghdad:0 "Reconstruire Bagdad"
  IRQ_rebuild_baghdad_desc:0 "Autrefois centre des arts, de la culture et des sciences, Bagdad était aussi la ville la plus peuplée du Moyen-Orient. Il est temps de lui rendre sa gloire passée."

  IRQ_ghazis_propaganda_station:0 "La station de propagande de Ghazi Ier"
  IRQ_ghazis_propaganda_station_desc:0 "Le roi Ghazi Ier utilisait une station de radio pour diffuser ses vues radicales, comme son appel à l’unification de l’Irak et du Koweït."

  IRQ_royal_armament_factories:0 "Usines royales d’armement"
  IRQ_royal_armament_factories_desc:0 "Nous devons créer des usines militaires « royales » pour répondre à la demande croissante d’équipement."

  IRQ_expanded_oil_drilling:0 "Développer l’extraction pétrolière"
  IRQ_expanded_oil_drilling_desc:0 "De grandes quantités de pétrole ont été découvertes près de Kirkouk. Elles peuvent alimenter nos divisions blindées."

  IRQ_mosul_military_stockpile:0 "Dépôt militaire de Mossoul"
  IRQ_mosul_military_stockpile_desc:0 "Un stock d’équipement militaire à Mossoul garantirait nos approvisionnements même si notre capitale tombait."

  IRQ_labor_camps:0 "Industrie d’armement"
  IRQ_labor_camps_desc:0 "Certains chefs militaires préconisent d’intégrer la production d’armement pour en améliorer l’efficacité."

  IRQ_steel_mining:0 "Production d’acier"
  IRQ_steel_mining_desc:0 "L’acier est indispensable à tout équipement militaire. Nous devons en produire sur notre sol pour parer à un blocus maritime."

  IRQ_establish_the_univeristy_of_baghdad:0 "Fonder l’Université de Bagdad"
  IRQ_establish_the_univeristy_of_baghdad_desc:0 "Les collèges de Bagdad existaient déjà, mais n’avaient jamais été réunis en une seule institution. Nous devons les unifier."

  IRQ_create_the_iraqi_block_cipher:0 "Créer le code chiffré irakien"
  IRQ_create_the_iraqi_block_cipher_desc:0 "Puisque de nombreux codes ont déjà été percés, nous devons créer un système de chiffrement unique : le code irakien."

  IRQ_license_cipher_machines:0 "Importer des machines de chiffrement"
  IRQ_license_cipher_machines_desc:0 "En important des machines étrangères, nous pourrions les étudier et développer les nôtres, plus performantes."

  IRQ_design_the_osirak_reactor:0 "Construire le réacteur d’Osirak"
  IRQ_design_the_osirak_reactor_desc:0 "Les [FRA.GetAdjective] veulent lancer des recherches atomiques loin de la guerre. Ils nous proposent un projet commun : le réacteur d’Osirak."

  IRQ_expand_the_univeristy:0 "Étendre les subventions universitaires"
  IRQ_expand_the_univeristy_desc:0 "Accroître le financement des professeurs et chercheurs garantira les innovations de demain."

  IRQ_resolve_the_army_conflict:0 "Résoudre le conflit avec l’armée"
  IRQ_resolve_the_army_conflict_desc:0 "L’armée s’oppose au gouvernement civil. Il faut régler ce conflit au plus vite, avant la guerre civile."

  IRQ_anti_colonialism_policy:0 "Politique anticoloniale"
  IRQ_anti_colonialism_policy_desc:0 "Notre peuple s’oppose depuis longtemps au colonialisme britannique et français. Il est temps qu’il ait un gouvernement qui soutienne cette cause."

  IRQ_demand_persian_gulf_colonies:0 "Revendiquer les colonies du golfe Persique"
  IRQ_demand_persian_gulf_colonies_desc:0 "Première étape de notre politique anticoloniale : chasser les [ENG.GetAdjective] du golfe Persique, où ils bloquent l’accès maritime du monde arabe."

  IRQ_demand_hejazi_liberation:0 "Libérer le Hedjaz"
  IRQ_demand_hejazi_liberation_desc:0 "Les Saoudiens ont pris le Hedjaz à notre dynastie en 1926. Nous devons le reprendre."

  IRQ_demand_french_colonies:0 "Revendiquer les colonies [FRA.GetAdjective]"
  IRQ_demand_french_colonies_desc:0 "Les Français ont pris les terres ottomanes de Syrie et du Liban. Elles appartiennent aux Arabes !"

  IRQ_demand_british_territories:0 "Revendiquer les colonies [ENG.GetAdjective]"
  IRQ_demand_british_territories_desc:0 "Les Britanniques ont pris la Palestine, le Sinaï et la Jordanie. Elles appartiennent aux Arabes !"

  IRQ_demand_cyprus:0 "Revendiquer Chypre"
  IRQ_demand_cyprus_desc:0 "Dernière étape : arracher Chypre aux impérialistes. L’île est une base navale stratégique."

  IRQ_remove_dependency_on_british_equipment:0 "Rompre la dépendance à l’équipement britannique"
  IRQ_remove_dependency_on_british_equipment_desc:0 "Depuis le mandat britannique, nous dépendons de leur matériel. Nous devons produire le nôtre."

  IRQ_motorized_army:0 "Armée motorisée"
  IRQ_motorized_army_desc:0 "Les divisions motorisées sont essentielles dans toute armée moderne. Nous devons suivre le rythme."

  IRQ_study_new_land_doctrines:0 "Étudier de nouvelles doctrines terrestres"
  IRQ_study_new_land_doctrines_desc:0 "L’ère des charges de cavalerie appuyées par des fusils à verrou est révolue. Modernisons nos tactiques pour vaincre."

  IRQ_special_forces_r56:0 "Forces spéciales"
IRQ_special_forces_r56_desc:0 "Contrairement à la Grande Guerre, nous devons planifier de vastes assauts amphibies et des opérations aéroportées. L'armée a suggéré que nous créions des divisions spécialisées pour cela."
IRQ_army_modernisation:0 "Modernisation de l'Armée"
IRQ_army_modernisation_desc:0 "Ceci est l'étape finale de la réorganisation de l'armée. La puissance de notre armée égalera même celle des dieux."
IRQ_study_foreign_tanks:0 "Étudier les Chars Étrangers"
IRQ_study_foreign_tanks_desc:0 "Nous n'avons pas eu beaucoup de temps pour concevoir nos propres chars. Nous devrions rétroconcevoir les chars étrangers afin d'en analyser les forces et faiblesses pour créer de meilleurs modèles."
IRQ_improve_army_logistics:0 "Améliorer la Logistique de l'Armée"
IRQ_improve_army_logistics_desc:0 "Nous devons créer des chars lourds pour percer les lignes ennemies fortement retranchées. Mais sans logistique complète, toute tentative échouerait."
IRQ_cruisers_experiments:0 "Expérimentations de Chars Croiseurs"
IRQ_cruisers_experiments_desc:0 "Les grandes puissances conçoivent de nouveaux chars dits « croiseurs », qui combinent les caractéristiques des chars lourds et légers."
IRQ_optimize_tank_production:0 "Optimiser la Production de Chars"
IRQ_optimize_tank_production_desc:0 "Si nous produisons nos chars en masse, nous devons trouver un moyen de les fabriquer à moindre coût."
IRQ_elte_tank_forces:0 "Forces Blindées d'Élite"
IRQ_elte_tank_forces_desc:0 "Après toutes nos recherches et expérimentations, nous avons enfin trouvé les meilleurs modèles de chars. Il est temps de former nos forces d'élite."
IRQ_unsupported_monarch:0 "Limiter le Pouvoir du Monarque"
IRQ_unsupported_monarch_desc:0 "Le roi Ghazi Ier est un monarque aux ambitions démesurées. Nous devrions répartir notre pouvoir entre différents partis politiques."
IRQ_the_end_of_the_monarchy:0 "Fin de la Monarchie"
IRQ_the_end_of_the_monarchy_desc:0 "L'ère des monarques est révolue. Il est temps qu'il abdique et qu'un représentant du peuple prenne sa place."
IRQ_a_new_kind_of_monarch:0 "Complot Militaire"
IRQ_a_new_kind_of_monarch_desc:0 "Rashid Aali al-Gaylani, nationaliste arabe et actuel ministre de la Justice, serait un parfait remplaçant du roi. Peut-être même un Empereur."
IRQ_officers_coup:0 "Coup d'État des Officiers"
IRQ_officers_coup_desc:0 "Il est temps qu'un gouvernement fort remplace les régimes civils décadents. Peut-être établirons-nous une junte, ou bien confierons-nous le pouvoir à un homme fort. Après tout, ce n'est pas comme si cela allait devenir une habitude dans cette région."
IRQ_political_purification:0 "Purger l'Opposition"
IRQ_political_purification_desc:0 "La première étape pour stabiliser le nouveau régime est de purger le pays et sa direction de toute opposition politique."
IRQ_cult_of_personaility:0 "Culte de la Personnalité"
IRQ_cult_of_personaility_desc:0 "Nous devons consolider l'image du dirigeant et mettre en avant son amour pour le peuple. Il a commandé une ligne complète de propagande, comprenant notamment une statue de lui sur la place Firdos."
IRQ_assyrian_revanchism:0 "Revanchisme Historique"
IRQ_assyrian_revanchism_desc:0 "Notre terre a été le centre de nombreux empires à travers l'Histoire. Un autre renaîtra."
IRQ_algaylani_youth:0 "Jeunesse Al-Gaylani"
IRQ_algaylani_youth_desc:0 "Nous devrions établir notre propre mouvement de jeunesse militaire : la Jeunesse Al-Gaylani."
IRQ_german_military_mission:0 "Mission Militaire [GER.GetAdjective]"
IRQ_german_military_mission_desc:0 "Les [GER.GetAdjective] souhaitent ouvrir des relations diplomatiques avec nous et nous aider à réformer davantage notre armée."
IRQ_establish_the_republican_guard:0 "Établir la Garde Impériale"
IRQ_establish_the_republican_guard_desc:0 "Certains s'opposent encore à notre dirigeant ; ils pourraient tenter de l'assassiner. Pour éviter une telle catastrophe, nous devrions créer une Garde Impériale."
IRQ_proclaim_the_neo_assyrian_empire:0 "Poursuivre une Nouvelle Babylone"
IRQ_proclaim_the_neo_assyrian_empire_desc:0 "Il est temps de reconquérir ce qui nous appartient ! La mobilisation spirituelle de notre nation a déjà commencé. L'armée doit désormais se mobiliser elle aussi."
IRQ_demand_levant:0 "Revendiquer le Levant"
IRQ_demand_levant_desc:0 "La côte méditerranéenne du Moyen-Orient appartenait autrefois aux Assyriens et aux Babyloniens. Nous restaurerons notre domination dans la région, et il sera relativement simple de la revendiquer. Nous partageons de nombreux liens culturels et ethniques avec les peuples syriens et libanais."
IRQ_conquer_saudi:0 "Conquérir la Péninsule Arabique"
IRQ_conquer_saudi_desc:0 "L'Empire assyrien possédait le nord de l'Arabie ; cette fois, nous prendrons tout pour accélérer l'unification du monde arabe et garantir une source constante de pétrole afin de compléter nos immenses réserves actuelles."
IRQ_kurdistan_crisis:0 "La Crise du Kurdistan"
IRQ_kurdistan_crisis_desc:0 "Nous avons secrètement financé les Kurdes [PER.GetAdjective] pour qu'ils se soulèvent et nous rejoignent, en échange d'une autonomie et du droit de refuser la conscription. Les [PER.GetAdjective]s sont maintenant prêts à mobiliser leur armée. Voyons comment ils réagiront."
IRQ_demand_old_turkish_lands:0 "Revendications sur les Anciennes Terres Anatoliennes"
IRQ_demand_old_turkish_lands_desc:0 "Pendant des années, nous avons régné sur ce qui est aujourd'hui l'Anatolie orientale avant que les Sassanides et les Romains ne nous l'arrachent. Il est temps de récupérer l'Anatolie entière comme réparation pour l'humiliation de notre empire."
IRQ_uprising_in_egypt:0 "Soulèvement en Égypte"
IRQ_uprising_in_egypt_desc:0 "Nous pouvons financer un soulèvement en Égypte puis intervenir rapidement pour annexer le pays, prenant ainsi le contrôle du canal de Suez et de nouvelles ressources pétrolières. Nous exploiterons ces routes commerciales au profit de notre empire."
IRQ_assyria_restored:0 "Gloire Impériale"
IRQ_assyria_restored_desc:0 "La Mésopotamie est à nouveau le centre d'un empire. Ô, comme la gloire de Babylone renaît !"
IRQ_royal_road:0 "La Route Royale"
IRQ_royal_road_desc:0 "Autrefois, les Assyriens avaient construit une route royale. Nous devrions la restaurer dans toute sa splendeur et l'utiliser pour améliorer les infrastructures dans notre monde arabe nouvellement unifié. De nombreux monarques ont négligé leur peuple. Nous ne ferons pas cette erreur."
IRQ_workers_revolution:0 "Révolution des Travailleurs"
IRQ_workers_revolution_desc:0 "Travailleurs d'Irak, unissez-vous ! Depuis trop longtemps, nous avons été trahis par le 'Roi'. Il est temps de nous lever, d'écraser les oppresseurs bourgeois et d'unir notre nation sous une seule union socialiste !"
IRQ_socialist_scientists:0 "Science Socialiste"
IRQ_socialist_scientists_desc:0 "Nous pouvons appliquer ce que nous apprenons des expériences naturelles à un cadre social."
IRQ_workers_culture:0 "Culture Ouvrière"
IRQ_workers_culture_desc:0 "Le socialisme n'est pas seulement un système économique, et le marxisme n'est pas seulement une science ; nous devons transformer le tissu même de la société [IRQ.GetAdjective] pour éradiquer toute trace des mœurs et traditions bourgeoises."
IRQ_ministry_of_propaganda:0 "Ministère de la Propagande"
IRQ_ministry_of_propaganda_desc:0 "En établissant un ministère de la propagande, nous pourrons conditionner notre population à croire tout ce que nous voulons."
IRQ_soviet_funding:0 "Financement [SOV.GetAdjective]"
IRQ_soviet_funding_desc:0 "Les [SOV.GetAdjective] ont proposé de financer nos efforts industriels en échange de meilleures relations diplomatiques et commerciales. Une offre convenable."
IRQ_secret_police:0 "Police Secrète"
IRQ_secret_police_desc:0 "Nous devrions établir une police secrète pour écraser toute résistance à la révolution, mais peut-être plus modérée que la NKVD soviétique. Après tout, nous n'avons pas la population nécessaire pour supporter des purges massives."
IRQ_militarized_settlements:0 "Colonies Militarisées"
IRQ_militarized_settlements_desc:0 "Nous devrions intégrer l'enseignement militaire dans les villages du pays pour renforcer le soutien à l'armée et augmenter le recrutement ainsi que la production."
IRQ_join_the_comitern:0 "Rejoindre le Komintern"
IRQ_join_the_comitern_desc:0 "Les [SOV.GetAdjective] ont fondé le Komintern pour unir les communistes et socialistes du monde entier. Nous devrions soutenir leur cause et rejoindre la bannière du Komintern !"
IRQ_the_parition_of_persia:0 "Le Partage de la Perse"
IRQ_the_parition_of_persia_desc:0 "Les [SOV.GetAdjective] prévoient d'envahir le [PER.getNameDef] afin de couper les intérêts pétroliers [ENG.GetAdjective]. Nous devrions aider nos frères [SOV.GetAdjective] et écraser les impérialistes, tout en gagnant quelques terres pour nous-mêmes, bien sûr."
IRQ_operation_sublime_porte:0 "Opération Sublime Porte"
IRQ_operation_sublime_porte_desc:0 "Tout comme les [SOV.GetAdjective], nous avons aussi des intérêts en Turquie. Notre armée a proposé une opération conjointe pour envahir la Turquie, connue sous le nom d'Opération Sublime Porte."
IRQ_the_red_dawn:0 "L'Aube Rouge"
IRQ_the_red_dawn_desc:0 "Notre influence communiste s'est étendue dans tout le Moyen-Orient. L'Aube Rouge commence aujourd'hui."
IRQ_form_the_socialist_union_of_the_mashriq:0 "Former l'Union Socialiste du Machrek"
IRQ_form_the_socialist_union_of_the_mashriq_desc:0 "Les nations communistes du Moyen-Orient n'ont pas leur place avec les pays occidentaux. Nous allons former l'Union Socialiste du Machrek."
IRQ_invite_arabia:0 "Inviter [SAU.GetNameDef]"
IRQ_invite_arabia_desc:0 "Nous devrions inviter [SAU.GetNameDef], la deuxième plus grande nation libre du Moyen-Orient."
IRQ_invite_yemen:0 "Inviter le Yémen"
IRQ_invite_yemen_desc:0 "Nous devrions continuer à élargir notre faction en invitant [YEM.GetNameDef]."
IRQ_invite_oman:0 "Inviter [OMA.GetNameDef]"
IRQ_invite_oman_desc:0 "Nous inviterons [OMA.GetNameDef], la dernière nation arabe libre, comme troisième et dernier membre."
IRQ_assisted_development:0 "Développement Assisté"
IRQ_assisted_development_desc:0 "En examinant l'état du complexe militaro-industriel de nos voisins, il est évident que nous devons aider leur développement, en particulier dans le Golfe où les lacunes sont criantes. Nous devons y remédier."
IRQ_conquer_persia:0 "Abattre le Lion"
IRQ_conquer_persia_desc:0 "Pendant des siècles, les Arabes ont été asservis par les nombreux empires perses. Aujourd'hui, ils rejoindront la République populaire d'Irak et seront unis pour la paix et la prospérité."
IRQ_conquer_turkey:0 "Abattre l'Ancien Ennemi"
IRQ_conquer_turkey_desc:0 "Comme les Perses, les Turcs ont autrefois conquis le Moyen-Orient et opprimé les nations qu'ils ne pouvaient pas détruire. L'Union Socialiste du Machrek leur montrera ce qui arrive aux impérialistes."
IRQ_Mawtini:0 "Mawtini"
IRQ_Mawtini_desc:0 "'Mawtini' est le slogan que notre peuple scande dans les rues. Mawtini signifie 'Ma Patrie' ; nous avons rendu à notre peuple la gloire que mérite sa terre."
IRQ_the_secular_movement:0 "Le Mouvement Laïque"
IRQ_the_secular_movement_desc:0 "Plutôt que de suivre les idéologies autoritaires occidentales, nous devrions adopter la démocratie comme forme de gouvernement, séparant la religion de l'État — un problème qui a miné notre pays pendant des années."
IRQ_foriegn_fighters:0 "Combattants Étrangers"
IRQ_foriegn_fighters_desc:0 "Dans tout le pays, de nombreux citoyens se sont engagés comme combattants étrangers dans les armées de nations démocratiques. Nous devrions soutenir leurs efforts de guerre en créant des divisions de volontaires formalisées."
IRQ_british_embassy:0 "Ambassade [ENG.GetAdjective]"
IRQ_british_embassy_desc:0 "Les [ENG.GetAdjective] appellent toutes les nations démocratiques à lutter contre le rempart du fascisme. Ils souhaitent élargir leurs relations diplomatiques avec nous."
IRQ_sell_oil_to_the_allies:0 "Vendre du Pétrole aux Alliés"
IRQ_sell_oil_to_the_allies_desc:0 "Les Alliés ont besoin de plus de ressources pour soutenir leurs efforts de guerre en Europe. Le pétrole est crucial pour maintenir la machine de guerre alliée."
IRQ_join_the_allies:0 "Rejoindre les Alliés"
IRQ_join_the_allies_desc:0 "Il est temps de rejoindre la lutte contre la menace fasciste et communiste. Nous devrions demander à rejoindre les Alliés."
IRQ_volunteer_corps:0 "Corps de Volontaires"
IRQ_volunteer_corps_desc:0 "Alors que la guerre fait rage en Europe, de plus en plus d'aide est nécessaire pour assurer la victoire de [ENG.GetNameDef] et [FRA.GetNameDef]."
IRQ_allied_support:0 "Soutien des Alliés"
IRQ_allied_support_desc:0 "Après tout ce que nous avons fait pour les Alliés, ils nous rendent maintenant la pareille : une importante force expéditionnaire à Bagdad."
IRQ_a_true_republic:0 "Une Véritable République"
IRQ_a_true_republic_desc:0 "Nous avons enfin prouvé aux nations occidentales que nous sommes une véritable république, après tout ce que nous avons fait pour elles afin de protéger l'avenir de la démocratie."
IRQ_air_base_expansion:0 "Expansion des Bases Aériennes"
IRQ_air_base_expansion_desc:0 "Nous devrions développer nos bases aériennes civiles et militaires si nous voulons dominer les cieux."
IRQ_fighter_modernisation:0 "Modernisation des Chasseurs"
IRQ_fighter_modernisation_desc:0 "Nos vieux chasseurs d'entre-deux-guerres sont inférieurs face aux avions de demain."
IRQ_air_innovations:0 "Innovations Aériennes"
IRQ_air_innovations_desc:0 "Le chef d'état-major a présenté de nouvelles tactiques et formations au cabinet. Nous devons les appliquer pour rester au niveau des autres nations."
IRQ_heavy_fighter_concept:0 "Concept de Chasseur Lourd"
IRQ_heavy_fighter_concept_desc:0 "Si nous sommes contraints de passer à l’offensive, nous aurons besoin d’un nouveau type de chasseur capable d’opérer longtemps en territoire hostile."
IRQ_naval_bomber_experiments:0 "Expérimentations sur les bombardiers navals"
IRQ_naval_bomber_experiments_desc:0 "La suprématie aérienne est aussi vitale en mer que sur terre. Développer des avions spécialisés dans la guerre navale est un moyen d’atteindre cet objectif."
IRQ_medium_bomber_focus:0 "Priorité aux bombardiers moyens"
IRQ_medium_bomber_focus_desc:0 "Une extension de la philosophie du bombardement de précision, adaptée à un rayon d’action accru pour les missions de soutien."
IRQ_light_bomber_focus:0 "Priorité aux bombardiers légers"
IRQ_light_bomber_focus_desc:0 "Nous ne devons pas sous-estimer la valeur des bombardiers en piqué pour l’appui rapproché."
IRQ_air_modernisations_programme:0 "Programme de modernisation aérienne"
IRQ_air_modernisations_programme_desc:0 "La théorie aérienne est tout aussi cruciale que la technologie. De nouveaux stratagèmes pour nos pilotes restent encore à découvrir."
IRQ_rocket_development:0 "Développement des fusées"
IRQ_rocket_development_desc:0 "La vitesse est l’attribut sur lequel reposent tous les autres en matière aérienne. Les moteurs-fusées et à réaction pourraient théoriquement nous permettre de dépasser toutes les limites précédentes."
IRQ_persian_gulf_supremacy:0 "Suprématie dans le golfe Persique"
IRQ_persian_gulf_supremacy_desc:0 "Nous devons créer une marine capable de dominer les mers, en bloquant à la fois les [ENG.GetAdjective] et les [PER.GetAdjective]."
IRQ_study_foreign_built_ships:0 "Étudier les navires étrangers"
IRQ_study_foreign_built_ships_desc:0 "Nos voisins développent continuellement de nouveaux types de navires. Nous devons les acquérir sous licence, les étudier, puis créer des modèles adaptés à nos besoins stratégiques et tactiques."
IRQ_a_cruiser_navy:0 "Une marine de croiseurs"
IRQ_a_cruiser_navy_desc:0 "Nous aurons besoin de navires de plus en plus grands pour concrétiser nos ambitions maritimes."
IRQ_import_submarine_technology:0 "Importer la technologie sous-marine"
IRQ_import_submarine_technology_desc:0 "Un retard sous-marin est inacceptable. Nous obtiendrons la technologie, même si nous devons l’acheter."
IRQ_commerce_attack:0 "Tactiques de guerre de course"
IRQ_commerce_attack_desc:0 "Nous pouvons assurer notre suprématie navale malgré une flotte relativement réduite en paralysant l’ennemi de ses ressources grâce aux sous-marins et aux destroyers légers."
IRQ_the_twin_threats:0 "La double menace"
IRQ_the_twin_threats_desc:0 "Nous garderons l’avantage dans les combats navals en nous concentrant sur les contre-tactiques nécessaires pour opposer nos ennemis les plus probables."
IRQ_coastal_defense:0 "Défense côtière"
IRQ_coastal_defense_desc:0 "Une force navale mobile à courte portée pourrait potentiellement remplir le rôle de fortifications fixes, avec une efficacité bien supérieure."
IRQ_strike_force:0 "Force de frappe"
IRQ_strike_force_desc:0 "Si nous manquons de nombre, nous avons besoin d’une force de guerre navale rapidement déployable, capable de frapper l’ennemi là où il est le plus faible."
IRQ_persian_gulf_navy:0 "Marine du golfe Persique"
IRQ_persian_gulf_navy_desc:0 "Un effort complet pour réinventer notre stratégie navale sera crucial si nous voulons utiliser nos navires dans la mer Rouge."
IRQ_naval_equipment:0 "Équipement naval"
IRQ_naval_equipment_desc:0 "Sans équipement moderne, notre marine deviendra obsolète."

IRQ_adds_new_units_tt:0 "Octroie des unités dans l’État de Bagdad"
IRQ_religious_schism:0 "Schisme religieux"
IRQ_religious_schism_desc:0 "Notre pays a toujours été divisé entre les minorités sunnites et chiites, et si nous ne trouvons pas de solution, cela continuera de gêner et de harceler notre gouvernement."
IRQ_military_conflict:0 "Conflit militaire"
IRQ_military_conflict_desc:0 "Nos généraux actuels s’opposent ouvertement au gouvernement civil."
IRQ_republican_guard:0 "Garde impériale"
IRQ_cult_of_personality:0 "Culte de la personnalité"
IRQ_neo_assyrian_empire_restored:0 "Ferveur impériale"
IRQ_red_dawn:0 "Aube rouge"
IRQ_mawtini:0 "Mawtini"
IRQ_true_republic:0 "Véritable république"
IRQ_british_equipment:0 "Dépendance à l’équipement britannique"
IRQ_invite_foreign_investors:0 "Inviter les investisseurs occidentaux"
IRQ_invite_foreign_investors_desc:0 "Nos immenses gisements pétroliers sont avidement convoités par les étrangers qui cherchent à mettre la main sur l’or noir sous nos pieds. Nous pouvons exploiter ces intérêts et établir une industrie puissante si nous agissons."

IRQ_fascist_oil_nationalization:0 "Nationaliser les champs pétrolifères"
IRQ_fascist_oil_nationalization_desc:0 "La Grande-Bretagne est l’incarnation de l’exploitation capitaliste rapace ! Nous devons prendre notre avenir en main."
IRQ_communist_oil_nationalization:0 "Nationalisation des champs pétrolifères"
IRQ_communist_oil_nationalization_desc:0 "La Grande-Bretagne est l’incarnation de l’exploitation capitaliste rapace ! Nous devons prendre notre avenir en main."
IRQ_opportunistic_oil_nationalization:0 "Nationalisation opportuniste du pétrole"
IRQ_opportunistic_oil_nationalization_desc:0 "Avec la Grande-Bretagne vaincue, nous devons prendre notre avenir en main."
IRQ_tip_the_oil_balance:0 "Renverser l’équilibre pétrolier"
IRQ_tip_the_oil_balance_desc:0 "Notre alignement avec la Grande-Bretagne peut servir de monnaie d’échange afin de récupérer le contrôle d’une partie de notre pétrole."

IRQ_nationalized_oil_fields:0 "@IRQ§Y[IRQ.GetNameDefCap]§! a nationalisé ses champs pétrolifères"
IRQ_oil_concessions:0 "Concessions pétrolières étrangères"

IRQ_ally_the_turkish_communists:0 "Se lier d’amitié avec les Turcs"
IRQ_ally_the_turkish_communists_desc:0 "Tout comme les Turcs ont fait leur propre révolution, il pourrait être utile de s’allier à eux."
IRQ_ally_the_iranian_communists:0 "Se souvenir des Jungles"
IRQ_ally_the_iranian_communists_desc:0 "Tout comme les Iraniens ont fait leur propre révolution, il pourrait être utile de s’allier à eux."

IRQ_assimilate_arabistan:0 "Assimiler l’Arabistan"

r56_iraq.1.t:0 "Mission militaire [GER.GetAdjective]"
r56_iraq.1.d:0 "La montée du fascisme en Irak ouvre une nouvelle porte vers le Moyen-Orient. Il est dans notre intérêt de les préparer à soutenir notre cause."
r56_iraq.1.a:0 "Établissons un programme de recherche militaire conjoint."
r56_iraq.1.b:0 "C’est un gaspillage de nos ressources !"
r56_iraq.2.t:0 "Mission militaire [GER.GetAdjective] : Acceptée"
r56_iraq.2.d:0 "Les [GER.GetAdjective] cherchent à nous aider à progresser militairement dans le monde pour améliorer nos relations diplomatiques."
r56_iraq.2.a:0 "Pour la patrie !"
r56_iraq.3.t:0 "Mission militaire [GER.GetAdjective] : Refusée"
r56_iraq.3.d:0 "Les [GER.GetAdjective] ont refusé notre offre de recherche militaire conjointe."
r56_iraq.3.a:0 "Nous sommes seuls dans ce monde."
r56_iraq.6.t:0 "[IRQ.getNameDefCap] exige le Levant"
r56_iraq.6.d:0 "[IRQ.getNameDefCap] a exigé nos colonies sous mandat au Levant. Que devons-nous faire ?"
r56_iraq.6.a:0 "Nos plans de décolonisation étaient imminents."
r56_iraq.6.b:0 "Nous affronterons les fascistes !"
r56_iraq.7.t:0 "[ENG.GetNameDefCap] refuse nos exigences"
r56_iraq.7.d:0 "Les [ENG.GetAdjective] ont rejeté nos demandes."
r56_iraq.7.a:0 "Nous prendrons ce qui nous revient !"
r56_iraq.8.t:0 "[ENG.GetNameDefCap] a cédé à nos exigences"
r56_iraq.8.d:0 "Les [ENG.GetAdjective] nous ont donné ce que nous voulions et ont totalement cédé sur la question. D’autres gloires nous attendent assurément."
r56_iraq.8.a:0 "Pour l’Empire !"
r56_iraq.9.t:0 "Soulèvement en Égypte"
r56_iraq.9.d:0 "Un soulèvement massif a chassé toutes les garnisons coloniales de la région. Les rebelles souhaitent rejoindre [IRQ.getNameDef] ; que devons-nous faire ?"
r56_iraq.9.a:0 "Donnez aux rebelles ce qu’ils veulent."
r56_iraq.9.b:0 "Nous devons écraser la rébellion !"
r56_iraq.10.t:0 "Les [ENG.GetAdjective] viennent écraser la rébellion"
r56_iraq.10.d:0 "Les [ENG.GetAdjective] ont décidé de reprendre leur colonie."
r56_iraq.10.a:0 "Nous défendrons l’Égypte jusqu’au dernier homme !"
r56_iraq.11.t:0 "Les [ENG.GetAdjective] nous laissent l’Égypte"
r56_iraq.11.d:0 "Les [ENG.GetAdjective] ont laissé le peuple égyptien entre nos mains."
r56_iraq.11.a:0 "Un pas de plus vers la restauration."
r56_iraq.12.t:0 "[IRQ.GetNameDefCap] exige le Koweït et Abou Dhabi"
r56_iraq.12.d:0 "[IRQ.GetNameDefCap] a exigé les colonies du Koweït et d’Abou Dhabi ; que devons-nous faire ?"
r56_iraq.12.a:0 "Cédez les colonies."
r56_iraq.12.b:0 "Défendons nos colonies."
r56_iraq.15.t:0 "Les [ENG.GetAdjective] ont rejeté nos revendications"
r56_iraq.15.d:0 "Les [ENG.GetAdjective] conservent leurs colonies."
r56_iraq.15.a:0 "Les colonies du golfe appartiennent aux Arabes !"
r56_iraq.14.t:0 "[IRQ.GetNameDefCap] occupe le Koweït et Abou Dhabi"
r56_iraq.14.d:0 "Nous avons occupé les colonies."
r56_iraq.14.a:0 "La première étape pour chasser les puissances coloniales du Moyen-Orient."
r56_iraq.17.t:0 "[IRQ.GetNameDefCap] exige la Syrie et le Liban"
r56_iraq.17.d:0 "[IRQ.GetNameDefCap] a exigé les colonies de Syrie et du Liban ; que devons-nous faire ?"
r56_iraq.17.a:0 "Cédez les colonies."
r56_iraq.17.b:0 "Défendons nos colonies."
r56_iraq.19.t:0 "[FRA.GetnameDefCap] accepte notre exigence"
r56_iraq.19.d:0 "Les [FRA.GetAdjective] ont enfin été chassés du Moyen-Orient. Nous veillerons à ce que leur sphère d’influence ne s’y étende plus jamais."
r56_iraq.19.a:0 "Accueillons nos frères perdus depuis longtemps !"
r56_iraq.18.t:0 "[FRA.GetnameDefCap] prépare ses défenses"
r56_iraq.18.d:0 "Les [FRA.GetAdjective] ont refusé notre ultimatum. Ils se préparent à la guerre..."
r56_iraq.18.a:0 "Et la guerre, ils l’auront !"
r56_iraq.20.t:0 "[IRQ.GetNameDefCap] exige Chypre"
r56_iraq.20.d:0 "[IRQ.GetNameDefCap] a exigé la colonie de Chypre ; que devons-nous faire ?"
r56_iraq.20.a:0 "Cédez la colonie."
r56_iraq.20.b:0 "Défendons notre colonie."
r56_iraq.22.t:0 "[IRQ.GetNameDefCap] annexe Chypre"
r56_iraq.22.d:0 "L’île de Chypre a été libérée de l’emprise des [ENG.GetAdjective]."
r56_iraq.22.a:0 "Nous sommes enfin libres !"
r56_iraq.21.t:0 "Les Britanniques conservent Chypre"
r56_iraq.21.d:0 "Les Britanniques ont refusé de céder Chypre."
r56_iraq.21.a:0 "Ils le regretteront."
r56_iraq.26.t:0 "Le roi Ghazi meurt dans un accident de voiture"
r56_iraq.26.d:0 "Le roi est mort de ses blessures après que son chauffeur a perdu le contrôle du véhicule. L’avenir de la monarchie repose désormais entre les mains du prince Abd al-Ilah jusqu’à la majorité du roi Fayçal."
r56_iraq.26.a:0 "Une tragédie nationale."
r56_iraq.27.t:0 "La régence prend fin"
r56_iraq.27.d:0 "Après des années de régence, Fayçal II a été proclamé assez âgé pour régner et diriger officiellement la branche [IRQ.GetAdjective] de la dynastie hachémite."
r56_iraq.27.a:0 "Ainsi va le temps."

r56_iraq_faction.1.t:0 "[IRQ.GetnameDefCap] nous invite dans sa faction"
r56_iraq_faction.1.d:0 "[IRQ.GetnameDefCap] nous a invités à rejoindre sa faction."
r56_iraq_faction.1.a:0 "En ces temps incertains, nous avons besoin d’alliés."
r56_iraq_faction.1.b:0 "Nous refusons de travailler avec nos ennemis idéologiques !"
r56_iraq_faction.2.t:0 "[SAU.GetNameDefCap] accepte"
r56_iraq_faction.2.d:0 "[SAU.GetNameDefCap] a accepté notre invitation."
r56_iraq_faction.2.a:0 "Bienvenue, frère !"
r56_iraq_faction.3.t:0 "[SAU.GetNameDefCap] refuse"
r56_iraq_faction.3.d:0 "[SAU.GetNameDefCap] a décliné notre invitation."
r56_iraq_faction.3.a:0 "Ils ont déjà oublié qui sont leurs vrais frères."
r56_iraq_faction.4.t:0 "[IRQ.GetnameDefCap] nous invite dans sa faction"
r56_iraq_faction.4.d:0 "[IRQ.GetnameDefCap] nous invite dans sa faction."
r56_iraq_faction.4.a:0 "En ces temps incertains, nous avons besoin d’alliés."
r56_iraq_faction.4.b:0 "Nous refusons de travailler avec nos ennemis idéologiques !"
r56_iraq_faction.5.t:0 "[OMA.GetNameDefCap] accepte"
r56_iraq_faction.5.d:0 "[OMA.GetNameDefCap] a accepté notre invitation."
r56_iraq_faction.5.a:0 "Nous avons réalisé l’unification !"
r56_iraq_faction.6.t:0 "[OMA.GetNameDefCap] refuse"
r56_iraq_faction.6.d:0 "[OMA.GetNameDefCap] a décliné notre invitation."
r56_iraq_faction.6.a:0 "C’est inacceptable !"
r56_iraq_faction.7.t:0 "[IRQ.GetnameDefCap] nous invite dans sa faction"
r56_iraq_faction.7.d:0 "[IRQ.GetnameDefCap] nous invite dans sa faction."
r56_iraq_faction.7.a:0 "En ces temps incertains, nous avons besoin d’alliés."
r56_iraq_faction.7.b:0 "Nous refusons de travailler avec nos ennemis idéologiques !"
r56_iraq_faction.8.t:0 "[YEM.GetNameDefCap] accepte"
r56_iraq_faction.8.d:0 "[YEM.GetNameDefCap] a accepté notre invitation."
r56_iraq_faction.8.a:0 "Le communisme triomphera !"
r56_iraq_faction.9.t:0 "[YEM.GetNameDefCap] refuse"
r56_iraq_faction.9.d:0 "[YEM.GetNameDefCap] a décliné notre invitation."
r56_iraq_faction.9.a:0 "C’est inacceptable !"
r56_iraq_faction.10.t:0 "[IRQ.GetNameDefCap] demande à rejoindre les Alliés"
r56_iraq_faction.10.d:0 "[IRQ.GetNameDefCap] souhaite rejoindre notre faction."
r56_iraq_faction.10.a:0 "En ces temps incertains, nous avons besoin d’alliés."
r56_iraq_faction.10.b:0 "[IRQ.GetNameDefCap] ne peut rien apporter à notre effort de guerre."
r56_iraq_faction.11.t:0 "[IRQ.GetNameDefCap] demande à rejoindre le Komintern"
r56_iraq_faction.11.d:0 "[IRQ.GetNameDefCap] souhaite rejoindre notre faction."
r56_iraq_faction.11.a:0 "En ces temps incertains, nous avons besoin d’alliés."
r56_iraq_faction.11.b:0 "[IRQ.GetNameDefCap] ne peut rien apporter à notre effort de guerre."

### Nouveaux événements

IRQ_historical_golden_square_coup:0 "Le §YCarré d’Or§! a renversé le gouvernement."
IRQ_british_occupation_flag:0 "Les §Y[ENG.GetAdjective]§! ont occupé le pays."
IRQ_golden_square_coup_succeeded:0 "Le coup d’État du §YCarré d’Or§! a réussi."
IRQ_golden_square_coup_failed:0 "Le coup d’État du §YCarré d’Or§! a échoué."
IRQ_golden_square_defense_government_idea:0 "Gouvernement national de défense du Carré d’Or"
IRQ_golden_square_defense_government_idea_2:0 "Occupation militaire britannique"
IRQ_british_occupation_diplo_tt:0 "Ne peut pas être appelé ou rejoindre la guerre en raison des restrictions imposées par les autorités britanniques."

iraq_hist.1.t:0 "Le Carré d’Or lance un coup d’État !"
iraq_hist.1.desc:0 "Les menaces de l’organisation fasciste d’officiers connue sous le nom d’Al-Murabbaʿ al-Dhahabi (le Carré d’Or) se sont accrues depuis la mort de notre roi Ghazi Ier et la régence de [IRQ.GetLeader]. Le « carré » lui-même se compose du colonel Salah al-Din al-Sabbagh, du colonel Kamil Shabib, du colonel Fahmi Said et du colonel Mahmud Salman. Ces officiers militent pour une prise de pouvoir nationaliste et l’installation de Rachid Ali al-Gaylani à la tête de [IRQ.GetName].\n\nAujourd’hui, ces figures ont lancé leur complot. Les unités armées d’al-Sabbagh avancent pour sécuriser le palais royal et les points stratégiques de Bagdad. Le temps presse pour écraser ce coup d’État avant qu’il ne réussisse."
iraq_hist.1.a:0 "La cause des comploteurs est juste, rallions-les."
iraq_hist.1.b:0 "Déployez l’armée pour mettre fin à ces absurdités !"

iraq_hist.2.t:0 "Le Carré d’Or prend le pouvoir en Irak !"
iraq_hist.2.desc:0 "Une organisation d’officiers nationalistes a réussi à mener un coup d’État en [IRQ.GetNameDef], renversant le régent du jeune roi Fayçal II. Rachid Ali al-Gaylani devient le nouveau chef du gouvernement, une figure farouchement nationaliste arabe. Le nouveau gouvernement national de défense du Carré d’Or s’est retourné contre les Britanniques et chercherait à obtenir l’aide de [GER.GetNameDef] pour résister à une probable invasion britannique.\n\nCe changement d’alignement géopolitique risque d’amener la guerre au Moyen-Orient."
iraq_hist.2.a:0 "Nous devons sécuriser notre position stratégique !"
iraq_hist.2.b:0 "Ainsi va le monde."
iraq_hist.2.c:0 "Organisons immédiatement l’aide à nos collègues [IRQ.GetAdjective] !"
iraq_hist.2.d:0 "Envoyons-leur nos meilleurs vœux, mais restons ambivalents."

iraq_hist.3.t:0 "[ENG.GetNameDefCap] envahit l’Irak !"
iraq_hist.3.desc:0 "Après le coup d’État militaire nationaliste du mois dernier, mené par le groupe d’officiers connu sous le nom de Carré d’Or, [ENG.GetLeader] a ordonné l’invasion de l’Irak par les forces britanniques. Leur objectif est de renverser le gouvernement nationaliste de [IRQ.GetLeader] et de restaurer la monarchie hachémite et son régent, figures pro-occidentales du pays. Cela fait suite aux provocations [IRQ.GetAdjective] à la base aérienne RAF Habbaniya, encerclée par leurs forces.\n\nLes responsables irakiens ont accusé les Britanniques de violer le traité anglo-irakien de 1930, tandis que les diplomates britanniques ont dénoncé l’influence de [GER.GetFactionName] en Irak et fustigé [IRQ.GetLeader] ainsi que ses alliés nationalistes arabes."
iraq_hist.3.a:0 "La guerre vient aux Arabes."

iraq_hist.4.t:0 "[FROM.GetNameDefCap] envoie du matériel"
iraq_hist.4.desc:0 "Dans notre lutte à venir contre les impérialistes britanniques, [FROM.GetNameDef] a envoyé un soutien sous la forme d’un envoi d’armes légères. Ce n’est pas grand-chose, mais une aide précieuse contre l’agresseur !"
iraq_hist.4.a:0 "Nos remerciements à [FROM.GetNameDef]"

iraq_hist.5.t:0 "La chute de [IRQ.GetNameDef]"
iraq_hist.5.desc:0 "Les forces britanniques ont rapidement exécuté leur plan d’invasion de l’Irak et, ces derniers jours, ont pris la capitale Bagdad, forçant [IRQ.GetLeader], le grand mufti Amin al-Husseini et de nombreux membres du gouvernement du Carré d’Or à fuir vers [PER.GetNameDef], avant de projeter de rejoindre l’Allemagne.\n\nAvec l’État irakien totalement à la dérive, les Britanniques nous ont transmis une offre de paix. Le jeune roi Fayçal II et son régent le prince Abd al-Ilah seront rétablis, et les forces du Commonwealth obtiendront le libre passage dans le pays ainsi que le droit d’y renforcer leur garnison."
iraq_hist.5.a:0 "Nous acceptons."
iraq_hist.5.b:0 "Pas d’accord avec les impérialistes ! Nous rejoindrons [GER.GetNameDef]."

iraq_hist.6.t:0 "Provocations irakiennes à la RAF Habbaniya !"
iraq_hist.6.desc:0 "Un émissaire représentant [IRQ.GetNameDef] a informé le commandant de la base aérienne de la RAF Habbaniya que le plateau voisin a été occupé pour mener un « exercice d’entraînement ». L’envoyé a également exigé que tout vol cesse immédiatement et qu’aucun mouvement, terrestre ou aérien, n’ait lieu depuis la base. Cela a été interprété comme une menace directe."
iraq_hist.6.a:0 "Nous devons répondre par la force !"
iraq_hist.6.b:0 "Retirez-vous de la base, notre position est compromise."

