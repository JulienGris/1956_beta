l_french:

 ################################################
 focus_event.0.t:0 "Configuration des objectifs continus"
 focus_event.0.d:0 "Bonjour ! Ici CrouchingLemur, créateur du mod « New Continuous Focuses ». Ici, vous pouvez décider si la main-d’œuvre/usines/ressources sont ajoutées par des événements. Cela affectera toutes les nations du monde, y compris celles contrôlées par l’IA. Si vous souhaitez modifier ce paramètre plus tard, vous devrez utiliser cette commande console : event focus_event.0"
 focus_event.0.a:0 "ACTIVER les événements déclenchés par les nouveaux objectifs continus."
 focus_event.0.b:0 "DÉSACTIVER les événements déclenchés par les nouveaux objectifs continus."
 ################################################
 population_growth_i: "Politiques agressives de croissance démographique"
 construction_effort_i: "Développement de l’industrie lourde"
 excavation_effort_i: "Intensifier l’extraction des ressources"
 the_project_i: "Le Projet"
 #################################################
 population_growth_i_desc: "Nous allons améliorer les conditions de vie dans notre pays. Cela augmentera notre croissance démographique et attirera des immigrés tous les quelques dizaines de jours."
 population_growth_ii_desc: "Nous allons encore davantage améliorer les conditions de vie dans notre pays. Cela augmentera considérablement notre croissance démographique et attirera encore plus d’immigrés tous les quelques dizaines de jours."
 construction_effort_i_desc: "Nous allons former des équipes de construction spécialisées axées sur le développement de notre industrie lourde. Cela augmentera la vitesse de construction des usines civiles et des fonderies."
 excavation_effort_i_desc: "Nous allons former des équipes d’excavation spécialisées qui amélioreront notre production de ressources et pourront même parfois découvrir de nouveaux petits gisements."
 the_project_i_desc: "Nous concentrerons davantage d’efforts sur nos projets spéciaux."
 ##################################################
 focus_event.1.t: "Afflux récent d’immigrés"
 focus_event.1.d: "Les politiques récentes et les bonnes conditions de vie au sein de [ROOT.Getname] ont entraîné un afflux d’immigrés. Ils s’installent désormais sur notre territoire. [ROOT.Getleader] a commenté que cela prouvait que les politiques destinées à accroître la population de la nation fonctionnent comme prévu."
 focus_event.1.a: "Excellente nouvelle !"

 focus_event.2.t: "Nombreux immigrés arrivés"
 focus_event.2.d: "Les bonnes conditions de vie dans notre pays ont attiré de nombreuses personnes venant d’autres pays. Elles s’installent désormais sur notre territoire."
 focus_event.2.a:0 "Bonne nouvelle."

 focus_event.3.t: "Usine civile supplémentaire"
 focus_event.3.d: "Nos équipes de construction spécialisées ont réussi à bâtir une usine civile pour nous."
 focus_event.3.a:0 "Bonne nouvelle."

 focus_event.4.t: "2 usines civiles supplémentaires"
 focus_event.4.d: "Nos équipes de construction spécialisées ont réussi à bâtir 2 usines civiles pour nous."
 focus_event.4.a:0 "Bonne nouvelle."

 focus_event.5.t: "Usine militaire supplémentaire"
 focus_event.5.d: "Nos équipes de construction spécialisées ont réussi à bâtir une usine militaire pour nous."
 focus_event.5.a:0 "Bonne nouvelle."

 focus_event.6.t: "2 usines militaires supplémentaires"
 focus_event.6.d: "Nos équipes de construction spécialisées ont réussi à bâtir 2 usines militaires pour nous."
 focus_event.6.a:0 "Bonne nouvelle."

 focus_event.7.t: "Ressources découvertes"
 focus_event.7.d: "Nos équipes d’excavation ont découvert un nouveau petit gisement de ressources dans notre pays."
 focus_event.7.a:0 "Bonne nouvelle."

 focus_event.8.t: "Ressources découvertes"
 focus_event.8.d: "Nos équipes d’excavation ont découvert un nouveau gisement de ressources dans notre pays."
 focus_event.8.a:0 "Bonne nouvelle."

 focus_event.9.t: "Petite découverte en guerre terrestre"
 focus_event.9.d: "Nos efforts pour moderniser l’armée ont porté leurs fruits. Nous avons fait une découverte concernant la guerre terrestre. Nous pouvons soit l’utiliser pour améliorer nos modèles de divisions et notre équipement existant, soit pour accélérer la recherche de nouvelles technologies."
 focus_event.9.a:0 "Nous devrions nous concentrer sur la recherche de nouvelles technologies."
 focus_event.9.b:0 "Concentrons-nous sur ce que nous avons déjà."

 focus_event.10.t: "Grande découverte en guerre terrestre"
 focus_event.10.d: "Nos efforts pour moderniser l’armée ont porté leurs fruits. Nous avons fait une découverte concernant la guerre terrestre. Nous pouvons soit l’utiliser pour améliorer nos modèles de divisions et notre équipement existant, soit pour accélérer la recherche de nouvelles technologies."
