 nepal.1.t:0 "[ENG.GetNameDefCap] est entré en guerre"
 nepal.1.d:0 "Il y a quelques jours, une nouvelle guerre a éclaté en Europe, et peut-être dans le monde entier ! L’issue de ce qui sera appelé « la Grande Guerre ». Le [ROOT.GetNameDefCap] a des raisons de soutenir [ENG.GetNameDef] et, d’une certaine manière, y est obligé par le traité népal-britannique de 1923, selon lequel nos deux nations reconnaissent mutuellement leur souveraineté et s’engagent à la protéger."
 nepal.1.a:0 "Nous devons aider nos alliés. Déclarons la guerre immédiatement !"
 nepal.1.b:0 "Les intérêts nationaux du Népal passent avant tout..."
