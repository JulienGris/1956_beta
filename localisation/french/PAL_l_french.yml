PAL_liberal_conservative_category:0 "La question religieuse"
PAL_liberal_conservative_category_desc:0 "Avec la formation de notre nouvel État démocratique et égalitaire, subsiste encore la question du rôle de la religion dans le gouvernement.\n\nNotre parti compte deux principaux courants – l’aile libérale, qui s’oppose à l’intervention religieuse dans l’État et croit en un pays plus laïc et pluraliste, et l’aile conservatrice, qui considère que l’islam est encore la religion de la nation et doit être promu par l’État.\n\nChacune de ces politiques pourrait apporter de nombreux avantages, mais aussi certains inconvénients.\n\nFavoriser directement un camp ou l’autre affecte l’esprit national §YDivision libéraux-conservateurs§!."

PAL_atheist_religious_category:0 "La question religieuse"
PAL_atheist_religious_category_desc:0 "Avec la formation de notre grande république socialiste, subsiste encore la question du rôle de la religion dans notre société.\n\nAvec une population majoritairement musulmane mais un gouvernement marxiste radical, nationaliste arabe, promouvant une société athée et opprimant la majorité religieuse, notre gouvernement pourrait gagner plus de pouvoir politique et en construction, car cette société croirait en tous les moyens nécessaires. Cependant, cela pourrait aussi provoquer de grands troubles parmi la population et des mutineries dans l’armée, car beaucoup de nos partisans croient encore en l’importance de la religion.\n\nChacune de ces politiques pourrait apporter des avantages, mais aussi des inconvénients.\n\nFavoriser directement un camp ou l’autre affecte l’esprit national §YDilemme islamique§!."

