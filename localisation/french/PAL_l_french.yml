 PAL_Purchase_Ships_desc:0 ""
 PAL_Dockyards:0 "Étendre les installations navales"
 PAL_Dockyards_desc:0 "Pour construire une véritable marine, nous devons agrandir nos chantiers navals le long de nos nouvelles côtes."
 PAL_Carrier:0 "Priorité aux porte-avions"
 PAL_Carrier_desc:0 "Un nouveau prototype de porte-avions est en cours de développement par notre Bureau naval."
 PAL_Navy_Aircrafts:0 "Modèles d’avions embarqués"
 PAL_Navy_Aircrafts_desc:0 "Un porte-avions sans avions n’est qu’une boîte de métal flottant sur l’océan. L’équiper de nouveaux bombardiers navals prendra du temps, mais l’investissement en vaut la peine."
 PAL_Battleship:0 "Priorité aux cuirassés"
 PAL_Battleship_desc:0 "Un nouveau croiseur de bataille étincelant sera construit avec nos plans récemment développés. Que nos ennemis sachent que nous avons le Feu et la Fureur des mers !"
 PAL_Destroyer:0 "Priorité aux destroyers"
 PAL_Destroyer_desc:0 "Les navires lourds sont particulièrement vulnérables aux attaques de torpilles. Améliorer et construire des destroyers réglera ce problème."
 PAL_Cruisers:0 "Priorité aux croiseurs"
 PAL_Cruisers_desc:0 "Bien qu’il ne soit pas aussi puissant qu’un cuirassé ou un porte-avions, le croiseur lourd est un excellent ajout à notre puissance de feu navale, nécessitant toutefois un financement supplémentaire."
 PAL_Naval_Doctrine:0 "Améliorer la doctrine navale"
 PAL_Naval_Doctrine_desc:0 "De nouveaux navires seront inutiles sans tactiques adaptées. Nous devons améliorer notre doctrine immédiatement !"

