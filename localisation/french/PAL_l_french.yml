# EVENTS ---
palestine.61.t:0 "Victoire !"
palestine.61.d:0 "Après une glorieuse campagne menée contre les forces sionistes israéliennes, les forces palestiniennes unies ont réussi à les repousser ! Avec la chute de Tel-Aviv, le dernier bastion de l’indépendance israélienne, la Palestine est enfin libre. Mais notre nation reste divisée, et son avenir est incertain."
palestine.61.a:0 "Allahu Akbar !"

palestine.1.t:0 "Opération Intisar"
palestine.1.d:0 "Après plusieurs victoires politiques contre la dictature nationaliste à tendance fasciste, grâce au rapprochement avec les Frères musulmans et à la marche d’Al-Aqsa, nous avons enfin trouvé une ouverture dans le système politique. Une opération fut lancée où deux agents des Frères musulmans aidèrent nos insurgés à attaquer le bâtiment parlementaire de Ramallah, permettant de porter le Grand Mufti Amin Al-Husseini au pouvoir."
palestine.1.a:0 "Ils complotent, et Allah complote, et Allah est le meilleur des comploteurs."

palestine.58.t:0 "Élections imminentes"
palestine.58.d:0 "Après l’annonce officielle des élections pour le président du Conseil, les oulémas se sont réunis afin d’élire un gardien de la première qibla du prophète, et le Calife de Filistîn. De nombreux clans se sont présentés mais la principale rivalité oppose les clans Husayni et Nashashbi. Les Nashashbi prônent les droits civiques et mettent l’accent sur la Sunna, tandis que les Husayni sont des partisans intransigeants de la charia et vénèrent les anciens califes Umar Ibn Khattab et Uthman Ibn Affan. Le résultat sera décidé dans 35 jours."
palestine.58.a:0 "Nous souhaitons bonne chance aux deux clans."

palestine.59.t:0 "Résultats des élections"
palestine.59.d:0 "À la suite des élections organisées par les oulémas et le Majlis, les résultats ont été annoncés au public. De justesse, le vainqueur de la première élection du président du Majlis est…"
palestine.59.a:0 "Hussam Al-Din Jarallah"
palestine.59.b:0 "Amin Al-Husseini"

palestine.60.t:0 "Husam s’inquiète de l’islamisme radical"
palestine.60.d:0 "Husam Al-Din Jarallah, récemment élu président de Al Majlis Al Islami Al Filastini et chef de notre grand califat, s’est montré préoccupé par la manière dont la charia, les lois coraniques et les enseignements des hadiths sont appliqués. \n \n Il pense que nos lois actuelles s’éloignent de celles des véritables califats, et a souligné la différence entre le califat précoce d’Umar Al-Khattab et notre situation actuelle. Cela pourrait déstabiliser notre nation, mais ses inquiétudes sont-elles fondées ?"
palestine.60.a:0 "Il a raison."
palestine.60.b:0 "N’importe quoi ! Il est juste trop faible."

palestine.62.t:0 "Jarallah abolit le radicalisme"
palestine.62.d:0 "Le président Hussam Al-Din Jarallah du Conseil islamique palestinien, après de multiples critiques contre la gestion de la charia et des lois par notre gouvernement, a finalement décidé d’agir contre la vision radicale de l’islam. \n \n Il a desserré l’étau imposé par l’ancien régime radical, suivant les paroles du prophète sans pencher ni vers le libéralisme ni vers le radicalisme. La qualité de vie, notamment pour les femmes, s’est améliorée, puisqu’il n’est plus exigé qu’elles portent un voile intégral, le hijab étant désormais obligatoire."
palestine.62.a:0 "Allahu Akbar !"

palestine.63.t:0 "Coup d’État fasciste"
palestine.63.d:0 "Après que Husam Al-Din Jarallah ait été écarté en raison de son mécontentement face à la gestion actuelle, le général Hasan Salama a rassemblé ses hommes et a marché sur le Conseil islamique, plaçant le bâtiment en état de siège tandis que ses troupes s’emparaient des autres institutions gouvernementales."
palestine.63.a:0 "Qu’Allah nous sauve."

palestine.2.t:0 "Victoire dans le Caucase"
palestine.2.d:0 "Après une récente opération frontalière lancée par notre haut commandement, notre armée est partie de l’Azerbaïdjan persan vers le nord de l’Azerbaïdjan, et nous avons remporté la victoire."
palestine.2.a:0 "Allahu Akbar !"

palestine.3.t:0 "Défaite dans le Caucase"
palestine.3.d:0 "Après avoir lancé une escarmouche dans le nord de l’Azerbaïdjan, les forces soviétiques, mieux équipées et expérimentées, ont réussi à nous contourner et ont capturé le nord de la Perse."
palestine.3.a:0 "C’est Lui, le Tout-Puissant, qui décide de l’issue des batailles."

palestine.4.t:0 "Victoire dans le Caucase"
palestine.4.d:0 "Après une opération lancée depuis le nord de la Perse en direction de l’Azerbaïdjan par le haut commandement palestinien, nos forces ont réussi à repousser l’ennemi. Cela a consolidé notre position dans le Caucase."
palestine.4.a:0 "Excellent."

palestine.5.t:0 "Défaite dans le Caucase"
palestine.5.d:0 "Après l’escalade d’une escarmouche frontalière entre notre haut commandement palestinien et les officiers soviétiques, nous avons été pris de vitesse par le califat, et nous avons perdu les terres d’Azerbaïdjan et d’Arménie. Cependant, nous avons tiré des leçons précieuses du terrain."
palestine.5.a:0 "Quelqu’un paiera pour ça !"

palestine.6.t:0 "Conférence du Haut Comité arabe"
palestine.6.d:0 "Alors que notre jeune nation célèbre la victoire contre les envahisseurs sionistes, nous sommes tombés sous une dictature nationaliste basée sur un État policier. Le peuple palestinien a donc réclamé une conférence du Haut Comité arabe, réunissant les familles Husseini et Nashashbi, ainsi que d’autres factions mineures dont la nouvelle Ligue de libération nationale et le Conseil musulman suprême. \nÀ la clôture de la conférence, la faction la plus influente fut…"
palestine.6.a:0 "La Ligue de libération nationale, dirigée par Radwan Al-Hilu et Amer Mukhlis"
palestine.6.b:0 "Le Parti arabe palestinien, dirigé par Raghib Nashashbi et Jamal Al-Husseini"

palestine.7.t:0 "Jamal Al-Husseini revendique le boycott"
palestine.7.d:0 "Le récent décret de boycott, résultat des efforts conjoints du Conseil musulman suprême et de la famille Nashashbi contre la dictature nationaliste autoritaire, a mis le gouvernement en difficulté et redonné espoir au peuple palestinien. Mais Jamal Al-Husseini du Conseil musulman suprême est allé publiquement revendiquer la responsabilité du décret, portant un coup à l’influence des Nashashbi dans cette nouvelle rébellion."
palestine.7.a:0 "Aqidah ! Fiqh ! Akhlaq !"

palestine.8.t:0 "Les civils prennent les armes"
palestine.8.d:0 "À la suite de l’escalade du décret de boycott par Jamal Al-Husseini, et après sa revendication totale, des militants de la liberté favorables à une démocratie islamiste se sont soulevés dans tout le pays, de Hébron à Khan Younès, contre le gouvernement nationaliste. Cela pourrait dégénérer en une véritable guerre civile si nous ne gérons pas la situation."
palestine.8.a:0 "Shura ! Ijma ! Al-Hurriya !"

palestine.9.t:0 "Le CMS prend le pouvoir"
palestine.9.d:0 "Après que les musulmans de toute la Palestine se soient soulevés contre la dictature autoritaire de Fawzi Al-Qawuqji, la police est devenue plus paranoïaque que jamais, ce qui a entraîné fusillades et massacres. Alors que la Palestine semblait au bord de l’effondrement, Jamal Al-Husseini a manœuvré habilement et a orchestré un coup d’État sans effusion de sang en s’emparant simplement des hôtels où résidaient de nombreux responsables, leurs gardes étant trop démoralisés pour résister."
palestine.9.a:0 "Allah ! Al-Nabi ! Al-Watan !"

palestine.10.t:0 "Raghib Nashashbi revendique le boycott"
palestine.10.d:0 "Le récent décret de boycott, fruit de la coopération entre le Conseil musulman suprême et la famille Nashashbi contre la dictature nationaliste autoritaire, a mis le gouvernement en difficulté et redonné espoir au peuple palestinien. Raghib Nashashbi, de la famille Nashashbi, a revendiqué publiquement la responsabilité du décret, une victoire pour le libéralisme."
palestine.10.a:0 "Hurriyatul Sha’ab !"

palestine.11.t:0 "La marche vers Naplouse"
palestine.11.d:0 "Peu de temps après que Raghib Nashashbi ait revendiqué le décret de boycott, des centaines de Palestiniens de Cisjordanie ont commencé à marcher vers les bâtiments gouvernementaux de Naplouse dans un acte de protestation pacifique. Cela a provoqué l’hystérie et la paranoïa chez le parti nationaliste au pouvoir, mais semble être une grande victoire politique pour Raghib."
palestine.11.a:0 "Al-Musawa !"

palestine.12.t:0 "Les gardes ouvrent le feu"
palestine.12.d:0 "Alors que les manifestants, hommes, femmes et enfants, poursuivaient leur marche pacifique vers Naplouse pour défier cet État autoritaire et nationaliste, leur nombre a fini par submerger les gardes postés devant le parlement. Pris de panique, et sans instructions du haut commandement, les gardes ont tiré."
palestine.12.a:0 "Al-Fida’ !"

palestine.13.t:0 "Coup d’État des Nashashbi"
palestine.13.d:0 "Le massacre de Naplouse fut la goutte d’eau pour le peuple palestinien. Conservateurs, libéraux et socialistes ont exprimé leur rejet du gouvernement. Raghib Nashashbi avait tout planifié : des unités de police ont rallié la cause, et Fawzi Al-Qawuqji, croyant qu’il serait exécuté, a fui le pays, laissant la famille Nashashbi prendre entièrement le contrôle de l’État."
palestine.13.a:0 "Al-Huquq !"

palestine.14.t:0 "Raghib Nashashbi forme l’opposition Hurriyah"
palestine.14.d:0 "Raghib Nashashbi, le pendant libéral de Jamal Al-Husseini, a récemment décidé de former le groupe d’opposition ‘Hurriyah’ ou ‘Liberté’, alors que la famille Nashashbi tente de garder le pouvoir et de rester pertinente. Cela a accru la popularité du libéralisme et plusieurs socialistes ont rejoint leur bannière, affirmant que nous sommes des marionnettes de la famille Husseini."
palestine.14.a:0 "Ils ont de la chance qu’on les laisse exister."

palestine.15.t:0 "Le roi Zeid prend le pouvoir"
palestine.15.d:0 "Nos diplomates ont récemment approché le prince Zeid bin Hussein de la maison de Hachîm. Des réunions ont eu lieu pour définir son rôle et son règne sur le nouveau royaume hachémite de Palestine, Abdul-Qadir étant très favorable à la famille hachémite et à l’idée d’un roi hachémite en Palestine.\n\nAlors que l’armée souhaitait que le roi soit strictement constitutionnel, Abdul-Qadir les a contraints à instaurer une monarchie absolue dirigée par Sa Majesté le roi Zeid bin Hussein."
palestine.15.a:0 "Allah ! Al-Watan ! Al-Malik !"

palestine.16.t:0 "Efforts palestiniens pour Damas"
palestine.16.d:0 "À la suite de récentes négociations frontalières entre les dirigeants français et palestiniens, motivées par le mécontentement croissant des Arabes syriens face à leurs maîtres et par les revendications palestiniennes pour une Grande Palestine, la France nous a proposé un accord généreux : un pacte de non-agression en échange de Damas, ce qui supprimerait la menace constante de conflits frontaliers militaires."
palestine.16.a:0 "Nous ne perdrons pas Damas !"
palestine.16.b:0 "Nous pourrions trouver un arrangement."

palestine.17.t:0 "Relations diplomatiques rompues"
palestine.17.d:0 "Nos efforts diplomatiques pour redessiner les frontières de la Palestine et obtenir la possession de Damas, dans le cadre de notre rêve de Grande Palestine, ont échoué, notre offre généreuse ayant été refusée."
palestine.17.a:0 "Nous devons chercher d’autres moyens."
palestine.17.b:0 "La Palestine ne tolérera pas ça ! Aux armes !"
palestine.18.d:0 "Après notre récente escarmouche frontalière sur les terres du Liban, nous avons réussi à vaincre les forces ennemies. C’est un grand pas en avant dans notre projet d’une Grande Palestine."
palestine.19.d:0 "Après avoir lancé une escarmouche au Liban, nos forces ont été contournées par les Français expérimentés, et nous avons subi une lourde défaite."
palestine.20.d:0 "Après une courte bataille dans les régions du sud du Liban et d’Acre, les Palestiniens ont réussi à nous repousser et à sécuriser complètement les ports de Beyrouth. Comment réagirons-nous face à cette défaite humiliante ?"
palestine.21.d:0 "À la suite des récentes escarmouches frontalières à Acre et au sud du Liban, nous avons réussi à repousser l’attaque palestinienne et à reprendre l’intégralité du Liban. Leur incapacité à tenir les ports de l’est a joué un rôle majeur dans notre victoire, qui reste un grand succès malgré tout."

palestine.22.t:0 "Le leadership d’Abdul-Qadir"
palestine.22.d:0 "Après que l’armée a rejeté la proposition d’Abdul-Qadir pour un monarque hachémite, et ne voulant pas provoquer de division dans notre nation, il a cédé. Pourtant, un monarque hachémite constituait la figure unificatrice dans l’idéologie d’Abdul-Qadir, qui croyait en un mélange d’islamisme et de nationalisme arabe. Une monarchie arabe hachémite absolue était sa solution, mais il doit désormais décider comment agir maintenant que cette figure n’est plus possible."
palestine.22.a:0 "Pas d’arabisme sans islam !"
palestine.22.b:0 "L’armée sait ce qu’elle fait."

palestine.23.t:0 "Deuxième réunion élargie de direction"
palestine.23.d:0 "Nous avons invité plusieurs hauts responsables à la Deuxième réunion élargie de direction pour discuter de la défense et de la doctrine du pays, afin de prévenir toute catastrophe future et d’améliorer notre nation dans son ensemble. Jusqu’ici, Abdul-Qadir et Abdul-Rahim semblent être les figures les plus en vue et soutenues lors de la réunion, mais tout se déroule bien."
palestine.23.a:0 "Excellent."

palestine.25.t:0 "Les discussions s’enveniment"
palestine.25.d:0 "Alors que les généraux débattaient de la défense des parties vitales de notre nation, Abdul-Qadir en vint à insulter directement Abdul-Rahim au sujet de son idée de fortifier l’État et de piéger les abords des villes. La discussion dégénéra en dispute criarde où les deux généraux s’insultèrent grossièrement, eux et leurs familles. Le Shalaf doit intervenir."
palestine.25.a:0 "Le plan de Qadir est le plus sensé, nous ne devons pas piéger toute notre nation !"
palestine.25.b:0 "Abdul-Rahim est plus sage, c’est l’État entier qui est en jeu !"
palestine.25.c:0 "Al-Shalaf a la plus grande expérience en défense, pas ces deux faibles !"

palestine.26.t:0 "Le plan d’Abdul-Qadir"
palestine.26.d:0 "Après que le Shalaf a soutenu le plan d’Abdul-Qadir, la dispute prit fin rapidement et un plan fut adopté pour le cas où la Palestine serait en péril : Jérusalem et Jaffa seraient protégées par la fortification de Ramallah, Bir As-Sab et Gaza, avec une insistance particulière sur le moral et la force mentale, valorisant l’homme du commun dans l’armée plutôt que le haut commandement."
palestine.26.a:0 "La Tasqut Filastin"

palestine.27.t:0 "Le plan d’Abdul-Rahim"
palestine.27.d:0 "Après que le Shalaf a soutenu le plan d’Abdul-Rahim, la dispute cessa, même si Abdul-Qadir en fut quelque peu contrarié. Un plan fut adopté, privilégiant la guérilla dans Jaffa, Jérusalem et Ramallah, et l’enracinement dans notre territoire. Bien que cette méthode offre de meilleures chances de défendre la Palestine contre un adversaire plus puissant, elle inquiète notre population civile."
palestine.27.a:0 "Man Yaghzu sayajid Al-Mawt !"

palestine.28.t:0 "Le plan de Golani"
palestine.28.d:0 "Après que le Shalaf est intervenu pour mettre fin à la dispute, il proposa un plan de compromis : lui, le plus expérimenté en matière de défense, élaborerait un plan visant à protéger les ports vitaux de Gaza, Tel-Aviv et Haïfa, cruciaux pour l’approvisionnement extérieur en armes et pour notre complexe militaro-industriel."
palestine.28.a:0 "Yaeesh Al-Shalaf !"

palestine.64.t:0 "Victoire contre la Palestine"
palestine.64.d:0 "Après l’audacieuse invasion du Sinaï par les forces palestiniennes, elles nous ont proposé la paix, leur opération n’ayant pas permis de pénétrer sur notre territoire ni de capturer le Sinaï. Vraiment, Dieu est de notre côté."
palestine.64.a:0 "Nous sommes victorieux !"
palestine.64.b:0 "Non ! Nous devons aller plus loin !"

palestine.65.t:0 "Défaite dans la guerre du Sinaï"
palestine.65.d:0 "Malheureusement, en raison de notre incompétence et de notre incapacité à reprendre le Sinaï aux Forces armées palestiniennes, on nous demande maintenant de céder et de signer un traité de paix. Poursuivre la guerre pourrait s’avérer désastreux pour la stabilité de notre nation."
palestine.65.a:0 "C’est le mieux pour le peuple égyptien, nous devons accepter."
palestine.65.b:0 "Non ! Nous ne devons pas subir cette humiliation !"

palestine.66.t:0 "La Palestine appelle à l’unification"
palestine.66.d:0 "Le dirigeant palestinien, le roi Zeid, a lancé un appel à l’unification de nos nations, puisqu’il partage le même sang hachémite que le roi Abdallah Ier. Cette union fraternelle pourrait nous coûter notre souveraineté, mais elle renforcerait la cause hachémite."
palestine.66.a:0 "C’est pour le mieux."
palestine.66.b:0 "Scandaleux !"

palestine.67.t:0 "Les projets d’unification échouent"
palestine.67.d:0 "Après notre généreuse offre de réunification des frères hachémites et d’annexion de la Transjordanie, soumise à Sa Majesté Abdallah Ier, celle-ci a été rejetée."
palestine.67.a:0 "Cela ne sera pas oublié ! Mobilisez les troupes !"
palestine.67.b:0 "C’était leur choix, après tout."

palestine.68.t:0 "Victoire en Jordanie"
palestine.68.d:0 "Après le récent franchissement de la frontière jordanienne, suite à leur refus de se plier à notre vision revanchiste, nous avons marché sur Amman !"
palestine.68.a:0 "Une grande avancée !"

palestine.69.t:0 "Victoire contre la Palestine"
palestine.69.d:0 "Les revanchistes palestiniens pensaient pouvoir marcher sur la Jordanie et nuire à notre souveraineté. Ils se trompaient lourdement : nous les avons repoussés et ils ont demandé un cessez-le-feu."
palestine.69.a:0 "La Tasqut Al-Urdun !"

palestine.30.t:0 "L’État de Palestine nous invite dans sa faction"
palestine.30.d:0 "Après le récent changement de pouvoir dans le nouvel État palestinien, ils ont commencé à réaliser leur rêve panarabe par la coopération et nous ont invités à rejoindre la coalition arabe dans ces efforts."
palestine.30.b:0 "Accepter"
palestine.30.a:0 "Refuser"

palestine.31.t:0 "L’Irak refuse"
palestine.31.d:0 "Après nos efforts pour une cause panarabe par la coopération diplomatique avec les puissances voisines, ils ont rejeté notre offre généreuse et notre rêve est menacé."
palestine.31.a:0 "C’était leur choix, après tout."
palestine.31.b:0 "Nous unirons nos peuples par la force !"

palestine.32.t:0 "L’Irak accepte"
palestine.32.d:0 "À la suite de notre invitation, notre diplomate est revenu de Bagdad avec une bonne nouvelle : le gouvernement irakien a accepté de rejoindre l’alliance. Une grande victoire pour le panarabisme !"
palestine.32.a:0 "Excellent !"

palestine.34.t:0 "L’Arabie saoudite refuse"

palestine.35.t:0 "L’Arabie accepte"
palestine.35.d:0 "À la suite de notre invitation, notre diplomate est revenu d’Arabie saoudite avec une bonne nouvelle : le gouvernement saoudien a accepté de rejoindre l’alliance. Une grande victoire pour le panarabisme !"
palestine.35.a:0 "Excellent !"

palestine.36.t:0 "La question de la capitale"
palestine.36.d:0 "Dans l’édification de l’économie de notre jeune nation, nous devons déterminer les prétendantes à devenir notre capitale, car c’est la clé de notre développement."
palestine.36.a:0 "Ramallah, la plus protégée."
palestine.36.b:0 "Al-Qods, le centre."
palestine.36.c:0 "Gaza, la plus fertile."

palestine.37.t:0 "Fu’ad prend la tête du Parti"
palestine.37.d:0 "Alors que la popularité du président marxiste panarabe radical Radwan Al-Hilu chutait, les nouvelles réformes ont profondément ancré le socialisme religieux dans notre population. Fu’ad Nassar a pris la direction du Parti pour en sauver l’existence, adoptant une position plus islamo-socialiste."
palestine.37.a:0 "Allahu Akbar !"

palestine.38.t:0 "Radwan Al-Hilu prend la tête du Parti"
palestine.38.d:0 "Alors que la popularité du président socialiste religieux Fu’ad Nasser chutait, notre peuple aspirant à une cause panarabe marxiste, le grand leader marxiste radical Radwan Al-Hilu a pris la tête du Parti pour sauver l’existence de notre État socialiste."
palestine.38.a:0 "Al-Watan Al-Akbar !"

palestine.39.t:0 "La question des Al-Madariss"
palestine.39.d:0 "Alors que notre jeune État socialiste se divise entre socialisme islamique et marxisme athée radical, la question du programme scolaire se pose. Beaucoup insistent sur la nécessité du laïcisme, tandis que d’autres prônent un enseignement religieux obligatoire. Satisfaire les deux camps pourrait nous aider politiquement."
palestine.39.a:0 "Programme laïcisé"
palestine.39.b:0 "Programme religieux"

palestine.40.t:0 "Le califat exige notre conversion"
palestine.40.d:0 "Le califat récemment rétabli en Palestine a envoyé des délégués pour nous convaincre d’une plus grande unité musulmane, rappelant les premiers califats et leurs appels à la conversion. Ils nous demandent d’abandonner les rancunes liées aux querelles des compagnons du prophète. La population pourrait ne pas être enthousiaste à l’idée d’abandonner son identité chiite, mais cela nous garantirait un puissant allié et une influence accrue dans la politique nationale."
palestine.40.a:0 "Bien sûr, nous adorons le même Dieu."
palestine.40.b:0 "Non ! Ali est notre guide !"

palestine.41.t:0 "L’Iran accepte"
palestine.41.d:0 "Après de longues discussions entre nos délégués et le gouvernement iranien, nous avons réussi à convaincre l’Iran d’adopter une identité plus musulmane et d’abandonner son passé chiite et ses rancunes envers les compagnons. Un grand succès pour le califat."
palestine.41.a:0 "Allah guide qui Il veut."

palestine.42.t:0 "L’Iran refuse"
palestine.42.d:0 "Après de longues discussions entre nos délégués et le gouvernement iranien, le dirigeant de l’Iran est intervenu et a refusé obstinément notre appel à l’unité musulmane. Leur armée a commencé à se remilitariser, nous considérant comme une menace pour leur identité."
palestine.42.a:0 "Allah guide qui Il veut."

palestine.43.t:0 "Activités suspectes à Assouan"
palestine.43.d:0 "Ce matin, deux hommes mystérieux ont été aperçus en train de faire passer clandestinement des armes et des munitions à Assouan, quartier général des Frères musulmans. Cela pourrait être une tentative de sabotage, ou simplement un exercice maladroit qui les affaiblira encore davantage."
palestine.43.a:0 "Inutile de prendre de telles mesures."
palestine.43.b:0 "Gardes ! Arrêtez-les !"

palestine.44.t:0 "Contrebandiers capturés"
palestine.44.d:0 "Après avoir envoyé nos meilleurs espions pour faire passer clandestinement des armes et du soutien aux Frères musulmans à Assouan, ils ont malheureusement été capturés. Mais alors que le gouvernement réprime le groupe islamiste, de plus en plus de gens commencent à sympathiser avec eux et leurs idéaux."
palestine.44.a:0 "Mission accomplie... ?"

palestine.45.t:0 "Victoire dans la guerre civile"
palestine.45.d:0 "Après que notre glorieuse République islamique ait finalement triomphé des forces colonialistes, la seule voie possible est de se soumettre au califat."
palestine.45.a:0 "Takbir !"

