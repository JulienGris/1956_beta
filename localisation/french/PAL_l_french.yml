PAL_islamist_uprising_category:0 "Soulèvement islamiste égyptien"
PAL_islamist_uprising_category_desc:0 "Les Frères musulmans égyptiens ou « Ikhwan Al-Muslimin » sont le seul grand groupe islamiste en Égypte qui prône pleinement le remplacement de la constitution par la charia et ne sombre pas dans un radicalisme extrême. Menés par l’ancien enseignant Hassan Banna, si nous voulons étendre le califat en Égypte, nous devons les aider dans leur soulèvement.\n§RNous ne pouvons choisir qu’un seul type d’aide§!\n\n\n§YLes§! §GFrères musulmans§! §Yrecevront : §Y[PALMuslimBrotherhoodStrength]§! de l’§YArmée égyptienne§!."

