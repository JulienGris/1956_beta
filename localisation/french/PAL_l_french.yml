 PAL_Small_Navy:0 "Se concentrer sur une flotte de raid"
 PAL_Small_Navy_desc:0 "Perturbation et chaos décriront parfaitement l’océan ouvert où notre marine attend une proie de convois imprudents."
 PAL_Submarine:0 "Nouveaux sous-marins modernes"
 PAL_Submarine_desc:0 "Le pilier de la flotte de raid est un sous-marin à jour."
 PAL_stealth_upgrades:0 "Améliorations de furtivité"
 PAL_stealth_upgrades_desc:0 "Frapper et disparaître en haute mer est plus efficace si l’ennemi ne peut pas localiser les moteurs des sous-marins. Le tuba est dans ce cas un investissement judicieux."
 PAL_Sea_Dominance:0 "Se concentrer sur la domination navale"
 PAL_Sea_Dominance_desc:0 "Notre marine se dressera fièrement à la surface et anéantira toute flotte ennemie apparaissant à l’horizon. Les cuirassés sont l’avenir de la guerre et nous allons le prouver au monde."
 PAL_Study_Ships:0 "Étudier les conceptions navales étrangères"
 PAL_Study_Ships_desc:0 "Nos ports sont constamment visités par des navires étrangers. Plusieurs « inspections de sécurité » nous donneraient sûrement plus de détails sur leurs derniers modèles."
 PAL_Ships_American:0 "Mission dans les chantiers navals américains"
 PAL_Ships_American_desc:0 "Nos bonnes relations avec les États-Unis se sont encore réchauffées après des visites conjointes dans leurs arsenaux navals."
 PAL_Ships_England:0 "Mission dans les chantiers navals britanniques"
 PAL_Ships_England_desc:0 "Les ingénieurs navals britanniques nous ont montré plusieurs méthodes pour améliorer la qualité et réduire le temps de construction de nos navires légers."
