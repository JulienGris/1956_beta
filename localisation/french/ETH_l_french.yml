 ETH_r56_defeat_italy_category:0 "Vaincre l’Italie"
 ETH_r56_defeat_italy:0 "Vaincre l’Italie"

 ETH_military_reforms_category:0 "Réformes militaires"
 ETH_military_reforms_category_desc:0 "Des conseillers étrangers peuvent nous aider à former nos officiers afin qu’ils adoptent des tactiques modernes et bâtissent une véritable armée moderne."

 ETH_reorganize_staff_of_general_5620:0 "Réorganiser l’état-major de §YKassa Haile Darge§!"
 ETH_reorganize_staff_of_general_5621:0 "Réorganiser l’état-major de §YSeyoum Mengesha§!"
