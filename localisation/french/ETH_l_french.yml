 ETH_reorganize_staff_of_general_cost_tooltip:0 "Coûte 10 £army_experience, 25 £command_power et 25 £pol_power."

 ETH_adopt_modern_tactics:0 "Adopter des tactiques modernes"
 remove_old_guard_trait_tt:0 "Perd le trait §ROld Guard§!"

 modernize_ethiopian_rubber_production:0 "Moderniser la production de caoutchouc éthiopien"
 exploit_ethiopian_iron_deposits:0 "Exploiter les gisements de fer éthiopiens"

 second_italo_ethiopian_war:0 "Seconde guerre italo-éthiopienne"
 second_italo_ethiopian_war_desc:0 "La guerre ravage notre pays."

 ETH_recapture_the_juba_confluence:0 "Reprendre la confluence du Juba"
 ETH_recapture_the_juba_confluence_desc:0 "Les Italiens ont pris plusieurs villages le long de notre frontière sud, près de la confluence du fleuve Juba. La communauté internationale y a vu un signe de notre incapacité à résister aux envahisseurs. Repousser les Italiens au-delà de notre frontière sud prouverait à la SdN que nous avons la volonté de combattre l’assaut colonial."

 ETH_hold_tigray:0 "Tenir le Tigré"
 ETH_hold_tigray_desc:0 "Nous devons tenir chaque pouce du front nord dans la province du Tigré si nous voulons prouver à la communauté internationale que nous pouvons résister aux Italiens. Et plus encore, montrer aux chefs locaux que le régime d’Addis-Abeba les soutient."

 #ITA Dummies
 ETH_conquer_tigray_mission:0 "Conquérir le Tigré"
 ETH_conquer_tigray_mission_desc:0 "L’absence de progrès sur le front nord, notamment au Tigré, est source de controverse depuis le début de la guerre. Capturer la région serait une première étape pour prouver que nos efforts militaires ne stagnent pas."

 ETH_hold_the_juba_confluence_mission:0 "Tenir la confluence du Juba"
 ETH_hold_the_juba_confluence_mission_desc:0 "L’une de nos rares victoires jusqu’ici a été la prise de plusieurs villages à la confluence du Juba, sur le front sud. Les renseignements indiquent que les Éthiopiens préparent une offensive pour reprendre ces territoires perdus. Perdre si tôt le contrôle de cette zone serait un coup terrible pour notre effort de guerre."

 ETH_promote_infrastructure_development_in_from:0 "Développer les infrastructures en [FROM.GetName]"
 ETH_promote_construction_development_in_from:0 "Développer la construction en [FROM.GetName]"
 ETH_state_development_production_speed_tt:0 "§YUsines max dans l’État§! §G+10%§!"
 ETH_state_development_local_building_tt:0 "§YVitesse de construction locale§! §G+10%§!"

 italo_ethiopian_war:0 "L’Italie a signé la paix sous la menace de l’isolement diplomatique."

 ETH_black_lion_corps:0 "Les Lions Noirs"
 ETH_black_lion_corps_desc:0 "Des combattants affluent pour rejoindre notre cause."

 ETH_christmas_offensive_focus:0 "Offensive de Noël"
 ETH_christmas_offensive_focus_desc:0 "Nous ne devons perdre aucun temps."

 ETH_home_defense_focus:0 "Défense de la patrie"
 ETH_home_defense_focus_desc:0 "Nous devons résister aux envahisseurs étrangers."

 ETH_swedish_red_cross:0 "Hôpitaux de la Croix-Rouge"
 ETH_swedish_red_cross_desc:0 "Les hôpitaux de la Croix-Rouge apportent un précieux soutien médical à nos troupes."

 ETH_copy_german_design_focus:0 "Copies de Mauser"
 ETH_copy_german_design_focus_desc:0 "Conception allemande. Fabrication éthiopienne."

 ETH_hold_the_line_focus:0 "Positions fortifiées"
 ETH_hold_the_line_focus_desc:0 "Une meilleure pelle fait toute la différence."

 ETH_japan_advice:0 "Conseillers japonais"
 ETH_japan_advice_desc:0 "Avec le retour de conseillers japonais en Éthiopie, nous pourrions voir se réaliser le rêve d’une alliance des peuples de couleur contre les oppresseurs coloniaux."

 ETH_lion_roar_focus:0 "Le rugissement du lion"
 ETH_lion_roar_focus_desc:0 "Un esprit de ferveur et de détermination emplit le cœur des Éthiopiens."

 ETH_defensive_imperialism:0 "Dogme anticolonial"
 ETH_defensive_imperialism_desc:0 "Lassée de la soi-disant Société des Nations, l’Éthiopie doit se lever pour défendre ceux qui ne peuvent se défendre eux-mêmes."

 ETH_georges_deffontaine:0 "Oscar Michiels"

 ETH_lion_roar_focus_lesser:0 "Lions victorieux"
 ETH_lion_roar_focus_lesser_desc:0 "Nous nous sommes levés et avons vaincu l’Italie ! Mort aux colonialistes et aux usurpateurs !"

 ETH_call_of_lion:0 "L’appel du lion"
 ETH_call_of_lion_desc:0 "La défaite des Italiens a poussé les Africains de tout le continent à rallier notre cause."

 ETH_solomonic_dynasty:0 "Dynastie de Salomon"
 ETH_solomonic_dynasty_desc:0 "Cet individu revendique une lignée qui remonte au roi Salomon."

 eth_focus:0 "Arbre national éthiopien"

 ETH_land_development:0 "Sidérurgie"
 ETH_land_development_desc:0 "Nous devons développer notre industrie de l’acier si nous voulons répondre aux besoins de production de nos forces armées."

 ETH_urban_factories:0 "Développer Addis-Abeba"
 ETH_urban_factories_desc:0 "Sans une base industrielle solide, les puissances coloniales nous écraseront comme un insecte."

 ETH_modern_technology:0 "Moderniser l’industrie"
 ETH_modern_technology_desc:0 "L’Éthiopie doit adopter des pratiques industrielles modernes si elle veut traverser ces temps sombres."

 ETH_addiba_university:0 "Fonder l’université d’Addis-Abeba"
 ETH_addiba_university_desc:0 "L’université d’Addis-Abeba fut fondée comme un collège en 1950 par le jésuite canadien Lucien Matte, à la demande d’Haïlé Sélassié. Elle commença ses activités l’année suivante et noua bientôt une affiliation avec l’Université de Londres."

 ETH_extra_research_slot_2:0 "Fonder l’Institut éthiopien"
 ETH_extra_research_slot_2_desc:0 "Fondé en 1954, son programme initial proposait un diplôme de trois ans en génie civil, rapidement remplacé par un cursus de quatre ans menant à un BSc en ingénierie du bâtiment. En 1969, l’école fusionna avec le collège d’ingénierie pour former la Faculté de technologie de l’université d’Addis-Abeba, statut qu’elle conserva jusqu’en 2009."

 ETH_black_lions:0 "Former les Lions Noirs"
 ETH_black_lions_desc:0 "Un mouvement antifasciste fondé pour résister à l’occupation italienne de l’Éthiopie."

 ETH_regimental_system:0 "Réformes militaires"
 ETH_regimental_system_desc:0 "La structure militaire de l’Éthiopie était gravement déficiente au début de la Seconde guerre italo-éthiopienne. Nous devons utiliser nos conseillers étrangers pour élaborer une organisation cohérente."

 ETH_officer_schools:0 "Écoles d’officiers"
 ETH_officer_schools_desc:0 "Si nous voulons que nos forces armées progressent contre le colonialisme, nos officiers doivent être formés aux tactiques modernes."

 ETH_harar_academy:0 "Fonder l’Académie de Harar"
 ETH_harar_academy_desc:0 "Située dans les contreforts de Hakim Gara, près de la ville de Magala, l’Académie fut créée en 1957 et fermée prématurément en 1977. Elle marqua si profondément la conscience des habitants de Harar que beaucoup la considéraient indissociable de la ville et des nombreuses promotions de cadets qu’elle forma."

 ETH_mil_factory:0 "Construire des usines militaires"
 ETH_mil_factory_desc:0 "Pour combattre efficacement, nous devons produire nos propres armes."

 ETH_mil_factory2:0 "Poursuivre le développement industriel"
 ETH_mil_factory2_desc:0 "Nous devons continuer à développer notre industrie."

 ETH_christmas_offensive:0 "Offensive de Noël"
 ETH_christmas_offensive_desc:0 "Une contre-offensive éthiopienne destinée à scinder les forces italiennes sur le front nord."

 ETH_national_mobilization:0 "Mobilisation nationale"
 ETH_national_mobilization_desc:0 "« Tous les hommes et garçons capables de porter une lance doivent se rendre à Addis-Abeba. Chaque homme marié amènera sa femme pour cuisiner et laver pour lui. Chaque célibataire amènera toute femme non mariée qu’il pourra trouver pour cuisiner et laver pour lui. Les femmes avec des bébés, les aveugles et les trop âgés ou infirmes sont dispensés. Toute personne trouvée à son domicile après cet ordre sera pendue. » — Ordre de mobilisation de Sélassié"

 ETH_plea_to_lon:0 "Appel à la Société des Nations"
 ETH_plea_to_lon_desc:0 "Haïlé Sélassié fit appel à la Société des Nations en juin 1936 pour qu’elle impose des sanctions à l’Italie."

 ETH_ferenghi:0 "Les Ferenji"
 ETH_ferenghi_desc:0 "Les « Ferenji », ou étrangers, étaient un groupe de conseillers militaires, de pilotes et de médecins de la Croix-Rouge ayant aidé l’Éthiopie durant la guerre contre l’Italie."

 ETH_german_equipment:0 "Soutien allemand"
 ETH_german_equipment_desc:0 "À la suite des tensions liées à l’Anschluss, l’Allemagne fournit à l’Éthiopie fusils et munitions dans l’espoir d’affaiblir l’Italie."

 ETH_german_design:0 "Copier les modèles allemands"
 ETH_german_design_desc:0 "En utilisant les armes fournies par l’Allemagne, nous pouvons rétroconcevoir leurs modèles."

 ETH_homeland_defense:0 "Défense de la patrie"
 ETH_homeland_defense_desc:0 "Nous ne pouvons pas laisser l’Italie s’emparer de notre territoire souverain. Nous ne pouvons compter que sur nous-mêmes."
 ETH_mountain_forts:0 "Sécuriser les montagnes"
 ETH_mountain_forts_desc:0 "Nous devons fortifier nos positions dans les montagnes si nous espérons tenir face à l’Italie."
 ETH_capital_forts:0 "Sécuriser la capitale"
 ETH_capital_forts_desc:0 "Nous transformerons Addis-Abeba en forteresse."
 ETH_hold_line:0 "Tenir la ligne"
 ETH_hold_line_desc:0 "Pas un pas en arrière. Nous devons tenir bon face aux envahisseurs italiens. Renforcer nos tranchées actuelles et adopter de nouvelles méthodes défensives sera décisif."
 ETH_rain_iron:0 "Pluie d’acier"
 ETH_rain_iron_desc:0 "Les avions italiens saturent le ciel et harcèlent nos troupes. Nous devons ériger des défenses antiaériennes dans tout le pays pour les abattre sous une pluie d’acier !"
 ETH_japanese_assistance:0 "Aide japonaise"
 ETH_japanese_assistance_desc:0 "Nous devons lancer un appel au Japon pour qu’il soutienne l’Éthiopie en ce moment critique. Le peuple japonais est acquis à notre cause, il reste à convaincre leurs dirigeants de nous épauler à nouveau."
 ETH_japanese_navy_focus:0 "Conseillers navals japonais"
 ETH_japanese_navy_focus_desc:0 "Le Japon domine le Pacifique par sa puissance navale. Avec son aide, nous pourrons dominer l’océan Indien et la mer Rouge."
 ETH_lion_roar:0 "Le Lion de Juda"
 ETH_lion_roar_desc:0 "Revigorée par le soutien étranger, l’Éthiopie se lève à nouveau pour chasser définitivement les colonialistes."
 ETH_demand_summit:0 "Exiger un sommet à la SdN"
 ETH_demand_summit_desc:0 "L’Italie est brisée, nous avons tenu bon. La Société des Nations doit intervenir et imposer la fin de ce conflit."
 ETH_torpedoes_focus:0 "La Longue Lance"
 ETH_torpedoes_focus_desc:0 "Nos frères japonais ont mis au point une torpille à très longue portée. Avec elle, nous pouvons obtenir l’avantage naval dont nous avons besoin."
 ETH_secure_seuz:0 "Sécuriser le canal de Suez"
 ETH_secure_seuz_desc:0 "Le canal de Suez est une route commerciale vitale, et le sera encore davantage dans les conflits à venir. Cette terre appartient à l’Afrique : nous devons l’arracher aux colonialistes."
 ETH_anti_colonial_dogma:0 "Dogme anticolonial"
 ETH_anti_colonial_dogma_desc:0 "L’Afrique et le monde ont trop longtemps été asservis par les colonialistes. Nous devons les vaincre et libérer les peuples opprimés, comme nous avons vaincu l’Italie."
 ETH_reclaim_aksum:0 "Reprendre le royaume d’Aksoum"
 ETH_reclaim_aksum_desc:0 "À son apogée au VIe siècle, le royaume d’Aksoum s’étendait de l’Éthiopie jusqu’à la péninsule Arabique. Carrefour de la route des épices et royaume puissant, ces terres nous reviennent de droit. Nous les ramènerons sous contrôle éthiopien."
 ETH_demand_french_somalia:0 "Exiger la Somalie française"
 ETH_demand_french_somalia_desc:0 "Les Français ne valent pas mieux que les Britanniques ou les Italiens. Ils imposent leurs lois et leur culture aux peuples d’Afrique. Ils n’ont aucun droit sur ces terres."
 ETH_demand_british_somalia:0 "Exiger les colonies britanniques"
 ETH_demand_british_somalia_desc:0 "Les Britanniques pillent et conquièrent depuis bien trop longtemps. Leurs colonies doivent revenir aux peuples et, sous la direction de l’Éthiopie, être préparées à s’autogouverner."
 ETH_death_to_saudis:0 "La question islamique"
 ETH_death_to_saudis_desc:0 "Depuis les temps du califat omeyyade et de la dynastie ayyoubide, l’islam et ses fidèles se sont opposés à notre peuple et à notre mode de vie. Il est temps de frapper en retour et de venger tout ce qu’ils nous ont infligé."
 ETH_demand_solomon_kingdom:0 "Restaurer le royaume de Salomon"
 ETH_demand_solomon_kingdom_desc:0 "Haïlé Sélassié est l’héritier légitime du royaume salomonien. Nous reviendrons en Terre sainte pour unir chrétiens et juifs sous une seule bannière. Gloire à l’empereur Haïlé Sélassié, roi d’Aksoum et de toutes ses terres !"
 ETH_red_sea_focus:0 "Développer la mer Rouge"
 ETH_red_sea_focus_desc:0 "La mer Rouge est une route commerciale essentielle. Nous devons développer nos ports si nous voulons y dominer. Jadis halte majeure des routes de la soie, nous devons les reprendre !"
 ETH_develop_eritrea:0 "Développer l’Érythrée"
 ETH_develop_eritrea_desc:0 "Les Italiens ont investi dans les infrastructures en Érythrée. Nous pouvons utiliser ces bases existantes et les développer. L’Érythrée pourrait devenir un port majeur si nous poursuivons nos projets industriels."
 ETH_develop_somalia:0 "Développer la Somalie"
 ETH_develop_somalia_desc:0 "Nous devons transformer la Somalie en port moderne si nous voulons protéger nos terres contre les colonialistes."
 ETH_fortify_eritrea:0 "Fortifier l’Érythrée"
 ETH_fortify_eritrea_desc:0 "S’il y a une leçon à retenir de notre guerre contre l’Italie, c’est que les défenses sont essentielles pour prévenir une invasion étrangère."
 ETH_fortify_somalia:0 "Fortifier la Somalie"
 ETH_fortify_somalia_desc:0 "Nous devons tout faire pour défendre notre patrie et renforcer nos positions vulnérables."
 ETH_modern_navy:0 "Développer une marine moderne"
 ETH_modern_navy_desc:0 "Nos ports désormais sécurisés et développés, nous pouvons investir dans des modèles de navires inspirés des grandes puissances. Nos moyens étant limités, nous devons concentrer nos efforts sur les destroyers."
 ETH_amphibious_operations:0 "Opérations amphibies"
 ETH_amphibious_operations_desc:0 "Pour quitter l’Afrique, il faudra maîtriser la guerre amphibie. Nous devons étudier le rôle des navires de transport et de soutien dans la réussite d’un débarquement."
 ETH_carrier_primacy:0 "Primauté des porte-avions"
 ETH_carrier_primacy_desc:0 "L’aviation embarquée est l’avenir de la guerre navale. Nous devons investir dans le développement de nos propres porte-avions."
 ETH_battleship_primacy:0 "Primauté des cuirassés"
 ETH_battleship_primacy_desc:0 "Si nous voulons rivaliser avec les autres marines du monde, nous devons concevoir nos propres modèles de cuirassés."
 ETH_silk_road_test:0 "Reconstruire la route de la soie"
 ETH_silk_road_test_desc:0 "L’Éthiopie fut jadis un maillon essentiel de la route de la soie : les marchandises entraient par les ports d’Aksoum, traversaient notre pays et remontaient vers le nord de l’Afrique. Nous devons construire de nouvelles infrastructures pour retrouver ce rôle."
 ETH_steel_industry:0 "Améliorer l’industrie sidérurgique"
 ETH_steel_industry_desc:0 "Nous devons poursuivre le développement de la sidérurgie si nous voulons déployer une armée et une marine modernes."
 ETH_rare_metals:0 "Industrie minière"
 ETH_rare_metals_desc:0 "En investissant davantage dans l’extraction, nous pourrons mettre au jour de nouveaux gisements indispensables à une industrie avancée."
 ETH_oil_industry:0 "Industrie pétrolière"
 ETH_oil_industry_desc:0 "Une marine moderne a besoin d’une source régulière de pétrole, que nous pourrions développer par de nouveaux investissements."
 ETH_modern_airforce:0 "Moderniser l’armée de l’air"
 ETH_modern_airforce_desc:0 "Avec quelques efforts, nous pouvons moderniser en profondeur notre aviation."
 ETH_airbase_eritea:0 "Base aérienne en Érythrée"
 ETH_airbase_eritea_desc:0 "Pour assurer la couverture de nos forces en Érythrée, nous devons y construire des bases."
 ETH_airbase_somalia:0 "Base aérienne en Somalie"
 ETH_airbase_somalia_desc:0 "La Somalie doit accueillir une base aérienne pour nos opérations. Nous pouvons l’aménager rapidement."
 ETH_develop_airforce:0 "Investissements continus"
 ETH_develop_airforce_desc:0 "Pour conserver un avantage aérien, nous devons continuer d’investir dans l’avenir."
 ETH_hold_the_line:0 "Positions améliorées"

 ETH_diplomatic_legitimacy:0 "Légitimité diplomatique"
 ETH_diplomatic_legitimacy_desc:0 "Après avoir repoussé l’invasion italienne, notre pays peut devenir un symbole de la résistance contre l’oppression impérialiste."

 ETH_join_the_japanese:0 "Formaliser l’alliance nippo-éthiopienne"
 ETH_join_the_japanese_desc:0 "L’assistance mutuelle entre nos deux nations peut être renforcée en une véritable alliance militaire, capable de contrer les ambitions impérialistes des Occidentaux avides de terres et de puissance."

 ETH_japanese_navy:0 "Conseillers navals japonais"
 ETH_leopold_reul:0 "Léopold Reul"
 ETH_the_long_lance:0 "La Longue Lance"

 ethiopia.1.t:0 "Invasion italienne déjouée"
 ethiopia.1.d:0 "L’envahisseur italien a été chassé de nos frontières et rejeté à la mer ! Jour glorieux pour les Enfants de Salomon : nous avons enfin repris les terres ancestrales volées à notre peuple et reforgé une nation plus forte, prête à la grandeur."
 ethiopia.2.t:0 "Les puissances occidentales imposent un embargo à l’Italie"
 ethiopia.2.d:0 "Les signataires, considérant qu’une paix durable exige que chaque nation obtienne sa juste place, ont décidé de coopérer pour mettre fin à l’effusion de sang insensée et à l’impérialisme éhonté de l’Italie en Afrique de l’Est et dans les régions où ils entendent établir un nouvel ordre destiné à favoriser la prospérité mutuelle des peuples concernés."
 ethiopia.3.t:0 "Indignation des puissances occidentales"
 ethiopia.3.d:0 "Une agression aussi effrontée contre des membres de la Société des Nations ne sera pas tolérée."

 ethiopia.10011.t:0 "Armes allemandes"
 ethiopia.10011.d:0 "L’Allemagne nous envoie des fournitures pour renforcer notre industrie. Avec une industrie moderne, nous pourrons enfin affronter les forces de Mussolini."
 ethiopia.10011.a:0 "Accélérons la production !"
 ethiopia.10011.b:0 "Leurs armes seront d’une grande aide dans notre lutte !"

 ETH_generic_tank_plant:0 "Atelier national de chars"
 ETH_tank_refurbishment_plant:0 "Atelier de remise en état des chars"
 ETH_tank_refurbishment_plant_desc:0 "Puisque nous avons besoin de chars, pourquoi ne pas commencer par ceux laissés par les Italiens ?"
