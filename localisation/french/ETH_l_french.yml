 ETH_reorganize_staff_of_general_5623:0 "Réorganiser l’état-major de §YAfawarq Samayat§!"
 ETH_reorganize_staff_of_general_5624:0 "Réorganiser l’état-major de §YKassa Haile Darge§!"
 ETH_reorganize_staff_of_general_5625:0 "Réorganiser l’état-major de §YImru Haile Selassie§!"

