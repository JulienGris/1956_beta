#Custom_tooltip
 albania_focus:0 "Focus National Albanais"
 9_ALB_tt:0 "Il y a une chance que cela provoque un soulèvement national et une guerre civile !"
 POLITICS_KING_ZOG_DESC:0 "Né en 1895 dans une famille noble du château de Burgajet, Zog occupa des postes ministériels de 1920 à 1924 jusqu'à son exil forcé en Yougoslavie. Le jeune Zog revint avec l'aide yougoslave et fut élu président le 1er février 1925, assumant plus tard le rôle de roi le 1er septembre.\nBien qu'il ait su manipuler les affaires internes de l'Albanie à son avantage, il dépendait fortement de l'Italie de Benito Mussolini."  #From Britannica
#leader traits
 likes_italy:0 "Apprécie l'Italie"
 ALB_head_of_the_comitee_of_kosovo:0 "Chef du Comité du Kosovo"
#Focus
 ALB_strengthen_zogs_rule:0 "Renforcer le Règne de Zog"
 ALB_strengthen_zogs_rule_desc:0 "Notre roi est le protecteur de notre pays ! Il sera le symbole de notre lutte contre ceux qui menacent notre royaume ! Nous transmettrons l'héritage de Skanderbeg et de notre roi aux générations futures !"
 ALB_challenge_zogs_rule:0 "Contester le Règne de Zog"
 ALB_challenge_zogs_rule_desc:0 "Le roi Zog n'est pas la solution à nos problèmes ! Le gouvernement et le roi sont de plus en plus influencés et contrôlés par [ITA.GetNameDef], tandis que les tribus et le peuple sont impuissants. Il est temps de changer !"
 ALB_political_reforms:0 "Réformes Politiques"
 ALB_political_reforms_desc:0 "Après la fin de notre Première République, le roi Zog a établi le Royaume d'Albanie. Nous sommes maintenant à un carrefour et il est temps de faire des choix importants. Nous guiderons notre nation vers la prospérité !"
 ALB_the_peoples_republic:0 "La République Populaire"
 ALB_the_peoples_republic_desc:0 "Notre peuple est resté trop longtemps dans l'ombre. Il en a assez de la faim et des conditions misérables. Il est temps pour le prolétariat et les tribus d'Albanie de se lever et de créer la République Populaire Albanaise !"
 ALB_restore_the_republic:0 "Restaurer la République"
 ALB_restore_the_republic_desc:0 "Chaque [ALB.GetAdjective] doit avoir le droit de s'exprimer, de vivre et d'être libre ! La liberté doit prévaloir en Albanie, et nous atteindrons ce rêve à tout prix pour chaque [ALB.GetAdjective]."
 ALB_the_peoples_army:0 "L'Armée du Peuple"
 ALB_the_peoples_army_desc:0 "Pour défendre notre rêve communiste, le peuple doit prendre les armes et défendre notre République Socialiste en masse ! Nous ne serons plus impuissants comme avant !"
 ALB_exile_the_king:0 "Exiler le Roi"
 ALB_exile_the_king_desc:0 "Pour réussir un coup d'État, nous devons exiler le roi Zog, symbole de la dictature et de l'échec politique. [ITA.GetNameDefCap] a accepté notre proposition d'exiler l'ancien roi sur son territoire."
 ALB_assassinate_the_king:0 "Assassiner le Roi"
 ALB_assassinate_the_king_desc:0 "Lors de notre prochain coup d'État, nous devons assassiner le roi responsable de toutes les souffrances du peuple ! Pourquoi le laisser partir en exil sans payer pour ses crimes ? Que le roi ressente la colère du prolétariat !"
 ALB_communist_diplomacy:0 "Diplomatie Communiste"
 ALB_communist_diplomacy_desc:0 "Maintenant que notre République Socialiste est créée, nous devons rechercher l'amitié de ceux qui partagent nos idées. [SOV.GetNameDefCap] et [PRC.GetNameDef] sont nos cibles principales."
 ALB_the_peoples_institute:0 "L'Institut du Peuple"
 ALB_the_peoples_institute_desc:0 "Maintenant que notre révolution a réussi, nous devons nous concentrer sur la recherche pour compenser notre retard technologique par rapport à nos voisins. Ce tout nouvel institut nous aidera à atteindre nos objectifs !"
 ALB_join_the_comintern:0 "Rejoindre le Komintern"
 ALB_join_the_comintern_desc:0 "Il est temps d'embrasser notre rêve communiste et de rejoindre [SOV.GetNameDef] ! Nous défendrons et répandrons l'idéologie communiste dans le monde entier !"
 ALB_the_second_republic:0 "La Seconde République"
 ALB_the_second_republic_desc:0 "En signant notre nouvelle constitution, nous avons promis de nous lever et de lutter pour protéger notre peuple des menaces fascistes et communistes ! Nous ne permettrons à personne de nous enlever nos idées de liberté et de droits fondamentaux !"
 ALB_the_italian_threat:0 "La Menace [ITA.GetAdjective]"
 ALB_the_italian_threat_desc:0 "[ITA.GetNameDefCap] avait beaucoup d'influence sur le précédent gouvernement du roi. Ils cherchent maintenant activement à accroître leur contrôle sur nous. En tant que nation indépendante, nous devons protéger notre peuple contre ceux qui menacent notre indépendance !"
 ALB_tirana_institute_of_research:0 "Institut de Recherche de Tirana"
 ALB_tirana_institute_of_research_desc:0 "Il est temps de financer un nouvel institut de recherche qui nous aidera à améliorer l'équipement de nos soldats et moderniser notre armée. Notre priorité est de protéger notre peuple contre les menaces extérieures."
 ALB_join_the_allies:0 "Rejoindre les Alliés"
ALB_join_the_allies_desc:0 "Nos positions démocratiques nous ont rapprochés des Grandes Puissances de l'Ouest. Il est désormais temps de rejoindre leur alliance et de combattre les idéologies extrêmes et dangereuses que sont le fascisme et le communisme."
ALB_albania_on_its_own:0 "L'Albanie seule !"
ALB_albania_on_its_own_desc:0 "[ALB.GETNameDefCap] est seule pour le moment. Cependant, nous rassemblerons nos alliés par nos propres moyens et nous deviendrons sans aucun doute le leader de l'une des coalitions les plus extraordinaires jamais vues sur Terre !"
ALB_socialism_in_one_country:0 "Le Socialisme dans un seul pays"
ALB_socialism_in_one_country_desc:0 "Le Socialisme dans un seul pays est une doctrine qui privilégie la défense de nos idéaux communistes et de notre patrie plutôt que de répandre la révolution à travers le monde. Nous devons nous renforcer pour devenir des défenseurs de nos croyances afin de garantir la réussite de notre mission !"
ALB_permanent_revolution:0 "Révolution permanente !"
ALB_permanent_revolution_desc:0 "La doctrine de la Révolution permanente se concentre sur la diffusion de la révolution dans tous les pays capitalistes du globe. Nous répandrons nos idéaux de suprématie et de domination du prolétariat !"
ALB_army_of_the_republic:0 "Armée de la République"
ALB_army_of_the_republic_desc:0 "Pour défendre notre patrie contre [ITA.GetNameDef] et d'autres menaces potentielles, nous devons augmenter le nombre de recrues pour former une véritable armée, capable de protéger le pays contre des adversaires comme [ITA.GetLeader]."
ALB_institute_absolute_monarchy:0 "Instaurer la monarchie absolue"
ALB_institute_absolute_monarchy_desc:0 "Nous devons unir notre pays sous le Roi ! Il doit régner sans opposition ! C’est pourquoi les Absolutistes doivent gagner de plus en plus d’influence au gouvernement. Contrôler complètement notre pays n’est qu’une question de temps."
ALB_a_constitutional_monarchy:0 "Une monarchie constitutionnelle"
ALB_a_constitutional_monarchy_desc:0 "Notre pays doit être dirigé par les citoyens de la haute société, représentés au parlement. Les Constitutionnalistes doivent donc accroître leur influence dans le gouvernement. Contrôler complètement notre pays n’est qu’une question de temps."
ALB_cancel_the_constitution_of_1928:0 "Annuler la Constitution de 1928"
ALB_cancel_the_constitution_of_1928_desc:0 "En annulant la constitution, nous donnons tout le pouvoir à notre grand roi ! Il mènera notre nation à la gloire, à la prospérité et au prestige ! La responsabilité du pays repose sur ses épaules !"
ALB_the_kings_army:0 "L'armée du roi"
ALB_the_kings_army_desc:0 "Le peuple de notre nation doit se mobiliser pour faire face à nos ennemis. Nous prouverons au monde que [ALB.GetNameDef] n’est pas une nation à sous-estimer ! Nous ne serons jamais faibles à nouveau car notre courage est une arme invincible !"
ALB_stick_to_the_constitution_of_1928:0 "Respecter la Constitution de 1928"
ALB_stick_to_the_constitution_of_1928_desc:0 "Notre noble roi dirige maintenant notre pays avec l’aide du parlement. Ses pouvoirs sont limités, mais il reste le chef de l’État et le symbole de [ALB.GetNameDef]. Que Dieu bénisse Skenderbeg III !"
ALB_strategic_diplomacy:0 "Diplomatie stratégique"
ALB_strategic_diplomacy_desc:0 "[ITA.GetNameDefCap] nous est d’une grande aide, mais nous devons trouver d’autres alliés pour éviter de devenir dépendants de [ITA.GetNameDef]. Nous mènerons diverses actions diplomatiques en Europe pour trouver des partenaires aux objectifs communs."
ALB_albanias_pact_of_defense:0 "Pacte de défense albanais"
ALB_albanias_pact_of_defense_desc:0 "Les résultats de nos missions diplomatiques sont là. [YUG.GetNameDefCap], [POL.GetNameDef] et [ROM.GetNameDef] ont accepté de garantir notre indépendance. C’est un excellent jour pour notre pays !"
ALB_tirana_royal_institute_of_technology:0 "Institut royal de technologie de Tirana"
ALB_tirana_royal_institute_of_technology_desc:0 "Nous ne devons pas prendre de retard sur nos voisins en matière de recherche technologique. Nous avons financé la construction de cet institut dans l’espoir de moderniser nos armées, notre marine et notre industrie. Nous sommes en voie de devenir une nation moderne et industrialisée !"
ALB_faith_in_liberty:0 "Foi en la liberté"
ALB_faith_in_liberty_desc:0 "Nous croyons en la démocratie et la liberté, et nous protégerons ces valeurs à tout prix. Notre peuple est prêt à défendre le pays au péril de sa vie. Nous sommes le pays des libres !"
ALB_trans_european_trade_agreement:0 "Accord commercial trans-européen"
ALB_trans_european_trade_agreement_desc:0 "Grâce à nos missions diplomatiques, nous avons pu conclure un accord commercial bénéfique pour notre pays. Cet accord aidera à approvisionner notre armée et à accroître notre influence dans le monde des affaires."
ALB_fascist_diplomacy:0 "Diplomatie fasciste"
ALB_fascist_diplomacy_desc:0 "Même si nous sommes une monarchie absolue, les fascistes partagent des idées proches des nôtres. Il serait donc bon d’améliorer les relations avec eux et de discuter d’alliances et de coopérations économiques."
ALB_join_the_axis:0 "Rejoindre l’Axe"
ALB_join_the_axis_desc:0 "Rejoindre [GER.GetNameDef] et l’Axe nous protégera des menaces extérieures. Ils partagent également des idées proches des nôtres, et les hauts responsables du gouvernement sont majoritairement pro-[GER.GetAdjective]. Il est temps de rejoindre leur faction !"
ALB_german_albanian_trade_pact:0 "Pacte commercial [GER.GetAdjective]-[ALB.GetAdjective]"
ALB_german_albanian_trade_pact_desc:0 "La coopération économique entre nos deux nations doit renforcer notre amitié et bénéficier à chacun. Cet accord facilitera l’approvisionnement et l’organisation de nos troupes."
ALB_grand_kingdom_of_albania:0 "Grand Royaume d’Albanie"
ALB_grand_kingdom_of_albania_desc:0 "Il est temps de viser l’expansion en Europe. Le Haut Commandement souhaite prendre le Kosovo, une région albanaise de [YUG.GetNameDef], ainsi que les provinces du sud de [YUG.GetNameDef]. Certains généraux veulent aller plus loin et planifient la conquête du nord de la Grèce et de [BUL.GetNameDef]. Que l’Âge d’Or de [ALB.GetNameDef] commence !"
ALB_take_care_of_the_kingdom_of_yugoslavia:0 "Prendre soin de [YUG.GetNameDef]"
ALB_take_care_of_the_kingdom_of_yugoslavia_desc:0 "Le pays connu sous le nom de [YUG.GetNameDef] possède des provinces albanaises. Nous reprendrons ces provinces pour ramener notre peuple chez lui !"
ALB_make_bulgaria_ours:0 "Faire de la Bulgarie notre alliée !"
ALB_make_bulgaria_ours_desc:0 "Nos motivations politiques nous poussent à attaquer [BUL.GetNameDef]. Leur armée est puissante, mais la nôtre est meilleure ! Nous écraserons l’ennemi !"
ALB_romanias_grand_invasion:0 "La grande invasion de la Roumanie"
ALB_romanias_grand_invasion_desc:0 "Les champs pétrolifères roumains sont précieux et très importants. Les contrôler nous permettrait d’approvisionner toute notre armée sans dépendre des importations. Nous écraserons cet ennemi !"
ALB_march_through_greece:0 "Marcher à travers la Grèce"
ALB_march_through_greece_desc:0 "La Grèce possède une valeur commerciale importante, plusieurs routes commerciales traversant ses territoires. La conquête de ces terres augmentera notre influence commerciale !"
ALB_the_spirit_of_skanderbeg:0 "L’esprit de Skanderbeg"
ALB_the_spirit_of_skanderbeg_desc:0 "Au XVe siècle, l’Empire ottoman envahit nos terres. En 1480, ils achevèrent leur conquête malgré la résistance acharnée du légendaire Skanderbeg et de l’armée albanaise. Aujourd’hui, il est temps de prendre notre revanche au nom de Skanderbeg !"
ALB_ita:0 "Asservir [ITA.GetLeader]"
ALB_ita_desc:0 "Il n’y a pas si longtemps, nous étions influencés par [ITA.GetNameDef], au bord de l’extinction. Aujourd’hui, nous sommes une nation forte. Nous poursuivrons notre série de conquêtes en prenant le contrôle de la péninsule italienne !"
ALB_albania_or_iberia:0 "L’Albanie ou l’Ibérie"
ALB_albania_or_iberia_desc:0 "Nous devons étendre nos frontières encore plus loin. Notre gouvernement et le haut commandement militaire ont planifié une invasion de l'Espagne et de la région du Caucase. Nous devons nous préparer à affronter l'Espagne à l'Ouest et [SOV.GetNameDef] à l'Est."
ALB_send_diplomats_to_italy:0 "Envoyer des diplomates à [ITA.GetNameDef]"
ALB_send_diplomats_to_italy_desc:0 "Notre économie et notre situation politique dépendent de plus en plus de [ITA.GetNameDef]. En tant qu'amis, nous devons améliorer nos relations avec eux, étendre notre amitié et envoyer quelques espions, au cas où."
ALB_the_italian_affair:0 "L'affaire [ITA.GetAdjective]"
ALB_the_italian_affair_desc:0 "Il semble que nos espions et diplomates aient découvert quelque chose en [ITA.GetNameDef]. Cela pourrait être une mauvaise nouvelle pour notre pays. Nous devons être préparés au pire."
ALB_army_reforms:0 "Réformes de l'armée"
ALB_army_reforms_desc:0 "Notre armée est faible actuellement. Nous sommes désorganisés et nos troupes ne sont pas correctement entraînées. Le gouvernement doit lancer une réforme militaire générale pour que nos forces soient considérées comme une vraie armée."
ALB_economic_reforms:0 "Réformes économiques"
ALB_economic_reforms_desc:0 "Notre économie a été sévèrement touchée par la Grande Dépression. La pauvreté est répandue, le chômage est très élevé et notre économie est en ruines. Il est temps de réformer notre économie pour remettre le pays sur pied."
ALB_prepare_for_war:0 "Préparer la guerre"
ALB_prepare_for_war_desc:0 "Nous ne négocierons pas avec ces [ITA.GetAdjective] qui ont osé préparer une invasion contre nous. Nous préparerons notre nation à les affronter et montrerons au monde que [ALB.GetNameDef] n'est pas une nation à prendre à la légère !"
ALB_negotiate_with_benito_mussolini:0 "Négocier avec [ITA.GetLeader]"
ALB_negotiate_with_benito_mussolini_desc:0 "Nous devrions engager des négociations avec l'Italie. Nous les informerons de ce que nous avons découvert et tenterons de négocier un traité pour éviter la guerre entre nos deux pays. L'écart entre nos nations est trop grand pour envoyer des milliers de jeunes hommes à leur mort."
ALB_treaty_of_milan:0 "Traité de Milan"
ALB_treaty_of_milan_desc:0 "Grâce aux négociations, nous avons réussi à éviter la guerre. Même à un prix élevé, nous avons échappé à l'extinction sains et saufs. Les conditions auraient été bien plus dures si nous avions attendu que [ITA.GetNameDef] nous attaque."
ALB_mobilization_en_masse:0 "Mobilisation en masse"
ALB_mobilization_en_masse_desc:0 "En préparation de l'invasion, le gouvernement ordonnera la mobilisation totale du peuple. Nous nous battrons pour l'indépendance de [ALB.GetNameDef] !"
ALB_the_worst_is_behind_us:0 "Le pire est derrière nous !"
ALB_the_worst_is_behind_us_desc:0 "Le peuple de [ALB.GetNameDef] reconnaît nos actions ! Nous avons sauvé la vie de nombreux jeunes hommes ! Le peuple est reconnaissant, plus attaché aux valeurs gouvernementales et plus enclin à rejoindre l'armée ou accepter le rationnement en temps de guerre. Nous avons obtenu la paix par des moyens diplomatiques, un fait de plus en plus rare dans cette période d'instabilité politique en Europe. Maintenant que nous avons apporté la paix, nous pouvons améliorer notre pays de l'intérieur et devenir plus forts."
ALB_the_will_to_fight:0 "La volonté de combattre"
ALB_the_will_to_fight_desc:0 "Notre pays combattra jusqu'au bout ! Pas de recul, toujours en avant ! Nous ne perdrons pas notre prestige et ne nous abaisserons pas à négocier avec [ITA.GetNameDef] ! Nous résisterons et mordrons !"
ALB_meritocratic_system:0 "Système méritocratique"
ALB_meritocratic_system_desc:0 "Nous devons remplacer notre ancien système de promotion basé sur le statut social par un système basé sur les compétences ! Nous avons besoin de personnes compétentes pour diriger nos armées."
ALB_skanderbeg_military_academy:0 "Académie militaire Skanderbeg"
ALB_skanderbeg_military_academy_desc:0 "Nous devons former des recrues. Notre armée doit être professionnelle et organisée ! Pour atteindre cet objectif, nous créerons une académie militaire dans la capitale pour former des soldats d'élite."
ALB_promote_brilliant_officers:0 "Promouvoir les officiers brillants"
ALB_promote_brilliant_officers_desc:0 "Avec la création de notre académie, nous promouvrons les recrues et membres qui se sont distingués en classe et lors des exercices militaires. L'un d'eux était Spiro Theodori Moisiu, un jeune soldat dans la trentaine. Ses capacités ont surpris le haut commandement militaire, et nous avons unanimement décidé de le nommer général."
ALB_military_research:0 "Recherche militaire"
ALB_military_research_desc:0 "Nos armées doivent posséder les meilleures armes que la technologie peut fournir. Nous ouvrirons un centre de recherche pour développer de meilleures armes, de l'artillerie et tout ce qui concerne l'équipement militaire."
ALB_change_of_doctrine:0 "Changement de doctrine"
ALB_change_of_doctrine_desc:0 "Notre armée est obsolète depuis longtemps. Heureusement, elle rattrape rapidement les autres nations. Le haut commandement militaire a décidé qu'il était temps de changer la doctrine de l'armée."
ALB_strike_first:0 "Frapper le premier"
ALB_strike_first_desc:0 "Il n'y a pas si longtemps, nous étions influencés par [ITA.GetNameDef], au bord de l'extinction. Aujourd'hui, nous sommes une nation forte. Nous défendrons notre territoire en frappant les envahisseurs de la péninsule italienne lorsqu'ils s'y attendront le moins !"
ALB_lightning_war:0 "Guerre éclair"
ALB_lightning_war_desc:0 "Peu importe si nos forces sont plus faibles en puissance de feu ! Notre force réside dans les encerclements rapides pour couper les lignes de ravitaillement ennemies. Ainsi, nous pouvons infliger de graves dégâts à l'ennemi avec un minimum de combats !"
ALB_superior_firepower:0 "Supériorité de feu"
ALB_superior_firepower_desc:0 "Nous devons augmenter notre puissance de feu à tout prix. Avoir une supériorité de feu nous permet de vaincre l'ennemi avec le moins de pertes possibles ! La main-d'œuvre de notre pays est précieuse et nous ne devons pas la gaspiller."
ALB_ridding_the_army_of_foreign_influence:0 "Éliminer l'influence étrangère de l'armée"
ALB_ridding_the_army_of_foreign_influence_desc:0 "Maintenant que notre armée se réforme et recrute des officiers talentueux, nous n'avons plus besoin des officiers [ITA.GetAdjective]. Pendant leur séjour, organiser notre armée ne semblait pas être leur priorité. Nous aurons le contrôle total de notre armée !"
ALB_modern_army:0 "Armée moderne"
ALB_modern_army_desc:0 "Après toutes les réformes militaires, nous pouvons maintenant considérer notre armée comme moderne, organisée et prête. Le gouvernement et le peuple doivent être fiers de ce à quoi ressemble notre nouvelle armée."
ALB_fortify_the_coastline:0 "Fortifier la côte"
ALB_fortify_the_coastline_desc:0 "Il serait sage de fortifier notre littoral, car les invasions navales sont très probables si nous entrons en guerre avec des puissances étrangères."
ALB_fortify_the_kingdom_of_yugoslavia_border:0 "Fortifier la frontière avec le Royaume de Yougoslavie"
ALB_fortify_the_kingdom_of_yugoslavia_border_desc:0 "Nous devons fortifier les frontières avec [YUG.GetNameDef] pour résister en cas d'invasion surprise. Les forts les occuperont pendant que nous mobiliserons le gros de notre armée au nord et à l'est."
ALB_balance_the_budget:0 "Équilibrer le budget"
ALB_balance_the_budget_desc:0 "Équilibrer le budget en réduisant les dépenses publiques aidera à diminuer les impôts sur les citoyens, augmentant ainsi la consommation."
ALB_invite_foreign_investors:0 "Inviter des investisseurs étrangers"
ALB_invite_foreign_investors_desc:0 "Nous avons besoin d'investisseurs pour faire fonctionner correctement nos économies et nos entreprises."
ALB_encourage_civilian_consumption:0 "Encourager la consommation civile"
ALB_encourage_civilian_consumption_desc:0 "Nos entreprises prospéreront si la consommation augmente. Si cela se produit, nous sortirons de la crise économique dans laquelle nous sommes depuis 1929. Nous ferons tout notre possible pour encourager les citoyens à consommer davantage de produits fabriqués par nos entreprises !"
ALB_fund_industry:0 "Financer l'industrie"
ALB_fund_industry_desc:0 "Pour rivaliser avec les autres pays, nous devons nous doter d'une industrie compétente. Nous sommes un petit pays peu peuplé, mais nous avons un potentiel industriel considérable. Nos ressources naturelles sont abondantes et nous disposons d'une main-d'œuvre industrielle suffisante."
ALB_civ_1:0 "Ouvrir des usines dans les zones reculées"
ALB_civ_1_desc:0 "Notre campagne est largement inexploitée. Il y a également beaucoup de chômeurs dans ces zones car les entreprises y sont rares. En construisant des industries dans ces zones, notre potentiel industriel augmentera, améliorant la situation économique des habitants de la campagne."
ALB_civ_2:0 "Renforcer l'industrie dans la capitale"
ALB_civ_2_desc:0 "Nous réduirons le taux de chômage dans la capitale et industrialiserons davantage notre pays en construisant de nouvelles usines civiles. Tirana deviendra l'une des villes les plus industrialisées du monde !"
ALB_mil_1:0 "Investissements militaires dans la campagne"
ALB_mil_1_desc:0 "Nous avons besoin d'une main-d'œuvre plus importante pour produire l'équipement nécessaire à l'armée. La campagne est idéale pour lancer l'industrie militaire, car la population y est majoritairement au chômage."
ALB_mil_2:0 "Étendre l'industrie militaire à Tirana"
ALB_mil_2_desc:0 "Il nous manque encore de l'équipement pour nos armées. Nous devrons étendre notre industrie militaire pour garantir que nos soldats soient entièrement équipés pour le combat."
ALB_infrastructure:0 "Créer Hekurudha Shqiptare"
ALB_infrastructure_desc:0 "Hekurudha Shqiptare (Chemins de fer albanais) sera notre opérateur ferroviaire, qui reliera tout le pays. Le déplacement de nos troupes sera beaucoup plus facile !"
ALB_auxiliary_sections_of_the_army:0 "Sections auxiliaires de l'armée"
ALB_auxiliary_sections_of_the_army_desc:0 "Nous devons développer et créer des sections de l'armée qui fourniront un soutien essentiel à nos armées terrestres, nous donnant ainsi une supériorité en cas de guerre."
ALB_academy_air:0 "Cours d'aviation dans les académies militaires"
ALB_academy_air_desc:0 "Nous devons introduire un cours d'aviation dans les académies militaires du pays pour disposer de pilotes compétents. La qualité prime sur la quantité !"
ALB_academy_navy:0 "Cours de manœuvres maritimes dans les académies militaires"
ALB_academy_navy_desc:0 "Nous devons introduire un cours de manœuvres maritimes dans les académies militaires du pays pour avoir des capitaines compétents sur nos navires. La qualité prime sur la quantité !"
ALB_establish_the_airforce:0 "Créer une force aérienne"
ALB_establish_the_airforce_desc:0 "L'Albanie n'a jamais eu de véritable force aérienne. Nous devons changer cela et établir une force aérienne."
ALB_fighters:0 "Chasseurs"
ALB_fighters_desc:0 "Les chasseurs sont la clé de la domination aérienne, nous devons donc commencer leur production immédiatement."
ALB_bombers:0 "Bombardiers"
ALB_bombers_desc:0 "Détruire l'industrie ennemie peut nous accorder une supériorité industrielle si c'est fait correctement."
ALB_battleships:0 "Cuirassés"
ALB_battleships_desc:0 ""
ALB_light_naval_warfare:0 "Guerre navale légère"
ALB_light_naval_warfare_desc:0 ""
ALB_tirana_ports:0 "Ports de Tirana"
ALB_tirana_ports_desc:0 ""
ALB_invite_egyptian_exiles:0 "Inviter les exilés [EGY.GetAdjective]"
ALB_invite_egyptian_exiles_desc:0 "Zog a peut-être été un monarque faible, mais nos liens culturels étroits avec les [EGY.GetAdjective] faciliteront le couronnement du monarque exilé Abbas II d'Égypte pour créer une monarchie plus légitime et plus forte pour [ALB.GetNameDef]."
ALB_reorganize_the_government:0 "Réorganiser le gouvernement"
ALB_reorganize_the_government_desc:0 "Pour garantir la stabilité de notre nouvelle monarchie, nous devons nous assurer que les bonnes personnes accèdent au pouvoir."
ALB_fortify_our_position:0 "Fortifier notre position"
ALB_fortify_our_position_desc:0 "Des forces internes et externes pourraient ne pas accepter un monarque [EGY.GetAdjective] prenant le pouvoir. Nous devons être prêts à toute agression contre notre règne."
ALB_egyptianize_the_army:0 "Égyptianiser l'armée"
ALB_egyptianize_the_army_desc:0 "Jusqu'à présent, l'armée [ALB.GetAdjective] repose sur un système ancien et faible. Pour garantir notre sécurité, nous réorganiserons les forces armées sur un modèle égyptien."
ALB_egyptian_industries:0 "Industries [EGY.GetAdjective]"
ALB_egyptian_industries_desc:0 "Abbas a de nombreux conseillers proches prêts à offrir leur soutien pour le développement industriel, il est idéal de les écouter."
ALB_liberate_our_homeland:0 "Libérer notre patrie"
ALB_liberate_our_homeland_desc:0 "Pendant plus de 30 ans, la patrie [EGY.GetAdjective] a été injustement dirigée par des dirigeants illégitimes qui ont écarté Abbas du trône. Il est temps de réparer cette injustice et de restaurer le dirigeant légitime de toute l'Égypte !"

#Ideas
peoplearmy_focus:0 "L'Armée du Peuple"
peoplearmy_focus_desc:0 "Pour défendre notre rêve communiste, le peuple doit prendre les armes en masse et défendre notre République socialiste ! Nous ne serons plus impuissants comme avant !"
second_republic:0 "La Seconde République"
second_republic_desc:0 "Nous devons nous lever et nous battre pour protéger notre peuple contre la menace fasciste et communiste ! Nous ne permettrons à personne de nous enlever nos idées de liberté et nos droits fondamentaux !"
socialism_one_country_idea:0 "Socialisme dans un seul pays !"
permanent_revolution_idea:0 "Révolution permanente !"
permanent_revolution_idea_desc:0 "La doctrine de la Révolution Permanente se concentre sur la propagation de la révolution dans les pays capitalistes du monde entier. Nous répandrons nos idéaux de suprématie et de gouvernement du prolétariat !"
democratic_army_focus:0 "Armée de la République"
democratic_army_focus_desc:0 "Pour défendre notre patrie contre [ITA.GetNameDef] et d'autres menaces potentielles, nous devons augmenter le nombre de recrues pour former une véritable armée capable de protéger le pays face à [ITA.GetLeader]."
absolute_influence:0 "Influence absolutiste"
absolute_influence_desc:0 "Les absolutistes gagnent de plus en plus d'influence au sein du gouvernement. Atteindre le contrôle complet de notre pays n'est qu'une question de temps."
constitution_influence:0 "Influence constitutionnaliste"
constitution_influence_desc:0 "Les constitutionnalistes gagnent de plus en plus d'influence au sein du gouvernement. Atteindre le contrôle complet de notre pays n'est qu'une question de temps."
italian_in_the_army:0 "Officiers [ITA.GetAdjective] dans l'armée"
italian_in_the_army_desc:0 "Des officiers [ITA.GetAdjective] ont été envoyés dans notre armée. Bien qu'ils apportent leur expérience à nos troupes, ils compliquent la gestion militaire et diminuent le moral de nos soldats. Cela durera tant que nous n'aurons pas éliminé toute influence étrangère dans notre armée."
absolute_ruler:0 "Règne incontesté"
absolute_ruler_desc:0 "En annulant la constitution, nous avons donné tout le pouvoir à notre grand roi ! Il conduira notre nation vers la gloire, la prospérité et le prestige ! La responsabilité du pays repose sur les épaules du roi !"
ALB_the_kings_army_idea:0 "L'armée du roi"
ALB_the_kings_army_idea_desc:0 "Le peuple de notre nation doit se mobiliser pour faire face à nos ennemis. Nous prouverons au monde que [ALB.GetNameDef] n'est pas une nation à prendre à la légère ! Nous ne serons plus jamais faibles, car notre courage est une arme invincible !"
righteous_ruler:0 "Règne juste"
righteous_ruler_desc:0 "Notre noble roi gouverne maintenant notre pays avec l'aide du parlement. Ses pouvoirs en tant que roi sont limités, mais il reste le chef de l'État et le symbole de [ALB.GetNameDef]. Que Dieu bénisse Skenderbeg III !"
ALB_great_depression:0 "Crise économique"
ALB_great_depression_desc:0 "La Grande Dépression, qui a provoqué le chaos économique dans le monde entier, a touché sévèrement [ALB.GetNameDef]. Les investisseurs étrangers ont quitté le pays, et il est devenu de plus en plus difficile de rembourser les prêts et de gérer le budget national."
ALB_faith_in_liberty_idea:0 "Foi en la liberté"
ALB_faith_in_liberty_idea_desc:0 "Nous croyons en la démocratie et en la liberté, et nous protégerons ces valeurs coûte que coûte. Notre peuple est prêt à défendre le pays au prix de sa vie. Nous sommes la terre des libres !"
balkans_trade:0 "Accord commercial trans-européen"
balkans_trade_desc:0 "Grâce à nos envoyés diplomatiques, nous avons pu conclure un accord commercial bénéfique pour notre pays. Cet accord nous aidera à approvisionner notre armée et à gagner de l'influence dans le monde des affaires."
german_alb_trade:0 "Pacte commercial [GER.GetAdjective]-[ALB.GetAdjective]"
german_alb_trade_desc:0 "La coopération économique entre nos deux nations devrait renforcer notre amitié et nous être mutuellement bénéfique. Cet accord facilitera l'approvisionnement et l'organisation de nos troupes."
italian_invasion_incoming_idea:0 "Invasion [ITA.GetAdjective] imminente"
italian_invasion_incoming_idea_desc:0 "Nos espions et diplomates envoyés à [ITA.GetNameDef] nous ont avertis qu'ils ont découvert un plan élaboré par le haut commandement militaire [ITA.GetAdjective] pour envahir notre pays. Si leurs informations sont exactes, nous devons préparer notre nation à la guerre le plus rapidement possible !"
alb_concessions_to_italy:0 "Compromis avec [ITA.GetNameDef]"
alb_concessions_to_italy_desc:0 "Nous avons acheté la paix avec [ITA.GetNameDef] à un prix relativement élevé, mais c'était le prix de notre indépendance."
albanian_concessions:0 "Concessions [ALB.GetAdjective]"
economic_mobilisation:0 "Mobilisation économique"
man_mobilisation:0 "Mobilisation générale"
economy_overloaded:0 "Économie surchargée"
acknowledgments_of_the_nation:0 "Reconnaissance de la nation"
acknowledgments_of_the_nation_desc:0 "Le peuple de [ALB.GetNameDef] reconnaît nos actions ! Nous avons sauvé la vie de nombreux jeunes hommes ! Le peuple est désormais reconnaissant envers nous, plus attaché que jamais aux valeurs du gouvernement ! Il est aussi plus enclin à rejoindre l'armée et plus tolérant envers le rationnement en temps de guerre."
will_to_fight:0 "Volonté de se battre"
will_to_fight_desc:0 "Notre pays se battra jusqu'au bout ! Pas un pas en arrière, toujours en avant ! Nous ne perdrons pas notre prestige et ne nous rabaisserons pas à négocier avec [ITA.GetNameDef] ! Nous résisterons et mordrons !"
meritocracy_system:0 "Système méritocratique"
meritocracy_system_desc:0 "Nous devons remplacer notre ancien système de promotion basé sur le statut social par un système basé sur les compétences ! Nous avons besoin de personnes compétentes pour diriger nos armées."
modern_army:0 "Armée moderne"
modern_army_desc:0 "Après toutes les réformes militaires, nous pouvons maintenant considérer notre armée comme moderne, organisée et préparée. Le gouvernement et le peuple doivent être fiers de notre nouvelle armée."
balanced_budget:0 "Budget équilibré"
balanced_budget_desc:0 "Équilibrer le budget en réduisant les dépenses gouvernementales nous aidera à diminuer les impôts imposés aux citoyens, augmentant ainsi la consommation."
invite_investors:0 "Inviter des investisseurs étrangers"
invite_investors_desc:0 "Nous avons besoin d'investisseurs pour faire fonctionner correctement notre économie et nos entreprises."
go_with_ita:0 "Commerce accru avec [ITA.GetNameDef]"
go_with_fra:0 "Commerce accru avec [FRA.GetNameDef]"
no_go_with_ita:0 "Autorité de [ITA.GetNameDefCap] contestée"
civ_consommation:0 "Augmentation de la consommation civile"
civ_consommation_desc:0 "Nos entreprises prospéreront si la consommation augmente. Si cela se produit, nous sortirons de la crise économique dans laquelle nous sommes depuis 1929. Nous ferons tout notre possible pour encourager les citoyens à consommer davantage de produits fabriqués par nos entreprises !"


