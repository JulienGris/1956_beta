strategic_opinion:0 "Diplomatie stratégique"

#Événements

britain.92.t:0 "[ALB.GetNameDefCap] souhaite rejoindre les Alliés"
britain.92.d:0 "Les diplomates [ALB.GetAdjective] ont envoyé une demande diplomatique pour rejoindre les Alliés. En tant que nation démocratique, ils veulent se tenir à nos côtés pour dénoncer la menace fasciste et communiste. De plus, en tant que principale nation démocratique, il est de notre rôle de montrer l'exemple et de guider les autres dans la voie de la démocratie."

albania.1.t:0 "L'affaire [ITA.GetAdjective]"
albania.1.d:0 "Nos espions et diplomates envoyés à [ITA.GetNameDef] nous ont avertis qu'ils avaient découvert un plan élaboré par le haut commandement militaire [ITA.GetAdjective] pour envahir notre pays. Le gouvernement [ALB.GetAdjective] a été choqué par cette nouvelle, car les [ITA.GetAdjective] et [ALB.GetAdjective] entretiennent des relations amicales depuis des années, en plus de coopérations militaires et économiques. Notre pays n’a que peu de chances de repousser l’invasion tel qu’il est actuellement. Nous devons mobiliser le pays et préparer la nation à la guerre le plus rapidement possible !"
albania.1.a:0 "Maudit soit [ITA.GetNameDef] !"

albania.2.t:0 "Conférence de Durrës"
albania.2.d:0 "[ITA.GetLeader] et le gouvernement [ITA.GetAdjective] ont accepté de négocier un traité dans la ville [ALB.GetAdjective] de Durrës. Lorsqu’ils ont appris que nous avions découvert leur plan d’invasion, ils ont été surpris, mais heureusement, ils n’étaient pas en colère contre nous.\n\nIls ont ouvert la conférence en présentant leurs exigences :\nIls veulent un contrôle total sur la politique étrangère de [ALB.GetNameDef].\nIls veulent également que la langue italienne soit obligatoire dans les écoles [ALB.GetAdjective].\n\nEn échange, nous conservons le contrôle total de notre économie, tandis que [ITA.GetNameDef] assure notre sécurité face aux ennemis extérieurs. Leurs conditions sont probablement moins strictes que si nous les avions laissés exécuter leur plan d’invasion surprise.\n\nL’annexion complète aurait été presque notre seule option si leur plan avait réussi. Que devons-nous faire ?"
albania.2.a:0 "Accepter les conditions."
albania.2.b:0 "La soumission est hors de question, mais nous pouvons nous proposer comme partenaire commercial."

albania.4.t:0 "Élection du président de la Çeta de Pezë"
albania.4.d:0 "Le coup d’État a réussi et nous contrôlons désormais le siège du gouvernement. Au départ, Myslim Peza, commandant de nos forces armées, était favori pour devenir président de l’Albanie. Cependant, le jeune Hoxha, récemment de retour de Paris, devient de plus en plus populaire. Son éloquence est à ne pas sous-estimer. L’organisation centrale du Parti a décidé d’organiser une élection pour déterminer qui dirigera le pays."
albania.4.a:0 "Allons avec Peza !"
albania.4.b:0 "Hoxha est meilleur !"
albania.4.c:0 "La vieille garde Malëshova nous mènera à la victoire !"

albania.5.t:0 "Les bunkers de Hoxha"
albania.5.d:0 "Aujourd’hui, Hoxha a présenté un plan quelque peu surprenant aux leaders communistes et aux journalistes : construire des bunkers à travers tout le pays. Officiellement, Hoxha annonce ces bunkers pour protéger le pays contre les menaces extérieures. Il met en garde la population contre le danger de l’Occident. Cependant, tous nos leaders savent que ces bunkers serviront d’outil de propagande politique. Nous pouvons utiliser la peur de la population pour mieux les contrôler. Environ 173 000 bunkers sont prévus."
albania.5.a:0 "Que Hoxha nous protège !"
albania.5.b:0 "Notre économie ne peut pas se permettre ces dépenses."

albania.6.t:0 "Conférence des investisseurs étrangers"
albania.6.d:0 "Le gouvernement a invité des investisseurs de différents pays pour discuter des opportunités d’investissement. Cependant, les investisseurs de deux pays ne s’accordent pas sur le commerce en [ALB.GetNameDef]. Les investisseurs [ITA.GetAdjective] sont mécontents des échanges avec [FRA.GetNameDef] et menacent de réduire le commerce avec nous si nous ne cessons pas nos relations avec [FRA.GetNameDef]. Que devons-nous faire ?"
albania.6.a:0 "Il serait préférable de nous aligner sur [ITA.GetNameDef]."
albania.6.b:0 "Maudit soit [ITA.GetNameDef] ! Nous allons avec [FRA.GetNameDef] !"

albania.7.t:0 "Traité de Milan"
albania.7.d:0 "Suite aux négociations, le gouvernement [ALB.GetAdjective] et [ITA.GetLeader] ont décidé de signer un traité final. Nous avons pu éviter la guerre avec [ITA.GetNameDef] par la diplomatie. La population nous en est reconnaissante. Nous pouvons être fiers de nous !\n\nNote : [ITA.GetNameDefCap] n’attaquera plus [ALB.GetNameDef] via l’arbre des focus. Le focus « Occupation albanaise » est désormais désactivé."
albania.7.a:0 "Parfait !"

albania.8.t:0 "Situation de [ALB.GetNameDef] en 1936"
albania.8.d:0 "Notre royaume n’est pas dans la meilleure situation possible. La crise économique de 1929 a presque ruiné notre économie, nous rendant dépendants de [ITA.GetNameDef]. Leur influence est de plus en plus visible dans notre quotidien, que ce soit par leurs investissements financiers ou leur présence dans notre éducation et notre système politique. Alors que les tensions montent en Europe, améliorer notre situation économique et affirmer notre complète indépendance vis-à-vis de [ITA.GetNameDef] doit être une priorité. Améliorer les relations avec nos voisins, tels que [GRE.GetNameDef] et [YUG.GetNameDef], est également essentiel. Atteindre ces objectifs et renforcer notre armée fera de nous une puissance dans la région Adriatique. Que notre grand leader nous guide !"
albania.8.a:0 "En avant !"

albania.9.t:0 "Grève de la faim de février 1936"
albania.9.d:0 "Les ouvriers et artisans de Korçë se sont levés et ont commencé une importante grève dans la ville. Ils dénoncent la situation économique et la pauvreté. Si nous laissons cette manifestation se poursuivre, le mouvement pourrait se propager et provoquer une révolte générale. Mais réprimer la grève pourrait nuire à notre image publique et à nos relations internationales."
albania.9.a:0 "Arrêtons cette manifestation et arrêtons les leaders !"
albania.9.b:0 "Laissons-les faire."

albania.11.t:0 "Révolte dans le Nord !"
albania.11.d:0 "Les ouvriers du Nord se sont soulevés, ont pris les armes, vaincu la garnison locale et contrôlent désormais le nord du pays ! Avec Myslim Peza comme chef, la situation est grave. Nous n’aurions pas dû les laisser faire."
albania.11.a:0 "Préparez les troupes au combat !"

albania.12.t:0 "Exercices militaires avec [ITA.GetNameDef] ?"
albania.12.d:0 "Le gouvernement de [ITA.GetNameDef] nous propose d’organiser ensemble des exercices militaires à Naples. Ils affirment que cela pourrait offrir une expérience précieuse à nos troupes et améliorer nos relations diplomatiques."
albania.12.a:0 "Nous acceptons."
albania.12.b:0 "Refuser la proposition."

albania.13.t:0 "[ALB.GetNameDefCap] souhaite rejoindre le Komintern"
albania.13.d:0 "Nos camarades du Parti du Travail d’Albanie ont fait des progrès significatifs. [ALB.GetNameDefCap] est prêt à rejoindre le Komintern."
albania.13.a:0 "Que nos camarades nous rejoignent !"
albania.13.b:0 "Ils ne sont pas encore prêts."

albania.14.t:0 "[ALB.GetNameDefCap] demande une garantie"
albania.14.d:0 "Le gouvernement [ALB.GetAdjective], soucieux de maintenir son indépendance en ces temps troublés, souhaite approfondir les relations entre nos deux nations en établissant un traité défensif assurant le maintien des frontières de [ALB.GetNameDef]."
albania.14.a:0 "[ALB.GetNameDefCap] a notre protection."
albania.14.b:0 "Nous n’avons aucun intérêt à défendre [ALB.GetNameDef]."

albania.15.t:0 "Question de la capitale"
albania.15.d:0 "La question d’une capitale nationale a été soulevée par de nombreux membres du gouvernement. Tirana est le centre du pays, mais depuis la réunification de l’Albanie et de l’Égypte, Alexandrie et Le Caire ont prouvé qu’elles étaient tout aussi importantes, voire plus que Tirana.\n\nNotre pays est confronté à un choix difficile pour déterminer la meilleure option, s’il y en a une."
albania.15.a:0 "Tirana, notre ancienne et actuelle capitale !"
albania.15.b:0 "Le Caire, notre ville la plus peuplée."
albania.15.c:0 "Alexandrie, alors !"

#Décisions
ALB_reintegrate_gjirokaster:0 "Réintégrer Gjirokastër"
ALB_reintegrate_gjirokaster_desc:0 "Nous avons enfin libéré notre patrie des griffes de nos anciens oppresseurs ! Avant notre libération, Gjirokastër était sous occupation de [GRE.GetNameDef], et notre peuple y a été fortement réprimé et intégré artificiellement à leur nation. Il faudra du temps pour inverser les effets de leur occupation, mais c'est pour le plus grand bien."

