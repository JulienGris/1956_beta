 SOV_relocate_industry_from_kharkov:0 "Relocaliser l’industrie de Kharkov"
 SOV_industry_relocation_desc:0 "La guerre est à nos portes et nos ennemis menacent nos bassins industriels de l’Ouest. Déplaçons-les loin, dans l’Oural, hors de portée de leurs bombardiers lourds. Ainsi, nous pourrons protéger notre industrie, produire davantage d’équipement militaire et lancer des contre-attaques décisives au nom de [SOV.getleader] et de sa vision de [SOV.GetRulingIdeologyNoun]."

 has_cosmetic_tag_smersh_tt:0 "Est §YScandinavie§!, l’§YUnion nordique§! ou §YAutriche-Hongrie§!"
