 SOV_grieve_stalin:0 "Pleurer Staline"
 SOV_grieve_stalin_desc:0 "Le Politburo a annoncé la mort d’Io­sif Vissarionovitch Staline. Tandis que le pays pleure la disparition de notre dirigeant bien-aimé, les circonstances honteuses de son étouffement dans son vomi ont été tenues secrètes. Faute de direction assurée, divers membres du Politburo sont prêts à tout pour éliminer leurs concurrents."

