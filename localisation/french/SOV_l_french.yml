 r56_SOV_development_of_tankograd_tt:0 "S’il n’existe aucune autre §YInstallation expérimentale§! dans §Y[572.GetName]§!, nous gagnerons §G1§! §Y$land_facility$§! à §Y[572.GetName]§!."
