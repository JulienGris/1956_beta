 soviet.104.d:0 "Après la défaite de nos alliés en Espagne, Juan Modesto, commandant espagnol et diplômé de l’Académie militaire Frunze, a demandé l’asile et s’est proposé de servir dans notre armée."
 soviet.104.a:0 "Lui accorder l’asile et reconnaître son grade"
