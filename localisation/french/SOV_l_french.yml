 #Personnages
 SOV_yakov_zeldovich:0 "Yakov Zeldovich"
 SOV_yulii_khariton:0 "Yulii Khariton"
 SOV_aleksandr_morozov:0 "Aleksandr Morozov"
 SOV_nikolai_dukhov:0 "Nikolai Dukhov"
 SOV_mikhail_rudnitsky:0 "Mikhail A. Rudnitsky"
 SOV_joseph_yakovlevich_kotin:0 "Joseph Yakovlevich Kotin"
 SOV_ivan_dmitriev:0 "Ivan Dmitriev"

 SOV_iron_curtain_faction:0 "Kominform"
 SOV_Lenin_Cult:0 "Culte de Lénine"
 SOV_Lenin_Cult_desc:0 "Nous devons remplacer la dévotion religieuse par la dévotion envers l’État."
 SOV_New_Soviet_Woman:0 "La nouvelle femme soviétique"
 SOV_New_Soviet_Woman_desc:0 "Nous avons accompli d’immenses progrès vers l’égalité des sexes dans notre société. Continuons sur cette voie et demandons aussi aux femmes de servir au combat. Elles peuvent occuper des rôles de soutien en première ligne et certains postes de combat limités, libérant ainsi des hommes valides pour le front. Seule une véritable égalité et un engagement total envers la cause nous permettront de résister à l’agression des puissances étrangères."

 SOV_Trotskyite_Coup:0 "Coup trotskyste"
 SOV_Trotskyite_Coup_desc:0 ""
 SOV_Organize_Labor:0 "Organiser le travail"
 SOV_Organize_Labor_desc:0 ""
 trotsky_check:0 "S’est déjà révolté"
 SOV_khruschev_flag:0 "Khrouchtchev a pris la direction durant la guerre civile"

 SOV_tank_improvements_idea:0 "Améliorations des chars"
 SOV_mass_tank_procution_idea:0 "Production massive de chars"

 SOV_Integrate_Labor_Into_The_Military:0 "Intégrer le travail dans l’armée"
 SOV_Integrate_Labor_Into_The_Military_desc:0 "Tout le monde sert. Certains manient le fusil, d’autres le marteau. Le travail doit apprendre à manier les deux."
 SOV_A_Gun_In_Every_Hand:0 "Un fusil dans chaque main"
 SOV_A_Gun_In_Every_Hand_desc:0 "Le pouvoir sort du canon d’un fusil long. Nous devons nous assurer d’avoir un stock suffisant d’armes pour la libération du prolétariat mondial."
 SOV_New_Infantry_Equipment:0 "Nouvel équipement d’infanterie"
 SOV_New_Infantry_Equipment_desc:0 "Avec un équipement modernisé, nos glorieux soldats auront les outils nécessaires pour libérer le monde de l’oppression capitaliste."
 SOV_Red_Mountaineers:0 "Montagnards rouges"
 SOV_Red_Mountaineers_desc:0 "Nous devons lancer un programme de formation de troupes spécialisées dans le combat en terrain montagneux. Habituées aux conditions les plus rudes, elles seront l’avant-garde de notre libération du monde."
 SOV_Jungle_Training:0 "Entraînement en jungle"
 SOV_Jungle_Training_desc:0 "Nous devons développer des méthodes et former nos soldats à la guerre en milieu tropical. Le prolétariat des tropiques a autant besoin d’être libéré que celui exploité en Angleterre ou en France."
 SOV_Nationwide_Wargame:0 "Jeux de guerre nationaux"
 SOV_Nationwide_Wargame_desc:0 "Grâce à un vaste exercice militaire couvrant toute l’étendue de l’URSS, nous pourrons acquérir l’expérience nécessaire pour mener efficacement une guerre moderne."
 SOV_Work_On_Logistics:0 "Améliorer nos capacités logistiques"
 SOV_Work_On_Logistics_desc:0 "Les soldats doivent être constamment approvisionnés en nourriture et en munitions pour être efficaces au combat. Nous devons organiser un corps d’officiers d’élite afin de garantir que l’armée reçoive toujours ce dont elle a besoin. Alexandre Vassilevski est un commandant immensément compétent, doté des compétences nécessaires pour constituer ce nouvel échelon d’élite."
 SOV_Military_Machine:0 "La machine militaire"
 SOV_Military_Machine_desc:0 "La machine militaire soviétique continuera de produire des armes jusqu’au jour où tout le prolétariat sera libéré de l’oppression."
 SOV_Develop_Resources:0 "Développer les ressources"
 SOV_Develop_Resources_desc:0 "L’industrie a besoin de minerais et d’autres ressources pour fabriquer des armes. Nous devons ouvrir de nouvelles mines pour répondre à cette demande."
 SOV_more_tech:0 "Investir dans la science"
 SOV_more_tech_desc:0 "Nous devons repousser sans cesse les limites du savoir humain. Grâce à la science, nous pourrons bâtir une société meilleure pour le peuple."
 SOV_The_Working_Man:0 "L’homme du peuple"
 SOV_The_Working_Man_desc:0 "L’ouvrier est la pierre angulaire de la révolution trotskyste. S’il ne connaît pas sa place dans la révolution glorieuse, nos espoirs et nos rêves finiront tragiquement."
 SOV_Restrict_Political_Expression:0 "Restreindre l’expression politique"
 SOV_Restrict_Political_Expression_desc:0 "Bien que la liberté d’expression et les autres libertés politiques soient de grands conforts, l’époque moderne exige d’autres mesures. Ceux qui encouragent la rébellion et sèment la dissension doivent être pourchassés et éliminés."
 SOV_One_Dream_One_China:0 "Un rêve, une Chine"
 SOV_One_Dream_One_China_desc:0 "Nous aiderons le véritable gouvernement chinois à libérer les paysans des divers seigneurs de guerre qui ont pris le pouvoir ces dernières années. Le principal d’entre eux, Tchang Kaï-chek, sera un adversaire redoutable, et nous lui opposerons une assistance militaire."
 SOV_Return_Of_Japanese_Occupied_China:0 "Négocier le retour de la Chine occupée par le Japon"
 SOV_Return_Of_Japanese_Occupied_China_desc:0 "Nous allons arbitrer le conflit entre Japonais et Chinois pour en tirer une résolution équitable. Nous garantirons l’issue des négociations et veillerons à ce qu’elles se déroulent sans accroc. Le camarade Trotski n’est pas homme à être dupé."
 SOV_Indian_Communism:0 "Communisme indien"
 SOV_Indian_Communism_desc:0 "Nous encouragerons la diffusion des idées communistes parmi les paysans indiens afin qu’ils se libèrent de leurs maîtres britanniques décadents."
 SOV_Free_The_Peasants:0 "Libérer les paysans"
 SOV_Free_The_Peasants_desc:0 "Nous aiderons à industrialiser l’Inde et à faire passer son peuple des fermes aux usines nouvellement construites."
 SOV_Independence_For_India:0 "Indépendance de l’Inde"
 SOV_Independence_For_India_desc:0 "L’Inde obtiendra enfin son indépendance vis-à-vis de l’Empire britannique, vil et impérialiste."
 SOV_World_Revolution:0 "Révolution mondiale"
 SOV_World_Revolution_desc:0 "Les paysans et les travailleurs du monde entier doivent être libérés de l’oppression capitaliste et fasciste. Mais pour cela, nous devons agir avec prudence : les gouvernements n’apprécieront pas que nous diffusions notre idéologie et encouragions des rébellions dans leurs propres arrière-cours."
 SOV_ideological_propaganda:0 "Propagande idéologique"
 SOV_ideological_propaganda_desc:0 "Tout mouvement communiste est une cellule potentielle prête à organiser les masses."
 SOV_Expansion_of_Communism:0 "Expansion du communisme"
 SOV_Expansion_of_Communism_desc:0 "Nous inciterons davantage de peuples à voir la lumière du communisme en leur montrant les avantages qu’il apporte."
 SOV_European_Sphere:0 "La sphère européenne"
 SOV_European_Sphere_desc:0 "À mesure que notre idéologie communiste sera acceptée, les frontières de notre nation s’élargiront. Un jour, il n’y aura plus ni nations ni frontières, mais un gouvernement central unique. L’avenir de toute l’humanité est en jeu."
 SOV_Get_New_Communists_On_Board:0 "Rallier de nouveaux communistes"
 SOV_Get_New_Communists_On_Board_desc:0 "Pour séduire les communistes potentiels, nous devons leur montrer que le communisme est le meilleur système pour garantir une vie de qualité aux travailleurs. Nous consacrerons donc une part importante de notre production aux biens de consommation."
 SOV_Dawn_Of_A_Better_World:0 "L’aube d’un monde meilleur"
 SOV_Dawn_Of_A_Better_World_desc:0 "Nous devons tendre vers la construction d’une nation unique de l’humanité, inclusive et gouvernée par un seul État communiste, pour le bien de tous. Même si ce but semble lointain, nous devons persévérer."
 SOV_Perpetual_Warfare:0 "État de guerre perpétuelle"
 SOV_Perpetual_Warfare_desc:0 "Nous combattrons jusqu’à la dernière goutte de sang, la dernière balle, la dernière bombe, la dernière bouchée de pain, pour la liberté de toute l’humanité."
 SOV_The_Polish_Question:0 "La question polonaise"
 SOV_The_Polish_Question_desc:0 "Les Polonais nous ont toujours méprisés, et il est temps de mettre fin à leur insolence. La Pologne préférerait voir le monde détruit plutôt que de nous laisser libérer le prolétariat ou empêcher les Allemands de conquérir l’Europe entière."
 SOV_3_Way_Parition_Of_Poland:0 "Partition de la Pologne"
 SOV_3_Way_Parition_Of_Poland_desc:0 "Nous partagerons la Pologne avec les Allemands afin de réparer les injustices de Versailles. Les Tchèques recevront également une partie du territoire pour des raisons humanitaires, permettant aux Juifs et réfugiés de s’y installer s’ils le souhaitent. Nous ne faisons, après tout, que ce qui est juste."
 SOV_Stalin_Cult:0 "Culte de Staline"
 SOV_Stalin_Cult_desc:0 "Encourager le culte de la personnalité du camarade Staline renforcera la légitimité de notre gouvernement et augmentera l’efficacité des travailleurs. Le peuple soviétique a besoin d’une période de stabilité après tant d’années tumultueuses, et il ne sera pas privé de ce réconfort !"

 SOV_sing_katyusha_sing:0 "Chante, Katioucha, chante !"
 SOV_sing_katyusha_sing_focus:0 "Chante, Katioucha, chante !"
 SOV_sing_katyusha_sing_focus_desc:0 "Les ennemis de [ROOT.GetNameDef] entendront bientôt une chanson qu’ils n’oublieront jamais."
 manufacturer_applies_bonus_instantly_tooltip:0 "§CCe fabricant applique son effet même si vous avez déjà débloqué l’unité améliorée.§!"
 SOV_mass_firearms_production:0 "Production massive d’armes à feu"
 SOV_mass_firearms_production_desc:0 "La guerre exige un fusil dans les mains de chaque soldat. Notre industrie doit être mobilisée pour atteindre cet objectif."
 SOV_shocktroops:0 "Troupes de choc"
 SOV_shocktroops_desc:0 "Des soldats intrépides équipés de protections corporelles peuvent s’approcher suffisamment près pour engager l’ennemi à une distance telle que l’artillerie en devient inutile."

 SOV_copy_yaroslav_rubber_factory:0 "Copier l’usine de caoutchouc de Yaroslavl"
 SOV_copy_yaroslav_rubber_factory_desc:0 "Construite avec des technologies importées des États-Unis au début des années 1930, l’usine de caoutchouc de Yaroslavl était l’une des meilleures au monde à son époque. Elle était aussi l’une de nos seules sources de caoutchouc. Pour répondre aux besoins de l’effort de guerre, de nouvelles usines, encore plus grandes, doivent être bâties à travers l’URSS."
 SOV_tank_programs:0 "Programmes de chars"
 SOV_tank_programs_desc:0 "Après avoir analysé les performances de nos chars légers lors d’incidents avec l’Empire du Japon, nos usines ont reçu pour mission de développer un tout nouveau type de blindage."
 SOV_mass_tank_production:0 "Production massive de chars"
 SOV_mass_tank_production_desc:0 "Seule une production intensifiée de chars nous permettra de vaincre nos ennemis. Vers l’Ouest ! Pour la Mère Patrie !"
 SOV_establish_tankograd:0 "Fonder Tankograd"
 SOV_establish_tankograd_desc:0 "En fusionnant le personnel et l’équipement de l’usine de chars Kirov et d’autres usines avec l’usine de tracteurs de Tcheliabinsk, nous pouvons former un gigantesque complexe dédié à la production de véhicules blindés : Tankograd."
 SOV_tank_improvements:0 "Améliorations des chars"
 SOV_tank_improvements_desc:0 "Un blindage incliné augmentera l’efficacité de la protection de nos chars sans en alourdir le poids. Combiné à un canon puissant, il nous permettra de déployer les chars les plus redoutables jamais vus."
 SOV_cat_killers:0 "Tueurs de félins"
 SOV_cat_killers_desc:0 "Grâce à des chasseurs de chars spécialisés, nous pourrons enfin éliminer ces félins encombrants."

 SOV_Go_With_Molotov:0 "Remplacer Litvinov par Molotov"
 SOV_Go_With_Molotov_desc:0 "Nous devons montrer aux Allemands que nous sommes prêts à coopérer avec eux. Pour cela, nous devons épurer le ministère de ses éléments juifs, en signe de bonne volonté envers Hitler."
 SOV_French_Soviet_Reapproachment:0 "Rapprochement franco-soviétique"
 SOV_French_Soviet_Reapproachment_desc:0 "Il est clair que les nazis chercheront à s’emparer de nos terres pour leur Lebensraum. En conséquence, nous devons améliorer nos relations avec la France pour contenir la menace fasciste."
 SOV_Help_For_France:0 "Aide à la France"
 SOV_Help_For_France_desc:0 "Nous devons aider nos nouveaux amis français dans leurs efforts de développement de l’industrie militaire, de peur qu’ils ne tombent sous l’assaut fasciste."
 SOV_Reconcile_French_Comintern:0 "Réconcilier le Komintern français"
 SOV_Reconcile_French_Comintern_desc:0 "Nous devons mettre de côté nos différences idéologiques avec les communistes français et travailler ensemble pour des objectifs communs."
 SOV_French_Soviet_Treaty:0 "Traité franco-soviétique"
 SOV_French_Soviet_Treaty_desc:0 "Nos recherches sur les blindés stagnent. Si nous collaborons avec les Français, nous pourrons à nouveau développer des modèles de pointe."
 SOV_Assist_The_Czechs:0 "Aider les Tchèques"

 SOV_Assist_The_Czechs_desc:0 "Nous devons aider nos frères slaves à résister à l’assaut nazi. Nous enverrons des ingénieurs et d’autres conseillers pour les aider à se préparer à une invasion."
 SOV_Guarantee_For_Czechoslovakia:0 "Garantir les Tchèques"
 SOV_Guarantee_For_Czechoslovakia_desc:0 "Nous devons empêcher l’expansion nazie à chaque tournant. Disons aux Tchèques — et au monde — que leur souveraineté est protégée par la puissante Union soviétique."
 SOV_Pressure_Poland:0 "Faire pression sur la Pologne"
 SOV_Pressure_Poland_desc:0 "Faisons d’une pierre deux coups. Nous avons besoin d’un corridor d’approvisionnement vers la Tchécoslovaquie pour y envoyer des troupes en temps de guerre, et nous devons aussi corriger les injustices de Versailles. Cette démarche répond aux deux objectifs."
 SOV_Warm_Water_Ports:0 "Ports d’eaux chaudes"
 SOV_Warm_Water_Ports_desc:0 "Afin de développer notre flotte de la mer Noire, nous devons garantir l’accès au détroit du Bosphore. La Turquie est un voisin peu fiable, et les Américains comme d’autres conviennent que le peuple soviétique mérite l’accès à la Méditerranée. Constantinople nous appartient !"
 SOV_Trotsky_Was_Right:0 "Trotski avait raison"
 SOV_Trotsky_Was_Right_desc:0 "Il faut un grand homme pour reconnaître ses erreurs. Heureusement, [SOV.GetLeader] est un tel homme. Il lui est désormais clair que le seul espoir d’avenir réside dans la diffusion offensive du communisme à l’étranger. Nous devons être à l’avant-garde de la libération du prolétariat mondial."
 SOV_Support_Greek_Communists:0 "Soutenir les communistes grecs"
 SOV_Support_Greek_Communists_desc:0 "Nous recevons des messages urgents de communistes en Grèce qui réclament désespérément notre aide. Nous devons faire tout ce qui est en notre pouvoir : leur cause est la nôtre."
 SOV_Northern_Neighbors:0 "Voisins du Nord"
 SOV_Northern_Neighbors_desc:0 "Les peuples nordiques vivent sur des terres riches en ressources naturelles. Nous devons redistribuer à ceux qui en ont besoin et libérer la péninsule scandinave de l’oppression capitaliste."
 SOV_A_New_Soviet_Military:0 "Une nouvelle armée soviétique"
 SOV_A_New_Soviet_Military_desc:0 "L’Armée rouge doit être réformée pour rivaliser avec les arsenaux du fascisme et du capitalisme. Alors seulement les travailleurs du monde pourront être libérés."
 SOV_A_Modern_Military:0 "Une armée moderne"
 SOV_A_Modern_Military_desc:0 "Nous devons fournir un meilleur équipement à nos soldats afin qu’ils remportent la victoire sur le champ de bataille."
 SOV_Early_APCs:0 "Rechercher des modèles d’APC précoces"
 SOV_Early_APCs_desc:0 "Nous travaillons au développement de véhicules de déploiement efficaces pour l’infanterie blindée. Pour l’instant, les semi-chenillés feront l’affaire."
 SOV_Modern_Military_Research:0 "Centres de recherche militaire avancée"
 SOV_Modern_Military_Research_desc:0 "La science et la technologie sont la clé de l’avenir. Sans les armes avancées de demain, le feu de la révolution s’éteindra."
 SOV_NKVD_Intelligence:0 "Créer un service de renseignement du NKVD"
 SOV_NKVD_Intelligence_desc:0 "Désormais, le NKVD rendra compte des activités étrangères, qu’elles émanent d’amis ou d’ennemis."
 SOV_German_Scientists:0 "Infiltrer la recherche allemande en fusées"
 SOV_German_Scientists_desc:0 "Le NKVD a obtenu des documents qui nous permettront d’égaler les nazis en matière de technologie des fusées."
 SOV_The_Mig_Project:0 "Le projet MiG"
 SOV_The_Mig_Project_desc:0 "Nous avons mis la main sur des plans de moteurs à réaction. Nos bureaux d’études ont été informés de ces avancées et nous ont promis de nouveaux modèles d’avions utilisant ces turboréacteurs."
 SOV_Manhattan:0 "Infiltrer le projet Manhattan"
 SOV_Manhattan_desc:0 "Le NKVD a découvert que les Alliés occidentaux travaillent secrètement au Nouveau-Mexique sur de nouvelles super-armes. Nous devons obtenir leurs données pour ne pas être laissés pour compte !"
 SOV_Our_Own_B29:0 "Notre propre B-29"
 SOV_Our_Own_B29_desc:0 "Le bombardier américain B-29 est une super-arme que nous ne pouvons ni égaler ni intercepter pour l’instant. Ayant obtenu des informations sur l’appareil, nous devons commencer à produire le nôtre avant d’en voir des milliers au-dessus de Moscou !"

 SOV_France_In_The_Comintern:0 "Inviter la France au Komintern"
 SOV_France_In_The_Comintern_desc:0 "À présent que nous avons trouvé un terrain d’entente avec nos frères communistes français, nous devrions les inviter à nous rejoindre pour la liberté du prolétariat."
 SOV_Czechoslovakia_In_The_Comintern:0 "Inviter la Tchécoslovaquie au Komintern"
 SOV_Czechoslovakia_In_The_Comintern_desc:0 "Invitons nos amis tchèques au Komintern : ils bénéficieront de notre protection et nous pourrons freiner l’expansion de l’influence allemande en Europe centrale."
 SOV_Red_Marines:0 "Marines rouges"
 SOV_Red_Marines_desc:0 "Formons nos jeunes marines pour qu’ils deviennent les meilleurs au monde. Par le passé, nos forces spéciales ont pris du retard ; cela ne peut plus durer."
 SOV_Red_Paratroopers:0 "Parachutistes rouges"
 SOV_Red_Paratroopers_desc:0 "Nos parachutistes, grâce à un entraînement et des tactiques supérieurs, fondront du ciel pour infliger une destruction inouïe à nos ennemis."
 SOV_Russian_Democracy:0 "La démocratie en URSS"
 SOV_Russian_Democracy_desc:0 "Le peuple commence à réclamer la démocratie. Il appartient désormais aux organes dirigeants de répondre à cette demande et d’organiser des élections, avant que le pays ne soit déchiré par les divisions et la révolution."
 SOV_A_Fascist_State:0 "Encourager la montée du fascisme"
 SOV_A_Fascist_State_desc:0 "Un État fort est nécessaire pour protéger le peuple des agressions étrangères, mais le communisme n’est pas la solution. Nous devons nous éloigner de ce régime impie et adopter une nouvelle forme de gouvernement."
 SOV_Normalize_Relations_With_The_West:0 "Normaliser les relations avec l’Ouest"
 SOV_Normalize_Relations_With_The_West_desc:0 "Développons nos relations diplomatiques avec les nations occidentales et tentons de laisser le passé derrière nous."
 SOV_American_Cooperation:0 "Coopération américaine"
 SOV_American_Cooperation_desc:0 "D’une démocratie à une autre, les Américains peuvent grandement nous aider au développement économique tandis que nous faisons entrer la Russie dans la modernité."
 SOV_American_Industrial_Assistance:0 "Aide industrielle américaine"
 SOV_American_Industrial_Assistance_desc:0 "À mesure que nos relations avec les Américains s’améliorent, l’économie s’élance : des entreprises d’ici et d’ailleurs commencent à investir dans nos deux pays."
 SOV_Moving_Forward:0 "Aller de l’avant"
 SOV_Moving_Forward_desc:0 "Nous devons investir dans la coopération scientifique avec d’autres gouvernements démocratiques à travers le monde. Ensemble, il sera bien plus aisé de nous défendre contre les menaces que seuls."
 SOV_New_World_Order:0 "Un nouvel ordre mondial"
 SOV_New_World_Order_desc:0 "L’ancien ordre, fondé sur les empires et les monarchies, est pourri et s’effondre. Les Allemands veulent remodeler le monde pour la race aryenne, tandis que les impérialistes sont dépassés. Les véritables démocraties doivent s’unir pour défendre la liberté de tous."
 SOV_Develop_Oil_Concern:0 "Développer le secteur pétrolier"
 SOV_Develop_Oil_Concern_desc:0 "Nous devons investir dans la prospection et construire davantage de raffineries pour exploiter nos immenses gisements du Caucase."
 SOV_Look_Eastward:0 "Regarder vers l’Est"
 SOV_Look_Eastward_desc:0 "Méfiance à l’égard des agressions à l’est. Il est temps d’y affermir notre pouvoir et de préparer nos défenses."
 SOV_Non_Aggression_With_Japan:0 "Pacte de non-agression avec le Japon"
 SOV_Non_Aggression_With_Japan_desc:0 "Nous pouvons nous entendre avec les Japonais afin d’éviter la violence et des effusions de sang inutiles."
 SOV_End_Of_Non_Aggression_With_Japan:0 "Révoquer le pacte de non-agression avec le Japon"
 SOV_End_Of_Non_Aggression_With_Japan_desc:0 "L’accord conclu avec le Japon était vicié. Nous n’aurions pas dû nous y engager. Il est temps d’annoncer aux Japonais que nous en sortons."
 SOV_Develop_The_Ural_Moutain_Region:0 "Développer la région de l’Oural"
 SOV_Develop_The_Ural_Moutain_Region_desc:0 "La chaîne de l’Oural recèle de nombreux gisements que nous pouvons exploiter, offrant des emplois aux paysans pauvres et du minerai aux usines assoupies."
 SOV_Further_Development_of_Ural_Mountain_Mining_Facilities:0 "Installations minières de l’Oural"
 SOV_Further_Development_of_Ural_Mountain_Mining_Facilities_desc:0 "Plus de minerai vaut mieux que moins de minerai."
 SOV_Increase_Productivity:0 "Accroître la productivité"
 SOV_Increase_Productivity_desc:0 "Encourageons nos travailleurs à redoubler d’efforts et à renoncer aux satisfactions personnelles pour le bien du collectif. Qu’ils sachent que la nation compte sur eux !"
 SOV_Comforts_For_The_People:0 "Conforts pour le peuple"
 SOV_Comforts_For_The_People_desc:0 "Nous avons poussé notre peuple à ses limites pour bâtir un avenir radieux. Il est temps qu’il récolte les fruits de ses efforts. Nous développerons les industries de biens de consommation pour lui offrir des conforts tant attendus."
 SOV_Military_Expansion:0 "Expansion militaire"
 SOV_Military_Expansion_desc:0 "Nous agrandirons l’armée pour nous défendre contre l’agression étrangère. Tandis que les pays capitalistes manigancent et thésaurisent, nous constituerons avec diligence des stocks d’armements pour protéger notre peuple."
 SOV_Establish_Mobile_Construction_Units:0 "Unités mobiles de construction"
 SOV_Establish_Mobile_Construction_Units_desc:0 "Organisons des groupes de citoyens patriotes mobilisables pour réparer infrastructures et sites industriels en temps de guerre."
 SOV_Weapons_Of_War:0 "Armes de la guerre"
 SOV_Weapons_Of_War_desc:0 "Certains combattent avec des fusils, d’autres avec leur intellect. Une chose est sûre : chacun doit servir."
 SOV_Mass_Immunizations:0 "Vaccinations de masse"
 SOV_Mass_Immunizations_desc:0 "Augmenter le financement du Commissariat du peuple à la Santé améliorerait non seulement nos sanatoriums et hôpitaux, mais apporterait aussi le soutien médical qui manque aux zones rurales de notre vaste pays."
 SOV_Liberalize_Our_Regime:0 "Libéraliser notre régime"
 SOV_Liberalize_Our_Regime_desc:0 ""
 SOV_Founding_the_UN:0 "Fonder l’ONU"
 SOV_Founding_the_UN_desc:0 ""
 SOV_Scientific_Cooperation:0 "Coopération scientifique"
 SOV_Scientific_Cooperation_desc:0 ""
 SOV_Fascist_Counter_Coup:0 "Contre-coup fasciste"
 SOV_Fascist_Counter_Coup_desc:0 ""

 SOV_iron_curtain:0 "Le rideau de fer"
 SOV_iron_curtain_desc:0 "Notre sphère d’influence s’enfonce au cœur de l’Europe. Pour assurer la sécurité des régimes communistes nouvellement établis chez nos États clients, nous imposerons une direction forte et directe depuis Moscou, tout en ouvrant leurs yeux sur l’horrible oppression des travailleurs exercée par les puissances occidentales."
 SOV_expand_western_spy_rings:0 "Étendre les réseaux d’espionnage à l’Ouest"
 SOV_expand_western_spy_rings_desc:0 "Nous avons de nombreux sympathisants dans le monde. Leur soutien public à notre cause pourrait affaiblir les capitalistes et semer la discorde dans leur alliance."
 SOV_comecon:0 "Comecon"
#  SOV_comecon_desc:0 "Établir un Conseil d’assistance économique mutuelle (COMECON) offrirait d’immenses avantages économiques et industriels à tous les membres du Kominform, unissant davantage encore les travailleurs de nos grands pays !" # déplacé vers remplacement
 SOV_incite_a_greek_revolution:0 "Briser l’accord des pourcentages"
 SOV_incite_a_greek_revolution_desc:0 "Les Britanniques nous ont poussés à signer l’« accord des pourcentages », qui devait limiter notre influence en Grèce à 10 %. Le soutien hellénique au fascisme et les faiblesses industrielles et économiques actuelles des Britanniques peuvent jouer en notre faveur si nous agissons vite."
 SOV_overthrow_weak_king:0 "Renverser le roi faible"
 SOV_overthrow_weak_king_desc:0 "La situation actuelle de [YUG.GetNameDef] est inacceptable du point de vue des travailleurs et des paysans : impôts élevés, fraudes électorales et corruption endémique empêchent ce pays pauvre de se développer correctement. Les tensions sont déjà fortes ; il ne manque qu’un incident pour que la Révolution y éclate à son tour !"
 SOV_take_out_tito:0 "Abattre Tito"
 SOV_take_out_tito_desc:0 "Le traître révisionniste qui gouverne le peuple yougoslave est l’ennemi de tout ce que défend l’Union soviétique. Tito a montré qu’il faisait plus confiance à l’Occident qu’à ses propres alliés idéologiques ; pour cela, il doit être détruit."
 SOV_facilitate_a_balkan_federation:0 "Favoriser une fédération balkanique"
 SOV_facilitate_a_balkan_federation_desc:0 "Tito s’est révélé fin stratège, chef solide et allié puissant. Beaucoup ont tenté d’unifier les Balkans et ont échoué par faiblesse de leadership. Avec notre soutien, Tito prouvera enfin que c’est possible."
 SOV_sino_soviet_treaty:0 "Traité sino-soviétique"
 SOV_sino_soviet_treaty_desc:0 "Notre aide a porté ses fruits : Mao Zedong est sorti victorieux et semble prêt pour une coopération mutuelle sous la bannière du Kominform. Célébrons cette fraternité historique sino-soviétique !"
 SOV_support_vietnamese_revolutionaries:0 "Soutenir les révolutionnaires vietnamiens"
 SOV_support_vietnamese_revolutionaries_desc:0 "Les impérialistes et colonisateurs pensent avoir l’avantage sur les travailleurs d’Asie. Avec notre nouvel allié du Sud, nous pouvons attiser une révolte pour libérer les travailleurs d’Indochine. Ils n’ont besoin que de notre soutien industriel et militaire."
 SOV_interest_in_cuba:0 "Intérêt pour Cuba"
 SOV_interest_in_cuba_desc:0 "Pour frapper au cœur du capitalisme, il nous faut une base de départ adéquate. Par sa proximité avec les États-Unis, Cuba est un emplacement idéal !"
 SOV_return_dalian:0 "Rendre Dalian"
 SOV_return_dalian_desc:0 "Nous rendrons l’ancien Port-Arthur au gouvernement chinois légitime en signe de soutien à sa cause. Les humiliations infligées à l’État chinois doivent cesser : l’ère des ports sous traité est révolue, et nous le montrerons au monde !"
 SOV_a_cold_war:0 "Une guerre froide"
 SOV_a_cold_war_desc:0 "Le monde étant désormais divisé en deux blocs de puissance, il est clair que toute guerre ouverte aurait des conséquences désastreuses pour la planète et l’avenir de l’humanité. Concentrons nos efforts sur la reconstruction, la supériorité scientifique et la production, tout en soutenant discrètement les révolutions ouvrières dans le monde."
 SOV_extend_the_curtain_outwards:0 "Étendre le rideau de fer"
 SOV_extend_the_curtain_outwards_desc:0 "Les sympathisants sont recrutés, les plans sont prêts, pilotes, tankistes et soldats sont en position : l’assaut final est préparé. L’heure est venue ! Camarades, portez la Révolution à l’Ouest au nom de la Mère Patrie !"
 SOV_cold_war_idea:0 "Guerre froide"
 SOV_cold_war_idea_desc:0 "Les vives tensions géopolitiques entre les deux blocs nous forcent à renoncer à tout affrontement direct de grande ampleur et à nous concentrer sur nos affaires internes, la croissance industrielle et la recherche. Nous pouvons toutefois apporter notre soutien dans des guerres par procuration…"

 SOV_motherland_defense:0 "Défense de la Mère Patrie"
 SOV_motherland_defense_desc:0 "Malgré la résistance héroïque dont nous avons fait preuve jusqu’ici — et même si les meilleures divisions et unités aériennes ennemies ont été brisées et anéanties — l’ennemi continue d’avancer, jetant de nouvelles forces au front. Un grave danger plane sur notre Mère Patrie. Toutes les forces du peuple pour la destruction de l’ennemi ! En avant, vers la victoire !"
 SOV_defense_of_leningrad:0 "Ligne de défense de la Luga"
 SOV_defense_of_leningrad_desc:0 "Centre culturel de la Rodina, la glorieuse ville de [195.getName] est le pivot logistique et opérationnel des régions baltiques et du Pripolarje ! Mobilisez tous et préparez les défenses : la ville ne tombera pas, quel qu’en soit le prix ! C’est la seule manière de sécuriser la route de prêt-bail du Nord pour les matériaux industriels et de guerre dont notre Mère Patrie a tant besoin !"
 SOV_defense_of_stalingrad:0 "Ligne de défense de la Volga"
 SOV_defense_of_stalingrad_desc:0 "Nos ennemis se sont enfoncés loin dans notre territoire et menacent maintenant notre cœur industriel du bassin de la Volga ! Perdre cela serait une défaite catastrophique, tant politique qu’économique : [217.getName] ne doit pas tomber ! Ralliez le peuple et établissez un périmètre défensif autour de la ville !"
 SOV_purchase_allied_weaponry:0 "Acheter des armes alliées"
 SOV_purchase_allied_weaponry_desc:0 "Malgré quelques ressentiments historiques immatures et dépassés entre nos nations, il ne fait aucun doute que [ENG.getNameDef], [USA.GetNameDef] et [SOV.GetNameDef] partagent l’objectif de préserver la paix et la prospérité mondiales. Mettre nos différends de côté et apaiser le climat politique tendu nous apportera certainement des bénéfices à court terme dans cette guerre dévastatrice."
 SOV_lease_british_planes:0 "Louer des avions britanniques"
 SOV_lease_british_planes_desc:0 "La Royal Air Force a indéniablement réalisé des avancées notables en matière de conception d’aéronefs ces dernières années. Louer une partie de leur matériel pourrait nous donner un avantage supplémentaire face à l’ennemi menaçant."
 SOV_till_the_bitter_end:0 "Jusqu’à l’amère fin"
 SOV_till_the_bitter_end_desc:0 "Faisons connaître au monde notre détermination désespérée et rassemblons ce qui nous reste pour soutenir l’effort de guerre !"
 SOV_till_the_bitter_end_tt:0 "Les pays du monde seront plus enclins à soutenir notre lutte contre le fascisme allemand."

 SOV_invite_romania:0 "Inviter la Roumanie"
 SOV_invite_romania_desc:0 "La Roumanie doit rejoindre le rang des nations combattant pour les travailleurs du monde !"

 #traits??
 socialism_in_one_country:0 "Socialisme dans un seul pays"
 socialism_in_one_country_desc:0 "[SOV.GetLeader] estime que ce n’est que lorsque l’Union soviétique sera forte qu’elle devra propager la révolution marxiste à l’étranger."
 world_trotskyite_revolution:0 "Révolution trotskyste mondiale"
 world_trotskyite_revolution_desc:0 "Il faut un grand homme pour admettre ses erreurs ; [SOV.GetLeader] est un tel homme. Allumons les flammes de la révolution !"
 bolshevik_militarist:0 "Militariste bolchevique"
 bolshevik_militarist_desc:0 "Trotski prône la révolution communiste mondiale. C’est un visionnaire qui estime que trop, c’est trop : les travailleurs du monde ne seront plus jamais réduits en esclavage !"

 NKVD_Agency:0 "Service de renseignement du NKVD"
 NKVD_Agency_desc:0 "Nous placerons des espions partout. Dès qu’un mot sera prononcé dans une ambassade ou un centre de recherche, nous en serons informés."
 women_in_the_military_focus:0 "Femmes soldats"
 women_in_the_military_focus_desc:0 "Les femmes peuvent servir en soutien de première ligne et dans certains rôles de combat limités. Cela libérera de la main-d’œuvre masculine et poussera peut-être nos hommes à se battre avec encore plus d’ardeur."
 home_of_revolution2:0 "Berceau de la révolution"
 home_of_revolution2_desc:0 "Camarades, avec la défaite des vils contre-révolutionnaires trotskystes, nous avons pu nous concentrer sur la défense de la révolution. Notre but, notre espoir, notre slogan : le socialisme dans un seul pays. Nous bâtirons ici, en Union soviétique, une abondante utopie socialiste, et le reste du monde finira inévitablement par l’adopter."
 home_of_revolution3:0 "Berceau de la révolution"
 home_of_revolution3_desc:0 "Camarades, avec la défaite des vils contre-révolutionnaires trotskystes, nous avons pu nous concentrer sur la défense de la révolution. Notre but, notre espoir, notre slogan : le socialisme dans un seul pays. Nous bâtirons ici, en Union soviétique, une abondante utopie socialiste, et le reste du monde finira inévitablement par l’adopter."
 #communist_world:0 "Communist World"
 #communist_world_desc:0 ""
 #Push_Them_Hard:0 "Push Them Hard"
 #Push_Them_Hard_desc:0 ""
 SOV_iron_curtain_idea:0 "Rideau de fer"
 SOV_iron_curtain_idea_desc:0 "Nous consolidons et enfonçons actuellement notre emprise sur nos États clients."
 SOV_defense_of_the_motherland:0 "Défense de la Mère Patrie"
 SOV_defense_of_the_motherland_desc:0 "Notre grand pays ne tombera ni ne se rendra jamais ; il est de notre devoir de protéger la Mère Patrie, quel qu’en soit le coût ! \n\n§RCet esprit national expirera une fois la guerre terminée.§!"
 SOV_comecon_support:0 "Soutien du Comecon"
 SOV_comecon_support_desc:0 "Des spécialistes soviétiques civils et militaires soutiennent notre pays par l’éducation idéologique et l’aide économique."
 SOV_comecon_idea:0 "Comecon"
 SOV_comecon_idea_desc:0 "L’économie soviétique est fortement renforcée par les accords économiques et les liens industriels noués avec nos alliés."
 SOV_support_greece:0 "Soutien à la guerre civile grecque"
 SOV_support_greece_desc:0 "Nous combattons pour la liberté et la libération du peuple grec face à la menace idéologique."
 SOV_civil_war_ignited:0 "Affaire [ROOT.GetAdjective]"
 SOV_civil_war_ignited_desc:0 "Même si le conflit a été attisé de l’extérieur, le gouvernement de [ROOT.GetLeader] considère qu’il s’agit d’une affaire strictement [ROOT.GetAdjective] et que toute intervention étrangère ne ferait qu’apporter destruction au pays."

 ### AJOUTS ALTERNATIFS ###

 SOV_reinstitute_okhrana:0 "Rétablir l’Okhrana"
 SOV_reinstitute_okhrana_desc:0 "Dans nos efforts pour renverser le régime soviétique, nous devons nous assurer que le territoire que nous contrôlons soit fermement tenu — et envisager d’envoyer des agents en territoire soviétique pour le saper par tous les moyens possibles. Il est temps de ramener l’Okhrana, moderne et plus efficace."
 SOV_siberian_forest_soldiers_focus:0 "À travers toundras et forêts…"
 SOV_siberian_forest_soldiers_focus_desc:0 "Entre nous et le cœur du régime soviétique décrépit s’étend une immense bande de forêts froides et de toundra. Nos héros doivent être prêts à relever le défi de survivre dans ces terres hostiles."
 SOV_siberian_forest_soldiers_idea:0 "Soldats des forêts sibériennes"
 SOV_okhrana_focus_tt:0 "Créer l’agence de renseignement : §YOkhrana§!.\n\n"
 SOV_russia_okhrana_idea:0 "Okhrana rétablie"
 SOV_consolidate_power_tt_2:0 "Retire les idées §Y$SOV_the_true_tsars_idea$§!, §Y$SOV_fascist_womens_movement_idea$§!, §Y$SOV_siberian_forest_soldiers_idea$§!"

 SOV_reinforce_caspian_naval_bases:0 "Renforcer les bases navales de la Caspienne"
 SOV_reinforce_caspian_naval_bases_desc:0 "Même si cette zone n’est pas aussi importante que d’autres régions navales stratégiques, il est crucial d’y maintenir une forte présence pour contenir les avancées du/de la [PER.GetAdjective] ou d’autres puissances étrangères et protéger nos intérêts."

 VOLGA_DON_CANAL:0 "Canal Volga-Don"
 Volga_don_blocked_tt:0 "§RLe canal Volga-Don n’est pas construit ou est bloqué§!"

 build_volga_don_canal:0 "Construire le canal Volga-Don"
 build_volga_don_canal_desc:0 "Nos forces navales limitées de la mer Caspienne sont depuis longtemps isolées de la flotte principale. En construisant un canal les reliant à la mer Noire, nous pourrons enfin déplacer nos navires à volonté."
 VOLGA_DON_BUILT_tt:0 "§YLe canal Volga-Don permettra le passage des navires§!."
 VOLGA_DON_NOT_BUILT:0 "Le canal Volga-Don n’a pas été construit"

