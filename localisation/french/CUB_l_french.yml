CUB_sugar_for_oil:0 "Du sucre contre du pétrole"
CUB_sugar_for_oil_desc:0 "Nos camarades soviétiques disposent de vastes réserves de pétrole qui nous seraient très utiles, tandis que nous avons un excédent de sucre dont ils pourraient faire bon usage. Peut-être pourrions-nous négocier un accord commercial mutuellement bénéfique ?"

### Conquête ###
CUB_liberate_the_dominican_republic:0 "Libérer la République dominicaine"
CUB_liberate_the_dominican_republic_desc:0 "Le cruel dictateur de la République dominicaine, Rafael Trujillo, a trop longtemps terrorisé et opprimé le peuple. Nous devons libérer nos frères perdus de longue date !"
CUB_deal_with_haitian_oppressors:0 "En finir avec les oppresseurs haïtiens"
CUB_deal_with_haitian_oppressors_desc:0 "Après avoir renversé le régime oppressif de République dominicaine, nous devons désormais tourner notre regard vers la moitié ouest d’Hispaniola et libérer son peuple du régime capitaliste corrompu !"
