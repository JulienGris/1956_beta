#########################################################################################################################################################################
### Arbre démocratique [ROOT.GetAdjective] ###
#########################################################################################################################################################################

CUB_results_of_the_presidential_election:0 "Résultats de l’élection présidentielle"
CUB_results_of_the_presidential_election_desc:0 "Les résultats de l’élection sont tombés. Et le nouveau président de [CUB.GetNameDef] est..."
CUB_victory_for_gomez:0 "Victoire de Gómez"
CUB_the_nine_cent_law:0 "La loi des neuf cents"
CUB_the_nine_cent_law_desc:0 "La loi des neuf cents est une taxe sur chaque sac de sucre de plus de 250 livres, qui sera utilisée pour financer les écoles rurales, dont la plupart seront sous le contrôle de notre armée."
CUB_minimum_wage_laws:0 "Loi sur le salaire minimum"
CUB_minimum_wage_laws_desc:0 "En adoptant des lois sur le salaire minimum, nous pouvons améliorer la qualité de vie de nos travailleurs, dont beaucoup sont actuellement sous-payés."
CUB_taxation_reforms:0 "Réformes fiscales"
CUB_taxation_reforms_desc:0 ""
CUB_retirement_pensions:0 "Pensions de retraite"
CUB_reduce_american_influence:0 "Réduire l’influence américaine"
CUB_reduce_american_influence_desc:0 "Depuis des décennies, les États-Unis exercent une influence importante sur notre nation, en particulier dans notre économie et notre politique. Bien qu’ils nous aient apporté certaines choses positives par le passé, si nous voulons être respectés comme une nation souveraine, nous devons apprendre à compter sur nous-mêmes et à limiter au minimum l’influence étrangère."
CUB_confederation_of_cuban_workers:0 "Légaliser la CTC"
CUB_confederation_of_cuban_workers_desc:0 "La Confédération des travailleurs [ROOT.GetAdjective] a gagné en popularité à la suite des réformes favorisant la syndicalisation des travailleurs agricoles. La légaliser pourrait stimuler notre économie et nous assurer un solide soutien lors des prochaines élections."
CUB_a_new_constitution:0 "Une nouvelle constitution"
CUB_batista_in_office:0 "Batista au pouvoir"
CUB_modernize_medical_care:0 "Moderniser les soins médicaux"
CUB_establish_rural_hospitals:0 "Créer des hôpitaux ruraux"
CUB_military_improvements:0 "Améliorer l’armée"
CUB_military_improvements_desc:0 "Notre armée est restée médiocre depuis trop longtemps. En augmentant les soldes et en améliorant la nourriture servie à nos troupes, nous pouvons renforcer le moral et encourager plus de citoyens courageux à s’engager !"
CUB_increase_education_funding:0 "Augmenter le financement de l’éducation"
CUB_establish_soviet_diplomatic_relations:0 "Établir des relations diplomatiques avec les [SOV.GetAdjective]"
CUB_winning_the_battle_of_the_caribbean:0 "Protéger la navigation caribéenne"
CUB_winning_the_battle_of_the_caribbean_desc:0 "En raison de notre position stratégique dans les Caraïbes et de la menace constante des U-Boote sur les convois alliés, nos forces navales doivent être prêtes face aux menaces et nos infrastructures portuaires doivent être agrandies pour mieux entretenir nos navires."
CUB_gift_sugar_to_the_british:0 "Offrir du sucre aux Britanniques"
CUB_american_air_bases:0 "Bases aériennes [USA.GetAdjective]"
CUB_american_air_bases_desc:0 "Nous avons autorisé [USA.GetNameDef] à construire des bases aériennes à [CUB.GetNameDef] pour protéger les Caraïbes contre les sous-marins ennemis. Nous leur avons donné la permission d’implanter ces bases aux deux extrémités de l’île, en échange d’avions pour sécuriser la région."
CUB_suggest_operation_hemingway:0 "Proposer l’opération Hemingway"
CUB_suggest_operation_hemingway_desc:0 "Malgré la neutralité affichée par le régime de Franco, il est clair que son soutien s’oriente vers les puissances de l’Axe. Nous proposerons à la Société des Nations de déclarer la guerre à l’Espagne nationaliste, considérée comme membre de l’Axe en raison de sa sympathie à leur égard."
CUB_join_the_allies:0 "Rejoindre les Alliés"
CUB_join_the_allies_desc:0 "Les Alliés ont besoin de notre aide pour défendre la paix et la liberté ! Nous devons soutenir la démocratie face à la tyrannie !"
CUB_rewrite_the_constitution:0 "Réécrire la constitution"
CUB_rewrite_the_constitution_desc:0 "La constitution de 1933 a été rédigée par l’armée et pour l’armée. Nous devons la modifier pour mieux représenter la démocratie [CUB.GetAdjective]."
CUB_law_of_sugar_coordination:0 "Loi de coordination du sucre"
CUB_law_of_sugar_coordination_desc:0 "Cette loi organisera les petites exploitations en coopératives, regroupera les travailleurs agricoles, garantira aux métayers une part de leur récolte et leur assurera de ne pas être dépossédés de leurs terres s’ils les cultivent."
CUB_issue_amnesties:0 "Accorder des amnisties"
CUB_issue_amnesties_desc:0 "Une amnistie sera accordée, y compris à l’ancien président Gerardo Machado. De cette manière, nous démontrerons la bonne volonté du gouvernement."
CUB_victory_for_gomez_desc:0 "Miguel Mariano Gómez, ancien maire de La Havane, a été élu président de Cuba. Affilié aux révolutionnaires de 1933, il bénéficie de tout leur soutien pour mener une politique en ligne avec celle du gouvernement des 100 jours."
CUB_victory_for_garcia_menocal:0 "Victoire de García Menocal"
CUB_victory_for_garcia_menocal_desc:0 "Mario García Menocal, ancien président de Cuba, notamment durant la Grande Guerre, a été élu président. Représentant l’opposition conservatrice aux révolutionnaires de 1933, il a déjà rencontré une certaine résistance au sein des forces armées."
###########################
### Arbre fasciste [ROOT.GetAdjective] ###
###########################

### Politique ###
CUB_seek_falangist_support:0 "Chercher le soutien des phalangistes"
CUB_seek_falangist_support_desc:0 "Le président Menocal nous a approchés avec une offre tentante... Maintenant qu’il est au pouvoir, il fait face à une forte opposition de la gauche, en particulier du Parti communiste. Il a donc compris qu’il a besoin de notre soutien pour avancer. Cela pourrait être l’occasion parfaite pour accroître notre influence..."
CUB_exert_influence_over_the_military:0 "Exercer une influence sur l’armée"
CUB_exert_influence_over_the_military_desc:0 "Maintenant que nous avons une position d’influence au sein de l’administration Menocal, nous pouvons commencer à étendre cette influence dans des domaines cruciaux pour notre prise de pouvoir, à commencer par l’armée."
CUB_repeal_liberal_policies:0 "Abroger les politiques libérales"
CUB_repeal_liberal_policies_desc:0 "De nombreuses lois adoptées par les précédents présidents sont beaucoup trop libérales à notre goût. Nous devrions pousser Menocal à en abroger certaines qui pourraient nuire à nos efforts."
CUB_gather_political_support:0 "Rassembler un soutien politique"
CUB_gather_political_support_desc:0 "Maintenant que le soutien à notre cause grandit au sein des rangs militaires, nous devons obtenir l’influence et l’appui des politiciens."
CUB_encourage_anti_communist_violence:0 "Encourager la violence anticommuniste"
CUB_encourage_anti_communist_violence_desc:0 "Les communistes sont la plus grande menace pour notre mode de vie. C’est le devoir de chaque patriote de combattre la terreur rouge, même si cela signifie que certaines personnes seront blessées !"
CUB_secure_power:0 "Assurer le pouvoir"
CUB_secure_power_desc:0 "Notre force et notre nombre ont suffisamment augmenté pour que nous puissions désormais saisir le pouvoir et prendre le contrôle total de l’armée et du gouvernement !"
CUB_deal_with_batista:0 "Gérer Batista"
CUB_deal_with_batista_desc:0 "Fulgencio Batista est imprévisible. Il est à la fois une influence politique majeure à [ROOT.GetAdjective] et un acteur important au sein de nos forces armées. Maintenant que notre régime est au pouvoir, nous devons décider comment le gérer."
CUB_stabilize_internal_politics:0 "Stabiliser la politique intérieure"
CUB_stabilize_internal_politics_desc:0 "Notre accession au pouvoir a provoqué un grand chaos politique et social. Il est temps de régler les problèmes internes qui en ont résulté et de réorganiser l’État."
CUB_strengthen_catholic_identity:0 "Renforcer l’identité catholique"
CUB_strengthen_catholic_identity_desc:0 "L’identité catholique est l’un des piliers du phalangisme. Le catholicisme doit être encouragé et l’Église renforcée sur nos terres !"
CUB_encourage_spanish_immigration:0 "Encourager l’immigration espagnole"
CUB_encourage_spanish_immigration_desc:0 "La politique du panhispanisme inclut l’ouverture envers nos frères et cousins, dans la région et à travers le monde. Les encourager à immigrer dans notre pays ne peut que nous renforcer davantage !"
CUB_panhispanic_diplomacy:0 "Diplomatie panhispanique"
CUB_panhispanic_diplomacy_desc:0 "L’un des idéaux du mouvement phalangiste est le panhispanisme. Pour l’accomplir, nous devrions contacter les nombreux gouvernements hispaniques de la région et établir des relations diplomatiques solides avec eux."
CUB_spanish_civil_war_involvement:0 "S’impliquer dans la guerre civile espagnole"
CUB_spanish_civil_war_involvement_desc:0 "Nos frères d’Espagne sont plongés dans une terrible guerre civile. Nous devrions leur envoyer toute l’aide que nous pouvons leur offrir !"
CUB_intervene_ACW:0 "Intervenir dans la guerre civile américaine"
CUB_intervene_ACW_desc:0 "Les États-Unis d’Amérique ne sont plus unis. Une nouvelle faction a émergé, portant une idéologie plus proche de la nôtre. Nous devrions envoyer des troupes et de l’aide pour garantir un résultat favorable."
CUB_subvert_american_influence:0 "Subvertir l’influence américaine"
CUB_subvert_american_influence_desc:0 "Les États-Unis d’Amérique ont eu un contrôle excessif sur notre politique et notre économie depuis trop longtemps ! Nous devons faire tout notre possible pour affaiblir leur influence afin d’assurer notre indépendance et notre force."
CUB_nationalize_foreign_sugar_mills:0 "Nationaliser les raffineries de sucre étrangères"
CUB_nationalize_foreign_sugar_mills_desc:0 "En nationalisant les raffineries de sucre détenues par des entreprises étrangères, nous pourrons relancer notre industrie sucrière !"
CUB_deal_with_the_united_fruit_company:0 "Traiter avec la United Fruit Company"
CUB_deal_with_the_united_fruit_company_desc:0 "La United Fruit Company possède d’importants intérêts et une grande influence en Amérique centrale, ainsi qu’un vif intérêt pour notre industrie sucrière. Peut-être pourrions-nous conclure un accord mutuellement bénéfique..."
CUB_united_fruit_company_coup:0 "Coup d’État de la United Fruit Company"
CUB_united_fruit_company_coup_desc:0 "Avec suffisamment de soutien au Honduras, nous pouvons aider la United Fruit Company à organiser une prise de contrôle totale du gouvernement !"
CUB_a_fruitful_partnership:0 "Un partenariat fructueux"
CUB_a_fruitful_partnership_desc:0 "N/A"
CUB_invite_german_companies:0 "Inviter les entreprises allemandes"

### Diplomatie & conquête ###
CUB_command_the_caribbean:0 "Commander les Caraïbes"
CUB_command_the_caribbean_desc:0 "Il est désormais clair que nous ne pouvons pas compter sur le leadership de puissances étrangères qui n’ont pas forcément nos intérêts à cœur. Nous devons chercher à développer notre propre alliance avec des partenaires partageant nos idées..."
CUB_invite_our_spanish_brothers:0 "Inviter nos frères espagnols"
CUB_invite_our_spanish_brothers_desc:0 "Il y a plusieurs siècles, nos ancêtres espagnols ont colonisé ces terres. Plus récemment, nous avons enfin obtenu notre indépendance vis-à-vis de l’Espagne et sommes devenus une nation respectée. Avec la fin de la guerre civile en Espagne et un nouveau gouvernement en place, le moment est venu de nous retrouver, cette fois comme frères !"
CUB_caribbean_dominance:0 "Domination caribéenne"
CUB_caribbean_dominance_desc:0 "N/A"
CUB_join_the_reich:0 "Rejoindre [GER.GetNameDef]"
CUB_join_the_reich_desc:0 "Bien que les nationaux-socialistes aient des idéaux quelque peu différents des nôtres, leur puissance est grande et leurs objectifs présentent des similarités avec les nôtres. Une alliance potentielle pourrait nous aider à atteindre nos buts."
CUB_join_with_japan:0 "S’allier au Japon"
CUB_join_with_japan_desc:0 "Bien que les Japonais ne partagent pas exactement nos idéaux, leur marine puissante et leur armée résiliente compensent cela. Ils accueilleraient certainement une alliance avec une nouvelle puissance émergeant aux portes des États-Unis."
CUB_subjugate_hispaniola:0 "Soumettre Hispaniola"
CUB_subjugate_hispaniola_desc:0 "L’île d’Hispaniola, à l’est, est une extension naturelle de notre territoire. Nous exigerons que ces gouvernements illégitimes se soumettent, ou nous les prendrons par la force."
CUB_demand_the_eastern_isles:0 "Revendiquer les îles orientales"
CUB_demand_the_eastern_isles_desc:0 "Une expansion supplémentaire nécessitera de nouvelles revendications."
CUB_demand_jamaica_and_the_bahamas:0 "Revendiquer la Jamaïque et les Bahamas"
CUB_demand_jamaica_and_the_bahamas_desc:0 "Une expansion supplémentaire nécessitera de nouvelles revendications."
CUB_lay_claim_to_curacao_and_trinidad:0 "Revendiquer Curaçao et Trinité"
CUB_lay_claim_to_curacao_and_trinidad_desc:0 "Les dernières îles caribéennes encore aux mains d’étrangers doivent nous être remises pour que nous les protégions comme notre territoire légitime."
CUB_seize_venezuela:0 "S’emparer du Venezuela"
CUB_seize_venezuela_desc:0 "Notre puissance militaire et notre influence régionale ont atteint un niveau impressionnant ! Avec l’instabilité interne du Venezuela, nous pourrions utiliser notre force nouvellement acquise pour intimider leur gouvernement faible et les unir à nous."
CUB_threaten_colombia:0 "Menacer la Colombie"
CUB_threaten_colombia_desc:0 "La Colombie est cruciale pour nos projets de former une Grande Nation caribéenne. Maintenant que nous partageons une frontière terrestre avec eux, nous pouvons les menacer d’un ultimatum, comme nous l’avons fait avec le Venezuela, et les forcer à reconnaître notre gouvernement comme le seul légitime."
CUB_expand_ufc_influence:0 "Étendre l’influence de la UFC"
CUB_seize_control_in_guatemala:0 "Prendre le contrôle du Guatemala"
CUB_overthrow_the_salvadorian_government:0 "Renverser le gouvernement salvadorien"
CUB_our_holdings_in_panama:0 "Nos possessions au Panama"
CUB_takeover_in_nicaragua:0 "Prendre le contrôle du Nicaragua"
CUB_take_control_of_costa_rica:0 "Prendre le contrôle du Costa Rica"
CUB_corporate_incorporation:0 "Incorporation d’entreprise"
CUB_stage_a_conflict_at_the_canal:0 "Provoquer un conflit au canal"

### Partenariat avec la United Fruit Company ###
CUB_entrust_central_america_to_the_ufc:0 "Confier l’Amérique centrale à la UFC"
CUB_negotiate_for_belize:0 "Négocier pour le Belize"
CUB_legitimize_zemurrays_government:0 "Légitimer le gouvernement de Zemurray"

### Militaire & amphibie ###
CUB_amphibious_invasion_preparation:0 "Préparer les invasions amphibies"
CUB_amphibious_invasion_preparation_desc:0 "En tant que nation insulaire entourée de nombreuses îles et côtes, nous devons être parfaitement préparés aux opérations amphibies."
CUB_special_amphibious_training:0 "Entraînement amphibie spécial"
CUB_special_amphibious_training_desc:0 "En lançant un programme rigoureux d’entraînement spécialisé aux opérations amphibies, nous pouvons garantir que nos troupes auront les compétences nécessaires pour affronter toutes les situations maritimes."
CUB_falangist_ideas_in_schools:0 "Idées phalangistes dans les écoles"
CUB_falangist_ideas_in_schools_desc:0 "En enseignant nos valeurs dans les écoles, nous pouvons mieux assurer la loyauté de notre jeunesse !"
CUB_devotion_to_falangism:0 "Dévotion au phalangisme"
CUB_devotion_to_falangism_desc:0 "N/A"
CUB_the_caribbean_guard:0 "La garde caribéenne"
CUB_the_caribbean_guard_desc:0 "Avec notre influence et nos territoires désormais étendus à travers les Caraïbes, nous devons former une garde spéciale pour défendre les îles !"
CUB_army_expansion:0 "Expansion de l’armée"
CUB_army_expansion_desc:0 "Pour atteindre nos objectifs, nous devons augmenter la taille de notre armée."

### Développement des territoires conquis ###
CUB_island_fortification_project:0 "Projet de fortification insulaire"
CUB_island_fortification_project_desc:0 "Avec autant de territoires nouvellement acquis, un vaste effort de fortification est nécessaire pour garantir leur sécurité."
CUB_island_development_plan:0 "Plan de développement insulaire"
CUB_island_development_plan_desc:0 "Maintenant que nous contrôlons nos territoires légitimes des Caraïbes, nous devons commencer à développer les îles pour soutenir notre effort industriel en pleine expansion."
CUB_develop_the_bahamas_and_jamaica:0 "Développer la Jamaïque et les Bahamas"
CUB_develop_the_bahamas_and_jamaica_desc:0 "En investissant raisonnablement en Jamaïque et aux Bahamas, nous pouvons accroître notre capacité industrielle."
CUB_develop_the_eastern_isles:0 "Développer les îles orientales"
CUB_develop_the_eastern_isles_desc:0 "Investir dans les îles des Antilles contribuera à accroître notre capacité industrielle et à améliorer nos nouveaux territoires."
CUB_developing_curacao_and_trinidad:0 "Développer Curaçao et Trinité"
CUB_developing_curacao_and_trinidad_desc:0 "Curaçao et Trinité, étant nos territoires les plus récemment acquis, pourraient bénéficier de nouveaux investissements industriels."
CUB_venezuelan_development:0 "Développement du Venezuela"
CUB_begin_colombian_industrial_development:0 "Lancer le développement industriel colombien"
CUB_expand_colombian_coffee_plantations:0 "Étendre les plantations de café colombiennes"
CUB_upgrade_venezuelan_oil_facilities:0 "Améliorer les installations pétrolières vénézuéliennes"
### Événements liés ###
cuba.11.t:0 "[CUB.GetNameDef] exige nos territoires" # Revendications sur Hispaniola
cuba.11.d:0 "Maintenant que le mouvement phalangiste [ROOT.GetAdjective] a réussi à prendre le contrôle du pays, il a commencé à manœuvrer pour étendre son territoire et englober désormais l’île d’Hispaniola. \n\nAvec cette nouvelle voie expansionniste viennent à présent des exigences adressées à notre gouvernement : accepter la soumission et l’intégration à Cuba. Quelle sera notre réponse ?" # Revendications sur Hispaniola
cuba.10.d:0 "Cuba, autrefois notre colonie phare dans les Caraïbes, nous a contactés avec une proposition surprenante : établir une alliance officielle entre nos deux nations, dans l’espoir de renforcer nos liens. \n\nBien que cela puisse paraître inattendu, c’est une idée qui mérite réflexion et qui pourrait nous redonner de l’influence sur le continent américain."
cuba.12.t:0 "L’Espagne nationaliste accepte notre proposition !"
cuba.12.d:0 "Notre récente proposition d’alliance adressée à l’Espagne a été acceptée !"
cuba.13.t:0 "L’Espagne rejette notre proposition !"
cuba.13.d:0 "À la surprise générale, le gouvernement espagnol a décidé de refuser notre proposition d’alliance officielle."

