### Politique ###
CUB_military_coup:0 "Coup d’État militaire"
CUB_military_coup_desc:0 "Fulgencio Batista a soutenu Gomez lors des élections en sachant qu’il était un dirigeant faible. L’intention était de provoquer une crise de destitution pour forcer Gomez à quitter le pouvoir au profit du vice-président Federico Brú, qui avait accepté de collaborer avec Batista. Cependant, Brú est revenu sur sa décision, nous obligeant à prendre des mesures plus extrêmes."
CUB_reassure_the_population:0 "Rassurer la population"
CUB_reassure_the_population_desc:0 "Notre coup d’État militaire a fortement déstabilisé le pays et inquiété la population, qui craint de voir se reproduire un régime à la Machado. Nous devons rassurer le peuple sur le fait que nous défendons toujours ses intérêts."
CUB_ensure_military_loyalty:0 "Assurer la loyauté militaire"
CUB_ensure_military_loyalty_desc:0 "La forte influence de Batista sur l’armée et la situation politique de Cuba a déjà été nécessaire pour mener le coup d’État. Cependant, certaines inquiétudes persistent au sein des rangs militaires et doivent être traitées pour garantir une loyauté totale."
CUB_government_reshuffle:0 "Remaniement du gouvernement"
CUB_government_reshuffle_desc:0 "Étant donné que nous avons pris le pouvoir par un coup d’État, de nombreux responsables gouvernementaux restent loyaux à l’ancienne administration. Nous devrions les déplacer vers des postes moins influents et placer à la tête des fonctions clés ceux qui nous sont fidèles."
CUB_reach_out_to_trujillo:0 "Prendre contact avec Trujillo"
CUB_reach_out_to_trujillo_desc:0 "Rafael Trujillo est un ami de longue date de Batista et pourrait être ouvert à diverses négociations diplomatiques maintenant que Batista est au pouvoir."
CUB_invite_american_corporations:0 "Inviter les entreprises américaines"
CUB_invite_american_corporations_desc:0 "Inviter ouvertement les entreprises américaines à investir dans notre économie pourrait ouvrir de nombreuses portes à notre nation."
CUB_american_sugar_investments:0 "Investissements américains dans le sucre"
CUB_american_sugar_investments_desc:0 "De nombreuses entreprises américaines sauteraient sur l’occasion d’investir dans notre vaste industrie sucrière. Quelques bons investissements renforceraient considérablement notre économie."
CUB_deal_with_the_mafia:0 "Traiter avec la mafia"
CUB_deal_with_the_mafia_desc:0 "La mafia américaine est une organisation puissante et très influente. Bien que corrompue et quelque peu dangereuse à fréquenter, elle apporte avec elle des fonds considérables pour soutenir notre économie."
CUB_invite_meyer_lansky:0 "Inviter Meyer Lansky"
CUB_invite_meyer_lansky_desc:0 "Meyer Lansky, le « comptable de la mafia », a une grande influence à la fois dans la mafia juive et italienne. Bien qu’il ait déjà une certaine influence à Cuba, nous pourrions conclure de nouveaux accords mutuellement bénéfiques…"
CUB_implement_a_new_constitution:0 "Mettre en place une nouvelle constitution"
CUB_implement_a_new_constitution_desc:0 "L’ancienne constitution s’est révélée n’être qu’un document faible, échouant à protéger le peuple à maintes reprises. Une nouvelle constitution adaptée à l’époque moderne et tirant les leçons des erreurs du passé est nécessaire. Et il n’est pas inutile d’y inclure quelques échappatoires pour consolider notre pouvoir."
CUB_unite_hispaniola:0 "Unifier Hispaniola"
CUB_secure_united_states_political_support:0 "Obtenir le soutien politique des États-Unis"
CUB_military_pensions:0 "Pensions militaires"
CUB_conduct_joint_military_excercises:0 "Mener des exercices militaires conjoints"
CUB_invite_trujillo_to_join_the_allies:0 "Inviter Trujillo à rejoindre les Alliés"
