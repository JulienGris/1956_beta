### Politique ###
CUB_oppose_the_presidency:0 "S’opposer à la présidence"
CUB_oppose_the_presidency_desc:0 "La nouvelle présidence et le cabinet du président Menocal sont en contradiction directe avec nos convictions. Une opposition frontale à cette présidence est notre seul espoir, non seulement pour survivre, mais aussi pour que notre cause triomphe !"
CUB_seek_communist_support_desc:0 "Le président Menocal a dû compter sur notre soutien pour se faire élire. Maintenant qu’il est en fonction, nous pouvons exploiter cette situation pour avancer nos objectifs et nos politiques, tout en travaillant en secret à une véritable révolution !"
CUB_galvanize_the_ctc:0 "Mobiliser la CTC"
CUB_galvanize_the_ctc_desc:0 "Mobiliser le mouvement ouvrier [ROOT.GetAdjective] à travers la Confédération des travailleurs [ROOT.GetAdjective] nous aidera à obtenir le soutien nécessaire pour nous opposer à l’administration actuelle. Le soutien de la CTC nous permettra aussi de prendre le contrôle de notre industrie nationale."
CUB_seek_soviet_support:0 "Chercher le soutien soviétique"
CUB_hold_ctc_rallies:0 "Organiser des rassemblements de la CTC"
CUB_hold_ctc_rallies_desc:0 "En organisant de grands rassemblements de la CTC, nous pouvons montrer au peuple qui nous sommes et obtenir un large soutien de l’opinion publique !"
CUB_ctc_recruitment:0 "Recrutement à la CTC"
CUB_unionize_the_sugar_mills:0 "Syndiquer les raffineries de sucre"
CUB_unionize_the_sugar_mills_desc:0 "Aider les ouvriers des raffineries à former de puissants syndicats est un excellent moyen de rallier du soutien à notre cause, et de montrer aux travailleurs que nous défendons leurs intérêts."
CUB_form_an_alliance_with_batista:0 "Former une alliance avec Batista"
CUB_form_an_alliance_with_batista_desc:0 "Bien que Batista soit imprévisible, il a montré une certaine volonté de travailler avec nous sur les réformes sociales, tant qu’il conserve sa position de pouvoir. Si nous acceptons cet accord, nous devrons toutefois composer avec Batista pour un bon moment."
CUB_overthrow_the_menocal_government:0 "Renverser le gouvernement Menocal"
CUB_overthrow_the_menocal_government_desc:0 "Le gouvernement Menocal est devenu trop faible pour arrêter notre mouvement. Le moment est venu de prendre le pouvoir, de renverser l’ancien régime et d’installer le nôtre ! Viva la revolución !"
CUB_reaffirm_comintern_ties:0 "Réaffirmer les liens avec le Komintern"
CUB_establish_the_dgi:0 "Fonder la DGI"
CUB_state_visit_to_the_soviet_union:0 "Visite officielle en Union soviétique"
CUB_radio_mil_diez:0 "Radio Mil Diez"
CUB_radio_mil_diez_desc:0 "Depuis notre prise de pouvoir, nous avons acquis l’une des plus grandes stations de radio de l’île. Nous pouvons non seulement y diffuser des messages en faveur de notre cause, mais aussi introduire une forme de jazz [ROOT.GetAdjective] dans les îles, enrichissant ainsi notre culture !"
CUB_imprison_batista:0 "Emprisonner Batista"
CUB_continued_collaboration_with_batista:0 "Poursuivre la collaboration avec Batista"
CUB_purge_the_falangists:0 "Purger les phalangistes"
CUB_purge_the_falangists_desc:0 "Bien que nous ayons une mainmise solide sur le pouvoir, il reste encore de petits groupes de phalangistes susceptibles de menacer notre mode de vie et notre nouveau gouvernement. Ils doivent être neutralisés rapidement et discrètement !"
