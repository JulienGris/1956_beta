 #########################################################################################################################################################################
 ### Événements [ROOT.GetAdjective] ###
 #########################################################################################################################################################################

 cuba.1.t:0 "Élection générale"
 cuba.1.d:0 "Il est temps pour le peuple [CUB.GetAdjective] d’être appelé aux urnes pour élire son dirigeant.\nCette année, deux forces principales s’affrontent. La coalition tripartite, composée du Parti libéral, de l’Unité nationale et de l’Action républicaine, bénéficie du soutien des nombreuses forces derrière la révolution de 1933, notamment du général Fulgencio Batista.\nEn face, l’Association nationale démocratique, relativement conservatrice, dirigée par l’ancien président Mario García Menocal, qui avait dirigé Cuba notamment pendant la Première Guerre mondiale."
 cuba.1.a:0 "Miguel Mariano Gómez"
 cuba_tripartite_coalition_party_long:0 "Coalición Tripartita"
 cuba.1.b:0 "Mario García Menocal"
 cuba_democratic_national_association_party_long:0 "Asociación Nacional Democrática"

 cuba.2.t:0 "Investiture de Miguel Mariano Gómez"
 cuba.2.d:0 "Miguel Mariano Gómez a été investi comme septième président de Cuba à la suite de son élection plus tôt cette année.\nSoutenu idéologiquement par les forces issues de la révolution de 1933, il entend poursuivre les réformes sociales mises en place par les gouvernements successifs depuis les 100 jours de Ramón Grau."
 cuba.2.a:0 "Nous agissons pour le peuple [CUB.GetAdjective]."

 cuba.3.t:0 "Investiture de Mario García Menocal"
 cuba.3.d:0 "Mario García Menocal a été investi aujourd’hui comme septième président de Cuba, après sa victoire aux élections plus tôt cette année. Menocal est connu pour avoir été le 3ᵉ président de Cuba, allié des grandes entreprises et du monde des affaires.\n\nPendant son mandat, Menocal a largement dépassé le budget fédéral, laissant le pays avec plus de 40 000 000 $ de dettes, et a été accusé de fraude lors de sa réélection en 1916, ce qui a conduit à une révolte militaire ratée menée par l’ancien président José Miguel Gómez.\n\nAvec le retour de Menocal au pouvoir, une nouvelle vague d’instabilité et d’incertitude risque de frapper le pays."
 cuba.3.a:0 "Espérons le meilleur..."

 cuba.4.t:0 "Batista marche sur La Havane !"
 cuba.4.d:0 "Déclarant que le gouvernement de Mario García Menocal a trahi non seulement la révolution de 1933 mais aussi toute la nation [CUB.GetAdjective], Fulgencio Batista a appelé l’armée à s’opposer et à renverser le gouvernement.\nJ. Butler Wright, ambassadeur [USA.GetAdjective] auprès de [CUB.GetNameDef], a annoncé que [USA.GetNameDef] soutenait le gouvernement actuel.\nLa garnison de La Havane n’a pas encore choisi de camp, mais pourrait bien changer le cours des événements."
 cuba.4.a:0 "La garnison soutient le gouvernement, et le coup d’État échoue."
 cuba.4.b:0 "La garnison soutient Batista, et le coup d’État réussit."
 cuba_revolutionnary_party_long:0 "Partido Revolucionario Cubano"

 cuba.5.t:0 "Destitution du président Gómez !"
 cuba.5.d:0 "Malgré les vastes programmes promis par Miguel Mariano Gómez, il a fait face à une opposition croissante, notamment au Congrès et de la part du chef de l’armée, Fulgencio Batista, pourtant soutien lors de l’élection.\n\nAprès le veto de la loi des neuf cents, Miguel Mariano Gómez a été officiellement destitué par le Congrès, et le vice-président Federico Laredo Brú a été investi président de Cuba."
 cuba.5.a:0 "Espérons qu’il saura répondre aux attentes du Congrès et du peuple."

 cuba.6.t:0 "[CUB.GetNameDefCap] propose une guerre contre l’Espagne"
 cuba.6.d:0 "Déclarant que la neutralité affichée par le régime espagnol n’est en réalité qu’une façade masquant une aide secrète à l’effort de guerre, le gouvernement [CUB.GetAdjective] a proposé une déclaration de guerre contre l’Espagne fasciste.\n\nUne telle déclaration n’est pas à prendre à la légère, surtout contre un pays actuellement neutre. Il ne fait cependant guère de doute que le soutien de l’Espagne s’oriente vers les forces de l’Axe."
 cuba.6.a:0 "Il est temps de venger la Seconde République."
 cuba.6.b:0 "Ce serait trop dangereux."

 cuba.7.t:0 "Refus de la guerre avec l’Espagne !"
 cuba.7.d:0 "Estimant que la guerre est déjà suffisamment longue, une déclaration de guerre contre un pays aussi grand que l’Espagne ne ferait que la rendre plus brutale et meurtrière ; notre projet de guerre contre l’Espagne nationaliste a été rejeté."
 cuba.7.a:0 "Au moins, nous avons essayé."

 cuba.8.t:0 "Des sympathisants communistes tentent de prendre le pouvoir"
 cuba.8.d:0 "De nombreux partis communistes, dont d’anciens exilés, se sont rassemblés aujourd’hui à Saint-Domingue pour exiger la démission du gouvernement et l’instauration d’un système socialiste. Ils sont très nombreux et semblent avoir reçu des armes étrangères."
 cuba.8.a:0 "Le gouvernement tombe et les communistes prennent le pouvoir."
 cuba.8.b:0 "Le gouvernement tient bon."

 cuba.9.t:0 "La révolution [DOM.GetAdjective] écrasée"
 cuba.9.d:0 "Malgré notre aide matérielle, il semble que les révolutionnaires [DOM.GetAdjective] n’aient pas réussi à renverser le gouvernement. Ceux qui ont pu s’échapper nous rapportent que de nombreux participants à la manifestation de Saint-Domingue ont été arrêtés et risquent bien d’être exécutés. Que devons-nous faire ?"
 cuba.9.a:0 "Si nous ne pouvons pas les libérer de l’intérieur, nous le ferons de l’extérieur !"
 cuba.9.b:0 "Nous reviendrons plus tard."

 cuba.14.t:0 "Le sort de Batista"
 cuba.14.d:0 "Fulgencio Batista est une figure controversée de la politique [ROOT.GetAdjective], exerçant une grande influence dans notre pays. Cela provoque de nombreux problèmes, et il est donc dans notre intérêt de trouver une solution au plus vite."
 cuba.14.a:0 "L’exiler !"
 cuba.14.b:0 "Trouver un compromis serait la meilleure issue."

 cuba.15.t:0 "Proposition d’unification d’Hispaniola"
 cuba.15.d:0 "Les gouvernements [ROOT.GetAdjective] et [DOM.GetAdjective] nous ont présenté une proposition intéressante : unir l’île d’Hispaniola sous un seul gouvernement, celui des [DOM.GetAdjective]s. Quelle sera notre réponse ?"
 cuba.15.a:0 "Nous sommes plus forts ensemble."
 cuba.15.b:0 "Pff ! Que manigancent-ils ?"

 cuba.16.t:0 "Unité caribéenne ?"
 cuba.16.d:0 "Le gouvernement de Fulgencio Batista nous a présenté une proposition de coopération accrue, passant par la direction d’un seul gouvernement pour les îles des Caraïbes. Bien que cela implique de renoncer à notre propre pouvoir, cela renforcerait et unifierait certainement la région."
 cuba.16.a:0 "Une bonne proposition."
 cuba.16.b:0 "Nous préférons préserver notre autonomie."
cuba.17.t:0 "[FROM.GetAdjective] propose du sucre contre du pétrole"
cuba.17.d:0 "Le gouvernement [FROM.GetAdjective] nous a présenté une offre très tentante. Étant l’une des rares sources de sucre, ils nous proposent un approvisionnement régulier en échange d’une petite part de notre production pétrolière. Acceptons-nous ?"
cuba.17.a:0 "Une initiative intéressante."
cuba.17.b:0 "Le sucre, c’est la fortune des anciens."

cuba.18.t:0 "Les [SOV.GetAdjective] acceptent notre proposition"
cuba.18.d:0 "Notre ambassadeur à Moscou a reçu une réponse du secrétaire central du Parti communiste et a immédiatement envoyé un télégramme concernant la volonté des [SOV.GetAdjective] de coopérer sur les marchés internationaux de matières premières !\n\nLa livraison des 200 000 premières tonnes de sucre peut être expédiée immédiatement, avec un million de tonnes supplémentaires déjà en route vers les ports de notre nation."
cuba.18.a:0 "Un accord lucratif."

cuba.19.t:0 "Les [SOV.GetAdjective] refusent notre proposition"
cuba.19.d:0 "[SOV.GetLeader] a indiqué dans un récent télégramme qu’« ils ont déjà assez de douceurs dans leur utopie communiste », sous-entendant qu’un tel accord ne profiterait pas à la société de consommation [SOV.GetAdjective]. Notre ambassadeur a refusé de citer la suite de la réponse du secrétaire général."
cuba.19.a:0 "Dommage."

cuba.20.t:0 "[CUB.GetName] s’empare de [1050.GetName]"
cuba.20.d:0 "Les forces [CUB.GetAdjective] ont lancé une attaque ambitieuse contre la base navale de [1050.GetName], réussissant à débarquer et établir une tête de pont, submergeant rapidement la petite garnison sur place, puis capturant la base navale principale.\n\nLors d’une conférence de presse ultérieure, le dirigeant [CUB.GetAdjective], [CUB.GetLeader], a déclaré que [1050.GetName] faisait légitimement partie de [CUB.GetNonIdeologyName] et qu’il souhaitait expulser tous les impérialistes du territoire [CUB.GetAdjective]. Bien sûr, c’est absurde ; reste à voir comment nous réagissons à cette affaire : certains réclament la guerre contre [CUB.GetNonIdeologyName], d’autres estiment inutile de sacrifier des vies pour une petite base navale."
cuba.20.a:0 "Nous ne nous laisserons pas marcher dessus !"
cuba.20.b:0 "Nous avons beaucoup à apprendre de cela."
cuba.20.c:0 "Une grande victoire !"

cuba.21.t:0 "Victoire de [1050.Owner.GetName] à [1050.GetName]"
cuba.21.d:0 "Les défenseurs supérieurs de [1050.GetName] ont repoussé avec succès le débarquement [VEN.GetAdjective] et empêché toute tête de pont. Les forces [CUB.GetAdjective] ont été contraintes de se replier, laissant la base navale fermement aux mains de [1050.Owner.GetNameDef]."
cuba.21.a:0 "Ça leur apprendra !"
cuba.21.b:0 "Un désastre !"

cuba.22.t:0 "Provocation [CUB.GetAdjective] à [1050.GetName]"
cuba.22.d:0 "Récemment, [CUB.GetNameDef] a commencé à mener des attaques de reconnaissance contre nos forces à [1050.GetName]. Nos éclaireurs ont également signalé un rassemblement progressif de leurs troupes à proximité. Tout laisse à penser qu’une attaque à grande échelle [CUB.GetAdjective] est imminente."
cuba.22.a:0 "Nous devons les arrêter !"

cuba.23.t:0 "[CUB.GetNameDefCap] propose un pacte de non-agression"
cuba.23.d:0 "[CUB.GetNameDefCap] nous a proposé un pacte de non-agression entre nos deux pays pour préserver la paix et la coopération dans les Caraïbes. Le dirigeant [CUB.GetAdjective], [CUB.GetLeader], a évoqué ses relations personnelles avec [ROOT.GetLeader] comme base d’une coopération renforcée."
cuba.23.a:0 "Pour nos amis [CUB.GetAdjective] !"
cuba.23.b:0 "Nous ne sommes pas de la même famille, [CUB.GetLeader]."

cuba.24.t:0 "[DOM.GetNameDefCap] signe le pacte"
cuba.24.d:0 "[DOM.GetNameDefCap] a accepté notre proposition de pacte de non-agression. [DOM.GetLeader] a salué cette initiative comme une grande avancée vers la coopération entre nos deux pays. Il semble que la coopération caribéenne soit plus probable que jamais."
cuba.24.a:0 "Je savais que [DOM.GetLeader] serait toujours notre ami."

cuba.25.t:0 "[DOM.GetNameDefCap] refuse"
cuba.25.d:0 "[DOM.GetNameDefCap] a refusé notre proposition de pacte de non-agression. [DOM.GetLeader] a déclaré ne voir aucune raison de coopérer avec nous malgré les liens personnels entre nos deux dirigeants. Il semble que la coopération caribéenne soit moins probable que jamais."
cuba.25.a:0 "Qu’ont-ils en tête ?"

