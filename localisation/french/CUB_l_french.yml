### Actualités & Événements ###
cuba.100.d:0 "Gerardo Machado, ancien président de Cuba ayant exercé de 1925 à 1933, est décédé à Miami Beach, en Floride, à l’âge de 69 ans, lors d’une opération visant à retarder l’issue fatale d’un cancer. \n \nSon mandat a été pour le moins désastreux, la plupart le considérant comme un dictateur, refusant de quitter ses fonctions et s’accrochant au pouvoir tout en repoussant les groupes insurgés pendant plusieurs années. \n \nMalgré l’intervention du gouvernement américain pour négocier un changement pacifique de régime, Machado continua à résister jusqu’à ce que l’armée [ROOT.GetAdjective] se soulève, le forçant à fuir le pays."
cuba.101.t:0 "Arrivée du MS St. Louis à La Havane"
cuba.101.d:0 "Le paquebot allemand MS St. Louis est arrivé aujourd’hui dans le port de La Havane, transportant 973 passagers, dont beaucoup sont des réfugiés cherchant asile ici à Cuba, fuyant le régime nazi en Allemagne. \n\nSi nous les refoulons maintenant, nous pourrions les renvoyer en Allemagne vers une mort certaine. \n\nQue devons-nous faire ?"
