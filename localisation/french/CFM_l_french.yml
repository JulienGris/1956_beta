 cityfall.1.t:0 "La Chute de Londres"
 cityfall.1.d:0 "Les soldats victorieux [USA.GetAdjective] défilent dans les rues de Londres après de violents combats ayant duré presque toute la journée. Bien qu’ils aient préservé la plupart des monuments de la ville, le Tower Bridge a été détruit lorsque les troupes [ENG.GetAdjective] en retraite ont tenté de franchir la Tamise par le pont, des frappes aériennes [USA.GetAdjective] pulvérisant sa partie centrale avant qu’elles n’atteignent l’autre rive.\n\nLes étoiles et les bandes flottent désormais à la place de l’Union Jack, et [USA.GetLeader] doit prononcer un discours à l’emplacement de l’ancien palais de Buckingham. Un empire décline tandis qu’un autre s’élève."
 cityfall.1.a:0 "Tel père, tel fils."
 cityfall.1.b:0 "Une étape de plus sur le chemin de la vraie liberté."
 cityfall.1.c:0 "Salauds de Yankees !"

 cityfall.2.t:0 "La Chute de Londres"
 cityfall.2.d:0 "Pour tout bon Britannique, le pire scénario est devenu réalité. Les défenseurs de Londres se sont battus jusqu’au dernier homme face aux légions [FRA.GetAdjective] qui avançaient, mais après des combats acharnés et la défaite de courageuses unités de la Home Guard, la ville est tombée. Même maintenant, des coups de feu résonnent encore à travers la capitale, alors que des Londoniens déterminés continuent de résister aux armées de leur plus grand ennemi.\n\nMalgré les efforts de l’armée [ENG.GetAdjective] et du peuple, les forces [FRA.GetAdjective] contrôlent assez de rues pour imposer leur domination. Le drapeau tricolore flotte désormais sur les ruines du palais de Buckingham, et pour la première fois depuis un millénaire, le [FRA.GetAdjective] est la langue dominante à Londres."
 cityfall.2.a:0 "L’Histoire ne se répète pas, mais elle rime souvent."
 cityfall.2.b:0 "Meurs, perfide Albion !"
 cityfall.2.c:0 "Les Britanniques ne seront jamais esclaves !"

 cityfall.3.t:0 "La Chute de Londres"
 cityfall.3.d:0 "Dans un coup qui a stupéfié les peuples du monde, les soldats [POL.GetAdjective] ont pris Londres. Après un raid audacieux de cavalerie [POL.GetAdjective] qui détruisit la plupart des stocks de munitions locaux, les troupes utilisèrent le métro et les anciens égouts pour se faufiler derrière les lignes ennemies. Avant que les défenseurs ne puissent contre-attaquer, plusieurs escadrons [POL.GetAdjective] étaient déjà dans les limites de la ville, et une grande partie de la garnison se rendait en quelques heures seulement.\n\nCertains défenseurs, ayant gardé quelques munitions, résistent encore aux envahisseurs [POL.GetAdjective] dans certains secteurs. Des coups de feu se font toujours entendre près du palais de Buckingham et de la Tour de Londres, où des unités d’élite [POL.GetAdjective] achèvent la résistance."
 cityfall.3.a:0 "Qui peut encore douter de la puissance de [POL.GetNameDef] ?"
 cityfall.3.b:0 "Nul ne peut nier la force de [POL.GetNameDef] désormais !"
 cityfall.3.c:0 "Maudits Polonais !"

 cityfall.4.t:0 "La Chute de Londres"
 cityfall.4.d:0 "Alors que le Soleil levant monte toujours plus haut, un autre soleil semble se coucher sur les îles Britanniques. Le Hinomaru flotte déjà sur chaque abbaye et chaque tour de Londres, rebaptisée Daishori, et les autorités [JAP.GetAdjective] ont déjà mis en place une administration transitoire pour gérer leur nouvelle conquête.\nDéjà, les dissidents ont été rassemblés et emmenés en pleine nuit, et les unités [ENG.GetAdjective] ayant capitulé ont entamé leur marche vers de nouveaux camps construits à la campagne. Plusieurs dirigeants locaux [ENG.GetAdjective] ont reçu « l’offre » de se faire seppuku pour expier leur échec — une offre qui n’avait rien de volontaire, de peur qu’ils ne deviennent des symboles de résistance. Le palais de Buckingham a déjà été choisi pour être rénové afin de devenir l’une des résidences saisonnières de l’Empereur après la guerre."
 cityfall.4.a:0 "L’Est est venu à l’Ouest, on dirait."
 cityfall.4.b:0 "Un seul soleil ne se couchera jamais."
 cityfall.4.c:0 "Ils croient avoir gagné, mais nous reviendrons !"
  cityfall.5.t:0 "La Chute de Londres"
 cityfall.5.d:0 "Sur fond d’un Londres en flammes, les troupes [SPR.GetAdjective] hissent désormais le drapeau rouge et or de [SPR.GetNameDef] sur la ville. Le port brûle, cruel renversement du destin face à l’incendie de l’armada [SPR.GetAdjective] en 1588. Les combats furent acharnés, rue par rue, les [SPR.GetAdjective] affrontant une résistance farouche, mais au final, les envahisseurs ont brisé la dernière ligne [ENG.GetAdjective] et ne rencontrent plus qu’une résistance sporadique aux abords de la ville.\n\n[SPR.GetLeader] lui-même a été transporté à Londres dans son avion privé et prononcera dans l’heure un discours à ses soldats sur leur bravoure. Ensuite, il s’adressera au peuple de Londres pour annoncer ce qui l’attend dans les jours à venir."
 cityfall.5.a:0 "Les marées de l’Histoire semblent avoir tourné."
 cityfall.5.b:0 "Une erreur enfin réparée."
 cityfall.5.c:0 "La bataille de Londres est finie, mais la guerre pour la Grande-Bretagne ne l’est pas !"

 cityfall.6.t:0 "La Chute de Berlin"
 cityfall.6.d:0 "Aujourd’hui, la chute de la chancellerie du Reich a marqué la fin d’une bataille épique dans les rues ravagées de Berlin. Les soldats [JAP.GetAdjective] ont hissé le Hinomaru sur le bâtiment en ruines, jonché des cadavres de ses défenseurs, deux fois plus nombreux que les [JAP.GetAdjective] tombés.\n\nLa bataille pour le Reichstag fut relativement courte après qu’un avion [GER.GetAdjective] ait perdu le contrôle et s’écrasa sur l’édifice, ses réservoirs éventrant les défenses fortifiées. La chancellerie détruite, seules quelques unités [GER.GetAdjective] restent retranchées dans le Konzerthaus de Gendarmenmarkt, déjà partiellement investi par les troupes [JAP.GetAdjective]."
 cityfall.6.a:0 "Ainsi s’achève le « Reich de mille ans »."
 cityfall.6.b:0 "Aucun aigle ne peut rivaliser avec la puissance du Soleil levant !"
 cityfall.6.c:0 "L’ennemi sera écrasé, quel qu’en soit le prix !"

 cityfall.7.t:0 "La Chute de Berlin"
 cityfall.7.d:0 "Tandis qu’une violente bataille de chars se poursuit encore sur l’Ackerstraße, le reste de la ville voit les soldats [GER.GetAdjective] battre en retraite ou livrer leur dernier combat face aux troupes victorieuses [SPR.GetAdjective].\n\nLa bataille, qui a détruit une grande partie de la vieille ville et rendu la plupart des routes impraticables, fut gagnée après un assaut coordonné des forces [SPR.GetAdjective] par le réseau de l’U-Bahn, prenant les défenseurs [GER.GetAdjective] par surprise.\n\nAvec l’écrasement des dernières défenses organisées, il semble que [GER.GetNameDef] soit à l’agonie."
 cityfall.7.a:0 "Qui aurait pu prévoir cela ?"
 cityfall.7.b:0 "Plus ultra !"
 cityfall.7.c:0 "Nous ne nous rendrons pas tant que le dernier soldat ne sera pas tombé !"

 cityfall.8.t:0 "La Chute de Berlin"
 cityfall.8.d:0 "Les autorités [YUG.GetAdjective] préparent déjà une grande cérémonie sur le Kurfürstendamm, la bataille ayant pris fin plus tôt dans la journée. Les forces [GER.GetAdjective] tinrent bon des heures durant, se retranchant dans tout bâtiment fortifiable, dont la tour antiaérienne du zoo. Mais au final, cela ne servit à rien : le drapeau de [YUG.GetNameDef] flotte désormais sur plusieurs monuments encore debout.\n\nCe que cela signifie pour [GER.GetNameDef] reste à voir, mais beaucoup prédisent une victoire prochaine de [YUG.GetNameDef]."
 cityfall.8.a:0 "Un joug slave pèse désormais sur le dos de l’Allemagne."
 cityfall.8.b:0 "Un jour historique pour tout le peuple de [YUG.GetNameDef] !"
 cityfall.8.c:0 "Jamais nous ne plierons face aux Slaves !"

 cityfall.9.t:0 "La Chute de Berlin"
 cityfall.9.d:0 "Après une journée de combats se concluant par de violentes explosions, le gouvernement [CZE.GetAdjective] a annoncé que ses forces contrôlent désormais la capitale allemande.\n\nMalgré la destruction de nombreux monuments, comme la colonne de la Victoire, la résistance reste vive sous terre : milices et unités régulières [GER.GetAdjective] tiennent encore. Mais les [CZE.GetAdjective] font sauter les cloisons du canal de Landwehr, espérant noyer les derniers défenseurs refusant de se rendre."
 cityfall.9.a:0 "Un « Reich millénaire », disaient-ils ?"
 cityfall.9.b:0 "En avant, frères, car seuls nous triompherons !"
 cityfall.9.c:0 "Jamais nous ne capitulerons ; tous au front !"

 cityfall.10.t:0 "La Chute de Berlin"
 cityfall.10.d:0 "Peut-être le dernier clou dans le cercueil de [GER.GetNameDef] a-t-il été enfoncé aujourd’hui lorsque les troupes [ITA.GetAdjective], épuisées mais infatigables, ont atteint le toit du Reichstag. Le Tricolore y fut hissé peu après, et les soldats [ITA.GetAdjective] commencèrent à éliminer les derniers bastions de résistance [GER.GetAdjective].\n\nDes trains de prisonniers partent déjà vers les camps en banlieue, tandis que des cuisines populaires et des postes d’aide sont installés pour amorcer la longue reconstruction."
 cityfall.10.a:0 "Une revanche millénaire."
 cityfall.10.b:0 "Veni, vidi, vici."
 cityfall.10.c:0 "Rome ne régnera jamais sur la Germanie !"
 cityfall.11.t:0 "La Chute de Stockholm"
 cityfall.11.d:0 "Stockholm, capitale de [SWE.GetNameDef], est tombée après de violents combats qui ont duré presque toute la journée. Les forces [SWE.GetAdjective] avaient transformé l’île de Stadsholmen en forteresse et lutté avec acharnement pour repousser les [GER.GetAdjective]. Mais un barrage d’artillerie massif anéantit leurs lignes.\n\nEspérant les ralentir encore, les [SWE.GetAdjective] avaient piégé le pont de Vasabron, mais les charges n’explosèrent pas. Les [GER.GetAdjective] purent submerger les derniers défenseurs et, aujourd’hui, le drapeau [GER.GetAdjective] flotte sur le bâtiment Rosenbad."
 cityfall.11.a:0 "Nul n’est à l’abri ?"
 cityfall.11.b:0 "La Scandinavie pliera devant notre puissance !"
 cityfall.11.c:0 "Braves Suédois, continuez le combat !"

 cityfall.12.t:0 "La Chute de Stockholm"
 cityfall.12.d:0 "Après avoir descendu la Sveavägen jusqu’au cœur de Stockholm, l’Armée rouge s’est emparée de la ville après une journée entière de combats. Les milices [SWE.GetAdjective] continuent de se battre dans les quartiers périphériques, tandis que les unités régulières se sont retranchées au palais royal, mais la bataille est considérée comme terminée.\n\nLe gouvernement s’est enfui dès les premiers coups de feu, laissant [SWE.GetNameDef] ébranlé jusqu’en son cœur. Le drapeau rouge flotte désormais sur tous les bâtiments importants, et déjà, les partisans du nouveau régime sortent de l’ombre tandis que l’Armée rouge soutient ses milices alliées."
 cityfall.12.a:0 "L’ombre du communisme plane sur la Scandinavie."
 cityfall.12.b:0 "Les travailleurs de Suède se tiennent à nos côtés, en avant camarades !"
 cityfall.12.c:0 "Tant que nous combattrons, nous ne tomberons jamais !"

 cityfall.13.t:0 "La Chute de Berlin"
 cityfall.13.d:0 "Au son d’une artillerie assourdissante, le maréchal à la tête de l’armée ayant pris Berlin a prononcé un discours sur les ruines de la porte de Brandebourg. Après une bataille acharnée qui a ravagé la ville jusqu’à quelques heures auparavant — et qui se poursuit encore dans les quartiers extérieurs et les tunnels de l’U-Bahn — les troupes [CHI.GetAdjective] ont pris d’assaut le Reichstag.\n\nLorsque la nouvelle de sa chute s’est répandue, les forces [GER.GetAdjective] démoralisées se sont rendues en masse. Les derniers foyers de résistance s’éteignent les uns après les autres, comme des bougies soufflées."
 cityfall.13.a:0 "Un développement inattendu."
 cityfall.13.b:0 "Notre victoire est inévitable !"
 cityfall.13.c:0 "Ils ont gagné la bataille, mais pas la guerre !"

 cityfall.14.t:0 "La Chute de Berlin"
 cityfall.14.d:0 "Les glorieuses forces de l’armée royale [BHU.GetAdjective] viennent de raser la ville étrange qu’est Berlin et ses pitoyables défenseurs. Les maigres défenses [GER.GetAdjective] se sont effondrées en quelques heures face à l’assaut des héroïques troupes d’assaut [BHU.GetAdjective].\n\nLes soldats [GER.GetAdjective] se rendirent un à un après que les [BHU.GetAdjective] eurent pris le Reichstag en moins d’une demi-heure de combat, ne subissant qu’un seul blessé contre deux cents ennemis abattus.\n\nLes habitants de Berlin célèbrent leur « libération » par les troupes [BHU.GetAdjective], et les statues de l’ancien régime sont déjà abattues pour laisser place à des œuvres dignes de notre glorieux royaume."
 cityfall.14.a:0 "Mon Dieu !"
 cityfall.14.b:0 "Aucun barbare impur ne pourra arrêter nos armées guidées par le divin !"
 cityfall.14.c:0 "C-ce n’est pas la fin… nous gagnerons… un jour !"

 cityfall.15.t:0 "La Chute de Londres"
 cityfall.15.d:0 "Événement inattendu : des escadrons de l’armée [IRE.GetAdjective] ont capturé la capitale [ENG.GetAdjective] après une journée entière de combats. La résistance reste vive dans plusieurs quartiers, notamment à Ealing et Islington, où les unités [ENG.GetAdjective] et la Home Guard, épaulées par la police, tiennent encore à Scotland Yard.\n\nMais ce ne sont que des notes de bas de page dans l’histoire : les principaux monuments sont tombés aux mains [IRE.GetAdjective], et des commandos nettoient méthodiquement les dernières poches de résistance."
 cityfall.15.a:0 "Quelqu’un doute-t-il encore des [IRE.GetAdjective] ?"
 cityfall.15.b:0 "Réjouissez-vous, fiers Irlandais, l’Anglo éternel a été décapité !"
 cityfall.15.c:0 "Nous aurions dû les frapper bien plus tôt, bon sang !"

 cityfall.16.t:0 "La Chute de Londres"
 cityfall.16.d:0 "Une nouvelle victoire inévitable sur la route de la conquête [BHU.GetAdjective] s’est produite aujourd’hui. L’armée royale [BHU.GetAdjective] a délogé les défenseurs de Londres, qui n’ont même pas réussi à ébrécher les légions d’élite du Dragon Tonnerre.\n\nLes [ENG.GetAdjective], désormais soumis à notre juste et glorieux régime, entament déjà leur intégration dans notre royaume.\n\nLe commandant local a ordonné une retraite lâche dès l’entrée des premières troupes [BHU.GetAdjective] dans la ville. Quelques-uns de ses hommes ont tenté de désobéir, mais leur résistance fut vaine face à la supériorité numérique écrasante.\n\nLa population de Londres est déjà sortie dans les rues pour acclamer ses « libérateurs »."
 cityfall.16.a:0 "Le Dragon Tonnerre vole vers le nord."
 cityfall.16.b:0 "Le lion [ENG.GetAdjective] lâche n’est rien face au puissant Dug Yul !"
 cityfall.16.c:0 "Nous combattrons jusqu’au dernier homme, où que ce soit !"
 cityfall.17.t:0 "La Chute de Londres"
 cityfall.17.d:0 "Les troupes [CHI.GetAdjective] ont aujourd’hui hissé leur drapeau au sommet des flèches de l’abbaye de Westminster. Ce monument historique fut le dernier bastion de résistance face aux forces [CHI.GetAdjective], les unités [ENG.GetAdjective] retranchées à Scotland Yard et à Kingston upon Thames ayant finalement capitulé.\n\nLa conquête de Londres, l’un des nombreux succès militaires [CHI.GetAdjective] de ces dernières années, marque un tournant majeur dans la campagne contre [ENG.GetNameDef], qui semble désormais toucher à sa fin."
 cityfall.17.a:0 "Les [CHI.GetAdjective] ont enfin pris le dessus."
 cityfall.17.b:0 "Mort aux impérialistes !"
 cityfall.17.c:0 "De sombres jours s’abattent sur [ENG.GetNameDef]."

 cityfall.18.t:0 "La Chute de Washington, D.C."
 cityfall.18.d:0 "« L’histoire montre qu’aucune armée n’est invincible. » — Iossif Staline\n\nMalgré la résistance acharnée de forces allant du Corps des Marines aux unités de la Garde nationale de plus de vingt États, en passant par les services secrets et la police locale, Washington, D.C. est tombée aux mains des troupes [SOV.GetAdjective].\n\nQuelques coups de feu résonnent encore, tirés par les derniers combattants de la résistance, mais la bataille est pratiquement terminée. Les chars [SOV.GetAdjective] stationnent sur la pelouse sud, tandis que la bannière rouge flotte triomphalement sur le Washington Monument."
 cityfall.18.a:0 "Est-ce le dernier souffle de la liberté ?"
 cityfall.18.b:0 "Les travailleurs de [USA.GetNameDef] seront libres !"
 cityfall.18.c:0 "Nous repousserons ces maudits rouges jusque dans la mer !"

 cityfall.19.t:0 "La Chute de Washington, D.C."
 cityfall.19.d:0 "Après une journée de combats acharnés, Washington, D.C., capitale de [USA.GetNameDef], est tombée face aux armées du Soleil levant. Malgré plusieurs tentatives pour maintenir l’ennemi de l’autre côté du Potomac, les troupes [JAP.GetAdjective] encerclèrent la ville et anéantirent les défenses locales le long de la Beltway. Une fois les deux lignes brisées, elles progressèrent méthodiquement, bâtiment par bâtiment, rasant au passage la plupart des monuments historiques.\n\nL’expérience américaine a peut-être trouvé sa fin, le Washington Monument gisant en ruines sur le National Mall et la Maison-Blanche livrée aux flammes."
 cityfall.19.a:0 "Un jour sombre pour tous les peuples libres du monde."
 cityfall.19.b:0 "Le Soleil levant abat l’aigle fier."
 cityfall.19.c:0 "Les [JAP.GetAdjective] doivent être arrêtés à tout prix !"

 cityfall.20.t:0 "La Chute de Washington, D.C."
 cityfall.20.d:0 "[ITA.GetLeader] a été transporté à Washington, D.C. aujourd’hui pour prononcer un discours sur les ruines de l’ancienne capitale [USA.GetAdjective]. Après plusieurs jours de combats acharnés, la bataille prit fin lorsque les troupes [USA.GetAdjective] reçurent l’ordre de battre en retraite. Elles tinrent jusqu’à ce que le Tricolore soit hissé sur la Maison-Blanche, puis abandonnèrent la lutte en voyant le Capitole.\n\nLa chute de Washington, D.C. est l’un des nombreux jalons consacrant [ITA.GetNameDef] comme superpuissance émergente — un point que [ITA.GetLeader] ne manquera certainement pas d’évoquer dans son discours."
 cityfall.20.a:0 "Empire [USA.GetAdjective] ? Pff."
 cityfall.20.b:0 "Mare Nostrum ? Maria Nostra !"
 cityfall.20.c:0 "Les peuples libres du monde ne se rendront jamais !"
 cityfall.21.t:0 "La Chute de Washington, D.C."
 cityfall.21.d:0 "Après une bataille acharnée qui a laissé Washington, D.C. en flammes, les troupes [MEX.GetAdjective] ont annoncé leur victoire dans la campagne de la côte Est américaine.\n\nBien que quelques poches de résistance subsistent encore, la chute de Washington, D.C. marque peut-être le dernier clou planté dans le cercueil de l’effort de guerre [USA.GetAdjective], désormais en plein désarroi après cette victoire éclatante [MEX.GetAdjective]. Cette bataille, qui coûta la vie à des milliers de [USA.GetAdjective] et de [MEX.GetAdjective], est peut-être l’acte final d’un conflit centenaire."
 cityfall.21.a:0 "Il semble qu’une nouvelle puissance ait pris le contrôle des Amériques."
 cityfall.21.b:0 "¡Viva México!"
 cityfall.21.c:0 "On aurait dû construire un mur !"

 cityfall.22.t:0 "La Chute de Washington, D.C."
 cityfall.22.d:0 "Durant la guerre de 1812, les forces britanniques commandées par le major-général Robert Ross capturèrent et incendièrent une grande partie de Washington, D.C., y compris la Maison-Blanche. Beaucoup attribuent à tort cette victoire aux troupes canadiennes, et une légende populaire affirme que ce sont elles qui auraient brûlé la Maison-Blanche.\n\nAujourd’hui, ce n’est plus une légende : les troupes [CAN.GetAdjective] ont prouvé qu’elles pouvaient, elles aussi, réduire en cendres la capitale [USA.GetAdjective] une bonne fois pour toutes. Après avoir combattu dans les rues, elles ont pillé et incendié le Capitole, ajoutant une marque amère à la chute continue de [USA.GetNameDef]."
 cityfall.22.a:0 "Oh là là."
 cityfall.22.b:0 "Et de deux pour nous, évidemment !"
 cityfall.22.c:0 "Ce n’est pas la fin !"
 cityfall.23.t:0 "La Chute de Belgrade"
 cityfall.23.d:0 "Les forces de la Wehrmacht ont annoncé aujourd’hui leur victoire après le retrait des troupes [YUG.GetAdjective] de la ville de Belgrade. La ville, lourdement endommagée après plusieurs heures de combats, est tombée à la suite d’un encerclement décisif [GER.GetAdjective] qui a repoussé les renforts et les convois d’approvisionnement [YUG.GetAdjective]. Voyant leur chance de s’échapper se réduire, les dernières forces [YUG.GetAdjective] ont livré leur ultime combat face à l’ennemi [GER.GetAdjective].\n\nLa chute de Belgrade marque la fin brutale de [YUG.GetNameDef], nation aux multiples peuples qui portait seule le rêve d’une union des Slaves du Sud assurant leur sécurité mutuelle. Mais même un rêve ne peut résister au marteau [GER.GetAdjective]."
 cityfall.23.a:0 "La Blitzkrieg continue."
 cityfall.23.b:0 "Orient, Occident ou Sud… tout est pareil !"
 cityfall.23.c:0 "Que nous tombions unis, comme nous avons vécu."

 cityfall.24.t:0 "La Chute de Belgrade"
 cityfall.24.d:0 "Malgré une résistance acharnée des forces combinées [YUG.GetAdjective], les troupes [ITA.GetAdjective] ont pris Belgrade après un long combat qui a laissé la majeure partie de la ville en ruines. Les [ITA.GetAdjective] traquent encore les derniers défenseurs locaux, tandis que de nombreux soldats [YUG.GetAdjective] ont abandonné l’uniforme pour rejoindre un mouvement partisan grandissant contre les envahisseurs [ITA.GetAdjective].\n\nCette victoire constitue un immense coup de pouce à la propagande [ITA.GetAdjective], qui présente déjà la bataille comme une étape clé vers la domination des Balkans sous suzeraineté [ITA.GetAdjective]."
 cityfall.24.a:0 "[ITA.GetLeader] est un pas plus près de son rêve."
 cityfall.24.b:0 "Nous avons triomphalement retrouvé l’Illyricum."
 cityfall.24.c:0 "Braves [YUG.GetAdjective], continuez le combat !"

 cityfall.25.t:0 "La Chute de Belgrade"
 cityfall.25.d:0 "Autrefois, les Grecs régnaient sur les terres qui forment aujourd’hui [YUG.GetNameDef], à l’époque de l’Empire byzantin. Mais la région, toujours difficile à tenir, est tombée hors du contrôle impérial depuis près d’un millénaire.\n\nSi les empires d’antan ont disparu, les [GRE.GetAdjective] sont désormais de retour à Belgrade, conquise après une offensive décisive [GRE.GetAdjective]. Bien que les troupes [GRE.GetAdjective] affrontent encore une résistance acharnée, notamment à Ada Ciganlija et Fontana, le bleu et blanc flotte désormais au-dessus de l’Assemblée nationale. Les dernières unités militaires organisées de la région se sont rendues."
 cityfall.25.a:0 "Les [GRE.GetAdjective] sont de retour."
 cityfall.25.b:0 "Nous sommes revenus !"
 cityfall.25.c:0 "Nous nous sommes libérés une fois, nous le ferons à nouveau !"

 cityfall.26.t:0 "La Chute de Belgrade"
 cityfall.26.d:0 "L’Armée rouge a récemment annoncé sa victoire dans la bataille de Belgrade. Le combat a pris fin lorsque les dernières forces [YUG.GetAdjective] se sont rendues sur les rives du Veliko Ratno Ostrvo, rebaptisé Ostrvo Narodnog Oslobođenja.\n\nSi l’événement ne surprend guère les observateurs extérieurs, il n’en reste pas moins un choc pour le peuple de [YUG.GetNameDef], qui voit son pays s’effondrer et doit désormais faire face à la réalité du régime [SOV.GetAdjective], lequel commence déjà à imposer des lois sévères et une occupation destinée à écraser toute résistance future."
 cityfall.26.a:0 "Il n’existe peut-être pas d’armée invincible, mais l’Armée rouge s’en approche."
 cityfall.26.b:0 "Jour de réjouissance pour les travailleurs de Yougoslavie !"
 cityfall.26.c:0 "Nous ne plierons jamais devant les tyrans rouges de l’Est, résistons !"

 cityfall.27.t:0 "La Chute de New York"
 cityfall.27.d:0 "Des incendies ravagent ce qui fut l’une des plus grandes villes du monde, alors que New York tombe sous la puissance de l’Armée rouge. Après de violents combats, les [SOV.GetAdjective] ont percé ligne après ligne, affrontant un mélange de troupes régulières et de milices.\n\nMalgré les efforts de nombreuses forces [USA.GetAdjective] pour contenir les [SOV.GetAdjective], le nombre écrasant de l’Armée rouge a fini par l’emporter. Finalement, la Bannière rouge a été hissée sur une Statue de la Liberté étonnamment intacte, désormais rebaptisée Statue de l’Égalité.\n\nLa résistance reste farouche dans plusieurs arrondissements, et les [SOV.GetAdjective] devront sans doute combattre des insurgés dans la ville pendant des années."
 cityfall.27.a:0 "La lumière de Lady Liberty ne brille plus."
 cityfall.27.b:0 "Encore une victoire glorieuse pour l’Armée rouge !"
 cityfall.27.c:0 "Unis nous tenons, unis nous tombons."

 cityfall.28.t:0 "La Chute de Dublin"
 cityfall.28.d:0 "Les forces [USA.GetAdjective] sont entrées aujourd’hui dans Dublin et ont pris la ville après plusieurs heures de combats contre les troupes [IRE.GetAdjective]. La bataille fut difficile, mais la victoire [USA.GetAdjective] était inévitable face au nombre écrasant de l’armée [USA.GetAdjective].\n\nLes [IRE.GetAdjective] continuent de se battre, et les unités d’occupation [USA.GetAdjective] affrontent déjà une insurrection acharnée, particulièrement dans les campagnes. Le travail des [USA.GetAdjective] sera long, car la résistance grandit à vue d’œil."
 cityfall.28.a:0 "Une étape vers la Grande-Bretagne ?"
 cityfall.28.b:0 "Le Nouveau Monde entre victorieusement dans l’Ancien."
 cityfall.28.c:0 "Tiocfaidh ár lá."

 cityfall.29.t:0 "La Chute de Dublin"
 cityfall.29.d:0 "Aujourd’hui, le commandant [GER.GetAdjective] à la tête de l’invasion de l’Irlande a annoncé la reddition formelle de la garnison de la ville, après que les dernières forces [IRE.GetAdjective], retranchées notamment au Trinity College et à la prison de Kilmainham, ont été bombardées pendant des heures par l’artillerie et l’aviation [GER.GetAdjective].\n\nLa bataille marque la fin de toute résistance organisée à Dublin. Bien que des unités [IRE.GetAdjective] survivent ailleurs, sans l’autorité centrale de Dublin, elles n’ont plus grand-chose à défendre. Beaucoup ont déjà abandonné l’uniforme pour passer à la lutte clandestine contre les forces [GER.GetAdjective]."
 cityfall.29.a:0 "La Manche ne protège plus contre la menace [GER.GetAdjective]."
 cityfall.29.b:0 "Les légions de Germania ne s’arrêtent devant rien !"
 cityfall.29.c:0 "Les Anglais n’ont pas pu nous écraser pour toujours, pas plus que les [GER.GetAdjective] !"

 cityfall.30.t:0 "La Chute de Dublin"
 cityfall.30.d:0 "Depuis que l’Irlande s’est libérée du joug britannique dans les années 1920, un véritable spectre planait : celui d’un retour des [ENG.GetAdjective]. Ce spectre est devenu réalité, lorsque, après de violents combats, les forces [ENG.GetAdjective] ont repoussé les défenseurs [IRE.GetAdjective] et hissé l’Union Jack sur Dublin.\n\nLes [IRE.GetAdjective] continuent de lutter, faisant exploser des véhicules militaires [ENG.GetAdjective] et assassinant des responsables locaux, le peuple se rassemblant autour de sa lutte millénaire pour l’indépendance vis-à-vis de [ENG.GetNameDef]. Mais, pour l’instant, il semble que l’Irlande soit à nouveau tombée."
 cityfall.30.a:0 "L’Empire se relève."
 cityfall.30.b:0 "Nous ne faisons que reprendre ce qui nous appartient."
 cityfall.30.c:0 "Dehors l’Angleterre !"

 cityfall.31.t:0 "La Chute de Moscou"
 cityfall.31.d:0 "Il y a plus de cent ans, l’armée française défilait dans les rues de Moscou ; aujourd’hui, elle y marche à nouveau. Après de violents combats maison par maison, les forces [FRA.GetAdjective] ont atteint la Place Rouge. Les sapeurs de l’armée ont percé le mur est du Kremlin, permettant aux troupes [FRA.GetAdjective] de submerger les derniers défenseurs et de hisser le Tricolore au-dessus du Grand Palais.\n\nCependant, les forces [SOV.GetAdjective] en retraite ont déclenché d’énormes charges incendiaires à travers la ville. Les incendies ravagent ce qu’il reste de la capitale [SOV.GetAdjective]. L’histoire se répète à Moscou, mais [FRA.GetNameDef] assure à la population qu’il n’y aura pas de nouveau « retraite de Napoléon »."
 cityfall.31.a:0 "La marée bleue poursuit sa route."
 cityfall.31.b:0 "En avant !"
 cityfall.31.c:0 "Nous leur ferons payer tout ce qu’ils nous ont pris !"

 cityfall.32.t:0 "La Chute de Moscou"
 cityfall.32.d:0 "Après plusieurs jours de bombardements massifs qui ont réduit en poussière la plupart des défenses extérieures de la ville, les forces [ITA.GetAdjective] ont lancé hier matin leur assaut final. La bataille, opposant toute la puissance de l’armée [ITA.GetAdjective] à l’essentiel de l’armée [SOV.GetAdjective] et presque à toute la population de Moscou, fut sanglante et aurait fait près d’un million de victimes.\n\nMalgré la résistance acharnée des Moscovites, femmes, enfants et anciens transformant les abords de la ville en un vaste champ de mort, de la mise en place de mitrailleuses à l’armement de mortiers, il Tricolore flotte désormais sur la ville, et les forces [SOV.GetAdjective] se replient vers l’Oural."
 cityfall.32.a:0 "La Troisième Rome tombe devant la première."
 cityfall.32.b:0 "De Moscou à Paris, tous s’inclineront à nouveau devant Rome."
 cityfall.32.c:0 "Nous reviendrons d’au-delà des montagnes !"

 cityfall.33.t:0 "La Chute de Moscou"
 cityfall.33.d:0 "Les forces [JAP.GetAdjective] ont passé la majeure partie de la journée à rassembler la population de Moscou sur la Place Rouge, avant de les embarquer dans des camions pour les envoyer plus profondément en territoire occupé [JAP.GetAdjective]. La raison exacte reste inconnue, mais la majorité des déportés sont des soldats [SOV.GetAdjective] et des responsables politiques locaux soupçonnés d’avoir critiqué [JAP.GetNameDef].\n\nL’ultime phase de la bataille, qui a duré plus d’une journée, a laissé la ville en ruines. La Place Rouge est l’un des rares endroits dont les routes ne sont pas complètement détruites. Les rues, ou ce qu’il en reste, sont jonchées d’épaves de chars [JAP.GetAdjective] et [SOV.GetAdjective], et des monceaux de cadavres s’élèvent à plusieurs mètres de haut. Les [JAP.GetAdjective] règnent désormais sur le cadavre de [SOV.GetNameDef]."
 cityfall.33.a:0 "Le soleil se lève au nord."
 cityfall.33.b:0 "Les [SOV.GetAdjective] ne nous regarderont plus jamais de haut."
 cityfall.33.c:0 "Ils pensent que la lutte est finie, mais le peuple ne se rendra jamais !"

 cityfall.34.t:0 "La Chute de Moscou"
 cityfall.34.d:0 "Le gouvernement [SPR.GetAdjective] a annoncé aujourd’hui que les forces de l’armée [SPR.GetAdjective] avaient pris la capitale [SOV.GetAdjective] après de violents combats rue par rue, laissant la ville autrefois fièrement surnommée la Troisième Rome réduite à une ruine fumante de cadavres et d’épaves de chars.\n\nLes journaux [SPR.GetAdjective] diffusent déjà les images de soldats [SPR.GetAdjective] hissant le Red-Weld au-dessus des ruines du Kremlin. Cet ultime obstacle est tombé après une journée entière de combats. Bien que de nombreux [SOV.GetAdjective] résistent encore dans les okrougs intérieurs, la plupart se sont rendus, et les [SPR.GetAdjective] installent déjà des checkpoints et des soupes populaires pour faire face à la crise humanitaire laissée par la bataille."
 cityfall.34.a:0 "D’ouest en est, [SPR.GetNameDef] a triomphé de tous."
 cityfall.34.b:0 "Buenos días, soviétiques !"
 cityfall.34.c:0 "Les tyrans [SPR.GetAdjective] seront renversés !"

 cityfall.35.t:0 "La Chute de Moscou"
 cityfall.35.d:0 "Des photos circulent dans la presse montrant des soldats [YUG.GetAdjective] posant fièrement au sommet du monument à Minine et Pojarski. On y voit sept hommes : cinq assis bras dessus bras dessous, et deux debout avec leurs fusils. Tous sont visiblement couverts de poussière, deux sont blessés, et l’un des hommes debout, un conscrit de 17 ans nommé Toma Lekovic, fait un signe de la victoire avec un sourire fatigué mais étonnamment pur. Un drapeau [SOV.GetAdjective] en lambeaux est tenu par tous.\n\nAujourd’hui, alors que les derniers coups de feu résonnent sur l’Arbat et dans les couloirs du GUM, tous, sauf un grièvement blessé par un éclat d’obus, sont morts. Bien que la ville soit prise, les pertes sont immenses, mais leurs noms marqueront l’histoire [YUG.GetAdjective]."
 cityfall.35.a:0 "Qui peut dire ce que l’avenir nous réserve ?"
 cityfall.35.b:0 "Lekovic et ses compagnons seront à jamais gravés dans nos mémoires."
 cityfall.35.c:0 "Mort au fléau des Balkans !"

 cityfall.36.t:0 "La Chute de Moscou"
 cityfall.36.d:0 "Après de violents combats qui ont embrasé la quasi-totalité de l’ancienne capitale [SOV.GetAdjective], les troupes [CHI.GetAdjective] ont hissé aujourd’hui leur drapeau sur les restes éventrés du Kremlin.\n\nLes troupes [SOV.GetAdjective] se replient dans la campagne après que leur commandant local a annoncé la reddition. Les survivants semblent déjà mener une campagne de guérilla contre les occupants [CHI.GetAdjective].\n\nLes [CHI.GetAdjective] présentent cet événement comme une victoire finale contre l’un de leurs plus grands rivaux, et beaucoup craignent que ce ne soit que la première étape vers une conquête de l’Europe."
 cityfall.36.a:0 "Pourra-t-on les arrêter ?"
 cityfall.36.b:0 "Ils auraient dû s’incliner quand ils en avaient l’occasion."
 cityfall.36.c:0 "Dans les rues comme dans les forêts, nous les combattrons !"

 cityfall.37.t:0 "La Chute de Moscou"
 cityfall.37.d:0 "Notre glorieuse nation [BHU.GetNameDef] a écrasé aujourd’hui les stupides défenseurs [SOV.GetAdjective] de Moscou. Nos troupes d’assaut ont défilé fièrement dans les ruines de leur ville après plusieurs heures de combat.\n\nLes soldats [SOV.GetAdjective] n’avaient que peu de ressources face à la supériorité de l’armée [BHU.GetAdjective], et près d’un demi-million de prisonniers ont déjà été recensés. Le Dug Yul a éventré l’ours, et bien que le reste du gouvernement [SOV.GetAdjective] continue de vociférer sur la résistance, plus personne ne doute de notre domination incontestée sur la Russie européenne."
 cityfall.37.a:0 "La menace [BHU.GetAdjective] peut-elle être arrêtée ?"
 cityfall.37.b:0 "Le peuple [BHU.GetAdjective] marchera d’une mer à l’autre !"
 cityfall.37.c:0 "[SOV.GetNameDef] ne tombera plus jamais sous le joug oriental !"

 cityfall.38.t:0 "La Chute de Washington"
 cityfall.38.d:0 "Malgré de nombreuses tentatives des forces [USA.GetAdjective] pour contenir, ou au moins retarder, l’avancée [SPR.GetAdjective], les [USA.GetAdjective] ont ordonné la retraite générale plus tôt dans la journée, après la percée des soldats [SPR.GetAdjective] dans le parc Rock Creek.\n\nLes [SPR.GetAdjective] ont brisé la dernière résistance à Capitol Hill et Fort Meyer après avoir surpris les défenseurs [USA.GetAdjective] en faisant remonter des forces spéciales par le Potomac.\n\nDésormais, avec la capitale de [USA.GetNameDef] sous leur coupe, il semble improbable que les [SPR.GetAdjective] soient chassés de la côte est. [SPR.GetLeader] a déjà atterri dans la capitale en ruines pour s’adresser aux troupes."
 cityfall.38.a:0 "Est-ce la chute de la liberté ?"
 cityfall.38.b:0 "Les gloires de l’Espagne triompheront de tout !"
 cityfall.38.c:0 "Nous les repousserons jusqu’à la mer !"

 cityfall.39.t:0 "La Chute de Washington"
 cityfall.39.d:0 "Pour la seconde fois de l’histoire, des soldats britanniques ont incendié Washington. Cette fois, la bataille a été bien plus meurtrière et destructrice pour les deux camps, avec de nombreux navires [ENG.GetAdjective] coulés au large par les forts [USA.GetAdjective], et des milliers de morts ou disparus dans la lutte désespérée pour la capitale [USA.GetAdjective]. Malgré cela, la domination [ENG.GetAdjective] dans la région est désormais incontestable.\n\nLa presse [USA.GetAdjective] réagit avec horreur, redoutant que l’Union ne soit brisée par son plus vieil ennemi. Les [ENG.GetAdjective], eux, s’en félicitent ouvertement."
 cityfall.39.a:0 "Ils ont repris leurs colonies."
 cityfall.39.b:0 "Les sales rebelles ont enfin reçu leur châtiment."
 cityfall.39.c:0 "SALAUDS DE REDCOATS, RENTREZ CHEZ VOUS."

 cityfall.40.t:0 "La Chute de Washington"
 cityfall.40.d:0 "Les soldats [POL.GetAdjective] ont finalement vaincu les défenseurs de la capitale [USA.GetAdjective] aujourd’hui, après une bataille étonnamment rapide pour le centre-ville. Bien qu’ils aient rencontré une forte résistance en traversant Bethesda et Fort Meade, la capitale elle-même est tombée rapidement grâce aux exploits des forces spéciales [POL.GetAdjective].\n\nEn passant par les anciens égouts de la ville, une équipe est parvenue à infiltrer la Maison Blanche et, croyant que la bataille était déjà terminée à cause d’une accalmie temporaire dans les combats et de l’absence fortuite de défenseurs [USA.GetAdjective], a hissé le drapeau [POL.GetAdjective] au sommet. Pensant être pris à revers, les défenseurs [USA.GetAdjective] ont commencé à se rendre peu après, et les [POL.GetAdjective] contrôlent désormais entièrement l’ancienne capitale [USA.GetAdjective]."
 cityfall.40.a:0 "Les [POL.GetAdjective] trouvent toujours un moyen."
 cityfall.40.b:0 "L’élite militaire [POL.GetAdjective] déjoue l’ennemi une fois de plus !"
 cityfall.40.c:0 "Vous vous moquez de moi ?"
 cityfall.41.t:0 "La Chute de Washington"
 cityfall.41.d:0 "La France entretenait une longue histoire d’amitié avec les États-Unis d’Amérique, bien avant même leur fondation. Cependant, les [FRA.GetAdjective] ont peut-être définitivement rompu ces liens aujourd’hui, après que Washington a été en grande partie rasée par les forces [FRA.GetAdjective] envahissantes.\n\nMalgré de nombreuses tentatives des forces armées [USA.GetAdjective] pour repousser puis déloger les envahisseurs [FRA.GetAdjective] de la capitale, les troupes [USA.GetAdjective] ont finalement dû battre en retraite, après que la Légion étrangère [FRA.GetAdjective] eut contre-attaqué avec succès et chassé les positions [USA.GetAdjective] à Arlington, réduisant à néant tout espoir de contre-offensive. Pour célébrer cette victoire, un immense Tricolore a été déployé sur le Washington Monument, rebaptisé désormais Monument à Napoléon."
 cityfall.41.a:0 "Les vieux amis chutent lourdement."
 cityfall.41.b:0 "Les [FRA.GetAdjective] ont vaincu tous leurs adversaires."
 cityfall.41.c:0 "On mangera de la grenouille ce soir !"

 cityfall.42.t:0 "La Chute de Washington"
 cityfall.42.d:0 "Les forces [CHI.GetAdjective] ont enfin vaincu les défenseurs [USA.GetAdjective] à Washington, après une bataille sanglante ayant coûté la vie à des milliers d’hommes des deux côtés. Les [USA.GetAdjective], qui avaient passé le dernier mois à fortifier la ville, pensaient pouvoir tenir indéfiniment, mais les vagues humaines [CHI.GetAdjective] ont fini par les submerger.\n\nBien que les défenses [USA.GetAdjective] fussent massives, les canons manquaient de munitions pour repousser les assauts incessants des soldats [CHI.GetAdjective]. Après plusieurs jours de carnage, les [CHI.GetAdjective] ont finalement atteint le Potomac."
 cityfall.42.a:0 "Les [CHI.GetAdjective] ne s’arrêtent devant rien."
 cityfall.42.b:0 "Le dragon se repaît de l’aigle !"
 cityfall.42.c:0 "La menace jaune sera encore vaincue !"

 cityfall.43.t:0 "La Chute de Washington"
 cityfall.43.d:0 "Les légions d’élite invincibles de l’armée [BHU.GetAdjective] ont rasé Washington aujourd’hui, ne comptant que trois soldats [BHU.GetAdjective] morts durant cette soi-disant 'bataille'.\n\nBien que les [USA.GetAdjective] aient mis en place d’imposantes défenses pour empêcher les [BHU.GetAdjective] de prendre le bastion du pouvoir américain, ces derniers ont choisi de raser la ville. Des tirs d’artillerie massifs, des bombardements aériens et navals ont presque entièrement aplati la capitale, laissant la mer s’engouffrer dans ses ruines. Les soldats [BHU.GetAdjective] ont traversé les décombres pour ne trouver presque rien. L’armée pitoyable [USA.GetAdjective] n’a pas tenu face à leur feu glorieux."
 cityfall.43.a:0 "Bande de Yankees, faites mieux !"
 cityfall.43.b:0 "LES AMÉRICRÉTINS TOMBENT EUX AUSSI."
 cityfall.43.c:0 "Est-il trop tard pour se rendre ?"

 cityfall.44.t:0 "La Chute de New York"
 cityfall.44.d:0 "[ITA.GetLeader] a proclamé aujourd’hui la victoire, les forces [USA.GetAdjective] ayant été chassées de New York. Bien que la résistance organisée ait été écrasée, les [ITA.GetAdjective] font face à une forte insurrection, marquée par des attentats et fusillades réguliers.\n\nLes communautés italiennes locales sont particulièrement touchées : elles comptent à la fois parmi les plus fervents partisans et parmi les plus acharnés opposants à l’occupation. Les soldats [ITA.GetAdjective], de leur côté, en viennent souvent à malmener les habitants, leur reprochant d’avoir fui l’Italie à l’heure de sa gloire. L’avenir y reste incertain."
 cityfall.44.a:0 "L’ambition de [ITA.GetLeader] se révèle."
 cityfall.44.b:0 "Les vrais Italiens nous accueillent !"
 cityfall.44.c:0 "Les vrais [USA.GetAdjective] continuent le combat !"

 cityfall.45.t:0 "La Chute de New York"
 cityfall.45.d:0 "Les forces [JAP.GetAdjective] ont écrasé et éliminé aujourd’hui les derniers défenseurs de New York, après que des sapeurs [JAP.GetAdjective] eurent fait s’effondrer les tunnels du métro, tuant ainsi les derniers soldats [USA.GetAdjective] retranchés sous terre, ainsi que plusieurs centaines, voire milliers, de civils qui s’y abritaient.\n\nAvec l’armée [USA.GetAdjective] anéantie, seuls restent pour combattre l’occupant [JAP.GetAdjective] quelques forces locales composées de déserteurs [USA.GetAdjective], d’anciens policiers et d’habitants armés. Mais déjà, les [JAP.GetAdjective] mènent une répression massive, arrêtant des centaines de personnes et déportant leurs familles."
 cityfall.45.a:0 "Pourra-t-on arrêter cette menace ?"
 cityfall.45.b:0 "Le soleil levant brûle les fous."
 cityfall.45.c:0 "Même dans ses heures les plus sombres, [USA.GetNameDef] ne tombera jamais."

 cityfall.46.t:0 "La Chute de New York"
 cityfall.46.d:0 "Les journaux du monde entier publient des photos de soldats [SPR.GetAdjective] saluant depuis la statue de la Liberté. Posant là où se trouvait autrefois la plateforme d’observation, désormais éventrée, ils offrent une vue sur la ville en arrière-plan, avec la torche réduite à un moignon fondu.\n\nLa statue n’est qu’un des nombreux monuments pris dans les combats. Tandis que les [USA.GetAdjective] accusent les [SPR.GetAdjective] d’avoir ravagé la ville, ces derniers présentent l’invasion comme une libération, affirmant que des milliers d’Américains se réjouissent dans les rues."
 cityfall.46.a:0 "Aucun respect, ces [SPR.GetAdjective]."
 cityfall.46.b:0 "¡Viva España!"
 cityfall.46.c:0 "Comme New York, nous ferons un jour de Barcelone une grande ville."

 cityfall.47.t:0 "La Chute de New York"
 cityfall.47.d:0 "Les Britanniques avaient conservé une présence militaire à New York jusqu’en 1783, année où ils quittèrent la ville après avoir été défaits dans la guerre d’indépendance américaine.\n\nAujourd’hui, l’histoire se répète, l’armée [ENG.GetAdjective] défilant de nouveau dans ses rues. Bien qu’ils portent désormais le kaki au lieu du rouge et des fusils au lieu de mousquets, les [ENG.GetAdjective] sont bel et bien de retour. Une grande parade était prévue à Times Square, mais un attentat y tua douze soldats. Les défilés ont été annulés et les troupes [ENG.GetAdjective] se consacrent désormais à réprimer la population."
 cityfall.47.a:0 "L’histoire se répète."
 cityfall.47.b:0 "L’histoire a été rétablie."
 cityfall.47.c:0 "On les a déjà chassés, on le fera encore !"
 cityfall.48.t:0 "La Chute de New York"
 cityfall.48.d:0 "Alors que les villes du nord de [USA.GetNameDef] tombaient comme des dominos face à l’armée [CAN.GetAdjective], beaucoup craignaient qu’il ne soit qu’une question de temps avant que New York ne subisse le même sort. Cette crainte s’est réalisée lorsque l’armée [CAN.GetAdjective] a percé les lignes de défense autour de la ville et anéanti ce qu’il restait des forces [USA.GetAdjective].\n\nLes survivants [USA.GetAdjective] se sont cachés, aidés par la population locale, poursuivant la guerre dans l’ombre en attaquant convois isolés ou soldats [CAN.GetAdjective] esseulés. Cependant, la ville reste fermement entre les mains des nordistes."
 cityfall.48.a:0 "Ces fichus Canadiens !"
 cityfall.48.b:0 "Les Yankees se soumettront bien assez tôt."
 cityfall.48.c:0 "Nous écraserons notre grand ennemi du nord !"

 cityfall.49.t:0 "La Chute de New York"
 cityfall.49.d:0 "Ce que beaucoup prédisent comme la fin de la guerre éreintante entre [USA.GetNameDef] et [MEX.GetNameDef] s’est produit : les soldats [MEX.GetAdjective] ont submergé les derniers défenseurs de New York. Malgré les efforts désespérés des [USA.GetAdjective] pour repousser les envahisseurs du sud, les troupes [MEX.GetAdjective] ont fini par écraser la dernière poche de résistance à Times Square.\n\nLa dévastation est totale : l’ancien symbole de la ville n’est plus qu’un tas de gravats, tout comme la plupart des quartiers. Des survivants hagards errent dans les rues, cherchant proches et nourriture.\n\nMême si la guerre se poursuit ailleurs, c’est peut-être le dernier souffle de résistance dans le nord-est américain."
 cityfall.49.a:0 "Adieu, Amérique. Adieu."
 cityfall.49.b:0 "¡Viva México!"
 cityfall.49.c:0 "Combattez, braves fils et filles de Washington ! Combattez !"

 cityfall.50.t:0 "La Chute de New York"
 cityfall.50.d:0 "Si beaucoup s’attendaient à ce que la guerre entre [USA.GetNameDef] et [POL.GetNameDef] atteigne le territoire continental [USA.GetAdjective], peu imaginaient que des soldats [POL.GetAdjective] prendraient la plus grande ville du pays.\n\nLes forces [POL.GetAdjective], qui assiégeaient la ville, ont trouvé une brèche après qu’un chasseur [POL.GetAdjective], probablement touché par l’ennemi, s’est écrasé sur les lignes [USA.GetAdjective], ouvrant un trou dans les défenses.\n\nAvant que les [USA.GetAdjective] puissent colmater la faille, les troupes d’assaut [POL.GetAdjective] s’y sont engouffrées. Après une journée de combats acharnés, elles ont submergé les défenseurs et forcé leur retraite.\n\nLa ville est désormais sous contrôle [POL.GetAdjective], et le drapeau blanc et rouge flotte depuis un bras de la Statue de la Liberté."
 cityfall.50.a:0 "Où iront les [POL.GetAdjective] ensuite ?"
 cityfall.50.b:0 "Nous l’appellerons Americaski."
 cityfall.50.c:0 "La Pologne !? LA POLOGNE !?"

 cityfall.51.t:0 "La Chute de New York"
 cityfall.51.d:0 "Après une bataille acharnée contre les unités locales [USA.GetAdjective], les forces [FRA.GetAdjective] ont fini par prendre New York. Les combats, d’une brutalité rare, ont vu les [USA.GetAdjective] saigner chaque mètre de terrain aux assaillants [FRA.GetAdjective], causant de lourdes pertes des deux côtés, mais la victoire revint aux envahisseurs.\n\nLes civils [USA.GetAdjective] furent les plus durement touchés : la ville n’est plus qu’un champ de ruines fumantes, l’armée [USA.GetAdjective] ayant utilisé chaque bâtiment, égout et tunnel comme point de défense.\n\nSeule la moitié de la population d’origine reste sur place, les autres ayant fui ou péri, mais pour tous, la ville est désormais [FRA.GetAdjective]."
 cityfall.51.a:0 "Napoléon en serait fier."
 cityfall.51.b:0 "Adieu, Amérique !"
 cityfall.51.c:0 "Combattez ! Combattez ! Ne vous rendez jamais !"

 cityfall.52.t:0 "La Chute de New York"
 cityfall.52.d:0 "Poursuivant leur longue et lente campagne à travers [USA.GetNameDef], les forces [CHI.GetAdjective] ont hissé leur bannière sur les restes penchés de l’Empire State Building, l’un des nombreux bastions [USA.GetAdjective] tombés face à leur avancée implacable.\n\nLes chars [CHI.GetAdjective] roulent désormais librement dans les rues, et bien que des partisans locaux attaquent parfois leurs lignes d’approvisionnement, la résistance organisée a été brisée. Les ruines de ce qui fut la plus grande ville du monde ne sont plus qu’un amas fumant, tandis que les [CHI.GetAdjective] pillent musées et lieux culturels pour en ramener des trophées."
 cityfall.52.a:0 "De Tokyo à New York."
 cityfall.52.b:0 "Un jour glorieux pour notre grande nation."
 cityfall.52.c:0 "Nous repousserons les [CHI.GetAdjective] !"

 cityfall.53.t:0 "La Chute de New York"
 cityfall.53.d:0 "La Glorieuse Force Aérienne Royale de la Grande Liberté [BHU.GetAdjective] a réduit en bouillie les pathétiques défenseurs de New York, permettant à l’armée [BHU.GetAdjective] d’entrer dans la ville, des drapeaux blancs flottant à chaque fenêtre.\n\nL’esprit pitoyable du peuple [USA.GetAdjective], citoyens d’un faux pays fondé pour retarder l’inévitable conquête mondiale [BHU.GetAdjective], a été brisé, tandis que les troupes d’assaut [BHU.GetAdjective] s’assurent qu’aucune résistance ne subsiste."
 cityfall.53.a:0 "[BHU.GetNameDefCap] ne s’arrête pas et ne s’arrêtera jamais."
 cityfall.53.b:0 "LES DRAGONS GLORIEUX DU BHOUTAN DÉVORENT LA POMME PATHÉTIQUE."
 cityfall.53.c:0 "Comment avez-vous pu laisser faire ?"

 cityfall.54.t:0 "La Chute de Stockholm"
 cityfall.54.d:0 "Stockholm est tombée aujourd’hui face à l’invasion [USA.GetAdjective], après que leurs forces ont éliminé les derniers foyers de résistance dans les rues. Les derniers défenseurs [SWE.GetAdjective] tenaient encore quelques positions, comme Staden mellan broarna, le musée Vasa ou des tranchées sur Djurgården. Mais c’est le palais royal qui résista le plus longtemps.\n\nPiégés dans le château, que les [USA.GetAdjective] refusaient de bombarder par respect pour ce site culturel, il fallut qu’un commando [USA.GetAdjective] s’infiltrât au rez-de-chaussée et éliminât les défenseurs pour que le reste du bâtiment se rende.\n\nAvec les [SWE.GetAdjective] écrasés, la machine de guerre [USA.GetAdjective] se tourne vers d’autres cibles, et beaucoup redoutent la suite."
 cityfall.54.a:0 "Les [USA.GetAdjective] ne s’arrêteront pas là, n’est-ce pas ?"
 cityfall.54.b:0 "Un bon combat, mais juste un échauffement."
 cityfall.54.c:0 "Les [SWE.GetAdjective] ne se rendront jamais !"

 cityfall.55.t:0 "La Chute de Stockholm"
 cityfall.55.d:0 "Bien que les [SWE.GetAdjective] aient opposé une résistance acharnée aux envahisseurs [ITA.GetAdjective], l’armée [SWE.GetAdjective] fut contrainte d’abandonner après que les [ITA.GetAdjective] eurent contourné leurs forces principales et provoqué une déroute dans les rues.\n\nBeaucoup de défenseurs restèrent pour protéger leur foyer et évacuer la famille royale vers le nord. Bien qu’ils y soient parvenus, ils furent finalement submergés après plusieurs heures de combat intense.\n\nLes soldats [SWE.GetAdjective] restants refusent de se rendre, mais la population est épuisée, et la chute de la capitale est un coup terrible au moral national."
 cityfall.55.a:0 "Était-ce le dernier baroud d’honneur de [SWE.GetNameDef] ?"
 cityfall.55.b:0 "La glorieuse Italie ira plus loin que jamais les Romains ne l’ont rêvé."
 cityfall.55.c:0 "[SWE.GetNameDefCap] ne tombera jamais face à de telles vermines."

 cityfall.56.t:0 "La Chute de Stockholm"
 cityfall.56.d:0 "Les forces [JAP.GetAdjective] ont submergé aujourd’hui les défenseurs épuisés de Stockholm. Après des heures de bombardement incessant, réduisant monuments et sites à l’état de gravats, les [JAP.GetAdjective] ont investi la ville, éliminant brutalement toute opposition maison par maison, rue par rue.\n\nLes [SWE.GetAdjective] utilisèrent chaque structure restante ou tas de décombres pour se défendre, causant de lourdes pertes aux deux camps.\n\nMais le temps et le nombre étaient du côté [JAP.GetAdjective], et les [SWE.GetAdjective] durent battre en retraite ou faire face à l’anéantissement."
 cityfall.56.a:0 "Le soleil levant brûle tout."
 cityfall.56.b:0 "Pathétique qu’ils aient tenté de résister au soleil levant."
 cityfall.56.c:0 "Braves Suédois, organisez-vous, combattez et triomphez !"

 cityfall.57.t:0 "La Chute de Stockholm"
 cityfall.57.d:0 "Bien que les combats autour de la capitale [SWE.GetAdjective] aient duré presque toute la semaine, les forces [SPR.GetAdjective] ont proclamé aujourd’hui leur victoire sur les ruines de la ville, après que la bataille eut ravagé ses rues et détruit la majeure partie de ses bâtiments.\n\nLes habitants marqués par les combats furent rassemblés sur la place Stortorget, où le commandant local [SPR.GetAdjective] prononça un discours sur leur nouvelle situation sous domination [SPR.GetAdjective]."
 cityfall.57.a:0 "Qui aurait cru que les [SPR.GetAdjective] iraient si loin."
 cityfall.57.b:0 "España ne cessera jamais !"
 cityfall.57.c:0 "[SWE.GetNameDefCap] ne tombera pas tant que nous le refuserons."
cityfall.58.t:0 "La Chute de Stockholm"
cityfall.58.d:0 "Malgré la résistance acharnée des défenseurs [SWE.GetAdjective], les forces [ENG.GetAdjective] ont réussi à submerger les [SWE.GetAdjective] à Stockholm et à s’emparer de la ville.\n\nSi les piquets [SWE.GetAdjective] autour de la ville ont opposé une défense vigoureuse, un débarquement naval [ENG.GetAdjective], avec des marines prenant les [SWE.GetAdjective] par surprise depuis la mer, a permis de déloger de nombreux défenseurs et de remporter la victoire dans la ville.\n\nAvec [SWE.GetNameDef] tombé, le reste de la Scandinavie semble désormais grand ouvert aux [ENG.GetAdjective], et cette nouvelle base leur offre un contrôle étendu sur la mer Baltique. Ce que cela signifie pour leurs ennemis reste à voir."
cityfall.58.a:0 "Le Nord est tombé."
cityfall.58.b:0 "À l’est et en avant, hommes d’Albion !"
cityfall.58.c:0 "Ils pensent que nous sommes finis, mais nous ne nous rendrons jamais !"

cityfall.59.t:0 "La Chute de Stockholm"
cityfall.59.d:0 "La dernière guerre entre Suédois et Norvégiens remonte à 1814 ; elle n’avait pas touché le territoire suédois et s’était conclue par la reddition du gouvernement norvégien au roi de Suède Charles XIV Jean.\n\nL’histoire s’est inversée : l’armée [NOR.GetAdjective] a réussi à vaincre les défenseurs [SWE.GetAdjective] de Stockholm et à prendre la ville pour [NOR.GetNameDef]. Malgré l’âpreté des combats, les forces [SWE.GetAdjective] de la ville ont commencé à déposer les armes, et les [NOR.GetAdjective] s’efforcent désormais de récupérer ce qu’ils peuvent de la capitale endommagée.\n\nEn contrôlant désormais la plus grande ville de Scandinavie, les [NOR.GetAdjective] semblent avoir solidement établi leur domination sur la région."
cityfall.59.a:0 "Ils ne savent que se battre entre eux !"
cityfall.59.b:0 "Qui est le roi maintenant ?"
cityfall.59.c:0 "Maudits Norvégiens !"

cityfall.60.t:0 "La Chute de Stockholm"
cityfall.60.d:0 "Bien que la Suède se soit souvent battue pour la Finlande, elle n’avait jamais affronté ses frères de l’Est. La guerre entre les deux s’achève désormais clairement à l’avantage des [FIN.GetAdjective], qui ont réussi à prendre Stockholm malgré les efforts acharnés des [SWE.GetAdjective].\n\nEn contournant par la terre et via les îles Åland, les forces [FIN.GetAdjective] ont surmonté les défenses farouches des [SWE.GetAdjective] retranchés dans le palais royal et le long de Valhallavägen et d’Oxenstiernsgatan.\n\nMalgré des pertes civiles et militaires considérables, le drapeau à croix bleue flotte désormais sur le palais royal, et la seule question est de savoir ce que les [FIN.GetAdjective] comptent faire de leur nouvelle ville."
cityfall.60.a:0 "Un tournant intéressant."
cityfall.60.b:0 "Qui est la plus grande nation, maintenant ?"
cityfall.60.c:0 "Ces traîtres !"

cityfall.61.t:0 "La Chute de Stockholm"
cityfall.61.d:0 "La dernière guerre entre Suède et Danemark s’est achevée en 1814, et la dernière victoire danoise sur la Suède remonte à 1660. Depuis 1523, lorsque le royaume de Suède s’est détaché de l’Union de Kalmar et a commencé à affronter sans relâche le Danemark pour le territoire et le pouvoir, l’histoire n’a cessé de tourner au désavantage de Copenhague.\n\nAujourd’hui, la tendance s’inverse : pour la première fois depuis cinq siècles, les [DEN.GetAdjective] ont pris Stockholm aux défenseurs [SWE.GetAdjective]. Bien que beaucoup craignissent un nouveau bain de sang à la Stockholm, l’invasion s’est déroulée dans une relative cordialité, les [DEN.GetAdjective] s’efforçant d’éviter une insurrection contre leur nouveau pouvoir. Cependant, les conséquences de cette conquête pour la Scandinavie restent à déterminer."
cityfall.61.a:0 "Un retour à Kalmar ?"
cityfall.61.b:0 "Un retour à Kalmar !"
cityfall.61.c:0 "Un retour à Kalmar."

cityfall.62.t:0 "La Chute de Stockholm"
cityfall.62.d:0 "Historiquement, Polonais et Suédois ont été de féroces rivaux, se disputant les ports de la mer Baltique et la suprématie sur les États côtiers. Le royaume de Suède a joué un rôle déterminant dans le démantèlement de la République des Deux Nations, et depuis, la Pologne n’a été qu’un pion sur l’échiquier des grandes puissances.\n\nCe temps est révolu : les [POL.GetAdjective] ont percé les défenses de Stockholm et conquis la ville.\n\nLa résistance [SWE.GetAdjective] reste forte, mais les [POL.GetAdjective] ont mis en place une occupation stricte qui réprime durement toute dissidence."
cityfall.62.a:0 "[POL.GetNameDefCap] trouve sa véritable destinée."
cityfall.62.b:0 "Anciens ennemis, nouveaux sujets."
cityfall.62.c:0 "Maudits Polonais !"

cityfall.63.t:0 "La Chute de Stockholm"
cityfall.63.d:0 "Le glorieux [BHU.GetName] a hissé son drapeau sur Stockholm dans sa dernière conquête de [SWE.GetNameDef].\n\nMalgré une défense prolongée des [SWE.GetAdjective], il n’y avait pas grand-chose à faire face à la supériorité écrasante de l’armée [BHU.GetAdjective], et les [SWE.GetAdjective] ont capitulé.\n\nSans même chercher à occuper la ville, les [BHU.GetAdjective] ont rasé intégralement son centre historique et ses quartiers anciens, effaçant de la carte celle qu’on appelait jadis la « Venise du Nord ».\n\nBien que ce massacre ait suscité une condamnation générale, la plupart sont trop effrayés par la marche inexorable des [BHU.GetAdjective] vers l’Ouest pour agir."
cityfall.63.a:0 "Horrible !"
cityfall.63.b:0 "LE BHOUTAN SE MOQUE DES MISÉRABLES TAS DE PIERRES DU NORD."
cityfall.63.c:0 "Ces salauds seront détruits !"

cityfall.64.t:0 "La Chute d’Oslo"
cityfall.64.d:0 "Malgré la volonté de défendre leur capitale, les [NOR.GetAdjective] souffraient de graves pénuries logistiques et d’échecs de communication qui laissèrent leur armée de l’air mal préparée. Avec seulement quelques pertes [GER.GetAdjective] pour la ville, l’aéroport de Fornebu fut rapidement pris faute de munitions, puis Oslo elle-même.\n\nEn raison des délais [GER.GetAdjective], le gouvernement [NOR.GetAdjective] a tout juste eu le temps d’évacuer la famille royale, le parlement et le trésor. Les forces [NOR.GetAdjective] jurent de reprendre la ville, mais n’ont mené que de rares escarmouches, et il semble que leur contre-offensive ait été stoppée."
cityfall.64.a:0 "Un nouvel exemple de la cruauté de [GER.GetNameDef]."
cityfall.64.b:0 "Une étape de plus vers notre gloire."
cityfall.64.c:0 "Le Nord tiendra !"

cityfall.65.t:0 "La Chute d’Oslo"
cityfall.65.d:0 "Une fois de plus, la Suède a écrasé les défenseurs de la Norvège et les a remis sous son joug. Les forces [SWE.GetAdjective] se sont emparées d’Oslo face à des défenseurs [NOR.GetAdjective] dépassés.\n\nBien que les défenses fussent solides sur les routes de l’est norvégien, Oslo fut laissée relativement sans protection lorsque les [NOR.GetAdjective] évacuèrent la ville devant l’invasion [SWE.GetAdjective].\n\nLa famille royale a pu fuir, mais le pays tombe rapidement face à l’avancée suédoise."
cityfall.65.a:0 "La guerre a englouti le Nord."
cityfall.65.b:0 "La Scandinavie sera de nouveau unie !"
cityfall.65.c:0 "Nous les avons combattus jadis ; nous le ferons encore."

cityfall.66.t:0 "La Chute d’Oslo"
cityfall.66.d:0 "Jamais une armée finlandaise n’était allée si loin à l’Ouest, mais les [FIN.GetAdjective] entrent dans l’histoire : le drapeau [NOR.GetAdjective] a été retiré des bâtiments d’Oslo, et ses défenseurs ont remis leurs armes aux assaillants [FIN.GetAdjective].\n\nPeu s’attendaient à voir les [FIN.GetAdjective] progresser autant, mais nul ne doute désormais de leur domination croissante sur la Scandinavie, après avoir soumis [NOR.GetNameDef] et atteint sa capitale."
cityfall.66.a:0 "Où iront-ils ensuite ?"
cityfall.66.b:0 "[FIN.GetNameDefCap] n’a pas de limites !"
cityfall.66.c:0 "Nous avons combattu les [SWE.GetAdjective] ; nous combattrons les [FIN.GetAdjective]."

cityfall.67.t:0 "La Chute d’Oslo"
cityfall.67.d:0 "Les Danois n’ont plus exercé d’hégémonie sur la Norvège depuis des siècles, mais cela pourrait changer : des soldats [DEN.GetAdjective] ont submergé les défenseurs d’Oslo lors d’une invasion conjointe par mer et par terre.\n\nBien que l’aviation [NOR.GetAdjective] ait résisté autant que possible, le manque de munitions et de carburant empêcha de stopper les débarquements [DEN.GetAdjective], et les troupes [NOR.GetAdjective] évacuèrent bientôt la capitale.\n\nSerait-ce un retour à l’Union de Kalmar ?"
cityfall.67.a:0 "Les [DEN.GetAdjective] ne prennent que ce qui leur appartient."
cityfall.67.b:0 "Nous sommes revenus sur notre terre légitime."
cityfall.67.c:0 "Mort aux [DEN.GetAdjective] !"
cityfall.68.t:0 "La Chute de Leningrad"
cityfall.68.d:0 "Leningrad, ancienne capitale de l’Empire russe, est tombée aux mains des forces [FIN.GetAdjective]. Avec plus de trois millions d’habitants, la ville compte presque autant d’âmes que [FIN.GetNameDef], mais ce fait n’a pas découragé les troupes [FIN.GetAdjective].\n\nUn débat existe quant à l’intégration ou non de la ville à [FIN.GetNameDef], étant donné qu’une importante minorité de Finnois ingrien vit dans les régions périphériques. Bien sûr, cela suppose que l’Armée rouge ne parvienne pas à reprendre la ville lors d’une contre-offensive."
cityfall.68.a:0 "Un événement majeur."
cityfall.68.b:0 "Notre destinée s’est accomplie ; l’Ours [SOV.GetAdjective] tremble devant la puissance [FIN.GetAdjective] !"
cityfall.68.c:0 "Nous les avons vaincus en 1809 ; nous recommencerons !"

cityfall.69.t:0 "La Chute de Londres"
cityfall.69.desc:0 "Autrefois cœur de l’Empire britannique, la fière ville de Londres est désormais ravagée par les flammes, tandis que les unités [new_controller.GetAdjective] s’emparent des derniers ponts encore debout sur la Tamise. Les troupes [old_controller.GetAdjective] ont défendu la ville avec acharnement, mais la manœuvre de contournement ennemie et l’incendie qui a semé la confusion dans leurs lignes ont rendu leur position intenable, les forçant à battre en retraite.\n\nLondres est maintenant fermement aux mains des [new_controller.GetAdjective], et leur drapeau flotte sur plusieurs monuments emblématiques."
cityfall.69.a:0 "Le combat n’est pas terminé !"
cityfall.69.b:0 "Une grande victoire !"
cityfall.69.c:0 "La guerre prend un tournant inattendu."

cityfall.70.t:0 "La Chute d’Ottawa"
cityfall.70.desc:0 "Des changements secouent le Nouveau Monde : Ottawa, jadis centre politique du Canada, a été envahie par l’avant-garde des soldats [new_controller.GetAdjective]. Quelques heures plus tard, des renforts ont afflué et la ville entière a été occupée.\n\nLes troupes [old_controller.GetAdjective] se sont retirées, espérant regrouper leurs forces et préparer une contre-attaque."
cityfall.70.a:0 "Le combat n’est pas terminé !"
cityfall.70.b:0 "Une grande victoire !"
cityfall.70.c:0 "La guerre prend un tournant inattendu."

cityfall.71.t:0 "La Chute de Berlin"
cityfall.71.desc:0 "Les sympathisants du [old_controller.GetRulingParty] restent sans voix alors que la nouvelle de la chute de Berlin se répand dans le monde. L’artillerie [new_controller.GetAdjective] a organisé un colossal barrage, tandis que d’autres unités encerclaient progressivement la ville. Potsdam, Pankow, Marzahn, Mariendorf et d’autres banlieues sont tombées les unes après les autres sous contrôle [new_controller.GetAdjective].\n\nL’étau se resserra peu à peu sur le centre-ville, les forces [new_controller.GetAdjective] avançant le long des grandes avenues comme Unter den Linden et le Kurfürstendamm. Finalement, la résistance [old_controller.GetAdjective] céda, et les [new_controller.GetAdjective] prirent le contrôle de la chancellerie du Reich et de l’opéra Kroll."
cityfall.71.a:0 "Le combat n’est pas terminé !"
cityfall.71.b:0 "Une grande victoire !"
cityfall.71.c:0 "La guerre prend un tournant inattendu."

cityfall.72.t:0 "Les troupes [new_controller.GetAdjective] entrent dans Rio de Janeiro !"
cityfall.72.desc:0 "Le sable blanc de la célèbre plage de Copacabana est taché de rouge par les combats acharnés qui ont secoué Rio de Janeiro. L’offensive [new_controller.GetAdjective] visait à capturer les deux accès à la baie de Guanabara, ce qui explique l’intensité des affrontements autour de Niterói.\n\nLes défenseurs [old_controller.GetAdjective] se sont repliés peu à peu jusqu’à ce que tout combat cesse, laissant la ville entièrement aux mains des forces [new_controller.GetAdjective]."
cityfall.72.a:0 "Le combat n’est pas terminé !"
cityfall.72.b:0 "Une grande victoire !"
cityfall.72.c:0 "La guerre prend un tournant inattendu."

cityfall.73.t:0 "Les troupes [new_controller.GetAdjective] entrent dans Buenos Aires !"
cityfall.73.desc:0 "Malgré son nom, l’air de Buenos Aires est saturé de cendres, de sang, de bois et d’huile brûlés. La récente offensive [new_controller.GetAdjective] a permis de s’emparer de la ville et de sécuriser l’embouchure du Rio de la Plata.\n\nLe commandant [old_controller.GetAdjective] a juré de revenir laver son honneur dans le sang de ses ennemis un jour. Mais pour l’heure, ce sont les soldats [new_controller.GetAdjective] qui célèbrent leur victoire et profitent d’un repos bien mérité."
cityfall.73.a:0 "Le combat n’est pas terminé !"
cityfall.73.b:0 "Une grande victoire !"
cityfall.73.c:0 "La guerre prend un tournant inattendu."

cityfall.74.t:0 "Les forces armées [new_controller.GetAdjective] entrent dans Mexico !"
cityfall.74.desc:0 "[old_controller.GetNameDefCap] est désormais sur la défensive, les troupes [new_controller.GetAdjective] ayant pris Mexico. Incapables de tenir leurs positions face à la pression croissante, les forces [old_controller.GetAdjective] se sont repliées dans les montagnes.\n\n[old_controller.GetLeader] a déclaré que la guerre n’était pas finie et que le combat pour l’indépendance de [MEX.GetNameDef] devait continuer."
cityfall.74.a:0 "Le combat n’est pas terminé !"
cityfall.74.b:0 "Une grande victoire !"
cityfall.74.c:0 "La guerre prend un tournant inattendu."

cityfall.75.t:0 "Les unités [new_controller.GetAdjective] entrent dans Delhi"
cityfall.75.desc:0 "Le joyau de l’Hindoustan, Delhi, est tombé aux mains des forces [new_controller.GetNameDef].\n\nImpuissants face à l’avancée ennemie, les défenseurs de [old_controller.GetNameDef] se sont retirés. Le contraste entre les infrastructures de la ville et les campagnes environnantes était frappant, et de nombreux soldats blessés ont dû être laissés sur place, tombant aux mains des [new_controller.GetAdjective]."
cityfall.75.a:0 "Le combat n’est pas terminé !"
cityfall.75.b:0 "Une grande victoire !"
cityfall.75.c:0 "La guerre prend un tournant inattendu."

cityfall.76.t:0 "[new_controller.GetNameDefCap] s’empare du canal de Panama"
cityfall.76.desc:0 "Lors d’un raid audacieux, les forces [new_controller.GetAdjective] se sont emparées du canal de Panama, jusque-là sous contrôle [old_controller.GetAdjective]. L’opération a provoqué la fureur de [old_controller.GetLeader] et aura un impact massif sur la circulation maritime entre l’Atlantique et le Pacifique.\n\nLe risque d’une contre-attaque demeure, et si [new_controller.GetNameDef] ne peut sécuriser sa conquête, il pourrait décider de faire sauter les écluses et de rendre le canal inutilisable."
cityfall.76.a:0 "Le combat n’est pas terminé !"
cityfall.76.b:0 "Une grande victoire !"
cityfall.76.c:0 "La guerre prend un tournant inattendu."
cityfall.77.t:0 "Les forces armées [new_controller.GetAdjective] entrent dans [797.GetName]"
cityfall.77.desc:0 "La Porte de l’Orient est désormais sous contrôle [new_controller.GetAdjective], l’armée de [new_controller.GetLeader] ayant pris possession de la ville de [797.GetName].\n\nIl s’agit d’un coup colossal porté au gouvernement de [old_controller.GetLeader]. Néanmoins, le communiqué [old_controller.GetAdjective] ne parle que d’un « revers temporaire », ajoutant que la résistance contre l’envahisseur doit continuer. La chute de la ville pourrait avoir des répercussions plus larges, car elle permet à [new_controller.GetNameDef] de contrôler l’accès à la mer Noire. Pour l’heure, les soldats [new_controller.GetAdjective] peuvent fêter leur conquête en visitant la majestueuse Sainte-Sophie, en espérant que son architecture ait été épargnée par les combats."
cityfall.77.a:0 "Le combat n’est pas terminé !"
cityfall.77.b:0 "Une grande victoire !"
cityfall.77.c:0 "La guerre prend un tournant inattendu."

cityfall.78.t:0 "Les forces armées [new_controller.GetAdjective] entrent dans Tokyo"
cityfall.78.desc:0 "La « capitale de l’Est », cœur du Japon, est désormais sous contrôle [new_controller.GetAdjective]. D’importants efforts ont été nécessaires pour sécuriser la ville en raison de nombreux tireurs d’élite [old_controller.GetAdjective].\n\nLe gouvernement [new_controller.GetAdjective] a annoncé qu’il était du devoir de chaque citoyen de célébrer cette victoire sur leurs ennemis.\n\nPendant ce temps, le gouvernement [old_controller.GetAdjective] a juré de libérer la ville de l’oppression étrangère et d’anéantir les envahisseurs [new_controller.GetAdjective]."
cityfall.78.a:0 "Le combat n’est pas terminé !"
cityfall.78.b:0 "Une grande victoire !"
cityfall.78.c:0 "La guerre prend un tournant inattendu."

cityfall.79.t:0 "Moscou tombe aux mains des troupes [new_controller.GetAdjective]"
cityfall.79.desc:0 "L’armée [new_controller.GetAdjective] semble inarrêtable puisqu’à l’instar de Napoléon en son temps, elle est entrée dans la ville de Moscou. La résistance fut acharnée dans les faubourgs, et certains quartiers furent pris rue par rue. Cependant, un assaut déterminé des troupes [new_controller.GetAdjective] permit de s’emparer du Kremlin. Au passage, des tunnels secrets furent découverts, preuve que les [old_controller.GetAdjective] avaient envisagé une fuite depuis des semaines, voire des mois.\n\nSi ce trophée est important pour [new_controller.GetLeader], l’immensité de la Russie reste un défi, et certains se demandent si une retraite humiliante semblable à celle de 1812 est encore possible."
cityfall.79.a:0 "Le combat n’est pas terminé !"
cityfall.79.b:0 "Une grande victoire !"
cityfall.79.c:0 "La guerre prend un tournant inattendu."

cityfall.80.t:0 "Rome tombe aux mains des troupes [new_controller.GetAdjective]"
cityfall.80.desc:0 "L’armée [new_controller.GetAdjective] triomphe en entrant dans la ville éternelle. Les [old_controller.GetAdjective] avaient établi des lignes défensives connues sous les noms de code César C et Rome Switch à l’extérieur de la ville afin d’éviter d’endommager l’immense patrimoine culturel de la capitale. Ainsi, les troupes [new_controller.GetAdjective] en rapide progression les ont dépassées avant que les réserves [old_controller.GetAdjective] ne puissent renforcer leurs positions. Un petit groupe de défenseurs [old_controller.GetAdjective] combattit jusqu’au bout dans le Vittoriano et le ministère de l’Air. De plus, [new_controller.GetNameDef] reçut une lettre officielle de capitulation de la part du Vatican.\n\nAlors que les combats cessent enfin, le calme revient peu à peu sur la ville."
cityfall.80.a:0 "Le combat n’est pas terminé !"
cityfall.80.b:0 "Une grande victoire !"
cityfall.80.c:0 "La guerre prend un tournant inattendu."

cityfall.81.t:0 "Les unités [new_controller.GetAdjective] entrent dans Budapest"
cityfall.81.desc:0 "Le bleu du Danube change de couleur alors que des combats violents ravagent la ville jumelle de Budapest. Une fois de plus, Buda et Pest sont séparées, les ponts sur le Danube ayant été détruits par les défenseurs [old_controller.GetAdjective]. La victoire [new_controller.GetAdjective] est claire, mais les dégâts subis par la ville prendront du temps à être réparés."
cityfall.81.a:0 "Le combat n’est pas terminé !"
cityfall.81.b:0 "Une grande victoire !"
cityfall.81.c:0 "La guerre prend un tournant inattendu."

cityfall.82.t:0 "La chute de Pretoria"
cityfall.82.desc:0 "La dévastation de la guerre atteint la pointe de l’Afrique alors que les forces armées [new_controller.GetAdjective] ont sécurisé Pretoria. Le problème majeur des défenseurs [old_controller.GetAdjective] fut que le veld ne présentait aucun obstacle naturel permettant de créer un périmètre défensif. Ils furent donc submergés par l’avancée [new_controller.GetAdjective] et abandonnèrent la ville."
cityfall.82.a:0 "Le combat n’est pas terminé !"
cityfall.82.b:0 "Une grande victoire !"
cityfall.82.c:0 "La guerre prend un tournant inattendu."

cityfall.83.t:0 "La chute d’Athènes"
cityfall.83.desc:0 "La dévastation de la guerre a atteint Athènes, où les unités [new_controller.GetAdjective] ont sécurisé la ville et expulsé les défenseurs [old_controller.GetAdjective]. Les Longs Murs d’antan n’auraient de toute façon pas sauvé les troupes [old_controller.GetAdjective], car le marbre et la pierre ne protègent pas des bombes et obus modernes. Acculés par l’avancée ennemie et refusant de risquer la destruction du Parthénon une seconde fois, les derniers défenseurs se dispersèrent ou se rendirent."
cityfall.83.a:0 "Le combat n’est pas terminé !"
cityfall.83.b:0 "Une grande victoire !"
cityfall.83.c:0 "La guerre prend un tournant inattendu."

cityfall.84.t:0 "La chute de Paris"
cityfall.84.desc:0 "Autrefois considérée comme le centre culturel et artistique de l’Europe, la ville de Paris est désormais engloutie par la guerre. Les combats acharnés dans ses rues ont endommagé de nombreux monuments historiques, tels que le Palais-Royal ou la cathédrale Notre-Dame, en raison de l’usage massif de l’artillerie par les [new_controller.GetAdjective] dans leur effort désespéré pour sécuriser la ville.\n\nBien que la ville soit désormais aux mains de l’ennemi, avec des troupes [new_controller.GetAdjective] défilant sur les restes brûlés des Champs-Élysées, de nombreux défenseurs [old_controller.GetAdjective] ont trouvé refuge dans les catacombes, où ils préparent leurs maigres ressources pour poursuivre la guérilla."
cityfall.84.a:0 "Le combat n’est pas terminé !"
cityfall.84.b:0 "Une grande victoire !"
cityfall.84.c:0 "La guerre prend un tournant inattendu."

cityfall.85.t:0 "Les unités [new_controller.GetAdjective] entrent dans Bangkok"
cityfall.85.desc:0 "Les rumeurs persistantes qui circulaient déjà parmi la population [old_controller.GetAdjective] de Bangkok ont été confirmées : la capitale de [old_controller.GetNameDef] est tombée, l’annonce ayant été diffusée depuis la station de radio de la ville.\n\nDes témoins rapportent que les défenseurs du Grand Palais furent forcés de battre en retraite sous le feu écrasant des soldats [new_controller.GetAdjective], qui ont également pris le contrôle des bâtiments administratifs et des postes de police, brisant sévèrement la capacité de résistance des dernières troupes [old_controller.GetAdjective] encore présentes. Est-ce la fin de [old_controller.GetNameDef] ?"
cityfall.85.a:0 "Le combat n’est pas terminé !"
cityfall.85.b:0 "Une grande victoire !"
cityfall.85.c:0 "La guerre prend un tournant inattendu."

cityfall.86.t:0 "Les unités [new_controller.GetAdjective] entrent dans Stockholm"
cityfall.86.desc:0 "Les citoyens [old_controller.GetAdjective] sont en plein désarroi, Stockholm ayant été submergée par les soldats [new_controller.GetAdjective]. Malgré la résistance de plusieurs bataillons protégeant l’île de la vieille ville en faisant sauter de nombreux ponts et en érigeant des barricades, la prise de Slussen rendit la position des défenseurs de plus en plus intenable.\n\nLa bataille de Stockholm est désormais terminée, et [new_controller.GetLeader] célèbre sans aucun doute le succès de l’opération."
cityfall.86.a:0 "Le combat n’est pas terminé !"
cityfall.86.b:0 "Une grande victoire !"
cityfall.86.c:0 "La guerre prend un tournant inattendu."

cityfall.87.t:0 "Les unités [new_controller.GetAdjective] entrent dans Oslo"
cityfall.87.desc:0 "L’armée [old_controller.GetAdjective] se replie, laissant les habitants d’Oslo sans défense tandis que les soldats [new_controller.GetAdjective] sécurisent la ville. Alors que les armes se taisent, un voile étrange mêlant silence et crainte recouvre la cité. Bien que le gouvernement [old_controller.GetAdjective] promette de combattre l’envahisseur jusqu’au bout, la perte de la capitale est un coup énorme porté à [old_controller.GetNameDef].\n\nLe combat continue, mais une question s’insinue peu à peu dans les esprits : « Pour combien de temps encore ? »"
cityfall.87.a:0 "Le combat n’est pas terminé !"
cityfall.87.b:0 "Une grande victoire !"
cityfall.87.c:0 "La guerre prend un tournant inattendu."

cityfall.88.t:0 "Les unités [new_controller.GetAdjective] entrent dans Bogota"
cityfall.88.desc:0 "L’armée [old_controller.GetAdjective] semblait à bout de forces lorsqu’elle se retira de Bogota, laissant le contrôle de la ville aux troupes [new_controller.GetAdjective] en progression. Cette défaite a discrédité la direction de [old_controller.GetLeader], mais le gouvernement [old_controller.GetAdjective] promet néanmoins de poursuivre la résistance jusqu’au bout. Malgré cette déclaration, il est clair que [old_controller.GetNameDef] est dans une situation critique."
cityfall.88.a:0 "Le combat n’est pas terminé !"
cityfall.88.b:0 "Une grande victoire !"
cityfall.88.c:0 "La guerre prend un tournant inattendu."

cityfall.89.t:0 "Dublin tombe aux mains des troupes [new_controller.GetAdjective]"
cityfall.89.desc:0 "L’armée [old_controller.GetAdjective] semblait à bout de forces lorsqu’elle se retira de Dublin, laissant le contrôle de la ville aux troupes [new_controller.GetAdjective] en progression. Cette défaite a discrédité la direction de [old_controller.GetLeader]. Cependant, le gouvernement [old_controller.GetAdjective] promet néanmoins de poursuivre la résistance jusqu’au bout, affirmant qu’il n’abandonnera pas l’indépendance conquise après des siècles d’occupation étrangère. Malgré cette déclaration, il est clair que [old_controller.GetNameDef] est dans une situation critique."
cityfall.89.a:0 "Le combat n’est pas terminé !"
cityfall.89.b:0 "Une grande victoire !"
cityfall.89.c:0 "La guerre prend un tournant inattendu."
cityfall.90.t:0 "La chute de Caracas"
cityfall.90.desc:0 "Caracas, connue ces dernières années comme la capitale des exportations de pétrole, est tombée aux mains des troupes [new_controller.GetAdjective]. La bataille a fait rage, avec de violents combats de maison à maison, mais après de lourds affrontements, [old_controller.GetLeader] a été contraint d’ordonner la retraite.\n\nCette défaite place sans aucun doute [old_controller.GetNameDef] dans une situation désespérée. Mais [old_controller.GetLeader] a clairement déclaré son intention de résister jusqu’au bout, quel qu’en soit le prix."
 
cityfall.91.t:0 "La chute de Bakou"
cityfall.91.desc:0 "La ville de Bakou, l’un des plus grands centres mondiaux de production pétrolière, est tombée aux mains des troupes [new_controller.GetAdjective]. Désireux de protéger désespérément cette ressource cruciale, les soldats [old_controller.GetAdjective] ont combattu jusqu’au dernier homme.\n\nPrivé de cet approvisionnement en or noir, [old_controller.GetNameDef] aura désormais beaucoup plus de mal à mener la guerre."

cityfall.92.t:0 "La chute de [217.GetName]"
cityfall.92.desc:0 "Avec la prise de [217.GetName], un important centre industriel est tombé aux mains des forces [new_controller.GetAdjective] en progression. Les combats furent intenses, en particulier pour le contrôle de la gare et de l’usine de tracteurs, mais la ville a finalement été sécurisée.\n\nLa perte de ce nœud ferroviaire vital et du libre accès à la Volga pour [old_controller.GetNameDef] pourrait signifier leur chute imminente."

cityfall.93.t:0 "La chute de [195.GetName]"
cityfall.93.desc:0 "La Neva a été teintée de sang par les violents combats qui ont ravagé [195.GetName]. Les unités victorieuses [new_controller.GetAdjective] doivent désormais dégager les barricades érigées par les défenseurs [old_controller.GetAdjective] désespérés. Beaucoup de soldats [old_controller.GetAdjective] se sont repliés, mais certains ont continué à combattre depuis l’état-major, l’amirauté et la forteresse Pierre-et-Paul. Malgré la solidité mutuelle de ces positions, elles n’étaient pas conçues pour résister aux armes modernes.\n\nUn nouveau jour se lève et un nouveau drapeau flotte sur la ville — un drapeau usé par les combats montrant la domination [new_controller.GetAdjective]."

cityfall.94.t:0 "La chute de Los Angeles"
cityfall.94.desc:0 "Les portes du paradis se sont refermées pour de nombreux habitants de Los Angeles, alors que l’État doré est plus rouge que jamais. Le siège brutal imposé par les forces armées [new_controller.GetAdjective] a causé d’énormes destructions dans toute la baie, et plusieurs quartiers de la ville et de sa banlieue ont été ravagés par les flammes. Si les troupes [old_controller.GetAdjective] ont lourdement souffert, les nouveaux maîtres de la ville héritent d’un champ de ruines embrasé ; il leur appartiendra de voir s’ils peuvent conserver et réparer la zone."

cityfall.95.t:0 "La chute de Téhéran"
cityfall.95.desc:0 "De violents combats urbains ont ravagé la plus grande ville du Moyen-Orient, Téhéran. Des colonnes de fumée s’élèvent au-dessus des ruines du complexe de Saadabad, détruit par un barrage d’artillerie après que les derniers défenseurs [old_controller.GetAdjective] eurent refusé de se rendre aux forces de [new_controller.GetNameDef].\n\nAlors que des coups de feu retentissent encore dans et autour du bazar de Téhéran, les officiels [new_controller.GetAdjective] revendiquent déjà leur victoire. Le drapeau [new_controller.GetAdjective] flotte désormais sur le palais du Golestan, annonçant le nouvel ordre qui s’installe dans la région."

cityfall.96.t:0 "La chute de Sébastopol"
cityfall.96.desc:0 "Les violents combats urbains ont dévasté la plus grande ville de Crimée, la base navale de Sébastopol. La fumée s’élève tout autour de la baie. De lourds tirs d’artillerie ont détruit les fortifications. Ce bombardement, qui provoqua l’explosion d’un dépôt de munitions, força les plus acharnés défenseurs [old_controller.GetAdjective] à déposer les armes et à se rendre aux forces victorieuses de [new_controller.GetNameDef].\n\nAlors que quelques coups de feu se font encore entendre, les officiels [new_controller.GetAdjective] ont déjà annoncé la prise de la ville. Le drapeau [new_controller.GetAdjective] flotte désormais sur les vestiges des fortifications, indiquant aux habitants qui détient le pouvoir."

cityfall.97.t:0 "La chute de Gibraltar"
cityfall.97.desc:0 "La situation en Méditerranée est sur le point de changer radicalement, le rocher de Gibraltar étant désormais sous contrôle des forces armées [new_controller.GetAdjective]. Maîtres des lieux, ils ont immédiatement installé de l’artillerie pour viser les navires hostiles traversant le détroit, bloquant l’accès à toute flotte indésirable, sauf peut-être aux sous-marins. La marine [old_controller.GetAdjective] perd ainsi une position vitale à l’entrée de la mer Méditerranée."

cityfall.98.t:0 "La chute de Sydney"
cityfall.98.desc:0 "Avec la prise de [285.GetName], les [new_controller.GetAdjective] sont désormais solidement implantés sur le sol australien. La baie est recouverte d’une épaisse fumée noire provenant des stocks de carburant en flammes, se répandant lentement sur la ville. Le reste de l’Australie suivra-t-il bientôt, ou l’armée [old_controller.GetAdjective] réussira-t-elle à contre-attaquer et à repousser l’envahisseur à la mer ?"

cityfall.99.t:0 "Madrid est tombée !"
cityfall.99.desc:0 "Déjà meurtrie par la guerre civile, [41.GetName] est à nouveau sous contrôle militaire, les forces [new_controller.GetAdjective] ayant pris la ville. Les troupes [old_controller.GetAdjective] ont été vaincues et évacuent la zone, abandonnant les positions préparées dans le Parque Oeste.\n\nLes quartiers dévastés peinent à être sauvés par les derniers pompiers encore en action."

cityfall.101.t:0 "Les unités [new_controller.GetAdjective] s’emparent de Vienne !"
cityfall.101.desc:0 "Les autorités [new_controller.GetAdjective] ont annoncé avec fierté au monde que leurs forces armées avaient pris le contrôle de Vienne. La nouvelle administration a établi ses quartiers dans l’aile intacte du palais de Schönbrunn, surplombant ce qu’il reste des jardins, abattus par la population locale au cours des derniers mois de lutte.\n\nLes défenseurs restants de [old_controller.GetNameDef] se sont retranchés dans les caves de l’hôtel de ville, tandis que de violents combats de rue se poursuivent dans les districts de Leopoldstadt et de Simmering. Dans un discours radiodiffusé, [old_controller.GetLeader] a insisté sur le fait que la bataille pour la ville n’était pas encore terminée et que son issue restait incertaine."

cityfall.102.t:0 "La chute de Pékin"
cityfall.102.d:0 "Après un raid raté contre le QG de la ligne de front japonaise, les Chinois ont subi d’énormes pertes. Afin d’éviter d’autres pertes, le commandant chinois a ordonné la retraite de ses troupes hors de Pékin. L’armée japonaise est ensuite entrée dans la ville avec une résistance minimale.\n\nLe Palais impérial aurait perdu quelques artefacts emportés par les Japonais. Heureusement, la plupart avaient été évacués vers le sud en 1933, et seuls quelques grands chaudrons de bronze et pièces d’artillerie ont pu être emportés."

cityfall.103.t:0 "Les unités [new_controller.GetAdjective] entrent dans Oulan-Bator"
cityfall.103.desc:0 "Selon un communiqué des forces armées [new_controller.GetAdjective], les soldats ont sécurisé la principale ville de Mongolie, Oulan-Bator. Subissant une défaite, le gouvernement [old_controller.GetAdjective] avait évacué sa population civile de manière préventive et, malgré ce revers, [old_controller.GetLeader] espère toujours reprendre la ville."

cityfall.105.t:0 "Les unités [new_controller.GetAdjective] s’emparent de Jérusalem"
cityfall.105.desc:0 "Selon les rapports des généraux [new_controller.GetAdjective], les soldats de l’armée [new_controller.GetAdjective] ont pris le contrôle de la majeure partie de Jérusalem, y compris la vieille ville historique.\n\nLes combats près des lieux saints ont été limités par les deux camps, mais alors que les troupes [new_controller.GetAdjective] franchissaient la porte de Damas, les généraux [old_controller.GetAdjective] ordonnaient la retraite complète. \n\n[old_controller.GetLeader] a déclaré à la radio nationale que le combat n’était pas terminé et que la ville sainte stratégique reviendrait un jour entre leurs mains."


#cityfall.12.t:0 "La chute de Stockholm"
#cityfall.12.d:0 "."
#cityfall.12.a:0 "."
#cityfall.12.b:0 "Nous ne faisons que corriger les erreurs du passé."
#cityfall.12.c:0 "La bataille de Londres est peut-être terminée, mais ils ne gagneront jamais."
