yugoslav_research_name:0 "Recherche [YUG.GetAdjective]"
yugoslav_research_desc:0 "Il est logique que le gouvernement autonome de [CRO.GetNameDef] collabore sur les questions scientifiques avec le gouvernement central [YUG.GetAdjective]."

axis_minors_croatia_home_guard_tooltip:0 "Crée la Garde nationale croate, composée de 3 divisions d’infanterie."
axis_minors_croatia_ustashe_militia_tooltip:0 "Crée deux unités de milice oustachie. Ces unités d’infanterie légère sont impitoyables face aux partisans."
