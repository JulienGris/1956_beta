 CRO_tomislav_II:0 "Tomislav II"
 CRO_tomislav_II_desc:0 "The Prince Aimone of Savoy, cousin of the king of Italy Victor-Emmanuel III, has accepted the crown of Croatia. To mark this event as a refoundation of the Croatian monarchy, he chose to be named Tomislav II, the successor of Tomislav, the founder of Croatia."

 CRO_idea_communist_militias:0 "Communist Militias"
 CRO_idea_economic_centralization:0 "Economic Centralization"
 CRO_idea_license_production:0 "License Production"
 CRO_idea_trained_mechanics:0 "Trained Mechanics"

 cro_diplomacy_focus:0 "[CRO.GetAdjective] Diplomacy"
 #croatia semi generic
 CRO_home_guard:0 "Hrvatsko Domobranstvo"
 CRO_home_guard_desc:0 "To ensure the nation's security, we must establish a standing army to protect our territory: the Croatian Home Guard."
 CRO_small_arms:0 "Improve Small Arms Practability"
 CRO_small_arms_desc:0 "The limits for what equipment infantry can carry are constantly being pushed. We will focus on giving our troops the best tools available."
 CRO_improve_conscripts_equipment:0 "Improve Conscripts' Equipment"
 CRO_improve_conscripts_equipment_desc:0 "While conscripts can't be equipped with the best weapons available, we must ensure that they are supplied with enough equipment to fight to the best of their abilities."
 CRO_motorization_effort:0 "Motorized Corps"
 CRO_motorization_effort_desc:0 "Mobility and protection are crucial to safely getting infantry into and out of the field. Focusing on these developments will allow us to take action quickly."
 CRO_structured_logistics:0 "Structured Logistics"
 CRO_structured_logistics_desc:0 "Due to our limited production capabilities, we can't afford to lose any valuable equipment; this is why a structured and transparent logistical system is vital to maintain our ability to wage war."
 CRO_recovery_teams:0 "Recovery Teams"
 CRO_recovery_teams_desc:0 "To further reduce the loss of equipment, we must organize teams to recover weapons and vehicles on the battlefields."
 CRO_army_maneuvers:0 "Army Maneuvers"
 CRO_army_maneuvers_desc:1 "To whip our army into shape, new maneuvers must be held. The experience will also undoubtedly lead to new insights into modern warfare."
 CRO_supremacy_of_offense:0 "Supremacy of Offense"
 CRO_supremacy_of_offense_desc:1 "Offensive action is the key to victory and must dictate our overall strategy and the development of new doctrines."
 CRO_supremacy_of_defense:0 "Supremacy of Defense"
 CRO_supremacy_of_defense_desc:1 "Hemmed in by enemies on all sides, we must hold out long enough for our allies to take the heat off us. The development of new military doctrines must focus on the defense of our homeland."
 CRO_artillery_regiments:0 "Artillery Regiments"
 CRO_artillery_regiments_desc:1 "By introducing powerful artillery regiments to our divisions, their overall fighting strength will significantly increase."
 CRO_domestic_artillery_production:0 "Domestic Artillery Production"
 CRO_domestic_artillery_production_desc:1 "By stimulating the development of modern, domestic artillery models, we can ensure that our forces have the best fire support we can provide."
 CRO_anti_tank_defenses:0 "Anti-tank Defenses"
 CRO_anti_tank_defenses_desc:1 "As the tank has taken the center field in modern warfare, new developments are required in anti-tank field guns, allowing our infantry to take out these armored behemoths."
 CRO_mountain_brigades:0 "Mountain Brigades"
 CRO_mountain_brigades_desc:1 "Large parts of our nation consist of mountains, requiring the formation of special brigades specialized in combat in this type of terrain."
 CRO_armored_cavalry:0 "Armored Cavalry"
 CRO_armored_cavalry_desc:0 "Mechanization of cavalry and a transition into half-tracks would enable high mobility and add extra protection to the members of the units. While this transition would undoubtedly be heavy in production cost, we must do everything to ensure a quick victory in the field."
 CRO_tank_conversions:0 "Tank Conversions"
 CRO_tank_conversions_desc:1 "While we may require tanks now, we may need self-propelled artillery or tank destroyers based on the same chassis next month. Our armored equipment must remain flexible and adaptable to our current needs."
 CRO_modern_tanks:0 "Modern Tanks"
 CRO_modern_tanks_desc:1 "By adding large-caliber main weaponry, armored technology has developed well beyond the simple intention of safely transporting forces from point A to point B. We must build our version of modern tanks to compete with our neighbors."


 CRO_equipment_effort_2:0 "Equipment Effort II"
 CRO_equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 CRO_mechanization_effort:0 "Mechanization Effort"
 CRO_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles we can construct today."
 CRO_doctrine_effort_2:0 "Doctrine Effort II"
 CRO_doctrine_effort_2_desc:0 "The battlefield has changed in the interbellum years and over recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 CRO_equipment_effort_3:0 "Equipment Effort III"
 CRO_equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should become a world leader in infantry weapons."
 CRO_armor_effort:0 "Armor Effort"
 CRO_armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can also improve our armored vehicles."
 CRO_special_forces:0 "Special Forces"
 CRO_special_forces_desc:0 "We need elite forces; mountain troops and paratroopers should be our priority."
 CRO_aviation_effort:0 "Found the Croatian Air School"
 CRO_aviation_effort_tt:0 "Not enough building slots for §YAir Base§!"
 CRO_aviation_effort_desc:0 "Nowhere are technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
 CRO_fighter_focus:0 "Fighter Focus"
 CRO_fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
 CRO_bomber_focus:0 "Bomber Focus"
 CRO_bomber_focus_desc:0 "When people of the future speak of the horror of today's wars, fire raining from the skies will prominently feature. We will do our best to ensure our enemies tell those stories."
 CRO_airplanes_licenses:0 "Airplane Licenses"
 CRO_airplanes_licenses_desc:0 "As our design capabilities are limited, we should obtain airplane licenses and equip our airforce with modern fighters."
 CRO_form_mechanics:0 "Form Mechanics"
 CRO_form_mechanics_desc:0 "At the end of the day, what's the difference between a plane downed by enemy bullets, by a sudden fire of the engine, or an aircraft incapable of flying due to mechanical failures if we can't repair them?  To reduce the risks of mechanical failures, the only solution is to have dedicated and well-trained mechanics who know the interior of those planes more than a surgeon knows anatomy."
 CRO_aviation_effort_2:0 "Advanced Air Doctrine"
 CRO_aviation_effort_2_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other military branches."
l_french:

 CRO_CAS_effort:0 "Effort d’Appui aérien rapproché"
 CRO_CAS_effort_desc:0 "Une armée moderne a besoin du soutien de véhicules au sol et dans les airs."
 CRO_rocket_effort:0 "Effort dans les fusées"
 CRO_rocket_effort_desc:0 "Les moteurs-fusées et les turboréacteurs permettent des vitesses inédites pour les engins habités comme non habités. Être pionniers dans ces technologies nous permettra de surprendre l’ennemi."
 CRO_NAV_effort:0 "Effort naval aérien"
 CRO_NAV_effort_desc:0 "De même que la nouvelle guerre navale se joue sous la surface, une partie se déroule dans les airs au-dessus des flots."

 ######################MARINE###################
 CRO_expand_the_split_shipyards:0 "Agrandir les chantiers navals de Split"
 CRO_expand_the_split_shipyards_desc:0 "Notre industrie navale préexistante en Dalmatie est un candidat idéal à l’expansion et dispose d’installations permettant de construire des navires de guerre plus grands."
 CRO_coastal_defense:0 "Défense dalmate"
 CRO_coastal_defense_desc:0 "Nous ne pouvons espérer rivaliser avec les flottes de nos adversaires dans l’Adriatique. Nous devons plutôt préparer nos côtes à repousser toute invasion navale."
 CRO_contest_the_adriatic:0 "Contester l’Adriatique"
 CRO_contest_the_adriatic_desc:0 "La défense de nos côtes commence en mer, au-delà de celles-ci. Nous devons développer de nouvelles tactiques et stratégies navales pour prendre ou contester le contrôle de la mer Adriatique."
 CRO_light_cruiser:0 "Concevoir des croiseurs légers"
 CRO_light_cruiser_desc:0 "Nous devons disposer d’un croiseur moderne pour servir d’épine dorsale à notre flotte adriatique."
 CRO_naval_bombers:0 "Bombardiers navals"
 CRO_naval_bombers_desc:0 "L’Adriatique est longue mais étroite, ce qui la rend facilement accessible depuis nos aérodromes. Développer des modèles spécialisés de bombardiers navals pourrait considérablement améliorer les chances de notre marine contre des adversaires plus puissants."
 CRO_heavy_cruiser_project:0 "Projet de croiseur lourd"
 CRO_heavy_cruiser_project_desc:0 "Pour défier correctement les marines hostiles, nous avons besoin d’un tonnage plus important et d’un armement plus lourd. Les croiseurs lourds seraient une bonne évolution par rapport aux croiseurs légers qui constituent actuellement l’essentiel de notre flotte."
 CRO_modern_destroyers:0 "Destroyers modernes"
 CRO_modern_destroyers_desc:0 "Les destroyers sont l’épine dorsale de toute marine, et nous devons veiller à ce que les nôtres ne soient pas inférieurs à ceux de nos adversaires."

 CRO_skilled_pilots:0 "Pilotes expérimentés"
 CRO_skilled_pilots_desc:0 "La multitude d’îles le long de la côte dalmate impose une coordination et une communication claires pour éviter les accidents et tirer le meilleur parti du terrain."
 CRO_adriatic_specialization:0 "Spécialisation adriatique"
 CRO_adriatic_specialization_desc:0 "Les nombreuses îles de la côte dalmate constituent un atout particulier que nous pourrions exploiter pour surprendre nos ennemis."

 CRO_build_the_nation:0 "Construire la nation"
 CRO_build_the_nation_desc:0 "Concentrer tous nos efforts politiques sur le développement de l’industrie civile dans un grand bond en avant."
 CRO_research_collaboration:0 "Collaboration de recherche [YUG.GetAdjective]"
 CRO_research_collaboration_desc:0 "En tant que région autonome, il est logique de partager toute découverte pertinente avec le gouvernement central [YUG.GetAdjective]."
 CRO_prospect_for_resources:0 "Prospecter les ressources"
 CRO_prospect_for_resources_desc:0 "Notre sol recèle des ressources qui seront utiles dans les combats à venir. Nous devons les exploiter au plus vite et en tirer le meilleur usage."
 CRO_construction_effort_tt:0 "Pas assez d’emplacements disponibles pour des §Yusines civiles§!"
 CRO_construction_effort:0 "Effort de construction"
 CRO_construction_effort_desc:0 "Effort de construction"
 CRO_production_effort:0 "Effort de production"
 CRO_production_effort_tt:0 "Pas assez d’emplacements disponibles pour une §Yusine militaire§!"
 CRO_production_effort_desc:0 "Si l’on peut fabriquer des tracteurs, on peut fabriquer des chars ! Nous ne devons pas laisser nos capacités de production militaire prendre du retard."
 CRO_construction_effort_2:0 "Effort de construction II"
 CRO_construction_effort_2_desc:0 "Poursuivre l’expansion de nos usines nous permettra d’accélérer la production de biens pour le commerce et la construction."
 CRO_industrial_planning:0 "Planification industrielle"
 CRO_industrial_planning_desc:0 "Pour poursuivre nos développements industriels, nous devons établir des stratégies à long terme et identifier les terrains adaptés."
 CRO_expand_the_sarajevo_arsenals:0 "Agrandir les arsenaux de Sarajevo"
 CRO_expand_the_sarajevo_arsenals_desc:0 "Nous avons besoin de plus de capacités de production pour répondre aux besoins croissants de notre armée. Les arsenaux de Sarajevo sont un candidat idéal pour une expansion, et nous leur allouerons des ressources immédiatement."
 CRO_production_effort_2:0 "Soutenir l’industrie des véhicules lourds"
 CRO_production_effort_2_desc:0 "En tant que l’un des principaux ports européens, Anvers est idéale pour développer une industrie orientée vers l’exportation."
 CRO_production_effort_3:0 "Soutenir les fabricants d’avions militaires"
 CRO_production_effort_3_desc:0 "Des efforts constants pour agrandir nos usines militaires sont nécessaires afin de répondre à la demande en nouveaux équipements."
 CRO_infrastructure_effort:0 "Effort d’infrastructure"
 CRO_infrastructure_effort_desc:0 "Un pays sans infrastructures adéquates ne peut entreprendre de projets ou de constructions avancés."
 CRO_infrastructure_effort_tt:0 "Pas assez d’emplacements disponibles pour §YInfrastructure§!"
 CRO_extract_chromium:0 "Extraire le chrome"
 CRO_extract_chromium_desc:0 "Le chrome est notre principale ressource et nous devons maximiser son extraction."
 CRO_extract_oil:0 "Extraire le pétrole"
 CRO_extract_oil_desc:0 "Nous avons confirmé la présence de pétrole dans la région après avoir découvert d’autres petits gisements dans la plaine pannonienne. Il faut exploiter ces ressources au plus vite pour réduire notre dépendance aux importations coûteuses."
 CRO_expand_the_university_of_zagreb:0 "Agrandir l’Université de Zagreb"
 CRO_expand_the_university_of_zagreb_desc:0 "L’Université de Zagreb est déjà la plus grande du pays. En lui allouant davantage de ressources, notamment dans les domaines pouvant déboucher sur des innovations militaires, nous pourrions obtenir un avantage décisif sur le champ de bataille."
 CRO_develop_bosnia:0 "Développer la Bosnie"
 CRO_develop_bosnia_desc:0 "Les Bosniaques n’existent pas ; ce sont simplement des [CRO.GetAdjective]s musulmans. La Bosnie est donc habitée par des [CRO.GetAdjective]s et mérite autant d’attention que les autres régions [CRO.GetAdjective]s."
 CRO_construction_effort_3:0 "Effort industriel III"
 CRO_construction_effort_3_desc:0 "L’expansion de notre réseau d’infrastructures a considérablement amélioré nos capacités de construction."
 CRO_nuclear_effort:0 "La puissance de Tomislav"
 CRO_nuclear_effort_desc:0 "Les physiciens sont-ils allés trop loin ?"
 CRO_extra_tech_slot:0 "Emplacement de recherche supplémentaire"
 CRO_extra_tech_slot_desc:0 "Notre expansion industrielle et d’autres progrès récents pourraient nous permettre de mener plus de recherches et développements en parallèle."
 CRO_extra_tech_slot_2:0 "Emplacement de recherche supplémentaire II"
 CRO_extra_tech_slot_2_desc:0 "La rapide industrialisation de notre nation a ouvert de nouvelles opportunités de recherche et développement que nous devons saisir."
 CRO_technology_sharing:0 "Partage technologique"
 CRO_technology_sharing_desc:0 "En partageant nos avancées technologiques avec nos alliés, l’ensemble de notre faction mènera ses recherches de guerre plus efficacement."
 CRO_secret_weapons:0 "Armes secrètes"
 CRO_secret_weapons_desc:0 "Il est tentant de consacrer toutes nos ressources supplémentaires au développement de chars et d’avions, mais le secret de la victoire réside dans des domaines entièrement nouveaux : électronique, fusées et recherche nucléaire."
 CRO_political_effort:0 "Organiser le nouvel État"
 CRO_political_effort_desc:0 "Notre premier objectif est d’établir les bases de la représentation gouvernementale à travers tout le pays."
 CRO_collectivist_ethos:0 "Renforcer les syndicats"
 CRO_collectivist_ethos_desc:0 "Nos ennemis peuvent diviser et conquérir des nations plus faibles, mais notre peuple restera uni : un pour tous et tous pour un."
 CRO_liberty_ethos:0 "Consensus démocratique"
 CRO_liberty_ethos_desc:0 "Nous protégerons les libertés individuelles et la liberté en cette époque d’idéologues fanatiques cherchant à étouffer l’esprit humain."
 CRO_militarism:0 "Établir la milice Oustachie"
 CRO_militarism_desc:0 "Pour combattre l’ennemi de l’État, nous devons recruter parmi nos volontaires militants afin de lutter contre nos ennemis idéologiques mortels, en particulier les communistes."
 CRO_political_correctness:0 "Rectitude politique"
 CRO_political_correctness_desc:0 "Certains, aux opinions légèrement controversées ou embarrassantes, craignent une vaste conspiration contre eux. Cela nous semble être une excellente idée."
 CRO_neutrality_focus:0 "Priorité à la neutralité"
 CRO_neutrality_focus_desc:0 "Certains prétendent qu’il faut bravoure et sagesse pour prendre parti dans un conflit mondial, mais nous savons qu’il en faut encore plus pour refuser."
 CRO_interventionism_focus:0 "Priorité à l’interventionnisme"
 CRO_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples, pas seulement celle de nos citoyens. Si prévenir la tyrannie signifie faire la guerre, qu’il en soit ainsi."
 CRO_military_youth:0 "Ustaška Mladež"
 CRO_military_youth_desc:0 "Des organisations promouvant discipline et éducation politique chez les jeunes de notre nation encourageront loyauté et esprit de sacrifice dès le plus jeune âge."
 CRO_deterrence:0 "Dissuasion"
 CRO_deterrence_desc:0 "Isolés, nous bénéficions rarement de la guerre. Heureusement, nous savons que la meilleure défense est celle que l’on connaît tellement bien qu’on n’a jamais besoin de l’utiliser."
 CRO_volunteer_corps:0 "Corps de volontaires"
 CRO_volunteer_corps_desc:0 "Forcer nos citoyens à mourir pour des idéaux de liberté serait ironique, mais mettre en place des moyens pour ceux qui souhaitent aider à l’étranger ne l’est pas."
 CRO_paramilitarism:0 "Paramilitarisme"
 CRO_paramilitarism_desc:0 "Les principes militaires ont des applications en dehors de l’armée. Plus de gens recevront une formation militaire si nous développons des unités semi-militarisées pour compléter nos forces armées."
 CRO_indoctrination_focus:0 "Endoctrinement"
 CRO_indoctrination_focus_desc:0 "Puisque notre idéologie est basée sur la vérité, elle peut être enseignée comme telle. L’éducation et les médias doivent refléter cette leçon."
 CRO_foreign_expeditions:0 "Expéditions étrangères"
 CRO_foreign_expeditions_desc:0 "Nos ennemis étant prêts à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à en faire autant pour les nôtres."
 CRO_why_we_fight:0 "Pourquoi nous combattons"
CRO_why_we_fight_effect:0 "Si nous n’avons pas l’esprit §YPolitique étrangère neutre§!, nous pouvons créer des factions.\n"
CRO_why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple doit voir les atrocités commises par ceux qui convoitent le pouvoir. Nous rallierons la population à notre cause et veillerons à ce que chacun soit prêt à se battre pour notre liberté."
CRO_political_commissars:0 "Commissaires politiques"
CRO_political_commissars_desc:0 "Pour garantir que nos politiques soient appliquées dans la pratique militaire, nous nommerons des responsables politiques au sein des rangs de l’armée."
CRO_organized_partizans:0 "Partisans organisés"
CRO_organized_partizans_desc:0 "Pour faire face à la menace d’une invasion, nous devons organiser à l’avance des cellules de résistance. Ces groupes prépareront des caches, repéreront des zones de parachutage et recruteront des locaux pour recueillir des renseignements. Tous ces efforts mettront une pression maximale à l’arrière des lignes ennemies."
CRO_internationalism_focus:0 "Priorité à l’internationalisme"
CRO_internationalism_focus_desc:0 "L’idéologie ne connaît pas de frontières. Une autre nation peut se dire souveraine, mais nos convictions sont supérieures à de telles affirmations."
CRO_nationalism_focus:0 "Renaissance nationale"
CRO_nationalism_focus_desc:0 "Pendant des siècles, des princes étrangers nous ont gouvernés comme faisant partie de leur domaine. Cette ère est révolue : la Croatie retrouvera l’esprit véritable de Tomislav Iᵉʳ et dominera les Balkans."
CRO_ideological_fanaticism_communism:0 "Fanatisme idéologique"
CRO_ideological_fanaticism_communism_desc:0 "Nos valeurs et objectifs politiques établis valent autant qu’une foi ancestrale : il faut être prêt à mourir pour eux. Ceux qui s’en écartent doivent être prêts à affronter la mort."
CRO_ideological_fanaticism_ustasha:0 "Fanatisme idéologique"
CRO_ideological_fanaticism_ustasha_desc:0 "Nos valeurs et objectifs politiques établis valent autant qu’une foi ancestrale : il faut être prêt à mourir pour eux. Ceux qui s’en écartent doivent être prêts à affronter la mort."
CRO_anti_partizan_tactics:0 "Tactiques anti-partisans"
CRO_anti_partizan_tactics_desc:0 "Les partisans doivent être combattus et expulsés de leurs montagnes. Pour porter la lutte au cœur de leur territoire, des patrouilles régulières doivent sécuriser les villages et nous devons collecter des renseignements auprès des habitants fidèles. C’est notre seule option pour vaincre les communistes et gagner cette guerre une bonne fois pour toutes."
CRO_faithful_ally:0 "Un allié fidèle"
CRO_faithful_ally_desc:0 "Par notre engagement à défendre notre sol et le sang versé pour la victoire commune de l’Europe contre le judéo-bolchevisme, nous avons mérité d’être reconnus comme un véritable membre des puissances de l’Axe. Cela a été facilité par le brillant travail de nos phrénologues, qui ont prouvé que, contrairement à ces sales Serbes, nous descendons directement des Aryens qui ont migré vers le sud."
CRO_catholic_dominance_focus:0 "Suprématie catholique"
CRO_catholic_dominance_focus_desc:0 "Pendant des siècles, les Croates ont été guidés par les enseignements de l’Église catholique romaine. Depuis notre union forcée avec la Serbie, beaucoup se sont convertis à l’orthodoxie pour des avantages personnels. Cela doit cesser : tout chrétien [CRO.GetAdjective] doit accepter l’autorité de Sa Sainteté le Pape."
CRO_secularism_focus:0 "Laïcité"
CRO_secularism_focus_desc:0 "La foi ne doit en aucun cas interférer avec les affaires de l’État. Elle doit rester une question purement privée, et les religieux doivent être exclus de la scène politique."
CRO_integrate_muslim_croats_focus:0 "Intégrer les [CRO.GetAdjective] musulmans"
CRO_integrate_muslim_croats_focus_desc:0 "Les musulmans peuvent avoir une autre religion, mais ils font toujours partie de la nation et doivent être pleinement acceptés comme [CRO.GetAdjective]."
CRO_bosnian_muslim_conscription_focus:0 "Incorporer les musulmans de Bosnie"
CRO_bosnian_muslim_conscription_focus_desc:0 "Les musulmans vivant en Bosnie étant des [CRO.GetAdjective], ils doivent servir dans l’armée aux côtés de leurs frères ethniques."
CRO_integrate_orthodox_croats_focus:0 "Intégrer les [CRO.GetAdjective] orthodoxes"
CRO_integrate_orthodox_croats_focus_desc:0 "Bien que nous ayons maltraité les [CRO.GetAdjective] orthodoxes, nous devons reconnaître que, même si les bons [CRO.GetAdjective] sont membres de l’Église catholique romaine, ceux qui ont adopté la religion des Serbes restent malgré tout des [CRO.GetAdjective] et doivent être intégrés dans la communauté nationale."
CRO_deny_citizenship_to_muslims_focus:0 "Refuser les droits aux musulmans"
CRO_deny_citizenship_to_muslims_focus_desc:0 "Le catholicisme est l’élément central de l’identité [CRO.GetAdjective], et les musulmans qui prétendent être [CRO.GetAdjective] ne méritent pas de rester parmi nous."
CRO_integrate_religious_minorities_focus:0 "Intégrer les minorités religieuses"
CRO_integrate_religious_minorities_focus_desc:0 "Notre pays abrite des minorités religieuses, et nous devons respecter leur particularisme."
CRO_a_king_for_our_people_focus:0 "Un roi pour notre peuple"
CRO_a_king_for_our_people_focus_desc:0 "Pour restaurer la grandeur du libre royaume croate d’antan, nous devons choisir un roi qui guidera le peuple [CRO.GetAdjective] régénéré."
CRO_enforce_pavelic_rule:0 "Imposer la domination de Pavelić"
CRO_enforce_pavelic_rule_desc:0 "À présent que les Oustachis ont enfin pris le pouvoir, nous pouvons nous assurer que notre cher leader, le Poglavnik Ante Pavelić, soit reconnu par tous les fidèles [CRO.GetAdjective] comme le dirigeant légitime de notre pays."
CRO_italian_influence_focus:0 "Influence [ITA.GetAdjective]"
CRO_italian_influence_desc:0 "Maintenant qu’un [ITA.GetAdjective] est sur le trône de [CRO.GetNameDef], notre pays entretient des liens plus étroits que jamais avec [ITA.GetNameDef]."
CRO_italo_croat_legion:0 "Légion italo-[CRO.GetAdjective]"
CRO_italo_croat_legion_desc:0 "Nous devons aider nos alliés par tous les moyens. Les [ITA.GetAdjective] ont promis d’équiper une division motorisée si nous parvenons à recruter les volontaires."
CRO_dalmatian_question_focus:0 "La question dalmate"
CRO_dalmatian_question_focus_desc:0 "Beaucoup auraient pensé que le choix d’un roi [ITA.GetAdjective] améliorerait nos relations avec [ITA.GetNameDef]. Pourtant, Tomislav II n’a pas accueilli favorablement l’influence [ITA.GetAdjective] sur son royaume. Le nouveau roi remet en question la possibilité d’italianiser la côte dalmate. Il semble qu’il forcera [ITA.GetNameDef] à abandonner ses revendications sur la région et à céder le contrôle de toute la côte."

CRO_zagreb_investments_focus:0 "Investissements à Zagreb"
CRO_zagreb_investments_focus_desc:0 "Zagreb est notre capitale et un important centre industriel ; elle doit être au cœur de notre politique économique."
CRO_trading_infrastructures:0 "Infrastructures commerciales"
CRO_trading_infrastructures_desc:0 "La voie maritime est la voie du progrès. En développant les ports de la côte dalmate, nous augmenterons nos exportations."
CRO_industrial_support:0 "Soutien industriel"
CRO_industrial_support_desc:0 "Nous devons rallier les industriels et les convaincre de travailler pour le bien commun de la société."
CRO_economic_optimization:0 "Optimisation économique"
CRO_economic_optimization_desc:0 "Certains secteurs de notre industrie militaire sont mal gérés. Nous devons les réformer pour accroître leur productivité."
CRO_research_grants:0 "Bourses de recherche"
CRO_research_grants_desc:0 "En finançant les entreprises d’ingénierie, nous pourrions accélérer le développement de nouveaux équipements pour nos forces armées."

CRO_yugoslav_scientific_cooperation:0 "Coopération scientifique [YUG.GetAdjective]"

CRO_form_peasant_councils:0 "Former des conseils paysans"
CRO_form_peasant_councils_desc:0 "Les paysans ont été opprimés dans tout le pays pendant des années. Si nous les encourageons à s’unir et à s’organiser sous notre direction idéologique, nous gagnerons de nombreux nouveaux partisans."
CRO_join_yugoslavia:0 "Rejoindre [YUG.GetNameDef]"
CRO_join_yugoslavia_desc:0 "Nous devons prouver que [YUG.GetNameDef] est véritablement l’union des Slaves du Sud. Nous devons montrer notre unité et rejoindre [YUG.GetNameDef]."
CRO_economic_centralization:0 "Centralisation économique"
CRO_economic_centralization_desc:0 "Nous devons entièrement restructurer l’économie afin de permettre au prolétariat de prendre le pouvoir."
CRO_nationalize_factories:0 "Nationaliser les usines"
CRO_nationalize_factories_desc:0 "L’industrialisation est la voie de l’avenir, mais les capitalistes la freinent en exploitant le travail du prolétariat. Pour libérer tout le potentiel de ce dernier, nous devons écarter les capitalistes de leur influence économique."
CRO_local_steel_production:0 "Production locale d’acier"
CRO_local_steel_production_desc:0 "Il est essentiel de soutenir notre industrie de guerre en produisant l’acier localement. Nous devons appliquer cette décision du comité politique central du parti communiste par tous les moyens."
CRO_local_militias:0 "Milices locales"
CRO_local_militias_desc:0 "Les militants des conseils paysans doivent être mobilisés et armés pour former l’épine dorsale d’une armée fidèle à notre idéologie."

CRO_reclaim_the_coast:0 "Reprendre la côte"
CRO_reclaim_the_coast_desc:0 "L’occupation [103.Owner.GetAdjective] de notre territoire inflige à nos frères une tyrannie insupportable jour après jour. Il est temps de libérer la patrie."
CRO_religious_minorities:0 "Minorités religieuses"
CRO_religious_minorities_happy:0 "Minorités religieuses intégrées"
CRO_croat_muslims_angry:0 "Musulmans [CRO.GetAdjective] ostracisés"
CRO_croat_muslims_happy:0 "Musulmans [CRO.GetAdjective] intégrés"
CRO_secularism:0 "Laïcité"
CRO_catholic_dominance:0 "Domination catholique"
CRO_idea_anti_partizan_tactics:0 "Tactiques anti-partisans"
CRO_liberate_bosnian_croats:0 "Libérer les Croates de Bosnie"
CRO_idea_ustashe_militia:0 "Milice oustachie"
CRO_idea_ustashe_militia_desc:0 "Le régime considère les milices oustachies comme ses troupes les plus fidèles et fiables. En réalité, leur qualité militaire est relativement faible, et la méfiance de la hiérarchie oustachie envers la garde nationale a créé plus de problèmes qu’autre chose. En revanche, la milice s’est montrée efficace dans la répression, ses membres étant sélectionnés pour leur loyauté politique au parti et à sa doctrine. C’est pourquoi elle est responsable des pires atrocités du régime de Pavelić."
