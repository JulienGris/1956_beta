# Personnages

WLS_david_john_williams:0 "David John Williams"
WLS_david_john_williams_desc:0 "Né en 1885, David John Williams a grandi dans une petite ferme située à Abernant, près de Rhydcymerau. Il quitta la maison en 1902 et travailla pendant quatre ans dans le bassin houiller du sud du pays de Galles. Il reprit ensuite ses études et contribua à la création du Parti national gallois (plus connu sous le nom de Plaid Cymru) en 1925. Williams fut également un nouvelliste réputé, toute son œuvre étant inspirée par sa vision d’une communauté soudée où des valeurs communes donnent à chacun sa dignité."
