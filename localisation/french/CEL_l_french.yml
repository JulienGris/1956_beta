# IDÉES #

CEL_pro_union_movement:0 "Mouvement pro-union"
CEL_pro_union_movement_desc:0 "La population de [ROOT.GetNonIdeologyName] reste profondément divisée sur la question de la souveraineté [ROOT.GetAdjective]. Bien que l’indépendance vis-à-vis des [ENG.GetAdjective] ait été obtenue, une partie importante de l’électorat [ROOT.GetAdjective], voire une majorité, milite encore pour un retour à l’union et une coopération étroite avec nos voisins d’outre-frontière. Ce sentiment alimente une montée des tensions politiques, la vision d’un avenir uni avec les [ENG.GetAdjective] entrant en conflit avec les aspirations des nationalistes partisans de l’indépendance."

CEL_pro_union_movement_remove:0 "Sera §Gsupprimé§! soit lorsque §Y[ROOT.GetNonIdeologyName]§! sera dans la §Yfaction§! des §Y[ENG.GetNameDef]§!, soit lorsque §Y[ROOT.GetNonIdeologyName]§! sera un §Ysujet§! des §Y[ENG.GetNameDef]§!, soit lorsque les §Y[ENG.GetNameDef]§! n’§Yexisteront§! plus."

### PRIORITÉS DYNAMIQUES ###

CEL_domestic_ammunition_production:0 "[GetAmmoFocusName]"
CEL_domestic_ammunition_production_desc:0 "Afin de réduire l’influence des puissances étrangères sur notre armée, nous devons produire nos propres munitions."
CEL_domestic_artillery_production:0 "[GetArtiFocusName]"
CEL_domestic_artillery_production_desc:0 "Nous devons développer notre propre puissance de feu ainsi que nos obus d’artillerie."
CEL_domestic_tank_production:0 "[GetTankFocusName]"
CEL_domestic_tank_production_desc:0 "La nouvelle ère de la guerre est arrivée, et pour ne pas disparaître nous devons nous y adapter !"
CEL_spirit_of_the_army:0 "[GetSpiritFocusName]"
CEL_spirit_of_the_army_desc:0 "Nos soldats doivent être ardents et courageux au combat, et c’est à nous de les former et de les guider vers cet objectif."
CEL_mechanical_computing:0 "[GetTechFocusName]"
CEL_mechanical_computing_desc:0 "Ce fabricant de matériel électronique pourrait être essentiel si nous lui accordons des subventions de recherche."
CEL_naval_effort:0 "[GetNavyFocusName]"
CEL_naval_effort_desc:0 "Pour assurer la sécurité de [ROOT.GetNonIdeologyName] et de sa population, nous devons investir dans nos projets navals."

# ARMÉE & ÉCONOMIE #

CEL_establish_the_army:0 "Fonder l’armée"
CEL_establish_the_army_desc:0 "Avec notre nouveau statut politique, il est temps d’organiser nos propres unités, inspirées des anciens régiments britanniques."
CEL_industrial_modernization:0 "Modernisation industrielle"
CEL_industrial_modernization_desc:0 "[ROOT.GetNonIdeologyName] doit conserver son statut de nation industrielle moderne afin d’affirmer sa place dans le monde."
CEL_redesign_small_arms:0 "Reconcevoir les armes légères"
CEL_redesign_small_arms_desc:0 "Pour garantir l’efficacité de notre infanterie, les armes légères doivent être constamment perfectionnées."
CEL_motorization_plan:0 "Plan de motorisation"
CEL_motorization_plan_desc:0 "L’exploitation rapide d’une percée peut faire s’effondrer un front — ce qui manqua cruellement durant la Grande Guerre."
CEL_convert_north_british_locomotive_factory:0 "Usine de locomotives North British"
CEL_convert_north_british_locomotive_factory_desc:0 "Cette usine de locomotives peut être reconvertie pour produire des véhicules blindés."
CEL_dalmuir_shells:0 "Obus de Dalmuir"
CEL_dalmuir_shells_desc:0 "Notre artillerie sera approvisionnée en obus produits à Dalmuir."
CEL_artillery_modernization:0 "Modernisation de l’artillerie"
CEL_artillery_modernization_desc:0 "L’artillerie tue, l’infanterie occupe."
CEL_new_tactics:0 "Nouvelles tactiques"
CEL_new_tactics_desc:0 "Si la charge frontale des Highlanders fonctionnait jadis, la Grande Guerre a marqué son déclin. Aujourd’hui, il faudrait être fou pour partir en guerre avec un claymore et un arc."
CEL_planning_staff:0 "Fonder l’Académie militaire de [ROOT.Capital.GetCapitalVictoryPointName]"
CEL_planning_staff_desc:0 "Un plan préparé est sans doute un meilleur plan."
CEL_expand_the_construction_sector:0 "Développer le secteur du bâtiment"
CEL_expand_the_construction_sector_desc:0 "Pour bâtir une meilleure nation, il faut de solides capacités de construction."
CEL_utilize_our_resources:0 "Exploiter nos ressources"
CEL_utilize_our_resources_desc:0 "Les ressources de [ROOT.GetNonIdeologyName] sont largement sous-exploitées ; investir dans ces trésors cachés renforcera grandement notre économie."
CEL_support_steel_sector:0 "Soutenir la sidérurgie"
CEL_support_steel_sector_desc:0 "De l’acier ! Pour les canons, les chars, les navires, et toutes les armes de guerre !"
CEL_support_light_industry:0 "Soutenir l’industrie légère"
CEL_support_light_industry_desc:0 "L’industrie légère est essentielle pour assurer un équilibre sain à notre économie."
CEL_improve_national_infrastructure:0 "Améliorer les infrastructures nationales"
CEL_improve_national_infrastructure_desc:0 "Nos mines et nos usines sont inutiles sans un bon réseau d’infrastructures, qui facilitera aussi l’exportation de nos ressources."
CEL_industrial_research:0 "Recherche industrielle"
CEL_industrial_research_desc:0 "Nous devons améliorer notre industrie."
CEL_project_taranis:0 "Projet Taranis"
CEL_project_taranis_desc:0 "Récemment, des scientifiques du monde entier sont arrivés à la même conclusion : il est, en théorie, possible de scinder un atome, libérant ainsi une énorme quantité d’énergie. Nous devrions peut-être investir dans cette piste…"
CEL_develop_aluminium_industry:0 "Traiter le minerai d’aluminium"
CEL_develop_aluminium_industry_desc:0 "Le minerai d’aluminium non traité est inutile à l’effort de guerre."
CEL_substitution_technologies:0 "Technologies de substitution"
CEL_substitution_technologies_desc:0 "Les importations pouvant être menacées par la guerre, nous devons envisager des technologies de substitution comme la liquéfaction du charbon."
CEL_establish_special_forces:0 "Créer les forces spéciales"
CEL_establish_special_forces_desc:0 "Les plus braves — ou les plus fous — d’entre nous doivent être sélectionnés pour former des unités d’élite capables d’éliminer l’ennemi en silence, à l’arc si nécessaire."
CEL_modern_logistics:0 "Logistique moderne"
CEL_modern_logistics_desc:0 "Sans approvisionnement, une armée ne peut combattre. Une logistique moderne est donc vitale pour une armée moderne."
CEL_signal_companies:0 "Compagnies de transmissions"
CEL_signal_companies_desc:0 "Communications, communications, communications."
CEL_field_hospitals:0 "Hôpitaux de campagne"
CEL_field_hospitals_desc:0 "Un soldat soigné peut encore servir la société. Un mort ne le peut pas."
CEL_mechanization_effort:0 "Mécanisation"
CEL_mechanization_effort_desc:0 "Un compromis entre un char et un camion pourrait permettre à nos troupes d’entrer rapidement et efficacement en combat."

# ARMÉE DE L’AIR #

CEL_aviation_air_academy:0 "Académie aérienne [ROOT.GetAdjective]"
CEL_aviation_air_academy_desc:0 "L’aviation [ROOT.GetAdjective] doit être la pierre angulaire de notre infrastructure aérienne."
CEL_build_trainer_aircrafts:0 "Construire des avions d’entraînement"
CEL_build_trainer_aircrafts_desc:0 "Avant de concevoir un véritable chasseur, il serait sans doute plus sage de commencer par un prototype d’avion-école."
CEL_bimotor_aircrafts:0 "Avions bimoteurs"
CEL_bimotor_aircrafts_desc:0 "Les gros avions sont l’avenir. N’a-t-on pas toujours dit que « le bombardier passera toujours » ?"
CEL_train_pilots:0 "Former les pilotes"
CEL_train_pilots_desc:0 "Sans pilotes, comment espérer disposer d’une armée de l’air opérationnelle ?"
CEL_train_mechanics:0 "Former les mécaniciens"
CEL_train_mechanics_desc:0 "Sans mécaniciens, comment espérer disposer d’une armée de l’air opérationnelle ?"
CEL_support_designers_innovations:0 "Soutenir les innovations des concepteurs"
CEL_support_designers_innovations_desc:0 "Des prototypes expérimentaux peuvent parfois déboucher sur de formidables améliorations."
CEL_naval_aviation:0 "Aéronavale"
CEL_naval_aviation_desc:0 "À l’ère des porte-avions, les avions adaptés à la guerre navale deviennent indispensables."
CEL_refine_air_doctrine:0 "Affiner la doctrine aérienne"
CEL_refine_air_doctrine_desc:0 "L’expérience nous offre une meilleure compréhension de la guerre aérienne."
CEL_radar_network:0 "Réseau radar"
CEL_radar_network_desc:0 "Détecter l’ennemi tôt nous permet de contrer les menaces bien plus efficacement."
# MARINE #

CEL_the_shipyard_of_the_world:0 "Le chantier naval du monde"
CEL_the_shipyard_of_the_world_desc:0 "Avec ses immenses chantiers capables de construire des navires marchands et de guerre aux quatre coins du globe, [ROOT.GetNonIdeologyName] est véritablement le chantier naval du monde."
CEL_shipbuilding_contacts:0 "Contacts dans la construction navale"
CEL_shipbuilding_contacts_desc:0 "Le soutien des chantiers navals est essentiel si nous voulons contribuer efficacement à l’effort de guerre."
CEL_national_admiralty:0 "Amirauté nationale"
CEL_national_admiralty_desc:0 "Notre marine a besoin d’un équivalent à notre état-major militaire."
CEL_the_fleet_of_old:0 "La flotte d’antan"
CEL_the_fleet_of_old_desc:0 "Les cuirassés seront au cœur de notre marine."
CEL_battleship_focus:0 "Priorité aux cuirassés"
CEL_battleship_focus_desc:0 "De gros canons pour de grands navires. Avec quatre tourelles triples, deux à l’avant et deux à l’arrière."
CEL_the_biggest_battleship:0 "Le plus grand cuirassé"
CEL_the_biggest_battleship_desc:0 "Pourquoi imiter les cuirassés des autres puissances si nous pouvons en construire un encore plus grand ?"
CEL_the_blocade_doctrine:0 "Doctrine du blocus"
CEL_the_blocade_doctrine_desc:0 "Si nous coulons suffisamment de convois ennemis, nous pourrons paralyser leur économie."
CEL_silent_service:0 "Service silencieux"
CEL_silent_service_desc:0 "Des sous-marins modernes sont indispensables à la réussite du plan élaboré."
CEL_domestic_torpedo_production:0 "Production nationale de torpilles"
CEL_domestic_torpedo_production_desc:0 "Pour que nos sous-marins et destroyers soient efficaces, il leur faut quelque chose à tirer."
CEL_stealth_upgrades:0 "Améliorations de furtivité"
CEL_stealth_upgrades_desc:0 "Des sous-marins plus furtifs seront plus efficaces pour approcher des convois ennemis sans défense."
CEL_carrier_strikes:0 "Frappes aéronavales"
CEL_carrier_strikes_desc:0 "La nouvelle ère de la guerre navale exige à la fois la supériorité maritime et aérienne sur le champ de bataille, d’où la nécessité de développer des porte-avions pour protéger nos navires et frapper l’ennemi plus fort que jamais."
CEL_naval_air_groups:0 "Groupes aéronavals"
CEL_naval_air_groups_desc:0 "Pour que nos porte-avions soient efficaces, encore faut-il avoir quelque chose à y embarquer."
CEL_lessons_for_the_air_force:0 "Leçons pour l’armée de l’air"
CEL_lessons_for_the_air_force_desc:0 "Nos expériences en matière d’aviation navale pourraient également s’avérer précieuses pour l’armée de l’air."
CEL_cruiser_focus:0 "Croiseurs modernes"
CEL_cruiser_focus_desc:0 "La nouvelle ère apporte des armements modernes, un blindage moderne et tout ce qui peut améliorer nos croiseurs."
CEL_destroyer_focus:0 "Destroyers modernes"
CEL_destroyer_focus_desc:0 "La nouvelle ère apporte des moteurs modernes, des hydrophones modernes, des mines et tout ce qui peut améliorer nos destroyers."
CEL_increase_naval_production:0 "Accroître la production navale"
CEL_increase_naval_production_desc:0 "Notre production navale doit gagner en efficacité pour rivaliser avec les grandes puissances, et nous devons lui donner les moyens de le faire."
CEL_a_s_warfare:0 "Lutte ASM"
CEL_a_s_warfare_desc:0 "Le champ de bataille naval moderne a révélé la vulnérabilité des convois et des navires légers face aux sous-marins, chassant en meutes. Nous devons contrer cette faiblesse nouvellement révélée et développer nos capacités de lutte anti-sous-marine."
CEL_naval_mine_warfare:0 "Guerre des mines navales"
CEL_naval_mine_warfare_desc:0 "Pour empêcher l’ennemi de dominer les mers, il est judicieux de recourir à la guerre des mines."

# PRIORITÉS FORMABLES PARTAGÉES #

CEL_francois_recruited:0 "Vous avez approché les Cercles bardiques… quoi que cela signifie."
is_cel_tt:0 "A unifié toutes les terres §Yceltiques§!"
CEL_celtic_unification:0 "Unification celtique"
CEL_celtic_unification_desc:0 "Après des siècles de domination anglaise et française, le peuple celtique est enfin uni !"
CEL_strengthen_shipping_routes:0 "Renforcer les routes maritimes"
CEL_strengthen_shipping_routes_desc:0 "Nous contrôlons désormais certaines des routes maritimes les plus vitales au monde. Nous pouvons en tirer parti."
CEL_naval_buildup:0 "Renforcement naval"
CEL_naval_buildup_desc:0 "Compte tenu de nos possessions, une présence navale forte est indispensable pour nous protéger des menaces étrangères. Il est donc logique de commencer ce renforcement !"
CEL_celtic_carriers:0 "Porte-avions celtiques"
CEL_celtic_carriers_desc:0 "Nous devons défendre le peuple celtique à tout prix ! Des porte-avions nous permettront de ravitailler et renforcer nos territoires en cas d’attaque."
CEL_defend_union:0 "Défendre l’union"
CEL_defend_union_desc:0 "Après la création récente de l’armée celtique, nous devons renforcer notre moral. Nous défendrons nos terres jusqu’au bout !"
CEL_rule_the_air:0 "Des cieux sur les mers"
CEL_rule_the_air_desc:0 "Avec l’eau nous entourant de toutes parts, la marine celtique doit bénéficier d’un soutien aérien supplémentaire ! Cela peut changer l’issue de toute bataille navale future."
CEL_go_for_galicia:0 "Prendre la Galice"
CEL_go_for_galicia_desc:0 "La Galice est depuis bien trop longtemps aux mains de nos ennemis. Il est temps de la saisir et de l’intégrer à l’union !"
CEL_celtic_unity:0 "Des Highlands à l’Ibérie"
CEL_celtic_unity_desc:0 "Nous sommes l’Union celtique ! Plus forts et plus unis que jamais ! Nous nous battrons pour les terres qui nous reviennent de droit !"
CEL_integrate_areas:0 "Intégration celtique"
CEL_integrate_areas_desc:0 "Avec l’unification de toutes les terres celtiques, la prochaine étape logique est d’intégrer pleinement toutes les régions et leurs ressources dans l’union."
CEL_scottish_steel_sector:0 "Sidérurgie écossaise"
CEL_scottish_steel_sector_desc:0 "Le secteur sidérurgique écossais est essentiel à notre développement industriel."
CEL_develop_the_shale_oil_sector:0 "Développer le secteur du pétrole de schiste"
CEL_develop_the_shale_oil_sector_desc:0 "Le secteur écossais du pétrole de schiste peut contribuer à notre indépendance énergétique."
CEL_dingham_ammunition_factory:0 "Usine de munitions de Dingham"
CEL_dingham_ammunition_factory_desc:0 "L’usine de Dingham a tout le potentiel pour devenir le centre de notre production d’armement en Écosse."
CEL_develop_ireland:0 "Développer l’Irlande"
CEL_develop_ireland_desc:0 "L’Irlande, l’île d’émeraude, possède de nombreuses ressources et complexes industriels précieux qu’il serait imprudent de négliger !"
CEL_appropriate_harland_and_wolff:0 "Réquisitionner Harland and Wolff"
CEL_appropriate_harland_and_wolff_desc:0 "Les chantiers et usines Harland and Wolff pourraient constituer un investissement précieux pour renforcer notre flotte."
CEL_brittany_industry:0 "Développer la Bretagne"
CEL_brittany_industry_desc:0 "Toutes les régions de notre union celtique doivent être également développées. Cela inclut l’Irlande, l’Écosse, le pays de Galles et la Bretagne, désormais réunie avec la Mère patrie."
CEL_morgan_line:0 "Créer la ligne Morgan"
CEL_morgan_line_desc:0 "La nouvelle ligne de fortifications Morgan protégera nos citoyens de toute menace continentale."
CEL_Brest_Oil_Industry:0 "Industrie pétrolière de Brest"
CEL_Brest_Oil_Industry_desc:0 "La plus grande ville bretonne, Brest, est aussi un port commercial et une base navale majeurs, gardant le golfe de Gascogne et la Manche. Le nouveau programme d’extension du port comprend la construction de plusieurs terminaux pétroliers."
CEL_coal_mining:0 "Mines de charbon galloises"
CEL_coal_mining_desc:0 "Le pays de Galles possède l’un des plus grands bassins houillers du monde. Nous devons veiller à ce qu’il reste au sommet."
CEL_newport_artillery:0 "Artillerie de Newport"
CEL_newport_artillery_desc:0 "Nous construirons à Newport une usine spécialisée dans le développement d’armes antiaériennes et antichars. Cela renforcera considérablement notre artillerie."

