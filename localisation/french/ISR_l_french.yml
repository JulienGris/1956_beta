ISR_vote_category_desc:0 "Une loi est actuellement en cours de vote à la Knesset. Afin d’assurer son adoption, nous devons obtenir une majorité de soutien parmi les partis, soit 61 sièges.\n\n[?ISR_yes_votes] - Favorables :\n[ISRGetMakiVoteYes][ISRGetHashomerVoteYes][ISRGetMapaiVoteYes][ISRGetNewAliyahVoteYes][ISRGetGeneralZionistsVoteYes][ISRGetHatzoharVoteYes][ISRGetURFVoteYes]\n[?ISR_no_votes] - Opposés :\n[ISRGetMakiVoteNo][ISRGetHashomerVoteNo][ISRGetMapaiVoteNo][ISRGetNewAliyahVoteNo][ISRGetGeneralZionistsVoteNo][ISRGetHatzoharVoteNo][ISRGetURFVoteNo]"

