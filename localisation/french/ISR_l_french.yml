 #ISR_david_ben_gurion:0 "David Ben-Gourion" #localisé dans le fichier goe que nous ne remplaçons pas
 ISR_DBG_DESCRIPTION:0 "David Josef Gruen a toujours cru qu’il serait celui qui succéderait à Herzl comme chef de la cause sioniste. Beaucoup le traitaient de fou ou de rêveur, mais il fit sienne la maxime de Herzl : « Si vous le voulez, ce n’est pas un rêve. »\n\nNé en 1886 à Plock dans une famille de paysans pauvres et illettrés, Gruen s’intéressa très tôt au sionisme. Après le pogrom de Kichinev, il rejoignit Poale Sion et devint un haut responsable du parti, rencontrant à plusieurs reprises des dirigeants juifs tels que Ber Borochov.\n\nAprès le départ de Borochov pour l’Amérique, Gruen s’installa en Palestine, où il fut recruté par Yisrael Shochat dans la branche palestinienne de Poale Sion. Shochat pensait que Gruen serait un outil utile, mais en réalité, Gruen saisissait chaque occasion de gagner du pouvoir dans le parti. Pour contrebalancer cela, Shochat recruta le nouvel arrivant Yitzhak Ben-Zvi. Gruen et Ben-Zvi devinrent de bons amis, mais Gruen perdit progressivement de l’influence face à Ben-Zvi et Shochat. Écœuré, il démissionna et s’installa à Sejera, où il adopta enfin un nom hébreu : Ben-Gourion.\n\nÀ l’éclatement de la Grande Guerre, Ben-Gourion rejoignit Ben-Zvi au sein de Poale Sion pour rallier du soutien à l’Empire ottoman, espérant gagner la faveur du gouvernement impérial. Mais les autorités rejetèrent cette démarche, déclarant Poale Sion organisation anti-turque, et en expulsèrent tous les membres vers l’Égypte, où ils passèrent le reste de la guerre, certains rejoignant même les Britanniques pour combattre les Ottomans.\n\nAvec le nouveau mandat sous contrôle britannique, Ben-Gourion fonda un nouveau parti : le Mapai, ainsi que sa force paramilitaire, la Haganah. Ce parti allait dominer la direction du Yishouv, et quand vint le temps de se soulever contre les Britanniques, ce fut la Haganah qui frappa la première.\n\nAujourd’hui, avec l’espoir de deux mille ans enfin à portée de main, c’est à nul autre que Ben-Gourion de franchir la ligne d’arrivée."

