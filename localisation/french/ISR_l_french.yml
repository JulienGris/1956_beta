ISR_constitution_category_desc:0 "Notre nation ne dispose pas encore de constitution, ce qui représente un risque pour nos institutions démocratiques puisqu’il n’existe aucun cadre fixé pour les fonctions du gouvernement. Nous devons tenter d’en rédiger une, mais sans trop heurter la population, au risque de faire échouer les négociations.\n\nPartis actuellement favorables à la constitution :\n[ISRGetMakiConstitutionYes][ISRGetHashomerConstitutionYes][ISRGetMapaiConstitutionYes][ISRGetNewAliyahConstitutionYes][ISRGetGeneralZionistsConstitutionYes][ISRGetHatzoharConstitutionYes][ISRGetURFConstitutionYes]\nTotal des votes : §Y[?ISR_constitution_votes]/61"

