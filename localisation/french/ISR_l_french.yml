## Président
ISR_vote_president_category:0 "Élection d’un président"
ISR_vote_president_category_desc:0 "Avec la fondation de notre nouvel État et l’élection de la première Knesset, nous devons nous réunir pour élire un président qui sera le visage de notre nation à l’extérieur.\nTrois options principales existent :\n§OYitshak Ben-Zvi§!, un vieux militant travailliste sioniste et ami de Ben Gourion, soutenu par la gauche ;\n§gChaim Weizmann§!, représentant du Yishouv au traité de Sèvres et à l’accord Fayçal-Weizmann, soutenu par le centre ;\n§3Joseph Klausner§!, universitaire et écrivain révisionniste, soutenu par la droite.\n\nCertains avancent l’idée d’inviter §RAlbert Einstein§! comme figure apolitique pour représenter la nation, mais il faudra des efforts pour le convaincre. Quoi qu’il en soit, nous devons choisir qui soutenir.\n\n§RAlbert Einstein§! est actuellement [ISRGetEinstein] pour être nommé président.[ISRGetPresidentialSupport]"
