ISR_knesset_category:0 "La Knesset [ISR.GetAdjective]"
open_parliament_gui:0 "Relancer la Knesset"
ISR_seat_tt:0 "[ISR_seat_party]"

ISR_party_1:0 "§RMaki§! - Un parti communiste issu du Parti communiste de Palestine à l’époque du mandat britannique, prônant une union unique de type léniniste alignée sur l’URSS."
ISR_party_2:0 "§OHashomer Hatsair§! - Un parti socialiste radical, différent du Mapai de David Ben Gourion, qui cherche à s’aligner sur l’Union soviétique et bénéficie d’un large soutien parmi les kibboutz ruraux juifs. Il prône une politique plus conciliante envers le monde arabe, en favorisant la coexistence."
ISR_party_3:0 "§tMapai§! - Un parti socialiste démocratique qui diffère du Hashomer Hatsair par son alignement sur l’Occident et son soutien plus fort auprès du prolétariat urbain. Historiquement, le Mapai s’est centré sur une approche pragmatique, disposé à coopérer avec les autorités britanniques. Le Mapai et ses prédécesseurs ont dominé le mouvement sioniste depuis la Seconde Aliyah."
ISR_party_4:0 "§8Nouvelle Aliyah§! - Un parti social-libéral fondé par les réfugiés de la Cinquième Aliyah en provenance d’Allemagne et d’Autriche. Ses principaux objectifs sont la poursuite de l’expansion de l’Aliyah et le développement technologique d’Israël dans l’ère moderne."
ISR_party_5:0 "§gSionistes généraux§! - Un parti libéral capitaliste fondé à l’origine par Theodor Herzl lui-même. Il attire surtout les résidents urbains de la classe moyenne avec un fort accent sur les libertés individuelles."
ISR_party_6:0 "§3Hatzohar§! - Un parti conservateur qui a gagné du soutien grâce à l’afflux de réfugiés juifs du monde arabe. Hatzohar se distingue des autres partis par le fait qu’il était séparé du Yishouv et qu’il possédait sa propre milice durant l’ère du mandat, l’Irgoun. De ce fait, il est perçu comme un parti paria et n’a pas beaucoup de soutien populaire."
ISR_party_7:0 "§2Front religieux uni§! - Une alliance de circonstance entre plusieurs partis religieux différents qui œuvrent à préserver les lois religieuses en Israël."
ISR_party_8:0 "Vide - sera rempli après les élections."

