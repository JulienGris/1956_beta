ISR_invite_maki:0 "Inviter §RMaki§! à notre coalition."
ISR_invite_maki_desc:0 "§RMaki§! - Un parti communiste issu du Parti communiste de Palestine durant l’ère du mandat britannique, prônant une union unique de type léniniste alignée sur l’URSS."
ISR_invite_hashomer:0 "Inviter §OHashomer Hatsair§! à notre coalition."
ISR_invite_hashomer_desc:0 "§OHashomer Hatsair§! - Un parti socialiste radical différent du Mapai de David Ben Gourion, qui cherche à s’aligner sur l’Union soviétique et bénéficie d’un large soutien dans les kibboutzim ruraux juifs. Il prône une politique plus conciliante envers le monde arabe, plaidant pour la coexistence."
ISR_invite_mapai:0 "Inviter §tMapai§! à notre coalition."
ISR_invite_mapai_desc:0 "§tMapai§! - Un parti socialiste démocratique qui diffère du Hashomer Hatsair en s’alignant sur l’Occident et bénéficie d’un plus grand soutien au sein du prolétariat urbain. Historiquement, le Mapai s’est distingué par son pragmatisme et sa volonté de collaborer avec les autorités britanniques. Le Mapai et ses prédécesseurs ont dominé le mouvement sioniste depuis la Seconde Aliyah."
ISR_invite_new_aliyah:0 "Inviter la §8Nouvelle Aliyah§! à notre coalition."
ISR_invite_new_aliyah_desc:0 "§8Nouvelle Aliyah§! - Un parti social-libéral fondé par des réfugiés de la Cinquième Aliyah venus d’Allemagne et d’Autriche. Ses principaux objectifs sont la poursuite de l’expansion de l’Aliyah et le développement technologique d’Israël dans l’ère moderne."
ISR_invite_general_zionists:0 "Inviter les §gSionistes généraux§! à notre coalition."
ISR_invite_general_zionists_desc:0 "§gSionistes généraux§! - Un parti libéral capitaliste fondé à l’origine par Theodor Herzl lui-même. Il séduit surtout les classes moyennes urbaines, avec un fort accent sur les libertés individuelles."
ISR_invite_hatzohar:0 "Inviter §3Hatzohar§! à notre coalition."
ISR_invite_hatzohar_desc:0 "§3Hatzohar§! - Un parti conservateur qui a gagné beaucoup de soutien auprès des réfugiés juifs venus du monde arabe. Hatzohar se distingue des autres partis par son isolement du Yishouv et par la possession de sa propre milice durant l’ère du Mandat, l’Irgoun. À ce titre, il est considéré comme un parti paria et ne dispose pas d’un large soutien populaire."
ISR_invite_urf:0 "Inviter le §2Front religieux uni§! à notre coalition."
ISR_invite_urf_desc:0 "§2Front religieux uni§! - Une alliance de circonstance entre plusieurs partis religieux qui œuvrent à préserver les lois religieuses en Israël."

