 PRU_internal_factions:0 "Factions internes"
 PRU_internal_factions_desc:0 "À mesure que se déploie la mosaïque de la société péruvienne, des factions internes émergent, chacune s’alignant sur différents piliers du pouvoir. Oligarques, Apristes, Nationalistes et Quechuas — tous, avec leurs intérêts et visions distincts — prêtent allégeance à l’Armée, à la Marine ou au gouvernement central. L’équilibre délicat entre ces influences doit être géré avec soin pour garantir la stabilité et l’unité de notre nation."

