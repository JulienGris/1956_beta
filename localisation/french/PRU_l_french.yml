 peru.1:0 "Le destin de la politique péruvienne"
 peru.1.t:0 "Le destin de la politique péruvienne"
 peru.1.d:0 "Après le bref gouvernement de Sánchez Cerro et celui de son successeur [PRU.GetLeader], le peuple exige de clarifier le destin du Pérou et de ses dirigeants.\n\nNous pouvons soit organiser des élections démocratiques pour choisir notre nouveau président, soit simplement les annuler pour favoriser Benavides et prolonger son gouvernement — au risque de troubles sociaux —, soit enfin nous souvenir de l’héritage de Sánchez Cerro et nous rapprocher de l’Union Révolutionnaire et de son nationalisme."
 PRU_hans_appear:0 "Appeler Hans comme général"

 #OPTIONS#
 peru.1.a:0 "Se souvenir de l’héritage de Sánchez Cerro."
 # peru.1.b:0 "Se ranger du côté du peuple."
 peru.1.a.w:0 "Péruviens, à la guerre !"
 peru.1.b:0 "Benavides doit continuer à gouverner."
 peru.1.c:0 "Laisser place à des élections démocratiques."

 peru.2:0 "Les élections démocratiques"
 peru.2.t:0 "Les élections démocratiques"
 peru.2.d:0 "Les élections démocratiques sont la base de toute société civilisée. [PRU.GetLeader], après un bref gouvernement, a décidé de convoquer des élections pour que la voix du peuple désigne le prochain dirigeant. Quatre candidats se distinguent :\n\nJorge Prado Ugarteche, chef de la droite conservatrice, catholique et anti-apriste, qui veut industrialiser le Pérou avec l’aide des États-Unis ;\n\nLuis Eguiguren Escudero, social-démocrate, ambitionnant d’unir socialistes et conservateurs, de s’allier aux apristes pour rassembler et développer le pays ;\n\nManuel Vicente Villarán, ancien civiliste, grand détracteur du régime de Leguía, prêt à s’ouvrir davantage aux États-Unis et à rallier les soutiens de Benavides pour unifier le pays et détruire l’APRA ;\n\nArturo Pablo Peralta Miranda — Gamaniel Churata — écrivain et défenseur des droits quechuas, proche d’un communisme national non inféodé à Moscou. Il promet droits indigènes et fin de la mémoire de Sánchez Cerro et Benavides, selon lui les plus grands dictateurs du Pérou."
 peru.2.a:0 "Victoire du Frente Nacional de Derecha."
 peru.2.b:0 "Victoire des sociaux-démocrates."
 peru.2.c:0 "Victoire de l’Alianza Acción Republicana."
 peru.2.dw:0 "Victoire du Frente Patriota Tupacamarista."

 peru.w:0 "Des soldats équatoriens entrent sur notre territoire"
 peru.w.t:0 "Des soldats équatoriens entrent sur notre territoire"
 peru.w.d:0 "Nous sommes informés que des soldats équatoriens franchissent la frontière vers les postes de Zarumilla et harcèlent la population péruvienne. Des rapports signalent aussi des incursions depuis Macará et Zapotillo."
 peru.w.a:0 "C’est la guerre."

 peru.3:0 "Multiples protestations contre l’annulation des élections"
 peru.3.t:0 "Multiples protestations contre l’annulation des élections"
 peru.3.d:0 "Le peuple est las de Benavides et de la prolongation de son gouvernement de trois ans par l’annulation des élections. Il se lèvera pour défendre la valeur démocratique du Pérou."
 peru.3.b:0 "Trois années de plus avec Benavides"
 peru.3.c:0 "La révolution sauvera le Pérou"
 peru.2.bpw:0 "Utiliser la guerre pour unir tous les Péruviens."
 peru.2.a.w:0 "C’est le droit des Équatoriens."

 peru.4:0 "Benavides est mort"
 peru.4.t:0 "Benavides est mort"
 peru.4.d:0 "La mort de Benavides est ressentie dans tout le pays : son gouvernement a pacifié le Pérou après de longues rébellions apristes. Désormais, nous espérons que l’avenir du pays sera aussi prometteur que sous son règne."
 peru.4.a:0 "Quelle tristesse."

 peru.5:0 "Le Pérou souhaite négocier les territoires disputés"
 peru.5.t:0 "Le Pérou souhaite négocier les territoires disputés"
 peru.5.d:0 "Suivant les principes d’une société civilisée, l’État péruvien nous propose d’établir une frontière fixe pour éviter de futurs conflits : la délimitation suivrait le statu quo atteint à Washington en 1936."
 peru.5.a:0 "Jamais."
 peru.5.b:0 "Acceptons les demandes péruviennes."

 peru.6:0 "Le problème avec l’Équateur"
 peru.6.t:0 "Le problème avec l’Équateur"
 peru.6.d:0 "Depuis longtemps, la frontière avec l’Équateur pose problème et a causé des guerres. Il est vital d’éclaircir ce point ; avec la signature du statu quo de 1936, nous avançons vers une frontière fixée."
 peru.6.a:0 "Refuser le compromis frontalier de 1936."
 peru.6.b:0 "Négocier avec l’Équateur."
 peru.6.c:0 "Éliminons nos ennemis."

 peru.7:0 "Le Pérou décide de rejeter le statu quo"
 peru.7.t:0 "Le Pérou décide de rejeter le statu quo"
 peru.7.d:0 "Le Pérou a décidé de rejeter le statu quo de 1936, car les terres sous drapeau équatorien abritent une population péruvienne."
 peru.7.a:0 "Une raison de plus de ne pas faire confiance aux Péruviens."

 peru.8:0 "Révolution anti-guerre"
 peru.8.t:0 "Révolution anti-guerre"
 peru.8.d:0 "La guerre a réveillé un sentiment révolutionnaire chez le peuple péruvien : Benavides n’a pas su poursuivre sa guerre suicidaire et a conduit les Péruviens sur la voie de la mort et de la faim."
 peru.8.a:0 "Nous purgerons les antipatriotes."
 peru.8.b:0 "Si Benavides ne signe pas la paix, le peuple le fera par-dessus sa tête."

 peru.9:0 "Le Pérou rejette le statu quo frontalier"
 peru.9.t:0 "Le Pérou rejette le statu quo frontalier"
 peru.9.d:0 "Les Péruviens viennent de méconnaître l’accord de Washington sur leur frontière avec l’Équateur, rejetant ce qu’ils avaient accepté. Le mieux serait d’agir selon notre rôle d’instance régulatrice des pays moins développés de la région."
 peru.9.a:0 "Appliquons une sanction économique."
 peru.9.b:0 "C’est le droit des Péruviens."

 peru.10:0 "[PRU.GetNameDefCap] se prépare à mettre fin à l’élection populaire"
 peru.10.t:0 "[PRU.GetNameDefCap] se prépare à mettre fin à l’élection populaire"
 peru.10.d:0 "[PRU.GetNameDefCap] prépare son armée pour en finir avec les partis de masse. En ces heures difficiles, nous devons dépasser nos différences et nous unir contre le même ennemi, qui ne supporte pas la libre décision des peuples sur leur gouvernement. À présent, le dictateur [PRU.getLeader] lance sa machine pour nous achever."
 peru.10.a:0 "Défendons-nous."

 peru.11:0 "[PRU.GetNameDefCap] arme le [ROOT.GetFascistParty] pour prendre le pouvoir"
 peru.11.t:0 "[PRU.GetNameDefCap] arme le [ROOT.GetFascistParty] pour prendre le pouvoir"
 peru.11.d:0 "[PRU.GetNameDefCap], avec son allié fasciste [ROOT.GetFascistParty], prépare un coup d’État contre notre gouvernement. Nous ne devons pas permettre aux hordes fascistes d’approcher l’Amérique latine. Préparons-nous contre ces antipatriotes qui veulent apporter la terreur dont le Pérou a été victime aux mains de son dictateur [PRU.GetFascistLeader]. Il est temps de prendre les armes et de mettre fin au soulèvement fasciste."
 peru.11.a:0 "Défendons-nous."

 peru.12:0 "[ECU.GetNameDefCap] accepte nos revendications territoriales"
 peru.12.t:0 "[ECU.GetNameDefCap] accepte nos revendications territoriales"
 peru.12.d:0 "La région de Pastaza fait à nouveau partie de nos territoires. La volonté de fer de nos représentants a permis la réintégration de cette grande région. Sans aucun doute, une grande victoire pour le gouvernement de [ROOT.GetLeader]."
 peru.12.a:0 "Un grand jour pour tous les [ROOT.getAdjective]s."

 peru.13:0 "[ECU.GetNameDefCap] rejette nos revendications territoriales"
 peru.13.t:0 "[ECU.GetNameDefCap] rejette nos revendications territoriales"
 peru.13.d:0 "Notre territoire de la région de Pastaza a été perdu à cause du gouvernement corrompu de [ROOT.GetLeader]. À l’avenir, le peuple [ROOT.getAdjective] devra récupérer cette terre, armes à la main."
 peru.13.a:0 "Le gouvernement corrompu de [ROOT.GetLeader] l’a permis."

 peru.14:0 "[USA.GetNameDefCap] accepte nos revendications territoriales"
 peru.14.t:0 "[USA.GetNameDefCap] accepte nos revendications territoriales"
 peru.14.d:0 "La région de Pastaza fait à nouveau partie de nos territoires. La volonté de fer de nos représentants a permis la réintégration de cette grande région. Sans aucun doute, une grande victoire pour le gouvernement de [ROOT.GetLeader]."
 peru.14.a:0 "Une grande victoire pour nos politiciens."

 peru.15:0 "[USA.GetNameDefCap] rejette nos revendications territoriales"
 peru.15.t:0 "[USA.GetNameDefCap] rejette nos revendications territoriales"
 peru.15.d:0 "Notre territoire de la région de Pastaza a été perdu à cause du gouvernement corrompu de [ROOT.GetLeader]. À l’avenir, le peuple [ROOT.getAdjective] devra récupérer cette terre, armes à la main."
 peru.15.a:0 "Le gouvernement corrompu de [ROOT.GetLeader] l’a permis."

 peru.16:0 "Nous devons élire notre chef révolutionnaire"
 peru.16.t:0 "Nous devons élire notre chef révolutionnaire"
 peru.16.d:0 "Après une grande lutte pour les droits sociaux du peuple [ROOT.getAdjective], notre révolution a renversé le dictateur Óscar Benavides. Mais il nous faut désormais un chef pour guider les masses sur la voie de la révolution.\n\nPremière option : Eudocio Ravines, qui a passé beaucoup de temps à Moscou et en Europe à étudier les principes du communisme ; avec une clique de conseillers soviétiques, nous suivrons la voie de l’Union soviétique vers la révolution.\n\nSeconde option : le leader populaire Víctor Haya de la Torre, chef de masse important qui, avec ses idéaux d’une révolution plus nationale, a enrôlé paysans et indigènes dans son parti. Son objectif est de détacher le communisme péruvien de la politique de Moscou."
 peru.16.a:0 "Víctor Haya de la Torre nous mènera à la victoire."
 peru.16.b:0 "Eudocio Ravines nous mènera à la victoire."

 peru.17:0 "La mémoire de Sánchez Cerro"
 peru.17.t:0 "La mémoire de Sánchez Cerro"
 peru.17.d:0 "Sánchez Cerro vit encore dans nos mémoires et ses hauts faits ne seront jamais oubliés. Le rapprochement récent d’Óscar Benavides avec l’Union Révolutionnaire a renforcé notre parti, mais pour rendre la prospérité au Pérou nous avons besoin d’un dirigeant à la volonté de fer.\n\nL’une des options est le général Ureta, disciple de Sánchez Cerro, qui veut conduire le pays à la victoire en dehors de l’influence du fascisme italien.\n\nL’autre option est Luis Alberto Flores, catholique reconnu et chef de la jeunesse urriste, proche de Sánchez Cerro et aujourd’hui à la tête du parti, qui veut réformer l’idéologie du mouvement pour la rapprocher du fascisme italien."
 peru.17.a:0 "Poursuivre l’héritage de Sánchez Cerro."
 peru.17.b:0 "En finir avec le sanchez-cerrisme."

 peru.18:0 "Choisir un successeur à Benavides"
 peru.18.t:0 "Choisir un successeur à Benavides"
 peru.18.d:0 "Benavides ne peut plus gouverner ; les récentes protestations prouvent la faiblesse de son gouvernement et la nécessité d’un nouveau leader pour nous mener vers la « Patria Nueva ». Deux candidats sont envisagés.\n\nLe premier est Ernesto Montagne, ancien membre de l’Union Révolutionnaire qui a quitté le parti lorsqu’il a viré vers des doctrines extrêmes comme le fascisme ; conservateur, il veut restaurer la valeur nationaliste de l’Union Révolutionnaire.\n\nLa seconde option est un coup d’État mené par le général Ricardo Pérez Godoy, à Tacna : nationaliste, il propose une réforme sociale sérieuse pour les indigènes et les plus pauvres du Pérou avec son « Gobierno Revolucionario de las Fuerzas Armadas »."
 peru.18.a:0 "Choisir Ernesto Montagne comme successeur."
 peru.18.b:0 "S’en remettre à la révolution de Tacna."

 peru.19:0 "[PRU.GetNameDefCap] arme le [ROOT.GetCommunistParty] pour prendre le pouvoir"
 peru.19.t:0 "[PRU.GetNameDefCap] arme le [ROOT.GetCommunistParty] pour prendre le pouvoir"
 peru.19.d:0 "[PRU.GetNameDefCap], avec son allié communiste [ROOT.GetCommunistParty], prépare un coup d’État contre notre gouvernement. Nous ne devons pas laisser les hordes communistes approcher l’Amérique latine. Préparons-nous contre ces antipatriotes qui veulent apporter la terreur dont le Pérou a été victime aux mains de son dictateur [PRU.GetCommunistLeader]. Il est temps de prendre les armes et de mettre fin au soulèvement communiste."
 peru.19.a:0 "Défendons-nous."

 peru.23:0 "[PRU.GetNameDefCap] arme le [ROOT.GetCommunistParty] pour prendre le pouvoir"
 peru.23.t:0 "[PRU.GetNameDefCap] arme le [ROOT.GetCommunistParty] pour prendre le pouvoir"
 peru.23.d:0 "[PRU.GetNameDefCap], avec son allié communiste [ROOT.GetCommunistParty], prépare un coup d’État contre notre gouvernement. Nous ne devons pas laisser les hordes communistes approcher l’Amérique latine. Préparons-nous contre ces antipatriotes qui veulent apporter la terreur dont le Pérou a été victime aux mains de son dictateur [PRU.GetCommunistLeader]. Il est temps de prendre les armes et de mettre fin au soulèvement communiste."
 peru.23.a:0 "Nous devons décider pour éviter un gouvernement communiste."

 formed_peru_bolivia:0 "A formé le Pérou-Bolivie"
 PRU_no_peru_bolivia:0 "Vous êtes un gouvernement monarchique"
 PRU_no_inca_peru_bolivia:0 "Vous êtes l’Empire inca"

 peru.24:0 "Le problème de l’APRA"
 peru.24.t:0 "Le problème de l’APRA"
 peru.24.d:0 "Depuis sa fondation en 1924, le parti apriste s’emploie à semer la terreur dans tout le pays et à imposer par la force son idéologie socialiste. Ses militants sont nombreux et nous ne pouvons le combattre frontalement sans déclencher une sanglante guerre civile.\nNos seules options sont de tenter de collaborer avec lui pour un gouvernement stable, ou de le déclarer directement subversif et l’interdire — au risque de débordements dans les villes contrôlées par les Apristes."
 peru.24.a:0 "Le parti apriste doit être interdit."
 peru.24.b:0 "Nous n’avons d’autre choix que de travailler avec les Apristes."

 peru.25:0 "L’élection de 1945"
 peru.25.t:0 "L’élection de 1945"
 peru.25.d:0 "Comme il sied à notre pays démocratique, le président [PRU.GetLeader] convoque des élections générales pour choisir le prochain dirigeant du Pérou. Parmi les candidats : le centriste José Bustamante y Rivero, qui cherche les voix apristes en promettant plusieurs postes ; et le héros de guerre Eloy Ureta, vainqueur de 1941, dont les tactiques ont mené le Pérou à une grande victoire au nord — mais dont les idées radicales du passé pourraient l’associer au fascisme désormais vaincu en Europe."
 peru.25.a:0 "Victoire du Frente Democrático Nacional."
 peru.25.b:0 "Victoire du Frente Patriótico."

 peru.27:0 "L’élection de 1939"
 peru.27.t:0 "L’élection de 1939"
 peru.27.d:0 "Comme il sied à notre pays démocratique, le président [PRU.GetLeader] convoque des élections générales pour choisir le prochain dirigeant. Deux candidats : le banquier Manuel Prado Ugarteche, issu d’une des familles les plus riches du Pérou, prône un rapprochement avec les États-Unis et les démocraties européennes afin de garantir un puissant traité de libre-échange ; et José Quesada Larrea, représentant une faction nationaliste affaiblie par l’exil du fondateur de l’Union Révolutionnaire, qui entend mener le Pérou à la neutralité face aux puissances en Europe, tout en pouvant rapidement choisir un camp par nationalisme."
 peru.27.b:0 "Victoire de la Coalición Conservadora."
 peru.27.a:0 "Victoire du Frente Patriótico."

 peru.65:0 "L’élection de 1945"
 peru.65.t:0 "L’élection de 1945"
 peru.65.d:0 "Le peuple péruvien s’apprête à voter lors de l’élection décisive de 1945, qui déterminera l’avenir politique de la nation."
 peru.65.b:0 "Victoire du Partido Democrático Reformista."
 peru.65.a:0 "Victoire du Frente Patriótico."

 peru.66:0 "Réunion avec les chefs communautaires"
 peru.66.t:0 "Réunion avec les chefs communautaires"
 peru.66.d:0 "Une assemblée mémorable réunit les dirigeants des communautés quechuas pour délibérer sur le destin du mouvement naissant. L’air est chargé d’attente et de gravité historique. Les chefs, porteurs de traditions ancestrales, doivent choisir la voie que le Pérou empruntera dans ce creuset de bouleversements : embrasser l’idée d’une suprématie inca, s’inspirant d’un passé glorieux pour forger l’avenir ; soutenir l’établissement de l’Union quechua pour l’unité des peuples indigènes ; ou appuyer une proposition audacieuse — le couronnement d’un nouvel Inca, figure symbolique et puissante pour guider le pays dans cette ère de transformation. Le destin du mouvement est en balance ; les décisions de cette réunion feront l’histoire du peuple quechua."
 peru.66.a:0 "L’idée de la suprématie inca."
 peru.66.b:0 "Donner le pouvoir à l’Union quechua."
 peru.66.c:0 "Soutenir l’idée de couronner un Inca."

 peru.67:0 "Le destin du Reich américain"
 peru.67.t:0 "Le destin du Reich américain"
 peru.67.d:0 "Alors que le paysage géopolitique évolue, l’Inka Reich se trouve à la croisée des chemins quant à sa relation avec le Reich allemand. Le sort de cet État en devenir, dans l’orbite du Reich, est en jeu — moment charnière pour l’orientation future de l’Inka Reich."
 peru.67.a:0 "Nous devons nous unir à notre mère patrie"
 peru.67.b:0 "Nous serons une colonie"

 peru.26:0 "La Revolución Restauradora"
 peru.26.t:0 "La Revolución Restauradora"
 peru.26.d:0 "Le président [PRU.GetLeader] a laissé entrer la peste rouge apriste au gouvernement, troublant les valeurs de la famille péruvienne et la stabilité économique dont nous jouissions. Il est temps que les forces armées agissent avant que les Apristes ne frappent les premiers."
 peru.26.a:0 "Viva el Perú."

 peru.49:0 "Les républicains veulent organiser un coup d’État"
 peru.49.t:0 "Les républicains veulent organiser un coup d’État"
 peru.49.d:0 "La fondation de la monarchie dans le pays a irrité les républicains et les milices apristes. Ils se sont unis pour former l’« Armée restauratrice » et projettent de renverser le gouvernement de [PRU.GetLeader]. Notre dernière ligne de défense est la ville d’Arequipa."
 peru.49.a:0 "Nous les écraserons."

 peru.50:0 "Les républicains veulent organiser un coup d’État"
 peru.50.t:0 "Les républicains veulent organiser un coup d’État"
 peru.50.d:0 "La fondation de la monarchie dans le pays a irrité les républicains et les milices apristes. Ils se sont unis pour former l’« Armée restauratrice » et projettent de renverser le gouvernement de [PRU.GetLeader]. Notre dernière ligne de défense est la ville de Lima."
 peru.50.a:0 "Nous les écraserons."

 peru.51:0 "Les républicains veulent organiser un coup d’État"
 peru.51.t:0 "Les républicains veulent organiser un coup d’État"
 peru.51.d:0 "La fondation de la monarchie dans le pays a irrité les républicains et les milices apristes. Ils se sont unis pour former l’« Armée restauratrice » et projettent de renverser le gouvernement de [PRU.GetLeader]. Notre dernière ligne de défense est la ville de Lima."
 peru.51.a:0 "Nous les écraserons."

 peru.52:0 "L’héritage de Karl Lamp"
 peru.52.t:0 "L’héritage de Karl Lamp"
 peru.52.d:0 "Karl Lamp arriva au Pérou en 1867 et s’installa dans le district de Paucartambo, à Cuzco. À son arrivée, les indigènes le prirent pour une divinité et le proclamèrent Viracocha. Il vécut parmi eux et travailla à leurs côtés. Les natifs de l’actuel empire inca attendent toujours le retour du dieu « Inkari ». Envoyer un prince allemand pourrait raviver ce sentiment."
 peru.52.a:0 "Nous enverrons Karl Franz"
 peru.52.b:0 "Karl Lamp était un fou"

 peru.53:0 "Karl Franz arrive au Pérou"
 peru.53.t:0 "Karl Franz arrive au Pérou"
 peru.53.d:0 "Le prince allemand Karl Franz est récemment arrivé au port de Callao, où une délégation de l’État inca l’a chaleureusement accueilli. Son arrivée à Lima fut célébrée avec joie, et il y fut considéré comme une figure importante. Il entreprit ensuite un voyage à travers les majestueuses montagnes de Cuzco, explorant les paysages saisissants des Andes péruviennes."
 peru.53.a:0 "Une grande visite, d’un grand pays"

 peru.54:0 "Le retour de l’Inkari"
 peru.54.t:0 "Le retour de l’Inkari"
 peru.54.d:0 "Lors de sa visite dans les Andes péruviennes, le prince Karl Franz est considéré par les Quechuas comme la réincarnation d’Inkari, l’ancienne divinité inca censée revenir quand l’empire a le plus besoin d’être restauré. Aidé d’un interprète, le prince apprend progressivement le quechua pour dialoguer avec les communautés. Ses efforts pour communiquer et se lier aux indigènes entraînent un ralliement croissant à son mouvement."
 peru.54.a:0 "Cela ne menace pas le pouvoir inca"
 peru.54.b:0 "Karl Franz est un grand danger : il doit être expulsé"

 peru.55:0 "Le nouvel Inca"
 peru.55.t:0 "Le nouvel Inca"
 peru.55.d:0 "Une mobilisation significative d’indigènes quechuas et de Créoles de Lima rejoint les milices menées par le prince allemand Karl Franz. Ils parviennent à obtenir des armes par trafic, facilité par l’Empire allemand. Le gouvernement inca se retrouve alors aisément débordé sur de multiples fronts dans tout l’empire."
 peru.55.a:0 "Nous refonderons l’empire inca"

 peru.22:0 "[PRU.GetNameDefCap] soutient le [ROOT.GetFascistParty] pour prendre le pouvoir"
 peru.22.t:0 "[PRU.GetNameDefCap] arme le [ROOT.GetFascistParty] pour prendre le pouvoir"
 peru.22.d:0 "[PRU.GetNameDefCap], de concert avec son allié fasciste [ROOT.GetFascistParty], prépare un coup d’État contre notre gouvernement. Nous ne devons pas laisser les hordes fascistes s’approcher de l’Amérique latine. Préparons-nous contre ces antipatriotes qui veulent apporter la terreur dont le Pérou a été victime aux mains de son dictateur [PRU.GetFascistLeader]. Il est temps de prendre les armes et de mettre fin au soulèvement fasciste."
 peru.22.a:0 "Nous devons agir pour éviter un gouvernement fasciste."

 peru.20:0 "Le Pérou veut peser en Amérique latine"
 peru.20.t:0 "Le Pérou veut peser en Amérique latine"
 peru.20.d:0 "Nous avons des rapports selon lesquels des agents [PRU.getAdjective] sont infiltrés dans plusieurs pays d’Amérique du Sud. Le dictateur [PRU.getAdjective] [PRU.GetLeader] veut répandre son idéologie de terreur dans tout l’hémisphère. Nous n’autoriserons pas les idéologies antidémocratiques à s’emparer de l’Amérique latine."
 peru.20.a:0 "Appliquer des sanctions économiques"
 peru.20.b:0 "C’est le droit des Péruviens"

 peru.21:0 "Les États-Unis viennent de nous sanctionner"
 peru.21.t:0 "Les États-Unis nous ont sanctionnés"
 peru.21.d:0 "Les États-Unis viennent de nous sanctionner économiquement. Cela affectera financièrement de nombreux [PRU.getAdjective]s, mais nous ne céderons pas : c’est la preuve que les actions de notre dirigeant [PRU.GetLeader] entament le moral des Nord-Américains."
 peru.21.a:0 "Nous poursuivrons notre œuvre"

 r56.war_and_peace.2.t:0 "[ECU.GetNameDefCap] nous propose la paix"
 r56.war_and_peace.2.desc:0 "À la faveur de nos récents gains, [ECU.GetNameDefCap] nous propose un accord de paix qui nous cède l’État frontalier disputé. Quelle doit être notre réponse ?"
 r56.war_and_peace.2.a:0 "Nous acceptons"
 r56.war_and_peace.2.b:0 "Non, ils doivent être davantage punis"

 peru.56:0 "La loyauté des Quechuas"
 peru.56.t:0 "La loyauté des Quechuas"
 peru.56.d:0 "Dans l’immensité andine, l’héritage ancestral des Quechuas a traversé les siècles et marque profondément l’identité péruvienne. Pourtant, aux jours tumultueux de la guerre et de la lutte pour la liberté, les Quechuas sont restés dans l’ombre, sans représentation adéquate dans les rangs de l’armée ou de la marine."
 peru.56.a.2:0 "Les Quechuas serviront dans l’armée"
 peru.56.a.1:0 "Peut-être se débrouilleront-ils mieux en mer"

 peru.57:0 "La recherche de nouveaux alliés"
 peru.57.t:0 "La recherche de nouveaux alliés"
 peru.57.d:0 "Au cœur de la résurgence de l’Empire inca, le choix des alliances s’impose comme décision cruciale pour l’avenir de la nation. Deux forces politiques se distinguent : les Nationalistes et les Apristes."
 peru.57.a.1:0 "Les Apristes sont les vrais représentants du peuple"
 peru.57.a.2:0 "Les Nationalistes seront la meilleure option"

 peru.58:0 "Luis Flores rencontre des dirigeants monarchistes"
 peru.58.t:0 "Luis Flores rencontre des dirigeants monarchistes"
 peru.58.d:0 "Lors de cette rencontre décisive, le leader nationaliste péruvien, Luis Flores, s’assoit à la table avec les dirigeants monarchistes en quête d’une alliance stratégique. Les décisions prises résonneront dans l’histoire de la renaissance de l’Empire. Accepterons-nous les propositions de Flores pour renforcer notre mouvement, ou rejetterons-nous son aide pour chercher une autre voie ?"
 peru.58.a.1:0 "Cette alliance renforcera notre mouvement"
 peru.58.a.2:0 "Le mieux est de rejeter les propositions de Flores"

 peru.59:0 "Nos racines péruviennes"
 peru.59.t:0 "Nos racines péruviennes"
 peru.59.d:0 "À l’heure de réfléchir à notre identité nationale, trois approches s’offrent à nous pour définir nos racines. Chacune propose une vision unique de ce que signifie être Péruvien dans le contexte de la résurgence de la Peruanidad. Comment définirons-nous notre identité en ce moment crucial ?"
 peru.59.a.1:0 "Nos racines sont dans l’Empire inca"
 peru.59.a.2:0 "L’hispanisme unit notre nation"
 peru.59.a.3:0 "Notre péruvianité est une culture nouvelle"

 peru.60:0 "Tous servent l’armée"
 peru.60.t:0 "Tous servent l’armée"
 peru.60.d:0 "Dans un appel à la mobilisation nationale, le mot d’ordre est clair : chacun doit servir l’armée. Reste à définir comment s’organisera cette mobilisation et qui en seront les principaux acteurs."
 peru.60.a.1:0 "Le peuple sert l’armée"

 peru.61:0 "Le changement de la Constitution péruvienne"
 peru.61.t:0 "Le changement de la Constitution péruvienne"
 peru.61.d:0 "À un moment charnière, s’impose la nécessité de modifier la Constitution péruvienne. Trois approches différentes se présentent, reflet de visions divergentes de l’avenir politique de la nation. Comment façonnerons-nous la structure de notre gouvernement ?"
 peru.61.a.1:0 "Raviver les idéaux de Sánchez Cerro"
 peru.61.a.2:0 "Donner plus de pouvoir à l’oligarchie de Lima"
 peru.61.a.3:0 "Nous serons généreux avec tous"

