 r56_end_radicalism_in_venezuela:0 "Mettre fin au radicalisme au Venezuela"
 PRU_reforms_in_the_constitution:0 "Réformer la Constitution"
 PRU_reforms_in_the_constitution_desc:0 "La précédente constitution rédigée par Luis Sánchez Cerro n’est plus valable : trop faible, elle encourage l’insurrection populaire et le radicalisme des idéologies extrémistes, tout en livrant les ressources de la nation à l’étranger. Il est nécessaire d’en modifier certains articles pour donner plus de pouvoir au peuple et aux cercles de pouvoir, tout en récupérant nos ressources naturelles."

