 PRU_american_reich:0 "Reich amérindien"
 PRU_american_reich_desc:0 "Unir les nations autochtones des Amériques. Le Reich amérindien, coalition d’États précolombiens, témoigne de la résilience et de l’unité des peuples natifs. Alliant traditions ancestrales et guerre moderne, cette nouvelle superpuissance est prête à remodeler l’histoire de l’hémisphère occidental."

 PRU_recognize_german_power:0 "Reconnaître la puissance allemande"
 PRU_recognize_german_power_desc:0 "Nous devons retourner à la mère patrie. En reconnaissant la puissance industrielle et militaire de l’Allemagne, il revient à notre glorieux chef de décider s’il vaut mieux nous subjuguer ou fusionner nos royaumes avec notre mère patrie."

 PRU_recognize_german_power_2:0 "Reconnaître la puissance allemande"
 PRU_recognize_german_power_2_desc:0 "Nous devons retourner à la mère patrie. En reconnaissant la puissance industrielle et militaire de l’Allemagne, il revient à notre glorieux chef de décider s’il vaut mieux nous subjuguer ou fusionner nos royaumes avec notre mère patrie."

 PRU_A_new_war_machine:0 "Nouvelle machine de guerre andine"
 PRU_A_new_war_machine_desc:0 "En tirant parti de l’ingéniosité des peuples andins et de l’héritage de leurs ancêtres, l’Inka Reich a conçu un nouveau type de machine de guerre, mariant secrets métallurgiques traditionnels et technologie moderne pour créer une force redoutable sur le champ de bataille."

