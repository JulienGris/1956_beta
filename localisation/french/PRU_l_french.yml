 PRU_fauccet:0 "Faucett Perú"
 PRU_Famesac:0 "Fábrica de Armas y Municiones del Ejército S.A.C."

 PRU_the_problem_of_the_quechuas:0 "La question des Quechuas"
 PRU_the_problem_of_the_quechuas_desc:0 "Traiter les difficultés propres au peuple quechua, essentielles à notre renaissance inca. Cet axe recherche des solutions conformes à notre vision d’un Pérou uni, où les Quechuas jouent un rôle vital dans l’édification de notre empire renaissant."

 PRU_the_owners_of_the_mountains:0 "Les maîtres des montagnes"
 PRU_the_owners_of_the_mountains_desc:0 "Donner pouvoir et unité au peuple quechua, véritables gardiens de nos montagnes. Poser les fondations d’un Empire inca jaillissant du cœur des Andes, fort et résilient."

 PRU_the_rebel_inca:0 "L’Inca rebelle"
 PRU_the_rebel_inca_desc:0 "Libérer l’esprit de l’Inca rebelle, en canalisant la résilience de notre héritage. Allumer une flamme qui traverse le temps et propulse le Pérou vers un avenir façonné par la force de notre antique légende."

 PRU_negotiate_with_communal_chiefs:0 "Négocier avec les chefs communautaires"
 PRU_negotiate_with_communal_chiefs_desc:0 "Entamer des dialogues diplomatiques avec les chefs communautaires pour favoriser la collaboration d’un Pérou uni. Combler les fossés et renforcer les liens afin que la résurgence inca s’érige sur l’unité et des aspirations partagées."

 PRU_runan_caycu:0 "Runan Caycu"
 PRU_runan_caycu_desc:0 "Emprunter la voie de Runan Caycu, l’expansion de la vie, en alignant nos ambitions sur l’esprit de l’Empire inca. Saisir les opportunités à venir tandis que nous traçons un destin à la mesure de la grandeur de notre empire."

 PRU_appoint_new_quechua_soldiers:0 "Nommer de nouveaux généraux quechuas"
 PRU_appoint_new_quechua_soldiers_desc:0 "Élever le peuple quechua à des postes de commandement. En nommant de nouveaux généraux quechuas, nous renforçons nos forces armées et honorons la fierté de la nation, en marchant vers la victoire avec des chefs incarnant l’esprit de l’Empire inca."

 PRU_the_inca_congress:0 "Le Congrès inca"
 PRU_the_inca_congress_desc:0 "Établir le Congrès inca, forum d’unité et de coopération. Rassemblés sous sa bannière, que notre force conjuguée guide l’empire vers un avenir de grandeur."

 PRU_superiority_of_the_copper_race:0 "Supériorité de la race cuivrée"
 PRU_superiority_of_the_copper_race_desc:0 "Propager l’idéal de la supériorité de la race cuivrée, insuffler fierté et unité à notre peuple. Notre « race maîtresse » alimente la résurgence de l’Empire inca, en embrassant les forces uniques qui définissent notre nation et tracent la voie vers la grandeur."

 PRU_secure_the_future_of_the_nation:0 "Assurer l’avenir de la nation"
 PRU_secure_the_future_of_the_nation_desc:0 "Face à la menace que représente le colonialisme hispanique, nous devons prendre des mesures garantissant la survie des traditions qui font notre identité. Nous viserons non seulement la survie, mais la prospérité, en réclamant l’héritage culturel inca !"

 PRU_illapa_the_thunder_of_the_andes:0 "Illapa, le tonnerre des Andes"
 PRU_illapa_the_thunder_of_the_andes_desc:0 "Invoquer l’esprit d’Illapa, le tonnerre des Andes, pour électriser la nation. Puiser dans la puissance des symboles incas afin d’enflammer une ferveur qui projette l’État inca vers un avenir où résonne, avec force et gloire, l’écho de notre héritage."

 PRU_the_true_owners_of_america:0 "Les véritables maîtres de l’Amérique"
 PRU_the_true_owners_of_america_desc:0 "Affirmer les Quechuas comme véritables dépositaires de l’héritage américain. Reprenons notre place légitime et préservons la riche trame de notre patrimoine des influences extérieures."

 PRU_liberate_the_indigenous_people_of_america:0 "Libérer les peuples autochtones d’Amérique"
 PRU_liberate_the_indigenous_people_of_america_desc:0 "Porter l’étendard de la libération des nations autochtones du continent. Notre engagement pour l’unité, la justice et la souveraineté vise à autonomiser et élever nos frères autochtones pour une Amérique véritablement libérée."

 native_american_peoples_alliance:0 "Alliance des peuples amérindiens"
 native_axis:0 "Axe autochtone"
 native_alliance:0 "Alliance autochtone"

 PRU_red_pachamama:0 "Pachamama rouge"
 PRU_red_pachamama_desc:0 "Épouser la vision de Pachamama rouge, en tissant les idéaux communistes au cœur de notre héritage inca. Chercher une coexistence harmonieuse unissant le peuple sous la bannière de la prospérité partagée et du bien-être collectif, sur la voie d’un Empire inca véritablement égalitaire."

 PRU_Collectivize_the_land:0 "Collectiviser la terre"
 PRU_Collectivize_the_land_desc:0 "Lancer la révolution collective des terres en redistribuant la propriété pour le bien commun. Affirmer notre engagement envers la prospérité communautaire en partageant équitablement les richesses sacrées de notre sol et en façonnant une société inca unie et communiste."

 PRU_revolutionary_andes:0 "Andes révolutionnaires"
 PRU_revolutionary_andes_desc:0 "Allumer la flamme de la révolution andine en unissant le peuple vers le communisme. Entreprendre un changement de fond, où l’égalité et la solidarité dessinent un nouvel avenir inca."

 PRU_unified_by_will:0 "Unis par la volonté"
 PRU_unified_by_will_desc:0 "Les peuples amérindiens sont désormais unis par nos efforts anti-impérialistes, mais cela ne suffit pas. Si nous voulons repousser les invasions européennes pour les siècles à venir, nous devons nous fédérer et former une seule nation pour tous, unie par la volonté de ne pas être gouvernée par les Européens."

 PRU_unified_in_spirit:0 "Unis par l’esprit"
 PRU_unified_in_spirit_desc:0 "Animés d’un même objectif, nous œuvrons de concert, tel un mécanisme bien huilé. Sans fusionner nos États, nous devons viser des armées combinées et une coordination accrue. Les peuples d’Amérique sont unis par l’esprit et se tiendront toujours côte à côte !"

 PRU_incaism_idea:0 "Incaïsme"
 PRU_incaism_idea_1:0 "Incaïsme"
 PRU_incaism_idea_2:0 "Fierté néo-inca"
 PRU_a_new_pride:0 "Une nouvelle fierté nationale"
 PRU_poor_republic:0 "République instable"
 PRU_weak_republic:0 "République faible"
 PRU_weak_republic_1:0 "République faible"
 PRU_weak_republic_2:0 "République faible"
 PRU_conservative_republic:0 "République conservatrice"
 PRU_socialist_republic:0 "République socialiste"
 PRU_communist_republic:0 "République communiste"

 PRU_hit_venezuela:0 "Mettre fin au rêve bolivarien"
 PRU_hit_venezuela_desc:0 "Sans histoire commune, la volonté d’unir les peuples bolivariens sous un même État en s’appropriant des parties de notre territoire, comme la région de Loreto, représente une grave menace pour tout le peuple [ROOT.getAdjective]. Si nous voulons protéger notre sécurité nationale, nous devons éradiquer le rêve bolivarien."

 PRU_hit_ecuador:0 "Sécuriser les Andes"
 PRU_hit_ecuador_desc:0 "Pour obtenir la victoire totale, [ROOT.GetLeader] doit sécuriser entièrement les Andes, la République de [ECU.GetNameDefCap] demeurant une menace qui viendra sans cesse mordre la botte de notre pays si nous ne l’éliminons pas."
l_french:
 PRU_look_to_the_past:0 "Reporter les élections"
 PRU_look_to_the_past_desc:0 "L’État n’a pas su résoudre les problèmes sociaux et économiques qui ont plongé le Pérou dans une profonde crise dont nous ne sommes pas sortis. Le mieux serait que Benavides quitte le pouvoir et qu’une autre forme de gouvernement soit envisagée."

 PRU_delay_elections:0 "Qu’est-ce que notre pays ?"
 PRU_delay_elections_desc:0 "Les voix de la nation s’élèvent dans un chœur de questions fondamentales. Qu’est-ce qui définit le Pérou ? Est-ce la terre, l’histoire, le peuple ? Tandis que les dirigeants débattent et que la population attend, les élections sont repoussées afin de trouver une réponse collective. Cette période d’introspection nationale pourrait être décisive pour l’avenir du pays et son identité sur la scène mondiale."

 PRU_invite_carlos:0 "Héritiers du vice-royaume"
 PRU_invite_carlos_desc:0 "Nous devons nous souvenir de notre passé hispanique, de notre époque de plus grande prospérité sous l’autorité d’un roi. La république a détruit les valeurs traditionnelles du Pérou ; il est donc temps de tourner le dos à cette histoire. ¡Viva El Rey !"

 PRU_appoint_a_peruvian_monarch:0 "Mettre fin à la république corrompue"
 PRU_appoint_a_peruvian_monarch_desc:0 "Le moment est venu de balayer les vestiges d’une république corrompue qui a trop longtemps accablé notre nation. Un monarque péruvien s’élèvera, annonçant une nouvelle ère de gouvernance. Cet acte décisif promet de réparer le paysage politique fracturé et d’unir le peuple sous une bannière d’espoir et de prospérité renouvelés."

 PRU_crown_an_inca:0 "Couronner un Inca"
 PRU_crown_an_inca_desc:0 "Le politicien José Bustamante y Rivero, descendant de l’un des plus grands Incas de l’histoire, Huayna Capac, doit être couronné Huayna Capac II en mémoire de notre passé inca."

 PRU_restore_the_viceroyalty_system:0 "Restaurer le système du vice-royaume"
 PRU_restore_the_viceroyalty_system_desc:0 "L’ancien système vice-royal a été anéanti par l’idéologie républicaine, qui a apporté ruine et retard au Pérou. C’est la mission du roi de restaurer les racines de notre empire."

 PRU_royal_haciendas:0 "Haciendas royales"
 PRU_royal_haciendas_desc:0 "Le système des Haciendas royales sera chargé de contrôler et de gérer la collecte des impôts, une nécessité après l’ère républicaine marquée par la corruption et l’informalité."

 PRU_labour_reforms:0 "Réforme du travail"
 PRU_labour_reforms_desc:0 "Le système du travail péruvien est un désastre total, dirigé depuis sa création par un système informel archaïque et corrompu. La situation changera bientôt grâce aux nouvelles réformes du travail."

 PRU_create_orejones_battalions:0 "Former les bataillons Orejones"
 PRU_create_orejones_battalions_desc:0 "Les Orejones furent jadis les unités d’élite de l’Empire inca, des hommes prêts à mourir pour le Sapa Inca et à tout donner sur le champ de bataille."

 PRU_recreate_the_Inca_farming_system:0 "Recréer le système agricole inca"
 PRU_recreate_the_Inca_farming_system_desc:0 "La culture en terrasses était une invention avancée des Incas qui permettait de cultiver sur des terrains escarpés comme ceux de la cordillère des Andes. Ce système, exploitant chaque espace, mettra fin à la famine des populations les plus pauvres du Pérou."

 PRU_the_Quechuas_into_the_army:0 "Intégrer les Quechuas dans l’armée"
 PRU_the_Quechuas_into_the_army_desc:0 "Par le passé, les Quechuas furent privés de droits et réduits à la servitude pour les oligarches. Il est temps d’intégrer les Quechuas à la force industrielle et militaire du pays, afin de donner plus de puissance au mouvement politique."

 PRU_form_the_royal_guard_of_Peru:0 "Former la Garde royale du Pérou"
 PRU_form_the_royal_guard_of_Peru_desc:0 "La Compagnie des hallebardiers de la Garde royale du vice-roi fut créée en 1551 par Antonio de Mendoza. Depuis le XVIᵉ siècle, sa mission était de protéger le vice-roi, maintenir l’ordre public et intervenir contre les bandits."

 PRU_militarize_the_homeland:0 "Militariser la patrie"
 PRU_militarize_the_homeland_desc:0 "Notre pays n’a pas suffisamment d’armes pour se défendre contre ses multiples ennemis. Il est nécessaire de réarmer nos forces et d’appeler tous les [ROOT.getAdjective]s à la guerre."

 PRU_inca_heavy_industry:0 "Industrie lourde inca"
 PRU_inca_heavy_industry_desc:0 "Il est du devoir de tous les citoyens incas de soutenir l’empire et son industrialisation. Une contribution monétaire sera collectée afin de financer l’industrie lourde nécessaire à notre développement."

 PRU_restore_the_kanchas:0 "Restaurer les Kanchas"
 PRU_restore_the_kanchas_desc:0 "Le système familial dit « Kancha » était une division sociale inca regroupant les familles pour travailler la terre, une forme de collectivisation du sol, tout en maintenant certaines obligations comme la mita minière ou la minka, un système de travail forcé."

 PRU_knights_of_the_new_world:0 "Chevaliers du Nouveau Monde"
 PRU_knights_of_the_new_world_desc:0 "L’héritage des Conquistadors reste gravé dans nos mémoires. Ces hommes fondèrent ce grand empire, en faisant l’un des plus riches de la région."

 PRU_nationalize_the_industry:0 "Nationaliser l’industrie"
 PRU_nationalize_the_industry_desc:0 "[PRU.GetLeader] exige que l’industrie lourde [ROOT.getAdjective] appartienne à l’État, car il est inacceptable que la majorité de notre production minière et de notre force de travail profite à d’autres."

 PRU_give_arms_to_the_people:0 "Brigades anti-athées"
 PRU_give_arms_to_the_people_desc:0 "La population péruvienne armée pourra repousser les hordes ennemies du nouvel empire qui vient de naître."

 PRU_call_british_sailors:0 "Engager des spécialistes navals"
 PRU_call_british_sailors_desc:0 "Nos capacités et technologies navales sont limitées. Il est nécessaire de convaincre une puissance étrangère de nous aider à bâtir une flotte puissante."

 PRU_adquire_american_industry:0 "Inviter l’industrie américaine"
 PRU_adquire_american_industry_desc:0 "[ROOT.GetLeader] cherche de nouveaux capitaux nationaux et internationaux afin de renforcer notre industrie."

 PRU_viva_el_rey:0 "Viva el Rey"
 PRU_viva_el_rey_desc:0 "Le Roi du Pérou apportera des avancées militaires et sociales pour moderniser une société andine en retard. Il est temps d’étendre notre nouvel empire au-delà de nos frontières et de retrouver la gloire du « Gran Perú » d’autrefois."

 PRU_secure_the_coast:0 "Sécuriser la côte"
 PRU_secure_the_coast_desc:0 "Notre littoral est vulnérable à cause de la faiblesse de nos forces navales. [ROOT.GetLeader] a conçu un projet de « mur du Pacifique » pour prévenir tout débarquement dans nos grandes villes."

 PRU_restore_the_borders_of_the_empire:0 "Restaurer les frontières de l’empire"
 PRU_restore_the_borders_of_the_empire_desc:0 "L’ancien empire des Quatre Suyos — Collasuyo, Antisuyo, Cuntisuyo et Chinchasuyo — doit être restauré dans son intégralité."

 PRU_establish_the_mitimaes:0 "Établir les Mitimaes"
 PRU_establish_the_mitimaes_desc:0 "L’ancienne tactique inca dite des « mitimaes » consistait à déplacer des communautés entières pour briser leur identité et les remplacer par de nouveaux colons. Nous rétablirons ce système pour mieux contrôler notre territoire."

 PRU_total_victory:0 "Victoire totale"
 PRU_total_victory_desc:0 "Nos récentes victoires sur tous les fronts et la restauration de nos frontières ancestrales apportent une grande popularité au gouvernement de [ROOT.GetLeader]."

 PRU_secure_the_andes:0 "Sécuriser les Andes"

 PRU_expel_europeans_from_south_america:0 "Expulser les Européens d’Amérique du Sud"
 PRU_expel_europeans_from_south_america_desc:0 "La présence persistante des puissances maritimes européennes sur notre continent est inacceptable. Tout comme nous avons chassé l’Espagne du Nouveau Monde, toutes les autres puissances seront à leur tour expulsées !"

 PRU_reclaim_spain:0 "Réclamer l’Espagne"
 PRU_reclaim_spain_desc:0 "La descendance espagnole de [ROOT.GetLeader] lui confère, aux yeux des Péruviens, la légitimité de revendiquer le trône d’Espagne et d’unifier les États hispano-américains avec les territoires espagnols comme par le passé."

 PRU_secure_brazil:0 "Sécuriser le Brésil"
 PRU_secure_brazil_desc:0 "Nos rapports indiquent que [BRA.GetLeader] complote contre nous. Il est du devoir de [ROOT.GetLeader] de prendre les mesures défensives adéquates et, si possible, de frapper nos ennemis avant qu’ils ne lancent leur attaque."

 PRU_reclaim_portugal:0 "Revendiquer le Portugal"
 PRU_reclaim_portugal_desc:0 "Le passé du Portugal, ayant fait partie de l’Espagne, donne à notre roi le pouvoir de revendiquer le trône portugais afin de l’unir à notre puissant empire."

 PRU_reclaim_chile:0 "Revendiquer le Chili"
 PRU_reclaim_chile_desc:0 "Après la guerre du Pacifique, notre armée et notre marine furent complètement vaincues. La soif de revanche née de cette défaite a grandi chez les nouvelles générations, nourrie par le nationalisme et attisée par [ROOT.GetLeader]. L’heure de la vengeance pour reprendre nos territoires perdus approche."

 PRU_huayna_capac_heritage:0 "Héritage de Huayna Capac"
 PRU_huayna_capac_heritage_desc:0 "Le lieu de naissance de notre chef presque légendaire est aux mains de ceux qui n’y ont aucun droit ! Il est temps de reprendre nos terres légitimes en Équateur !"

 PRU_integrate_the_northern_realm:0 "Intégrer le Royaume du Nord"
 PRU_integrate_the_northern_realm_desc:0 "Avec notre contrôle désormais total sur les territoires équatoriens, nous pourrons intégrer ces régions à notre domaine."

 PRU_retake_antofagasta:0 "Reprendre Antofagasta"
 PRU_retake_antofagasta_desc:0 "Sécuriser la côte est l’un de nos principaux objectifs pour reprendre les territoires perdus face aux colonisateurs du Sud."

 PRU_unite_with_diaguita_and_toconote:0 "Unir les Diaguitas et les Toconotés"
 PRU_unite_with_diaguita_and_toconote_desc:0 "Les peuples indigènes de la région de Tucumán souffrent sous la domination argentine. Nous devons tout mettre en œuvre pour assurer leur sécurité en ces temps dangereux, par tous les moyens nécessaires."

 PRU_secure_the_southern_Andes:0 "Sécuriser les Andes du Sud"
 RU_secure_the_southern_Andes_desc:0 "La zone méridionale des Andes, composée principalement des montagnes de Bolivie, du Chili et d’Argentine, doit revenir à son propriétaire légitime : l’Empire inca."

 PRU_reclaim_venezuela:0 "Revendiquer le Venezuela"
 PRU_reclaim_venezuela_desc:0 "Sans histoire commune, la volonté d’unir les peuples bolivariens en prenant des parties de notre territoire, comme la région de Loreto, représente une menace majeure pour tout le peuple [ROOT.getAdjective]. Pour protéger notre sécurité nationale, nous devons éradiquer le rêve bolivarien."

 PRU_reclaim_ecuador:0 "Revendiquer l’Équateur"
 PRU_reclaim_ecuador_desc:0 "Pour parvenir à une victoire totale, [ROOT.GetLeader] doit sécuriser complètement les Andes, car la République de [ECU.GetNameDefCap] demeure une menace qui mordra sans cesse la botte de notre pays si nous ne l’éliminons pas."

 PRU_reclaim_colombia:0 "Revendiquer la Colombie"
 PRU_reclaim_colombia_desc:0 "Après la brève guerre de Leticia contre [COL.GetNameDefCap] et l’abandon du trapèze amazonien par l’antipatriotisme d’Oscar Benavides, il est temps de récupérer nos territoires sous le commandement de [ROOT.GetLeader], qui mènera le Pérou à une grande victoire et rétablira nos frontières originelles."

 PRU_secure_the_north:0 "Sécuriser le Nord"
 PRU_secure_the_north_desc:0 "Les territoires de l’ancienne Grande Colombie peuvent être regroupés en province au sein de notre empire, évitant ainsi le séparatisme des populations locales."

 PRU_reclaim_paraguay:0 "Revendiquer le Paraguay"
 PRU_reclaim_paraguay_desc:0 "Nous devons unifier les derniers territoires à notre puissant empire. Aucun pays d’Amérique du Sud ne peut résister à notre immense pouvoir."

 PRU_reclaim_uruguay:0 "Revendiquer l’Uruguay"
 PRU_reclaim_uruguay_desc:0 "La province du Río de la Plata exige que l’Uruguay soit intégré à notre empire."

 PRU_create_apra:0 "Consolider l’Aprisme"
 PRU_create_apra_desc:0 "La grande alliance de tous les peuples d’Amérique du Sud créera un autre bloc socialiste qui défendra réellement leurs droits. Les enseignements de Víctor Raúl Haya de la Torre sont encore vivants dans ce mouvement né au Mexique et aujourd’hui étendu à toute l’Amérique."

 PRU_revive_the_bolivarian_dream:0 "Raviver le Rêve Bolivarien"
 PRU_revive_the_bolivarian_Dream_desc:0 "Le sentiment bolivarien permettra d’apaiser les populations des territoires conquis au Nord, car grâce à notre conquête, les terres de la Grande Colombie sont à nouveau unifiées."

 PRU_liberate_brazil:0 "Libérer le Brésil"
 PRU_liberate_brazil_desc:0 "La dictature de [BRA.GetLeader] est allée trop loin dans ses crimes contre sa population. Il est nécessaire que le peuple de [BRA.GetNameDefCap] se soulève avec l’aide de notre armée."

 PRU_liberate_cub:0 "Libérer Cuba"
 PRU_liberate_cub_desc:0 "Pendant de longues années, l’île des Caraïbes a toujours été une base militaire américaine. Notre devoir est de chasser le grand démon capitaliste des îles et d’y instaurer un gouvernement populaire représentant le peuple cubain."

 PRU_intervention_in_brazil:0 "Intervention au Brésil"
 PRU_intervention_in_brazil_desc:0 "[BRA.GetLeader] mène le Brésil à la ruine et entre les mains de nos pires ennemis. Notre devoir, en tant que puissance régionale, est d’imposer notre volonté et de sécuriser nos frontières par une intervention militaire. Il ne peut y avoir qu’un seul colosse en Amérique du Sud."

 PRU_Create_the_Gran_Colombian_provinces:0 "Créer les Provinces de la Grande Colombie"
 PRU_Create_the_Gran_Colombian_provinces_desc:0 "Le sentiment bolivarien permettra d’apaiser les populations des territoires conquis au Nord, car grâce à notre conquête, les terres de la Grande Colombie sont à nouveau unifiées."

 PRU_secure_plata_states:0 "Sécuriser les États du Plata"
 PRU_secure_plata_states_desc:0 "Les États de l’ancien vice-royaume du Río de la Plata doivent être assimilés comme provinces afin de garder leur population sous contrôle. Ces territoires pourraient renforcer la puissance militaire du Grand Pérou."

 PRU_Draw_our_southern_borders:0 "Tracer nos Frontières du Sud"
 PRU_Draw_our_southern_borders_desc:0 "Notre Grand Empire requiert les territoires du Sud pour retrouver ses frontières ancestrales, celles de l’Empire inca et du vice-royaume du Pérou. Un puissant empire impose sa volonté. Viva el Perú !"

 PRU_reclaim_bolivia:0 "Revendiquer la Bolivie"
 PRU_reclaim_bolivia_desc:0 "La trahison commise par [BOL.GetNameDefCap] envers [ROOT.GetNameDefCap] ne peut être oubliée. Nous devons unifier tous les peuples quechuas sous la direction de [ROOT.GetLeader]."

 PRU_integrate_the_Quechuas_into_the_army:0 "Intégrer les Quechuas dans l’Armée"
 PRU_integrate_the_Quechuas_into_the_army_desc:0 "Par le passé, les Quechuas furent privés de droits et réduits à une simple servitude pour les oligarches. Il est temps d’intégrer les Quechuas à la force industrielle et politique de la nation."

 PRU_ask_for_a_loan_to_germany:0 "Demander un Prêt à l’Allemagne"
 PRU_ask_for_a_loan_to_germany_desc:0 "En période d’incertitude économique, le Pérou a décidé de solliciter l’Allemagne pour obtenir un prêt substantiel. Celui-ci sera crucial pour financer divers projets de développement et renforcer l’économie péruvienne. Les négociations sont en cours et leur issue pourrait avoir un impact majeur sur l’avenir financier du pays."

 PRU_new_world_army:0 "Armée du Nouveau Monde"
 PRU_new_world_army_desc:0 "Sous le règne du Sapa Inca germanique, chef visionnaire de l’Inka Reich, la Force impériale inca incarne notre force et notre unité retrouvées. Ensemble, nous remodelerons le Nouveau Monde, forgeant un destin à la mesure de notre grandeur impériale."

 PRU_call_hans:0 "Appeler les Généraux Allemands"
 PRU_call_hans_desc:0 "Faisons venir Hans Kundt et Rudiger, stratèges de renom, afin de renforcer notre puissance militaire. La Force impériale inca sera fortifiée et notre vision impériale s’accomplira avec éclat sur la scène du Nouveau Monde."

 PRU_continue_leguias_plan:0 "Poursuivre le Plan de Leguía"
 PRU_continue_leguias_plan_desc:0 "L’héritage du plan économique du président Augusto Leguía pèse encore sur le Pérou. Le prolonger signifie maintenir l’accent sur le développement des infrastructures, l’industrialisation et la croissance. Ainsi, le Pérou espère assurer un avenir stable et prospère à son peuple, malgré les défis et l’opposition politique."

 PRU_imitate_the_Soviet_model:0 "Imiter le Modèle Soviétique"
 PRU_imitate_the_Soviet_model_desc:0 "Le Pérou a décidé de prendre l’Union soviétique comme modèle de développement économique. Suivre son approche signifie privilégier la propriété étatique des industries clés et la planification centrale. L’objectif est une industrialisation rapide et l’autosuffisance, mais cette voie pourrait entraîner des conflits idéologiques et des tensions internationales."

 PRU_stable_monetary_policy:0 "Politique de Redressement Économique"
 PRU_stable_monetary_policy_desc:0 "La mise en œuvre d’une politique monétaire stable est essentielle pour garantir la sécurité financière et la stabilité économique du Pérou. En contrôlant l’inflation, la masse monétaire et les taux d’intérêt, nous attirerons les investissements, stimulerons la croissance et protégerons le bien-être des citoyens."

 PRU_the_pan-american_highway:0 "La Route Panaméricaine"
 PRU_the_pan-american_highway_desc:0 "L’ambitieux projet de construction de la route panaméricaine traversant le Pérou est en cours. Cette voie transcontinentale reliera notre pays à ses voisins et facilitera les échanges. Sa réalisation demandera d’énormes efforts en main-d’œuvre, en ingénierie et en ressources financières."

 PRU_forced_industrialization:0 "Industrialisation Forcée"
 PRU_forced_industrialization_desc:0 "Le Pérou s’engage dans une politique d’industrialisation forcée afin de transformer rapidement son économie. Cette approche implique une intervention étatique, des incitations aux industries nationales et une réglementation stricte. Elle pourrait permettre une croissance rapide mais nécessitera des ressources importantes et pourrait susciter des résistances."

 PRU_expanded_industrial_region:0 "Expansion de la Région Industrielle"
 PRU_expanded_industrial_region_desc:0 "Le Pérou a de grands projets d’expansion industrielle, ouvrant de nouvelles zones pour usines et manufactures. Cela doit créer des emplois et stimuler le développement, mais exigera une planification et des investissements en infrastructures conséquents."

 PRU_our_natural_resources:0 "Ressources Naturelles"
 PRU_our_natural_resources_desc:0 "Les abondantes ressources naturelles du Pérou, qu’elles soient minières ou agricoles, sont au cœur de notre stratégie. Leur exploitation peut générer des revenus considérables, mais doit être gérée correctement face aux enjeux environnementaux et aux fluctuations du marché international."

 PRU_the_peruvian_industry:0 "Industrie Péruvienne"
 PRU_the_peruvian_industry_desc:0 "Le développement du secteur industriel est une priorité pour réduire la dépendance aux importations, créer des emplois et bâtir une économie autosuffisante. Le soutien aux industries locales et la promotion de la recherche font partie de cette vision."

 PRU_create_antamina:0 "Fonder Antamina"
 PRU_create_antamina_desc:0 "La création du projet minier Antamina marque une avancée majeure pour l’industrie extractive péruvienne. Ce vaste chantier nécessitera capitaux, technologies et expertise. Son succès pourrait transformer l’économie du pays et améliorer sa position mondiale."

 PRU_the_second_rubber_rush:0 "Deuxième Ruée vers le Caoutchouc"
 PRU_the_second_rubber_rush_desc:0 "Une nouvelle ruée vers le caoutchouc s’annonce au Pérou. Dans la lignée du boom du début du XXe siècle, l’objectif est cette fois d’exploiter cette ressource efficacement et durablement, apportant prospérité à la région."

 PRU_create_the_BCR:0 "Créer la BCR"
 PRU_create_the_BCR_desc:0 "La fondation de la Banque Centrale de Réserve marque un tournant dans l’histoire financière du Pérou. Cette institution gèrera la politique monétaire, régulera les marchés et protégera la stabilité nationale. Sa création modernise le secteur financier."

 PRU_the_black_gold_of_the_amazon:0 "L’Or Noir de l’Amazonie"
 PRU_the_black_gold_of_the_amazon_desc:0 "L’Amazonie recèle un immense potentiel pétrolier. Exploiter cet « or noir » promet d’énormes bénéfices mais soulève aussi des inquiétudes sur l’environnement et les droits des peuples autochtones. L’avenir de l’Amazonie pourrait dépendre de cette entreprise."

 PRU_Acquire_Japanese_weapons:0 "Acquérir des Armes Japonaises"
 PRU_Acquire_Japanese_weapons_desc:0 "Pour renforcer nos forces armées, le gouvernement péruvien a décidé d’examiner la possibilité d’acquérir des armes japonaises. Ce partenariat stratégique pourrait nous fournir les outils nécessaires pour assurer la sécurité nationale."

 PRU_Promote_immigration:0 "Promouvoir l’Immigration"
 PRU_Promote_immigration_desc:0 "Le gouvernement envisage activement de promouvoir l’immigration. Cependant, l’élection du leader nationaliste déterminera la direction de cette politique : attirer des immigrants italiens avec Alberto Flores, ou poursuivre l’immigration japonaise avec Eloy Ureta ?"

 PRU_return_of_the_inkari:0 "Retour de l’Inkari"
 PRU_return_of_the_inkari_desc:0 "Le Retour de l’Inkari symbolise l’attendu retour du souverain inca mythique, porteur de l’espoir d’une restauration et d’un renouveau de l’Empire inca. Ce concept évoque un lien profond avec les traditions ancestrales et l’attente d’une renaissance historique."

 PRU_the_new_royal_road:0 "La Nouvelle Route Royale"
 PRU_the_new_royal_road_desc:0 "Projet moderne visant à restaurer le réseau routier inca historique. Cette entreprise ambitieuse facilitera échanges culturels et commerce tout en honorant l’héritage inca. Elle servira aussi à la mobilisation militaire."

 PRU_the_pact_of_lima:0 "Le Pacte de Lima"
 PRU_the_pact_of_lima_desc:0 "Il symbolise l’alliance entre l’Inkaiserreich et l’Empire allemand. Ce partenariat unique cherche à promouvoir les échanges culturels, économiques et militaires, renforçant la coopération et la prospérité mutuelles."

 PRU_das_inkareich:0 "Das Inkareich"
 PRU_das_inkareich_desc:0 "\"Das Inkareich\" est la traduction allemande de « l’Empire inca ». Elle renvoie à la grande civilisation andine avant la conquête espagnole, symbole de grandeur, d’infrastructures avancées et d’une organisation sociale complexe."

 PRU_claim_the_habsburg_territories:0 "Revendiquer les Territoires des Habsbourg"
 PRU_claim_the_habsburg_territories_desc:0 "La grandeur de l’ancien empire des Habsbourg doit être restaurée sous le drapeau péruvien. Nous cherchons à reprendre les territoires historiques de cette dynastie."

 PRU_claim_the_portuguese_empire:0 "Revendiquer l’Empire Portugais"
 PRU_claim_the_portuguese_empire_desc:0 "Les possessions portugaises en Amérique du Sud représentent une occasion unique d’étendre notre empire. Il est temps de réclamer ce qui nous revient de droit."

 PRU_restore_the_colombia_empire:0 "Restaurer l’Empire Colombien"
 PRU_restore_the_colombia_empire_desc:0 "La gloire de l’ancienne Grande Colombie doit être ravivée. Nous voulons restaurer sa grandeur et son unité sous domination péruvienne."

 PRU_restore_the_argentina_empire:0 "Restaurer l’Empire Argentin"
 PRU_restore_the_argentina_empire_desc:0 "L’Argentine fut jadis une grande puissance sud-américaine. Notre devoir est de restaurer sa grandeur passée et d’établir un empire argentin sous notre direction."

 PRU_america_imperial:0 "Amérique Impériale"
 PRU_america_imperial_desc:0 "Notre destin est de conduire l’Amérique vers une ère de domination impériale. Par l’expansion et l’influence, nous établirons un vaste empire couvrant tout le continent."

 PRU_another_country:0 "Un autre pays a déjà informé les États-Unis."
 PRU_people_expecting_us_to_beat_ecuador:0 "Le peuple doute de notre capacité à conquérir l’Équateur"
