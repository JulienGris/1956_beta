 PRU_montagne_influence:0 "Influence de Montagne"
 PRU_odria_advisor:0 "Influence d’Odría"
 PRU_friend_aprac:0 "Se lier aux apristes"
 PRU_friend_aprac_desc:0 "Pour stabiliser la nation, il est essentiel d’obtenir le soutien du parti APRA."
 PRU_military_revolution:0 "Révolution militaire"
 PRU_military_revolution_desc:0 "Le Gobierno Revolucionario de las Fuerzas Armadas prône un nationalisme plus péruvien, détaché des doctrines fascistes européennes ; nous avancerons avec notre propre nationalisme."
 PRU_aprismo:0 "Aprisme"
 PRU_Increase_in_Crops:0 "Augmentation des récoltes"
 PRU_aprismo_desc:0 "Le « Sólido Norte » et ses milices nous conduiront à la victoire aux côtés de notre fondateur Víctor Raúl Haya de la Torre."
 PRU_stagnant_economy:0 "Économie stagnante"
 PRU_good_economy:0 "Reprise économique"
 PRU_good_economy_2:0 "Économie forte"
 PRU_stagnant_economy_desc:0 "Après des années de troubles politiques, l’économie nationale a stagné, ralentissant l’industrie et dégradant les infrastructures."
 PRU_defeated_navy:0 "Marine négligée"
 PRU_defeated_navy_desc:0 "Nos navires datent du siècle passé et notre doctrine navale est obsolète. La volonté de les moderniser fait défaut pour l’instant."
 PRU_great_marina:0 "Renaissance de notre marine"
 PRU_apra_revolution:0 "Sentiment subversif"
 PRU_apra_revolution_desc:0 "Les apristes mènent des mouvements subversifs qui causent des destructions."
 PRU_friend_apra:0 "Être amis avec les apristes"
 PRU_friend_apra_desc:0 "Pour stabiliser la nation, il est très nécessaire d’obtenir le soutien du parti APRA."
 PRU_oppresed_apristas:0 "Apristes réprimés"
 PRU_oppresed_apristas_desc:0 "Nous n’avons pas besoin des apristes radicaux pour renforcer la nation ; leurs dirigeants sont en prison et leur mouvement est en passe de disparaître."
 PRU_oppresed_urristas:0 "Urristes réprimés"
 PRU_oppresed_urristas_desc:0 "Nous n’avons pas besoin des urristes radicaux pour renforcer la nation ; leurs dirigeants sont en prison et leur mouvement est en passe de disparaître."
