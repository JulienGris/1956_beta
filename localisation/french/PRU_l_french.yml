 PRU_strengthen_the_industry:0 "Attirer des investissements des États-Unis"
 r56_strengthen_ROOT:0 "Renforcer [FROM.GetName]"
 PRU_end_radicalism_in_america1:0 "Mettre fin au radicalisme en Amérique"

 PRU_the_great_world_revolution:0 "La Grande Révolution Mondiale"
 PRU_the_great_world_revolution_desc:0 "Le parti apriste est arrivé au pouvoir au Pérou et a déclaré son intention de porter sa vision de justice et d’égalité aux quatre coins du globe. Avec ferveur révolutionnaire, le gouvernement péruvien se prépare à étendre son influence et à conquérir des territoires au nom du peuple."

