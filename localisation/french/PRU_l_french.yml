 r56_peru_focus:0 "Arbre des priorités péruvien"
 indigenous_recruiter:0 "Recruteur indigène"
 son_of_the_sun:0 "Fils du Soleil"
 democratic_socialist:0 "Socialiste démocrate"
 PRU_llama_army_tech:0 "Technologie « armée de lamas »"

 PRU_hugo_pesce:0 "Hugo Pesce"
 PRU_roberto_latorre_medina:0 "Roberto Latorre Medina"
 PRU_carlos_miro_quesasa_laos:0 "Carlos Miró-Quesada Laos"
 PRU_javier_luis_calmell_del_solar:0 "Javier Luis Calmell del Solar"
 PRU_francisco_lanatta:0 "Francisco Lanatta"
 PRU_hildebrando_castro_pozo:0 "Hildebrando Castro Pozo"
 PRU_jose_luis_bustamante_rivero:0 "José Luis Bustamante y Rivero"
 PRU_alberto_arca_parro:0 "Alberto Arca Parró"

 PRU_czech_equipment_aquisition:0 "Équipement tchèque"
 PRU_czech_equipment_aquisition_desc:0 "Après la lourde défaite subie durant la guerre du Pacifique en 1883, l’armée [ROOT.getAdjective] est restée affaiblie, l’État ne pouvant supporter de fortes dépenses militaires. À présent que nous pouvons acquérir de nouvelles armes, il est temps de réorganiser nos forces pour forger une armée puissante."
 PRU_andean_warfare:0 "Intégrer les Ronderos à l’armée"
 PRU_andean_warfare_desc:0 "Les Ronderos sont une pièce fondamentale de l’histoire [ROOT.getAdjective] ; leur présence fut décisive, notamment durant la guerre contre le Chili après la chute de Lima. Nous demandons que tous les Quechuas rejoignent ce corps de Ronderos."

 PRU_paratrooper_company:0 "Compagnie de parachutistes"
 PRU_paratrooper_company_desc:0 "En bâtissant une large flotte aérienne, nous pouvons créer un corps parachutiste pour appuyer les troupes au sol."
 PRU_modernize_the_infantry_kit:0 "Moderniser l’équipement d’infanterie"
 PRU_modernize_the_infantry_kit_desc:0 "Les nouvelles tactiques de guerre développées dans le monde nous obligent à mettre à jour nos connaissances et à acquérir du matériel moderne pour tourner la page de l’arsenal hérité de la guerre de Leticia."
 PRU_jungle_training:0 "Former une armée ashaninka"
 PRU_jungle_training_desc:0 "Longtemps isolé dans la jungle péruvienne, le peuple ashaninka a subi l’avidité des compagnies du caoutchouc, déclenchant l’un des plus grands génocides connus au Pérou. Ces hommes de la jungle seront précieux pour nos opérations : nous avons plus que jamais besoin d’eux dans l’armée."
 PRU_motorization:0 "Motorisation"
 PRU_motorization_desc:0 "Nos ressources de guerre ont longtemps été acheminées à dos de mule ou de lama dans nos reliefs escarpés. Avec la construction de grands axes, il est temps d’utiliser des camions pour déplacer nos moyens militaires."
 PRU_create_the_infantry_and_cavalry_schools:0 "Créer les écoles d’infanterie et de cavalerie"
 PRU_create_the_infantry_and_cavalry_schools_desc:0 "La cavalerie est un atout vital. Notre géographie limitant la motorisation, le cheval et la mule restent des alliés de confiance. La spécialisation de certains commandants dans la tactique montée nous guidera vers la victoire."
 PRU_cold_weather_equipment:0 "Équipement de froid"
 PRU_czech_tanks:0 "Acquérir des chars tchèques"
 PRU_czech_tanks_desc:0 "Ces nouveaux chars donneront de l’élan à notre armée pour écraser quiconque oserait outrager la patrie."
 PRU_study_the_blueprints:0 "Étudier les plans"
 PRU_study_the_blueprints_desc:0 "Avec nos propres conceptions, nous réussirons à créer et à fortifier notre industrie nationale."
 PRU_foreign_licenses:0 "Licences étrangères"
 PRU_foreign_licenses_desc:0 "Grâce aux nouvelles licences d’armement étrangères, il sera possible de produire localement des armes avancées."
 PRU_italian_guns:0 "Canons italiens"
 PRU_italian_guns_desc:0 "Après l’achat d’avions et la formation italienne, il est temps d’acquérir des canons modernes italiens pour faire sentir notre puissance dans les Andes."
 # PRU_invite_italian_military_mission:0 "Invite Italian Military Mission"
 PRU_invite_soviet_military_mission:0 "Inviter une mission militaire soviétique"
 PRU_expand_the_national_arsenal:0 "Élargir l’arsenal national"
 PRU_expand_the_national_arsenal_desc:0 "L’une des principales usines d’armes de Lima est obsolète et n’équipe plus décemment nos troupes. Étendre la production avec de nouvelles usines militaires comblera ce besoin."
 PRU_new_weapons_new_tactics:0 "Nouvelles armes, nouvelles tactiques"
 PRU_new_weapons_new_tactics_desc:0 "Nos nouveaux armements nous aideront à nous adapter aux tactiques modernes."
 PRU_plan_limas_expansion:0 "Plan d’extension de Lima"
 PRU_plan_limas_expansion_desc:0 "Hors du centre de Lima, des espaces existent pour aménager des zones industrielles modernes, notamment vers Villa El Salvador et San Juan de Lurigancho."
 PRU_compania_minera_atacocha:0 "Compañía Minera Atacocha"
 PRU_compania_minera_atacocha_desc:0 "Aux abords de Lima, en montant vers la cordillère, se trouve l’un des plus grands gisements de métaux précieux ; faisons-en bon usage."
 PRU_industrial_modernization:0 "Modernisation industrielle"
 PRU_industrial_modernization_desc:0 "Notre industrie, obsolète et stagnante, doit être modernisée. Reste à décider si nous le ferons avec l’aide de l’étranger ou en développant nos propres capacités."
 PRU_rely_on_international_trade:0 "S’appuyer sur le commerce international"
 PRU_rely_on_international_trade_desc:0 "Sans l’aide des pays développés, notre industrie ne peut se soutenir : acceptons les capitaux étrangers."
 PRU_invite_foreign_experts:0 "Inviter des experts étrangers"
 PRU_invite_foreign_experts_desc:0 "Des experts étrangers sauront remettre notre économie sur les rails pour redevenir l’une des plus puissantes d’Amérique du Sud."
 PRU_railroad_investments:0 "Investissements ferroviaires"
 PRU_railroad_investments_desc:0 "Le tracé de nouvelles lignes pour améliorer l’infrastructure nationale est confié à des experts étrangers : nous disposerons bientôt d’un réseau de premier plan."
 PRU_oil_industry_developments:0 "Développer l’industrie pétrolière"
 PRU_oil_industry_developments_desc:0 "Nos alliés étrangers doivent exploiter le pétrole de La Brea y Pariñas, au nord du pays."
 PRU_gold_and_silver_mining:0 "Exploitation de l’or et de l’argent"
 PRU_gold_and_silver_mining_desc:0 "Les ressources critiques, or et argent de nos montagnes, alimenteront notre économie."
 PRU_running_economy:0 "Stabilisation monétaire"
 PRU_running_economy_desc:0 "La création d’une banque de réserve nationale améliorera la gestion de notre monnaie."
 PRU_construction_industry:0 "Industrie du bâtiment"
 PRU_construction_industry_desc:0 "Avec l’appui de l’étranger, lançons des travaux utiles à tout le peuple [ROOT.getAdjective]."
 PRU_implement_autarky:0 "Mettre en place l’autarcie"
 PRU_implement_autarky_desc:0 "Les étrangers n’ont pas à contrôler notre économie ; développons-la nous-mêmes pour ne dépendre d’aucun capital étranger."
 PRU_give_rights_to_indigenous_people:0 "Accorder des droits aux indigènes"
 PRU_give_rights_to_indigenous_people_desc:0 "Les habitants des Andes ont été traités en esclaves même après l’indépendance. Pour un pays en développement, il est vital d’assurer leur soutien."
 PRU_seize_the_gold_mines:0 "S’emparer des mines d’or"
 PRU_seize_the_gold_mines_desc:0 "Les mines d’or de Cajamarca sont désormais une réalité. Faute de machines elles n’étaient pas exploitées ; avec la technologie nécessaire, renforçons la nation grâce à ces ressources."
 PRU_national_mining_administration:0 "Administration minière nationale"
 PRU_national_mining_administration_desc:0 "La création d’une entreprise publique gérant les ressources minières garantira une utilisation optimale par l’État."
 PRU_finance_construction_programs:0 "Financer des programmes de construction"
 PRU_finance_construction_programs_desc:0 "Le financement de l’Hôpital des employés et des ensembles d’habitat social donnera l’élan initial au développement national."
 PRU_industrial_surquillo_sac:0 "Industrial Surquillo SAC"
 PRU_industrial_surquillo_sac_desc:0 "Il est temps de bâtir notre propre industrie militaire."
 PRU_nationalize_the_railways:0 "Nationaliser les chemins de fer"
 PRU_nationalize_the_railways_desc:0 "Les péages exigés par les compagnies étrangères sont exorbitants. Il est temps que tout, au Pérou, serve exclusivement le peuple."
 PRU_national_research_grants:0 "Bourses nationales de recherche"
 PRU_national_research_grants_desc:0 "Avec nos propres talents, nous ferons avancer le pays."
 PRU_substitution_technologies:0 "Technologies de substitution"
 PRU_substitution_technologies_desc:0 "Si nous ne pouvons obtenir des technologies que nous ne possédons pas, trouvons des pièces de rechange et adaptons-les."
 PRU_a_reborn_navy:0 "Une marine renaissante"
 PRU_a_reborn_navy_desc:0 "Depuis 1880, notre marine a décliné d’une des mieux entraînées d’Amérique du Sud à l’une des plus obsolètes. Saisissons l’occasion de la faire renaître."
 PRU_expand_the_naval_factory_of_bellavista:0 "Élargir l’arsenal naval de Bellavista"
 PRU_expand_the_naval_factory_of_bellavista_desc:0 "L’arsenal de Bellavista fut notre référence. Avec la renaissance de la flotte, étendons-le vers le nord et le sud du pays."
 PRU_work_with_foreigners:0 "Travailler avec l’étranger"
 PRU_work_with_foreigners_desc:0 "Ils en savent plus que nous sur la construction navale. Coopérons pour développer notre flotte."
 PRU_National_Admiralty_Corps:0 "Corps d’amirauté national"
 PRU_National_Admiralty_Corps_desc:0 "En réunissant les meilleurs stratèges navals du Pérou, formons un état-major élargi pour décider au combat."
 PRU_naval_industry:0 "Industrie navale"
 PRU_naval_industry_desc:0 "Au-delà de l’expansion, construisons de plus grands chantiers pour une grande flotte nationale."
 PRU_modernize_destroyers:0 "Moderniser les destroyers"
 PRU_modernize_destroyers_desc:0 "Nos derniers destroyers sont déjà dépassés : lancer un programme de recherche de nouveaux modèles est vital."
 PRU_Modernize_our_submarines:0 "Moderniser les sous-marins"
 PRU_Modernize_our_submarines_desc:0 "Nos sous-marins les plus récents sont obsolètes : un programme de recherche s’impose."
 PRU_the_grau_class_project:0 "Projet de classe Grau"
 PRU_the_grau_class_project_desc:0 "Les croiseurs de classe Grau furent les plus grands et modernes bâtiments de la marine depuis la guerre du Pacifique. Leur valeur au combat a conduit l’État à envisager la production en série de navires de cette classe."
 PRU_expand_naval_production:0 "Étendre la production navale"
 PRU_expand_naval_production_desc:0 "Nous avons besoin de davantage de chantiers pour agrandir notre grande flotte."
 PRU_modernize_battleships:0 "Moderniser les cuirassés"
 PRU_modernize_battleships_desc:0 "Il est temps de lancer le projet de cuirassé « Lima ». Jadis inabordable, il devient désormais possible."
 PRU_modernize_carrier:0 "Moderniser les porte-avions"
 PRU_modernize_carrier_desc:0 "Lançons le projet de porte-avions « República del Perú ». Autrefois inabordable, il devient désormais possible."
 PRU_naval_doctrine:0 "Doctrine navale"
 PRU_naval_doctrine_desc:0 "Nouveaux navires, nouvelles doctrines."
 PRU_fly_with_the_sun:0 "Héros du Soleil"
 PRU_fly_with_the_sun_desc:0 "Depuis 1919, notre force aérienne a accueilli de nombreux talents auteurs d’exploits en cockpit. Il est temps que ces pilotes montrent à qui appartiennent les cieux d’Amérique du Sud."
 PRU_start_aircraft_purchase:0 "Achats d’aéronefs"
 PRU_start_aircraft_purchase_desc:0 "Pour renforcer notre aviation, choisissons auprès de quel pays étranger commander des appareils."
 PRU_acquire_italian_planes:0 "Acquérir des avions italiens"
 PRU_acquire_italian_planes-desc:0 "Les avions italiens sont robustes et lourds : parfaits pour notre aviation."
 PRU_acquire_usa_planes:0 "Acquérir des avions [USA.GetAdjective]"
 PRU_acquire_usa_planes_desc:0 "Les avions américains sont rapides et légers : parfaits pour notre aviation."
 PRU_strengthen_the_air_force:0 "Renforcer l’aviation"
 PRU_strengthen_the_air_force_desc:0 "Notre force aérienne est désorganisée et nos bases négligées. En les développant, nous deviendrons la plus puissante de la région."
 PRU_work_with_our_designs:0 "Créer Factorías Faucett"
 PRU_work_with_our_designs_desc:0 "Nos conceptions d’aéronefs peuvent surpasser celles achetées à l’étranger. Il est crucial d’améliorer nos modèles existants."
 PRU_work_on_heavy_aircraft:0 "Travailler sur les avions lourds"
 PRU_work_on_heavy_aircraft_desc:0 "En développant nos appareils lourds, nous frapperons fort et par surprise."
 PRU_work_on_light_aircraft:0 "Travailler sur les avions légers"
 PRU_work_on_light_aircraft_desc:0 "En développant nos appareils légers, nous serons rapides et traquerons l’ennemi sans être vus."
 PRU_air_innovations:0 "Innovations aériennes"
 PRU_air_innovations_desc:0 "Nouveaux avions, nouvelles tactiques."
 PRU_total_production:0 "Production totale"
 PRU_total_production_desc:0 "Multiplions la production de chasseurs et d’appui rapproché pour constituer une grande force et atteindre la supériorité aérienne."
 PRU_heroes_of_the_air:0 "Héros de l’Air"
 PRU_heroes_of_the_air_desc:0 "Chevaliers des airs, heureux élus qui combattent pour la patrie dans leur corset d’acier."
 PRU_build_the_petrolero_railway:0 "Construire le chemin de fer Petrolero"
 PRU_build_the_petrolero_railway_desc:0 "Les compagnies pétrolières américaines exigent une ligne de Lima au nord de Trujillo pour acheminer le pétrole vers le port de Callao. Un projet intéressant, utile à l’État pour des usages civils et militaires."
 PRU_build_the_andes_railway:0 "Construire le chemin de fer des Andes"
 PRU_build_the_andes_railway_desc:0 "La ligne transandine transporte des millions de personnes entre Cuzco–Huancayo–Lima, où se concentre près de 60 % de la population."
 PRU_organize_future_elections:0 "Organiser de futures élections"
 PRU_organize_future_elections_desc:0 "Après le court gouvernement Benavides, et conformément à la Constitution, il devrait convoquer des élections générales — bien qu’il envisage de rester un peu plus longtemps."
 PRU_mediate_between_the_parties:0 "Médiation entre les partis"
 PRU_mediate_between_the_parties_desc:0 "Invitons les partis à se préparer aux élections générales."
 PRU_british_airports:0 "Aéroports britanniques"
 PRU_british_airports_desc:0 "Avec l’aide britannique, modernisons nos aéroports nationaux négligés."
 PRU_mobilize_womans:0 "Mobiliser les femmes"
 PRU_mobilize_womans_desc:0 "Longtemps écartées du système politique, les femmes seront désormais incluses en politique, dans l’armée et la fonction civile."
 PRU_leacy_of_Benavides:0 "Héritage de Benavides"
 PRU_leacy_of_Benavides_desc:0 "Poursuivons l’œuvre de Benavides, ancien dirigeant civiliste, en maintenant ses réalisations."
 PRU_Military_Universities:0 "Universités militaires"
 PRU_Military_Universities_desc:0 "L’extension du système éducatif a favorisé la création de nouvelles institutions civiles et militaires, dont l’idée d’une université militaire."
 PRU_give_asylum_to_the_jews:0 "Accorder l’asile aux Juifs"
 PRU_give_asylum_to_the_jews_desc:0 "Plusieurs intellectuels juifs fuient l’Europe au vu des politiques actuelles. Ouvrons nos portes aux réfugiés pour soutenir l’effort de recherche."
 PRU_reforma_agraria:0 "Reforma Agraria"
 PRU_reforma_agraria_desc:0 "La tierra es de quien la trabaja."
 PRU_consolidate_borders:0 "Une nouvelle identité péruvienne"
 PRU_consolidate_borders_desc:0 "Par des politiques culturelles et éducatives, nous forgerons une identité nationale solide transcendant les différences régionales. Favorisons la fierté patriotique et la loyauté à la nation : étape essentielle pour une société cohésive et résiliente."
 PRU_nationalize_banking_sector:0 "Nationaliser le secteur bancaire"
 PRU_nationalize_banking_sector_desc:0 "Nos banques furent longtemps aux mains d’étrangers servant leurs seuls intérêts. Désormais, elles ne doivent servir que l’État."
 PRU_empower_benavides:0 "Investir Benavides de pouvoirs"
 PRU_empower_benavides_desc:0 "Les élections doivent être annulées au profit d’un gouvernement unifié dirigé par Benavides."
 PRU_legacy_of_sachez_cerro:0 "Héritage de Sánchez Cerro"
 PRU_legacy_of_sachez_cerro_desc:0 "Sánchez Cerro fut le libérateur qui mit fin à l’antipatriotique Leguía et à ses onze ans de gouvernement. Sous son mandat furent promulguées des lois d’intérêt social et de protection des indigènes. Par ses origines modestes et sa race chola, il est vu comme le représentant du peuple péruvien."
 PRU_conservative_coalition:0 "Coalition conservatrice"
 PRU_conservative_coalition_desc:0 "Après la dissolution du Parti civiliste à la suite du krach de 1929, propriétaires terriens et gamonales perdirent leur poids politique. La droite, fragmentée, s’unit en 1930 pour former la Coalition conservatrice — ensemble de partis de droite — menée par Manuel Prado Ugarteche."
 PRU_social_democratic_coalition:0 "Coalition sociale-démocrate"
 PRU_social_democratic_coalition_desc:0 "Le Pérou a besoin d’un parti de centre doté d’un véritable programme. Le Parti social-démocrate n’est pas un cénacle fermé. Le registre de l’Union patriotique n’impose ni exclusions haineuses ni préventions hostiles. Son drapeau est celui du Pérou. La patrie est un symbole d’union, d’autant plus vigoureux que la solidarité affective et la coopération économique entre compatriotes sont intenses."
 PRU_alerta_en_la_frontera:0 "Alerte à la frontière"
 PRU_alerta_en_la_frontera_desc:0 "La question des territoires disputés avec l’Équateur est vaste. Depuis l’époque coloniale espagnole, la frontière entre le vice-royaume du Pérou et celui de la Nouvelle-Grenade n’a jamais été claire. Après l’indépendance, rien ne s’est arrangé entre la République du Pérou et la Grande Colombie. Des années ont passé sans qu’une frontière nette soit délimitée. Nous pensons que la meilleure issue serait de tracer la frontière par la guerre, même si nous pourrions aussi recourir à des moyens plus pacifiques."
 PRU_protest_against_the_cancellation:0 "Protester contre l’annulation"
 PRU_protest_against_the_cancellation_desc:0 "Benavides est un dictateur qui a annulé les élections et mérite tout le châtiment de Dieu et du peuple."
 PRU_prolong_benavides_presidency:0 "Prolonger la présidence de Benavides"
 PRU_prolong_benavides_presidency_desc:0 "Notre pays a beaucoup prospéré sous le gouvernement de Benavides. Il devrait rester quelques années de plus."
 PRU_peruvian_blackshirts:0 "Chemises noires péruviennes"
 PRU_peruvian_blackshirts_desc:0 "Les Chemises noires du Pérou, sous le commandement de Luis Alberto Flores, nous mèneront à la victoria."
 PRU_give_power_to_general_ureta:0 "Donner le pouvoir au général Ureta"
 PRU_give_power_to_general_ureta_desc:0 "Le général Ureta, fervent urriste et nationaliste, en a assez des politiques extrémistes d’Alberto Flores. Il projette un coup de force pour diriger l’Union Révolutionnaire."
 PRU_integrate_the_church:0 "Intégrer l’Église"
 PRU_integrate_the_church_desc:0 "L’Église catholique est une composante vitale de la vie de toute la population péruvienne."
 PRU_workers_protection:0 "Droits des travailleurs"
 PRU_workers_protection_desc:0 "Les ouvriers réclament des réformes du travail pour mieux performer dans les usines."
 PRU_remember_the_Trujillo_revolution:0 "Se souvenir de la révolution de Trujillo"
 PRU_remember_the_Trujillo_revolution_desc:0 "Sous le gouvernement de Sánchez Cerro, en 1932, la ville de Trujillo a connu un soulèvement de grande ampleur des militants de l’APRA, qui prirent totalement la ville et menacèrent de marcher sur Lima pour prendre le pouvoir. La réponse du gouvernement fut brutale : la révolte fut écrasée par des bombardements aériens et l’artillerie. Le souvenir en demeure chez les Apristes."
 PRU_benavides_nightmare:0 "Début de la révolution"
 PRU_benavides_nightmare_desc:0 "Les communistes se sont levés en masse pour protester contre l’annulation des élections. C’est la fin de l’ère Benavides et des libertés individuelles au Pérou."
 PRU_select_a_successor_for_benavides:0 "Choisir un successeur à Benavides"
 PRU_select_a_successor_for_benavides_desc:0 "Benavides est trop vieux et trop faible pour continuer à gouverner. Il serait préférable d’élire un successeur au plus vite."
 PRU_hispanism:0 "Hispanisme"
 PRU_hispanism_desc:0 "L’hispanisme évoque l’ancienne union des vice-royaumes américains, jadis piliers d’un puissant empire. Cette mémoire fait partie de l’identité nationale du Pérou."
 PRU_tax_reform:0 "Réforme fiscale"
 PRU_tax_reform_desc:0 "La fiscalité actuelle favorise ceux qui ont plus d’argent que le citoyen moyen. Il est temps de réformer ce système absurde pour le rendre plus équitable."
 PRU_revolutionary_goverment:0 "La révolution de Tacna"
 PRU_revolutionary_goverment_desc:0 "Bien que Ricardo Pérez Godoy ne fût pas urriste, ses idées nationalistes s’allièrent à des idées sociales pour sauver le Pérou d’une possible révolution communiste, voyant que le gouvernement faisait peu pour arrêter la progression du communisme."
 PRU_left_and_right_united:0 "Gauche et droite unies"
 PRU_left_and_right_united_desc:0 "Si nous voulons gagner en puissance, unifions socialistes, modérés et conservateurs. Ensemble, nous construirons un meilleur Pérou."
 PRU_help_our_brothers:0 "Aider nos frères"
 PRU_help_our_brothers_desc:0 "[ROOT.GetLeader] envisage d’envoyer des volontaires pour soutenir la cause socialiste du peuple espagnol."
 PRU_the_teachings_the_amauta:0 "Les enseignements de l’Amauta"
 PRU_the_teachings_the_amauta_desc:0 "José Carlos Mariátegui, connu comme « l’Amauta », est le principal idéologue socialiste du Pérou, que [ROOT.GetLeader] admirait profondément et dont il souhaite poursuivre l’héritage par des politiques communistes en [ROOT.GetNameDefCap]."
 PRU_commit_to_democratic_election:0 "S’engager à des élections démocratiques"
 PRU_commit_to_democratic_election_desc:0 "L’annulation récente des élections par Benavides a suscité un fort rejet populaire, forçant le dictateur à promettre la démocratie à l’avenir."
 PRU_select_montagne_as_successor:0 "Choisir Montagne comme successeur"
 PRU_select_montagne_as_successor_desc:0 "Ernesto Montagne Markholz est un urriste convaincu. Membre de l’Union Révolutionnaire fondée par Sánchez Cerro, il en partageait les bases nationalistes. Quand le parti est tombé sous la coupe de Luis Alberto Flores et a commencé à ressembler au fascisme italien, Montagne l’a quitté et est resté indépendant jusqu’à ce que Benavides l’appelle pour être son successeur et poursuivre ses réformes en [ROOT.GetNameDefCap]."
 PRU_unite_the_andes:0 "Unifier les Andes"
 PRU_unite_the_andes_desc:0 "La trahison commise par [BOL.GetNameDefCap] envers [ROOT.GetNameDefCap] ne peut être oubliée. Nous devons unifier tous les peuples quechuas sous la conduite de [ROOT.GetLeader]."
 PRU_alliance_with_bolivia:0 "Alliance avec la Bolivie"
 PRU_alliance_with_bolivia_desc:0 "[ROOT.GetNameDefCap] et [BOL.GetNameDefCap] partagent un passé commun : l’Inca et le vice-royaume. Il est temps de dépasser nos différends et d’unir nos peuples frères."
 andean_pact:0 "Pacte andin"
 PRU_place_odria_as_adviser:0 "Nommer Odría conseiller"
 PRU_place_odria_as_adviser_desc:0 "Plutôt qu’un gouvernement dirigé par Manuel Odría, une option viable serait de le placer comme conseiller politique de [ROOT.GetLeader] afin qu’il l’aide à réformer le Pérou et à l’engager sur la voie du développement."
 PRU_spanish_civil_war_involvement:0 "Intervention dans la guerre d’Espagne"
 PRU_spanish_civil_war_involvement_desc:0 "[ROOT.GetLeader] envisage d’envoyer des volontaires pour soutenir la cause nationaliste du peuple espagnol."
 PRU_strengthen_the_national_industry:0 "Renforcer l’industrie nationale"
 PRU_strengthen_the_national_industry_desc:0 "[ROOT.GetLeader] recherche de nouveaux capitaux nationaux et internationaux pour renforcer notre industrie."
 PRU_nationalize_the_banking_sector:0 "Nationaliser le secteur bancaire"
 PRU_nationalize_the_banking_sector_desc:0 "[ROOT.GetLeader] a ordonné la nationalisation immédiate du secteur bancaire au profit du peuple."
 PRU_increase_social_spending:0 "Augmenter les dépenses sociales"
 PRU_increase_social_spending_desc:0 "Le peuple exige une hausse des dépenses sociales. Nous accomplirons sa volonté pour gagner sa confiance."
 PRU_exile_luis_alberto_flores:0 "Exiler Luis Alberto Flores"
 PRU_exile_luis_alberto_flores_desc:0 "L’un des plus grands agitateurs politiques du Pérou est Luis Alberto Flores. Nous devrions l’exiler au Chili."
 PRU_reform_the_constitution:0 "Réécrire la Constitution"
 PRU_reform_the_constitution_desc:0 "La dernière constitution, écrite par l’ancien dictateur Luis Miguel Sánchez Cerro, n’est plus adaptée au gouvernement actuel. [ROOT.GetLeader] estime qu’il faut la réformer pour ouvrir la voie au nouveau Pérou."
 PRU_legacy_of_pachacutec:0 "Héritage de Pachacutec"
 PRU_legacy_of_pachacutec_desc:0 "Pachacútec, « celui qui transforme la terre ». Il est temps de modifier notre pays pour le moderniser."
 PRU_hasta_quemar_el_ultimo_cartucho:0 "Jusqu’à la dernière cartouche"
 PRU_hasta_quemar_el_ultimo_cartucho_desc:0 "Hasta quemar el último cartucho. Nous ne nous rendrons jamais si facilement."
 PRU_celebration_of_the_andean_past:0 "Célébrer le passé andin"
 PRU_celebration_of_the_andean_past_desc:0 "Le même passé, le même héritage, la même histoire."
 PRU_industrial_cooperation:0 "Coopération industrielle"
 PRU_industrial_cooperation_desc:0 "Notre coopération avec nos frères boliviens sera cruciale pour l’industrialisation rapide de nos deux nations."
 PRU_regain_the_new_spain_heritage:0 "Retrouver l’héritage de la Nouvelle-Espagne"
 PRU_regain_the_new_spain_heritage_desc:0 " "
 PRU_secure_the_central_america:0 "Sécuriser l’Amérique centrale"
 PRU_secure_the_central_america_desc:0 " "
 PRU_alliance_with_mexico:0 "Alliance avec le Mexique"
 PRU_alliance_with_spain:0 "Alliance avec l’Espagne"
 PRU_Support_the_banana_industry:0 "Soutenir l’industrie bananière"
 PRU_Support_the_banana_industry_desc:0 ""
 PRU_alliance_mexico_desc:0 "Les liens qui unissent [ROOT.GetLeader] et [MEX.GetLeader] dépassent le passé hispanique : ils sont idéologiques."
 PRU_alliance_with_mexico_desc:0 "Les liens qui unissent [ROOT.GetLeader] et [MEX.GetLeader] dépassent le passé hispanique : ils sont idéologiques."
 PRU_expand_the_volunteer_program:0 "Étendre le programme de volontaires"
 PRU_expand_the_volunteer_program_desc:0 "L’armée a besoin de plus de main-d’œuvre. Une loi de volontariat plus large nous permettra de la renforcer."
 PRU_national_investigation:0 "Agence nationale de recherche"
 PRU_national_investigation_desc:0 "Une agence spécialisée dans la prospection de nouvelles ressources et le renforcement de l’effort de recherche serait un grand pas en avant."
 PRU_expand_the_military_industry:0 "Étendre l’industrie militaire"
 PRU_expand_the_military_industry_desc:0 "[ROOT.GetLeader] recherche de nouveaux capitaux nationaux et internationaux pour renforcer notre industrie."
 PRU_expand_the_agricultural_sector:0 "Développer le secteur agricole"
 PRU_expand_the_agricultural_sector_desc:0 "Notre terre est riche et peut porter des cultures variées. Utilisons-les pour nourrir la population et cesser de dépendre des importations."
 PRU_crusade_against_radicalism_in_america:0 "Croisade contre le radicalisme"
 PRU_crusade_against_radicalism_in_america_desc:0 "Le fascisme et le communisme se répandent rapidement en Amérique du Sud. C’est notre devoir sacré de purger la région de ces idéologies funestes."
 PRU_integrate_the_indigenous:0 "Intégrer le peuple quechua"
 PRU_integrate_the_indigenous_desc:0 "Autrefois privés de droits et réduits à la domesticité par les oligarques, les Quechuas doivent être intégrés à la force industrielle du pays : ils donneront une grande puissance à notre mouvement politique."
 PRU_Legion_Peruana:0 "La Legión Peruana"
 PRU_Legion_Peruana_desc:0 "La Legión Peruana fut un groupe d’élite de la jeune république, engagé dans ses guerres les plus brutales. En ces temps, [ROOT.GetLeader] a de nouveau besoin d’une Legión Peruana."
 PRU_inca_industry:0 "Créer le Qhapaq Ñan"
 PRU_inca_industry_desc:0 "Le Qhapaq Ñan, « grande route » en quechua, est l’antique réseau inca qui reliait l’empire du nord au sud et d’est en ouest. Il est temps de revenir à ce système routier et de le moderniser."
 PRU_research_cooperation:0 "Coopération en recherche"
 PRU_research_cooperation_desc:0 "Notre collaboration avec la Bolivie en matière de recherche produira d’excellents résultats pour nos deux nations sœurs."
 PRU_neo_incaic_unification:0 "Unification néo-incaïque"
 PRU_neo_incaic_unification_desc:0 "L’alliance néo-inca entre [ROOT.GetNameDefCap] et [BOL.GetNameDefCap] mobilisera des millions de Quechuas vivant dans ces deux pays."
 PRU_prepare_for_another_pacific_war:0 "Se préparer à une autre guerre du Pacifique"
 PRU_prepare_for_another_pacific_war_desc:0 "Les Nacistas prennent leur temps pour gagner du pouvoir au Chili. Peut-être que les armes péruviennes parviendront à y placer un fasciste."
 PRU_integrate_women:0 "Femmes dans la main-d’œuvre"
 PRU_integrate_women_desc:0 "Les femmes sont le moteur de notre pays. Intégrons-les aux usines pour accroître la main-d’œuvre."
 PRU_food_importation:0 "Importation de denrées"
 PRU_food_importation_desc:0 "Si notre géographie accidentée empêche de produire assez de nourriture, la meilleure solution sera d’en acheter à l’étranger."
 PRU_arm_the_people:0 "Armer le peuple"
 PRU_arm_the_people_desc:0 "Un peuple [ROOT.getAdjective] uni ne peut être vaincu. Sa force formera un grand poing qui fera trembler les hordes impérialistes."
 PRU_promote_the_military_industry:0 "Promouvoir l’industrie militaire"
 PRU_promote_the_military_industry_desc:0 "[ROOT.GetLeader] recherche de nouveaux capitaux nationaux et internationaux pour renforcer notre industrie."
 PRU_promote_the_national_industry:0 "Promouvoir l’industrie nationale"
 PRU_promote_the_national_industry_desc:0 "[ROOT.GetLeader] recherche de nouveaux capitaux nationaux et internationaux pour renforcer notre industrie."
 PRU_a_new_peru:0 "Un nouveau Pérou"
 PRU_a_new_peru_desc:0 "Le nouveau Pérou inaugure une ère politique inédite, laissant derrière lui le passé des caudillos et des révolutions."
 PRU_the_only_sun:0 "L’unique soleil"
 PRU_the_only_sun_desc:0 "Il n’y a qu’un seul soleil, celui qui brille et brillera pour les Incas : le dieu-soleil Inti."
 PRU_looking_north:0 "Regarder vers le nord"
 PRU_looking_north_desc:0 "[ROOT.GetLeader] désapprouve la politique de [COL.GetLeader] concernant le trapèze amazonien et la ville de Leticia, où vivent encore des Péruviens. Il est temps de reprendre Leticia par la force."
 PRU_join_allies:0 "Rejoindre les Alliés"
 PRU_join_allies_desc:0 "Nos partenaires commerciaux nous appellent à mettre fin au fascisme en Europe."
 PRU_create_the_Lima_group:0 "Créer le Groupe de Lima"
 PRU_create_the_Lima_group_desc:0 "Le Groupe de Lima doit naître pour maintenir la neutralité face aux événements qui ravagent l’Europe. Notre continent doit rester à l’écart de la guerre."
 lima_group:0 "Groupe de Lima"
 PRU_follow_in_the_footsteps_of_tupac_amaru:0 "Dans les pas de Túpac Amaru II"
 PRU_follow_in_the_footsteps_of_tupac_amaru_desc:0 "L’héritage du révolutionnaire autochtone Túpac Amaru II vit encore dans le cœur de nombreux Quechuas, qui se levèrent contre la domination espagnole. Aujourd’hui, la révolution invoque son nom pour unir les peuples — ¡y no podrán matarlo!"
 PRU_benavides_is_dead:0 "Benavides est mort"
 PRU_benavides_is_dead_desc:0 "Notre chef caudillo, qui pacifia le pays après la mort de Sánchez Cerro, est extrêmement malade. Pourrait-il mourir ?"
 PRU_wake_up_a_giant:0 "Réveiller un géant"
 PRU_wake_up_a_giant_desc:0 "Le pays qui vit naître l’une des cultures les plus importantes d’Amérique du Sud avant la colonie, qui fut l’un des vice-royaumes les plus puissants, s’est ensuite reposé plus d’un siècle sur une république instable. Il est temps de le réveiller."
 PRU_riva_agueros_dream:0 "Le rêve de Riva Agüero"
 PRU_riva_agueros_dream_desc:0 "Forger une patrie unifiée et pacifiée après des années de révoltes et de coups d’État : tel est le rêve du nationaliste catholique José de la Riva Agüero y Osma, qui le voit enfin se réaliser entre les mains de [ROOT.GetLeader]."
 PRU_hit_bolivia:0 "En finir avec les Boliviens"
 PRU_hit_bolivia_desc:0 "L’opinion sur le peuple [BOL.getAdjective] varie parmi les politiciens [ROOT.getAdjective]. Jadis allié de [ROOT.GetNameDefCap] sous l’idée d’un « Pérou-Bolivie » réformateur, le pays fut ensuite trahi par l’armée [BOL.getAdjective] pendant la guerre du Pacifique, livrant la guerre sans résistance."
 PRU_ask_for_enter_to_comintern:0 "Demander l’adhésion au Komintern"
 PRU_ask_for_enter_to_comintern_desc:0 "Après un long débat au sein de la [ROOT.GetCommunistParty], il a été conclu que [ROOT.GetLeader] devrait demander à rejoindre le Komintern, car [SOV.GetNameDefCap] pourrait nous aider à développer le pays et à répandre la révolution en Amérique du Sud."
 PRU_new_road_conscription_law:0 "Nouvelle loi de conscription routière"
 PRU_new_road_conscription_law_desc:0 "Ressuscitons l’ancienne loi de conscription routière : notre gouvernement propose une version rénovée, avec de meilleurs avantages pour les travailleurs. Cette initiative vise à améliorer nos infrastructures tout en offrant des emplois et en contribuant au développement des routes et des chemins."
 PRU_protect_democratic_institutions:0 "Protéger les institutions démocratiques"
 PRU_protect_democratic_institutions_desc:0 "Période cruciale pour notre démocratie : sous la conduite de [ROOT.GetLeader], nous nous engageons à sauvegarder la transparence, la responsabilité et la participation citoyenne."
 PRU_workers_rights_act:0 "Loi sur les droits des travailleurs"
 PRU_workers_rights_act_desc:0 "Dans un engagement clair pour le bien-être des travailleurs, [ROOT.GetLeader] présente la loi sur les droits du travail. Conçue pour renforcer leur position, elle garantit des conditions équitables, des horaires raisonnables et la protection de leurs droits fondamentaux."
 PRU_god_country_and_family:0 "Dieu, Patrie et Famille"
 PRU_god_country_and_family_desc:0 "Pour consolider les valeurs conservatrices, nous proposons l’initiative « Dieu, Patrie et Famille ». Sous la direction de notre gouvernement conservateur, nous renforcerons l’influence de la foi, préserverons les principes patriotiques et protégerons les fondements familiaux de notre société."
 PRU_state_serves_the_people:0 "Un État au service du peuple"
 PRU_state_serves_the_people_desc:0 "Nous nous engageons à prioriser les besoins du peuple. Cette initiative renforce l’intervention de l’État dans l’éducation, la santé et le bien-être, afin que les progrès profitent à tous. Unis, avançons vers un Pérou où l’État œuvre sans relâche pour élever la qualité de vie de chaque citoyen."

 PRU_Eradicate_the_traitors:0 "Éradiquer les traîtres"
 PRU_Eradicate_the_traitors_desc:0 "Alberto Flores a décidé de prendre des mesures drastiques pour sauvegarder la pureté et la grandeur de la nation. Une purge exhaustive éliminera les Apristes et leurs alliés, qui menacent la stabilité et l’identité nationale. Bien que cette mesure entraîne des pertes humaines, Flores soutient qu’elle est essentielle pour préserver la gloire de notre cher Pérou."

 PRU_The_People_General:0 "Le général du peuple"
 PRU_The_People_General_desc:0 "Sous le leadership charismatique d’Eloy Ureta, le nationalisme péruvien prend un nouveau cap. Soucieux de protéger le peuple et de tourner la page des années d’oppression, Ureta s’efforce de bâtir une nation plus juste et unie. Cette approche plus compassionnelle vise à guérir les blessures du passé."

 PRU_Return_to_Negotiate_with_Caproni:0 "Reprendre les négociations avec Caproni"
 PRU_Return_to_Negotiate_with_Caproni_desc:0 "Conscients de l’importance de solides relations commerciales, nous revenons à la table des négociations avec Caproni. Nous voulons revoir et améliorer les termes de l’accord initial de 1934 afin d’assurer une collaboration bénéfique et équitable, au service du développement national."

 PRU_adean_commissars:0 "Commissaires andins"
 PRU_adean_commissars_desc:0 "Les nouveaux commissaires andins feront appliquer les lois populaires dans les bourgs les plus éloignés des grandes villes."
 PRU_the_great_peruvian_red_army:0 "La Grande Armée rouge du Pérou"
 PRU_the_great_peruvian_red_army_desc:0 "La grande armée rouge du Pérou, composée d’ouvriers et de paysans, libérera l’Amérique du Sud des exploiteurs qui la dominent. Le peuple uni ne sera jamais vaincu."
 PRU_acquire_soviet_tanks:0 "Acquérir des chars soviétiques"
 PRU_acquire_soviet_tanks_desc:0 "Notre puissance militaire sera renforcée par l’industrie naissante [SOV.getAdjective] : nous serons le grand poing de la justice sociale en Amérique du Sud, faisant valoir notre loi par une force militaire redoutable."
 PRU_acquire_soviet_plane_factories:0 "Acquérir des usines d’avions soviétiques"
 PRU_acquire_soviet_plane_factories_desc:0 "Les avions [SOV.getAdjective] sont robustes et lourds : parfaits pour notre aviation."
 PRU_national_literacy_programs:0 "Programmes nationaux d’alphabétisation"
 PRU_national_literacy_programs_desc:0 "L’ouverture de nouvelles universités publiques à Lima et dans les autres villes donnera accès à l’enseignement supérieur gratuit à davantage de personnes et formera les cadres qualifiés du futur."
 PRU_end_capitalism:0 "En finir avec le capitalisme"
 PRU_end_capitalism_desc:0 "L’empire américain veut s’étendre chez nous et renverser le gouvernement de [ROOT.GetLeader]. Il est temps d’unifier tout le peuple [ROOT.getAdjective] pour former un grand poing qui abattra le géant américain — pour la liberté de tout notre peuple."
 PRU_unite_the_ecuadorian_proletariat:0 "Unifier le prolétariat équatorien"
 PRU_unite_the_ecuadorian_proletariat_desc:0 "Les paysans des plantations de café sont en grève en Équateur. Après d’innombrables abus, le dictateur [ECU.GetLeader] a décidé d’attaquer son propre peuple. Une intervention garantira la volonté populaire."
 PRU_drive_out_the_banana_companies:0 "Chasser les compagnies bananières"
 PRU_drive_out_the_banana_companies_desc:0 "Après le soi-disant « massacre des bananes » de 1928, le peuple [COL.getAdjective] a nourri une profonde rancœur envers la United Fruit Company, qui continue d’opérer dans le pays. Le peuple [COL.getAdjective] a soutenu une intervention de l’armée de libération apriste pour expulser ces capitalistes."
 PRU_union_with_the_pcv:0 "Union avec le PCV"
 PRU_union_with_the_pcv_desc:0 "Nos frères du Venezuela sont opprimés par le dictateur [VEN.GetLeader]. Son régime de terreur a déjà fait plusieurs morts [VEN.getAdjective] et des milliers de personnes en subissent les conséquences. Il est temps d’y mettre un terme."
 PRU_collective_agriculture:0 "Agriculture collective"
 PRU_collective_agriculture_desc:0 "Après que les paysans ont pris le contrôle des plantations de sucre, ils ont mis au point de meilleures méthodes de production. Cela nous a permis de développer notre industrie sucrière et d’envoyer le surplus à nos partenaires à l’étranger."
 PRU_aprista_guerrilla:0 "Guérilla apriste"
 PRU_aprista_guerrilla_desc:0 "Les guérillas organisées par l’APRA peuvent être d’un grand secours en temps de guerre. L’expérience des guérillas de Trujillo durant la dictature de Sánchez a été décisive."
 PRU_rallying_the_peasants:0 "Mobiliser les paysans"
 PRU_rallying_the_peasants_desc:0 "Notre industrialisation exige de mobiliser la population paysanne vers les usines pour tripler leur efficacité. Certains ne savent ni lire ni écrire, mais avec le temps ils s’adapteront à ce mode de vie."
 PRU_public_universities:0 "Universités publiques"
 PRU_public_universities_desc:0 "L’ouverture de nouvelles universités publiques à Lima et dans d’autres villes offrira à davantage de personnes un accès gratuit à l’enseignement supérieur et formera des cadres pour l’avenir du Pérou."
 PRU_Nationalize_the_brea_y_parinas:0 "Nationaliser La Brea y Pariñas"
 PRU_Nationalize_the_brea_y_parinas_desc:0 "La question du pétrole à La Brea y Pariñas nous empoisonne depuis 1914, après la signature d’un contrat très injuste toléré par les gouvernements précédents. On vient de découvrir que la compagnie américaine qui exploite le pétrole ne paie pas la totalité du quota qui lui incombe. La nationalisation de ces complexes pétroliers et l’expulsion des propriétaires nord-américains régleront ce problème."
 PRU_Sovereign_Industrial_Expansion:0 "Expansion industrielle souveraine"
 PRU_Sovereign_Industrial_Expansion_desc:0 "Sous la bannière de la souveraineté nationale, notre dirigeant lance une ambitieuse initiative pour favoriser la croissance industrielle domestique. En encourageant l’industrialisation, nous voulons forger un avenir où chaque machine et chaque usine témoignent de notre indépendance et de notre détermination."
 PRU_standard_oil_refinery_initiative:0 "Initiative de raffineries Standard Oil"
 PRU_standard_oil_refinery_initiative_desc:0 "Cette initiative promeut la construction de raffineries en intégrant des technologies avancées afin de maximiser l’efficacité et de diversifier notre production pétrolière. Guidés par l’expérience de Standard Oil, nous cherchons non seulement à renforcer notre infrastructure pétrolière, mais aussi à positionner le Pérou comme acteur clé de la scène énergétique mondiale."
 PRU_oil_infrastructure_expansion:0 "Extension des infrastructures"
 PRU_oil_infrastructure_expansion_desc:0 "Par cette extension, nous renforçons notre capacité à répondre à la demande intérieure et nous nous préparons à jouer un rôle de premier plan sur le marché pétrolier mondial."
 PRU_privatize_the_public_service:0 "Privatiser les services publics"
 PRU_privatize_the_public_service_desc:0 "Nous étudions le transfert de certains services publics au secteur privé afin d’améliorer la qualité et l’efficacité de prestations essentielles. Cette stratégie vise à libérer le potentiel du secteur privé au service du progrès et du développement."
 PRU_protect_our_businesses:0 "Protéger nos entreprises"
 PRU_protect_our_businesses_desc:0 "Face aux défis économiques et à la concurrence internationale, nous mettons en œuvre la stratégie « Protéger nos entreprises ». En collaboration avec Standard Oil, nous renforçons les mesures pour préserver l’intégrité et la compétitivité de nos sociétés nationales, créant ainsi un environnement entrepreneurial solide et résilient."
 PRU_eliminate_the_competition:0 "Éliminer la concurrence"
 PRU_eliminate_the_competition_desc:0 "Pour assurer la suprématie économique de nos sociétés, nous prenons des mesures décisives pour écarter les obstacles et neutraliser nos concurrents, afin que nos industries nationales prospèrent."
 PRU_expand_the_oil_industry:0 "Étendre l’industrie pétrolière"
 PRU_expand_the_oil_industry_desc:0 "Notre stratégie vise non seulement à renforcer notre position sur le marché mondial du pétrole, mais aussi à stimuler le développement économique et technologique."
 PRU_create_the_national_education_fund:0 "Créer le Fonds national pour l’éducation"
 PRU_create_the_national_education_fund_desc:0 "Créons le Fonds national pour l’éducation afin d’améliorer la qualité de l’enseignement, d’investir dans les infrastructures, de former les enseignants et de développer des programmes innovants, renforçant ainsi le système éducatif."
 PRU_mandatory_social_security:0 "Sécurité sociale obligatoire"
 PRU_mandatory_social_security_desc:0 "Instaurer un système de sécurité sociale obligatoire pour garantir protection et bien-être, améliorant ainsi la qualité de vie de nos citoyens."
 PRU_the_empire_of_the_constitution:0 "L’empire de la Constitution"
 PRU_the_empire_of_the_constitution_desc:0 "Avec « l’empire de la Constitution », nous visons à renforcer l’État de droit et la démocratie : consolider les institutions, garantir la séparation des pouvoirs, protéger les droits individuels et promouvoir une gouvernance transparente."
 PRU_the_new_oil_law:0 "La nouvelle loi pétrolière"
 PRU_the_new_oil_law_desc:0 "Elle entend restructurer les politiques liées à l’industrie pétrolière en favorisant l’investissement, l’efficacité et la durabilité. La nouvelle loi doit stimuler le développement économique grâce à une gestion responsable des ressources."
 PRU_oil_deal_with_the_united_states:0 "Accord pétrolier avec les États-Unis"
 PRU_oil_deal_with_the_united_states_desc:0 "Nous voulons promouvoir la coopération économique et stratégique dans le secteur pétrolier, encourager les investissements et les technologies avancées. L’accord pétrolier avec les États-Unis vise à renforcer les relations bilatérales, développer l’énergie et contribuer à la croissance du Pérou."
 PRU_great_national_construction_program:0 "Grand programme national de construction"
 PRU_great_national_construction_program_desc:0 "Cette approche ambitieuse vise à dynamiser les infrastructures du pays — routes, ponts, énergie et plus encore. Le programme stimule l’économie, crée des emplois et améliore la qualité de vie, posant ainsi les bases d’un avenir prospère et durable."
 PRU_womens_right_to_vote:0 "Droit de vote des femmes"
 PRU_womens_right_to_vote_desc:0 "Nous recherchons l’égalité des genres et une pleine participation au processus démocratique, en reconnaissant et en renforçant le rôle fondamental des femmes. En leur accordant le droit de vote, nous avançons vers une représentation plus inclusive et équitable."
 PRU_a_new_military_doctrine:0 "Une nouvelle doctrine militaire"
 PRU_a_new_military_doctrine_desc:0 "Nous cherchons à moderniser nos forces armées, en tirant parti de l’expérience et des leçons de nos alliés pour garantir une défense efficace et prête."
 PRU_japanese_investment_in_the_naval_industry:0 "Investissements japonais dans l’industrie navale"
 PRU_japanese_investment_in_the_naval_industry_desc:0 "Cette collaboration stratégique permet l’entrée d’investissements japonais dans notre secteur naval, afin de moderniser et d’étendre nos capacités maritimes. Objectif : assurer la défense de nos côtes et sceller une coopération durable avec nos alliés japonais."
 PRU_invite_japanese_naval_advisors:0 "Inviter des conseillers navals japonais"
 PRU_invite_japanese_naval_advisors_desc:0 "Nous adressons une cordiale invitation à des conseillers navals japonais pour collaborer étroitement avec nos forces. Cette étape stratégique renforce notre défense navale et favorise une alliance durable avec le Japon dans le domaine militaire."
 PRU_German_investment_in_the_military_industry:0 "Investissements allemands dans l’industrie militaire"
 PRU_German_investment_in_the_military_industry_desc:0 "Cet effort stratégique ouvre notre complexe militaro-industriel aux investissements allemands, pour moderniser et étendre nos capacités. Le but est de renforcer notre défense et de bâtir un partenariat durable avec nos alliés allemands."
 PRU_invite_german_military_advisors:0 "Inviter des conseillers militaires allemands"
 PRU_invite_german_military_advisors_desc:0 "Nous souhaitons partager des connaissances tactiques, stratégiques et technologiques avancées, améliorant ainsi notre capacité défensive. Cette étape consolide notre préparation militaire et une alliance durable avec l’Allemagne."
 PRU_expel_the_reds_from_america:0 "Chasser les rouges d’Amérique"
 PRU_expel_the_reds_from_america_desc:0 "Cette stratégie renforce la coopération avec nos alliés anticommunistes pour résister et expulser l’influence rouge de nos nations. Avec les autres pays du continent, nous nous engageons à préserver la stabilité et la liberté."
 PRU_long_live_our_caudillo:0 "Vive notre Caudillo"
 PRU_long_live_our_caudillo_desc:0 "Cette initiative réaffirme notre engagement envers le leadership fort et visionnaire de notre Caudillo. Nous cherchons à consolider son héritage, promouvoir la stabilité interne et renforcer l’unité nationale."
 PRU_The_new_South_american_axis:0 "Le nouvel Axe sud-américain"
 PRU_The_new_South_american_axis_desc:0 "Stratégie ambitieuse pour renforcer la coopération et l’unité entre nations sud-américaines, en promouvant stabilité et développement conjoint. Sécurité, économie, diplomatie : bâtissons un bloc solide qui défend des intérêts communs et la prospérité régionale."
 PRU_american_fascist_union:0 "Union fasciste américaine"
 PRU_american_fascist_union_desc:0 "Nous voulons consolider un front politique unifié, promouvant les principes fascistes pour assurer stabilité et ordre. Sous la direction de cette union, nous appliquerons des politiques renforçant l’autorité de l’État, l’unité nationale et la prospérité."
 PRU_Create_the_Royal_Army:0 "Créer l’Armée royale"
 PRU_Create_the_Royal_Army_desc:0 "Nous cherchons à former une force militaire loyale à la monarchie péruvienne, garantissant la défense de la nation et la préservation des valeurs monarchiques."
 PRU_The_Soldier_King:0 "Le roi-soldat"
 PRU_The_Soldier_King_desc:0 "Par un geste sans précédent, notre monarque assume un rôle actif de commandement en tant que « roi-soldat ». En inspirant les forces armées et en menant la stratégie, il démontre son engagement indéfectible envers la sécurité du Pérou. Cette approche renforce notre position militaire et son image de dirigeant courageux."
 PRU_Royal_Construction_Program:0 "Programme royal de construction"
 PRU_Royal_Construction_Program_desc:0 "Ce plan ambitieux réunit des projets clés pour dynamiser l’économie, les infrastructures et la technologie. En investissant dans la modernisation, nous renforcerons notre place dans le monde et réaffirmerons la grandeur de la monarchie péruvienne."
 PRU_Acquire_French_weapons:0 "Acquérir des armes françaises"
 PRU_Acquire_French_weapons_desc:0 "Pour renforcer nos forces armées, nous recherchons une collaboration avec la France pour l’acquisition d’armements avancés. En intégrant technologies et équipements français, nous fortifions nos défenses et notre engagement pour la sécurité nationale."
 PRU_sons_of_the_conquistador:0 "Fils des conquistadors"
 PRU_sons_of_the_conquistador_desc:0 "Afin de revitaliser l’esprit de nos ancêtres et d’honorer l’héritage des conquistadors. En reconnaissant leur bravoure et leur audace, nous aspirons à forger un avenir de grandeur et de réussite."
 PRU_defend_our_empire:0 "Défendre notre empire"
 PRU_defend_our_empire_desc:0 "Dans un monde incertain, c’est notre devoir de protéger notre empire. En nous unissant pour sa défense, nous garantirons la sécurité de nos frontières et l’avenir de la monarchie péruvienne."
 PRU_Receive_refugees_from_the_Spanish_civil_war:0 "Accueillir des réfugiés d’Espagne"
 PRU_Receive_refugees_from_the_Spanish_civil_war_desc:0 "Face aux ravages de la guerre civile en Espagne, nous ouvrons nos portes aux réfugiés en quête de sécurité. En les accueillant, nous tendons la main tout en enrichissant nos communautés par leurs talents et leur diversité."
 PRU_return_to_europe:0 "Retour en Europe"
 PRU_return_to_europe_desc:0 "L’heure est venue pour le Pérou de retourner en Europe et de restaurer la gloire de l’Empire espagnol. Cet axe préparera notre chemin de retour vers l’Espagne et la fondation d’un nouvel empire."
 PRU_create_the_united_kingdom_of_spain:0 "Créer le Royaume-Uni d’Espagne"
 PRU_create_the_united_kingdom_of_spain_desc:0 "Pour restaurer la gloire de l’Empire espagnol, le Pérou prendra l’initiative de créer le Royaume-Uni d’Espagne. Cet axe nous guidera à travers les étapes nécessaires pour unifier les territoires espagnols et établir un royaume puissant, rival des grandes nations d’Europe."
 PRU_all_spanish_cores_controlled_by_self_or_puppet_tt:0 "Tous les cœurs territoriaux espagnols sont contrôlés par [ROOT.GetNameDef] ou l’un de ses sujets."
 PRU_Bring_the_revolution_to_all_America:0 "Apporter la révolution à toute l’Amérique"
 PRU_Bring_the_revolution_to_all_America_desc:0 "Le souffle révolutionnaire se fera sentir dans toute l’Amérique latine. Après des années au service du grand capital et du grand démon américain, il est temps de se lever et de briser les chaînes."
 PRU_radicalize_the_pcp:0 "Radicaliser le PCP"
 PRU_radicalize_the_pcp_desc:0 "Depuis sa fondation, le Parti communiste péruvien s’est appuyé sur les doctrines soviétiques. Mais tant qu’il restera lié à la figure socialiste de Mariátegui, penseur d’un socialisme péruvien moins autoritaire, il sera limité. La meilleure option pour écarter cette pensée est de radicaliser le parti et d’effacer toute idéologie contraire au dogme soviétique."
 PRU_revolutionary_vanguard:0 "Avant-garde révolutionnaire"
 PRU_revolutionary_vanguard_desc:0 "La Vanguardia Revolucionaria (VR), fondée en 1935, devint une référence majeure de la gauche péruvienne et l’une des souches à partir desquelles naquirent diverses organisations socialistes."
 PRU_give_power_to_cgtp:0 "Donner le pouvoir à la CGTP"
 PRU_give_power_to_cgtp_desc:0 "La Confédération générale des travailleurs du Pérou, d’idéologie mariateguienne, fondée en 1929 par José Carlos Mariátegui, s’oriente par la lutte des classes. Son mot d’ordre est « Pour l’unité prolétarienne » et son organe officiel est Labor."
 PRU_request_soviet_support:0 "Demander le soutien soviétique"
 PRU_request_soviet_support_desc:0 "Le voyage de Ravines en Union soviétique en 1930 a renforcé nos liens. Le plan de Moscou convenu avec lui a été appliqué puisque le Pérou est sous mandat communiste, mais un appui financier et militaire substantiel des Soviétiques est nécessaire pour durer et étendre la révolution en Amérique du Sud."
 PRU_soviet_support:0 "Soutien [SOV.GetAdjective]"
 PRU_the_peruvian_five_year_plan:0 "Le plan quinquennal péruvien"
 PRU_the_peruvian_five_year_plan_desc:0 "Le plan quinquennal soviétique transforma un pays rural en nation industrialisée. Depuis 1821, le Pérou est resté surtout rural et minier, sans véritable industrie nationale. L’effort demandé au peuple sera largement récompensé par une industrialisation réussie."
 PRU_exile_haya_de_la_torre:0 "Exiler Haya de la Torre"
 PRU_exile_haya_de_la_torre_desc:0 "Víctor Raúl Haya de la Torre est l’un des plus grands agitateurs politiques. Depuis la fondation de l’APRA, il trouble la stabilité du pays. Ses paroles mobilisent indigènes, paysans et petite classe moyenne appauvrie. Le mieux serait de l’exiler au Mexique."
 PRU_the_memory_of_benavides:0 "La mémoire de Benavides"
 PRU_the_memory_of_benavides_desc:0 "Benavides fut l’un des artisans de la reconstruction après le fiasco du gouvernement Sánchez Cerro et la crise économique. Après sa mort, ses actions et son grand gouvernement restent dans la mémoire de tous les Péruviens."
 PRU_Recovering_from_the_civil_war:0 "Sortir de la dépression"
 PRU_Recovering_from_the_civil_war_desc:0 "Après la Grande Dépression de 1929 et la mort de Luis Sánchez Cerro, le Pérou entra dans une grave crise qui bloqua son développement. En utilisant correctement les rares ressources minières existantes — et celles à découvrir — nous pourrions bâtir une économie solide."
 PRU_peruvian_military_youth:0 "Jeunesse militaire péruvienne"
 PRU_peruvian_military_youth_desc:0 "Le service militaire obligatoire a suscité débats et controverses pour ses méthodes violentes, allant jusqu’à maltraiter et torturer des jeunes enrôlés de force. À la fin des années 1930, sa cruauté sera pleinement révélée. Ce nouveau système de recrutement fournira néanmoins de nouveaux soldats à l’armée."
 PRU_the_victory_of_our_caudillo:0 "La victoire de notre Caudillo"
 PRU_the_victory_of_our_caudillo_desc:0 "Le caudillo est un chef politique, militaire ou idéologique. Aujourd’hui, le dirigeant militaire qui gouverne le Pérou a vaincu tous ses rivaux et s’est imposé comme le leader le plus puissant du pays."
 PRU_liberate_all_cab:0 "Porter la révolution dans les Caraïbes"
 PRU_liberate_all_cab_desc:0 "Le grand démon américain a étendu ses tentacules au-delà de ses frontières, plantant son drapeau à Porto Rico et en République dominicaine. Le devoir sacré des peuples d’Amérique du Sud est d’unir leurs forces pour chasser les forces maléfiques de l’Oncle Sam."
 PRU_develop_the_provinces:0 "Pan-incaïsme"
 PRU_develop_the_provinces_desc:0 "L’éclat de la grandeur inca doit éclairer notre chemin vers l’avenir. Cette renaissance culturelle renforcera notre identité nationale et ralliera les indigènes jadis membres de l’Empire inca à notre cause. Que l’esprit de l’Empire guide notre marche vers la grandeur !"
 PRU_legacy_of_the_war_with_ecuador:0 "Héritage de la guerre contre l’Équateur"
 PRU_legacy_of_the_war_with_ecuador_desc:0 "Pour une victoire totale, [ROOT.GetLeader] doit sécuriser l’ensemble des Andes. La République [ECU.GetNameDefCap] reste une menace qui mordra sans cesse nos talons si nous ne l’éliminons pas."
 PRU_american_naval_doctrine:0 "Doctrine navale américaine"
 PRU_american_naval_doctrine_desc:0 "La doctrine navale [USA.getAdjective] aidera à la renaissance de notre marine obsolète. Nos tactiques d’un autre siècle ne serviraient pas dans un grand conflit ; collaborer avec cette puissance maritime est notre meilleure option."
 PRU_recover_from_the_economic_crisis:0 "Sortir de la crise économique"
 PRU_recover_from_the_economic_crisis_desc:0 "Après la Grande Dépression de 1929 et la mort de Luis Sánchez Cerro, le Pérou entra dans une crise profonde. Bien employés, les gisements existants — et ceux à découvrir — permettront de bâtir une économie solide."
 PRU_freedom_defenders:0 "Défenseurs de la liberté"
 PRU_freedom_defenders_desc:0 "Entourés de dictatures, notre statut de pays libre et démocratique est en danger. Soyons l’exemple d’un pays moderne où les libertés individuelles font progresser la nation."
 PRU_include_llamas_in_the_army:0 "Inclure les lamas dans l’armée"
 PRU_include_llamas_in_the_army_desc:0 "Le lama, camélidé domestique sélectionné par les peuples andins à partir du guanaco, fut pleinement exploité par l’Empire inca. Il a toute sa place dans notre logistique militaire."
 PRU_german_aeronautic_cooperation:0 "Coopération aéronautique allemande"
 PRU_german_aeronautic_cooperation_desc:0 "Les avions [GER.getAdjective] sont robustes et lourds : parfaits pour notre force aérienne."
 PRU_japanece_naval_doctrine:0 "Doctrine navale japonaise"
 PRU_japanece_naval_doctrine_desc:0 "La doctrine navale [JAP.getAdjective] aidera à la renaissance de notre marine obsolète. Nos tactiques d’antan seraient inutiles lors d’un grand conflit ; coopérer avec cette puissance maritime est notre meilleure option."
 PRU_contact_pedro:0 "Soutenir la revendication de Pedro"
 PRU_contact_pedro_desc:0 "Pedro Enrique d’Orléans-Bragance, « le Prince attendu », descendant de la famille impériale brésilienne, prétendit au trône du Brésil de 1921 à sa mort en juillet 1981. Il succéda à sa grand-mère, la princesse Isabelle, à la tête de la Maison impériale en novembre 1921, soutenu par les monarchistes et son oncle, le prince Pedro de Alcântara. Cousin germain de la princesse María de las Mercedes, comtesse de Barcelone, il était donc cousin du roi Juan Carlos Ier et cousin et arrière-grand-oncle du roi Felipe VI d’Espagne."
 PRU_restore_the_empire:0 "Restaurer l’Empire"
 PRU_restore_the_empire_desc:0 "L’ancien Empire du Brésil, qui sous ses monarques devint une puissance régionale — notre Roi juge qu’il est du devoir national de soutenir les partisans de Pedro Enrique, seul souverain légitime de tous les Brésiliens."
 PRU_control_the_economy:0 "Contrôler l’économie"
 PRU_control_the_economy_desc:0 "L’économie péruvienne est dominée par quelques grandes familles et une oligarchie réduite, tournées vers leurs intérêts et ceux de l’étranger. Que l’État prenne le contrôle des principaux moyens de production — agriculture, mines — en évinçant l’ancienne oligarchie de Lima, évitera une possible révolution capable de paralyser le pays."
 PRU_open_universities_to_indigenous_people:0 "Ouvrir les universités aux indigènes"
 PRU_open_universities_to_indigenous_people_desc:0 "Longtemps, les Quechuas et Aymaras — majoritaires — n’ont pas eu accès à un enseignement de qualité, concentré à Lima. L’ouverture d’écoles et d’universités publiques aux indigènes révélera des talents jusque-là cachés."
 PRU_reject_international_ideologies:0 "Rejeter les idéologies étrangères"
 PRU_reject_international_ideologies_desc:0 "Communisme et fascisme ont inondé paysans et classes moyennes, les détachant de leurs racines incas et les faisant sympathiser avec des puissances étrangères. Interdire ces idéologies évitera une révolution future contre l’héritage inca."
 PRU_organize_protests_in_the_south:0 "Organiser les indigènes du Sud"
 PRU_organize_protests_in_the_south_desc:0 "La mobilisation des Quechuas sur les places de Cuzco, Arequipa et Puno pourrait alerter le gouvernement central d’une possible révolution et paralyser ces régions, privant la capitale de métaux et denrées qu’elles produisent."
 PRU_convince_the_high_command:0 "Convaincre le haut commandement"
 PRU_convince_the_high_command_desc:0 "Au sein de la Junte, des chefs militaires influents sympathisent avec l’idée de réformer l’Incanat. En discutant avec eux, nous pourrions obtenir leur soutien en cas de révolution."
 PRU_monumental_architecture:0 "Architecture monumentale"
 PRU_monumental_architecture_desc:0 "L’architecture inca se distingue par la précision des formes, la solidité, la symétrie et l’harmonie avec le paysage. Les constructeurs incas maîtrisaient des murs gigantesques — de véritables mosaïques de blocs taillés s’ajustant à la perfection, sans qu’une aiguille puisse passer entre eux."
 PRU_the_march_of_the_four_suyos:0 "La marche des Quatre Suyos"
 PRU_the_march_of_the_four_suyos_desc:0 "Les indigènes de tout le Pérou se rassemblent pour lancer le coup contre le gouvernement central. Les peuples des quatre suyos s’unissent pour une cause commune : la restauration de l’Empire inca."
 PRU_look_to_the_past_2:0 "Regarder vers le passé"
 PRU_look_to_the_past_2_desc:0 "Le passé splendide de l’époque vice-royale vit encore dans la mémoire de la plupart des Péruviens qui, lassés de la république, veulent un changement immédiat. Trop souvent, la République n’a apporté que division et corruption. Le souvenir d’une époque riche et fastueuse attise la flamme de la révolution."
 PRU_Convince_supporters_of_Flores:0 "Convaincre les partisans de Flores"
 PRU_Convince_supporters_of_Flores_desc:0 "De bonnes sources indiquent que des membres de l’Union Revolucionaria proche de Luis Alberto Flores ont des penchants monarchistes. Le nationalisme intransigeant de Flores déçoit ses partisans les plus conservateurs, qui rejoignent peu à peu les manifestations pour placer un roi à la tête du Pérou."
 PRU_secure_the_northern_road_network:0 "Sécuriser le réseau routier du Nord"
 PRU_secure_the_northern_road_network_desc:0 "Les infrastructures qui relient le Nord à la capitale sont d’une importance stratégique. Si elles étaient coupées, le gouvernement central serait privé de pétrole et de caoutchouc, majoritairement issus du Nord. Il comprendrait alors la gravité des revendications en faveur d’un gouvernement monarchique."
 PRU_Support_the_Catholic_Church:0 "Soutenir l’Église catholique"
 PRU_Support_the_Catholic_Church_desc:0 "La Constitution reconnaît l’apport de la religion catholique à la formation de la nation. Bien que majoritaire, le Pérou n’est plus un État confessionnel et garantit la liberté religieuse. La « religion populaire » naît d’un syncrétisme entre catholicisme et pratiques préhispaniques."
 PRU_organize_marches_in_the_north:0 "Organiser des marches dans le Nord"
 PRU_organize_marches_in_the_north_desc:0 "Les villes du Nord comptent une majorité d’Hispaniques et de Métis. Les rassembler sur les grandes places de Trujillo, Piura, Lima et Tumbes peut faire pression sur le gouvernement central. Les protestations pourraient dégénérer en vraie révolution."
 PRU_launch_the_coup:0 "Lancer le coup d’État"
 PRU_launch_the_coup_desc:0 "Le système républicain ne fonctionne pas. Depuis 1821, le Congrès a plongé le pays dans une crise sociale et économique qui a figé société et industrie. La refondation du Pérou sous l’autorité d’un roi peut ouvrir une ère de splendeur et de gloire."
 PRU_our_revolution:0 "Notre révolution"
 PRU_our_revolution_desc:0 "Avec la création de l’Alianza por la Revolución Americana, il s’agit de faire face aux exigences de Moscou et aux pays communistes qui traitent leurs alliés comme de simples colonies. [ROOT.GetLeader] entend guider la grande révolution sud-américaine."
 alliance_for_the_american_revolution:0 "Alliance pour la révolution américaine"
 PRU_revolucion_restauradora:0 "Rétablir l’ordre"
 PRU_revolucion_restauradora_desc:0 "La Revolución Restauradora, menée par le héros de Panupali, le général Manuel Odría, est la seule issue pour mettre fin à l’incompétence de l’ancienne classe politique et inaugurer une ère sans corruption et prospère pour [ROOT.GetNameDefCap]."
 PRU_trans_pacific_alliance:0 "Rejoindre la Sphère de coprospérité"
 PRU_trans_pacific_alliance_desc:0 "L’idée d’entrer dans la Sphère de coprospérité a été proposée par [ROOT.GetLeader] après des contacts avec les dirigeants [JAP.getAdjective]. Par le passé, de nombreux immigrés japonais sont arrivés en [ROOT.GetNameDefCap], contribuant fortement à l’économie et au développement agricole."
 PRU_join_axis:0 "Rejoindre l’Axe"
 PRU_join_axis_desc:0 "[ROOT.GetLeader] a proposé d’entrer dans l’Axe après des contacts avec les [GER.getAdjective]. Bien avant, [ROOT.GetNameDefCap] s’était rapproché de [GER.GetNameDefCap] — rue de Lima à Berlin, instructeurs militaires enseignant l’emploi des chars à l’armée [ROOT.getAdjective]."
 PRU_inti_raymi:0 "Héritage d’Inti"
 PRU_inti_raymi_desc:0 "L’incaïsme — sentiment de la suprématie de la « race du cuivre », enfants uniques du Soleil — rallie aujourd’hui ses descendants en une force unique pour embrasser leurs alliés quechuas sud-américains et se souvenir du passé splendide."
 runasimi_union:0 "Union Runasimi"
 PRU_legacy_of_guayaquil_treaty:0 "Héritage du traité de Guayaquil"
 PRU_legacy_of_guayaquil_treaty_desc:0 "Notre frontière nord sera renforcée si l’un des prétendus anciens États bolivariens invoque l’uti possidetis juris pour appuyer ses revendications sur Loreto et Pastaza !"
 PRU_hispanic_union:0 "Union hispanique"
 PRU_hispanic_union_desc:0 "L’histoire de l’héritage hispanique au Pérou est incarnée par l’hispaniste José de la Riva Agüero y Osma qui, évoquant l’époque fastueuse du vice-royaume, aspire à ressouder une unité forte en réunissant les hispanistes d’Amérique du Sud."
 union_hispanica:0 "Unión Hispánica"
 PRU_attack_japan:0 "Attaquer le Japon"
 PRU_attack_japan_desc:0 "Comme convenu avec nos nouveaux alliés [ENG.GetNameDefCap] et [USA.GetNameDefCap], nous devons frapper [JAP.GetNameDefCap] au plus vite et mettre fin à son règne de terreur en Asie."
 PRU_attack_germany:0 "Attaquer l’Allemagne"
 PRU_attack_germany_desc:0 "Comme convenu avec nos nouveaux alliés [ENG.GetNameDefCap] et [USA.GetNameDefCap], nous devons frapper [GER.GetNameDefCap] au plus vite et mettre fin à son règne de terreur en Europe."
 PRU_hit_argentina:0 "Abattre le géant du Sud"
 PRU_hit_argentina_desc:0 "Le pays de notre libérateur San Martín, aujourd’hui le plus prospère d’Amérique du Sud, doit tomber pour laisser place à la nouvelle puissance sud-américaine."
 PRU_hit_chile:0 "Guerre de revanche"
 PRU_hit_chile_desc:0 "Après la Guerre du Pacifique, notre armée et notre marine furent totalement vaincues. La soif de revanche, entretenue par [ROOT.GetLeader], grandit chez les nouvelles générations. Le moment approche de récupérer nos territoires perdus."
 PRU_ochenio_de_Odria:0 "Dictature d’Odría"
 PRU_ochenio_de_Odria_desc:0 "Visionnaire, Manuel Odría voulut moderniser le pays : unités de quartier, unités scolaires, grand hôpital des employés, grandes autoroutes reliant tous les recoins du pays — porter la modernité jusqu’au dernier point."
 PRU_hit_colombia:0 "Expansion vers le Nord"
 PRU_hit_colombia_desc:0 "Après la brève guerre de Leticia et l’abandon du trapèze amazonien par l’antipatriote Óscar Benavides, l’heure est venue de récupérer notre territoire sous la conduite de [ROOT.GetLeader], qui mènera le Pérou à la victoire pour restaurer nos frontières originelles."
 PRU_the_final_march:0 "La marche finale"
l_french:
 PRU_the_final_march_desc:0 "L’empire américain veut s’étendre à notre pays et renverser le gouvernement de [ROOT.GetLeader]. Il est temps d’unifier tout le peuple [ROOT.getAdjective] pour former un grand poing qui portera le coup mettant à bas le grand géant d’Amérique, pour la liberté de tout le peuple [ROOT.getAdjective]."
 PRU_precious_metal_exports:0 "Exportations de métaux précieux"
 PRU_precious_metal_exports_desc:0 "Nos ressources naturelles, comme le cuivre, l’or et l’acier, propulseront notre pays vers le succès."
 PRU_la_legion_peruana:0 "La Legión Peruana"
 PRU_la_legion_peruana_desc:0 "Nous devons renforcer notre armée en réactivant la Legión Peruana, l’ancien corps d’élite utilisé dans les heures difficiles de [PRU.GetNameDefCap], mais nous la formerons cette fois avec des Quechuas."
 PRU_incaism:0 "Notre glorieux passé"
 PRU_incaism_desc:0 "L’Empire inca fut jadis l’un des plus puissants d’Amérique précolombienne ; nous devons resserrer nos liens avec cet héritage."
 PRU_integrate_women1:0 "Intégrer les femmes"
 PRU_integrate_women1_desc:0 "Les femmes péruviennes sont le pilier de notre économie et de la vie familiale traditionnelle ; leur inclusion dans les usines accroîtra l’efficacité de notre industrie naissante."
 PRU_oil_republic:0 "République du pétrole"
 PRU_oil_republic_1:0 "République du pétrole"
 PRU_new_peru_1:0 "Nouveau Pérou"
 PRU_new_peru_1_desc:0 "Après une ère de dirigeants corrompus et d’oligarques, il est temps pour [PRU.GetNameDefCap] d’entrer dans une nouvelle ère, d’évoluer dans ses politiques et de renouveler sa classe politique."
 PRU_riva_agueros:0 "Le rêve de Riva Agüero"
 PRU_riva_agueros_desc:0 "L’idéologue catholique José de la Riva Agüero y Osma souhaitait un nationalisme péruvien sans tomber dans l’extrémisme fasciste ; aujourd’hui, son rêve devient réalité."
 PRU_agricultural:0 "Réforme agraire"
 PRU_agricultural_desc:0 "Notre agriculture, riche et diversifiée, a toujours été l’un des grands moteurs du pays ; son récent essor profitera à toutes les classes sociales de [PRU.GetNameDefCap]."
 PRU_revolucion:0 "Révolution conservatrice restauratrice"
 PRU_revolucion_desc:0 "Le général Odría, héros du combat de Panupali, avec son parti Unión Nacional Odriísta (UNO), nous conduira vers la victoire et le développement dont notre pays a besoin."
 PRU_wake_up:0 "Réveiller un géant"
 PRU_wake_up_desc:0 "Un grand pays se lève ; par la volonté et la foi de son peuple, il imposera sa volonté à ses voisins."
 PRU_wake_up_fascism:0 "Réveiller un géant"
 PRU_wake_up_fascism_desc:0 "Un grand pays se lève ; par la volonté et la foi de son peuple, il imposera sa volonté à ses voisins."
 PRU_inti:0 "Héritage d’Inti"
 PRU_inti_1:0 "Héritage d’Inti"
 PRU_inti_2:0 "Héritage d’Inti"
 PRU_inti_desc:0 "L’union de tous les Quechuas des pays sud-américains créera une nouvelle armée qui nous mènera à la victoire."
 PRU_nationalizex_the_banking_sector:0 "Banques nationalisées"
 PRU_nightmare:0 "Révolution en cours"
 PRU_nightmare_desc:0 "Le cauchemar de [PRU.getLeader] est aujourd’hui la volonté du peuple, que le gouvernement n’arrive pas à satisfaire par les réformes sociales nécessaires."
 PRU_rights_to_indigenous_people:0 "Droits pour les peuples autochtones"
 PRU_social_spending:0 "Hausse des dépenses sociales"
 PRU_arm_people:0 "Armer le peuple"
