MPL_AI_BEHAVIOR:0 "£GFX_gamerules_MPL_mandate  Mandat de Palestine"

RULE_OPTION_MPL_MANDATE_STAY:0 "£GFX_gamerules_MPL_mandate  Le Mandat résiste"
RULE_OPTION_MPL_MANDATE_STAY_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope promulguera des règlements d’urgence et fera face à toute résistance des milices juives ou arabes."
RULE_OPTION_MPL_MANDATE_COLLAPSE:0 "£GFX_gamerules_ISR_state  £GFX_gamerules_PAL_neutrality  Effondrement du Mandat"
RULE_OPTION_MPL_MANDATE_COLLAPSE_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope promulguera des règlements d’urgence mais échouera à réprimer assez vite la résistance juive et arabe, provoquant l’effondrement du Mandat."
RULE_OPTION_MPL_PREPARATIONS_COLLAPSE:0 "£GFX_gamerules_ISR_state  £GFX_gamerules_PAL_neutrality  S’accrocher à une illusion"
RULE_OPTION_MPL_PREPARATIONS_COLLAPSE_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope déclarera la fin du Mandat, mais échouera à gérer l’équilibre des pouvoirs entre le Yishouv et le Comité arabe, provoquant l’effondrement du Mandat."
RULE_OPTION_MPL_DISSOLVED:0 "£GFX_gamerules_ISR_state  £GFX_gamerules_MPL_Jerusalem  £GFX_gamerules_PAL_neutrality  Une dissolution pacifique"
RULE_OPTION_MPL_DISSOLVED_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope déclarera la fin du Mandat. La Commission Peel décidera que la meilleure solution est de dissoudre le Mandat en deux États séparés, juif et arabe, tout en préservant l’équilibre des pouvoirs."
RULE_OPTION_MPL_UNION_COM:0 "£GFX_gamerules_MPL_free_communism  Une commune levantine"
RULE_OPTION_MPL_UNION_COM_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope déclarera la fin du Mandat. La Commission Peel décidera que la meilleure solution est de former un État unioniste indépendant regroupant Arabes et Juifs. L’équilibre des pouvoirs sera préservé, et le Parti communiste de Palestine remportera les élections."
RULE_OPTION_MPL_UNION_DEM:0 "£GFX_gamerules_MPL_free_democratic  Une confédération levantine"
RULE_OPTION_MPL_UNION_DEM_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope déclarera la fin du Mandat. La Commission Peel décidera que la meilleure solution est de former un État unioniste indépendant regroupant Arabes et Juifs. L’équilibre des pouvoirs sera préservé, et le Parti unioniste du Levant remportera les élections."
RULE_OPTION_MPL_UNION_COLLAPSE:0 "£GFX_gamerules_ISR_state  £GFX_gamerules_PAL_neutrality  Un rêve avorté"
RULE_OPTION_MPL_UNION_COLLAPSE_AI_DESC:0 "En réponse à la révolte arabe de 1936, Arthur Grenfell Wauchope déclarera la fin du Mandat. La Commission Peel décidera que la meilleure solution est de former un État unioniste indépendant regroupant Arabes et Juifs. L’équilibre des pouvoirs sera préservé, mais le nouvel État échouera à se stabiliser et s’effondrera."

ISR_AI_BEHAVIOR:0 "£GFX_gamerules_ISR_state  Israël"
RULE_OPTION_ISR_MAPAI:0 "£GFX_gamerules_ISR_state  La victoire de Mapai"
RULE_OPTION_ISR_MAPAI_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah réussiront à purger l’Irgoun, et le Mapai travailliste sioniste remportera les élections."
RULE_OPTION_ISR_HASHOMER:0 "£GFX_gamerules_ISR_state  Hashomer Hatsair"
RULE_OPTION_ISR_HASHOMER_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah réussiront à purger l’Irgoun, et le Hashomer Hatsair, sioniste socialiste proche de l’URSS, remportera les élections, en oscillant entre radicaux et modérés."
RULE_OPTION_ISR_MAKI:0 "£GFX_gamerules_MPL_free_communism  Maki"
RULE_OPTION_ISR_MAKI_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah réussiront à purger l’Irgoun, et le Hashomer Hatsair remportera les élections, mais sera supplanté par la faction plus radicale Maki."
RULE_OPTION_ISR_PROGRESSIVE:0 "£GFX_gamerules_ISR_state  La Nouvelle Aliyah"
RULE_OPTION_ISR_PROGRESSIVE_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah réussiront à purger l’Irgoun, et le bloc centriste remportera les élections, avec la Nouvelle Aliyah progressiste gagnant ensuite en influence."
RULE_OPTION_ISR_GENERAL_ZIONISTS:0 "£GFX_gamerules_ISR_state  Les Sionistes généraux"
RULE_OPTION_ISR_GENERAL_ZIONISTS_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah réussiront à purger l’Irgoun, et le bloc centriste remportera les élections, avec les libéraux Sionistes généraux en restant la principale force."
RULE_OPTION_ISR_HATZOHAR:0 "£GFX_gamerules_ISR_state  Révolution révisionniste"
RULE_OPTION_ISR_HATZOHAR_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah échoueront à purger l’Irgoun, mais celui-ci acceptera des élections démocratiques, que Jabotinsky remportera."
RULE_OPTION_ISR_IRGUN:0 "£GFX_gamerules_ISR_couped  Le feu et le sang"
RULE_OPTION_ISR_IRGUN_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah échoueront à purger l’Irgoun, qui renversera le gouvernement. Après la mort de Jabotinsky, l’Irgoun réprimera la révolte du Stern."
RULE_OPTION_ISR_FASCIST:0 "£GFX_gamerules_ISR_fascism  Venger les plus grandes tragédies"
RULE_OPTION_ISR_FASCIST_AI_DESC:0 "Pendant la guerre d’indépendance, les milices Haganah échoueront à purger l’Irgoun, qui renversera le gouvernement. L’Irgoun échouera à contenir la révolte du Stern, débouchant sur un régime ultranationaliste en Israël."

PAL_AI_BEHAVIOR:0 "£GFX_gamerules_PAL_neutrality  Palestine"
RULE_OPTION_PAL_QADIR:0 "£GFX_gamerules_PAL_neutrality  L’héritage d’Abdul-Qadir"
RULE_OPTION_PAL_QADIR_AI_DESC:0 "Pendant la guerre d’indépendance, le plan d’Abdul-Qadir sera choisi. Il réprimera les dissidents et fondera une Grande Palestine."
RULE_OPTION_PAL_HASHEMITE:0 "£GFX_gamerules_PAL_hashemite  Une monarchie hachémite"
RULE_OPTION_PAL_HASHEMITE_AI_DESC:0 "Pendant la guerre d’indépendance, le plan d’Abdul-Qadir sera choisi, mais il cédera son pouvoir au roi Zeid de la dynastie hachémite."
RULE_OPTION_PAL_NLL:0 "£GFX_gamerules_PAL_communism  Une grande patrie"
RULE_OPTION_PAL_NLL_AI_DESC:0 "Pendant la guerre d’indépendance, le plan de Fawzi Al-Qawuqji sera choisi, mais après la guerre il sera renversé par Radwan Al-Hilu du Parti communiste NLL, visant à établir un État panarabe."
RULE_OPTION_PAL_NASHASHIBI:0 "£GFX_gamerules_PAL_democratic  Les Nashashibi prennent leurs responsabilités"
RULE_OPTION_PAL_NASHASHIBI_AI_DESC:0 "Pendant la guerre d’indépendance, le plan de Fawzi Al-Qawuqji sera choisi, mais après la guerre il sera renversé par la famille Nashashibi, qui instaurera une démocratie avec Raghib Nashashibi comme premier dirigeant."
RULE_OPTION_PAL_SMC:0 "£GFX_gamerules_PAL_democratic  Le CSM prend ses responsabilités"
RULE_OPTION_PAL_SMC_AI_DESC:0 "Pendant la guerre d’indépendance, le plan de Fawzi Al-Qawuqji sera choisi, mais après la guerre il sera renversé par les conservateurs démocratiques du Conseil Suprême Musulman (CSM), qui établiront une république islamique."
RULE_OPTION_PAL_ISLAM:0 "£GFX_gamerules_PAL_islam  Prise de pouvoir par Al-Muqaddas"
RULE_OPTION_PAL_ISLAM_AI_DESC:0 "Pendant la guerre d’indépendance, le plan d’Abdul-Qadir sera choisi, mais il sera renversé par les islamistes. Les élections désigneront Amin Al-Husseini comme chef radical."
RULE_OPTION_PAL_HUSSAM:0 "£GFX_gamerules_PAL_hussam  Un État islamique modéré"
RULE_OPTION_PAL_HUSSAM_AI_DESC:0 "Pendant la guerre d’indépendance, le plan d’Abdul-Qadir sera choisi, mais il sera renversé par les islamistes. Les élections désigneront Hussam Al-Din comme chef modéré."
RULE_OPTION_PAL_HASAN:0 "£GFX_gamerules_PAL_islam  Le coup de Salama"
RULE_OPTION_PAL_HASAN_AI_DESC:0 "Pendant la guerre d’indépendance, le plan d’Abdul-Qadir sera choisi, mais il sera renversé par les islamistes. Les élections désigneront Hussam Al-Din comme chef modéré. En raison de sa modération, il sera ensuite renversé par le général fasciste Hasan Salama."
RULE_OPTION_PAL_FAWZI:0 "£GFX_gamerules_PAL_golani  Le coup de Fawzi"
RULE_OPTION_PAL_FAWZI_AI_DESC:0 "Pendant la guerre d’indépendance, le plan de Fawzi Al-Qawuqji sera choisi. Il réprimera le pouvoir civil et empêchera tout coup d’opposition."
RULE_OPTION_PAL_GOLANI:0 "£GFX_gamerules_PAL_golani  Golani prend le pouvoir"
RULE_OPTION_PAL_GOLANI_AI_DESC:0 "Pendant la guerre d’indépendance, le plan de Fawzi Al-Qawuqji sera choisi, mais il perdra face à Abdulhalim Al-Golani, qui le renversera."

#Modificateurs
r56_MPL_mandate_area:0 "Mandat de la Société des Nations"
r56_MPL_mandate_area_desc:0 "Désignée comme zone sous mandat par la Société des Nations, l’administration britannique exerce un contrôle accru sur les industries locales."
