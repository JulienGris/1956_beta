MPL_foreign_support_category:0 "Obtenir un soutien étranger"
MPL_foreign_support_category_desc:0 "Avec l’éclatement de la guerre dans le pays, de nombreuses grandes puissances portent leur attention sur la région, en raison de sa position stratégique. Nous devons en profiter pour obtenir un soutien étranger dans notre juste guerre pour notre libération. Mais nos ennemis l’ont aussi compris et se préparent à faire de même. Nous devons les devancer et nous assurer d’obtenir le maximum de soutien possible.\n\n[GER.GetFlag][GER.GetNameDefCap] - [MPLGetGER]\n[ITA.GetFlag][ITA.GetNameDefCap] - [MPLGetITA]\n[SOV.GetFlag][SOV.GetNameDefCap] - [MPLGetSOV]\n[ENG.GetFlag][ENG.GetNameDefCap] - [MPLGetENG]\n[FRA.GetFlag][FRA.GetNameDefCap] - [MPLGetFRA]\n[USA.GetFlag][USA.GetNameDefCap] - [MPLGetUSA]\n"

