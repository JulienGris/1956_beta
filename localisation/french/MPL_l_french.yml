MPL_arab_revolt_category:0 "Grève arabe imminente"
MPL_arab_revolt_category_desc:0 "Le mandat de la Société des Nations sur la Palestine a été fondé le 19 septembre 1923 sous la juridiction du Royaume-Uni. Bien qu’appauvrie par la Grande Guerre, la population locale s’est d’abord montrée relativement satisfaite, attendant de voir en quoi le nouveau mandat se distinguerait de la domination ottomane.\n\nLes Troisième à Cinquième Aliyah et l’immigration juive massive depuis 1919 ont encore détérioré les relations entre communautés arabes et juives. De petites implantations juives comme Tel-Aviv se sont transformées en villes majeures, dépassant des bastions arabes tels que Jaffa.\n\nAvec des tensions à leur comble après la découverte d’armes destinées aux milices de la Haganah dans des barils de ciment, on ne peut que s’attendre au pire. Des rumeurs parlent d’une grève massive touchant toute la région. Nous ne devons pas perdre de temps à nous préparer."
MPL_arab_revolt_mission:0 "Grève arabe imminente"
MPL_union_stabilization_category:0 "Une union instable"
MPL_union_stabilization_category_desc:0 "Qualifier notre union nouvelle-née d’instable serait un euphémisme. Notre gouvernement se retrouve à diriger un territoire habité par des Juifs, des Arabes et d’autres minorités comme les Druzes, tous cherchant à accroître leur influence.\n\nSi nous voulons préserver la paix, il faudra veiller à ce qu’aucun groupe ne soit marginalisé et équilibrer le soutien entre toutes les parties, sans quoi la région pourrait sombrer dans un conflit irréversible.\n\nSoutien actuel des £GFX_gamerules_ISR_state §3Juifs§! au gouvernement : [MPLGetJewSupport]\n\nSoutien actuel des £GFX_gamerules_PAL_democratic §Garabes§! au gouvernement : [MPLGetArabSupport]\n\nSoutien actuel des £GFX_gamerules_MPL_Jerusalem §Yminorités§! au gouvernement : [MPLGetMinoritySupport]"
