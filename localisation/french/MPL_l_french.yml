MPL_mandate_collapse_ISR_category:0 "Effondrement du Mandat"
MPL_mandate_collapse_PAL_category:0 "Effondrement du Mandat"
MPL_mandate_collapse_ISR_war_category:0 "La guerre arabo-israélienne"
MPL_mandate_collapse_ARAB_category:0 "La guerre arabo-israélienne"

MPL_mandate_collapse_ISR_category_desc:0 "Le mandat s’est effondré.\n\nNos forces ont pris le contrôle de la plaine côtière et de Jérusalem-Ouest, tandis que les Arabes se sont emparés de la Judée, de la Samarie et du désert du Néguev. Conserver les zones clés pourrait renforcer notre position et permettre une déclaration d’indépendance anticipée.\n\nSi vous le voulez, ce n’est pas un rêve !"
MPL_mandate_collapse_PAL_category_desc:0 "Le mandat s’est effondré.\n\nNos forces ont pris le contrôle de la Cisjordanie, de Gaza et de l’An-Naqab, tandis que les sionistes se sont emparés de Jérusalem-Ouest et de la plaine côtière. S’emparer de zones stratégiques renforcera notre position et affaiblira la préparation sioniste à proclamer l’indépendance.\n\nDe la rivière à la mer !"
MPL_mandate_collapse_ISR_war_category_desc:0 "À la suite de notre déclaration d’indépendance, les forces arabes ont envahi les territoires du Mandat et pris le relais des Palestiniens. Ils nous surpassent largement en nombre, nous devons donc nous retrancher et espérer le meilleur."
MPL_mandate_collapse_ARAB_category_desc:0 "Face à l’échec des Palestiniens à contenir les forces israéliennes, nous avons été contraints d’intervenir. Les Israéliens bénéficient d’un large soutien étranger et gagnent en puissance chaque jour. Nous devons les attaquer rapidement, avant d’être submergés."

ISR_mandate_collapse_mission:0 "Déclaration d’indépendance"
ISR_mandate_collapse_mission_desc:0 "La lutte pour notre liberté a commencé, mais nous ne devons pas céder à l’arrogance. Nous devons tenir le temps nécessaire pour préparer une déclaration formelle d’indépendance."
PAL_mandate_collapse_mission:0 "Écraser les forces sionistes"
PAL_mandate_collapse_mission_desc:0 "La bataille pour notre patrie a commencé. Nous avons l’avantage numérique, mais les zones juives sont plus industrialisées : il nous faut donc vaincre rapidement."
ISR_survival_mission:0 "Survivre à l’assaut"
ISR_survival_mission_desc:0 "Les forces arabes ont envahi et nous surpassent en nombre. Nous devons nous retrancher et tenir la ligne. Quand nous serons prêts, nous pourrons contre-attaquer en territoire ennemi et les forcer à accepter un cessez-le-feu."
ARAB_destory_israel_mission:0 "Écraser les forces israéliennes"
ARAB_destroy_israel_mission_desc:0 "Les forces palestiniennes ont montré leur faiblesse. Nous devons intervenir pour écraser l’État israélien. Mais chaque jour qui passe les renforce : nous devons frapper vite, car une retraite dans nos propres frontières nous forcerait à signer un cessez-le-feu."

ISR_hold_haifa_mission:0 "Tenir Haïfa"
ISR_hold_haifa_mission_desc:0 "Haïfa est le plus grand port de l’ancien Mandat. Le tenir est crucial pour l’approvisionnement de nos troupes. Nous devons le défendre à tout prix."
PAL_take_haifa_mission:0 "Prendre Haïfa"
PAL_take_haifa_mission_desc:0 "Haïfa est le plus grand port de l’ancien Mandat. Le capturer est crucial pour l’approvisionnement de nos troupes. Nous devons planifier sa conquête."

ISR_hold_jerusalem_mission:0 "Tenir Jérusalem"
ISR_hold_jerusalem_mission_desc:0 "Jérusalem, capitale spirituelle de notre peuple, doit être défendue à tout prix. La perdre serait un désastre pour le moral."
PAL_take_jerusalem_mission:0 "Prendre Jérusalem"
PAL_take_jerusalem_mission_desc:0 "Jérusalem, capitale spirituelle de notre peuple, doit être capturée à tout prix. Sa perte infligerait un coup terrible au moral israélien."

ISR_take_rashrash_mission:0 "Prendre Umm Al-Rashrash"
ISR_take_rashrash_mission_desc:0 "Diviser les forces arabes en deux améliorerait grandement nos chances de victoire. Nous devons avancer vers le sud et les séparer comme Moïse ouvrit la mer Rouge."
PAL_hold_rashrash_mission:0 "Tenir Umm Al-Rashrash"
PAL_hold_rashrash_mission_desc:0 "Si les Israéliens prenaient Umm Al-Rashrash, nos forces seraient coupées en deux. Nous devons tenir coûte que coûte."

MPL_aliyah_category:0 "La crise de l’Aliyah"
MPL_aliyah_category_desc:0 "Une crise migratoire a éclaté après notre indépendance. Fuyant le fascisme et l’antisémitisme en Europe et ailleurs, des centaines de milliers de réfugiés juifs affluent pour demander asile.\n\nNotre intérêt est de les accueillir en nombre, car un afflux de population renforcerait grandement notre jeune nation. Mais de nombreux groupes s’y opposent, affirmant que cela ne ferait qu’aggraver l’instabilité.\nNous devons agir prudemment, afin de ne pas braquer une partie de la population."
MPL_scale_back_immigration:0 "Réduire l’immigration"
MPL_setup_immigrant_camps_1:0 "Installer de petits camps d’immigrés"
MPL_setup_immigrant_camps_2:0 "Installer de grands camps d’immigrés"
MPL_form_kibbutsim:0 "Soutenir la formation de kibboutzim"
MPL_support_existing_communities:0 "Soutenir les communautés existantes"
MPL_immigrant_workers:0 "Employer des travailleurs immigrés"

MPL_mandate_resistance_category:0 "Stabiliser le Mandat"
MPL_mandate_resistance_category_desc:0 "La révolte en cours ne doit pas durer. Nous devons écraser tous les rebelles et rétablir l’ordre dans le Mandat.\n\n\nLe niveau actuel d’ordre est [MPLOrderLevelColour].\n§RSi le niveau d’ordre atteint 0, nous subirons une révolution !§!"
MPL_lower_strikes_1:0 "Pacifier les grèves"
MPL_lower_strikes_2:0 "Pacifier les grèves"
MPL_lower_strikes_3:0 "Pacifier les grèves"
MPL_growing_resistance:0 "Résistance croissante"
MPL_arrest_militia_leaders:0 "Arrêter les chefs de milices"
MPL_increase_police_patrols:0 "Augmenter les patrouilles de police"
MPL_raid_local_militias:0 "Désarmer les milices locales"
MPL_disrupt_militia_supplies:0 "Perturber les approvisionnements des milices"

MPL_stabilize_jordan_category:0 "Instabilité en Jordanie"
MPL_stabilize_jordan_category_desc:0 "Avec la perte récente de la Palestine mandataire, l’Émirat de Transjordanie traverse sa propre instabilité. Plus éloigné de notre contrôle, le peuple réclame l’indépendance. Nous pouvons accéder à cette demande ou envoyer les troupes rétablir l’ordre."
MPL_stabilize_jordan_mission:0 "Stabiliser la Jordanie"

MPL_stabilize_syria_category:0 "Agitation en Syrie"
MPL_stabilize_syria_category_desc:0 "Avec les récentes vagues d’indépendance au Moyen-Orient, nos craintes concernant la Syrie se confirment. De nombreux Syriens manifestent et des milices commencent à se former. Pour contrer cela, nous devons agir immédiatement."
MPL_stabilize_syria_mission:0 "Stabiliser la Syrie"

MPL_syria_war_category:0 "Guerre de libération"
MPL_syria_war_category_desc:0 "Bien que Saadé ait réussi à former une coalition de tous les partis [SYR.GetAdjective] contre les oppresseurs [MPL_syria_war_owner.GetAdjective], ce front uni reste fragile. Sans victoire rapide, la coalition risque de s’effondrer."
MPL_syria_peace:0 "Assurer la victoire"

MPL_independence_preparations:0 "Préparatifs d’indépendance"
MPL_independence_preparations_desc:0 "Après la décision de se retirer de la région à la suite de la récente vague massive de grèves et de révoltes, nous devons nous assurer de compléter tous les préparatifs nécessaires avant de nous retirer, afin que la nouvelle administration indépendante ne s’effondre pas.\n\nIndépendance politique actuelle : §Y[?MPL_political_independence]%§!\n\nIndépendance économique actuelle : §Y[?MPL_economic_independence]%§!\n\nIndépendance militaire actuelle : §Y[?MPL_military_independence]%§!\n\n§RATTENTION : Déclarer l’indépendance sans préparation suffisante entraînera une grave surcharge administrative !§!"

