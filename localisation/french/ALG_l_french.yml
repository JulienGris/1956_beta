ALG_neutrality_party:0 "JTW"
ALG_neutrality_party_long:0 "Jabhatu l-Tahrīri l-Watanī"

# idées
ALG_mediterranean_bastion_idea:0 "Bastion Méditerranéen"
ALG_study_french_ships:0 "Apprentissage Naval [FRA.GetAdjective]"
ALG_depoliticized_army:0 "Armée Dépolitisée"
ALG_bousfer_air:0 "Usines Aéronautiques de Bousfer"
ALG_religious_freedom_buff:0 "Liberté Religieuse"
ALG_crackdown_on_extremist_groups:0 "Répression des Pieds-Noirs"
ALG_malg_buff:0 "MALG"
ALG_reform_industries:0 "Réformes Industrielles"
ALG_land_reforms:0 "Réformes Agraires"
ALG_land_reforms_desc:0 "La réforme fiscale de l'administration coloniale a fortement limité le pouvoir et le potentiel agricole de nos terres. Le nouveau régime apprendra des erreurs passées en réformant le système fiscal et en actualisant le cadastre du pays."
ALG_army_loyalty_idea:0 "Loyauté de l'Armée Renforcée"
ALG_hadj_is_great:0 "La Guidance de Hadj"
ALG_abbas_is_great:0 "Unis sous Abbas"
ALG_communism_support:0 "Influence Communiste"
ALG_fascism_support:0 "Influence Fasciste"
ALG_new_industries:0 "Soutien aux Industries Lourdes"
ALG_provisional_government:0 "Gouvernement Provisoire [ALG.GetAdjective]"
ALG_provisional_government_desc:0 "Depuis l'indépendance, le Gouvernement Provisoire est actuellement administré par différents partis politiques tels que le JTW, l'ENA et même le PCA. Il y aura un immense équilibre des pouvoirs au sein de [ALG.GetNameDef] jusqu'à ce que nous puissions instituer un gouvernement légitime."
ALG_pieds_noir:0 "Pieds-Noirs"
ALG_pieds_noir_desc:0 "Les colons ou Pieds-Noirs sont des colonisateurs français et des loyalistes en Algérie. Pendant des années, ils ont dominé le gouvernement et contrôlé l'essentiel de la richesse algérienne. Ils continuent de bloquer ou retarder toutes les tentatives de réformes, même modestes, ce qui constituera un défi considérable pour établir un gouvernement légitime en Algérie."

#prioritée nationale
ALG_national_guard:0 "Crée cinq divisions de §HGarde nationale§! dans les zones rurales."
ALG_national_guard2:0 "Lève trois divisions supplémentaires de §HGarde nationale§! dans la région de la capitale."
ALG_armed_forces:0 "Forces armées [ALG.GetAdjective]"
ALG_armed_forces_desc:0 "La protection de notre pays repose sur trois branches militaires : l'armée de terre, la marine et l'armée de l'air. La mise en place d'une structure de commandement indépendante peut être fastidieuse, mais reste essentielle pour préserver notre autonomie."
ALG_APNAF:0 "Élever l'APNAF"
ALG_APNAF_desc:0 "La dépendance à la garnison coloniale appartient au passé. Il est temps de promouvoir des généraux [ALG.GetAdjective] et d'établir les Forces armées populaires [ALG.GetAdjective] en une armée légitime."
ALG_first_air_force:0 "Première Force aérienne algérienne"
ALG_first_air_force_desc:0 "Le contrôle de notre espace aérien dépendait autrefois de puissances étrangères. La renaissance de l'Algérie et de son héritage passe par l'investissement dans la première escadrille aérienne pour protéger nos frontières et sécuriser notre ciel."
ALG_ANN:0 "Créer la Marine nationale algérienne"
ALG_ANN_desc:0 "Notre long littoral méditerranéen nécessite une force capable de prévenir toute agression depuis la mer. La Marine nationale [ALG.GetAdjective] recevra des subventions gouvernementales et sera séparée en un département autonome."
ALG_naval_effort:0 "Réviser les doctrines navales"
ALG_naval_effort_desc:0 "Des attachés navals étrangers ont été invités à [ALG.GetNameDef] pour examiner l'état des forces navales. Le rapport remis à [ALG.GetLeader] indique que les doctrines nécessitent de sévères améliorations et que les amiraux responsables devront maîtriser de nouvelles tactiques."
ALG_destroyer_effort:0 "Destroyers modernes"
ALG_destroyer_effort_desc:0 "En tant que grand producteur et exportateur d'acier en Méditerranée, notre pays a de nombreux liens commerciaux. En cas de guerre, nos convois pourraient nécessiter protection. Commander quelques destroyers modernes suffira."
ALG_submarine_focus:0 "Combat sous-marin"
ALG_submarine_focus_desc:0 "L'ennemi peut posséder de grands navires, mais ils sont plus lents et moins manœuvrables que nos nouveaux sous-marins. Les améliorer permettra d'étendre les techniques d'attaque des convois en Méditerranée orientale et dans l'Atlantique."
ALG_algiers_port:0 "Chantiers navals d'Alger"
ALG_algiers_port_desc:0 "Le port d'Alger est sûr, protégé du vent et dispose de deux bassins pour une flotte marchande. L'agrandir permettra d'accueillir plus de convois et de produire des coques plus rapidement."
ALG_oran_port:0 "Élargir le port d'Oran"
ALG_oran_port_desc:0 "Le port d'Oran, notre fenêtre sur l'Atlantique, est le deuxième plus grand port du pays. L'améliorer permettra de construire plusieurs bassins et centres de production navale, ainsi que d'accueillir davantage de navires."
ALG_bejaia_port:0 "Créer le port de Béjaïa"
ALG_bejaia_port_desc:0 "À l'est d'Alger, Béjaïa est le principal centre de transport pour les régions de Constantine et Batna. Un port militaire ici étendra la portée de notre marine et facilitera l'approvisionnement de l'est du pays."
ALG_cruiser_focus:0 "Croiseurs modernes"
ALG_cruiser_focus_desc:0 "Les croiseurs, légers ou lourds, offrent un compromis parfait entre puissance de feu, tonnage et coût. Nos chantiers en produisent, mais ils sont dépassés par rapport aux modèles des Grandes Puissances et nécessitent une amélioration."
ALG_carrier_focus:0 "Aviation navale"
ALG_carrier_focus_desc:0 "Nous pouvons améliorer les opérations coordonnées entre marine et aviation grâce aux porte-avions. Certains sont déjà visibles dans nos ports ; c'est le moment de les construire nous-mêmes."
ALG_battleship_focus:0 "Les grosses pièces"
ALG_battleship_focus_desc:0 "Les cuirassés sont la fierté de la marine, concentrant puissance, blindage et artillerie. Nous devons investir dans leur développement et leur amélioration."
ALG_marines:0 "Créer un corps de Marines"
ALG_marines_desc:0 "Les forces spéciales représentent l'élite professionnelle et équipée de notre armée. Leur budget séparé pour les opérations maritimes améliorera nos capacités militaires."
ALG_bomber_focus:0 "Focus sur les bombardiers"
ALG_bomber_focus_desc:0 "Dominer les cieux est la première étape. Après avoir contrôlé le ciel avec nos chasseurs, nos escadrons de bombardiers semeront le désordre chez l'ennemi et détruiront leurs usines."
ALG_radar_focus:0 "Nouvelles technologies radar"
ALG_radar_focus_desc:0 "Protéger l'industrie nationale est crucial en cas de conflit. Les radars permettront de contrer les raids de bombardiers ennemis."
ALG_fighter_focus:0 "Chasseurs modernes"
ALG_fighter_focus_desc:0 "La guerre moderne se joue à la vitesse. Pour dominer les combats aériens, nous devons moderniser nos chasseurs obsolètes."
ALG_cas_focus:0 "Focus appui aérien rapproché"
ALG_cas_focus_desc:0 "Nos nouveaux bombardiers en piqué briseront le moral des troupes ennemies et provoqueront le désordre dans leurs armées."
ALG_air_bases:0 "Élargir les bases aériennes d'Alger"
ALG_air_bases_desc:0 "L'aéroport de Maison Blanche, créé en 1924, devient trop petit pour notre force aérienne. Il doit être agrandi pour un usage militaire."
ALG_bousfer_air_factory:0 "Ouvrir l'usine aéronautique de Bousfer"
ALG_bousfer_air_factory_desc:0 "Bousfer, proche d'Oran, est idéal pour produire de nouveaux avions."
ALG_develop_air_doctrines:0 "Développer les doctrines aériennes"
ALG_develop_air_doctrines_desc:0 "Un pilote sans doctrine moderne ne pourra exploiter ses appareils. Les diplômés de l'académie apprendront de nouvelles techniques."
ALG_mediterranean_baiston:0 "Bastion méditerranéen"
ALG_mediterranean_baiston_desc:0 "Que le monde sache que [ALG.GetNameDef], et non Malte, [GRE.GetNameDef] ou [ITA.GetNameDef], est le Bastion méditerranéen grâce à nos navires modernes et commandants qualifiés."
ALG_study_ships:0 "Étudier les navires [FRA.GetAdjective]"
ALG_study_ships_desc:0 "Les officiels [FRA.GetAdjective] apprécieront que nous coordonnions le développement naval. Certains de leurs navires sont à nos ports pour cela."
ALG_naval_bomber_focus:0 "Développement bombardier naval"
ALG_naval_bomber_focus_desc:0 "Les chercheurs [ALG.GetAdjective] ont créé une nouvelle branche aérienne : les bombardiers navals, essentiels pour coordonner marine et aviation."
ALG_doctrine_effort:0 "Collège militaire d'Alger"
ALG_doctrine_effort_desc:0 "L'APNAF utilise des doctrines de la Grande Guerre, obsolètes. L'Académie militaire doit former les forces terrestres aux doctrines modernes."
ALG_guns_focus:0 "Moderniser nos armes"
ALG_guns_focus_desc:0 "La milice coloniale manquait de financement. Le gouvernement [ALG.GetAdjective] ne reproduira pas cette erreur : le nouvel appel d'offre pour fusils est publié et nos fabricants travaillent pour équiper l'armée."
ALG_french_tanks:0 "Étudier les chars [FRA.GetAdjective]"
ALG_french_tanks_desc:0 "Lors de la réorganisation de l'une de nos bases militaires, nos ingénieurs ont eu la surprise de découvrir des chars français oubliés dans un des entrepôts. Le peuple [FRA.GetAdjective] a d'autres soucis à gérer, nous pouvons donc mettre ces 20 chars à bon usage et améliorer leur conception et leur maniabilité sur terrains difficiles."
ALG_artillery_focus:0 "Artillerie moderne"
ALG_artillery_focus_desc:0 "Les récents rapports de nos centres d'entraînement indiquent un besoin urgent d'améliorer nos pièces d'artillerie actuellement produites, car leur fiabilité, puissance de feu et capacité de perforation sont largement dépassées par rapport au matériel étranger reçu."
ALG_mechanized_focus:0 "Mécaniser l'armée"
ALG_mechanized_focus_desc:0 "Alors que nos troupes disposent d'équipements motorisés récemment développés, nos divisions blindées exigent une campagne de mécanisation. Nous remplacerons les camions légers d'infanterie blindés par des transports de troupes blindés, réduisant la vitesse globale de nos divisions, tout en offrant la couverture nécessaire à nos régiments d'infanterie."
ALG_general_staff:0 "Réorganiser l'État-Major"
ALG_general_staff_desc:0 "Les améliorations de l'armée sont inefficaces si nos soldats sont commandés par des officiers et commandants incompétents, endoctrinés ou corrompus. Une petite réorganisation de l'état-major augmentera les performances sur le terrain de nos troupes."
ALG_special_forces:0 "Les Lions du Désert"
ALG_special_forces_desc:0 "La guerre peut venir de la mer, de la terre et de l'air. En cas d'attaque terrestre, nos forces combattront dans le vaste désert à l'ouest et au sud du pays. L'expansion des forces de frappe désertiques capables de combattre sous des températures extrêmes et sur terrain sablonneux améliorera les capacités de combat de notre armée."
ALG_motorized:0 "Plan de motorisation"
ALG_motorized_desc:0 "L'un des facteurs de dévastation de la Grande Guerre fut l'utilisation massive de l'infanterie à pied. L'ère des bataillons lents est révolue, l'âge des bataillons motorisés mobiles a commencé, et nous tirerons un grand bénéfice de nos innovations !"
ALG_field_hospitals:0 "Nouveaux hôpitaux de campagne"
ALG_field_hospitals_desc:0 "Les conditions environnementales difficiles et les maladies tuent plus de soldats que l'ennemi actuel. La mise en place de bataillons hospitaliers de campagne améliorés donnera à nos soldats de meilleures chances de survie lors d'un conflit armé."
ALG_signal_companies:0 "Compagnies de transmission"
ALG_signal_companies_desc:0 "Les vastes territoires de notre pays, aux conditions environnementales changeantes, nous obligent à adopter de nouvelles méthodes de communication entre nos régiments terrestres, comme les lignes téléphoniques et la radio. Les compagnies de transmission récemment développées amélioreront considérablement la vitesse de réaction et la mobilité des forces terrestres."
ALG_modern_logistics:0 "Logistique moderne"
ALG_modern_logistics_desc:0 "Le ravitaillement et l'approvisionnement des garnisons et bataillons seront encore plus efficaces si un régiment indépendant chargé de la logistique peut être assigné à chaque division. Les problèmes modernes nécessitent des solutions modernes, et c'est l'une d'elles."
ALG_election:0 "Premières élections générales"
ALG_election_desc:0 "Le mandat du Gouvernement provisoire de Ferhat Abbas touche à sa fin. Une période d'incertitudes s'annonce pour [ALG.GetNameDef], car beaucoup remettent en question le caractère démocratique des élections, et plusieurs radicaux prônent un changement rapide du gouvernement. Les responsables actuels travaillent dur pour assurer la légitimité et l'absence de corruption lors des premières élections générales en [ALG.GetNameDef]."
ALG_hadj_victory:0 "Victoire de Hadj"
ALG_hadj_victory_desc:0 "Messali Hadj, également connu comme le 'père' du nationalisme [ALG.GetAdjective], a obtenu la majorité des votes. Il est un représentant majeur du parti Étoile Nord-Africaine (ENA), connu des étrangers sous le nom de North African Star, dont les principaux efforts visent à lutter contre l'impérialisme sous la cause démocratique."
ALG_abbas_victory:0 "Victoire d'Abbas"
ALG_abbas_victory_desc:0 "Sous la direction de Ferhat Abbas, le Jabhatu l-Tahrīri l-Watanī (Front de Libération Nationale) travaille désormais à former la majorité parlementaire. Abbas est un nationaliste modéré avec certaines politiques opportunistes, capable de manœuvrer et de construire des coalitions à partir de rien. Peut-être apportera-t-il stabilité à [ALG.GetNameDef] ?"
ALG_army_loyalty:0 "Assurer la loyauté de l'armée"
ALG_army_loyalty_desc:0 "Le nouveau gouvernement cherche à consolider le fragile État [ALG.GetAdjective] et préserver son indépendance. Il devient toutefois de plus en plus apparent que l'armée pourrait comploter contre le régime actuel. Déposer les leaders peu fiables garantira le soutien de l'armée à notre cause."
ALG_depoliticize_the_army:0 "Dépolitiser l'armée"
ALG_depoliticize_the_army_desc:0 "L'armée a joué un rôle essentiel dans la restauration du statut et de la légitimité de notre nation sur la scène mondiale, mais son implication croissante dans les affaires gouvernementales inquiète les responsables. Séparer l'armée de la politique garantira l'indépendance des deux branches."
ALG_malg:0 "Étendre le MALG"
ALG_malg_desc:0 "Le Ministère de l'Armement et des Liaisons générales (MALG) est l'agence de renseignement de l'État formée sous le gouvernement provisoire pour assurer la sécurité du nouvel État [ALG.GetAdjective] face aux influences étrangères. Son rôle est indéniable, et il doit être étendu pour correspondre aux capacités du MI6, de l'Abwehr ou du NKVD."
ALG_algiers_university:0 "Étendre l'Université d'Alger"
ALG_algiers_university_desc:0 "L'université d'Alger, fondée en 1909 comme première université sur le sol algérien, bénéficiera d'un meilleur financement et d'une expansion de ses départements de recherche, améliorant la qualité de l'enseignement et fournissant au pays une nouvelle génération de spécialistes talentueux."
ALG_reorginize_industries:0 "Réorganiser les industries"
ALG_reorginize_industries_desc:0 "La dépendance à la métropole fut l'une des pierres angulaires des politiques coloniales de [FRA.GetNameDef]. Maintenant que nous avons l'autonomie, nous devons diversifier et réformer les chaînes de production et de transport pour maximiser l'efficacité du secteur industriel actuel."
ALG_british_industrial_investments:0 "Investissements industriels britanniques"
ALG_british_industrial_investments_desc:0 "L'orientation démocratique de notre gouvernement et quelques missions diplomatiques ont convaincu les investisseurs [ENG.GetAdjective] de financer certains projets industriels à travers le pays, jetant une nouvelle base pour l'industrie nationale."
ALG_western_technological_learnings:0 "Apprentissages technologiques occidentaux"
ALG_western_technological_learnings_desc:0 "De nombreuses invitations ont été envoyées à des scientifiques, ingénieurs et développeurs étrangers pour collaborer avec nos centres R&D afin de développer et améliorer l'éducation et la production en [ALG.GetNameDef]."
ALG_united_under_abbas:0 "Unis sous Abbas"
ALG_united_under_abbas_desc:0 "L'ensemble des politiques introduites par le gouvernement Abbas a profondément influencé la foi du peuple dans notre cause, prouvant que le JTW sous Abbas guidera le pays vers un futur prospère et brillant !"
ALG_crack_down_on_extremist_groups:0 "Réprimer les Pieds-Noir"
ALG_crack_down_on_extremist_groups_desc:0 "Nous ne pouvons négliger la volonté du peuple et ses demandes, mais les Pieds-Noir menacent notre constitution et la stabilité du régime actuel. Nous n'avons donc d'autre choix que de réduire leur influence dans nos industries."
ALG_religious_freedom:0 "Liberté religieuse"
ALG_religious_freedom_desc:0 "Bien que l'Islam ait été la pierre angulaire de notre pays pendant mille ans, il est indéniable que le moment est venu de reconnaître d'autres mouvements religieux comme égaux. Cela pourrait fâcher certains croyants, mais toute institution démocratique est une farce sans cela."
ALG_hadjs_guidance:0 "Orientation de Hadj"
ALG_hadjs_guidance_desc:0 "La démocratisation, la sécularisation et des liens solides avec les principales démocraties ont contribué à la popularité de Hadj et de l'ENA. De nombreux citoyens rejoignent volontairement le parti et aident les responsables à diffuser les valeurs démocratiques dans tout le pays !"
ALG_turkish_relations:0 "Réaffirmer les liens [TUR.GetAdjective]"
ALG_turkish_relations_desc:0 "La domination turque sur notre pays fut courte mais parmi les moins nuisibles des puissances coloniales. Nos liens fraternels peuvent être approfondis et peut-être conduire à la formation d’un mouvement non-aligné ou d’une nouvelle fédération méditerranéenne."
ALG_deterrence:0 "Dissuasion étrangère"
ALG_deterrence_desc:0 "Notre posture défensive nécessite une base solide. La diplomatie et de bonnes relations étrangères sont bénéfiques, mais nous devons rester vigilants face aux tensions mondiales."
ALG_arab_independence:0 "Phare éclatant de l'indépendance arabe"
ALG_arab_independence_desc:0 "En tant que l'une des premières nations arabes totalement indépendantes en Méditerranée, nous voulons garantir que le peuple arabe ne tombe pas sous les ambitions coloniales."
ALG_interventionist_foreign_policy:0 "Interventionnisme [ALG.GetAdjective]"
ALG_interventionist_foreign_policy_desc:0 "Bien que fortement pro-paix et adepte des valeurs pacifistes, nous ne pouvons rester les bras croisés pendant que d'autres démocraties à travers le monde souffrent et sont détruites par des conflits armés. Nos forces armées seront envoyées sur les lieux de crise pour préserver nos valeurs à l'étranger."
ALG_collaboration_with_allies:0 "Collaboration avec les Alliés"
ALG_collaboration_with_allies_desc:0 "Les plus grandes démocraties du monde auront besoin d'assistance si elles veulent préserver leur indépendance et leurs institutions gouvernementales actuelles. Nous les rejoindrons dans leur lutte pour la liberté et l'indépendance sous la bannière des Alliés !"
ALG_aid_nuclear_programs:0 "Aider les programmes nucléaires alliés"
ALG_aid_nuclear_programs_desc:0 "Les nouveaux systèmes d'armes capables de détruire des villes et de dévaster des armées sont développés dans le cadre du projet Manhattan. Nous pouvons mobiliser quelques diplomates et sécuriser notre part."
ALG_algeria_liberated:0 "Libération [ROOT.GetAdjective]"
ALG_algeria_liberated_desc:0 "Après presque un siècle de subjugation et de nombreuses souffrances endurées sous le régime colonial, la nation [ALG.GetAdjective] est enfin libre !"
ALG_peasant_strike:0 "La Grande Grève Paysanne"
ALG_peasant_strike_desc:0 "Le pouvoir législatif et exécutif du gouvernement provisoire est très fragile et incertain. La moindre interruption des chaînes d'approvisionnement, stagnation industrielle ou politique controversée provoquera de grandes manifestations, que nous pouvons exploiter rapidement."
ALG_new_type_of_nationalism:0 "Un Nouveau Type de Nationalisme"
ALG_new_type_of_nationalism_desc:0 "Les paysans tentaient d'imposer leur domination, ce qui était inacceptable pour l'élite. Pour éradiquer l'endoctrinement communiste, nous pouvons encourager les sentiments patriotiques parmi la population."
ALG_german_industries:0 "Collaboration avec les Pieds-Noirs"
ALG_german_industries_desc:0 "Malgré leur affinité avec les Français et le régime colonial, les Pieds-Noirs conservent une grande influence dans nos industries. Il est donc sage de collaborer avec eux."
ALG_expand_conscription:0 "Étendre la Conscription"
ALG_expand_conscription_desc:0 "Avec les tensions mondiales, en particulier en Europe et en Asie, nous ne pouvons rester silencieux. Construire une armée nécessitera beaucoup d'hommes et de femmes. Nous réécrirons sévèrement la loi sur le service militaire."
ALG_mobolize_reserves:0 "Mobiliser les Réserves"
ALG_mobolize_reserves_desc:0 "La conscription prendra du temps. Cependant, nous avons besoin d'une force immédiate, donc les vétérans et volontaires locaux formeront des unités paramilitaires rejoignant l'armée après formation."
ALG_new_heavy_industries:0 "Nouvelles Industries Lourdes"
ALG_new_heavy_industries_desc:0 "La collaboration avec les Pieds-Noirs a permis d'établir des industries lourdes dans nos villes. Heureusement, nous avons les ressources pour soutenir ce développement économique !"
ALG_expand_algeirs_university:0 "École Militaire d'Alger"
ALG_expand_algeirs_university_desc:0 "Les officiers modernes nécessitent une éducation moderne. Financer une telle institution peut coûter cher, mais les bénéfices à long terme dépassent largement les dépenses."
ALG_join_axis:0 "La Cause de l'Axe"
ALG_join_axis_desc:0 "Les politiques actuelles suggèrent que nous avons beaucoup en commun avec les puissances fascistes. S'allier avec elles pourrait sécuriser notre place au soleil."
ALG_our_own_path:0 "Une Nouvelle Algérie"
ALG_our_own_path_desc:0 "Étant donné l'état actuel de la diplomatie, il serait imprudent de rejoindre une grande puissance pour un rôle secondaire. Nous devons forger notre destin et créer un pacte diplomatique unique."
ALG_comintern_membership:0 "Adhésion au Komintern"
ALG_comintern_membership_desc:0 "Notre dévouement aux idées communistes s'est répandu à travers les mers et a atteint le foyer de la Révolution. Sécuriser nos idéaux est plus facile sous le Komintern. Envoyons des envoyés à Moscou !"
ALG_the_peasants_republic:0 "La Commune [ALG.GetAdjective]"
ALG_the_peasants_republic_desc:0 "La volonté de notre peuple, la force des travailleurs et le soutien des paysans mèneront notre pays à l'État communiste souhaité. Pour réaliser la Révolution ouvrière, nous devons embrasser pleinement le communisme !"
ALG_seize_production:0 "Saisir les Moyens de Production"
ALG_seize_production_desc:0 "Les moyens de production étaient entre les mains des capitalistes depuis trop longtemps. Pour garantir leur loyauté et le bien-être du peuple, nous saisirons certains actifs industriels."
ALG_seize_arms:0 "Saisir l'Industrie de l'Arme"
ALG_seize_arms_desc:0 "L'industrie de l'armement était trop longtemps aux mains des capitalistes et de leurs alliés fascistes. Un État communiste fort a besoin d'armes pour promouvoir la révolution, ce que nous réaliserons par une nationalisation complète."
ALG_federalize_nation:0 "Purger les Pieds-Noirs"
ALG_federalize_nation_desc:0 "Les Pieds-Noirs ont été un problème depuis le début de la colonisation. Dans une économie planifiée, il est inacceptable que des capitalistes corrompent notre économie. Ils doivent partir !"
ALG_promote_atheism:0 "Promouvoir l'Athéisme"
ALG_promote_atheism_desc:0 "La société islamique a eu une valeur historique et scientifique. Cependant, notre révolution dicte de nouvelles règles pour lesquelles il n'y a pas de place pour les institutions religieuses."
ALG_socialist_science:0 "Science Socialiste"
ALG_socialist_science_desc:0 "Le statut unique de la science comme outil de lutte contre l'absurdité religieuse et l'analphabétisme nous permet de développer davantage nos instituts scientifiques !"
ALG_liberate_morocco:0 "Libérer le Maroc"
ALG_liberate_morocco_desc:0 "Hannibal avait raison d'étendre son influence au Maroc. Pour honorer nos ancêtres, nous reforgerons la fraternité avec cette nation !"
ALG_liberate_libya:0 "Libérer la Libye"
ALG_liberate_libya_desc:0 "Nous partageons beaucoup de notre culture et patrimoine avec la Libye. Le gouvernement [ALG.GetLeader] propose un plan courageux pour unir nos nations sous [ALG.GetNameDef] !"
ALG_secure_suez:0 "Sécuriser le Canal de Suez"
ALG_secure_suez_desc:0 "Nos troupes traversent le désert, libérant les nations d'Afrique du Nord. Il est temps de défendre l'Égypte, berceau de la civilisation !"
ALG_oil_focus:0 "Investir dans Sonatrach"
ALG_oil_focus_desc:0 "La récente découverte de pétrole dans le Sahara nous pousse à investir dans une nouvelle entreprise nationale pour coordonner prospection, raffinage et exploitation."
ALG_trade_focus:0 "Ouvrir le Marché Étranger"
ALG_trade_focus_desc:0 "Être protectorat colonial limitait fortement nos échanges. Les temps changent, nous devons ouvrir nos yeux sur le monde."
ALG_mil_focus:0 "Ouvrir des Usines d'Armes"
ALG_mil_focus_desc:0 "Manquant d'industrie forte, notre nation commencera son développement industriel par la construction de quelques usines d'armement pour répondre aux besoins de l'armée."
ALG_electronics_focus:0 "Électrification de la Campagne"
ALG_electronics_focus_desc:0 "On croit généralement que les empreintes du progrès et du développement scientifique ne se trouvent que dans les zones urbaines de notre nation. Changer ces croyances dépassées peut se faire en imposant un programme massif d'électrification."
ALG_steel_focus:0 "Étendre les Mines de Fer d'El-Abed"
ALG_steel_focus_desc:0 "El-Abed est un petit village minier dans l'ouest de notre pays, célèbre pour ses riches mines de minerai de fer. Si nous voulons que notre industrie se développe davantage, nous devons envisager un investissement dans cette région."
ALG_mil_focus2:0 "Industries de Guerre"
ALG_mil_focus2_desc:0 "Même si notre pays ne peut être considéré comme en guerre, nous devons être prêts à toute tempête menaçant nos frontières étendues. Nous avons les hommes, et ils exigent du matériel plus moderne et efficace, que nos nouvelles installations peuvent fournir."
ALG_civ_focus:0 "Rouvrir les Entreprises Françaises"
ALG_civ_focus_desc:0 "Depuis la proclamation de notre autonomie, de nombreux investisseurs et entrepreneurs français ont fui le pays par peur de représailles de notre peuple. Nous n'avons pas besoin de nationaliser les usines qui restent ouvertes : les installations de production peuvent être rouvertes sous contrôle du gouvernement, fournissant l'emploi nécessaire à notre population."
ALG_infrastructure_focus:0 "Étendre la Liaison Oran-Alger"
ALG_infrastructure_focus_desc:0 "Ouverte en 1862 et initialement étendue à sa destination finale en 1871, la ligne Oran-Alger est l'un des principaux réseaux ferroviaires reliant nos deux plus grandes villes. Nous devons étendre la ligne et construire un niveau d'infrastructure supplémentaire pour renforcer les connexions entre les deux villes."
ALG_civ_focus2:0 "Développer les Manufactures Locales"
ALG_civ_focus2_desc:0 "Une économie forte n'est que la première étape pour réaliser notre rêve : une économie totalement indépendante basée sur les producteurs locaux !"
ALG_reform_education:0 "Réformer le Système Éducatif"
ALG_reform_education_desc:0 "Nous disposons de fonds plus que suffisants. La croissance de l'industrie et l'encouragement des fabricants permettent de diriger encore plus de ressources vers le développement de nos instituts scientifiques."
ALG_italy_trade:0 "Nouveaux Marchés [ITA.GetAdjective]"
ALG_italy_trade_desc:0 "La région des Alpes est riche en acier et en aluminium, les principales exportations [ITA.GetAdjective]. Si nous développons notre marché commercial avec [ITA.GetNameDef], cela pourrait dissuader leur menace croissante."
ALG_britain_trade:0 "Accords Commerciaux [ENG.GetAdjective]"
ALG_britain_trade_desc:0 "Les [ENG.GetAdjective] ont une influence massive sur les ressources mondiales. Il est donc naturel que nous cherchions à devenir un partenaire commercial important."
ALG_seize_french_guns:0 "Saisir l'Arsenal Colonial Français"
ALG_seize_french_guns_desc:0 "[ALG.GetNameDef] est maintenant une nation forte et indépendante ; les jours du régime colonial sont derrière nous. Les armes françaises ne sont plus nécessaires et passent désormais entre les mains [ALG.GetAdjective] !"
ALG_end_france:0 "Mettre fin à la Tyrannie [FRA.GetAdjective]"
ALG_end_france_desc:0 "[ALG.getNameDef] ne peut plus rester à regarder nos frères et sœurs être brutalement opprimés par la tyrannie de [FRA.getNameDef]. Nous devons agir pour libérer le monde arabe !"
ALG_deport_pieds_noir:0 "Déporter les Pieds-Noirs"
ALG_deport_pieds_noir_desc:0 "Bien que nous ne puissions pas simplement expulser les Pieds-Noirs, nous ne pouvons plus les laisser corrompre notre économie de l'intérieur. Nous les renverrons là d'où ils viennent !"

#events

algeria.1.t:0 "La Première Élection Générale"
algeria.1.d:0 "Le gouvernement provincial a bien servi la nation, mais maintenant que [ALG.getNameDef] a obtenu son indépendance complète, il est temps que le peuple élise son dirigeant pour le nouveau gouvernement.\n\nQui le peuple choisira-t-il ?"
algeria.1.a:0 "Ferhat Abbas - Un autoritaire fort."
algeria.1.b:0 "Messali Hadj - Le père du nationalisme algérien."
algeriacivilwar.1:0 "§RCela conduira à une guerre civile !§!"
algeria.2.t:0 "La Grande Grève Paysanne"
algeria.2.d:0 "Depuis l'indépendance de [ALG.getNameDef], la situation dans le pays n'a pas été entièrement stable. Faute de leadership efficace, les promesses du gouvernement provincial semblent rompues.\n\nDe nombreux paysans, mécontents, se sont organisés avec des groupes communistes à Alger pour manifester dans la ville. Récemment, ces groupes se sont armés et ont affronté la police locale. La situation devient rapidement incontrôlable.\n\nLa seule question est maintenant : comment gérer cette situation ? Le risque d'une guerre civile à grande échelle est réel si elle est réprimée durement."
algeria.2.a:0 "Envoyer la garde nationale !"
algeria.2.b:0 "Laisser le peuple s'exprimer."
algeria.3.t:0 "Une Prise Sanglante"
algeria.3.d:0 "La garde nationale a livré un combat acharné à Alger et a neutralisé la plupart des émeutiers armés. Cependant, ceux-ci ont résisté fortement, infligeant de nombreuses pertes à la garde.\n\nDes rapports indiquent que les groupes restants se sont regroupés sous le PCA et préparent une rébellion dans l'est du pays."
algeria.3.a:0 "Le gouvernement provincial a échoué. L'armée doit prendre le contrôle total."
algeria.4.t:0 "Émeutes Nationales"
algeria.4.d:0 "Les émeutiers d'Alger ont réussi à s'organiser davantage et contrôlent désormais presque entièrement la ville. La garde nationale a dû se retirer de la ville et des environs. D'autres organisations ont émergé dans de nombreuses villes sous la bannière du PCA.\n\nLa garde nationale est totalement désorganisée, mais les derniers rapports indiquent que les soldats restants se retirent vers l'est pour continuer le combat."
algeria.4.a:0 "Enfin, les ouvriers [ALG.GetAdjective] sont libres."
