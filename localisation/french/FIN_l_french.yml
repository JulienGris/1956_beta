 FIN_driftwood:0 "Non-ingérence dans la politique soviétique"

 #Divers
 FIN_GER_Units:0 "Vous recevrez §Y5 divisions de Jägers§! d’Allemagne à Turku"
 FIN_GER_Units_return_1_tt:0 "Vous recevrez §Y5 divisions de Jägers allemandes§! ayant été sous commandement finlandais en Nord-Norge"
 FIN_GER_Units_return_2_tt:0 "Vous recevrez §Y5 divisions de Jägers allemandes§! ayant été sous commandement finlandais à Rostock"
 FIN_GER_agreement:0 "§WVous acceptez d’entrer en §Rguerre§! avec §Y[SOV.GetNameWithFlag]§! lorsque §Y[GER.GetNameWithFlag]§! déclarera la §Rguerre§! et que§! §Y[GER.GetNameWithFlag]§! §Ycontrôlera entièrement§! §Wun nombre suffisant d’états [SOV.GetNameWithFlag]§!."
 FIN_GER_agreement_GER_side_tt:0 "§WSi nous§! §Ycontrôlons entièrement§! §Wun nombre suffisant d’états (§Y[SOV.GetNameWithFlag]§!) lors d’une §Rguerre§! : alors le (§Y[FIN.GetNameWithFlag]§!) pourrait§! §Gdéclarer la guerre§! au (§Y[SOV.GetNameWithFlag]§!).§!"
 FIN_stabinthefront_tt:0 "\n§YSi accepté par les [GER.GetAdjective]s :§!"
