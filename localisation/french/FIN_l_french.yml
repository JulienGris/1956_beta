 wartsila_company:0 "Wärtsilä"
 scandinavia_unitetooltip:0 "Cela unira tous les pays §Ynordiques§! et §Yscandinaves§! sous un même drapeau et un seul pays, vous recevrez tous les cœurs sur les territoires des autres pays §Ynordiques§!."
 nordic_research_name:0 "Recherche nordique"
 nordic_research_desc:0 "Le savoir brisera les chaînes de l’esclavage !"
 german_research_name:0 "Recherche allemande"
 german_research_desc:0 "La force par le savoir !"
 baltic_internationale:0 "Internationale baltique"
 FIN_improved_relations:0 "Diplomatie finlandaise"
 FIN_Nordicunion:0 "À l’issue de cette décision, vous annexerez §YNorvège§!, §YSuède§! et §YDanemark§!, et formerez un nouveau pays appelé l’§YUnion nordique§!."
 fin_scandintervention:0 "Est intervenu contre l’Allemagne."
 fin_didntintervene:0 "N’est pas intervenu contre l’Allemagne."
 fin_interventiontooltip:0 "Si la §YSuède§! accepte, vous déclarerez tous deux la §Rguerre§! à l’§YAllemagne§!."
