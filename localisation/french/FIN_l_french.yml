 #Événements
 fin_news.1.t:0 "Des diplomates allemands aperçus à Helsinki"
 fin_news.1.d:0 "À la suite de leur défaite dans leur récente guerre contre [SOV.getnamedef], il semble que la Finlande tente de se rapprocher diplomatiquement de [GER.getnamedef]. Ainsi, des ambassadeurs allemands ont été aperçus à Helsinki. Des rumeurs disent que les Finlandais chercheraient une alliance militaire avec l’Allemagne contre la menace soviétique.\n\nCe que cela signifie pour l’avenir de [SOV.getnamedef], on ne peut qu’imaginer le pire."
 fin_news.1.a:0 "La seule voie à suivre."
 fin_news.1.b:0 "Le régime fasciste ne cesse de se renforcer."
 fin_news.1.h:0 "Intéressant."
 fin_news.1.c:0 "Tout ennemi des bolcheviks est notre ami."
 fin_news.1.e:0 "Ce ne sont que des rumeurs."
 fin_news.1.f:0 "Ils feraient mieux d’être prudents..."
 fin_news.1.g:0 "Les Finlandais devraient être attentifs à leurs fréquentations."

 finland.84.t:0 "La proposition [FIN.GetAdjective]"
 finland.84.d:0 "Ayant entendu des rumeurs sur notre intention d’envahir [SOV.getnamedef], des diplomates [FIN.GetAdjective] nous ont approchés avec une proposition. Ils permettraient à nos troupes d’être stationnées sur le sol [FIN.GetAdjective] et d’utiliser leurs ports. Nos diplomates, naturellement curieux de voir le sérieux de cette offre, ont pris contact avec des membres de l’armée [FIN.GetAdjective]. Cela a abouti à un plan détaillé : si notre invasion de [SOV.getnamedef] semble bien se dérouler, les [FIN.GetAdjective] déclareront aussi la guerre à [SOV.getnamedef]. Les détails de cet accord sont en cours de rédaction et une collaboration accrue est envisageable si nous avançons avec l’opération Barbarossa."
 finland.84.a:0 "Une aide des plus nécessaires."

 finland.11.t:0 "Une continuation"
 finland.11.d:0 "Constatant que l’invasion [GER.GetAdjective] de [SOV.getnamedef] se déroule comme prévu, nous devrions tenir notre promesse. Les [SOV.GetAdjective] ont aussi récemment commencé à bombarder nos villes, prétendant viser des bases militaires [GER.GetAdjective] en Finlande. C’est la justification parfaite pour déclarer la guerre aux [SOV.GetAdjective]."
 finland.11.a:0 "Il est temps de reprendre ce qui nous appartient."
 finland.11.b:0 "Réfléchissons, c’est une mauvaise idée."

 finland.12.t:0 "La [FIN.GetName] demande la paix"
 finland.12.d:0 "Les lâches de [FIN.GetName] nous demandent la paix, en échange du rétablissement des frontières d’avant-guerre, de la démilitarisation, de l’expulsion de toutes les troupes allemandes et de la légalisation du parti communiste finlandais. Devons-nous punir leur trahison ou les laisser tranquilles ?"
 finland.12.a:0 "C’est secondaire. Acceptons."
 finland.12.b:0 "Non ! La Finlande tombera bientôt devant l’Union soviétique !"

 finland.13.t:0 "Les Soviétiques ont refusé."
 finland.13.d:0 "L’Union soviétique a rejeté notre proposition de paix, jurant de conquérir tout le pays."
 finland.13.a:0 "Qu’ils essaient, ils mourront !"

 finland.14.t:0 "Les Soviétiques acceptent."
 finland.14.d:0 "Les Soviétiques ont accepté notre proposition de paix. En échange de notre liberté et de la paix, nous avons cédé l’État de Petsamo."
 finland.14.a:0 "C’est mieux ainsi."

 finland.15.t:0 "La Finlande veut rejoindre l’Axe."
 finland.15.d:0 "À la suite de notre alliance militaire avec la Finlande, celle-ci a décidé de signer le Pacte tripartite et de rejoindre l’Axe."
 finland.15.a:0 "Nous acceptons."
 finland.15.b:0 "Cela ne sert pas nos intérêts."

 finland.16.t:0 "L’Allemagne accepte."
 finland.16.d:0 "L’Allemagne a décidé d’accepter notre demande de signer le Pacte tripartite et de rejoindre l’Axe."
 finland.16.a:0 "Ensemble, nous écraserons les Soviétiques !"

 finland.17.t:0 "L’Allemagne refuse."
 finland.17.d:0 "L’Allemagne a rejeté notre demande d’adhésion à l’Axe."
 finland.17.a:0 "Tant pis pour eux."

 fin_news.2.t:0 "La Finlande signe le Pacte tripartite."
 fin_news.2.d:0 "La Finlande a signé le Pacte tripartite, rejoignant officiellement l’Axe, elle qui auparavant se proclamait seulement sœur d’armes."
 fin_news.2.a:0 "Intéressant."
 fin_news.2.b:0 "Pour le glorieux avenir de l’Europe !"
 fin_news.2.c:0 "Les fascistes pullulent comme des vermines..."

 finland.18.t:0 "La Finlande demande une alliance."
 finland.18.d:0 "La Finlande nous a invités à rejoindre l’Alliance défensive nordique, affirmant qu’une défense coopérative entre tous les pays nordiques serait bénéfique à chacun."
 finland.18.a:0 "Nous rejoignons volontiers, pour une région nordique plus sûre !"
 finland.18.b:0 "La Finlande doit chercher des alliés ailleurs."

 finland.19.t:0 "[From.GetName] refuse !"
 finland.19.d:0 "[From.GetName] a rejeté notre invitation à rejoindre l’Alliance défensive nordique."
 finland.19.a:0 "Tant pis pour eux !"

 finland.150.t:0 "[From.GetNameDefCap] propose de rétablir le statu quo"
 finland.150.d:0 "Notre récente guerre contre [From.GetNameDef] s’est révélée un désastre militaire et politique, compte tenu des lourdes pertes humaines et matérielles et de notre incapacité à établir une tête de pont en Finlande. La capacité [FIN.getAdjective] à repousser la plupart de nos assauts implique que la poursuite de la guerre drainerait encore davantage nos ressources, ce que la population rejette de plus en plus.\n\nUne délégation [FIN.getAdjective] a rencontré nos diplomates à Moscou pour discuter d’un cessez-le-feu et d’un potentiel traité de paix. Allons-nous accéder à leur demande de restauration du statu quo et renoncer à nos revendications sur [FIN.getNameDef] ?"
 finland.150.a:0 "Nous acceptons. Mieux vaut cela que la défaite."
 finland.150.b:0 "Nous n’abandonnerons pas ! Préparez une nouvelle offensive !"

 finland.151.t:0 "[From.GetNameDefCap] refuse de négocier"
 finland.151.d:0 "Les représentants [FROM.getAdjective] ont annoncé ce matin à notre délégation qu’ils ne céderaient jamais à de telles concessions humiliantes.\nNos services de renseignement signalent une activité accrue et des mouvements massifs de troupes du côté [FROM.getAdjective] de la frontière. Nos soldats, déjà épuisés, ont été informés et sont prêts à défendre nos terres légitimes."
 finland.151.a:0 "Nous allons leur donner une leçon qu’ils n’oublieront pas."

 finland.152.t:0 "[From.GetNameDefCap] exige des concessions territoriales"
 finland.152.d:0 "Un télégramme [FIN.getAdjective] envoyé aujourd’hui au quartier général militaire stipule que les négociations de paix ne peuvent reprendre qu’en cas de démilitarisation complète de la frontière commune, en plus de quelques concessions dites « mineures ».\n\nIls acceptent de fermer les yeux sur nos différences idéologiques et nos ambitions expansionnistes passées à condition que les territoires de Carélie — y compris Mourmansk, Onega et Olonets — soient réunis à [FIN.getNameDef]. Notre côté de la Carélie resterait démilitarisé pour garantir la sécurité de la majorité [FIN.getAdjective]-parlante de l’isthme de Carélie.\n\nAu vu de nos lourdes pertes et de la légèreté des exigences, il serait prudent d’accepter avant que la situation ne s’aggrave."
 finland.152.a:0 "Nous acceptons. Mieux vaut cela qu’une défaite totale."
 finland.152.b:0 "Certainement pas !"

 finland.99.t:0 "Union des pays nordiques et de la Scandinavie !"
 finland.99.d:0 "Nos efforts diplomatiques ont porté leurs fruits : les dirigeants de Norvège, du Danemark et de Suède ont accepté notre proposition d’unir nos pays en un seul, pour un avenir plus fort et meilleur pour tous !"
 finland.99.a:0 "Régner sur le Nord !"

 finland.101.t:0 "Le Conseil nordique propose une intégration totale du gouvernement"
 finland.101.d:0 "Des diplomates du Conseil nordique ont rencontré ce matin notre Premier ministre pour discuter de la conclusion de l’Union entre nos deux États. Ils proposent une coopération économique, scientifique et militaire totale en échange de notre engagement."
 finland.101.a:0 "Parfait ! Nous contribuerons grandement à la communauté nordique !"
 finland.101.b:0 "Non ! Notre indépendance passe avant tout."

 finland.102.t:0 "[From.GetName] accepte"
 finland.102.d:0 "Le [From.GetName] a accepté notre proposition."
 finland.102.a:0 "Excellent !"

 finland.103.t:0 "[From.GetName] refuse !"
 finland.103.d:0 "Le [From.GetName] a rejeté notre proposition, affirmant qu’il vaut mieux rester indépendant."
 finland.103.a:0 "Qu’il en soit ainsi."
 finland.103.b:0 "Nous avons d’autres moyens de les intégrer…"

 finland.20.t:0 "La question de la Carélie"
 finland.20.d:0 "Le gouvernement [FIN.GetAdjective] souhaite résoudre les revendications sur la Carélie. Ils demandent, compte tenu des récents événements en Allemagne, que nous abandonnions nos pressions."
 finland.20.a:0 "Très bien, pour l’instant."
 finland.20.b:0 "Non ! Nous avons besoin de la Carélie pour protéger Leningrad."

 finland.21.t:0 "[From.GetName] accepte"
 finland.21.d:0 "Le [From.GetName] a accepté notre proposition de cesser de revendiquer la Carélie."
 finland.21.a:0 "Bien."

 finland.22.t:0 "[From.GetName] refuse !"
 finland.22.d:0 "Le [From.GetName] a refusé notre proposition, invoquant la sécurité de Leningrad."
 finland.22.a:0 "Comme prévu."

 finland.23.t:0 "Accord de recherche finno-britannique"
 finland.23.d:0 "Les Britanniques ont accepté notre proposition d’accord de recherche mutuel."
 finland.23.a:0 "Excellente nouvelle !"
 finland.23.b:0 "Rejoindre le partage technologique du Commonwealth."

 finland.24.t:0 "Rapporter ceci"
 finland.24.d:0 "Si vous voyez cet événement, merci de le signaler comme un bug. Vous ne devriez pas le voir."
 finland.24.a:0 "OK"

 finland.25.t:0 "Accord de recherche finno-allemand"
 finland.25.d:0 "Les Allemands ont accepté notre proposition d’accord de recherche mutuel."
 finland.25.a:0 "Excellente nouvelle !"
 finland.25.b:0 "Partage technologique avec l’Allemagne"
finland.26.t:0 "Les Finlandais cèdent la Carélie"
finland.26.d:0 "En raison du déclenchement de la guerre en Europe, les Finlandais ont décidé de nous céder la Carélie, afin de préserver la paix avec nous."
finland.26.a:0 "Un choix avisé."

finland.27.t:0 "La Finlande veut rejoindre l’Axe"
finland.27.d:0 "La Finlande a envoyé des diplomates pour discuter de la possibilité de rejoindre les puissances de l’Axe."
finland.27.a:0 "Oui, bienvenue à nos frères finlandais !"
finland.27.b:0 "Non, la Finlande doit chercher des amis ailleurs."

finland.28.t:0 "L’Allemagne accepte notre demande !"
finland.28.d:0 "L’Allemagne a accepté notre proposition de rejoindre les puissances de l’Axe."
finland.28.a:0 "Portons un toast à nos nouveaux amis allemands !"

finland.29.t:0 "L’Allemagne refuse !"
finland.29.d:0 "L’Allemagne a rejeté notre demande d’alliance."
finland.29.a:0 "Tant pis pour eux !"

finland.31.t:0 "[From.GetName] accepte !"
finland.31.d:0 "[From.GetName] a accepté notre invitation à rejoindre l’Alliance défensive nordique."
finland.31.a:0 "Excellente nouvelle !"

finland.30.t:0 "Accord de recherche nordique"
finland.30.d:0 "Nous avons conclu avec succès un accord de recherche avec les autres pays nordiques."
finland.30.a:0 "Bien."
finland.30.b:0 "Rejoindre le partage technologique de la faction"

finland.32.t:0 "La Finlande appelle à une alliance !"
finland.32.d:0 "La Finlande nous a envoyé une invitation à rejoindre leur alliance balte."
finland.32.a:0 "Nous acceptons volontiers !"
finland.32.b:0 "Non. Nous devons rester neutres."

finland.33.t:0 "[From.GetName] accepte !"
finland.33.d:0 "[From.GetName] a accepté notre invitation à l’alliance."
finland.33.a:0 "Bonne nouvelle !"

finland.34.t:0 "[From.GetName] refuse !"
finland.34.d:0 "[From.GetName] a rejeté notre invitation à l’alliance !"
finland.34.a:0 "Heureusement, nous avons d’autres moyens de les faire rejoindre..."

finland.36.t:0 "[From.GetName] veut rejoindre le Komintern !"
finland.36.d:0 "[From.GetName] nous a envoyé une lettre pour demander à rejoindre notre faction."
finland.36.a:0 "Oui, nous acceptons."
finland.36.b:0 "Non, nous devons refuser."

finland.37.t:0 "[From.GetName] a accepté !"
finland.37.d:0 "[From.GetName] a accepté notre demande d’adhésion à leur faction !"
finland.37.a:0 "Vers un avenir glorieux !"

finland.38.t:0 "[From.GetName] a refusé."
finland.38.d:0 "Malgré nos efforts, [From.GetName] a rejeté notre demande d’adhésion à leur alliance."
finland.38.a:0 "Ils le regretteront !"

FIN_elections.1.t:0 "Élections présidentielles de [GetYear] !"
FIN_elections.1.d:0 "Le moment est venu pour le pays d’élire un nouveau président."
FIN_elections.1.a:0 "Encore 6 ans pour P. E. Svinhufvud !"
FIN_elections.1.b:0 "Un nouveau président ! Kyösti Kallio !"

FIN_elections.2.t:0 "Kyösti Kallio est mort !"
FIN_elections.2.d:0 "C’est avec tristesse que nous devons annoncer que notre président Kyösti Kallio a succombé à une crise cardiaque soudaine et est décédé. Des élections d’urgence ont eu lieu et les libéraux ont remporté la victoire."
FIN_elections.2.a:0 "Risto Ryti prendra sa place."

FIN_elections.3.t:0 "La guerre dépend du commandement militaire !"
FIN_elections.3.d:0 "Bien qu’encore officiellement au pouvoir, [FIN.GetLeader] est éclipsé par le leadership militaire du maréchal Mannerheim. Avec autant d’enjeux reposant sur le sort de l’armée, beaucoup considèrent désormais le maréchal comme le véritable chef du pays, au moins jusqu’au retour de la paix."
FIN_elections.3.a:0 "Vive le maréchal !"

finland.104.t:0 "[From.GetName] veut rejoindre les Alliés !"
finland.104.d:0 "[From.GetName] nous a envoyé une lettre pour demander à rejoindre notre faction."
finland.104.a:0 "Oui, nous acceptons."
finland.104.b:0 "Non, nous devons refuser."

finland.105.t:0 "[From.GetName] a accepté !"
finland.105.d:0 "[From.GetName] a accepté notre demande d’adhésion à leur faction !"
finland.105.a:0 "Pour un avenir sûr pour l’Europe !"

finland.42.t:0 "[From.GetName] a refusé."
finland.42.d:0 "Malgré nos efforts, [From.GetName] a rejeté notre demande d’adhésion à leur alliance."
finland.42.a:0 "Ils le regretteront !"

finland.100.t:0 "Intégration nordique"
finland.100.d:0 "Nos politiques et nos lois finales sont prêtes. À partir d’aujourd’hui, il n’y a plus de Suédois, de Finlandais, de Norvégiens ni de Danois : seulement des Nordiques !"
finland.100.a:0 "Bien."

finland.43.t:0 "[From.GetName] exige des terres !"
finland.43.d:0 "[From.GetName] a exigé la Laponie de notre part, sous peine d’en subir les conséquences."
finland.43.a:0 "Nous n’avons pas d’autre choix que d’accepter."
finland.43.b:0 "[From.GetName] est bien trop puissant, nous devrions devenir son État fantoche si nous voulons survivre."
finland.43.c:0 "[From.GetName] n’aura rien !"

finland.44.t:0 "[From.GetName] cède la Laponie"
finland.44.d:0 "[From.GetName] nous a cédé la Laponie !"
finland.44.a:0 "Un choix logique."

finland.1001.t:0 "[From.GetName] a décidé de devenir notre fantoche"
finland.1001.d:0 "[From.GetName], par crainte de notre puissance militaire, a décidé de devenir notre État fantoche."
finland.1001.a:0 "Un choix logique."
finland.1001.b:0 "Nous allons annexer toute la Suède !"

finland.46.t:0 "[From.GetName] a refusé de céder !"
finland.46.d:0 "[From.GetName] a refusé de nous donner des terres !"
finland.46.a:0 "Nous les prendrons par la force alors !"

finland.47.t:0 "[From.GetName] exige des terres !"
finland.47.d:0 "[From.GetName] a exigé le Nord-Norge de notre part, sous peine d’en subir les conséquences."
finland.47.a:0 "Nous n’avons pas d’autre choix que d’accepter."
finland.47.b:0 "[From.GetName] est bien trop puissant, nous devrions devenir son État fantoche si nous voulons survivre."
finland.47.c:0 "[From.GetName] n’aura rien !"

finland.48.t:0 "[From.GetName] cède le Nord-Norge"
finland.48.d:0 "[From.GetName] nous a cédé le Nord-Norge !"
finland.48.a:0 "Un choix logique."

finland.49.t:0 "[From.GetName] a décidé de devenir notre fantoche"
finland.49.d:0 "[From.GetName], par crainte de notre puissance militaire, a décidé de devenir notre État fantoche."
finland.49.a:0 "Un choix logique."
finland.49.b:0 "Nous allons annexer toute la Norvège !"

finland.50.t:0 "[From.GetName] a refusé de céder !"
finland.50.d:0 "[From.GetName] a refusé de nous donner des terres !"
finland.50.a:0 "Nous les prendrons par la force alors !"

finland.51.t:0 "[From.GetName] exige des terres !"
finland.51.d:0 "[From.GetName] a exigé le Jutland de notre part, sous peine d’en subir les conséquences."
finland.51.a:0 "Nous n’avons pas d’autre choix que d’accepter."
finland.51.b:0 "[From.GetName] est bien trop puissant, nous devrions devenir son État fantoche si nous voulons survivre."
finland.51.c:0 "[From.GetName] n’aura rien !"

finland.52.t:0 "[From.GetName] cède le Jutland"
finland.52.d:0 "[From.GetName] nous a cédé le Jutland !"
finland.52.a:0 "Un choix logique."
finland.53.t:0 "[From.GetName] a décidé de devenir notre fantoche"
finland.53.d:0 "[From.GetName], par crainte de notre puissance militaire, a décidé de devenir notre État fantoche."
finland.53.a:0 "Un choix logique."
finland.53.b:0 "Nous allons annexer tout le Danemark !"

finland.54.t:0 "[From.GetName] a refusé de céder !"
finland.54.d:0 "[From.GetName] a refusé de nous donner des terres !"
finland.54.a:0 "Nous les prendrons par la force alors !"

finland.55.t:0 "[From.GetName] débat d’une intervention"
finland.55.d:0 "[From.GetName] a débattu de l’idée d’intervenir contre l’Allemagne dans son agression en Scandinavie, et nous a demandé : devons-nous intervenir ?"
finland.55.a:0 "Oui, pour notre protection !"
finland.55.b:0 "Non. Mieux vaut prévenir que guérir."

finland.56.t:0 "[From.GetName] a accepté d’intervenir !"
finland.56.d:0 "[From.GetName] a décidé d’intervenir contre l’Allemagne !"
finland.56.a:0 "Aux armes !"

finland.57.t:0 "[From.GetName] a décidé de ne pas intervenir"
finland.57.d:0 "[From.GetName] a décidé qu’ils n’interviendront pas dans la guerre."
finland.57.a:0 "Alors nous non plus."
finland.57.b:0 "Ce sont des imbéciles ! Nous protégerons nos frères scandinaves !"

finland.58.t:0 "[From.GetName] déclare la guerre à l’Allemagne"
finland.58.d:0 "Comme promis, [From.GetName] a déclaré la guerre à l’Allemagne !"
finland.58.a:0 "Et nous les suivons !"

finland.59.t:0 "[From.GetName] exige des terres !"
finland.59.d:0 "[From.GetName] a exigé que nous leur cédions Olonets, Onega et Mourmansk, affirmant qu’il s’agit de leurs terres légitimes !"
finland.59.a:0 "Nous les céderons, il faut éviter une guerre possible."
finland.59.b:0 "Jamais !"

finland.60.t:0 "[From.GetName] exige nos terres !"
finland.60.d:0 "[From.GetName] nous a ordonné de nous soumettre à eux, ou bien d’être complètement annexés !"
finland.60.a:0 "Jamais nous ne plierons !"
finland.60.b:0 "Mieux vaut conserver nos terres d’une façon ou d’une autre."

finland.61.t:0 "[From.GetName] refuse !"
finland.61.d:0 "[From.GetName] a refusé notre demande de devenir notre État fantoche !"
finland.61.a:0 "Ils savent très bien quelle est l’alternative..."

finland.62.t:0 "[From.GetName] cède !"
finland.62.d:0 "[From.GetName] a cédé et accepté nos exigences, se plaçant sous notre contrôle."
finland.62.a:0 "Un choix avisé."

finland.63.t:0 "[From.GetName] cède ses terres !"
finland.63.d:0 "[From.GetName] a décidé de nous céder les territoires demandés, pour éviter un incident."
finland.63.a:0 "Pour l’avenir de la Grande-Finlande !"

finland.64.t:0 "[From.GetName] refuse !"
finland.64.d:0 "[From.GetName] refuse de nous céder nos terres légitimes !"
finland.64.a:0 "Ils auront ce qu’ils méritent..."

finland.65.t:0 "Le président Ryti démissionne"
finland.65.d:0 "Le président Ryti avait promis au Reich allemand de ne pas rechercher une paix séparée. Mais comme nous avons entamé des négociations de paix indépendantes, il a choisi de démissionner pour éviter toute complication. Le maréchal Mannerheim prendra sa place."
finland.65.a:0 "D’accord."

fin_news.3.t:0 "[FIN.GetName] déclare la guerre à [SOV.GetName]"
fin_news.3.d:0 "\nÀ la suite des bombardements soviétiques sur les villes finlandaises — que les Russes ont décrits comme des accidents, visant principalement les bases militaires allemandes en Finlande — les Finlandais ont déclaré la guerre à [SOV.GetName], affirmant qu’il ne s’agissait pas d’un accident, mais d’une attaque délibérée.\n\nCertains observateurs disent que ce n’est qu’un prétexte pour les Finlandais de partir en guerre contre les [SOV.GetAdjective] et de récupérer les terres perdues, ainsi que d’honorer les promesses faites avec [GER.getnamedef]."
fin_news.3.a:0 "Encore de mauvaises nouvelles pour les [SOV.GetAdjective]"
fin_news.3.b:0 "Le seul bon choix !"
fin_news.3.c:0 "Les traîtres !"

fin_news.4.t:0 "La naissance de l’Alliance défensive nordique !"
fin_news.4.d:0 "Aujourd’hui, le gouvernement [FIN.GetAdjective] a annoncé ses plans de création d’une nouvelle alliance défensive, appelée l’Alliance défensive nordique. Ses principaux objectifs sont de constituer un pacte militaire défensif regroupant les pays nordiques : [NOR.GetName], [SWE.GetName], [DEN.GetName] et [FIN.GetName]. [FIN.GetName] a jugé nécessaire de la mettre en place, invoquant les tensions croissantes dans le monde."
fin_news.4.a:0 "Intéressant."
fin_news.4.b:0 "C’est pour la sécurité des pays nordiques !"

fin_news.5.t:0 "Les pays nordiques s’unissent en un seul !"
fin_news.5.d:0 "Aujourd’hui, les pays nordiques [SWE.GetName], [NOR.GetName], [DEN.GetName] et [FIN.GetName] ont annoncé leur union en un seul pays, dirigé par ce qu’on appelle le Conseil nordique, avec le même nombre de représentants pour chacun des anciens États nordiques."
fin_news.5.a:0 "Inattendu."
fin_news.5.b:0 "Nous sommes unis !"

finland.68.t:0 "[FIN.GetName] nous propose la Carélie en échange de l’Estonie"
finland.68.d:0 "[FIN.GetName] nous a proposé la Carélie en échange de la libération de l’Estonie comme État satellite."
finland.68.a:0 "Une excellente proposition !"

finland.69.t:0 "La question des îles Åland"
finland.69.desc:0 "Maintenant que les tensions montent en Europe, la question se pose : que devons-nous faire des îles Åland ?"
finland.69.a:0 "Rien, elles resteront à nous et démilitarisées."
finland.69.b:0 "Nous devrions transférer Åland à [SWE.GetName] pour leur sécurité."
finland.69.c:0 "Remilitariser Åland et y imposer la conscription."
finland.69.d:0 "Leur accorder plus d’autonomie, mais les garder sous notre protection."

finland.70.t:0 "[FIN.GetName] nous donne les îles Åland !"
finland.70.d:0 "[FIN.GetName] a décidé de nous donner les îles Åland, pour les protéger."
finland.70.a:0 "Un choix avisé !"

finland.71.t:0 "[FIN.GetName] nous invite à rejoindre l’Union nordique !"
finland.71.d:0 "[FIN.GetName] nous a envoyé une offre diplomatique pour unir nos pays en un seul, sous le drapeau de l’Union nordique."
finland.71.a:0 "Nous acceptons."
finland.71.b:0 "Non ! Nous conserverons notre indépendance."

finland.72.t:0 "[From.GetName] accepte !"
finland.72.d:0 "[From.GetName] a accepté notre offre, et a été uni sous l’Union nordique !"
finland.72.a:0 "Excellente nouvelle !"

finland.73.t:0 "[From.GetName] a refusé !"
finland.73.d:0 "[From.GetName] a rejeté notre offre d’unification sous le drapeau nordique !"
finland.73.a:0 "Nous avons d’autres moyens de nous unir..."

finland.75.t:0 "La question de la sécurité dans les pays baltes"
finland.75.d:0 "Les Soviétiques ont revendiqué les territoires de [LAT.GetName], [EST.GetName] et [LIT.GetName] comme les leurs. Nous devrions essayer de protéger nos nouveaux alliés, ainsi que nous-mêmes, face à l’URSS."
finland.75.a:0 "Leur demander d’abandonner leurs ambitions sur les pays baltes."
finland.75.b:0 "Échanger la Carélie contre la sécurité des pays baltes."
finland.75.c:0 "Nous pouvons nous défendre si nécessaire !"

finland.76.t:0 "[FIN.GetName] nous demande de retirer nos revendications !"
finland.76.d:0 "[FIN.GetName] nous a demandé de retirer nos revendications sur les territoires baltes."
finland.76.b:0 "Nous le ferons, nous avons déjà d’autres affaires plus importantes."
finland.76.a:0 "Jamais ! Ces territoires nous appartiennent de droit !"

finland.77.t:0 "Proposition de [FIN.GetName]"
finland.77.d:0 "[FIN.GetName] a proposé de nous donner l’État de Carélie en échange de l’abandon de nos exigences sur les pays baltes."
finland.77.a:0 "Une proposition sans intérêt !"
finland.77.b:0 "Cela correspond à nos intérêts."

finland.78.t:0 "[SOV.GetName] refuse !"
finland.78.d:0 "[SOV.GetName] a refusé notre proposition de régler le problème balte !"
finland.78.a:0 "Au moins, nous avons essayé."

finland.79.t:0 "[SOV.GetName] accepte."
finland.79.d:0 "À notre grande surprise, [SOV.GetName] a accepté notre demande."
finland.79.a:0 "Excellente nouvelle !"

finland.80.t:0 "[SOV.GetName] accepte."
finland.80.d:0 "[SOV.GetName] a accepté notre proposition. Nous avons désormais cédé la Carélie, et ils ont retiré leurs revendications sur les États baltes."
finland.80.a:0 "Excellente nouvelle !"
finland.81.t:0 "Restaurer la monarchie ?"
finland.81.d:0 "Maintenant que nous entretenons de bonnes relations avec l’Allemagne, elle nous a demandé si nous voulions proclamer notre pays royaume, comme cela aurait dû être le cas si les Allemands avaient gagné la Grande Guerre. Ils nous proposent Friedrich Karl comme roi."
finland.81.a:0 "Oui ! Nous deviendrons un royaume !"
finland.81.b:0 "Non, nous n’en avons pas besoin."

finland.82.t:0 "Choisir l’emplacement de notre capitale"
finland.82.d:0 "Maintenant que les pays nordiques ont été unifiés, une question s’est posée : où devons-nous installer notre capitale ?"
finland.82.a:0 "La garder à Helsinki."
finland.82.b:0 "La déplacer à Stockholm, la capitale de la Suède."
finland.82.c:0 "La déplacer à Oslo, la capitale de la Norvège."
finland.82.e:0 "La déplacer à Copenhague, la capitale du Danemark."

finland.83.t:0 "La mort de Friedrich Karl"
finland.83.d:0 "C’est avec une profonde tristesse que la radio a annoncé la mort du roi Friedrich Karl dans son sommeil, la nuit dernière. Son fils Wolfgang Moritz lui succède sur le trône."
finland.83.a:0 "Le roi est mort, vive le roi !"

finland.85.t:0 "La Finlande se retire de la proposition"
finland.85.d:0 "Bien que les [FIN.GetAdjective] aient déclaré qu’ils nous aideraient dans l’Opération Barbarossa si celle-ci se déroulait bien, il semble qu’ils aient renié leur accord. Invoquant de nombreuses raisons — comme l’impréparation de leur armée et l’accumulation de forces [SOV.GetAdjective] à leur frontière plus importante que prévu —, mais nous connaissons la vraie raison : ce sont des lâches !"
finland.85.a:0 "Nous n’avions pas besoin de leur aide de toute façon."

finland.86.t:0 "La Finlande tente de faire la paix avec les [SOV.GetAdjective]"
finland.86.d:0 "Les diplomates finlandais nous ont avertis qu’ils tentaient actuellement de conclure une paix avec les [SOV.GetAdjective], arguant que la situation militaire n’est pas favorable à la Finlande. Le maréchal Mannerheim a exprimé ses regrets personnels sur l’évolution de la guerre, mais a également déclaré qu’il s’agissait de la seule voie possible pour la Finlande. Ils ont toutefois ajouté que si les négociations échouaient, ils redoubleraient d’efforts dans la guerre."
finland.86.a:0 "Des lâches, tous autant qu’ils sont !"

finland.87.t:0 "La Finlande a conclu la paix avec les [SOV.GetAdjective]"
finland.87.d:0 "Les diplomates finlandais ont signé un traité de paix avec les [SOV.GetAdjective], mettant fin à la guerre entre les deux nations. Dans les prochaines heures, ils commenceront à expulser nos troupes de leur territoire."
finland.87.a:0 "Cette trahison ne restera pas impunie !"

