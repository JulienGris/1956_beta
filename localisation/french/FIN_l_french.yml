l_french:

 FIN_carl_mannerheim_leader_desc:0 "Il peut y avoir une autre personne occupant officiellement le rôle de dirigeant de notre nation. Mais face aux nombreuses menaces qui pèsent sur la Finlande, Mannerheim prend désormais toutes les décisions et nous guide à travers ces jours sombres pour notre pays."
 FIN_carl_mannerheim_leader_clear_desc:0 ""
 finnish_focus:0 "Arbre national finlandais"
#Raccourcis d’arbre
 FIN_communism_sc:0 "Politique : Communisme"
 FIN_historical_sc:0 "Politique : Neutralité"
 FIN_fascism_sc:0 "Politique : Fascisme"
 FIN_economy_sc:0 "Économie"
 FIN_army_sc:0 "Armée de terre"
 FIN_air_sc:0 "Armée de l’air"
 FIN_navy_sc:0 "Marine"
#Priorités nationales
 fin_political_focus:0 "S’adresser au Parlement"
 fin_political_focus_desc:0 "Le monde change rapidement, de nouvelles idéologies apparaissent ; nous devons nous concentrer sur la politique et décider de ce qui est le mieux pour notre peuple."
 fin_individual_freedom:0 "Poursuivre la liberté individuelle"
 fin_individual_freedom_desc:0 "Notre nation jouit de nombreuses libertés similaires à celles de nos homologues occidentaux. Nous devons continuer dans cette voie."
 fin_demofoc_desc:0 "Comme cela a toujours été, œuvrer pour la démocratie et la liberté individuelle est la meilleure option pour notre peuple et notre pays."
 fin_neutralfoc:0 "La voie de la neutralité"
 fin_neutralfoc_desc:0 "Éviter les alliances et rester neutres face aux événements étrangers préservera notre pays. Ainsi, nous ne provoquerons personne et ne mettrons pas en péril la survie de la nation finlandaise."
 fin_supportdemfoc:0 "Soutenir la démocratie"
 fin_supportdemfoc_desc:0 "La démocratie est la meilleure forme de gouvernement qui existe, nous devrions permettre à davantage de partis démocratiques d’émerger."
 fin_mutualdefpactfoc:0 "Pacte de défense mutuelle"
 fin_mutualdefpactfoc_desc:0 "Le monde est une marmite prête à exploser à tout moment. En demandant à la Suède un pacte de défense mutuelle, nous nous porterons secours mutuel en cas de guerre."
 fin_realtionsfoc:0 "Améliorer les relations internationales"
 fin_realtionsfoc_desc:0 "Il est essentiel d’améliorer nos relations avec les grandes puissances mondiales, afin d’entretenir de bons rapports et d’éviter les conflits."
 fin_interfoc:0 "La voie interventionniste"
 fin_interfoc_desc:0 "Certains pays sont opprimés par des régimes dictatoriaux. En tant que démocratie, il est de notre devoir d’intervenir et de libérer leurs peuples."
 fin_ndafoc:0 "Alliance de défense nordique"
 fin_ndafoc_desc:0 "Seuls, nous sommes faibles, mais ensemble nous sommes forts. Nous devrions nous allier avec les autres pays nordiques pour créer une alliance défensive afin de nous protéger mutuellement."
 fin_diploallyfoc:0 "Se renforcer avec l’Ouest"
 fin_diploallyfoc_desc:0 "Renforcer nos relations avec l’Ouest est la meilleure façon de nous protéger."
 fin_seekalliedhelpfoc:0 "Adhésion aux Alliés"
 fin_seekalliedhelpfoc_desc:0 "Les Britanniques étaient dans le camp des vainqueurs lors de la Grande Guerre. Nous n’avons aucun doute qu’ils le seront à nouveau si un conflit éclate."
 fin_ambadassorfoc:0 "Relations nordiques"
 fin_ambadassorfoc_desc:0 "Nous devrions envoyer des ambassadeurs dans les autres pays nordiques pour améliorer nos relations, si nous voulons espérer créer une alliance."
 fin_invswefoc:0 "Inviter la Suède"
 fin_invswefoc_desc:0 "Nous devrions envoyer une invitation à la Suède."
 fin_invnorfoc:0 "Inviter la Norvège"
 fin_invnorfoc_desc:0 "Nous devrions envoyer une invitation à la Norvège."
 fin_invdenfoc:0 "Inviter le Danemark"
 fin_invdenfoc_desc:0 "Nous devrions envoyer une invitation au Danemark."
 fin_techsharingfoc:0 "Accord technologique"
 fin_techsharingfoc_desc:0 "Si nous nous réunissons avec les autres pays nordiques pour signer un accord technologique, cela nous sera bénéfique à tous."
 fin_unitedscandfoc:0 "Unir les pays nordiques ?"
 fin_unitedscandfoc_desc:0 "La question hante les pays nordiques et scandinaves depuis des années : devons-nous nous unir en un seul pays ?"
 fin_integrate_iceland:0 "Inviter l’Islande dans l’Union"
 fin_integrate_iceland_desc:0 "L’unification des pays nordiques ne peut se faire sans le dernier membre de la communauté : l’Islande. Nous offrirons à leur gouvernement une représentation dans notre conseil en échange de leur intégration économique et industrielle."
 fin_guardfoc:0 "La plus grande menace"
 fin_guardfoc_desc:0 "Les Soviétiques nous ont pris des terres illégalement, et nous pensons que ce n’était pas leur dernier coup. Nous devrions chercher des alliés contre la menace soviétique."
 fin_germantreatyfoc:0 "Un pacte avec le diable"
 fin_germantreatyfoc_desc:0 "Nous devons montrer que nous sommes prêts à une alliance militaire avec l’Allemagne contre la menace soviétique, en leur accordant un accès militaire et en les autorisant à établir des bases sur notre sol."
 fin_gerequipmentfoc:0 "Aide militaire allemande"
 fin_gerequipmentfoc_desc:0 "Les Allemands nous ont promis des unités militaires en échange de notre aide dans leur future guerre contre l’Union soviétique."
 fin_continationfoc:0 "La guerre de Continuation"
 fin_stabinthebackfoc:0 "Armistice de Moscou"
 fin_stabinthebackfoc_desc:0 "La guerre n’a pas forcément tourné en notre faveur ni en celle de l’Allemagne, nous devrions tenter de négocier une paix avant qu’il ne soit trop tard."
 fin_joinaxifoc:0 "Rejoindre l’Axe"
 fin_joinaxifoc_desc:0 "Il est temps d’avancer vers l’étape finale d’une alliance militaire avec l’Allemagne : la signature du Pacte tripartite."
 fin_greaterfoc:0 "Grande-Finlande"
 fin_greaterfoc_desc:0 "Si la Finlande veut rester une nation forte, nous ne devons plus faire de compromis avec les puissances étrangères. Nous aurons une patrie pour tout notre peuple, ou nous mourrons en essayant !"
 fin_deffoc:0 "Défendre la patrie"
 fin_deffoc_desc:0 "En cas d’invasion étrangère, nous devrions concentrer nos efforts sur la construction de fortifications et de défenses antiaériennes afin de rendre notre pays plus facile à défendre."
 fin_conscriptionfoc:0 "Conscription universelle"
 fin_conscriptionfoc_desc:0 "Pour rester en sécurité, nous devrions envisager d’adopter une loi de conscription universelle afin d’augmenter la taille de notre armée."
 fin_conscriptionfoc2:0 "Élargir le système de conscription"
 fin_conscriptionfoc2_desc:0 "Pour rester en sécurité, nous devrions envisager d’élargir les âges de conscription et d’améliorer notre système de recrutement."
 fin_nationalismfoc:0 "L’approche nationaliste"
 fin_nationalismfoc_desc:0 "Notre pays est le nôtre, et nous devons en être fiers."
 fin_comfoc:0 "L’approche de gauche"
 fin_comfoc_desc:0 "Il est temps de renverser les capitalistes et les fascistes : le pays appartient au peuple."
 fin_techengfoc:0 "Accord technologique avec les Britanniques"
 fin_techengfoc_desc:0 "Nous devrions conclure un accord de recherche et développement avec les Britanniques, ce qui profiterait à nos recherches comme aux leurs."
 fin_removeclaimfoc:0 "L’accord soviétique"
 fin_removeclaimfoc_desc:0 "La Seconde Guerre mondiale a commencé et les Soviétiques exercent une pression illégitime pour que nous leur cédions la Carélie. Nous devrions tenter de résoudre cette question diplomatiquement afin de concentrer nos efforts sur l’Allemagne."
 fin_karjalafoc:0 "La question de la Carélie"
 fin_karjalafoc_desc:0 "L’Union soviétique exerce une forte pression pour que nous cédions la Carélie. Nous devrions céder la Carélie afin d’éviter un conflit."
 fin_britnavyfoc:0 "Aide navale britannique"
 fin_britnavyfoc_desc:0 "Les Britanniques sont des experts de la guerre navale. En envoyant nos amiraux leur rendre visite, ils apprendront de nouvelles stratégies."
 fin_consprictfoc:0 "Conscription d’urgence"
 fin_consprictfoc_desc:0 "Le monde ne semble pas sûr, nous devrions renforcer nos lois de conscription pour garantir notre sécurité."
 fin_dowsovietfoc:0 "La menace soviétique"
 fin_dowsovietfoc_desc:0 "Les Soviétiques sont devenus une nuisance, nous devrions nous en débarrasser."
 fin_armedneutfoc:0 "Neutralité armée"
 fin_armedneutfoc_desc:0 "Même si nous restons neutres, nous devrions armer notre population en cas d’invasion étrangère."
 fin_axisalliancefoc:0 "Alliance avec l’Axe"
 fin_axisalliancefoc_desc:0 "En nous alliant avec l’Allemagne et l’Axe, nous nous protégerons des bolcheviques et des petites querelles politiques de l’Ouest."
 fin_fascist_british_alliance:0 "Alliés au-delà des mers"
 fin_fascist_british_alliance_desc:0 "Si nous voulons imposer notre domination sur la Scandinavie, nous avons besoin d’une puissance navale menaçante comme alliée dans la région. Nos liens économiques et notre partenariat diplomatique avec [ENG.GetName] peuvent être étendus à une alliance formelle."
 FIN_push_towards_scandinavia:0 "Pousser vers la Scandinavie"
 FIN_push_towards_scandinavia_desc:0 "Les peuples finnois sont depuis longtemps piégés hors de notre nation. Étendre nos frontières vers le nord, en Scandinavie, est indispensable si nous voulons préserver l’héritage culturel de nos frères !"
 FIN_the_dream_of_greater_finland_r56:0 "Le rêve de la Grande-Finlande"
 FIN_the_dream_of_greater_finland_r56_desc:0 "Les peuples finnois ont perdu beaucoup trop de leurs territoires légitimes. En prenant Mourmansk, Onega et Olonets, nous consoliderons notre frontière orientale tout en garantissant la prospérité de nos frères !"
 fin_nazisovietfoc:0 "Opération Barbarossa"
 fin_nazisovietfoc_desc:0 "Nul ne devrait souffrir du bolchevisme, nous libérerons le peuple russe !"
 fin_annexswefoc:0 "Le sort de la Suède"
 fin_annexswefoc_desc:0 "La Suède dispose de ressources abondantes dont notre armée a besoin, elle constitue une première étape majeure."
 fin_annexnorfoc:0 "Accord avec la Norvège"
 fin_annexnorfoc_desc:0 "Le Nord-Norge est à juste titre le nôtre !"
 fin_annexdenfoc:0 "Le Danemark et la mer Baltique"
 fin_annexdenfoc_desc:0 "Le Danemark contrôle l’accès des marines à la mer Baltique, sécuriser cette mer doit être notre priorité absolue."
 fin_annexicefoc:0 "Sécuriser la mer du Nord"
 fin_annexicefoc_desc:0 "Face à la faiblesse du gouvernement danois, plusieurs groupes nationalistes en Islande ont proclamé l’indépendance de l’ancienne colonie danoise. Ces revendications déraisonnables ne peuvent être tolérées ! Nos navires marchands et nos convois commerciaux se sentent menacés par cette nouvelle force en mer du Nord et exigent notre intervention pour sécuriser la région."
 fin_militarismfoc:0 "Militarisme finlandais"
 fin_militarismfoc_desc:0 "Par la force vient l’unité."
 fin_gertechsharingfoc:0 "Accord technologique avec l’Allemagne"
 fin_gertechsharingfoc_desc:0 "Les Allemands sont des experts en blindés, nous devrions demander l’aide de leurs spécialistes pour améliorer nos propres conceptions."
 fin_germilhelpfoc:0 "Force expéditionnaire allemande"
 fin_germilhelpfoc_desc:0 "Nous devrions demander à l’Allemagne l’envoi de forces expéditionnaires."
 fin_greatfinfoc:0 "Finlandisation"
 fin_greatfinfoc_desc:0 "Pour réaliser véritablement la Grande-Finlande, nous devons assimiler les nouveaux territoires à la culture finlandaise."
 fin_swefinmilfoc:0 "Partager l’expérience militaire"
 fin_swefinmilfoc_desc:0 "Nous devrions échanger des experts militaires avec la Suède, ce qui profiterait grandement aux deux nations."
 fin_paramilitarism:0 "Paramilitarisme"
 fin_paramilitarism_desc:0 "Nous devrions former les civils afin qu’ils puissent soutenir nos troupes en cas de guerre."
 fin_revolutionfoc:0 "La Révolution"
 fin_revolutionfoc_desc:0 "Les petites querelles politiques ont trop duré ! L’heure est venue pour la Révolution !"
 fin_restoreredguard:0 "Restaurer la Garde rouge"
 fin_restoreredguard_desc:0 "Si nous devons mener une guerre civile contre les capitalistes, nous devrions rétablir la Garde rouge en secret."
 fin_demcomunbanfoc:0 "Légaliser le communisme"
 fin_demcomunbanfoc_desc:0 "Nous devons exiger du gouvernement la légalisation du communisme !"
 fin_demandgovchange:0 "Exiger des élections"
 fin_demandgovchange_desc:0 "La majorité soutient le communisme ! Nous devons exiger des élections immédiatement !"
 fin_indoctrination:0 "Endoctrinement"
 fin_indoctrination_desc:0 "Puisque notre idéologie est fondée sur la vérité, elle peut être enseignée comme telle. L’éducation et les médias doivent refléter cette leçon."
 fin_sovierelations:0 "Relations avec l’Union soviétique"
 fin_sovierelations_deasc:0 "Là où la Révolution a commencé : nous devrions améliorer nos relations avec les Soviétiques."
 fin_jointhecomintern:0 "Le Komintern"
 fin_jointhecomintern_desc:0 "Pour nous protéger des maux du fascisme, nous devrions chercher à nous allier aux Soviétiques."
 fin_ourownway:0 "Notre propre voie"
 fin_ourownway_desc:0 "Les Soviétiques ne savent pas ce qu’est le véritable communisme ! Nous suivrons notre propre voie plutôt que de traiter avec de faux communistes."
 fin_wwrevol:0 "Révolution mondiale"
 fin_wwrevol_desc:0 "Nous allons lancer un programme rassemblant des individus talentueux afin de propager la Révolution aux quatre coins du monde !"
 fin_norrevolution:0 "La Révolution balte"
 fin_norrevolution_desc:0 "Les États baltes et nous avons un point commun : la haine de l’Union soviétique. Nous devrions chercher à nous allier avec eux."
 fin_nordicom:0 "Alliance baltique"
 fin_nordicom_desc:0 "Il est temps de nous allier aux États baltes afin de garantir une défense mutuelle contre l’URSS !"
 fin_sovietcomfoc:0 "Abattre les faux communistes !"
 fin_sovietcomfoc_desc:0 "Il est temps de faire tomber les faux communistes !"
 fin_banfascism:0 "Interdire le fascisme"
 fin_banfascism_desc:0 "Nous n’avons pas besoin de racaille fasciste dans notre pays."
 fin_unholyalliance:0 "L’alliance impie"
 fin_unholyalliance_desc:0 "Même si la population pourrait désapprouver, il est dans notre intérêt de nous allier aux Soviétiques."
 fin_takedownaxis:0 "L’Axe"
 fin_takedownaxis_desc:0 "Les fascistes ont sévi trop longtemps, il est temps qu’ils disparaissent !"
 fin_propaganda:0 "Propagande communiste"
 fin_propaganda_desc:0 "Nous devrions renforcer nos efforts de propagande pour unir le peuple."
 fin_armybuildup:0 "Renforcer l’armée finlandaise"
 fin_armybuildup_desc:0 "Notre technologie militaire a pris du retard par rapport aux autres pays, nous devrions nous concentrer sur la modernisation et l’amélioration de nos forces armées."
 fin_modernizearmy:0 "Moderniser l’armée"
 fin_modernizearmy_desc:0 "La modernisation de nos armes légères est une étape essentielle."
 fin_defensivefoc:0 "Doctrine défensive"
 fin_defensivefoc_desc:0 "Nous ne sommes pas une nation d’envahisseurs, nous devons nous concentrer sur la défense de notre territoire."
 fin_offensive:0 "Doctrine offensive"
 fin_offensive_desc:0 "On dit que la meilleure défense est une bonne attaque."
 fin_infantry:0 "L’infanterie est notre colonne vertébrale"
 fin_infantry_desc:0 "L’infanterie a toujours été et sera toujours l’épine dorsale de toute armée."
 fin_armor:0 "Motoriser l’armée"
 fin_armor_desc:0 "L’infanterie classique ne suffit plus : pour moderniser notre armée, nous devons miser sur une force rapide et mécanisée."
 fin_foreigntanks:0 "Conceptions de chars étrangers"
 fin_foreigntanks_desc:0 "Importer des conceptions de chars étrangers nous aidera à créer nos propres modèles à l’avenir."
 fin_frencharty:0 "Importer l’artillerie française"
 fin_frencharty_desc:0 "Les Français comptent de nombreux experts en artillerie, nous devrions solliciter leur assistance."
 fin_strategy:0 "Recruter des stratèges militaires"
 fin_strategy_desc:0 "Nous devrions nous concentrer sur le recrutement d’anciens soldats aguerris comme stratèges."
 fin_motti:0 "Tactiques du motti"
 fin_motti_desc:0 "En utilisant nos forêts pour encercler et tendre des embuscades à nos ennemis, nous en tirerons un grand avantage."
 fin_blitzkrieg:0 "Étudier la Blitzkrieg"
 fin_blitzkrieg_desc:0 "En étudiant la blitzkrieg allemande, nous pourrons développer de nouvelles stratégies."
 fin_lessonsfrompoland:0 "Étudier la défense polonaise"
 fin_lessonsfrompoland_desc:0 "En analysant la défense polonaise face à l’invasion allemande, nous pourrions en tirer des leçons précieuses."
 fin_resslot:0 "Financer la recherche militaire"
 fin_resslot_desc:0 "En octroyant davantage de fonds à la recherche et au développement militaires, nous améliorerons la qualité de nos armées."
 fin_qfpounder:0 "Importer les canons britanniques de 17 livres"
 fin_qfpounder_desc:0 "Les canons britanniques de 17 livres sont impressionnants, nous devrions en importer."
 fin_lessonsofwar:0 "Mobiliser le Lotta Svärd"
 fin_lessonsofwar_desc:0 "En mobilisant les femmes et l’organisation Lotta Svärd, nous pouvons remplacer les hommes dans l’industrie et obtenir davantage de soldats."
 fin_militarypropaganda:0 "Mobiliser les réserves"
 fin_militarypropaganda_desc:0 "Une invasion étrangère semble imminente, nous devons mobiliser nos réserves pour être prêts à temps !"
 fin_mannherimline:0 "Ligne Mannerheim"
 fin_mannherimline_desc:0 "Nous devrions bâtir des fortifications en retrait des rivières, un peu éloignées de Leningrad, afin d’obtenir les meilleures positions défensives."
 fin_salpa:0 "Ligne Salpa"
 fin_salpa_desc:0 "Nous devrions entamer un programme de fortification de la frontière soviétique."
 fin_fortaland:0 "Fortifier Åland"
 fin_fortaland_desc:0 "Åland est une île stratégique qui doit être solidement défendue."
 fin_forthelsinki:0 "Fortifier Helsinki"
 fin_forthelsinki_desc:0 "En cas d’invasion navale, fortifier notre capitale est essentiel."
 fin_alandquestion:0 "La question d’Åland"
 fin_alandquestion_desc:0 "Nous devons décider du sort du territoire d’Åland."
 fin_forts:0 "Améliorer la construction de forts"
 fin_forts_desc:0 "En tant que petit pays, nous ne pouvons pas espérer nous défendre facilement. C’est pourquoi nous devons améliorer nos capacités de construction de fortifications afin d’assurer une meilleure ligne défensive."
 fin_guardthegulf:0 "Protéger le golfe"
 fin_guardthegulf_desc:0 "Le golfe est un élément essentiel de notre défense : si nous installons des radars et des bases aériennes sur la côte, nous pourrons le sécuriser."
 fin_militaryindstry:0 "Financer l’industrie militaire"
 fin_militaryindstry_desc:0 "Le financement de l’industrie militaire nous aidera à produire davantage d’équipements."
 fin_baltictrl:0 "Contrôler la Baltique"
 fin_baltictrl_desc:0 "En construisant des navires capitaux, nous pourrons prendre le contrôle total de la mer."
 fin_navy:0 "Marine finlandaise"
 fin_navy_desc:0 "Notre marine est un élément essentiel de notre défense : nous devrions agrandir notre flotte pour protéger la mer Baltique et notre littoral."
 fin_molotov:0 "Cocktail Molotov"
 fin_molotov_desc:0 "Les cocktails Molotov sont une arme improvisée contre les chars. Si nous fournissons à chacun les matériaux nécessaires pour en fabriquer, nos capacités antichars s’en trouveront renforcées."
 fin_panzerfaust:0 "Panzerfaust"
 fin_panzerfaust_desc:0 "Importer des Panzerfaust allemands nous aidera à faire face aux blindés ennemis."
 fin_suomikp31:0 "Financer de nouveaux modèles d’armes"
 fin_suomikp31_desc:0 "Concevoir nos propres armes est essentiel pour ne pas dépendre de la technologie étrangère."
 fin_engineer:0 "Brigades du génie"
 fin_engineer_desc:0 "En intégrant des brigades du génie à nos divisions, celles-ci seront capables de construire des positions retranchées bien plus solides."
 fin_logistics:0 "Brigades logistiques"
 fin_logistics_desc:0 "Si nous passons à l’offensive, disposer de lignes de ravitaillement efficaces sera indispensable."
 fin_rulethebaltic:0 "Dominer la mer Baltique"
 fin_rulethebaltic_desc:0 "Plutôt que de seulement protéger nos convois et nos côtes, nous devrions bâtir une flotte capable de dominer la Baltique pour une meilleure sécurité."
 fin_skitroops:0 "Troupes à ski"
 fin_skitroops_desc:0 "Si nous devons combattre en hiver, équiper nos divisions de skis leur permettra de se déplacer plus facilement et rapidement dans les terrains enneigés."
 fin_defnavy:0 "Protéger la Baltique"
 fin_defnavy_desc:0 "Étant donné notre capacité industrielle limitée, nous devrions concentrer nos efforts sur la construction de destroyers et de sous-marins pour protéger nos convois et traquer les navires ennemis."
 fin_battleship:0 "Priorité aux cuirassés"
 fin_battleship_desc:0 "Tandis que les théoriciens débattent de la suprématie aérienne ou navale, personne ne veut voir les canons d’un cuirassé pointés sur son palais. Même si les partisans des porte-avions finissent par avoir raison, les cuirassés domineront encore les océans pendant des années."
 fin_carrierfocus:0 "Priorité aux porte-avions"
 fin_carrierfocus_desc:0 "La puissance aérienne sera cruciale dans les batailles à venir, et le moyen le plus pratique d’en étendre la portée reste l’utilisation de porte-avions. Nous devons développer des modèles plus avancés et spécialisés."
 fin_heavycruisers:0 "Importer des conceptions britanniques"
 fin_heavycruisers_desc:0 "Les Britanniques sont célèbres pour la puissance de leur Royal Navy, si nous pouvions accéder à leurs conceptions navales, nous en tirerions un grand bénéfice."
 fin_geruboats:0 "Sous-marins allemands"
 fin_geruboats_desc:0 "Les Allemands ont perfectionné l’art de la guerre sous-marine, avec leur aide nous pourrons construire de meilleurs sous-marins."
 fin_navydoctrine:0 "Jeux de guerre navals"
 fin_navydoctrine_desc:0 "En menant de vastes exercices navals, nous acquerrons une expérience précieuse dans le combat maritime."
 fin_expandturku:0 "Agrandir les chantiers navals de Turku"
 fin_expandturku_desc:0 "La ville de Turku possède déjà un chantier naval impressionnant, mais en l’agrandissant davantage nous pourrons produire encore plus de navires."
 fin_alandbases:0 "Protéger Åland"
 fin_alandbases_desc:0 "Nous ne pouvons pas laisser nos ennemis contrôler l’île d’Åland, il nous faut y construire davantage de bases navales."
 fin_ouluship:0 "Chantiers navals d’Oulu"
 fin_ouluship_desc:0 "Oulu est assez éloignée des bases navales et aériennes ennemies. Y construire des chantiers navals nous garantira des infrastructures protégées."
 fin_destroyers:0 "Effort sur les destroyers"
 fin_destroyers_desc:0 "Les destroyers sont un élément essentiel de toute flotte. Nous en avons besoin pour traquer les sous-marins ennemis."
 fin_wolf:0 "Meutes de loups"
 fin_wolf_desc:0 "En organisant nos sous-marins en meutes, nous pourrons attaquer massivement les convois ennemis et affaiblir leur ravitaillement."
 fin_airforce:0 "Force aérienne finlandaise"
 fin_airforce_desc:0 "L’avenir de la guerre ne se joue pas sur terre ni en mer, mais dans les airs. Il est donc primordial de développer une force aérienne plus puissante."
 fin_fighterfocus:0 "Importer des Fokker"
 fin_fighterfocus_desc:0 "La série d’avions Fokker néerlandais est impressionnante et indispensable pour notre armée de l’air."
 fin_bombers:0 "Conceptions de bombardiers étrangers"
 fin_bombers_desc:0 "Les bombardiers sont un élément crucial de toute armée de l’air. Acheter des licences de production étrangères nous permettra d’en déployer davantage."
 fin_airbase:0 "Améliorer les bases aériennes"
 fin_airbase_desc:0 "Pour accompagner l’expansion de notre armée de l’air, nous aurons besoin de davantage de bases aériennes."
 fin_bristol:0 "Importer des Blenheim"
 fin_bristol_desc:0 "Les nouveaux avions britanniques Bristol Blenheim sont des appareils polyvalents utiles qui nous aideront à développer nos propres modèles. Nous devrions en acheter au Royaume-Uni."
 FIN_bristol_research:0 "Les Blenheim importés grâce à ce focus resteront invisibles tant que les Britanniques n’auront pas recherché les chasseurs lourds.\n"
 fin_german:0 "Importer des Dornier Do 17"
 fin_german_desc:0 "En attendant de produire nos propres bombardiers, nous devons chercher une aide immédiate, et nous pensons que l’Allemagne est le meilleur choix."
 fin_airtraining:0 "Exercices aériens"
 fin_airtraining_desc:0 "Mettre en place de meilleurs programmes d’entraînement aérien nous sera précieux en temps de guerre."
 fin_fundvlt:0 "Financer VL"
 fin_fundvlt_desc:0 "VL est un acteur clé dans notre industrie aéronautique. En leur octroyant davantage de fonds, nous pourrons aligner une armée de l’air plus performante."
 fin_improveprogram:0 "Améliorer le programme de formation aérienne"
 fin_improveprogram_desc:0 "Notre programme de formation aérienne nécessite encore des améliorations."
 fin_homemadedesigns:0 "Encourager les conceptions VL"
 fin_homemadedesigns_desc:0 "En encourageant VL à développer ses propres conceptions, nous réduirons notre dépendance aux modèles étrangers."
 fin_karhumaki:0 "Frères Karhumäki"
 fin_karhumaki_desc:0 "Les frères Karhumäki disposent d’un aérodrome et d’installations importantes, nous devons prendre leur commandement pour qu’ils nous aident en temps de guerre."
 fin_navalbombers:0 "Conceptions de bombardiers navals"
 fin_navalbomers_desc:0 "Pour protéger notre littoral et nos mers, les bombardiers navals sont indispensables."
 fin_industry:0 "Encourager l’industrie finlandaise"
 fin_industry_desc:0 "En encourageant l’industrie finlandaise à s’améliorer et à s’étendre, nous en tirerons un grand bénéfice, ainsi que notre peuple."
 fin_lemminkainen:0 "Projets Lemminkäinen"
 fin_lemminkainen_desc:0 "Lemminkäinen est un acteur essentiel dans la construction de notre infrastructure. En lui confiant davantage de projets, nous aurons de meilleures infrastructures."
 fin_paperindustry:0 "Financement de l’industrie papetière"
 fin_paperindustry_desc:0 "L’industrie papetière est un pilier de notre économie, nous devons la financer davantage."
 fin_vr:0 "Augmenter le budget de la VR"
 fin_vr_desc:0 "La société VR est essentielle pour notre logistique en temps de guerre, nous devons l’aider à développer un meilleur réseau ferroviaire."
 fin_schools:0 "Construire des écoles d’ingénierie"
 fin_schools_desc:0 "En construisant davantage d’écoles d’ingénierie, nous disposerons de plus d’ingénieurs compétents pour soutenir notre industrie."
 fin_industrialization:0 "Industrialisation"
 fin_industrialization_desc:0 "Nous avons pris du retard dans l’industrie moderne, il est temps de rattraper ce retard."
 fin_tikkakoski:0 "Tikkakoski Oy"
 fin_tikkakoski_desc:0 "Tikkakoski est un acteur important dans la production de petites armes, et ils ont besoin de meilleures installations."
 fin_recruitment:0 "Développer le secteur privé"
 fin_recruitment_desc:0 "Le capital financier est actuellement inégalement réparti dans le pays, avec des acteurs majeurs comme Nokia ou Tikkakoski Oy dominant le marché. Ce type de développement économique fragilisera la vie de nos citoyens en cas de conflit majeur ou de nouvelle crise économique. Pour l’éviter, il faut promouvoir et soutenir les petits fabricants locaux avec l’aide du gouvernement."
 fin_vkt:0 "VKT"
 fin_vkt_desc:0 "Nous aurons besoin d’une bonne réserve d’armes légères, aider VKT à s’agrandir est donc crucial."
 fin_valmet:0 "Accroître la capacité militaire"
 fin_valmet_desc:0 "On n’a jamais trop de capacité dans l’industrie militaire."
 fin_nokian:0 "Nokian Tyres"
 fin_nokian_desc:0 "Nokian Tyres est un acteur important de notre production de caoutchouc."
 fin_outokumpu:0 "Outokumpu"
 fin_outokumpu_desc:0 "Outokumpu est essentiel pour notre approvisionnement en matières premières."
 fin_telecommunications:0 "Entreprises de télécommunications"
 fin_telecommunications_desc:0 "En développant nos entreprises de télécommunications, nous pourrons les utiliser en cas de besoin."
 fin_radar:0 "Étudier le radar"
 fin_radar_desc:0 "Le radar britannique est une technologie totalement nouvelle qui leur permet de tout voir dans un certain rayon. Nous devons l’étudier et l’analyser."
 fin_encryption:0 "Former des experts en électronique"
 fin_encryption_desc:0 "Nous devrions former des experts en électronique pour nous aider à intercepter les transmissions étrangères."
 fin_scientists:0 "Recruter des scientifiques"
 fin_scientists_desc:0 "Recruter des scientifiques étrangers nous permettra d’augmenter nos capacités de recherche."
 fin_intervention:0 "Intervention en Scandinavie"
 fin_intervention_desc:0 "L’Allemagne a déclaré la guerre au Danemark et à la Norvège, devons-nous intervenir aux côtés de la Suède pour protéger nos frontières ?"
 fin_estonia:0 "Le sort de l’Estonie"
 fin_estonia_desc:0 "L’Estonie doit se soumettre à nous, ou être annexée."
 fin_estoniaforkarjala:0 "Estonie contre Carélie"
 fin_estoniaforkarjala_desc:0 "L’Union soviétique a clairement exprimé sa volonté de s’approprier la Carélie, mais nous n’allons pas la céder gratuitement. Nous devrions exiger l’État satellite estonien en échange."
 fin_balticsafety:0 "Sécurité de la Baltique"
 fin_balticsafety_desc:0 "Les Soviétiques revendiquent nos territoires ainsi que ceux de nos alliés, nous devons agir."
 fin_independent_diplomacy:0 "Diplomatie indépendante"
 fin_independent_diplomacy_desc:0 "Nous n’avons besoin de personne pour atteindre la grandeur !"
 FIN_salpa_line:0 "Ligne Salpa"
 FIN_salpa_line_desc:0 "Notre situation évolue. Nous avons besoin d’une nouvelle ligne de fortifications pour défendre la nation."

 ##############################DÉCISIONS ###########################################
 FIN_the_winter_war_category:0 "La Guerre d’Hiver"
 FIN_the_winter_war_category_desc:0 "L’aboutissement des politiques expansionnistes [SOV.getAdjective] est l’invasion colossale de notre pays sur toute la longueur de la frontière [SOV.getAdjective]-[FIN.getAdjective], sous le prétexte de « libérer le peuple [FIN.getAdjective] d’un régime oppressif ». Pourtant, nous savons tous qu’il ne s’agit que d’un stratagème pour réincorporer notre nation éprise de liberté comme Grand-Duché de Finlande, sous la domination directe de Moscou.\n\nIls goûteront au Sisu et verront ce que nos soldats ont à offrir."
 FIN_offer_concessions_to_soviets:0 "Offrir des concessions aux [SOV.getAdjective]s"
 FIN_offer_concessions_to_soviets_desc:0 "La communiste [Root.GetAdjective] Hella Wuolijoki a contacté notre gouvernement et proposé son aide pour établir le contact avec le régime [SOV.GetAdjective]. Une réunion a été organisée dans un lieu secret en Suède, où l’on nous donnera l’opportunité de céder des territoires en échange du maintien de la souveraineté [Root.GetAdjective].\n\nLes forces [Root.GetAdjective] s’épuisent rapidement, et les tentatives précédentes d’ouvrir une ligne de communication ont échoué. Cela pourrait être notre seul espoir d’une résolution pacifique du conflit."
 FIN_propose_soviets_to_restore_status_quo:0 "Proposer aux [SOV.getAdjective]s de rétablir le statu quo"
 FIN_propose_soviets_to_restore_status_quo_desc:0 "Si cette guerre continue telle quelle, nous pourrions ne pas être capables de nous en remettre. Nous pouvons tenter de convaincre les [SOV.getAdjective]s de rétablir un statu quo dans ce conflit, compte tenu de leurs lourdes pertes."
 FIN_demand_reconciliation:0 "Exiger la réconciliation"
 FIN_demand_reconciliation_desc:0 "Avec l’armée [SOV.getAdjective] brisée et totalement vaincue par les courageuses forces [FIN.getAdjective], nous pouvons exiger une paix qui nous sera favorable !"
 FIN_request_swedish_assistance:0 "Demander l’aide [SWE.getAdjective] dans la guerre"
 FIN_request_swedish_assistance_desc:0 "[FIN.getNameDefCap] et [SOV.getNameDef] sont en guerre. Après seulement quelques décennies de souveraineté, nous risquons à nouveau de devenir le sujet de l’un de nos voisins.\n\nLa menace de notre ennemi s’étend cependant au-delà de nos frontières. Nos voisins de [SWE.getNameDef] conservent une neutralité vis-à-vis de [SOV.getNameDef], mais pourraient peut-être être convaincus de nous rejoindre pour défendre notre héritage commun et sécuriser leur propre zone tampon stratégique."

