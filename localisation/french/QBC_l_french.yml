 QBC_reclaim_our_cores_desc:0 "La guerre de Sept Ans et le traité de Paris de 1763 ont mis fin à la domination française sur la province, dépouillant la Nouvelle-France d’une grande partie de ses terres. Avant la confédération, le Québec ne possédait que la moitié de son territoire actuel. Par la conquête ou des traités, le Québec a pu récupérer des terres ; elles devraient à nouveau être réintégrées au Grand Québec."
