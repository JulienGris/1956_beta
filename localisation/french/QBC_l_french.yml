 QBC_communist_uprising:0 "La grève générale"
 QBC_communist_uprising_desc:0 "Impérialistes anglais ou bourgeoisie oppressive, la nation québécoise ne tolérera pas leur tyrannie et rendra tout le pouvoir au prolétariat !"
 QBC_use_the_quebecois_nationalists:0 "Utiliser les nationalistes"
 QBC_use_the_quebecois_nationalists_desc:0 ""
 QBC_the_padlock_law:0 "Loi du cadenas"
 QBC_the_padlock_law_desc:0 "La loi du cadenas : purgeons notre société des éléments communistes ! Nous pourrions aussi l’étendre aux syndicats, qui freinent nos efforts économiques."
 QBC_control_the_medias:0 "Contrôler les médias"
 QBC_control_the_medias_desc:0 ""
 QBC_colonize_the_north:0 "Colonisation du Nord"
 QBC_colonize_the_north_desc:0 ""
 QBC_advatageous_foreign_trade_deal:0 "Étendre le commerce avec nos voisins"
 QBC_advatageous_foreign_trade_deal_desc:0 ""
 QBC_the_union_nationale_wins:0 "L’Union nationale l’emporte"
 QBC_the_union_nationale_wins_desc:0 ""
 QBC_liberal_in_charge:0 "Réélection des libéraux"
 QBC_liberal_in_charge_desc:0 ""
 QBC_quebec_on_the_worlds_stage:0 "Québec sur la scène mondiale"
 QBC_quebec_on_the_worlds_stage_desc:0 "La situation intérieure étant réglée, nous pouvons enfin tourner notre attention vers un monde extérieur sous tension et, peut-être, assurer à jamais notre indépendance !"
 QBC_labor_laws:0 "Adopter des lois sur la sécurité au travail"
 QBC_labor_laws_desc:0 "Certains au gouvernement tentent de faire adopter une loi limitant l’activité syndicale et ce qui serait considéré comme de la « propagande bolchevique ». Malgré l’importance de nous protéger contre la menace communiste, nous devons garantir la sécurité des travailleurs sur leur lieu de travail afin d’éviter qu’ils ne se tournent vers des idéologies extrêmes."
