 # Focus
 QBC_support_vautrin_plan:0 "Soutenir le Plan Vautrin"
 QBC_support_vautrin_plan_desc:0 "Soutenir le Plan Vautrin"
 QBC_abitibi_gold_rush:0 "Ruée vers l’or en Abitibi"
 QBC_abitibi_gold_rush_desc:0 "Construire Val-d’Or et taxer l’or."
 QBC_connect_the_north:0 "Relier le Nord"
 QBC_connect_the_north_desc:0 "Construire de nouvelles routes dans des terres hostiles."
 QBC_inuit_minority_status:0 "Statut des Inuits"
 QBC_inuit_minority_status_desc:0 "Statut de la minorité inuite"
 QBC_wood_industry:0 "Industrie forestière"
 QBC_wood_industry_desc:0 "Abattre des arbres pour de l’argent."
 QBC_northern_expansion:0 "Expansion vers le Nord"
 QBC_northern_expansion_desc:0 "Fonder de nouvelles villes dans le Nord."
 QBC_forest_training:0 "Entraînement en forêt"
 QBC_forest_training_desc:0 "Entraînement en forêt"
 QBC_winter_equipment:0 "Équipement d’hiver"
 QBC_winter_equipment_desc:0 "Il fait froid en hiver, c’est un fait largement connu. Il serait insensé de ne pas équiper nos soldats en conséquence, compte tenu de la rigueur de nos hivers."
 QBC_expand_mining:0 "Développer les mines"
 QBC_expand_mining_desc:0 "Plus d’or !"
 QBC_organize_the_militias:0 "Organiser les milices"
 QBC_organize_the_militias_desc:0 "Organiser les milices."
 QBC_quebec_arsenal:0 "L’Arsenal de Québec"
 QBC_quebec_arsenal_desc:0 "L’un des principaux producteurs de munitions de la région."
 QBC_small_arms_production:0 "Production d’armes légères"
 QBC_small_arms_production_desc:0 "Passez les munitions !"
 QBC_modernized_support_equipment:0 "Équipement de soutien modernisé"
 QBC_modernized_support_equipment_desc:0 "Plus de soutien !"
 QBC_land_doctrine_reform:0 "Réforme de la doctrine terrestre"
 QBC_land_doctrine_reform_desc:0 "De meilleures tactiques pour de meilleures batailles."
 QBC_quebecois_officer_corps:0 "Corps des officiers québécois"
 QBC_quebecois_officer_corps_desc:0 "Corps des officiers québécois"
 QBC_marine_industries:0 "Industries maritimes"
 QBC_marine_industries_desc:0 "Construction navale sur le Saint-Laurent."
 QBC_industrial_planning:0 "Planification industrielle"
 QBC_industrial_planning_desc:0 "Si nous voulons développer nos secteurs industriels, nous devons planifier leur expansion ainsi que les projets à long terme."
 QBC_sorel_steel_and_foundry:0 "Aciéries de Sorel"
 QBC_sorel_steel_and_foundry_desc:0 "Sorel sera le cœur de notre production d’acier et travaillera en synergie avec le chantier naval voisin et l’usine d’armement prévue."
 QBC_stimulate_the_economy:0 "Stimuler l’économie"
 QBC_stimulate_the_economy_desc:0 "En injectant des fonds dans l’économie, nous pourrions provoquer un impact assez fort pour la relancer !"
 QBC_locomotive_industry:0 "Industrie des locomotives"
 QBC_locomotive_industry_desc:0 "Le transport rapide de grandes quantités de marchandises par voie terrestre ne peut se faire que par train, investissons donc dans ce domaine !"
 QBC_bombardier_vehicles:0 "Véhicules Bombardier"
 QBC_bombardier_vehicles_desc:0 "Bombardier est célèbre pour avoir inventé la motoneige ; peut-être pourrions-nous utiliser ses idées et ses techniques industrielles pour améliorer nos machines de guerre."
 QBC_tank_program:0 "Programme de chars"
 QBC_tank_program_desc:0 "Les guerres ne se gagnent plus seulement avec de l’infanterie et de la volonté. Nous aurons besoin d’avancées technologiques, et lancer un programme de chars sera la première étape."
 QBC_angus_shop_tank_production:0 "Production de chars aux Ateliers Angus"
 QBC_angus_shop_tank_production_desc:0 "Les Ateliers Angus du CPR sont de grands fabricants de locomotives dans la région de Montréal. Peut-être pourrions-nous utiliser leurs usines pour soutenir notre complexe militaire."
 QBC_sorel_industries:0 "Industries de Sorel"
 QBC_sorel_industries_desc:0 "L’emplacement favorable sur le Saint-Laurent et la proximité des aciéries en font un lieu parfait pour la production d’équipements militaires lourds tels que des pièces d’artillerie."
 QBC_artillery_improvements:0 "Améliorations de l’artillerie"
 QBC_artillery_improvements_desc:0 "L’artillerie est l’épine dorsale de l’armée, l’améliorer est la suite logique."
 QBC_naval_grade_steel:0 "Acier naval"
 QBC_naval_artillery:0 "Artillerie navale"
 QBC_shipbuilding_contacts:0 "Contacts dans la construction navale"
 QBC_national_admiralty:0 "Amirauté nationale"
 QBC_destroyer_focus:0 "Concevoir des destroyers"
 QBC_cruiser_focus:0 "Concevoir des croiseurs"
 QBC_naval_mine_warfare:0 "Guerre des mines navales"
