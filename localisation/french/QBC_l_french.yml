 #Events
 quebec.1.t:0 "La démission de [ROOT.GetLeader]"
 quebec.1.d:0 "Il apparaît que [ROOT.GetLeader] a démissionné après un récent scandale le présentant comme un homme frauduleux. Les détails restent flous et les médias s’empressent d’en profiter, mais [ROOT.GetLeader] a déjà nommé son successeur."
 quebec.1.a:0 "Cela va sûrement nuire à la réputation du parti au pouvoir"
 quebec.2.t:0 "Le Québec demande une alliance !"
 quebec.2.d:0 "Depuis que le nouveau régime au nord, dans l’ex-province de Québec, s’est tourné vers une nouvelle forme de gouvernance, nous avons remarqué certains changements dans leur culture pour nous faire une place dans leur cœur en forme de fleur-de-lis ! Cependant, leurs ambitions dépassent leurs terres actuelles et ils nous demandent une alliance au cas où les choses tourneraient mal."
 quebec.2.a:0 "Nous proclamons fièrement une nouvelle ère pour nos deux nations !"
 quebec.2.b:0 "Leurs lubies ne nous intéressent pas."
 quebec.3.t:0 "Excellente nouvelle !"
 quebec.3.d:0 "Nos amis français ont accepté notre offre équitable ! Désormais, nous sommes officiellement alliés à leur gouvernement !"
 quebec.3.a:0 "Ensemble, nous marcherons vers la victoire, hourra !"
 quebec.4.t:0 "Déception de nos amis"
 quebec.4.d:0 "Nos diplomates sont revenus de la capitale française avec une tragique nouvelle ! Le gouvernement en place ne rejoindra pas notre glorieuse alliance."
 quebec.4.a:0 "Peut-être que les Allemands avaient raison… Ce sont des lâches !"
 quebec.5.t:0 "La question des frontières"
 quebec.5.d:0 "[ROOT.GetLeader] a récemment convoqué son cabinet pour une réunion d’urgence au sujet d’une question importante. Il s’avère que la fermeture des frontières par panique post-indépendance a eu des impacts immenses sur notre économie ! [ROOT.GetLeader] a proposé à sa petite assemblée d’interroger le gouvernement de [CAN.GetName] sur une solution mutuelle à ce problème.\n\nCertaines personnes, principalement des ministres anti-immigration et des nationalistes [ROOT.GetAdjective], s’y opposent fermement, pensant que cela pourrait mener à un contrôle total de notre politique et de notre économie par l’administration de [CAN.GetName]. Hélas, ils ne réalisent pas qu’un tel scénario pourrait être nécessaire à l’avenir."
 quebec.5.a:0 "Nous devons demander à nos amis canadiens !"
 quebec.6.t:0 "Une offre intéressante"
 quebec.6.d:0 "Aujourd’hui, [ROOT.GetLeader] a été surpris par une lettre inhabituelle provenant de [QBC.GetName]. Elle y décrit un plan de coopération future possible. Avec tous les investissements que nous avons dans leur pays, disent-ils, nous devrions être enclins à considérer leur proposition. Cependant, des ministres en colère rejettent ces demandes, affirmant que [QBC.GetName] est déjà parti et doit en payer le prix."
 quebec.6.a:0 "Je ne vois aucun mal à aider un vieil ami."
 quebec.6.b:0 "Ils n’avaient qu’à garder les frontières ouvertes, imbéciles !"
 quebec.7.t:0 "[CAN.GetNameDef] accepte"
 quebec.7.d:0 "Lors d’une récente réunion avec son cabinet, [CAN.GetLeader] a annoncé une excellente nouvelle : les frontières entre [ROOT.GetNameDef] et [CAN.GetNameDef] ne seront plus restreintes, permettant la libre circulation de nos peuples ! Un grand jour pour l’histoire de nos deux nations !"
 quebec.7.a:0 "Formidable !"
 quebec.8.t:0 "[CAN.GetNameDef] refuse"
 quebec.8.d:0 "Dans une récente allocution, [CAN.GetNameDef] a confirmé nos pires craintes. Nos liens diplomatiques se sont effondrés et, pire encore, leur gouvernement nous a publiquement critiqués, nous traitant « d’imbéciles » et nous rendant responsables des malheurs de [CAN.GetNameDef] ! Toute relation entre nos pays a explosé…"
 quebec.8.a:0 "C’est la mort de nos relations amicales…"
 quebec.9.t:0 "La demande finale"
 quebec.9.d:0 "Après un changement de cap, le Premier ministre [ROOT.GetLeader] de [ROOT.GetNameDef] et le Premier ministre [CAN.GetLeader] de [CAN.GetNameDef] se sont rencontrés à Ottawa pour la dernière faveur que [ROOT.GetLeader] devait demander. [ROOT.GetSheHe] a demandé à l’honorable [CAN.GetLeader] si [CAN.GetSheHe] accepterait une proposition spéciale. [ROOT.GetNameDef] rejoindrait à nouveau [CAN.GetNameDef] mais comme nation autonome au sein du Canada.\n\nCela donnerait au gouvernement fédéral le contrôle de certains secteurs de notre pays tout en nous accordant une large autonomie. Les nationalistes et divers sceptiques s’opposent déjà à cet accord, ne voyant pas les avantages possibles, tandis qu’une partie de la population se réjouit de l’idée de rejoindre encore une fois le Canada…"
 quebec.9.a:0 "Espérons qu’ils fassent le bon choix !"
 quebec.10.t:0 "Assistance à un prix"
 quebec.10.d:0 "La semaine fut très éprouvante pour le gouvernement, mais [ROOT.GetLeader] a enfin reçu une bonne nouvelle pour occuper ses pensées au-delà des innombrables inquiétudes quant à l’état de la nation québécoise. Le Canada a accepté notre offre de rejoindre la confédération en tant que nation distincte. Les nationalistes sont vent debout, criant à la « subjugation » et à la « trahison », mais [CAN.GetLeader] a rassuré la population en affirmant que c’était tout simplement la bonne chose à faire."
 quebec.10.a:0 "Au moins, nous sommes en sécurité."
 quebec.11.t:0 "Une offre du Québec"
 quebec.11.d:0 "Aujourd’hui, des représentants du Québec nous ont approchés avec une offre tentante. Ils affirment que, pour lutter contre l’impérialisme canadien, ils ont besoin de notre aide et souhaiteraient rejoindre le Komintern."
 quebec.11.a:0 "Nous acceptons leur offre !"
 quebec.11.b:0 "Pourquoi gaspiller des ressources pour le Québec ?"
 quebec.12.t:0 "Soupir de soulagement"
 quebec.12.d:0 "Partout dans la province, on célèbre la récente nouvelle ! Selon le président Rose, l’Union soviétique et notre glorieuse république socialiste ont conclu une alliance officielle !"
 quebec.12.a:0 "Que cette nouvelle alliance soit fructueuse !"
 quebec.13.t:0 "Désastre !"
 quebec.13.d:0 "Ce soir, le cabinet au pouvoir a tenu une réunion d’urgence au sujet d’un problème crucial. La lettre envoyée aux Soviétiques est revenue négative : ils ont apparemment refusé notre demande de protection !"
 quebec.13.a:0 "Il faudra faire sans eux."
 quebec.14.t:0 "Oups ! C’est un bug ! (désolé)"
 quebec.14.d:0 "Je n’ai aucune idée de la manière dont cet événement se déclenche et mon code n’est pas clair ; si vous voyez ceci, c’est un bug :)"
 quebec.14.a:0 "En route vers le rapport de bug !"
 quebec.15.t:0 "Demande particulière"
 quebec.15.d:0 "Une fois de plus, [QBC.GetNameDef] nous a adressé une requête. Cette fois, cependant, elle a laissé le Premier ministre [ROOT.GetLeader] sans voix. Selon la lettre, [QBC.GetLeader] demande le rétablissement de leur entrée dans la confédération sous une condition : une autonomie élargie, devenant en pratique nos vassaux et non un territoire canadien à part entière. La plupart de notre population accueillerait les Québécois à bras ouverts, mais une question demeure : devons-nous leur accorder une nouvelle chance ?"
 quebec.15.a:0 "Que nos amis québécois se sentent de nouveau les bienvenus parmi nous !"
 quebec.15.b:0 "Dites-leur que nous en avons assez de leurs demandes ridicules !"
 quebec.16.t:0 "D’un Premier ministre à un autre."
 quebec.16.d:0 "Après notre indépendance, nous avons compris que couper tous les liens avec notre plus grand et plus important voisin serait insensé ; beaucoup au parlement ont donc proposé de rétablir les relations diplomatiques avec [CAN.GetNameDef] et la plupart ont approuvé, certains craignant la domination de [USA.GetNameDef] et d’autres, tout simplement, agissant par « bon sens »."
 quebec.16.a:0 "Puissent [CAN.GetNameDef] faire ce qui s’impose."
 quebec.17.t:0 "[QBC.GetNameDef] souhaite rétablir des relations diplomatiques."
 quebec.17.d:0 "Aujourd’hui, [QBC.GetNameDef] nous a envoyé un message au ton différent. Pour la première fois depuis leur indépendance, ils souhaitent rétablir des contacts diplomatiques permanents avec nous ! Beaucoup critiquent déjà ce geste comme le contrecoup évident de leur indépendance et une occasion de les laisser seuls « en conséquence de leurs actes ». D’autres pensent que renouer les liens serait la première étape vers une amitié québéco-canadienne."
 quebec.17.a:0 "Il ne peut sortir que du bon de la diplomatie !"
 quebec.17.b:0 "Non, je ne pense pas."

 quebec.18.t:0 "[CAN.GetNameDef] a accepté de rétablir les relations !"
 quebec.18.d:0 "Heureusement, [CAN.GetNameDef] a accepté notre proposition et des ambassadeurs arriveront sous peu !"
 quebec.18.a:0 "Hourra pour les relations franco-canadiennes !"

 quebec.19.t:0 "[CAN.GetNameDef] a refusé toute communication !"
 quebec.19.d:0 "Malheureusement, [CAN.GetNameDef], dans sa rage emplie d’orgueil, a refusé notre proposition amicale ! De plus, ils nous ont dit de régler nos problèmes seuls ou de rejoindre à nouveau la Confédération !"
 quebec.19.a:0 "Qu’ils soient maudits ! Nous n’avons pas besoin d’eux !"

 quebec.20.t:0 "Le Québec coupe tous les liens !"
 quebec.20.d:0 "Dans un geste surprenant, le Premier ministre [QBC.GetLeader] de [QBC.GetNameDef] a déclaré, à la fois à sa population nationale et à la communauté internationale, que [QBC.GetNameDef] rompait immédiatement tout lien diplomatique que [QBC.GetNameDef] entretenait avec nous !"
 quebec.20.a:0 "Qu’ils soient maudits ! Nous n’avons pas besoin d’eux !"

 quebec.21.t:0 "Vive le Québec Libre !"
 quebec.21.d:0 "Malgré tous les obstacles, notre nation s’est enfin constituée et a jusqu’ici triomphé de toutes les épreuves ! Le Premier ministre [ROOT.GetLeader] a commenté le succès historique de [ROOT.GetNameDef] !"
 quebec.21.a:0 "Une nouvelle aube pour la nation québécoise !"

 quebec.22.t:0 "Rétablissement miraculeux"
 quebec.22.d:0 "Partout au Québec, la vie semble retrouver peu à peu un nouveau niveau de normalité. Le nombre de sans-abri est à son plus bas, la pauvreté généralisée n’est plus qu’un souvenir et les gens dépensent à tout-va. Pas besoin d’être un grand économiste pour remarquer que l’économie québécoise est en plein essor. Les entreprises s’enrichissent et peuvent se permettre d’investir sur notre territoire !"
 quebec.22.a:0 "Nous avons survécu au pire, nous pouvons tout faire !"

 quebec.23.t:0 "La grève générale !"
 quebec.23.d:0 "Aujourd’hui, travailleurs et étudiants, quelles que soient leurs origines, sont descendus dans la rue avec un seul objectif : briser leurs chaînes supposées. À la fin de la journée, le gouvernement dirigé par [QBC.GetLeader] a perdu le contrôle du pays et a remis tous les pouvoirs aux dirigeants de la grève générale. Le Parti ouvrier progressiste est désormais au pouvoir et son dirigeant mènera le Québec vers une nouvelle ère."
 quebec.23.a:0 "Debout, les damnés de la terre.. !"

 quebec.24.t:0 "Le premier congrès nationaliste du Québec"
 quebec.24.d:0 "Après des heures de débats et de discussions entre les différentes ailes du [QBC.GetRulingPartyLong], les organisateurs ont décidé qu’il était temps de voter. La foule enthousiaste a alors commencé à choisir son candidat préféré parmi les deux disponibles…"
 quebec.24.a:0 "..Nous voulons Paul Bouchard !"
 quebec.24.b:0 "..Vive le Québec catholique ! Lionel Groulx nous mènera à la gloire !"

 quebec.25.t:0 "S’occuper de l’opposition"
 quebec.25.d:0 "Tout est en place, la police attend les ordres et les milices sont prêtes à perquisitionner les repaires de nos opposants notoires ! Il ne manque que le « feu vert » ! Qui allons-nous cibler ?"
 quebec.25.a:0 "Nous ne pouvons faire confiance à personne ! Purgeons tout le monde ! Viser tout le monde !"
 quebec.25.b:0 "Nous collaborerons avec d’autres groupes autoritaires, concentrons-nous sur la résistance prodémocratique !"
 quebec.25.c:0 "Nous inviterons les éléments prodémocratiques prêts à soutenir notre cause, concentrons-nous sur les communistes !"

 quebec_commie.1.t:0 "[QBC.GetNameDef] revendique Terre-Neuve !"
 quebec_commie.1.d:0 "Un rapport surprenant est venu de [QBC.GetNameDef]. [QBC.GetLeader] a lancé un ultimatum : céder Terre-Neuve, leur soi-disant « terre légitime », ou subir des conséquences diplomatiques. La décision nous appartient désormais face à cet ultimatum."
 quebec_commie.1.a:0 "Nous n’avons pas d’autre choix que d’accepter."
 quebec_commie.1.b:0 "Qu’ils aillent au diable ! Nous ne leur donnerons pas un pouce !"

 quebec_commie.12.t:0 "L’annexion de Terre-Neuve !"
 quebec_commie.12.d:0 "La paix l’emporte encore ! Après l’ultimatum et alors que la population de [QBC.GetNameDef] retenait son souffle, [ROOT.GetNameDef] nous a rassurés en nous restituant notre territoire !"
 quebec_commie.12.a:0 "Ah ! Victoire !"

 quebec_commie.13.t:0 "[ROOT.GetNameDef] refuse !"
 quebec_commie.13.d:0 "Malgré notre ultimatum clair et notre mobilisation, nos exigences sont restées lettre morte ! Le gouvernement est désormais divisé entre la guerre et la paix : certains affirment qu’il faut reprendre l’argile québécoise légitime, d’autres prétendent qu’une guerre serait désastreuse !"
 quebec_commie.13.a:0 "Nous les avions prévenus."
 quebec_commie.13.b:0 "Ne déclenchons pas une guerre pour Terre-Neuve…"

 quebec_commie.2.t:0 "[QBC.GetNameDef] revendique le Nouveau-Brunswick !"
 quebec_commie.2.d:0 "Le [QBC.GetLeader] de [QBC.GetNameDef] a monté la nation contre nous, affirmant que nous possédons et subjuguons des « travailleurs légitimement québécois » et que « seuls eux peuvent leur offrir la véritable liberté »."
 quebec_commie.2.a:0 "Nous n’avons pas d’autre choix que d’accepter."
 quebec_commie.2.b:0 "Qu’ils aillent au diable ! Nous ne leur donnerons pas un pouce !"

 quebec_commie.22.t:0 "L’annexion du Nouveau-Brunswick !"
 quebec_commie.22.d:0 "La guerre a été évitée ! [ROOT.GetNameDef] nous a rendu notre territoire et les autorités procèdent déjà à la collectivisation de l’État pour s’adapter à nos politiques économiques !"
 quebec_commie.22.a:0 "Travailleurs du Québec, unissez-vous !"

 quebec_commie.23.t:0 "[ROOT.GetNameDef] refuse !"
 quebec_commie.23.d:0 ""
 quebec_commie.23.a:0 "À la guerre !"
 quebec_commie.23.b:0 "Nous reviendrons plus tard…"

 quebec_commie.24.t:0 "La question de la direction du [QBC.GetCommunistParty]"
 quebec_commie.24.d:0 "Le peuple de [ROOT.GetName] a choisi sa voie. Il a choisi la liberté intérieure vis-à-vis de [CAN.GetNameDef], et il a aussi choisi de briser ses chaînes. Après avoir choisi l’indépendance extérieure, la question de la liberté politique s’est posée. Beaucoup dans la nation estiment que [ROOT.GetCommunistLeader] ne représente pas la volonté du peuple et demandent donc un changement de direction."
 quebec_commie.24.a:0 "Nous pouvons faire confiance à Fred Rose et à son expertise politique."
 quebec_commie.24.b:0 "La révolution communiste doit aussi être féministe, nous avons besoin de Léa Roback !"
 quebec_commie.24.c:0 "La popularité grandissante d’Henri Gagnon est ce qu’il nous faut !"

 quebec_fascism.1.t:0 "[QBC.GetNameDef] revendique le Nouveau-Brunswick !"
 quebec_fascism.1.d:0 "Le nouveau régime de [QBC.GetNameDef] tourne aujourd’hui son regard vers l’expansion, et beaucoup au sein de notre cabinet craignent le pire ! Certains politiciens à l’Ouest affirment que leur donner ce qu’ils réclament nous évitera les horreurs de la guerre, qui ne vaut pas la peine d’être menée pour le Nouveau-Brunswick."
 quebec_fascism.1.a:0 "Nous n’avons pas d’autre choix que d’accepter."
 quebec_fascism.1.b:0 "Qu’ils aillent au diable ! Nous ne leur donnerons pas un pouce !"

 quebec_fascism.12.t:0 "[ROOT.GetNameDef] cède le Nouveau-Brunswick !"
 quebec_fascism.12.d:0 "[CAN.GetNameDef] a fait preuve de raison et a abandonné le Nouveau-Brunswick sans combat. [ROOT.GetLeader] l’a annoncé à une foule en liesse ce matin : une grande victoire pour notre gouvernement !"
 quebec_fascism.12.a:0 "Leur faiblesse fait notre force !"

 quebec_fascism.13.t:0 "[ROOT.GetNameDef] refuse !"
 quebec_fascism.13.d:0 "[CAN.GetNameDef] a rejeté nos exigences de transfert immédiat du Nouveau-Brunswick, déclenchant une vague d’indignation parmi notre peuple. Les va-t-en-guerre de notre gouvernement exigent une réponse militaire immédiate. Les esprits plus calmes, eux, suggèrent que [CAN.GetNameDef] ne refuserait que s’ils étaient confiants dans leur capacité à riposter…"
 quebec_fascism.13.a:0 "À la guerre !"
 quebec_fascism.13.b:0 "Nous reviendrons plus tard…"

 quebec_fascism.2.t:0 "La partition du Canada"
 quebec_fascism.2.d:0 "Notre victoire sur [CAN.GetNameDef] est achevée et nous contrôlons tout leur territoire. Toutefois, tout cela n’était pas à l’origine nos terres. Nos ministres ont élaboré une série de plans pour résoudre la « question canadienne »."
 quebec_fascism.2.a:0 "Dissoudre la Confédération !"
 quebec_fascism.2.b:0 "Établir un Canada loyal."
 quebec_fascism.2.c:0 "Seul le contrôle direct suffira."

 quebec_fascism.3.t:0 "Le sort de l’Amérique"
 quebec_fascism.3.d:0 "Après leur terrible défaite, la question de [USA.GetNameDef] n’est pas encore réglée. C’est à nous de décider du sort de [USA.GetOldNameDef]."
 quebec_fascism.3.a:0 "La séparer en de plus petits sujets loyaux."
 quebec_fascism.3.b:0 "Ramener la Louisiane française."
 quebec_fascism.3.c:0 "Tout annexer ! Tout est à nous !"

 quebec_fascism.4.t:0 "La proposition de [BCO.GetNameDef]."
 quebec_fascism.4.d:0 "Alors que nous avons pris le contrôle de l’Amérique et l’avons partitionnée, les gouvernements [BCO.GetAdjectiveCap] et [ACN.GetAdjectiveCap] nous ont demandé des territoires qui leur « appartiendraient »."
 quebec_fascism.4.a:0 "Je ne vois aucun inconvénient !"
 quebec_fascism.4.b:0 "Non."

