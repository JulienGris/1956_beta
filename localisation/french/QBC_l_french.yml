 QBC_find_an_alliance_category_desc:0 "Tandis que le monde est en tumulte, certains restent fidèles aux vraies valeurs de la démocratie. Nous devrions les contacter et forger une alliance afin de défendre ensemble la liberté et former un front uni contre le fascisme."
