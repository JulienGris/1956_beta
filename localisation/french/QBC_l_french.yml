 QBC_cote_nord_expansion_desc:0 ""

 # semi-générique Québec
 QBC_army_effort:0 "Réorganiser les régiments québécois"
 QBC_army_effort_desc:0 "Malgré l’essor de l’aviation et de la guerre navale, le combat terrestre reste crucial dans les guerres de demain. Avec une bonne préparation, nous éviterons de revivre l’enfer des tranchées."
 QBC_equipment_effort:0 "Moderniser l’équipement"
 QBC_equipment_effort_desc:0 "Les limites de ce que l’infanterie peut emporter reculent sans cesse. Donnons à nos troupes les meilleurs outils disponibles."
 QBC_motorization_effort:0 "Soutien motorisé"
 QBC_motorization_effort_desc:0 "La mobilité et la protection sont essentielles pour acheminer l’infanterie au front et la retraiter en sécurité. Se concentrer sur ces développements nous permettra d’agir rapidement."
 QBC_doctrine_effort:0 "Concevoir de nouvelles tactiques"
 QBC_doctrine_effort_desc:0 "Les doctrines qui ont défini la Grande Guerre sont dépassées. Mettons nos plus grands esprits à l’œuvre pour façonner la pensée militaire de demain."
 QBC_equipment_effort_2:0 "Poursuivre la réforme de l’équipement"
 QBC_equipment_effort_2_desc:0 "Poursuivons nos efforts pour que l’infanterie et les troupes de soutien disposent du meilleur matériel de notre époque."
 QBC_mechanization_effort:0 "Une infanterie mécanisée"
 QBC_mechanization_effort_desc:0 "En repensant les possibilités de l’infanterie motorisée, nous pouvons repousser les limites des véhicules actuels."
 QBC_doctrine_effort_2:0 "Grands exercices"
 QBC_doctrine_effort_2_desc:0 "Le champ de bataille a changé depuis l’entre-deux-guerres et au fil des conflits récents. Réévaluons sans cesse nos doctrines."
 QBC_equipment_effort_3:0 "Parachever la modernisation militaire"
 QBC_equipment_effort_3_desc:0 "Plutôt que d’imiter ou d’acheter à l’étranger, devenons un leader mondial de l’armement d’infanterie."
 QBC_armor_effort:0 "Concevoir des véhicules blindés"
 QBC_armor_effort_desc:0 "En appliquant ce que nous avons appris avec l’infanterie mécanisée, nous pouvons aussi améliorer nos blindés."
 QBC_special_forces:0 "Forces spéciales"
 QBC_special_forces_desc:0 "Nous avons besoin d’unités d’élite : troupes de montagne et parachutistes doivent être prioritaires."
 QBC_aviation_effort:0 "Fonder l’École aérienne du Québec"
 QBC_aviation_effort_tt:0 "Pas assez d’emplacements pour §YBase aérienne§!"
 QBC_aviation_effort_desc:0 "Nulle part les avancées technologiques ne sont plus rapides que dans la guerre aérienne. Toute nation moderne doit maîtriser l’aviation."
 QBC_fighter_development:0 "Escadrille Alouette"
 QBC_fighter_development_desc:0 "Nous n’en avons pas fini avec les duels aériens. Rester en tête dans le développement des chasseurs nous donnera l’avantage."
 QBC_bomber_focus:0 "Priorité aux bombardiers"
 QBC_bomber_focus_desc:0 "Quand on parlera des horreurs de nos guerres, la pluie de feu venue du ciel sera au premier plan. Faisons en sorte que ce soit nos ennemis qui en témoignent."
 QBC_aviation_effort_2:0 "Étudier les tactiques étrangères"
 QBC_aviation_effort_2_desc:0 "D’autres avancées seront nécessaires pour bien intégrer notre aviation avec les autres armes."
 QBC_CAS_effort:0 "Bombardiers en piqué"
 QBC_CAS_effort_desc:0 "Une armée moderne a besoin d’appuis au sol et dans les airs."
 QBC_rocket_effort:0 "Moteurs fusées"
 QBC_rocket_effort_desc:0 "Les moteurs fusées et à réaction offrent des vitesses inédites aux appareils pilotés ou non. En les pionniant, nous surprendrons l’ennemi."
 QBC_NAV_effort:0 "Bombardiers navals"
 QBC_NAV_effort_desc:0 "La nouvelle guerre navale se joue sous la surface… et aussi dans les airs au-dessus de l’eau."
 QBC_naval_effort:0 "Financer la construction navale"
 QBC_naval_effort_tt:0 "Pas assez d’emplacements pour §YChantiers navals§!"
 QBC_naval_effort_desc:0 "L’expansion de notre marine doit être prioritaire. Affectons toutes les ressources disponibles à de nouveaux chantiers et à la recherche sur les bâtiments légers."
 QBC_flexible_navy:0 "Marine flexible"
 QBC_flexible_navy_desc:0 "Réinventer la guerre navale en tenant compte des progrès des sous-marins nous permettra de frapper efficacement les convois ennemis."
 QBC_large_navy:0 "Grande marine"
 QBC_large_navy_desc:0 "Adapter nos doctrines aux grands bâtiments et sécuriser nos convois nous enseignera quels navires nous sont nécessaires."
 QBC_submarine_effort:0 "Guerre sous-marine"
 QBC_submarine_effort_desc:0 "La guerre sous-marine est le développement le plus passionnant depuis l’invention des vedettes lance-torpilles. Protégeons-nous des sous-marins… et utilisons-les contre le commerce ennemi."
 QBC_cruiser_effort:0 "Concevoir des croiseurs"
 QBC_cruiser_effort_desc:0 "Avant d’aller plus loin dans les cuirassés, il faut remplacer nos croiseurs."
 QBC_destroyer_effort:0 "Concevoir des destroyers"
 QBC_destroyer_effort_desc:0 "En étudiant les sous-marins et leur emploi, nous avons aussi appris à les contrer. Les destroyers seront essentiels."
 QBC_capital_ships_effort:0 "Intérêt pour les grands bâtiments"
 QBC_capital_ships_effort_desc:0 "La nation qui a le plus de cuirassés dominera les océans. Cuirassés et porte-avions incarnent l’ancien et le nouveau de la suprématie navale."
 QBC_industrial_effort:0 "Effort industriel"
 QBC_industrial_effort_desc:0 "Concentrons nos efforts politiques sur l’industrie civile pour un grand bond en avant."
 QBC_industrial_effort_2:0 "Effort industriel II"
 QBC_industrial_effort_2_desc:0 "Avec une volonté de fer et un labeur acharné, mobilisons le peuple pour un nouvel effort industriel."
 QBC_construction_effort_tt:0 "Pas assez d’emplacements pour §YUsines civiles§!"
 QBC_construction_effort:0 "Développer les industries de Montréal"
 QBC_construction_effort_desc:0 "."
 QBC_production_effort:0 "Construire des ateliers militaires"
 QBC_production_effort_tt:0 "Pas assez d’emplacements pour §YUsine militaire§!"
 QBC_production_effort_desc:0 "Qui peut construire des tracteurs peut construire des chars ! Ne laissons pas notre capacité militaire prendre du retard."
 QBC_construction_effort_2:0 "Rénovation des ports"
 QBC_construction_effort_2_desc:0 "Poursuivre l’agrandissement de nos usines accélérera la production de biens pour le commerce et la construction."
 QBC_production_effort_2:0 "Soutenir l’industrie des véhicules lourds"
 QBC_production_effort_3:0 "Industries militaires intégrées"
 QBC_production_effort_2_desc:0 "Le Québec est idéal pour développer une industrie tournée vers l’exportation."
 QBC_production_effort_3_desc:0 "Il faut continuer d’étendre nos usines militaires pour répondre à la demande en armements."
 QBC_infrastructure_effort:0 "Rénover les chemins de fer"
 QBC_infrastructure_effort_desc:0 "Sans infrastructures adaptées, impossible de mener des projets avancés."
 QBC_infrastructure_effort_tt:0 "Pas assez d’emplacements pour §YInfrastructure§!"
 QBC_synth_oil_effort_tt:0 "Pas assez d’emplacements pour §YRaffinerie synthétique§!"
 QBC_infrastructure_effort_2:0 "Rénover les routes"
 QBC_infrastructure_effort_2_desc:0 "Étendre notre réseau permettra les transports et communications nécessaires aux projets de haute technologie."
 QBC_construction_effort_3:0 "Exploitation forestière du Nord"
 QBC_construction_effort_3_desc:0 "L’expansion du réseau a largement accru nos capacités de construction."
 QBC_nuclear_effort:0 "Projet Moncalm"
 QBC_nuclear_effort_desc:0 "À l’aube d’une découverte qui changera le monde, ne laissons pas d’autres allumer le feu qui pourrait un jour consumer la Terre."
 QBC_extra_tech_slot:0 "Subventions à la recherche"
 QBC_extra_tech_slot_desc:0 "Notre expansion industrielle et nos progrès récents permettent de mener plus de R&D en parallèle."
 QBC_extra_tech_slot_2:0 "Comité de coordination de l’innovation"
 QBC_extra_tech_slot_2_desc:0 "La rapide industrialisation du pays ouvre de nouvelles opportunités de recherche à saisir."
 QBC_technology_sharing:0 "Partage technologique"
 QBC_technology_sharing_desc:0 "En partageant nos avancées avec nos alliés, toute la faction gagnera en efficacité en R&D."
 QBC_secret_weapons:0 "Armes secrètes"
 QBC_secret_weapons_desc:0 "Il est tentant d’investir tous les surplus dans chars et avions, mais la clé est dans de nouveaux domaines : électronique, fusées et nucléaire."
 QBC_collectivist_ethos:0 "Renforcer les syndicats"
 QBC_collectivist_ethos_desc:0 "Nos ennemis divisent pour mieux régner. Notre peuple restera uni : un pour tous, tous pour un."
 QBC_liberty_ethos:0 "Consensus démocratique"
 QBC_liberty_ethos_desc:0 "Nous protégerons les libertés individuelles à l’heure où des fanatiques veulent étouffer l’esprit humain."
 QBC_militarism:0 "Pour le Québec !"
 QBC_militarism_desc:0 "Considérer l’armée comme un mal nécessaire mène à l’hésitation face à la guerre. Inculquons le militarisme pour devenir un peuple de soldats."
 QBC_political_correctness:0 "Correction politique"
 QBC_political_correctness_desc:0 "Certains, aux opinions à peine controversées, voient partout un complot. Excellente idée : organisons-le."
 QBC_neutrality_focus:0 "Priorité à la neutralité"
 QBC_neutrality_focus_desc:0 "On dit qu’il faut bravoure et sagesse pour prendre parti. Il en faut plus encore pour refuser."
 QBC_interventionism_focus:0 "Priorité à l’interventionnisme"
 QBC_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples. Si prévenir la tyrannie exige la guerre, qu’il en soit ainsi."
 QBC_military_youth:0 "Jeunesse militaire"
 QBC_military_youth_desc:0 "Des organisations pour la discipline et la formation politique de la jeunesse forgeront loyauté et abnégation."
 QBC_deterrence:0 "Dissuasion"
 QBC_deterrence_desc:0 "Isolés, la guerre nous profite rarement. Le meilleur bouclier est celui qu’on n’a jamais à utiliser."
 QBC_volunteer_corps:0 "Corps de volontaires"
 QBC_volunteer_corps_desc:0 "Forcer à mourir pour la liberté serait ironique ; donnons plutôt les moyens à ceux qui veulent aider à l’étranger."
 QBC_paramilitarism:0 "Intégrer les milices"
 QBC_paramilitarism_desc:0 "Les principes militaires s’appliquent aussi hors de l’armée. Développons des unités semi-militarisées pour former davantage de citoyens."
 QBC_indoctrination_focus:0 "Endoctrinement"
 QBC_indoctrination_focus_desc:0 "Notre idéologie étant fondée sur la vérité, elle doit être enseignée comme telle. L’éducation et les médias s’y conformeront."
 QBC_foreign_expeditions:0 "Expéditions étrangères"
 QBC_foreign_expeditions_desc:0 "Nos ennemis interviennent au loin pour leurs idées ; soyons prêts à faire de même pour les nôtres."
 QBC_why_we_fight:0 "Pourquoi nous combattons"
 QBC_why_we_fight_effect:0 "If we don't have the §YNeutral Foreign Policy§! spirit, we can create factions.\n"
 QBC_why_we_fight_desc:0 "Le monde devient dangereux. Montrons à notre peuple les atrocités commises par les assoiffés de pouvoir. Rassemblons-le pour qu’il se tienne prêt à défendre notre liberté."
 QBC_political_commissars:0 "Commissaires politiques"
 QBC_political_commissars_desc:0 "Pour garantir l’application de nos politiques, introduisons des responsables politiques au sein des rangs."
 QBC_internationalism_focus:0 "Priorité à l’internationalisme"
 QBC_internationalism_focus_desc:0 "L’idéologie n’a pas de frontières. Les États se disent souverains ; nos convictions priment sur ces prétentions."
 QBC_nationalism_focus:0 "Parti national du Québec"
 QBC_ultra_nationalism_focus:0 "Mémoire nationale"
 QBC_nationalism_focus_desc:0 "Notre nation est unique et nos réussites politiques n’étaient possibles qu’ici. Nous devons la défendre à tout prix."
 QBC_ideological_fanaticism:0 "Fanatisme idéologique"
 QBC_ideological_fanaticism_desc:0 "Nos valeurs établies valent autant qu’une foi ancienne. Les fidèles doivent être prêts à mourir ; les déviants, à en assumer le prix."
 QBC_conservatism_focus:0 "Influence catholique"
 QBC_conservatism_focus_desc:0 "Influence catholique."
 QBC_welfare_focus:0 "Réformes sociales"
 QBC_political_coalition_focus:0 "Coalition politique"
 QBC_political_coalition_focus_desc:0 "Coalition politique."
 QBC_support_steel_industry:0 "Soutenir l’industrie de l’acier"
 QBC_support_steel_industry_desc:0 "Nos sols regorgent de minerai de fer à exploiter pour accroître notre acier."
 QBC_rearmement_agreement:0 "Accord de réarmement"
 QBC_rearmement_agreement_desc:0 "La tension mondiale grimpe ; améliorons notre organisation militaire et la défense civile."
 QBC_mobilize_the_rivers:0 "Mobiliser les rivières"
 QBC_mobilize_the_rivers_desc:0 "Notre territoire a un immense potentiel hydroélectrique : exploitons-le pour notre industrie croissante."
 QBC_saguenay_aluminum:0 "Aluminium du Saguenay"
 QBC_saguenay_aluminum_desc:0 "Grâce à l’hydroélectricité, Saguenay est devenue un centre majeur de production d’aluminium."
 QBC_military_industrial_cooperation:0 "Coopération militaro-industrielle"
 QBC_military_industrial_cooperation_desc:0 "L’armée ne peut exister sans ingénieurs ni ouvriers pour concevoir des armes modernes."
 QBC_expanded_research_program:0 "Programme de recherche élargi"
 QBC_expanded_research_program_desc:0 "L’extension de nos moyens nous permet désormais de financer encore plus de programmes d’armement."
 QBC_vive_le_quebec_libre:0 "§CVive le Québec libre !§!"
 QBC_vive_le_quebec_libre_desc:0 ""
 QBC_a_standing_army:0 "Une armée permanente"
 QBC_a_standing_army_desc:0 "Bien que la conscription soit impopulaire, certains au haut commandement suggèrent une hausse soudaine et temporaire du budget pour doter notre jeune nation d’une armée pleinement opérationnelle."

 ### NOUVEAUX AXES

 # Politique
 QBC_political_effort:0 "Analyser la scène politique québécoise"
 QBC_political_effort_desc:0 "Notre système politique est loin d’être parfait et reste vulnérable à la corruption. À nous d’extirper les politiciens corrompus !"
