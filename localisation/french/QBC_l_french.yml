 QBC_improve_agrarian_laws:0 "Améliorer les lois agraires"
 QBC_improve_agrarian_laws_desc:0 ""
 QBC_encourage_local_participation:0 "Encourager la participation locale"
 QBC_encourage_local_participation_desc:0 "À la fin de l’ancien régime, la participation des masses à la vie politique était très limitée. Désormais, multiplions les comités locaux afin que les gens de tout le pays prennent part à la vie publique !"
 QBC_councilism:0 "Conseillisme"
 QBC_councilism_desc:0 "Pour rester forts et unis, adaptons nos structures politiques afin de faire de la démocratie une partie intégrante de notre idéologie."
 QBC_enforce_quotas:0 "Imposer des quotas"
 QBC_enforce_quotas_desc:0 "Pour être forts, nous devons être efficaces ! La révolution ne se fera pas toute seule pendant que l’on reste les bras croisés ! Chaque prolétaire doit travailler pour la révolution, et ceux qui refusent verront ce qu’il advient des contre-révolutionnaires !"
 QBC_provide_to_the_people:0 "Pourvoir aux besoins du peuple"
 QBC_provide_to_the_people_desc:0 "La grande révolution québécoise est une réussite, sans aucun doute. Il nous faut désormais utiliser les richesses accumulées pour donner à tous ceux qui vivent sous le drapeau rouge du travail, afin que le socialisme reste véritablement au service du peuple."
 QBC_focus_on_family:0 "Mettre l’accent sur la famille"
 QBC_focus_on_family_desc:0 "Notre État doit être régi par les principes « Travail, Famille, Patrie ». L’un de ces piliers, la famille, doit reprendre une place centrale dans la société québécoise !"
 QBC_contact_blueshirts:0 "Contacter les Chemises bleues"
 QBC_contact_blueshirts_desc:0 ""
 QBC_national_identity_propaganda:0 "Propagande d’identité nationale"
 QBC_national_identity_propaganda_desc:0 "L’esprit québécois est fort et sa culture est riche ! Nous devrions faire davantage pour la diffuser auprès de notre population."
 QBC_first_nationalist_congress:0 "Premier congrès nationaliste"
 QBC_first_nationalist_congress_desc:0 "Notre mouvement a pris le pouvoir et resserre son emprise sur la société québécoise, mais il reste divisé. Deux grandes factions émergent : les partisans du fascisme orthodoxe de Paul Bouchard et l’obsession de Lionel Groulx pour le catholicisme. En établissant un congrès, nous laisserons le peuple choisir son futur chef !"
 QBC_abandon_ultramontanism:0 "Abandonner l’ultramontanisme"
 QBC_abandon_ultramontanism_desc:0 "Lionel Groulx et ses partisans ne mesurent pas le danger qu’un État théocratique ultra-religieux ferait peser sur notre pouvoir ! Heureusement, maintenant que nous gouvernons, nous pouvons annuler les dégâts que la théocratie aurait causés."
 QBC_glorify_clerical_past:0 "Glorifier le passé clérical"
 QBC_glorify_clerical_past_desc:0 "Le Québec, et par extension la Nouvelle-France, ont traversé de rudes épreuves ! À présent que les fidèles de Dieu sont au pouvoir, prouvons au monde que nous sommes un peuple choisi par Dieu !"
 QBC_disband_parlimentarism:0 "Abolir le parlementarisme"
 QBC_disband_parlimentarism_desc:0 "Qu’a fait la « démocratie » sinon nous affaiblir, nous diviser et nous asservir ? Débarrassons-nous-en, maintenant que nous avons neutralisé nos opposants !"
 QBC_promote_interventionism:0 "Promouvoir l’interventionnisme économique"
 QBC_promote_interventionism_desc:0 "Laisser les gens faire ce qu’ils veulent, surtout en matière d’économie d’État, serait aussi insensé que de leur donner une arme chargée ! Assurons-nous que l’État, et lui seul, contrôle l’économie."
 QBC_patriotic_education:0 "Éducation patriotique"
 QBC_patriotic_education_desc:0 "La première étape pour transmettre l’amour de la nation passe par l’école ! Modifions les programmes afin qu’ils reflètent notre vision — même si nous devons… « ajuster » la façon dont l’histoire a été écrite."
 QBC_deal_with_opposition:0 "Traiter l’opposition"
 QBC_deal_with_opposition_desc:0 "Beaucoup s’opposent encore à notre régime, notamment les communistes et les partisans de la démocratie. Cette triste réalité nous impose un choix : il faut écarter certains éléments — §Rmais combien de personnes devons-nous écarter ?§!"
 QBC_integrate_new_england:0 "Intégrer la Nouvelle-Angleterre"
 QBC_integrate_new_england_desc:0 ""
 QBC_secret_police:0 "Créer des services secrets"
 QBC_secret_police_desc:0 "Pouvons-nous vraiment faire confiance au prolétariat québécois pour ne pas céder à des idéologies néfastes ? Renforçons la surveillance d’État afin d’arrêter les dissidents !"
 QBC_a_bright_future_ahead:0 "Un avenir radieux nous attend"
 QBC_a_bright_future_ahead_desc:0 "Nous avons gagné, le socialisme a triomphé et l’idée d’une nation québécoise libre aussi ! Maintenant que notre peuple vit dans l’unité et le socialisme, regardons au-delà de nos frontières."
 QBC_toward_utopian_socialism:0 "Vers le socialisme utopique"
 QBC_toward_utopian_socialism_desc:0 ""
 QBC_quebecois_peoples_republic:0 "Théorie stalinienne québécoise"
 QBC_quebecois_peoples_republic_desc:0 ""
 QBC_bust_down_the_unions:0 "Briser les syndicats"
 QBC_bust_down_the_unions_desc:0 "Qu’ont fait les syndicats pour nous ? Ils n’ont fait que diffuser les idéaux communistes nauséabonds et permettre à des travailleurs capricieux de dicter leur loi à leurs patrons, pourtant durs à la tâche !"
 QBC_carry_on_the_work:0 "Poursuivre la ligne"
 QBC_carry_on_the_work_desc:0 "Notre parti a fait des merveilles pour améliorer le Québec ! Il serait insensé de tout gâcher pour des illusions."
 QBC_liberals_legacy_saved:0 "Héritage du Parti libéral sauvé"
 QBC_liberals_legacy_saved_desc:0 "Nous l’avons fait ! Nous avons sauvé le parti ! Le peuple québécois nous a renouvelé sa confiance pour un mandat supplémentaire et nous avons donné le meilleur de nous-mêmes !"
 QBC_universal_suffrage:0 "Suffrage universel"
 QBC_universal_suffrage_desc:0 "Il manque une dernière réforme électorale pour que tout adulte québécois puisse voter : le suffrage universel ! Avec notre majorité au parlement, rien ne peut l’empêcher !"
 QBC_safeguard_the_rights_to_unionize:0 "Garantir le droit de se syndiquer"
 QBC_safeguard_the_rights_to_unionize_desc:0 "Le travail fait partie intégrante de la vie ; rendons-le un peu plus supportable."
