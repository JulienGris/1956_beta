 QBC_all_power_to_the_leader_desc:0 ""
 QBC_political_nationalism:0 "Propagande nationaliste"
 QBC_political_nationalism_desc:0 ""
 QBC_collectivism:0 "Rassembler les travailleurs"
 QBC_collectivism_desc:0 ""
 QBC_exploit_hydroelectricity:0 "Exploiter l’hydroélectricité"
 QBC_exploit_hydroelectricity_desc:0 ""
 QBC_enforce_local_ressource_exploitation:0 "Imposer l’exploitation des ressources locales"
 QBC_enforce_local_ressource_exploitation_desc:0 ""
 QBC_remove_the_aristocracy:0 "Écarter les aristocrates"
 QBC_remove_the_aristocracy_desc:0 "Les vestiges de l’ancien ordre siègent toujours. Certes, leur pouvoir d’antan a décliné, mais leur influence demeure dangereuse et, si on les laisse faire, ils feront tout pour renverser la révolution ! Ce que nous projetons de faire §Rpourra sembler extrême§!, mais c’est nécessaire pour le §Gbien commun§!."
 QBC_the_quebec_red_army:0 "L’Armée rouge québécoise"
 QBC_the_quebec_red_army_desc:0 "La révolution a triomphé, mais elle a encore besoin d’une armée forte pour se maintenir. Malgré les idées de certains camarades égarés, l’armée doit être liée à l’État ! Une grande Armée rouge mènera le peuple québécois à la victoire !"
 QBC_communial_defense:0 "Stratégies de défense communale"
 QBC_communial_defense_desc:0 "Le prolétariat, victorieux de ses anciens oppresseurs en brisant ses chaînes, ne doit pas s’en forger de nouvelles. N’oublions jamais nos racines démocratiques, qui doivent aussi s’appliquer à nos forces armées ! Une armée par le peuple et pour le peuple, sans desseins tyranniques !"
 QBC_revolutionary_patriotism:0 "Patriotisme révolutionnaire"
 QBC_revolutionary_patriotism_desc:0 "Parmi nous se tiennent des personnes d’horizons divers, mais deux choses nous unissent : nous sommes Québécois, et avant tout, nous sommes des prolétaires, des travailleurs qui libéreront le monde des chaînes de l’impérialisme et du capitalisme décadent !"
 QBC_seize_the_royal_assets:0 "Saisir les biens royaux"
 QBC_seize_the_royal_assets_desc:0 "Les prétendues propriétés de la Couronne, ces actifs qu’elle serre jalousement, doivent être retirés à ceux qui, tout au long de notre histoire, ont tenté de nous écraser ! Leurs richesses serviront désormais le peuple québécois plutôt que les « droits divins » des impérialistes !"
 QBC_collectivize_the_means_of_production:0 "Collectiviser les moyens de production"
 QBC_collectivize_the_means_of_production_desc:0 "Selon Marx, la révolution conduit à une société sans classes. Pour y parvenir réellement, les moyens de production doivent appartenir à tous : ainsi, tous les travailleurs du Québec partageront la même condition."
 QBC_redistribute_the_church_wealth:0 "Redistribuer les richesses de l’Église"
 QBC_redistribute_the_church_wealth_desc:0 "L’Église catholique amasse bien trop de richesses ! La religion ne doit pas prendre des proportions sectaires, et tout cet argent gaspillé pourrait être réinvesti dans le peuple !"
 QBC_educate_the_masses:0 "Éduquer les masses"
 QBC_educate_the_masses_desc:0 ""
