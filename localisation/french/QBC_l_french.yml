 QBC_consolidate_le_chefs_rule:0 "Consolider la règle de « Le Chef »"
 QBC_consolidate_le_chefs_rule_desc:0 "Après l’arrêt du processus électoral, nous devons rallier la nation autour de Duplessis !"
 QBC_spy_the_opposition:0 "Espionner l’opposition"
 QBC_spy_the_opposition_desc:0 ""
 QBC_encourage_traditionalist_economics:0 "Imposer des idéaux économiques traditionalistes"
 QBC_encourage_traditionalist_economics_desc:0 "À travers toute l’histoire, la décadence de la révolution industrielle et l’abandon du mode de vie catholique sont les deux raisons qui ont mené au déclin de notre peuple ! Nous devons rétablir une doctrine économique plus traditionnelle afin que chacun vive selon la foi !"
