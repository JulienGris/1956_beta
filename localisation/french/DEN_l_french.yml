denmark.50.t:0 "Victoire communiste lors de [den_political_violence_localisation]"
denmark.50.d:0 "À travers les combats sanglants lors de [den_political_violence_localisation], les communistes, dirigés par le [DEN.GetCommunistParty], ont tenu bon et, ce faisant, ont orienté l’opinion publique en leur faveur."
denmark.50.a:0 "Un bain de sang."

denmark.51.t:0 "Victoire fasciste lors de [den_political_violence_localisation]"
denmark.51.d:0 "À travers les combats sanglants lors de [den_political_violence_localisation], les fascistes, dirigés par le [DEN.GetFascistParty], ont tenu bon et, ce faisant, ont orienté l’opinion publique en leur faveur."
denmark.51.a:0 "Un bain de sang."

denmark.52.t:0 "Situation contenue lors de [den_political_violence_localisation]"
denmark.52.d:0 "Bien que [den_political_violence_localisation] ait dû être un affrontement violent censé démontrer l’incapacité du [DEN.GetRulingParty], il a échoué à le faire, car la police a gardé la situation sous contrôle de manière professionnelle, empêchant les radicaux d’en tirer profit."
denmark.52.a:0 "Contenu, pour l’instant."

denmark.53.t:0 "Victoire antifasciste lors de [den_political_violence_localisation]"
denmark.53.d:0 "À travers les combats sanglants lors de [den_political_violence_localisation], la coalition antifasciste, menée par le DKP et la faction radicale du Socialdemokratiet, a tenu bon et, ce faisant, a orienté l’opinion publique en leur faveur."
denmark.53.a:0 "Un bain de sang."

denmark.54.t:0 "Les tensions montent"
denmark.54.d:0 "La rhétorique récente du [DEN.GetFascistParty] et du [DEN.GetCommunistParty] indique qu’ils préparent un nouvel affrontement. La police doit être en état d’alerte maximale."
denmark.54.a:0 "Encore ça."

