DEN_Mechanization_Efforts:0 "Efforts de mécanisation"
DEN_Mechanization_Efforts_desc:0 ""
DEN_Stage_War_Games:0 "Organiser des jeux de guerre"
DEN_Stage_War_Games_desc:0 ""
DEN_Move_past_the_Krag_Jorgesen:0 "Aller au-delà du Krag-Jørgensen"
DEN_Move_past_the_Krag_Jorgesen_desc:0 ""
DEN_Produce_Domestic_Artillery:0 "Produire de l'artillerie nationale"
DEN_Produce_Domestic_Artillery_desc:0 ""
DEN_Motorization_of_the_Army:0 "Motorisation de l'armée"
DEN_Motorization_of_the_Army_desc:0 ""
DEN_Reassurences_from_Reyklavik:0 "Réassurances de Reykjavik"
DEN_Reassurences_from_Reyklavik_desc:0 "Le roi Christian X n'est pas seulement le roi du Danemark mais aussi de l'Islande, qui est devenue de plus en plus républicaine ces dernières années et pourrait ne pas accepter la règle absolue de Christian sur [DEN.GetNameDef]."
DEN_Dissolve_the_Folketing:0 "Dissoudre le Folketing"
DEN_Dissolve_the_Folketing_desc:0 "Depuis sa création au XIXe siècle, le Folketing est devenu une compétition visant à proposer les politiques populistes les plus extravagantes uniquement pour obtenir davantage de soutien électoral. Le roi dissoudra notre parlement et restaurera [DEN.GetNameDef] dans toute sa gloire."
DEN_Crackdown_on_Extremism:0 "Réprimer l'extrémisme"
DEN_Crackdown_on_Extremism_desc:0 "Les idéologies néfastes qui ont forcé Christian à dissoudre le gouvernement ont trouvé un large soutien parmi les Danois, et c'est le devoir sacré du roi de réprimer les dirigeants de ce mouvement et de restaurer une culture politique danoise partagée."
DEN_Consolidate_Iceland:0 "Consolider l'Islande"
DEN_Consolidate_Iceland_desc:0 "Avec l'Islande se soumettant à juste titre à Sa Majesté, nous réorganiserons le Royaume d'Islande en une circonscription de [DEN.GetNameDef]."
DEN_Crush_the_Rebellion:0 "Écraser la rébellion"
DEN_Crush_the_Rebellion_desc:0 "Avec le choix insensé du gouvernement islandais d'abandonner l'union personnelle avec [DEN.GetNameDef], il semble qu'il n'y ait pas d'autre option que l'invasion."
DEN_Proclaim_the_Danish_Empire:0 "Attention à Oslo"
DEN_Proclaim_the_Danish_Empire_desc:0 "Le roi Haakon VII, roi de Norvège et frère du roi Christian X, pourrait bien être inspiré par la règle absolue exercée depuis Copenhague et vouloir la même chose."
DEN_Form_a_Cabinet:0 "Former un cabinet"
DEN_Form_a_Cabinet_desc:0 "Maintenant que nous avons réglé nos préoccupations politiques immédiates, nous pouvons nous concentrer sur la stabilisation de [DEN.GetNameDef]. Notre premier pas sera d'établir un gouvernement et d'inviter toute figure politique volontaire."
DEN_Approach_the_British:0 "Se rapprocher des [ENG.GetAdjective]"
DEN_Approach_the_British_desc:0 "Les [ENG.GetAdjective] ont pris en charge la sauvegarde de l'Europe, et [DEN.GetNameDef] devrait poursuivre des relations plus étroites."
DEN_The_Stockholm_Communique:0 "Le communiqué de Stockholm"
DEN_The_Stockholm_Communique_desc:0 "Nos alliés les plus proches sont les royaumes de Scandinavie, que nous allons approcher."
DEN_North_Sea_Trade_Agreement:0 "Accord commercial de la mer du Nord"
DEN_North_Sea_Trade_Agreement_desc:0 "Notre production agricole excédentaire a rencontré des difficultés croissantes pour trouver des débouchés et la déréglementation du commerce entre les nations partageant la mer du Nord, le Danemark, la Norvège et le Royaume-Uni, pourrait offrir ces marchés tant recherchés."
DEN_Nordic_Customs_Union:0 "Union douanière nordique"
DEN_Nordic_Customs_Union_desc:0 "L'intégration économique entre les nations nordiques — Danemark, Suède, Norvège et Finlande — a toujours été plus importante que dans la plupart des régions géographiques séparées par des entités politiques, mais nous irons plus loin. Nous éliminerons les derniers droits de douane et restrictions sur le commerce entre nos nations sœurs."
DEN_Baltic_Trade:0 "Commerce baltique"
DEN_Baltic_Trade_desc:0 "Nos politiques commerciales envers nos voisins ont été décidées et nous sommes maintenant prêts à élargir davantage notre implication dans les routes commerciales de la mer Baltique."
DEN_Approach_Germany:0 "Se rapprocher des Allemands"
DEN_Approach_Germany_desc:0 "[GER.GetNameDefCap] est redevenu une puissance, et il semble nécessaire de poursuivre des relations plus étroites."
DEN_Munch_Ribbentrop_Pakt:0 "Pacte Munch-Ribbentrop"
DEN_Munch_Ribbentrop_Pakt_desc:0 "La réalité à laquelle le Danemark doit faire face est que [GER.GetNameDef] est la principale menace à son existence et que l'option la plus simple, plutôt qu'une militarisation effrénée, pourrait être la collaboration. Les exigences allemandes peuvent être dures, mais valables si elles préservent l'État-nation danois."
DEN_Approach_the_Soviets:0 "Se rapprocher des [SOV.GetAdjective]s"
DEN_Approach_the_Soviets_desc:0 "L'ours à l'est semble attendre patiemment de contrer la montée du fascisme ; nous les approcherons et ferons en sorte qu'ils sympathisent avec notre situation."
DEN_Dano_Soviet_Trade_Agreement:0 "Accord commercial dano-[SOV.GetAdjective]"
DEN_Dano_Soviet_Trade_Agreement_desc:0 "La militarisation impitoyable et continue de [GER.GetNameDef] effraie les politiciens danois et nos compatriotes. Certains voient le seul moyen de contrer cette menace à la frontière dans des liens étroits avec son plus grand adversaire continental, [SOV.GetNameDef]. Des accords commerciaux étendus pourraient inciter à une garantie d'indépendance de la part des [SOV.GetAdjective]."
DEN_Revoke_the_Copenhagen_Convention:0 "Révoquer la convention de Copenhague"
DEN_Revoke_the_Copenhagen_Convention_desc:0 "La convention de Copenhague a tragiquement privé le Danemark de son droit de percevoir des droits de passage sur les navires marchands traversant ses eaux. Nous annulerons ce traité imposé et restaurerons notre souveraineté sur nos mers."
DEN_Unify_the_Socialist_Movement:0 "Unifier le mouvement socialiste"
DEN_Unify_the_Socialist_Movement_desc:0 "Comme dans la plupart des pays, de nombreux mouvements socialistes se disputent l'influence et travaillent les uns contre les autres. Nous unirons tous ceux qui recherchent la justice pour le prolétariat afin d'avoir une véritable chance de l'obtenir."
#DEN_The_First_National_Congress:0 "Le premier congrès national"
#DEN_The_First_National_Congress_desc:0 ""
DEN_Contacts_to_the_KPD:0 "Contacts avec le KPD"
DEN_Contacts_to_the_KPD_desc:0 "Le KPD a été totalement décimé par la prise de la chancellerie du Reich par le NSDAP en 1933. Nous devons néanmoins entrer en contact avec leurs réseaux clandestins pour voir comment [DEN.GetNameDef] peut aider."
DEN_Danish_Folksradrepublik:0 "Établir la Folkerådsrepublik"
DEN_Danish_Folksradrepublik_desc:0 "Il est temps de laisser derrière nous l'ancien drapeau danois et le système politique. Nous allons redessiner notre État selon les principes établis par Lénine. Dissoudre le Folketing et le remplacer par un comité central nommé par le parti sera notre premier pas."
DEN_The_Hammer_and_the_Sickle:0 "Le marteau et la faucille"
DEN_The_Hammer_and_the_Sickle_desc:0 "La guerre des classes est terminée, et le prolétaire en est sorti vainqueur. Mais il ne peut gouverner [DEN.GetNameDef] seul ; la tâche vitale de nourrir notre population revient aux paysans, avec qui nous formerons une alliance de classes et marcherons ensemble vers l'avenir, marteau et faucille en main."
DEN_Break_the_Fasces:0 "Briser les faisceaux"
DEN_Break_the_Fasces_desc:0 "Maintenant que les instruments de l'État sont entre les mains du mouvement communiste, nous les utiliserons pour briser le mouvement fasciste, afin de ramener la paix à [DEN.GetNameDef]."
DEN_Propaganda_Campaigns:0 "Campagnes de propagande"
DEN_Propaganda_Campaigns_desc:0 "Notre parti se concentrera sur la distribution de tracts, l'affichage de posters et la tenue de discours percutants pour mobiliser la population danoise."
DEN_Nationalization_of_Key_Industries:0 "Nationalisation des industries clés"
DEN_Nationalization_of_Key_Industries_desc:0 "Nous saisirons les industries vitales de l'économie de [DEN.GetNameDef] dans nos premières réformes économiques. Cela inclut les usines d'armement, les industries métallurgiques et les compagnies maritimes."
DEN_Introduce_Land_Reform:0 "Introduire une réforme agraire"
DEN_Introduce_Land_Reform_desc:0 "De grands propriétaires terriens et des capitalistes fortunés contrôlent la majorité de l'industrie agricole. Avec la disparition du gouvernement bourgeois, nous démantèlerons progressivement ces domaines privés."
DEN_Soviet_Military_Aid:0 "Aide militaire soviétique"
DEN_Soviet_Military_Aid_desc:0 "L'Armée rouge soviétique est une force redoutée, soutenue par une impressionnante industrie de l'armement. Avec l'aide des [SOV.GetAdjective], nous viserons à atteindre la même capacité pour défendre la révolution de façon permanente !"
DEN_Soviet_Economic_Aid:0 "Aide économique soviétique"
DEN_Soviet_Economic_Aid_desc:0 "L'économie [SOV.GetAdjective] est la deuxième plus grande au monde, et grâce à son immense production, leur aide renforcera considérablement les industries de [DEN.GetNameDef]."
DEN_Encourage_Collective_Bargaining:0 "Encourager la négociation collective"
DEN_Encourage_Collective_Bargaining_desc:0 "En opposition aux grandes entreprises, nous renforcerons encore davantage les syndicats grâce à une législation qui donnera plus de poids aux travailleurs dans les négociations."
DEN_Invite_Select_Communist_Ministers:0 "Inviter des ministres communistes triés sur le volet"
DEN_Invite_Select_Communist_Ministers_desc:0 "Bien que les objectifs des communistes soient inacceptables et irresponsables, inclure certains d'entre eux dans notre gouvernement augmentera notre soutien parmi les classes populaires. Et il faut reconnaître qu'ils comptent quelques talents."
DEN_Align_the_Unions:0 "Aligner les syndicats"
DEN_Align_the_Unions_desc:0 "Bien que les syndicats soutiennent pour la plupart l'agenda de notre gouvernement, de nombreuses industries restent dominées par des courants conservateurs ou réactionnaires. Nous veillerons à ce que le mouvement ouvrier suive une ligne unifiée."
DEN_Encourage_Artisan_Production:0 "Encourager la production artisanale"
DEN_Encourage_Artisan_Production_desc:0 "Au lieu de centraliser de force notre économie autour de quelques structures étatiques, ce qui peut mathématiquement produire le quota le plus élevé, l'artisan qualifié vendant ses produits à un prix juste sera bien moins aliéné de son travail que son équivalent ouvrier en usine."
DEN_Forced_Heavy_Industrialization:0 "Industrialisation lourde forcée"
DEN_Forced_Heavy_Industrialization_desc:0 "Nous concentrerons nos efforts sur la centralisation de notre économie industrielle afin de maximiser l'efficacité de la production de biens essentiels à la prospérité du prolétariat."
DEN_Alliegence_to_Moscow:0 "Allégeance à Moscou"
DEN_Alliegence_to_Moscow_desc:0 "Le berceau de la révolution, la Russie, a établi un précédent incroyable en tant que première révolution marxiste et continue de défendre ses principes. Une alliance entre nos deux nations portera la torche du prolétariat plus loin en Europe."
DEN_Icelandic_path_to_Socialism:0 "La voie islandaise vers le socialisme"
DEN_Icelandic_path_to_Socialism_desc:0 "[ICE.GetNameDefCap] a toujours entretenu des liens étroits avec le Danemark à travers divers traités royaux. Mais cet esprit perdure même après le démantèlement de la monarchie, et nous ferons de notre mieux pour renouer avec la nation islandaise."
DEN_Scandinavian_Plan:0 "Plan scandinave"
DEN_Scandinavian_Plan_desc:0 "Les communistes de Finlande, de Norvège, de Suède et bien sûr du Danemark rêvent d'un État pan-scandinave, à l'image de l'exemple italien ou allemand, mais bien sûr basé sur des principes prolétariens. Hélas, il n'y a pas d'autre issue qu'une guerre pour réaliser ce rêve, mais avec le soutien des prolétaires scandinaves partageant notre vision, cette guerre sera, espérons-le, brève et sans effusion de sang."
DEN_Defy_Russia:0 "Défier la Russie"
DEN_Defy_Russia_desc:0 "Le DKP a toujours été divisé sur la question du développement de la révolution russe. Larsen a toujours soutenu Lénine, Staline et le reste de leur direction, mais le comité central semble favoriser une voie d'indépendance vis-à-vis de [SOV.GetNameDef]."
DEN_Pan_Scandinavianism:0 "Panscandinavisme"
DEN_Pan_Scandinavianism_desc:0 "Redonner vie au rêve d'une nation scandinave unie par l'esprit prolétarien sera l'objectif de tous les canaux officiels en préparation de projets plus concrets à ce sujet."
DEN_International_Volunteers:0 "Volontaires internationaux"
DEN_International_Volunteers_desc:0 "Avec notre éloignement de la Russie, de nombreux socialistes anti-léninistes du monde entier considèrent notre gouvernement comme acceptable et se sont engagés à combattre pour protéger notre révolution indépendante."
DEN_International_Theorists:0 "Théoriciens internationaux"
DEN_International_Theorists_desc:0 "Les communistes du monde entier (même dans la soi-disant « Union des républiques socialistes soviétiques ») sont persécutés et empêchés d'exprimer leurs opinions. Nous leur offrirons un refuge pour développer davantage leurs théories et nous pourrons peut-être les inviter à contribuer à notre révolution."
DEN_Overthrow_the_Faux_Revolution:0 "Mettre fin à la mascarade"
DEN_Overthrow_the_Faux_Revolution_desc:0 "Ce qui est devenu de plus en plus clair après la mort de Lénine — à savoir l'établissement d'un faux État prolétarien à la suite de la révolution russe — est désormais évident pour tous ceux qui sont extérieurs au PCUS. Il sera de notre devoir de renverser ce faux État prolétarien et de montrer au peuple soviétique la véritable liberté socialiste."
#DEN_An_Army_of_Peoples:0 "Une armée des peuples"
#DEN_An_Army_of_Peoples_desc:0 ""
DEN_Collectivization_of_Agriculture:0 "Collectivisation de l'agriculture"
DEN_Collectivization_of_Agriculture_desc:0 "Les grands propriétaires qui exploitent les petits paysans sans terre pratiquent une forme d'exploitation particulièrement cruelle, qui ne saurait être tolérée dans notre société socialiste."
DEN_Invite_Gosplan_Planners:0 "Inviter les experts de Gosplan"
DEN_Invite_Gosplan_Planners_desc:0 "Jusqu'à présent, notre Commission de planification centrale a été construite et gérée de manière indépendante. Inviter certains experts de [SOV.GetNameDef] peut grandement nous aider à maximiser l'efficacité et à apporter une prospérité accrue au Danemark."
DEN_Primacy_of_the_Peasentry:0 "Primauté de la paysannerie"
DEN_Primacy_of_the_Peasentry_desc:0 "Nous avons tenu nos promesses dans l'alliance de classes entre le prolétariat et les paysans. Tous deux représentent une partie vitale de notre société et bénéficient d'une représentation égale dans notre gouvernement."
DEN_Rapid_Urbanisation:0 "Urbanisation rapide"
DEN_Rapid_Urbanisation_desc:0 "La croissance du prolétariat urbain est la condition préalable à un Danemark prospère et doit être encouragée par notre État."
DEN_Study_the_NEP:0 "Étudier la Nouvelle politique économique"
DEN_Study_the_NEP_desc:0 "Bien que la NEP de Lénine n'était pas parfaite et ait laissé certaines critiques sans réponse, elle semble être la meilleure voie pour que notre économie se développe. L'utiliser pleinement, contrairement à l'Union soviétique, pourrait apporter un secteur industriel plus équilibré et mieux rythmé."
DEN_Maintain_Rural_Relations:0 "Maintenir les relations rurales"
DEN_Maintain_Rural_Relations_desc:0 "Bien que le système agricole actuel comporte une pincée d'exploitation, le collectiviser ou le bouleverser complètement ne fera que réduire la production agricole et le bien-être de la classe paysanne. Au contraire, nous coopérerons à contrecœur avec les grands propriétaires pour nourrir la faim du prolétariat urbain."
DEN_Puncture_the_Heart_of_Fascism:0 "Transpercer le cœur du fascisme"
DEN_Puncture_the_Heart_of_Fascism_desc:0 "Le fascisme. À quoi cela peut-il bien servir ?"
DEN_Cut_off_the_Lions_Head:0 "Couper la tête du lion"
DEN_Cut_off_the_Lions_Head_desc:0 "Le plus grand empire depuis on ne sait combien d'années a été l'Empire britannique, régnant des Amériques à l'Afrique, jusqu'à l'Asie. Nous frapperons leur cœur, les îles britanniques, et ferons tomber leur empire avec lui."
DEN_Control_the_Banking_Institutions:0 "Contrôler les institutions bancaires"
DEN_Control_the_Banking_Institutions_desc:0 "Indispensables au développement économique du Danemark, les banques représentent une lourde responsabilité lorsqu'elles sont laissées entre les mains de quelques industries privées. C'est une préoccupation majeure pour notre gouvernement. Nous prendrons des mesures et entamerons le processus de mise sous contrôle étatique des banques du Danemark."
DEN_Abolish_the_Monarchy:0 "Abolir la monarchie"
DEN_Abolish_the_Monarchy_desc:0 "Avec notre nouvelle grande coalition de gauche, nous pouvons enfin laisser derrière nous la carcasse moribonde du monarchisme au XIXe siècle, là où il aurait dû rester. Vive la République."
DEN_Encourage_Foreign_Investment:0 "Encourager les investissements étrangers"
DEN_Encourage_Foreign_Investment_desc:0 "Les réglementations excessives de l'économie sont en grande partie tombées et le Danemark est désormais prêt à recevoir d'importants investissements des marchés de crédit anglo-américains et français."
DEN_Abolish_the_Unions:0 "[DEN_Union_Focus_Localisation] les syndicats"
DEN_Abolish_the_Unions_desc:0 "Les syndicats ont toujours encouragé la paresse et l'improductivité, et il est important de réduire leur statut dans la société."
DEN_Productivity_First:0 "La productivité d'abord"
DEN_Productivity_First_desc:0 "La paresse promue par les syndicats a toujours freiné la croissance industrielle et la prospérité dans toutes les sociétés où les chefs ouvriers ont eu autant de pouvoir qu'ici au Danemark. Nous devons montrer aux travailleurs qui paie leur salaire."
DEN_Crackdown_on_Political_Violence:0 "Défense de la [DEN_Government_Form]"
DEN_Crackdown_on_Political_Violence_desc:0 "Notre actuel [DEN_Government_Form] se trouve en opposition avec les puissances étrangères envahissantes et les partis saboteurs internes, et nous nous assurerons que le DKP ou le DNSAP ne puissent nuire à notre belle [DEN_Government_Form]."
DEN_Safehaven_for_the_Scientists:0 "Havre pour les scientifiques"
DEN_Safehaven_for_the_Scientists_desc:0 "La marée montante du fascisme et du stalinisme a laissé les intellectuels européens sans refuge. Nous les accueillerons volontiers dans nos écoles, universités et instituts de recherche."
DEN_Tactical_Nationalizations:0 "Nationalisations tactiques"
DEN_Tactical_Nationalizations_desc:0 "Notre coalition récemment élargie de socialistes a, bien sûr, exigé certaines politiques extravagantes. Mais plus important encore, leur poids politique nous permet d'adopter des mesures jusque-là impensables. L'une de ces politiques est la nationalisation ciblée des entreprises en faillite ou hors la loi."
DEN_Agrarian_Reform:0 "Réforme agraire"
DEN_Agrarian_Reform_desc:0 "Le secteur agricole a beaucoup souffert de la grande dépression et a un besoin urgent de réformes. Nous réviserons les réglementations dans ce secteur afin de le revigorer."
DEN_Tax_Reform:0 "Réforme fiscale"
DEN_Tax_Reform_desc:0 "Le système fiscal actuel, imposé par les gouvernements sociaux-démocrates du passé, entrave considérablement les affaires et les riches en général. Nous réduirons la progressivité de ces impôts afin de renforcer notre économie."
DEN_Public_Investments:0 "Investissements publics"
DEN_Public_Investments_desc:0 "Des investissements ciblés de l'État renforceront considérablement les secteurs où la rentabilité est généralement faible, ce qui, en retour, renforcera l'ensemble de notre économie."
DEN_Armed_Neutrality:0 "Neutralité armée"
DEN_Armed_Neutrality_desc:0 "Bien que nous déclarions une neutralité unilatérale, nous soutiendrons ces paroles par une militarisation accrue et une population prête à défendre le Danemark."
DEN_Scandinavian_Connections:0 "Connexions scandinaves"
DEN_Scandinavian_Connections_desc:0 "Les liens politiques, sociaux et économiques entre nos nations scandinaves ont toujours été forts, mais en ces temps troublés, une véritable alliance défensive semble nécessaire pour protéger la Scandinavie."
DEN_Look_towards_the_West:0 "Regarder vers l'Ouest"
DEN_Look_towards_the_West_desc:0 "L'alliance anglo-française occidentale s'est donné pour mission de contenir l'agressivité de [GER.GetName], et en participant à leur alliance défensive, nous contribuerons à enfermer les Allemands enragés."
DEN_Unified_Defence_Plan:0 "Plan de défense unifié"
DEN_Unified_Defence_Plan_desc:0 "Nous coordonnerons les états-majors de l'alliance scandinave afin d'élaborer un plan unifié pour la défense de la Scandinavie."
DEN_Establish_the_Nordic_Council:0 "Établir le Conseil nordique"
DEN_Establish_the_Nordic_Council_desc:0 "Pour renforcer l'intégration politique et économique de la Scandinavie, nous établirons un conseil regroupant tous ses pays afin d'encourager des politiques communes et similaires."
DEN_Reaffirm_British_Continental_Commitments:0 "Réaffirmer les engagements continentaux [ENG.GetAdjective]"
DEN_Reaffirm_British_Continental_Commitments_desc:0 "Le gouvernement britannique a parfois semblé concentrer son attention sur ses possessions coloniales en Afrique ou en Asie. Mais nous devons nous assurer qu'il honore ses engagements envers l'Europe."
DEN_Reciprocal_Containment:0 "Partage du fardeau du confinement"
DEN_Reciprocal_Containment_desc:0 "Le confinement de [GER.GetNameDef] a été une tâche principalement assumée par les Français et les Anglais, mais en tant que nouveau membre des Alliés, ce devoir nous incombe désormais également."
DEN_Regional_Economic_Development:0 "Développement économique régional"
DEN_Regional_Economic_Development_desc:0 "Pour consolider notre contrôle sur le nouvel État scandinave unifié, nous détournerons des ressources afin d'investir dans les régions de nos frères."
DEN_Rail_Investments:0 "Investissements ferroviaires"
DEN_Rail_Investments_desc:0 "Les Danske Statsbaner ont souffert d’un sous-financement partiel et d’un désintérêt gouvernemental général. Il est impératif d’inverser cette attitude et de reconnecter notre pays."
DEN_Steel_Investments:0 "Investissements dans l’acier"
DEN_Steel_Investments_desc:0 "Le Danemark est une terre pauvre en ressources, c’est pourquoi nous devons construire notre industrie autour des rares ressources disponibles. Nous rassemblerons les restes de minerai de fer et investirons dans des aciéries capables de les transformer en acier trempé."
DEN_Business_Ties:0 "Liens commerciaux"
DEN_Business_Ties_desc:0 "Le gouvernement doit toujours rester en contact avec le secteur privé, car imposer des réglementations depuis le Folketing isolé entrave souvent considérablement les entreprises qui assurent l’emploi et la croissance économique de notre pays."
DEN_Expand_Maersk_Shipping:0 "Développer Maersk Shipping"
DEN_Expand_Maersk_Shipping_desc:0 "Partie vitale de notre économie nationale, Maersk, dirigée par l’honorable A.P. Møller, ministre de l’Industrie et de la Marine, doit recevoir les fonds et autorisations nécessaires pour développer considérablement ses opérations, afin de renforcer le transport maritime danois. Bien que cette mesure puisse être considérée par certains comme un conflit d’intérêts, elle sert le bien commun."
DEN_Deregulate_Banking:0 "Déréglementer le secteur bancaire"
DEN_Deregulate_Banking_desc:0 "Les réglementations bureaucratiques ont toujours freiné la capacité du secteur bancaire à investir efficacement dans notre société. Notre gouvernement conservateur nouvellement élu inversera ces tendances."
DEN_Shatter_the_Hammer:0 "Briser le marteau"
DEN_Shatter_the_Hammer_desc:0 "La marée du bolchevisme a été arrêtée ici, au Danemark, et tout doit être fait pour écraser davantage le DKP."
DEN_Consolidate_Media_Institutions:0 "Consolider les institutions médiatiques"
DEN_Consolidate_Media_Institutions_desc:0 "Nous arracherons les médias des mains de leurs propriétaires démocrates faibles pour les placer dans celles des propagandistes de notre parti."
DEN_Invite_German_Advisors:0 "Inviter des conseillers allemands"
DEN_Invite_German_Advisors_desc:0 "La tradition militaire [GER.GetAdjective] remonte à l’époque prussienne, bien que la Grande Guerre ait interrompu cette gloire. Toutefois, la Wehrmacht prépare déjà ses tactiques pour la prochaine guerre, ce qui aiderait grandement l’armée danoise."
DEN_Invite_Italian_Advisors:0 "Inviter des conseillers italiens"
DEN_Invite_Italian_Advisors_desc:0 "L’armée royale [ITA.GetAdjective] a beaucoup appris de sa campagne en Éthiopie et semble disposée à partager cette expertise avec notre nouvel État fasciste."
DEN_Secure_the_Military:0 "Sécuriser l’armée"
DEN_Secure_the_Military_desc:0 "La base de notre pouvoir réside dans notre capacité à contrôler l’armée afin d’affirmer la puissance danoise."
DEN_Secure_Iceland:0 "Sécuriser l’Islande"
DEN_Secure_Iceland_desc:0 "L’indépendance temporaire de l’Islande ne nous empêchera pas de la reprendre."
DEN_Research_Efforts:0 "Financement de la recherche militaire"
DEN_Research_Efforts_desc:0 "Avec notre récente expansion du complexe militaro-industriel, l’investissement dans les sciences militaires semble logique."
DEN_Join_the_Axis:0 "Rejoindre l’Axe"
DEN_Join_the_Axis_desc:0 "[GER.GetNameDefcap] au sud est indéniablement puissant, tant militairement qu’économiquement. Ne pas nous allier avec eux serait un énorme gaspillage pour [DEN.GetNameDef]."
DEN_German_Economic_Collaboration:0 "Collaboration économique avec l’Allemagne"
DEN_German_Economic_Collaboration_desc:0 "Le [GER.GetName] riche en charbon et en acier et notre surplus agricole forment une combinaison parfaite. Nous renforcerons notre dépendance vis-à-vis de l’économie [GER.GetNameDef]."
DEN_Invite_the_Wehrwirtschaftsfuhrer:0 "Inviter le Wehrwirtschaftsführer"
DEN_Invite_the_Wehrwirtschaftsfuhrer_desc:0 "Les grands monopoles industriels de [GER.GetNameDef], tels qu’IG Farben, Mercedes et Krupp, seront invités au [DEN.GetNameDef] pour aider à développer notre économie."
DEN_Dano_German_Propaganda:0 "Propagande dano-allemande"
DEN_Dano_German_Propaganda_desc:0 "Les Danois et les [GER.GetAdjective] marcheront ensemble vers un avenir meilleur pour l’Europe."
DEN_Fighter_Cooperation:0 "[DEN_fighter_coop_localisation]"
DEN_Fighter_Cooperation_desc:0 "Le [DEN_air_localisation] manque de qualité, de quantité et d’expertise ; en coopérant avec nos alliés, nous pouvons surmonter l’état actuel de l’aviation."
DEN_Look_Elsewhere:0 "Le Danemark d’abord"
DEN_Look_Elsewhere_desc:0 "La nation danoise ne peut, en aucun cas, être subordonnée à une autre. Le destin du Danemark nous appartient."
DEN_Rapidly_Increase_Arms_Production:0 "Aux armes, Danois !"
DEN_Rapidly_Increase_Arms_Production_desc:0 "Les ouvriers d’usine saisiront leurs marteaux et fabriqueront les armes que les soldats utiliseront pour protéger [DEN.GetNameDef] !"
DEN_Scandinavian_Intervention:0 "Intervention scandinave"
DEN_Scandinavian_Intervention_desc:0 "La Scandinavie ne peut tolérer que des gouvernements totalitaires y règnent ; nous devons nous assurer que les pays scandinaves restent démocratiques !"
DEN_Militarization_of_Society:0 "Militarisation de la société"
DEN_Militarization_of_Society_desc:0 "La société danoise s’est affaiblie à cause du pacifisme des administrations sociales-démocrates des dernières décennies. Nous redonnerons au peuple danois son esprit combatif."
DEN_Expand_Military_Research:0 "Développer la recherche militaire"
DEN_Expand_Military_Research_desc:0 "Avec notre récent effort d’expansion du complexe militaro-industriel, nous investirons aussi dans la recherche militaire."
DEN_Danish_Autarky:0 "Autarcie danoise"
DEN_Danish_Autarky_desc:0 "Bien que [DEN.GetNameDef] soit pauvre en ressources, il est riche en puissance économique et militaire, grâce auxquelles nous garantirons la sécurité de notre chaîne d’approvisionnement."
DEN_Bolster_Danish_Corporations:0 "Renforcer les entreprises danoises"
DEN_Bolster_Danish_Corporations_desc:0 "Nous devons nous assurer que les industriels soutenant notre parti puissent récolter les fruits de notre économie de guerre."
DEN_Exploit_the_Conquered_Lands:0 "Exploiter les terres conquises"
DEN_Exploit_the_Conquered_Lands_desc:0 "Les ennemis des Danois sont tombés les uns après les autres, et désormais leurs terres sont sous notre contrôle. Nous exploiterons leurs ressources et leurs industries."
DEN_Cross_the_Skagerrak:0 "Traverser le Skagerrak"
DEN_Cross_the_Skagerrak_desc:0 "Le lien national entre le Danemark et la Norvège est indéniable, et les deux doivent maintenant être réunis sous un même souverain."
DEN_Return_to_England:0 "Retourner en Angleterre"
DEN_Return_to_England_desc:0 "Après le désastre de Stamford Bridge, les Scandinaves n’ont plus eu leur mot à dire dans les affaires britanniques. Il est temps de préparer une nouvelle invasion de l’Angleterre."
DEN_Reclaim_our_Hibernian_Vassals:0 "Reprendre nos vassaux hiberniens"
DEN_Reclaim_our_Hibernian_Vassals_desc:0 "À la fin de l’âge viking, de nombreuses principautés irlandaises étaient des vassaux des rois danois ; certains considèrent cela comme une justification suffisante pour envahir l’île."
DEN_Reestablish_the_Danelaw_Confederacy:0 "Rétablir la Confédération du Danelaw"
DEN_Reestablish_the_Danelaw_Confederacy_desc:0 "Plutôt qu’une domination directe des îles Britanniques, nous devrions être raisonnables et chercher dans l’histoire des solutions à notre situation actuelle. En remodelant l’Angleterre selon les principes du Danelaw, nous pourrions introduire des coutumes administratives danoises dans les anciennes structures anglo-saxonnes, ce qui serait plus simple que d’imposer notre système danois de force."
DEN_Rebirth_of_the_North_Sea_Empire:0 "Renaissance de l’Empire de la mer du Nord"
DEN_Rebirth_of_the_North_Sea_Empire_desc:0 "Avec l’Angleterre, la Norvège et le Danemark unis sous un même dirigeant, il est temps de raviver l’image de l’ancien empire en proclamant l’Empire de la mer du Nord."
DEN_Never_Again_a_Battle_of_Copenhagen:0 "Plus jamais de bataille de Copenhague"
DEN_Never_Again_a_Battle_of_Copenhagen_desc:0 "La bataille non provoquée de Copenhague a détruit la marine royale danoise et, avec elle, la fierté nationale. Nous devons renforcer notre marine pour être prêts lors de la prochaine attaque injustifiée."
DEN_Fight_for_Denmark:0 "Combattez pour le Danemark"
DEN_Fight_for_Denmark_desc:0 "Le siècle de paix passé a nourri le pacifisme du Danois moyen, mais dans une telle situation instable, ce pacifisme pourrait rayer [DEN.GetNameDef] de la carte."
DEN_Dismantle_the_Unions:0 "Démanteler les syndicats"
DEN_Dismantle_the_Unions_desc:0 "Le seul but des syndicats est d’encourager la paresse des travailleurs. Pour remédier à cette inefficacité, nous abolirons purement et simplement cette institution."
DEN_Reascension_of_the_Aristrocracy:0 "Restauration de l’aristocratie"
DEN_Reascension_of_the_Aristrocracy_desc:0 "L’état actuel de désempowerment de l’aristocratie est une honte qui doit être corrigée."
DEN_Restore_Aristocratic_Land_Rights:0 "Restaurer les droits fonciers aristocratiques"
DEN_Restore_Aristocratic_Land_Rights_desc:0 "Il n’est pas surprenant que le pouvoir de l’aristocratie décline lorsqu’un gouvernement démocratique est aux commandes. Ainsi, sans faute de leur part, les nobles ont été privés de beaucoup. Nous pouvons rétablir leur statut en leur accordant de généreux droits fonciers."
DEN_Retain_the_Welfare_State:0 "Maintenir l’État-providence"
DEN_Retain_the_Welfare_State_desc:0 "Bien que les gouvernements démocratiques du siècle dernier aient souvent mal réformé le Danemark, l’État-providence n’en fait pas partie. Il a considérablement amélioré le niveau de vie du Danois moyen, ce qui nous place au-dessus de la plupart des pays industrialisés. Nous garderons donc ce système pour le bien de [DEN.GetNameDef]."
DEN_Social_Nationalism:0 "Nationalisme social"
DEN_Social_Nationalism_desc:0 "Bien que le parlementarisme danois ait été éteint, certaines de ses contributions les plus réfléchies à la société danoise doivent être conservées. Parmi elles, certains programmes sociaux sélectionnés qui apportent prospérité à tout le Danemark. Supprimer l’un d’eux entraînerait une grande perte de soutien pour la monarchie et doit être évité."
DEN_Reinvigorate_the_Officer_Corp:0 "Revigorer le corps des officiers"
DEN_Reinvigorate_the_Officer_Corp_desc:0 "Un devoir vital de la royauté danoise depuis le Moyen Âge est la défense du Danemark, et pour qu’ils puissent accomplir ce rôle, nous augmenterons leur formation militaire."
DEN_Royal_Industries:0 "Industries royales"
DEN_Royal_Industries_desc:0 "Durant la phase démocratique de notre pays, les bourgeois ont accaparé l’essentiel de l’industrie, du commerce et de nombreux autres secteurs. Avec ce tournant politique, ce sont désormais les aristocrates qui domineront les industries de [DEN.GetNameDef]."
DEN_The_Royal_Academy:0 "L’Académie royale"
DEN_The_Royal_Academy_desc:0 "Avec la position des aristocrates à nouveau sécurisée, ils peuvent se consacrer de nouveau à l’éducation et aux arts."
DEN_Amnesty_for_Political_Prisoners:0 "Amnistie pour les prisonniers politiques"
DEN_Amnesty_for_Political_Prisoners_desc:0 "La plupart des partisans des socialistes et des fascistes ont simplement été fortement trompés par leurs dirigeants politiques, et beaucoup ont déjà purgé leur peine."
DEN_Norwegian_Economic_Developement:0 "Développement économique norvégien"
DEN_Norwegian_Economic_Developement_desc:0 "Nous intégrerons davantage l’économie norvégienne en investissant dans le Royaume."
DEN_Norwegian_War_Infrastructure:0 "Infrastructures de guerre norvégiennes"
DEN_Norwegian_War_Infrastructure_desc:0 "Un conflit entre [DEN.GetNameDef] et [SWE.GetNameDef] semble inévitable, il est donc essentiel de préparer nos fronts pour repousser notre vieux rival."
DEN_Swedish_Economic_Developement:0 "Développement économique suédois"
DEN_Swedish_Economic_Developement_desc:0 "Les Suédois n’ont pas accueilli notre invasion de la Suède avec beaucoup d’enthousiasme. Nous pourrions les convaincre que la domination danoise est plus bénéfique que l’indépendance grâce à un développement économique ciblé."
DEN_Reclaim_our_Baltic_Possessions:0 "Reprendre nos possessions baltiques"
DEN_Reclaim_our_Baltic_Possessions_desc:0 "Le duché d’Estonie a été accordé au Danemark lors des croisades à l’est et a joué un rôle vital dans le commerce baltique. Avec l’essor de [DEN.GetNameDef], nous allons reprendre l’Estonie."
DEN_Reclaim_the_Swedes:0 "Reprendre le royaume de Suède"
DEN_Reclaim_the_Swedes_desc:0 "Depuis la guerre de libération suédoise, la Suède a joué un rôle important dans la politique nord-européenne, mais cela doit à présent prendre fin. Elle sera de nouveau désignée comme une circonscription de [DEN.GetNameDef]."
DEN_Reclaim_the_Finns:0 "Reprendre le duché de Finlande"
DEN_Reclaim_the_Finns_desc:0 "La Finlande a toujours été sans défense si elle n’était pas protégée par une autre puissance. Sans domination extérieure, la Finlande ne peut pas prospérer."
DEN_Focus_Outwards:0 "Retour sur la scène mondiale"
DEN_Focus_Outwards_desc:0 "Le Danemark est resté inactif en politique internationale depuis la paix humiliante de 1814 ; plus de cent ans plus tard, [DEN.GetNameDef] est prêt à revenir sur la scène mondiale."
DEN_Reestablish_French_Ties:0 "Rétablir les liens [FRA.GetAdjective]"
DEN_Reestablish_French_Ties_desc:0 "Nous avons combattu courageusement aux côtés des forces napoléoniennes de France, et comme en 1813, nous rechercherons à nouveau des relations étroites avec les Français."
DEN_Reestablish_Polish_Ties:0 "Rétablir les liens [POL.GetAdjective]"
DEN_Reestablish_Polish_Ties_desc:0 "Les alliances entre les Polonais et les Danois ont été nombreuses et constituaient un contrepoids de poids à toute puissance allemande. Dans notre crise actuelle, face à la montée de [GER.GetName], des liens étroits avec le gouvernement polonais seront utiles."
DEN_Reclaim_Schleswig:0 "Reprendre le Schleswig"
DEN_Reclaim_Schleswig_desc:0 "Après la défaite de l’Empire allemand dans la Grande Guerre, le faible gouvernement démocratique a renoncé à toute revendication perdue lors des guerres du Schleswig. Nous corrigerons de force cette erreur."
DEN_The_Stolen_Kingdom:0 "Frères séparés"
DEN_The_Stolen_Kingdom_desc:0 "La séparation du Skagerrak ne doit pas maintenir le Danemark et la Norvège divisés ! Le Danemark se réunira avec son frère national, et le roi Christian se réunira avec son frère de sang."
DEN_Scandinavian_Cooperation:0 "Coopération scandinave"
DEN_Scandinavian_Cooperation_desc:0 "Les Scandinaves partagent une histoire commune si ancienne qu’elle en est presque incompréhensible. La Scandinavie doit s’unir pour protéger la péninsule d’une invasion étrangère."
DEN_Direct_Involvement:0 "Envoyer des conseillers en Norvège"
DEN_Direct_Involvement_desc:0 "En soutien à Haakon, les [NOR.GetAdjective] recevront les meilleurs conseillers militaires que [DEN.GetNameDef] puisse offrir."
DEN_Legitimize_the_Kingdom_of_Norway:0 "Stabiliser le royaume de Norvège"
DEN_Legitimize_the_Kingdom_of_Norway_desc:0 "L’instabilité politique causée par le coup royal de Haakon VII a quelque peu affaibli [NOR.GetNameDef] ; nous devons nous assurer de guérir ces blessures."
DEN_Coordinate_the_Staffs:0 "Coordonner les états-majors"
DEN_Coordinate_the_Staffs_desc:0 "Les états-majors de notre alliance scandinave doivent établir des lignes de communication directes et une réorganisation majeure pour garantir la coordination en cas de crise."
DEN_Restoration_of_Denmark_Norway:0 "Restauration du Danemark-Norvège"
DEN_Restoration_of_Denmark_Norway_desc:0 "Plus de 100 ans après la dissolution de l’union dano-norvégienne, elle redeviendra une grande puissance sur la scène européenne."
DEN_CIA_Contacts:0 "Contacts avec la CIA"
DEN_CIA_Contacts_desc:0 "Les Américains, nos chers alliés, ont une grande expertise dans les domaines du renseignement et de l’espionnage. Pour renforcer nos propres objectifs de renseignement, nous favoriserons la coopération."
DEN_Continue_the_Fight:0 "Continuer le combat"
DEN_Continue_the_Fight_desc:0 "[DEN.GetNameDef] est vaincu mais pas défait ! Avec le soutien [ENG.GetAdjective], nous continuerons à nous battre pour reprendre notre patrie."
DEN_Sabotage_German_Supply:0 "Saboter l’approvisionnement [?occupation_target.GetAdjective]"
DEN_Sabotage_German_Supply_desc:0 "Bien que notre gouvernement ait été contraint de fuir le Jutland et le Sjælland, de nombreux partisans dédiés à la liberté, à l’indépendance et à [DEN.GetNameDef] sont en sommeil, attendant notre commandement. Nous les utiliserons pour transformer l’approvisionnement des forces d’occupation en cauchemar logistique."
DEN_Target_Danish_Collaborators:0 "Cibler les collaborateurs danois"
DEN_Target_Danish_Collaborators_desc:0 "Bien que la plupart des Danois laissés derrière attendent avec impatience notre retour, certains ont fait carrière en trahissant la nation danoise en collaborant avec les occupants."
DEN_Scuttle_the_Ships:0 "Saborder les navires"
DEN_Scuttle_the_Ships_desc:0 "Une partie de notre marine a malheureusement été laissée dans les ports de Copenhague. Ces navires risquent d’être saisis par les occupants. Nous pouvons nous assurer qu’ils échappent aux mains [GER.GetAdjective] en convainquant l’amiral « collaborationniste » d’échouer volontairement les bâtiments."
DEN_Alliance_with_the_Communists:0 "Alliance avec les communistes"
DEN_Alliance_with_the_Communists_desc:0 "Avant l’invasion de [DEN.GetNameDef], les relations entre les partis démocratiques et le DKP étaient froides, même dans les meilleurs moments. Mais cette expérience commune de l’occupation nous permet de surmonter ces différences. Libérons [DEN.GetNameDef] ensemble !"
DEN_Local_Recruitment:0 "Recrutement local"
DEN_Local_Recruitment_desc:0 "Les quelques îles qu’il nous reste, protégées par la marine [faction_leader.GetAdjective], sont peu peuplées, mais avec les bonnes motivations elles peuvent devenir une nouvelle source de recrues pour le [DEN_army_localisation]."
DEN_BBC_Broadcasts_to_Denmark:0 "Diffusions de la BBC vers le Danemark"
DEN_BBC_Broadcasts_to_Denmark_desc:0 "Même en temps de paix au Danemark, John Christmas Møller était un orateur passionné, mais l’occupation l’a encore enflammé. En collaboration avec la BBC, nous ferons de lui la voix des Danois occupés."
DEN_British_Guns:0 "Armes britanniques"
DEN_British_Guns_desc:0 "Notre résistance continue a inspiré de nombreux politiciens [ENG.GetAdjective] à Londres, et le gouvernement [ENG.GetAdjective] s’est déclaré prêt à fournir des armes d’infanterie à [DEN.GetNameDef]."
DEN_Liberation:0 "Libération"
DEN_Liberation_desc:0 "Beaucoup doutaient que ce jour arrive, mais il est enfin là. C’est le jour de la libération pour les Danois occupés, qui laissent derrière eux les années d’occupation et regardent l’avenir avec optimisme."
likes_denmark:0 "Aime le Danemark"
