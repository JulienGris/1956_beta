# Idées
DEN_Resistance_1:0 "Résistance danoise"
DEN_Resistance_2:0 "Résistance danoise généralisée"
den_ships_seized:0 "Nos navires restants au Danemark sont saisis"
den_ships_seized_desc:0 "Tous les [DEN_navy_localisation] danois n’ont pas pu échapper à l’avancée [GER.GetAdjective] terrifiante. Pour l’instant, les marins danois collaborateurs les tiennent encore. Cependant, nous avons constaté la pression [GER.GetAdjective] toujours croissante pour s’emparer de ces navires. Nous pouvons arracher les navires danois des mains de l’Axe et, en même temps, marquer une immense victoire de propagande si nous agissons rapidement."

# Arbres de priorités
denmark:0 "Arbre de priorités danois"
denmark_focus:0 "Arbre de priorités danois"
free_denmark:0 "Arbre de priorités du Danemark libre"
collab_denmark:0 "Arbre de priorités du Danemark collaborationniste"

DEN_King_Christian_Coup:0 "Le coup d’État du roi Christian"
DEN_King_Christian_Coup_desc:0 "Le mode de vie danois semble en péril alors que les extrémistes détiennent désormais un pouvoir politique significatif, et il semble que le système démocratique soit incapable de gérer cette pression. Pour préserver l’âme de la nation, un coup d’État royal est jugé la meilleure option par sa majesté Christian X lui-même. Rétablir l’autorité de la dynastie de Glücksburg peut s’accompagner de défis majeurs, mais il semble que ce soit la seule voie."

DEN_Changing_Times:0 "Temps de changement"
DEN_Changing_Times_desc:0 "Les récents exemples de changements politiques violents, le renversement de la République de Weimar en Allemagne et la Révolution russe suivie de la guerre civile dans le désormais ascendant [SOV.GetName], ont montré clairement que la politique traditionnelle danoise par le vote et le Folketing pourrait de plus en plus être remplacée par les armes dans les rues."

DEN_Galvanise_the_German_Minority:0 "Mobiliser la minorité allemande"
DEN_Galvanise_the_German_Minority_desc:0 "Depuis le retour du Schleswig du Nord après la Grande Guerre, le Danemark est la patrie de nombreux Allemands, dont la plupart sont sympathisants du Reich allemand. Les utiliser pour la montée du fascisme danois est tout à fait logique."

DEN_Secure_Industrialists_Support:0 "S’assurer du soutien des industriels"
DEN_Secure_Industrialists_Support_desc:0 "L’instabilité croissante causée par la violence politique inquiète de nombreux industriels influents, qui craignent qu’une révolution communiste soit imminente. En les convainquant que le gouvernement actuel est incapable d’arrêter la montée du communisme, nous pourrons sûrement compter sur leur soutien."

DEN_Increase_Attacks_on_the_Communists:0 "Intensifier les attaques contre les communistes"
DEN_Increase_Attacks_on_the_Communists_desc:0 "Ennemis collectifs de la nation danoise, les communistes se sont récemment montrés plus actifs que d’ordinaire. Il est de notre devoir de réduire leur influence."

DEN_Bolster_the_SA:0 "Renforcer la SA"
DEN_Bolster_the_SA_desc:0 "Le bras paramilitaire de notre parti sera étendu afin que la volonté du parti s’impose dans les rues aux côtés du travail parlementaire de la direction."

DEN_Appeal_for_German_Funding:0 "Demander un financement [GER.GetAdjective]"
DEN_Appeal_for_German_Funding_desc:0 "L’inspiration de notre mouvement actuel provient du mouvement national-socialiste allemand, qui a bien sûr remplacé la faible République de Weimar et serait en mesure de financer notre cause grâce à sa nouvelle puissance."

DEN_Press_the_Schleswig_Claim:0 "Revendiquer le Schleswig"
DEN_Press_the_Schleswig_Claim_desc:0 "L’Allemagne a cruellement arraché le Schleswig-Holstein à la suite des guerres du Schleswig entre la Prusse et la Confédération germanique. Un [DEN.GetNameDef] renaissant ne peut tolérer que cette calamité reste sans réponse."

DEN_Initiate_Economic_Reforms:0 "Lancer des réformes économiques"
DEN_Initiate_Economic_Reforms_desc:0 "Les politiques des sociaux-démocrates ont échoué à répondre à la Grande Dépression, et il est temps pour les conservateurs de réformer notre économie."

DEN_Fuel_Nationalism:0 "Alimenter le nationalisme"
DEN_Fuel_Nationalism_desc:0 "La récente paix fragile a fortement diminué la combativité et l’attachement des Danois envers leur nation. Nous allons inspirer nos compatriotes pour qu’ils soient de nouveau prêts à mourir pour leur patrie."

DEN_Increased_Protectionism:0 "Protectionnisme accru"
DEN_Increased_Protectionism_desc:0 "Nos industries agricoles se vident de leur richesse car elles sont surpassées par les produits étrangers ; nous devons augmenter les tarifs douaniers pour contrer cela."

DEN_Increase_Rural_Developement:0 "Développer les campagnes"
DEN_Increase_Rural_Developement_desc:0 "La campagne est le cœur de la nation danoise, mais son développement a été négligé au profit de l’économie urbaine. Une inversion de ce processus est inestimable pour [DEN.GetNameDef]."

DEN_Conservative_Majority:0 "Majorité conservatrice"
DEN_Conservative_Majority_desc:0 "À force d’échecs politiques répétés, les sociaux-démocrates, autrefois très populaires, ont perdu leur mandat public et seront remplacés par un gouvernement conservateur responsable. Le peuple du Danemark peut de nouveau dormir tranquille, sachant que leur république est protégée."

DEN_Expand_Agricultural_Subsidies:0 "Augmenter les subventions agricoles"
DEN_Expand_Agricultural_Subsidies_desc:0 "Nos agriculteurs sont à bout de forces et, bien que cela ne soit pas une solution permanente, des subventions les aideront à surmonter la tempête qu’est la Grande Dépression."

DEN_Strengthen_the_Labour_Unions:0 "Renforcer les syndicats"
DEN_Strengthen_the_Labour_Unions_desc:0 "L’institution la plus précieuse pour tout travailleur danois est le syndicat, qui garantit que sa voix est entendue sur son lieu de travail. Renforcer les syndicats renforce notre parti."

DEN_Devalue_the_Krone:0 "Dévaluer la couronne"
DEN_Devalue_the_Krone_desc:0 "Nous pouvons obtenir un avantage compétitif sur le marché européen des exportations en dévaluant notre monnaie, espérant ainsi relancer notre économie stagnante."

DEN_Expand_the_Copenhagen_University:0 "Développer l’université de Copenhague"
DEN_Expand_the_Copenhagen_University_desc:0 "L’université de Copenhague est notre institution scientifique la plus prestigieuse, et une expansion supplémentaire favorisera la communauté scientifique danoise en pleine croissance."

DEN_Bolster_Labour_Rights:0 "Renforcer les droits des travailleurs"
DEN_Bolster_Labour_Rights_desc:0 "Avec la position renforcée des syndicats, nous pouvons mettre en place des changements radicaux pour améliorer les conditions de travail de nos ouvriers. Bien que cela bénéficie largement à notre électorat, les industriels désapprouveront."

DEN_Social_Democratic_Majority:0 "Majorité sociale-démocrate"
DEN_Social_Democratic_Majority_desc:0 "Après avoir surmonté les crises internes, la tradition démocratique de [DEN.GetNameDef] peut avancer sous les sociaux-démocrates vers un Âge d’or de notre phare de liberté."

DEN_An_Appeal_to_the_Proletariat:0 "Un appel au prolétariat"
DEN_An_Appeal_to_the_Proletariat_desc:0 "Les masses ignorées des ouvriers d’usine sont lourdement touchées par la stagnation de notre économie et exigent un changement. Un changement que seul le Parti communiste peut apporter."

DEN_Popular_Front_against_Fascism:0 "Front populaire contre le fascisme"
DEN_Popular_Front_against_Fascism_desc:0 "La menace du fascisme a uni de nombreux mouvements sociaux-démocrates et socialistes à travers le monde, et au [DEN.GetNameDef], ce sera pareil. Avec les éléments militants du Socialdemokratiet et du Kommunistiske Parti, le fascisme qui a émergé en Allemagne sera vaincu."

DEN_Channel_Economic_Frustrations:0 "Canaliser les frustrations économiques"
DEN_Channel_Economic_Frustrations_desc:0 "En mettant davantage l’accent sur les échecs économiques de l’administration actuelle dans notre rhétorique, nous pouvons rallier encore plus de travailleurs à notre cause communiste."

DEN_Ally_the_Peasents:0 "S’allier aux paysans"
DEN_Ally_the_Peasents_desc:0 "Le prolétaire est exploité au [DEN.GetNameDef], mais les propriétaires terriens profitent également lourdement du simple fermier. Les deux classes opprimées s’uniront et renverseront le système qui les aliène de leur travail."

DEN_Comintern_Support:0 "Soutien du Komintern"
DEN_Comintern_Support_desc:0 "L’Internationale communiste, troisième tentative d’unir les mouvements socialistes mondiaux, dispose de nombreux soutiens politiques à offrir aux divers mouvements de libération dans le monde. Nous tirerons le meilleur parti de l’aide de nos camarades."

DEN_Organize_Nationwide_Strikes:0 "Inspirer la ferveur révolutionnaire"
DEN_Organize_Nationwide_Strikes_desc:0 "« La révolution est proche », lit-on sur un tract distribué par un jeune communiste enthousiaste parcourant les places très fréquentées de Copenhague. Ce sentiment est partagé par de nombreux socialistes qui attendent avec optimisme que la révolution atteigne [DEN.GetNameDef]."

DEN_DNSAP_Takeover:0 "Marche sur Copenhague"
DEN_DNSAP_Takeover_desc:0 "Ce jour sera l’aboutissement des mois récents de violence politique et de combats de rue. La population est devenue suffisamment mécontente du gouvernement démocratique actuel et suffisamment effrayée par la montée des communistes pour apporter son soutien à notre mouvement fasciste. Notre marche vers les centres de Copenhague marquera notre glorieuse victoire sur les bolcheviks et leurs alliés."

DEN_DKP_Takeover:0 "La grève générale"
DEN_DKP_Takeover_desc:0 "L’inéluctabilité du soulèvement du prolétariat européen a été mise en doute après l’échec tragique de la Révolution spartakiste. Cependant, il semble que les communistes danois aient désormais l’opportunité de renverser cette démocratie bourgeoise."

DEN_Denmark_in_Peril:0 "Le Danemark en péril"
DEN_Denmark_in_Peril_desc:0 "Depuis sa défaite lors des guerres napoléoniennes, le Danemark a traversé sans heurts les conflits mondiaux et les luttes internes. Mais avec un [GER.GetName] revanchard et un [SOV.GetName] ambitieux, le calme récent de l’Europe semble éphémère. Pour que [DEN.GetNameDef] survive dans ce nouveau climat, il doit s’adapter. Soit le monde le forcera à une militarisation épuisante, soit à des concessions dégradantes."

DEN_Reverse_the_Disarmament:0 "Annuler le désarmement"
DEN_Reverse_the_Disarmament_desc:0 "Avec le calme de l’Europe qui s’évanouit, nous ne pouvons pas compter sur la paix, ce qui signifie inverser les politiques de désarmement vieilles de plusieurs décennies."

DEN_A_Modern_Hammershus:0 "Un Hammershus moderne"
DEN_A_Modern_Hammershus_desc:0 "L’île de Bornholm occupe une position stratégique dans la Baltique et fut déjà fortifiée au Moyen Âge. Une invasion moderne semblant de plus en plus probable, nous devons également défendre cette île cruciale."

DEN_Fortify_the_Southern_Islands:0 "Fortifier les bases navales"
DEN_Fortify_the_Southern_Islands_desc:0 "Le [DEN_navy_localisation] et le [DEN_army_localisation] doivent travailler ensemble pour protéger [DEN.GetNameDef]. En fortifiant les bases navales, nous pouvons empêcher l’ennemi de nous contourner sur nos îles natales."

DEN_AA_Installations:0 "Installations anti-aériennes"
DEN_AA_Installations_desc:0 "La troisième dimension de la guerre moderne est de plus en plus utilisée par les grandes puissances européennes, et si nous voulons protéger les centres civils danois, nous devons être prêts à abattre des dizaines de Stukas."

DEN_Radar_Installations:0 "Installations radar"
DEN_Radar_Installations_desc:0 "Nous devons adopter un système de détection des escadrons semblable à celui des [ENG.GetAdjective] afin de savoir ce qui se passe dans l’espace aérien danois."

DEN_Fortress_Sjaelland:0 "Forteresse Sjaelland"
DEN_Fortress_Sjaelland_desc:0 "En nous concentrant sur la fortification de nos îles, nous pouvons résister plus efficacement aux agresseurs, au prix d’abandonner tous les Danois du Jutland."

DEN_The_Frederick_Line:0 "Renaissance du Danevirke"
DEN_The_Frederick_Line_desc:0 "Le Danevirke était une série de fortifications mises en place par les Vikings pour dissuader les invasions germaniques. Dans notre situation actuelle, une renaissance moderne de cette ligne servira bien le Danemark."

DEN_Ramp_up_Conscription:0 "Renforcer la conscription"
DEN_Ramp_up_Conscription_desc:0 "La conscription fait partie de la vie danoise depuis l’ère viking, mais notre situation actuelle exige que nous l’élargissions davantage."

