#Events
 danish_elections.1.t:0 "Municipal Elections of 1937/8 - Sjaelland"
 danish_elections.1.d:0 "Although the Folketing elections showed a strong electorate for the social democrats, they struggled particularly in the region of Sjaelland, where it seems the conservatives hold the upper hand. The considerable political effort would have to be expended to secure this stronghold."
 danish_elections.1.a:0 "Socialdemokratiet er det sejrherre!"
 danish_elections.1.b:0 "Konservative Parti er det sejrherre!"
 
 danish_elections.2.t:0 "Municipal Elections of 1937/8 - North Jutland"
 danish_elections.2.d:0 "The social democrats have to thank the people of North Jutland for their past electoral victories as it seems a stronghold of theirs. It would indeed be an upset if the conservatives were to take the region."
 danish_elections.2.a:0 "Kommunistiske Parti er det sejrherre!"
 
 danish_elections.3.t:0 "Municipal Elections of 1937/8 - South Jutland"
 danish_elections.3.d:0 "Within the Danish region of South Jutland screams a loud minority, the Germans inhabiting Nordslesvig. The political representation for these screams is the Schleswigsche Partei, which has national socialist undertones and vague connections to the German NSDAP, thus being considered dangerous by the Danish majority inhabiting the region. Of course, the Danish resistance will be insignificant compared to the German dissent."
 danish_elections.3.b:0 "Slesvigsk Parti er det sejrherre!"
 
 denmark.1.t:0 "Political Violence in [DEN.GetNameDef]"
 denmark.1.d:0 "There are currently two political movements gearing up for political violence. The Danmarks Kommunistiske Parti and the Danmarks Nationalsocialistiske Arbejderparti, both trying to strengthen their political platform. The government will do its best to contain the violence with the help of the police, though if that will be enough is to be seen."
 denmark.1.a:0 "Im smelling a Bloody Sunday."
 
 denmark.7.t:0 "[DEN.GetNameDefCap] is in Contact with the KPD"
 denmark.7.d:0 "There is news coming directly from the Gestapo. They have uncovered a plot by the newly established Danish Bolshevist government to reorganize and weaponize the nearly defunct KPD against [GER.GetRulingParty] rule. After extensive interrogation of the captured partisan, he has revealed the plan behind these efforts. In the case of a [GER.GetAdjective] invasion into Jutland, the Danish would lead the KPD to incite a civil war. Of course, such a massive undertaking would take weeks, if not months, so if the Danish government falls before then, the seditious KPD will have no opportunity to strike."
 denmark.7.a:0 "Deeply concerning."
 
 denmark.8.t:0 "KPD Sabotage in [?DEN.den_ger_current_sabotage_state.GetName]"
 denmark.8.d:0 "With the support of [DEN.GetNameDefCap], KPD Partisans have infiltrated and carried out sabotage in [?DEN.den_ger_current_sabotage_state.GetName]. They will pay for their crimes in the end."
 denmark.8.a:0 "There'll be retribution for this."
 
 denmark.9.t:0 "KPD Preparing for Civil War"
 denmark.9.d:0 "[DEN.GetNameDefCap] has initiated its contingency plan to incite a civil war in [GER.GetNameDef]. If their government isn't wiped off the map in the following weeks, we can count on a large-scale uprising in our backyard."
 denmark.9.a:0 "This has the upmost priority."
 
 denmark.100.t:0 "[DEN.GetNameDefCap] Repealed the Copenhagen Convention"
 denmark.100.d:0 "\n\nThe Danish Straits have been an international waterway ever since the Copenhagen Convention of 1857, allowing all vessels to pass through freely regardless of country of origin or purpose. With the diplomatic support of [?DEN.copenhagen_backer.GetLeader] of [?DEN.copenhagen_backer.GetNameDef], [DEN.GetLeader] has now renounced the treaty and forced merchant ships trying to pass through to pay tolls to the Danish government. This has left the major nations of Europe stunned and outraged as Denmark now holds the keys to the Baltic."
 denmark.100.a:0 "Dominium Maris Baltici!"
 denmark.100.b:0 "A reckless disregard of international law."
 denmark.100.c:0 "An event barely worth covering."
 
 denmark.99.t:0 "The Liberation of Denmark"
 denmark.99.d:0 "After the years of [?DEN.occupation_target.GetAdjective] occupation, Denmark was freed, to the jubilation of thousands. The multi-national force marching into Denmark repelling the forces of [?DEN.occupation_target.GetNameDef] are hailed as heroes and their flags widely displayed. The Danish government has also returned from their exile, determined to end this war as quickly as possible."
 denmark.99.a:0 "A temporary setback."
 denmark.99.b:0 "Denmark, free at last."
christian_denmark.0.t:0 "Coup d’État royal au Danemark"
christian_denmark.0.d:0 "Après la montée du fascisme et du communisme qui a englouti le Danemark, son gouvernement démocratique a peiné à surmonter cet extrémisme. Des affrontements de rue opposaient régulièrement la police danoise, les communistes et les fascistes. Craignant une prise de pouvoir imminente par les fascistes, le roi Christian X a profité de la situation et a renvoyé le gouvernement, assumant pour l’instant un contrôle absolu du Danemark. Selon ses déclarations publiques, il compte réprimer tout extrémisme avec sévérité. Le gouvernement islandais a refusé de commenter pour l’instant."
christian_denmark.0.a:0 "Les échecs répétés de la démocratie."
christian_denmark.0.b:0 "Un retour au Moyen Âge."
christian_denmark.0.c:0 "Le Lion danois semble se relever."
christian_denmark.0.e:0 "Der er et yndigt land!"

christian_denmark.1.t:0 "Opposition anti-monarchiste grandissante"
christian_denmark.1.d:0 "Avec la récente prise de pouvoir de Sa Majesté le roi Christian X, de nombreux groupes de résistance se sont formés. Qu’ils soient fascistes, communistes ou démocrates, tous veulent déchirer le Danemark et le prostituer aux puissances européennes. Il est vital d’écraser ces groupes à temps avant qu’ils ne détruisent encore davantage le tissu de la nation danoise."
christian_denmark.1.a:0 "Herlig vil Danmark være!"

christian_denmark.10.t:0 "La première rencontre"
christian_denmark.10.d:0 "Le roi Christian a rencontré la direction conservatrice à leur siège. À la surprise générale, il a proposé de destituer le gouvernement actuel en raison de son incapacité à gérer les mouvements radicaux qui surgissent en [DEN.GetNameDef]. Bien que cette action paraisse extrême, Christmas Møller a promis le soutien du Parti conservateur à la dissolution du gouvernement pour préserver [DEN.GetNameDef]."
christian_denmark.10.a:0 "Une rencontre agréable."
christian_denmark.10.b:0 "Tout cela semble un peu extrême."

christian_denmark.11.t:0 "Consolider le soutien"
christian_denmark.11.d:0 "Christian, commandant en chef, a convoqué le haut commandement et le commandant de la division du Sjælland au palais royal pour s’assurer du soutien militaire en cas de réaction violente du DKP et du DNSAP. Ils ont donné des assurances réticentes puis ont été congédiés."
christian_denmark.11.a:0 "Espérons que nous n’ayons pas besoin d’eux."
christian_denmark.11.b:0 "Peut-être que tout cela est une surréaction."

christian_denmark.12.t:0 "M. Thorvald, vous êtes renvoyé"
christian_denmark.12.d:0 "je ne peux pas rendre justice à cet événement"
christian_denmark.12.a:0 "À présent, reprenons là où il s’était arrêté."

christian_denmark.13.t:0 "Silence dans l’océan Atlantique"
christian_denmark.13.d:0 "Sa Majesté a présenté l’invasion de l’Islande comme une simple répression d’un soulèvement, mais des mois plus tard, aucune troupe n’est encore en Islande, et pourtant la guerre continue. Beaucoup réclament la fin de cette guerre inutile et fictive."
christian_denmark.13.a:0 "L’opération a été mal calculée."
christian_denmark.13.b:0 "Ils sont à quelques semaines de la capitulation."

christian_denmark.2.t:0 "Agitation à Copenhague"
christian_denmark.2.d:0 "Le chef de l’union personnelle entre le Danemark et l’Islande a assumé le contrôle absolu à Copenhague et demande désormais des garanties de Reykjavik que les effets de l’Acte d’Union dano-islandais de 1918 ne seront pas modifiés par l’instabilité politique actuelle en [DEN.GetNameDef]. Cependant, la rhétorique actuelle laisse craindre que notre souverain ne cherche à réintégrer l’Islande sous son contrôle, comme il l’a fait avec le Danemark. Deux options se présentent."
christian_denmark.2.a:0 "Proclamer la République d’Islande !"
christian_denmark.2.b:0 "L’Acte d’Union reste applicable."

christian_denmark.3.t:0 "Proclamation de la République d’Islande"
christian_denmark.3.d:0 "Le Premier ministre islandais [ICE.GetLeader] a déclaré une république présidentielle après avoir été informé des troubles politiques à Copenhague. C’est une violation claire de l’Acte d’Union dano-islandais signé en 1918, et le roi n’exclut pas encore une intervention militaire. Voyons comment la situation évolue."
christian_denmark.3.a:0 "Une initiative audacieuse mais insensée."
christian_denmark.3.b:0 "Ils feront face à notre colère un jour."

christian_denmark.4.t:0 "L’Islande se montre conciliante"
christian_denmark.4.d:0 "L’ancien Premier ministre islandais s’est présenté hier devant l’Althing et a demandé au parlement de le soutenir dans sa volonté de rompre tous liens avec [DEN.GetNameDef] et de proclamer une république illégitime, avec lui, bien sûr, à sa tête. Cependant, le législatif a fait preuve de bon sens ce jour-là et a rejeté cette demande ouvertement traîtresse. Nous devons désormais envisager l’avenir de l’union."
christian_denmark.4.a:0 "Vers une coopération dano-islandaise renforcée."

christian_denmark.5.t:0 "Affaires de famille"
christian_denmark.5.d:0 "La dissolution du Danemark-Norvège au XIXe siècle fut une véritable tragédie. Les parties norvégiennes de notre royaume furent arrachées par les traîtres suédois après les guerres napoléoniennes, et depuis lors, nos deux nations ont suivi des chemins séparés. Heureusement, en 1905, l’union suédo-norvégienne s’est dissoute, et le frère de Sa Majesté le roi Christian X, le prince Carl de Danemark, fut élu au trône norvégien. Avec l’autorité royale rétablie au Danemark, nous pourrions aider la Norvège à se libérer du parlementarisme."
christian_denmark.5.a:0 "Hilsen fra København"

christian_denmark.6.t:0 "Affaires de famille"
christian_denmark.6.d:0 "La récente prise de pouvoir de Christian X en tant que monarque absolu de [DEN.GetNameDef] a inspiré certains monarchistes en Norvège à réclamer le même changement de gouvernement. Christian X a suggéré des mesures similaires, proposant de réunir l’Union dano-norvégienne."
christian_denmark.6.a:0 "Christian a le soutien du roi."
christian_denmark.6.b:0 "L’époque de l’absolutisme est révolue."

christian_denmark.7.t:0 "Le coup d’État royal"
christian_denmark.7.d:0 "La dissolution du Danemark-Norvège par les Suédois à l’est est considérée par certains comme une tragédie ; c’est notamment l’opinion de Son Altesse le frère de Christian X de Danemark. Le roi a reçu de lui une offre alléchante : Sa Majesté devrait exiger du gouvernement civil [NOR.GetAdjective] ses droits absolus mérités. Si une guerre civile devait éclater, l’armée royale danoise soutiendrait également la monarchie. Cette aide aurait bien sûr un prix, que certains s’attendent à voir être l’indépendance de [NOR.GetNameDef]."
christian_denmark.7.a:0 "Le roi rallie les forces contre le gouvernement."

christian_iceland_annexation_tt:0 "§RCela pourrait mener à l’annexion de l’Islande par le Royaume du Danemark.§!"
christian_iceland_war_tt:0 "§RCela pourrait mener à une guerre avec le Royaume du Danemark.§!"
den_brothers_torn_apart_tt:0 "Si Haakon VII coopère, il mènera un coup d’État royal, sinon nous obtiendrons un but de guerre contre §Y[NOR.GetNameDef]§!."
den_haakon_cooperation_tt:0 "Les contacts avec le §YRoi de Norvège§! pourraient être utiles à l’avenir."
den_integrated_norway:0 "§YNorvège§! intégrée par Décision"
den_christian_cancel_coup_tt:0 "Le §YCoup d’État royal§! sera annulé."

denmark.101.t:0 "Le destin du Danemark"
denmark.101.d:0 "Le gouvernement danois a capitulé, mais il semble favorable à une collaboration avec nous, contrairement à d’autres. Peut-être qu’un gouvernement fantoche combattant à nos côtés dans tous les futurs conflits est une issue plus désirable qu’une occupation dure et coûteuse."
denmark.101.a:0 "Envoyons l’ultimatum."
denmark.101.b:0 "Nos troupes peuvent régler la question."

denmark.102.t:0 "Le destin du Danemark"
denmark.102.d:0 "Avec notre capitulation face à l’avancée étrangère implacable, [DEN.GetNameDef] est confronté à un choix : tomber aux mains des occupants ou collaborer avec eux. C’est une question délicate sans bonne réponse, mais [DEN.GetLeader] doit en proposer une rapidement."
denmark.102.a:0 "Collaborer serait trahir tous les Danois."
denmark.102.b:0 "Le bien de la nation passe avant tout."

denmark.103.t:0 "Opération Weserübung"
denmark.103.d:0 "[GER.GetNameDefCap], actuellement impliqué dans la Seconde Guerre mondiale en Europe, a de plus en plus de difficultés à importer du fer et de l’acier [SWE.GetAdjective] à cause des raids de convois [ENG.GetAdjective]. En réponse, le gouvernement [GER.GetAdjective] a lancé l’opération Weserübung, visant à sécuriser cet approvisionnement. En raison de nos relations « amicales », ils nous ont présenté un ultimatum : soit nous permettons aux troupes [GER.GetAdjective] de passer par le sol danois et d’utiliser nos ports, soit nous faisons face à une invasion. Quelle doit être notre réponse ?"
denmark.103.a:0 "Les frontières danoises doivent être respectées."
denmark.103.b:0 "Accepter l’ultimatum."

denmark.57.t:0 "Les fascistes marchent sur le Folketing"
denmark.57.d:0 "Nos politiques ont échoué, le peuple danois est en colère et les conséquences se dressent maintenant devant notre parlement. Armés jusqu’aux dents et sans opposition, car la police a été virtuellement détruite par les affrontements de rue constants, ils exigent désormais la démission du gouvernement de [DEN.GetLeader]. Sans autre choix, le gouvernement démissionne et laisse la foule sans visage avoir gain de cause."
denmark.57.a:0 "Des temps sombres s’annoncent pour le Danemark."

denmark.58.t:0 "Les communistes marchent sur le Folketing"
denmark.58.d:0 "Nos politiques ont échoué, le peuple danois est en colère et les conséquences se dressent maintenant devant notre parlement. De plus, une grève générale a paralysé toute notre économie et le gouvernement, sans autre choix, démissionne et laisse les masses populaires avoir gain de cause."
denmark.58.a:0 "Des temps sombres s’annoncent pour le Danemark."

denmark.59.t:0 "La direction d’Aksel Larsen remise en question"
denmark.59.d:0 "Notre récente réorientation vis-à-vis du Komintern et de la Russie soviétique a poussé de nombreux membres du parti à remettre en cause la position du secrétaire général Aksel Larsen, connu pour être un fervent soutien de Moscou avant notre révolution. Le Conseil suprême du DKP a voté ce matin sur la destitution de Larsen et..."
denmark.59.a:0 "...la proposition est rejetée de justesse."
denmark.59.b:0 "...Alfred Jensen sera promu secrétaire général du DKP."

denmark.3.t:0 "Les détroits danois"
denmark.3.d:0 "La Convention de Copenhague fut un vol honteux de notre souveraineté nationale en accordant à toutes les nations le droit de traverser les détroits sans payer de droit de passage. Il est temps de reprendre nos eaux territoriales et de décider d’une nouvelle politique envers les navires étrangers."
denmark.3.a:0 "Toute nation neutre est la bienvenue."
denmark.3.b:0 "Toute nation valorisée par notre gouvernement est la bienvenue."
denmark.3.c:0 "Toute nation partageant nos idées est la bienvenue."
denmark.3.e:0 "Toute nation alliée est la bienvenue."

denmark.10.t:0 "Un gouvernement conservateur"
denmark.10.d:0 "Le Socialdemokratiet a récemment perdu beaucoup de soutien populaire en raison des problèmes économiques et internes actuels. Avec cette perte de confiance envers le gouvernement, le roi a installé le parti conservateur comme parti au pouvoir en [DEN.GetNameDef]. L’annonce de leur cabinet suivra bientôt."
denmark.10.a:0 "Espérons que nous puissions restaurer la confiance en la démocratie."

denmark.20.t:0 "Le retour du Socialdemokratiet"
denmark.20.d:0 "Bien que les promesses des conservateurs aient été grandioses, leur mise en œuvre a été insuffisante. Craignant une radicalisation accrue due à l’inaction, le roi a replacé les sociaux-démocrates au pouvoir avec le soutien d’une pluralité."
denmark.20.a:0 "Ne répétons pas nos erreurs."

denmark.32.t:0 "Invitation au Conseil nordique"
denmark.32.d:0 "[DEN.GetNameDefCap] a annoncé la grande création d’un Conseil nordique, cherchant à coordonner les armées et gouvernements de la région nordique. Le [ROOT.GetNameDef] doit-il faire partie de ce conseil ?"
denmark.32.a:0 "Une coopération nordique accrue ne peut que nous bénéficier."
denmark.32.b:0 "Ne faisons jamais confiance à ces sales Danois."
denmark.34.t:0 "L’échec du Conseil nordique"
denmark.34.d:0 "Notre grande annonce de la création du Conseil nordique a été suivie d’un silence gênant, car nous n’avons reçu aucune réponse positive des gouvernements nordiques. C’est certainement une humiliation internationale pour [DEN.GetNameDef]."
denmark.34.a:0 "Une coopération nordique accrue ne peut que nous bénéficier."

denmark.35.t:0 "La première session du Conseil nordique"
denmark.35.d:0 "Avec une réponse généralement positive à notre annonce du Conseil nordique, sa première session a eu lieu. Cette organisation renforcera la position des pays nordiques sur la scène internationale."
denmark.35.a:0 "Splendide."

denmark.36.t:0 "Invitation à l’Union douanière nordique"
denmark.36.d:0 "Pour aider à sa reprise après la grande dépression, le gouvernement danois a proposé un moyen pour toutes les économies scandinaves de sortir de la crise. [DEN.GetNameDefCap] lèvera les droits de douane et restrictions entre les États membres afin d’encourager la coopération économique."
denmark.36.a:0 "Un excellent arrangement."
denmark.36.b:0 "L’économie [ROOT.GetAdjective] restera [ROOT.GetAdjective] !"

denmark.37.t:0 "[FROM.GetNameDefCap] a accepté l’Union douanière nordique"
denmark.37.d:0 "Le gouvernement [FROM.GetAdjective] a vu les avantages de notre union douanière proposée et a accepté tous ses termes. Notre coopération future apportera la prospérité à nous deux."
denmark.37.a:0 "Splendide."

denmark.38.t:0 "[FROM.GetNameDefCap] a refusé l’Union douanière nordique"
denmark.38.d:0 "Le gouvernement [FROM.GetAdjective] semble aveuglé par un protectionnisme nationaliste, car il a refusé les politiques essentielles de l’union proposée. Il semble qu’ils veuillent suivre leur propre voie."
denmark.38.a:0 "Tragique."

denmark.39.t:0 "[DEN.GetNameDefCap] propose l’Accord de la mer du Nord"
denmark.39.d:0 "Pour aider à sa reprise après la grande dépression, le gouvernement danois a proposé un accord commercial entre les pays commerçant en mer du Nord. Cela facilitera grandement le commerce et les échanges entre nos nations et contribuera à notre reprise économique."
denmark.39.a:0 "Un excellent arrangement."
denmark.39.b:0 "Les Danois n’ont que leurs propres intérêts en tête."

denmark.42.t:0 "[FROM.GetNameDef] a accepté l’Accord commercial de la mer du Nord"
denmark.42.d:0 "Le gouvernement [FROM.GetAdjective] a vu les avantages de notre accord commercial proposé et a accepté tous ses termes. Notre coopération future apportera la prospérité à nous deux."
denmark.42.a:0 "Splendide."

denmark.43.t:0 "[FROM.GetNameDef] a refusé l’Accord commercial de la mer du Nord"
denmark.43.d:0 "Le gouvernement [FROM.GetAdjective] semble aveuglé par un protectionnisme nationaliste, car il a refusé les politiques essentielles de l’accord proposé. Il semble qu’ils veuillent suivre leur propre voie."
denmark.43.a:0 "Tragique."

denmark.44.t:0 "[DEN.GetNameDefCap] propose l’Accord commercial dano-[SOV.GetAdjective]"
denmark.44.d:0 "[DEN.GetNameDefCap] propose un accord commercial entre nous, cherchant à dominer économiquement la mer Baltique. Bien qu’ils soient, bien sûr, une république bourgeoise, cet accord pourrait être à notre avantage."
denmark.44.dc:0 "Après la grande dépression et la récente révolution au Danemark, son économie semble pleine d’incertitudes. Nos camarades de [DEN.GetNameDef] ont proposé une manière de stabiliser l’économie danoise tout en aidant en même temps l’économie [SOV.GetAdjective]. Les économistes ne voient aucune raison de refuser cette demande."
denmark.44.a:0 "Signer l’accord !"
denmark.44.b:0 "Non."

denmark.45.t:0 "[DEN.GetNameDefCap] propose le pacte Munch-Ribbentrop"
denmark.45.d:0 "[DEN.GetNameDefCap] nous a envoyé une demande de négociation de non-agression et de coopération économique. Comme ils contrôlent l’entrée de la mer Baltique, leur valeur stratégique sous occupation [GER.GetAdjective] serait immense. S’ils veulent cela, ils devront accepter des conditions sévères."
denmark.45.a:0 "Envoyons nos exigences !"
denmark.45.b:0 "Nous ne négocierons pas avec [DEN.GetNameDef]."

denmark.46.t:0 "Pacte Munch-Ribbentrop signé"
denmark.46.d:0 "Le gouvernement [GER.GetAdjective] a accepté les conditions favorables et a signé une garantie d’indépendance et de non-agression. Bien que nos concessions en retour soient dures, elles sont nécessaires."
denmark.46.a:0 "Bien."

denmark.47.t:0 "Pacte Munch-Ribbentrop refusé"
denmark.47.d:0 "Le gouvernement [GER.GetAdjective] a refusé les conditions très favorables que nous lui avons offertes. Nos conseillers ne savent pas quoi penser de cela."
denmark.47.a:0 "Une invasion est imminente !"

denmark.48.t:0 "Accord commercial dano-[SOV.GetAdjective] accepté"
denmark.48.d:0 "Le gouvernement [SOV.GetAdjective] a accepté les conditions mutuellement bénéfiques de l’accord commercial et a signé leur garantie d’indépendance et de pacte de non-agression."
denmark.48.a:0 "À une prospérité mutuelle !"

denmark.49.t:0 "Accord commercial dano-[SOV.GetAdjective] refusé"
denmark.49.d:0 "Les [SOV.GetAdjective] ont, à notre grand désarroi, refusé les termes de notre accord commercial proposé."
denmark.49.a:0 "Tragique."

denmark.71.t:0 "[DEN.GetNameDefCap] propose un Plan scandinave"
denmark.71.d:0 "Le gouvernement danois a proposé une attaque en tenaille pour unifier la Scandinavie sous le Komintern. Le risque de cette opération peut être élevé, mais avoir notre flanc nord sécurisé par un allié aidera toute défense future de l’union."
denmark.71.a:0 "Préparons nos troupes."
denmark.71.b:0 "Beaucoup trop risqué."

denmark.72.t:0 "Refus des Soviétiques"
denmark.72.d:0 "[SOV.GetLeader] a grossièrement décliné le Plan scandinave, le qualifiant de projet avide de pouvoir, ignorant la vie des soldats soviétiques comme danois."
denmark.72.a:0 "Scandaleux."

denmark.40.t:0 "Soulèvement paysan en préparation"
denmark.40.d:0 "Avec l’influence écrasante des classes populaires, les ouvriers des usines des villes et les paysans des campagnes se sont unis dans leur lutte pour renverser le roi et instaurer la « République du Danemark ». Si nous voulons que le royaume survive, nous devons limiter leur influence sur ce gouvernement."
denmark.40.a:0 "Le royaume est menacé."

denmark.41.t:0 "Coup d’État oligarchique en préparation"
denmark.41.d:0 "Les industriels et grands propriétaires terriens de notre pays ont de plus en plus essayé de remplacer notre [DEN.GetRulingParty] démocratiquement élu par une marionnette oligarchique. Nos principes démocratiques pourraient être menacés si leurs tentatives ne sont pas contrecarrées."
denmark.41.a:0 "Une pensée angoissante."

denmark.62.t:0 "Les amères salutations du roi"
denmark.62.d:0 "Le dixième monarque du Danemark, nommé Christian, savait que ce jour viendrait, depuis que le Socialdemokratiet a soutenu la lutte contre les fascistes aux côtés des communistes. Devoir prêter serment à la coalition impie entre communistes et sociaux-démocrates fut peut-être le moment le plus bas de sa vie. Jusqu’à aujourd’hui, où ses titres vont lui être retirés et où le royaume que sa dynastie a forgé doit être démantelé."
denmark.62.a:0 "La fin d’une époque."

#Communisme
den_kpd_contacts:0 "Souvenirs de la révolution allemande"
den_kpd_contacts_desc:0 "Aux yeux de la plupart, [GER.GetNameDef] semble être un pays depuis longtemps unifié sous un gouvernement brutal, mais tous les [GER.GetAdjective] ne sont pas satisfaits de ce régime ; des cellules de résistance indépendantes font de leur mieux pour saper le [GER.GetRulingParty]. Si nous rétablissons les organisations pré-nazies et leur fournissons une aide, peut-être pourrons-nous faire s’effondrer [GER.GetNameDef].\n\n"
