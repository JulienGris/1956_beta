SMI_sideline_the_council:0 "Écarter le conseil"
SMI_sideline_the_council_desc:0 "L’inutilité du conseil querelleur se révèle jour après jour. Le fascisme exige de s’aligner derrière la vision du chef afin de tracer la voie nationale de manière claire et résolue."
SMI_ideological_consensus:0 "Consensus idéologique"
SMI_ideological_consensus_desc:0 "Le contrôle du parti sur le conseil étant presque total, les voix de l’opposition se taisent chaque jour davantage, ou sont étouffées depuis l’intérieur du parti. Cela permet d’éviter les débats interminables et embarrassants des prétendues « démocraties » parlementaires."
