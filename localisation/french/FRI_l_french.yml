 # DÉCISIONS SUR LA GUERRE D’INDÉPENDANCE
 VIN_independence_war:0 "La guerre d’indépendance"
 VIN_independence_war_desc:0 "Le temps est enfin venu de chasser les colonisateurs [FRA.GetAdjective] qui n’ont cessé d’exploiter notre beau pays. Dans une lutte aussi décisive, toutes les forces indépendantistes ont accepté de coopérer pour mobiliser la population.\nCependant, la plupart des soldats constatent que les conflits internes entre les différentes factions persistent. Si nous ne pouvons les résoudre sur le champ de bataille, ils devront l’être en coulisses.\n\nQuatre factions se disputent le futur contrôle du Vietnam indépendant. Les §YViet Minh§!, rassemblés sous la direction de Hô Chi Minh, cherchent à instaurer un système proche de l’Union soviétique stalinienne ; §YLa Lutte§!, une association de trotskistes visant à mettre en pratique la théorie politique imaginée par le transfuge soviétique ; le §YVNQDD§!, qui cherche à établir une forme de socialisme démocratique et est beaucoup plus enclin à un système démocratique classique ; et enfin les partisans de §YCuong De§!, membre de la famille royale qui aurait dû hériter du trône vietnamien, également soutenu par le culte caodaïste.\n\nL’influence des §YViet Minh§! est [Root.GetVietMinhInfluence]\n\nL’influence de §YLa Lutte§! est [Root.GetLaLutteInfluence]\n\nL’influence du §YVNQDD§! est [Root.GetVNQDDInfluence]\n\nL’influence de §YCuong De§! est [Root.GetCuongDeInfluence]"

