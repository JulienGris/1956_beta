 FRI_colonial_army:0 "Armée coloniale"
 FRI_growing_vietnamese_nationalism_tt:0 "§RLa crainte de soulèvements parmi les autorités coloniales nous empêche de dissoudre notre armée initiale.§!"
 FRI_colonial_army_desc:0 "En dépit de la conscription de quelques indigènes, notamment au sein des Tirailleurs indochinois, [FRI.GetNameDef] reste largement dépendante de [FRA.GetNameDef] pour sa défense. La conscription locale est relativement faible en raison du caractère colonial de l’administration et du faible potentiel de mobilisation, une grande partie de la population étant composée de paysans."
 FRI_illiteracy:0 "Analphabétisme"
 FRI_illiteracy_desc:0 "Depuis le début de la présence française en Indochine, des efforts importants ont été réalisés pour améliorer l’accès à l’éducation. En 1907, l’université de Hanoï fut fondée et, à partir de 1917, le français fut enseigné dans toutes les écoles franco-indigènes. Malgré cela, plus de 80 % de la population reste analphabète, surtout au Laos et au Cambodge, où les efforts éducatifs furent moindres et où il n’existe aucun établissement secondaire."
 FRI_unequal_economic_developement:0 "Développement économique inégal"
 FRI_unequal_economic_developement_desc:0 "Malgré son surnom de « Perle de l’Empire », seule la partie vietnamienne de l’Indochine est véritablement rentable. Le Laos et le Cambodge sont très en retard en infrastructures et en entreprises, principalement en raison de la nature beaucoup plus hostile de leur environnement ou de leur faible population. Cela pourrait s’avérer dangereux en raison de la montée des mouvements nationalistes vietnamiens, beaucoup moins présents dans nos deux autres régions."
 FRI_vietnamese_domined_economy:0 "Économie dominée par les Vietnamiens"
 FRI_growing_vietnamese_nationalism:0 "Nationalisme vietnamien croissant"
 FRI_growing_vietnamese_nationalism_desc:0 "Depuis notre arrivée en Cochinchine jusqu’à aujourd’hui, les mouvements indépendantistes vietnamiens n’ont jamais cessé de lutter contre l’administration française. Le cas le plus récent fut la mutinerie de Yên Bái en 1930, organisée par le VNQDD."
 FRI_calmed_vietnamese_nationalism:0 "Nationalisme vietnamien apaisé"
 FRI_surete_generale_indochinoise:0 "Sûreté générale indochinoise"
 FRI_surete_generale_indochinoise_desc:0 "La « Sûreté générale indochinoise » est un appareil répressif mis en place en 1917 par le gouverneur général Albert Sarraut. Sa mission était de combattre le nationalisme vietnamien. Malgré un effectif relativement réduit de quelques centaines d’hommes, principalement vietnamiens, la qualité de son organisation lui a permis de réprimer efficacement les opposants au colonialisme français dans la région. Son « Service central de Renseignements et de Sûreté générale » (SRSG) dispose de fichiers d’identité couvrant toute l’Indochine."
 FRI_profits_from_opium:0 "Profits tirés de l’opium"
 FRI_illiteracy_2:0 "Analphabétisme"
 FRI_illiteracy_2_desc:0 "Depuis le début de la présence française en Indochine, des efforts importants ont été réalisés pour améliorer l’accès à l’éducation. En 1907, l’université de Hanoï fut fondée et, à partir de 1917, le français fut enseigné dans toutes les écoles franco-indigènes. Malgré cela, plus de 80 % de la population reste analphabète, surtout au Laos et au Cambodge, où les efforts éducatifs furent moindres et où il n’existe aucun établissement secondaire."
 FRI_tin_profits:0 "Profits de l’étain"
 FRI_the_indochinese_merchant_marine2:0 "La marine marchande indochinoise"
 FRI_strikes:0 "Grèves"
