 r56_FRI_nationist_uprising_2:0 "Soulèvement vietnamien"
 r56_FRI_nationist_uprising_2_desc:0 "Depuis la mutinerie de Yên Bái, les mouvements indépendantistes vietnamiens sont devenus plus militants et combatifs. Il semble qu’un second soulèvement ne soit plus qu’une question de « quand » et non de « si »."
