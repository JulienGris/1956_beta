 FRI_surete_generale_indochinoise2_desc:0 "La « Sûreté générale indochinoise » est un appareil répressif mis en place en 1917 par le gouverneur général Albert Sarraut. Sa mission était de combattre le nationalisme vietnamien. Malgré un effectif relativement réduit de quelques centaines d’hommes, principalement vietnamiens, la qualité de son organisation lui a permis de réprimer efficacement les opposants au colonialisme français dans la région. Son « Service central de Renseignements et de Sûreté générale » (SRSG) dispose de fichiers d’identité couvrant toute l’Indochine."
