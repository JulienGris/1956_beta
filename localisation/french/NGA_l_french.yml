 # IDEAS #

 WAF_ethnic_disunity:0 "Désunion ethnique"
 WAF_ethnic_disunity_desc:0 "Depuis des années, et pour longtemps encore, le [ROOT.GetNonIdeologyName] est rongé par une profonde dysfonction étatique, causée par la diversité de ses groupes ethniques et tribus, qui bien souvent ne s’entendent guère. Un jour, les cicatrices de ces conflits devront être refermées pour que le [ROOT.GetNonIdeologyName] entre dans une nouvelle ère et prospère !"
 WAF_religious_divide:0 "Division religieuse"
 WAF_fascist_youth:0 "Organisation de jeunesse [ROOT.GetAdjective]"

 WAF_ethnic_disunity_remove_tt:0 "Sera §Gsupprimé§! une fois que le §YSoutien à la guerre§! atteindra §Y50 %§! ou que la §YStabilité§! atteindra §Y80 %§!."

 # EVENTS #

 r56_nigeria.1.t:0 "[ROOT.GetNameDefCap] nous invite à rejoindre la Fédération ouest-africaine"
 r56_nigeria.1.desc:0 "Le gouvernement [ROOT.GetAdjective], dans sa volonté de suivre une politique panafricaine, propose une union entre nos pays où, en principe, toutes les nations d’Afrique de l’Ouest seraient fusionnées en une seule fédération. D’après les rapports reçus, cela signifierait l’assimilation du [ROOT.GetNonIdeologyName] dans un État fédéral appelé Fédération ouest-africaine."
 r56_nigeria.1.a:0 "Ensemble, nous sommes plus forts !"
 r56_nigeria.1.b:0 "Ce n’est qu’une annexion déguisée."

 r56_nigeria.2.t:0 "[FROM.GetNameDefCap] rejoint la Fédération ouest-africaine !"
 r56_nigeria.2.desc:0 "Le gouvernement [FROM.GetAdjective] a accepté nos vues fédéralistes et va rejoindre notre grand mouvement. Les préparatifs pour l’établissement des institutions [ROOT.GetAdjective] et le transfert de pouvoir ont déjà commencé. Bientôt, le [FROM.GetNonIdeologyName] sera pleinement intégré à notre État, qui deviendra enfin la Fédération ouest-africaine."
 r56_nigeria.2.a:0 "Excellent !"

 r56_nigeria.3.t:0 "[FROM.GetNameDefCap] refuse notre proposition !"
 r56_nigeria.3.desc:0 "Opposé à l’idée d’une fédération, le gouvernement [FROM.GetAdjective] dirigé par [FROM.GetLeader] a rejeté notre proposition, provoquant des troubles dans notre pays. On pensait pourtant que le parti de [FROM.GetLeader] était proche des vues de [ROOT.GetLeader], ce qui rend cette réponse particulièrement choquante pour notre gouvernement."
 r56_nigeria.3.a:0 "Ce n’est qu’un revers."
