 COG_gw_tank_equipment:0 "Renault FT"
 COG_gw_tank_equipment_short:0 "FT"
 COG_light_tank_equipment_1:0 "Carden-Loyd Mk.VI"
 COG_light_tank_equipment_1_short:0 "Carden-Loyd Mk.VI"
 COG_light_tank_destroyer_equipment_1:0 "T-13 B1"
 COG_light_tank_destroyer_equipment_1_short:0 "T-13 B1"
 COG_light_tank_destroyer_equipment_1_desc:0 "Cette chenillette fut la première tentative belge de chasseur de chars. Un Carden-Loyd Mk.VI britannique équipé du canon antichar F.R.C. de 47 mm."
 COG_light_tank_aa_equipment_1:0 "T-13 AA"
 COG_light_tank_aa_equipment_1_short:0 "T-13 AA"
 COG_light_tank_artillery_equipment_1:0 "T-13 F.R.C. 76 mm"
 COG_light_tank_artillery_equipment_1_short:0 "T-13 F.R.C. 76 mm"
 COG_light_tank_equipment_2:0 "CLR T-15"
 COG_light_tank_equipment_2_short:0 "T-15"
 COG_light_tank_destroyer_equipment_2:0 "T-13 B2"
 COG_light_tank_destroyer_equipment_2_short:0 "T-13 B2"
 COG_light_tank_destroyer_equipment_2_desc:0 "Les T-13 B1, B2 et B3 étaient équipés de canons antichars de 47 mm modèle 1931 et constituaient le principal chasseur de chars de l’armée belge en 1940."
 COG_light_tank_aa_equipment_2:0 "T-15 AA"
 COG_light_tank_aa_equipment_2_short:0 "T-15 AA"
 COG_light_tank_artillery_equipment_2:0 "T-15 Artillerie"
 COG_light_tank_artillery_equipment_2_short:0 "T-15 Art."
 COG_medium_tank_equipment_1:1 "Automitrailleuse de Combat ACG-1"
 COG_medium_tank_equipment_1_short:1 "ACG-1"
 COG_medium_tank_destroyer_equipment_1:1 "Automitrailleuse Antichar ACG-2"
 COG_medium_tank_destroyer_equipment_1_short:1 "ACG-2"
 COG_medium_tank_destroyer_equipment_1_desc:1 "L’ACG-2 est un prototype de chasseur de chars basé sur l’ACG-1. Il aurait été une évolution logique de l’acquisition de l’ACG-1 par les Belges. Même sa silhouette est inconnue ; nous ne possédons qu’une photo du prototype et les plans originaux sont perdus. Le nom « Automitrailleuse Antichar » est une appellation spéculative inspirée de la désignation belge de l’ACG-1."
 COG_medium_tank_artillery_equipment_1:0 "Automitrailleuse de Support ACG-3"
 COG_medium_tank_artillery_equipment_1_short:0 "ACG-3"
 COG_medium_tank_artillery_equipment_1_desc:0 "L’ACG-3 est une reconception fictive de l’ACG-2, qui aurait consisté à ouvrir le toit de la caisse, réduire l’épaisseur du blindage et remplacer le canon antichar par une pièce d’artillerie standard."
 COG_medium_tank_artillery_equipment_2:0 "Tracteur d’artillerie de 155 mm M40"
 COG_medium_tank_artillery_equipment_2_short:0 "M40-155 mm"
 COG_medium_tank_equipment_2:0 "M4 Sherman"
 COG_medium_tank_equipment_2_short:0 "Sherman"
 COG_medium_tank_destroyer_equipment_2:0 "M18 Hellcat"
 COG_medium_tank_destroyer_equipment_2_short:0 "M18"
 COG_modern_tank_equipment_1:0 "M46 Patton"
 COG_modern_tank_equipment_1_short:0 "Patton"

