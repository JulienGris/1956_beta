 COG_heavy_tank_equipment_2:0 "M6A1 Heavy Tank"
 COG_heavy_tank_equipment_2_short:0 "M6A1"
 COG_heavy_tank_artillery_equipment_2:0 "Churchill AVRE"
 COG_heavy_tank_artillery_equipment_2_short:0 "Churchill AVRE"
 COG_heavy_tank_equipment_3:0 "M26 Pershing"
 COG_heavy_tank_equipment_3_short:0 "Pershing"
 COG_heavy_tank_artillery_equipment_3:0 "T92 Howitzer Motor Carriage"
 COG_heavy_tank_artillery_equipment_3_short:0 "T92 HMC"
 COG_super_heavy_tank_equipment_1:0 "Tortoise"
 COG_super_heavy_tank_equipment_1_short:0 "Tortoise"
 COG_anti_tank_equipment_1:0 "Canon antichar de 47 mm modèle 1931"
 COG_anti_tank_equipment_1_short:0 "C.47 F.R.C. Mle31"
 COG_anti_tank_equipment_1_desc:0 "Le canon de 47 mm modèle 1931, produit par la Fonderie Royale de Canons, jouissait d’une excellente réputation ; il servit de base au chasseur de chars T-13."
 COG_anti_tank_equipment_2:0 "Canon antichar de 60 mm"
COG_anti_tank_equipment_2_short:0 "C.60"
COG_anti_tank_equipment_2_desc:0 "Le canon antichar belge de 60 mm était puissant mais rare. Il ne fut jamais déployé sur le terrain, sa production étant jugée trop coûteuse. Tous les exemplaires produits furent utilisés dans des forteresses, principalement autour de Liège."
COG_artillery_equipment_2:0 "Canon de 120 mm Modèle 1931"
COG_artillery_equipment_2_short:0 "Canon 120 L Mle 1931"
COG_anti_air_equipment_1:0 "Bofors 40 mm"
COG_anti_air_equipment_1_short:0 "Bofors 40 mm"
COG_anti_air_equipment_2:0 "75 mm Bourges/FRC Mle 1936"
COG_anti_air_equipment_2_short:0 "75 mm FRC Mle 1936"

# Focus
COG_colonial_autonomy:0 "Autonomie coloniale"
COG_colonial_autonomy_desc:0 "Nous avons déjà demandé au ministère des Colonies de nous accorder davantage de libertés, mais ces requêtes ont toujours été systématiquement refusées."
COG_empower_congolese:0 "Renforcer le pouvoir des [COG.GetAdjective]"
COG_empower_congolese_desc:0 "Depuis bien trop longtemps, notre peuple autochtone est gouverné par des oppresseurs venus d’outre-mer. Les [COG.GetAdjective] suivront la voie de l’égalité et de l’internationalisme pour réaliser les rêves de notre indépendance."
COG_burn_royal_portraits:0 "Brûler les portraits royaux"
COG_burn_royal_portraits_desc:0 "Brûler les portraits royaux"
COG_affinity_fascism:0 "Tendances fascistes"
COG_affinity_fascism_desc:0 "Tendances fascistes"
COG_affinity_new_order:0 "Affinité avec le Nouvel Ordre"
COG_affinity_new_order_desc:0 "Affinité avec le Nouvel Ordre"
COG_independence:0 "Renverser le gouvernement de Pierre Rykmans"
COG_independence_desc:0 "Maintenant que nous avons rassemblé suffisamment de soutien dans les principales villes [COG.GetAdjective] et au sein de la Force Publique, nous devons mener un coup d’État. Ce coup porté au cœur du système actuel nous libérera de l’influence belge."
COG_doctrinal_marxism:0 "Marxisme doctrinal"
COG_doctrinal_marxism_desc:0 "Le marxisme-léninisme est la seule voie pour libérer les travailleurs de la tyrannie des capitalistes, qui exigent toujours plus d’heures de travail dans les mines. Il est temps de nous unir et d’imposer la création d’un syndicat fort et unique."
COG_masses_education:0 "Éduquer les masses"
COG_masses_education_desc:0 "L’alphabétisation est la première étape nécessaire à la libération des travailleurs."
COG_political_commissars:0 "Commissaires politiques"
COG_political_commissars_desc:0 "\"Ces ordres ne suivent pas la ligne du parti !\""
COG_communist_army:0 "Armée communiste"
COG_communist_army_desc:0 "La révolution est en danger ! Aux armes !"
COG_join_comintern:0 "Rejoindre le Komintern"
COG_join_comintern_desc:0 "[SOV.GetNameDefCap] est le cœur de la révolution ; il serait insensé de ne pas suivre ses directives."
COG_african_diplomacy:0 "Diplomatie africaine"
COG_african_diplomacy_desc:0 "En tant que pays libre au cœur de l’Afrique, nous devons affirmer notre position sur le continent."
COG_influence_liberia:0 "Influencer le Liberia"
COG_influence_liberia_desc:0 "Le Liberia est censé être une terre pour les descendants libres d’esclaves. Leurs ancêtres furent libérés des chaînes de l’esclavage, mais ils doivent désormais l’être de l’exploitation prolétarienne."
COG_influence_south_africa:0 "Influencer [SAF.GetNameDef]"
COG_influence_south_africa_desc:0 "Les populations autochtones de [SAF.GetNameDef] sont opprimées depuis bien trop longtemps. Nous devons leur montrer la voie du socialisme pour les libérer de l’oppression coloniale et les rallier à notre cause."
COG_technology_sharing_communism:0 "Fraternité scientifique"
COG_technology_sharing_communism_desc:0 "La science guidera l’humanité sur la véritable voie du socialisme."
COG_force_publique_conscription:0 "Limites de la Force Publique"
COG_force_publique_conscription2:0 "Recrutement de la Force Publique"
COG_colonial_security:0 "Sécurité coloniale"
COG_belgo_congolese_research_cooperation:0 "Coopération belgo-congolaise en recherche"
COG_pleas_for_autonomy:0 "Plaidoyer pour l’autonomie"
COG_pleas_for_autonomy_desc:0 "La population locale organise des manifestations et des mouvements de protestation dans tout le pays pour soutenir l’autonomie coloniale, tandis que certains réclament un État du Kongo indépendant !"
COG_german_scientific_advisors:0 "Conseillers scientifiques [GER.GetAdjective]"
COG_italian_scientific_advisors:0 "Conseillers [ITA.GetAdjective]"
COG_colonial_manpower:0 "Main-d’œuvre coloniale"
COG_support_communism_africa:0 "Soutien communiste [COG.GetAdjective]"

COG_Support_the_congo_railways:0 "Office des Transports Coloniaux"
COG_Support_the_congo_railways_desc:0 "Fondé en 1935, l’« Office des transports coloniaux » ou OTRACO était chargé du réseau ferroviaire du Congo belge."
COG_congo_rubber:0 "Étendre les plantations d’hévéas"
COG_congo_rubber_desc:0 "Le climat tropical du Congo est idéal pour les plantations d’hévéas. L’utilisation de nouvelles variétés et l’extension des plantations permettraient d’augmenter rapidement la production. Nous sommes certains que les autochtones nous prêteront volontiers main-forte."
COG_congo_rubber2:0 "Améliorer la productivité des plantations"
COG_congo_rubber2_desc:0 "Le climat tropical du Congo est idéal pour les plantations d’hévéas. L’utilisation de nouvelles variétés et l’extension des plantations permettraient d’augmenter rapidement la production. Nous sommes certains que les autochtones nous prêteront volontiers main-forte."
COG_congo_rubber3:0 "Exploiter les lianes d’hévéa sauvages"
COG_congo_rubber3_desc:0 "Comme la guerre nécessite toujours plus de caoutchouc, les plantations ne suffisent plus. Pour accroître la production, nous pourrions envoyer une partie de la population dans la jungle afin d’extraire le latex des lianes d’hévéa plantées sous le règne de Léopold II, à l’époque où les plantations n’étaient pas encore organisées. Ces plantes du genre Landolphia sont plus difficiles à exploiter, mais produisent le même latex."
COG_congo_rubber4:0 "Maximiser l’extraction de caoutchouc"
COG_congo_rubber4_desc:0 "Le climat tropical du Congo est idéal pour les plantations d’hévéas. L’utilisation de nouvelles variétés et l’extension des plantations permettraient d’augmenter rapidement la production. Nous sommes certains que les autochtones nous prêteront volontiers main-forte."

COG_support_tungsten_mining:0 "Commencer l’extraction de tungstène [COG.GetAdjective]"
COG_support_tungsten_mining_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."
COG_support_tungsten_mining2:0 "Étendre les mines de tungstène [COG.GetAdjective]"
COG_support_tungsten_mining2_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."
COG_support_tungsten_mining3:0 "Poursuivre l’extension des mines de tungstène"
COG_support_tungsten_mining3_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."
COG_support_tungsten_mining4:0 "Maximiser l’extraction de tungstène"
COG_support_tungsten_mining4_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."

COG_support_copper_mining:0 "Commencer l’extraction de cuivre [COG.GetAdjective]"
COG_support_copper_mining_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."
COG_support_copper_mining2:0 "Étendre les mines de cuivre [COG.GetAdjective]"
COG_support_copper_mining2_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."
COG_support_copper_mining3:0 "Poursuivre l’extension des mines de cuivre"
COG_support_copper_mining3_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."
COG_support_copper_mining4:0 "Maximiser l’extraction de cuivre"
COG_support_copper_mining4_desc:0 "Découverts au fil des années dans diverses régions du Congo, les riches gisements de la colonie n’attendent que la civilisation pour être exploités."

COG_great_inga_dam:0 "Grand barrage d’Inga"
COG_great_inga_dam_desc:0 "Ce projet longtemps rêvé, déjà envisagé en 1928, consistait à construire un grand barrage sur le bas Congo, couplé à une usine de traitement d’aluminium très énergivore. À pleine capacité, il produirait plus que la production mondiale d’aluminium de 1939."
COG_industrial_effort:0 "Plan industriel pour le Congo"
COG_industrial_effort_desc:0 "En cette période de changement, une partie de nos besoins vitaux devrait être produite localement."
COG_transform_the_congo:0 "Développer les opportunités coloniales"
COG_transform_the_congo_desc:0 "Rénover les ports de Banana et Matadi afin d’accroître nos capacités logistiques."
COG_transform_the_congo2:0 "Investir dans la production coloniale"
COG_transform_the_congo2_desc:0 "Même si le Congo était principalement une colonie d’exploitation, la population coloniale et la quantité de minerais sont suffisantes pour commencer à fabriquer avant exportation."
COG_transform_the_congo3:0 "Augmenter la production coloniale"
COG_transform_the_congo3_desc:0 "Même si le Congo était principalement une colonie d’exploitation, la population coloniale et la quantité de minerais sont suffisantes pour commencer à fabriquer avant exportation."

COG_production_effort:0 "Production militaire locale"
COG_production_effort_desc:0 "Production militaire locale"
COG_production_effort_2:0 "Les besoins de notre époque"
COG_production_effort_2_desc:0 "Le Congo n’est pas censé être une terre ravagée par la guerre, mais nous devons être prêts à répondre à toute menace si la situation l’exige."
COG_production_effort_3:0 "Production militaire locale III"
COG_production_effort_3_desc:0 "Production militaire locale III"

COG_export_to_new_markets:0 "Exporter vers de nouveaux marchés"
COG_export_to_new_markets_desc:0 "Avec les perturbations causées par la guerre, certains pays ne sont plus ouverts à nos exportations. Nous pourrions en profiter pour fournir un maximum de ressources à nos alliés."
COG_war_mining_production_directorate:0 "Direction de la production minière de guerre"
COG_war_mining_production_directorate_desc:0 "Créée en 1941, la Direction de la production minière de guerre supervisait les différentes compagnies minières pour s’assurer que les minerais nécessaires aux alliés soient prioritaires et que les outils d’extraction soient pleinement exploités."
COG_gold_extraction:0 "Intensifier l’extraction d’or"
COG_gold_extraction_desc:0 "« L’argent est le nerf de la guerre », disait Cicéron. Deux mille ans plus tard, cet adage reste plus vrai que jamais. Le Congo recèle un grand trésor enfoui dans ses sols. Aujourd’hui plus que jamais, nous en avons un besoin urgent."
COG_diamond_extraction:0 "Intensifier l’extraction de diamants"
COG_diamond_extraction_desc:0 "Au-delà de son usage en joaillerie, le diamant a de nombreuses applications industrielles. Comme l’industrie de guerre a créé un boom de la demande, nous devons nous assurer d’extraire suffisamment de ce minéral le plus dur au monde pour approvisionner nos partenaires."
COG_invest_in_nuclear_program:0 "Soutenir l’extraction d’uranium au Katanga"
COG_invest_in_nuclear_program_desc:0 "En nous appuyant sur les théories de la relativité d’Albert Einstein et sur la désintégration radioactive de l’uranium 238, nous avons découvert que la fission de l’atome produit d’énormes quantités d’énergie. Nous devons étudier la possibilité de la réaction en chaîne et, pour ce faire, extraire de vastes quantités de minerai d’uranium. Espérons que nos mines de Kolwezi et Shinkolobwe pourront fournir les quantités nécessaires."
COG_further_nuclear_research:0 "Exploiter et exporter l’uranium"
COG_further_nuclear_research_desc:0 "Avec notre nouvelle compréhension de l’atome et l’augmentation de la production de minerai d’uranium, nous pouvons non seulement étudier son potentiel, mais aussi en exporter une partie vers nos principaux alliés pour garantir la victoire finale de notre coalition sur nos ennemis."
COG_establish_radio_stations:0 "Installer des stations radio"
COG_establish_radio_stations_desc:0 "La Société Belge Radio-électrique doit installer des stations radio afin de faciliter les communications longue distance avec les zones reculées du pays et de la colonie."
COG_radio_divisional_support:0 "Relais radio de la Force Publique"
COG_radio_divisional_support_desc:0 "Pour mieux coordonner les troupes sur les vastes distances du Congo, chaque unité doit avoir accès à un équipement radio."
COG_extra_tech_slot:0 "Institut des Sciences Coloniales"
COG_extra_tech_slot_desc:0 "L’Institut des Sciences Coloniales était le principal organisme de recherche lié au Congo belge. Installé à Anvers, il se spécialisait dans l’étude de la géologie et de la nature de la colonie. Il était complété par des stations de recherche locales sur le terrain. De plus, un important institut agronomique, l’Institut national pour l’étude agronomique du Congo belge, permettait à la colonie d’accroître considérablement ses rendements."
COG_extra_tech_slot_2:0 "Inviter des spécialistes techniques"
COG_extra_tech_slot_2_desc:0 "Pour relever les défis de notre époque, nous devons accroître notre potentiel d’innovation. Inviter des experts étrangers nous permettra d’acquérir de nouvelles compétences techniques et de surmonter les défis de cette génération."

COG_colonial_loyalty:0 "Loyauté coloniale"
COG_colonial_loyalty_desc:0 "Notre gouvernement doit être réorganisé pour faire face aux nouveaux défis. Actuellement, le gouverneur général détient trop de pouvoirs ; nous devrions lui permettre d’en déléguer une partie à des personnes compétentes."
COG_reinforce_colonial_government:0 "Renforcer le gouvernement colonial"
COG_reinforce_colonial_government_desc:0 "Le soutien des colons belges et la confiance du ministère des Colonies à Bruxelles ou en exil ont été des atouts essentiels pour la légitimité de Pierre Ryckmans et la stabilité du territoire."
COG_commit_to_the_war:0 "S’engager dans la guerre"
COG_commit_to_the_war_desc:0 "Nous sommes en guerre. Certains en [BEL.GetNameDef] pensaient que nous aurions dû nous déclarer neutres, mais la réalité de la guerre nous affecte ici et maintenant. Nous devons montrer notre engagement envers ceux qui veulent nous aider et éviter qu’une puissance étrangère ne prenne le contrôle de la colonie sous prétexte de « protection »."
COG_technology_sharing:0 "Partage de technologies"
COG_technology_sharing_desc:0 "Alors que nous aidons nos alliés dans ce conflit avec nos ressources naturelles, nous devrions leur demander des spécialistes et des plans pour améliorer nos capacités industrielles et militaires."
COG_increased_research_collaboration:0 "Renforcer la coopération scientifique"
COG_increased_research_collaboration_desc:0 "Nous sommes liés à la Belgique de nombreuses façons. Nous devrions privilégier un contact étroit avec les chercheurs [BEL.GetAdjective] pour suivre leurs innovations."
COG_cracks_down_on_enemies:0 "Réprimer les ennemis"
COG_cracks_down_on_enemies_desc:0 "L’arrestation de sympathisants [GER.GetAdjective] et d’espions de l’Abwehr opérant depuis l’Angola a été décisive pour la sécurité de la colonie."
COG_military_help:0 "Aide militaire"
COG_military_help_desc:0 "Nous devrions demander à nos alliés des machines lourdes pour produire localement l’équipement essentiel à la Force Publique. Cela réduirait notre dépendance au commerce maritime et améliorerait notre potentiel militaire."
COG_colonial_defense_associations:0 "Soutenir les associations de défense coloniale"
COG_colonial_defense_associations_desc:0 "Maintenant que nous sommes en guerre, les citoyens [BEL.GetAdjective] ont spontanément formé des « associations de défense » pour sécuriser la colonie. Nous devrions les soutenir et recruter certains de leurs membres pour encadrer les milliers de nouvelles recrues africaines."
COG_finance_planes_britain:0 "Financer des avions pour [ENG.GetNameDef]"
COG_finance_planes_britain_desc:0 "Nous devons collecter des fonds pour financer de nouveaux avions destinés aux pilotes [BEL.GetAdjective] servant dans la RAF, afin de montrer notre solidarité avec ceux qui combattent à travers le monde même après la capitulation de l’armée."
COG_finance_planes_belgium:0 "Financer des avions pour [BEL.GetNameDef]"
COG_finance_planes_belgium_desc:0 "Nous devons montrer notre soutien à [BEL.GetNameDef] dans sa lutte pour préserver son indépendance. Nous organiserons une vaste campagne de financement dans toute la colonie pour financer la construction d’avions pour l’armée [BEL.GetAdjective]."
COG_expand_force_publique_recruitment:0 "Étendre le recrutement de la Force Publique"
COG_expand_force_publique_recruitment_desc:0 "Pour compenser les pertes de la guerre, une augmentation du recrutement est nécessaire."

COG_build_revolution:0 "Construire la révolution"
COG_build_revolution_desc:0 "Motivés par la perspective d’un avenir meilleur, les travailleurs travailleront plus dur pour assurer le triomphe de la révolution."
COG_manipulate_native_masses:0 "Manipuler les masses autochtones"
COG_manipulate_native_masses_desc:0 "Nous ne pourrons pas mener une guerre uniquement avec une armée composée d’Européens. Nous devons utiliser tous les moyens possibles pour convaincre les autochtones qu’ils doivent combattre sous notre commandement et mourir pour notre cause."
COG_colonial_claims:0 "Revendiquer le grand bassin du Congo"
COG_colonial_claims_desc:0 "Lors de la conférence de Berlin, la véritable étendue du Congo a été limitée par les « grandes puissances » hypocrites. Il est temps de réviser ces décisions et d’appliquer le plan exposé par Stanley : un grand Congo reliant les deux océans pour assurer le triomphe de la civilisation au cœur de l’Afrique."
COG_mobilize_colonial_manpower:0 "Conscription des colons"
COG_mobilize_colonial_manpower_desc:0 "La population belge est l’élément le plus essentiel de notre société. Si nous voulons commander efficacement un grand nombre d’autochtones, nous devons augmenter le nombre d’officiers européens."
COG_join_axis:0 "Rejoindre l’Axe"
COG_join_axis_desc:0 "[GER.GetNameDefCap] est notre modèle, et nous devons aider le nouvel ordre par tous les moyens possibles."
COG_german_scientists:0 "Inviter des scientifiques [GER.GetAdjective]"
COG_german_scientists_desc:0 "En échange de nos ressources, [GER.GetNameDef] devrait nous aider à développer de meilleures armes. Cet équipement nous permettrait alors de remporter cette guerre contre l’alliance de la ploutocratie corrompue et du bolchevisme."
COG_italian_scientists:0 "Inviter des scientifiques [ITA.GetAdjective]"
COG_italian_scientists_desc:0 "En échange de nos ressources, [ITA.GetNameDef] devrait nous aider à développer de meilleures armes afin de remporter cette guerre contre l’alliance de la ploutocratie corrompue et du bolchevisme."
COG_join_italy:0 "Se rapprocher de [ITA.GetNameDef]"
COG_join_italy_desc:0 "[ITA.GetNameDefCap] est notre modèle, et nous devons aider le nouvel ordre par tous les moyens possibles."
COG_technology_sharing_fascism:0 "La force de la coopération"
COG_technology_sharing_fascism_desc:0 "Nous ne mènerons pas cette guerre seuls, mais si nous unissons nos efforts, nous pouvons garantir la continuité de la domination européenne sur une Afrique libre de toute influence bolchevique."

COG_reform_the_force_publique:0 "Réformer la Force Publique"
COG_reform_the_force_publique_desc:0 "La Force Publique est en mauvais état. Les fusils sont anciens et les officiers démoralisés ; nous devons changer cela."
COG_engineers_corps:0 "Corps du génie"
COG_engineers_corps_desc:0 "Les ingénieurs sont essentiels pour progresser en terrain hostile. C’est pourquoi la formation de spécialistes est nécessaire."
COG_motorization_effort:0 "Effort de motorisation"
COG_motorization_effort_desc:0 "Nous devons étudier la possibilité de créer une brigade motorisée capable de se déplacer à travers le continent bien plus rapidement que notre infanterie régulière."
COG_motorised_support:0 "Soutien logistique"
COG_motorised_support_desc:0 "Pour élaborer un système permettant un déploiement rapide de nos troupes en première ligne, nous devons motoriser une grande partie des unités de soutien de nos divisions d’infanterie."
COG_commission_on_armored_vehicles:0 "Commission sur les véhicules blindés"
COG_commission_on_armored_vehicles_desc:0 "Les chars semblent peu utiles au cœur de la jungle, mais dans le contexte du nouveau monde, nous devons être capables de combattre efficacement partout. Qui nierait que nous combattons mieux dans un véhicule blindé ? Pour étudier nos besoins, nous devons réunir des spécialistes au sein d’une commission de développement des blindés."
COG_get_rid_of_obsolete_rifles:0 "Se débarrasser des fusils obsolètes"
COG_get_rid_of_obsolete_rifles_desc:0 "Pendant trop longtemps, nous avons été équipés de fusils obsolètes datant de 1889, surplus de l’armée belge. Il est temps de nous en débarrasser ou de les moderniser."
COG_continue_the_armament_modernization_program:0 "Poursuivre le programme de modernisation de l’armement"
COG_continue_the_armament_modernization_program_desc:0 "Même avec de nouveaux fusils, le reste de notre équipement est encore ancien et doit être amélioré."
COG_finalize_the_equipment_modernization_program:0 "Finaliser le programme de modernisation de l’équipement"
COG_finalize_the_equipment_modernization_program_desc:0 "Avec quelques efforts supplémentaires, nous hisserons ce qui était une force de police coloniale au niveau d’une armée nationale permanente."
COG_modernize_police_formation:0 "Moderniser la formation de la police"
COG_modernize_police_formation_desc:0 "La Force Publique n’est (du moins en théorie) pas une armée mais une force de police coloniale. Ainsi, les missions de maintien de l’ordre font partie intégrante de ses tâches quotidiennes."
COG_modernize_tactics:0 "Moderniser les tactiques"
COG_modernize_tactics_desc:0 "Si notre équipement doit être modernisé, un effort similaire doit être réalisé sur nos tactiques. Bien que nos officiers soient de véritables professionnels, les avancées récentes en matière de théorie militaire ont clairement montré que la modernisation de nos tactiques et stratégies sera absolument nécessaire."
COG_large_scale_exercises:0 "Manœuvres à grande échelle"
COG_large_scale_exercises_desc:0 "Pour améliorer notre coordination et expérimenter de nouvelles tactiques, il est impératif d’organiser des exercices à grande échelle. Ces manœuvres impliqueront plusieurs centaines, voire milliers d’hommes, afin d’évaluer la coordination entre les différentes unités."
COG_river_patrols:0 "Patrouilles fluviales"
COG_river_patrols_desc:0 "Le bassin du Congo constitue l’ossature du pays et son contrôle est essentiel pour déplacer troupes et marchandises. Pour cela, nous devons le patrouiller avec des embarcations légères et former notre infanterie à le traverser facilement."
COG_special_forces:0 "Forces spéciales"
COG_special_forces_desc:0 "L’environnement naturel du Congo peut paraître hostile à un étranger. Le territoire est recouvert de forêts et jungles denses, traversé par un grand fleuve, et des terrains escarpés dominent l’est. Pour permettre à la Force Publique de combattre efficacement dans ces milieux, nous devons organiser des troupes équipées pour exploiter le terrain et inverser le cours des combats potentiels."
COG_jungle_training:0 "Entraînement en jungle"
COG_jungle_training_desc:0 "La jungle couvrant une part importante de notre territoire, savoir y manœuvrer et y combattre efficacement est essentiel à l’efficacité militaire de la Force Publique."
COG_fortify_congo_mouth:0 "Fortifier l’embouchure du Congo"
COG_fortify_congo_mouth_desc:0 "Nos principaux atouts se trouvent à l’embouchure du fleuve Congo ; cette région vitale doit être protégée. Pour y parvenir, nous devons mettre en place un véritable corps fluvial, équipé de petites embarcations rapides pour patrouiller sur toute la longueur du fleuve."
COG_fortify_cities:0 "Protéger les autres villes"
COG_fortify_cities_desc:0 "Même si Léopoldville est sécurisée, les villes d’Élisabethville au Katanga et de Stanleyville dans la province Orientale restent vulnérables et devraient être renforcées."

COG_air_force_congo:0 "Ailes aériennes de la Force Publique"
COG_aviation_effort_tt:0 "Pas assez d’emplacements pour construire une §Ybase aérienne§!"
COG_air_force_congo_desc:0 "Nulle part les avancées technologiques ne sont aussi rapides que dans la guerre aérienne. L’aviation est un domaine que toute nation moderne doit maîtriser."
COG_fighter_focus:0 "Importer des plans de chasseurs"
COG_fighter_focus_desc:0 "Les combats aériens de la Grande Guerre ne sont pas derrière nous. Rester en tête dans le développement des avions de chasse nous donnera un avantage à l’avenir."
COG_bomber_focus:0 "Expérimenter avec des avions long-courriers"
COG_bomber_focus_desc:0 "On racontera à l’avenir l’horreur des guerres d’aujourd’hui, avec des histoires de feu tombant du ciel. Nous ferons tout pour que ces histoires soient racontées par nos ennemis."
COG_long_range_fighters:0 "Chasseurs longue portée"
COG_long_range_fighters_desc:0 "Pour couvrir les vastes distances de la jungle, un nouveau concept doit être développé. C’est pourquoi un type d’avion militaire intermédiaire entre chasseur et bombardier est nécessaire pour assurer des missions longue portée et intercepter les bombardiers ennemis."
COG_radar_system:0 "Système radar"
COG_radar_system_desc:0 "La vastitude du Congo rend sa surveillance difficile. Un système radar nous permettrait de détecter l’ennemi et de faire décoller nos avions uniquement lorsqu’une menace approche."
COG_aviation_effort_2:0 "Étudier les tactiques étrangères"
COG_aviation_effort_2_desc:0 "De nouvelles avancées dans l’aviation seront nécessaires pour intégrer efficacement notre force aérienne aux autres branches militaires."
COG_CAS_effort:0 "Prototypes de bombardiers en piqué"
COG_CAS_effort_desc:0 "Une armée moderne a besoin de soutien, tant au sol que dans les airs."
COG_rocket_effort:0 "Développer les moteurs à réaction"
COG_rocket_effort_desc:0 "Les moteurs-fusées et à réaction permettent des vitesses inédites, pour les appareils habités comme non habités. Être pionnier dans ces technologies nous permettra de surprendre l’ennemi."
COG_NAV_effort:0 "Expériences en bombardement naval"
COG_NAV_effort_desc:0 "Tout comme la guerre navale moderne se déroule sous la surface de l’eau, une partie se joue aussi dans les airs au-dessus de la mer."
COG_naval_effort:0 "Commencer la construction navale à Matadi"
COG_naval_effort_tt:0 "Pas assez d’emplacements pour construire des §Ychantiers navals§!"
COG_naval_effort_desc:0 "Port le plus moderne du pays, protégé de la haute mer car situé à 100 km de l’embouchure du fleuve Congo, Matadi est l’endroit idéal pour lancer notre programme naval."
COG_submarine_operations:0 "Tactiques de raid sur convois"
COG_submarine_operations_desc:0 "Réinventer la guerre navale pour tenir compte des progrès de la technologie sous-marine nous permettra de frapper efficacement les convois ennemis."
COG_large_navy:0 "Tactiques navales"
COG_large_navy_desc:0 "Adapter nos doctrines navales aux grands bâtiments et assurer la sécurité de nos convois commerciaux nous apprendra beaucoup sur les types de navires dont nous avons besoin."
COG_fleet_management:0 "Gestion de flotte"
COG_fleet_management_desc:0 "Notre nouvelle flotte nécessitera de nouvelles tactiques pour être pleinement efficace."
COG_submarine_experiments:0 "Expérimentations sous-marines"
COG_submarine_experiments_desc:0 "La guerre sous-marine est le développement naval le plus enthousiasmant depuis l’invention du torpilleur. Nous devons savoir nous protéger des sous-marins tout en les utilisant contre le commerce ennemi."
COG_cruiser_effort:0 "Expérimenter avec de plus grands navires"
COG_cruiser_effort_desc:0 "Avant de nous lancer dans la recherche avancée sur les cuirassés, il faut remplacer nos croiseurs plus modestes."
COG_destroyer_effort:0 "Destroyers avancés"
COG_destroyer_effort_desc:0 "En étudiant la conception et l’utilisation stratégique des sous-marins, nous avons aussi appris à contrer ces stratégies. Les destroyers seront cruciaux pour cela."
COG_capital_ships_effort:0 "Programme de grands bâtiments"
COG_capital_ships_effort_desc:0 "La nation qui possède le plus de cuirassés dominera les océans. Cuirassés et porte-avions représentent l’ancien et le nouveau visages de la suprématie navale."

COG_generic_industrial_concern:0 "CCCI"
KAT_generic_industrial_concern:0 "Metalkat"

COG_approach_the_barotse_litunga_tt:0 "Lorsque la guerre de libération commencera, nous gagnerons 2 §Ydivisions Barotse§! et un noyau sur §Y[1097.GetName]§!"
