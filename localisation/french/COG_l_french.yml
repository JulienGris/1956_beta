 COG_support_weapons:0 "Mitrailleuses Hotchkiss 1914 | Maxim '08/15'"
 COG_support_weapons_desc:0 "Les armes automatiques deviennent plus portatives. Les pistolets-mitrailleurs ont déjà prouvé leur efficacité, et le développement des armes d’appui portatives doit se poursuivre."
