l_french:
 #Congo séparé du contenu belge et déplacé ici ! -Fantom

 #decisions
 COG_embrace_new_identity:0 "Adopter une nouvelle identité"
 COG_embrace_new_identity_desc:0 "Maintenant que nous avons obtenu notre indépendance, nous devrions mettre de côté notre passé colonial et rétablir les véritables noms de nos principales villes."

 COG_abandon_colonial_identity:0 "Abandonner l’identité coloniale"
 COG_abandon_colonial_identity_desc:0 "Le nouveau régime communiste du Congo ne peut afficher le triomphe de la révolution tant que les noms des villes restent des symboles vivants du passé bourgeois impérialiste. Pour régler cette question, plusieurs villes doivent être renommées en l’honneur des héros de la révolution et des inspirateurs du prolétariat."

 COG_return_of_colonial_administration:0 "Retour de l’administration coloniale"
 COG_return_of_colonial_administration_desc:0 "Maintenant que [COG.GetNameDef] est de nouveau sous notre contrôle, nous devrions restaurer les noms coloniaux des villes de la colonie."

