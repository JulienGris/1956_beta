 COG_light_tank_artillery_equipment_3_desc:0 "Un obusier de 25 livres monté sur le châssis d’un char léger Valentine."
 COG_light_tank_destroyer_equipment_3:0 "Archer"
 COG_light_tank_destroyer_equipment_3_short:0 "Archer"
 COG_light_tank_aa_equipment_3:0 "Valentine AA"
 COG_light_tank_aa_equipment_3_short:0 "Valentine AA"
 COG_medium_tank_equipment_3:0 "Comet"
 COG_medium_tank_equipment_3_short:0 "Comet"
