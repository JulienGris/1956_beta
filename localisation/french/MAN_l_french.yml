#Ideas:
MAN_grand_council_idea:0 "Le Grand Conseil"
MAN_zongli_yamen:0 "Zongli Yamen"
MAN_efficient_command_structure:0 "Structure de commandement efficace"
MAN_cadets_in_jap_academy:0 "Cadets en académie japonaise"

MAN_army_academies:0 "Académies militaires mandchoues"
MAN_army_academies_desc:0 "La création d’académies militaires assurera une future génération d’officiers confiants, capables de coordonner une armée moderne."
MAN_labor_corps_idea:0 "Corps de travail civils"
MAN_labor_corps_idea_desc:0 "Un corps de travail civils peut décharger l’armée des tâches subalternes et lui permettre ainsi de se concentrer principalement sur le combat."

MAN_self_sufficient_military_idea:0 "Forces armées autosuffisantes"
MAN_self_sufficient_military_idea_desc:0 "Les réformes précédentes ont transformé une bande d’anciens bandits en une armée moderne et confiante, capable de tenir tête à toutes les menaces."

MAN_self_sufficient_military_idea_2:0 "Armée de la Frontière continentale"
MAN_self_sufficient_military_idea_2_desc:0 "L’unification de l’Armée du Kwantung et des forces mandchoues a entraîné une hausse de la qualité et du moral des forces armées."

MAN_martial_law:0 "Loi martiale"
MAN_martial_law_desc:0 "La mobilisation totale contre le gouvernement du KMT a poussé le gouvernement à instaurer la loi martiale sur le continent."

MAN_idea_military_primacy:0 "Primauté militaire"
MAN_idea_military_primacy_desc:0 "Avec l’escalade continue de la guerre en Chine, l’armée est devenue le premier bénéficiaire des fonds gouvernementaux."

MAN_warlord_governorates:0 "Gouvernorats des seigneurs de guerre"
MAN_warlord_governorates_desc:0 "Dans le cadre du système de ligue, des chefs militaires non loyaux au gouvernement du KMT ont été installés comme seigneurs de guerre dans les régions de Chine, créant un système décentralisé mais stable."

MAN_idea_return_of_the_manchus:0 "Retour des Mandchous"
MAN_idea_return_of_the_manchus_desc:0 "Les Mandchous reviennent une fois de plus pour régner légitimement sur la Chine."

MAN_idea_manchu_imperial_guard:0 "Garde impériale mandchoue"
MAN_idea_manchu_imperial_guard_desc:0 "La garde impériale mandchoue a été transformée d’une brigade cérémonielle en une branche conventionnelle des forces armées, désignée pour exécuter des manœuvres spéciales sur ordre de l’empereur."

MAN_subservient_empire:0 "Empire subordonné"
MAN_subservient_empire_desc:0 "Notre nouvel Empire chinois a accepté son rôle de puissance subordonnée à l’Empire japonais, prenant sa place naturelle dans le Nouvel Ordre en Asie."

MAN_zaibatsu_state:0 "État des Zaibatsu"
MAN_zaibatsu_state_desc:0 "[MAN.GetLeader] a donné carte blanche aux Zaibatsu en Mandchourie. Ils ont rapidement établi un État où toutes les opérations économiques sont contrôlées par eux et par Kishi lui-même. Si cela génère une forte croissance économique, le peuple, lui, souffre d’exploitation et de difficultés."

MAN_five_races_under_one_union:0 "Cinq races sous une union"
MAN_five_races_under_one_union_desc:0 "La devise nationale « Cinq races sous une union » symbolise la coopération entre les cinq ethnies présentes en Mandchourie : les Mandchous, les Japonais, les Hans, les Mongols et les Coréens."

MAN_concord_of_the_five_races:0 "Concorde des cinq races"
MAN_concord_of_the_five_races_desc:0 "Avec l’ascension de l’Association Concordia en tant qu’organisation de masse, le peuple de Mandchourie apprend les avantages de la coopération interethnique plutôt que de la haine et des rivalités. Le nouvel État peut véritablement être décrit comme une concorde des cinq ethnies."

MAN_mantetsu_railway:0 "Chemins de fer Mantetsu"
MAN_mantetsu_railway_desc:0 "La South Manchuria Railway Company, Ltd., ou Mantetsu, est un grand conglomérat industriel, l’une des rares sociétés encore actives à avoir précédé la fondation du [MAN.GetName]. Malgré son nom, Mantetsu est actif dans presque tous les secteurs de l’économie civile et exerce donc une grande influence sur l’État lui-même."

MAN_widespread_defeatism:0 "Défaitisme généralisé"
MAN_widespread_defeatism_desc:0 "La déclaration de guerre au [SOV.GetName] a suscité un défaitisme généralisé au sein des forces armées et de la population civile."

MAN_extreme_defeatism:0 "Défaitisme extrême"
MAN_extrene_defeatism_desc:0 "La déclaration de guerre au [SOV.GetName] a suscité un défaitisme généralisé au sein des forces armées et de la population civile."

MAN_false_government:0 "Gouvernement illégitime de Chine"
MAN_false_government_desc:0 "Nos forces ont réussi nominalement à unir tous les territoires chinois sous notre gouvernement, mais la résistance communiste et républicaine persiste en raison de la revendication illégitime de notre autorité sur la Chine. Le peuple chinois n’acceptera jamais pleinement qu’un État fantoche japonais soit son gouvernement légitime. §RCet esprit national ne peut pas être supprimé§!"

MAN_specialized_units:0 "Forces spéciales mandchoues"
MAN_manchurian_army:0 "Armée conseillée par les Japonais"
MAN_japanese_settlers:0 "Colons japonais"
MAN_resource_manchu_idea:0 "Exploitation japonaise"

