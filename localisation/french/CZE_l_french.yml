####### Version 0.96 nouveaux évènements

czke.7.t:0 "Le président Edvard Beneš démissionne"
czke.7.d:0 "À la suite de l’occupation des Sudètes par l’Allemagne, le président Edvard Beneš fut contraint de démissionner le [GetDateText] sous la forte pression allemande. Nos rapports indiquent qu’il s’est exilé à Putney, Londres, où il mène une vie discrète – pour l’instant."
czke.7.a:0 "Compris."
czke.8.t:0 "Élection présidentielle"
czke.8.d:0 "L’ancien président de la Cour suprême administrative, le Dr Emil Hácha, a été choisi par l’Assemblée nationale le [GetDateText] comme successeur d’Edvard Beneš à la présidence de la Tchécoslovaquie. Il a été sélectionné en raison de son catholicisme, de son conservatisme et de son absence d’implication dans les gouvernements ayant conduit au désastreux démembrement du pays.\n\nIl resta en fonction même après l’établissement du Protectorat de Bohême-Moravie, mais ne fut plus qu’une simple marionnette et perdit l’essentiel de son influence politique, en particulier après l’assassinat de Reinhard Heydrich en juin 1942."
czke.8.a:0 "Préparer la cérémonie d’inauguration."
hitlers_puppet:0 "La marionnette de Hitler"
emil_hacha:0 "Emil Hácha (3e Président)"
emil_hacha_desc:0 "Emil Dominik Josef Hácha était un juriste tchèque, troisième président de la Tchécoslovaquie de 1938 à 1939. Après l’occupation des restes de la Tchécoslovaquie le 16 mars, Hácha conserva son poste de président mais fut contraint de prêter serment à Hitler, qui nomma Konstantin von Neurath comme protecteur de Bohême-Moravie."


####### Version 0.96 changements des focus (anciens textes supprimés, remplacés par ceux-ci)

CZKE_new_airplane_prototypes:0 "Nouveaux prototypes de chasseurs"
CZKE_new_airplane_prototypes_desc:0 "L’avion de chasse standard tchécoslovaque était l’Avia B-534, l’un des derniers biplans encore utilisés en opération et sans doute l’un des meilleurs produits.\n\nCependant, durant les années critiques précédant la Seconde Guerre mondiale, un projet de monoplan fut lancé chez Avia."
CZKE_new_airplane_prototypes_tooltip_reward:0 "\n Choix entre §YChasseur§! ou §YChasseur lourd§! donnant un §Ybonus de recherche§!."
czke.223.t:0 "Prototypes d’avions de chasse tchécoslovaques d’avant-guerre"
czke.223.d:0 "Dès 1936, le Haut Commandement tchécoslovaque comprit que la flotte de biplans de l’Armée de l’air nécessiterait des monoplans modernes en cas de guerre contre l’Allemagne. Un programme de modernisation fut donc lancé, avec des exigences strictes pour les chasseurs et les bombardiers.\n\nLe prototype de monoplan le plus connu fut l’Avia B.35, qui entra en production en 1939 sous le nom d’Avia B.135. À l’instar du Hawker Hurricane, l’appareil possédait un train d’atterrissage rétractable et un armement standard d’un canon de 20 mm tirant à travers le moyeu de l’hélice et de deux mitrailleuses de 7,92 mm dans les ailes. Les ingénieurs d’Avia prévoyaient de remplacer le moteur Hispano-Suiza 12Ycrs jugé insuffisant, mais la guerre interrompit toute modernisation.\n\nUn autre projet prometteur était le Praga E-51, développé par ČKD Praga. Cet appareil de reconnaissance et de chasse lourde, pouvant aussi servir de bombardier léger, ressemblait par sa conception au Fw 189 ou au P-38 Lightning. Le seul prototype connu vola en mai 1938, trop tard pour être perfectionné et produit en série. Il fut saisi et testé à Rechlin par les Allemands, avant de disparaître."
czke.223.a:0 "Avia B.135 (Chasseur)"
czke.223.b:0 "Praga E.51 (Chasseur lourd)"

CZKE_new_airplane_prototypes_2:0 "Nouveaux prototypes de bombardiers"
CZKE_new_airplane_prototypes_2_desc:0 "En 1936, le seul bombardier tchécoslovaque encore utilisable était le Bloch MB.200 construit sous licence par Aero. L’un des prototypes les plus intéressants avant la guerre fut l’Aero A.300.\n\nMalheureusement, le déclenchement de la guerre interrompit son développement et sa production éventuelle."
CZKE_new_airplane_prototypes_2_tooltip_reward:0 "\n Choix entre §YAppui aérien rapproché§!, §YBombardier tactique§! ou §YBombardier stratégique§! donnant un §Ybonus de recherche§!."
czke.224.t:0 "Prototypes de bombardiers tchécoslovaques d’avant-guerre"
czke.224.d:0 "Au [GetDateText], il était évident pour le Haut Commandement tchécoslovaque que la flotte de biplans nécessitait des monoplans modernes en cas de guerre avec l’Allemagne. Un programme de modernisation fut donc lancé avec des spécifications strictes pour les chasseurs et les bombardiers.\n\nL’un des prototypes les plus prometteurs, l’Aero A.300, était un bombardier moderne équipé de moteurs radiaux Bristol Mercury IX. Plus rapide que tout autre avion tchécoslovaque, à l’exception de l’Avia B-35, il fut capturé par les Allemands en 1939 et testé par Focke-Wulf à Brême, sans jamais réapparaître.\n\nAvia présenta un nouveau bombardier léger, dérivé avancé du prototype B-58. Le B.158 était un monoplan à trois places doté d’ailes en mouette inversées, d’un train rétractable et de moteurs Avia (Hispano-Suiza) 12Ydrs de 634 kW (850 ch). Il effectua son premier vol à la mi-1938.\n\nLetov développa également le Š-50, un appareil polyvalent motorisé par deux radiaux Avia Rk.17 de 420 ch, équipé de trois mitrailleuses et pouvant emporter jusqu’à 600 kg de bombes. Il pouvait être doté d’une radio et de caméras pour la reconnaissance."
czke.224.a:0 "Aero A.300 (Bombardier stratégique)"
czke.224.b:0 "Avia B.158 (Bombardier tactique)"
czke.224.c:0 "Letov Š.50 (Appui aérien rapproché)"


new_aircraft_model:0 "\nNouveau §Ymodèle d’avion§! disponible :\n"
gained_avia_b4:0 "Avia B.534/IV (§OChasseur I§!)\n"
gained_avia_bk:0 "Avia Bk.534 (§OChasseur lourd I§!)\n"


####### AJOUTS FUTURS

#######     czke.447.t:0 "Autonomie de la Slovaquie et de la Ruthénie subcarpathique"
#######     czke.447.d:0 "Les suites de la crise de Munich exigèrent une autonomie accrue pour les régions orientales de la Tchécoslovaquie. Deux lois constitutionnelles du 22 novembre 1938 (loi n° 299/1938 sur l’autonomie de la Slovaquie et loi n° 328/1938 sur l’autonomie de la Ruthénie subcarpathique) remplacèrent le caractère unitaire de l’État par un modèle asymétrique d’autonomie pour ces deux régions, mais pas pour les terres tchèques historiques.\n\nUn nouveau gouvernement local dirigé par Tiso fut établi en Slovaquie, et le pays changea de nom pour devenir la République tchéco-slovaque. Toutefois, les événements de 1939 et l’occupation des terres tchèques par l’Allemagne mirent fin à cette fédération après seulement quelques mois, remplacée par une République slovaque indépendante, État client de l’Allemagne nazie."
#######     czke.447.a:0 "Préparer l’autonomie."


#DÉCISIONS#
CZE_the_second_czechoslovak_republic:0 "La Deuxième République tchécoslovaque"
CZE_the_second_czechoslovak_republic_desc:0 "[CZE.getNameDefCap] est un État multiethnique issu de la chute de l’Empire austro-hongrois en 1918, rassemblant Tchèques, Slovaques, Allemands, Hongrois, Ruthènes, Polonais et bien d’autres. \nUne telle diversité apporte à la jeune république autant d’avantages que d’obstacles."
CZE_subcarpathian_ruthenia_political_reforms:0 "Réformes politiques en [73.getName]"
CZE_subcarpathian_ruthenia_political_reforms_desc:0 "Les suites de la crise de Munich exigèrent une autonomie accrue pour les régions orientales de [CZE.getNameDef].\n\nDeux lois constitutionnelles du 22 novembre 1938 (loi n° 299/1938 sur l’autonomie de la Slovaquie et loi n° 328/1938 sur l’autonomie de la Ruthénie subcarpathique) remplacèrent le caractère unitaire de l’État par un modèle asymétrique d’autonomie pour ces régions, mais pas pour les terres tchèques historiques."

CZE_sdp_radicalization:0 "Crise de radicalisation du SdP"
CZE_sdp_radicalization_desc:0 "La minorité allemande des Sudètes cherche activement à se rapprocher de [GER.getNameDef]. Elle exige une plus grande autonomie et menace d’accroître sa résistance face aux autorités étatiques dans ses territoires."

end_of_czechoslovakia:0 "La Tchécoslovaquie a rencontré son destin"
czke.108.t:0 "L’industrie des explosifs en Tchécoslovaquie"
czke.108.d:0 "En 1920, le gouvernement tchécoslovaque décida d’entrer dans l’industrie des explosifs. Il créa l’« Usine anonyme tchécoslovaque de matériaux explosifs » à Pardubice, en raison de sa position stratégique en Bohême centrale.\n\nDès 1922, l’usine produisait poudre noire, poudre sans fumée et autres matériaux énergétiques, principalement à usage militaire. À la fin des années 1930, elle fut renommée Explosia.\n\nEn 1928, une société sœur, Synthesia, fut fondée à Semtín, spécialisée dans les produits inorganiques destinés aux explosifs.\n\nPendant l’occupation de 1938 à 1945, Explosia produisit une grande partie des poudres pour l’artillerie allemande et des explosifs pour les démolitions civiles et militaires. Les Alliés tentèrent de bombarder les usines, mais sans succès.\n\nLe Semtex, explosif plastique, fut inventé beaucoup plus tard par Synthesia, mais reste l’un des produits les plus connus de l’industrie tchécoslovaque."
czke.108.a:0 "Développer Explosia"
czke.108.b:0 "Développer Synthesia"
