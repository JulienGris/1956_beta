 # personnages et descriptions
 CZKE_jan_antonin_bata_desc:0 "Jan Antonín Baťa était un fabricant de chaussures tchèque et, après la mort de son demi-frère, le propriétaire et directeur général de la société Baťa.\n\nSous son administration, l’entreprise s’est encore étendue dans les machines à chaussures, pneus, textiles, produits chimiques, mines, canaux, chemins de fer, studios de cinéma, fabrication d’avions, grands magasins, et plus encore."

 CZKE_emil_kolben_desc:0 "Emil Kolben était un ingénieur et entrepreneur tchèque, fondateur et directeur de ČKD jusqu’à l’occupation de la Tchécoslovaquie par les nazis, lorsqu’il fut démis de ses fonctions puis interné au camp de concentration de Theresienstadt où il mourut en 1943."

 CZKE_radola_gajda_desc:0 "Radola Gajda, né Rudolf Geidl, était un commandant militaire et homme politique tchèque/serbe. Il devint chef d’état-major par intérim en 1926 ; cependant, il fut contraint de prendre sa retraite après avoir publiquement affiché sa sympathie pour le fascisme italien.\n\nEncore jeune, à 34 ans, Gajda se tourna vers la politique. Fin 1926, il participa à la fondation de la Communauté fasciste nationale, calquée sur le Parti national fasciste de Mussolini, et en devint le dirigeant en 1927."

 CZKE_karel_husarek_desc:0 "Le général Karel Husárek occupa le poste de directeur des travaux de fortification tout au long de leur existence."

 CZKE_jan_netik_desc:0 "Le général Jan Netík fut, à partir de 1927, chef du IIe département (Artillerie et Armement) du ministère de la Défense nationale. Son département fut crucial dans la mise en place du programme d’armement de l’Armée tchécoslovaque."

 CZKE_milan_hodza_desc:0 "Milan Hodža était un homme politique et journaliste slovaque de premier plan, Premier ministre de Tchécoslovaquie de 1935 à 1938.\n\nPartisan de l’intégration régionale, il fut célèbre pour sa tentative de créer une fédération démocratique des États d’Europe centrale."

 CZKE_klement_gottwald_desc:0 "Klement Gottwald était un homme politique communiste tchécoslovaque et dirigeant de longue date du Parti communiste tchécoslovaque (KSČ). Après le coup d’État communiste, il fut Premier ministre de 1946 à 1948 puis président de 1948 à 1953."

 CZKE_prokop_drtina_desc:0 "Prokop Drtina fut un membre éminent du Parti national-socialiste. Ce groupe influent façonna la scène politique de la Tchécoslovaquie d’avant-guerre et entretenait des liens étroits avec le second président du pays, Edvard Beneš."

 CZKE_silvestr_blaha_desc:0 "Général et théoricien tchèque, chef du Bureau militaire de la présidence. Il est connu pour ses travaux publiés sur la défense de l’État et les équipements de soutien. Il était un partisan de l’extension du service militaire obligatoire."

 CZKE_louis_eugene_faucher_desc:0 "Louis Eugene Faucher fut le chef de la mission militaire française en Tchécoslovaquie de 1926 à 1938. Après l’ultimatum franco-britannique adressé au gouvernement tchécoslovaque, il présenta sa démission au gouvernement français le 23 septembre 1938 mais resta en Tchécoslovaquie.\n\nPendant la Seconde Guerre mondiale, il fit partie de l’Armée secrète (Résistance française)."

 CZKE_ludvik_krejci_desc:0 "Ludvík Krejčí était un général tchécoslovaque et chef d’état-major général de 1933 à 1939."

 CZKE_vojtech_boris_luza_desc:0 "Vojtěch Boris Luža était un général tchécoslovaque qui soutenait les tactiques offensives du maréchal français Foch et de Ludendorff ainsi que le livre « Achtung – Panzer ! » du général allemand Heinz Guderian."

 CZKE_lev_prchala_desc:0 "Le général Prchala fut un adversaire farouche de la capitulation de Munich et commandant de la IVe Armée qui gardait la frontière critique de Moravie du Sud en 1938.\n\nIl fut également soupçonné d’avoir élaboré un plan de coup d’État militaire."

 CZKE_jan_syrovy_desc:0 "Jan Syrový était un général de l’armée tchécoslovaque, ancien chef d’état-major, et Premier ministre durant la crise de Munich.\n\nPendant la Première Guerre mondiale, il combattit dans les Légions tchécoslovaques de l’armée russe et perdit son œil droit à la bataille de Zborov. À la fin de la guerre, il commandait les Légions et les forces antibolcheviques sur le chemin de fer transsibérien."

 chief_luza_appointed:0 "A été nommé chef d’état-major"
 chief_prchala_appointed:0 "A été nommé chef d’état-major"


tgm:0 "Tomáš Garrigue Masaryk (1st President)"
 tgm_desc:0 "Tomáš Garrigue Masaryk was a Czechoslovak politician, sociologist, philosopher, and an eager advocate of Czechoslovak independence during World War I. He became the founder and first President of Czechoslovakia.\n\nMasaryk was re-elected three times in May 1920, 1927, and 1934. He resigned from office in 1935 on the grounds of old age and poor health, and his pupil Edvard Beneš succeeded him."
 edvard_benes:0 "Edvard Beneš (2nd President)"
 edvard_benes_desc:0 "The former Minister of Foreign Affairs and a prominent member of the Czechoslovak National Social Party, Dr. Edvard Beneš, was elected president in 1935 after Tomáš Garrigue Masaryk retired.\n\nBeneš was the first and longest-serving Foreign Minister of Czechoslovakia, a post he held through 10 successive governments since he represented Czechoslovakia in talks on the Treaty of Versailles.  He was a renowned and influential figure at international conferences and a member of the League of Nations Council between 1923 and 1927."
 CZKE_jan_rys_rozsevac:0 "Jan Rys-Rozsévač"
 CZKE_jan_rys_rozsevac_desc:0 "Jan Rys-Rozsévač was a Czechoslovakian journalist, politician, and leader of the fascist, pro-Nazi organization Vlajka."

 czke.1.t:0 "Problems in Sudetenland"
 czke.1.d:0 "With the [GER.GetAdjective] occupation of the Rhineland, the Germans in the Sudeten regions are becoming more restless with each passing day. Although the leader of the Sudeten German Party (SdP), Konrad Henlein, reassures the [CZE.GetAdjective] government of the loyalty of Germans in [CZE.GetNameDef] and distances himself from German National Socialism, intelligence reports say otherwise.\n\nThe right of self-determination for Sudetenland Germans, pan-Germanism, and even open sympathy for the ideals of National Socialism is more than a common occurrence in SdP political rallies."
 czke.1.a:0 "Don't worry. It's just political populism."
 CZKE_unruly_minorities:0 "Sudetenland Problem"
 CZKE_unruly_minorities_desc:0 "Czechoslovakia was a multiethnic state created from parts of the old Austro-Hungarian Empire. Except for the Czechs and Slovaks, it was also home to many ethnic Germans, Hungarians, Jews, and Rusyns.\n\nThe aftermath of the Great Depression and increasing fascism in Europe caused immerse problems for the young country, mainly the ethnic Germans seduced by Hitler's pan-German ideas."
 czke.2.t:0 "Funeral of Tomáš Garrigue Masaryk"
 czke.2.d:0 "In Prague, a city in mourning, black flags fluttered from downtown buildings. Busts and pictures of Masaryk with that distinctive, fluffy, white mustache dotted the town and covered the front pages of numerous newspapers.\n\nBlack banners reading "TGM" adorned Saint Vitus Cathedral and buildings on Wenceslas Square. Thousands of soldiers and legionnaires marched in his funeral procession [GetDateText] as 146 military standards appeared. Draped with the [CZE.GetAdjective] flag, his coffin was carried on a gun carriage through the city. On its last leg to Lány, the coffin traveled by train, placed in a car covered in wreaths and flowers.\n\nTomáš Garrigue Masaryk was a Czechoslovak politician, sociologist, and philosopher, an eager advocate of Czechoslovak independence during World War I, and became the founder and first President of Czechoslovakia. He was re-elected as president three times. He resigned from office in 1935 on the grounds of old age and poor health, and Edvard Beneš succeeded him."
 czke.2.a:0 "Sad day for [CZE.GetNameDef]."
 czke.3.t:0 "Former Czechoslovak President Dies"
 czke.3.d:0 "In Prague, a city in mourning, black flags fluttered from downtown buildings. Busts and pictures of Masaryk with that distinctive, fluffy, white mustache dotted the town and covered the front pages of numerous newspapers.\n\nBlack banners reading "TGM" adorned Saint Vitus Cathedral and buildings on Wenceslas Square. Thousands of soldiers and legionnaires marched in his funeral procession [GetDateText] as 146 military standards appeared. Draped with the [CZE.GetAdjective] flag, his coffin was carried on a gun carriage through the city. On its last leg to Lány, the coffin traveled by train, placed in a car covered in wreaths and flowers."
 czke.3.a:0 "Sad day for [CZE.GetNameDef]."
 czke.3.b:0 "One less capitalist to worry about."
 czke.3.c:0 "Finally, the old goat is dead!"
 czke.4.t:0 "SdP declares Karlsbad Program"
 czke.4.d:0 "On [GetDateText], the SdP proclaimed the "Karlsbader Program", which demanded in eight points the complete equality between the Sudeten Germans and the Czech people, including autonomy in regions occupied by ethnic Germans.\n\nThe Prague government initially refused, claiming that some points were unrealizable. However, under the pressure of the United Kingdom (Lord Runciman Mission), it eventually agreed to most of the demands presented by Henlein's party. However, the Germans were not satisfied with this compromise. They made additional unacceptable or unrealizable demands to escalate the situation further and create a regional crisis, which eventually resulted in the Munich Conference."
 czke.4.a:0 "We have to do something."
 CZKE_unruly_minorities_2:0 "Sudetenland Crisis"
 CZKE_unruly_minorities_2_desc:0 "The SdP proclaimed Karlsbader Program, and the ethnic Germans demanded self-determination."
 czke_karlsbad_program:0 "The SdP is not radicalized."
 czke.5.t:0 "Fifth Column Established in [CZE.GetNameDef]"
 czke.5.d:0 "A few weeks before the Munich conference, Hitler made a speech at a Nazi Party rally in Nuremberg on the Sudeten crisis in which he condemned the actions of the government of Czechoslovakia.\n\nHitler denounced Czechoslovakia as a fraudulent state that violated the international law's emphasis on national self-determination, claiming it was a Czech hegemony where neither the Germans, the Slovaks, the Hungarians, the Ukrainians, nor the Poles of the country wanted to be in a union with the Czechs.\n\nA week later, the Führer ordered the establishment of Sudetendeutsches Freikorps. This paramilitary organization took over the structure of Ordnersgruppe, an organization of ethnic Germans in Czechoslovakia that the Czechoslovak authorities had dissolved due to its implication in many terrorist activities. The organization was sheltered, trained, and equipped by German authorities and conducted cross-border terrorist operations into the Czechoslovak territory.\n\nMany ethnic-Germans refused to follow the Czechoslovak army mobilization order and either ran across the border to Germany and joined Freikorps, continuing cross border raids from there, or established Grün Freikorps units which were operating from Czechoslovak forests, receiving arms and equipment from Germany, and continuing attacks against Czechoslovak authorities, Jews and Czechs, up until the German occupation of the Czechoslovak border areas following the Munich agreement."
 czke.5.a:0 "Declare Martial Law!"
 CZKE_fifth_column:0 "Fifth Column"
 CZKE_fifth_column_desc:0 "Sudetendeutsches Freikorps operates in Czechoslovakia."
 CZKE_fifth_column_2:0 "Fifth Column"
 CZKE_fifth_column_desc_2:0 "Sudetendeutsches Freikorps operates in Czechoslovakia."
 czke.6.t:0 "Mobilization!"
 czke.6.d:0 "Czechoslovak leadership rejects the British-French suggestion for [CZE.GetNameDef] to cede the Sudetenland to Czechoslovakia.\n\nA state of emergency and general mobilization were declared soon after. The mobilization order applied to about 1,250,000 soldiers, including reservists called up earlier for various exercises.\n\nResponse to the announcement of general mobilization was swift; first, reservists reported for duty just a few minutes after hearing the decree from the radio. The influx of soldiers increased rapidly in the following hours.\n\nThe army took control and guarded key strategic buildings during the night, and military units reformed to war organizations.\n\nCzechoslovakia was ready to defend its independence."
 czke.6.a:0 "Truth Prevails!"
 CZKE_mobilization_1938:0 "Mobilization."
 CZKE_mobilization_1938_desc:0 "Full Mobilization order was issued. Reservists are gathering at their units."
 CZKE_mobilisation_formation_template_tooltip_reward:0 "§OSpecial Bonus:§! New Division Template (§YMobilizační Těleso§! - Mobilised Formation)."

 CZKE_great_depression_aftermath:0 "Aftermath of the Great Depression"
 CZKE_great_depression_aftermath_desc:0 "Czechoslovakia inherited almost 70 percent of Austro-Hungarian industrial capacity, but in 1930 the Great Depression hit the young state with full force. It took years for the country to recover, but some companies expanded even during critical years."
 CZKE_great_depression_aftermath_tooltip_reward:0 "\n§YIndustry§! related §YResearch Bonus§!."
 czke.100.t:0 "Great Depression in Czechoslovakia"
 czke.100.d:0 "Czechoslovakia's solid industrial tradition dates back to the 19th century when Bohemia and Moravia were the economic heartlands of the Austro-Hungarian Empire.\n\nAfter World War I, the newly emerging independent state inherited the bulk of existing Austro-Hungarian industrial assets, and the industrialization continued even further during the interwar years.\n\nThe index of gross national product in 1929 exceeded that of 1913 by 52 points. Between the world wars, Czechoslovakia was among the ten largest industrialized economies and the world's seventh producer of armaments.\n\nA chronic problem throughout of interwar years, which had adverse national and political effects, was the economic and social heterogeneity of the Czechoslovak Republic. There were considerable differences in the economic structure of the Czech Lands and Slovakia. Until 1938, Slovakia and the significantly underdeveloped Carpathian Ruthenia was little more than an agrarian appendage of the Czech Lands, supplying it with raw materials.\n\nWith the onset of the world depression, the Czechoslovak economy suffered a setback from which it had barely recovered by 1937, primarily because of rearmament."
 czke.100.a:0 "The crisis is finally over."
 CZKE_support_consumer_goods_industry:0 "Support Consumer Goods Industry"
 CZKE_support_consumer_goods_industry_desc:0 "Czechoslovakia was always an export-oriented country. Before the Great Depression hit the country, the main exports included various food processing goods (sugar, beer, ham), glass, wood products, paper, textiles, clothing, shoes, and leather goods."
 CZKE_support_consumer_goods_industry_tooltip_reward:0 "\n§YCivilian Industry§!."
 czke.101.t:0 "The Bata Phenomenon"
 czke.101.d:0 "Tomas Bata, who had been manufacturing shoes since 1894, developed a large-scale manufacturing factory in Zlin, Moravia, using the mass production techniques of the Ford Motor Company and the tenets of Taylorism.\n\nHis firm became the largest exporter of shoes worldwide for almost the entire decade before World War II. After the tragic death of Tomas Bata in 1932, his half-brother, Jan Antonin Bata, took control of the company and, in the following years, gained the nickname "The King of The Shoes".\n\nWhen Bata's died in 1932, the company employed 16,560 people and maintained 1,645 shops and 25 enterprises. Following the plans laid down by his brother before his death, Jan Antonin Bata expanded the company more than six times its original size throughout Czechoslovakia and the world.\n\nCompany policy initiated under Tomas Bata was to set up villages around the factories for the workers and supply schools and welfare. These villages include, for example, Batadorp in the Netherlands, Batovany and Svit in Slovakia, Batov in the Czech Republic, Borovo-Bata (now Borovo Naselje) in Croatia, Bata Park in Switzerland (Möhlin), Bataville in France (Lorraine), Batawa in Canada, East Tilbury in England, Batapur in Pakistan and Batanagar and Bataganj in India. There was also a factory in Belcamp, Maryland, USA, northeast of Baltimore on U.S. Route 40 in Harford County.\n\nAs of 1934, the firm owned 300 stores in North America, a thousand in Asia, and more than 4.000 in Europe. In 1938, the Bata group employed just over 65.000 people worldwide, including 36% outside Czechoslovakia, and had stakes in the tanning, agriculture, newspaper publishing, railway, air transport, textile production, coal mining, and aviation industries."
 czke.101.a:0 "Our Customer - Our Master (Bata Motto)."
CZKE_highway_construction_project:0 "Améliorer les connexions autoroutières"
CZKE_highway_construction_project_desc:0 "En 1937, Jan Antonin Baťa publia un livre intitulé « Construisons un État pour 40 000 000 de personnes ». Il y décrivait ses visions pour le développement futur de la Tchécoslovaquie, notamment une connexion autoroutière traversant tout le pays de Cheb (Sudètes) à Chust (Ruthénie)."
CZKE_highway_construction_project_tooltip_reward:0 "Améliore l’§Yinfrastructure§! de la Tchécoslovaquie."

CZKE_prospect_new_resources:0 "Rechercher de nouvelles ressources"
CZKE_prospect_new_resources_desc:0 "Les ressources naturelles essentielles de la Tchécoslovaquie comprenaient le bois, la houille, la houille noire, le graphite et l’argile. Le minerai de fer était principalement extrait en Slovaquie, mais les gisements des autres métaux étaient relativement insignifiants.\n\nUn petit gisement de bauxite se trouvait à Rychnov en Bohême, et de petits gisements de pétrole de haute qualité étaient exploités depuis 1900 en Moravie du Sud."
CZKE_prospect_new_resources_tooltip_reward:0 "\n§YNouvelles ressources§! et §Ybonus de recherche§! lié à l’§Yindustrie§!."

czke.102.t:0 "Ressources minérales de la Tchécoslovaquie"
czke.102.d:0 "La Tchécoslovaquie disposait d’importantes quantités de charbon et de lignite. En 1935, le pays était le deuxième producteur mondial de houille brune et le septième de houille noire. Toutefois, à quelques exceptions près, comme l’uranium, le pays était relativement pauvre en ressources naturelles.\n\nLes minerais de fer, de cuivre et de manganèse étaient principalement extraits dans les montagnes Slovaques (Slovenské rudohorie), mais certains gisements métalliques se trouvaient aussi près de Prague et de Pilsen. De petits gisements de plomb, de zinc et de bauxite existaient en Bohême centrale. Le mercure, l’antimoine et l’étain étaient exploités dans les monts Métallifères (Krušné Hory), qui contenaient d’importants gisements d’uranium.\n\nLes gisements de pétrole et de gaz étaient modestes et localisés surtout en Moravie du Sud, mais leur production augmenta lentement avant la guerre. Durant la Seconde Guerre mondiale, la production pétrolière des puits moraves devint stratégique pour l’effort de guerre allemand et fut largement développée. La société DEA (Deutsche Erdöl A.G.) exploitait environ 1 200 puits autour de Hodonín.\n\nEn 1930, la société Franke et Scholz, qui possédait alors une usine de traitement de l’étain et du plomb, acquit une ancienne usine de lin à Friedland (Sudètes orientaux) et y établit une prospère usine de traitement des métaux non ferreux. L’entreprise fournissait des feuilles d’aluminium et de duralumin pour l’industrie aéronautique tchécoslovaque."
czke.102.a:0 "Chercher de nouveaux gisements."

CZKE_expand_heavy_industry:0 "Développer l’industrie lourde"
CZKE_expand_heavy_industry_desc:0 "Branche essentielle avec des équipements relativement modernes, la métallurgie constituait la base de l’industrie mécanique et électrique avancée, ainsi que de nombreuses autres industries dans la Tchécoslovaquie d’avant Munich."
CZKE_expand_heavy_industry_tooltip_reward:0 "\n§YNouvelles ressources§! (Acier)."

czke.103.t:0 "L’industrie sidérurgique tchécoslovaque"
czke.103.d:0 "Entre 1929 et 1937, un basculement de l’industrie légère vers l’industrie lourde s’opéra dans l’économie tchécoslovaque, en grande partie dû à l’augmentation de la production d’armement. Alors que l’extraction minière représentait en moyenne environ 11 % de la production industrielle totale entre 1923 et 1937, la part de la métallurgie passa de 5,4 % en 1923 à 8,4 % en 1937.\n\nUne structure monopolistique bien organisée à l’échelle nationale se développa dans la sidérurgie tchécoslovaque, probablement le cartel le plus étroit en matière de production d’acier au monde.\n\nLes plus grandes aciéries étaient représentées par le cartel regroupant les usines de Vitkovice à Ostrava, la Compagnie minière et métallurgique de Třinec, et la Compagnie sidérurgique de Prague à Kladno, connues sous le nom de « Big Three ».\n\nEn 1935, la Tchécoslovaquie se classait septième producteur d’acier en Europe et dixième au niveau mondial."
czke.103.a:0 "Développer les « Big Three »"

CZKE_eastern_urbanization:0 "Projet d’urbanisation de l’Est"
CZKE_eastern_urbanization_desc:0 "Entre 1918 et 1938, le gouvernement tchécoslovaque déploya de grands efforts pour développer les régions slovaques et ruthènes, et des milliers d’enseignants, policiers, fonctionnaires et entrepreneurs tchèques s’y installèrent."
CZKE_eastern_urbanization_tooltip_reward:0 "Augmente les §Yemplacements de construction§! en §YSlovaquie§! et en §YRuthénie carpathique§!."

CZKE_chemical_industry_development:0 "Développement de l’industrie chimique"
CZKE_chemical_industry_development_desc:0 "La Tchécoslovaquie possédait une industrie chimique respectable, principalement située dans le nord-ouest des Sudètes.\n\nLorsque l’Allemagne nazie annexa la Tchécoslovaquie, elle acheva la construction de raffineries de pétrole synthétique cruciales à Most (Brüx)."
CZKE_chemical_industry_development_tooltip_reward:0 "\n§YIndustrie civile§! et §Ybonus de recherche§! lié au §Ypétrole synthétique§!."

czke.104.t:0 "L’industrie chimique tchécoslovaque"
czke.104.d:0 "Les origines de l’industrie chimique tchèque remontent à 1856, avec la fondation à Vienne d’une société anonyme au palais du duc de Schwarzenberg. Un an plus tard, la production commença à Ústí nad Labem (Aussig). Cette société influença fortement la structure de l’industrie chimique bohémienne et du développement de la ville.\n\nElle devint finalement le principal concurrent de l’IG Farben allemande en Europe centrale et dans les Balkans, et le quatrième groupe chimique européen. La société d’Aussig représentait plus de 60 % de la production chimique tchèque.\n\nAvant 1938, IG Farben exerçait déjà une influence technique significative sur l’industrie chimique tchèque, avec la mise en place de cartels et de projets de raffineries synthétiques.\n\nPendant la Seconde Guerre mondiale, l’Allemagne, via la Sudetenländische Treibstoffwerke AG, acheva les travaux des raffineries de Most (Brüx), et la production de pétrole synthétique à partir de la houille commença en 1942. L’importance du site le fit bombarder à plusieurs reprises par les Alliés."
czke.104.a:0 "Développer l’industrie chimique."
CZKE_commercial_tyre_production:0 "Production commerciale de pneus"
CZKE_commercial_tyre_production_desc:0 "Le coût élevé du transport ferroviaire poussa la société Baťa à exploiter sa propre flotte de véhicules pour transporter ses marchandises par route. En 1934, afin de réduire le coût des importations de pneus pour cette flotte, l’entreprise décida de les produire elle-même."
CZKE_commercial_tyre_production_tooltip_reward:0 "\n§YIndustrie civile§! et §YNouvelles ressources§! (Caoutchouc)."

czke.105.t:0 "Origines de la société Barum"
czke.105.d:0 "La tradition de la production de pneus en Tchécoslovaquie fut établie par Tomáš Baťa au début des années 1930. L’équipement fut importé à Zlín, en Moravie, en janvier 1932, et en avril, le premier pneu 32x6 y fut moulé. Un an plus tard, Baťa construisit une nouvelle usine de pneus à Zlín, qui produisit 68 000 pneus de 43 tailles différentes dans la deuxième moitié de 1934. En 1935, l’usine doubla sa production, et les pneus Baťa furent montés sur toutes les voitures tchèques, limitant les importations étrangères. En 1939, Baťa produisait 250 000 pneus par an et lança la fabrication de courroies trapézoïdales, de tapis roulants et de caoutchouc technique.\n\nAprès la Seconde Guerre mondiale, la famille Baťa perdit le contrôle de l’entreprise lorsque l’État la saisit. La société Barum regroupa alors toutes les principales entreprises productrices de caoutchouc en Tchécoslovaquie."
czke.105.a:0 "Augmenter la production de pneus."

CZKE_support_strategic_industry:0 "Soutenir l’industrie stratégique"
CZKE_support_strategic_industry_desc:0 "De nombreuses petites entreprises industrielles faisaient de la Tchécoslovaquie un producteur diversifié, mais quelques grandes compagnies dominaient l’économie et revêtaient une importance stratégique."
CZKE_support_strategic_industry_tooltip_reward:0 "\n§YIndustrie militaire§!."

czke.106.t:0 "L’industrie de l’armement tchécoslovaque"
czke.106.d:0 "Les entreprises d’armement et de munitions tchécoslovaques jouaient un rôle vital dans l’économie, notamment grâce à leur impact positif sur la balance commerciale.\n\nČeská Zbrojovka (Zbrojovka Brno) était l’un des principaux acteurs dans ce domaine ; l’entreprise produisait aussi des automobiles et d’autres biens en plus des armes à feu traditionnelles.\n\nAprès la Grande Guerre, la société française Schneider Creusot devint l’actionnaire majoritaire des usines Škoda, ce qui entraîna une expansion rapide de leurs activités dans et hors du pays. Škoda se lança dans la production d’automobiles, d’avions, de chars et de véhicules blindés, tout en continuant sa production traditionnelle de canons, locomotives et machines lourdes. Vers 1930, elle employait près de 30 000 ouvriers.\n\nSon principal concurrent était ČKD, formé en 1927 par la fusion de deux sociétés plus petites : Českomoravská-Kolben (1896, spécialisée dans les machines hydrauliques) et Breitfeld-Danek (1854, spécialisée dans les machines minières et alimentaires). ČKD se développa rapidement avec la production de locomotives et de chars.\n\nL’ingénieur et entrepreneur tchèque Emil Kolben, fondateur et directeur de ČKD, fut destitué après l’occupation allemande, puis interné dans le camp de Theresienstadt où il mourut en 1943.\n\nSous l’occupation nazie, l’entreprise fut renommée BMM (Böhmisch-Mährische Maschinenfabrik AG) et fabriqua des armes pour la Wehrmacht, notamment les chars Panzer 38(t) et les chasseurs de chars Jagdpanzer 38(t)."
czke.106.a:0 "Subventionner l’industrie de l’armement."

CZKE_secure_arms_export_deals:0 "Sécuriser les contrats d’exportation d’armes"
CZKE_secure_arms_export_deals_desc:0 "La Tchécoslovaquie fut longtemps l’un des principaux exportateurs mondiaux d’armes vers les pays en développement. La vente d’armes permettait de dégager des profits, de stimuler l’économie industrielle et d’entretenir des relations politiques avec les pays acheteurs."
CZKE_secure_arms_export_deals_tooltip_reward:0 "\n§YRecherche§! et §Ycommerce§! liés à une §Yidée nationale§!."

czke.107.t:0 "Exportations d’armement tchécoslovaques"
czke.107.d:0 "La Tchécoslovaquie fut longtemps l’un des principaux exportateurs mondiaux d’armes vers les pays en développement. Cela lui permettait de dégager des bénéfices, de soutenir son économie industrielle et de tisser des liens politiques avec ses partenaires.\n\nDès les années 1920, Zbrojovka Brno et Škoda furent des acteurs majeurs, coordonnant leurs exportations sous forme de cartel. Les chars ČKD (notamment les variantes de la série TNH) furent exportés dans le monde entier, puis limités aux alliés de l’Axe pendant la guerre. Sous l’occupation, l’Allemagne utilisa la puissante industrie d’armement tchécoslovaque pour son effort de guerre.\n\nL’exportation ne se limitait pas aux livraisons : la Tchécoslovaquie vendait aussi des licences de production. Le célèbre fusil-mitrailleur britannique Bren était une version sous licence du ZB vz. 26 tchécoslovaque (ZGB-33 modifié). Le même modèle fut licencié au Japon (Type 97). La mitrailleuse BESA britannique provenait du ZB-53 (TK vz. 37).\n\nIronie du sort, de nombreuses armées utilisèrent des armes d’un pays que la France et le Royaume-Uni avaient sacrifié à Munich, ces armes étant employées des deux côtés du conflit mondial.\n\nLe gouvernement tchécoslovaque joua un rôle crucial dans l’obtention de contrats et d’accords de production sous licence."
czke.107.a:0 "Obtenir de nouveaux contrats d’exportation d’armes."

CZKE_armament_exports_idea:0 "Exportations d’armement"
CZKE_armament_exports_idea_desc:0 "La Tchécoslovaquie exportait souvent des armes via des accords de production sous licence, incluant parfois son savoir-faire industriel."

CZE_liechtenstein_properties:0 "Biens du [LIE.GetNonIdeologyName]"

CZKE_explosives_production:0 "Développer l’industrie des explosifs"
CZKE_explosives_production_desc:0 "La Tchécoslovaquie possédait une longue tradition dans la fabrication d’explosifs, qui se poursuivit bien après la Seconde Guerre mondiale. Le Semtex, explosif plastique inventé à l’époque de la guerre froide, en est probablement le plus célèbre exemple."
CZKE_explosives_production_tooltip_reward:0 "\n§YIndustrie civile§! OU §Yindustrie militaire§! avec §Ybonus de recherche§! lié à l’§Yartillerie§!."

CZKE_skoda_naval_artillery_experience:0 "Expérience navale de Škoda"
CZKE_skoda_naval_artillery_experience_desc:0 "Škoda avait conçu les canons de la marine austro-hongroise ; il est temps de remettre cette expérience à profit."
CZKE_cvut:0 "Université Technique Tchèque"
CZKE_cvut_desc:0 "L’Université Technique Tchèque de Prague (ČVUT) est l’une des plus grandes universités de la République tchèque et le plus ancien institut de technologie d’Europe centrale."
CZKE_cvut_tooltip_reward:0 "\nObtient §G1§! emplacement de recherche."
czke.109.t:0 "Université Technique Tchèque de Prague"
czke.109.d:0 "Par décret du Ministère de l’Éducation et de l’Illumination Nationale de la République tchécoslovaque en 1920, l’Université Technique Tchèque de Prague vit le jour comme une union de sept écoles techniques :\n\n- Génie civil\n- Génie culturel\n- Architecture et génie structurel\n- Génie mécanique et électrique\n- Génie chimique et technologique\n- Génie agricole et forestier\n- et Sciences spéciales.\n\nParmi les anciens étudiants notables de l’université :\n\n- Christian Doppler (mathématicien et physicien)\n- František Křižík (inventeur tchèque, ingénieur électricien et entrepreneur)\n- Simon Wiesenthal (chasseur de nazis d’après-guerre et écrivain)\n- Vladimir Prelog (chimiste et lauréat du Prix Nobel 1975)\n- George Klir (informaticien et spécialiste des systèmes)\n\nSur décision de Konstantin von Neurath, Reichsprotektor de Bohême-Moravie, les universités tchèques (dont le ČVUT) furent fermées le 17 novembre 1939.\n\nPendant cette période, un total de 15 172 étudiants ne purent terminer leurs études, et 513 professeurs, 475 professeurs associés et 345 autres enseignants perdirent leur emploi. Certains étudiants tentèrent de poursuivre leurs études dans des universités allemandes, mais furent en général refusés."
czke.109.a:0 "Financer de nouveaux programmes de recherche."
CZKE_commercial_uranium_mining:0 "Exploitation minière de l’uranium"
CZKE_commercial_uranium_mining_desc:0 "La Tchécoslovaquie est le berceau de l’exploitation industrielle de l’uranium. Celle-ci commença à Jáchymov (alors Joachimsthal, en Autriche-Hongrie) dans les années 1890, après le déclin de la production d’argent et de cobalt."
CZKE_commercial_uranium_mining_tooltip_reward:0 "\n§YIndustrie civile§! OU bonus de recherche lié à la §Ytechnologie nucléaire§!."
czke.110.t:0 "L’uranium à Jáchymov"
czke.110.d:0 "Au début du XIXe siècle, le minerai d’uranium était récupéré comme sous-produit de l’exploitation minière en Saxe, en Bohême et en Cornouailles. La première exploitation volontaire de minerais radioactifs eut lieu à Jáchymov (alors Joachimsthal), une ville minière d’argent en Autriche-Hongrie. Marie Curie utilisa la pechblende de Jáchymov pour isoler le radium, produit de décomposition de l’uranium.\n\nJusqu’à la Seconde Guerre mondiale, l’exploitation d’uranium se faisait principalement pour son contenu en radium. Le radium contenu dans le minerai d’uranium servait à fabriquer des peintures lumineuses pour les cadrans de montre et autres instruments, ainsi qu’à des applications médicales dont certaines se révélèrent nocives. L’uranium, sous-produit, servait surtout de pigment jaune.\n\nLa partie occidentale du pays attira l’attention des puissances mondiales peu après la guerre : le paysage autour de Jáchymov devint le centre mondial de l’exploitation de l’uranium. C’était le seul endroit où l’Union soviétique pouvait se procurer immédiatement du minerai et commencer le développement d’armes nucléaires, surtout après Hiroshima et Nagasaki. Ainsi, la Tchécoslovaquie devint la principale source d’uranium pour l’URSS après la guerre.\n\nAprès la prise de pouvoir du Parti communiste en 1948, de grands camps de prisonniers furent établis à Jáchymov et aux alentours. Les opposants au régime furent contraints de travailler dans des conditions très dures, et l’espérance de vie moyenne y tomba à 42 ans. Finalement, l’exploitation de l’uranium cessa en 1964."
czke.110.a:0 "Vendre l’uranium aux alliés."
czke.110.b:0 "Conserver l’uranium et lancer un programme nucléaire."
CZKE_nuclear_physics_institute:0 "Institut de Physique Nucléaire"
CZKE_nuclear_physics_institute_desc:0 "L’Institut de Physique Nucléaire de l’Académie tchécoslovaque des sciences fut fondé bien après la Seconde Guerre mondiale, en 1955. Mais peut-être qu’avec une autre évolution historique, la recherche atomique aurait commencé bien plus tôt en Tchécoslovaquie."
CZKE_rocket_research:0 "Recherche sur les fusées"
CZKE_rocket_research_desc:0 "Les moteurs fusées et à réaction permettent des vitesses inédites pour les engins habités comme non-habités. Être pionnier dans ces technologies nous permettra de surprendre l’ennemi."

CZKE_ministry_of_defense:0 "Réorganiser le Ministère de la Défense Nationale"
CZKE_ministry_of_defense_desc:0 "Le Ministère de la Défense Nationale était chargé des préparatifs de mobilisation selon les directives du haut commandement, de la gestion des approvisionnements et de la coordination du programme de réarmement."
CZKE_ministry_of_defense_tooltip_reward:0 "\nConseiller §YHaut Commandement Militaire§! gratuit OU §YPouvoir politique§!."
czke.200.t:0 "Ministère de la Défense Nationale"
czke.200.d:0 "Le Ministère de la Défense Nationale (MDN) s’occupait de toutes les affaires liées à la montée en puissance militaire, à son soutien et à ses besoins. Surtout dans ses premières années, il subit de fréquents changements organisationnels, atteignant sa forme définitive en 1927.\n\nLes unités centrales du MDN étaient des départements responsables d’une branche particulière des forces armées et de l’administration. Ils s’occupaient aussi de la préparation organisationnelle et de la mobilisation selon les directives de l’État-Major, procuraient armes et matériel, contrôlaient leur gestion et tenaient les registres.\n\nDans les années 1930, la mission principale était de sécuriser la défense de l’État face à la menace allemande, tout en assurant des fonds suffisants malgré la crise économique et la stagnation du marché.\n\nUn poste crucial était celui d’Inspecteur Général des troupes tchécoslovaques, directement subordonné au ministre. Ses activités comprenaient l’inspection, le contrôle de la discipline, l’application des règlements, et furent considérablement élargies en 1937.\n\nLe général Jan Syrový, vétéran et ancien chef d’État-Major, fut nommé Inspecteur Général en 1933 et resta en poste jusqu’en 1938. Durant la Première Guerre mondiale, il combattit dans les Légions tchécoslovaques de l’armée russe et perdit son œil droit à Zborov. À la fin de la guerre, il commandait les Légions et les forces anti-bolcheviques sur le Transsibérien."
czke.200.a:0 "Étendre la juridiction de l’Inspecteur Général."
czke.200.b:0 "Nous devons nous concentrer sur d’autres priorités."
CZKE_ministry_of_national_defense:0 "Réorganisation du Ministère de la Défense Nationale"
CZKE_rop:0 "Allouer des fonds au ŘOP"
CZKE_rop_desc:0 "Les préparatifs pour le développement des fortifications permanentes tchécoslovaques remontent à 1934. Les projets furent confiés à la Direction des Travaux de Fortification (ŘOP). Le général Karel Husárek dirigea ces travaux pendant toute leur durée."
CZKE_rop_tooltip_reward:0 "\n §OBonus spécial :§! Lance la chaîne d’événements §YLigne Beneš§! pour les fortifications frontalières.\n\nAchever toute la chaîne fournit jusqu’à §YNiveau 5§! de forts dans certaines régions."
CZKE_rop_idea:0 "Direction des Travaux de Fortification - ŘOP"
CZKE_rop_idea_desc:0 "Des fonds furent alloués au ŘOP et les travaux progressent comme prévu."
czke.201.t:0 "La Ligne Beneš"
czke.201.d:0 "La perspective d’une guerre contre l’Allemagne ne surprit pas le gouvernement tchécoslovaque des années 1930. Prague se préparait sérieusement depuis des années : entre 1936 et 1938, plus de la moitié des dépenses gouvernementales furent militaires. Une grande part alla à la construction d’un système élaboré de bunkers et de défenses dans les Sudètes, région frontalière avec l’Allemagne.\n\nLa frontière germano-tchécoslovaque mesurait 1545 km, et après l’Anschluss de 1938, elle monta à 2103 km.\n\nSur recommandation de la France, il fut décidé de construire un système gigantesque de fortifications le long de la frontière et à l’intérieur du pays. Mais à cause de la longueur extrême de la frontière et de la forme stratégique défavorable de la Tchécoslovaquie, il fut impossible de financer une ligne continue de fortifications lourdes."
czke.201.a:0 "Commencer la construction de la ligne Odra-Krkonoše"
CZKE_phase_one_tooltip:0 "\n Construction de §Y8§! §Yzones fortifiées (niv. 2)§! le long de la frontière nord avec l’Allemagne (durée estimée : §Y180 jours§!)."
czke.202.t:0 "La Tchécoslovaquie lance un projet de fortifications frontalières"
czke.202.d:0 "Suite aux tensions accrues avec l’Allemagne, le gouvernement tchécoslovaque, sur recommandation de la France, initia la construction d’un vaste système de fortifications dans les Sudètes afin de protéger la frontière nord-ouest contre une éventuelle agression allemande.\n\nDes sources allemandes indiquent que Hitler est furieux et abordera ce sujet au prochain congrès du parti à Nuremberg."
czke.202.a:0 "Intéressant."
czke.203.t:0 "Construction de forts légers"
czke.203.d:0 "Le commandement de l’armée tchécoslovaque avait besoin d’un meilleur type de fort léger, et un nouveau modèle appelé Mark 37 fut conçu, en fait un mini-fort lourd. Ce type tirait presque uniquement sur les flancs. Très peu avaient une embrasure pour le tir frontal, et ceux qui en avaient étaient placés en revers de pente pour éviter d’être pris sous le feu direct à longue distance. Ils étaient incapables de se défendre frontalement et dépendaient de leurs voisins ou du feu depuis des positions ouvertes."
czke.203.a:0 "Prioriser la frontière ouest."
czke.203.b:0 "Prioriser la frontière sud."
czke.203.c:0 "Annuler le projet."
CZKE_phase_two_w_tooltip:0 "\n Construction de §Y8§! §Yzones fortifiées (niv. 2)§! le long de la frontière ouest avec l’Allemagne (durée estimée : §Y180 jours§!)."
CZKE_phase_two_s_tooltip:0 "\n Construction de §Y9§! §Yzones fortifiées (niv. 1-2)§! le long de la frontière sud avec les régions ex-austro-hongroises (durée estimée : §Y180 jours§!)."
CZKE_phase_two_stop_tooltip:0 "Le projet de fortifications frontalières sera §Yannulé§! et aucune autre construction n’aura lieu."
czke.204.t:0 "Construction de forts lourds"
czke.204.d:0 "La Tchécoslovaquie construisit des forts lourds près de la frontière avec l’Allemagne et en Slovaquie, près de la frontière hongroise. Ils étaient destinés à stopper les principales attaques de chars et d’infanterie ennemies.\n\nLes blockhaus étaient construits en chaînes, espacés de 300 à 600 m. À certains endroits, la Tchécoslovaquie érigea des forteresses d’artillerie pour fournir un appui aux chaînes de forts indépendants. Environ 250 blockhaus furent construits entre 1935 et [GetDateText]. Chaque fort était conçu individuellement, si bien qu’il y eut autant de variantes que de forts, mais on peut les classer par fonctions, formes ou classes de résistance. Les premiers furent influencés par les types français, mais par la suite un nouveau modèle, mieux adapté à la défense tchèque, fut adopté."
czke.204.a:0 "Commencer la construction de casemates lourdes."
CZKE_phase_three_tooltip:0 "\nConstruction de §Y6§! §Ycasemates lourdes (niv. 3)§! aux points les plus critiques de la frontière allemande (durée estimée : §Y365 jours§!)."
czke.204.b:0 "Poursuivre le projet pendant §G1§! an supplémentaire."
czke.204.c:0 "Arrêter le projet."
czke.205.t:0 "Poursuivre les travaux sur les forts légers"
czke.205.d:0 "La Direction des Travaux de Fortification rapporte que les travaux de construction avancent comme prévu. Devons-nous attribuer de nouveaux contrats et allouer davantage de fonds au projet ?"
czke.205.a:0 "Poursuivre le projet de construction."
czke.205.b:0 "Annuler le projet."
czke.206.t:0 "Rapport de la Direction des Travaux de Fortification"
czke.206.d:0 "La Direction des Travaux de Fortification rapporte que tous les projets prévus seront bientôt terminés. Voulez-vous prolonger le mandat du ŘOP ou annuler le projet ?"
czke.206.a:0 "Continuer le projet."
czke.206.b:0 "Annuler le projet."
CZKE_phase_four_tooltip:0 "Le projet continuera (vous conserverez une variante limitée de l’§YIdée nationale§!) pendant §Y1 an§!, mais aucun nouveau bunker gratuit ne sera construit."
CZKE_rop2_idea:0 "Direction des Travaux de Fortification - ŘOP"
CZKE_rop2_idea_desc:0 "Des fonds supplémentaires ont été alloués au ŘOP pour les futurs travaux de construction."
CZKE_engineer_corps:0 "Formation du corps du génie"
CZKE_engineer_corps_desc:0 "Les unités du génie furent essentielles pour le projet de fortification et reçurent donc la meilleure formation et le meilleur équipement."
CZKE_military_education:0 "Soutenir l’éducation militaire"
CZKE_military_education_desc:0 "Plusieurs écoles et académies militaires fonctionnaient en Tchécoslovaquie avant-guerre et furent fortement influencées par la mission militaire française."
CZKE_military_education_tooltip_reward:0 "\n Choix entre trois §YIdées nationales§! liées au §Ymilitaire§!."
czke.207.t:0 "Histoire de l’éducation militaire en Tchécoslovaquie"
czke.207.d:0 "Dans le cadre de la mission militaire française, un nouveau collège de guerre pour officiers (plus tard connu sous le nom de Vysoká škola Válečná - VŠV) de l’État-Major général fut fondé le 1er novembre 1921 à Prague. Il fut calqué sur le Collège de Guerre de Paris, et dans les cercles tchèques, on le surnommait souvent la « petite sœur ». Grâce à l’intérêt exceptionnel de la mission française, le niveau d’enseignement atteignit rapidement celui d’écoles étrangères beaucoup plus anciennes.\n\nLa forme définitive de la VŠV fut établie en 1934, et le général Mikuláš Doležal en fut le dernier commandant jusqu’à l’occupation en 1939. Les nazis l’exécutèrent en 1941 pour sa participation à l’organisation de résistance clandestine « Obrana Národa ».\n\nPendant toute son existence, un total de 577 officiers (dont 22 Lituaniens) furent diplômés du collège, et 269 généraux et hauts commandants de l’armée tchécoslovaque participèrent à ses cours d’information.\n\nL’enseignement supérieur était représenté par l’Académie militaire (Vojenská Akademie - VA) de Hranice. Fondée le 3 janvier 1920, sa mission consistait à former des officiers (lieutenants) pour toutes les branches de l’armée tchécoslovaque. D’ici 1938, des milliers d’officiers, dont de futurs généraux, en sortirent diplômés.\n\nLe niveau intermédiaire était assuré par les écoles d’officiers de réserve (Školy Důstojníků v Záloze - ŠDZ), organisées au sein des états-majors divisionnaires et destinées à la formation d’officiers pour les postes de commandement inférieurs.\n\nLes spécialistes militaires étaient formés dans des écoles spécialisées : infanterie, artillerie, aviation, cavalerie, génie, transmissions, armement, et à partir de 1933 l’École des troupes blindées (Škola Útočné Vozby). Les diplômés de programmes spéciaux de sous-officiers complétaient le corps des sergents."
czke.207.a:0 "Ouvrir de nouveaux cours militaires au Collège de guerre."
czke.207.b:0 "Augmenter la capacité de formation de l’Académie militaire."
czke.207.c:0 "Étendre les programmes de formation des sous-officiers."
CZKE_generals_idea:0 "Cours du Collège de guerre"
CZKE_generals_idea_desc:0 "De nouveaux cours pour officiers supérieurs sont disponibles au Collège de guerre."
CZKE_officers_idea:0 "Diplômés de l’Académie militaire"
CZKE_officers_idea_desc:0 "De nouveaux officiers sortent diplômés de l’Académie."
CZKE_ncos_idea:0 "Corps de sergents formés"
CZKE_ncos_idea_desc:0 "Des programmes de formation pour les sergents ont été mis en place."
CZKE_border_brigades:0 "Former des brigades frontalières"
CZKE_border_brigades_desc:0 "Nous devons former des régiments de garnison hautement entraînés pour nos ouvrages fortifiés frontaliers."
CZKE_border_brigades_tooltip_reward:0 "\n §OBonus spécial :§! Nouveau modèle de division (§YHraničářská Brigáda§! - Brigade de garnison d’élite)."
czke.208.t:0 "Fondation des régiments frontaliers"
czke.208.d:0 "L’armée tchécoslovaque ne possédait pas de véritables divisions d’élite entre 1918 et 1939. Les troupes les plus proches de ce statut furent les régiments frontaliers destinés à garnir les fortifications lourdes.\n\nLes premiers régiments frontaliers (appelés Hraničářské Pluky en tchèque) furent formés à l’été [GetDateText] à partir de bataillons de garde chargés de sécuriser et protéger les fortifications nouvellement construites le long de la frontière allemande. Les unités existantes furent renforcées par des hommes provenant principalement des régiments d’infanterie et des bataillons du génie, d’artillerie et de transmissions.\n\nSeuls les soldats les plus aptes physiquement furent sélectionnés, et tous devaient être d’excellents tireurs, aussi bien au fusil qu’à la mitrailleuse.\n\nLe facteur le plus crucial restait cependant la fiabilité politique : la grande majorité des hommes étaient tchèques ou slovaques, car la loyauté des autres nationalités ne pouvait pas toujours être garantie, bien que des exceptions existassent.\n\nLes candidats devaient suivre un entraînement exigeant sur l’utilisation d’équipements variés : canon antichar vz. 36, mitrailleuses et autres armes utilisées dans les fortifications lourdes.\n\nLes membres des régiments frontaliers arboraient des épaulettes distinctives avec une tête de chien et le numéro de leur régiment dans un triangle."
czke.208.a:0 "Former des brigades frontalières."
CZKE_mobile_army:0 "Former des divisions rapides"
CZKE_mobile_army_desc:0 "L’armée tchécoslovaque avait des projets de motorisation, mais le coût énorme des fortifications limita le budget pour de nouveaux camions."
CZKE_mobile_army_tooltip_reward:0 "\n §OBonus spécial :§! Nouveau modèle de division (§YRychlá Divize§! - Division légère de chars)."
czke.209.t:0 "Divisions rapides tchécoslovaques"
czke.209.d:0 "Les divisions rapides furent créées à l’automne 1937 pour des opérations nécessitant vitesse, agilité et grande puissance de frappe. Elles combinaient cavalerie, unités motorisées et mécanisées, adaptées aux conditions tchécoslovaques. Ce fut la dernière réorganisation des unités mobiles avant-guerre.\n\nLes brigades de cavalerie (Jezdecké Brigády) et blindées (Brigády Útočné Vozby) furent intégrées aux divisions rapides.\n\nSeules quatre divisions furent créées avant l’occupation : à Prague (1re), Brno (2e), Bratislava (3e) et Pardubice (4e). Les 1re, 2e et 4e furent dissoutes en juillet 1939, tandis que la 3e resta opérationnelle dans la nouvelle armée slovaque.\n\nLes chars légers LT vz. 35 étaient la colonne vertébrale de ces divisions, avec environ 300 exemplaires répartis entre les trois premières. Les Allemands en capturèrent 244, 52 furent transférés à la Slovaquie, dont deux finirent entre les mains des Hongrois pendant la guerre slovaquo-hongroise de mars 1939."
czke.209.a:0 "Former des divisions rapides."
CZKE_new_doctrines:0 "Étudier les doctrines militaires récentes"
CZKE_new_doctrines_desc:0 "L’armée tchécoslovaque doit adopter les dernières tendances doctrinales et appliquer des méthodes modernes d’entraînement et d’organisation."
CZKE_military_science_institute:0 "Institut de science militaire"
CZKE_military_science_institute_desc:0 "L’Institut de science militaire tchécoslovaque (Vědecký Ústav Vojenský - VÚV) fut créé dans les années 1920 à partir de l’Union scientifique des officiers tchécoslovaques."
CZKE_military_science_institute_tooltip_reward:0 "\n§YIdée nationale§! liée à la §Yrecherche§!."
czke.210.t:0 "Institut de science militaire tchécoslovaque"
czke.210.d:0 "L’Institut de science militaire tchécoslovaque (Vědecký Ústav Vojenský - VÚV) fut établi dans les années 1920 à partir de l’Union scientifique des officiers. Il changea plusieurs fois de nom, avant de devenir VÚV. L’institut joua un rôle crucial dans le développement de la stratégie et de la théorie militaires pour l’armée et le Ministère de la Défense. L’Union des officiers continua comme éditeur, plateforme d’échanges d’idées militaires et politiques.\n\nLes généraux tchécoslovaques d’avant-guerre étaient connus pour leurs publications, dont certaines portaient sur des questions militaires ou politiques, mais aucune n’eut l’influence d’« Achtung - Panzer ! » de Guderian.\n\nLe général Silvestr Bláha, chef du bureau militaire de la présidence, dirigea également l’Institut à partir de 1932 et se fit remarquer par son intense activité éditoriale."
czke.210.a:0 "Augmenter le financement de l’Institut de science militaire."
CZKE_military_science_institute_idea:0 "Institut de science militaire"
CZKE_military_science_institute_idea_desc:0 "Des fonds sécurisés pour l’Institut de science militaire."
CZKE_armament_program:0 "Lancer le programme d’armement"
CZKE_armament_program_desc:0 "La situation matérielle défavorable de l’armée obligea le gouvernement à prendre le problème au sérieux. Après de longues négociations, il adopta en 1936 un programme d’armement définissant priorités et délais pour fournir divers équipements."
CZKE_armament_program_tooltip_reward:0 "\n§YLoi économique§! OU §YPouvoir politique§!."
czke.211.t:0 "Lancer le programme d’armement"
czke.211.d:0 "Le programme d’armement de l’armée tchécoslovaque devint crucial lors de la crise de sécurité collective après la remilitarisation de la Rhénanie par l’Allemagne en 1936.\n\nAu printemps 1936, le Ministère de la Défense prépara les exigences et détails du programme. Ce fut le projet d’investissement militaire le plus important depuis 1918. Il imposait les priorités d’armement et leur calendrier de livraison.\n\nIl devint rapidement évident que les délais ne pourraient être tenus, et fin 1938, seuls 32% des livraisons avaient été effectuées.\n\nNéanmoins, cet effort modernisa sensiblement les capacités de l’armée tchécoslovaque. En 1937, les dépenses de défense représentaient près de 10% du PIB, et en 1938 environ 15%.\n\nLe IIe Département (Artillerie et armement) du Ministère de la Défense, dirigé par le général Jan Netík, influença fortement l’ampleur et la réalisation du programme."
czke.211.a:0 "Approuver le programme d’armement."
CZKE_czechoslovak_firearms:0 "Moderniser l’équipement d’infanterie"
CZKE_czechoslovak_firearms_desc:0 "Bien que la Tchécoslovaquie ait été un exportateur d’armes majeur, l’armée adopta très lentement de nouvelles armes d’infanterie. Mais une fois le programme de réarmement lancé, de grosses commandes de fusils et mitrailleuses modernes furent passées."
CZKE_czechoslovak_firearms_tooltip_reward:0 "\n Choix entre bonus de recherche lié à l’§Yéquipement d’infanterie§! ou à l’§Yéquipement de soutien§!."
czke.212.t:0 "Armes tchécoslovaques"
czke.212.d:0 "Bien que la Tchécoslovaquie ait été un important exportateur d’armes depuis plus d’une décennie, l’armée tchécoslovaque adopta assez lentement les nouvelles armes d’infanterie modernes avant 1936. Mais tout changea avec le lancement du programme de réarmement : de grosses commandes de fusils et de mitrailleuses modernes furent émises. Au moment de Munich, la Tchécoslovaquie possédait l’une des armées les mieux équipées du monde et, semble-t-il, le plus haut ratio d’armes automatiques par soldat (1/7).\n\nLe fusil vz.24, basé sur le fiable modèle Mauser (7,92 mm), était l’arme standard de l’infanterie tchécoslovaque et plus tard aussi des unités du SOS (Garde de Défense de l’État). Fabriqué par Zbrojovka Brno, il existait déjà [GetDateText] 762 000 fusils vz.24 prêts pour la mobilisation avec 424,9 millions de cartouches, plus 141,7 millions stockées par le ŘOP pour les fortifications frontalières.\n\nL’ancêtre de la célèbre mitrailleuse Bren, la mitrailleuse ZB vz.26 (7,92 mm), était l’arme standard pour les unités de soutien d’infanterie ainsi que pour les fortifications légères et lourdes. Conçue par V. Holek au début des années 1920, l’arme (ou sa version sous licence) fut exportée vers plusieurs pays, dont le Royaume-Uni et la Chine. En 1936, l’armée disposait de 34 557 exemplaires, et plusieurs milliers furent commandés pour les fortifications.\n\nLa mitrailleuse lourde TK vz.37, perfectionnement du modèle vz.35, était utilisée comme arme de soutien de section, comme mitrailleuse montée sur chars et véhicules blindés, ou sur positions fixes dans les fortifications frontalières. Comme la plupart des armes tchèques, elle utilisait des munitions de 7,92 mm pour faciliter l’approvisionnement et le stockage dans les forts. Une version sous licence fut produite au Royaume-Uni sous le nom de mitrailleuse Besa.\n\nPour une raison obscure, le haut commandement ne montra aucun intérêt à introduire des pistolets-mitrailleurs, bien qu’un prototype moderne – plus tard connu sous le nom de Samopal vz.38 – existât dès 1937.\n\nPresque tout cet équipement fut « acheté » (en réalité volé) par les Allemands après l’occupation de 1939 et, selon des estimations modestes, permit d’équiper environ la moitié de la Wehrmacht. Une grande partie fut distribuée aux divisions SS."
czke.212.a:0 "Moderniser les armes standard."
czke.212.b:0 "Commander des mitrailleuses lourdes."
CZKE_holek_brothers:0 "Concevoir de nouvelles armes à feu"
CZKE_holek_brothers_desc:0 "Les frères Holek conçurent la plupart des armes tchécoslovaques avancées, produites sous licence dans le monde entier pendant leur emploi chez Zbrojovka Brno."
CZKE_holek_brothers_tooltip_reward:0 "\n§YThéoricien§! lié aux armes à feu."
firearms_designer:0 "Concepteur d’armes à feu"
czke.213.t:0 "Les frères Holek"
czke.213.d:0 "La plupart des armes tchécoslovaques d’avant-guerre furent conçues par une seule famille : les frères Holek.\n\nL’aîné, Václav Holek, se spécialisa dans les mitrailleuses et conçut les modèles qui devinrent les Bren et Besa produits sous licence britannique.\n\nLe cadet, Emanuel Holek, conçut plusieurs fusils semi-automatiques, dont le ZH-29 utilisé par l’Armée nationale révolutionnaire chinoise.\n\nLe benjamin, František Holek, ne conçut pas d’arme spécifique, mais ses compétences techniques permirent au trio de concrétiser de nombreux projets produits ensuite par Zbrojovka Brno.\n\nMalheureusement, la Seconde Guerre mondiale interrompit leurs carrières prometteuses ; bien que leurs descendants aient poursuivi l’héritage familial, les créations se limitèrent aux fusils de chasse et de sport."
czke.213.a:0 "Commander de nouveaux prototypes d’armes."
CZKE_armament_1:0 "Livraisons d’armes et de munitions"
CZKE_armament_1_desc:0 "La Tchécoslovaquie était un grand exportateur d’armes, et la production nationale suffisait largement à couvrir les besoins militaires avant 1936. Mais avec l’augmentation des commandes, il fallut agrandir les usines existantes."
CZKE_armament_1_tooltip_reward:0 "\nBonus lié à l’§Yindustrie militaire§! et à l’§Yéquipement d’infanterie§!."
czke.214.t:0 "Sécuriser les livraisons d’armes"
czke.214.d:0 "Dans les années 1930, les armes tchécoslovaques furent vendues et exportées dans le monde entier, surtout vers la Petite Entente (Roumanie et Yougoslavie) ainsi que vers les pays baltes, d’Amérique latine et d’Asie. La Tchécoslovaquie figurait parmi les six plus grands exportateurs d’armes bien avant la Seconde Guerre mondiale.\n\nPendant longtemps, l’industrie tchécoslovaque put facilement satisfaire les besoins nationaux tout en exportant une grande quantité de matériel. Mais lorsque le ministère de la Défense nationale augmenta ses commandes, les principales entreprises manquèrent de capacité et durent construire de nouvelles usines.\n\nČeská Zbrojovka ouvrit une filiale à Uherský Brod en 1936, et l’usine fut construite en seulement 16 semaines. La ČZUB fabriqua une large gamme d’armes légères, y compris plusieurs modèles devenus célèbres après-guerre.\n\nEn 1936, Sellier & Bellot transféra toute sa production à Vlašim, où un complexe était en construction depuis 1934. Quand une commande du ministère arriva en 1938, il fut décidé d’ériger une nouvelle usine en Slovaquie (Porúbka), mais le projet fut stoppé après l’Accord de Munich.\n\nL’escalade du conflit sino-japonais fut une aubaine pour les entreprises tchécoslovaques, en particulier Česká Zbrojovka. Selon les archives britanniques, plus de la moitié des mitrailleuses transitant par Hong Kong fin 1938 et destinées à la Chine étaient d’origine tchécoslovaque (environ un tiers pour les fusils d’infanterie).\n\nEn outre, en 1937 Sellier & Bellot reçut une commande de 200 millions de cartouches de 7,92 mm Mauser de la Chine, mais le contrat ne fut pas finalisé avant le déclenchement de la guerre."
czke.214.a:0 "Étendre Česká Zbrojovka."
czke.214.b:0 "Étendre Sellier & Bellot."
CZKE_zbrojovka:0 "S & B"
CZKE_zbrojovka_desc:0 "Usine moderne de munitions à Vlašim – Bohême."
czub:0 "ČZUB"
czub_desc:0 "Société d’armement d’Uherský Brod, filiale de Česká Zbrojovka."
CZKE_armament_2:0 "Sécuriser les contrats d’armement"
CZKE_armament_2_desc:0 "La Tchécoslovaquie s’appuyait traditionnellement sur ses entreprises nationales pour fournir armes et équipements.\n\nŠkoda et ČKD exportaient déjà armes modernes et chars, mais avant 1936 aucun effort n’avait été fait pour moderniser l’armée."
CZKE_armament_2_tooltip_reward:0 "\n§YIdée nationale§! liée à l’§Yindustrie militaire§! et à la §Yproduction militaire§!."
czke.215.t:0 "Contrats de l’industrie d’armement"
czke.215.d:0 "La Tchécoslovaquie s’appuyait traditionnellement sur ses entreprises nationales pour fournir armes et équipements.\n\nŠkoda et ČKD exportaient dans le monde entier des armes modernes, y compris des chars, obusiers et canons de montagne avancés. Mais avant 1936, aucune incitation n’existait pour moderniser l’armée.\n\nTout changea avec l’occupation de la Rhénanie en 1936 : des contrats furent signés avec presque toutes les entreprises du secteur. Le programme fut élargi : d’ici 1942, l’armée devait disposer de 1050 chars, 2420 canons de campagne, 680 mortiers, 1740 canons antichars, près de 700 canons antiaériens et 850 avions.\n\nSelon le ministère, la capacité mensuelle de l’industrie en 1938 était d’environ 40 000 fusils, 3000 mitrailleuses, 130 canons de campagne, 50 à 60 chars et 100 avions.\n\nŠkoda et ČKD avaient généralement un accord de cartel, se partageant les commandes, mais il fallait fixer des priorités."
czke.215.a:0 "Donner la priorité aux nouveaux canons de campagne."
czke.215.b:0 "Donner la priorité aux nouveaux chars."
CZKE_skoda_works:0 "Škoda Works"
CZKE_skoda_works_desc:0 "Le groupe Škoda était l’un des plus grands conglomérats industriels européens du XXe siècle."
CZKE_ckd_company:0 "ČKD"
CZKE_ckd_company_desc:0 "ČKD était l’une des plus grandes entreprises d’ingénierie de Tchécoslovaquie."
CZKE_armament_2b:0 "Commander des camions militaires"
CZKE_armament_2b_desc:0 "L’armée tchécoslovaque projetait une motorisation accrue. Mais le coût énorme des fortifications limita le budget disponible pour les camions."
CZKE_armament_2b_tooltip_reward:0 "\n§YIdée nationale§! liée à l’§Yindustrie militaire§! et à la §Yproduction militaire§!."
czke.216.t:0 "Ringhoffer - Tatra"
czke.216.d:0 "Les origines de Tatra remontent à 1850, quand Ignac Šustala commença la production de voitures et de carrosses à Kopřivnice (Nesselsdorf).\n\nAprès 1918, la société changea de nom pour « Kopřivnicka vozovka a.s. » et son siège passa de Vienne à Prague à la demande des autorités tchécoslovaques. En 1919, la marque TATRA apparut pour la première fois.\n\nL’entreprise fut intégrée à la société Ringhoffer en 1926. En 1936, après rapprochement avec le magnat pragois, Ringhoffer TATRA a.s. fut fondée et renommée Ringhoffer TATRA Werke AG deux ans plus tard.\n\nSauf quelques contrats de véhicules blindés, Tatra ne parvint jamais à remporter de grands appels d’offres militaires, le cartel ČKD/Škoda s’assurant presque toujours les contrats (souvent grâce à des pots-de-vin). Cela n’empêcha pas Tatra de développer ses propres véhicules blindés et prototypes de chars en parallèle de la production traditionnelle de voitures, camions et locomotives.\n\nPendant la Seconde Guerre mondiale, Tatra produisit des camions et moteurs de chars pour l’effort de guerre allemand, dont le fameux T111, un poids lourd à trois essieux doté d’un moteur diesel V12 refroidi par air, resté en production 16 ans.\n\nUne autre réussite fut la Tatra 87, très prisée par les officiers allemands pour sa vitesse et sa tenue de route sur l’Autobahn. Les voitures Tatra influencèrent à la fois Hitler et Porsche : passionné d’automobile, Hitler voyagea souvent en Tatra lors de ses tournées en Tchécoslovaquie.\n\nBeaucoup d’officiers allemands trouvèrent la mort au volant des puissantes Tatras, incapables de négocier les virages. Au point que la voiture gagna le surnom d’« Arme secrète tchèque », et qu’un ordre officiel interdit aux officiers allemands d’en conduire."
czke.216.a:0 "Commander de nouveaux camions."
tatra:0 "Ringhoffer - Tatra"
tatra_desc:0 "Entreprise de Kopřivnice, producteur majeur de voitures, camions et locomotives."
CZKE_motorization_factories:0 "Effort de motorisation"
CZKE_motorization_factories_desc:0 "Commander de nouveaux camions à Tatra."
CZKE_new_tanks:0 "Tester de nouveaux modèles de chars"
CZKE_new_tanks_desc:0 "En 1937, l’armée lança un concours pour un char moyen. Škoda, ČKD et Tatra concoururent. L’armée choisit finalement le LT vz.38 de ČKD/Škoda, plus tard utilisé par l’Allemagne contre la Pologne et la France. Parmi les concepts figura aussi le char moyen ST.39 de ČKD."
CZKE_new_tanks_tooltip_reward:0 "\nNouvelle variante de §Ychar léger§! OU recherche de §Ychar moyen§!."
czke.217.t:0 "Modernisation des chars de l’armée tchécoslovaque"
czke.217.d:0 "Face à l’aggravation de la situation en Europe, l’armée tchécoslovaque lança un concours pour un nouveau char. Parmi les projets, la version modernisée du TNHP (futur LT vz.38) et le prototype de char moyen V-8-H étaient les plus prometteurs.\n\nEn 1935, ČKD cherchait à remplacer le LT vz.35, produit conjointement avec Škoda. Le modèle issu, le « TNH », connut un succès à l’export (Iran, Pérou, Suisse, Lituanie). Une version modernisée, le LT vz.38, participa au concours.\n\nLe projet V-8-H fut lancé par ČKD à la fin des années 1930 et devint le ST vz.39. L’armée en commanda quelques centaines, mais la commande fut annulée après Munich, et le modèle ne fut jamais produit en masse.\n\nQuels chars devons-nous commander pour l’armée tchécoslovaque ?"
czke.217.a:0 "Commander la production de chars légers LT vz.38."
czke.217.b:0 "Développer davantage le projet de char moyen V-8-H."
skoda_works_artillery:0 "Škoda Works"
skoda_works_industry:0 "Škoda Works"
ckd_tanks:0 "ČKD & Škoda"
ckd_electric:0 "ČKD"
CZKE_artillery_focus:0 "Modernisation de l’artillerie"
CZKE_artillery_focus_desc:0 "Škoda produisit d’excellents canons, antichars et antiaériens, dont beaucoup furent commandés par l’armée."
CZKE_armoured_cars:0 "Modernisation des voitures blindées"
CZKE_armoured_cars_desc:0 "L’armée testait divers modèles Tatra depuis 1926. Finalement, les OA vz.30 furent commandées (environ 50 exemplaires).\n\nPendant la guerre, Tatra développa son premier moteur diesel refroidi par air, un énorme V12, initialement pour les SdKfz 234 Puma."
CZKE_mechanized_units:0 "Véhicules blindés de transport de troupes"
CZKE_mechanized_units_desc:0 "Nous devons développer des véhicules blindés spécifiques pour notre infanterie motorisée."
CZKE_new_tank_design:0 "Concevoir de nouveaux chars"
CZKE_new_tank_design_desc:0 "Nous devons nous concentrer sur la conception de chars modernes."

CZKE_air_is_our_sea:0 "Air Is Our Sea"
 CZKE_air_is_our_sea_desc:0 "The Czechoslovak leadership needed to build a capable air force for a modern nation surrounded by potentially hostile neighbors without access to the ocean. So was born the motto 'Air is our sea'."
 CZKE_air_is_our_sea_tooltip_reward:0 "\n§YAir Doctrines§! research bonus."
 czke.218.t:0 "History of the Czechoslovak Air Force"
 czke.218.d:0 "In October 1918, former Czech members of Austro-Hungarian squadrons met on the Zofin island in Prague. Nobody knew they were founding one of Europe's most distinguished air forces at that time. Many enthusiastic men gathered around sergeant Kostrba, but there were no planes. The new air force was helped significantly by a French donation of 127 aircraft.\n\nThe Czechoslovak leadership needed to build a capable air force for a modern nation surrounded by potentially hostile neighbors without access to the ocean. So was born the motto "Air is our sea". The Czechoslovak government, between the wars, balanced a home-grown aviation industry with licensing engines and aircraft designs from allied nations. Several major aircraft companies, and a few engine companies, thrived in Czechoslovakia during the 1930s, including Avia, Aero, and state-controlled Letov.\n\nAlthough Germany took Czechoslovakia without a fight, many Czechoslovak pilots did excellent work during the war. They started leaving the country in 1939 to oppose Germany abroad. They went to Poland, Yugoslavia, and France. After the war began, they were at all fronts, in all kinds of uniforms and airplanes, helping to stop the attacker.\n\nThey saw their first significant victory in the Battle of Britain as part of five Czechoslovak RAF squadrons, Numbers 68, 310, 311, 312, and 313.\n\nFollowing an agreement between the Czechoslovak government in London and the Soviet Union, some Czech pilots went to the Eastern front. They formed the first Czechoslovak Fighter Regiment, the first Czechoslovak exile soldiers to enter the liberated Czechoslovak soil.\n\nIn the meantime, the Czechs at the western front kept fighting the Luftwaffe. They patrolled the Atlantic, destroyed the V1 missiles, and took part in the invasion of Normandy.\n\nThere is no exaggeration in saying that while nobody knew about Czech pilots in 1918, they were among the best in the world in 1945."
 czke.218.a:0 "'Air Is Our Sea' (Czechoslovak Air Force Motto)."
 CZKE_czechoslovak_airforce:0 "Expand the Czechoslovak Airforce"
 CZKE_czechoslovak_airforce_desc:0 "In the spring of 1935, Germany publicly confessed to building a strong Air Force; Czechoslovakia and France responded by deepening aviation cooperation and expanding the air forces."
 CZKE_czechoslovak_airforce_tooltip_reward:0 "\nFree §YChief of Airforce§! and §YAir Base§!."
 czke.219.t:0 "Expansion of the Czechoslovak Airforce"
 czke.219.d:0 "Czechoslovak Airforce operated directly under the Ministry of National Defence as part of III. Department (Air Force) that administered affairs of the air force and air defense. It was probably one of the most prestigious branches of the armed forces, although, in personnel, it only represented about 4% of total numbers.\n\nMuch like in the case of the army, the air forces also relied solely on domestic production for all weapons, equipment, and other avionics instruments. However, later some new licenses for modern airplanes were purchased from France and the Soviet Union.\n\nIn 1934, the Ministry of National Defence decided that the air forces would be equipped with a single type of fighter, the Avia B.534 biplane, which eventually became the backbone of the Czechoslovak Air Force with 568 planes, built in four series (versions).\n\nWhen in the spring of 1935, Germany publicly confessed to building a strong Air Force, Czechoslovakia and France responded by deepening aviation cooperation. Czechoslovak High Command reacted to this new fact by expanding three airfields to seven, each capable of supplying two bomber squadrons that would arrive from France in case of war with Germany.\n\nEarly in 1936, a new batch of Avia B.534 aircraft was ordered by MND, with planes entering service in the spring of 1937. The last version of the plane included various refinements that allowed the IV. series to have an increased speed of over 200 mph (320 km/h), which placed it on par with the best of its contemporary biplanes.\n\nGeneral Jaroslav Fajfr was the head of the III. Department of MND since 1927 and significantly contributed to the expansion and organization of the Czechoslovak Air Force."
 czke.219.a:0 "Allocate more funds to the III. Department."
 CZKE_air_modernization:0 "Letov Military Aircraft Factory"
 CZKE_air_modernization_desc:0 "The Czechoslovak government, between the wars, balanced a home-grown aviation industry with licensing engines and aircraft designs from allied nations. Letov military factory was found to repair and upgrade old planes, and many models were continuously refitted to prolong their lifespan."
 CZKE_air_modernization_tooltip_reward:0 "\nNew §YFighter§! and §YClose Air Support§! variant."
 czke.220.t:0 "History of the Letov Company"
 czke.220.d:0 "The Letov company is the oldest aviation manufacturer in former Czechoslovakia and was founded originally in 1918 by the Ministry of National Defence as a state-controlled aircraft repair firm for WW1 planes inherited by the Czechoslovak Airforce.\n\nThe company was situated in Letnany, Prague, and employed about 1.200 workers in the late 1930s, when it manufactured the Š-328 reconnaissance and light bomber biplane, of which over 450 were produced. The entire airframe of the plane was welded together, not bolted or riveted.\n\nThe Letov factory was also the only Czechoslovak plant that manufactured metal propellers.\n\nDuring World War II, the factory served as a repair shop for the German Luftwaffe. Production lines were also set up for combat versions of the Ju 290 aircraft, commencing with the Ju 290 A-2, which carried a search radar for its patrol role.\n\nMany Czechoslovak aircraft designs were upgraded and refitted to prolong their lifespan, including the Avia B.534 and Letov Š-328 planes produced in several series that refined the original designs and fixed mechanical problems encountered during the service."
 czke.220.a:0 "Upgrade Czechoslovak military aircraft."
 CZKE_pilot_training:0 "Military Aviation School"
 CZKE_pilot_training_desc:0 "Czechoslovak pilots had good reputations before the outbreak of World War II, and many of them later escaped for Poland or France after the occupation of Czechoslovakia. Some eventually ended up in England and participated in the Battle of Britain."
 CZKE_pilot_training_tooltip_reward:0 "\nNew §YFighter Ace§! and §YAir Doctrines§! research bonus."
 czke.221.t:0 "Military Aviation School in Prostejov"
 czke.221.d:0 "The history of Czechoslovak military aviation education has almost a century of tradition and dates back to 1919, to the founding of the Flight School in Prague.\n\nIn 1920, Cheb became a major center of military aviation education. However, in 1927 the aviation school was eventually moved to a newly built facility in Prostejov and renamed Military Aviation School.\n\nThe two-year education program produced perfectly trained officers and mechanics, and other technical staff that the Czechoslovak Air Force sorely needed.\n\nMany pilots that fought in the Battle of Britain were graduates of the Military Air School of Prostějov, including Josef František, one of the highest-scoring Allied aces."
 czke.221.a:0 "Fund military aviation education programs."
 CZKE_armament_3:0 "Expand Aircraft Production"
 CZKE_armament_3_desc:0 "Avia became part of Škoda Works in 1929, and during the following years, the factory became the most significant aircraft producer in Czechoslovakia and moved to Letňany near Prague.\n\nDuring World War II, Avia produced aircraft for the German Luftwaffe."
 CZKE_armament_3_tooltip_reward:0 "\n§YMilitary Industry§! and §YMilitary Production§! related §YNational Idea§!."
 czke.222.t:0 "History of Avia"
 czke.222.d:0 "Avia was the largest aviation company in pre-war Czechoslovakia. It was founded in 1919 in a former sugar factory in Vysočany, Prague, as a maintenance and repair facility, but aircraft production soon followed. Between 1926 and 1929, the company was slowly incorporated into Škoda works and eventually moved to a newly constructed facility in Letnany, Prague.\n\nIn 1931, engineer František Novotný became the new chief designer and designed the prototype for B.534 biplanes produced for the Czechoslovak Air Force. The company also made a licensed version of Soviet Tupolev SB-2 bombers, known under their Avia designation: B.71.\n\nIn the second half of 1936, a new factory was built in Kunovice (Moravia) that would be used as a repair facility so the factories in Prague could increase aircraft production.\n\nDuring World War II, Avia produced aircraft and provide repairs for the German Luftwaffe."
 czke.222.a:0 "Build new facility in Kunovice."
 CZKE_avia_letnany:0 "Avia Letňany Aircraft Company"
 CZKE_avia_letnany_desc:0 "Modern Aircraft Company located in Letňany, Prague."



 CZKE_paradesant_brigade:0 "Establish Paradesant Brigades"
 CZKE_paradesant_brigade_desc:0 "Based on the [SOV.getAdjective] and French paratrooper training programs, the Czechoslovak High Command decided in summer 1938 to start preparing for the founding of paratrooper units. The 3rd Department /Air/ of the Ministry of State Defense was responsible for laying the ground-works."
#  para_tech:0 "Paratrooper Training" # moved to replace (personally think the vanilla loc is better)
 CZKE_advanced_aircraft_prototypes:0 "Design New Aircraft"
 CZKE_advanced_aircraft_prototypes_desc:0 "Czechoslovak companies need to quickly catch up in the aerospace industry either by designing their new prototypes or by purchasing licenses to produce successful foreign planes."
 air_plane_models:0 "Airplane models"
 CZKE_jet_engine_research:0 "Jet Engine Research"
 CZKE_jet_engine_research_desc:0 "Rocket and jet engines allow for unprecedented speeds for crewless and crewed vessels alike. Pioneering these technologies enables us to take the enemy by surprise."
CZKE_legacy_of_legions:0 "Héritage de la Légion tchécoslovaque"
CZKE_legacy_of_legions_desc:0 "La Légion tchécoslovaque était une force armée de volontaires composée principalement de Tchèques et, dans une moindre mesure, de Slovaques, combattant aux côtés des puissances de l’Entente durant la Première Guerre mondiale. Après la fondation de la Tchécoslovaquie, de nombreux anciens légionnaires intégrèrent la nouvelle armée tchécoslovaque, y apportant leur précieuse expérience du combat."
CZKE_legacy_of_legions_tooltip_reward:0 "\n§YPouvoir politique§! OU §YVolontaires§! lié à une §YIdée nationale§! OU §YExpérience de l’armée§!."
CZKE_czechoslovak_volunteers_idea:0 "Union tchécoslovaque des volontaires"
CZKE_czechoslovak_volunteers_idea_desc:0 "Le volontariat tchécoslovaque a une longue tradition. Durant la guerre civile espagnole, près de 1 000 Tchécoslovaques combattirent aux côtés de l’Espagne républicaine dans le cadre des brigades internationales."
czke.300.t:0 "Histoire de la Légion tchécoslovaque"
czke.300.d:0 "La Légion tchécoslovaque était une force armée de volontaires composée principalement de Tchèques et, dans une moindre mesure, de Slovaques, combattant aux côtés des puissances de l’Entente durant la Première Guerre mondiale. Leur objectif était d’obtenir le soutien des Alliés pour l’indépendance de la Bohême et de la Moravie vis-à-vis de l’Empire austro-hongrois, ainsi que des territoires slovaques vis-à-vis du Royaume de Hongrie.\n\nAvec l’aide d’intellectuels et de politiciens émigrés tels que Tomáš Garrigue Masaryk et Milan Rastislav Štefánik, ils devinrent une force de dizaines de milliers d’hommes combattant sur tous les fronts.\n\nEn Russie, ils prirent part à plusieurs batailles, notamment Zborov et Bakhmach, contre les puissances centrales. Ils furent fortement impliqués dans la guerre civile russe, combattant les bolcheviks et contrôlant toute la ligne du Transsibérien ainsi que plusieurs grandes villes de Sibérie.\n\nLa campagne de la Légion en Sibérie impressionna les politiciens alliés et attira leur attention sur l’idée d’un État tchécoslovaque indépendant. Alors que les légionnaires accumulaient les victoires, le Conseil national tchécoslovaque commença à recevoir des déclarations officielles de reconnaissance de la part de divers gouvernements alliés.\n\nAprès l’armistice avec les bolcheviks, les Légions commencèrent l’évacuation progressive de leurs troupes depuis Vladivostok, et les derniers légionnaires quittèrent le port en septembre 1920. Ces hommes parcoururent le monde avant de rejoindre leur patrie nouvellement indépendante.\n\nDe retour en Tchécoslovaquie, beaucoup formèrent le noyau de la nouvelle armée tchécoslovaque. Ils représentaient environ un tiers de l’ensemble des effectifs de l’armée nouvellement créée mais dominaient dans le haut commandement. Presque tous les généraux étaient d’anciens légionnaires, surtout ceux venus de Russie.\n\nL’Association tchécoslovaque des légionnaires fut fondée en 1921 par la fusion de diverses organisations de légionnaires issues de tous les champs de bataille de la Première Guerre mondiale."
czke.300.a:0 "Utiliser l’influence de l’Association tchécoslovaque des légionnaires."
czke.300.b:0 "Soutenir les organisations militaires de volontaires."
czke.300.c:0 "Leçons de la Grande Guerre."
legion_bug:0 "\n §OBonus spécial :§! Peut envoyer des §GVolontaires§! même aux plus faibles niveaux de §YTension mondiale.§!"
CZKE_reorganize_general_staff:0 "Réorganiser l’état-major général"
CZKE_reorganize_general_staff_desc:0 "La structure organisationnelle de l’armée tchécoslovaque était initialement basée sur celle de l’armée française, et les premiers chefs d’état-major étaient des généraux français. Une fois qu’une nouvelle génération d’officiers tchèques fut formée, les officiers français ne furent plus nécessaires."
CZKE_reorganize_general_staff_tooltip_reward:0 "\nChoix entre trois §YChefs d’état-major§! différents pour l’armée tchécoslovaque."
czke.301.t:0 "État-major de l’armée tchécoslovaque"
czke.301.d:0 "La dernière grande réorganisation de l’état-major de l’armée tchécoslovaque eut lieu en 1933, lorsque l’ancien chef, le général Syrový, fut nommé inspecteur général des forces armées et qu’il fallut lui trouver un remplaçant.\n\nPlusieurs candidats étaient éligibles, mais, à la surprise de beaucoup, le travailleur acharné mais peu connu commandant du commandement militaire terrestre de Košice, le général Ludvík Krejčí (sur la photo), fut choisi. Sa nomination représentait un compromis viable pour la plupart des partis politiques et des cercles militaires.\n\nCependant, d’autres candidats solides étaient également envisagés. Pendant un moment, même le chef de la mission militaire française, le général Fulcher, fut pressenti, mais cela aurait été un retour en arrière, ce qui n’était pas acceptable pour la représentation politique tchèque.\n\nL’un des choix les plus intéressants était le général Lev Prchala, ancien vice-chef d’état-major sous le général Syrový. C’était un homme de principes, énergique, ouvert aux idées de la guerre moderne et défenseur de la manœuvre mobile face à la défense statique. Sa principale « faiblesse » était son épouse allemande, ce que ses opposants utilisèrent contre lui, le rendant inacceptable comme chef d’état-major.\n\nLors de la crise de Munich, Prchala commandait la IVe armée qui défendait la Moravie du Sud. Il s’opposa fermement à l’abandon des Sudètes, et ses positions conduisirent finalement à sa répudiation par Edvard Beneš durant la Seconde Guerre mondiale. Il resta en exil après la guerre et collabora avec les organisations allemandes des Sudètes créées après l’expulsion des Allemands de Tchécoslovaquie.\n\nUne rumeur intéressante évoque sa participation à une tentative de coup d’État militaire jamais réalisée. Selon son fils, il regretta toute sa vie de ne pas avoir abattu le président Beneš durant la crise de Munich.\n\nUn autre candidat sérieux était le général Vojtěch Luža, alors directeur de l’École de guerre de Prague et partisan de la guerre blindée offensive, inspirée par les idées et tactiques des maréchaux français Foch et Ludendorff, ainsi que du général allemand Guderian. Luža fut commandant de la IIe armée pendant la crise de Munich et membre de la résistance durant l’occupation. Il mourut dans une fusillade avec les forces de sécurité du Protectorat."
czke.301.a:0 "Confirmer le général Krejčí."
czke.301.b:0 "Nommer le général Prchala."
czke.301.c:0 "Nommer le général Luža."
CZKE_military_maneuvers:0 "Organiser des manœuvres militaires"
CZKE_military_maneuvers_desc:0 "L’armée tchécoslovaque testa sa nouvelle organisation et ses capacités lors de grandes manœuvres militaires tenues en août et septembre 1936. Toute l’opération apporta des enseignements précieux et envoya un message clair à l’Europe quant à la préparation des forces armées tchécoslovaques."
CZKE_military_maneuvers_tooltip_reward:0 ""
CZKE_prepare_new_plan:0 "Préparer une nouvelle stratégie de défense"
CZKE_prepare_new_plan_desc:0 "Avec la montée de Hitler et ses exigences concernant l’unification des minorités allemandes (les Sudètes) et la restitution d’autres territoires revendiqués (les Sudètes), la direction et le haut commandement tchécoslovaques alarmés élaborèrent de nouveaux plans de défense."
CZKE_prepare_new_plan_tooltip_reward:0 ""
CZKE_2nd_departnment:0 "Étendre le 2e Département"
CZKE_2nd_departnment_desc:0 "Le 2e Département de l’état-major était le service de renseignement militaire opérant en Tchécoslovaquie entre 1919 et 1939, responsable des activités d’espionnage et de contre-espionnage."
CZKE_2nd_departnment_tooltip_reward:0 "\n §YÉlectronique et informatique§! lié à un §YBonus de recherche§!."
czke.304.t:0 "2e Département de l’état-major"
czke.304.d:0 "Dès sa création, la République tchécoslovaque dut faire face à des problèmes intérieurs, principalement liés aux activités des nombreuses minorités nationales vivant à l’intérieur des frontières, offrant un terrain fertile pour l’espionnage et les sabotages potentiels.\n\nMais c’est la révélation d’activités d’espionnage menées par le consul allemand à Prague, le baron Gabsattel, en 1919, qui poussa le commandement de l’armée tchécoslovaque à établir un nouveau service de renseignement militaire distinct : le 2e Département de l’état-major.\n\nAu début, le 2e Département dut faire face à un manque de personnel, car le chef du renseignement militaire de l’armée austro-hongroise, le brigadier Max Ronge, s’opposait à ce que des officiers de nationalité tchèque soient placés dans le service de renseignement de la Monarchie. Il fallut environ une décennie avant qu’une nouvelle génération d’officiers ne soit formée à l’Académie militaire et à l’École de guerre. Le niveau des activités de renseignement put alors être progressivement augmenté. Le 2e Département se composait de deux groupes : le groupe de recherche, divisé en sections offensive et défensive, et le groupe plans et études, de caractère plus analytique.\n\nDans les années turbulentes précédant la Seconde Guerre mondiale, le lieutenant-colonel František Moravec fut chef du 2e Département de 1937 à 1939, avant de s’enfuir avec dix de ses officiers et les dossiers de renseignement les plus précieux de Prague à Londres, la veille de l’occupation de la Tchécoslovaquie par l’Allemagne nazie.\n\nPendant la guerre, il joua un rôle déterminant dans la préparation de l’opération Anthropoid, l’assassinat de Reinhard Heydrich en 1942."
czke.304.a:0 "Étendre le 2e Département."
CZKE_intelligence_service_offense:0 "Étendre la section offensive"
CZKE_intelligence_service_offense_desc:0 "Le rôle principal de la section offensive du groupe de recherche était d’obtenir des informations extérieures sur les menaces militaires, notamment des données militaires, politiques et économiques."
CZKE_intelligence_service_defense:0 "Étendre la section défensive"
CZKE_intelligence_service_defense_desc:0 "L’objectif principal de la section défensive du renseignement militaire était d’empêcher l’infiltration de groupes d’espionnage étrangers dans l’armée tchécoslovaque et dans les secteurs nécessaires au soutien de la défense (industrie d’armement, infrastructures de défense, etc.)."
CZKE_infiltrate_abwehr:0 "Infiltrer l’Abwehr"
CZKE_infiltrate_abwehr_desc:0 "La situation de la minorité allemande en Tchécoslovaquie offrait à l’Abwehr allemande une excellente opportunité d’activités d’espionnage. Cependant, cela permettait aussi au contre-espionnage tchécoslovaque de tenter d’infiltrer l’Abwehr avec des agents doubles."
CZKE_infiltrate_abwehr_tooltip_reward:0 "\n §YService de renseignement§! lié à une §YIdée nationale§!."
czke.305.t:0 "L’histoire de l’agent A-54"
czke.305.d:0 "Paul Thümmel, alias agent A-54, était un agent double allemand qui espionnait pour la Tchécoslovaquie. Il contacta le 2e Département en 1932, principalement parce qu’il avait besoin d’argent pour financer son train de vie dispendieux, et offrit une coopération sur papier.\n\nIl était membre de haut rang de l’organisation de renseignement militaire allemande, l’Abwehr. C’était aussi un membre décoré du parti nazi, bien connecté grâce à son rôle de membre fondateur de la SA.\n\nIl fournit une vaste gamme d’informations importantes sur les services de renseignement allemands aux agents tchèques, qui transmirent ensuite les données au SIS à Londres. Thümmel livra également des détails sur les « capacités et intentions militaires », ainsi que des informations détaillées sur l’organisation de l’Abwehr et du SD, de même que « l’ordre de bataille quasi complet de la Wehrmacht et de la Luftwaffe, ainsi que les plans de mobilisation allemands ». Plus tard, il aurait également donné des avertissements anticipés sur l’annexion des Sudètes et sur les invasions de la Tchécoslovaquie et de la Pologne.\n\nEn octobre 1941, la Gestapo accusa le SS Paul Thümmel d’avoir prévenu les responsables yougoslaves de l’attaque allemande de avril 1941 contre leur pays. Ils le soupçonnaient aussi de collaborer avec le chef de la résistance tchèque, le capitaine Václav Morávek. Thümmel fournissait régulièrement à l’Abwehr des informations classifiées de la SS. L’amiral Canaris, chef de l’Abwehr, intervint donc pour le défendre en tant qu’agent double.\n\nLes historiens débattent encore pour savoir si l’agent A-54 fut réellement un « as » du double jeu ou simplement un stratagème élaboré de l’Abwehr pour fournir de fausses informations au renseignement tchécoslovaque et à ses alliés. Néanmoins, Thümmel fut finalement capturé, accusé de trahison et exécuté par la SS au camp de concentration de Theresienstadt en avril 1945."
czke.305.a:0 "Contacter l’agent A-54."
CZKE_military_intelligence_service_idea:0 "Service de renseignement militaire"
CZKE_sabotage_anchluss:0 "Saboter l’alliance austro-allemande"
CZKE_sabotage_anchluss_desc:0 "La restauration de la monarchie des Habsbourg représente une menace aussi importante pour la Tchécoslovaquie que l’austrofascisme et une éventuelle alliance austro-allemande. Nous devons l’arrêter à tout prix."
CZKE_sabotage_anchluss_tooltip_reward:0 "\n §OBonus spécial :§! L’Autriche aura beaucoup plus de chances de résister aux tentatives allemandes de prise de contrôle du pays."
CZKE_support_oster:0 "Soutenir le complot des officiers de la Wehrmacht"
CZKE_support_oster_desc:0 "Nos sources dans l’Abwehr signalent qu’il pourrait y avoir des tentatives de renverser Hitler. Peut-être pourrions-nous utiliser notre homme de l’intérieur pour soutenir discrètement cette initiative."
CZKE_support_oster_tooltip_reward:0 "\n §OBonus spécial :§! Certains officiers de la Wehrmacht peuvent tuer Hitler et déclencher une guerre civile pour chasser les nazis du pouvoir."
czke.309.t:0 "Hitler est mort !"
czke.309.d:0 "[Root.GetLeader], il semble que des officiers de la Wehrmacht aient assassiné Adolf Hitler, et que diverses factions se battent désormais pour le pouvoir au sein du NSDAP. Une partie de l’armée allemande est en révolte ouverte et tente de renverser les nationaux-socialistes avant qu’ils ne détruisent l’Allemagne.\n\nLe chef d’état-major attend pour discuter de la situation avec vous dans la pièce voisine."
czke.309.a:0 "Nous devons intervenir immédiatement !"
czke.309.b:0 "Nous ne nous mêlerons pas des affaires allemandes."
CZKE_soviet_intelligence:0 "VONAPO 20"
CZKE_soviet_intelligence_desc:0 "Une station de renseignement [SOV.getAdjective], nom de code VONAPO 20, fut établie à Prague en 1936 comme projet d’échange d’informations conjoint entre les services de renseignement tchécoslovaques et [SOV.getAdjective]."
CZKE_soviet_intelligence_tooltip_reward:0 "\n §YServices de renseignement§! lié à une §YIdée nationale§!."
czke.310.t:0 "Coopération interguerres entre le renseignement tchécoslovaque et [SOV.getAdjective]"
czke.310.d:0 "La Tchécoslovaquie n’était pas l’un des principaux objectifs de l’espionnage soviétique. Le Kremlin s’intéressait bien davantage à la Pologne et à l’Allemagne. Pourtant, les agents bolcheviques surveillaient rigoureusement les nombreux émigrés russes et ukrainiens installés en Tchécoslovaquie, et les opérateurs du GRU menaient également un vaste espionnage industriel.\n\nAvec la menace croissante venant d’Allemagne, le 2e Département commença une coopération intensive avec le service de renseignement militaire soviétique, le GRU. La Tchécoslovaquie cessa d’être une cible pour les espions soviétiques et devint une « tête de pont sûre » pour des actions en Allemagne et en Europe occidentale.\n\nDans le même temps, les niveaux d’espionnage industriel chutèrent, les entreprises d’armement tchèques livrant désormais leurs produits à [SOV.getnameDef]. Des spécialistes [SOV.getAdjective] furent formés dans les usines tchèques.\n\nUne opération conjointe spéciale, nom de code VONAPO 20, fut mise en place le 27 mai 1936 pour l’échange d’informations de renseignement. Cependant, hormis deux conférences, le flux d’informations ne se fit que dans un sens : de Prague vers Moscou. Les Russes ne fournissaient généralement aucune information.\n\nLe capitaine d’état-major Karel Paleček fut responsable du projet VONAPO 20 jusqu’à l’occupation de la Tchécoslovaquie. Il fut l’un des dix officiers de renseignement qui accompagnèrent le colonel Moravec lors de sa fuite à Londres en 1939."
czke.310.a:0 "Organiser une réunion VONAPO 20."
CZKE_vonapo20_idea:0 "VONAPO 20"
CZKE_vonapo20_desc_idea:0 "Une station conjointe de renseignement [SOV.getAdjective] à Prague."
CZKE_uranium_for_soviets:0 "Fournir de l’uranium aux [SOV.getAdjective]"
CZKE_uranium_for_soviets_desc:0 "Le NKVD nous a contactés avec une offre intrigante concernant notre uranium. Leurs intentions restent mystérieuses ; cependant, les [SOV.getAdjective] offrent une compensation considérable pour l’acquisition discrète d’uranium en dehors des canaux officiels."
CZKE_uranium_for_soviets_tooltip_reward:0 "\n Éventuel échange d’§YIndustrie civile§! contre §Ressources§!."
czke.311.t:0 "Vendre de l’uranium à [SOV.getnameDef]"
czke.311.d:0 "Le projet [SOV.getAdjective] de développement d’une bombe atomique commença durant la Seconde Guerre mondiale, après la découverte du projet nucléaire américain, britannique et canadien. Le projet était dirigé par le physicien nucléaire [SOV.getAdjective] Igor Kourtchatov, tandis que la logistique militaire et les efforts de renseignement étaient gérés par Lavrenti Beria, commissaire du peuple du NKVD.\n\nLe plus grand problème du projet soviétique à ses débuts était l’approvisionnement en minerai d’uranium, car l’URSS ne disposait pas encore de sources domestiques connues. Les grands gisements du Kazakhstan et d’autres régions de l’Union soviétique n’étaient pas encore découverts, si bien que le projet devait dépendre de sources étrangères.\n\nIl n’est pas farfelu d’imaginer qu’une coopération plus étroite entre le service de renseignement tchécoslovaque et le NKVD puisse servir à l’approvisionnement secret en uranium de Jáchymov en échange de pétrole ou d’autres ressources minérales cruellement nécessaires à l’industrie tchèque."
czke.311.a:0 "Tenter de négocier un accord avec leurs agents"
czke.312.t:0 "L’uranium tchécoslovaque pour le programme nucléaire [SOV.getAdjective]"

CZKE_hungarian_alliance:0 "Alliance hongroise"
CZKE_hungarian_alliance_desc:0 "Maintenant que la démocratie a été restaurée en Hongrie, ils doivent devenir nos alliés plutôt que nos ennemis."
czke.312.d:0 "Camarade [SOV.GetName], le NKVD rapporte qu’il peut obtenir du minerai d’uranium de haute qualité en Tchécoslovaquie en échange de livraisons de pétrole brut et d’autres ressources pour leur industrie. Devons-nous négocier l’accord et sécuriser l’uranium ?"
czke.312.a:0 "Da. Sécurisez-en le plus possible pour nos recherches."
czke.312.b:0 "Procurons seulement quelques échantillons ; nous avons d’autres priorités pour le moment."
czke.313.t:0 "Les [SOV.getAdjective] sont intéressés par notre uranium"
czke.313.d:0 "Monsieur le Premier ministre, notre renseignement militaire rapporte qu’ils ont sécurisé l’accord avec le NKVD. Les livraisons de ressources commenceront bientôt et seront stockées dans un entrepôt militaire sécurisé dans les montagnes ruthènes."
czke.313.a:0 "Excellent"
czke.314.t:0 "Les [SOV.getAdjective] ne sont pas intéressés par notre uranium"
czke.314.d:0 "Monsieur le Premier ministre, notre renseignement militaire rapporte que les [SOV.getAdjective] ne sont pas intéressés par des livraisons régulières d’uranium. Cependant, ils souhaiteraient acheter une petite quantité d’uranium pour leurs recherches théoriques sur la technologie nucléaire."
czke.314.a:0 "Dommage, mais c’est toujours mieux que rien."
CZKE_french_military_mission:0 "La mission militaire française"
CZKE_french_military_mission_desc:0 "À la demande du gouvernement, un groupe d’officiers de l’armée française fut envoyé en Tchécoslovaquie en 1919 afin d’aider à la construction et à l’organisation de la nouvelle armée ainsi qu’à la formation de nouveaux officiers."
CZKE_french_military_mission_tooltip_reward:0 "\n§GAlliance franco-tchécoslovaque§!, et §YThéoricien gratuit§! OU §YExpérience de l’armée§!."
CZKE_czech_france_alliance:0 "Alliance franco-tchécoslovaque"
czke.315.t:0 "Origines de la mission militaire française en Tchécoslovaquie"
czke.315.d:0 "Peu après la déclaration de son indépendance, une mission militaire fut appelée en Tchécoslovaquie pour aider à bâtir une armée et former des officiers. Le premier test de cette armée eut lieu en 1919 avec la courte guerre contre la Hongrie au sujet de la Slovaquie. Une fois la guerre terminée, Pellé jouissait d’une grande popularité auprès du public tchécoslovaque.\n\nSous le commandement du général, l’armée tchécoslovaque démontra sa capacité au combat et regagna son honneur. Pellé entendait utiliser cela à son avantage pour promouvoir son concept d’une armée tchécoslovaque permanente intégrée à l’armée alliée. Il comptait inscrire cette idée dans la nouvelle loi de défense nationale tchécoslovaque, ce qu’il réussit en 1920. La première académie militaire tchécoslovaque fut inaugurée en 1920 pour former des officiers supérieurs nationaux.\n\nEn tant que chef d’état-major, le général Pellé dirigea la mission française en Tchécoslovaquie de 1919 à 1920. Soldat et diplomate, il comprenait parfaitement sa position unique : un intermédiaire entre la Tchécoslovaquie et la France. À plusieurs reprises, Pellé soutint la Tchécoslovaquie, risquant le désaveu de ses supérieurs français. Il avait aussi des raisons personnelles : il rencontra à Prague celle qui deviendrait son épouse en 1921.\n\nLe général Eugène Mittelhausser remplaça Pellé en 1921 et dirigea la mission jusqu’en 1926, date à laquelle il fut remplacé par Louis Eugène Faucher, qui occupa le poste jusqu’en 1938.\n\nÀ Paris, le traité d’Alliance et d’Amitié entre la France et la Tchécoslovaquie fut signé le 25 janvier 1924."
czke.315.a:0 "Renforcer les compétences de la mission."
czke.315.b:0 "Augmenter le financement des académies militaires."
CZKE_france_alliance:0 "Échanges scientifiques et culturels"
CZKE_france_alliance_desc:0 "Durant l’entre-deux-guerres, les relations tchéco-françaises bénéficièrent d’un statut privilégié. Les relations scientifiques et culturelles entre la France et la Tchécoslovaquie furent donc structurées et développées comme telles – des relations politiquement privilégiées. Le lobby francophile était représenté à des postes clés dans les ministères tchécoslovaques de l’Éducation et de la Défense."
CZKE_soviet_treaties:0 "Améliorer les traités avec les [SOV.getAdjective]"
CZKE_soviet_treaties_desc:0 "Le 16 mai 1935, la Tchécoslovaquie et l’Union soviétique signèrent un traité d’alliance, conséquence de l’alliance soviétique avec la France. Dans les années critiques avant Munich, beaucoup en Tchécoslovaquie espéraient que l’Union soviétique interviendrait en cas de guerre."
CZKE_soviet_treaties_tooltip_reward_1:0 "\n§GTraité d’alliance soviéto-tchécoslovaque§!, et §YÉvénement diplomatique§!.\n"
CZKE_soviet_treaties_tooltip_reward_2:0 "\nNégociations pour une §YTechnologie militaire§! :\n§OBombardier tactique I§! (90% de chances)."
CZKE_soviet_treaties_positive:0 "Traité d’alliance soviéto-tchécoslovaque"
CZKE_soviet_treaties_negative:0 "Traité d’alliance soviéto-tchécoslovaque"
czke.316.t:0 "Relations tchéco-[SOV.GetAdjective]"
czke.316.d:0 "La Tchécoslovaquie et [SOV.GetNameDef] entretenaient une relation diplomatique complexe. Leur hostilité venait surtout du conflit armé entre les autorités bolcheviques et les légions tchécoslovaques en Russie après la Grande Guerre.\n\nDe plus, le premier Premier ministre de la Tchécoslovaquie, Karel Kramář, détestait intensément les bolcheviks pour des raisons personnelles, son épouse venant de la noblesse russe. Il n’est donc pas surprenant que la Tchécoslovaquie ait été parmi les derniers pays à reconnaître officiellement l’Union soviétique, en 1934.\n\nLe 16 mai 1935, le traité d’alliance soviéto-tchécoslovaque fut signé, conséquence de l’alliance soviétique avec la France, principal allié politique et militaire de la Tchécoslovaquie. À l’insistance du gouvernement tchécoslovaque, un protocole stipulait que le traité ne prendrait effet que si la France assistait la victime d’une agression.\n\nÀ la suite des accords de Munich en 1938 et de l’occupation de la Tchécoslovaquie par l’Allemagne fasciste en mars 1939, l’Union soviétique refusa de reconnaître la fin de l’indépendance tchécoslovaque."
czke.316.a:0 "Améliorer encore les relations."
czke.317.t:0 "Négocier un accord de production sous licence"
czke.317.d:0 "Le gouvernement tchécoslovaque propose un accord de production sous licence. Nous obtiendrions les droits de production des excellents canons de montagne Škoda C-5 et canons antiaériens R-5, tandis que les Tchécoslovaques s’intéressent à nos bombardiers SB-2 pour leur armée de l’air.\n\nDevons-nous négocier ce traité, camarade [SOV.GetLeader] ?"
czke.317.a:0 "Allons-y."
czke.317.b:0 "Non."
czke.318.t:0 "[SOV.getLeader] accepte un accord de production sous licence"
czke.318.d:0 "La Tchécoslovaquie et l’URSS ont signé un accord mutuel concernant la production sous licence d’équipements militaires. Škoda obtient les droits pour la production sous licence des bombardiers SB-2 en échange des droits et modèles des canons de montagne Škoda C-5 et des canons antiaériens R-3 (vz. 37).\n\nLes bombardiers SB-2 seront produits sous la désignation tchécoslovaque B.71, et leur fabrication sera répartie entre les sociétés Letov, Aero et Avia."
czke.318.a:0 "Excellent."
czke.319.t:0 "Les [SOV.getAdjective] refusent l’accord de production sous licence"
czke.319.d:0 "Malheureusement, nous devons vous informer que le gouvernement de [SOV.getnameDef] n’a pas été intéressé par notre proposition d’échange concernant la production sous licence."
czke.319.a:0 "C’est regrettable."
CZKE_acquire_access_for_soviets:0 "Négocier l’accès militaire pour les [SOV.getAdjective]"
CZKE_acquire_access_for_soviets_desc:0 "Le principal problème réduisant l’efficacité de l’alliance était l’absence de frontière commune entre l’URSS et la Tchécoslovaquie. Varsovie refusa catégoriquement toute tentative d’octroi de passage à l’Armée rouge, tout comme le gouvernement roumain. Mais que se serait-il passé si le gouvernement tchécoslovaque avait réussi à convaincre ses voisins d’accorder ce passage ?"
CZKE_acquire_access_for_soviets_tooltip_reward:0 "\nNégociations pour un §YAccès militaire§! pour l’§YUnion soviétique§! à travers la §YPologne§! (30% de chances) ou la §YRoumanie§! (50% de chances).\n\nEn cas de succès, l’§YUnion soviétique§! §Ygarantira l’indépendance§! de la §YTchécoslovaquie§! au prix d’une influence soviétique accrue en Europe de l’Est (propagation du communisme)."
CZKE_soviet_military:0 "Influence militaire soviétique"
CZKE_soviet_military_desc:0 "Nous avons beaucoup à apprendre de nos camarades [SOV.getAdjective] !"
czke.320.t:0 "La Tchécoslovaquie demande protection"
czke.320.d:0 "Face à l’escalade de la situation politique germano-tchécoslovaque, le gouvernement tchécoslovaque cherche à renforcer ses liens militaires avec [SOV.getnameDef] contre les fascistes. Si nous garantissons notre soutien, ils tenteront de négocier un accès militaire pour nos troupes à travers les pays voisins.\n\nCela nous offre une occasion unique d’étendre la révolution au cœur de l’Europe."
czke.320.a:0 "Nous protégerons la Tchécoslovaquie"
czke.320.b:0 "Les Tchèques sont livrés à eux-mêmes."
czke.321.t:0 "Les Soviétiques nous soutiendront"
czke.321.d:0 "Les représentants de [SOV.getnameDef] nous ont assuré de leur soutien. Nous devons maintenant obtenir un accès militaire via la Pologne ou la Roumanie, faute de quoi l’aide soviétique promise serait inutile."
czke.321.a:0 "Tenter de négocier l’accès militaire."
czke.322.t:0 "Les Soviétiques ne sont pas intéressés"
czke.322.d:0 "Les Soviétiques nous ont refusés. Il semble qu’une alliance plus profonde entre la Tchécoslovaquie et [SOV.getAdjective] soit impossible dans la situation politique actuelle."
czke.322.a:0 "C’est bien malheureux."
czke.323.t:0 "Accès militaire pour l’Union soviétique"
czke.323.d:0 "Face à l’escalade de la situation politique germano-tchécoslovaque, le gouvernement tchécoslovaque cherche à renforcer ses liens militaires avec l’Union soviétique.\n\nLeur gouvernement nous demande poliment d’autoriser le passage des troupes soviétiques par notre pays en cas de guerre."
czke.323.a:0 "D’accord, il faut contenir l’Allemagne."
czke.323.b:0 "Les Tchèques sont fous ? Jamais nous ne laisserons les bolcheviks fouler notre sol."
czke.324.t:0 "Accès militaire pour l’Union soviétique"
czke.324.d:0 "Face à l’escalade de la situation politique germano-tchécoslovaque, le gouvernement tchécoslovaque cherche à renforcer ses liens militaires avec l’Union soviétique.\n\nLeur gouvernement nous demande poliment d’autoriser le passage des troupes soviétiques par notre pays en cas de guerre."
czke.324.a:0 "D’accord, il faut contenir l’Allemagne."
czke.324.b:0 "Aucun soldat soviétique ne foulera le sol roumain."
czke.325.t:0 "Accès militaire pour l’Union soviétique obtenu"
czke.325.d:0 "Il semble que les diplomates tchèques aient réussi à convaincre l’un de leurs voisins de notre situation. À contrecœur, ils ont finalement accepté d’accorder à l’Union soviétique un accès militaire pour aider les Tchèques contre les Allemands."
czke.325.a:0 "Nous nous tiendrons ensemble contre les fascistes."
czke.326.t:0 "La Pologne refuse"
czke.326.d:0 "Le gouvernement polonais a officiellement refusé nos demandes d’autoriser le passage des troupes soviétiques par la Pologne."
czke.326.a:0 "Compris."
czke.327.t:0 "Alliance avec les Soviétiques"
czke.327.d:0 "Les Soviétiques nous ont également assuré de leur volonté de venir à notre aide en cas de guerre."
czke.327.a:0 "Espérons qu’ils tiendront parole."
czke.328.t:0 "Compris."
czke.328.d:0 "Le gouvernement roumain a officiellement refusé nos demandes d’autoriser le passage des troupes soviétiques par la Pologne."
czke.328.a:0 "Nous sommes seuls."
czke.328.b:0 "Comment osent-ils même demander une telle chose."
CZKE_revive_little_entente:0 "Raviver l’alliance de la Petite Entente"
CZKE_revive_little_entente_desc:0 "La Petite Entente était une alliance formée en 1920 et 1921 par la Tchécoslovaquie, la Roumanie et la Yougoslavie pour la défense commune contre le révisionnisme hongrois et la prévention d’une restauration des Habsbourg. La France soutenait cette alliance en signant des traités avec chaque membre. La Petite Entente commença à se déliter en 1936 et se dissout entièrement en 1938."
CZKE_revive_little_entente_tooltip_reward:0 "\nCrée une nouvelle faction : §YPetite Entente§!"
CZKE_little_entente_alliance:0 "Alliance de la Petite Entente"
CZKE_little_entente_alliance_negative:0 "Alliance de la Petite Entente"
little_entente:0 "Petite Entente"
czke.329.t:0 "Histoire de l’alliance de la Petite Entente"
czke.329.d:0 "La Petite Entente était un accord de défense mutuelle entre la Tchécoslovaquie, la Yougoslavie et la Roumanie durant l’entre-deux-guerres. L’alliance était fondée sur plusieurs traités signés entre 1920 et 1921. Elle visait à contrer la domination allemande et hongroise dans le bassin du Danube et à protéger l’intégrité territoriale et l’indépendance politique de ses membres. Durant les années 1920, les trois nations cherchèrent une coopération économique et politique et négocièrent des alliances avec la France.\n\nAprès l’arrivée au pouvoir d’Adolf Hitler en 1933, les membres de la Petite Entente créèrent un Secrétariat permanent et un Conseil permanent, composé de leurs ministres des Affaires étrangères, qui se réunissaient trois fois par an pour définir une politique commune. Néanmoins, dans les années 1930, les trois États adoptèrent de plus en plus des politiques étrangères indépendantes, surtout après l’occupation de la Rhénanie par l’Allemagne en 1936 et la perte de valeur du soutien français, sur lequel l’entente reposait.\n\nHistoriquement, l’entente perdit son importance politique lorsqu’en avril 1937, la Yougoslavie et la Roumanie refusèrent la demande de la Tchécoslovaquie, alors menacée par l’Allemagne, que l’entente s’engage à fournir une aide militaire totale à tout membre victime d’agression. L’entente s’effondra définitivement lorsque l’Allemagne annexa la région des Sudètes en septembre 1938."
czke.329.a:0 "Tenter de restaurer la Petite Entente."
czke.330.t:0 "[Root.GetLeader] tente de réformer la Petite Entente"
czke.330.a:0 "Nous ne pouvons permettre que cela se reproduise !"
czke.330.d:0 "Cherchant à former un front uni contre des ennemis communs, [From.GetName] a contacté les membres de la Petite Entente avec une offre d’élargir l’objet de l’alliance et de s’unir contre des ennemis communs.\n\nLa direction tchécoslovaque a établi des liens diplomatiques avec d’autres nations susceptibles de se sentir menacées et encourage l’unité afin de préserver l’équilibre diplomatique en Europe et de prévenir de futurs conflits. Seul l’avenir dira si cela réussira."
czke.330.b:0 "Vive l’Entente !"
czke.330.c:0 "Cela pourrait compliquer nos plans pour l’Europe."
czke.330.e:0 "L’Europe doit s’unir contre les agresseurs fascistes !"
czke.330.f:0 "Un signe des tensions croissantes en Europe."
CZKE_invite_romania:0 "Inviter la Roumanie"
CZKE_invite_romania_desc:0 "Nous devons renforcer notre alliance avec la Roumanie."
CZKE_invite_romania_tooltip_reward:0 "\n§YRoumanie§! rejoint la §YPetite Entente§! (90% de chances)."
CZKE_invite_yugoslavia:0 "Inviter la Yougoslavie"
CZKE_invite_yugoslavia_desc:0 "Nous devons renforcer notre alliance avec la Yougoslavie."
CZKE_invite_yugoslavia_tooltip_reward:0 "\n§YYougoslavie§! rejoint la §YPetite Entente§! (90% de chances)."
czke.331.t:0 "Réformation de la Petite Entente"
czke.331.d:0 "Pour restaurer la Petite Entente, la Tchécoslovaquie nous demande de réaffirmer notre alliance afin de contenir une possible résurgence de l’expansionnisme agressif des anciennes puissances centrales ou de l’Union soviétique."
czke.331.a:0 "Avec plaisir. La Petite Entente doit être reconstruite."
czke.331.b:0 "[Root.GetNameDefCap] suit son propre chemin."
czke.332.t:0 "[From.GetNameDefCap] rejoint la Petite Entente"
czke.332.d:0 "Notre plan pour empêcher l’alliance de la Petite Entente de s’effondrer s’avère fructueux. [From.GetLeader] approuve nos efforts et a accepté notre proposition de réforme de l’alliance."
czke.332.a:0 "Nous sommes un pas plus près de la reconstruction de la Petite Entente."
czke.333.t:0 "[From.GetNameDefCap] refuse la proposition tchécoslovaque"
czke.333.d:0 "Malgré nos meilleurs efforts pour réformer la Petite Entente, notre dernière tentative de rapprochement avec l’une des nations a été accueillie avec scepticisme. [From.GetLeader] a refusé de rejoindre l’alliance, peut-être par doute sur nos intentions ou par crainte que s’aligner trop étroitement avec nous ne les transforme en cible."
czke.333.a:0 "Ils pourraient déjà être une cible, qu’ils le sachent ou non !"
CZKE_hungary_intervention:0 "Intervention en Hongrie"
CZKE_hungary_intervention_desc:0 "La Tchécoslovaquie avait une relation compliquée avec la Hongrie. Après la proclamation d’indépendance en 1918, les tensions frontalières en Slovaquie entraînèrent un conflit armé. Depuis, la Hongrie resta une épine dans le dos de la Tchécoslovaquie."
CZKE_austria_intervention:0 "Intervention en Autriche"
CZKE_austria_intervention_desc:0 "La direction tchécoslovaque était parfaitement consciente du soutien croissant au fascisme en Autriche, et les craintes d’une alliance austro-allemande n’étaient pas de simples superstitions, comme les années suivantes allaient le montrer."
CZKE_claims_bohemian_crown:0 "Revendiquer les anciennes terres de la Couronne de Bohême"
CZKE_claims_bohemian_crown_desc:0 "Les Slaves Sorabes de Lusace ont toujours voulu faire partie de la Tchécoslovaquie. Mettons la pression internationale sur l’Allemagne concernant certaines parties des terres de la Couronne de Bohême."
CZKE_claims_bohemian_crown_tooltip_reward:0 "\nUltimatum à l’Allemagne (§YRevendiquer et objectif de guerre limité§!) concernant certaines parties des anciennes terres de la Couronne de Bohême (§YNiederschlesien§!)."
czke.350.t:0 "Revendiquer la Lusace"
czke.350.d:0 "Durant la Grande Guerre, notamment dans sa dernière année, plusieurs représentants politiques et culturels tchèques envisagèrent l’idée d’un renouveau de l’État tchèque dans les frontières historiques des anciennes terres de la couronne de Bohême.\n\nEn parallèle, des négociations eurent lieu sur les frontières du nouvel État. La décision finale fut prise lors de la Conférence de paix de Paris en janvier 1919. La délégation tchèque, menée par le Premier ministre Karel Kramář et le ministre des Affaires étrangères Edvard Beneš, tenta avec insistance de convaincre les Alliés que la Tchécoslovaquie devait obtenir ses frontières historiques.\n\nSi les négociations au sujet de la Ruthénie et de la Haute-Hongrie furent couronnées de succès, la délégation tchèque dut se retirer dans de nombreux cas, comme pour Kladsko, la Lusace ou encore un corridor vers la Yougoslavie.\n\nLa Lusace jouait un rôle spécifique dans ces revendications territoriales. Il existait un mouvement national sorabe relativement fort, demandant l’autonomie au sein de l’Allemagne ou l’incorporation à la nouvelle république tchécoslovaque. La question de la Lusace n’était pas d’importance vitale pour les diplomates tchécoslovaques. Sans un soutien clair de l’État tchécoslovaque, la délégation sorabe non officielle ne put imposer ses demandes à l’ordre du jour de la Conférence. Néanmoins, les bonnes relations entre Tchèques et Sorabes se poursuivirent durant la Première République tchécoslovaque.\n\nHistoriquement, la Lusace devint partie de la Prusse au Congrès de Vienne en 1815. Malgré la germanisation, la langue slave des habitants, connus sous le nom de Sorabes ou Wendes, fut préservée dans une certaine mesure. Au XIXe siècle, un séminaire sorabe fut fondé à Prague pour soutenir les étudiants venus de Lusace.\n\nAprès la Seconde Guerre mondiale, les habitants de la Lusace tentèrent de rejoindre la Tchécoslovaquie, mais les Alliés ne soutinrent pas leurs efforts."
czke.350.a:0 "Nous devons protéger nos amis sorabes de l’oppression allemande."
CZKE_czechoslovak_government_reform:0 "Réformer le gouvernement tchécoslovaque"
CZKE_czechoslovak_government_reform_desc:0 "Le 6 novembre 1935, le Premier ministre de l’époque, Jan Malypetr, fut élu nouveau président de la Chambre des députés après le décès de l’ancien président Bohumír Bradáč. Comme les postes de Premier ministre et de président de la Chambre des députés étaient mutuellement exclusifs, un nouveau Premier ministre, Milan Hodža, dut être nommé."
CZKE_czechoslovak_government_reform_tooltip_reward:0 "\n §YPouvoir politique§!."
czke.400.t:0 "Résultats de l’élection de 1935"
czke.400.d:0 "Le 19 mai 1935, la quatrième élection parlementaire pour les deux chambres du parlement eut lieu dans la Première République tchécoslovaque – pour la Chambre des députés et le Sénat de l’Assemblée nationale de la République tchécoslovaque.\n\nSelon le recensement de 1930, la République tchécoslovaque comptait alors 14 479 565 habitants, avec une composition nationale variée :\n\n- Tchèques et Slovaques : 66,9 % (9 688 770)\n- Allemands : 22,3 % (3 231 688)\n- Hongrois : 4,8 % (691 923)\n- Ruthènes : 3,8 % (549 169)\n- Polonais : 0,6 % (81 737).\n\nLe nombre de votes valides pour la Chambre des députés s’éleva à 8 231 412, soit près de 92 % de participation.\n\nLes résultats des élections parlementaires de 1935 apportèrent une surprise considérable. Le parti d’opposition des Allemands des Sudètes (SdP, dirigé par Konrad Henlein) devint le vainqueur au niveau national, avec 15,2 % pour la Chambre et 15 % pour le Sénat. Plus des deux tiers des électeurs allemands des Sudètes votèrent pour le SdP.\n\nLe parti gouvernemental le plus fort, le parti agraire (Parti républicain des agriculteurs et paysans), obtint 14,3 %, et les sociaux-démocrates 12,6 %. Grâce au système électoral, le parti agraire obtint finalement le plus de mandats, 45, contre 44 pour le SdP.\n\nÀ la suite de ces élections, la coalition gouvernementale existante (dirigée par Jan Malypetr) perdit sa majorité (149 sièges sur 300) et démissionna. En juillet, une nouvelle coalition élargie (sans le SdP) fut formée. Toutefois, Milan Hodža remplaça Jan Malypetr comme Premier ministre en novembre 1935 et, dans les mois suivants, apporta des changements à son cabinet."
czke.400.a:0 "Réformer le gouvernement"
CZKE_extend_military_service:0 "Prolonger le service militaire"
CZKE_extend_military_service_desc:0 "Le service militaire obligatoire en Tchécoslovaquie dura initialement 14 mois, puis fut porté à 18 et même 24 mois durant les années critiques précédant la guerre.\n\nMême après la formation initiale, chaque homme était tenu de participer à des exercices militaires pour une durée totale de 14 semaines."
CZKE_extend_military_service_tooltip_reward:0 "\nChangement dans la §YLoi de conscription§! OU dans une §YIdée nationale§! liée à la §Ymain-d’œuvre§!."
czke.401.t:0 "Le service militaire en Tchécoslovaquie"
czke.401.d:0 "Lorsque la Tchécoslovaquie émergea en 1918, la durée du service militaire était de 14 mois. En 1924, elle passa à 18 mois, puis une conscription de deux ans fut instaurée en 1933 en raison de la situation internationale.\n\nLe service militaire obligatoire concernait tous les citoyens masculins, y compris les minorités allemandes et autres. Les plans de mobilisation durent donc être adaptés pour éviter les désertions en cas de conflit avec l’Allemagne.\n\nAprès leur service, les conscrits passaient dans les réserves actives, divisées en Ire et IIe réserves.\n\n- La Ire réserve regroupait les hommes valides jusqu’à 40 ans, mobilisables en cas de guerre et destinés à renforcer l’armée.\n- La IIe réserve concernait les hommes au-delà de 40 ans ou inaptes au service actif. Ils remplissaient des rôles de soutien ou servaient à l’arrière. Les conscrits en surnombre ou ceux dont l’absence aurait nui gravement à la société rejoignaient une réserve dite « de remplacement », techniquement incluse dans la IIe.\n\nLes hommes de la Ire réserve devaient effectuer plusieurs exercices : deux de quatre semaines et trois de trois semaines. Les réservistes de remplacement ajoutaient quatre semaines de formation.\n\nLe ministère de la Défense nationale pouvait aussi convoquer les réservistes pour des exercices spéciaux de quatre semaines, notamment lors de l’adoption de nouveaux équipements."
czke.401.a:0 "Prolonger le service militaire"
czke.401.b:0 "Préparer un plan de conscription et de mobilisation des minorités"
CZKE_minority_mobilization_plan:0 "Plan de conscription et de mobilisation des minorités"
CZKE_minority_mobilization_plan_desc:0 "Le plan de conscription des minorités est en vigueur."
CZKE_field_medics:0 "Achever l’hôpital militaire Masaryk"
CZKE_field_medics_desc:0 "Les services médicaux militaires en temps de paix en Tchécoslovaquie comprenaient un réseau de 12 hôpitaux divisionnaires.\n\nEn 1925, pour le 75e anniversaire du président Tomáš Garrigue Masaryk, le parlement décida de construire un nouvel hôpital militaire ; sa construction commença en 1936."
CZKE_field_medics_tooltip_reward:0 "\n§YExpérience de l’armée§! et bonus de §Yrecherche§! lié aux §Yhôpitaux de campagne§!."
czke.402.t:0 "Hôpital militaire Masaryk à Prague"
czke.402.d:0 "Les services médicaux militaires de la Première République reposaient sur 12 hôpitaux divisionnaires. L’hôpital divisionnaire n°1, situé place Charles à Prague, était alors le plus prestigieux.\n\nEn 1925, pour le 75e anniversaire du président Masaryk, le parlement décida de construire un nouvel hôpital militaire. Le projet retenu, conçu en 1930 par l’architecte B. Adamek, alliait modernité médicale et fonctions de mobilisation.\n\nLa construction commença en mars 1936 et la première phase s’acheva en 1938. L’hôpital, avec cliniques chirurgicale et interne, chaufferies et logements pour militaires, fut inauguré le 1er août 1938 et accueillit ses premiers patients un mois plus tard.\n\nDes extensions étaient prévues mais la Seconde Guerre mondiale interrompit les travaux. L’armée allemande occupa l’hôpital, l’utilisant comme lazaret de réserve. Aujourd’hui, l’établissement est connu sous le nom d’Hôpital universitaire militaire de Prague et assure formation, soins et recherche pour l’armée tchèque."
czke.402.a:0 "Ouvrir l’hôpital militaire Masaryk"
CZKE_sokol_movement:0 "Soutenir le mouvement Sokol"
CZKE_sokol_movement_desc:0 "Le mouvement Sokol (du mot slave pour « faucon ») est une organisation de gymnastique tous âges, fondée à Prague en 1862 par Miroslav Tyrš et Jindřich Fügner. Basé sur le principe « un esprit sain dans un corps sain », il fut aussi crucial pour l’identité nationale tchèque."
CZKE_sokol_movement_tooltip_reward:0 "\n §YStabilité§! OU §YMain-d’œuvre§! liée à une §YIdée nationale§!."
czke.403.t:0 "Histoire du mouvement Sokol"
czke.403.d:0 "Le mouvement Sokol (faucon) fut fondé à Prague en 1862 par Miroslav Tyrš et Jindřich Fügner. Basé sur « un esprit sain dans un corps sain », il joua un rôle majeur dans le réveil de l’identité nationale tchèque.\n\nDès le début, le patriotisme fut affiché : voyages en costumes nationaux, participation aux cérémonies, encouragement au patriotisme.\n\nLe plus grand événement est le « všesokolský slet », réunion de tous les membres tous les six ans, dont la première eut lieu en 1882 avec plus de 700 participants.\n\nLe mouvement prospéra durant l’entre-deux-guerres, dépassant le million de membres. Les présidents Masaryk et Beneš en furent membres.\n\nMais la montée du nationalisme entraîna discriminations et antisémitisme, Sokol participant aussi à la « tchécisation » des Allemands des régions frontalières, ce qui renforça la haine interethnique.\n\nSokol fut interdit trois fois : en 1915, sous l’occupation nazie, puis par les communistes après 1948. En 1968, la tentative de renaissance fut réprimée et il ne fut rétabli qu’en 1990."
czke.403.a:0 "Encourager le patriotisme"
czke.403.b:0 "Soutenir les exercices physiques"
CZKE_sokol_movement_1:0 "Mouvement Sokol"
CZKE_sokol_movement_1_desc:0 "'Mens sana in corpore sano'"
CZKE_sokol_movement_2:0 "Mouvement Sokol"
CZKE_sokol_movement_2_desc:0 "'Mens sana in corpore sano'"
CZKE_empower_internationalism:0 "Galvaniser les syndicats rouges"
CZKE_empower_internationalism_desc:0 "Le KSČ était la section tchécoslovaque de l’Internationale communiste, et les syndicats rouges furent créés en 1922. En 1928, le parti comptait environ 138 000 membres, devenant la deuxième plus grande section."
CZKE_empower_internationalism_tooltip_reward:0 "\nChoix entre deux §Yidées nationales§! liées au §Ycommunisme§!."
czke.404.t:0 "Le Profintern en Tchécoslovaquie"
czke.404.d:0 "L’Internationale syndicale rouge (Profintern) coordonnait les activités communistes dans les syndicats.\n\nDans les années 1920, la majorité des syndicats tchécoslovaques rejoignirent le Profintern après des exclusions par les sociaux-démocrates. En 1922, les syndicats rouges tenaient leur congrès, scellant la scission.\n\nLe Parti communiste tchécoslovaque était alors immense, avec 170 000 membres.\n\nDurant la Grande Dépression, les syndicats rouges organisèrent grèves et manifestations, collaborant parfois avec d’autres syndicats.\n\nLa plus importante fut la grève des mineurs de Most en mars 1932, qui mobilisa 40 000 personnes et fit 2 morts et 18 blessés après affrontements avec la police.\n\nDans la seconde moitié des années 1930, les syndicats rouges appelèrent à l’unification contre le fascisme. Après l’occupation allemande, ils furent dissous en 1939."
czke.404.a:0 "Accroître l’influence des syndicats rouges"
czke.404.b:0 "Organiser plus de grèves syndicales !"
CZKE_internationalism:0 "Syndicats rouges"
CZKE_internationalism_desc:0 "Chaque jour, de nouveaux camarades rejoignent le mouvement internationaliste."
CZKE_red_union_strikes:0 "Grèves des syndicats rouges"
CZKE_red_union_strikes_desc:0 "De nouvelles grèves sont organisées par le Profintern."
CZKE_state_defense_law:0 "Amender la loi de défense de l’État"
CZKE_state_defense_law_desc:0 "Pour affronter la menace de l’Allemagne hitlérienne, l’Assemblée nationale promulgua en 1936 la loi n°131 sur la défense de l’État."
CZKE_state_defense_law_tooltip_reward:0 "\n §YPouvoir politique§! OU nationalisation de l’§Yindustrie§! OU changement de §Ylois économiques§! et §Ylois commerciales§!."
czke.405.t:0 "Controverse autour de la loi n°131/1936"
czke.405.d:0 "La loi de 1936 renforçait les pouvoirs du gouvernement pour défendre la république et la démocratie. Son orientation anti-allemande aggrava les tensions ethniques et fut une raison du refus britannique de soutenir Prague durant la crise des Sudètes.\n\nLa loi définissait les « personnes peu fiables », interdites d’exercer certaines activités ou d’obtenir des contrats. Ces décisions n’étaient pas contestables en justice, ce qui ouvrait la voie aux abus.\n\nElle permettait aussi au gouvernement de contrôler toutes les entreprises essentielles.\n\nIroniquement, après 1939, la Wehrmacht l’utilisa pour saisir rapidement l’industrie d’armement tchèque. Un expert allemand la qualifia de « meilleure loi sur l’économie de guerre d’Europe centrale »."
czke.405.a:0 "Réprimer l’opposition politique allemande"
czke.405.b:0 "Mettre en place des mesures d’urgence"
czke.405.c:0 "Nationaliser l’industrie stratégique"
CZKE_state_defense_law_idea:0 "Loi de défense de l’État"
CZKE_state_defense_law_idea_desc:0 "La loi n°131/1936 est en vigueur."
CZKE_democratic_reforms:0 "Préparer l’autonomie des Sudètes"
CZKE_democratic_reforms_desc:0 "Il est temps de résoudre la question des minorités et de préparer une autonomie pour les régions germaniques avant que les conflits n’engloutissent la République."
CZKE_democratic_reforms_tooltip:0 "Les 'réformes constitutionnelles' sont achevées."
CZKE_democratic_reforms_tooltip_reward:0 "\n §YIdée nationale temporaire§! politique nécessaire pour résoudre la question allemande par la Constitution."
czke.406.t:0 "Éviter la crise des Sudètes"
czke.406.d:0 "Depuis 1918, les Allemands des Sudètes dénoncent oppression et absence de droits. Leur région, majoritairement allemande, réclamait autonomie voire rattachement au Reich.\n\nLe gouvernement tchécoslovaque refusa toujours, craignant de perdre un tiers du pays et son centre industriel. Les Allemands se radicalisèrent, surtout après 1933 avec la propagande d’Hitler et le SdP de Henlein.\n\nEn 1938, le nationalisme des deux côtés rendit la coexistence impossible. Les concessions proposées trop tard ne changèrent rien : Hitler voulait détruire la Tchécoslovaquie."
czke.406.a:0 "Préparer les réformes constitutionnelles"
CZKE_constitutional_reforms:0 "Réforme constitutionnelle"
CZKE_constitutional_reforms_desc:0 "L’autonomie des Sudètes est préparée et de nouvelles lois sont mises en place."
CZKE_constitutional_reforms_flag:0 "Nouvelles réformes constitutionnelles"
CZKE_boycott_press_law:0 "Amendement à la loi sur la presse"
CZKE_boycott_press_law_desc:0 "Bien que démocratique, la Tchécoslovaquie évolua vers une démocratie autoritaire via plusieurs lois controversées, dont la 'petite loi sur la presse' de 1933."
CZKE_boycott_press_law_tooltip_reward:0 "\nChoix entre deux récompenses liées à la §Ypolitique§!."
czke.407.t:0 "Controverse sur la loi n°126/1933"
czke.407.d:0 "La loi n°126/1933 renforça la censure déjà permise par la loi de défense de 1923. Elle autorisait la suspension de publications jugées subversives ou obscènes.\n\nAvec la loi de 1933 sur la dissolution des partis et la loi de défense de 1936, le gouvernement disposait de tous les outils pour réprimer les nationalistes allemands et les communistes.\n\nLes partis non tchèques critiquèrent vivement cette loi. Le SdP et les communistes formèrent même une alliance inhabituelle contre la censure, car leur presse était aussi visée. Le journal 'Rudé Právo' fut souvent suspendu."
czke.407.a:0 "Obstructions politiques"
czke.407.b:0 "Appeler à des manifestations"
CZKE_press_law_idea:0 "Loi sur la presse"
CZKE_press_law_idea_desc:0 "La loi n°126/1933 est en vigueur."
CZKE_communist_obstructions_idea:0 "Obstructions parlementaires communistes"
CZKE_communist_obstructions_idea_desc:0 "Le parti communiste bloque l’adoption de la petite loi sur la presse."
CZKE_state_defense_guard:0 "Créer la garde de défense de l’État"
CZKE_state_defense_guard_desc:0 "La Garde de défense de l’État fut créée en 1936 pour protéger les frontières, composée de policiers, gardes des finances, gendarmes et plus tard de citoyens loyaux."
CZKE_state_defense_guard_tooltip_reward:0 "\n\n§YIdée nationale§! liée à l’§Yanti-partisanat§! et bonus de §Yrecherche§! pour la §Ypolice militaire§!."
czke.408.t:0 "Fondation de la Garde de défense de l’État"
czke.408.d:0 "De 1918 à 1936, les frontières étaient gardées par la 'garde financière', rattachée au ministère des Finances. Mais face aux tensions, une force militaire plus solide fut créée : la Stráž obrany státu (SOS).\n\nElle avait trois missions : protéger les frontières, maintenir l’ordre et exécuter les douanes. Elle intégra policiers, gardes financiers, gendarmes et citoyens loyaux (comme des membres de Sokol ou des Allemands antifascistes). Des plans prévoyaient le soutien de l’armée régulière.\n\nLa force prévue était de 38 bataillons, mais 31 seulement furent levés. Leur armement comprenait pistolets, fusils, mitrailleuses légères et grenades.\n\nEn mai 1938, face aux tensions croissantes avec l’Allemagne et les Allemands des Sudètes, la SOS fut déployée aux frontières. Après Munich, elle se replia. Entre 1936 et 1939, 312 de ses membres périrent."
czke.408.a:0 "Établir la Garde de défense de l’État"
CZKE_sos:0 "Garde de défense de l’État"
CZKE_sos_desc:0 "La Garde de défense de l’État a été créée et garde les frontières de la Tchécoslovaquie."
CZKE_national_unity_government:0 "Former le Parti de l’Unité nationale"
CZKE_national_unity_government_desc:0 "Le Parti de l’Unité nationale fut créé en novembre 1938, après l’occupation allemande, comme une dernière tentative de sauver la Tchécoslovaquie.\n\nIl rassemblait presque tous les partis de centre-droit ainsi que le Parti national-socialiste tchécoslovaque."
CZKE_national_unity_government_tooltip_trigger:0 "§YLa conférence de Yalta§! n’a pas eu lieu"
CZKE_national_unity_government_tooltip_reward:0 "\n §OBonus spécial :§! Supprime les §Ypénalités liées aux minorités§!, change le §YGouvernement§!."
czke.409.t:0 "Formation du Parti de l’Unité nationale"
czke.409.d:0 "Dans l’espoir d’apaiser les Allemands après l’accord de Munich, Rudolf Beran regroupa la plupart des partis non-socialistes du pays au sein du Parti de l’Unité nationale, dont il devint le chef. Il soumit également la presse à une censure stricte. Toutefois, il présida aussi à l’octroi de l’autonomie tant attendue par les Slovaques et les Ruthènes. Rien de tout cela ne suffit à empêcher la sécession de la Slovaquie le 14 mars ni l’occupation allemande du reste du pays le lendemain. Il devint ensuite le premier Premier ministre du Protectorat de Bohême-Moravie jusqu’à sa retraite le 27 avril 1939.\n\nAprès la guerre, Beran fut arrêté comme collaborateur par les autorités communistes et, lors d’un procès politique truqué, condamné à vingt ans de prison. Il mourut en 1954 à la prison de Leopoldov."
czke.409.a:0 "Qu’il en soit ainsi."
CZKE_national_unity_government_idea:0 "Gouvernement d’unité nationale"
CZKE_national_unity_government_idea_desc:0 "Un nouveau gouvernement fut formé dans une ultime tentative de sauver la République."
CZKE_sudetenland_autonomy:0 "Autonomie pour les régions allemandes"
CZKE_sudetenland_autonomy_desc:0 "Depuis le début des années 1920, des plans prévoyaient d’accorder une plus grande autonomie à certaines régions de Tchécoslovaquie, dont les Sudètes. Mais la politique intérieure du pays bloqua ces initiatives. Qui sait, peut-être qu’accorder une autonomie accrue aux régions allemandes aurait sauvé des milliers, voire des millions de vies."
CZKE_levy_liechtenstein_properties:0 "Taxer les propriétés [LIE.GetAdjective]"
CZKE_levy_liechtenstein_properties_desc:0 "[LIE.GetNameDefCap] possède plusieurs propriétés dans notre pays. Si nous les taxons davantage, nous pourrions en tirer profit."
CZKE_sudetenland_autonomy_tooltip_reward:0 "\n Choix entre deux types d’§Yautonomie des Sudètes§!."
czke.410.t:0 "Accorder l’autonomie aux Sudètes"
czke.410.d:0 "Après de longs mois de négociations politiques et la rédaction de nouvelles lois constitutionnelles et de protection des minorités, le moment est venu de déterminer la forme et l’ampleur de l’autonomie accordée aux régions majoritairement peuplées d’Allemands."
czke.410.a:0 "Un certain degré d’autonomie suffira."
czke.410.b:0 "Les Sudètes nécessiteront une autonomie plus large."
CZKE_higher_autonomy_reward_1:0 "\nLes régions des §YSudètes§! et de l’§YSudète orientale§! ne sont plus des cœurs pour la Tchécoslovaquie."
CZKE_higher_autonomy_reward_2:0 "\nL’industrie nationalisée est restituée aux propriétaires allemands (§G-2§! §Yusines civiles§! dans les §YSudètes§!)."
CZKE_content_minorities:0 "Minorités satisfaites"
CZKE_content_minorities_desc:0 "Avec la résolution des principaux problèmes liés aux Sudètes et l’octroi d’une plus grande autonomie aux Allemands, la Tchécoslovaquie semble plus forte que jamais."
CZKE_partial_mobilization:0 "Déclarer la mobilisation partielle"
CZKE_partial_mobilization_desc:0 "Au printemps 1938, la situation politique en Tchécoslovaquie s’était tellement détériorée que le gouvernement annonça une mobilisation partielle.\n\nDes réservistes et spécialistes militaires présélectionnés furent appelés, et l’armée atteignit bientôt environ 383 000 hommes."
CZKE_partial_mobilization_tooltip_reward:0  "\nChangement gratuit de §Yloi économique§!."
czke.411.t:0 "Ordre de mobilisation partielle"
czke.411.d:0 "Prétextant des manœuvres hostiles de la Wehrmacht durant [GetDateText], le gouvernement de Prague réagit aux rapports de concentrations militaires allemandes le long de la frontière tchécoslovaque. Un décret fut adopté, instruisant le ministre de la Défense nationale, František Machník, de rappeler les réservistes et spécialistes militaires présélectionnés.\n\nLes réservistes répondirent rapidement et avec enthousiasme. Après des mois de passivité, d’incertitude et d’humiliation, la voie semblait claire : la Tchécoslovaquie n’était pas l’Autriche ; elle ne serait pas effacée sans une défense organisée, jusqu’à la mort s’il le fallait.\n\nHitler fut furieux de l’audace du gouvernement de Prague. La crise de mai ne fit que renforcer sa résolution de détruire la Tchécoslovaquie. Il estima que la concentration stratégique rapide et enthousiaste de l’autre côté de la frontière avait fait perdre du prestige à l’Allemagne et à lui-même. Il réécrivit alors la directive de l’Opération Verte, dont la toute première phrase affirmait désormais : « Il est ma volonté irrévocable d’écraser la Tchécoslovaquie par une action militaire dans un avenir proche... »"
czke.411.a:0 "Nous ne céderons pas !"
czke.412.t:0 "La Tchécoslovaquie ordonne la mobilisation partielle"
czke.412.d:0 "Prétextant des manœuvres hostiles de la Wehrmacht durant la nuit du [GetDateText], le gouvernement de Prague réagit aux rapports de concentrations militaires allemandes le long de la frontière tchécoslovaque. Un décret fut adopté, instruisant le ministre de la Défense nationale, František Machník, de rappeler les réservistes et spécialistes militaires présélectionnés.\n\nComme prévu, la diplomatie allemande réagit avec fureur à cette mobilisation partielle. Le ministre allemand à Prague, Ernst Eisenlohr, nia l’existence de toute concentration militaire lors d’un entretien avec le ministre tchèque des Affaires étrangères, Kamil Krofta, et qualifia ces accusations de « grober Unsinn » (absurdités grossières)."
czke.412.a:0 "Ça ne finira pas bien."
CZKE_partial_mobilization_1938:0 "Efforts de mobilisation"
CZKE_partial_mobilization_1938_desc:0 "Le gouvernement a ordonné une mobilisation partielle."
CZKE_military_coup:0 "Coup d’État militaire"
CZKE_military_coup_desc:0 "Mécontents de la situation politique et de la politique d’apaisement des alliés occidentaux, certains officiers supérieurs de l’armée tchécoslovaque pourraient recourir à un coup d’État militaire en ultime tentative de sauver la République."
CZKE_military_coup_tooltip_reward:0 "\n Choix entre deux types de §Ygouvernement militaire§!."
CZKE_military_coup_tt:0 "A au moins §Y40 % de force militaire§! comparée au §YReich allemand§!."
czke.413.t:0 "Coup d’État des légionnaires"
czke.413.d:0 "Exaspérés par la manière dont les diplomates et les politiciens géraient la crise internationale, et lassés des politiques d’apaisement des prétendus alliés occidentaux, certains éléments radicaux de l’armée tchécoslovaque, avec le soutien général de la population tchèque, décidèrent d’un coup pacifique pour préserver la République.\n\nLe général Syrový fut convoqué au château de Prague pour calmer les manifestants qui scandaient « Donnez-nous des armes ou Syrový » ou « Vive l’armée, nous voulons le général Syrový ».\n\nLe vieux héros de la bataille de Zborov accepta à contrecœur le poste de Premier ministre et forma un gouvernement provisoire de transition."
czke.413.a:0 "Former un nouveau gouvernement militaire."
CZKE_militarism_focus:0 "Gouvernement de défense de la République"
CZKE_militarism_focus_desc:0 "Un gouvernement provisoire de transition, large coalition, a été établi."
CZKE_militarism_focus_2:0 "Gouvernement des légionnaires"
CZKE_militarism_focus_2_desc:0 "Des éléments plus radicaux de l’armée contrôlent désormais le gouvernement."
CZKE_oppressed_minorities:0 "Loi martiale"
CZKE_oppressed_minorities_desc:0 "La loi martiale a été déclarée dans les Sudètes et d’autres régions peuplées par des minorités."
CZE_republic_defense_party:0 "Gouvernement de défense de la République"
CZE_legionary_party:0 "Gouvernement des légionnaires"
CZKE_radola_gajda_general_tooltip:0 "§YRadola Gajda§! : Maréchal (Doctrine offensive)\n"
legionary_government:0 "Les légionnaires contrôlent le gouvernement"
republic_defense_government:0 "Gouvernement de défense nationale formé"
CZKE_lev_prchala_general:0 "Lev Prchala"
CZKE_lev_prchala_general_desc:0 "Le général Prchala fut un opposant farouche à la capitulation de Munich et commandant de la IVe Armée qui défendait la frontière sud-morave en 1938.\n\nIl était également soupçonné d’avoir élaboré un plan de coup d’État militaire."
CZKE_zaolzie_for_alliance:0 "Zaolzie pour une alliance polonaise"
CZKE_zaolzie_for_alliance_desc:0 "La région de Zaolzie était disputée entre la Tchécoslovaquie et la Pologne depuis 1920. Il est temps de régler ce différend et d’unir nos forces contre les fascistes et les communistes."
CZKE_zaolzie_for_alliance_tooltip_reward_1:0 "\n§YÉvénement diplomatique§! pour la §YPologne§! proposant de résoudre enfin le différend sur la Silésie de Cieszyn.\n"
CZKE_zaolzie_for_alliance_tooltip_reward_2:0 "\n§YLa Pologne§! rejoint la §YPetite Entente§! en échange de la région de §YZaolzie§! (80 % de chance)."
czke.414.t:0 "Histoire du différend polono-tchécoslovaque sur le Zaolzie"
czke.414.d:0 "La guerre polono-tchécoslovaque fut une confrontation militaire locale entre les nouveaux États de Tchécoslovaquie et de Pologne au sujet de la Silésie de Cieszyn en 1919. Dans certaines sources tchèques, le conflit est appelé la « guerre de sept jours » en raison de sa rapidité.\n\nL’importance majeure de la Silésie de Cieszyn résidait dans son bassin houiller autour de Karviná et dans la précieuse ligne ferroviaire Košice-Bohumín, qui reliait les terres tchèques à la Slovaquie. De plus, le nœud ferroviaire de Bohumín constituait un carrefour de transport international.\n\nLe casus belli fut la préparation par la Pologne d’élections parlementaires dans une zone provisoirement désignée comme polonaise, où aucun pouvoir souverain ne devait s’exercer. Le gouvernement polonais refusa la demande de Prague de suspendre ces préparatifs, et la Tchécoslovaquie décida de les stopper par la force. Comme la plupart des troupes polonaises combattaient la République nationale ukrainienne occidentale en Galicie orientale, les forces tchécoslovaques prirent rapidement l’avantage. Toutefois, l’Entente imposa l’arrêt de l’offensive et les deux pays durent signer une nouvelle ligne de démarcation, plaçant le territoire contesté sous contrôle international.\n\nLe partage définitif intervint en juillet 1920, lors de la conférence de Spa. La ligne ferroviaire reliant les terres tchèques à la Slovaquie et le territoire au sud furent attribués à la Tchécoslovaquie, tandis que le nord de la ligne fut transféré à la Pologne. La région sous contrôle tchécoslovaque prit alors le nom de Zaolzie (« terres au-delà de l’Olza »).\n\nLa Pologne occupa brièvement la région durant la crise de Munich, avant qu’elle ne soit annexée par l’État slovaque indépendant, puis restituée à la Tchécoslovaquie après la Seconde Guerre mondiale. Les différends furent définitivement réglés en 1958."
czke.414.a:0 "Réglons enfin le différend sur la Silésie de Cieszyn."
czke.415.t:0 "La Tchécoslovaquie propose le Zaolzie pour une alliance militaire"
czke.415.d:0 "Le gouvernement tchécoslovaque nous a informés qu’il souhaite régler le différend sur la région de Zaolzie. Il accepte de céder la zone en échange de notre soutien militaire dans le cadre de la Petite Entente."
czke.415.a:0 "Excellent"
czke.415.b:0 "Hors de question ! Nous l’aurons bien assez tôt."
czke.416.t:0 "La Pologne accepte"
czke.416.d:0 "Le gouvernement polonais nous a informés qu’il accepte notre proposition. Nous allons préparer le transfert de la région sous contrôle polonais et le rapatriement de nos citoyens et militaires."
czke.416.a:0 "Excellent"
czke.417.t:0 "La Pologne refuse"
czke.417.d:0 "Le gouvernement polonais nous a fait savoir qu’il n’est pas intéressé par notre proposition. Néanmoins, il a clairement indiqué qu’il considère toujours le Zaolzie comme faisant partie de son territoire et en exige la restitution — sans conditions."
czke.417.a:0 "Maudits Polonais !"
CZKE_together_against_berlin:0 "Unis contre Berlin"
CZKE_together_against_berlin_desc:0 "Le gouvernement allemand a été une menace constante pour l’indépendance récemment acquise de la Tchécoslovaquie et de la Pologne. La meilleure défense contre ce grand mal est une frappe préventive pour briser ses plans expansionnistes."
CZKE_czech_fascism_onrise:0 "Unifier la Communauté nationale fasciste"
CZKE_czech_fascism_onrise_desc:0 "Le mouvement d’extrême droite dominant en Tchécoslovaquie fut la Communauté nationale fasciste, calquée sur le Parti national fasciste de Mussolini, qui comptait environ 200 000 adhérents en 1926.\n\nEn revanche, l’extrême droite slovaque était principalement représentée par les nationalistes chrétiens du Parti populaire slovaque de Hlinka."
CZKE_czech_fascism_onrise_tooltip_reward:0 "\nChoix entre deux types de soutien au §Yfascisme tchèque§!."
czke.418.t:0 "Le fascisme dans la Tchécoslovaquie de l’entre-deux-guerres"
czke.418.d:0 "La Communauté nationale fasciste (Národní obec fašistická) était un mouvement fasciste tchécoslovaque dirigé par Radola Gajda et inspiré du fascisme de Benito Mussolini. Le parti fut fondé en mars 1926 par la fusion d’un groupe de dissidents nationaux-démocrates, les « Rouge-Blancs », avec divers autres groupes de droite en Bohême et Moravie.\n\nIl se distinguait par une forte opposition à l’Allemagne, qui perdura même après l’ascension d’Hitler. Le NOF regardait plutôt vers l’Italie, adoptant le modèle du Parti national fasciste de Mussolini. En cela, il différait nettement de son principal rival, « Vlajka », aligné sur Hitler.\n\nLes cibles des critiques du NOF incluaient les Juifs, les communistes, le gouvernement tchécoslovaque et les Magyars. Le mouvement créa aussi une jeunesse et un petit syndicat.\n\nIl prônait également un panslavisme et espérait diriger avec la Pologne une grande alliance slave destinée à renverser le communisme en URSS. Son programme économique était corporatiste, avec une forte composante agricole. Le NOF attira d’abord des vétérans des Légions tchécoslovaques.\n\nLe parti échoua à conserver son influence et n’obtint que 2 % des voix et sept sièges au Conseil national aux élections de 1935. Il fut finalement dissous lors de l’occupation allemande.\n\nDurant la majeure partie de son existence, il fut dirigé par l’ancien général Radola Gajda, héros des Légions en Russie. En 1933, il fut brièvement emprisonné et privé de son rang et de sa pension lors du scandale de la « mutinerie de Židenice », une tentative avortée de coup d’État militaire menée par des éléments fascistes.\n\nGajda fut marginalisé durant l’occupation et abandonna la politique. Il aida parfois la résistance tchèque, notamment en facilitant la fuite d’officiers vers la Pologne et en couvrant les activités de son fils. Il fut interrogé par la Gestapo mais échappa à la prison.\n\nÀ la fin de la guerre, il fut emprisonné par le NKVD et interrogé sous des conditions très dures. En avril 1947, il fut jugé pour « propagation du fascisme et du nazisme », le procureur réclamant la prison à vie. Sa culpabilité était loin d’être établie et il fut condamné à seulement deux ans. Libéré peu après, ruiné et oublié, il mourut quelques mois plus tard."
czke.418.a:0 "Utiliser la rhétorique anticommuniste."
czke.418.b:0 "Rassembler les partisans anti-allemands."
demoted_general:0 "Ex-général ambitieux"
czke.419.t:0 "Montée du fascisme tchèque"
czke.420.t:0 "Sympathies fascistes parmi les anciens légionnaires"
czke.421.t:0 "Coup d’État fasciste"
czke.422.t:0 "Guerre civile pour le fascisme tchèque"
czke.423.t:0 "Formation des Gardes de Gajda"
czech_fascist_assault_divisions:0 "Gardes de Gajda"
czech_fascist_assault_divisions_desc:0 "Les Gardes de Gajda (tchèque : Gajdovy Gardy) représentaient la branche paramilitaire du NOF, souvent composée d’anciens légionnaires."
czke.424.t:0 "La menace du communisme"
czke.425.t:0 "La menace du national-socialisme"
czke.425.d:0 "« [Root.GetLeader] voudrait vous faire croire que [Root.GetNameDef] est sûr et uni. Il n’est pas surprenant que de tels mensonges aient empoisonné l’esprit de notre peuple alors qu’un serpent se love juste de l’autre côté de la frontière ! Regardez au-delà et voyez nos compatriotes se déchirer au nom du national-socialisme, déclarant la fin des nations. Combien de temps avant qu’ils ne déclarent aussi la mort de notre nation ? Le [Root.GetRulingParty] nous protégera-t-il de cette menace ? »\n\nLa rhétorique pangermaniste d’Hitler a renforcé la croissance du mouvement fasciste tchèque en [ROOT.GetNameDef]. De nombreux modérés qui auraient normalement rejeté le fascisme comme une idéologie égarée considèrent désormais ce danger comme bien réel. Entre le communisme de nos voisins et un régime fasciste, beaucoup préféreraient ce dernier. Certains pourraient même être prêts à le soutenir activement."
czke.425.a:0 "Nous serons l’avant-garde contre le national-socialisme allemand !"
czke.426.t:0 "Les fascistes tchèques exigent un référendum"
czech_fascist_revolutionaries:0 "Révolutionnaires fascistes tchèques"
czech_fascist_revolutionaries_desc:0 "Si le soutien à la neutralité dépasse 70 %, la nation plongera dans la guerre civile. Si le soutien à la neutralité tombe en dessous de 30 %, l’activité révolutionnaire cessera."
czke.427.t:0 "Les fascistes marchent sur Prague"
czke.428.t:0 "Gajda ridiculisé"
CZKE_ban_communism:0 "Consolider l’État tchécoslovaque"
CZKE_ban_communism_desc:0 "Les fascistes de Tchécoslovaquie rêvaient depuis des décennies d’un État national fort. Enfin, le moment est venu de transformer ce rêve en réalité."
CZKE_ban_communism_tooltip_reward:0 "\nChoix entre trois §YIdées nationales§! liées au §Yfascisme§!."
removes_communism_ideas:0 "Supprime toutes les §YIdées nationales§! liées au §Ycommunisme§!."
czke.429.t:0 "État fasciste tchécoslovaque"
czke.429.d:0 "La Communauté nationale fasciste (NOF) s’inspira du fascisme italien et l’adapta aux conditions tchèques. Elle exigeait un État national fort fondé sur des principes corporatistes et empreint d’un vif sentiment anti-allemand.\n\nLe fascisme tchèque se présentait comme au-dessus des classes sociales établies. Il demandait la subordination des intérêts personnels et de classe aux besoins de la nation dans son ensemble, ce que traduisait la devise du NOF : « Le bien-être du peuple doit être la loi suprême ».\n\nLe panslavisme était un thème récurrent parmi les fascistes tchèques, mais comme beaucoup de membres du NOF étaient d’anciens légionnaires, l’anticommunisme y était également très fort.\n\nDiverses organisations de jeunesse devaient éduquer et endoctriner une nouvelle génération de citoyens et soldats obéissants.\n\nDans l’esprit des dirigeants du NOF, le gouvernement devait se composer de huit ministres et experts exclusivement d’origine tchèque ou slovaque. Les Allemands, Hongrois et Juifs ne pouvaient devenir membres du gouvernement ; toutefois, leurs droits civiques leur seraient garantis.\n\nEn outre, le NOF prônait des restrictions sur les grandes entreprises, les cartels et les monopoles. L’économie nationale et le secteur privé devaient tendre à l’autosuffisance et à un équilibre entre production et consommation.\n\nDans l’ensemble, les fascistes tchèques rêvaient d’un État totalement irréaliste, mais ils n’eurent jamais l’occasion de prouver qu’ils avaient tort."
czke.429.a:0 "Expulser les représentants des minorités des fonctions publiques."
czke.429.b:0 "Soutenir les mouvements de jeunesse fascistes."
czke.429.c:0 "Éradiquer les communistes."
CZKE_anti_communism:0 "Persécution des communistes"
CZKE_anti_communism_desc:0 "Divers groupes fascistes en Tchécoslovaquie étaient soit pro-nazis, soit anti-nazis, mais tous étaient anticommunistes."
CZKE_military_youth_idea:0 "Mouvements de jeunesse fascistes"
CZKE_military_youth_idea_desc:0 "Plusieurs organisations de jeunesse fascistes furent créées en Tchécoslovaquie."
CZKE_join_axis:0 "Pactiser avec le diable"
CZKE_join_axis_desc:0 "En mettant de côté les hostilités avec l’Allemagne, la Tchécoslovaquie devrait rejoindre le pacte anti-Komintern et reprendre les armes contre les bolcheviques, comme l’avaient fait les Légions tchécoslovaques en Russie vingt ans plus tôt."
CZKE_join_axis_tooltip_reward:0 "\n§YÉvénement diplomatique§! pour le §YReich allemand§! proposant de résoudre la question des Allemands des Sudètes.\n"
CZKE_join_axis_tooltip_reward_2:0 "\nChance que la §YTchécoslovaquie§! rejoigne l’§Yaxe§!."
czke.430.t:0 "Vassal du Reich allemand"
czke.430.d:0 "Nos soi-disant « alliés occidentaux » nous ont abandonnés et nous sommes seuls face à la puissance du Reich allemand. Peut-être serait-il plus sage de placer le salut de l’État au-dessus des querelles internes et de négocier avec Hitler. Après tout, la menace rouge semble bien plus dangereuse, comme s’en souviennent nombre de nos frères légionnaires après des années passées à combattre les bolcheviques en Russie."
czke.430.a:0 "Inviter Herr Ribbentrop à Prague."
CZKE_seek_accommodation_with_germany:0 "Rejoindre le pacte anti-Komintern"
czke.431.t:0 "La Tchécoslovaquie négocie"
czke.431.d:0 "Tournure intéressante des événements en Tchécoslovaquie. Notre ambassadeur à Prague nous a informés qu’avec Edvard Beneš écarté, la nouvelle direction tchécoslovaque semble bien plus disposée à trouver un compromis avec nous.\n\nPeut-être qu’un tel arrangement éviterait un bain de sang inutile. Que devons-nous faire ?"
czke.431.a:0 "Envoyer Ribbentrop à Prague"
czke.431.b:0 "Ne rien faire ; la Tchécoslovaquie sera détruite."
czke.432.t:0 "Négociations diplomatiques à Prague"
czke.432.d:0 "Après plusieurs jours de négociations, il est clair que les Allemands ne veulent pas seulement une solution diplomatique au problème des Sudètes. Ils ont émis plusieurs exigences fermes et menacé de guerre si les négociations échouaient."
czke.432.a:0 "Nous devons accepter."
czke.432.b:0 "Inacceptable !"
CZKE_reich_support:0 "Soutien industriel au Reich allemand"
CZKE_reich_support_desc:0 "Škoda et d’autres entreprises d’armement produisent désormais pour la Wehrmacht."
CZKE_czech_industry_bonus:0 "Industrie tchécoslovaque"
CZKE_czech_industry_bonus_desc:0 "L’industrie tchécoslovaque fournit du matériel de guerre à la Wehrmacht."
CZKE_svatoplukovy_gardy:0 "Les Gardes de Svatopluk"
CZKE_svatoplukovy_gardy_desc:0 "Les Gardes de Svatopluk (tchèque : Svatoplukovy Gardy) représentaient la branche paramilitaire de Vlajka, calquée sur la SA."
CZKE_czechoslovak_protectorate:0 "Protectorat tchécoslovaque"
CZKE_czechoslovak_protectorate_desc:0 "La majeure partie de l’industrie d’armement tchécoslovaque travaille désormais pour la machine de guerre allemande."
CZKE_higher_autonomy_reward_1_b:0 "\nLes régions des §YSudètes§! et de la §YSudète orientale§! ne sont plus des cœurs pour la Tchécoslovaquie.\n\n"
czke.433.t:0 "Aucune réponse"
czke.433.d:0 "Nous n’avons toujours reçu aucune réponse du côté allemand. Cela ne peut signifier qu’une seule chose."
czke.433.a:0 "Déclarer la mobilisation générale"
CZKE_nazi_puppet:0 "Sous la protection du Reich"
CZKE_nazi_puppet_desc:0 "Il est désormais clair que nous ne pouvons plus résister au Reich allemand. Nous devons négocier un accord avec lui pour préserver la Tchécoslovaquie."
CZKE_nazi_puppet_tooltip_reward:0 "\n §OBonus spécial :§! Des éléments collaborationnistes pro-nazis tenteront un coup d’État avec le soutien du §YReich allemand§!. En cas de succès, un §YGouvernement fantoche§! sera instauré."
czke.434.t:0 "Protectorat tchécoslovaque"
czke.434.d:0 "Il est désormais clair que nous ne pouvons plus résister au Reich allemand. Nos alliés occidentaux nous ont trahis et les bolcheviques nous menacent. Certains mouvements nationalistes, comme « Vlajka », souhaitent infléchir la politique anti-allemande actuelle et négocier un accord avec le Reich.\n\nCertains les qualifieraient de traîtres et de collaborateurs nazis, mais des hommes comme Jan Rys-Rozsévač veulent bâtir une Tchécoslovaquie nouvelle et plus forte.\n\nHistoriquement, Vlajka fut un mouvement fasciste radical qui, sous l’influence de Jan Rys-Rozsévač, passa du chauvinisme anti-allemand traditionnel à la collaboration avec les nazis et la Gestapo.\n\nAu début, les autorités d’occupation soutinrent ce groupe de collaborateurs et l’utilisèrent à des fins de propagande. Mais une fois leur utilité terminée, Vlajka fut dissous fin 1942, et ses dirigeants, dont Rys-Rozsévač, furent envoyés au camp de concentration de Dachau.\n\nAprès la guerre, Rys-Rozsévač et d’autres membres de Vlajka furent condamnés à mort."
czke.434.a:0 "Prêter allégeance au Reich allemand."
CZE_vlajka_party:0 "ČNST - Vlajka"
CZE_vlajka_party_long:0 "Český národně-sociální tábor - Vlajka"
removes_anti_fascist_ideas:0 "\n§ODéclare la loi martiale§! (supprime les §YIdées nationales§! liées à l’antifascisme, au communisme ou à la démocratie).\n\n"
czke.435.t:0 "La Tchécoslovaquie demande protection"
czke.435.d:0 "Les éléments fascistes radicaux en Tchécoslovaquie, représentés par Herr Rozsevac de Vlajka, souhaitent prendre le pouvoir et instaurer un nouveau gouvernement basé sur des idées nationales-socialistes.\n\nLe pays est isolé sur la scène internationale et les luttes politiques internes offrent une occasion unique de le sécuriser. Toutefois, Vlajka requiert notre aide pour organiser le coup d’État et stabiliser le pays ensuite.\n\nQuels sont vos ordres ?"
czke.435.a:0 "Soutenir « Vlajka »"
czke.435.b:0 "Nous avons d’autres plans pour la Tchécoslovaquie."
czke.436.t:0 "Vlajka prend le contrôle de la Tchécoslovaquie"
czke.436.d:0 "Avec le soutien allemand acquis, il ne faudra que quelques jours pour sécuriser le pays. Assurons-nous que nos milices arrêtent tous les fauteurs de troubles avant qu’ils ne puissent fuir. Nous ne pouvons pas nous permettre de les laisser jouer les héros en exil."
czke.436.a:0 "Exécuter le coup d’État."
czke.437.t:0 "L’Allemagne n’est pas intéressée"
czke.437.d:0 "La direction allemande n’est pas intéressée par notre proposition. Nous sommes livrés à nous-mêmes."
czke.437.a:0 "La Tchécoslovaquie est condamnée."
CZKE_petition_league_of_nations:0 "Pétitionner la Société des Nations"
CZKE_petition_league_of_nations_desc:0 "Avec la crise ethnique évitée, nous devrions inviter une commission internationale à examiner les souffrances prétendues et l’oppression ethnique des Allemands en Tchécoslovaquie."
CZKE_petition_league_of_nations_tooltip_reward:0 "\n §OBonus spécial :§! Les Britanniques et les Français se rangeront du côté des Tchèques lors de la Conférence de Munich."
czke.438.t:0 "Mission Runciman en Tchécoslovaquie"
czke.438.d:0 "La mission Runciman en Tchécoslovaquie fut une initiative du gouvernement britannique visant à résoudre une crise internationale menaçant de déboucher sur une guerre en Europe durant l’été 1938. La mission, dirigée par un ancien ministre britannique, Lord Runciman, fut envoyée pour arbitrer un conflit entre le gouvernement tchécoslovaque et le Parti allemand des Sudètes (SdP), représentant la minorité allemande radicalisée dans le pays. Les médiateurs britanniques furent actifs en Tchécoslovaquie à la fin de l’été, publiant leur rapport peu avant la Conférence de Munich en septembre.\n\nLe rapport de la mission Runciman, sous forme de lettres adressées aux premiers ministres britannique et tchécoslovaque datées du [GetDateText], adopta un ton extrêmement hostile envers le gouvernement tchécoslovaque et recommanda le transfert immédiat des territoires principalement peuplés d’Allemands à l’Allemagne. Le rapport de 2000 mots blâma fermement l’échec des négociations sur la direction du SdP, qui utilisa le prétexte de troubles civils dans certaines zones allemandes pour rompre le contact. Le rapport soulignait aussi que les propositions du « Quatrième plan » de Beneš répondaient à « presque toutes les exigences » du SdP. Néanmoins, en énumérant les griefs de la minorité allemande, Runciman exprima sa sympathie pour leur cause, observant qu’il était « difficile d’être gouverné par une race étrangère ». Tout en déclarant que le gouvernement tchèque n’était « ni activement oppressif, et certainement pas terroriste », le rapport accusait cependant son administration d’être « marquée par de la maladresse, un manque de compréhension, une petite intolérance et de la discrimination ».\n\nCependant, si le gouvernement tchécoslovaque réglait la question des Sudètes avant l’escalade du conflit ethnique, le rapport de la mission Runciman aurait probablement été plus favorable aux Tchèques. Le Royaume-Uni et la France seraient alors davantage disposés à les soutenir contre une éventuelle agression d’Hitler."
czke.438.a:0 "Inviter Lord Runciman en Sudète."
CZKE_join_allies:0 "Chercher la coopération des Alliés"
CZKE_join_allies_desc:0 "Nous devrions rejoindre une alliance et affronter ensemble la menace de l’Allemagne nazie pour arrêter Hitler avant qu’il ne soit trop tard."
CZKE_join_allies_tooltip_reward:0 "\n Chance que la §YTchécoslovaquie§! rejoigne les §YAlliés§!."
CZKE_join_allies_tt:0 "Fait partie d’une faction avec le §YRoyaume-Uni§! ou la §YFrance§!."
czke.439.t:0 "La Tchécoslovaquie veut rejoindre les Alliés"
czke.439.d:0 "L’agression du Reich allemand ne connaît pas de limites. Lord Runciman rapporte que la situation en Tchécoslovaquie est loin de ce qu’affirme Herr Hitler.\n\nLa Tchécoslovaquie est la dernière démocratie stable en Europe centrale et a cruellement besoin de notre aide contre l’agression allemande. Quelle doit être notre réponse ?"
czke.439.a:0 "Invitons-les dans les Alliés."
czke.439.b:0 "Les Tchèques sont seuls."
CZKE_seek_accommodation_with_britain:0 "Efforts diplomatiques tchéco-britanniques"
czke.440.t:0 "La Grande-Bretagne accepte notre demande"
czke.440.d:0 "Nous avons le plaisir d’annoncer que la Grande-Bretagne nous a acceptés dans les Alliés."
czke.440.a:0 "Il reste peut-être de l’espoir."
czke.441.t:0 "La Grande-Bretagne refuse notre demande"
czke.441.d:0 "Malheureusement, il semble que la Grande-Bretagne ne souhaite pas encore que nous fassions partie des Alliés."
czke.441.a:0 "C’est bien malheureux."
CZKE_strengthen_communism:0 "Renforcer le Parti communiste"
CZKE_strengthen_communism_desc:0 "Les communistes ont toujours voulu prendre le pouvoir en Tchécoslovaquie. En 1929, Klement Gottwald devint secrétaire général du parti après avoir purgé son opposition. Bien que le parti n’ait pas participé au gouvernement avant Munich et ait même été interdit en 1938, les communistes dirigés par Gottwald prirent finalement le pouvoir en 1948."
CZKE_strengthen_communism_tooltip_reward:0 "\n Révolutionnaire §Ycommuniste§! gratuit."
CZKE_five_year_plan_tooltip_trigger:0 "La §YConférence de Yalta§! a eu lieu"
czke.442.t:0 "Le communisme dans la Tchécoslovaquie de l’entre-deux-guerres"
czke.442.d:0 "La formation d’un parti communiste en Tchécoslovaquie fut un processus lent, dû à la pression constante et aux conseils de l’Internationale communiste entre 1919 et 1921. Lorsque le Parti communiste tchécoslovaque (KSC) fut enfin fondé en 1921, cela représentait un compromis entre les politiques doctrinaires extrêmes du Komintern et les vues plus modérées orientées vers la Tchécoslovaquie de Bohumil Smeral, son premier dirigeant.\n\nL’organisation du KSC reposait sur le concept léniniste du centralisme démocratique, qui prévoyait l’élection des dirigeants du parti à tous les niveaux mais exigeait que chaque échelon soit soumis au contrôle du niveau supérieur. Ainsi, les programmes et politiques du parti étaient décidés d’en haut, et les résolutions des organes supérieurs s’imposaient sans condition à tous les organes inférieurs et aux membres individuels du parti. En théorie, les questions de politique étaient librement discutées lors des congrès, conférences, réunions d’adhérents et dans la presse du parti. En pratique, ces discussions reflétaient seulement les décisions d’un petit groupe de hauts responsables.\n\nEn 1929, Klement Gottwald devint secrétaire général du parti après avoir purgé divers éléments d’opposition, dont certains alliés à Léon Trotski et à l’Opposition de gauche internationale.\n\nLors des élections parlementaires de 1935, le parti conserva ses 30 mandats d’origine avec un peu plus de 10 % des voix. Cependant, les événements de 1938 entraînèrent son interdiction, mais il continua d’exister dans la clandestinité.\n\nDurant la Seconde Guerre mondiale, de nombreux dirigeants du KSC trouvèrent refuge en Union soviétique, où ils préparèrent l’élargissement de la base du parti une fois la guerre terminée. Dans l’immédiat après-guerre, les communistes tchécoslovaques, soutenus par Moscou, lancèrent une campagne soutenue qui culmina avec leur prise de pouvoir en 1948."
czke.442.a:0 "Renforcer le parti."
CZKE_peoples_revolution:0 "Établir la Milice populaire"
CZKE_peoples_revolution_desc:0 "Les communistes prirent le pouvoir en Tchécoslovaquie en 1948. Mais qui sait ? Si la situation politique en Europe avait été différente, ils auraient pu y parvenir plus tôt."
CZKE_peoples_revolution_tooltip_reward:0 "\n Nationalisation de l’§Yindustrie§! OU §YIdée nationale§! liée au §Ycommunisme§! OU §YIdée nationale§! liée à la §Ymain-d’œuvre§!."
czke.443.t:0 "La Milice populaire en Tchécoslovaquie"
czke.443.d:0 "Les Milices populaires, également appelées « le poing armé de la classe ouvrière », étaient une organisation de milice du Parti communiste tchécoslovaque entre 1948 et 1989.\n\nLeurs prédécesseurs étaient des groupes armés d’ouvriers d’usine formés en juin 1945 pour protéger les usines de leurs anciens propriétaires lors du processus de nationalisation d’après-guerre.\n\nÀ la mi-février 1948, le comité central du Parti communiste décida de former des unités armées composées de membres et de sympathisants. Les milices furent rapidement équipées et mises en alerte lors de la prise de pouvoir communiste fin février. Elles prirent bientôt le nom de Milices populaires.\n\nLa mission des milices était de lutter contre les guérillas susceptibles d’apparaître après la prise de pouvoir, contre les agents infiltrés envoyés en Tchécoslovaquie, et de coopérer avec la police et l’armée. Environ 3 000 miliciens rejoignirent les forces de police. Les non-communistes furent progressivement écartés des milices. Leur contrôle passa au ministère de l’Intérieur.\n\nEn février 1948, les milices reçurent 10 000 fusils et 2 000 pistolets-mitrailleurs de l’usine d’armement Zbrojovka Brno. Elles modernisèrent continuellement leur équipement avec des fusils de précision, mitrailleuses, mortiers, mitrailleuses antiaériennes et véhicules. Elles conservaient les munitions dans les dépôts de l’armée. Dans les années 1970, des canons sans recul et des RPG-7 furent ajoutés à leur arsenal.\n\nAprès la chute du parti communiste fin 1989, les milices furent dissoutes le 21 décembre 1989."
czke.443.a:0 "Nationaliser l’industrie détenue par les Allemands."
czke.443.b:0 "Persécuter la bourgeoisie et l’intelligentsia démocratique."
czke.443.c:0 "Armer la Milice populaire"
CZKE_collectivist_ethos_idea:0 "Purge démocratique"
CZKE_collectivist_ethos_idea_desc:0 "Rien ne peut arrêter la Révolution populaire !"
CZKE_peoples_militia_idea:0 "Milice populaire"
CZKE_peoples_militia_idea_desc:0 "La Milice populaire fut instaurée en Tchécoslovaquie."
CZKE_join_commitern:0 "Rejoindre le Komintern"
CZKE_join_commitern_desc:0 "Depuis longtemps, Klement Gottwald et d’autres communistes tchécoslovaques rêvent d’une forte république socialiste comme membre de premier plan du Komintern."
CZKE_join_commitern_tooltip_reward:0 "\n Chance que la §YTchécoslovaquie§! rejoigne le §YKomintern§!."
CZKE_join_comitern_tt:0 "Fait partie d’une faction avec l’§YUnion soviétique§!."
czke.444.t:0 "La Tchécoslovaquie veut rejoindre le Komintern"
czke.444.d:0 "Les fascistes menacent notre allié tchécoslovaque. Les communistes locaux, dirigés par Klement Gottwald, ont établi un puissant mouvement dans le pays et demandent formellement à être acceptés dans le Komintern.\n\nQue devons-nous faire, camarade [SOV.GetName] ?"
czke.444.a:0 "Invitons-les dans le Komintern."
czke.444.b:0 "Les Tchèques sont seuls."
CZKE_seek_accommodation_with_USSR:0 "Rejoindre le Komintern"
czke.445.t:0 "L’Union soviétique accepte"
czke.445.d:0 "Nous avons le plaisir d’annoncer que la délégation de l’Union soviétique nous a rassurés quant à notre adhésion au Komintern."
czke.445.a:0 "Il reste peut-être de l’espoir."
czke.446.t:0 "L’Union soviétique refuse"
czke.446.d:0 "Malheureusement, il semble que nous ne soyons toujours pas dignes de faire partie du Komintern."
czke.446.a:0 "C’est bien malheureux."
CZKE_faction_research_exchange:0 "Partage technologique"
CZKE_faction_research_exchange_desc:0 "En partageant nos avancées technologiques avec nos alliés, toute notre faction mènera la R&D en temps de guerre plus efficacement."
czke.447.t:0 "L’opposition communiste conteste la direction du KSČ"
czke.447.d:0 "Plusieurs membres du Parti communiste tchécoslovaque ont remis en doute la direction de l’actuel président Klement Gottwald, considéré comme suivant de très près les politiques de Staline. Certains suggèrent le retour d’Alois Neurath, un trotskyste d’origine allemande qui réside toujours dans le pays. Son accession dans le parti pourrait être une étape décisive pour unifier les factions socialistes de Tchécoslovaquie, mais beaucoup considèrent l’alignement sur la politique de Staline comme essentiel à la victoire dans la république."
czke.447.a:0 "Pourquoi devrions-nous élever ce malade au pouvoir ?"
czke.447.b:0 "La cause internationaliste bénéficierait de son inclusion !"

CZKE_expand_soviet_ties:0 "Renforcer les liens avec [SOV.GetAdjective]"
CZKE_expand_soviet_ties_desc:0 "Les [SOV.GetAdjective] se sont révélés être un allié fiable dans un ordre mondial en perpétuel changement. Ils seraient certainement ravis d’une offre visant à resserrer nos liens, et cela renforcerait notre nation pour ce qui est à venir."
CZE_help_from_sov:0 "Aide soviétique"
CZKE_friendship_with_USSR:0 "Traité d’amitié"
czke.448.t:0 "La Tchécoslovaquie propose un traité d’amitié"
czke.448.d:0 "Le gouvernement tchécoslovaque a récemment envoyé une délégation demandant un traité d’amitié formel, qui, selon eux, consolidera nos liens. Que devons-nous répondre à nos amis de Prague ?"
czke.448.a:0 "Bien sûr, signons immédiatement !"
czke.448.b:0 "Non merci."
czke.449.t:0 "Les [SOV.GetAdjective] ont accepté"
czke.449.d:0 "Les [SOV.GetAdjective] ont accepté notre proposition de « Traité d’amitié ». Nos relations vont s’épanouir grâce à ce développement."
czke.449.a:0 "Excellente nouvelle."
czke.450.t:0 "Les [SOV.GetAdjective] ont refusé"
czke.450.d:0 "Les [SOV.GetAdjective] ont refusé notre proposition de « Traité d’amitié », affirmant que nos conditions étaient trop déséquilibrées. C’est sans aucun doute une issue décevante."
czke.450.a:0 "Dommage…"

CZKE_split_poland:0 "Diviser la Pologne"
CZKE_split_poland_desc:0 "L’Entente a été naïve et imprudente en créant des États incapables de se défendre seuls. La Pologne, longtemps sous un régime réactionnaire et totalitaire, doit être rayée de la carte ; et nos camarades slaves de l’Ouest dans ces terres seront placés sous notre protection. Avec l’aide de nos alliés [SOV.GetAdjective], qu’est-ce qui pourrait nous arrêter maintenant ?"
czke.451.t:0 "La Tchécoslovaquie propose de diviser la Pologne"
czke.451.d:0 "Le ministère tchécoslovaque des Affaires étrangères nous a récemment envoyé une proposition visant à diviser la Pologne, récemment indépendante, entre nous. En échange de notre participation à l’invasion, ils nous offrent actuellement le contrôle total des territoires perdus lors de la récente guerre polono-soviétique. Que devons-nous répondre à cette offre majeure ?"
czke.451.a:0 "Cela apportera des bénéfices mutuels à tous !"
czke.451.b:0 "Nous ne pouvons pas risquer d’attiser encore l’hostilité de l’Ouest."
czke.452.t:0 "Les [SOV.GetAdjective] ont accepté !"
czke.452.d:0 "Les [SOV.GetAdjective] ont accepté notre proposition de diviser la Pologne. Nous sommes désormais prêts à publier les plans imminents d’une invasion conjointe."
czke.452.a:0 "Excellente nouvelle."
czke.453.t:0 "Les [SOV.GetAdjective] ont refusé !"
czke.453.d:0 "Les [SOV.GetAdjective] ont refusé notre proposition de diviser la Pologne, déclarant qu’ils ne pouvaient pas risquer un « conflit indéfini » avec le monde occidental, qu’ils estiment que cela provoquerait."
czke.453.a:0 "Alors nous irons seuls !"

CZKE_union_with_warsaw:0 "Union avec Varsovie"
CZKE_union_with_warsaw_desc:0 "Avec les travailleurs de Pologne sous notre bannière, nous pouvons enfin concrétiser l’idée populaire, mais avortée, d’une véritable union des nations slaves de l’Ouest ! Notre seule défense contre l’Ouest repose sur la camaraderie de nos vieux amis."
CZKE_union_with_warsaw_trigger_tt:0 "Tous les États §Ypolonais§! d’origine qui ne sont pas des cœurs nationaux d’un autre pays :\n Conformité supérieure à §Y50%§! \n Résistance inférieure à §Y5%§!"
CZKE_union_with_warsaw_effect_tt:0 "Nous serons connus comme §Yla République démocratique de Tchécoslovaquie-Pologne§!"

