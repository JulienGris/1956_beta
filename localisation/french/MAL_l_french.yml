malaysia.5.a:0 ""
malaysia.5.b:0 ""

malaysia.6.t:0 "Les États non fédérés"
malaysia.6.desc:0 "Les États non fédérés de Malaisie sont le résultat d’une colonisation progressive et non planifiée de la péninsule. Bien que des efforts aient été faits pour organiser ces groupes disparates, ils se sont révélés infructueux. Il est donc temps de prendre une décision définitive quant à leur avenir et à leur place dans la colonie."
malaysia.6.a:0 "Les intégrer totalement !"
malaysia.6.b:0 "Favoriser leur union avec leurs frères fédérés."
malaysia.6.c:0 "Les laisser tranquilles."

malaysia.7.t:0 "Le Conseil des princes"
malaysia.7.desc:0 "Le « Majlis Raja-Raja », ou Conseil des souverains, fut l’une des premières concessions accordées aux États malais fédérés. Si son pouvoir pratique reste limité, les princes et rajas qui le composent exercent une influence considérable dans la région, et doivent donc être pris en compte avant toute modernisation."
malaysia.7.a:0 "Renforcer leurs pouvoirs."
malaysia.7.b:0 "Chercher à réduire leur influence."
malaysia.7.c:0 "Dissoudre le conseil."

malaysia.8.t:0 ""
malaysia.8.desc:0 ""
malaysia.8.a:0 ""
malaysia.8.b:0 ""

malaysia.9.t:0 "La nouvelle Malaisie britannique"
malaysia.9.desc:0 "Avec l’élimination des derniers vestiges d’autonomie locale, le contrôle britannique sur la Malaisie est total. Bien que cela puisse nous causer des problèmes un jour, pour l’instant, cela nous donne un pouvoir sans précédent sur la colonie."
malaysia.9.a:0 "Dieu sauve le roi !"

malaysia.10.t:0 "L’urgence malaise"
malaysia.10.desc:0 "Face aux craintes croissantes d’une occupation japonaise, des agitateurs communistes malais ont réussi à prendre d’assaut la résidence du gouverneur à Singapour et à s’emparer du contrôle de la colonie. Tandis que des affrontements éclatent entre partisans et forces de police dans les autres établissements, les communistes profitent de cet élan pour déclarer leur indépendance vis-à-vis de nous !"
malaysia.10.a:0 "Bon débarras."
malaysia.10.b:0 "Le seul rouge accepté est celui de l’Union Jack !"

malaysia.11.t:0 ""
malaysia.11.desc:0 ""
malaysia.11.a:0 ""
malaysia.11.b:0 ""

malaysia.12.t:0 "La nouvelle Malaisie"
malaysia.12.desc:0 "Avec notre avenir économique désormais assuré, les citoyens commencent à croire véritablement au concept d’une Malaisie nationale, unie et coopérative, travaillant ensemble pour le bien de tous."
malaysia.12.a:0 "Bersekutu Bertambah Mutu !"

malaysia.13.t:0 "La Malaisie rompt les liens !"
malaysia.13.desc:0 "Malgré tous nos efforts pour limiter l’autonomie malaise, une confédération de princes, d’hommes d’affaires et d’activistes natifs influents a paralysé la colonie. Ils exigent une autonomie politique et économique totale pour la Malaisie, et ont réussi à s’emparer de Singapour !"
malaysia.13.a:0 "Qu’ils se débrouillent avec une invasion."
malaysia.13.b:0 "Sont-ils fous ? Envoyez la flotte !"

malaysia.14.t:0 ""
malaysia.14.desc:0 ""
malaysia.14.a:0 ""
malaysia.14.b:0 ""

malaysia.15.t:0 "Revendi­cations nationalistes malaises"
malaysia.15.desc:0 "Une coalition de princes en Malaisie britannique exige le retour des Établissements des Détroits sous autorité princière. Bien que leurs revendications bénéficient d’un large soutien populaire, cela supprimerait pratiquement tout contrôle que nous avons sur la Malaisie continentale, et l’indépendance suivrait inévitablement."
malaysia.15.a:0 "Peut-être feront-ils mieux que nous."
malaysia.15.b:0 "Depuis quand écoutons-nous les natifs ?"

malaysia.16.t:0 "Refus britannique"
malaysia.16.desc:0 "Le Foreign Office a catégoriquement rejeté toute concession à l’autonomie locale. Bien que la situation soit tendue sur le terrain, le gouverneur reste en place, pour l’instant."
malaysia.16.a:0 "Nous devons chercher ailleurs la liberté."

malaysia.17.t:0 ""
malaysia.17.desc:0 ""
malaysia.17.a:0 ""
malaysia.17.b:0 ""

malaysia.18.t:0 "La Malaisie demande une plus grande autonomie"
malaysia.18.desc:0 "S’étant montrée un sujet loyal, notre administration en Malaisie demande que nous lui accordions une autonomie accrue dans la région, en récompense de son obéissance continue."
malaysia.18.a:0 "Très bien."
malaysia.18.b:0 "Ils n’ont pas encore fait leurs preuves."

malaysia.19.t:0 "La Malaisie réclame la décolonisation !"
malaysia.19.desc:0 "Ayant arraché sa liberté aux Britanniques, la Malaisie se tourne maintenant vers nous, exigeant que nous respections les droits souverains du peuple indonésien et préparions la décolonisation. Si elle ne représente pas une grande menace militaire, il n’est pas certain que nous puissions écraser une révolte locale soutenue par la Malaisie. Quelle doit être notre réponse ?"
malaysia.19.a:0 "Peut-être ont-ils raison."
malaysia.19.b:0 "Depuis quand prenons-nous nos ordres de la Malaisie ?"

malaysia.20.t:0 "La Malaisie réclame la décolonisation !"
malaysia.20.desc:0 "Ayant arraché sa liberté aux Britanniques, la Malaisie se tourne maintenant vers nous, exigeant que nous respections les droits souverains du peuple philippin et préparions la décolonisation. Si elle ne représente pas une grande menace militaire, il n’est pas certain que nous puissions écraser une révolte locale soutenue par la Malaisie. Quelle doit être notre réponse ?"
malaysia.20.a:0 "Peut-être ont-ils raison."
malaysia.20.b:0 "Depuis quand prenons-nous nos ordres de la Malaisie ?"

malaysia.21.t:0 "La Malaisie demande notre soutien !"
malaysia.21.desc:0 "Un mouvement nationaliste s’est emparé de la colonie de Malaisie britannique. Bien que ses efforts aient été contrecarrés jusqu’à présent, une délégation de dirigeants locaux a envoyé un émissaire secret, offrant sa soumission en échange d’un appui à leur indépendance."
malaysia.21.a:0 "Ils l’auront."
malaysia.21.b:0 "C’est trop risqué."

malaysia.22.t:0 "Le Japon impose l’indépendance malaise"
malaysia.22.desc:0 "Nos tentatives de réprimer l’indépendance malaisienne se sont retournées contre nous : l’empereur du Japon exige personnellement que la Grande-Bretagne reconnaisse l’indépendance de la Malaisie, menaçant de passer à l’action si nous ne cédons pas. Céder livrerait presque certainement la Malaisie au Japon, mais refuser risquerait de nous entraîner dans une guerre défavorable. Que devons-nous faire ?"
malaysia.22.a:0 "Nous n’avons pas le choix, il faut céder."
malaysia.23.b:0 "Peut-être n’avons-nous pas été assez clairs : NON."

malaysia.23.t:0 "Le Japon refuse"
malaysia.23.desc:0 "Par indifférence ou incapacité, le Japon a refusé de soutenir notre cause pour la liberté. Une fois encore, nous sommes seuls."
malaysia.23.a:0 "Notre heure viendra."

malaysia.24.t:0 "L’Angleterre refuse de céder !"
malaysia.24.desc:0 "Malgré les tensions régionales et le chaos à leurs portes, l’Empire britannique a refusé d’abandonner la Malaisie. Si nous voulons tenir notre promesse de soutien, nous devons recourir à la force."
malaysia.24.a:0 "Enfin, un adversaire digne de ce nom."
malaysia.24.b:0 "Attendons une occasion plus favorable."

malaysia.25.t:0 "La Malaisie se révolte !"
malaysia.25.desc:0 "Avec l’arrivée de la guerre à nos portes, la situation dans nos colonies malaisiennes, autrefois relativement stable, s’est totalement effondrée. Agacés par notre refus d’accorder l’indépendance, les nationalistes ont brutalement expulsé tous les officiers coloniaux et proclamé un État pleinement indépendant."
malaysia.25.a:0 "D’accord."
malaysia.25.b:0 "D’accord."

malaysia.26.t:0 "L’extraction de tungstène ralentit"
malaysia.26.desc:0 "Comme les géologues l’avaient prévu, l’extraction de tungstène commence à ralentir. Une intervention pourrait être nécessaire, mais elle ne ferait que retarder l’inévitable : un jour, il n’y aura plus de minerai à extraire."
malaysia.26.a:0 "D’accord."

