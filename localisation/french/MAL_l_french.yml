# Événements
malaysia.1.t:0 "L’état de la colonie"
malaysia.1.desc:0 "Malgré une apparence relativement paisible, les colonies, protectorats et alliances locales qui composent la Malaisie britannique sont minés par les tensions. Plutôt qu’un véritable État, la Malaisie britannique est un patchwork de princes et de résidents généraux, dirigés de facto par le gouverneur de Singapour. Le résultat est une colonie prête à s’effondrer à tout moment, nécessitant une restructuration majeure pour survivre à la tempête à venir."
malaysia.1.a:0 "Au travail."

malaysia.2.t:0 "La Malaisie demande l’autonomie navale"
malaysia.2.desc:0 "Malgré la distance entre la métropole et nos territoires asiatiques, le contrôle de notre présence navale dans la région reste à Londres, non à Singapour. Invoquant l’inefficacité de cette situation et les bénéfices d’un commandement local, le Far East Command a demandé que le contrôle d’une partie de la flotte en Asie soit transféré à la Malaisie britannique."
malaysia.2.a:0 "Une demande raisonnable."
malaysia.2.b:0 "Hors de question !"

malaysia.3.t:0 ""
malaysia.3.desc:0 ""
malaysia.3.a:0 ""
malaysia.3.b:0 ""

malaysia.4.t:0 ""
malaysia.4.desc:0 ""
