 ### ÉVÉNEMENTS ###
 r56_australia.country_win:0 "Le Country Party mène la coalition."
 r56_australia.communist_win:0 "Le Parti communiste d’Australie l’emporte."
 r56_australia.fascists_win:0 "Une victoire pour la droite !"
 r56_australia.centre_win:0 "Le Centre remporte une victoire écrasante."
 r56_australia.australia_first_win:0 "Australia First remporte le scrutin."

 r56_australia.1.t:0 "Nomination du nouveau Gouverneur général"
 r56_australia.1.d:0 "Le mandat d’Isaac Isaacs en tant que Gouverneur général est terminé. Il restera dans les mémoires comme le premier Gouverneur général australien et pour sa remarquable frugalité.\n\nParmi les candidats proposés pour le remplacer, le Premier ministre a décidé de revenir à un Gouverneur général britannique et a proposé Alexander Hore-Ruthven.\n\nIl fut auparavant gouverneur de la Nouvelle-Galles du Sud et de l’Australie-Méridionale, où il utilisa son influence pour aider l’État au début de la Grande Dépression."
 r56_australia.1.a:0 "Lord Gowrie fera un bon Gouverneur général."

 r56_australia.2.d:0 "Le mandat d’Alexander Hore-Ruthven en tant que Gouverneur général est terminé. Le Roi lui a accordé le titre de comte de Gowrie en reconnaissance de ses services, ainsi que la nouvelle fonction de Connétable adjoint et Lieutenant-gouverneur du château de Windsor. Son influence durant les neuf dernières années restera gravée dans les mémoires.\n\nLe prince Henry, duc de Gloucester, troisième fils du roi George V, a été choisi parmi les candidats proposés pour le remplacer."
 r56_australia.2.a:0 "S.A.R. le duc de Gloucester fera un bon Gouverneur général."

 r56_australia.4.t:0 "La mort de Joseph Lyons"
 r56_australia.4.uap:0 "Le Premier ministre Joseph Lyons a succombé à une crise cardiaque alors qu’il se rendait en voiture de Melbourne à Sydney. Il allait chercher son fils au collège à ce moment-là. Premier chef du gouvernement à mourir en fonction, il n’existe aucun précédent constitutionnel pour désigner son successeur. L’absence de chef adjoint à la tête de l’UAP complique la situation, et il faudra un certain temps avant qu’un nouveau leader soit choisi. Earle Page, chef du Country Party et vice-premier ministre, a été nommé Premier ministre intérimaire jusqu’au vote interne de l’UAP.\n\nÂgé de 59 ans, Lyons envisageait sa retraite afin de passer plus de temps avec ses jeunes enfants. Toutefois, l’absence de successeur l’a poussé à rester sous la pression de son parti. Il restera dans les mémoires comme celui qui a maintenu l’unité du pays face aux épreuves de la Grande Dépression."
 r56_australia.4.labor:0 "L’ancien Premier ministre Joseph Lyons est décédé d’une crise cardiaque alors qu’il allait chercher son fils au collège. Depuis sa défaite aux élections de 1937, il profitait de sa retraite, consacrant beaucoup de temps à ses enfants et à la rénovation de sa maison à Devonport.\n\nLyons restera dans les mémoires comme celui qui a maintenu l’unité du pays face aux épreuves de la Grande Dépression."
 r56_australia.4.a:0 "Il a bien servi son pays."

 r56_australia.5.t:0 "Robert Menzies élu Premier ministre"
 r56_australia.5.d:0 "L’UAP a élu l’ancien chef adjoint Robert Menzies comme nouveau leader, et il a prêté serment en tant que Premier ministre d’Australie. Dans un geste qui a choqué le Parlement, le Premier ministre intérimaire Earle Page a refusé de servir sous Menzies et l’a attaqué violemment à la Chambre, l’accusant d’incompétence et de lâcheté pour ne pas s’être engagé pendant la Grande Guerre. Le Country Party a réagi rapidement en destituant Page de la direction.\n\nQuelle que soit la perspective, ce n’est pas la meilleure façon de commencer un mandat."
 r56_australia.5.a:0 "Espérons qu’il saura unir le pays."

 r56_australia.7.t:0 "La mort de John Curtin"
 r56_australia.7.uap:0 "Le chef du Parti travailliste, John Curtin, est décédé aujourd’hui à l’âge de 60 ans. Sa santé s’était détériorée ces derniers mois, et il avait déjà subi une crise cardiaque l’année précédente. Ce leader de longue date s’est opposé pendant des années à l’UPA, et ses politiques socialistes furent souvent clivantes. Il sera rappelé comme un grand dirigeant qui fit de son mieux pour servir l’Australie et son peuple."
 r56_australia.7.labor:0 "Le Premier ministre John Curtin est décédé aujourd’hui à l’âge de 60 ans. Sa santé s’était détériorée ces derniers mois, et il avait déjà subi une crise cardiaque l’année précédente. Ce leader de longue date du Parti travailliste a su unir le pays et réduire considérablement le chômage, contribuant à sortir l’Australie de la Grande Dépression.\n\nIl restera à coup sûr dans les mémoires comme un grand dirigeant."
 r56_australia.7.a:0 "Il a bien servi son pays."

 r56_australia.8.t:0 "Élections fédérales de 1937"
 r56_australia.8.d:0 "C’est l’heure des élections. La coalition au pouvoir UAP/Country affronte à nouveau le Parti travailliste pour les 74 sièges de la Chambre des représentants et 19 sièges du Sénat. Le Parti travailliste avait perdu le pouvoir par un raz-de-marée en 1931. L’UAP et le Country Party ont reformé leur coalition avant les élections de 1934, tandis que les divisions internes de Labor ont provoqué une scission. Aujourd’hui, sous la direction de John Curtin, le Parti travailliste cherche à regagner le terrain perdu. Mais saura-t-il convaincre la population ?"
 r56_australia.8.a:0 "La coalition UAP/Country conserve sa majorité."
 r56_australia.8.b:0 "Le Parti travailliste obtient la majorité."

 r56_australia.9.t:0 "Élections fédérales de 1940"
 r56_australia.9.d:0 "C’est l’heure des élections. Une fois de plus, la coalition UAP/Country affronte le Parti travailliste pour les 74 sièges de la Chambre et 19 sièges du Sénat. La mort de Joseph Lyons a laissé l’UAP sous la direction de Robert Menzies, qui n’a pas su égaler la popularité de son prédécesseur. Pendant ce temps, les partisans de John Curtin se font de plus en plus nombreux. Qui remportera la majorité cette fois-ci ?"
 r56_australia.9.a:0 "La coalition UAP/Country conserve le soutien populaire."
 r56_australia.9.b:0 "Le Parti travailliste prend le contrôle de la Chambre."

 r56_australia.10.t:0 "Élections fédérales de 1943"
 r56_australia.10.d:0 "Les Australiens veulent du changement. Le Parti travailliste semble en position de force pour les élections de 1943. Les divisions au sein de la coalition Country/UAP ont laissé un goût amer, et l’idée d’un gouvernement travailliste fort séduit l’opinion. Mais une fois les votes comptés, qui prendra la tête ?"
 r56_australia.10.a:0 "La coalition UAP/Country l’emporte."
 r56_australia.10.b:0 "Le Parti travailliste obtient le plus de voix."
 r56_australia.10.c:0 "La coalition Country/UAP l’emporte."
r56_australia.11.t:0 "Élections fédérales de 1946"
r56_australia.11.d:0 "Avec la mort de John Curtin, c’est à Ben Chifley de maintenir l’élan du Parti travailliste. Pendant ce temps, Robert Menzies dirige l’UAP récemment rebaptisé — désormais connu sous le nom de Parti libéral. La coalition Libéral/Country peut-elle l’emporter ? Ou la popularité des travaillistes va-t-elle continuer ?"
r56_australia.11.a:0 "La coalition Libéral/Country gagne."
r56_australia.11.b:0 "Les travaillistes gagnent."

r56_australia.12.t:0 "Élections fédérales de 1949"
r56_australia.12.d:0 "Cette année, 121 sièges de la Chambre des représentants sont en jeu, ainsi que 42 des 60 sièges du Sénat. L’augmentation du nombre de sièges disponibles va-t-elle changer l’issue du vote ?"
r56_australia.12.a:0 "La coalition Libéral/Country gagne."
r56_australia.12.b:0 "Les travaillistes gagnent."

r56_australia.13.t:0 "Robert Menzies démissionne"
r56_australia.13.d:0 "Sous la pression de l’opposition et face à l’impasse parlementaire, le Premier ministre Menzies a annoncé son intention de démissionner. Dans une ultime tentative de maintenir Menzies au pouvoir, le cabinet de l’UAP a proposé un gouvernement d’union nationale avec les travaillistes, mais ces derniers ont refusé. Ayant perdu tout soutien au parlement, il a démissionné.\n\nMalgré les conseils de Menzies au gouverneur général de nommer John Curtin Premier ministre, une conférence conjointe UAP–Country Party a choisi le leader du Country Party, Arthur Fadden, comme nouveau chef de la coalition et Premier ministre. Amer et abattu, Robert Menzies a failli quitter la politique, mais a été convaincu de devenir ministre de la Coordination de la Défense dans le nouveau cabinet de Fadden."
r56_australia.13.a:0 "Espérons que Fadden saura garder [AST.GetNameDef] unie."

r56_australia.14.t:0 "Motion de censure"
r56_australia.14.d:0 "Après seulement 40 jours comme Premier ministre, Arthur Fadden a été renversé par une motion de censure menée par l’opposition travailliste. N’ayant pas pu obtenir la confiance du parlement, son sort a été scellé lorsque la Chambre des représentants a rejeté son budget. Incapable de débloquer la situation héritée du gouvernement Menzies, il restera dans les mémoires comme le Premier ministre au mandat le plus court à ce jour. John Curtin et le Parti travailliste vont maintenant tenter de former un nouveau gouvernement."
r56_australia.14.a:0 "Il est temps que John Curtin prenne les rênes."

r56_australia.15.t:0 "[AST.GetNameDefCap] demande la protection de Singapour"
r56_australia.15.d:0 "Singapour est l’une de nos provinces les plus stratégiques en Asie. Cependant, elle est éloignée de [ENG.GetNameDef] et menacée d’invasion. [AST.GetNameDef] est venu avec une proposition : ils prendraient en charge la protection de Singapour, libérant ainsi des troupes [ENG.GetAdjective] pour d’autres zones où elles sont plus nécessaires."
r56_australia.15.a:0 "Elle sera plus en sécurité entre leurs mains."
r56_australia.15.b:0 "Nous ne ferons pas confiance à ces anciens bagnards."

r56_australia.16.t:0 "[ENG.GetNameDefCap] accepte notre proposition"
r56_australia.16.d:0 "[ENG.GetNameDefCap] a accepté notre proposition de prendre en charge la protection de Singapour."
r56_australia.16.a:0 "Excellent."

r56_australia.17.t:0 "[ENG.GetNameDefCap] rejette notre demande"
r56_australia.17.d:0 "[ENG.GetNameDefCap] a rejeté notre proposition de prendre en charge la protection de Singapour."
r56_australia.17.a:0 "Espérons que cela n’affaiblira pas l’Empire."

r56_australia.18.t:0 "[ENG.GetNameDefCap] transfère l’administration à [AST.GetNameDef]"
r56_australia.18.d:0 "Les négociations entre [ENG.GetNameDef] et [AST.GetNameDef] ont abouti au transfert de l’administration des Établissements des détroits, de la Malaisie et du Bornéo britannique au gouvernement [AST.GetAdjective]. Nous devrons désormais leur rendre compte pour toutes les affaires."
r56_australia.18.a:0 "Nouveaux maîtres, mêmes problèmes."

r56_australia.19.t:0 "[AST.GetNameDefCap] demande l’intégration de la Nouvelle-Zélande"
r56_australia.19.d:0 "L’idée que la Nouvelle-Zélande devienne un État d’Australie existe depuis avant la fondation de nos nations. Cela ne s’est toutefois jamais produit en raison de la distance, des différences politiques et économiques, et du traitement réservé aux populations autochtones en Australie. Cependant, de récents échanges diplomatiques ont relancé la discussion, et l’idée que la Nouvelle-Zélande devienne un État [AST.GetAdjective] refait surface. Bien que cela ne soit pas forcément populaire, les bénéfices pourraient s’avérer importants dans ce monde de plus en plus dangereux."
r56_australia.19.a:0 "Il est temps de mettre nos différences de côté et de nous unir."
r56_australia.19.b:0 "Ils plaisantent, évidemment !"

r56_australia.20.t:0 "L’intégration de la Nouvelle-Zélande"
r56_australia.20.d:0 "Les discussions à Auckland ont été fructueuses, et dans leur dernier acte en tant que nation indépendante, le Parlement néo-zélandais a voté en faveur de l’adhésion à [AST.GetNameDef] en tant qu’État à part entière."
r56_australia.20.a:0 "Bienvenue à la maison, Nouvelle-Zélande."

r56_australia.21.t:0 "[NZL.GetNameDefCap] reste sur ses positions"
r56_australia.21.d:0 "[NZL.GetNameDefCap] a rejeté toute idée de rejoindre volontairement [AST.GetNameDef] et s’est retirée de toutes les discussions sur le futur statut de la Nouvelle-Zélande. La diplomatie ayant échoué, il pourrait être temps d’employer des moyens plus musclés."
r56_australia.21.a:0 "Les Kiwis regretteront d’avoir refusé notre offre."

r56_australia.22.t:0 "La crise [NZL.GetAdjective]"
r56_australia.22.d:0 "Une crise entre [AST.GetNameDef] et [NZL.GetNameDef] couve depuis plusieurs mois. [AST.GetNameDefCap] a à plusieurs reprises exigé que [NZL.GetNameDef] devienne un État de [AST.GetNameDef], mais cette idée a été rejetée par [NZL.GetNameDef], entraînant une rupture des relations diplomatiques entre nos deux dominions. La guerre semblant probable, il est temps de choisir notre camp."
r56_australia.22.a:0 "Mieux vaut ne pas risquer une guerre avec [AST.GetNameDef]."
r56_australia.22.b:0 "Nous nous tiendrons aux côtés de [NZL.GetNameDef] !"

r56_australia.23.t:0 "[AST.GetNameDefCap] demande le contrôle de l’île Christmas"
r56_australia.23.d:0 "Les ambassadeurs de [AST.GetNameDef] ont demandé que nous transférions à leur contrôle la lointaine et stratégique île Christmas. Connue pour son exploitation de phosphate, l’île a été annexée par les Britanniques en 1888 et administrée par les Établissements des détroits depuis. Elle abrite de nombreux travailleurs malais et sert de refuge aux navires en quête d’abri dans l’océan Indien oriental et méridional. En raison de son isolement, [AST.GetNameDef] est mieux placé pour gouverner l’île, et ils proposent des compensations financières pour la perte de revenus miniers. Devons-nous accepter ?"
r56_australia.23.a:0 "Les îles seront mieux gérées sous leur administration."
r56_australia.23.b:0 "Jamais ils n’auront l’île Christmas."
l_french:
 r56_australia.24.t:0 "Le transfert de l'île Christmas"
 r56_australia.24.d:0 "[From.GetNameDef] a accepté que nous prenions le contrôle de l'île Christmas. La loi sur l'île Christmas a déjà été préparée pour placer l'île sous l'autorité directe du Commonwealth."
 r56_australia.24.a:0 "Quelle île merveilleuse !"

 r56_australia.25.t:0 "[From.GetNameDef] refuse notre demande"
 r56_australia.25.d:0 "Malgré nos offres de compensation, [From.GetNameDef] a refusé de transférer l'île Christmas."
 r56_australia.25.a:0 "Noël est surestimé."

 r56_australia.26.t:0 "[AST.GetNameDefCap] demande un traité de non-agression"
 r56_australia.26.d:0 "[AST.GetNameDefCap] a proposé un traité de non-agression entre nos deux nations afin de préserver la paix et la prospérité dans le Pacifique Sud. Cette initiative fait suite à des mois de politique favorable à [JAP.GetAdjective] et d'apaisement par le gouvernement [AST.GetAdjective], qui a cherché à poursuivre une politique « d'apaisement en Asie », similaire à celle menée par le gouvernement [ENG.GetAdjective] envers [GER.GetNameDef]."
 r56_australia.26.a:0 "Cela pourrait nous être avantageux."
 r56_australia.26.b:0 "Nous ne pouvons pas faire de fausses promesses."

 r56_australia.27.t:0 "[JAP.GetNameDefCap] accepte notre traité de non-agression"
 r56_australia.27.d:0 "Le traité officiel de non-agression entre [AST.GetNameDef] et [JAP.GetNameDef] a été signé ce matin à [JAP.Capital.GetName]. L'ambassadeur [JAP.GetAdjective] a offert à l'ambassadeur [AST.GetAdjective] un bonsaï en signe de paix."
 r56_australia.27.a:0 "La paix en notre temps."

 r56_australia.28.t:0 "[JAP.GetNameDefCap] rejette notre traité de non-agression"
 r56_australia.28.d:0 "Les discussions avec [JAP.GetNameDef] ont échoué. Nos diplomates ont été froidement accueillis lorsqu'ils ont évoqué un pacte de non-agression entre nos deux nations et sont finalement revenus bredouilles."
 r56_australia.28.a:0 "Cela ne peut signifier qu'une chose."

 r56_australia.29.t:0 "Ingérence étrangère en [INS.GetNameDef]"
 r56_australia.29.desc:0 "Récemment, les activités rebelles pro-indépendance se sont intensifiées en [INS.GetNameDef]. Les autorités locales ont découvert une importante cache d'armes [AST.GetAdjective], et des rebelles capturés ont révélé qu'elles avaient été introduites sur les îles par des navires [AST.GetAdjective]. Renforcés par ce soutien international, les chefs rebelles locaux ont rallié de nombreux partisans à leur cause. Il semble que nous pourrions bientôt avoir un conflit sur les bras."
 r56_australia.29.a:0 "Nous devons surveiller ces nationalistes."

 r56_australia.30.t:0 "Rébellion en [INS.GetNameDef]"
 r56_australia.30.desc:0 "Des rebelles pro-indépendance, soutenus et financés par [AST.GetNameDef], se sont soulevés dans tout l'archipel des Indes orientales. Ils ont pris le contrôle de plusieurs îles et se préparent à chasser les forces loyalistes des territoires restants."
 r56_australia.30.a:0 "Écrasez ces rebelles !"

 r56_australia.31.t:0 "Ingérence étrangère en [MAL.GetNameDef]"
 r56_australia.31.desc:0 "Récemment, les activités rebelles pro-indépendance se sont intensifiées en [MAL.GetNameDef]. Les autorités locales ont découvert une importante cache d'armes [AST.GetAdjective], et des rebelles capturés ont révélé qu'elles avaient été introduites en [MAL.GetNameDef] par des navires [AST.GetAdjective]. Renforcés par ce soutien international, les chefs rebelles locaux ont rallié de nombreux partisans à leur cause. Il semble que nous pourrions bientôt avoir un conflit sur les bras."
 r56_australia.31.a:0 "Nous devons surveiller ces nationalistes."

 r56_australia.32.t:0 "L'urgence [MAL.GetAdjective]"
 r56_australia.32.desc:0 "Des rebelles pro-indépendance, soutenus et financés par [AST.GetNameDef], se sont soulevés dans toute la [MAL.GetNameDef]. Ils ont pris possession de la majeure partie des hautes terres et de la jungle [MAL.GetAdjective] et se préparent à attaquer Singapour."
 r56_australia.32.a:0 "Oh là là."


 ### Focuses ###
 # Armée
 AST_R56_dingo_scout_car:0 "Véhicule de reconnaissance Dingo"
 AST_R56_dingo_scout_car_desc:0 "La collaboration avec la Ford Motor Company a produit un nouveau véhicule blindé construit en [AST.GetAdjective]. Il sera basé sur une version raccourcie d’un châssis Ford existant, équipé d’un système de transmission intégrale et d’un puissant moteur V8. Protégé par un blindage pare-balles fabriqué par Victorian Railways, équipé d’une radio et offrant assez de place pour une mitrailleuse Bren, il sera un atout précieux pour nos éclaireurs."
 AST_R56_citizen_military_forces:0 "Forces Militaires Citoyennes"
 AST_R56_citizen_military_forces_desc:0 "La Force Militaire Citoyenne est la principale force de réserve de [AST.GetNameDef]. Des milliers d’hommes sont prêts dans cette milice à défendre [AST.GetNameDef] à tout moment."
 AST_R56_royal_australian_artilery:0 "Artillerie Royale [AST.GetAdjective]"
 AST_R56_royal_australian_artilery_desc:0 "L’Artillerie Royale Australienne s’est illustrée pendant la Grande Guerre. Mais son équipement semble avoir oublié que celle-ci s’est terminée il y a plus de 18 ans. Nous devrions prioriser son rééquipement."
 AST_R56_the_owen_gun:0 "Le pistolet-mitrailleur Owen"
 AST_R56_the_owen_gun_desc:0 "Evelyn Owen a créé une « carabine-mitrailleuse » calibre .22. Initialement rejetée par l’armée, elle a fini dans un sac de sucre avant d’être redécouverte par Vincent Wardell, directeur d’une grande usine à Port Kembla. Grâce à ses relations, Owen a pu présenter l’arme au Comité d’inventions de l’armée. Cette mitrailleuse bon marché pourrait se révéler utile."
 AST_R56_department_of_defence_coordination:0 "Département de Coordination de la Défense"
 AST_R56_department_of_defence_coordination_desc:0 "Le Département de Coordination de la Défense est chargé de coordonner les actions entre les trois branches des forces armées et nos alliés. En unifiant nos efforts, nous pouvons garantir une force efficace sur terre, en mer et dans les airs."
 AST_R56_australian_womans_army_service:0 "Service Féminin de l’Armée [AST.GetAdjective]"
 AST_R56_australian_womans_army_service_desc:0 "Chaque homme est nécessaire au front, c’est pourquoi des milliers de femmes [AST.GetAdjective] prendront en charge la conduite, les transmissions et l’entretien."
 AST_R56_australian_army_catering_corps:0 "Corps de Restauration de l’Armée [AST.GetAdjective]"
 AST_R56_australian_army_catering_corps_desc:0 "L’armée [AST.GetAdjective] souffre de la qualité de sa nourriture, principalement à cause du manque de cuisiniers compétents. En réorganisant ce service, nous pouvons améliorer le moral et l’efficacité."
 AST_R56_services_reconnaissance_department:0 "Département de Reconnaissance des Services"
 AST_R56_services_reconnaissance_department_desc:0 "Le Département de Reconnaissance des Services (SRD) est la branche des opérations spéciales de [AST.GetNameDef], chargée des missions spéciales dans toute la région du Pacifique Sud."
 AST_R56_z_special_unit:0 "Unité Spéciale Z"
 AST_R56_z_special_unit_desc:0 "[AST.GetNameDefCap] a besoin d’une unité de commandos spécialisée dans les raids sur les îles du Pacifique Sud. Sous commandement du SRD, cette force d’élite sera une épine constante dans le flanc de tout ennemi approchant nos côtes."
 AST_R56_jungle_warfare_training:0 "Entraînement à la guerre dans la jungle"
 AST_R56_jungle_warfare_training_desc:0 "Les combats dans la jungle représentent un défi redoutable pour nos troupes. La rédaction de manuels, l’élaboration de tactiques et l’entraînement de troupes spécialisées augmenteront nos chances de succès."
 AST_R56_m_special_unit:0 "Unité Spéciale M"
 AST_R56_m_special_unit_desc:0 "Le SRD propose la création d’une nouvelle unité de reconnaissance en profondeur. Héritiers des Coastwatchers, ils resteront cachés sur les îles du Pacifique grâce à des recrues locales et fourniront des renseignements sur les mouvements ennemis."
 AST_R56_school_of_unconventional_warefare:0 "Héritage ANZAC"
 AST_R56_school_of_unconventional_warefare_desc:0 "Le Corps d’armée australien et néo-zélandais, fondé pendant la Grande Guerre, a affronté les pires combats à Gallipoli. Les forces et le peuple [AST.GetAdjective] doivent être fiers du courage, de l’engagement et du sacrifice de ces soldats."
 AST_R56_sentinal_tank:0 "Char Sentinel"
 AST_R56_sentinal_tank_desc:0 "[AST.GetNameDefCap] ne peut pas dépendre éternellement des chars étrangers. Nos ingénieurs doivent étudier les modèles étrangers et concevoir un char national. Le Sentinel sera essentiel pour doter notre armée d’une force blindée crédible."
 AST_R56_hmas_assault:0 "HMAS Assault"
 AST_R56_hmas_assault_desc:0 "La baie de Nelson, en Nouvelle-Galles du Sud, est idéale pour accueillir une base d’entraînement de la marine pour les débarquements amphibies. Elle portera le nom de HMAS Assault."
 AST_R56_aussie_paras:0 "Régiment de Parachutistes [AST.GetAdjective]"
 AST_R56_aussie_paras_desc:0 "Disposer d’une unité aéroportée est vital pour nos opérations dans le Pacifique Sud. Le régiment de parachutistes harcèlera tout ennemi de [AST.GetNameDef]."

 # Marine
 AST_R56_rebuild_cockatoo_island:0 "Reconstruire Cockatoo Island"
 AST_R56_rebuild_cockatoo_island_desc:0 "Située dans la baie de Sydney, Cockatoo Island est une base navale et un centre de réparation majeur de la Royal Navy [AST.GetAdjective]. Elle est tombée en ruine et nécessite une rénovation et une expansion urgentes."
 AST_R56_commerce_protection:0 "Protection du commerce"
 AST_R56_commerce_protection_desc:0 "[AST.GetNameDefCap] dépend des approvisionnements maritimes. Un ennemi coupant cette ligne de vie pourrait nous asphyxier. Protéger nos convois et routes commerciales est une nécessité."
 AST_R56_raid_overseas_commerce:0 "Raids sur le commerce ennemi"
 AST_R56_raid_overseas_commerce_desc:0 "Les sous-marins peuvent couper les lignes d’approvisionnement ennemies. Une flotte conséquente pourra harceler l’adversaire et compliquer tout ravitaillement dans le Pacifique Sud."
 AST_R56_scrap_iron_flotilla:0 "La Flottille de Ferraille"
 AST_R56_scrap_iron_flotilla_desc:0 "Notre flotte actuelle est vieillissante, au point que nos ennemis la qualifient de « ferraille flottante ». Avec des efforts, nous pouvons leur prouver qu’ils ont tort."
 AST_R56_royal_australian_submarine_service:0 "Service des sous-marins royaux [AST.GetAdjective]"
 AST_R56_royal_australian_submarine_service_desc:0 "Les sous-marins sont l’arme navale de l’avenir. Développer des modèles plus modernes renforcera nos capacités."
 AST_R56_merchant_navy:0 "Marine marchande"
 AST_R56_merchant_navy_desc:0 "La flotte marchande et ses équipages sont vitaux pour [AST.GetNameDefCap]. Augmenter ses effectifs et ses convois sera essentiel pour soutenir nos forces à l’étranger."
 AST_R56_cruiser_modernisation:0 "Modernisation des croiseurs"
 AST_R56_cruiser_modernisation_desc:0 "Le développement de croiseurs et cuirassés modernes donnera à notre marine des navires polyvalents répondant à tous nos besoins."
 AST_R56_submarine_hunters:0 "Chasseurs de sous-marins"
 AST_R56_submarine_hunters_desc:0 "Une flotte ennemie pourrait privilégier les sous-marins pour attaquer nos convois. Le développement de navires anti-sous-marins pourrait dissuader ces attaques."
 AST_R56_project_cook:0 "Projet Cook"
 AST_R56_project_cook_desc:0 "Les porte-avions sont l’avenir de la puissance navale. Nous devons concevoir notre propre modèle pour protéger les côtes de [AST.GetNameDef]."
 AST_R56_royal_australian_navy:0 "Marine Royale [AST.GetAdjective]"
 AST_R56_royal_australian_navy_desc:0 "Nos récents plans d’expansion navale ont fait de notre flotte une force redoutable dans le Pacifique Sud. Plus de chantiers navals et un entraînement accru amélioreront encore nos capacités."

# Air
AST_R56_commonwealth_aricraft_corporation:0 "Corporation Aéronautique du Commonwealth"
AST_R56_commonwealth_aricraft_corporation_desc:0 "Récemment, le directeur général de Broken Hill Proprietary est revenu d’Europe avec la ferme conviction qu’une autre guerre éclatera bientôt sur le continent. Inquiet du manque de capacités de fabrication aéronautique [AST.GetAdjective], il a commencé à faire pression sur le gouvernement pour établir une industrie aéronautique moderne. Ce n’est pas une mauvaise idée."
AST_R56_cac_wirraway:0 "CAC Wirraway"
AST_R56_cac_wirraway_desc:0 "Le Wirraway est la première tentative de [AST.GetNameDef] pour construire une force aérienne et mettre à niveau l’industrie aéronautique régionale. Ces appareils serviront bien dans un rôle de bombardier léger/attaque au sol."
AST_R56_cac_woomera:0 "CAC Woomera"
AST_R56_cac_woomera_desc:0 "Le Woomera est un appareil léger, mais c’est l’évolution de notre précédent modèle, et il sera adéquat pour protéger notre patrie en fournissant un appui aérien rapproché à nos troupes."
AST_R56_ran_torped_factory:0 "Usine de Torpilles de la RAN"
AST_R56_ran_torped_factory_desc:0 "L’usine de torpilles de la Royal [AST.GetAdjective] Navy à Neutral Bay, Sydney, sera la principale installation où la majorité de nos torpilles et autres munitions seront fabriquées, entretenues et stockées. Le conseil d’administration a déjà acquis un site industriel existant pour ce projet. Il ne nous reste plus qu’à donner le feu vert."
AST_R56_cac_boomerang:0 "CAC Boomerang"
AST_R56_cac_boomerang_desc:0 "Le Boomerang sera le premier chasseur léger indigène de [AST.GetNameDef] et une assurance contre la perte d’avions importés. Nous prévoyons son utilisation dans un avenir proche."
AST_R56_australian_beaufighter:0 "Le Beaufighter [AST.GetAdjective]"
AST_R56_australian_beaufighter_desc:0 "Le Beaufighter est un chasseur lourd aux excellentes qualités de vol, puissamment armé, rapide à basse altitude et très silencieux en vol. La production locale de cet appareil performant à long rayon d’action sera très utile à nos forces armées."
AST_R56_womens_auxiliary_australian_air_force:0 "Force Aérienne Auxiliaire Féminine [AST.GetAdjective]"
AST_R56_womens_auxiliary_australian_air_force_desc:0 "Des femmes partout en Australie sont prêtes à servir leur pays. En établissant une force aérienne auxiliaire féminine, nous pouvons considérablement augmenter la taille et les capacités de la Royal Australian Air Force, même si ces femmes occupent uniquement des postes non-combattants."
AST_R56_royal_australian_air_force:0 "Royal [AST.GetAdjective] Air Force"
AST_R56_royal_australian_air_force_desc:0 "Créée en 1921 et approuvée par le roi George V, la Royal Australian Air Force est devenue le deuxième corps aérien royal du Commonwealth britannique. Bien que de petite taille, elle possède les compétences et l’entraînement nécessaires pour apporter un soutien significatif dans les conflits terrestres et navals."
AST_R56_jet_development:0 "Développement des Jets"
AST_R56_jet_development_desc:0 "Avec le temps, il devient de plus en plus évident que les avions à réaction représenteront l’avenir du combat aérien et du transport civil. Il serait insensé de nous laisser distancer dans cette course."
AST_R56_uranium_mines:0 "Mines d’Uranium"
AST_R56_uranium_mines_desc:0 "L’Australie abrite les plus grands gisements d’uranium au monde ; cependant, ils sont restés largement inexploités. Il serait judicieux de développer des mines pour extraire cette ressource précieuse."
AST_R56_the_ultimate_bomb:0 "La Bombe Ultime"
AST_R56_the_ultimate_bomb_desc:0 "Le potentiel des armes et équipements à base d’uranium semble illimité. Exploiter ce potentiel semble être la clé de la victoire."
AST_R56_airbase_expansion:0 "Extension des Bases Aériennes"
AST_R56_airbase_expansion_desc:0 "Le Département de l’Aviation Civile nous a conseillé sur les terrains à acheter pour construire de nouveaux aérodromes. Ces nouveaux aérodromes à Perth et à travers le pays aideront à développer notre aviation civile et militaire."
AST_R56_government_aircraft_factories:0 "Usines Aéronautiques Gouvernementales"
AST_R56_government_aircraft_factories_desc:0 "Il n’est pas secret que l’Australie manque d’un grand complexe industriel capable de produire des avions militaires et a dû compter sur la Royal Air Force britannique pour s’équiper. Avec un financement gouvernemental, nous pourrions commencer à produire des avions en Australie."
AST_R56_volunteer_air_observers_corps:0 "Corps des Observateurs Aériens Volontaires"
AST_R56_volunteer_air_observers_corps_desc:0 "La Royal Australian Air Force est surchargée. En créant un Corps d’Observateurs Aériens Volontaires composé de civils, nous pouvons maintenir une surveillance 24h/24 à travers le pays sans utiliser notre main-d'œuvre militaire déjà limitée."
AST_R56_air_defence_system:0 "Réseau de Défense Aérienne"
AST_R56_air_defence_system_desc:0 "La pression monte sur le gouvernement pour investir dans la construction de défenses anti-aériennes dans des zones potentiellement vulnérables en Australie, comme les ports et les complexes industriels. Il serait sage d’écouter ces recommandations."

# War Actions
AST_R56_national_security_act:0 "Loi sur la Sécurité Nationale"
AST_R56_national_security_act_desc:0 "L’état actuel du monde est le pire qu’il ait été depuis la Grande Guerre. Nous devons adopter une Loi sur la Sécurité Nationale afin de nous permettre de nous adapter à ces défis."
AST_R56_allied_works_council:0 "Conseil des Travaux Alliés"
AST_R56_allied_works_council_desc:0 "Pour développer efficacement nos industries de guerre, nous devons établir un conseil chargé de superviser ce processus. Ce conseil sera responsable de veiller à ce que nous allouions nos ressources de manière efficace et produisions le matériel et les équipements nécessaires pour soutenir nos troupes et remporter la victoire."
AST_R56_advisory_war_council:0 "Conseil Consultatif de Guerre"
AST_R56_advisory_war_council_desc:0 "Pour soutenir au mieux l’effort de guerre, nous établirons un conseil de guerre composé de tous les principaux partis politiques du pays."
AST_R56_army_inventions_board:0 "Comité des Inventions de l’Armée"
AST_R56_army_inventions_board_desc:0 "La création d’un Comité des Inventions de l’Armée permettra à l’armée de concevoir et d’inventer plus efficacement des équipements militaires de pointe."
AST_R56_classify_aliens:0 "Classer les Étrangers"
AST_R56_classify_aliens_desc:0 "Bien que cela puisse sembler inconfortable, l’un des moyens les plus efficaces de prévenir l’espionnage ennemi est de surveiller les individus de nationalité ennemie résidant dans notre pays."
AST_R56_civil_constructional_corps:0 "Corps Civil de Construction"
AST_R56_civil_constructional_corps_desc:0 "Pour mieux soutenir les travaux de construction militaires, nous établirons une main-d'œuvre civile."
AST_R56_squash_the_squander_bugs:0 "Écraser les Gaspilleurs"
AST_R56_squash_the_squander_bugs_desc:0 "Afin de soutenir notre économie, nous lancerons une campagne de propagande encourageant les civils à investir dans notre effort de guerre."
AST_R56_australian_womans_land_army:0 "Women's Land Army [AST.GetAdjective]"
AST_R56_australian_womans_land_army_desc:0 "L’Australie n’ayant pas une grande population, nous devons mobiliser toutes les ressources disponibles pour mener la guerre. La création d’une Women's Land Army nous permettrait d’augmenter nos effectifs, même si ces femmes ne participent pas directement aux combats."
AST_R56_fight_work_or_perish:0 "Combattre, Travailler ou Périr"
AST_R56_fight_work_or_perish_desc:0 "Pour gagner la guerre, chaque homme et chaque femme en Australie doit faire sa part. Nous devons nous unir pour garantir notre victoire."

# Go with UK
AST_R56_reaffirm_commonwelth_commitments:0 "Engagements envers le Commonwealth"
AST_R56_reaffirm_commonwelth_commitments_desc:0 "En tant que membre fier et actif du Commonwealth britannique, nous pouvons renforcer nos relations avec le reste de l’Empire et accéder à la recherche impériale en favorisant les relations inter-impériales par le biais de nos Hauts-Commissaires. Cela peut également nous aider à obtenir le soutien du public."
AST_R56_strengthen_british_ties:0 "Renforcer les Liens avec [ENG.GetAdjective]"
AST_R56_strengthen_british_ties_desc:0 "Depuis la fédération en 1901, l’Australie est une nation britannique, et notre propre constitution a été approuvée par la reine Victoria. En renforçant nos liens avec la mère patrie, nous pouvons créer de la stabilité et obtenir le soutien populaire."
AST_R56_csir:0 "CSIR"
AST_R56_csir_desc:0 "Le Commonwealth britannique et l’Empire abritent certains des plus grands intellectuels du monde. En renforçant notre implication dans le CSIR, nous pouvons acquérir des recherches cruciales sur toutes les questions liées à l’industrie et à l’ingénierie."
AST_R56_south_west_pacific_area_command:0 "Commandement de la Zone du Sud-Ouest Pacifique"
AST_R56_south_west_pacific_area_command_desc:0 "En tant que nation la plus développée de notre zone géographique, les Britanniques et les Américains comptent sur nous pour défendre le Sud-Ouest Pacifique. Nous devons assumer la responsabilité de protéger la région, surtout compte tenu de l’éloignement du Royaume-Uni et des États-Unis."
AST_R56_ask_for_the_christmas_islands:0 "Demander l’Île Christmas"
AST_R56_ask_for_the_christmas_islands_desc:0 "L’Île Christmas est actuellement administrée par les autorités coloniales britanniques en Malaisie. Cependant, nous pourrions discuter avec le gouvernement britannique de la possibilité de transférer l’île à notre administration et protection."

# Aller vers la liberté
AST_R56_dreams_of_a_republic:0 "Rêves de république"
AST_R56_dreams_of_a_republic_desc:0 "[AST.GetNameDefCap] ne mérite rien de moins qu’une indépendance totale vis-à-vis de Westminster."
AST_R56_australia_act:0 "L’Australia Act"
AST_R56_australia_act_desc:0 "L’adoption de l’Australia Act signifie que les Britanniques ne détiennent plus aucun pouvoir sur le Parlement australien. C’était une étape nécessaire pour atteindre l’indépendance totale."
AST_R56_look_to_america:0 "Regarder vers [USA.GetNameDef]"
AST_R56_look_to_america_desc:0 "[USA.GetNameDefCap] est un géant sur la rive est du Pacifique. Nous devrions les approcher et établir une ambassade à Washington D.C."
AST_R56_anzus:0 "ANZUS"
AST_R56_anzus_desc:0 "Compte tenu de nos valeurs communes en tant que nations libres et démocratiques, nous pourrions chercher à établir une relation militaire plus étroite avec les États-Unis d’Amérique."
AST_R56_protect_indonesia:0 "Protéger les Indes orientales"
AST_R56_protect_indonesia_desc:0 "Vu notre proximité avec les Indes orientales, si elles tombaient entre les mains d’une puissance étrangère ou d’une idéologie hostile, nous serions dans une situation dangereuse. En les plaçant officiellement sous notre protection, nous pourrons mieux défendre nos intérêts dans la région."
AST_R56_the_japaneese_threat:0 "La menace [JAP.GetAdjective]"
AST_R56_the_japaneese_threat_desc:0 "Ces dernières années, les Japonais se sont révélés être une menace sérieuse pour notre souveraineté et notre mode de vie. Pour affaiblir leur puissance et leurs efforts de guerre, nous pouvons tenter de convaincre d'autres nations amies de notre région d'imposer des embargos commerciaux."
AST_R56_preemptive_strike:0 "Frappe préventive"
AST_R56_preemptive_strike_desc:0 "Malgré notre embargo et nos efforts diplomatiques, il est clair que les Japonais ne montrent aucun signe de changement. Il nous revient donc de protéger le monde libre en frappant le Japon avant qu’il ne nous attaque."
AST_R56_pacific_initiative:0 "Initiative pacifique"
AST_R56_pacific_initiative_desc:0 "Maintenant que nous avons obtenu notre indépendance, il est temps de définir notre propre politique étrangère, indépendante des Britanniques ou des Américains. Cela commence par le Pacifique."
AST_R56_support_china:0 "Soutenir [CHI.GetNameDef]"
AST_R56_support_china_desc:0 "Les Chinois risquent sérieusement de tomber victimes de l’expansionnisme communiste de leurs voisins. Il est impératif que nous nous allions à eux pour éviter leur défaite."
AST_R56_support_japan:0 "Soutenir [JAP.GetNameDef]"
AST_R56_support_japan_desc:0 "Malgré les obstacles, les Japonais ont montré leur engagement envers la démocratie. Il semble évident de se ranger à leurs côtés plutôt qu’avec le gouvernement autocratique chinois."
AST_R56_research_cooperation:0 "Coopération en recherche"
AST_R56_research_cooperation_desc:0 "Notre indépendance vis-à-vis du Royaume-Uni s’est faite au prix d’une perte de recherches cruciales. Pour rattraper notre retard, nous devons établir notre propre groupe de recherche avec l’aide de nos nouveaux alliés."

# Démocratique
AST_R56_strengthen_the_coalition:0 "Renforcer la coalition"
AST_R56_strengthen_the_coalition_desc:0 "[AST.GetNameDefCap] a besoin d’un gouvernement national, et non d’un gouvernement dirigé par des chefs syndicaux. Le United Australia Party et le Country Party travaillent ensemble depuis des années avec un objectif commun : empêcher le Parti travailliste d’accéder au pouvoir. Mais la relation entre les deux partis a souvent été instable."
AST_R56_statute_of_westminster:0 "Le Statut de Westminster"
AST_R56_statute_of_westminster_desc:0 "Bien que nous restions loyaux au Commonwealth britannique et que la population soutienne la Couronne, il est temps pour le gouvernement australien d’adopter le Statut de Westminster. Cela garantirait que le Parlement britannique ne puisse légiférer pour l’Australie qu’avec le consentement de notre propre Parlement."
AST_R56_appeasment_in_asia:0 "Apaisement en Asie"
AST_R56_appeasment_in_asia_desc:0 "Avec l’attitude de plus en plus militariste de [JAP.GetNameDef] en Asie, nous devrions suivre [ENG.GetNameDef] et rechercher l’apaisement, de peur de provoquer leur colère."
AST_R56_enforce_japanese_exports:0 "Renforcer les exportations [JAP.GetAdjective]"
AST_R56_enforce_japanese_exports_desc:0 "Beaucoup de nos industries refusent d’exporter vers [JAP.GetNameDef], ce qui nuit à notre relation avec nos amis [JAP.GetAdjective]. Nous devons tout faire pour que nos exportations ne soient pas perturbées."
AST_R56_non_agression_with_japan:0 "Pacte de non-agression avec le Japon"
AST_R56_non_agression_with_japan_desc:0 "Jusqu’à présent, nous avons réussi à rétablir des relations normales avec le Japon et, avec un peu de manœuvres diplomatiques, nous pourrions les convaincre de signer un pacte de non-agression avec nous."
AST_R56_appeasment_in_europe:0 "Soutenir la politique d’apaisement"
AST_R56_appeasment_in_europe_desc:0 "Le gouvernement britannique a choisi de suivre une politique d’apaisement afin de renforcer ses forces avant de s’opposer efficacement à l’Allemagne. Nous devons soutenir cette stratégie jusqu’à ce que la Grande-Bretagne et l’Empire britannique soient assez forts pour intervenir."
AST_R56_down_with_the_communists:0 "À bas les communistes"
AST_R56_down_with_the_communists_desc:0 "Le communisme est une menace directe pour notre mode de vie démocratique. Nous devons agir pour limiter l’influence des partis communistes en Australie, de peur de devenir la prochaine victime d’une éventuelle révolution rouge."
AST_R56_support_the_primary_industries:0 "Soutenir les industries primaires"
AST_R56_support_the_primary_industries_desc:0 "Avec un financement et des subventions gouvernementales, nous pouvons augmenter considérablement nos quotas et nos capacités de production."
AST_R56_control_inflation:0 "Contrôler l’inflation"
AST_R56_control_inflation_desc:0 "Si nous ne faisons pas d’effort pour contenir l’inflation, notre pays pourrait ne jamais se remettre complètement de la dépression."
AST_R56_the_labor_government:0 "Le gouvernement travailliste"
AST_R56_the_labor_government_desc:0 "Notre gouvernement est dans une situation précaire, car nous n’avons pas été élus. Nous devons travailler à unir notre parti avant de pouvoir gouverner efficacement la nation."
AST_R56_reaffirm_white_australia:0 "Réaffirmer l’Australie blanche"
AST_R56_reaffirm_white_australia_desc:0 "« Ce pays restera à jamais le foyer des descendants de ceux qui sont venus ici en paix pour établir dans les mers du Sud un avant-poste de la race britannique. » - John Curtin"
AST_R56_legislate_the_indigenous_peoples:0 "Légiférer pour les peuples autochtones"
AST_R56_legislate_the_indigenous_peoples_desc:0 "Jusqu’à présent, la population autochtone d’Australie n’a pas été incluse dans le recensement national. Bien que ce changement risque de provoquer une forte opposition, il est crucial que nous franchissions cette étape."
AST_R56_support_the_commonwelth_workers:0 "Soutenir les travailleurs du Commonwealth"
AST_R56_support_the_commonwelth_workers_desc:0 "L’un des objectifs clés du mouvement travailliste australien est de créer des programmes qui soutiennent la classe ouvrière. Maintenant que nous sommes au pouvoir, nous pouvons mettre en place des programmes d’aide pour les travailleurs."
AST_R56_australian_new_deal:0 "Le New Deal [AST.GetAdjective]"
AST_R56_australian_new_deal_desc:0 "Maintenant que nous sommes au pouvoir, nous pouvons mettre en œuvre une série de programmes et d’initiatives publics visant à améliorer la vie quotidienne des Australiens."
AST_R56_centralise_pensions:0 "Centraliser les pensions"
AST_R56_centralise_pensions_desc:0 "Actuellement, les pensions sont fixées au niveau des États plutôt qu’au niveau fédéral. Centraliser le système de pension le rendrait plus efficace et légitime."
AST_R56_empower_the_trade_unions:0 "Renforcer les syndicats"
AST_R56_empower_the_trade_unions_desc:0 "Les syndicats ont une histoire complexe et controversée en Australie. Néanmoins, si nous voulons rester fidèles aux valeurs du Parti travailliste australien, nous devons leur accorder plus de pouvoirs."
AST_R56_forty_hour_work_week:0 "Semaine de travail de 40 heures"
AST_R56_forty_hour_work_week_desc:0 "Un mouvement gagne en popularité : la semaine de travail de 40 heures. En l’appliquant en Australie, nous pourrions augmenter la productivité et la satisfaction des travailleurs."
AST_R56_total_economic_control:0 "Contrôle économique total"
AST_R56_total_economic_control_desc:0 "La nationalisation économique totale, qui implique la prise de contrôle complète de toutes les entreprises privées par l’État, est une politique radicale. Bien qu’elle puisse susciter une forte indignation publique, il est indéniable qu’elle pourrait stimuler la production et aider à la reprise économique après la dépression."
AST_R56_nationalisation_of_the_banks:0 "Nationalisation des banques"
AST_R56_nationalisation_of_the_banks_desc:0 "L’étape logique suivante serait la nationalisation des banques, ce qui pourrait apporter une plus grande sécurité économique, mais au prix d’une indignation publique potentiellement extrême."

# Communiste
AST_R56_nationalise_healthcare:0 "Nationaliser les soins de santé"
AST_R56_nationalise_healthcare_desc:0 "Une population en bonne santé est une population heureuse et productive. En créant un service national de santé, nous pouvons garantir que plus personne n’ait à choisir entre se nourrir et consulter un médecin."

AST_R56_society_reorganised:0 "Société réorganisée"
AST_R56_society_reorganised_desc:0 "[AST.GetNameDefCap] est désormais le phare des idéaux communistes qu’il a toujours été destiné à devenir. Malgré les sacrifices nécessaires, la société est maintenant entièrement convertie aux idéaux marxistes. Puissent nos enfants se souvenir de ce moment avec fierté."

AST_R56_appeal_to_the_labour_dissidents:0 "Faire appel aux dissidents travaillistes"
AST_R56_appeal_to_the_labour_dissidents_desc:0 "Beaucoup au sein du Parti travailliste sont farouchement anticommunistes et écartent tous ceux qui croient davantage à la cause socialiste qu’eux. Nous devrions tendre la main à ceux qui sont désenchantés par la ligne actuelle du gouvernement travailliste et les rallier à notre cause."
AST_R56_militarise_the_workers_defence_corps:0 "Militariser le Corps de défense des travailleurs"
AST_R56_militarise_the_workers_defence_corps_desc:0 "Après plusieurs affaires très médiatisées de vol d’armes et d’explosifs, le Corps de défense des travailleurs a été sommé de limiter ses actions à ce qui est légal. C’était une erreur."
AST_R56_the_workers_revolution:0 "La révolution des travailleurs"
AST_R56_the_workers_revolution_desc:0 "À quoi sert une révolution si nous ne donnons pas du pouvoir à ceux pour qui elle est faite ?"
AST_R56_end_to_colonialism:0 "Mettre fin au colonialisme"
AST_R56_end_to_colonialism_desc:0 "Jamais plus l’Australie ne sera un État colonial d’une monarchie capitaliste étrangère. [AST.GetNameDef] sera à jamais une terre de liberté."
AST_R56_support_communist_china:0 "Soutenir les [PRC.GetAdjective] communistes"
AST_R56_support_communist_china_desc:0 "Les communistes [PRC.GetAdjective] luttent depuis longtemps contre la dictature de Chiang Kaï-chek. Alors qu’une guerre totale se profile, nous devons soutenir nos camarades [PRC.GetAdjective] en ces temps difficiles."
AST_R56_support_vietnam:0 "Soutenir le Viêt Nam"
AST_R56_support_vietnam_desc:0 "Un mouvement indépendantiste croissant se développe au Viêt Nam. Hô Chi Minh et son Viêt Minh rassemblent leurs forces, prêts à se lever contre leurs oppresseurs coloniaux. Nous devons accélérer ce processus."
