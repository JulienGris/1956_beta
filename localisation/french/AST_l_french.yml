 AST_R56_the_dismissal:0 "La Destitution"
 AST_R56_the_dismissal_desc:0 "Le Gouverneur général peut destituer le Premier ministre actuel et son gouvernement. Avec suffisamment de soutien, il n’a même pas besoin de les remplacer."
