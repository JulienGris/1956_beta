 AST_R56_memories_of_gallipoli:0 "Souvenirs de Gallipoli"
 AST_R56_memories_of_gallipoli_desc:0 "§RVous ne pouvez pas augmenter les lois sur la conscription tant que les objectifs nationaux correspondants n’ont pas été atteints. Consultez la loi sur la conscription pour plus de détails.§!\n\nLe peuple [AST.GetAdjective] n’a pas oublié comment le sang australien a été versé sur les champs de bataille de la Grande Guerre. Il existe donc une opposition importante à toute idée de conscription des [AST.GetAdjective]s pour combattre à l’étranger si une nouvelle guerre éclatait."
