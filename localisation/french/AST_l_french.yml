 #Australia First
 AST_R56_australia_first:0 "L’Australie d’Abord"
 AST_R56_australia_first_desc:0 "Issu de l’Association Rationaliste de Nouvelle-Galles du Sud et du Parti socialiste victorien, le Mouvement Australia First a été fondé par Percy Stephensen comme un mouvement anti-guerre, anti-colonialiste et isolationniste."
 AST_R56_remember_eureka:0 "Se souvenir d’Eureka"
 AST_R56_remember_eureka_desc:0 ""
 AST_R56_never_another_gallipoli:0 "Plus jamais un autre Gallipoli"
 AST_R56_never_another_gallipoli_desc:0 ""
 AST_R56_advance_australia_fair:0 "Advance Australia Fair"
 AST_R56_advance_australia_fair_desc:0 ""
 AST_R56_the_writers_revolution:0 "La Révolution des Écrivains"
 AST_R56_the_writers_revolution_desc:0 "Divers écrivains comme Xavier Herbert, Miles Franklin et Eleanor Dark ont soutenu le mouvement depuis sa création. Cette idée doit être adoptée et l’intellectualisme encouragé."
 AST_R56_rationalist_education:0 "Éducation Rationaliste"
 AST_R56_rationalist_education_desc:0 "Nous ne devons pas oublier nos origines rationalistes. En promouvant la pensée et l’éducation rationalistes, nous pouvons assurer l’avenir de [AST.GetNameDef]."
 AST_R56_inderpendant_asia_movement:0 "Soutenir le Mouvement pour une Asie Indépendante"
 AST_R56_inderpendant_asia_movement_desc:0 ""
 AST_R56_australian_national_socalism:0 "National-Socialisme [AST.GetAdjective]"
 AST_R56_australian_national_socalism_desc:0 "Les idéaux nationaux-socialistes de [GER.GetNameDef] sont un exemple parfait de la façon dont [AST.GetNameDef] peut devenir un phare de civilisation dans le Pacifique Sud."
 AST_R56_a_corporate_state:0 "L’État Corporatiste"
 AST_R56_a_corporate_state_desc:0 "Nous avons le soutien de divers industriels et hommes d’affaires. Avec leur aide, nous transformerons [AST.GetNameDef] en un État corporatiste national-socialiste."
 AST_R56_encourage_the_arms_industralists:0 "Encourager les Industriels de l’Armement"
 AST_R56_encourage_the_arms_industralists_desc:0 "La jeune industrie de l’armement de [AST.GetNameDefCap] est une fierté nationale. Lithgow doit devenir un nom mondialement connu aux côtés de Browning et Mauser."
 AST_R56_australias_natural_wealth:0 "Les Richesses Naturelles de l’Australie"
 AST_R56_australias_natural_wealth_desc:0 ""
 AST_R56_support_the_coal_industry:0 "Soutenir l’Industrie du Charbon"
 AST_R56_support_the_coal_industry_desc:0 ""
 AST_R56_australiam_isolationism:0 "Isolationnisme [AST.GetAdjective]"
 AST_R56_australiam_isolationism_desc:0 ""
 AST_R56_true_autarky:0 "Autarcie [AST.GetAdjective]"
 AST_R56_true_autarky_desc:0 ""
 AST_R56_young_australian_league:0 "Ligue des Jeunes [AST.GetAdjective]"
 AST_R56_young_australian_league_desc:0 "Les jeunes générations sont notre avenir et doivent être bien formées. Nous devrions envoyer des observateurs en [GER.GetNameDef] et [JAP.GetNameDef] pour voir comment ils inculquent les valeurs patriotiques à leur jeunesse et appliquer ces leçons chez nous."
 AST_R56_control_the_abc:0 "Contrôler l’ABC"
 AST_R56_control_the_abc_desc:0 "L’Australian Broadcasting Company est l’agence de presse publique de [AST.GetNameDef]. Nous devons nous assurer qu’elle diffuse uniquement des informations éducatives et correctes et non pas des mensonges pro-[ENG.GetAdjective]."
 AST_R56_japanese_cooportation:0 "Coopération [JAP.GetAdjective]"
 AST_R56_japanese_cooportation_desc:0 "[JAP.GetNameDef] est une nation puissante qui est l’exemple même de ce que les peuples du Pacifique peuvent accomplir sans intervention européenne corrompue. Nous les soutiendrons dans leurs ambitions pour une Sphère de coprospérité."
 AST_R56_southern_axis:0 "L’Axe du Sud"
 AST_R56_southern_axis_desc:0 "Bien qu’étant à l’autre bout du monde, [GER.GetNameDef] est notre ami et allié naturel. Nous deviendrons leur axe du sud."
 AST_R56_south_pacific_independent_research_fund:0 "Fonds de Recherche Indépendant du Pacifique Sud"
 AST_R56_south_pacific_independent_research_fund_desc:0 "Nous devons aider nos amis d’Asie à faire du Pacifique Sud un véritable phare de la science et du savoir."
 AST_R56_seize_the_seventh_state:0 "S’emparer du Septième État"
 AST_R56_seize_the_seventh_state_desc:0 "La Nouvelle-Zélande a toujours eu sa place dans la constitution [AST.GetAdjective] en tant que septième État, mais elle continue de proclamer son indépendance. Si elle ne revient pas à la raison, nous devrons agir."
 AST_R56_war_beyond_the_seas:0 "Vers les Guerres au-delà des Mers"
 AST_R56_war_beyond_the_seas_desc:0 "Nous ne pourrons pas éviter les conflits éternellement. Pour instaurer une paix durable, nous devons tous marcher vers la guerre."
 AST_R56_work_fight_or_be_destroyed:0 "Combattre, Travailler ou Être Détruit"
 AST_R56_work_fight_or_be_destroyed_desc:0 ""

 # Centriste
 AST_R56_third_time_lucky:0 "La troisième sera la bonne"
 AST_R56_third_time_lucky_desc:0 "Le Parti du Centre s'est effondré en 1935 après un soutien décroissant. Il semble que le peuple [AST.GetAdjective] ne soit pas en phase avec Eric Campbell. Mais il est temps pour lui de sortir de sa retraite, de refonder le parti et d'essayer à nouveau. Après tout, la troisième sera la bonne."
 AST_R56_reestablish_the_new_guard:0 "Refonder la Nouvelle Garde"
 AST_R56_reestablish_the_new_guard_desc:0 "Inspirée par les organisations paramilitaires fascistes européennes, la Nouvelle Garde avait attiré de nombreux vétérans de la Grande Guerre au début des années 1930. Mais comme le Parti du Centre, ses membres ont disparu et l'organisation a été dissoute après les élections de 1935. Maintenant que les Australiens ont enfin adopté les idées d'Eric Campbell, il est temps que la Nouvelle Garde devienne l'organisation qu'elle aurait toujours dû être."
 AST_R56_repeal_socialist_legislation:0 "Abroger la législation socialiste"
 AST_R56_repeal_socialist_legislation_desc:0 ""
