 AST_R56_incom_tax_assessment_act_idea:0 "Loi sur l’Évaluation de l’Impôt sur le Revenu"
 AST_R56_incom_tax_assessment_act_idea_desc:0 "Nos lois fiscales actuelles ont été révisées pour la dernière fois en 1915, pendant la Grande Guerre. Alors que le pays est actuellement frappé par une dépression, il serait sage de revoir ces lois et d’apporter les modifications nécessaires."
