 AST_R56_naval_auxiliary_patrol:0 "Patrouille Navale Auxiliaire"
 AST_R56_naval_auxiliary_patrol_desc:0 "À travers l’Australie, il existe des unités de réserve navale volontaires qui n’ont pas encore été mobilisées. En leur confiant la mission de patrouiller les rivières, les ports et autres zones côtières, nous pouvons considérablement renforcer notre capacité à défendre des lieux stratégiques dans tout le pays."
