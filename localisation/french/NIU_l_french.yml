 NIU_church_dominance_desc:0 "Avec une majorité de notre population appartenant à la foi chrétienne, l’Église exerce une grande influence sur les normes sociales et l’opinion publique. Cela menace notre contrôle total sur le pays."
 NIU_constant_drought:0 "Sécheresses"
 NIU_constant_drought_desc:0 "Notre île a été victime de multiples sécheresses au fil des ans, entraînant un déclin agricole généralisé et des difficultés économiques."
