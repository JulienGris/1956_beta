 # IDÉES
 NIU_memories_from_ww1:0 "Souvenirs de la Grande Guerre"
 NIU_memories_from_ww1_desc:0 "En 1915, nous avons envoyé un contingent de 150 hommes pour combattre dans une guerre à laquelle nous n’avions aucun droit de participer, et où notre présence n’était pas nécessaire. \nLes courageux soldats [NIU.GetAdjective] ont combattu en France, mais ont dû être rapatriés en 1917 à cause de maladies. Depuis lors, nous sommes restés sur notre île, à l’écart des conflits étrangers. Et nous comptons bien le rester."
