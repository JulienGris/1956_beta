l_french:

JAP_caught_off_gruad:0 "Pris au dépourvu"
JAP_caught_off_gruad_desc:0 "Nous savions qu’ils allaient venir, mais nous ne pensions pas que ce serait si tôt."

#Vanilla rename
r56_JAP_prepare_for_war_with_the_soviet_union:0 "Doctrine du coup de poing vers le Nord"
r56_JAP_prepare_for_war_with_the_soviet_union_desc:0 "Nous devons faire face à la menace qui pèse sur nos frontières septentrionales. Nous devons commencer les préparatifs pour une guerre contre [SOV.GetNameDef]."

japan_wtt_focus:0 "Arbre de priorités japonais"
