JAP_militarism_democracy:0 "Militarisme démocratique"
JAP_bastion_of_democracy:0 "Bastion démocratique"
JAP_controlled_zaibatsus:0 "Zaibatsus contrôlés"
JAP_controlled_zaibatsus_desc:0 "Nous devons faire payer nos riches si nous voulons atteindre nos idéaux."
