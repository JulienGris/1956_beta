### ARBRE D’INVESTISSEMENT EN MANDCHOURIE
JAP_factory_manchu:0 "Investir en Mandchourie"
JAP_factory_manchu_desc:0 "Peut-être que l’aide mandchoue pourra nous être utile à l’avenir."
JAP_resource_manchu:0 "Exploiter la Mandchourie"
JAP_resource_manchu_desc:0 "La Mandchourie doit être exploitée pour que le Japon ait plus d’influence sur la scène mondiale. Leur sacrifice est un prix que nous sommes prêts à payer."
JAP_expanded_aluminium_in_manchu:0 "Étendre les usines d’aluminium en Mandchourie"
JAP_expanded_aluminium_in_manchu_desc:0 "Nous avons de nombreux produits nécessitant cette ressource. Qu’ils en extraient davantage."
JAP_manchu_oil:0 "Gisements pétroliers mandchous"
JAP_manchu_oil_desc:0 "Nous avons découvert de nouveaux gisements de pétrole… qui sait ce que nous trouverons ensuite !"
JAP_manchu_buff:0 "Armée mandchoue"
JAP_manchu_buff_desc:0 "L’armée mandchoue pourrait bénéficier de certains de nos officiers d’état-major."
JAP_manchu_buff1:0 "Forces spéciales mandchoues"
JAP_manchu_buff1_desc:0 "L’ajout d’unités spécialisées supplémentaires pourrait s’avérer utile à l’effort de guerre."

### ARBRE DÉMOCRATIQUE
JAP_island_investment:0 "Investissement insulaire"
JAP_island_investment_desc:0 "Maintenant que nous avons renoncé à l’expansionnisme, nous pouvons rediriger nos ressources vers d’autres régions, notamment nos possessions coloniales."
JAP_ally_korea:0 "Pacte démocratique asiatique"
JAP_ally_korea_desc:0 "Mettons nos différends de côté, tendons la main et aidons-nous mutuellement. L’Asie doit se hisser sur la scène mondiale par ses propres moyens, sans influences occidentales."
JAP_joint_civilian_investment:0 "Investissement civil conjoint"
JAP_joint_civilian_investment_desc:0 "Nous pouvons nous entraider, ainsi que notre nouvel allié démocratique, ce qui ouvrira nos marchés respectifs et stimulera nos économies."
JAP_east_asian_bank:0 "Banque d’Asie de l’Est"
JAP_east_asian_bank_desc:0 "La création d’un système financier central unira nos démocraties."
JAP_joint_military_cooperation:0 "Coopération militaire conjointe"
JAP_joint_military_cooperation_desc:0 "En entraînant nos armées d’Asie de l’Est ensemble lors d’exercices militaires, nous gagnerons en expérience."
JAP_korean_chaebols:0 "Investir dans les conglomérats coréens"
JAP_korean_chaebols_desc:0 "Investir dans les entreprises coréennes nous permettra d’élargir notre marché futur."
JAP_expand_aluminium_plants:0 "Étendre l’aluminium du Kansai"
JAP_expand_aluminium_plants_desc:0 "Investir dans nos ressources internes renforce notre économie tournée vers l’exportation."
JAP_invest_in_allies_tt:0 "Si les alliés asiatiques font partie de votre faction, ils recevront également des bonus issus de ce focus."
JAP_island_colonization:0 "Coloniser [FROM.getName]"
JAP_north_east_asian_bank:0 "Banque d’Asie de l’Est"
JAP_north_east_asian_military:0 "Pacte militaire est-asiatique"
JAP_the_chaebols:0 "Chaebols"
JAP_economy_by_japan_infantry:0 "Production d’infanterie"
JAP_economy_by_japan_tanks:0 "Production de chars"
JAP_economy_by_japan_planes:0 "Production aéronautique"
