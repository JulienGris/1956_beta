JAP_conciliatory_foreign_policy:0 "Politique étrangère conciliante"
JAP_conciliatory_foreign_policy_desc:0 "Conformément à notre engagement envers le Traité naval de Londres, nous devons rassurer les grandes puissances sur nos intentions pacifiques pour le bien de la région."
