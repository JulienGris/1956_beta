JAP_the_bastion_desc:0 "Le Japon doit être le bastion de la démocratie en Orient ; nous devons être prêts à nous battre pour cette nouvelle démocratie, ou bien la voir périr."
JAP_invite_the_militarist_back:0 "Rappeler les militaristes"
JAP_invite_the_militarist_back_desc:0 "Nous devrions chercher un compromis avec les militaristes. Ils peuvent encore être utiles, comme autrefois — mais sous de nouvelles règles."
JAP_economic_deals:0 "Accords économiques"
JAP_economic_deals_desc:0 "Nous pouvons utiliser l’avance technologique de nos alliés pour stimuler notre économie."
