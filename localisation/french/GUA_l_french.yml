 #Decisions
 GUA_french_decisions:0 "Retour des exilés"
 GUA_french_decisions_desc:0 "Le moment est venu de réclamer le trône de France à ces prétendants indignes. Le génie militaire et la vision politique de [GUA.GetLeader] rendront à la France sa gloire d’antan et au-delà. Le monde sera témoin de la renaissance d’un empire, et les erreurs de Waterloo seront effacées de l’histoire à jamais !"
