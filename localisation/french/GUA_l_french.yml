 GUA_integrate_state_map_area:0 "Choisir quel État intégrer à [ROOT.GetNameDef]."

 #Events
 r56_guatemala.1.t:0 "Le petit Napoléon des tropiques..."
 r56_guatemala.1.d:0 "Depuis son arrivée au pouvoir, [GUA.GetLeader] s’est parfois laissé aller à croire qu’il était la réincarnation de Napoléon Bonaparte, l’ancien empereur de France. Longtemps, ce « délire » fut rejeté comme une simple arrogance, les gens y voyant les divagations d’un homme orgueilleux. Mais les événements récents ont éveillé les inquiétudes. Un autre bonapartiste a pris le pouvoir à Paris, et avec la série de victoires militaires remportées par [GUA.GetLeader] en Amérique centrale, ses illusions sont devenues de plus en plus apparentes. Ce qui n’était jadis qu’un excès d’ego pèse désormais lourdement sur son esprit. Dans ses moments de solitude, on peut entendre des murmures, échos des propres paroles de Napoléon : « La gloire est éphémère, mais l’oubli est éternel… »"
 r56_guatemala.1.a:0 "« Je suis Napoléon ! Le monde craindra ma colère ! »"
 r56_guatemala.1.b:0 "« Señor Ubico, allons vous mettre au lit… »"
