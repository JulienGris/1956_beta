 GUA_banana_republic:0 "République bananière"
 GUA_banana_republic_desc:0 "[GUA.GetNameDefCap] est fortement dominé par l’United Fruit Company, une entreprise [USA.GetAdjective] dirigée par Samuel Zemurray. Contrôlant près de 80 % des terres privées du pays, elle est le plus grand propriétaire terrien du Guatemala. Ce pouvoir économique immense lui permet d’exercer une influence considérable sur la politique gouvernementale et de contraindre l’administration à servir ses intérêts insatiables et égoïstes."

 GUA_police_state:0 "État policier répressif"
 GUA_police_state_desc:0 "Depuis le coup d’État de 1921 soutenu par l’United Fruit Company, le Guatemala a connu une instabilité prolongée. Cependant, la situation commença à changer près d’une décennie plus tard avec l’arrivée au pouvoir de Jorge Ubico. Lors de son premier mandat de cinq ans, Ubico transforma le pays en un État politiquement stable grâce à son habile usage de la répression, perfectionné durant son passage à la Policía de Investigación, la police secrète [GUA.GetAdjective]. Son régime employait des tactiques telles que la censure de la presse, l’intimidation politique, une surveillance étendue et l’application de la « Ley de Fugas », une loi qui permettait en pratique l’exécution extrajudiciaire des prisonniers. Sous son règne, personne n’était à l’abri… à tout moment, ils pouvaient frapper à votre porte au cœur de la nuit."

 GUA_indigenous_military:0 "Armée à majorité indigène"
 GUA_indigenous_military_desc:0 "Bien que tout homme guatémaltèque valide soit censé servir au moins un an dans l’armée, l’application de cette obligation s’avère difficile. Beaucoup l’évitent grâce à des pots-de-vin versés à des officiers subalternes. Cependant, cette option n’existe pas pour la population indigène qui, en raison de son statut socio-économique inférieur, est enrôlée de manière disproportionnée. Leur respect culturel de l’autorité entraîne une loyauté sans faille envers les hautes sphères militaires, contribuant à la stabilité du Guatemala. Malheureusement, cette loyauté est souvent leur seul atout : nombre de conscrits indigènes sont peu instruits, beaucoup ne savent ni lire ni écrire, et ils manquent cruellement de connaissances militaires de base."
