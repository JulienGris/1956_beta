POL_bop_military_parade_desc:0 "En organisant une parade militaire, nous pouvons montrer à notre peuple cette grande armée bâtie grâce à Edward Rydz-Śmigły !"

POL_bop_minor_pro_democratic_reforms:0 "Petites réformes pro-démocratiques"
POL_bop_minor_pro_democratic_reforms_desc:0 "Adopter quelques lois pour démocratiser légèrement notre nation pourrait renforcer la faction Sanacja de gauche."

