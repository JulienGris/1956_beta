POL_The_Great_Depression:0 "La Grande Dépression"
POL_The_Great_Depression_desc:0 "La Pologne a été particulièrement touchée par la Grande Dépression. Les investissements, la production industrielle, le commerce et la qualité de vie ont fortement décliné ces dernières années."
POL_Rural_Unemployment:0 "Chômage Rural"
POL_Rural_Unemployment_desc:0 "Les régions orientales de la Pologne sont beaucoup moins développées que l’ouest. Le chômage sévit dans tout le pays et est encore plus grave dans les campagnes orientales."
POL_Prometheism:0 "Prométhéisme"
POL_Prometheism_desc:0 "Le prométhéisme était un projet politique secret initié par la Pologne. Son objectif était d’affaiblir l’Empire russe et ses États successeurs, dont l’Union soviétique, en soutenant les mouvements nationalistes d’indépendance des principaux peuples non russes vivant dans ses frontières."
POL_the_Agrarian_Reform_Focus:0 "Réforme Agraire"
POL_the_Agrarian_Reform_Focus_desc:0 "Des réformes de la propriété foncière sont en cours, soutenues par l’appui populaire de la paysannerie."
POL_Sanacja_Government:0 "Gouvernement Sanacja (Assainissement)"
POL_Sanacja_Government_desc:0 "Créé après le coup d’État de mai 1926 de Józef Piłsudski, le mouvement Sanacja se composait principalement d’anciens officiers militaires écœurés par la corruption perçue en politique polonaise. La Sanacja était une coalition de droitiers, de gauchistes et de centristes, dont l’objectif principal était l’élimination de la corruption et la réduction de l’inflation."
intelligence_analyst:0 "Analyste du Renseignement"
collective_austerity_idea:0 "Austérité Collective"
POL_general_staff:0 "Régime des Colonels"
POL_general_staff_desc:0 "Le maréchal Edward Rydz-Śmigły et son état-major dirigent directement le gouvernement et l’armée au plus haut niveau. De ce fait, ils sont libres des considérations politiques habituelles qui retardent la planification militaire."
POL_Budget_Reform_Focus:0 "Réformes Budgétaires"
POL_Budget_Reform_Focus_desc:0 "Le budget est rééquilibré afin de privilégier l’économie plutôt que les dépenses militaires."
POL_Infantry_Focus:0 "L’Armée Paysanne"
POL_Infantry_Focus_desc:0 "Une nouvelle armée polonaise a été formée, composée de la paysannerie rurale."
POL_Motorization_Focus:0 "Investissement dans l’Industrie Automobile"
POL_Motorization_Focus_desc:0 "Des incitations spéciales sont offertes aux fabricants automobiles pour une durée limitée."
POL_Air_Focus:0 "Privatisation des Sociétés Aéronautiques d’État"
POL_Air_Focus_desc:0 "Les fabricants d’avions d’État sont désormais placés sous la gestion du secteur privé."
POL_Empty_Universities:0 "Universités Vidées"
POL_Empty_Universities_desc:0 "Tous les étudiants universitaires se sont portés volontaires ou ont été enrôlés pour la défense de la nation."
POL_The_Catholic_Student_Movement:0 "Le Mouvement Étudiant Catholique"
POL_The_Catholic_Student_Movement_desc:0 "L’inscription dans les universités religieuses est encouragée et incitée."
POL_DWL:0 "DWL"
POL_stocznia_gdansk:0 "Chantier Naval de Gdansk"
POL_National_Syndicalism:0 "Syndicalisme National"
POL_National_Syndicalism_desc:0 "Pour le syndicaliste, l’État capitaliste était par nature un outil d’oppression et d’inefficacité bureaucratique. Dans le syndicalisme national, le gouvernement supervise et encourage l’action industrielle directe de groupes locaux de citoyens et de syndicats pour produire au service de l’État."
