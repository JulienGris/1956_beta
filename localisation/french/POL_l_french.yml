POL_Man_Portable_Land_Mine_Detectors:0 "Détecteurs de Mines Terrestres Portatifs"
POL_Man_Portable_Land_Mine_Detectors_tt:0 " qui accorde\n   §HArmée entière§! : Attrition des divisions §G-2%§!\n   §HInfanterie & Cav/Mot/Mécanisée§! : Attaque contre Fortifications terrestres §G+3%§!\n   §HGénie§! : Percée §G+10%§!\n\n"
POL_Agriculture_Modernization_and_Education_Effort:0 "Effort de Modernisation Agricole & Éducation"
POL_Artillery_Motorization:0 "Motorisation de l’Artillerie"
POL_Artillery_Motorization_desc:0 "L’avenir du développement de l’artillerie réside dans la création de plateformes d’armes de plus en plus mobiles."
POL_Phase_I_Military_Rearmament:0 "Phase I§H :§! Réarmement Militaire"
POL_Phase_I_Military_Rearmament_desc:0 "La première phase de notre plan de 15 ans prévoit une expansion rapide de nos industries de défense. Un programme complet de modernisation est prévu pour les forces armées polonaises d’ici 1942."
POL_Phase_II_Infrastructure_Development:0 "Phase II§H :§! Développement des Infrastructures"
POL_Phase_II_Infrastructure_Development_desc:0 "La deuxième phase de notre plan de 15 ans met l’accent sur l’amélioration des infrastructures polonaises. En asphaltant les routes rurales et en construisant de nouvelles autoroutes, une grande partie de la campagne pourra être rendue praticable aux automobiles."
POL_Phase_III_Agriculture_and_Education:0 "Phase III§H :§! Agriculture et Éducation"
POL_Phase_III_Agriculture_and_Education_desc:0 "La troisième phase de notre plan de 15 ans prévoit la modernisation de l’agriculture polonaise. En fournissant aux paysans ruraux des moissonneuses-batteuses, tracteurs et machines lourdes ainsi qu’une formation technique pour les entretenir, les exportations agricoles pourront redevenir compétitives."
POL_Phase_IV_Urbanization:0 "Phase IV§H :§! Incitations à l’Urbanisation"
POL_Phase_IV_Urbanization_desc:0 "La quatrième phase de notre plan de 15 ans prévoit une urbanisation rapide du pays. En investissant dans le développement des villes, en créant de nouveaux emplois et en offrant de généreuses subventions, les paysans ruraux seront incités à migrer vers les centres urbains."
POL_Phase_V_Equalize_Poland_A_and_B:0 "Phase V§H :§! Égaliser la Pologne « A » et la Pologne « B »"
POL_Phase_V_Equalize_Poland_A_and_B_desc:0 "La cinquième phase de notre plan de 15 ans éliminera enfin les inégalités de revenus entre la Pologne occidentale et orientale. En asséchant les marais de l’est du pays et en dirigeant l’aide au développement dans la région, le commerce et la croissance économique augmenteront."
POL_Polbryt:0 "Polbryt"
POL_polish_british_shipbuilding:0 "Union des Constructeurs Navals Polono-Britanniques"
POL_Liberty_Desire:0 "Désir de Liberté"
POL_Offer_Czechoslovakia_Protection:0 "Offrir une Protection à la Tchécoslovaquie"
POL_Offer_Czechoslovakia_Protection_desc:0 "Suite à l’occupation allemande des Sudètes, l’avenir de la Tchécoslovaquie est très incertain. Afin d’assurer la sécurité de notre flanc sud, nous devrions proposer une protection. Un tel arrangement, cependant, nécessitera un certain degré d’intégration temporaire du gouvernement et de l’armée tchécoslovaques avec les nôtres."
POL_Civil_Service_Reform_tt:0 "Débloque les Décisions §HAdministratives§!"

POL_tank_theorist:0 "Théoricien des Chars"
POL_Gundlach_Periscope:0 "Le Périscope Gundlach"
POL_Gundlach_Periscope_desc:0 "Pour combattre efficacement sur le champ de bataille, les véhicules blindés doivent avoir une vision à 360 degrés de leur environnement. De telles capacités doivent être obtenues sans sacrifier l’ergonomie de l’équipage ni les exigences de taille."
Reversible_Periscope:0 "Périscope Réversible"
Reversible_Periscope_tt:0 " qui accorde :\n   §HChars, Chasseurs de Chars, & Compagnie de Reconnaissance§! :\n      Organisation max §G+2§!\n      Percée §G+5%§!\n\n"
POL_Devalue_Zloty:0 "[Root.GetPolStrengthenDevalue] le Złoty"
POL_STRENGTHEN_CURRENCY:0 "Renforcer"
POL_DEVALUE_CURRENCY:0 "Dévaluer"
POL_STRENGTHEN_DEVALUE_CURRENCY:0 "Renforcer / Dévaluer"
POL_Devalue_Zloty_desc:0 "L’administration civile et l’armée s’opposent depuis longtemps sur l’orientation de la politique monétaire polonaise. Le moment est venu de s’engager pleinement dans une décision."
Zloty_Castle_tt:0 "-------------------------------\n Si §HRéforme Budgétaire§! est sélectionnée :\n-------------------------------\n"
Zloty_Right_tt:0 "-------------------------------\n Si §HSecond Homme de l’État§! est sélectionné :\n-------------------------------\n"
POL_The_Great_Depression_Castle:0 "La Grande Dépression"
POL_strenghten_the_zloty:0 "Renforcer le Złoty"
POL_The_Great_Depression_Sanacja_Right:0 "La Grande Dépression"
POL_devalue_the_zloty:0 "Dévaluer le Złoty"
POL_The_Great_Depression_Sanacja_Right_dummy:0 "La Grande Dépression"
POL_devalue_the_zloty_dummy:0 "Dévaluer le Złoty"
POL_German_Berlinka_Highway_Project:0 "Projet d’Autoroute Allemande Berlinka"
POL_German_Berlinka_Highway_Project_desc:0 "Depuis quelque temps, des diplomates allemands proposent l’idée d’une autoroute commune à travers la Poméranie. En permettant à l’Allemagne de construire une autoroute extraterritoriale dans le Corridor polonais, des investissements et une croissance pourront avoir lieu dans la région environnante."
Maritime_Defense_Fund_tt:0 "Ajoute la technologie : §HCoque de Sous-Marin 1936§!\n"
POL_Wladyslaw_Bortnowski:0 "Władysław Bortnowski"
POL_Universal_Research_Bonus:0 "Réduit la pénalité d’avance technologique de §G0.5§! an et accorde un bonus de recherche de §G25%§!. Valable pour les §H2§! prochaines de ces technologies :\n§HToutes Technologies§!"
POL_Family_Sponsorship_Program:0 "Programme de Parrainage Familial"
POL_Family_Sponsorship_Program_desc:0 "Dans le but de promouvoir les valeurs traditionnelles et d’encourager les familles nombreuses, le président Mościcki a décrété que chaque septième fils d’une famille polonaise indigène, non issue d’unions mixtes, deviendrait son filleul. Parmi les familles répondant à ces critères stricts et jouissant d’une bonne réputation morale, le président ou le sénateur du voïvodie se rendrait personnellement au baptême de l’enfant. De plus, l’État accorderait à cet enfant de généreux avantages tels qu’une éducation gratuite en Pologne et à l’étranger, des transports publics gratuits à vie, des bons de soins médicaux gratuits à vie, et un fonds fiduciaire pour ses économies à sa majorité. Au total, un peu moins de 1000 individus ont bénéficié de ce programme, mais il a eu un effet considérable en renforçant l’image publique de Mościcki en tant qu’homme de famille sincère."
POL_Arms_Sales_Nationalist_Spain:0 "Ventes d’Armes à l’Espagne Nationaliste"
POL_Arms_Sales_Nationalist_Spain_desc:0 "La Guerre Civile espagnole offre une opportunité de vendre nos vieux stocks d’équipement à des acheteurs intéressés. Les fonds générés par ces ventes d’armes peuvent ensuite être utilisés pour produire des équipements militaires plus modernes pour notre propre armée."
POL_Arms_Sales_Republican_Spain:0 "Ventes d’Armes à l’Espagne Républicaine"
POL_Arms_Sales_Republican_Spain_desc:0 "La Guerre Civile espagnole offre une opportunité de vendre nos vieux stocks d’équipement à des acheteurs intéressés. Les fonds générés par ces ventes d’armes peuvent ensuite être utilisés pour produire des équipements militaires plus modernes pour notre propre armée."
POL_National_Womens_Organization:0 "Organisation Nationale des Femmes (NOK)"
POL_National_Womens_Organization_desc:0 "Le 28 novembre 1918, peu après que la Pologne a obtenu son indépendance, les femmes ont obtenu le droit de vote complet. L’Organisation Nationale Électorale des Femmes a été créée par le parti Démocratie Nationale pour encourager l’activisme politique et le soutien au mouvement Endecja. La plateforme de l’organisation appelait à la mise en œuvre de principes chrétiens, nationaux et démocratiques, plaçant toujours le bien de la République dans son ensemble au-dessus des intérêts des partis, districts et états. Les membres étaient appelées à défendre la foi et la morale contre les influences antireligieuses, subversives, antinationales, antisociales et antiétatiques. Des demandes ont été faites pour que l’éducation polonaise reçoive un caractère catholique, pour inverser la sécularisation du mariage et pour abroger les lois autorisant le divorce. Avec un accent sur la discipline personnelle, l’adhésion était répandue parmi les classes moyennes polonaises, les propriétaires terriens et l’intelligentsia."
POL_Evacuate_Polands_Gold_Reserves:0 "Évacuer les Réserves d’Or de la Pologne"
POL_Evacuate_Polands_Gold_Reserves_desc:0 "L’évacuation de nos réserves de devises et des pièces détachées de nos usines nous permettra de financer l’entretien d’une armée nationale en exil."
POL_underground_anthem:0 "§LHymne Clandestin Polonais§!"
POL_reconstitute_an_air_force_in_exile:0 "Reconstituer une Force Aérienne en Exil"
POL_reconstitute_an_air_force_in_exile_desc:0 "Malgré la défaite, les [POL.getAdjective] ont pris leur envol et sont prêts à poursuivre le combat."
POL_SEPEWE:0 "SEPEWE"
