POL_bop_subsidize_military_factory:0 "Subventionner une usine militaire"

POL_bop_emergency_mobilisation:0 "Mobilisation d’urgence"
POL_bop_emergency_mobilisation_desc:0 "Lever un autre bataillon « Obrona Narodowa » favorisera sûrement un mode de vie martial et élargira légèrement notre armée."

POL_bop_dockyard_buildup:0 "Développement des chantiers navals"
POL_bop_dockyard_buildup_desc:0 "Construisons quelques chantiers navals !"

POL_bop_increase_small_arms_production:0 "Augmenter la production d’armes légères"
POL_bop_increase_small_arms_production_desc:0 "Armez le peuple ! Militarisons la société !"

POL_bop_improve_infrastructure:0 "Améliorer les infrastructures"
POL_bop_improve_infrastructure_desc:0 "En améliorant les infrastructures de certains États, nous pouvons faciliter grandement les communications."

POL_bop_isolationist_propaganda:0 "Propagande isolationniste"
POL_bop_isolationist_propaganda_desc:0 "La Sanacja de gauche souhaite éviter la formation d’alliances qui pourraient être vues comme menaçantes par des voisins dangereux. Diffuser cette vision renforcera leur influence."

