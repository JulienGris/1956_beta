nationalism_on_the_rise:0 "Montée du Nationalisme"
nationalism_on_the_rise_desc:0 "Des éléments politiques bruyants ont commencé à s’exprimer en faveur des valeurs nationalistes, trouvant un soutien auprès d’un nombre croissant de la population. La voie de la démocratie nationale est ouverte à la nation, attendant simplement le choix d’une transition pacifique ou violente."
prepare_for_nationalist_civil_war:0 "Préparer la Guerre Civile"
prepare_for_nationalist_civil_war_desc:0 "Nous n’avons pas le temps d’attendre les changements lents dans l’esprit du peuple. Pour leur propre bien, nous devons forcer la question rapidement, même si certains peuvent perdre la vie dans le processus. Contrairement à un référendum pacifique, une guerre civile causera de terribles destructions à nos forces armées et à l’industrie et aux infrastructures du pays, mais elle est aussi plus rapide, et garantit que nous pourrons imposer notre volonté avec plus de force ensuite."
expand_civil_nationalist_support:0 "Élargir le Soutien Civil"
expand_civil_nationalist_support_desc:0 "Nous devons garantir la propagation continue du soutien à notre cause parmi le peuple et l’encourager à contester publiquement l’autorité du gouvernement actuel. À mesure que la position du gouvernement sera de plus en plus sapée et que l’agitation civile augmentera, il deviendra plus facile pour nous d’atteindre nos objectifs. Cela est particulièrement vrai si, contrairement à un changement légal de gouvernement, ces objectifs impliquent un moyen de changement de régime plus… sinistre."
army_support_for_nationalist_civil_war:0 "Élargir le Soutien Militaire"
army_support_for_nationalist_civil_war_desc:0 "Sans un soutien militaire suffisant, tout espoir de victoire dans une lutte idéologique serait vain. Nous devons garantir la loyauté des unités bien placées de nos forces armées."
ensure_general_loyalty_for_nationalist_civil_war:0 "Assurer la Loyauté du Commandement Inférieur"
ensure_general_loyalty_for_nationalist_civil_war_desc:0 "Il est possible que certains généraux nourrissent secrètement des sentiments favorables à la démocratie nationale. Nous devons les approcher et nous assurer de leur loyauté lorsque les combats commenceront."
ensure_marshal_loyalty_for_nationalist_civil_war:0 "Assurer la Loyauté du Haut Commandement"
ensure_marshal_loyalty_for_nationalist_civil_war_desc:0 "Il est possible que certains maréchaux partagent secrètement des sentiments favorables à la démocratie nationale. Nous devons les approcher et nous assurer de leur loyauté lorsque les combats commenceront."
siphon_equipment_stockpiles_for_nationalist_civil_war:0 "Détourner des Stocks d’Équipement"
siphon_equipment_stockpiles_for_nationalist_civil_war_desc:0 "En prélevant discrètement dans les stocks nationaux d’équipement, nous pouvons constituer une petite réserve d’armes pour nous aider dans notre futur combat."
formulate_surprise_attack_plan_for_nationalist_civil_war:0 "Élaborer un Plan d’Attaque Surprise"
formulate_surprise_attack_plan_for_nationalist_civil_war_desc:0 "L’ennemi n’a aucune idée de la catastrophe imminente. Nous devons veiller à ce qu’il en reste ainsi, tout en dirigeant nos plans de bataille pour exploiter au maximum l’effet de surprise."
ignite_the_nationalist_civil_war:0 "Déclencher la Guerre Civile"
ignite_the_nationalist_civil_war_desc:0 "Le moment est venu de franchir le pas. Toutes les préparations jugées nécessaires ont été faites. Il n’y a plus de retour possible."
rebuild_the_nation_nationalist:0 "Reconstruire la Nation"
rebuild_the_nation_nationalist_desc:0 "Après la guerre civile, le moment est venu de reconstruire notre nation ruinée."
open_up_political_discourse_nationalist:0 "Ouvrir le Discours Politique"
open_up_political_discourse_nationalist_desc:0 "Nous devons ouvrir l’acceptation de points de vue divergents au sein du gouvernement. Peut-être que cela permettra éventuellement un changement pacifique dans la politique de notre nation."
discredit_government_nationalist:0 "Discréditer le Gouvernement"
discredit_government_nationalist_desc:0 "En soulignant les nombreuses failles de notre gouvernement actuel, nous pouvons amener les gens à réfléchir aux causes idéologiques de ces échecs."
hold_the_nationalist_national_referendum:0 "Organiser un Référendum National"
hold_the_nationalist_national_referendum_desc:0 "Avec un soutien suffisant, nous pouvons désormais organiser un référendum en toute sécurité pour changer de gouvernement, sans effusion de sang."
military_support_for_nationalist_civil_war:0 "Dispose du soutien militaire pour la guerre civile.\n"
