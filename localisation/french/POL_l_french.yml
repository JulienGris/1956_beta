socialism_on_the_rise77_desc:0 "Des éléments politiques vocaux ont commencé à défendre les valeurs socialistes, trouvant un soutien auprès d’un nombre croissant de la population. La voie vers le socialisme est ouverte à la nation, n’attendant que le choix d’une transition pacifique ou violente."
prepare_for_socialist_civil_war77:0 "§RFront uni avec le KPP§! : Préparer la guerre civile"
prepare_for_socialist_civil_war77_desc:0 "Nous n’avons pas le temps d’attendre les changements lents dans les esprits. Pour leur propre bien, nous devons forcer la question rapidement, même si certains peuvent perdre la vie. Contrairement à un référendum pacifique, une guerre civile causera de lourdes destructions à nos forces armées ainsi qu’à l’industrie et aux infrastructures du pays, mais elle est aussi plus rapide, et nous permettra d’imposer notre volonté avec plus de force par la suite."
expand_civil_socialist_support77:0 "Élargir le soutien civil"
expand_civil_socialist_support77_desc:0 "Nous devons garantir la diffusion continue du soutien à notre cause parmi le peuple et l’encourager à contester publiquement l’autorité du gouvernement actuel. À mesure que la position du gouvernement sera affaiblie et que l’agitation augmentera, il deviendra plus facile d’atteindre nos objectifs. Cela est particulièrement vrai si, contrairement à un changement légal, ces objectifs impliquent un moyen de changement de régime plus… sinistre."
expand_civil_socialist_support277:0 "Élargir le soutien civil"
expand_civil_socialist_support277_desc:0 "Nous devons garantir la diffusion continue du soutien à notre cause parmi le peuple et l’encourager à contester publiquement l’autorité du gouvernement actuel. À mesure que la position du gouvernement sera affaiblie et que l’agitation augmentera, il deviendra plus facile d’atteindre nos objectifs. Cela est particulièrement vrai si, contrairement à un changement légal, ces objectifs impliquent un moyen de changement de régime plus… sinistre."
army_support_for_socialist_civil_war77:0 "Élargir le soutien militaire"
army_support_for_socialist_civil_war77_desc:0 "Sans un soutien militaire suffisant, tout espoir de victoire dans une lutte idéologique serait vain. Nous devons garantir la loyauté des unités bien placées de nos forces."
ensure_general_loyalty_for_socialist_civil_war77:0 "Assurer la loyauté du commandement inférieur"
ensure_general_loyalty_for_socialist_civil_war77_desc:0 "Il est possible que certains généraux nourrissent secrètement des sentiments favorables au socialisme. Nous devons les approcher et nous assurer de leur loyauté lorsque les combats commenceront."
ensure_marshal_loyalty_for_socialist_civil_war77:0 "Assurer la loyauté du haut commandement"
ensure_marshal_loyalty_for_socialist_civil_war77_desc:0 "Il est possible que certains maréchaux nourrissent secrètement des sentiments favorables au socialisme. Nous devons les approcher et nous assurer de leur loyauté lorsque les combats commenceront."
siphon_equipment_stockpiles_for_socialist_civil_war77:0 "Détourner des stocks d’équipement"
siphon_equipment_stockpiles_for_socialist_civil_war77_desc:0 "En prélevant dans les réserves d’équipement de la nation, nous pouvons constituer une petite cache d’armes pour nous aider dans notre futur combat."
formulate_surprise_attack_plan_for_socialist_civil_war77:0 "Élaborer un plan d’attaque surprise"
formulate_surprise_attack_plan_for_socialist_civil_war77_desc:0 "L’ennemi n’a aucune idée de la catastrophe imminente. Nous devons nous assurer qu’il en reste ainsi, tout en dirigeant nos plans de bataille afin d’exploiter au maximum l’effet de surprise."
ignite_the_socialist_civil_war77:0 "Déclencher la guerre civile"
ignite_the_socialist_civil_war77_desc:0 "Le moment est venu de franchir le pas. Toutes les préparations jugées nécessaires ont été faites. Il n’y a plus de retour possible."
rebuild_the_nation_socialism77:0 "Reconstruire la nation"
rebuild_the_nation_socialism77_desc:0 "Après la guerre civile, le moment est venu de reconstruire notre nation ruinée."
open_up_political_discourse_socialist77:0 "§CCentrolew§! : Ouvrir le discours politique"
open_up_political_discourse_socialist77_desc:0 "Nous devons accepter l’expression de points de vue divergents au sein du gouvernement. Cela rendra peut-être possible un changement pacifique de la politique de notre nation."
discredit_government_socialism77:0 "Discréditer le gouvernement"
discredit_government_socialism77_desc:0 "En soulignant les nombreuses failles de notre gouvernement actuel, nous pouvons amener le peuple à réfléchir aux causes idéologiques de ces échecs."
hold_the_socialist_national_referendum77:0 "Organiser un référendum national"
hold_the_socialist_national_referendum77_desc:0 "Avec un soutien suffisant, nous pouvons désormais organiser un référendum pour changer de gouvernement, sans effusion de sang."
military_support_for_socialist_civil_war77:0 "Dispose du soutien militaire pour la guerre civile.\n"
#POLISH EVENTS - tous ensemble

Danzig_poland_border_conflict.1.t:0 "Escarmouches militaires autour de [DNZ.GetNameDef]"
Danzig_poland_border_conflict.1.desc:0 "En défiance de la Société des Nations, [POL.GetNameDef] se prépare à déplacer des troupes pour occuper [DNZ.GetNameDef]. La milice et la police de l’État de Dantzig ont reçu l’ordre de résister symboliquement. Le sentiment public en Allemagne en faveur d’une intervention est élevé et déjà des forces paramilitaires et des volontaires sont envoyés en renfort."
Danzig_poland_border_conflict.1.a:0 "Inacceptable."

Danzig_poland_border_conflict.2.t:0 "La Pologne occupe [DNZ.GetNameDef]"
Danzig_poland_border_conflict.2.desc:0 "À la suite d’un affrontement entre l’armée polonaise, les forces de la milice de Dantzig et les volontaires allemands, les forces polonaises ont écrasé l’opposition. Les chantiers navals de Dantzig ont été saisis, et l’administration civile remplacée par un tribunal militaire. La Société des Nations a ouvertement condamné l’action mais refuse de prendre des mesures supplémentaires."
Danzig_poland_border_conflict.2.a:0 "Nous avons gagné notre accès légitime à la mer."
Danzig_poland_border_conflict.2.b:0 "En temps voulu, nous vengerons ces griefs."

Danzig_poland_border_conflict.3.t:0 "Retraite polonaise de [DNZ.GetNameDef]"
Danzig_poland_border_conflict.3.desc:0 "À la suite d’un affrontement entre l’armée polonaise, les forces de la milice de Dantzig et les volontaires allemands, les forces polonaises ont reçu l’ordre de se retirer face à une résistance plus forte que prévue dans la ville, soutenue par l’Allemagne. \n\nAvec leur nouvelle autonomie, la Société des Nations a accepté d’organiser un plébiscite pour déterminer le sort de la ville internationale."
Danzig_poland_border_conflict.3.a:0 "Cet embarras national aura des conséquences intérieures."
Danzig_poland_border_conflict.3.b:0 "Dantzig est allemande."

Danzig_poland_border_conflict.4.t:0 "Impasse autour de [DNZ.GetNameDef]"
Danzig_poland_border_conflict.4.desc:0 "Des escarmouches éparses autour de [DNZ.GetNameDef] ont cessé après que les deux camps se soient retirés pour consolider leurs positions. Reconnaissant la futilité de poursuivre le combat, les deux parties ont accepté un compromis diplomatique et de maintenir le statu quo."
Danzig_poland_border_conflict.4.a:0 "Maintenir le statu quo est préférable pour l’instant."

Danzig_poland_border_conflict.5.t:0 "Escalade autour de [DNZ.GetNameDef]"
Danzig_poland_border_conflict.5.desc:0 "Les combats continuent entre les forces paramilitaires polonaises et allemandes autour de Dantzig. Pour briser l’impasse, les forces polonaises dans d’autres zones ont également commencé à engager les troupes allemandes dans la région plus vaste de Poméranie. Les renseignements des deux côtés indiquent un afflux croissant de troupes dans la région."
Danzig_poland_border_conflict.5.a:0 "Nous devons tenir la ligne."

Danzig_poland_border_conflict.6.t:0 "Conflit militaire autour de [DNZ.GetNameDef]"
Danzig_poland_border_conflict.6.desc:0 "Des rapports urgents annoncent que des unités entières de l’armée allemande franchissent la frontière polono-allemande en plusieurs endroits. Il semblerait que l’Allemagne s’apprête à transformer la situation en un conflit majeur. La mobilisation générale a été déclenchée."
Danzig_poland_border_conflict.6.a:0 "Nous devons tenir la ligne."

Gdansk_poland_border_conflict.2.t:0 "La Pologne occupe [DNZ.GetNameDef]"
Gdansk_poland_border_conflict.2.desc:0 "À la suite d’un affrontement entre l’armée polonaise et les forces de la milice de Dantzig, les forces polonaises ont écrasé l’opposition. Les chantiers navals de Dantzig ont été saisis, et l’administration civile remplacée par un tribunal militaire. La Société des Nations a ouvertement condamné l’action mais refuse de prendre des mesures supplémentaires."
Gdansk_poland_border_conflict.2.a:0 "Nous avons gagné notre accès légitime à la mer."
Gdansk_poland_border_conflict.2.b:0 "Notre lutte a envoyé un message."

Gdansk_poland_border_conflict.3.t:0 "Retraite polonaise de [DNZ.GetNameDef]"
Gdansk_poland_border_conflict.3.desc:0 "À la suite d’un affrontement entre l’armée polonaise et les forces de la milice de Dantzig, les forces polonaises ont reçu l’ordre de se retirer face à une résistance plus forte que prévue dans la ville, soutenue par l’Allemagne. \n\nAvec leur nouvelle autonomie, la Société des Nations a accepté d’organiser un plébiscite pour déterminer le sort de la ville internationale."
Gdansk_poland_border_conflict.3.a:0 "Cet embarras national aura des conséquences intérieures."
Gdansk_poland_border_conflict.3.b:0 "Nous sommes libres."

Gdansk_poland_border_conflict.4.t:0 "Impasse autour de [DNZ.GetNameDef]"
Gdansk_poland_border_conflict.4.desc:0 "Des escarmouches éparses autour de [DNZ.GetNameDef] ont cessé après que les deux camps se soient retirés pour consolider leurs positions. Reconnaissant la futilité de poursuivre le combat, les deux parties ont accepté un compromis diplomatique et de maintenir le statu quo."
Gdansk_poland_border_conflict.4.a:0 "Maintenir le statu quo est préférable pour l’instant."

poland_border_conflict.1.t:0 "Intervention polonaise dans la guerre civile allemande"
poland_border_conflict.1.desc:0 "Dans une déclaration publique, [POL.GetLeader] a proclamé que l’armée polonaise interviendrait pour protéger les enclaves de Polonais ethniques en Silésie contre la violence. Déjà, des émeutes ont éclaté dans plusieurs régions frontalières — sans doute orchestrées par le gouvernement polonais comme prétexte pour intervenir. \n\nNous avons déposé une protestation diplomatique officielle, mais l’ambassadeur polonais maintient que la réponse est justifiée."
poland_border_conflict.1.a:0 "Inacceptable."

poland_border_conflict.2.t:0 "Victoire polonaise en Silésie"
poland_border_conflict.2.desc:0 "À la suite d’un affrontement entre les forces allemandes et polonaises en Silésie, les troupes polonaises ont réussi à surmonter une faible résistance et à occuper la région. La presse polonaise exulte, établissant des parallèles avec les victoires de l’armée bleue de Józef Haller qui avait conquis la Poméranie sur la République de Weimar en 1920. [POL.GetLeader] a promis de continuer à agir pour assurer la sécurité des Polonais ethniques dans les territoires allemands."
poland_border_conflict.2.a:0 "Une opération de ‘maintien de la paix’ réussie."
poland_border_conflict.2.b:0 "Nous devons nous préparer à d’autres incursions possibles."

poland_border_conflict.3.t:0 "Défaite polonaise en Silésie"
poland_border_conflict.3.desc:0 "À la suite d’un affrontement entre les forces allemandes et polonaises en Silésie, les routes de la région étaient jonchées d’équipements polonais endommagés et abandonnés. \n\nPlusieurs assauts polonais contre des positions défensives allemandes hâtivement érigées ont échoué avec de lourdes pertes durant la bataille. Peu doutent que ce fiasco refroidira sûrement l’enthousiasme pour de nouvelles tentatives d’intervention."
poland_border_conflict.3.a:0 "Un énorme coup porté à notre prestige."
poland_border_conflict.3.b:0 "Notre revanche viendra en temps voulu."

poland_border_conflict.4.t:0 "Impasse en Silésie"
poland_border_conflict.4.desc:0 "Les combats sporadiques entre les forces polonaises et allemandes se sont enlisés dans une impasse. Ne voulant pas aller plus loin, un cessez-le-feu a été négocié en vue d’un retrait."
poland_border_conflict.4.a:0 "Nous avons acquis une expérience précieuse."

poland_border_conflict.5.t:0 "Déclaration formelle de guerre"
poland_border_conflict.5.desc:0 "Qualifiant les incursions des forces polonaises en territoire allemand d’acte de guerre, [FROM.GetNameDef] a déclaré la guerre à [POL.GetNameDef]. Il semblerait que [FROM.GetNameDef] soit convaincu qu’une guerre sur deux fronts peut être gagnée."
poland_border_conflict.5.a:0 "Nous devons tenir la ligne."

prussia_poland_border_conflict.1.t:0 "Intervention polonaise dans la guerre civile allemande"
prussia_poland_border_conflict.1.desc:0 "Dans une déclaration publique, [POL.GetLeader] a proclamé que l’armée polonaise interviendrait pour protéger les enclaves de Polonais ethniques en Prusse orientale contre la violence. Déjà, des émeutes ont éclaté dans plusieurs régions frontalières — sans doute orchestrées par le gouvernement polonais comme prétexte pour intervenir. \n\nNous avons déposé une protestation diplomatique officielle, mais l’ambassadeur polonais maintient que la réponse est justifiée."
