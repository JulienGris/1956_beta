poland.213.t:0 "Agitation parmi les membres de la Sanacja de gauche"
poland.213.d:0 "Nos récentes actions politiques visant à prendre la direction du gouvernement Sanacja ont provoqué des troubles politiques chez nos adversaires, la Sanacja de gauche."
poland.213.a:0 "Inquiétant."

poland.214.t:0 "Agitation parmi les membres de la Sanacja de droite"
poland.214.d:0 "Nos récentes actions politiques visant à prendre la direction du gouvernement Sanacja ont provoqué des troubles politiques chez nos adversaires, la Sanacja de droite."
poland.214.a:0 "Inquiétant."
