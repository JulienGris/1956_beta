POL_Maritime_Defense_Fund_Tooltip:0 "\nObtenez une §HBrigade Nationale de Défense Maritime§! surdimensionnée.\n\n"
POL_charismatic_leader:0 "Leader Charismatique"
POL_Wieniawa_infamous_womanizer:0 "Célèbre Coureur de Jupons"

POL_Baltic_Naval_Vanguard:0 "Avant-Garde Navale Baltique"
POL_Baltic_Naval_Vanguard_desc:0 "La position avancée de la Pologne le long de la côte baltique est une excellente base navale de départ pour les forces du Komintern. Nous devrions investir dans un grand renforcement de nos atouts offensifs d’outre-mer."
POL_Expand_the_Lucznik_State_Arms_Factory:0 "Étendre l’Usine d’Armes d’État Łucznik"
POL_Expand_the_Lucznik_State_Arms_Factory_desc:0 "De plus grands arsenaux sont nécessaires pour notre économie croissante d’exportation militaire et pour les besoins de notre propre armée intérieure."
POL_Electrification_of_the_Countryside:0 "Électrification des Campagnes"
POL_Electrification_of_the_Countryside_desc:0 "Amener une alimentation électrique fiable dans les villes et villages les plus reculés garantira le développement d’industries modernes tout en renforçant le soutien populaire à notre gouvernement dans les zones rurales."
POL_Invest_In_The_Warsaw_Industrial_District:0 "Investir dans le District Industriel de Varsovie"
POL_Invest_In_The_Warsaw_Industrial_District_desc:0 "Des investissements publics dans la deuxième plus grande région industrielle de notre économie renforceront encore l’économie nationale."
POL_Invest_In_The_Old_Polish_Industrial_Region:0 "Investir dans l’Ancienne Région Industrielle Polonaise"
POL_Invest_In_The_Old_Polish_Industrial_Region_desc:0 "Des projets d’investissement dans nos régions occidentales peuvent aider à relier notre économie au reste du monde."
POL_Gdynia_Universal_Seaport:0 "Port Universel de Gdynia"
POL_Gdynia_Universal_Seaport_desc:0 "Le port de Gdynia est notre fenêtre sur le monde. La modernisation continue des infrastructures de la ville et l’expansion du port pour accueillir n’importe quelle taille de navire permettront de répondre aux besoins commerciaux mondiaux de la nation."
POL_Maritime_Defense_Fund:0 "Fonds de Défense Maritime (FOM)"
POL_Maritime_Defense_Fund_desc:0 "En cas d’embargo ou de guerre, la mer est notre ligne de vie commerciale avec l’extérieur. Compte tenu de nos problèmes budgétaires, nous devrons solliciter des dons privés auprès des citoyens afin de financer une marine moderne."
POL_Zaklady_Azotowe:0 "Zakłady Azotowe"
POL_Chemical_Conglomerate:0 "Conglomérat Chimique"
POL_Promote_The_Chemical_Industry:0 "Promouvoir l’Industrie Chimique à Mościce"
POL_Promote_The_Chemical_Industry_desc:0 "Sans colonies d’outre-mer, la sécurité économique de la Pologne est précaire. Le développement continu de l’industrie domestique des produits chimiques et du caoutchouc synthétique est une priorité absolue."
POL_The_Four_Year_Plan2:0 "Le Plan Quatre Ans"
POL_armoured_trains2:0 "Trains Blindés"
POL_armoured_trains2_tooltip_upgrade:0 "\nRéduit le coût de la capacité de commandement §HTrains Blindés§! de §G-25%§!.\n\n"
Seaborne_High_Frequency_Directional_Radar:0 "Radar Directionnel Haute Fréquence Embarqué"
High_Frequency_Radar_Tooltip:0 "qui accorde\n   Détection de sous-marins par destroyer : §G+10%§!\n   Efficacité d’escorte : §G+10%§!\n\n"
POL_Wartime_Industry_Effort:0 "Effort d’Industrie de Guerre"
POL_SeKOR:0 "Secrétariat du Comité de Défense"
POL_KOR_Committee_For_Defense:0 "Comité de Défense de la République (KOR)"
POL_KOR_Committee_For_Defense_desc:0 "Les affaires industrielles et militaires sont étroitement liées. Un organe exécutif unique et unifié doit être créé pour superviser ces deux domaines."
POL_Strict_Equipment_Standards:0 "Normes Strictes pour l’Équipement"
POL_Communist_Influence:0 "Influence Communiste"
PPS_Revolutionary_Path:0 "A choisi la voie : §HPPS et KPP§!"
PPS_Democratic_Path:0 "A choisi la voie : §HDiscours Politique Ouvert§!"
POL_Air_Force_Training_Center_No_1:0 "Centre de Formation Aérienne n°1 « Aiglons »"
POL_Air_Force_Training_Center_No_1_desc:0 "En agrandissant le collège de formation des pilotes à Dęblin pour accueillir l’expansion prévue de notre force aérienne, des normes d’enseignement supérieur uniformes pour les pilotes militaires et les officiers aériens pourront être établies."
POL_The_Polish_Socialist_Party:0 "Le Parti Socialiste Polonais"
POL_The_Polish_Socialist_Party_desc:0 "Le Parti Socialiste Polonais est l’ancien parti de Józef Piłsudski et de nombreux membres éminents du gouvernement Sanacja avant leur changement d’affiliation politique. Maintenant marginalisés, ils cherchent à établir un État socialiste avec des réformes progressistes du travail et sociales."
POL_labor_advocate:0 "Défenseur des Travailleurs"
POL_mechanization_of_agriculture:0 "Mécanisation de l’Agriculture"
POL_mechanization_of_agriculture_desc:0 "Afin de rendre à nouveau compétitives les exportations agricoles de la Pologne, un effort financé par l’État pour moderniser l’agriculture en fournissant des tracteurs et autres machines lourdes est prévu."
POLREV_communism:0 "Pologne Révolutionnaire"
poland.198.t:0 "Formation du PPS-WRN"
poland.198.d:0 "En réponse à l’occupation étrangère du sol polonais, plusieurs membres éminents du Parti Socialiste Polonais se sont réunis pour déclarer la résolution de la « Troisième République ». Menée par le secrétaire général Kazimierz Pużak, la création de plusieurs institutions est prévue pour organiser un État clandestin polonais parmi les partisans de gauche. Parmi celles-ci figurent la création d’une Garde Populaire, d’une Milice Ouvrière et d’un organe central de gestion du trafic. Malgré le soutien de figures clés comme Tomasz Arciszewski et Zygmunt Zaremba, des désaccords sur la direction du mouvement ont entraîné une scission du parti, le président Zygmunt Żulawski dénonçant le PPS-WRN comme illégitime."
poland.198.a:0 "Liberté, Égalité, Indépendance (WRN)"
POL_Folk_High_Schools:0 "Écoles Supérieures Populaires"
POL_Folk_High_Schools_desc:0 "Une tradition répandue d’éducation privée assure la prospérité des classes supérieures et sauvegarde la culture polonaise en cas d’occupation étrangère."
POL_Kazimierz_Sosnkowski:0 "Kazimierz Sosnkowski"
POL_Edward_Rydz_Smigly:0 "Edward Rydz-Śmigły"
POL_chief_staffer2:0 "Chef d’État-Major"
POL_chief_staffer3:0 "Chef d’État-Major"
POL_chief_staffer4:0 "Chef d’État-Major"
POL_Universalism:0 "Universalisme"
POL_Universalism_desc:0 "Un front uni de nations partageant les mêmes idées en Europe est nécessaire pour contrer les ambitions croissantes de l’Allemagne et de l’Union soviétique."
POL_Invite_Nationalist_Spain:0 "Inviter l’Espagne Nationaliste"
POL_Invite_Nationalist_Spain_desc:0 "L’Espagne nationaliste est notre sœur idéologique, qui – comme nous – méprise l’Union soviétique."
