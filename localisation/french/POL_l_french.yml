ABILITY_ARMOURED_TRAINS:0 "Trains blindés"
ABILITY_ARMOURED_TRAINS_TOOLTIP:0 "Trains blindés ($LEADER$)"
ABILITY_ARMOURED_TRAINS_DESC:0 "Vos armées recevront un important bonus de vitesse de renfort et un léger bonus défensif."

# Modificateurs uniques – infobulles
POL_River_Flotillas:0 "Flottilles fluviales"
POL_River_Flotillas_desc:0 "Un vaste réseau de canonnières et de barges blindées fluviales peut aider à sécuriser nos voies navigables internes contre les traversées ennemies."
POL_River_Flotillas_tt:0 "   §HArtillerie§! tractée & motorisée, §HAnti-aérien§!, §HAntichar§!, §HRocket Artillery§! :\n     §HFleuves§! & §HMarais§! : Attaque : §G+5%§!\n     §HFleuves§! & §HMarais§! : Défense : §G+5%§!\n     §HFleuves§! & §HMarais§! : Mouvement : §G+10%§!\n\n"

