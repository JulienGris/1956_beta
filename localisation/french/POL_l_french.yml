# Traits
public_security:0 "Sécurité publique"
POL_night_assault_tactics:0 "Tactiques d’assaut nocturne"

# Infobulles
POL_add_level_one_fort_on_ukrainian_border_tt:0 "Ajoute un §Hfort niveau 1§! à la frontière ukrainienne à Lwow et Wolyn :"
POL_add_level_one_fort_on_belarussian_border_tt:0 "Ajoute un §Hfort niveau 1§! à la frontière biélorusse à Polésie, Nowogródek et Wijeka :"
POL_add_level_one_fort_in_silesia_tt:0 "Ajoute un §Hfort niveau 1§! aux frontières de Katowice, Cracovie et Zaolzie si nous ou notre sujet possédons l’État :"
POL_add_forts_on_border_with_prussia_tt:0 "Ajoute des §Hforts niveau 1§!, §H2§! et §H3§! dans diverses régions frontalières avec la Prusse orientale :"
POL_add_level_two_forts_on_western_border_with_germany_tt:0 "Ajoute des §Hforts niveau 2§! dans les régions frontalières avec l’Allemagne de l’Est :"

# Arbres de priorités nationales
POL_invite_ukraine:0 "Inviter l’Ukraine"
POL_invite_ukraine_desc:0 "Les Ukrainiens sont un tampon essentiel contre les ambitions [SOV.GetAdjective]."

POL_radicalize_the_front:0 "Radicaliser le Front"
POL_radicalize_the_front_desc:0 "Il est temps de devenir radicaux. La Pologne est au bord du gouffre. Des mesures radicales doivent être prises dans notre politique !"

POL_accept_border_realignment:0 "Accepter le réalignement des frontières"
POL_accept_border_realignment_desc:0 "Nous devons accepter la réalité : une Pologne d’après-guerre aura un visage très différent et n’inclura pas nos anciennes terres de l’Est."

POL_Border_War_For_Silesia:0 "Conflit frontalier pour la Silésie"
POL_Border_War_For_Silesia_desc:0 "La Silésie abrite de nombreuses communautés ethniquement polonaises d’une grande importance culturelle pour notre nation. Nous devrions profiter de la crise de notre voisin comme prétexte pour intervenir et protéger les Polonais contre la violence."

POL_border_conflict_warning_GER:0 "Incursions polonaises à la frontière silésienne"
POL_border_conflict_warning_GER_desc:0 "Les gardes le long de la frontière polonaise rapportent des mouvements de troupes tentant de pénétrer sur notre territoire, accompagnés d’émeutes dans les enclaves polonaises de Silésie. Nous devons immédiatement nous préparer à une action militaire."

POL_border_conflict_escalation_warning_GER:0 "Renforcement de l’armée polonaise près de la Silésie"
POL_border_conflict_escalation_warning_GER_desc:0 "Nos espions confirment des mouvements massifs de troupes du côté polonais de la frontière silésienne. Nous ignorons si et quand les Polonais frapperont, mais nous devons être prêts."

POL_border_incident_forgotten:0 "Silésie : fenêtre d’opportunité"
POL_border_incident_forgotten_desc:0 "Si nous voulons exploiter l’incident à la frontière allemande en Silésie, nous devons agir rapidement."

POL_escalate_incident_to_border_conflict_GER:0 "Aggraver l’incident en Silésie"
POL_escalate_incident_to_border_conflict_GER_desc:0 "Il semble que les Allemands ne reculent pas. À ce stade, nous devons soit escalader vers un affrontement armé, soit reculer nous-mêmes."

POL_border_conflict_time_until_cancelled:0 "Fin du conflit en Silésie"
POL_border_conflict_time_until_cancelled_desc:0 "Au rythme actuel, nous ne pourrons maintenir les opérations de combat que pour un temps limité avant de devoir nous retirer."

POL_border_conflict_escalate_conflict:0 "Aggraver le conflit en Silésie"
POL_border_conflict_escalate_conflict_desc:0 "Le conflit à la frontière silésienne s’est enlisé. En intensifiant encore et en engageant plus de troupes, nous pourrions encore obtenir une victoire."

POL_border_conflict_escalate_to_war:0 "Déclarer la guerre pour la Silésie"
POL_border_conflict_escalate_to_war_desc:0 "Les combats en Silésie durent depuis un certain temps et ne montrent aucun signe de fin. Nous devons être prêts à franchir l’étape suivante et à considérer ce conflit comme le prélude à une guerre générale."

POL_border_conflict_back_out_of_conflict:0 "Se retirer"
POL_border_conflict_back_out_of_conflict_desc:0 "Le risque de voir ce conflit dégénérer en une guerre totale est tout simplement trop grand. Nous devrions limiter nos pertes dès maintenant et envoyer des signaux diplomatiques à l’autre camp."

Prussia_POL_Border_War_For_prussia:0 "Conflit frontalier pour la Prusse orientale"
Prussia_POL_Border_War_For_prussia_desc:0 "La Prusse orientale abrite de nombreuses communautés polonaises d’une grande importance culturelle pour notre nation. Nous devrions profiter de la crise de notre voisin comme prétexte pour intervenir et protéger les Polonais contre la violence."

Prussia_POL_border_conflict_warning_GER:0 "Incursions polonaises à la frontière prussienne"
Prussia_POL_border_conflict_warning_GER_desc:0 "Les gardes le long de la frontière polonaise rapportent des mouvements de troupes tentant de pénétrer sur notre territoire, accompagnés d’émeutes dans les enclaves polonaises de Prusse orientale. Nous devons immédiatement nous préparer à une action militaire."

Prussia_POL_border_conflict_escalation_warning_GER:0 "Renforcement de l’armée polonaise près de la Prusse orientale"
Prussia_POL_border_conflict_escalation_warning_GER_desc:0 "Nos espions confirment des mouvements massifs de troupes du côté polonais de la frontière en Prusse orientale. Nous ignorons si et quand les Polonais frapperont, mais nous devons être prêts."

Prussia_POL_border_incident_forgotten:0 "Prusse orientale : fenêtre d’opportunité"
Prussia_POL_border_incident_forgotten_desc:0 "Si nous voulons exploiter l’incident à la frontière allemande en Prusse orientale, nous devons agir rapidement."

Prussia_POL_escalate_incident_to_border_conflict_GER:0 "Aggraver l’incident en Prusse orientale"
Prussia_POL_escalate_incident_to_border_conflict_GER_desc:0 "Il semble que les Allemands ne reculent pas. À ce stade, nous devons soit escalader vers un affrontement armé, soit reculer nous-mêmes."

Prussia_POL_border_conflict_time_until_cancelled:0 "Fin du conflit en Prusse orientale"
Prussia_POL_border_conflict_time_until_cancelled_desc:0 "Au rythme actuel, nous ne pourrons maintenir les opérations de combat que pour un temps limité avant de devoir nous retirer."

Prussia_POL_border_conflict_escalate_conflict:0 "Aggraver le conflit en Prusse orientale"
Prussia_POL_border_conflict_escalate_conflict_desc:0 "Le conflit à la frontière de Prusse orientale s’est enlisé. En intensifiant encore et en engageant plus de troupes, nous pourrions encore obtenir une victoire."

Prussia_POL_border_conflict_escalate_to_war:0 "Déclarer la guerre pour la Prusse orientale"
Prussia_POL_border_conflict_escalate_to_war_desc:0 "Les combats en Prusse orientale durent depuis un certain temps et ne montrent aucun signe de fin. Nous devons être prêts à franchir l’étape suivante et à considérer ce conflit comme le prélude à une guerre générale."

Prussia_POL_border_conflict_back_out_of_conflict:0 "Se retirer"
Prussia_POL_border_conflict_back_out_of_conflict_desc:0 "Le risque de voir ce conflit dégénérer en une guerre totale est tout simplement trop grand. Nous devrions limiter nos pertes dès maintenant et envoyer des signaux diplomatiques à l’autre camp."

POL_Construct_Hydroelectric_Power_Plants:0 "Construire des centrales hydroélectriques"
POL_Construct_Hydroelectric_Power_Plants_desc:0 "La construction de barrages hydroélectriques à Rożnów et Myczkowce garantira la croissance de notre industrie."

POL_Fill_The_Railways_Gaps:0 "Combler les lacunes ferroviaires"
POL_Fill_The_Railways_Gaps_desc:0 "Une grande partie de notre réseau ferroviaire est morcelée et déconnectée. En ajoutant les tronçons manquants, nous gagnons les capacités de transport dont nous avons cruellement besoin."

POL_Stomil_Debica_Rubber_Plant:0 "Usine de caoutchouc Stomil Dębica"
POL_Stomil_Debica_Rubber_Plant_desc:0 "Dębica est un centre essentiel pour nos industries chimiques, du ciment et des engrais. Un investissement gouvernemental peut assurer la production militaire de matériaux synthétiques utiles."

POL_Huta_Stalowa_Wola_Steel_Mill:0 "Huta Stalowa Wola"
POL_Huta_Stalowa_Wola_Steel_Mill_desc:0 "La construction d’aciéries supplémentaires garantira le succès de notre économie et de notre armée."

POL_Expand_The_Armaments_Industry:0 "Développer l’industrie de l’armement"
POL_Expand_The_Armaments_Industry_desc:0 "Poser les bases de notre industrie d’armement centralisée."

POL_Complete_the_Central_Industrial_Region:0 "§LCompléter la région industrielle centrale§!"
POL_Complete_the_Central_Industrial_Region_desc:0 "Moderniser les anciennes usines de Kielce, Skarzysko, Radom, Starachowice et Ostrowiec, tout en en construisant de nouvelles pour renforcer notre industrie."

POL_The_Four_Year_Plan:0 "Le plan quadriennal"
POL_The_Four_Year_Plan_desc:0 "Nous devons planifier l’expansion de nos infrastructures pour accueillir non seulement notre industrie actuelle, mais aussi notre croissance future."

POL_Expansion_Of_New_Towns:0 "Expansion des nouvelles villes"
POL_Expansion_Of_New_Towns_desc:0 "Il ne suffit pas que de nouvelles villes soient créées pour prospérer – elles doivent également être soutenues pour atteindre leur plein potentiel."

POL_Develop_Upper_Silesia:0 "Développer la Haute-Silésie"
POL_Develop_Upper_Silesia_desc:0 "La région autonome de Haute-Silésie est contestée depuis la Grande Guerre. Développer la région unira sa population et améliorera notre industrie."

POL_Eastern_Railway_Lines:0 "Lignes ferroviaires de l’Est"
POL_Eastern_Railway_Lines_desc:0 "Les confins orientaux sont depuis longtemps sous-développés par rapport au reste de la Pologne. Établir des liaisons ferroviaires dans ces zones permettra une croissance économique accrue."

POL_Start_The_Fifteen_Year_Plan:0 "Lancer le plan de quinze ans"
POL_Start_The_Fifteen_Year_Plan_desc:0 "Le moment est venu de poser les bases pour faire de toute la Pologne un pays développé. Un programme d’investissement de quinze ans nous guidera vers le statut de nation de premier plan."

POL_Pressure_Gdansk:0 "Faire pression sur Gdansk"
POL_Pressure_Gdansk_desc:0 "Trop longtemps, la Ville libre de Gdansk a entravé notre accès légitime à la mer. Nous devons veiller à ce que ses obligations soient respectées, par la force si nécessaire."

POL_Expand_Port_Facilities:0 "Agrandir les installations portuaires"
POL_Expand_Port_Facilities_desc:0 "De plus grandes et meilleures infrastructures sont nécessaires pour traiter davantage de marchandises dans notre port de commerce international."

POL_Internationalism:0 "Internationalisme"
POL_Internationalism_desc:0 "Accroître les échanges internationaux est la première étape pour renforcer notre prestige et nos relations à l’étranger."

POL_Seek_Accommodation_With_Germany:0 "Chercher un compromis avec l’Allemagne"
POL_Seek_Accommodation_With_Germany_desc:0 "La question de la Ville libre de Gdansk a longtemps empoisonné les relations entre la Pologne et l’Allemagne. Une coopération conjointe sur des projets locaux aidera à apaiser ces tensions."

POL_Polish_German_Trade_Agreement:0 "Accord commercial polono-allemand"
POL_Polish_German_Trade_Agreement_desc:0 "Les accords commerciaux existants avec l’Allemagne doivent être élargis afin de favoriser une coopération accrue entre nos deux pays."

POL_Develop_Polish_Ship_Building:0 "Développer la construction navale polonaise"
POL_Develop_Polish_Ship_Building_desc:0 "La situation enclavée de notre pays n’est pas une excuse pour négliger nos efforts navals."

POL_Study_Foreign_Built_Ships:0 "Étudier les navires étrangers"
POL_Study_Foreign_Built_Ships_desc:0 "De nouveaux types de navires sont continuellement développés par nos voisins. Nous devons les étudier, sinon nous serons condamnés à rester obsolètes."

POL_A_Cruiser_Navy:0 "Une marine de croiseurs"
POL_A_Cruiser_Navy_desc:0 "Des navires de plus en plus grands seront nécessaires pour concrétiser nos ambitions maritimes."

POL_Import_Submarine_Technology:0 "Importer la technologie des sous-marins"
POL_Import_Submarine_Technology_desc:0 "Un retard en matière de sous-marins est inacceptable. Nous aurons la technologie, même si nous devons l’acheter."

POL_Commerce_Attack:0 "Tactiques d’attaque commerciale"
POL_Commerce_Attack_desc:0 "Aucune marine n’est complète sans sous-marins. Les nôtres doivent être organisés pour une létalité optimale, tout comme le reste de la flotte."

POL_Naval_Officers_School:0 "La double menace"
POL_Naval_Officers_School_desc:0 "En nous concentrant sur les contre-tactiques nécessaires pour contrer nos ennemis les plus probables, nous garderons l’avantage dans les combats navals."

POL_Coastal_Defense:0 "Défense côtière"
POL_Coastal_Defense_desc:0 "Une force navale mobile à courte portée pourrait potentiellement remplacer des fortifications stationnaires plusieurs fois plus puissantes."

POL_Strike_Force:0 "Force de frappe"
POL_Strike_Force_desc:0 "En cas d’infériorité numérique, nous devons disposer d’une force de guerre rapidement déployable capable de frapper l’ennemi là où il est le plus faible."

POL_Baltic_Navy:0 "Marine baltique"
POL_Baltic_Navy_desc:0 "Un effort approfondi pour réinventer notre stratégie navale sera d'une grande importance si nous voulons utiliser nos navires dans la Baltique."
POL_rewrite_1935_constitution:0 "Réécrire la Constitution de 1935"
POL_rewrite_1935_constitution_desc:0 "La constitution moderne n’est pas adaptée à l’État polonais actuel. Elle doit donc être réécrite afin de correspondre à l’évolution du climat politique du pays."
POL_Crack_Soviet_Ciphers:0 "Casser les codes soviétiques"
POL_Crack_Soviet_Ciphers_desc:0 "Le décryptage du code soviétique a sauvé la Pologne lors de la guerre soviéto-polonaise. Une contre-intelligence radio améliorée et des moyens mobiles de radiogoniométrie nous permettront de le refaire."
POL_The_April_Constitution:0 "La Constitution d’avril"
POL_The_April_Constitution_desc:0 "Le gouvernement doit achever les réformes politiques prévues dans la Constitution d’avril 1935."
POL_The_Great_Peasant_Strike:0 "La grande grève paysanne"
POL_The_Great_Peasant_Strike_desc:0 "Depuis trop longtemps, le gouvernement de la Sanacja ignore les besoins de l’Est rural et de ses minorités. Une grande grève générale est prévue pour attirer l’attention du gouvernement."
POL_Peasant_Strike:0 "Grèves paysannes"
POL_Peasant_Strike_desc:0 "Le gouvernement a ignoré les besoins de l’Est rural et de ses minorités, qui sont désormais en grève générale."
POL_The_National_Radical_Camp:0 "Le Camp national-radical"
POL_The_National_Radical_Camp_desc:0 "Les phalangistes dirigés par Bolesław Piasecki cherchent à établir un État catholique autoritaire."
POL_The_Sanation_Right:0 "La droite de la Sanacja"
POL_The_Sanation_Right_desc:0 "Le Camp d’unité nationale, dirigé par Edward Rydz-Śmigły, cherche à bâtir une armée nationale forte et à préparer le pays à la guerre."
POL_The_Castle:0 "Le Château"
POL_The_Castle_desc:0 "L’actuel président Ignacy Mościcki est vu par beaucoup comme une figure centrale d’unité et l’héritier légitime de l’héritage de Józef Piłsudski. Opposé au militarisme, il souhaite se concentrer sur le développement économique de la Pologne."
POL_The_Sanation_Left:0 "La gauche de la Sanacja"
POL_The_Sanation_Left_desc:0 "L’Organisation commune de la société, dirigée par Walery Sławek, cherche à approfondir les réformes politiques pour unir toutes les factions disparates du gouvernement polonais."
POL_Centrolew:0 "Centrolew"
POL_Centrolew_desc:0 "Il est temps de mettre de côté les différends entre le Parti paysan polonais et le Parti socialiste polonais afin de réformer à nouveau la coalition centre-gauche."
POL_Defensive_Focus:0 "Orientation défensive"
POL_Defensive_Focus_desc:0 "Nous ne commencerons pas la prochaine guerre, mais nous nous assurerons de la terminer. Des mesures supplémentaires doivent être prises pour garantir que le cœur industriel de notre nation soit protégé par des barrières naturelles."
POL_Polish_Paramilitarism:0 "Paramilitarisme polonais"
POL_Polish_Paramilitarism_desc:0 "Les guerres passées ont pu nous plier, mais elles ne nous ont pas vaincus. Nous nous relèverons grâce au courage de nos soldats et à la ruse de nos officiers."
POL_Polish_Revanchism:0 "Revanchisme polonais"
POL_Polish_Revanchism_desc:0 "Peu de nations ont perdu autant en si peu de temps. S’il y a une justice, nous le récupérerons, d’une manière ou d’une autre."
POL_The_Cult_Of_The_Marshal:0 "Le culte du Maréchal"
POL_The_Cult_Of_The_Marshal_desc:0 "Le bien de la nation doit primer sur les soi-disant « vérités ». De même que nous forgeons notre destin, nous devons forger nos propres faits."
POL_Beyond_The_Proletariat:0 "Au-delà du prolétariat"
POL_Beyond_The_Proletariat_desc:0 "L’État repose sur deux principes : le service à la nation et la coopération entre les classes sociales."
POL_International_Falangism:0 "Phalangisme international"
POL_International_Falangism_desc:0 "L’Espagne nationaliste est notre sœur idéologique qui, comme nous, méprise l’Union soviétique."
POL_All_Polish_Youth:0 "Jeunesse de toute la Pologne"
POL_All_Polish_Youth_desc:0 "Enrôler notre jeunesse dans des organisations promouvant la discipline et l’idéologie nationale engendrera une génération loyale de futurs soldats."
POL_The_Student_Movement:0 "Le mouvement étudiant"
POL_The_Student_Movement_desc:0 "Enrôler notre jeunesse dans des organisations promouvant le savoir et l’idéologie nationale engendrera une génération loyale de futurs scientifiques."
POL_Political_Commissars:0 "Commissaires politiques"
POL_Political_Commissars_desc:0 "Pour maintenir le contrôle sur l’armée, des commissaires politiques seront nommés afin d’assurer le respect des politiques du parti."
POL_Fund_The_Promethean_Program:0 "Financer le programme Prométhée"
POL_Fund_The_Promethean_Program_desc:0 "Depuis près de vingt ans, nous entretenons un vaste réseau d’espionnage, de contre-révolution et de sabotage en Union soviétique. Depuis la Grande Dépression, son financement a été réduit au strict minimum. Nous devons y remédier."
POL_Expand_The_Promethean_Program:0 "Développer le programme Prométhée"
POL_Expand_The_Promethean_Program_desc:0 "Des mesures proactives doivent être prises pour protéger notre nation. L’expansion de notre vaste réseau d’espionnage et d’activités subversives en Union soviétique est justifiée."
POL_Ukranian_War_For_Independence:0 "Guerre d’indépendance ukrainienne"
POL_Ukranian_War_For_Independence_desc:0 "Il est temps de provoquer un soulèvement en Ukraine contre les oppresseurs soviétiques."
POL_Budget_Reform:0 "Réforme budgétaire"
POL_Budget_Reform_desc:0 "Des dépenses militaires excessives étouffent l’économie. Nous devons consacrer davantage de ressources au développement intérieur."
POL_Civil_Service_Reform:0 "Réforme de la fonction publique"
POL_Civil_Service_Reform_desc:0 "De nombreux postes gouvernementaux ont été attribués par favoritisme ou en raison de liens avec l’armée et les riches. Un nouveau système est nécessaire pour attribuer les emplois publics au mérite et appliquer la loi dans les plus hautes sphères."
POL_the_Agrarian_Reform:0 "Réforme agraire"
POL_the_Agrarian_Reform_desc:0 "La réforme et la redistribution des terres sont attendues depuis longtemps dans les régions rurales de Pologne."
POL_The_Front_Morges:0 "Le Front de Morges"
POL_The_Front_Morges_desc:0 "Józef Piłsudski a guidé notre nation à travers des temps difficiles, mais avec sa disparition, nous devons revenir à un système démocratique. Mettre fin à l’oppression secrète des opposants politiques est la première étape pour restaurer la confiance dans le gouvernement."
POL_Military_Aviation_Exports:0 "Exportations aéronautiques militaires"
POL_Military_Aviation_Exports_desc:0 "Nos industries aéronautiques civiles et militaires vendent déjà un volume considérable d’appareils à l’étranger. En autorisant l’exportation des modèles les plus récents, nous pourrons tirer des leçons précieuses en matière de conception."
POL_Draw_Closer_To_France:0 "Se rapprocher de la France"
POL_Draw_Closer_To_France_desc:0 "La France est depuis longtemps un phare de liberté et de libéralisme. Il est naturel que nos intérêts finissent par converger."
POL_Medium_Bomber_Development:0 "Développement de bombardiers moyens"
POL_Medium_Bomber_Development_desc:0 "Une extension de la philosophie du bombardement de précision adaptée à des missions de soutien à longue portée."
POL_Mielec_Aircraft_Factory:0 "Usine aéronautique de Mielec"
POL_Mielec_Aircraft_Factory_desc:0 "Financer le développement d’une usine aéronautique ultramoderne supplémentaire à Mielec."
POL_Advanced_Pilot_Training_Program:0 "Programme avancé de formation des pilotes"
POL_Advanced_Pilot_Training_Program_desc:0 "La théorie aéronautique est aussi importante que la technologie. De nouvelles méthodes pour nos pilotes attendent encore d’être découvertes."
POL_Import_Aircraft_Engines_From_Germany:0 "Importer des moteurs d’avion allemands"
POL_Import_Aircraft_Engines_From_Germany_desc:0 "Notre développement de chasseurs est bloqué en raison de difficultés à produire des moteurs plus puissants. Étudier les modèles de nos voisins peut considérablement accélérer les progrès."
POL_Next_Generation_Fighter:0 "Chasseur de nouvelle génération"
POL_Next_Generation_Fighter_desc:0 "Nos modèles de chasseurs deviennent obsolètes. Les prototypes nationaux doivent recevoir plus de financements pour assurer leur arrivée rapide."
POL_Light_Bomber_Focus:0 "Priorité aux bombardiers légers"
POL_Light_Bomber_Focus_desc:0 "La valeur des bombardiers en piqué pour l’appui rapproché ne doit pas être sous-estimée."
POL_Heavy_Fighter_Concept:0 "Concept de chasseur lourd"
POL_Heavy_Fighter_Concept_desc:0 "Si nous sommes contraints de passer à l’offensive, nous aurons besoin d’un nouveau type de chasseur capable d’opérer longtemps en territoire hostile."
POL_Air_Modernisations_Programme:0 "Programme de modernisation aérienne"
POL_Air_Modernisations_Programme_desc:0 "Il reste encore beaucoup à faire dans le domaine de la stratégie et des tactiques aériennes."
POL_Naval_Bomber_Experiments:0 "Expérimentations de bombardiers navals"
POL_Naval_Bomber_Experiments_desc:0 "La suprématie aérienne est aussi importante en mer que sur terre. Le développement d’avions spécialisés pour la guerre navale est un moyen d’y parvenir."
POL_Rocket_Development:0 "Développement de fusées"
POL_Rocket_Development_desc:0 "La vitesse est l’attribut dont dépendent tous les autres dans l’aérien. Les moteurs à réaction et à fusée pourraient théoriquement nous permettre de dépasser toutes les limites précédentes."
POL_Atomic_Physics_Institute:0 "Institut de physique atomique"
POL_Atomic_Physics_Institute_desc:0 "Nous ne devons pas manquer l’occasion d’être les premiers à découvrir comment exploiter le feu primordial de la fission."
POL_Lithuanian_Constitutional_Crisis:0 "Crise constitutionnelle lituanienne"
POL_Lithuanian_Constitutional_Crisis_desc:0 "Wilno est une ville polonaise historique légitime. La constitution lituanienne la revendique comme capitale. Nous devons les forcer à abandonner ces prétentions."
POL_National_Defense_Fund:0 "Fonds de défense nationale"
POL_National_Defense_Fund_desc:0 "Citoyens et État doivent contribuer ensemble au financement de notre armée grandissante afin de nous préparer aux périls des années à venir."
POL_Standardisation_Of_Equipment:0 "Standardisation de l’équipement"
POL_Standardisation_Of_Equipment_desc:0 "En standardisant l’équipement de nos soldats, nous posons les bases d’un appareil logistique moderne."
POL_Modernising_The_Cavalry:0 "Moderniser la cavalerie"
POL_Modernising_The_Cavalry_desc:0 "Bien que la cavalerie ait encore un rôle à jouer, elle a besoin de nouvelles montures mécaniques pour rester compétitive sur le champ de bataille moderne."
POL_Wz_35_Anti_Tank_Rifle:0 "Fusil antichar wz. 35"
POL_Wz_35_Anti_Tank_Rifle_desc:0 "Toutes les armes antichar ne détruisent pas en pénétrant le blindage. Des munitions à chemise d’acier et à noyau en tungstène peuvent éclater à l’impact et tuer l’équipage par fragmentation interne."
POL_Study_Foreign_Tanks:0 "Étudier les chars étrangers"
POL_Study_Foreign_Tanks_desc:0 "Ces « chars » sont désormais centraux dans les conflits armés. Nous devons suivre le rythme de nos voisins, par tous les moyens nécessaires."
POL_Cruiser_Tank_Experiments:0 "Expériences sur les chars de croisière"
POL_Cruiser_Tank_Experiments_desc:0 "Avec les bases de la conception des chars en place, nous pouvons commencer à forger notre propre voie dans le domaine complexe du design mécanisé."
POL_Plan_W:0 "Plan de mobilisation W"
POL_Plan_W_desc:0 "Quand la guerre viendra, nous devons disposer d’un plan adéquat pour gérer la logistique de mobilisation de nos troupes."
POL_Romanian_Bridgehead_Strategy:0 "Stratégie de la tête de pont roumaine"
POL_Romanian_Bridgehead_Strategy_desc:0 "Si les combats tournent à notre désavantage, nous devons avoir des plans pour un regroupement et une contre-attaque efficaces avec nos alliés."
POL_Silesia_Fortified_Area:0 "Zone fortifiée de Silésie"
POL_Silesia_Fortified_Area_desc:0 "De nouveaux forts construits au sud assureront des défenses supplémentaires."
POL_Sarny_Fortified_Area:0 "Zone fortifiée de Sarny"
POL_Sarny_Fortified_Area_desc:0 "Des mesures doivent être prises pour garantir la sécurité de la tête de pont roumaine."
POL_Pressure_Czechoslovakia:0 "Faire pression sur la Tchécoslovaquie"
POL_Pressure_Czechoslovakia_desc:0 "La Tchécoslovaquie contient de nombreuses terres polonaises légitimes et bloque notre frontière avec la Hongrie. Ce problème doit être résolu."
POL_Invite_Hungary:0 "Inviter la Hongrie"
POL_Invite_Hungary_desc:0 "Depuis le Moyen Âge, les peuples polonais et hongrois partagent un lien commun. Il est temps de se rapprocher à nouveau."
POL_Invite_Czechoslovakia:0 "Inviter la Tchécoslovaquie"
POL_Invite_Czechoslovakia_desc:0 "Les vieilles rancunes doivent rester dans le passé. Notre foi commune dans la démocratie est une bonne raison de coopérer."
POL_Third_Europe:0 "La Troisième Europe"
POL_Third_Europe_desc:0 "Un nouveau front diplomatique doit être créé pour équilibrer les puissances en Europe et sécuriser notre avenir en faveur d’une Grande Pologne."
POL_the_neighbours_protection:0 "Protection des voisins"
POL_the_neighbours_protection_desc:0 "En tant que puissance politique et diplomatique dominante en Europe de l’Est, nous devons protéger nos voisins !"
POL_The_Intermarium:0 "L’Intermarium"
POL_The_Intermarium_desc:0 "Nous ne sommes pas seuls dans notre lutte. Si nous rassemblons suffisamment d’alliés, nous pourrons peut-être survivre à la tempête à venir."
POL_Invite_Yugoslavia:0 "Inviter la Yougoslavie"
POL_Invite_Yugoslavia_desc:0 "Notre rêve d’un front uni entre les mers peut s’étendre à l’Adriatique."
POL_Invite_Romania:0 "Inviter la Roumanie"
POL_Invite_Romania_desc:0 "Les intérêts polonais et roumains ont longtemps été alignés. Il est temps de chercher une coopération plus étroite."
POL_The_Baltic_Alliance:0 "L’Alliance baltique"
POL_The_Baltic_Alliance_desc:0 "On n’a jamais trop d’amis."
POL_Treaty_With_Lithuania:0 "Traité avec la Lituanie"
POL_Treaty_With_Lithuania_desc:0 "Les vieilles rancunes doivent rester dans le passé. Chaque ami est nécessaire pour les temps sombres à venir."
POL_Collective_Industry:0 "Industrie collective"
POL_Collective_Industry_desc:0 "L’esprit de collectivisation doit aussi atteindre les usines."
POL_Request_Soviet_Guarantee:0 "Demander la garantie soviétique"
POL_Request_Soviet_Guarantee_desc:0 "Il est temps de rechercher un rapprochement avec l’Union soviétique."
POL_Polish_Peoples_Army:0 "Armée populaire polonaise"
POL_Polish_Peoples_Army_desc:0 "Une nouvelle armée d’avant-garde du peuple doit être organisée pour défendre et propager la révolution."
POL_Reaffirm_Ties_With_Romania:0 "Réaffirmer les liens avec la Roumanie"
POL_Reaffirm_Ties_With_Romania_desc:0 "Réaffirmer notre amitié et notre traité de défense avec la Roumanie est nécessaire pour assurer notre sécurité."
POL_Wartime_Industry:0 "Industrie de guerre"
POL_Wartime_Industry_desc:0 "Avec une grande partie du pays mobilisée pour la guerre, il est temps d’instaurer des changements économiques et sociaux pour les soutenir."
POL_Create_Units_KOP:0 "Obtenir trois unités d’élite du §HCOR§! le long de la frontière soviétique."
POL_Create_Units_KOP_desc:0 "Obtenir trois unités d’élite du §HCOR§! le long de la frontière soviétique."
POL_Create_Units_Academic_Legion:0 "Obtenir quatre unités de réserve des §HLégions académiques§!."
POL_Create_Units_Academic_Legion2:0 "Obtenir dix unités supplémentaires de réserve des §HLégions académiques§!."
POL_Flexible_AT:0 "Débloque §Lfusil antichar léger§!\n§HCavalerie :\n    Attaque dure : §G+25%§!\n    Perforation : §G+100%§!"
POL_Flexible_AT_effect:0 "§LFusil antichar léger§!\n\n§HCavalerie :\n    Attaque dure : §G+25%§!\n    Perforation : §G+100%§!"
POL_Flexible_AT_desc:0 "L’armée polonaise de l’entre-deux-guerres a développé un fusil antichar léger flexible qui n’avait pas besoin de pénétrer la cible pour détruire un char. En brisant l’armure externe avec une chemise d’acier et un noyau en tungstène, des éclats métalliques internes pouvaient tuer l’équipage."
POL_Romania_Invite_Tooltip:0 "§HLa Roumanie recevra une invitation à rejoindre notre faction.§!"
POL_Romania_Invite_Tooltip_desc:0 "§HLa Roumanie recevra une invitation à rejoindre notre faction.§!"
POL_Anti_Polish_Sentiment:0 "Sentiment anti-polonais"
POL_Reaffirm_Ties_With_Romania_Fascist:0 "Comme nous sommes §Hfascistes§!, nous pouvons en profiter pour §Hdémander la Bucovine§! à la place."
POL_Demanded_Bucovina:0 "Bucovine réclamée"
POL_League_Opposition:0 "Opposition à la Société des Nations"
POL_League_Support:0 "Soutien à la Société des Nations"
Polish_German_Trade_Agreement_name:0 "Accord commercial germano-polonais"
Polish_German_Trade_Agreement_desc:0 "Accord commercial germano-polonais"
POL_Back_Down_Lithuanian_Constitutional_Crisis:0 "La Pologne a reculé lors de la crise constitutionnelle lituanienne"
POL_Lithuanian_Constitutional_Crisis_Territory_Claims:0 "La Pologne a revendiqué des territoires lors de la crise constitutionnelle lituanienne"
POL_Modlin_Fortress:0 "Forteresse de Modlin"
POL_Modlin_Fortress_desc:0 "La modernisation de l’ancienne forteresse de Modlin assurera une meilleure protection de Varsovie et de ses ponts fluviaux."
POL_Plan_Z:0 "Plan Z"
POL_Plan_Z_desc:0 "Un plan stratégique est nécessaire pour gérer une guerre contre l’Allemagne, l’Union soviétique, ou même les deux en même temps !"
POL_Ribbentrop_Beck_Pact:0 "Pacte Ribbentrop-Beck"
POL_Ribbentrop_Beck_Pact_desc:0 "La coopération avec l’Allemagne est une arme à double tranchant. Nous pourrions obtenir sa protection, mais au prix de notre autonomie."
POL_Pomerania_For_Lithuania:0 "La Poméranie pour la Lituanie"
POL_Pomerania_For_Lithuania_desc:0 "La question du corridor polonais peut être résolue tout en conservant notre accès à la mer."
POL_Independent_Parachute_Brigades:0 "Brigades parachutistes indépendantes"
POL_Independent_Parachute_Brigades_desc:0 "Les parachutistes représentent une évolution prometteuse de la guerre aéroportée qui mérite d’être explorée."
POL_Strengthen_Ties_With_Japan:0 "Renforcer les liens avec le Japon §HIncomplet§!"
POL_Strengthen_Ties_With_Japan_desc:0 "Le Japon est un allié potentiel contre la menace soviétique. §HIncomplet§!"
POL_Cossack_Revolt:0 "Révolte cosaque §HIncomplet§!"
POL_Cossack_Revolt_desc:0 "Au-delà de l’Ukraine occidentale, des dissidents et mécontents se trouvent aussi en Crimée et dans le bassin du Don. §HPartiellement fonctionnel.§!"
POL_Caucasus_Revolt:0 "Révolte du Caucase §RDésactivée§!"
POL_Caucasus_Revolt_desc:0 "Nos agents prométhéens ont longtemps financé des rebelles dans le Caucase et soutenu des exilés partageant nos idées. §RDisponible dans une future mise à jour !§!"
POL_Independent_Polish_Tank_Corps:0 "Corps blindés polonais indépendants"
POL_Independent_Polish_Tank_Corps_desc:0 "Les avantages de la guerre mécanisée sont connus depuis la guerre soviéto-polonaise. Il est temps de concrétiser ces plans avec la formation d’armées blindées indépendantes."
POL_Preemptive_Strike:0 "Frappe préventive"
POL_Preemptive_Strike_desc:0 "La montée en puissance militaire de l’Allemagne ne peut être ignorée. Pour la sécurité de l’Europe, nous devons frapper les premiers avec les Alliés occidentaux, avant qu’il ne soit trop tard."
POL_Slovakian_Independence_Movement:0 "Mouvement d’indépendance slovaque"
POL_Slovakian_Independence_Movement_desc:0 "Les Slovaques, conservateurs et catholiques, pourraient constituer un rempart contre le déferlement communiste."
POL_Finnish_Guarantee:0 "Garantie à la Finlande"
POL_Finnish_Guarantee_desc:0 "Garantir la Finlande permettra de bloquer l’influence soviétique en Europe."
POL_additional_research_slot3:0 "Emplacement de recherche supplémentaire III"
POL_additional_research_slot3_desc:0 "Nos efforts pour cultiver l’excellence de nos étudiants et universitaires ont ouvert de nouvelles opportunités en R&D."
POL_Propaganda_Corps:0 "Corps de propagande"
POL_Propaganda_Corps_desc:0 "Une foi inébranlable en notre propre supériorité nous permettra de surmonter tout ennemi."
POL_Romanian_Intervention:0 "Intervention en Roumanie"
POL_Romanian_Intervention_desc:0 "La Roumanie ne doit pas tomber sous l’influence soviétique et communiste. Elle doit se soumettre à notre supervision en matière de politique étrangère."
POL_Joint_Military_Cooperation:0 "Coopération militaire conjointe"
POL_Joint_Military_Cooperation_desc:0 "La confiance mutuelle et les échanges entre nos pays peuvent générer des avantages en production et développement militaires."
POL_Land_Mine_Detectors:0 "Détecteurs de mines"
POL_Land_Mine_Detectors_desc:0 "Les progrès en électronique pourraient permettre de développer un dispositif portable capable de repérer les objets métalliques enfouis, qu’il s’agisse d’obus d’artillerie ou de mines."
POL_High_Frequency_Radio_Detection:0 "Détection radio haute fréquence"
POL_High_Frequency_Radio_Detection_desc:0 "Nos scientifiques pensent qu’un type spécialisé de RADAR pourrait être développé pour détecter les sous-marins ennemis sous la surface de l’océan."
POL_artillery_equipment_1:0 "Canon de 75 mm wz. 1902/26"
POL_artillery_equipment_1_short:0 "75 mm wz. 1902/26"

# pas de DLC La Résistance pour les focus polonais
POL_Polish_Cipher_Bureau_no_lar:0 "Développer le Bureau des chiffres polonais"
POL_Polish_Cipher_Bureau_no_lar_desc:0 "Le renseignement militaire a fait ses preuves lors de la guerre soviéto-polonaise. Renforcer nos services de renseignement nous donnera un avantage sur nos adversaires."
POL_The_Cyclometer_no_lar:0 "Le Cyclomètre"
POL_The_Cyclometer_no_lar_desc:0 "Grâce à cette invention, les codes allemands deviendront lisibles comme un texte clair. Aucun secret ne nous échappera."
POL_The_Bombe_no_lar:0 "La Bombe"
POL_The_Bombe_no_lar_desc:0 "La « Bombe cryptologique » est une évolution du Cyclomètre, permettant de décrypter les versions de plus en plus complexes du chiffre allemand Enigma."

POL_figurehead:0 "Figu­rante"
POL_The_Endecja_Movement:0 "Mouvement Endecja"
POL_The_Endecja_Movement_desc:0 "Le mouvement de Démocratie nationale dirigé par Roman Dmowski est un front nationaliste ultraconservateur qui cherche à unir tous les Polonais ethniques dans un seul État, à cultiver le potentiel humain polonais, et à forcer les minorités à adopter les coutumes, la langue et les traditions polonaises."
POL_Align_With_Italy:0 "S’aligner sur l’Italie"
POL_Align_With_Italy_desc:0 "Certains aspects du modèle italien de gouvernement nous inspirent. Nous devrions rechercher une coopération plus étroite."
free_mason:0 "Franc-maçon"
polish_nationalist_tooltip:0 "--------------\n§LCette personne voit l’influence étrangère et la présence de minorités comme une menace pour la culture et le patrimoine de la nation.§!"
butadiene_processing:0 "Traitement du butadiène"
POL_Synthetic_Rubber_tooltip:0 "Permet la construction d’§Husines de caoutchouc synthétique§!."
POL_chemist:0 "Chimiste"
POLITICS_IGNACY_MOSCICKI_DESC:0 "Ignacy Mościcki est le fondateur de l’Institut de recherche chimique de Varsovie et le principal promoteur du développement de l’industrie chimique polonaise. Avant d’accéder à la présidence, il était professeur d’électrochimie et détient plusieurs brevets dans ce domaine."
modifier_production_speed_synthetic_rubber_plant_factor:0 "Vitesse de construction des §Husines de caoutchouc§!"
POL_steel_and_armaments:0 "Con­glomérat acier & armement"
POL_HSW:0 "HSW"
POL_Debica_SA:0 "Debica SA"
POL_Synthetic_Rubber_Tires:0 "Produits chimiques et pneus synthétiques"
POL_State_Owned_Railways:0 "Chemins de fer nationalisés"
army_chief_fanaticism:0 "Fanatisme militaire\n(Expert)"
POL_army_communications:0 "Communications"
POL_Public_Affairs:0 "Affaires publiques"
POL_Invest_In_The_Middle_Class:0 "Investir dans la classe moyenne"
POL_Invest_In_The_Middle_Class_desc:0 "Trop peu de catholiques polonophones appartiennent à la classe moyenne. Les politiques gouvernementales doivent encourager son expansion et promouvoir la consommation de biens polonais."
POL_Mend_Ties_With_Czechoslovakia:0 "Rétablir les liens avec la Tchécoslovaquie"
POL_Mend_Ties_With_Czechoslovakia_desc:0 "Les peuples slaves occidentaux devraient rester unis, pas divisés. Nos différends sont secondaires face à la menace de l’influence allemande."
POL_Silesia_Or_War:0 "La Silésie ou la guerre"
POL_Silesia_Or_War_desc:0 "Par tromperie et complot international, la Haute-Silésie nous a été volée. Un second référendum doit être organisé selon nos conditions."
POL_Modernize_The_Starachowice_Works:0 "Moderniser les usines de Starachowice"
POL_Modernize_The_Starachowice_Works_desc:0 "Les usines de Starachowice sont un élément central de notre industrie d’armement depuis la Seconde République. Un programme d’investissement accélérera le développement de notre armée."
POL_Cegielski_Artillery_Factory:0 "Usine d’artillerie Cegielski"
POL_Cegielski_Artillery_Factory_desc:0 "Les fabricants civils doivent être encouragés à investir dans la production militaire. Nous accorderons un prêt pour financer une nouvelle usine d’artillerie moderne à Rzeszów."
POL_Seek_Accommodation_With_The_USSR:0 "Chercher un accord avec l’URSS"
POL_Seek_Accommodation_With_The_USSR_desc:0 "Que cela nous plaise ou non, un rapprochement avec l’Union soviétique est un sacrifice nécessaire à la survie de notre pays."
POL_Beck_Molotov_Pact:0 "Pacte Beck-Molotov"
POL_Beck_Molotov_Pact_desc:0 "La coopération avec l’URSS est une arme à double tranchant. Nous pourrions obtenir sa protection, mais au prix de notre autonomie."
POL_Starachowice_Works:0 "Usines de Starachowice"
POL_artillery_manufacturer1:0 "Usine d’artillerie & métallurgie"
POL_H_Cegielski:0 "H. Cegielski"
POL_artillery_manufacturer2:0 "Locomotives & artillerie"
POL_Nationalist_Rhetoric:0 "Rhétorique nationaliste"
POL_Nationalist_Rhetoric_desc:0 "Des sacrifices sont nécessaires pour garantir un État fort. Notre peuple doit être conscient des conséquences si notre pays tombe."
POL_The_Great_Depression2:0 "La Grande Dépression"
POL_The_Great_Depression2_desc:0 "La Pologne a été particulièrement touchée par la Grande Dépression. Les investissements, la production, le commerce et le niveau de vie ont fortement chuté."
POL_Rural_Unemployment2:0 "Chômage rural"
POL_Rural_Unemployment2_desc:0 "Les régions orientales sont beaucoup moins développées que l’Ouest. Le chômage est généralisé, particulièrement dans les campagnes."
POL_Attract_Foreign_Investment_tooltip:0 "\nPasse outre le focus : §HInternationalisme§!"
POL_chief_staffer:0 "Chef d’état-major"
political_pragmatist:0 "Pragmatique politique"
Bomber_Emphasis:0 "Accent sur les bombardiers lourds"
POL_ludomil_rayski_desc:0 "Est convaincu que les grands bombardiers sont l’avenir et que les intercepteurs monomoteurs sont obsolètes."
Interceptor_Emphasis:0 "Accent sur les intercepteurs"
POL_army_logistics:0 "Logistique de l’armée"
introspective:0 "Introspectif"
POL_eye:0 "§RFleuve Oka§!"
army_chief_offensive_prankster:0 "Offensive de cavalerie\n(Diplomate)"
Autarkist:0 "Autarcique"
POL_Ursus:0 "Ursus"
POL_Tractor_Manufacturer:0 "Fabricant de tracteurs"

POL_paramilitary:0 "Organisateur de résistance"
POL_Prepare_For_The_upcoming_conflict:0 "Préparer les conflits à venir"
POL_Prepare_For_The_upcoming_conflict_desc:0 "Feu Józef Piłsudski prédisait une nouvelle guerre en Europe, et elle pourrait arriver plus tôt qu’on ne le croit."
POL_Re_Expand_The_Military:0 "Réagrandir l’armée"
POL_Re_Expand_The_Military_desc:0 "Notre armée a été grandement réduite depuis la Grande Dépression. Il est temps de la reconstruire."
POL_Kasprzycki_Gamelin_Convention:0 "Convention Kasprzycki-Gamelin"
POL_Kasprzycki_Gamelin_Convention_desc:0 "Étant donné les actions agressives de nos voisins, une alliance militaire complète avec la France est prudente."
POL_Ukrainian_Volunteer_Brigades:0 "Brigades ukrainiennes volontaires"
POL_Ukrainian_Volunteer_Brigades_desc:0 "Se réconcilier avec les leaders de la minorité ukrainienne est le premier pas vers le rêve de Piłsudski d’une fédération multinationale."
POL_Draw_Closer_To_The_USSR:0 "Se rapprocher de l’URSS"
POL_Seek_Autonomy:0 "Rechercher l’autonomie"
POL_License_Soviet_Equipment:0 "Licence d’équipement soviétique"
POL_State_Capitalism:0 "Capitalisme d’État"
POL_State_Capitalism_desc:0 "Le communisme tel qu’il est pratiqué en URSS est un système abject. De petites entreprises peuvent coexister avec une économie planifiée et centralisée."
POL_Military_Rearmament:0 "Réarmement militaire"
POL_Next_War_Focus:0 "Priorité à l’armement"
POL_Polish_Peoples_Army_focus:0 "Armée réorganisée"
POL_Make_Amends_With_Ukraine:0 "Se réconcilier avec l’Ukraine"
POL_Make_Amends_With_Ukraine_desc:0 "Piłsudski avait promis aux nationalistes ukrainiens un pays indépendant ; les circonstances ont rompu cette promesse. Un nouveau compromis doit être trouvé."
state_capitalism_idea:0 "Capitalisme d’État"
left_wing_nationalist:0 "Nationaliste de gauche"
governor_general:0 "Gouverneur général"
POL_Minsk_Or_War:0 "Minsk ou la guerre"
POL_Minsk_Or_War_desc:0 "La ville de Minsk aurait dû être à nous, mais des erreurs de négociation après la guerre soviéto-polonaise l’ont fait nous échapper."
LIT_crisis_tooltip:0 "Peut mener à de meilleures relations avec la Lituanie et ouvrir la possibilité de rejoindre notre faction."
LIT_crisis_resolved_tooltip:0 "Compromis trouvé dans la crise constitutionnelle lituanienne"
UKR_army_tooltip:0 "À chaque territoire ukrainien capturé, l’armée de la Direction se renforcera."
UKR_militarism_focus:0 "Paramilitarisme ukrainien"
POL_Japanese_Guarantee:0 "Garantie japonaise contre l’agression soviétique"

POL_Draw_Closer_To_The_USSR_desc:0 "Des liens étroits avec l’Union soviétique sont nécessaires pour lutter contre nos ennemis à l’Ouest."
POL_Seek_Autonomy_desc:0 "Nous devons suivre une voie équilibrée entre l’amitié avec l’URSS et nos propres intérêts."
POL_License_Soviet_Equipment_desc:0 "Une intégration étroite avec l’armée soviétique est la prochaine étape logique pour l’approvisionnement de nos forces."
POL_Found_Our_Own_Faction:0 "Fonder notre propre faction"
POL_Found_Our_Own_Faction_desc:0 "S’ouvrir à la communauté internationale est nécessaire pour assurer notre sécurité."
POL_Renew_The_Polish_Soviet_Nonaggression_Pact:0 "Renouveler le pacte de non-agression soviétique"
POL_Renew_The_Polish_Soviet_Nonaggression_Pact_desc:0 "Normaliser davantage nos relations avec l’Union soviétique est nécessaire pour acheter la paix et permettre à la prospérité d’éclore."
POL_The_Leviathan_Group:0 "Le groupe Léviathan"
POL_The_Leviathan_Group_desc:0 "La planification étatique de l’économie a aggravé la crise économique dans le pays. Les leaders du secteur privé doivent avoir leur mot à dire dans le gouvernement pour que nous avancions."
POL_Invite_The_Political_Opposition:0 "Inviter l’opposition politique"
POL_Invite_The_Political_Opposition_desc:0 "La structure originelle du BBWR permettait à des membres talentueux de divers partis politiques de servir l’État pour le bien commun malgré leurs désaccords. La nouvelle Organisation commune de la société sera plus inclusive et saura mieux utiliser leurs talents."
POL_Renew_The_Polish_German_Nonaggression_Pact:0 "Renouveler le pacte de non-agression allemand"
POL_Renew_The_Polish_German_Nonaggression_Pact_desc:0 "Renouveler notre pacte de non-agression avec l’Allemagne nous donnera du temps pour réarmer et, espérons-le, nous évitera de devenir la cible de son agression."
POL_Allied_Financial_Loans:0 "Prêts financiers alliés"
POL_Allied_Financial_Loans_desc:0 "Vu l’état actuel de nos finances, nous devrons demander des prêts pour poursuivre la mobilisation de notre armée."
POL_Foreign_Financial_Loans:0 "Prêts financiers étrangers"
POL_Consolidate_The_Nationalist_Wing:0 "Consolider l’aile nationaliste"
POL_Consolidate_The_Nationalist_Wing_desc:0 "Intégrer les membres des diverses factions nationalistes fragmentées renforcera notre base de pouvoir et accroîtra le soutien à la guerre."
POL_Polish_Czechoslovakian_Alliance:0 "Alliance militaire polono-tchécoslovaque"
POL_Polish_Czechoslovakian_Alliance_desc:0 "L’ennemi de mon ennemi est mon ami. Une alliance militaire entre nos deux pays nous permettra de frapper rapidement la menace allemande."
POL_Invest_In_Fiat:0 "Investir dans Fiat"
POL_Invest_In_Fiat_desc:0 "Le gouvernement italien s’intéresse beaucoup à nos méthodes de production de caoutchouc synthétique. Un programme d’investissement conjoint pourrait être bénéfique pour nous deux."
POL_Break_Away_From_Germany:0 "Rompre avec l’Allemagne"
POL_Break_Away_From_Germany_desc:0 "Il est temps de nous éloigner du navire en perdition qu’est l’Allemagne."
POL_Maritime_and_Colonial_League:0 "Ligue maritime et coloniale"
POL_Maritime_and_Colonial_League_desc:0 "De fortes marines et de nombreuses colonies sont importantes pour la sécurité économique des nations. Les citoyens doivent être encouragés à donner de leur temps et de leur argent pour réaliser ces objectifs."
POL_Subsidized_Universal_Education:0 "Éducation universelle subventionnée"
POL_Subsidized_Universal_Education_desc:0 "L’enseignement supérieur doit dépasser le cadre d’un luxe réservé aux classes aisées et devenir un droit pour tous les citoyens."
POL_Offer_to_Purchase_Madagascar:0 "Proposer l’achat de Madagascar"
POL_Offer_to_Purchase_Madagascar_desc:0 "Nous avons longtemps envisagé d’acheter Madagascar pour en faire une colonie d’extraction de ressources et une colonie pénitentiaire."
POL_Demand_Former_German_Colonies:0 "Revendiquer les anciennes colonies allemandes"
POL_Demand_Former_German_Colonies_desc:0 "La Deuxième République de Pologne a été créée en partie à partir des territoires de l’ancien Empire allemand. Nous devons aussi plaider devant la Société des Nations pour obtenir une part de ses anciennes colonies."
POL_Offer_Liberia_Protection:0 "Proposer une protection au Libéria"
POL_Offer_Liberia_Protection_desc:0 "Grâce à nos efforts coloniaux passés, le Libéria nous a accordé le droit d’envoyer des colons et nous a donné le statut commercial de « nation la plus favorisée ». Nous devrions saisir l’occasion pour renforcer nos liens et leur offrir notre protection en échange d’une aide économique continue."
silent_workhorse_old_guard:0 "Bête de somme silencieuse\nVieille garde"
POL_Commercial_Interests:0 "Intérêts commerciaux"
POL_Henryk_Strasburger:0 "Henryk Strasburger"
POL_Plage_i_Laskiewicz:0 "Plage i Laśkiewicz"
POL_LWD:0 "LWD"
POL_experimental_aircraft_manufacturer:0 "Ateliers d’aéronautique expérimentale"
POL_Factory_Conversion_Tooltip:0 "§GRappel :§! La conversion d’usine nécessite que les anciens modèles dans le §Hstock§! soient marqués comme « §RDésarmés§! ».\n "
POL_Reaffirm_Ties_With_Romania_Tooltip:0 "Nous pourrons proposer plusieurs accords diplomatiques ou commerciaux. En cas d’acceptation, un §Hpacte de non-agression§! sera également conclu."
POL_Draw_Closer_To_France_Tooltip:0 "Nous pourrons proposer plusieurs accords commerciaux."
POL_Polski_Fiat:0 "Polski Fiat SA"
Ribbentrop_Beck_Tooltip:0 "Règle : Peut refuser les appels à la guerre jusqu’à ce que [GER.GetNameDef] soit en guerre avec [SOV.GetNameDef]."
