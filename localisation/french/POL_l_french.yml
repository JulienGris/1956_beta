POL_Arms_Imports:0 "Importations d’armes"
POL_Outsourced_Production:0 "Production externalisée"
POL_Liberia_Acquired:0 "Libéria acquis"
POL_Jan_Kwapinski:0 "Jan Kwapiński"
POL_Edward_Osobka_Morawski:0 "Edward Osóbka-Morawski"
POL_trade_and_shipping:0 "Commerce et transport maritime"
POL_Agriculture_Reform:0 "Réforme agricole"
heavy_industry_emphasis_trait:0 "Accent sur l’industrie lourde"

POL_Education_Indoctrination:0 "Endoctrinement & éducation"

POL_Divided_Nation:0 "Nation divisée"
POL_Divided_Nation_desc:0 "Une politique agressive de polonisation des minorités a laissé un sentiment amer chez une partie importante de la population."
POL_Segregated_Nation:0 "Nation ségréguée"
POL_Segregated_Nation_desc:0 "Les minorités du pays sont fortement marginalisées."
POL_Neutral_Foreign_Policy:0 "Politique étrangère neutre"
POL_Active_Foreign_Policy:0 "Politique étrangère active"
POL_Union_Boss:0 "Chef syndical"
POL_Interventionist_Foreign_Policy:0 "Politique étrangère interventionniste"
POL_Interventionist_Foreign_Policy_desc:0 "La stabilité de la région et la sécurité de la Pologne dépendent d’alliances solides et d’une intervention précoce dans les affaires étrangères."
naval_military_youth:0 "Jeunesse militaire navale"

POL_Synthetic_Rubber:0 "Caoutchouc synthétique"
POL_Synthetic_Rubber_tt:0 "§WModifie la production de§! §Hraffineries de caoutchouc§! §Wde :§! §G+2§!£resources_strip|3.\n"
POL_Synthetic_Rubber_desc:0 "Des scientifiques polonais travaillant au département de synthèse du caoutchouc de l’Institut de recherche chimique de Varsovie ont réussi à développer une forme entièrement artificielle de caoutchouc dérivée de la pomme de terre et d’autres produits agricoles. Pneus et pièces mécaniques peuvent désormais être produits sans caoutchouc naturel venu de plantations étrangères."
POL_Army_Modernisation:0 "Modernisation de l’armée"
POL_Army_Modernisation_desc:0 "L’armée polonaise nécessite d’importantes améliorations dans la logistique, les communications et les soutiens. Les talents doivent être redirigés vers des spécialisations plus techniques."
technical_training_focus:0 "Accent sur la formation technique"
POL_technical_training_focus_tt:0 "Active §HFormation technique spécialisée§!\n§HInfanterie§! :\n    Organisation : §R-2§!\n§HCompagnies de soutien§! :\n    Organisation : §G+5§!\n    Taux de récupération : §G+10%§!\n"
POL_army_reform:0 "Débloque les décisions de §Hréforme de l’armée§!."
POL_Power_Sharing_Agreement:0 "A sélectionné l’événement §HAccord de partage du pouvoir avec Mościcki§!"
POL_Tadeusz_Bielecki:0 "Tadeusz Bielecki"
nationalist_agitator:0 "Agitateur nationaliste"
POL_Silesian_Ties:0 "Liens silésiens"
POL_Public_Welfare:0 "Bien-être public"
socialist_revolutionary:0 "Révolutionnaire socialiste"
POL_army_reform_category:0 "Réformes de l’armée du maréchal Edward Rydz-Śmigły"
POL_army_reform_category_desc:0 "Une armée forte doit suivre les innovations dans les communications, le génie, l’artillerie, les blindés et l’aviation. Mais vu les limites du budget polonais, il faudra prioriser et rediriger les meilleurs talents et fonds."
POL_partial_anti_aircraft_motorization:0 "Motorisation partielle de la DCA"
POL_partial_anti_aircraft_motorization_desc:0 "Pour rester pertinente sur le champ de bataille, la cavalerie aura besoin du soutien d’armes lourdes. De nouveaux véhicules robustes sont nécessaires pour faire face à la boue saisonnière et à la mauvaise qualité des routes polonaises."
POL_partial_anti_aircraft_motorization_tt:0 "§HDCA§! :\n    Matériel motorisé : §H+9§!\n    Équipement antiaérien : §H-3§!\n      Nouvelle vitesse max : §H5.4 km/h§!\n      PV : §G+0.2§!\n      Solidité : §G+5%§!\n"
POL_partial_anti_tank_motorization:0 "Motorisation partielle des antichars"
POL_partial_anti_tank_motorization_desc:0 "L’utilisation croissante des blindés par nos grands voisins ne nous a pas échappé. Nos unités antichars doivent être assez mobiles pour suivre nos forces rapides."
POL_partial_anti_tank_motorization_tt:0 "§HAntichar§! :\n    Matériel motorisé : §H+11§!\n    Équipement antichar : §H-3§!\n      Nouvelle vitesse max : §H5.4 km/h§!\n      PV : §G+0.2§!\n      Solidité : §G+5%§!\n"
POL_Civilian_Vehicle_Donation_Drive:0 "Campagne de dons de véhicules civils"
POL_Civilian_Vehicle_Donation_Drive_desc:0 "Il est de longue tradition que les citoyens contribuent à la sécurité de la nation ; organisons une campagne de sensibilisation et de dons pour fournir à l’armée polonaise les véhicules dont elle a besoin."
POL_Solicit_Donations_for_the_Military:0 "Collecte pour l’armée"
POL_Solicit_Donations_for_the_Military_desc:0 "Il est de longue tradition que les citoyens contribuent à la sécurité de la nation ; organisons une campagne de dons pour fournir à l’armée polonaise les fusils et mitrailleuses nécessaires."
POL_Solicit_Donations_for_the_Airforce:0 "Collecte pour l’armée de l’air"
POL_Solicit_Donations_for_the_Airforce_desc:0 "Il est de longue tradition que les citoyens contribuent à la sécurité de la nation ; organisons une campagne de dons pour fournir à l’aviation polonaise les avions dont elle a besoin."
POL_Solicit_Donations_for_the_Navy:0 "Collecte pour la marine"
POL_Solicit_Donations_for_the_Navy_desc:0 "Il est de longue tradition que les citoyens contribuent à la sécurité de la nation ; organisons une campagne de dons pour fournir à la marine polonaise les navires nécessaires."
POL_Solicit_Donations_for_Public_Works:0 "Collecte pour les travaux publics"
POL_Solicit_Donations_for_Public_Works_desc:0 "Il est de longue tradition que les citoyens contribuent à la sécurité de la nation ; organisons une campagne de dons pour doter l’économie nationale des usines dont elle a besoin."
POL_Scrap_Metal_Drive:0 "Collecte de ferraille"
POL_Scrap_Metal_Drive_desc:0 "Il est de longue tradition que les citoyens contribuent à la sécurité de la nation ; organisons une collecte pour fournir aux forces armées polonaises les ressources dont elles ont besoin."
POL_Heavy_Weapons_Production:0 "Production d’armes lourdes"
POL_Heavy_Weapons_Production_desc:0 "Engageons des experts industriels et priorisons la production d’armes lourdes dans les usines d’État."
POL_Mechanization_Experiments:0 "Expériences de mécanisation"
POL_Mechanization_Experiments_desc:0 "La cavalerie a longtemps résisté à la mécanisation, forte de ses succès pendant la guerre soviéto-polonaise. Malgré ces réticences, il est temps d’avancer et de créer une unité prototype de nos futures brigades mobiles, commandée par un officier prometteur nommé Stanisław Maczek."
POL_Mechanization_Experiments_tt:0 "Gagne une §Hbrigade de cavalerie mécanisée§! d’élite à Varsovie.\n"
POL_Theoretical_Medium_Tank_Development:0 "Développement théorique de char moyen"
POL_Theoretical_Medium_Tank_Development_desc:0 "Organisons un concours de conception entre les trois bureaux d’études blindés pour un char de 20 tonnes. Ce modèle devra conserver la mobilité des 10TP et 14TP tout en augmentant l’armure et la puissance de feu avec un canon naval antiaérien de 75 mm modifié."
POL_armor_training_focus:0 "Accent sur la formation blindée"
POL_armor_training_focus_desc:0 "Les leçons de la guerre soviéto-polonaise montrent que l’avenir de la guerre sera de plus en plus mobile. Les meilleurs officiers d’infanterie doivent être transférés aux forces blindées."
POL_artillery_training_focus:0 "Accent sur la formation d’artillerie"
POL_artillery_training_focus_desc:0 "L’artillerie reste le roi du champ de bataille. En transférant nos meilleurs officiers d’infanterie, nous pouvons améliorer le contrôle du tir et la réactivité de l’artillerie."
POL_engineers_special_forces_training_focus:0 "Accent sur les ingénieurs et forces spéciales"
POL_engineers_special_forces_training_focus_desc:0 "Les équipes du génie et les forces d’élite bénéficieront du transfert de nos soldats les plus expérimentés et motivés."
POL_Complete_Focus_Army_Modernization:0 "Focus terminé : §HModernisation de l’armée§!"
POL_Complete_Focus_Army_Modernization_desc:0 "Le maréchal Piłsudski prédisait une nouvelle guerre en Europe dans la décennie à venir. Mais son successeur, Rydz-Śmigły, pense différemment : il faut préparer l’armée polonaise à l’orage qui vient."
POL_Reorganize_Military_Staff:0 "Réorganiser l’état-major"
POL_Reorganize_Military_Staff_desc:0 "Les environnements changeants nécessitent des ajustements tactiques et organisationnels de l’état-major."
POL_Cult_of_the_Marshal_Rydz_Smigly:0 "Culte du maréchal : Rydz-Śmigły"
POL_Cult_of_the_Marshal_Rydz_Smigly_desc:0 "Encouragé par l’État, le peuple et l’armée vénèrent Piłsudski et ses exploits. Créer un mythe similaire autour de son successeur Rydz-Śmigły pourrait aussi être bénéfique."
POL_The_Directorate_Of_Ukraine:0 "La Direction de l’Ukraine"
POL_The_Directorate_Of_Ukraine_desc:0 "À la fin de la guerre soviéto-polonaise, Piłsudski fut déçu que le traité de Riga n’ait pas abouti à un État ukrainien indépendant. Pour calmer les tensions ethniques et réaliser son projet d’Intermarium, la Direction de l’Ukraine peut être reformée sous notre supervision, avec une armée placée sous commandement polonais."
POL_Maritime_and_Colonial_League_category:0 "Ligue coloniale et maritime polonaise"
POL_Maritime_and_Colonial_League_category_desc:0 "De puissantes marines et de riches colonies sont la fierté des nations européennes. La Ligue coloniale et maritime polonaise a été créée pour raviver chez les Polonais le sentiment patriotique et leur lien culturel avec la mer."
POL_Southern_Access_Route:0 "Route d’accès méridionale"
POL_Southern_Access_Route_desc:0 "Les peuples polonais et hongrois se considèrent depuis longtemps comme des frères proches. En ouvrant une route directe via la Slovaquie, un nouvel axe ferroviaire renforcera le commerce et le développement économique."
POL_Align_With_Kaiserreich:0 "S’aligner sur le Kaiserreich"
POL_Align_With_Kaiserreich_desc:0 "Avec Adolf Hitler hors du pouvoir, une alliance militaire avec notre principal partenaire commercial pourrait être judicieuse."
POL_Attract_Foreign_Investment:0 "Attirer les investissements étrangers"
POL_Attract_Foreign_Investment_desc:0 "Mener de vastes réformes pro-entreprises et privatiser davantage de secteurs de l'économie encouragera les firmes étrangères à investir dans notre économie, améliorera progressivement la qualité de vie et réduira le chômage."
POL_Shock_Therapy:0 "Thérapie de Choc"
POL_Workers_Brigades:0 "Brigades Ouvrières"
POL_Workers_Brigades_desc:0 "Unis dans une solidarité commune, nous sommes forts. La défense civile est la responsabilité partagée de tous les citoyens."
POL_Mandatory_Firearm_Ownership:0 "Possession Obligatoire d’Armes à Feu"
POL_Mandatory_Firearm_Ownership_desc:0 "Dans l’intérêt de la défense collective de la nation, tous les citoyens doivent posséder et entretenir leurs armes personnelles."
POL_Zygmunt_Berling_tooltip:0 "Obtient §HZygmunt Berling§! comme Maréchal de niveau §G1§! avec le trait §HInspiring Leader§!."
POL_Autarky:0 "Autarcie"
POL_Autarky_desc:0 "La dépendance au commerce extérieur pour les matières premières est une grave faiblesse. Chaque gisement minéral connu en Pologne doit être exploité malgré le coût, et les terres confisquées par l’État."
POL_Invest_In_Ford:0 "Investir dans Ford"
POL_Invest_In_Ford_desc:0 "Le gouvernement des États-Unis a exprimé un intérêt considérable pour nos méthodes de production de caoutchouc synthétique. Un programme d’investissement conjoint pourrait être bénéfique pour nous deux."
POL_Align_With_Russia:0 "S’Aligner avec la Russie"
POL_Align_With_Russia_desc:0 "Une alliance avec une Russie non communiste nous permettra de nous concentrer sur nos ennemis occidentaux."
POL_Align_With_Russia_trigger:0 "Le [SOV.GetNameDef] et le [POL.GetNameDef] ont la même idéologie."
POL_Ford_Polska:0 "Ford Polska"
POL_Fortification_Effort:0 "Effort de Fortification"
POL_Democratic_Influence:0 "Influence Démocratique"
POL_Nationalist_Influence:0 "Influence Nationaliste"
POL_Socialist_Influence:0 "Influence Socialiste"
POL_Falangist_Influence:0 "Influence Phalangiste"
POL_Soviet_Infiltration:0 "Infiltrés Soviétiques"

POL_shock_from_surprised_attack_idea:0 "Choc de l’Attaque Surprise"
POL_shock_from_surprised_attack_idea_desc:0 "À notre plus grande surprise, le récent pacte militaire signé entre [GER.getName] et [SOV.getName] inclut une coopération militaire mutuelle contre nous ! Choqué par un tel développement, notre gouvernement est actuellement incapable de diriger efficacement le pays, limitant les capacités de nos troupes et le moral des soldats de [ROOT.getName]."

POL_Autarky_tt:0 "Débloque les décisions de §HDéveloppement des Ressources§!."
POL_National_Syndicalism_Autarky:0 "Syndicalisme National : Autarcie"
POL_National_Syndicalism_Autarky_desc:0 "En adaptant le syndicalisme aux fins du nationalisme, le Phalangisme met l’accent sur l’unité raciale et une identité religieuse catholique commune. La vision économique de l’ONR met l’accent sur l’autosuffisance. La production nationale, plutôt que le commerce international, est la meilleure voie vers la sécurité et l’ordre."
POL_Complete_Focus_Autarky:0 "Focus Complet : §HAutarcie§!"
POL_Complete_Focus_Autarky_desc:0 "Heureusement, la Pologne est une nation autosuffisante sur le plan agricole ; cependant, beaucoup reste à faire pour la rendre autosuffisante dans d’autres domaines de production."
POL_Hire_Stanislaw_Piasecki:0 "Nommer Ministre : §HStanisław Piasecki§!"
POL_Hire_Stanislaw_Piasecki_desc:0 "Pour répandre notre idéologie, nous aurons besoin du pouvoir de la presse et de connexions avec divers cercles universitaires. En tant que propriétaire du magazine littéraire de droite 'Prosto z mostu' et fondateur de la jeunesse nationaliste, Stanisław Piasecki est l’homme politique intellectuellement engagé qui peut nous aider à atteindre ces objectifs."
POL_Complete_Focus_Prepare_For_The_Next_War:0 "Focus Complet : §HPréparer la Prochaine Guerre§!"
POL_Complete_Focus_Invite_The_Political_Opposition:0 "Focus Complet : §HInviter l’Opposition Politique§!"
POL_Invite_The_Political_Opposition_tt:0 "Débloque les décisions de §HRéforme Politique§!"
POL_Prepare_For_The_Next_War_tt:0 "Débloque les décisions de §HMobilisation§!"
POL_political_reform_category:0 "Réformer le Gouvernement Sanacja"
POL_political_reform_category_desc:0 "Walery Sławek croit fermement à la capacité d’une élite bienveillante et compétente de gouverner le pays avec justice. Au-delà de la nouvelle Constitution d’Avril, des réformes supplémentaires peuvent être entreprises pour refléter cette philosophie. En même temps, Sławek comprend la situation géopolitique précaire de la Pologne et la nécessité pour le pays de rester partiellement mobilisé."
POL_Cult_of_the_Marshal_Loyal_Slawek:0 "Culte du Maréchal : 'Le Fidèle Sławek'"
POL_Cult_of_the_Marshal_Loyal_Slawek_desc:0 "Encouragé et promu par l’État, le peuple et l’armée vénèrent le défunt Józef Piłsudski et ses exploits. La faction politique de Walery Sławek reste fidèle à la vision du grand maréchal. Nul ne devrait douter de la dévotion absolue et de la loyauté que Sławek a montrées à la cause du Maréchal de son vivant."
POL_Legion_Of_Merit:0 "Légion du Mérite"
POL_Legion_Of_Merit_desc:0 "La Légion du Mérite était une modification supplémentaire de la structure du Sénat polonais imaginée par Walery Sławek. Dans ce système, certains sièges non élus seraient réservés aux citoyens ayant reçu de hautes distinctions civiles, étatiques ou militaires. Le but était de promouvoir le service à la nation polonaise et d’éviter l’obstructionnisme habituel des parlements démocratiques."
POL_Sanacja_Government2:0 "Gouvernement Sanacja"
POL_Sanacja_Government2_desc:0 "Créé après le coup d’État de mai 1926 de Józef Piłsudski, le mouvement Sanacja était principalement composé d’anciens officiers militaires dégoûtés par la corruption perçue en politique polonaise. La Sanacja était une coalition de droitiers, gauchistes et centristes dont l’objectif principal était l’élimination de la corruption et la réduction de l’inflation."
POL_Purchase_Antiquated_Stockpiles:0 "Acheter les Stocks de la Première Guerre Mondiale"
POL_Purchase_Antiquated_Stockpiles_desc:0 "Avec la Grande Guerre terminée depuis longtemps, de vastes stocks d’équipements obsolètes et bon marché sont disponibles sur le marché. Malgré leur âge, nous devrions envisager de les acheter pour aider à agrandir notre armée."
POL_National_Defense_Fund_tt:0 "\nDébloque les décisions de §HEfforts de Propagande§!."
POL_Strengthen_the_Presidential_Veto:0 "Renforcer le Droit de Véto Présidentiel"
POL_Strengthen_the_Presidential_Veto_desc:0 "La Constitution d’Avril a donné au président de forts pouvoirs de veto pour annuler les lois adoptées 'de manière non constructive'. Étendre ces pouvoirs de veto aux affaires militaires contribuera à rationaliser le gouvernement."
poland.161.t:0 "Le Château – Ignacy Mościcki"
poland.161.d:0 "Né le 1er décembre 1867 à Mierzanowo, Ignacy Mościcki était le fils d’un propriétaire foncier polonais qui avait participé au soulèvement de janvier 1863. Après avoir étudié la chimie à l’Université technique de Riga, il s’affilia à des groupes indépendantistes de gauche. Il fut contraint de fuir à Londres puis en Suisse, où il développa un brevet pour la production d’acide nitrique. Peu après, il fit la connaissance de Józef Piłsudski au sein du Parti socialiste polonais (PPS). En séjour dans l’empire austro-hongrois, Ignacy Mościcki devint spécialiste en électrochimie. Après le coup d’État de mai 1926 de Piłsudski, Mościcki fut élu président à partir du 4 juin 1926.\n\nAprès la mort de Piłsudski et l’adoption de la Constitution d’Avril, une controverse éclata pour savoir si le président en exercice devait se représenter sous les nouveaux articles. Beaucoup prédisaient que si des élections anticipées étaient organisées, le Premier ministre Walery Sławek serait favori. Le président Mościcki constitua une équipe de juristes pour démontrer que ces élections étaient inutiles. De plus, il affirma que le défunt Maréchal Piłsudski lui avait personnellement donné sa bénédiction pour poursuivre la présidence. Ainsi, la faction politique du Château prit son nom du Château royal de Varsovie, siège du président assiégé."
poland.161.a:0 "Le Président de la République"
poland.162.t:0 "Démobilisation"
poland.162.d:0 "Les mauvaises relations avec l’Union soviétique et l’Allemagne incitèrent la Pologne à maintenir une grande armée tout en consacrant une large part du budget à la défense. Avant la Grande Dépression, l’armée polonaise comptait près de trois millions de réservistes disponibles ; cependant, même l’effectif actuel de plus d’un million reste considérable parmi les puissances européennes. Pour résoudre la crise économique, l’armée devra être réduite."
poland.162.a:0 "Une conscription limitée suffira."
poland.162.b:0 "Une armée volontaire est préférable."
poland.163.t:0 "Les Réformes Économiques d’Eugeniusz Kwiatkowski"
poland.163.d:0 "Alors que Walery Sławek et Rydz-Śmigły ignoraient ces questions comme étant de peu d’importance, Ignacy Mościcki était profondément préoccupé par la crise économique qui frappait la nation. Mościcki plaça un grand espoir dans son protégé Eugeniusz Kwiatkowski pour améliorer la situation économique. Chimiste de formation, notable pour ses travaux dans l’industrie de l’azote, Kwiatkowski fut ministre de l’Industrie et du Commerce de 1926 à 1930 puis ministre du Trésor de 1935 à 1939. Considéré comme un successeur potentiel par Mościcki, Kwiatkowski fut le maître d’œuvre du plan quadriennal réussi et de la création du port maritime de Gdynia, qui commencèrent à inverser le déclin économique polonais durant la Grande Dépression."
poland.163.a:0 "Le Maître Économique de la Seconde République"
POL_industrial_projects_category:0 "Rajeunir l’Économie Polonaise"
POL_industrial_projects_category_desc:0 "Réparer le mauvais état de l’économie polonaise est une priorité absolue. De grands projets et un interventionnisme économique soutenus par l’État contribueront à assurer le plein emploi dans les industries publiques et à revitaliser le secteur privé. Les industries synthétiques et chimiques détiennent également la clé de l’indépendance économique de la Pologne."
POL_Complete_Focus_Budget_Reform:0 "Focus Complet : §HRéforme Budgétaire§!"
POL_Budget_Reform_tt:0 "Débloque les décisions §HBudgétaires & Économiques§!."
POL_Complete_Focus_Promote_The_Chemical_Industry:0 "Focus Complet : §HPromouvoir l’Industrie Chimique§!"
POL_Promote_The_Chemical_Industry_tt:0 "Débloque les décisions §HRessources Synthétiques§!."
POL_Cult_of_the_Marshal_Ignacy_Moscicki:0 "Culte du Maréchal : 'Le Plus Ancien Piłsudskien'"
POL_Cult_of_the_Marshal_Ignacy_Moscicki_desc:0 "Même du vivant de Piłsudski, les partisans de Mościcki tentaient de bâtir un mythe parallèle autour du président. Chansons, poèmes et fêtes furent organisés en son honneur. Le défunt maréchal plaçait une grande confiance en lui, qui se présentait parfois comme le 'Plus Ancien Piłsudskien'."
POL_Polish_Revanchism_tt:0 "§RAutorise l’intervention dans la§! §Hguerre civile allemande§!.\n"
poland.164.t:0 "Intervention Polonaise dans la Guerre Civile Allemande"
poland.164.d:0 "Dans une annonce publique, [POL.GetLeader] proclama que l’armée polonaise interviendrait pour protéger les enclaves d’ethnie polonaise en Allemagne contre la violence. Déjà, des émeutes éclatèrent dans plusieurs régions frontalières — soupçonnées par certains d’être un effort orchestré par le gouvernement polonais lui-même comme prétexte à l’action. Malgré les protestations diplomatiques officielles, le ministre polonais des affaires étrangères, Józef Beck, maintient que la réponse est justifiée."
poland.164.a:0 "Un Développement Intéressant"
POL_PPS_Economic_Nationalization:0 "PPS : Nationalisation Économique"
POL_PPS_Economic_Nationalization_desc:0 "Au lieu de la lutte des classes, le Parti socialiste polonais repose sur les concepts d’unité nationale — la libération du pays de ses anciens maîtres étrangers. Considérés comme très progressistes pour l’époque, ils prônent de généreuses réformes du travail, une fiscalité progressive et l’égalité des droits indépendamment de la race, de la nationalité, de la religion et du sexe — tous unis par un patriotisme commun."
POL_Complete_Focus_State_Capitalism:0 "Focus Complet : §HCaptalisme d’État§!"
POL_Complete_Focus_State_Capitalism_desc:0 "Le gouvernement devra prendre le contrôle et gérer directement davantage d’industries clés. De plus, les grands actifs détenus par des étrangers doivent être saisis et nationalisés pour le plus grand bien du peuple polonais."
POL_Hire_Adam_Ciolkosz:0 "Nommer Ministre : §HAdam Ciołkosz§!"
POL_Hire_Adam_Ciolkosz_desc:0 "Malgré son arrestation passée pour activités anti-Sanacja, Adam Ciołkosz parvint à se faire élire au Sejm en représentant Tarnów, après avoir obtenu un nombre record de voix. En tant que chef du Comité ouvrier de district du parti PPS à Cracovie, il est un relais essentiel vers la conscience publique de la nation polonaise."
POL_Front_Morges_Diplomatic_Agenda:0 "SL : Agenda Diplomatique"
POL_Front_Morges_Diplomatic_Agenda_desc:0 "Composé de nombreux membres du gouvernement avant le coup d’État de mai 1926 de Piłsudski, l’administration de Wincenty Witos est préoccupée par la montée dangereuse de l’extrémisme dans les pays voisins. À cette fin, ils cherchent à former de fortes alliances avec d’autres démocraties partageant les mêmes idées. Sur le plan intérieur, ils cherchent à libéraliser, mais évitent les pires excès des économies de marché totales."
POL_Hire_Wojciech_Korfanty:0 "Nommer Ministre : §HWojciech Korfanty§!"
POL_Hire_Wojciech_Korfanty_desc:0 "Chef des révoltes de la population polonaise de Silésie en 1918, Wojciech Korfanty siégea au Sejm polonais. Après le coup de mai 1926, il fut longuement jugé pour ses liens avec l’ancien gouvernement, emprisonné, puis contraint à l’exil en Tchécoslovaquie. Il compte de nombreux partisans parmi le public et serait un grand leader du Front Morges en Suisse."
POL_Complete_Focus_Civil_Service_Reform:0 "Focus Complet : §HRéforme de la Fonction Publique§!"
POL_Complete_Focus_Civil_Service_Reform_desc:0 "Avant de mettre en œuvre l’agenda du SL, de nombreux fonctionnaires restés loyaux à l’ancien gouvernement et à l’armée doivent être écartés. De nouveaux systèmes fondés sur le mérite sont nécessaires pour garantir le bon fonctionnement de l’État, en accord avec les valeurs chrétiennes."
POL_Endecja_Social_Reform:0 "Démocratie Nationale : Société & Culture"
POL_Endecja_Social_Reform_desc:0 "Pour ceux de la droite politique, Roman Dmowski est un grand fondateur de l’indépendance polonaise. Le parti nationaliste qu’il dirige a été soigneusement formé pour rechercher la force, mais éviter l’extrémisme. La Pologne est avant tout une nation de Polonais. Les autres groupes devront s’assimiler à la culture polonaise. De même, pour exploiter les talents et le potentiel humain, la politique gouvernementale doit soutenir le développement des classes instruites et moyennes."
POL_Hire_Tadeusz_Bielecki:0 "Nommer Ministre : §HTadeusz Bielecki§!"
POL_Hire_Tadeusz_Bielecki_desc:0 "Le gouvernement Sanacja a longtemps réprimé le mouvement nationaliste. Une direction décisive est nécessaire pour surmonter son autoritarisme. En tant que l’un des 'neuf' hommes de confiance de Roman Dmowski, Bielecki fera un excellent futur président du Conseil suprême du Parti national."
POL_Complete_Focus_Invest_In_The_Middle_Class:0 "Focus Complet : §HInvestir dans la Classe Moyenne§!"
POL_Complete_Focus_Invest_In_The_Middle_Class_desc:0 "La base du mouvement nationaliste repose sur la classe moyenne polonaise. Pour accroître le soutien à notre administration et assurer le bien-être de la société, la politique gouvernementale doit être favorable à son expansion."
POL_Invest_In_The_Middle_Class_tt:0 "Débloque les décisions de §HRéforme Sociale§!."
stalinist_revolutionary:0 "Révolutionnaire Stalinien"
democratic_exile:0 "Exilé Démocratique"
falangist_demagogue:0 "Démagogue Phalangiste"
POL_Foreign_Assets_Seized:0 "Biens Étrangers Saisis"
POL_German_Blitzkrieg_of_Poland_dummy:0 "Blitzkrieg Allemand en Pologne"
POL_German_Blitzkrieg_of_Poland:0 "Blitzkrieg Allemand en Pologne"
POL_German_Blitzkrieg_of_Poland_desc:0 "Le choc soudain de la vitesse de l’armée allemande, de sa puissance aérienne et de ses cinquièmes colonnes a provoqué la désorganisation de la logistique de l’armée polonaise."
POL_Polish_Revanchism_tt_tt:0 "Débloque les décisions de §HRevendiquer des Cœurs§!."
POL_Complete_Focus_Polish_Revanchism:0 "Focus Complet : §HRévanchisme Polonais§!"
POL_Complete_Focus_Polish_Revanchism_desc:0 "Les nationalistes sont de fervents partisans du concept piast de la Pologne. Des siècles de germanisation des anciennes terres de la couronne polonaise doivent être renversés."
POL_Enlistment_Restrictions:0 "Restrictions à l’Enrôlement"
POL_Enlistment_Restrictions_desc:0 "Certaines origines ethniques sont d’une loyauté suspecte. Elles doivent être interdites de service militaire. Les services de renseignement doivent également les surveiller de plus près."
POL_Enlistment_Restrictions_tt:0 "§GÉlimine le malus militaire si l’Allemagne envahit.§!"
POL_Urban_Migration_Incentives:0 "Incitations à la Migration Urbaine"
POL_Urban_Migration_Incentives_desc:0 "La croissance de la classe capitaliste nécessite de fortes concentrations de main-d’œuvre disponible. Des incitations doivent être offertes pour encourager la migration de la campagne vers les villes."
POL_Make_Western_Pomerania_Core:0 "Nationaliser la Poméranie Occidentale"
POL_Make_Western_Pomerania_Core_desc:0 "Des siècles de germanisation ont laissé dans l’ouest de la Poméranie d’importantes poches de minorités polonaises d’importance culturelle. Par une éducation culturelle obligatoire de la prochaine génération et de généreuses incitations à la migration de Polonais dans la région, la loyauté régionale pourra être assurée au fil du temps."
POL_Make_Western_Silesia_Core:0 "Nationaliser la Silésie Occidentale"
POL_Make_Western_Silesia_Core_desc:0 "Des siècles de germanisation ont laissé dans l’ouest de la Silésie d’importantes poches de minorités polonaises d’importance culturelle. Par une éducation culturelle obligatoire et de généreuses incitations à la migration de Polonais dans la région, la loyauté régionale pourra être assurée au fil du temps."
POL_Make_East_Prussia_Core:0 "Nationaliser la Prusse Orientale"
POL_Make_East_Prussia_Core_desc:0 "Des siècles de germanisation ont laissé en Prusse orientale d’importantes poches de minorités polonaises d’importance culturelle. Par une éducation culturelle obligatoire et de généreuses incitations à la migration de Polonais dans la région, la loyauté régionale pourra être assurée au fil du temps."
POL_Family_Subsidies:0 "Subventions Familiales et Commerciales"
POL_Family_Subsidies2:0 "Subventions Familiales et Commerciales"

POL_Promethean_Program_category:0 "§R- CLASSIFIÉ ! -§!"
POL_Promethean_Program_category_desc:0 "Le Programme Prométhéen fut créé par Józef Piłsudski pour affaiblir l’Union soviétique en soutenant les mouvements nationalistes d’indépendance des peuples non russes. Au fil du temps, le programme s’est transformé en un outil offensif à utiliser en cas de guerre contre l’URSS. Des unités spéciales polonaises, dirigées par des officiers choisis, s’entraînent à mener des sabotages et à collecter des renseignements derrière les lignes ennemies. Depuis plusieurs décennies, la frontière polono-soviétique reste tendue, chaque camp envoyant ses espions."
POL_Authorize_Sabotage_Mission:0 "Autoriser une Mission de Sabotage"
POL_Authorize_Sabotage_Mission_desc:0 "Des agents prométhéens, travaillant avec des dissidents au sein du [SOV.GetNameDef], ont identifié une opportunité de porter un coup potentiel au régime. Une cible industrielle a été sélectionnée pour une opération de sabotage. Les agents attendent des fonds, du matériel et l’autorisation d’exécuter le plan."
POL_Tadeusz_Schaetzel_tt:0 "Puisque nous avons §HTadeusz Schaetzel§! comme ministre, nous serons remboursés de §G18§! points de pouvoir politique."
POL_Japanese_Military_Intelligence_Cooperation:0 "Coopération de Renseignement Militaire avec le Japon"
POL_Japanese_Military_Intelligence_Cooperation_desc:0 "La Pologne et le Japon partagent une longue histoire de coopération pour affaiblir l’Union soviétique. En échange de la formation d’officiers japonais à la cryptographie, nous pourrions utiliser le Japon comme base pour davantage d’opérations prométhéennes."
POL_Japanese_Military_Intelligence_Cooperation_tt:0 "Augmente l’efficacité des §HMissions de Sabotage§! lorsque nous entretenons de bonnes relations avec le Japon."

POL_develop_steel_industry_emphasis:0 "Accent sur l’Industrie de l’Acier"
POL_develop_steel_industry_emphasis_desc:0 "Le sud-ouest de la Pologne est déjà le théâtre d’une exploitation à grande échelle du charbon et du minerai de fer. Un manque de demande intérieure ne doit pas nous empêcher d’ouvrir davantage d’aciéries. Dans une économie syndicaliste, c’est le rôle de l’État d’utiliser les fruits du travail du peuple à bon escient."
POL_develop_aluminium_smelting_industry:0 "Expériences dans la Fonte d’Aluminium"
POL_develop_aluminium_smelting_industry_desc:0 "Malgré la disponibilité de gisements de bauxite domestiques, le précédent gouvernement et les capitalistes se sont paresseusement contentés d’importer de l’aluminium raffiné bon marché de Hongrie. Cet échec doit être corrigé. Nos propres installations de fonte doivent être construites."
POL_develop_aluminium_smelting_industry2:0 "Développement de l’Industrie de l’Aluminium"
POL_develop_aluminium_smelting_industry2_desc:0 "Après nos premières expériences, de nouveaux projets gouvernementaux peuvent aider à concrétiser le potentiel de production nationale d’aluminium."
POL_Reopen_Old_Chromium_Mines:0 "Rouvrir les Anciennes Mines de Chrome"
POL_Reopen_Old_Chromium_Mines_desc:0 "Il y a longtemps, une exploitation minière à petite échelle de chrome et de molybdène existait en Silésie. Ces mines furent fermées car elles étaient épuisées et non rentables. De la main-d’œuvre doit être mobilisée pour extraire ces ressources malgré le coût."
POL_Develop_Boryslaw_Oil_Basin:0 "Développer le Bassin Pétrolier de Borysław"
POL_Develop_Boryslaw_Oil_Basin_desc:0 "Les opérations à Borysław sont cruciales pour fournir à la Pologne le pétrole nécessaire à sa consommation intérieure et militaire. Un développement supplémentaire de la région est nécessaire."
POL_Prospect_For_Oil_Carpathian:0 "Prospection Pétrolière dans les Carpates"
POL_Prospect_For_Oil_Carpathian_desc:0 "Les montagnes des Carpates sont depuis longtemps soupçonnées de contenir des réserves pétrolières supplémentaires ; toutefois, l’exploration de la zone a été problématique. Avec beaucoup de difficulté, de nouvelles exploitations pourraient être possibles."
POL_steel_industry_growth:0 "Croissance de l’Industrie de l’Acier"
POL_steel_industry_growth_desc:0 "À mesure que l’économie polonaise s’améliore au fil du temps, la demande intérieure d’acier augmentera naturellement. Comme le sud-ouest de la Pologne est déjà le centre d’une exploitation minière à grande échelle de charbon et de minerai de fer, étendre les opérations ne sera pas difficile."
POL_chemical_research_grants:0 "Subventions pour la Recherche Chimique"
POL_chemical_research_grants_desc:0 "Les recherches et développements antérieurs sur les matériaux et produits chimiques synthétiques ont donné des résultats très positifs. Un financement et des subventions supplémentaires de l’État doivent être appliqués."
POL_Women_In_Aviation:0 "Femmes dans l’Aviation Militaire"
POL_Women_In_Aviation_desc:0 "Les femmes servent déjà dans divers rôles de soutien dans l’armée, notamment en pilotant des avions de liaison et de transport. Leur rôle peut être élargi à celui de pilotes d’avions militaires en combat."
POL_relocate_industry_to_the_east:0 "Relocaliser l’Industrie à l’Est"
POL_relocate_industry_to_the_east_desc:0 "En démantelant et en relocalisant les usines dans les zones les plus touchées par le chômage, nous pourrons rapidement soulager les griefs des régions les plus pauvres de Pologne. Cela renforcera notre soutien politique."
POL_Handle_Danzig:0 "Gérer Dantzig"
POL_Handle_Danzig_desc:0 "Le Haut-commissaire de Dantzig s’inquiète de plus en plus de l’extrémisme croissant au sein du gouvernement de Dantzig et du traitement réservé à la minorité polonaise de la région. Nous devrions prendre des mesures secrètes pour traiter la situation par des canaux diplomatiques à la Société des Nations."
POL_Communal_Farms:0 "Fermes Communales"
POL_Collective_Farms:0 "Fermes Collectives"
POL_Collective_Farms_desc:0 "Notre parti est issu d’une union malheureuse entre intérêts commerciaux et parti paysan. Pour maintenir le soutien populaire, nous pouvons ouvrir des fermes collectives dans les régions les plus touchées afin d’apporter de la stabilité."
POL_Sanacja_Influence:0 "Influence de la Sanacja"
POL_Austerity_Measures:0 "Mesures d’Austérité"
POL_Austerity_Measures_desc:0 "Les biens de luxe sont pour les faibles. L’économie doit se concentrer uniquement sur la production de biens et de services qui profitent directement à l’État et au progrès."
POL_The_Three_Year_Plan:0 "Le Plan Triennal"
POL_The_Three_Year_Plan_desc:0 "Un nouveau plan économique est nécessaire pour reconstruire l’économie polonaise conformément aux valeurs marxistes-léninistes."
POL_Socialist_Realism:0 "Réalisme Socialiste"
POL_Socialist_Realism_desc:0 "L’urbanisme et l’architecture dans les villes polonaises doivent être mis à jour pour refléter les idéaux socialistes de persistance et de puissance. La culture ouvrière doit aussi adopter le mouvement stakhanoviste afin de considérer le travail comme une source de fierté et d’héroïsme."
POL_Vladimir_Lenin_Steelworks:0 "Aciéries Vladimir Lénine"
POL_Vladimir_Lenin_Steelworks_desc:0 "Les anciennes régions aisées de Pologne se sont montrées résistantes à l’adoption des valeurs communistes. La construction de nouvelles villes industrielles à Nowa Huta et la migration de nouveaux travailleurs corrigeront le 'déséquilibre de classe' dans la région."
POL_presitge_toolip:0 "Débloque les décisions de §HPrestige National§!."
POL_palace_of_culture_and_science:0 "Palais de la Culture et de la Science"
POL_palace_of_culture_and_science_desc:0 "Pour façonner l’opinion publique, un nouveau grand monument doit être créé pour symboliser l’amitié entre la Pologne et l’URSS. Les nombreux gratte-ciel aux États-Unis pourraient servir d’inspiration et prouver le triomphe des valeurs communistes."
POL_submarine_manufacturer:0 "Constructeur de Sous-Marins"

