POL_monarchy_party:0 "Monarchistes"
POL_His_Majestys_Most_Loyal_Minister:0 "Le Plus Loyal Ministre de Sa Majesté"
POL_king_of_poland:0 "Roi de Pologne"
POL_german_origins:0 "Origines Allemandes"
POL_monarchist_debate_in_the_Sejm:0 "Débat Monarchiste au Sejm"
POL_monarchist_debate_in_the_Sejm_desc:0 "Les relations polono-allemandes ont une histoire tendue. Afin de cimenter l’alliance actuelle entre les deux pays, des propositions refont surface pour que Fryderyk Krystian Wettyn, le prince de Saxe, serve de monarque symbolique avec le président [POL.GetLeader] comme son plus loyal ministre."

POL_Polish_Cipher_Bureau_Focus0:0 "Le Bureau de Chiffrement Polonais"
POL_Polish_Cipher_Bureau_Focus0_desc:0 "Le Bureau de Chiffrement polonais est chargé du contre-espionnage, de la détection radar et des tâches de cryptanalyse."
POL_Polish_Cipher_Bureau_Focus1:0 "La Méthode du Gril"
POL_Polish_Cipher_Bureau_Focus1_desc:0 "Des techniques de force brute ont été développées pour casser la clé cryptologique du code Enigma."
POL_Polish_Cipher_Bureau_Focus2:0 "Le Cyclomètre"
POL_Polish_Cipher_Bureau_Focus2_desc:0 "Une machine de catalogage des chiffres d’Enigma a été développée afin de permettre un déchiffrement rapide des codes de renseignement allemands."
POL_Polish_Cipher_Bureau_Focus3:0 "La Bombe Cryptologique"
POL_Polish_Cipher_Bureau_Focus3_desc:0 "Un dispositif mécanique de calcul a été mis au point pour automatiser le processus de décryptage des codes allemands."

PPS_Faction:0 "Internationale Communiste"

organizer_of_the_volhynia_experiment:0 "Organisateur de l’Expérience de Volhynie"

POL_Enigma_Effect_Tooltip:0 " est désormais disponible comme Focus National."
POL_Encryption_Decryption_tooltip:0 "§H1x§! §G100%§! bonus de recherche pour : §HChiffrement & Déchiffrement§!\n"
UKR_neutrality_drift:0 "La Direction"
UKR_neutrality_drift_desc:0 "La direction est un organe exécutif temporaire doté de pouvoirs d’urgence en temps de guerre par la Rada centrale de la République Populaire Ukrainienne."
POL_Head_of_State_Police:0 "Chef de la Police d’État"

POL_Freighter_Manufacturer:0 "Constructeur de Cargos"
POL_Steam_Turbines_and_Steelworks:0 "Turbines à Vapeur & Aciéries"
POL_Rural_Education_Initiative:0 "Initiative d’Éducation Rurale"
POL_Rural_Education_Initiative_desc:0 "L’accès à l’éducation dans les régions les plus reculées du pays est aléatoire. L’amélioration des infrastructures de notre pays nous permettra de corriger ce problème."
POL_Higher_School_Of_War:0 "École Supérieure de Guerre"
POL_Higher_School_Of_War_desc:0 "Un programme technique et d’ingénierie plus strict pour la promotion de nos officiers supérieurs garantira que notre armée est préparée à suivre le rythme des innovations modernes."
POL_Class_A_Reservists:0 "Réservistes Classe 'A'"
POL_Class_A_Reservists_desc:0 "La Deuxième République polonaise compte 2,5 millions de fusiliers entraînés ; cependant, en raison du manque d’équipement, seuls la moitié sont actuellement appelés au service. Nos réserves devraient être mobilisées."
POL_Create_Units_ON:0 "Obtenez treize brigades de réserve indépendantes de §HDéfense Nationale§! composées de §Htrois bataillons d’infanterie§! en Pologne occidentale."
POL_Grant_Sir_Adrian_Carton_de_Wiart_Citizenship:0 "Accorder la Citoyenneté à Sir Adrian Carton de Wiart"
POL_Grant_Sir_Adrian_Carton_de_Wiart_Citizenship_desc:0 "Sir Adrian Carton de Wiart est le chef de la mission militaire britannique en Pologne. Depuis la fondation de la Deuxième République, il a été un conseiller et un partisan dévoué de la cause polonaise. Étant donné son service passé et son amour pour notre pays, nous devrions envisager de lui accorder la citoyenneté et un commandement militaire officiel."
POL_Align_With_Japan:0 "S’Aligner avec le Japon"
POL_Align_With_Japan_desc:0 "Rejoindre un front uni avec le Japon nous permettra de porter un coup fatal au [SOV.GetName] sur deux fronts."
POL_Invite_Sweden:0 "Inviter la Suède"
POL_Invite_Sweden_desc:0 "De l’autre côté de la mer Baltique, le socialisme a de profondes racines et offre le potentiel de nouveaux alliés."
POL_Pressure_Gdansk_Border_Conflict_tooltip:0 "Déclenche un §HConflit Frontière§! avec §H[DNZ.GetNameDef]§! ou §H[GER.GetNameDef]§!.\n"
POL_GER_Yes_Danzig_Intervention:0 "Si des combats éclatent à [DNZ.GetNameDef], nous pourrions être entraînés dans un §HConflit Frontière§! avec [POL.GetNameDef]."
POL_GER_No_Danzig_Intervention:0 "Nous laisserons [DNZ.GetNameDef] à son propre sort en cas d’hostilités."
poland.37.b:0 "Les ignorer et envoyer l’armée !"
poland.194.t:0 "Résolution de la Société des Nations Violée"
poland.194.d:0 "Malgré la condamnation de la Société des Nations, [POL.GetNameDef] est toujours déterminée à prendre le contrôle de Dantzig. Le conflit est inévitable."
poland.194.a:0 "Notre milice devra barricader les rues."
poland.194.b:0 "Nous devrions faire appel à la Patrie pour obtenir de l’aide."
poland.195.t:0 "Notre soutien pour Dantzig ?"
poland.195.d:0 "La Société des Nations est en train de voter sur la modification du statut de Dantzig en tant que ville internationale. La Pologne cherche à revendiquer la zone pour elle-même. La possibilité qu’un conflit éclate reste éloignée, mais nous devons définir notre position sur la question."
poland.195.a:0 "En cas de conflit, nous soutiendrons Dantzig."
poland.195.b:0 "Ils sont livrés à eux-mêmes."
Danzig_POL_border_conflict_time_until_cancelled:0 "Fin du conflit autour de [DNZ.GetNameDef]"
Danzig_POL_border_conflict_time_until_cancelled_desc:0 "Au rythme actuel, nous ne pourrons soutenir les opérations de combat que pendant un certain temps avant de devoir nous retirer."
Danzig_POL_border_conflict_escalate_conflict:0 "Escalader le Conflit autour de [DNZ.GetNameDef]"
Danzig_POL_border_conflict_escalate_conflict_desc:0 "Le conflit autour de [DNZ.GetNameDef] s’est enlisé. Peut-être qu’en escaladant davantage et en engageant plus de troupes sur le théâtre, nous pouvons encore obtenir une victoire."
Danzig_POL_border_conflict_escalate_to_war:0 "Déclarer la Guerre pour [DNZ.GetNameDef]"
Danzig_POL_border_conflict_escalate_to_war_desc:0 "Les combats autour de [DNZ.GetNameDef] durent depuis un moment et ne montrent aucun signe de fin. Nous devons être prêts à franchir l’étape suivante et considérer ce conflit comme le premier pas vers une guerre générale."
Danzig_POL_border_conflict_back_out_of_conflict:0 "Reculer"
Danzig_POL_border_conflict_back_out_of_conflict_desc:0 "Le danger que ce conflit dégénère en une guerre à grande échelle entre nos pays est tout simplement trop grand. Nous devrions arrêter les frais maintenant et envoyer des signaux diplomatiques à l’autre partie."
Gdansk_POL_border_conflict_time_until_cancelled:0 "Fin du conflit autour de [DNZ.GetNameDef]"
Gdansk_POL_border_conflict_time_until_cancelled_desc:0 "Au rythme actuel, nous ne pourrons soutenir les opérations de combat que pendant un certain temps avant de devoir nous retirer."
Gdansk_POL_border_conflict_escalate_conflict:0 "Escalader le Conflit autour de [DNZ.GetNameDef]"
Gdansk_POL_border_conflict_escalate_conflict_desc:0 "Le conflit autour de [DNZ.GetNameDef] s’est enlisé. Peut-être qu’en escaladant davantage et en engageant plus de troupes sur le théâtre, nous pouvons encore obtenir une victoire."
Gdansk_POL_border_conflict_escalate_to_war:0 "Déclarer la Guerre pour [DNZ.GetNameDef]"
Gdansk_POL_border_conflict_escalate_to_war_desc:0 "Les combats autour de [DNZ.GetNameDef] durent depuis un moment et ne montrent aucun signe de fin. Nous devons être prêts à franchir l’étape suivante et considérer ce conflit comme le premier pas vers une guerre générale."
