prussia_poland_border_conflict.3.desc:0 "À la suite d’un affrontement entre les forces allemandes et polonaises en Prusse orientale, les routes de la région étaient jonchées d’équipements polonais endommagés et abandonnés. \n\nPlusieurs assauts polonais contre des positions défensives allemandes hâtivement érigées ont échoué avec de lourdes pertes durant la bataille. Peu doutent que ce fiasco refroidira sûrement l’enthousiasme pour de nouvelles tentatives d’intervention."
prussia_poland_border_conflict.3.a:0 "Un énorme coup porté à notre prestige."
prussia_poland_border_conflict.3.b:0 "Notre revanche viendra en temps voulu."

prussia_poland_border_conflict.4.t:0 "Impasse en Prusse orientale"
prussia_poland_border_conflict.4.desc:0 "Les combats sporadiques entre les forces polonaises et allemandes se sont enlisés dans une impasse. Ne voulant pas aller plus loin, un cessez-le-feu a été négocié en vue d’un retrait."
prussia_poland_border_conflict.4.a:0 "Nous avons acquis une expérience précieuse."

prussia_poland_border_conflict.5.t:0 "Déclaration formelle de guerre"
prussia_poland_border_conflict.5.desc:0 "Qualifiant les incursions des forces polonaises en territoire allemand d’acte de guerre, [FROM.GetNameDef] a déclaré la guerre à [POL.GetNameDef]. Il semblerait que [FROM.GetNameDef] soit convaincu qu’une guerre sur deux fronts peut être gagnée."
prussia_poland_border_conflict.5.a:0 "Nous devons tenir la ligne."
poland_r56.13.t:0 "Invitation au projet Intermarium"
poland_r56.13.d:0 "Afin de garantir l’indépendance continue de l’Europe de l’Est face aux agresseurs potentiels, la Pologne nous a demandé de les rejoindre dans une alliance visant à assurer notre sécurité et nos intérêts mutuels."
poland_r56.13.a:0 "Volontiers. Ensemble, nous affronterons la tempête à venir."
poland_r56.13.b:0 "[Root.GetName] suit son propre chemin."

poland_r56.14.t:0 "[From.GetName] rejoint le projet Intermarium"
poland_r56.14.d:0 "Notre plan de former un nouveau bloc de puissance orientale progresse. [From.GetLeader] approuve nos efforts, et [From.GetName] a accepté notre invitation à une alliance."
poland_r56.14.a:0 "La Pologne et [From.GetName] unies comme des frères."

poland_r56.15.t:0 "[From.GetName] refuse de rejoindre le projet Intermarium"
poland_r56.15.d:0 "Malgré nos meilleurs efforts pour offrir l’opportunité de rester unis en Europe de l’Est, notre tentative la plus récente de tendre la main à [From.GetLeader] a été accueillie avec scepticisme. [From.GetName] a refusé de rejoindre l’alliance, peut-être en doutant de nos motivations, peut-être en remettant en cause notre force, ou craignant qu’un rapprochement trop étroit fasse d’eux une cible."
poland_r56.15.a:0 "Nous continuerons sans eux."

poland_r56.16.t:0 "Invitation à la Troisième Europe"
poland_r56.16.d:0 "Afin de garantir l’indépendance continue de l’Europe de l’Est face aux agresseurs potentiels, la Pologne nous a demandé de les rejoindre dans une alliance visant à assurer notre sécurité et nos intérêts mutuels."
poland_r56.16.a:0 "Volontiers. Ensemble nous sommes forts."
poland_r56.16.b:0 "[Root.GetName] suit son propre chemin."

poland_r56.17.t:0 "Invitation à la Troisième Europe"
poland_r56.17.d:0 "Afin de garantir l’indépendance continue de l’Europe de l’Est face aux agresseurs potentiels, la Pologne nous a demandé de les rejoindre dans une alliance visant à assurer notre sécurité et nos intérêts mutuels."
poland_r56.17.a:0 "Volontiers. Ensemble nous sommes forts."
poland_r56.17.b:0 "[Root.GetName] suit son propre chemin."

poland_r56.18.t:0 "[From.GetName] rejoint la Troisième Europe"
poland_r56.18.d:0 "Notre plan de former un nouveau bloc de puissance orientale progresse. [From.GetLeader] approuve nos efforts, et [From.GetName] a accepté notre invitation à une alliance."
poland_r56.18.a:0 "La Pologne et [From.GetName] unies comme des frères."

poland_r56.19.t:0 "[From.GetName] refuse de rejoindre la Troisième Europe"
poland_r56.19.d:0 "Malgré nos meilleurs efforts pour offrir l’opportunité de rester unis en Europe de l’Est, notre tentative la plus récente de tendre la main à [From.GetLeader] a été accueillie avec scepticisme. [From.GetName] a refusé de rejoindre l’alliance, peut-être en doutant de nos motivations, peut-être en remettant en cause notre force, ou craignant qu’un rapprochement trop étroit fasse d’eux une cible."
poland_r56.19.a:0 "Nous continuerons sans eux."

poland_r56.20.t:0 "Sommet diplomatique polono-roumain"
poland_r56.20.d:0 "Le prince héritier Michel de Roumanie et de nombreux hauts diplomates roumains ont été invités à rencontrer à Varsovie le ministre polonais des Affaires étrangères, Józef Beck, afin de discuter des liens entre nos deux pays. Nous pouvons utiliser cette occasion pour aborder une question clé entre nos deux nations."
poland_r56.20.a:0 "Discuter de la construction d’un réseau ferroviaire entre nos pays."
poland_r56.20.b:0 "Demander à la Roumanie d’abandonner sa garantie envers la Tchécoslovaquie."
poland_r56.20.c:0 "Proposer des manœuvres militaires conjointes."

poland_r56.21.t:0 "Coopération économique avec la Pologne"
poland_r56.21.d:0 "Le ministre polonais des Affaires étrangères, Józef Beck, a proposé la construction d’un réseau ferroviaire reliant les deux nations. Le projet pourrait stimuler la croissance économique des régions rurales à nos frontières."
poland_r56.21.a:0 "Une proposition intéressante."
poland_r56.21.b:0 "Une proposition absurde."

poland_r56.22.t:0 "Coopération diplomatique avec la Pologne"
poland_r56.22.d:0 "Lors d’un récent sommet diplomatique, le ministre polonais des Affaires étrangères, Józef Beck, nous a demandé d’abandonner notre garantie envers la Tchécoslovaquie. La délégation polonaise estime que nos assurances à la Tchécoslovaquie nuisent et compromettent nos relations avec la Pologne."
poland_r56.22.a:0 "Une proposition intéressante."
poland_r56.22.b:0 "Une proposition absurde."

poland_r56.23.t:0 "La Roumanie accepte notre proposition"
poland_r56.23.d:0 "Józef Beck a réussi à convaincre la délégation roumaine que le maintien des liens entre nos nations serait bénéfique. La signature formelle du traité est déjà en cours."
poland_r56.23.a:0 "Nous partagerons de nombreux avantages ensemble."

poland_r56.24.t:0 "La Roumanie accepte notre proposition"
poland_r56.24.d:0 "Józef Beck a réussi à convaincre la délégation roumaine que le maintien des liens entre nos nations serait bénéfique. La signature formelle du traité est déjà en cours."
poland_r56.24.a:0 "Nous partagerons de nombreux avantages ensemble."

poland_r56.25.t:0 "La Roumanie refuse notre proposition"
poland_r56.25.d:0 "Les pourparlers diplomatiques lors du sommet ont échoué. La Roumanie a rejeté notre offre de coopération accrue."
poland_r56.25.a:0 "C’est leur perte."

poland_r56.26.t:0 "Manœuvres militaires conjointes avec la Pologne"
poland_r56.26.d:0 "Lors d’un récent sommet diplomatique, le ministre polonais des Affaires étrangères, Józef Beck, nous a demandé si nous étions prêts à réaffirmer nos engagements passés en matière de sécurité en organisant des exercices militaires conjoints en Volhynie. Une telle manœuvre permettrait d’assurer la préparation des armées des deux nations."
poland_r56.26.a:0 "Une proposition intéressante."
poland_r56.26.b:0 "Une proposition absurde."

poland.27.t:0 "La Roumanie accepte notre proposition"
poland.27.d:0 "Le haut commandement militaire roumain a accepté d’organiser des manœuvres conjointes dans la voïvodie de Volhynie. Plusieurs unités des deux armées, ainsi que des conseillers étrangers, se réunissent pour les jeux de guerre prévus."
poland.27.a:0 "Nous partagerons de nombreux avantages ensemble."

poland.30.t:0 "La Pologne exige des concessions supplémentaires"
poland.30.d:0 "Malgré nos objections, [From.GetName] nous a informés que leur armée prendra le contrôle direct des chantiers navals de Dantzig. Affirmant que nous interférions avec leur accès à la mer, l’armée polonaise entend faire respecter directement sa volonté. Bien qu’une certaine autonomie locale subsiste, notre gouvernance indépendante est effectivement terminée. Sans surprise, l’annonce est extrêmement impopulaire parmi les habitants de la ville. Comment devons-nous réagir ?"
poland.30.a:0 "Ordonner à la milice de se rendre."
poland.30.b:0 "Ordonner à la milice de résister symboliquement."

poland.31.t:0 "Dantzig se rend"
poland.31.d:0 "Malgré quelques protestations sporadiques, les forces polonaises sont entrées dans la ville sans opposition. Plusieurs chantiers navals et entrepôts sont désormais directement exploités par l’armée."
poland.31.a:0 "C’est notre accès légitime à la mer."

poland.32.t:0 "Dantzig résiste"
poland.32.d:0 "Dans un geste symbolique de défi, la police et la milice de Dantzig ont reçu l’ordre de résister. Des coups de feu sporadiques ont été entendus devant le bureau de poste polonais de Dantzig alors que des tirs étaient échangés entre forces paramilitaires."
poland.32.a:0 "Demander l’intervention de la Société des Nations."
poland.32.b:0 "Ils paieront leurs activités subversives."

poland.33.t:0 "Crise internationale à Dantzig"
poland.33.d:0 "[From.GetName] exige que la Société des Nations règle un différend concernant la Ville libre de Dantzig. Prétendant que l’accès polonais à la mer est compromis par les autorités de Dantzig, [From.GetName] a demandé que le statut de ville internationale libre soit révoqué et que les forces polonaises occupent la ville."
poland.33.a:0 "Voter pour que la Pologne occupe Dantzig."
poland.33.b:0 "Voter pour que Dantzig reste une ville libre."

poland.34.t:0 "[From.GetNameDefCap] nous soutient"
poland.34.d:0 "[From.GetNameDef] a décidé de nous soutenir au sein du conseil de la Société des Nations."
poland.34.a:0 "Leur soutien est bienvenu."

poland.35.t:0 "[From.GetNameDefCap] s’oppose à nous"
poland.35.d:0 "[From.GetNameDef] a décidé de s’opposer à nous au sein du conseil de la Société des Nations et de soutenir le statut de Ville libre de Dantzig."
poland.35.a:0 "Intolérable."

poland.36.t:0 "La Société des Nations vote en notre faveur"
poland.36.d:0 "La Société des Nations a reconnu que notre accès légitime à la mer était violé et nous autorise à occuper la ville."
poland.36.a:0 "Il en est bien ainsi."

poland.37.t:0 "La Société des Nations vote contre nous"
poland.37.d:0 "La Société des Nations a rejeté notre revendication et maintient que Dantzig doit rester une ville internationale libre."
poland.37.a:0 "Nous n’avons d’autre choix que de nous conformer."

poland.38.t:0 "Proposition de projet d’autoroute Berlinka"
poland.38.d:0 "Lors d’une visite à Berlin, le ministre polonais des Affaires étrangères, Józef Beck, a proposé la construction d’une autoroute reliant la Prusse au reste de l’Allemagne. En échange de l’autorisation de faire passer l’autoroute extra-territoriale à travers le territoire polonais, Józef Beck a demandé une aide technique pour d’autres projets dans le Corridor polonais."
poland.38.a:0 "Une proposition intéressante."
poland.38.b:0 "Une proposition absurde."

poland.39.t:0 "L’Allemagne accepte l’autoroute extra-territoriale"
poland.39.d:0 "[From.GetLeader] s’est personnellement intéressé à la proposition d’une autoroute reliant la Prusse au reste de l’Allemagne. La construction devrait commencer bientôt et, en échange, l’Allemagne fournira une assistance volontaire pour d’autres projets de développement dans la région."
poland.39.a:0 "Un choix avisé."

poland.40.t:0 "L’Allemagne rejette l’autoroute extra-territoriale"
poland.40.d:0 "[From.GetLeader] s’est moqué de l’idée proposée et a rejeté la perspective d’une coopération économique dans le Corridor polonais."
poland.40.a:0 "Nous construirons notre propre autoroute de Varsovie à Gdynia à la place."

poland.41.t:0 "Opportunités d’investissement"
poland.41.d:0 "[From.GetLeader] a invité des hommes d’affaires du monde entier à participer à une foire commerciale internationale organisée en Pologne. Cette occasion peut être utilisée pour établir des relations étroites et offrir des incitations à faire des affaires en Pologne."
poland.41.a:0 "Encourager les constructeurs automobiles à investir dans de nouvelles usines."
poland.41.b:0 "Vendre des parts des fabricants d’avions d’État."
poland.41.c:0 "Encourager l’investissement minier et offrir des droits fonciers."

poland.52.t:0 "[Root.GetLeader] s’adresse aux étudiants universitaires"
poland.52.d:0 "Aujourd’hui, devant l’une des universités de Varsovie, [Root.GetLeader] a pris la parole devant une large foule d’adolescents et d’étudiants. [Root.GetLeader] a loué la jeunesse de la nation comme étant la vitalité de [Root.GetName] et a évoqué la mémoire de héros tels que l’aumônier Ignacy Jan Skorupka, mort en menant une charge lors de la défense de Varsovie en 1920. Dans les derniers instants de son discours, [Root.GetLeader] a appelé les étudiants polonais à..."
poland.52.a:0 "prendre de nouveau les armes pour défendre la nation pieuse de Pologne."
poland.52.b:0 "rester forts dans leurs études."

poland.53.t:0 "Grand rassemblement nationaliste"
poland.53.d:0 "Le bastion du parti nationaliste de droite Démocratie nationale se trouvait en Pologne occidentale. Son principal idéologue était Roman Dmowski, soutenu par de nombreux intellectuels polonais, la petite bourgeoisie urbaine, certains éléments de la classe moyenne supérieure et un large mouvement de jeunesse. Au milieu des années 1930, une fracture est apparue entre les anciennes et les nouvelles générations du parti, fragmentant le mouvement nationaliste en plusieurs petits partis successeurs. L’un des plus extrêmes de ces groupuscules nationalistes était le Camp national radical (ONR). L’ONR-Falanga est un parti politique marginal, populaire parmi de petits cercles académiques dans les universités polonaises. Ils ont toujours été considérés comme une nuisance extrémiste par le gouvernement Sanacja, et leurs réunions ont été plusieurs fois dispersées par la police polonaise. Aujourd’hui cependant, ils ont organisé un très grand rassemblement public en défiance du gouvernement Sanacja. Comment devons-nous les gérer ?"
poland.53.a:0 "Ils sont trop populaires. Surveillons la situation."
poland.53.b:0 "Envoyer l’armée pour disperser le rassemblement."

poland.54.t:0 "Grande grève générale"
poland.54.d:0 "Jusqu’à la fin de la Grande Guerre, la Pologne avait été partagée entre l’Allemagne, l’Autriche-Hongrie et la Russie. Après l’indépendance de la Pologne, les régions rurales orientales issues de l’Empire russe et austro-hongrois conservaient un secteur agricole important. La Grande Dépression a particulièrement touché ces régions. Avec un chômage dépassant les 40 % dans certaines zones et la perspective de la faim grandissante, la frustration a souvent nourri le radicalisme. Aujourd’hui, une nouvelle grève a été organisée par le Parti agraire populaire, avec le soutien du Parti socialiste polonais. Elle s’est déjà propagée à plusieurs villes. Sans intervention, la situation pourrait dégénérer."
poland.54.a:0 "Les ignorer."
poland.54.b:0 "Envoyer l’armée pour arrêter les émeutiers."

poland.55.t:0 "Guerre entre l’Allemagne et la Pologne"
poland.55.d:0 "La guerre a éclaté entre l’Allemagne et la Pologne. Il est temps de choisir un camp."
poland.55.a:0 "La réunification avec l’Allemagne est préférable."
poland.55.b:0 "Nous resterons indépendants."

poland.56.t:0 "Dantzig nous trahit"
poland.56.d:0 "La garnison polonaise de Gdańsk a signalé qu’elle était attaquée par des forces paramilitaires, la police et la milice soutenues par le parti nazi local de la ville. Il semble qu’ils aient décidé de rejoindre l’Allemagne."
poland.56.a:0 "Sacrés traîtres."

poland.57.t:0 "Dantzig rejoint [Root.GetNameDef]"
poland.57.d:0 "Nos espions à Dantzig nous ont informés que le gouvernement local soutiendra notre cause. Dantzig n’a jamais vraiment été une ville libre, elle a toujours été l’otage du joug polonais toutes ces années, maintenue sous domination étrangère par la tyrannie de nos ennemis. [DNZ.getleader] a contacté les unités locales et annoncé sa volonté de collaborer avec notre armée, et la population a déjà spontanément accroché nos drapeaux à de nombreuses fenêtres.\nLes Allemands ont assez souffert et ne seront plus jamais séparés."
poland.57.a:0 "Excellent."

poland.58.t:0 "Le corridor polonais appartient désormais à l’Allemagne"
poland.58.d:0 "L’Allemagne a occupé le corridor polonais. Il est temps de décider si nous voulons chercher la réunification. Les habitants espèrent une réunion de leur région séparée de la patrie à la fin de la Grande Guerre."
poland.58.a:0 "La réunification avec l’Allemagne est préférable."
poland.58.b:0 "Nous resterons indépendants."

poland.59.t:0 "Le Front Morges"
poland.59.d:0 "Bien qu’aimé comme le père et protecteur de l’indépendance polonaise, le coup d’État de mai 1926 de Józef Piłsudski contre la Deuxième République ne fut pas approuvé partout. Beaucoup s’opposèrent à ce tournant autoritaire loin de la démocratie, et ceux qui le firent se retrouvèrent souvent marginalisés ou contraints à l’exil politique. Parmi ces opposants, le Front de Morges était une alliance politique de partis centristes de l’entre-deux-guerres. Fondé en 1936 dans le village suisse de Morges par le général Władysław Sikorski et l’ancien Premier ministre polonais et célèbre compositeur Ignacy Paderewski, il comptait parmi ses figures de proue le général Józef Haller et l’ancien vice-Premier ministre Wojciech Korfanty. Leur objectif principal était de restaurer la démocratie, de s’aligner diplomatiquement avec la France et d’élire Wincenty Witos comme Premier ministre et Paderewski comme président."
poland.59.a:0 "Nous accueillons leur retour en politique."

poland.60.t:0 "Une union pour les phalangistes ?"
poland.60.d:0 "Lors d’une longue visite, après avoir parcouru notre pays, [From.GetLeader] nous a demandé de rejoindre un front international destiné à promouvoir les idéaux et intérêts catholiques et phalangistes. Malgré les différences culturelles, [From.GetLeader] pense que les phalangistes des différentes nations devraient s’unir pour instaurer un nouvel ordre mondial."
poland.60.a:0 "Unis sous Dieu, nous tiendrons."
poland.60.b:0 "Nous ne défendons que nos propres intérêts nationaux."

poland.61.t:0 "[From.GetName] accepte"
poland.61.d:0 "Après de longues délibérations, [From.GetLeader] a accepté que [From.GetName] et [Root.GetName] partagent des intérêts communs et doivent se tenir côte à côte sur la scène internationale. Des envoyés diplomatiques sont en route vers Varsovie pour discuter et signer d’autres accords."
poland.61.a:0 "Une issue bénie."

poland.62.t:0 "[From.GetName] refuse"
poland.62.d:0 "Malgré nos nombreuses tentatives, [From.GetLeader] a déclaré qu’il ne voulait pas entraîner [From.GetName] dans des affaires étrangères. Bien qu’intrigué par l’idée, [From.GetLeader] a insisté sur le fait qu’il devait avant tout veiller aux intérêts de [From.GetName]."
poland.62.a:0 "Quelle déception."

poland.63.t:0 "Mission diplomatique en France"
poland.63.d:0 "À la lumière de notre nouvelle orientation diplomatique en faveur de la France plutôt que de la neutralité, une nouvelle mission diplomatique est envoyée. Nous pouvons profiter de cette occasion pour discuter d’un certain nombre de questions bilatérales."
poland.63.a:0 "Demander l’achat de chars légers."
poland.63.b:0 "Proposer l’achat de Madagascar."
poland.63.c:0 "Acheter plutôt les investissements français locaux."

poland.64.t:0 "Offre polonaise d’achat de chars"
poland.64.d:0 "Une délégation diplomatique et militaire polonaise est récemment arrivée. Elle demande l’autorisation de travailler avec un sous-traitant privé afin de produire des chars français à leur usage. Le paiement proposé est conséquent."
poland.64.a:0 "Une offre intrigante."
poland.64.b:0 "Pas d’accord."

poland.65.t:0 "Offre polonaise d’achat de Madagascar"
poland.65.d:0 "Une délégation de la Ligue maritime coloniale polonaise est récemment arrivée. Elle propose d’acheter notre colonie de Madagascar. Le paiement offert est substantiel."
poland.65.a:0 "Une offre intrigante."
poland.65.b:0 "Pas d’accord."

poland.66.t:0 "Contrat français établi"
poland.66.d:0 "Le gouvernement français a accepté de nous permettre de conclure un contrat avec une entreprise privée afin de produire un lot de chars pour notre armée."
poland.66.a:0 "Excellent."

poland.67.t:0 "Acquisition de Madagascar"
poland.67.d:0 "La France a accepté de nous vendre la colonie de Madagascar. Déjà, une expédition dirigée par le major polonais Mieczysław Lepecki a été envoyée pour inspecter la région. Nous devons nous assurer de disposer d’un port international et d’une marine marchande si nous voulons exploiter pleinement ses ressources."
poland.67.a:0 "La Pologne entre dans le club colonial !"

poland.68.t:0 "Proposition rejetée par la France"
poland.68.d:0 "Le gouvernement français a refusé notre offre, que ce soit par crainte de nos intentions, à cause de nos alliés ou par simple méfiance."
poland.68.a:0 "Nous achèterons donc plutôt les investissements français."

poland.70.t:0 "La Droite Sanacja"
poland.70.d:0 "Dans le vide laissé par la mort de Józef Piłsudski et les récentes réformes de la Constitution d’avril, la droite sanacja menée par Edward Rydz-Śmigły a réussi à se hisser au pouvoir en profitant des querelles de l’élite dirigeante.\n\nEdward Rydz-Śmigły est connu dans toute la Pologne comme un commandant talentueux de la guerre polono-soviétique, ayant mené avec succès de nombreuses offensives contre les bolcheviques, dont la prise initiale de Wilno, Dünaburg et, en tant que commandant en chef des forces lettones, la province de Latgale. Alors que la capitale polonaise était assiégée par l’Armée rouge, le Front central, sous son commandement, tint bon lors de la bataille de Varsovie et joua un rôle déterminant dans l’encerclement de l’ennemi.\n\nAprès la guerre, Rydz-Śmigły devint inspecteur général de l’armée polonaise dans le district de Wilno puis de Varsovie. Lors du coup d’État de 1926, il apporta son soutien total à Piłsudski, qui le récompensa en le nommant vice-maréchal pour toutes les affaires concernant l’Est. Selon les dernières volontés de Piłsudski, après sa mort, Rydz-Śmigły fut nommé inspecteur général des forces armées polonaises, la plus haute fonction militaire."
poland.70.a:0 "Revenons au présent."

poland.71.t:0 "Consolidation du gouvernement"
poland.71.d:0 "Walery Sławek marginalisé, Ignacy Mościcki contourné, et de nombreux partisans du Camp de l’unité nationale occupant des postes clés, reste à savoir comment traiter le reste de l’élite dirigeante."
poland.71.a:0 "Conclure un accord de partage du pouvoir avec le président Ignacy Mościcki."
poland.71.b:0 "Dissoudre la Diète et prendre le plein pouvoir."

poland.72.t:0 "Accord de partage du pouvoir"
poland.72.d:0 "Ignacy Mościcki est un allié utile, notamment pour la gestion des affaires économiques du pays, et permet de conserver de nombreux contacts talentueux. Lors d’une grande cérémonie tenue aujourd’hui, le président Mościcki a remis à Edward Rydz-Śmigły le bâton de maréchal, l’élevant au rang spécial qui n’avait été détenu que par Józef Piłsudski. Edward Rydz-Śmigły est désormais le Deuxième Maréchal de Pologne. Une grande partie de l’élite est amère de voir recréé un tel titre, mais elle se rallie à contrecœur. La presse d’État proclame que Rydz-Śmigły est le « deuxième homme de l’État après le président », mais en réalité, le président ne détient plus guère de pouvoir."
poland.72.a:0 "Le nouveau premier soldat de la « République »."

poland.73.t:0 "Dissolution de la Diète"
poland.73.d:0 "Lors d’une session extraordinaire, Edward Rydz-Śmigły annonça que la dissolution du parlement était imminente, mettant de facto fin à la Deuxième République. Il se proclama Deuxième Maréchal de Pologne et affirma qu’il protégerait la nation de toutes menaces. Contrairement à Piłsudski, Rydz-Śmigły déclara qu’il irait jusqu’au bout pour s’assurer que la corruption gouvernementale ne puisse se cacher sous couvert des institutions démocratiques. L’armée, déjà fortement impliquée, prend désormais la direction complète de l’État. Bien que le public soit choqué, la presse d’État compare déjà ce coup d’État à celui de Piłsudski en 1926."
poland.73.a:0 "Le dirigeant du nouvel État polonais."

poland.74.t:0 "Rapport diplomatique"
poland.74.d:0 "Les relations entre le gouvernement polonais et la Ville libre de Dantzig ont longtemps été tendues. Pendant la guerre polono-soviétique et l’embargo allemand de 1925, les dockers de Gdańsk refusèrent à deux reprises de décharger les navires polonais. Ces préoccupations entraînèrent la construction du port voisin de Gdynia. En 1933, la branche locale du NSDAP prit le pouvoir. Les tensions reprirent autour de la séparation de Dantzig de l’Allemagne et du traitement des minorités polonaises.\n\nLors d’une rencontre entre Józef Beck, ministre polonais des Affaires étrangères, et Joachim von Ribbentrop, ministre allemand des Affaires étrangères, un consensus fut trouvé. Hitler ordonna aux autorités nazies locales de cesser leurs actions anti-polonaises. En échange, nous avons promis de ne pas soutenir l’opposition anti-nazie à Dantzig. Bien que le statut de la ville reste incertain, ce rapprochement a produit des résultats positifs."
poland.74.a:0 "Mieux vaut éviter les problèmes internes de Dantzig."

poland.75.t:0 "Rapport sur les relations étrangères"
poland.75.d:0 "Peu après l’arrivée d’Hitler au pouvoir en 1933, Józef Piłsudski fit signer à la Pologne un pacte de non-agression avec l’Allemagne, le 26 janvier 1934. L’Allemagne accepta de reconnaître les frontières existantes et mit fin à la guerre douanière qui durait depuis près d’une décennie. Piłsudski comprit que la France adopterait une posture strictement défensive en cas de guerre, abandonnant ses alliés de l’Est à leur sort. La construction de la ligne Maginot et le refus de faire pression sur l’Allemagne renforcèrent son analyse.\n\nIl se trompa cependant en pensant que ce pacte supprimerait le risque que la Pologne soit la première cible de l’agression allemande. Les efforts diplomatiques allemands semblaient indiquer une préférence pour la Pologne, en tant que partenaire contre l’URSS. Bien qu’il se méfiait d’Hitler, Piłsudski pensait que ses origines autrichiennes adouciraient les relations germano-polonaises, contrairement aux politiciens prussiens violemment anti-polonais. Les relations commerciales s’ouvrirent, mais ces offres amicales n’étaient qu’un leurre destiné à endormir la vigilance polonaise."
poland.75.a:0 "Mais sûrement que nous pouvons éviter la guerre cette fois-ci, non ?"

poland.76.t:0 "Un climat politique changeant"
poland.76.d:0 "En 1938, la situation diplomatique entre l’Allemagne et la Pologne changea radicalement. En octobre 1938, Joachim von Ribbentrop, ministre allemand des Affaires étrangères, exigea que la Ville libre de Dantzig soit rattachée à l’Allemagne, ainsi que la construction d’une autoroute et d’une ligne de chemin de fer à travers le corridor polonais jusqu’en Prusse. En échange, l’Allemagne respecterait les frontières actuelles de la Pologne. Bien que l’idée d’une liaison routière ait déjà été évoquée entre Ribbentrop et Beck, le gouvernement polonais rejeta ces plans par crainte qu’une acceptation n’entraîne de nouvelles exigences et n’érode l’indépendance nationale. Peu après, Hitler formula de nouvelles revendications, exigeant que la Pologne accepte une « consultation allemande sur sa politique étrangère ». Les craintes du gouvernement polonais devinrent réalité."
poland.76.a:0 "Nous avons choisi de céder, mais seulement en échange de leur protection."

poland.77.t:0 "La Pologne cherche à rejoindre l’Axe"
poland.77.d:0 "Le ministre polonais des Affaires étrangères, Józef Beck, nous a informés que le gouvernement polonais était prêt à transférer la Ville libre de Dantzig et à accepter nos consultations sur leur politique étrangère. En échange, la Pologne demande que nous garantissions ses frontières actuelles et que nous signions un pacte la protégeant contre la menace soviétique et tout autre agresseur. Quelle sera notre réponse ?"
poland.77.a:0 "Excellent."
poland.77.b:0 "Nos exigences ne sont pas négociables."

poland.78.t:0 "Le pacte Ribbentrop-Beck"
poland.78.d:0 "Le gouvernement allemand a accepté l’accord. Un nouveau chapitre de notre histoire commence alors que nous lions notre destin à celui de l’Allemagne. Bien que toujours indépendante, la Pologne a accepté de suivre et de coopérer avec la politique étrangère allemande."
poland.78.a:0 "Espérons que nous pourrons encore préserver notre indépendance."

poland.79.t:0 "L’Allemagne refuse"
poland.79.d:0 "Le gouvernement allemand a rejeté notre offre, déclarant que ses exigences n’étaient pas négociables et qu’il ne souhaitait pas signer un pacte l’obligeant à nous venir en aide en cas de guerre. Nous ne pouvons qu’en conclure que nous sommes leur cible immédiate."
poland.79.a:0 "Voilà une raison valable de mobiliser notre armée."

poland.80.t:0 "Relations franco-polonaises"
poland.80.d:0 "Lors de la guerre polono-soviétique, la France envoya une mission militaire de 400 officiers en Pologne. Leurs efforts eurent un impact positif sur l’organisation et la logistique de la jeune armée polonaise. Peu après la guerre, un pacte militaire fut signé pour contenir la double menace allemande et soviétique. La France devait aider économiquement la Pologne, mais n’était pas obligée de déclarer la guerre en cas d’attaque. Avec la menace croissante du réarmement allemand, la convention Kasprzycki-Gamelin fut signée le 19 mai 1939 à Paris, entre le général Tadeusz Kasprzycki, ministre polonais de la Guerre, et Maurice Gamelin, commandant de l’armée française. Les deux pays étaient désormais liés en cas de conflit.\n\nAujourd’hui, nous avons demandé aux Français d’aller plus loin et de frapper préventivement l’Allemagne. [Root.GetLeader] s’est rendu en France pour bâtir un consensus et obtenir leur soutien à une action anticipée."
poland.80.a:0 "Peut-être feront-ils enfin preuve de courage."

poland.81.t:0 "Relations franco-polonaises"
poland.81.d:0 "Lors de la guerre polono-soviétique, la France envoya une mission militaire de 400 officiers en Pologne. Cette mission eut un effet positif sur l’organisation et la logistique de la nouvelle armée polonaise. Peu après la guerre, un pacte militaire fut signé pour contenir la menace allemande et soviétique. La France devait aider économiquement la Pologne, mais n’était pas obligée de déclarer la guerre en cas d’attaque. Avec le réarmement allemand, la convention Kasprzycki-Gamelin fut signée le 19 mai 1939 à Paris, entre le général Tadeusz Kasprzycki et le général Maurice Gamelin. Les deux pays étaient désormais pleinement liés en cas de conflit.\n\nAujourd’hui, nous respecterons ces engagements."
poland.81.a:0 "Il n’y aura pas de « trahison de l’Est »."

poland.82.t:0 "Frapper l’Allemagne préventivement ?"
poland.82.d:0 "Le gouvernement polonais nous a proposé une offensive en plein cœur de l’Allemagne. Inquiets de l’agressivité et du réarmement croissants du Reich, ils souhaitent notre aide pour le ramener à sa juste mesure."
poland.82.a:0 "Une proposition intéressante."
poland.82.b:0 "Absurde."
poland.83.t:0 "La France accepte de riposter"
poland.83.d:0 "Le gouvernement français a approuvé notre vision et commence à mobiliser son armée en préparation."
poland.83.a:0 "Excellent."

poland.84.t:0 "La France recule"
poland.84.d:0 "Le gouvernement français n’a montré aucun intérêt pour la proposition et estime toujours que l’Allemagne peut être gérée par la voie diplomatique."
poland.84.a:0 "Nous attaquerons l’Allemagne seuls."
poland.84.b:0 "Nous garderons plutôt notre armée mobilisée et prête."

poland.85.t:0 "La seconde révolte des cosaques du Don"
poland.85.d:0 "Événement test – incomplet."
poland.85.a:0 "Procéder quand même."

poland.86.t:0 "Le culte du Maréchal"
poland.86.d:0 "Piłsudski lui-même ne s’intéressa jamais à s’élever personnellement ni à créer un mythe autour de son héritage. Une citation célèbre attribuée au défunt Maréchal dit :\n\n« Je ne vais pas vous dicter ce que vous devez écrire sur ma vie et mon œuvre. Je demande seulement que vous ne fassiez pas de moi un pleurnicheur sentimental. »\n\nLe gouvernement Sanacja, toutefois, considéra l’héritage du Maréchal comme un outil de propagande utile. Immédiatement après sa mort, les médias d’État le louèrent comme stratège brillant, homme d’État, visionnaire et père de l’indépendance polonaise. Les enfants des écoles chantaient des chansons et écrivaient des poèmes à sa mémoire, des rassemblements publics et des célébrations furent organisés, des statues et de grandes œuvres d’art furent érigées dans les lieux publics, et la « Fête de l’indépendance polonaise » fut déclarée jour férié en son honneur. Des initiatives publiques visant à renommer rues, villes et régiments militaires à son nom se multiplièrent. En 1938, le parlement polonais alla même jusqu’à rendre illégal tout acte diffamant le nom de Piłsudski. Le culte autour de Piłsudski était particulièrement populaire dans l’armée, et la tradition se poursuivit même au sein de l’Armée en exil à l’Ouest, malgré les objections de Władysław Sikorski et d’autres opposants. Le 19 mars, lendemain de l’anniversaire de Piłsudski, fut déclaré « Jour du Maréchal », au cours duquel les promotions militaires de haut rang étaient publiquement remises."
poland.86.a:0 "Le grand homme issu de la Première Guerre mondiale."

poland.87.t:0 "L’appareil de propagande d’État de Rydz-Śmigły"
poland.87.d:0 "Au départ, Rydz-Śmigły tenta de se présenter comme un homme au-dessus de la politique et des associations politiques ; cependant, avec le temps, il prononça des discours publics de plus en plus politiques et passionnés. La propagande d’État chercha à le présenter comme l’héritier de Piłsudski, et son influence éclipse rapidement celle du président. Affiches, bâtiments publics et panneaux d’affichage le montraient dans une pose athlétique, sa haute stature et son sourire confiant mais doux. À mesure que la perspective de la guerre se rapprochait, sa popularité atteignit son apogée. La propagande d’État — incluant des chants laudatifs, de la poésie et des révélations presque quotidiennes sur sa vie dans la presse — servait à détourner les masses de la grave crise économique qui frappait le pays et des échecs de la nouvelle politique étrangère. La défaite rapide de la Pologne en 1939 fut un choc retentissant pour une population convaincue qu’entre la main guidante de Rydz-Śmigły et l’aide des Alliés de l’Ouest, l’Allemagne serait rapidement vaincue."
poland.87.a:0 "Le « deuxième homme » de l’État."

poland.88.t:0 "Réformes de l’armée de Rydz-Śmigły"
poland.88.d:0 "Événement test – incomplet."
poland.88.a:0 "« Dieu, Honneur, Patrie »\n  – Devise de l’Armée polonaise"

poland.89.t:0 "Réformes de l’aviation de Rydz-Śmigły"
poland.89.d:0 "Malgré la forte industrie aéronautique développée en Pologne et la supériorité aérienne dont la Pologne jouit durant la guerre polono-soviétique, Józef Piłsudski considérait l’armée de l’air comme une fantaisie coûteuse et secondaire. Piłsudski voyait l’armée de terre et la cavalerie comme les forces dominantes du champ de bataille futur et négligea d’investir dans l’aviation. Edward Rydz-Śmigły pensait autrement et estimait que l’aviation jouerait un rôle crucial dans le conflit à venir. Un vaste programme d’investissement dans l’armée de l’air et l’aviation militaire fut rapidement lancé. Le financement de la recherche, de la formation et du soutien fut augmenté ; et avec ces développements, la doctrine polonaise fut révisée afin d’envisager l’aviation comme une force d’intervention rapide en cas de crise, plutôt que comme un simple atout tactique dispersé."
poland.89.a:0 "« Pro Patria Semper »\n  – Devise de l’Armée de l’air polonaise"

poland.90.t:0 "Exportations aéronautiques militaires polonaises"
poland.90.d:0 "En 1933, l’avion de chasse tout en métal PZL P.7a conçu par Zygmunt Puławski fut introduit. Il fut rapidement suivi par les plus évolués PZL P.11a et PZL P.11c, qui figuraient parmi les chasseurs les plus avancés du monde lors de leur entrée en service en 1934 et 1935. Avec la Grande Dépression, les restrictions budgétaires obligèrent à concevoir des modèles destinés à l’exportation pour financer l’armée. Des modèles supplémentaires, tels que les P.11b, P.24A, P.24B, P.24G et le bombardier léger PZL.43 Karaś, aux spécifications supérieures, furent produits exclusivement pour l’export et non pour l’armée polonaise. Des centaines d’appareils furent vendus à l’étranger, notamment en Grèce, au Portugal, en Bulgarie, en Yougoslavie, en Turquie, dans l’Espagne républicaine, en Hongrie et en Roumanie. Même après la capitulation polonaise en 1939, ces avions furent encore utilisés, produits et développés à l’étranger. Lors de l’opération Barbarossa, près de la moitié de la flotte aérienne roumaine était composée d’appareils polonais, et le chasseur national IAR 80 était dérivé du P.24E polonais."
poland.90.a:0 "Peu importe du moment que notre budget reste à l’équilibre."

poland.91.t:0 "La Constitution d’avril"
poland.91.d:0 "Le principal idéologue de la Constitution d’avril était Walery Sławek, et sa rédaction provoqua une controverse entre la gauche sanacja et la faction du Château quant à la présidence. Ses articles introduisaient l’idée que l’État était le bien commun des citoyens, et les pouvoirs du président furent largement étendus aux dépens du Sénat et de la Diète. Le président obtenait le pouvoir de nommer un tiers des sénateurs, le commandant en chef de l’armée polonaise, l’inspecteur général des forces armées, et avait le droit de dissoudre le parlement et de mettre son veto aux lois jugées « non constructives ».\n\nLe président pouvait aussi désigner un successeur en cas d’urgence ou de guerre. Cela constitua la base du gouvernement polonais en exil à l’Ouest. Quand Ignacy Mościcki fut interné en Roumanie alors que la bataille de Pologne faisait encore rage, le général et ambassadeur à Rome Bolesław Wieniawa-Długoszowski fut nommé président de la Pologne. Un jour plus tard, sous la pression de Władysław Sikorski, il abdiqua et lui transmit la présidence. Mais ailleurs, en 1944, les autorités communistes soutenues par l’URSS rejetèrent cette constitution comme invalide et opérèrent sous celle de mars 1921."
poland.91.a:0 "Un système présidentiel ou un autoritarisme ?"

poland.92.t:0 "Ultimatum polonais"
poland.92.d:0 "Le gouvernement polonais a remarqué la montée de l’idéologie d’extrême gauche dans nos frontières. Craignant pour sa propre sécurité, il exige que nous interdisions le communisme dans notre pays et que nous acceptions ses consultations en matière de politique étrangère. Quelle sera notre réponse ?"
poland.92.a:0 "Des exigences déraisonnables."
poland.92.b:0 "Nous devons céder."

poland.93.t:0 "La Roumanie rejette notre ultimatum"
poland.93.d:0 "La Roumanie a refusé nos exigences. Il est désormais possible qu’elle tombe davantage sous l’influence soviétique. Il semblerait que la question ne puisse plus être réglée que par la force des armes."
poland.93.a:0 "Ils ont appelé notre bluff."
poland.93.b:0 "Nous devons intervenir immédiatement."

poland.94.t:0 "La Roumanie accepte nos exigences"
poland.94.d:0 "La Roumanie a accepté nos demandes. Une législation est en cours de rédaction pour interdire le communisme, et son gouvernement a accepté de s’aligner sur notre politique étrangère."
poland.94.a:0 "Excellent."

poland.95.t:0 "Deuxième mission militaire au Japon"
poland.95.d:0 "Ayant un ennemi commun, la Pologne et le Japon entretiennent de longue date des relations cordiales. En 1904, alors que la guerre russo-japonaise faisait rage, Józef Piłsudski se rendit à Tokyo pour proposer son aide dans l’organisation d’une rébellion polonaise contre la Russie. Malgré un intérêt initial, ce plan fut rejeté par le gouvernement japonais sous l’influence de Roman Dmowski, rival de Piłsudski, qui pensait qu’une telle rébellion échouerait et coûterait inutilement des vies polonaises. Avec la création de l’État polonais après la Grande Guerre, le Japon offrit sa coopération diplomatique et aida des Polonais à s’échapper de Russie et de Sibérie. En 1923, juste après la guerre polono-soviétique, une mission militaire fut envoyée au Japon, dirigée par l’ingénieur, cryptologue et officier de renseignement Jan Kowalewski. Durant son séjour, il enseigna aux officiers japonais des cours de renseignement radio et de cryptanalyse. Pour ses efforts, le gouvernement japonais lui décerna l’« Ordre du Soleil levant ».\n\nNous projetons désormais d’envoyer le lieutenant-colonel Jan Kowalewski pour une seconde mission militaire au Japon afin d’offrir une assistance technique plus avancée en matière de cryptanalyse et de décryptage. Que voulons-nous en retour pour cette expertise ?"
poland.95.a:0 "Proposer de rejoindre leur guerre contre l’Union soviétique."
poland.95.b:0 "Demander à rejoindre leur faction."
poland.95.c:0 "Demander une garantie contre une agression soviétique."
poland.95.e:0 "N’offrir que notre assistance technique."

poland.96.t:0 "La Pologne vient à notre aide"
poland.96.d:0 "[From.GetName] nous a informés qu’ils attaqueront l’Union soviétique en même temps que nous. Le lieutenant-colonel Jan Kowalewski, qui fut envoyé en 1923 pour former notre armée au renseignement, revient à Tokyo pour enseigner à nos officiers le décryptage et la cryptanalyse."
poland.96.a:0 "Toute aide est bienvenue."

poland.97.t:0 "La Pologne demande à rejoindre notre faction"
poland.97.d:0 "Un envoyé diplomatique de [From.GetName] a demandé que nous les autorisions à rejoindre notre faction. En échange d’une coopération étroite, ils proposent de renvoyer le lieutenant-colonel Jan Kowalewski, qui avait déjà formé notre armée en 1923, afin qu’il instruise à nouveau nos officiers en cryptanalyse."
poland.97.a:0 "La Pologne et le Japon feront front ensemble."
poland.97.b:0 "Nous préférons éviter de nous lier à eux."

poland.98.t:0 "La Pologne propose une assistance technique en échange d’une garantie"
poland.98.d:0 "Un envoyé diplomatique de [From.GetName] a demandé que nous aidions la Pologne en cas de guerre contre l’Union soviétique. En échange de notre garantie, ils offrent d’envoyer le lieutenant-colonel Jan Kowalewski, qui avait déjà formé notre armée en 1923, pour instruire nos officiers en décryptage et cryptanalyse."
poland.98.a:0 "Une proposition intéressante."
poland.98.b:0 "Nous ne pouvons pas nous permettre d’être entraînés dans une guerre."

poland.99.t:0 "La Pologne nous propose de rejoindre sa faction"
poland.99.d:0 "Un envoyé diplomatique de [From.GetName] a demandé qu’une alliance soit formée pour combattre la menace de [SOV.GetNameDef]. En échange d’une coopération étroite, ils offrent d’envoyer le lieutenant-colonel Jan Kowalewski, qui avait déjà formé notre armée en 1923, pour instruire à nouveau nos officiers en cryptanalyse."
poland.99.a:0 "La Pologne et le Japon feront front ensemble."
poland.99.b:0 "Nous préférons éviter de nous lier à eux."

poland.100.t:0 "La Pologne et le Japon annoncent une alliance"
poland.100.d:0 "Face à leur ennemi commun, l’Union soviétique, la Pologne et le Japon ont annoncé avoir conclu une alliance militaire."
poland.100.a:0 "Un développement intéressant."

poland.101.t:0 "Le Japon refuse notre offre"
poland.101.d:0 "[From.GetNameDef] a décliné. Il semblerait qu’ils ne veuillent pas s’impliquer avec nous malgré nos propositions."
poland.101.a:0 "Quelle déception."

poland.102.t:0 "Le Japon accepte notre offre"
poland.102.d:0 "[From.GetNameDef] a accepté notre offre. Les arrangements formels et la signature du traité sont déjà en cours."
poland.102.a:0 "Excellent."

poland.103.t:0 "Autorisation du programme Prométhée"
poland.103.d:0 "Les agents prométhéens, travaillant avec des dissidents au sein de [SOV.GetNameDef], ont identifié une occasion de porter un coup au régime. Une cible industrielle a été choisie pour une opération de sabotage. Les agents prométhéens attendent des fonds, du matériel et l’autorisation pour exécuter le plan."
poland.103.a:0 "Autoriser la mission."
poland.103.b:0 "Leur ordonner d’attendre pour l’instant."
poland.104.t:0 "Relations polono-tchécoslovaques"
poland.104.d:0 "Durant une grande partie de l’entre-deux-guerres, les relations entre la Pologne et la Tchécoslovaquie furent marquées par de constants conflits frontaliers et tensions. Le Zaolzie, avec ses précieuses mines de charbon et ses liaisons ferroviaires, était disputé par les deux nations. Une brève guerre frontalière éclata, au cours de laquelle la Tchécoslovaquie prit le contrôle de la majeure partie de la région ; cependant, l’intervention des Alliés occidentaux força un retrait. Sous supervision occidentale, des plébiscites ethniques devaient être organisés et le territoire divisé. Les deux nations acceptèrent de se plier aux décisions alliées ; toutefois, avec le déclenchement de la guerre polono-soviétique et l’avancée de l’Armée rouge sur Varsovie, les Alliés craignirent qu’une défaite polonaise ne livre la région aux bolcheviques. La conférence de Spa, en juillet 1920, attribua des terres à la Tchécoslovaquie incluant de fortes populations polonaises mais laissant peu de Tchèques sous autorité polonaise. Cette décision laissa un goût amer aux Polonais locaux, qui se sentirent discriminés par le gouvernement tchèque."
poland.104.a:0 "Nous présenterons nos exigences."

poland.105.t:0 "Exigences polonaises"
poland.105.d:0 "Le ministre polonais des Affaires étrangères, Józef Beck, nous a remis une liste d’exigences. La Pologne réclame la cession du Zaolzie et le partage de la Slovaquie entre la Pologne et la Hongrie. Si nous refusons, la situation mènera à la guerre. Quelle sera notre réponse ?"
poland.105.a:0 "Nous n’avons pas d’autre choix que de céder."
poland.105.b:0 "La mort plutôt que le déshonneur."

poland.106.t:0 "La Tchécoslovaquie cède"
poland.106.d:0 "La Tchécoslovaquie a accepté nos demandes. Nos forces sont entrées dans la zone disputée. Dans les régions frontalières, des foules enthousiastes de minorités polonaises ont accueilli nos soldats. Des célébrations éclatent également dans les villes polonaises pour commémorer l’unification."
poland.106.a:0 "Terre polonaise légitime."

poland.107.t:0 "La Tchécoslovaquie résiste"
poland.107.d:0 "La Tchécoslovaquie a rejeté nos exigences. La question ne peut plus être réglée que par la force des armes. Notre armée se prépare à frapper au cœur de leur territoire."
poland.107.a:0 "Un mauvais choix."

poland.108.t:0 "La Slovaquie du Sud est à nous"
poland.108.d:0 "Avec la Tchécoslovaquie cédant aux exigences polonaises, nos forces ont avancé pour occuper la Slovaquie du Sud, qui compte de nombreux Hongrois."
poland.108.a:0 "Terre hongroise légitime."

poland.109.t:0 "L’invention du détecteur de mines"
poland.109.d:0 "Durant l’entre-deux-guerres, le département de l’artillerie du ministère polonais de la Défense commanda le développement d’un appareil capable de détecter les obus non explosés sur les terrains d’entraînement. La société AVA Radio acheva la conception d’un tel dispositif, mais il ne fut jamais produit à cause de l’invasion de septembre. L’armée polonaise en exil en France réimagina plus tard l’appareil comme détecteur de mines. La version finale fut créée par le lieutenant polonais Józef Kosacki, qui en fit don à l’armée britannique. Ce détecteur portable de mines terrestres fut utilisé pour la première fois lors de la bataille d’El Alamein, où 500 appareils dégagèrent la voie à l’avance de la 8e armée britannique. Au cours de la guerre, plus de 100 000 exemplaires furent produits, et le même modèle resta en service jusqu’à la guerre du Golfe de 1991."
poland.109.a:0 "Expertise polonaise."

poland.110.t:0 "Le Fonds de défense nationale"
poland.110.d:0 "Durant l’entre-deux-guerres, la Pologne était autosuffisante sur le plan agricole, mais ses industries d’État et sa production militaire dépendaient largement d’importations étrangères de matières premières. Ainsi, lorsque la Grande Dépression frappa, les pays du monde dévaluèrent rapidement leurs monnaies ; cependant, la Banque nationale de Pologne maintint un złoty fort. Une monnaie forte aggrava la déflation et réduisit les réserves disponibles pour soutenir l’économie, mais offrit un avantage pour acheter des biens à l’étranger.\n\nPour tirer parti de la situation, le gouvernement polonais créa le Fonds de défense nationale. Des actifs de l’État furent vendus, des dons collectés auprès des citoyens de la diaspora, et des collectes organisées dans le pays afin de lever des capitaux destinés à l’achat de matières premières ou d’armements à l’étranger. Écoles, institutions et paroisses furent encouragées à financer l’achat d’une mitrailleuse, d’une pièce d’artillerie, ou même d’un avion. En 1937, le ministère de la Guerre récolta 2 330 380 złoty et 6 645 tonnes de ferraille. 36 avions, 615 mitrailleuses lourdes, 130 mitrailleuses légères et divers autres armements furent acquis. Le sous-marin ORP Orzeł fut également financé en partie grâce à ces fonds publics. Un décret présidentiel stipula que toutes les propriétés privées pouvaient être réquisitionnées en cas de guerre. Un second décret, en 1938, renforça le contrôle de l’État sur la production agricole et rendit tous les véhicules et le bétail réquisitionnables."
poland.110.a:0 "Réorienter les dépenses depuis le secteur civil."
poland.110.b:0 "Une armée forte est prioritaire."

poland.111.t:0 "Le gouvernement accusé de faiblesse"
poland.111.d:0 "Des protestations ont éclaté dans tout le pays. Qu’elles soient fondées ou non, la population croit fermement que la nation aurait pu facilement remporter une guerre et que l’opinion internationale aurait été de notre côté. L’opposition politique nous accuse de nous être soumis à l’influence allemande et d’avoir trahi le pays."
poland.111.a:0 "Nous ne faisons que gagner du temps."

poland.112.t:0 "La Pologne demande un rapprochement"
poland.112.d:0 "Un gouvernement nationaliste est arrivé au pouvoir en Pologne. Bien qu’agressif dans sa politique étrangère, il est prêt à abandonner ses revendications sur le Zaolzie en échange d’une coopération plus étroite contre l’Allemagne. Quelle sera notre réponse ?"
poland.112.a:0 "Voilà une opportunité intéressante."
poland.112.b:0 "Une alliance avec la Pologne serait une folie."

poland.113.t:0 "La mort de Roman Dmowski"
poland.113.d:0 "Roman Dmowski, le père du mouvement nationaliste polonais, vient de mourir. Plus de 100 000 personnes ont assisté à son cortège funèbre aujourd’hui. Les rues des grandes villes sont remplies de ses partisans politiques en deuil."
poland.113.a:0 "L’Histoire retiendra de lui un fasciste malfaisant."
poland.113.b:0 "Juste un fauteur de troubles de moins."
poland.113.c:0 "C’est sur ses épaules que nous avons bâti notre mouvement."
poland.113.e:0 "Ses contributions seront bien retenues."
poland.113.f:0 "Il sera rappelé comme un héros national."

poland.114.t:0 "La Tchécoslovaquie accepte une alliance"
poland.114.d:0 "[From.GetLeader] a accepté que nos deux nations mettent de côté leurs différends et coopèrent contre de plus grandes menaces potentielles."
poland.114.a:0 "Frères slaves d’armes."

POL_Beck_Molotov_tooltip:0 "§RLa Pologne deviendra un§! §HPuppet§! §Rde [SOV.GetNameDef]§!\n"
POL_Beck_Molotov_tooltip_TFV:0 "§RLa Pologne deviendra un§! §HDominion§! §Rde [SOV.GetNameDef]§!\n"
POL_Beck_Molotov_tooltip_DOD:0 "§RLa Pologne deviendra un§! §HSatellite§! §Rde [SOV.GetNameDef]§!\n"

poland.115.t:0 "La Pologne demande notre protection"
poland.115.d:0 "Dans un revirement soudain de politique étrangère, peut-être par désespoir, la Pologne demande notre soutien et notre protection. Elle est prête à se soumettre à nos consultations diplomatiques et à permettre l’entrée de nos troupes sur son territoire en échange d’une coopération étroite. Quelle sera notre réponse ?"
poland.115.a:0 "Voilà une opportunité intéressante."
poland.115.b:0 "Nous ne sommes pas intéressés."

poland.116.t:0 "[SOV.GetNameDef] accepte"
poland.116.d:0 "[SOV.GetLeader] a accepté notre appel à l’aide. Józef Beck est actuellement à Moscou, et la signature du traité est en cours. Espérons que nous nous réveillerons encore un jour dans une Pologne indépendante."
poland.116.a:0 "Un pacte avec le diable."

poland.117.t:0 "[SOV.GetNameDef] refuse"
poland.117.d:0 "[SOV.GetLeader] a montré peu d’intérêt pour nos appels à l’aide. Il semble que nous devions chercher ailleurs du soutien."
poland.117.a:0 "C’est peut-être mieux ainsi."

poland.118.t:0 "La Pologne demande à nous rejoindre"
poland.118.d:0 "Le gouvernement nationaliste arrivé au pouvoir en Pologne souhaite rejoindre notre fédération unifiée. Bien qu’elle possède une armée puissante, la Pologne entretient de mauvaises relations avec les Allemands et les Soviétiques. Quelle sera notre réponse ?"
poland.118.a:0 "Nous accueillons la Pologne parmi nous."
poland.118.b:0 "Nous ne sommes pas intéressés."

poland.119.t:0 "Alliance polono-italienne"
poland.119.d:0 "[ITA.GetLeader] s’est réjoui de notre volonté de nous unir. La signature d’un traité formel est en cours."
poland.119.a:0 "La Pologne et l’Italie comme frères."

poland.120.t:0 "[ITA.GetNameDef] refuse"
poland.120.d:0 "Malgré notre offre généreuse, il semblerait que les Italiens n’aient que peu d’intérêt à traiter avec nous. [ITA.GetLeader] a rejeté notre demande."
poland.120.a:0 "Nous chercherons ailleurs."

poland.121.t:0 "La ligne Dmowski"
poland.121.d:0 "Roman Dmowski fut ministre polonais des Affaires étrangères dans le gouvernement d’Ignacy Jan Paderewski. Contrairement à Piłsudski, qui pensait que la Pologne devait devenir une fédération multinationale, Dmowski ne voulait que des territoires peuplés de Polonais et n’avait aucun intérêt pour les terres orientales. L’entêtement des nationalistes agaça fortement Piłsudski lorsque Dmowski s’opposa publiquement à l’inclusion de Minsk lors des négociations de paix avec l’URSS.\n\nÀ la conférence de Paris de 1919, la délégation polonaise présenta ses propositions de frontières théoriques pour le nouvel État polonais. Cette proposition fut appelée la ligne Dmowski. Elle regardait vers l’ouest et incluait toute la Haute-Silésie, une partie de la Pomérélie et le sud de la Prusse-Occidentale. Dmowski admit que les revendications polonaises sur la Silésie n’étaient pas solides, mais il les justifia par des arguments économiques et par le fait que la minorité polonaise de la région était très instruite et donc culturellement significative. Malgré le soutien de la France, Dmowski fut déçu par le traité de Versailles, qui plaça la frontière polono-allemande plus à l’est qu’il ne l’espérait. De ces négociations, Dmowski sortit ennemi acharné du Premier ministre britannique David Lloyd George, qu’il accusa d’avoir accepté des pots-de-vin allemands et juifs pour adopter une position défavorable à la Pologne."
poland.121.a:0 "Nous AURONS la Haute-Silésie."

poland.122.t:0 "La Pologne réclame la Haute-Silésie"
poland.122.d:0 "[POL.GetLeader] a dénoncé notre traitement de la minorité polonaise en Haute-Silésie. La Pologne exige que nous cédions immédiatement la région et que nous évacuions nos forces. Un refus entraînera la guerre. Quelle sera notre réponse ?"
poland.122.a:0 "Nous n’avons pas d’autre choix que de céder."
poland.122.b:0 "Alors ce sera la guerre."

poland.123.t:0 "La Haute-Silésie est à nous"
poland.123.d:0 "[From.GetNameDef] a cédé à nos exigences. Nos troupes sont entrées dans la zone disputée et ont pris le contrôle de la région. Des célébrations éclatent parmi les minorités polonaises locales ainsi que dans les villes polonaises."
poland.123.a:0 "Enfin unis."

poland.124.t:0 "[From.GetNameDef] refuse l’ultimatum"
poland.124.d:0 "[From.GetNameDef] a rejeté nos exigences. Il semble que la question ne puisse plus être réglée que par la force."
poland.124.a:0 "Alors ce sera la guerre."
poland.124.b:0 "Nous devons reculer."

poland.125.t:0 "Les phalangistes arrivent au pouvoir"
poland.125.d:0 "Dans un tournant rapide et inattendu, l’ONR-Falanga, importante faction extrémiste issue du mouvement Endecja, a pris le pouvoir, portée par une nouvelle génération de nationalistes polonais. Dans un discours à la Diète, [POL.GetLeader] a présenté sa vision d’un nouveau modèle économique, d’un nouveau système de gouvernance et d’une nation polonaise unie parlant une seule langue et pratiquant une seule religion. Les principes du phalangisme s’apprêtent à s’imposer."
poland.125.a:0 "L’autosuffisance est une priorité absolue."

poland.126.t:0 "La Pologne demande à rejoindre les Alliés"
poland.126.d:0 "Lors d’une récente réunion, le général Tadeusz Kasprzycki, ministre polonais de la Guerre, a proposé un rapprochement. Il propose une alliance militaire complète pour contrer les menaces croissantes pesant sur la paix et la stabilité en Europe. Allons-nous accepter leur adhésion à notre faction ?"
poland.126.a:0 "Nous ferons front uni."
poland.126.b:0 "Ils sont un fardeau."

poland.127.t:0 "La nouvelle alliance franco-polonaise"
poland.127.d:0 "Les négociations entre le général Tadeusz Kasprzycki, ministre polonais de la Guerre, et le général Maurice Gamelin, commandant de l’armée française, ont porté leurs fruits. En élargissant les accords existants, un nouveau pacte fut signé entre les deux nations, les engageant à une assistance militaire mutuelle en cas de guerre."
poland.127.a:0 "Un développement intéressant."

poland.128.t:0 "Rupture des relations franco-polonaises"
poland.128.d:0 "Les négociations entre le général Tadeusz Kasprzycki, ministre polonais de la Guerre, et le général Maurice Gamelin, commandant de l’armée française, ont échoué. Aucun accord sur l’assistance militaire mutuelle n’a pu être trouvé. Pour l’instant, la Pologne a été privée de l’occasion de rejoindre une faction unifiée avec les Alliés occidentaux."
poland.128.a:0 "Un développement intéressant."

poland.129.t:0 "La question de Wilno"
poland.129.d:0 "La Lituanie rompit ses liens diplomatiques avec la Pologne après que le général polonais Lucjan Żeligowski, sur ordre de Józef Piłsudski, organisa une mutinerie en octobre 1920. Il envahit le territoire tenu par les Lituaniens et captura la ville disputée de Vilnius (Wilno en polonais). En janvier 1923, la décision de la Lituanie d’occuper Memel poussa la Société des Nations à attribuer Wilno à la Pologne en mars 1923. Bien que seulement 2 % de la population de Wilno soit lituanophone, la constitution lituanienne revendique toujours Wilno comme capitale. Récemment, un garde-frontière polonais a été abattu à la frontière. Des protestations ont éclaté dans les villes polonaises, réclamant la guerre contre la Lituanie."
poland.129.a:0 "C’est une raison suffisante pour la guerre."
poland.129.b:0 "Envoyer un ultimatum exigeant que la Lituanie renonce à ses revendications et normalise ses relations."
poland.130.t:0 "Ultimatum de la Pologne"
poland.130.d:0 "Sous la menace de guerre, [From.GetNameDef] exige que nous renoncions à nos revendications sur la ville de Vilnius, que nous révisions notre constitution afin de ne plus l’inclure comme notre capitale, et que nous normalisions nos relations. Quelle sera notre réponse ?"
poland.130.a:0 "De meilleures relations avec la Pologne sont préférables."
poland.130.b:0 "Vilnius est légitimement notre capitale."

poland.131.t:0 "La Lituanie cède"
poland.131.d:0 "La délégation lituanienne a accepté nos demandes. Des discussions sont en cours pour ouvrir une ambassade entre les deux nations afin de normaliser de nouveau les relations."
poland.131.a:0 "Excellent."
poland.131.b:0 "Nous devrions aussi leur proposer de rejoindre notre faction."

poland.132.t:0 "La Lituanie reste défiance"
poland.132.d:0 "La délégation lituanienne a rejeté nos demandes. Elle affirme que Wilno est toujours légitimement sa capitale et qu’elle ne cédera pas aux menaces."
poland.132.a:0 "Alors ce sera la guerre."
poland.132.b:0 "Abandonner la question."

poland.133.t:0 "Inviter la Lituanie à notre faction ?"
poland.133.d:0 "Malgré notre animosité récente, la Pologne et la Lituanie partagent de longue date des liens historiques. Avec la question de Wilno réglée et les relations normalisées entre les deux pays, la possibilité d’une coopération militaire est désormais ouverte face à la tempête qui se profile en Europe."
poland.133.a:0 "Ils sont un fardeau."
poland.133.b:0 "Une alliance polono-lituanienne est souhaitable."

poland.134.t:0 "Invitation polonaise à rejoindre leur faction"
poland.134.d:0 "Lors d’une visite diplomatique, [From.GetLeader] a proposé que la Pologne et la Lituanie mettent de côté leurs différends récents et coopèrent pour affronter la situation de plus en plus instable en Europe. [From.GetNameDef] propose une coopération militaire conjointe pour faire face à ces menaces."
poland.134.a:0 "Leur protection vaut mieux que les alternatives."
poland.134.b:0 "On ne peut pas leur faire confiance."

poland.135.t:0 "L’alliance polono-lituanienne"
poland.135.d:0 "[From.GetNameDef] a accepté un rapprochement. La Pologne et la Lituanie se tiennent à nouveau comme amies."
poland.135.a:0 "Unies comme des frères."

poland.136.t:0 "La Lituanie refuse la coopération militaire"
poland.136.d:0 "[From.GetNameDef] a rejeté notre proposition. Il semblerait qu’elle garde encore de la rancune contre nous."
poland.136.a:0 "C’est leur perte."

poland.138.t:0 "Minsk ou la guerre"
poland.138.d:0 "Sous la menace de la force, [From.GetNameDef] exige que nous cédions la ville de Minsk et ses territoires environnants. Ils prétendent que Minsk est une ville historiquement polonaise et qu’ils y ont donc un droit légitime. Quelle sera notre réponse ?"
poland.138.a:0 "Nous n’avons pas d’autre choix que de céder pour l’instant."
poland.138.b:0 "Ridicule."

poland.139.t:0 "[From.GetNameDef] cède Minsk"
poland.139.d:0 "[From.GetLeader] a accepté nos conditions. Nos forces avancent pour occuper la ville de Minsk et y rétablir une nouvelle administration locale."
poland.139.a:0 "Ancien territoire récupéré."

poland.140.t:0 "[From.GetNameDef] rejette l’ultimatum"
poland.140.d:0 "[From.GetLeader] a raillé nos conditions et rejeté nos revendications comme étant trop archaïques. Il semble que la question ne puisse être réglée que par la force des armes."
poland.140.a:0 "Alors ce sera la guerre."
poland.140.b:0 "Ils ont appelé notre bluff."

poland.141.t:0 "La Direction de l’Ukraine"
poland.141.d:0 "À la suite de la Révolution russe, deux États ukrainiens principaux furent formés : la République populaire d’Ukraine occidentale en Galicie orientale et la République populaire ukrainienne à Kiev. Les relations entre les deux se dégradèrent : la première voyait les Polonais comme l’ennemi principal tandis que la seconde voyait en la Pologne un allié potentiel contre les Soviétiques et les armées blanches. En juillet 1919, la Pologne conquit une grande partie de la Galicie et la République populaire d’Ukraine occidentale cessa d’exister. À l’est, la République populaire ukrainienne devint la Direction de l’Ukraine, un corps temporaire jusqu’à l’élection d’un nouveau gouvernement. Symon Petlioura, chef de la Direction, se retira en Pologne et signa une alliance à Varsovie reconnaissant la possession polonaise de la Galicie en échange d’une assistance militaire. Józef Piłsudski voyait l’Ukraine comme un partenaire potentiel dans la réalisation de son projet d’Intermarium, une coalition de nations unies dans une union égalitaire. Au déclenchement de la guerre polono-soviétique, une offensive polonaise avec les deux divisions restantes de Petlioura captura Kiev avant que le cours de la guerre ne s’inverse, menant l’Armée rouge aux portes de Varsovie avant que la marée ne tourne encore. À l’issue de la guerre, la Direction devint un gouvernement en exil basé à Tarnów, sous étroite surveillance polonaise. De nombreux officiers de son armée furent ensuite intégrés dans l’armée polonaise. Après l’assassinat de Symon Petlioura par un agent bolchevique à Paris, la direction passa à Andriy Livytskyi qui poursuivit la coopération avec les autorités polonaises."
poland.141.a:0 "La gloire de l’Ukraine n’est pas encore perdue."

poland.142.t:0 "La reconstitution de l’armée ukrainienne"
poland.142.d:0 "Avec des volontaires, des exilés et d’anciens membres de l’armée populaire ukrainienne, nous avons formé une nouvelle armée pour la Direction. Bien que petite en taille, elle sera utile pour consolider le soutien local si une nouvelle guerre éclate avec l’Union soviétique. Au fur et à mesure que davantage de territoires ukrainiens seront repris, elle croîtra certainement en importance."
poland.142.a:0 "Le nouveau membre de l’Intermarium."

poland.143.t:0 "Appeler le Japon à la guerre ?"
poland.143.d:0 "Le Japon est tenu par l’honneur de venir à notre aide si l’Union soviétique nous déclare la guerre. Voulons-nous invoquer ses engagements ?"
poland.143.a:0 "Nous avons besoin de leur aide."
poland.143.b:0 "Nous pouvons nous en passer."

poland.144.t:0 "[From.GetName] nous appelle à la guerre"
poland.144.d:0 "[SOV.GetNameDef] a déclaré la guerre à [POL.GetNameDef]. Les traités précédents nous obligent à leur venir en aide. Allons-nous les honorer ?"
poland.144.a:0 "Nous respecterons nos engagements."
poland.144.b:0 "Ils sont une cause perdue."

poland.145.t:0 "[From.GetName] refuse ses obligations"
poland.145.d:0 "[JAP.GetNameDef] a refusé notre appel à déclarer la guerre à [SOV.GetName]."
poland.145.a:0 "Il semble que nous soyons seuls…"

poland.146.t:0 "La République des Deux Nations"
poland.146.d:0 "Józef Piłsudski et le gouvernement Sanacja nourrissaient le grand rêve de réformer un jour la République des Deux Nations. Malgré un soutien large parmi diverses factions, le gouvernement lituanien s’opposa fermement à l’idée. Un coup d’État militaire lituanien, soutenu par la Pologne en 1919, échoua même à instaurer un régime ami. Mais avec la zone désormais sous contrôle polonais, une nouvelle administration conjointe est déjà en cours de formation. À travers les villes de Pologne et certains endroits de Lituanie, célébrations et cloches d’églises résonnent en un chœur joyeux pour saluer ce moment historique de réunification."
poland.146.a:0 "Enfin réunis."

poland.147.t:0 "La République polono-lituano-ruthène"
poland.147.d:0 "L’idée d’une république polono-lituano-ruthène, regroupant trois nations égales, remonte au XVIIe siècle, lorsque la Diète polonaise débattit de la création d’un duché de Ruthénie. Bien que la mesure échoua, l’idée réapparut lors de l’insurrection de janvier 1863-1864 contre l’Empire russe. Le gouvernement national polonais clandestin adopta alors les couleurs et symboles des trois nations. Au XXe siècle, Józef Piłsudski espérait que l’offensive de Kiev durant la guerre polono-soviétique mènerait à une union entre la Pologne et l’Ukraine dans le cadre de son projet d’Intermarium. La capture de la ville le 7 mai 1920 semblait presque concrétiser ce rêve ; mais le sort de la guerre tourna, et le projet ne vit jamais le jour. Désormais, avec Kiev officiellement sous tutelle polonaise, le gouvernement Sanacja peut enfin réaliser le rêve du défunt Piłsudski."
poland.147.a:0 "Si Deus Nobiscum quis contra nos."

poland.149.t:0 "La Pologne se détache"
poland.149.d:0 "[POL.GetNameDef] a soudainement déclaré qu’elle allait prendre ses distances avec [GER.GetNameDef]. Il semblerait qu’elle ait perdu foi en notre direction et qu’elle ait trahi notre cause commune. Déjà, des partisans polonais et des éléments nationalistes de l’Armée de l’Intérieur affrontent nos garnisons et la tension monte. Quelle sera notre réponse ?"
poland.149.a:0 "Ils paieront pour leurs activités subversives."
poland.149.b:0 "Nous ne pouvons rien faire."

poland.150.t:0 "La Pologne demande des accords commerciaux élargis"
poland.150.d:0 "Lors d’une récente visite d’État, le ministre polonais des Affaires étrangères Józef Beck a laissé entendre que le gouvernement polonais souhaitait normaliser ses relations avec notre pays et renforcer les liens. Comme mesure de confiance, il propose que les deux nations ouvrent leurs exportations militaires l’une à l’autre. Malgré nos différends passés, devons-nous accepter ce marché ?"
poland.150.a:0 "De meilleures relations commerciales seraient bénéfiques."
poland.150.b:0 "On ne peut pas leur faire confiance."

poland.151.t:0 "[From.GetName] accepte l’accord commercial"
poland.151.d:0 "Le gouvernement tchécoslovaque a accepté d’ouvrir les importations d’armes entre nos deux pays. La signature du traité est en cours. Déjà, les tensions diplomatiques commencent à s’apaiser et à revenir à la normale."
poland.151.a:0 "Une nouvelle ère dans les relations polono-tchécoslovaques."

poland.152.t:0 "[From.GetName] rejette l’accord commercial"
poland.152.d:0 "Toujours méfiant quant à nos intentions, le gouvernement tchécoslovaque a décliné notre offre. Seule une petite part d’exportations sera autorisée. Bien que loin de nos attentes, cela reste un petit progrès."
poland.152.a:0 "Un petit pas à la fois."

poland.153.t:0 "[From.GetNameDef] rejette nos ambitions coloniales"
poland.153.d:0 "[From.GetNameDef] a refusé notre offre. Il semble que nous devions chercher ailleurs pour acquérir des colonies."
poland.153.a:0 "Cela valait la peine d’essayer."

poland.154.t:0 "[From.GetNameDef] nous demande la Tanzanie"
poland.154.d:0 "Devant la Société des Nations, le ministre polonais des Affaires étrangères Józef Beck a déclaré que, puisque la Seconde République de Pologne fut créée en partie à partir des territoires de l’ancien Empire allemand, la Pologne méritait donc une part des anciennes colonies allemandes. En privé, ils nous demandent de leur transférer la colonie africaine de Tanzanie. Ils affirment que des colonies sont nécessaires pour que l’État polonais reste fort et serve de contrepoids aux menaces croissantes en Europe. Ils promettent de nous indemniser. Allons-nous accepter ?"
poland.154.a:0 "Nous vendrons la colonie."
poland.154.b:0 "Ridicule."

poland.155.t:0 "La Tanzanie acquise"
poland.155.d:0 "Le gouvernement britannique a accepté de nous vendre la colonie. Nous avons envoyé une expédition pour explorer la zone et mettre en place une nouvelle administration coloniale. Nous devons nous assurer d’avoir un port international et une marine marchande appropriée si nous voulons exploiter pleinement ses ressources."
poland.155.a:0 "La Pologne entre dans le club colonial !"

poland.156.t:0 "[From.GetNameDef] nous offre sa protection"
poland.156.d:0 "Des représentants de la Ligue maritime et coloniale polonaise demandent que davantage de colons soient autorisés à s’installer et que des unités militaires polonaises soient stationnées dans les ports libériens. En échange d’une coopération plus étroite et de concessions commerciales supplémentaires, ils offrent leurs investissements économiques et leur protection militaire. Sommes-nous intéressés, au prix de notre autonomie ?"
poland.156.a:0 "Une coopération plus étroite avec la Pologne est préférable."
poland.156.b:0 "Nous préférons préserver notre indépendance."

poland.157.t:0 "Le Libéria acquis"
poland.157.d:0 "Malgré les protestations de [USA.GetNameDef], le gouvernement libérien a accepté de se rapprocher et d’accorder des concessions supplémentaires en échange de notre aide économique et militaire."
poland.157.a:0 "La Pologne entre dans le club colonial !"

poland.158.t:0 "Les nationalistes arrivent au pouvoir"
poland.158.d:0 "La coalition BBWR fut initialement créée en partie pour empêcher la Démocratie nationale d’accéder au pouvoir. Cependant, son déclin récent et ses querelles incessantes depuis la mort de Józef Piłsudski ne purent plus empêcher le parti de Roman Dmowski de surfer sur une vague soudaine de soutien populaire au changement. Dénonçant la récente Constitution d’avril comme antidémocratique et honteuse, la nouvelle coalition nationaliste promet de décentraliser les pouvoirs du gouvernement et d’instaurer un nouveau système parlementaire dirigé par le peuple."
poland.158.a:0 "Rendons sa grandeur à la Pologne !"

poland.159.t:0 "La polonisation forcée des minorités"
poland.159.d:0 "La division entre les mouvements Sanacja et Endecja représentait une fracture fondamentale sur la définition de la nation polonaise. Alors que Józef Piłsudski voyait la Pologne comme une coalition diverse de cultures et d’ethnies, les nationalistes de Roman Dmowski considéraient la Pologne avant tout comme une nation de Polonais. Quand la Pologne fut partagée à la fin du XVIIIe siècle, le mouvement nationaliste naquit pour résister à la germanisation des anciennes terres polonaises de l’Ouest. Avec des groupes académiques et littéraires formant la base de la résistance à l’influence étrangère, le mouvement nationaliste polonais se diffusa surtout parmi les classes éduquées et moyennes.\n\nLa Démocratie nationale encourageait les minorités à s’assimiler ou à émigrer. Ses programmes incluaient l’imposition d’une éducation obligatoire à la culture polonaise et des incitations pour que des Polonais s’installent dans les régions non polonophones du pays. L’influence des nationalistes entraîna des tensions et parfois des émeutes raciales parmi les divers groupes ethniques de l’entre-deux-guerres, qui rejetaient ces pressions. Cette violence éparse ne fit que renforcer la conviction de Dmowski que les minorités représentaient une menace pour la stabilité de la Pologne. Sa politique étrangère stipulait que seuls les territoires comptant une population significative de polonophones — nombre d’entre eux vivant en Allemagne — valaient la peine d’être annexés."
poland.159.a:0 "La Pologne est une nation de Polonais."

poland.160.t:0 "La ségrégation des minorités"
poland.160.d:0 "Avec le Camp national-radical solidement au pouvoir, de nouvelles politiques visant à remodeler la société sont mises en œuvre. De plus en plus souvent, des bandes organisées de partisans en uniforme arpentent les villes polonaises, brisant les vitrines et pillant les commerces appartenant à des minorités. Officiellement niées mais secrètement planifiées par le gouvernement, les populations non polonophones sont de plus en plus contraintes de vivre dans des communautés séparées et isolées. Ces actions font partie du projet gouvernemental de créer une Grande Pologne homogène."
poland.160.a:0 "Séparés et inégaux."

poland.165.t:0 "Le Parti socialiste polonais arrive au pouvoir"
poland.165.d:0 "Après des négociations tendues avec le gouvernement Sanacja, des acclamations éclatèrent aux barricades des rues alors que les ouvriers célébraient l’ascension du Parti socialiste polonais au pouvoir. Après une réunion rapide, [POL.GetLeader] fut choisi parmi les hauts responsables du PPS pour diriger le nouvel État socialiste. À l’étranger, des militants et leaders de l’Internationale socialiste et ouvrière prononcèrent des discours publics dans les cafés d’Europe pour féliciter et louer la nouvelle atmosphère politique de la nation polonaise."
poland.165.a:0 "Liberté, Égalité, Justice, Démocratie\n— Slogan du PPS"
poland.166.t:0 "La saisie des avoirs étrangers"
poland.166.d:0 "Avec le Parti socialiste polonais fermement au pouvoir, un comité dirigé personnellement par [POL.GetLeader] a été créé pour délibérer sur les usines et les biens étrangers qui doivent passer sous le contrôle de l’État. Le montant de la compensation est également fixé ; cependant, il est non négociable, au grand désarroi des industriels et capitalistes. Bien que la première vague de transferts soit de petite ampleur, de nombreux investisseurs deviennent de plus en plus nerveux face à de possibles nationalisations futures."
poland.166.a:0 "C’est pour le bien commun."

poland.167.t:0 "Le positivisme polonais et le travail organique"
poland.167.d:0 "Après avoir observé les désastreuses conséquences des insurrections manquées de novembre 1830 et janvier 1863, la faction nationaliste en Pologne considéra que les tentatives de violence ne faisaient qu’entraver la cause de l’indépendance. La destruction des biens polonais et la perte de vies polonaises ne faisaient qu’affaiblir une culture déjà attaquée par les puissances impériales. À une époque marquée par le romantisme, les nationalistes adoptèrent la vision du « travail organique ». La persévérance dans le travail, les contributions artistiques et les découvertes scientifiques étaient vues comme les meilleures méthodes pour préserver la culture et l’intégrité territoriale polonaises. En encourageant les individus à réussir dans leur vie, la culture polonaise prouverait ainsi sa résilience face aux tentatives de conversion.\n\nCette philosophie continua d’être défendue par les partis nationalistes polonais plus modérés au XXe siècle. Lorsque Józef Piłsudski chercha à organiser une rébellion pendant la guerre russo-japonaise, Roman Dmowski se rendit au Japon pour contrecarrer ses plans, convaincu qu’il s’agissait d’un gaspillage de vies. Dans la Deuxième République, Narodowa Demokracja chercha à perpétuer cette tradition du travail organique en prônant le capitalisme de marché, l’investissement dans l’éducation et la préservation culturelle."
poland.167.a:0 "L’éducation est la clé."

poland.168.t:0 "Les brigades ouvrières du PPS"
poland.168.d:0 "Lors de l’invasion de septembre, divers partis politiques en Pologne organisèrent leurs propres efforts indépendants pour soutenir la défense nationale. Parmi les contributions les plus notables du PPS figurait la formation de brigades ouvrières bénévoles pour défendre Varsovie. Avec l’approbation du général Walerian Czuma, les dirigeants du PPS lancèrent des campagnes de recrutement de citoyens pour prendre des pelles et creuser des tranchées et barricades autour de la ville. L’adhésion grimpa rapidement à plusieurs milliers au cours du siège, et leur rôle s’étendit à l’aide aux communications et au renseignement. Leur dévouement fut tel que, lorsque la reddition fut annoncée, beaucoup refusèrent d’obéir et menacèrent de fusiller leurs officiers pour lâcheté."
poland.168.a:0 "« Action socialiste »"

poland.169.t:0 "Les relations sino-polonaises"
poland.169.d:0 "Avec un ennemi commun, la Pologne et le Japon ont longtemps entretenu des relations cordiales. En 1904, alors que la guerre russo-japonaise faisait rage, Józef Piłsudski se rendit à Tokyo pour proposer son aide à l’organisation d’une rébellion polonaise contre la Russie. Malgré un intérêt initial, les autorités japonaises rejetèrent ce plan sur l’insistance de Roman Dmowski, rival juré de Piłsudski, qui pensait qu’il échouerait et coûterait inutilement des vies. Avec la création du nouvel État polonais après la Grande Guerre, le Japon offrit sa coopération diplomatique et aida des Polonais à s’échapper de Russie et de Sibérie. En 1923, juste après la guerre polono-soviétique, une mission militaire fut envoyée au Japon, dirigée par l’ingénieur, cryptologue et officier de renseignement militaire polonais Jan Kowalewski. Durant son séjour, il enseigna aux officiers japonais à Tokyo des cours sur le renseignement radio et la cryptanalyse. Pour ses efforts, le gouvernement japonais lui décerna l’« Ordre du Soleil levant »."
poland.169.a:0 "L’ennemi de mon ennemi est mon ami."

poland.170.t:0 "La Pologne demande à nous rejoindre"
poland.170.d:0 "La nouvelle aile du gouvernement Sanacja, arrivée au pouvoir en Pologne, cherche à former une alliance de convenance. Bien qu’ils possèdent une armée puissante, leurs relations avec certains grands voisins sont tendues. Comment répondre ?"
poland.170.a:0 "Nous accueillons la Pologne dans nos rangs."
poland.170.b:0 "Nous ne sommes pas intéressés."

poland.171.t:0 "Alliance polono-allemande"
poland.171.d:0 "[GER.GetLeader] a exprimé son approbation pour la conclusion d’une alliance militaire entre nos deux nations. La signature d’un traité officiel est en cours."
poland.171.a:0 "La Pologne et l’Allemagne unies."

poland.172.t:0 "[GER.GetNameDef] refuse"
poland.172.d:0 "En dépit de notre offre généreuse, il semble que les Allemands n’aient guère d’intérêt à traiter avec nous. [GER.GetLeader] a snobé notre demande."
poland.172.a:0 "Alors cherchons ailleurs."

poland.173.t:0 "La Pologne demande à nous rejoindre"
poland.173.d:0 "Le gouvernement nationaliste arrivé au pouvoir en Pologne souhaite rejoindre notre alliance militaire. Bien qu’ils possèdent une armée puissante, leurs relations avec certains grands voisins sont tendues. Comment répondre ?"
poland.173.a:0 "Nous accueillons la Pologne dans nos rangs."
poland.173.b:0 "Nous ne sommes pas intéressés."

poland.174.t:0 "Alliance polono-russe"
poland.174.d:0 "[SOV.GetLeader] a exprimé son approbation pour la conclusion d’une alliance militaire entre nos deux nations. La signature d’un traité officiel est en cours."
poland.174.a:0 "Frères slaves d’armes."

poland.175.t:0 "[SOV.GetNameDef] refuse"
poland.175.d:0 "En dépit de notre offre généreuse, il semble que les Russes n’aient guère d’intérêt à traiter avec nous. [SOV.GetLeader] a snobé notre demande."
poland.175.a:0 "Alors cherchons ailleurs."

poland.177.t:0 "Accident d’avion mortel"
poland.177.d:0 "Un avion RWD-9 s’est récemment écrasé en mer Baltique. Les recherches n’ont retrouvé aucun survivant. Tous les passagers ont péri, y compris le général et ancien président de la Ligue maritime et coloniale, Gustaw Orlicz-Dreszer. Des funérailles nationales sont prévues, auxquelles [POL.GetLeader] assistera personnellement, avant que les restes ne soient inhumés dans un mausolée à Gdynia."
poland.177.a:0 "Une grande perte pour la République."

poland.178.t:0 "La milice d’Action socialiste"
poland.178.d:0 "En 1934, le PPS créa des unités paramilitaires pour protéger ses rassemblements contre les gangs nationalistes. La milice d’Action socialiste portait des uniformes bleu marine et prêtait serment d’obéissance absolue au parti. Par le biais de groupes de jeunesse, de syndicats et de l’ouverture ultérieure aux femmes, l’organisation atteignit plus de dix mille membres. Les unités s’entraînaient au combat urbain, au sabotage et à l’espionnage. À l’approche de la Seconde Guerre mondiale, un accord de coopération fut conclu avec l’armée polonaise pour que l’Action socialiste participe à des activités subversives en soutien aux forces armées. Leur expertise du combat urbain servit plus tard de base à la création des Brigades de défense ouvrière pendant le siège de Varsovie, puis dans le groupe de résistance de gauche, la Garde populaire WRN."
poland.178.a:0 "Camaraderie et fraternité d’armes."

poland.190.t:0 "Les grandes manœuvres de Volhynie"
poland.190.d:0 "Durant l’entre-deux-guerres, l’état-major polonais organisa plusieurs exercices militaires dans la voïvodie de Volhynie. Avec la menace de guerre en Europe, le plus grand exercice à ce jour fut organisé, impliquant 60 000 soldats. Dans ce vaste jeu de guerre, les « Rouges » simulaient une avancée depuis l’est, tandis que les « Bleus » devaient l’arrêter. Les manœuvres se terminèrent par une grande cérémonie où les habitants de Lutsk offrirent à l’armée polonaise du matériel militaire financé publiquement dans la région."
poland.190.a:0 "Mieux vaut être prêt."

poland.191.t:0 "Promotions et réaffectations militaires de 1939"
poland.191.d:0 "Avec la promotion de la dernière promotion d’officiers, de nouveaux commandants sont disponibles."
poland.191.a:0 "Compris."

poland.192.t:0 "Promotions et réaffectations militaires de 1938"
poland.192.d:0 "Avec la promotion de la dernière promotion d’officiers, de nouveaux commandants sont disponibles."
poland.192.a:0 "Compris."

poland.196.t:0 "Le gouvernement polonais en exil"
poland.196.d:0 "Afin d’assurer la continuité du gouvernement polonais, le président s’est réfugié à l’étranger. Conformément aux pouvoirs d’urgence accordés par la Constitution d’avril, un successeur intérimaire doit être nommé pour diriger la nation. En ces temps difficiles, trouver un candidat capable de satisfaire les multiples factions querelleuses s’avéra ardu. Dans un souci d’unité, un compromis fut finalement trouvé pour désigner..."
poland.196.a:0 "...celui que les puissances alliées exigent."
poland.196.b:0 "...un leader charismatique."
poland.196.c:0 "...un expert en affaires militaires."

poland.197.t:0 "Réglementation stricte sur le matériel militaire"
poland.197.d:0 "Dans le cadre de son effort de modernisation de l’armée, le maréchal Rydz-Śmigły imposa des exigences strictes à la fabrication des munitions. La tolérance aux défauts fut considérablement réduite, mais au prix d’une augmentation du coût et du temps de production. Ces normes élevées visaient à attirer des acheteurs étrangers pour financer davantage la modernisation de l’armée polonaise ; toutefois, elles dépassaient de loin celles des autres armées européennes et suscitèrent même les critiques de conseillers étrangers.\n\nLa différence de vision apparut lors d’une rencontre entre responsables polonais et français. En voulant impressionner les officiers français avec des armes polonaises de haute qualité à exporter, la délégation française déclina l’achat. Pressés d’expliquer pourquoi, un officier répondit : « La France est tout simplement trop pauvre pour s’offrir de telles armes. » La délégation polonaise repartit fière de sa supériorité technique, tandis que les Français pragmatiques secouaient la tête d’incrédulité."
poland.197.a:0 "L’acier polonais glorieux ???"

poland.199.t:0 "Un front uni du socialisme ?"
poland.199.d:0 "Une délégation du gouvernement socialiste polonais a rencontré plusieurs de nos diplomates aujourd’hui. Elle souhaite discuter de la création d’un front uni entre nations socialistes d’Europe pour combattre l’extrémisme grandissant qui menace le continent. Quelle sera notre réponse ?"
poland.199.a:0 "Une proposition intéressante."
poland.199.b:0 "Nous ne sommes pas intéressés."
poland.200.t:0 "La Suède accepte notre invitation"
poland.200.d:0 "Notre mission diplomatique en Suède a été un succès. Il semblerait qu’eux aussi soient préoccupés par la montée de l’extrémisme qui menace le continent européen. De nouvelles discussions pour définir une stratégie militaire et diplomatique sont en cours entre nos deux nations."
poland.200.a:0 "Nous partagerons de nombreux avantages ensemble."

poland.201.t:0 "La Suède décline notre offre"
poland.201.d:0 "Nos efforts pour convaincre la Suède de former un front uni contre nos voisins agressifs n’ont pas donné de résultats positifs. Il semblerait qu’ils comptent sur leur neutralité pour traverser la tempête à venir."
poland.201.a:0 "Quel malheur."

poland.202.t:0 "Renouveler le pacte de non-agression avec la Pologne ?"
poland.202.d:0 "Une mission diplomatique polonaise a rencontré plusieurs de nos plus hauts diplomates aujourd’hui. Leur objectif : discuter de la perspective d’un renouvellement public de notre pacte de non-agression. Quelle sera notre réponse ?"
poland.202.a:0 "Une proposition intéressante."
poland.202.b:0 "Nous ne sommes pas intéressés."

poland.203.t:0 "Le [SOV.GetName] accepte"
poland.203.d:0 "Les plus hauts diplomates [SOV.GetAdjective] ont accepté de renouveler le pacte de non-agression entre nos deux nations. Une cérémonie publique est prévue pour présenter cette déclaration au monde entier."
poland.203.a:0 "La stabilité de l’Europe de l’Est en bénéficiera grandement."

poland.204.t:0 "Le [SOV.GetName] refuse"
poland.204.d:0 "Les plus hauts diplomates [SOV.GetAdjective] ont refusé de renouveler le pacte de non-agression entre nos deux nations. Voilà un signe inquiétant pour l’avenir de nos relations."
poland.204.a:0 "Nous devons rester vigilants."

poland.205.t:0 "Renouveler le pacte de non-agression avec la Pologne ?"
poland.205.d:0 "Une mission diplomatique polonaise a rencontré plusieurs de nos plus hauts diplomates aujourd’hui. Leur objectif : discuter de la perspective d’un renouvellement public de notre pacte de non-agression. Quelle sera notre réponse ?"
poland.205.a:0 "Une proposition intéressante."
poland.205.b:0 "Nous ne sommes pas intéressés."

poland.206.t:0 "Le [GER.GetName] accepte"
poland.206.d:0 "Les plus hauts diplomates [GER.GetAdjective] ont accepté de renouveler le pacte de non-agression entre nos deux nations. Une cérémonie publique est prévue pour présenter cette déclaration au monde entier."
poland.206.a:0 "La stabilité de l’Europe de l’Est en bénéficiera grandement."

poland.207.t:0 "Le [GER.GetName] refuse"
poland.207.d:0 "Les plus hauts diplomates [GER.GetAdjective] ont refusé de renouveler le pacte de non-agression entre nos deux nations. Voilà un signe inquiétant pour l’avenir de nos relations."
poland.207.a:0 "Nous devons rester vigilants."

poland.208.t:0 "Généraux de l’armée polonaise en exil"
poland.208.d:0 ""
poland.208.a:0 "Compris."

poland.209.t:0 "La Pologne offre sa protection"
poland.209.d:0 "À la suite de la crise des Sudètes, le gouvernement démocratique polonais propose une offre de protection. En échange d’un certain degré de coopération et d’intégration avec leur gouvernement et leur armée, ils sont prêts à nous assister en cas d’invasion hostile. Toutefois, une grande méfiance subsiste encore entre nos deux pays, compte tenu des événements passés. Devons-nous accepter une telle offre ?"
poland.209.a:0 "Nous devons accepter pour notre propre sécurité."
poland.209.b:0 "On ne peut pas faire confiance aux Polonais."

poland.210.t:0 "La Tchécoslovaquie accepte notre protection"
poland.210.d:0 "[CZE.GetLeader] a accepté à contrecœur les conditions de garantie de leur sécurité. Des discussions sont en cours pour établir des liens diplomatiques et militaires plus étroits entre nos deux nations. Les gardes-frontières tchécoslovaques ont reçu l’ordre de laisser passer nos forces, mais une certaine méfiance demeure parmi la population locale."
poland.210.a:0 "Ils ont fait le bon choix."

poland.211.t:0 "La Tchécoslovaquie rejette notre protection"
poland.211.d:0 "Le gouvernement tchécoslovaque a fermement rejeté notre offre. Il semblerait qu’ils se méfient de nos intentions ou doutent de notre capacité à honorer de tels engagements."
poland.211.a:0 "Qu’ils assument leur destin."

poland.212.t:0 "Les pilotes [POL.GetAdjective] forment l’escadrille Kościuszko"
poland.212.d:0 "Prêts à tout pour sauver leur patrie, des pilotes [POL.GetAdjective] ont rejoint nos rangs et sont décidés à poursuivre le combat jusqu’au bout. Ils ont décidé de former l’escadrille Tadeusz Kościuszko, en souvenir du général qui lutta contre les Allemands, les Autrichiens et les Russes dans sa tentative désespérée de sauver son pays de l’occupation étrangère."
poland.212.a:0 "La Pologne n’est pas encore perdue !"

poland.215.t:0 "Crise diplomatique [SOV.GetAdjective]-[POL.GetAdjective]"
poland.215.d:0 "Depuis sa fondation, le [SOV.getNameDefCap] n’a cessé de causer toutes sortes de problèmes à notre nation et à notre peuple en particulier. Après la campagne dévastatrice de 1920, nous avions réussi à protéger l’État polonais du danger extérieur et à conclure des alliances capables de garantir la souveraineté [POL.getAdjective] pour les années à venir. Tout allait bien jusqu’à ces dernières années.\n\nLa conclusion d’un pacte entre la Russie et l’Allemagne, combinée à l’invasion [GER.getAdjective] depuis l’Ouest, fait de nous une cible de choix pour ces bellicistes avides de pouvoir du [SOV.getNameDef]. Leur ministre des Affaires étrangères a déjà appelé à la « révision de tous les accords et traités diplomatiques passés entre les nations [SOV.GetAdjective] et [POL.GetAdjective] » !\n\nAvec nos patrouilles frontalières signalant un nombre croissant de troupes, véhicules et avions [SOV.GetAdjective], il est devenu évident pour tous que leur nation traîtresse se prépare à la guerre. Nous devrons tenir bon sur deux fronts si nous voulons résister à l’assaut des envahisseurs ! Aux armes, frères et sœurs, la Mère-Patrie polonaise vous appelle !"
poland.215.a:0 "Mobiliser les forces pour défendre l’Est !"

poland.216.t:0 "Les [SOV.GetAdjective] déclarent la guerre à la Pologne"
poland.216.d:0 "Le [SOV.getNameDefCap] a déclaré la guerre à notre alliée la Pologne, ouvrant pour elle un second front et plongeant la nation [POL.GetAdjective] dans la stupeur. Nous devons maintenant décider si nous la protégerons également contre cette menace ou si notre garantie ne vaut que contre l’invasion [GER.GetAdjective]."
poland.216.a:0 "Nous devons concentrer nos efforts sur nos autres ennemis."
poland.216.b:0 "C’est inacceptable."
POL_ENG_will_not_be_able_to_call_allies: "[POL.getNameDefCap] ne pourra pas appeler les membres de la faction dans ses guerres."
POL_ENG_unlock_ally_joining: "[POL.getNameDefCap] peut désormais nous appeler, ainsi que les membres de notre faction, dans ses guerres."
### La Pologne royaliste tente d’obtenir la Ruthénie
NSB_poland_monarchist_events.7.t:0 "La question ruthène"
NSB_poland_monarchist_events.7.desc:0 "Avec la Bohême sous notre influence, les Ruthènes se sont déclarés autonomes aux côtés des Slovaques. Tandis que les Slovaques ont obtenu une partie de l’armée tchécoslovaque, les Ruthènes doivent encore organiser une véritable force."
NSB_poland_monarchist_events.7.a:0 "Garantissons simplement leur indépendance afin que les Hongrois n’interviennent pas."
NSB_poland_monarchist_events.7.b:0 "Ils accepteront certainement de nous rejoindre avec un degré d’autonomie plus large."
NSB_poland_monarchist_events.7.c:0 "Envoyer l’armée."
NSB_poland_monarchist_events.7.d:0 "Les Ruthènes ? Bah, ils ne valent pas notre temps."

NSB_poland_monarchist_events.8.t:0 "[POL.GetNameDefCap] exige notre soumission"
NSB_poland_monarchist_events.8.desc:0 "Alors que Prague était en plein tumulte, l’occasion s’est présentée d’obtenir notre indépendance. Néanmoins, nous ne sommes qu’un minuscule territoire entouré de puissances qui veulent nous dominer. Une fois le pouvoir consolidé à Prague, [POL.GetLeader] nous a envoyé ses exigences, nous autorisant à conserver une certaine autonomie en échange de notre soumission à la couronne polono-bohémienne."
NSB_poland_monarchist_events.8.a:0 "C’est toujours mieux que ce que nous offraient les Tchèques."
NSB_poland_monarchist_events.8.b:0 "Nous ne céderons pas notre liberté retrouvée."

NSB_poland_monarchist_events.9.t:0 "[RUT.GetNameDefCap] accepte nos exigences !"
NSB_poland_monarchist_events.9.desc:0 "Les Ruthènes ont accepté notre proposition et consenti à nous céder leur politique étrangère."
NSB_poland_monarchist_events.9.a:0 "La Pologne est plus forte que jamais !"

NSB_poland_monarchist_events.10.t:0 "[RUT.GetNameDefCap] rejette notre compromis !"
NSB_poland_monarchist_events.10.desc:0 "Les [RUT.GetAdjective] ont décidé de refuser notre offre, affirmant qu’ils ne renonceront pas à leurs libertés restaurées."
NSB_poland_monarchist_events.10.a:0 "Envoyez les troupes !"
NSB_poland_monarchist_events.10.b:0 "Ce ne sont que quelques collines de toute façon..."

