POL_Workers_Brigades_tt:0 "Débloque les décisions de §HDéfense Civile§!"
POL_expand_socialist_action_militia:0 "Étendre la Milice d’Action Socialiste"
POL_expand_socialist_action_militia_desc:0 "Les forces armées bénéficieraient grandement du soutien des unités paramilitaires du parti."
POL_expand_socialist_action_militia_tt:0 "§HInfanterie§! :\n    Attaque urbaine : §G+15%§!\n    Défense urbaine : §G+15%§!"
POL_urban_combat_specialization:0 "Spécialisation dans le Combat Urbain"
