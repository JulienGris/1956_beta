 The_destiny_of_azerbaijan_category:0 "Le Destin de l'Azerbaïdjan"
 The_destiny_of_azerbaijan_category_desc:0 "À la croisée des mondes depuis des siècles, le pétrole de Bakou a rendu l'Azerbaïdjan encore plus stratégique que jamais. Après l'échec de la République démocratique, tombée sous les bolcheviks, l'espoir d'une indépendance restaurée survit dans le cœur de certains. Avec notre soutien actif et une contre-attaque décisive contre [SOV.GetNameDef], l'espoir peut renaître et le retour de la souveraineté [AZR.GetAdjective] peut être garanti."
 AZR_liberators:0 "Libérateur de l'Azerbaïdjan"

