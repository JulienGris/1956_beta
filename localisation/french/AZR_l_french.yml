 AZR_event.1.t:0 "Les volontaires veulent rentrer chez eux !"
 AZR_event.1.desc:0 "Les unités de volontaires ont été formées pour combattre [SOV.GetNameDef] et libérer [AZR.GetNameDef]. Avec la défaite de l'État [SOV.GetAdjective], ces volontaires estiment que leur mission est accomplie et souhaitent être renvoyés chez eux."
 AZR_event.1.a:0 "Les convaincre de rester un peu plus longtemps."
 AZR_event.1.b:0 "Dissoudre leur unité."
