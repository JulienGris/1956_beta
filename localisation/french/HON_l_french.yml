###### El Salvador Stuff ######

r56_ELS_coffee_republic:0 "République du café"
r56_ELS_coffee_republic_desc:0 "Le café fut cultivé pour la première fois au Salvador au début du XIXe siècle, pour un usage domestique. Dès le milieu du siècle, son potentiel commercial devint évident, et les graines de la future « République du café » furent semées. Le commerce du café fut monopolisé à la fin du XIXe siècle, entraînant une forte inégalité entre la classe ouvrière et les élites, les fameuses « Quatorze Familles », qui détenaient à elles seules près de 90 % des terres du pays. Cela mit une pression croissante sur la politique intérieure et extérieure. Il y a seulement quatre ans, la situation semblait au bord de l’explosion : les paysans, insatisfaits de leurs maigres salaires et de la dégradation de leurs conditions de vie, accusaient les élites propriétaires terriennes. Ainsi, en janvier 1932, ils lancèrent une révolte qui restera connue sous le nom de « La Matanza ». Bien que brutalement écrasée par le régime militaire, l’esprit de rébellion contre les élites perdure dans le cœur et l’esprit de nombreux Salvadoriens...\n"

HON_socialist_bloc_faction:0 "Bloc socialiste latino-américain"

HON_red_army:0 "Armée rouge [ROOT.GetAdjective]"
HON_spread_communism:0 "Influence communiste hondurienne"
