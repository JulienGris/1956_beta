l_french:
 hon_focus:0 "Arbre de priorités national du Honduras"
 #Nouveau
 HON_internships:0 "Stages"
 HON_internships_desc:0 "Travailler dans la division de défense contre le coup d’État de la United Fruit sera un atout précieux sur le CV de nombreux jeunes."
 HON_empower_domestic_competition:0 "Renforcer la concurrence nationale"
 HON_empower_domestic_competition_desc:0 "Samuel Zemurray a empêché d’autres entreprises de prospérer dans notre pays ; nous avons besoin d’une concurrence saine dans notre économie pour éviter la stagnation."
 r56_HON_empower_domestic_competition:0 "Concurrence nationale"
 HON_protect_our_private_businesses:0 "Protéger les entreprises privées"
 HON_protect_our_private_businesses_desc:0 "Nous devons protéger les entreprises et les biens privés des griffes de l’impitoyable Zemurray !"
 HON_free_our_markets:0 "Libérer nos marchés"
 HON_free_our_markets_desc:0 "Samuel Zemurray doit être renversé. Nous devons établir un État où les entreprises privées ne sont pas soumises à un pouvoir autoritaire, où la liberté du marché prime avant tout !"
 HON_free_other_latin_markets:0 "Libérer d’autres marchés !"
 HON_free_other_latin_markets_desc:0 "Sans marchés libres, les peuples ne sont pas libres. Nous devons donc libérer les marchés mondiaux de la domination communiste et fasciste."
 ANC_name_l:0 "Société contractuelle"
 ANC_name_l_long:0 "Société contractuelle anarcho-capitaliste"
 ANC_name_l_n:0 "Conseils de consommateurs"
 ANC_name_l_n_long:0 "Conseils de consommateurs volontaristes"
 r56_HON_protect_our_private_businesses:0 "Protéger les entreprises privées"
 r56_idea_capitalism_anarchist_society:0 "Société anarcho-capitaliste"
 RTR_AGENCIES_DESC:0 "Les agences de restitution, transfert et recouvrement (RTR) sont des entreprises privées spécialisées dans l’application des lois et la défense. Elles sont engagées par d’autres compagnies de la « Zone de libre entreprise » pour fournir leurs services."
 HON_ANCAP_DESC:0 "Les conseils de consommateurs agissent collectivement pour influencer et réguler les entreprises dans la Zone de libre entreprise. Ils peuvent influencer et engager les agences RTR pour travailler pour eux, consolidant ainsi leur contrôle sur la zone."
 r56_HON_free_other_latin_markets:0 "Libérer d’autres marchés !"
 r56_HON_free_other_latin_markets_desc:0 "Nous devons libérer les marchés de la domination communiste et fasciste !"
 HON_empower_the_consumer_council:0 "Renforcer les conseils de consommateurs"
 HON_empower_the_consumer_council_desc:0 "Les conseils de consommateurs agissent collectivement pour influencer et réguler les entreprises. Ils sont donc le cœur vital de la Zone de libre entreprise. Si nous les soutenons, ils nous aideront en retour à utiliser les agences RTR pour libérer davantage de marchés de la mainmise communiste et fasciste."
 r56_HON_empower_the_consumer_council:0 "Conseils de consommateurs renforcés"
 r56_HON_empower_the_consumer_council_desc:0 "Les conseils de consommateurs agissent collectivement pour influencer et réguler les entreprises dans la Zone de libre entreprise. Ils peuvent contrôler et engager les agences RTR et les mercenaires pour travailler pour eux, ce qui les rend extrêmement influents dans la zone."
 HON_support_the_spanish_monarchy:0 "Soutenir la monarchie espagnole"
 HON_support_the_spanish_monarchy_desc:0 "Ce n’est pas que nous ayons une grande sympathie pour les carlistes. Cependant, nous devons bien sûr soutenir toute possibilité de restaurer la monarchie espagnole, car cela pourrait mener au rétablissement des droits de naissance de Juan III."
 HON_form_honduran_requetes:0 "Former les Requetés honduriens"
 HON_form_honduran_requetes_desc:0 "Plusieurs membres des forces armées honduriennes ont exprimé leur désir d’aider les carlistes dans leur effort de guerre. Pendant leur séjour, ils recueilleront également des informations sur les tactiques utilisées par chaque camp et acquerront une précieuse expérience."
 HON_join_the_fight:0 "Rejoindre le combat carliste"
 HON_join_the_fight_desc:0 "Le meilleur moyen d’assurer une victoire carliste dans la guerre civile espagnole est de se battre aux côtés des Requetés et de vaincre nous-mêmes les autres factions espagnoles."
 HON_continue_the_fight:0 "Une bataille perdue, mais pas la guerre"
 HON_continue_the_fight_desc:0 "Nous avons peut-être perdu la bataille pour l’Espagne, mais nous n’avons pas perdu la guerre ; nous devons nous ressaisir, regagner nos forces et revenir plus puissants !"
 HON_reform_the_spanish_empire:0 "Restaurer l’Empire espagnol"
 HON_reform_the_spanish_empire_desc:0 "Consolidons notre victoire dans la guerre civile espagnole en amorçant la restauration de l’Empire espagnol."
 HON_spanish_millitary_mission:0 "Demander des conseillers espagnols"
 HON_spanish_millitary_mission_desc:0 "L’Espagne abrite de nombreux officiers expérimentés dont le savoir et l’expérience peuvent nous aider à renforcer notre armée."
 HON_renounce_throne_rights:0 "Renoncer aux droits au trône"
 HON_renounce_throne_rights_desc:0 "Avec le monarque légitime d’Espagne au pouvoir, renonçons à nos prétentions au trône afin de renforcer notre empire."
 HON_restore_colonial_suzrenity:0 "Rétablir la suzeraineté coloniale"
 HON_restore_colonial_suzrenity_desc:0 "Nous reconnaissons formellement la suzeraineté espagnole sur notre pays, car elle correspond à un véritable vice-royaume."
 HON_invite_carlists:0 "Inviter les émigrés carlistes"
 HON_invite_carlists_desc:0 "De nombreux dirigeants carlistes ayant fui l’Espagne après la défaite dans la guerre civile possèdent une expertise précieuse pouvant nous aider à atteindre nos objectifs ; nous devons tirer parti de ce phénomène si nous voulons en bénéficier."
 HON_integrate_requetes:0 "Intégrer les Requetés"
 HON_integrate_requetes_desc:0 "Les Requetés carlistes les plus favorables à notre vision devraient être intégrés plus étroitement à nos forces armées. Leur expérience et leur entraînement seront inestimables pour les combats à venir."
 HON_carlist_coup:0 "Coup d’État carliste"
 HON_carlist_coup_desc:0 "Avec le soutien des carlistes récemment arrivés, nous pourrions déposer le prétendant au profit du roi légitime. Vive Xavier Ier !"
 HON_fight_alongside_the_carlists:0 "Combattre aux côtés des carlistes"
 HON_carlist_volunteers:0 "Volontaires carlistes"

 ######## IDÉES ########

 r56_HON_political_instability:0 "Instabilité politique"
 r56_HON_political_instability_desc:0 ""
 r56_HON_indebted_to_the_west:0 "Endetté envers l’Occident"
 r56_HON_indebted_to_the_west_desc:0 ""
 HON_banana_republic:0 "République bananière"
 HON_banana_republic_desc:0 "[ROOT.GetNonIdeologyName] est influencé par la United Fruit Company, qui contrôle une grande partie de l’économie. L’économie [ROOT.GetAdjective] dépend fortement des exportations de bananes, et allouer des ressources à d’autres industries sera difficile."
 HON_better_banana_republic:0 "République bananière"
 HON_better_banana_republic_desc:0 "Le Honduras est sous le contrôle total de la United Fruit Company. L’économie hondurienne dépend toujours des exportations de bananes, mais United Fruit se concentre désormais sur l’amélioration de nos méthodes de production."
 HON_best_banana_republic:0 "République bananière"
 HON_best_banana_republic_desc:0 "Nul ne peut contester l’hégémonie de United Fruit sur l’Amérique centrale, mais nous avons enfin conquis les cœurs et les esprits de la population locale. Nous pouvons au moins prétendre agir dans l’intérêt du peuple tout en réalisant des profits records."
 HON_banana_empire:0 "L’Empire bananier"
 HON_banana_empire_desc:0 "La United Fruit Company détient désormais une part dominante de presque tous les produits agricoles dans le monde et nous avons un quasi-monopole sur les bananes. Notre succès en tant que premier véritable État d’entreprise nous a valu le surnom d’Empire bananier."
 HON_united_fruit_long:0 "United Fruit Company"
 HON_united_fruit:0 "United Fruit"
 HON_american_business:0 "Soutien du monde des affaires [USA.GetAdjective]"
 HON_soviet_assist:0 "Soutien de [SOV.GetNameDef]"
 HON_belize_refused:0 "Offensés par notre offre d’achat du Belize"
 HON_canal_refused:0 "Offensés par notre offre d’achat du canal de Panama"
 HON_banana_boat_payment:0 "Paiement pour le Belize"
 HON_banana_boat_payment_desc:0 "Puisque [ENG.GetNameDef] a accepté notre offre d’achat du Belize, nous leur transférons les bateaux bananiers promis. Cela nuira temporairement à notre capacité de production, mais le Belize est un excellent investissement à long terme."
 HON_banana_boat_payment2:0 "Paiement pour le canal de Panama"
 HON_banana_boat_payment2_desc:0 "Les [USA.GetAdjective] nous ont vendu le canal de Panama, mais ce ne fut pas donné. Nous avons dû leur envoyer une année entière de bateaux bananiers, ce qui a sérieusement affecté nos bénéfices. Cependant, nous réaliserons des profits records une fois qu’Oncle Sam aura eu toutes les bananes qu’il peut manger."
 HON_motorized_discount:0 "Aide de Ford"
 HON_motorized_discount_desc:0 "La Ford Motor Company est désormais présente en Amérique centrale, et son expertise nous permet de produire plus rapidement de l’équipement motorisé."
 HON_convoy_discount:0 "Bateaux bananiers"
 HON_convoy_discount_desc:0 "Les bateaux bananiers sont l’épine dorsale de nos opérations, et nous avons développé des méthodes pour les produire en masse. Grâce à nos économies d’échelle, nous pouvons fabriquer plus de navires que la plupart des grandes puissances."
 HON_sovmission:0 "Mission militaire [SOV.GetAdjective]"
 HON_sovmission_desc:0 "Nos camarades de [SOV.GetNameDef] partagent avec nous leur expertise militaire."
 HON_soviet_spies:0 "Aide du NKVD"
 HON_soviet_spies_desc:0 "[SOV.GetNameDefCap] nous a envoyé des conseillers du NKVD qui améliorent nos capacités de renseignement."
 HON_peoples_war_idea:0 "Tactiques de guérilla"
 HON_peoples_war_idea_desc:0 "Les jungles hostiles d’Amérique centrale rendront difficile le ravitaillement de notre armée en cas d’invasion. Heureusement, nos troupes sont spécialisées dans le combat avec des ressources limitées."
 HON_campo_republic:0 "La République paysanne"
 HON_campo_republic_desc:0 "En confiant le contrôle aux campesinos, nous leur avons permis de développer de nouvelles méthodes de production innovantes. Notre succès a montré au monde que les paysans peuvent accomplir n’importe quoi une fois qu’ils ont saisi les moyens de production."
 HON_ok_banana_republic:0 "République bananière"
 HON_ok_banana_republic_desc:0 "La United Fruit Company influence [HON.GetNameDef], et l’économie dépend fortement des exportations de bananes, rendant difficile l’allocation de ressources à d’autres industries. Cependant, des réformes récentes ont atténué certains des pires effets de ce système économique."
 HON_legacy_carias:0 "Honduras Stronk !"
 HON_legacy_carias_desc:0 "Quand choisir la partie la plus ennuyeuse de l’arbre de priorités finit par payer."
 HON_better_research:0 "Méthodes de recherche améliorées"
 HON_better_research_desc:0 "Grâce aux améliorations du système éducatif [HON.GetAdjective], nous pouvons enfin égaler le progrès technologique des grandes nations."
 HON_infantry_discount:0 "Production d’armes légères"
 HON_infantry_discount_desc:0 "Nos études en matière d’armement nous permettent de produire des armes légères plus efficacement."
 HON_fah:0 "Escuela Militar de Aviación y Fuerza Aérea Hondureña"
 HON_jungle_infantry:0 "Infanterie de jungle"
 HON_jungle_infantry_desc:0 "Entraînement spécial pour rendre nos divisions motorisées et mécanisées efficaces dans la jungle."
 HON_jungle_motor:0 "Infanterie de jungle"
 HON_jungle_motor_desc:0 "Entraînement spécial pour rendre nos blindés efficaces dans la jungle."
 HON_jungle_tanks:0 "Infanterie de jungle"
 HON_jungle_tanks_desc:0 "Entraînement spécial pour rendre nos blindés efficaces dans la jungle."
 HON_monarch_influence:0 "Influence monarchiste"
 HON_monarch_influence_desc:0 "Notre peuple aspire à revenir aux jours glorieux du vice-royaume."
 HON_hacienda_system:0 "Le système des haciendas"
 HON_hacienda_system_desc:0 "Les haciendas sont de grands domaines appartenant à des aristocrates, qui formaient l’épine dorsale de l’économie du vice-royaume de la Nouvelle-Espagne. En revenant à ce système, nous pouvons exporter davantage de biens et restaurer notre noblesse dans toute sa gloire."
 HON_rereconquista:0 "La Réreconquista"
 HON_rereconquista_desc:0 "Nos armées sont prêtes à restaurer l’Empire espagnol dans toute sa splendeur."
 HON_better_hacienda_system:0 "Le système des haciendas"
 HON_better_hacienda_system_desc:0 "Les haciendas sont de grands domaines appartenant à des aristocrates, qui formaient l’épine dorsale de l’économie du vice-royaume de la Nouvelle-Espagne. En revenant à ce système, nous pouvons exporter davantage de biens et restaurer notre noblesse dans toute sa gloire."
 HON_spaninquisition:0 "La Nouvelle Inquisition espagnole"
 HON_spaninquisition_desc:0 "Personne ne s’y attend."
 HON_samuel_diaz_zelaya:0 "Samuel Díaz Zelaya"
 HON_samuel_diaz_zelaya_desc:0 "Samuel Díaz Zelaya est un journaliste hondurien qui a contribué régulièrement aux magazines Tegucigalpa et Diario Comercial. Il est devenu directeur littéraire du magazine Excelsior en 1937, une revue apologétique du régime de Tiburcio Carias."
 HON_lowell_yerex:0 "Lowell Yerex"
 HON_lowell_yerex_desc:0 "Lowell Yerex est né en Nouvelle-Zélande mais a étudié aux États-Unis et servi dans le Royal Flying Corps britannique durant la Grande Guerre. Il a fondé Transportes Aéreos Centro Americanos en 1931, qui est devenu une compagnie aérienne majeure au Honduras."
 HON_juan_manuel_galvez:0 "Juan Manuel Gálvez"
 HON_juan_manuel_galvez_desc:0 "Juan Manuel Gálvez Durón fut ministre de la Guerre, de la Marine et de l’Aviation sous la présidence de Carias, puis il succéda à ce dernier en 1949. Durant sa présidence, il créa la Banque centrale du Honduras, la Banque nationale de développement (aujourd’hui BANDESA), normalisa l’impôt sur le revenu et déclara officiellement le Lempira comme monnaie nationale."
 HON_julio_lozano_diaz:0 "Julio Lozano Díaz"
 HON_julio_lozano_diaz_desc:0 "Julio Lozano Díaz débuta sa carrière à la Rosario Mining Company, où il occupa presque tous les postes administratifs. Il devint ensuite ministre de l’Économie, des Finances et du Crédit public sous Tiburcio Carias, où il renégocia la dette ferroviaire hondurienne avec les créanciers anglais. Il fonda plus tard le PUN et devint président en 1954."
 HON_taca:0 "Compagnie aérienne TACA"
 HON_taca_desc:0 "Transportes Aéreos del Continente Americano fut fondée par Lowell Yerex en 1931 et commença ses opérations avec un seul avion Stinson monomoteur. Elle couvrait tout le territoire hondurien avant de s’étendre au reste de l’Amérique latine. En 1945, TACA déplaça son siège au Salvador, où elle se modernisa et se développa."
 hon_fnh:0 "Ferrocarril Nacional de Honduras"
 hon_fnh_desc:0 "Le chemin de fer national du Honduras fut financé par des dettes contractées auprès du Royaume-Uni et de la France au milieu du XIXe siècle. Cependant, au début du XXe siècle, la United Fruit Company devint le principal financeur des chemins de fer honduriens. Elle reçut des concessions de terres dans le nord du Honduras afin de construire de nouvelles lignes à travers tout le pays."
 HON_rmc:0 "Rosario Mining Company"
 HON_rmc_desc:0 "La Rosario Mining Company de New York et du Honduras fut fondée en 1880 et obtint les droits d’exploitation des gisements miniers près de San Jacinto. Cette société acquit par la suite des parts majoritaires dans plusieurs autres mines au Honduras et finit par détenir des intérêts en Amérique du Nord, en Amérique du Sud et en mer du Nord."
 HON_mateo_ortega:0 "Matteo Ortega"
 HON_salvador_alvarado:0 "Salvador Alvarado"
 HON_gregorio_ferrera:0 "Gregorio Ferrera"
 HON_soviets_gave_guns:0 "Soutient les Campos"
 HON_soviets_no_guns:0 "Ignore les Campos"
 HON_soviet_acceptance:0 "[SOV.GetNameDefCap] soutient notre révolution"
 HON_mirco:0 "Microgestion"
 HON_mirco_desc:0 "Bien que l’expansion de notre entreprise ait défié les attentes internationales, elle ne répond toujours pas aux hautes exigences du président Zemurray. Lors d’une récente réunion, il a déclaré à nos généraux : « Messieurs, vous gâchez ce business depuis bien trop longtemps. Je vais remettre de l’ordre. » et adoptera désormais une approche plus directe."

 HON_army:0 "L’armée [HON.GetAdjective]"
 HON_army_desc:0 "Pour survivre en Amérique centrale, nous devons renforcer notre armée."
 HON_conscription:0 "Soldats [HON.GetAdjective]"
 HON_conscription_desc:0 "Les forces armées [HON.GetAdjective] se relâchent dans leur recrutement. Nous devons rendre le service militaire plus attrayant pour la jeune génération."
 HON_arms:0 "Armes légères"
 HON_arms_desc:0 "De nouvelles armes légères sortent presque chaque année, et nous devons veiller à fournir à nos troupes les meilleures armes possibles."
 HON_arms_2:0 "Armes de soutien"
 HON_arms_2_desc:0 "Nous continuerons à garantir que notre infanterie et nos troupes de soutien disposent d’un équipement de première qualité."
 HON_army_support:0 "Équipement de soutien"
 HON_army_support_desc:0 "Plutôt que d’imiter ou d’acheter du matériel étranger, nous devrions viser à devenir un leader mondial en matière d’armement d’infanterie."
 HON_faster_small_arms:0 "Production d’armes légères améliorée"
 HON_faster_small_arms_desc:0 "Nos efforts pour améliorer l’équipement de notre armée portent leurs fruits, et nous pouvons désormais produire efficacement des armes pour nos divisions d’infanterie."
 HON_tank_effort:0 "Effort blindés"
 HON_tank_effort_desc:0 "La guerre mécanisée est évidemment l’avenir, et nous ne pouvons pas nous permettre d’ignorer ce fait. Améliorons notre technologie des blindés et ajoutons des divisions modernes de chars à nos armées."
 HON_mech_effort:0 "Effort mécanisé"
 HON_mech_effort_desc:0 "Après avoir étudié la technologie des blindés, nos chercheurs ont compris que les unités mécanisées joueront également un rôle décisif dans les guerres futures. Investissons dans la recherche mécanisée et visons à créer une armée entièrement mécanisée."
 HON_special_forces:0 "Créer les forces spéciales [HON.GetAdjective]"
 HON_special_forces_desc:0 "Comme notre armée compte très peu de spécialistes, nous pourrions créer une division de forces spéciales au sein de notre armée."
 HON_special_forces_2:0 "Marines [HON.GetAdjective]"
 HON_special_forces_2_desc:0 "L’Amérique centrale regorge de terrains dangereux ; il serait peut-être plus prudent d’envahir par la mer plutôt que de faire marcher notre armée à travers la jungle. Bien sûr, il nous faudrait une force de marines compétente avant de planifier de telles invasions."
 HON_jungle_training:0 "Forces spéciales de jungle"
 HON_jungle_training_desc:0 "Les forêts tropicales d’Amérique centrale sont parmi les plus denses au monde, et notre armée passera beaucoup de temps dans ces jungles. Nous devrions commencer à entraîner nos troupes à la guerre dans la jungle. Évidemment, nos forces spéciales seraient les candidates idéales pour cette première phase d’entraînement."
 HON_jungle_infant:0 "Infanterie de jungle"
 HON_jungle_infant_desc:0 "Maintenant que nous avons formé nos forces spéciales à opérer dans la jungle, nous pouvons former nos troupes régulières à la guerre en milieu tropical."
 HON_jungle_infant_effect:0 "Débloque §HEntraînement jungle§!\n§HInfanterie\n    Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10%§!\n"
 HON_jungle_moto:0 "Véhicules de jungle"
 HON_jungle_moto_desc:0 "Déplacer nos chars et notre infanterie motorisée à travers la jungle ne sera pas facile, mais notre état-major a mis au point une méthode pour y parvenir. Former nos divisions mobiles à la guerre dans la jungle nous permettra de dominer ce terrain."
 HON_jungle_moto_effect:0 "Débloque §HEntraînement jungle§!\n§HMotorisés\n    Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10%§!\n§HMécanisés\n    Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10%§!\n§HBlindés\n  Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10%§!\n"
 HON_land_doc:0 "Effort terrestre"
 HON_land_doc_desc:0 "Malgré les possibilités croissantes de la guerre aérienne et navale, le combat terrestre reste crucial dans les guerres de demain. Avec de la préparation, nous pouvons éviter de revivre l’enfer des tranchées."
 HON_land_doc_2:0 "Effort tactique"
 HON_land_doc_2_desc:0 "Notre pays n’a pas mené de guerre terrestre depuis des décennies, et notre armée devient complaisante. Nous devons inverser cette tendance en nous concentrant sur la qualité de notre armée."
 HON_land_doc_3:0 "Effort d’instruction"
 HON_land_doc_3_desc:0 "Le champ de bataille a changé pendant l’entre-deux-guerres et au fil des conflits récents. Nous devons constamment réévaluer nos doctrines pour en tenir compte."
 HON_navy:0 "Créer une marine côtière [HON.GetAdjective]"
 HON_navy_desc:0 "Nos côtes sont totalement sans défense pour l’instant et nous sommes vulnérables aux invasions navales. Nous devons rectifier ce problème en créant les infrastructures nécessaires à une force de défense côtière."
 HON_invest_in_subs:0 "Effort sous-marins"
 HON_invest_in_subs_desc:0 "La guerre sous-marine est le développement naval le plus excitant depuis l’invention des torpilleurs. Nous ferions bien de nous protéger contre les sous-marins et de les utiliser contre la flotte ennemie."
 HON_invest_in_subs_2:0 "Effort sous-marins II"
 HON_invest_in_subs_2_desc:0 "La plupart des invasions devant passer par la mer, les loups de l’océan peuvent constituer une ligne de défense puissante. Furtive et chassant en meute, une flotte de sous-marins peut protéger nos routes maritimes."
 HON_invest_in_subs_3:0 "Effort sous-marins III"
 HON_invest_in_subs_3_desc:0 "En perfectionnant nos méthodes de production, nous pouvons construire parmi les sous-marins les plus efficaces du monde !"
 HON_invest_in_destroyers:0 "Effort destroyers"
 HON_invest_in_destroyers_desc:0 "En étudiant la conception et l’utilisation stratégique des sous-marins, nous avons aussi appris à contrer leurs tactiques. Les destroyers seront essentiels pour cela."
 HON_invest_in_cruisers:0 "Effort croiseurs"
 HON_invest_in_cruisers_desc:0 "Avant de se lancer dans la recherche avancée sur les cuirassés, il faut moderniser les croiseurs plus petits."
 HON_invest_in_carriers:0 "Effort porte-avions"
 HON_invest_in_carriers_desc:0 "Les flottes modernes seront centrées sur les porte-avions, non les cuirassés. Si nous voulons dominer les océans, il nous faudra quelques porte-avions."
 HON_invest_in_battleships:0 "Effort cuirassés"
 HON_invest_in_battleships_desc:0 "La nation qui possède le plus de cuirassés régnera sur les océans. Cuirassés et porte-avions représentent l’ancien et le nouveau en matière de supériorité navale."
 HON_naval_doctrines:0 "Doctrines navales améliorées"
 HON_naval_doctrine_desc:0 "Bien qu’avoir une marine moderne soit important, nos navires seront inutiles si nos marins ne savent pas les utiliser. Prenons le temps de former nos officiers aux tactiques navales modernes."
 HON_navy_infrastructure:0 "Infrastructures navales étendues"
 HON_navy_infrastructure_desc:0 "Nous devons moderniser nos installations de production navale et construire davantage de bases navales si nous voulons que notre marine soit compétitive. Lançons un vaste projet de construction pour mettre nos infrastructures navales à niveau."
 HON_airforce:0 "Créer une armée de l’air [HON.GetAdjective]"
 HON_airforce_desc:0 "Comme l’aviation est un domaine nouveau en Amérique centrale, nous pouvons dominer nos voisins en étant l’un des premiers pays de la région à disposer d’une force aérienne."
 HON_aviation:0 "Accent sur les chasseurs"
 HON_aviation_desc:0 "Nous pouvons appliquer certaines avancées de l’ingénierie civile à nos chasseurs pour améliorer leur vitesse, leur rayon d’action et leur altitude maximale. Nous devons nous concentrer sur cela si nous voulons suivre les progrès réalisés ailleurs."
 HON_naval_aviation:0 "Bombardiers navals"
 HON_naval_aviation_desc:0 "Les navires se sont révélés particulièrement vulnérables aux avions. Nous devrions continuer à améliorer cette technologie pour rester en avance sur toute contre-mesure."
 HON_army_aviation:0 "Avions d’appui terrestre"
 HON_army_aviation_desc:0 "Les avions soutenant nos forces terrestres et navales ont constitué un ajout très efficace pour un investissement relativement faible. Ces avions bénéficient maintenant de plusieurs propositions d’amélioration. Nos ingénieurs peuvent développer la prochaine génération d’appareils de soutien."
 HON_army_aviation_2:0 "Accent sur les bombardiers"
 HON_army_aviation_2_desc:0 "Le soutien aérien est une partie intégrante de nos capacités défensives et offensives. Si nous développons des bombardiers plus rapides, plus agiles et plus précis, nous conserverons un avantage dans toute bataille terrestre."
 HON_air_doctrine:0 "Doctrines aériennes améliorées"
 HON_air_doctrine_desc:0 "Même si nous pouvons construire une force aérienne moderne, la plupart de nos pilotes ne savent pas encore utiliser leurs nouveaux avions. Rectifions ce problème en recherchant de nouvelles doctrines aériennes."
 HON_air_bases:0 "Bases aériennes supplémentaires"
 HON_air_bases_desc:0 "Il est difficile de ravitailler les avions en Amérique centrale, surtout quand les infrastructures sont insuffisantes. Construisons davantage de bases aériennes pour améliorer le rayon d’action de notre force aérienne."
 HON_politics:0 "Examiner le climat politique"
 HON_politics_desc:0 "Après que Tiburcio Carias Andino a remporté de justesse l’élection présidentielle de 1932, il a réprimé toute forme d’opposition politique. Désormais, [HON.GetNameDef] se trouve à la croisée des chemins."
 HON_suggest_fascism:0 "Envisager une prise de contrôle totale par United Fruit Company"
 HON_suggest_fascism_desc:0 "La United Fruit Company opère au Honduras depuis 1899, lorsqu’elle a racheté sept producteurs locaux de bananes et commencé à exporter vers La Nouvelle-Orléans. Depuis, elle s’est de plus en plus impliquée dans la politique hondurienne ; il est peut-être temps d’envisager les avantages d’une prise de contrôle totale."
 HON_invite_zemurray:0 "Inviter Samuel Zemurray"
 HON_invite_zemurray_desc:0 "Samuel Zemurray est le chef officieux de la United Fruit Company depuis 1932. Il joue un rôle actif dans la politique hondurienne depuis plus de vingt ans, notamment en organisant un coup d’État qui donna la présidence à Manuel Bonilla. Il s’est dit déçu des performances de Carias et pourrait être convaincu de devenir le prochain président."
 HON_american_support:0 "La communauté d’affaires américaine"
 HON_american_support_desc:0 "Renverser un gouvernement n’est pas gratuit, et nos chances de réussite sont faibles sans le soutien de nos investisseurs. Convainquons-les qu’un État United Fruit permettrait des prix plus bas, plus d’emplois et des profits records."
 HON_united_fruit_coup:0 "Renverser le gouvernement Carias"
 HON_united_fruit_coup_desc:0 "Même si une prise de contrôle par United Fruit semblait folle, nous avons rapidement obtenu le soutien de notre conseil d’administration et de la communauté d’affaires américaine. Il est temps de retirer Carias du pouvoir et d’établir un véritable État d’entreprise. Ce ne sera pas le premier coup d’État sponsorisé par United Fruit au Honduras, mais ce pourrait être le dernier."
 HON_american_arms:0 "Importer des armes [USA.GetAdjective]"
 HON_american_arms_desc:0 "Le récent changement de direction au Honduras avait le soutien du conseil d’administration, mais la population locale n’est pas enchantée. Cependant, plusieurs entreprises d’armement américaines nous ont exprimé leur soutien et offert certains de leurs produits. Il serait prudent d’accepter leur proposition."
 HON_fruit_security:0 "Créer la division de sécurité United Fruit"
 HON_fruit_security_desc:0 "Même si United Fruit employait des gardes armés depuis des années, notre récente expansion nécessite plus de sécurité. Créons une division officielle de sécurité United Fruit, qui embauchera des mercenaires [USA.GetAdjective] pour protéger nos intérêts."
 HON_improved_production:0 "Améliorer nos méthodes de production"
 HON_improved_production_desc:0 "Lorsque nous ne contrôlions que le secteur agricole de l’économie hondurienne, nous n’avions que peu d’intérêt à produire d’autres biens. Cependant, nous devons désormais diversifier nos opérations pour protéger nos intérêts."
 HON_corporate_consolidation:0 "Préparer la consolidation de l’entreprise"
 HON_corporate_consolidation_desc:0 "Maintenant que United Fruit dispose d’une force de défense capable, il est temps de penser à consolider nos avoirs dans d’autres pays. En exerçant des pressions ciblées, nous pouvons établir un contrôle sur l’Amérique centrale. Toutefois, le monde nous verra comme un agresseur, et le gouvernement [USA.GetAdjective] ne pourra plus justifier sa protection."
 HON_take_guatemala:0 "Consolider nos avoirs [GUA.GetAdjective]"
 HON_take_guatemala_desc:0 "Il est temps de placer tous nos actifs d’Amérique centrale sous notre contrôle direct. La United Fruit Company est particulièrement influente au [GUA.GetNameDef], et nous sommes sur le point de signer une concession de 99 ans avec [GUA.GetLeader] pour ouvrir une nouvelle plantation à Tiquisate. Cependant, nous avons désormais une meilleure position de négociation et pouvons exiger le contrôle de tout le pays."
 HON_take_elsalvador:0 "Intégrer [ELS.GetNameDef]"
 HON_take_elsalvador_desc:0 "Maintenant que le Guatemala est entièrement sous notre contrôle, nous pouvons commencer à nous étendre dans le reste de l’Amérique centrale. Notre conseil d’administration suggère que [ELS.GetNameDef] soit la prochaine cible idéale pour une prise de contrôle hostile."
 HON_take_nicaragua:0 "Intégrer [NIC.GetNameDef]"
 HON_take_nicaragua_desc:0 "Maintenant que le Guatemala est entièrement sous notre contrôle, nous pouvons commencer à nous étendre dans le reste de l’Amérique centrale. Notre conseil d’administration suggère que [NIC.GetNameDef] soit la prochaine cible idéale pour une prise de contrôle hostile."
 HON_take_costa_rica:0 "S’étendre au [COS.GetNameDef]"
 HON_take_costa_rica_desc:0 "Le Costa Rica était autrefois le siège de notre concurrent Atlantic Fruit, mais nous les avons poussés à la faillite et racheté leurs actifs en 1912. Cependant, nous n’aurons pas un contrôle total de ces nouveaux avoirs tant que le gouvernement [COS.GetAdjective] ne se sera pas soumis."
 HON_purchase_belize:0 "Acheter le Belize"
HON_purchase_belize_desc:0 "[ENG.GetNameDefCap] a commencé à se concentrer sur le développement d’une économie de guerre, et ils pourraient avoir besoin de davantage de navires. Comme nous pourrions tirer profit de l’acquisition du Belize, nous devrions approcher [ENG.GetNameDef] et leur proposer de l’acheter en échange de nos bateaux bananiers."
HON_take_panama:0 "Incorporer [PAN.GetNameDef]"
HON_take_panama_desc:0 "[PAN.GetNameDefCap] est le dernier pays entre nous et le contrôle total de l’Amérique centrale. Il est temps d’exiger sa soumission."
HON_buy_canal:0 "Acheter le canal de Panama"
HON_buy_canal_desc:0 "Le canal de Panama est l’une des voies maritimes les plus cruciales au monde, et son acquisition réduirait considérablement nos coûts. Approchons le gouvernement [USA.GetAdjective] et proposons de l’acheter en échange d’un immense convoi de nos bateaux bananiers."
HON_irca:0 "Fusionner avec l’IRCA"
HON_irca_desc:0 "Nous produisons à des volumes records, mais nous pourrions bénéficier de davantage d’infrastructures. Heureusement, Minor Keith a proposé une fusion entre les Chemins de fer internationaux d’Amérique centrale et l’United Fruit. Accepter cette fusion reliera plusieurs de nos plantations à des réseaux ferroviaires modernes."
HON_invite_ford:0 "Inviter Ford Motors en Amérique centrale"
HON_invite_ford_desc:0 "Une grande partie de la structure de l’United Fruit s’est inspirée des principes de gestion de Henry Ford, et désormais celui-ci voit notre État comme l’incarnation ultime du management d’entreprise. L’inviter à construire une usine Ford en Amérique centrale pourrait s’avérer très profitable."
HON_great_white:0 "Promouvoir la Great White Fleet"
HON_great_white_desc:0 "La Great White Fleet est une flotte de croisière qui emmène des civils sur diverses propriétés de l’United Fruit et leur montre la face la plus attrayante du travail dans nos plantations. Bien sûr, les touristes n’en voient qu’une petite partie, mais ils repartent avec une perception plus favorable de nos opérations."
HON_banana_boats:0 "Production massive de bateaux bananiers"
HON_banana_boats_desc:0 "Les bateaux bananiers sont les navires que nous utilisons pour transporter les bananes d’Amérique centrale vers le reste du monde. Presque toutes nos activités économiques et sécuritaires reposent sur ces navires, et nous devrions en produire en masse. D’ici quelques années, nos bateaux bananiers surpasseront la flotte marchande de n’importe quelle grande puissance !"
HON_agricola:0 "Fonder l’Escuela Agrícola Panamericana"
HON_agricola_desc:0 "Les travailleurs qualifiés sont difficiles à trouver, surtout si nous recrutons dans la population locale. Cependant, le président Zemurray a tenté de résoudre ce problème en fondant l’Escuela Agrícola Panamericana, une université gratuite spécialisée dans la recherche agricole. Cette institution devrait fournir à notre État des ouvriers compétents pour des générations."
HON_corporate_alliance:0 "Alliance des véritables États corporatifs"
HON_corporate_alliance_desc:0 "Si les idées de Mussolini et d’Hitler furent novatrices, ces États fascistes ont perdu de vue l’essentiel : le profit. Leurs guerres incessantes et leurs lois raciales ont prouvé que nous sommes le seul grand État fasciste capable de gérer son économie correctement. Nous devrions créer une faction et tenter d’unir le monde sous la bannière de la gouvernance d’entreprise."
HON_fruitful_partnership:0 "Un partenariat fructueux"
HON_fruitful_partnership_desc:0 "Le New Deal a affaibli la classe patronale [USA.GetAdjective], et nous ne pouvons plus dépendre de [USA.GetNameDef] comme partenaire commercial. La montée en puissance de [GER.GetNameDefCap] a impressionné nombre de nos administrateurs, et un alignement avec l’Axe pourrait être bénéfique."
HON_go_communist:0 "Raviver le Bloque Obrero Campesino"
HON_go_communist_desc:0 "Le Bloque Obrero Campesino (Bloc ouvrier paysan) fut fondé par Manuel Calix Herrera à la fin des années 1920, mais Carias l’interdit lorsqu’il devint président. Même détruit, beaucoup croient encore en ses idéaux. Réhabilitons le BOC et redonnons le pouvoir à la classe ouvrière."
HON_herrera_jailbreak:0 "Libérer Herrera de prison"
HON_herrera_jailbreak_desc:0 "Manuel Calix Herrera, fondateur du Bloque Obrero Campesino et unique candidat présidentiel du parti, fut capturé par l’United Fruit Company et emprisonné aux Islas de la Bahía après avoir organisé une grève ouvrière. Son leadership est essentiel à notre révolution : organisons son évasion au plus vite."
HON_soviet_support:0 "Chercher un financement [SOV.GetAdjective]"
HON_soviet_support_desc:0 "Le président Carias bénéficie du soutien des propriétaires terriens et de l’United Fruit Company, rendant impossible son renversement par nos seules forces. Cependant, nos camarades de [SOV.GetNameDef] pourraient soutenir notre cause."
HON_peasant_revolution:0 "La révolution campesina"
HON_peasant_revolution_desc:0 "Les campesinos sont agités, et la plupart ont rejoint le BOC. La base de pouvoir de Carias s’effondre : le moment est venu pour la révolution. Renversons les propriétaires terriens, chassons l’United Fruit Company et fondons la première république paysanne du monde !"
HON_seize_plantations:0 "Saisir les plantations de l’United Fruit"
HON_seize_plantations_desc:0 "L’United Fruit Company a trop longtemps exploité notre pays. Nous devons expulser cette entreprise parasite et saisir ses biens. Le contrôle de leurs plantations sera la première étape vers la propriété collective des moyens de production."
HON_collectivization:0 "Collectiviser la propriété privée"
HON_collectivization_desc:0 "Les grandes propriétés privées doivent disparaître. En collectivisant la terre et les moyens de production, nous assurerons une répartition plus juste des richesses et renforcerons la révolution."
HON_five_year_plan:0 "Plan quinquennal [HON.GetAdjective]"
HON_five_year_plan_desc:0 "À l’image de nos camarades soviétiques, nous devons établir un plan quinquennal. Il fixera des objectifs ambitieux pour l’agriculture, l’industrie et l’éducation, afin de transformer radicalement notre société."
HON_establish_a_secret_police_communist:0 "Financer la police secrète"
HON_establish_a_secret_police_communist_desc:0 "Surveiller la population garantira qu’aucune opposition ne vienne entraver nos politiques. Cela nous permettra de poursuivre nos objectifs sans distraction."
HON_peoples_army:0 "L’Armée populaire [HON.GetAdjective]"
HON_peoples_army_desc:0 "Même si le peuple contrôle désormais le pays, la révolution n’est pas encore assurée. La bourgeoisie domine encore nos voisins et les impérialistes gringos ou [ENG.GetAdjective] pourraient nous envahir. Heureusement, de nombreux campesinos s’engagent dans la nouvelle Armée populaire hondurienne pour défendre leur liberté."
HON_soviet_guns:0 "Envoi d’armes [SOV.GetAdjective]"
HON_soviet_guns_desc:0 "[SOV.GetNameDefCap] nous considère comme un allié utile en Amérique, car nous pouvons leur fournir des ressources sans craindre les bombardements [GER.GetAdjective]. Les [SOV.GetAdjective]s nous envoient des armes pour protéger la révolution, en attendant que nous les aidions à notre tour en temps de guerre."
HON_soviet_milmission:0 "Mission militaire [SOV.GetAdjective]"
HON_soviet_milmission_desc:0 "Maintenant que [SOV.GetNameDef] a démontré son soutien à notre révolution, nous pouvons renforcer les liens entre nos deux unions. [SOV.GetNameDefCap] enverra volontiers une mission militaire pour former nos troupes et les préparer à combattre les impérialistes."
HON_liberate_central:0 "Guerres de libération d’Amérique centrale"
HON_liberate_central_desc:0 "Le Honduras n’est pas le seul pays d’Amérique centrale opprimé par la bourgeoisie. Chacun de nos voisins est contrôlé par les propriétaires terriens et les intérêts gringos. Unissons l’Amérique centrale et libérons les campesinos opprimés !"
HON_liberate_mexico_again:0 "Frapper vers le nord"
HON_liberate_mexico_again_desc:0 "Notre révolution ne doit pas s’arrêter aux frontières de l’Amérique centrale. Le Mexique, malgré sa révolution passée, reste sous la domination d’élites corrompues. Marchons vers le nord et rallumons la flamme révolutionnaire !"
HON_support_the_prc:0 "Soutenir l’APL"
HON_support_the_prc_desc:0 "Les communistes chinois combattent depuis plus d’une décennie pour renverser la dictature de [CHI.GetLeader]. Leur popularité grandit chaque jour. Nous devrions soutenir leurs efforts et les aider à unir la mère patrie chinoise !"
HON_support_the_indochinese_communists:0 "Soutenir les communistes indochinois"
HON_support_the_indochinese_communists_desc:0 "Les Vietnamiens et leurs camarades d’Indochine subissent l’oppression du gouvernement impérialiste français et de ses alliés. Comme leur mouvement s’aligne sur notre idéologie, nous devrions parrainer leur guerre de libération et libérer les opprimés !"
HON_a_call_to_arms:0 "Révolution mondiale"
HON_a_call_to_arms_desc:0 "La révolution ne saurait triompher dans un seul pays. Appelons tous les peuples opprimés à se soulever et à abattre l’impérialisme et le capitalisme, où qu’ils se trouvent !"
HON_destroy_fascism_communist:0 "Éradiquer le fascisme"
HON_destroy_fascism_communist_desc:0 "Le fascisme est l’ultime arme de la bourgeoisie. Pour préserver la révolution, nous devons détruire ce fléau partout où il se manifeste."
HON_against_imperialism:0 "À bas l’impérialisme !"
HON_against_imperialism_desc:0 "Les impérialistes gringos et européens pillent encore le monde. Notre révolution doit être le fer de lance de la lutte contre eux."
HON_study_soviet_tactics:0 "Étudier les tactiques soviétiques"
HON_study_soviet_tactics_desc:0 "Nos camarades soviétiques ont acquis une expérience militaire précieuse. En étudiant leurs tactiques, nous pourrons améliorer notre armée et préparer nos propres guérilleros à la victoire."
HON_liberate_guatemala:0 "Libérer les campesinos [GUA.GetAdjective]"
HON_liberate_guatemala_desc:0 "Depuis trop longtemps, le Guatemala est opprimé par l’United Fruit Company et son gouvernement bourgeois. Il est temps d’y propager la révolution et de garantir la liberté de ses campesinos !"
HON_borderwar_with_belize_communist:0 "Libérer [311.GetName]"
HON_borderwar_with_belize_communist_desc:0 "Le Belize reste un avant-poste colonial de l’impérialisme. Nous devons le libérer et mettre fin à la domination étrangère."
HON_borderwar_with_canal_communist:0 "S’emparer du canal"
HON_liberate_salvador:0 "Libérer le Salvador"
HON_liberate_salvador_desc:0 "[ELS.GetNameDefCap] possède un gouvernement particulièrement répressif, et son peuple appelle à la libération. Répondons à cet appel et intégrons les paysans salvadoriens dans notre république."
HON_liberate_nicaragua:0 "Propager la révolution au Nicaragua"
HON_liberate_nicaragua_desc:0 "[NIC.GetNameDefCap] est gouverné par les Somoza, qui dirigent le pays comme un syndicat du crime. Nous devons les renverser et les juger pour leurs crimes contre les campesinos nicaraguayens !"
HON_liberate_costarica:0 "Collectiviser le Costa Rica"
HON_liberate_costarica_desc:0 "Le gouvernement bourgeois [COS.GetAdjective] est moins sévère que celui du Nicaragua, mais les campesinos travaillant dans ses plantations souffrent encore. Propageons la révolution au Costa Rica et libérons les ouvriers de ses plantations de café !"
HON_liberate_panama:0 "Détruire l’oligarchie [PAN.GetAdjective]"
HON_liberate_panama_desc:0 "Même si le Panama se prétend démocratie, il est dirigé par une oligarchie de propriétaires terriens et de bourgeois. Nous devons abattre ce régime corrompu pour libérer l’Amérique centrale."
HON_land_reform:0 "Réforme agraire"
HON_land_reform_desc:0 "Pendant la majeure partie de l’histoire du Honduras, presque toutes les terres productives furent contrôlées par les grands propriétaires ou par des compagnies étrangères comme l’United Fruit Company. Aujourd’hui, nous allons démanteler chaque grand domaine et le distribuer parmi les campesinos. Le peuple pourra désormais posséder la terre qu’il a cultivée avec acharnement."
HON_soviet_intel:0 "Inviter des conseillers du NKVD"
HON_soviet_intel_desc:0 "Les impérialistes pourraient frapper à tout moment, et nous devons nous préparer à une telle attaque. Malheureusement, notre service de renseignement est relativement inefficace, et nous ne disposons d’aucun moyen de savoir si la bourgeoisie prépare une offensive. Toutefois, nos amis de [SOV.GetNameDef] accepteraient d’envoyer des conseillers du NKVD afin d’améliorer nos capacités de renseignement."
HON_collective_agriculture:0 "Méthodes agricoles collectives"
HON_collective_agriculture_desc:0 "Après que les campesinos ont pris le contrôle des plantations, ils ont développé des méthodes améliorées de production. Cela nous a permis de nourrir notre population et d’envoyer les excédents à nos camarades à l’étranger."
HON_peoples_war:0 "Développer les tactiques de guérilla"
HON_peoples_war_desc:0 "Même si nous ne pouvons vaincre les armées impérialistes en rase campagne, nous pourrions les user au fil du temps. Toutefois, il nous faudra trouver un moyen d’approvisionner nos troupes dans ce terrain difficile avant de mener une véritable guerre de guérilla. Formons notre armée afin qu’elle puisse combattre même sans accès à des ravitaillements."
HON_peoples_university:0 "L’Université populaire d’Amérique centrale"
HON_peoples_university_desc:0 "La bourgeoisie d’Amérique centrale s’est toujours peu souciée d’éduquer les campesinos, ce qui a conduit une grande partie de notre population à l’analphabétisme. Notre révolution a apporté l’éducation aux masses, et une nouvelle institution d’enseignement supérieur nous permettra de poursuivre ce programme éducatif."
HON_honduran_red_army:0 "Armée rouge hondurienne"
HON_honduran_red_army_desc:0 "Une armée révolutionnaire digne de ce nom doit défendre notre république. L’Armée rouge hondurienne sera le bouclier du peuple et le glaive de la révolution."
HON_socialist_block:0 "Créer une alliance de nations socialistes"
HON_socialist_block_desc:0 "Même si nous devons beaucoup de notre succès au soutien [SOV.GetAdjective], il serait imprudent de nous aligner totalement sur les staliniens. Créons plutôt un bloc indépendant et invitons toutes les véritables nations socialistes à nous rejoindre."
HON_join_soviets:0 "Rejoindre le Komintern"
HON_join_soviets_desc:0 "Depuis sa création, le [SOV.GetAdjective] a soutenu notre révolution, et nous sommes désormais prêts à rejoindre le Komintern. Ensemble, nous porterons le socialisme dans les hémisphères oriental et occidental !"
HON_campesino_republic:0 "La République paysanne d’Amérique centrale"
HON_campesino_republic_desc:0 "Nous avons libéré les peuples d’Amérique centrale et instauré un État paysan capable de rivaliser avec les impérialistes. Notre production collective s’est révélée plus efficace que tout ce que les capitalistes pourraient concevoir, nous permettant de bâtir une excellente base industrielle. De là, nous pourrons libérer toute l’Amérique latine, voire mettre les impérialistes gringos à genoux."
HON_status_quo:0 "Renforcer la présidence Carias"
HON_status_quo_desc:0 "[HON.GetNameDefCap] est techniquement une démocratie sous Carias, même si le gouvernement actuel est plus autoritaire que la plupart des démocraties occidentales. [HON.GetNameDefCap] n’offre peut-être pas le meilleur système, mais les alternatives sont trop dangereuses. Ne changeons rien et consolidons la position de Carias."
HON_appoint_brooks:0 "Nommer le colonel Brooks"
HON_appoint_brooks_desc:0 "La toute récente École militaire d’aviation manque de direction, mais les liens du président Carias avec [USA.GetNameDef] ont permis de trouver un candidat viable. Le colonel Brooks, mercenaire [USA.GetAdjective], sera qualifié pour diriger notre nouvelle académie aéronautique."
HON_stabilize_economy:0 "Stabiliser l’économie"
HON_stabilize_economy_desc:0 "La Grande Dépression a nui aux exportations honduriennes, et le chômage explose. Le président peut toutefois promulguer certaines réformes pour stabiliser l’économie. Si ce n’est pas une solution miracle, cela pourrait nous épargner les pires effets de la crise."
HON_liberal_amnesty:0 "Amnistier le Parti libéral"
HON_liberal_amnesty_desc:0 "Même si le Parti communiste reste interdit, le président Carias est prêt à tolérer une certaine opposition du Parti libéral. Leur programme n’est pas si différent de celui de Carias, et nous pourrions paraître plus démocratiques en accordant l’amnistie aux libéraux ayant participé au soulèvement de 1935."
HON_fortifications:0 "Défendre la nation"
HON_fortifications_desc:0 "Le Honduras restera probablement neutre dans la guerre à venir, mais il serait prudent de renforcer nos défenses. [GER.GetNameDefCap] ou [JAP.GetNameDef] pourraient chercher à utiliser notre territoire comme base d’invasion de [USA.GetNameDef]. Construire quelques forts devrait les dissuader."
HON_better_industry:0 "Matériel agricole amélioré"
HON_better_industry_desc:0 "Notre secteur industriel en est encore à ses débuts, et la plupart des investissements étrangers vont à l’agriculture. Toutefois, nous pouvons améliorer l’état de l’économie [HON.GetAdjective] en investissant dans la recherche en agriculture industrielle."
HON_against_axis:0 "Unir le peuple contre le fascisme"
HON_against_axis_desc:0 "[USA.GetNameDefCap] rejoindra probablement la guerre contre l’Axe, et ils nous demanderont sans doute de les assister. Utilisons les médias pour dénoncer les puissances de l’Axe et rendre notre participation à cette guerre mondiale acceptable pour nos citoyens."
HON_join_allies:0 "Soutenir [USA.GetNameDef]"
HON_join_allies_desc:0 "[USA.GetNameDefCap] est entré en guerre après l’attaque de Pearl Harbor et attend de ses alliés latino-américains qu’ils déclarent la guerre à [GER.GetNameDef] et contribuent à l’effort de guerre. Montrons à [USA.GetNameDef] que nous sommes des alliés fiables et joignons-nous à leur combat."
HON_usa_naval_bases:0 "Bases navales [USA.GetAdjective]"
HON_usa_naval_bases_desc:0 "Les [USA.GetAdjective] nous ont proposé de construire une nouvelle base navale dans notre pays pour soutenir leur effort de guerre plus efficacement. Ils prévoient d’aménager ce port à Trujillo afin de contrer les sous-marins [GER.GetAdjective] opérant dans les Caraïbes. Aidons les [USA.GetAdjective] à protéger la mer en leur permettant de bâtir cette base."
HON_usa_naval_doctrine:0 "Tactiques navales [USA.GetAdjective]"
HON_usa_naval_doctrine_desc:0 "Même si [USA.GetNameDef] ne s’attend pas à ce que nous envoyions beaucoup de soldats, ils espèrent que nous pourrons les aider à défendre leur navigation contre la guerre sous-marine de l’Axe. Pour couler quelques sous-marins, les [USA.GetAdjective] ont proposé de former nos officiers de marine aux tactiques les plus récentes."
HON_carias_legacy:0 "L’héritage du président Carias"
HON_carias_legacy_desc:0 "Les historiens auront du mal à évaluer l’héritage de Tiburcio Carias Andino. S’il a réprimé la plupart des oppositions politiques et combattu les syndicats [HON.GetAdjective], il a assuré une certaine stabilité à l’économie [HON.GetAdjective] pendant la Grande Dépression. Toutefois, son népotisme et sa complaisance envers les intérêts étrangers ont affaibli les institutions démocratiques du Honduras, et il faudra du temps avant que ce pays n’accède à une véritable démocratie."
HON_examine_industry:0 "L’économie [HON.GetAdjective]"
HON_examine_industry_desc:0 "L’économie [HON.GetAdjective] repose largement sur les exportations, en particulier les fruits comme les bananes. Cependant, le pays possède le potentiel de bâtir une base industrielle, même si cela doit se faire à partir de rien."
HON_build_infra1:0 "Construire de nouvelles routes"
HON_build_infra1_desc:0 "[HON.GetNameDefCap] est paralysé par la faiblesse de ses infrastructures, mais la construction de nouvelles routes devrait résoudre ce problème. Relions les villes et plantations de [HON.GetNameDef] à un réseau routier national pour fluidifier notre économie."
HON_build_milfact1:0 "Créer une industrie d’armement"
HON_build_milfact1_desc:0 "L’économie [HON.GetAdjective] étant centrée sur les exportations agricoles, peu d’incitations existaient pour développer une industrie d’armement. Mais l’armée [HON.GetAdjective] a besoin d’équipement, et nous devons bâtir une base industrielle capable de l’approvisionner."
HON_build_civfact1:0 "Développer une base industrielle"
HON_build_civfact1_desc:0 "[HON.GetNameDefCap] importe la majorité de ses biens industriels, mais cela doit changer si nous voulons une économie autosuffisante. Construisons de nouvelles usines dans l’un de nos États."
HON_build_milfact2:0 "Étendre notre industrie d’armement"
HON_build_milfact2_desc:0 "Créer une industrie d’armement était une excellente première étape, mais nous devons désormais accroître notre production militaire pour rivaliser avec le reste du monde."
HON_build_infra2:0 "Relier la nation"
HON_build_infra2_desc:0 "Nos infrastructures doivent rattraper la croissance de notre base industrielle. Construisons de nouvelles routes et lignes ferroviaires pour relier notre pays. Une fois l’effort accompli, nous pourrons acheminer nos produits à travers la jungle sans difficulté."
HON_build_docks1:0 "Créer une industrie navale"
HON_build_docks1_desc:0 "Puisque notre économie dépend en grande partie du transport maritime, nous devons construire une marine afin de protéger nos intérêts. Heureusement, notre base industrielle est désormais assez développée pour soutenir la production de navires militaires."
HON_new_university:0 "Université nationale autonome du Honduras"
HON_new_university_desc:0 "L’Universidad Nacional Autónoma de Honduras, ou Université nationale autonome du Honduras, fut fondée en 1847, ce qui en fait la plus ancienne université du pays. Nous devrions consacrer une part plus importante de notre budget à son entretien afin d’en faire la meilleure institution d’enseignement supérieur d’Amérique latine."
HON_build_civfact2:0 "Étendre notre base industrielle"
HON_build_civfact2_desc:0 "L’industrialisation de [HON.GetNameDefCap] est sur la bonne voie, mais nous pourrions bénéficier de nouvelles usines. Développons davantage notre base industrielle et faisons de [HON.GetNameDef] un exportateur notable de biens manufacturés."
HON_tech_industry:0 "Créer une industrie électronique"
HON_tech_industry_desc:0 "[HON.GetNameDefCap] doit continuer à diversifier son économie s’il souhaite rester compétitif. Engageons-nous à développer nos connaissances en électronique et commençons à produire des biens de haute technologie."
HON_build_milfact3:0 "Le complexe militaro-industriel"
HON_build_milfact3_desc:0 "La production militaire [HON.GetAdjective] est enfin suffisante pour orienter notre économie vers l’armement. À ce stade, nous pouvons établir un véritable complexe militaro-industriel dans notre nation, ce qui ne manquera pas d’avoir quelques conséquences imprévues à l’avenir."
HON_improved_research:0 "Méthodes de recherche améliorées"
HON_improved_research_desc:0 "Grâce à une expansion significative de notre système éducatif, nous pouvons rattraper le reste du monde. Toutefois, des investissements supplémentaires dans l’éducation devraient nous permettre de développer des technologies encore plus rapidement et même de surpasser certaines grandes puissances."
HON_power_research:0 "Excellence technologique"
HON_power_research_desc:0 "Notre domination sur l’Amérique centrale a fait de nous une grande puissance, mais notre technologie reste en retard. Développons nos capacités de recherche en doublant notre financement de la science et de l’éducation."
HON_suggest_monarchy:0 "Nostalgie impériale"
HON_suggest_monarchy_desc:0 "Notre pays décline depuis son indépendance vis-à-vis de l’Espagne, et quelques voix marginales suggèrent de restaurer la vice-royauté de la Nouvelle-Espagne. Cette idée peut paraître folle, mais les événements en Espagne nous montrent que le véritable roi d’Espagne a besoin d’un nouveau trône."
HON_invite_juan:0 "Inviter l’Infant Juan"
HON_invite_juan_desc:0 "Alors qu’il espérait succéder à son père comme roi d’Espagne, l’Infant Juan sait désormais que son couronnement est peu probable. Offrons-lui le trône du Honduras et la perspective de restaurer la vice-royauté de la Nouvelle-Espagne."
HON_monarchist_coup:0 "Coup d’État monarchiste"
HON_monarchist_coup_desc:0 "Maintenant que l’Infant Juan est revenu d’Espagne, renversons le président Carias. Nous pourrons couronner l’Infant Juan en tant que Juan Ier et préparer la restauration de la vice-royauté de la Nouvelle-Espagne. Notre nouveau roi est le seul Juan capable de redonner à la vice-royauté sa gloire passée."
HON_spanish_guns:0 "Armes espagnoles"
HON_spanish_guns_desc:0 "Bien que son couronnement en Espagne fût peu probable, Juan conservait de nombreux partisans. Si notre roi le demande, ils pourraient investir leurs espoirs – et leurs armes – dans [HON.GetNameDef]."
HON_kings_finest:0 "L’élite du roi"
HON_kings_finest_desc:0 "Pour que Juan Ier consolide son trône, nous devons créer une garde royale afin de nous protéger des démocrates, des communistes et des anciens territoires de la vice-royauté. Heureusement, de nombreux jeunes hommes de [HON.GetNameDef] sont prêts à mourir pour le roi et la patrie."
HON_haciendas:0 "Restaurer le système des haciendas"
HON_haciendas_desc:0 "De nombreuses compagnies internationales de [HON.GetNameDef] ont établi leurs plantations comme de véritables haciendas. Toutefois, leurs profits vont aux capitalistes plutôt qu’à la couronne. Inversions cette tendance en restaurant un système d’haciendas et en transférant les plantations à notre aristocratie."
HON_restoration_wars:0 "Les guerres de restauration"
HON_restoration_wars_desc:0 "Nous devons reconquérir la majorité des terres de l’ancienne vice-royauté de la Nouvelle-Espagne avant de pouvoir en proclamer la restauration. Retrouver les frontières de 1820 sera notre premier pas vers la gloire impériale."
HON_reclaim_salvador:0 "Récupérer le Salvador"
HON_reclaim_salvador_desc:0 "Bien que le Salvador n’ait été qu’une petite partie de la vice-royauté, il demeurait une composante précieuse de la Capitainerie générale du Guatemala. Récupérons le Salvador pour la couronne et intégrons-le à notre royaume."
HON_reclaim_nicaragua:0 "Récupérer le Nicaragua"
HON_reclaim_nicaragua_desc:0 "Le Nicaragua fut une partie intégrante de la Capitainerie du Guatemala, et nous devons le conquérir si nous voulons rétablir la vice-royauté de la Nouvelle-Espagne. Saisissons le Nicaragua et plaçons-le sous le contrôle de notre noblesse."
HON_reclaim_guatemala:0 "Récupérer le Guatemala"
HON_reclaim_guatemala_desc:0 "Le Guatemala était la capitale de la Capitainerie du Guatemala et notre porte d’entrée pour rétablir le cœur de la Nouvelle-Espagne, le Mexique. S’emparer du Guatemala est une étape essentielle pour réaliser nos ambitions."
HON_reclaim_belize:0 "Les Britanniques sont distraits – Prenons le Belize"
HON_reclaim_belize_desc:0 "La perfide Albion prit le Belize aux Espagnols lorsqu’elle autorisa des pirates à s’y installer, reconnaissant pleinement la colonie en 1786. La couronne espagnole tenta de le reprendre lors de la bataille de St. George’s Caye en 1798, mais échoua à cause des ruses britanniques. Cependant, les [ENG.GetAdjective] semblent aujourd’hui préoccupés par leur guerre, et c’est peut-être le moment idéal pour reprendre le Belize."
HON_reclaim_costarica:0 "Récupérer le Costa Rica"
HON_reclaim_costarica_desc:0 "Le Costa Rica constituait la frontière sud de la vice-royauté de la Nouvelle-Espagne et en était une partie intégrante. Bien que cette terre ne soit pas particulièrement riche, nous devons la prendre pour sécuriser notre frontière méridionale."
HON_reclaim_cuba:0 "Récupérer Cuba"
HON_reclaim_cuba_desc:0 "Cuba fut l’un des rares territoires à rester fidèle à l’Espagne durant les guerres révolutionnaires, mais les Américains s’en emparèrent lors de la guerre hispano-américaine. Toutefois, les Américains ont récemment accordé son indépendance à Cuba, ce qui nous permet désormais de la récupérer au nom de la couronne."
HON_reclaim_hispanola:0 "Récupérer Hispaniola"
HON_reclaim_hispanola_desc:0 "Hispaniola fut autrefois entièrement sous contrôle espagnol, mais l’ouest fut perdu au profit de la France au XVIIe siècle et l’est en 1795 avec la paix de Bâle. Corrigeons ces injustices historiques en reprenant Hispaniola."
HON_reclaim_mexico:0 "Prendre le Mexique"
HON_reclaim_mexico_desc:0 "Le Mexique était le cœur et l’âme de la vice-royauté de la Nouvelle-Espagne. Personne ne prendra nos revendications au sérieux tant que nous n’aurons pas réaffirmé notre contrôle sur cette région. Une fois le Mexique repris, nous pourrons proclamer la restauration de la vice-royauté."
HON_intendancies:0 "Réintroduire les intendances"
HON_intendancies_desc:0 "Les intendants furent créés dans le cadre des réformes bourboniennes au XVIIIe siècle. Depuis l’indépendance, l’administration des colonies a décliné. Réinstaurer un système d’intendances pourrait nous permettre de gérer notre royaume plus efficacement."
HON_coastal_forts:0 "Renforcer les défenses côtières"
HON_coastal_forts_desc:0 "L’une des plus grandes menaces pour la vice-royauté fut toujours les invasions navales, et ces attaques pourraient aussi détruire notre vice-royauté renaissante. Construisons un système de forts côtiers afin de nous protéger de toute puissance étrangère voulant débarquer chez nous."
HON_refined_goods:0 "Agriculture industrielle"
HON_refined_goods_desc:0 "Le manque d’industrialisation de l’Espagne fut l’une des causes de sa chute, et nous ne voulons pas répéter cette erreur. Comme nous possédons déjà l’un des plus grands secteurs agricoles du monde, il serait prudent de bâtir des usines pour transformer nos produits."
HON_economica:0 "Soutenir la Société économique"
HON_economica_desc:0 "La Sociedad Económica de los Amigos del País, ou Société économique des amis du pays, fut une association privée fondée dans plusieurs villes de l’Empire espagnol. Elle encouragea avec succès l’activité et l’innovation économiques, mais déclina après la dissolution de la Nouvelle-Espagne. En la rétablissant avec des fonds publics, nous pourrions doter notre infrastructure de recherche d’une capacité comparable à celle des grandes puissances."
HON_reconquista:0 "La Ré-reconquista"
HON_reconquista_desc:0 "L’Empire espagnol a connu humiliation sur humiliation durant les deux derniers siècles, et il est temps d’y mettre fin. Nous devons restaurer la Nouvelle-Espagne, joyau de l’Empire espagnol, et ramener un jour Juan Ier sur son trône légitime en Espagne. Cette Ré-reconquista ne sera pas sans effusion de sang, mais c’est la seule voie pour restaurer l’empire à sa gloire passée."
HON_inquisition:0 "La nouvelle Inquisition espagnole"
HON_inquisition_desc:0 "L’Inquisition espagnole fut l’un des outils les plus puissants de l’empire, assurant la loyauté des sujets envers la couronne et la foi catholique. En la rétablissant, nous pourrons non seulement sauver nos sujets de la damnation éternelle, mais aussi éliminer tout dissident politique."
HON_proclaim_new_spain:0 "Proclamer la vice-royauté de la Nouvelle-Espagne"
HON_proclaim_new_spain_desc:0 "Beaucoup pensaient notre roi fou lorsqu’il annonçait vouloir réunifier la vice-royauté sous son autorité, mais il a réussi. Aujourd’hui, notre royaume s’étend du Costa Rica à la Basse-Californie, et nul ne peut nier que nous sommes une grande puissance. La communauté internationale reconnaîtra désormais nos revendications, et nous pourrons nous proclamer officiellement vice-royauté de la Nouvelle-Espagne."
HON_reclaim_america:0 "Reconquérir les territoires du Nord"
HON_reclaim_america_desc:0 "Le monde hispanophone a été constamment humilié par les Anglos depuis le naufrage de l’Armada espagnole. Deux de nos plus grandes défaites furent les traités d’Adams-Onís (cession de la Floride) et de Guadalupe-Hidalgo (cession de la moitié nord du Mexique). Vengeons ces humiliations en reprenant les territoires perdus aux Américains."
HON_reclaim_spain:0 "Reprendre le trône d’Espagne"
HON_reclaim_spain_desc:0 "Maintenant que Juan Ier contrôle entièrement la Nouvelle-Espagne, il peut préparer son retour en Espagne. Traverser l’Atlantique ne sera pas facile, mais cela n’arrêta pas les conquistadors. Ramener l’Espagne à ses racines monarchiques nous permettra de restaurer l’empire dans toute sa gloire."
HON_gran_colombia:0 "Préparer la libération de la Grande Colombie"
HON_gran_colombia_desc:0 "La Grande Colombie est divisée depuis la mort de Simón Bolívar, et cette désunion a permis à la bourgeoisie yankee d’exploiter nos camarades colombiens. Nous devrions refonder la Grande Colombie comme république paysanne, mais il nous faudra d’abord installer en Colombie un gouvernement favorable à cette idée."
HON_liberate_mexico:0 "Libérer le Mexique"
HON_liberate_mexico_desc:0 "Même si nos camarades mexicains ont pris des mesures qui ont irrité les impérialistes gringos, comme la nationalisation du pétrole, la majorité des campesinos souffre encore. Libérons les campesinos du Mexique et établissons un gouvernement dédié à notre lutte."
HON_real_gran_colombia:0 "Consolider la Grande Colombie"
HON_real_gran_colombia_desc:0 "Maintenant que nous avons installé un gouvernement ami en Colombie, faisons-en l’héritier légitime de Bolívar. Malheureusement, les gouvernements [VEN.GetAdjective] et [ECU.GetAdjective] refusent de voir la sagesse de notre projet, et nous devrons les convaincre par la force."
HON_liberate_brazil:0 "Libérer les Brésiliens"
HON_liberate_brazil_desc:0 "Même si la révolution de 1930 a affaibli les oligarchies brésiliennes, les paysans sont toujours opprimés par l’armée et la bourgeoisie urbaine. Nous devons renverser ce régime oppressif et le remplacer par un gouvernement servant les intérêts du peuple."
HON_prepare_the_liberation:0 "Sous une bannière commune"
HON_caribfed:0 "Initier la révolution caribéenne"
HON_caribfed_desc:0 "Les impérialistes européens ont dominé les îles des Caraïbes pendant des siècles, et la plupart des habitants de cette région n’ont jamais connu de véritable souveraineté. Libérons les paysans caribéens et unissons-les sous une bannière unique. Comme les Cubains furent trahis par les impérialistes gringos lors de leur dernière révolution, ils seraient sans doute prêts à être le centre de cette nouvelle révolution caribéenne."
HON_libperbol:0 "Porter la révolution dans les Andes"
HON_libperbol_desc:0 "La fédération Pérou-Bolivie tenta de se défendre contre les Yankees et les nations prédatrices comme le Brésil et l’Argentine. Si elle échoua, un nouveau Pérou-Bolivie pourrait réussir avec notre soutien. Libérons nos camarades péruviens et continuons à répandre la révolution en Amérique du Sud."
HON_libbolivia:0 "La fédération Pérou-Bolivie"
HON_libbolivia_desc:0 "La fédération Pérou-Bolivie ne serait pas grand-chose sans la Bolivie. Libérons ce pays et transférons ses terres au gouvernement ami que nous avons établi au Pérou."
HON_libargent:0 "Marcher vers la Patagonie"
HON_libargent_desc:0 "Notre influence s’étendant désormais profondément en Amérique du Sud, nous pourrions créer une nouvelle république de La Plata dirigée par les campesinos. Mais avant cela, établissons un gouvernement ami en Argentine."
HON_liblaplata:0 "Unifier la Plata"
HON_liblaplata_desc:0 "Nos camarades argentins soutiennent notre projet de réunification de La Plata et sont impatients de nous aider à libérer le reste de l’Amérique du Sud. Si nous répandons la révolution en Uruguay, au Paraguay et au Chili, l’Amérique latine pourra enfin commencer à guérir après des siècles d’oppression."
HON_support_the_south_american_communists:0 "Répandre la révolution en Grande Colombie"
HON_support_the_south_american_communists_desc:0 ""
HON_soviet_military_buildup:0 "Lancer l’industrie militaire hondurienne"
HON_soviet_military_buildup_desc:0 ""
HON_corporate_expansion:0 "Expansion des compagnies"
HON_corporate_expansion_desc:0 "L’United Fruit Company est présente en Colombie depuis 1900, mais nos opérations y rencontrent quelques obstacles. Nos employés de [COL.GetNameDef] se souviennent encore du massacre des bananeraies de 1928, qui fit jusqu’à trois mille morts. Évitons qu’un tel drame ne se reproduise en prenant le contrôle direct de nos opérations [COL.GetAdjective] et [ECU.GetAdjective]."
HON_eliminate_competition:0 "Éliminer la concurrence"
HON_eliminate_competition_desc:0 "Même si [RAJ.GetNameDef] est l’un des plus grands producteurs mondiaux de bananes, l’United Fruit Company n’y a aucune influence. L’industrie [RAJ.GetAdjective] de la banane est notre plus grand concurrent, et nous devons en prendre le contrôle pour sécuriser notre monopole. Nos directeurs sont fermement opposés à une invasion directe de [RAJ.GetNameDef], mais nous pourrions investir afin d’y promouvoir la corporatocratie."

### Section Événements ###

hon.1.t:0 "[HON.GetNameDefCap] exige l’annexion !"
hon.1.d:0 "Après la prise de contrôle du Honduras par l’United Fruit Company, son nouveau président a tenté de consolider toutes les possessions de la United Fruit en Amérique centrale. Comme [GUA.GetNameDef] possède plus de biens de la United Fruit que tout autre pays d’Amérique centrale, nous sommes devenus la première cible de l’entreprise."
hon.1.a:0 "Ils contrôlent déjà notre économie ; cette prise de contrôle n’est qu’une formalité."
hon.1.b:0 "Jamais ! Nous devons combattre les fascistes de toutes nos forces !"

hon.2.t:0 "Le gouvernement [GUA.GetAdjective] accepte la consolidation"
hon.2.d:0 "Nos négociateurs ont utilisé le contrôle de l’United Fruit sur [HON.GetNameDef] comme levier, et le gouvernement [GUA.GetAdjective] s’est entièrement soumis à la United Fruit Company."
hon.2.a:0 "Excellent !"

hon.3.t:0 "Le gouvernement [GUA.GetAdjective] refuse la consolidation"
hon.3.d:0 "Nos négociateurs ont tenté d’utiliser le contrôle de l’United Fruit sur [HON.GetNameDef] comme levier, mais le gouvernement [GUA.GetAdjective] refuse de céder à nos exigences. Nous devrons reprendre nos possessions dans ce pays par la force."
hon.3.a:0 "Déclarons la guerre dès maintenant et montrons-leur la puissance de notre État corporatif !"
hon.3.b:0 "Nos forces de sécurité ne sont pas prêtes pour une guerre totale. Attendons notre heure."

hon.4.t:0 "[HON.GetNameDefCap] exige l’annexion !"
hon.4.d:0 "Maintenant que l’United Fruit Company contrôle le Guatemala, elle tente d’établir son hégémonie sur toute l’Amérique centrale. Malheureusement, nous avons été désignés comme prochaine cible."
hon.4.a:0 "Résister est futile. Vive la corporation !"
hon.4.b:0 "Jamais ! Nous devons les combattre de toutes nos forces !"

hon.5.t:0 "[ELS.GetNameDefCap] a capitulé"
hon.5.d:0 "Le gouvernement [ELS.GetAdjective] a reconnu les avantages de devenir une filiale de l’United Fruit Company. Accueillons-les à bras ouverts."
hon.5.a:0 "Excellent !"

hon.6.t:0 "Le gouvernement [ELS.GetAdjective] a refusé nos exigences !"
hon.6.d:0 "Malheureusement, le gouvernement [ELS.GetAdjective] refuse de se soumettre à la domination corporative. Cette prise de contrôle hostile va devoir être encore plus hostile."
hon.6.a:0 "Déclarons la guerre dès maintenant et montrons-leur la puissance de notre État corporatif !"
hon.6.b:0 "L’armée [ELS.GetAdjective] n’est pas à prendre à la légère. Attendons notre heure."

hon.7.t:0 "[HON.GetNameDefCap] exige l’annexion !"
hon.7.d:0 "Maintenant que l’United Fruit Company contrôle le Guatemala, elle tente d’établir son hégémonie sur toute l’Amérique centrale. Malheureusement, nous avons été désignés comme prochaine cible."
hon.7.a:0 "Résister est futile. Vive la corporation !"
hon.7.b:0 "Jamais ! Nous devons les combattre de toutes nos forces !"

hon.8.t:0 "[NIC.GetNameDefCap] a capitulé"
hon.8.d:0 "Le gouvernement [NIC.GetAdjective] a reconnu les avantages de devenir une filiale de l’United Fruit Company. Accueillons-les à bras ouverts."
hon.8.a:0 "Excellent !"

hon.9.t:0 "Le gouvernement [NIC.GetAdjective] a refusé nos exigences !"
hon.9.d:0 "Malheureusement, le gouvernement [NIC.GetAdjective] refuse de se soumettre à la domination corporative. Cette prise de contrôle hostile va devoir être encore plus hostile."
hon.9.a:0 "Déclarons la guerre dès maintenant et montrons-leur la puissance de notre État corporatif !"
hon.9.b:0 "L’armée [NIC.GetAdjective] n’est pas à prendre à la légère. Attendons notre heure."

hon.10.t:0 "L’United Fruit Company exige notre soumission !"
hon.10.d:0 "L’United Fruit Company vient de prendre le contrôle du Nicaragua et tente désormais de consolider ses anciennes possessions de l’Atlantic Fruit au [COS.GetNameDef]. Elle exige que [COS.GetNameDef] accepte sa gouvernance."
hon.10.a:0 "Très bien, jouons le jeu."
hon.10.b:0 "Jamais ! Nous devons les combattre de toutes nos forces !"

hon.11.t:0 "[COS.GetNameDefCap] s’est soumis"
hon.11.d:0 "Après avoir observé les récents événements en Amérique centrale, le gouvernement [COS.GetAdjective] a reconnu les avantages de l’intégration à l’United Fruit Company."
hon.11.a:0 "Excellent !"

hon.12.t:0 "Le gouvernement [COS.GetAdjective] refuse de se soumettre !"
hon.12.d:0 "Malheureusement, le gouvernement [COS.GetAdjective] a refusé nos exigences. Cette prise de contrôle hostile va devoir être encore plus hostile."
hon.12.a:0 "Nous détruirons leur gouvernement comme nous avons détruit l’Atlantic Fruit."
hon.12.b:0 "Je crains les conséquences. Attendons notre heure."

hon.13.t:0 "[ROOT.GetNameDefCap] propose d’acheter le Belize"
hon.13.d:0 "[ROOT.GetNameDefCap] consolide son emprise sur l’Amérique centrale et manifeste son intérêt pour l’achat du Belize. L’un de ses décideurs est venu nous proposer cet achat. Ils nous offriront plusieurs convois et toutes les bananes que nous pourrons manger."
hon.13.a:0 "Une excellente proposition, notre effort de guerre pourrait tirer profit de quelques bateaux de bananes."
hon.13.b:0 "Nous avons assez de navires, et le Belize est trop précieux pour être vendu."

hon.14.t:0 "[ENG.GetNameDefCap] accepte"
hon.14.d:0 "[ENG.GetNameDefCap] a accepté notre généreuse offre et transférera immédiatement le Belize. Nous leur enverrons nos bateaux de bananes et une partie significative de notre production."
hon.14.a:0 "Day-o, tally man, tally me banana !"

hon.15.t:0 "[ENG.GetNameDefCap] refuse de vendre le Belize !"
hon.15.d:0 "[ENG.GetNameDefCap] a décliné notre offre, arguant qu’ils ne peuvent pas intégrer nos bateaux de bananes à leur flotte marchande."
hon.15.a:0 "Malheureusement, notre conseil d’administration ne soutiendra pas une guerre contre [ENG.GetNameDef] pour le Belize. Pas encore."

hon.16.t:0 "[FROM.GetNameDefCap] exige notre annexion !"
hon.16.d:0 "[FROM.GetNameDefCap] contrôle presque toute l’Amérique centrale, et nous sommes le seul État encore indépendant. Cependant, [FROM.GetLeader] ne se contentera de rien d’autre que d’un contrôle total, et ils ont exigé que nous intégrions leur pays."
hon.16.a:0 "Résister est inutile."
hon.16.b:0 "Jamais ! Nous nous battrons pour une Amérique centrale libre !"

hon.17.t:0 "[PAN.GetNameDefCap] accepte l’incorporation"
hon.17.d:0 "Le gouvernement [PAN.GetAdjective] estime ne pas pouvoir nous tenir tête et a accepté de devenir une partie de notre domination."
hon.17.a:0 "L’Amérique centrale est à nous !"

hon.18.t:0 "Le gouvernement [PAN.GetAdjective] refuse l’incorporation !"
hon.18.d:0 "[PAN.GetNameDefCap] pense pouvoir nous résister, même après la chute de tous les autres pays d’Amérique centrale. Nous devons trouver un moyen de punir leur arrogance."
hon.18.a:0 "Il est temps de faire tomber le dernier domino."
hon.18.b:0 "Atteindre leur capitale pourrait être difficile ; attendons d’être en meilleure position."

hon.19.t:0 "L’United Fruit Company propose d’acheter le canal de Panama"
hon.19.d:0 "L’United Fruit Company consolide ses opérations maritimes en Amérique centrale et estime que posséder le canal de Panama les rendrait infiniment plus efficaces. L’un de leurs décideurs a fait pression sur le Congrès pour vendre le canal de Panama en échange de nombreux bateaux de bananes et de fruits. Devons-nous accepter leur offre ?"
hon.19.a:0 "Une excellente proposition, ces bateaux de bananes permettront à nos chantiers navals de se concentrer sur les navires militaires."
hon.19.b:0 "Ils doivent être tombés sur la tête s’ils pensent que nous allons leur vendre le canal de Panama !"

hon.20.t:0 "[USA.GetNameDefCap] accepte"
hon.20.d:0 "[USA.GetNameDefCap] a accepté notre généreuse offre et transférera immédiatement le canal de Panama. Nous leur enverrons nos bateaux de bananes ainsi qu’une année entière de fruits."
hon.20.a:0 "Le fruit doit circuler."

hon.21.t:0 "[USA.GetNameDefCap] refuse de vendre le canal de Panama !"
hon.21.d:0 "Malheureusement, [USA.GetNameDef] a refusé notre offre, affirmant que le canal de Panama est essentiel à ses intérêts."
hon.21.a:0 "Il semble que le gouvernement [USA.GetAdjective] ne nous soutienne plus. Nous devrions prendre les choses en main."

hon.22.t:0 "[HON.GetNameDefCap] tente de prendre le Belize !"
hon.22.d:0 "Le gouvernement [HON.GetAdjective] a remarqué que nous sommes occupés par notre guerre actuelle et a tenté de s’emparer du Belize pendant que nous ne regardions pas. Comme le Belize n’a que peu de valeur pour nous, nous pouvons accepter cette situation et nous concentrer sur notre guerre actuelle. Cependant, nous pourrions aussi détourner quelques troupes pour défendre notre colonie et nous débarrasser de cette agaçante nation [HON.GetAdjective]."
hon.22.a:0 "Nous ne pouvons pas nous permettre d’envoyer des soldats mourir dans la jungle ; laissons-leur le Belize."
hon.22.b:0 "Chaque colonie de cet empire est précieuse ! Envoyez une réponse militaire !"

hon.23.t:0 "Les [ENG.GetAdjective] ont accepté leur perte"
hon.23.d:0 "Les [ENG.GetAdjective] ont décidé que le Belize ne valait pas un nouveau conflit. Ils ont accepté la libération du Belize et nous ont permis de maintenir nos relations avec eux."
hon.23.a:0 "Nous nous souviendrons toujours de leur générosité."

hon.24.t:0 "Les [ENG.GetAdjective] envoient une réponse militaire !"
hon.24.d:0 "Les [ENG.GetAdjective] ont décidé de ne pas laisser le Belize leur échapper et ont envoyé une armée pour le défendre. Ils ont déclaré la guerre en réponse à notre demande et tentent désormais de nous écraser. Toutefois, ils pourraient abandonner si nous parvenons à prendre le Belize et à le tenir assez longtemps."
hon.24.a:0 "Rejetons les impérialistes à la mer !"

hon.25.t:0 "Paix pour le Belize ?"
hon.25.d:0 "Même si les [ENG.GetAdjective] ont décidé de nous combattre pour le Belize, nous avons réussi à occuper cette zone et à empêcher les [ENG.GetAdjective] de débarquer en Amérique centrale. Si nous demandons la paix, ils accepteront probablement."
hon.25.a:0 "Nous voulons seulement le Belize ; demandons la paix."
hon.25.b:0 "Jamais ! Nous abattrons tout l’empire [ENG.GetAdjective] !"

hon.26.t:0 "[HON.GetNameDefCap] propose la paix"
hon.26.d:0 "[HON.GetNameDefCap] nous a proposé la paix en échange de la reconnaissance de leur contrôle sur le Belize."
hon.26.a:0 "Soit ! Laissons-leur ce lopin de terre sans valeur !"
hon.26.b:0 "Jamais nous ne leur laisserons le Belize !"

hon.27.t:0 "[ENG.GetNameDefCap] accepte"
hon.27.d:0 "[ENG.GetNameDefCap] a accepté notre offre de paix et transférera le Belize. Nous avons remporté une grande victoire, même si les [ENG.GetAdjective] ne perdent qu’une petite partie de leur empire."
hon.27.a:0 "Excellent !"

hon.28.t:0 "[ENG.GetNameDefCap] refuse"
hon.28.d:0 "[ENG.GetNameDefCap] a refusé notre offre de paix et se battra jusqu’à ce que l’un de nous soit complètement détruit. Les [ENG.GetAdjective] ont stupidement décidé de mener une guerre totale pour le Belize."
hon.28.a:0 "Soit ! Nous les forcerons à négocier à Londres !"

hon.29.t:0 "[HON.GetNameDefCap] tente de s’emparer du canal de Panama !"
hon.29.d:0 "Le gouvernement communiste [HON.GetAdjective] a remarqué que nous sommes empêtrés dans une grande guerre et a profité de cette occasion pour s’emparer du canal de Panama. Cet acte ne peut être pris à la légère, mais envahir l’Amérique centrale pourrait être difficile."
hon.29.a:0 "Nous pourrons toujours envahir l’Amérique centrale plus tard ; laissons-leur le canal de Panama."
hon.29.b:0 "Les laisser prendre le canal de Panama paralyserait nos capacités logistiques ! Rejetons les communistes hors des Amériques !"

hon.30.t:0 "[USA.GetNameDefCap] n’a pas envoyé de réponse"
hon.30.d:0 "Même si nous craignions une réponse militaire [USA.GetAdjective], ils nous ont laissé prendre le canal de Panama sans tirer un seul coup de feu."
hon.30.a:0 "Maintenant que nous possédons le canal de Panama, les océans appartiennent au peuple."

hon.31.t:0 "Les [USA.GetAdjective] envoient une réponse militaire !"
hon.31.d:0 "Les [USA.GetAdjective] ont utilisé notre tentative de saisie du canal de Panama comme prétexte pour envahir l’Amérique centrale. Ils veulent voir notre gouvernement renversé et les Amériques purgées des communistes !"
hon.31.a:0 "Apprenons à ces gringos une leçon sur l’ingérence dans la politique latino-américaine !"

hon.32.t:0 "Paix avec [USA.GetNameDef] ?"
hon.32.d:0 "Même si les [ENG.GetAdjective] ont décidé de nous combattre pour le Belize, nous avons réussi à occuper cette zone et à empêcher les [USA.GetAdjective] de débarquer en Amérique centrale. Si nous demandons la paix, ils accepteront probablement."
hon.32.a:0 "Nous voulons seulement le canal de Panama ; demandons la paix."
hon.32.b:0 "Jamais ! Nous abattrons tout [USA.GetName] !"

hon.33.t:0 "[HON.GetNameDefCap] propose la paix"
hon.33.d:0 "[HON.GetNameDefCap] nous a proposé la paix en échange de la reconnaissance de leur contrôle sur le canal de Panama."
hon.33.a:0 "Soit ! Nous n’aurons qu’à construire un canal ailleurs !"
hon.33.b:0 "Jamais nous ne leur laisserons le canal de Panama !"

hon.34.t:0 "[USA.GetNameDefCap] accepte"
hon.34.d:0 "[USA.GetNameDefCap] a accepté notre offre de paix et transférera le canal de Panama. Nous avons remporté une grande victoire, car posséder le canal de Panama nous permet de dominer les routes maritimes des Amériques."
hon.34.a:0 "Excellent !"

hon.35.t:0 "[USA.GetNameDefCap] refuse"
hon.35.d:0 "[USA.GetNameDefCap] a refusé notre offre de paix et se battra jusqu’à ce que l’un de nous soit complètement détruit. Les [USA.GetAdjective] ont décidé que le canal de Panama valait une guerre totale."
hon.35.a:0 "Soit ! Nous les forcerons à négocier à Washington !"

hon.36.t:0 "L’héritage du président Carias"
hon.36.d:0 "Le président Carias était… Attendez, vous avez terminé l’arbre démocratique ? Vraiment ? J’ai pris le temps de créer deux branches passionnantes de l’arbre des priorités, et vous avez choisi la plus ennuyeuse ? Vous devez vraiment aimer le jeu historique… ou être une personne très étrange. Quoi qu’il en soit, vous méritez une récompense pour avoir supporté l’arbre démocratique et quasiment rien fait de toute la partie. Que diriez-vous d’une armée surpuissante et d’une tonne de main-d’œuvre ?"
hon.36.a:0 "Hein ? Quoi ?"
hon.36.b:0 "Je ne suis que l’IA, laissez-moi tranquille s’il vous plaît."

hon.37.t:0 "La Grande Colombie revendique nos territoires du Nord"
hon.37.d:0 "La Grande Colombie s’est reconstituée en tant qu’État fantoche d’Amérique centrale et revendique les terres que nous lui avons prises au début du XIXe siècle. Leur revendication a plus de cent ans, mais ils bénéficient du soutien de l’armée centre-américaine. Devons-nous accepter leurs exigences ?"
hon.37.a:0 "Nous ne pouvons pas risquer une guerre ; remettons-leur les territoires."
hon.37.b:0 "Nous ne céderons pas un pouce de terre [PRU.GetAdjective] !"

hon.38.t:0 "[PRU.GetNameDefCap] cède"
hon.38.d:0 "Le gouvernement [PRU.GetAdjective] a accepté notre demande raisonnable et restituera les territoires méridionaux de la Grande Colombie."
hon.38.a:0 "Un pas de plus vers la libération de l’Amérique latine !"

hon.39.t:0 "[PRU.GetNameDefCap] refuse"
hon.39.d:0 "Le gouvernement [PRU.GetAdjective] a décidé de refuser notre demande concernant les anciens territoires de la Grande Colombie. Cela ne peut être qu’un autre complot des gringos."
hon.39.a:0 "Alors nous prendrons leurs terres à l’ancienne."

hon.40.t:0 "La Fédération des Caraïbes revendique Curaçao"
hon.40.d:0 "Les révolutionnaires d’Amérique centrale ont tenté d’unifier les Caraïbes sous un gouvernement fantoche basé à La Havane. Ils exigent maintenant que nous cédions nos territoires caribéens. Leurs exigences sont ridicules, mais devrions-nous abandonner ces îles pour nous concentrer sur nos problèmes en Europe et en Asie ?"
hon.40.a:0 "Nous ne pouvons pas risquer une guerre ; remettons-leur les îles."
hon.40.b:0 "L’intégrité de l’empire [HOL.GetAdjective] est vitale ! Refusons leurs exigences !"

hon.41.t:0 "Concessions des [HOL.GetAdjective]"
hon.41.d:0 "Les [HOL.GetAdjective] ont accepté nos exigences et préfèrent se concentrer sur leurs problèmes internes."
hon.41.a:0 "¡Hasta la victoria siempre!"

hon.42.t:0 "Les [HOL.GetAdjective] refusent !"
hon.42.d:0 "Les [HOL.GetAdjective] ont rejeté nos exigences. Plutôt que de céder une partie de leur empire, ils préfèrent envoyer davantage de soldats à la mort."
hon.42.a:0 "Alors il est temps d’en finir avec l’empire [HOL.GetAdjective] !"

hon.43.t:0 "La Fédération des Caraïbes revendique Porto Rico"
hon.43.d:0 "Les révolutionnaires d’Amérique centrale ont tenté d’unifier les Caraïbes sous un gouvernement fantoche basé à La Havane. Ils exigent désormais que nous cédions Porto Rico. Leurs exigences sont ridicules, mais devrions-nous abandonner cette île pour préserver notre neutralité et nous concentrer sur l’Europe et l’Asie ?"
hon.43.a:0 "Nous ne pouvons pas risquer une guerre ; remettons-leur l’île."
hon.43.b:0 "Jamais ! Nous avons toléré cet État parvenu dans les Amériques bien trop longtemps !"

hon.44.t:0 "Concessions des gringos"
hon.44.d:0 "Les gringos ont accepté nos exigences et céderont Porto Rico."
hon.44.a:0 "¡Hasta la victoria siempre!"

hon.45.t:0 "Les gringos refusent !"
hon.45.d:0 "Les gringos ont rejeté nos exigences. Plutôt que d’apaiser notre révolution, ils préfèrent envoyer davantage de soldats à la mort."
hon.45.a:0 "Alors il est enfin temps d’en finir une bonne fois pour toutes avec l’impérialisme yankee !"

hon.46.t:0 "La Fédération des Caraïbes revendique les Antilles"
hon.46.d:0 "Les révolutionnaires d’Amérique centrale ont tenté d’unifier les Caraïbes sous un gouvernement fantoche basé à La Havane. Ils exigent maintenant que nous cédions nos territoires caribéens. Leurs exigences sont ridicules, mais devrions-nous abandonner ces îles pour nous concentrer sur nos problèmes européens et asiatiques ?"
hon.46.a:0 "Nous ne pouvons pas risquer une guerre ; remettons-leur les îles."
hon.46.b:0 "L’intégrité de l’empire [ENG.GetAdjective] est vitale ! Refusons leurs exigences !"
hon.47.t:0 "Concessions des [ENG.GetAdjective]"
hon.47.d:0 "Les [ENG.GetAdjective] ont accepté nos exigences et préfèrent désormais se concentrer sur leurs problèmes intérieurs."
hon.47.a:0 "¡Hasta la victoria siempre!"

hon.48.t:0 "Les [ENG.GetAdjective] refusent !"
hon.48.d:0 "Les [ENG.GetAdjective] ont rejeté nos exigences. Plutôt que d’abandonner une partie de leur empire, ils préfèrent envoyer davantage de leurs soldats mourir."
hon.48.a:0 "Alors il est temps d’en finir avec l’Empire [ENG.GetAdjective] !"

hon.49.t:0 "La Fédération caribéenne réclame les Antilles"
hon.49.d:0 "Les révolutionnaires d’Amérique centrale tentent d’unifier les Caraïbes sous un gouvernement fantoche basé à La Havane. Ils exigent désormais que nous leur cédions nos territoires caribéens. Leurs revendications sont absurdes, mais devons-nous abandonner ces îles pour nous concentrer sur nos affaires européennes et asiatiques ?"
hon.49.a:0 "Nous ne pouvons risquer une guerre ; cédez les îles."
hon.49.b:0 "L’intégrité de l’Empire [FRA.GetAdjective] est vitale ! Rejetez leurs exigences !"

hon.50.t:0 "Concessions des [FRA.GetAdjective]"
hon.50.d:0 "Les [FRA.GetAdjective] ont accepté nos exigences et préfèrent désormais se concentrer sur leurs problèmes intérieurs."
hon.50.a:0 "¡Hasta la victoria siempre!"

hon.51.t:0 "Les [FRA.GetAdjective] refusent !"
hon.51.d:0 "Les [FRA.GetAdjective] ont rejeté nos exigences. Plutôt que d’abandonner une partie de leur empire, ils préfèrent envoyer davantage de leurs soldats mourir."
hon.51.a:0 "Alors il est temps d’en finir avec l’Empire [FRA.GetAdjective] !"

hon.52.t:0 "[HON.GetNameDefCap] propose la paix"
hon.52.d:0 "[HON.GetNameDefCap] nous propose la paix en échange de la reconnaissance de leur contrôle sur Curaçao."
hon.52.a:0 "Cette île ne vaut pas les vies qu’il faudrait pour la reprendre."
hon.52.b:0 "Jamais nous ne les laisserons grignoter notre empire !"

hon.53.t:0 "[HOL.GetNameDefCap] accepte"
hon.53.d:0 "[HOL.GetNameDefCap] a accepté notre offre de paix et cédera Curaçao à la Fédération caribéenne. Nous avons remporté une grande victoire et nos camarades des Caraïbes sont plus forts que jamais."
hon.53.a:0 "Hourra !"

hon.54.t:0 "[HOL.GetNameDefCap] refuse"
hon.54.d:0 "[HOL.GetNameDefCap] a rejeté notre offre de paix et se battra jusqu’à la destruction totale de l’un de nous deux. Les [HOL.GetAdjective] considèrent que leurs colonies caribéennes valent une guerre totale."
hon.54.a:0 "Alors nous les retrouverons à Amsterdam !"

hon.55.t:0 "[HON.GetNameDefCap] propose la paix"
hon.55.d:0 "[HON.GetNameDefCap] nous propose la paix en échange de la reconnaissance de leur contrôle sur Porto Rico."
hon.55.a:0 "Je ne me souviens même plus pourquoi nous avons pris Porto Rico au départ."
hon.55.b:0 "La guerre n’est pas encore perdue, et nous serons victorieux avant Noël."

hon.56.t:0 "[USA.GetNameDefCap] accepte"
hon.56.d:0 "[USA.GetNameDefCap] a accepté notre offre de paix et cédera Porto Rico à la Fédération caribéenne. Nous avons remporté une grande victoire et nos camarades des Caraïbes sont plus forts que jamais."
hon.56.a:0 "Hourra !"

hon.57.t:0 "[USA.GetNameDefCap] refuse"
hon.57.d:0 "[USA.GetNameDefCap] a rejeté notre offre de paix et se battra jusqu’à la destruction totale de l’un de nous deux. Les [USA.GetAdjective] estiment que Porto Rico vaut une guerre totale."
hon.57.a:0 "Il est temps d’en finir une bonne fois pour toutes avec l’Empire yankee !"

hon.58.t:0 "[HON.GetNameDefCap] propose la paix"
hon.58.d:0 "[HON.GetNameDefCap] nous propose la paix en échange de la reconnaissance de leur contrôle sur les Antilles."
hon.58.a:0 "Envahir ces îles est bien trop fastidieux pour nous."
hon.58.b:0 "Jamais nous ne les laisserons grignoter notre empire !"

hon.59.t:0 "[ENG.GetNameDefCap] accepte"
hon.59.d:0 "[ENG.GetNameDefCap] a accepté notre offre de paix et cédera les anciennes Antilles à la Fédération caribéenne. Nous avons remporté une grande victoire et nos camarades des Caraïbes sont plus forts que jamais."
hon.59.a:0 "Hourra !"

hon.60.t:0 "[ENG.GetNameDefCap] refuse"
hon.60.d:0 "[ENG.GetNameDefCap] a rejeté notre offre de paix et se battra jusqu’à la destruction totale de l’un de nous deux. Les [ENG.GetAdjective] considèrent que leurs colonies caribéennes valent une guerre totale."
hon.60.a:0 "Alors la Britannia ne régnera plus sur les mers !"

hon.61.t:0 "[HON.GetNameDefCap] propose la paix"
hon.61.d:0 "[HON.GetNameDefCap] nous propose la paix en échange de la reconnaissance de leur contrôle sur les Antilles."
hon.61.a:0 "Envahir ces îles est bien trop fastidieux pour nous."
hon.61.b:0 "Jamais nous ne les laisserons grignoter notre empire !"

hon.62.t:0 "[FRA.GetNameDefCap] accepte"
hon.62.d:0 "[FRA.GetNameDefCap] a accepté notre offre de paix et cédera les anciennes Antilles à la Fédération caribéenne. Nous avons remporté une grande victoire et nos camarades des Caraïbes sont plus forts que jamais."
hon.62.a:0 "Hourra !"

hon.63.t:0 "[FRA.GetNameDefCap] refuse"
hon.63.d:0 "[FRA.GetNameDefCap] a rejeté notre offre de paix et se battra jusqu’à la destruction totale de l’un de nous deux. Les [FRA.GetAdjective] considèrent que leurs colonies caribéennes valent une guerre totale."
hon.63.a:0 "Je n’arrive pas à croire que les [FRA.GetAdjective] aient refusé cette fois-ci."

hon.64.t:0 "Le couronnement de Juan Ier"
hon.64.d:0 "Après l’entrée triomphale de notre glorieux dirigeant Juan Ier à Madrid, les préparatifs de son couronnement ont été lancés. Juan Ier, fils du roi déchu Alphonse XIII, a gracieusement accepté la couronne d’Espagne et régnera sur le vice-royaume de Nouvelle-Espagne depuis Madrid. Nous avons mis fin aux troubles en Espagne et jeté les bases de la restauration de l’Empire espagnol."
hon.64.a:0 "Il ne peut y avoir qu’un seul Juan !"

hon.65.t:0 "Le vice-roi de Nouvelle-Espagne"
hon.65.d:0 "Maintenant que Juan Ier est officiellement roi d’Espagne, il nous faut trouver quelqu’un pour diriger le vice-royaume de Nouvelle-Espagne. Son frère cadet, Jaime, duc de Ségovie, semble être un candidat approprié."
hon.65.a:0 "Gardons ça dans la famille."

hon.66.t:0 "[HON.GetNameDefCap] demande de l’aide"
hon.66.d:0 "Les campesinos du Honduras ont renversé le gouvernement bourgeois de Tiburcio Carías et espèrent étendre leur révolution à travers l’Amérique latine. Conscients que les chances sont contre eux, ils sollicitent notre aide. Leur fournir quelques armes pourrait leur donner la force d’expulser les impérialistes et d’être un allié précieux."
hon.66.a:0 "Leur donner quelques fusils ne peut pas faire de mal."
hon.66.b:0 "Pourquoi devrions-nous nous soucier de l’Amérique centrale ?"

hon.67.t:0 "[SOV.GetNameDefCap] nous soutient"
hon.67.d:0 "Nous venons de recevoir une réponse de [SOV.GetNameDef] concernant notre demande d’armes. Ils ont accepté et vont nous envoyer quelques milliers de fusils pour nous aider à répandre la révolution. Avec le soutien de [SOV.GetNameDef], toute l’Amérique centrale est à notre portée."
hon.67.a:0 "¡Hasta la victoria siempre!"

hon.68.t:0 "[SOV.GetNameDefCap] ne nous soutiendra pas"
hon.68.d:0 "Nous venons de recevoir une réponse de [SOV.GetNameDef] concernant notre demande d’armes. Ils nous ont expliqué qu’ils en avaient besoin pour équiper leur armée et se défendre face aux menaces en Europe et en Asie. Il semble que nous devions compter uniquement sur nos propres forces."
hon.68.a:0 "Très bien ! Nous fabriquerons nos propres fusils !"

hon.69.t:0 "Juan renonce à ses prétentions au trône"
hon.69.d:0 "Juan III a officiellement renoncé à ses prétentions sur le trône d’Espagne, renforçant ainsi la légitimité de notre monarque."
hon.69.a:0 "Excellent."

hon.70.t:0 "Réponse de Madrid"
hon.70.desc:0 "Après avoir pris connaissance de notre renonciation, le roi d’Espagne nous a offert des présents et nous a officiellement nommés vice-roi de Nouvelle-Espagne. Que nul ne doute désormais de notre légitimité et de celle de notre administration."
hon.70.a:0 "Excellent."

hon.71.t:0 "La Nouvelle-Espagne demande des conseillers militaires"
hon.71.desc:0 "Nos amis de Nouvelle-Espagne demandent l’envoi de certains de nos officiers pour servir comme conseillers militaires."
hon.71.a:0 "Bien sûr, tout pour les colonies."
hon.71.b:0 "Malheureusement, nous ne pouvons pas nous permettre de nous séparer de nos officiers."

hon.72.t:0 "L’Espagne a envoyé des conseillers"
hon.72.desc:0 "La Couronne espagnole a envoyé des conseillers militaires pour assister notre haut commandement."
hon.72.a:0 "Nous savions que nous pouvions compter sur eux."

hon.73.t:0 "L’Espagne n’a pas envoyé de conseillers"
hon.73.desc:0 "La Couronne espagnole a refusé d’envoyer des conseillers militaires."
hon.73.a:0 "Dommage."

hon.74.t:0 "[HON.GetNameDefCap] demande des investissements"
hon.74.desc:0 "Avec la montée récente du communisme au Honduras, nos camarades d’Amérique centrale nous demandent de les aider dans leur lutte contre le régime illégitime soutenu par les Américains de [HON.GetLeader]."
hon.74.a:0 "Pour les travailleurs et la révolution !"
hon.74.b:0 "Nous avons des affaires plus urgentes à régler."

hon.75.t:0 "[SOV.GetNameDefCap] a accepté notre demande d’investissement"
hon.75.desc:0 "Notre récente demande d’aide à [SOV.GetNameDef] a été acceptée !"
hon.75.a:0 "La révolution s’étend !"

hon.76.t:0 "[SOV.GetNameDefCap] a rejeté notre demande d’investissement"
hon.76.desc:0 "Notre récente demande d’aide à [SOV.GetNameDef] a été refusée."
hon.76.a:0 "Ça valait le coup d’essayer."

hon.77.t:0 "[311.GetName] a été libéré !"
hon.77.desc:0 "Notre escarmouche contre les occupants à [311.GetName] s’est conclue par notre victoire et la libération du territoire de la domination étrangère."
hon.77.a:0 "Une victoire de plus pour la révolution"
hon.78.t:0 "Défaite !"
hon.78.desc:0 "La bataille de [311.GetName] s’est soldée par la destruction de nos forces, nous contraignant à battre en retraite."
hon.78.a:0 "Nous reviendrons."

hon.79.t:0 "Impasse !"
hon.79.desc:0 "Après une bataille acharnée, les escarmouches se sont conclues par une impasse."
hon.79.a:0 "Je n’ai pas perdu ! J’ai juste échoué à gagner."

hon.80.t:0 "Victoire contre [HON.GetNameDef]"
hon.80.desc:0 "Récemment, [HON.GetNameDef] a tenté de s’emparer de notre territoire en Amérique centrale. Mais grâce à la supériorité de nos forces, nous avons pu les repousser et conserver notre contrôle sur la région."
hon.80.a:0 "Imbéciles."

hon.81.t:0 "Victoire à [685.GetName]"
hon.81.desc:0 "Notre tentative de prendre le canal a été couronnée de succès. Nous contrôlons désormais l’une des routes commerciales les plus importantes du monde. Peut-être pourrons-nous en tirer profit..."
hon.81.a:0 "Un pas de plus vers l’expulsion des impérialistes."

hon.82.t:0 "Troupes [HON.GetAdjective] près de [311.GetName]"
hon.82.desc:0 "Récemment, [HON.GetNameDef] a massé de nombreuses troupes à notre frontière de [313.GetName]. C’est un acte d’agression et nous devons nous préparer à tout !"
hon.82.a:0 "Ils jouent avec le feu."

hon.83.t:0 "Troupes [HON.GetAdjective] près de [685.GetName]"
hon.83.desc:0 "Le nouveau gouvernement [HON.GetAdjective] lorgne sur notre territoire au Panama depuis un moment déjà, et il semble qu’il se prépare à s’emparer du canal pour lui-même..."
hon.83.a:0 "Ils jouent avec le feu."

HON_adds_coastal_forts_tt:0 "Ajoute des §Hforts côtiers de niveau 2§! le long de la côte contrôlée :"
banana_decisions:0 "Diplomatie des entreprises"
honpeace_decisions:0 "Négocier la paix"
honlib_decisions:0 "La Liberación"
honspanishempire_decisions:0 "La Restauration"
honresources_decisions:0 "Investir dans la production de ressources"
hongrabstuff_decisions:0 "Les Anglo-Saxons sont distraits"

HON_bboat_diplomacy:0 "Diplomatie des bateaux-banane"
HON_bboat_diplomacy_desc:0 "Envoyons certains de nos bateaux chargés de bananes à l’étranger en échange de fournitures industrielles.\n"

HON_corporate_raj:0 "Organiser une prise de contrôle économique en [RAJ.GetNameDef]"
HON_corporate_raj_desc:0 "Après avoir infiltré l’économie [RAJ.GetAdjective] et soudoyé les administrateurs coloniaux [ENG.GetAdjective], nous avons désormais assez de soutien pour tenter un coup d’État en [RAJ.GetNameDef] et installer un gouvernement d’entreprise allié. Ce ne sera pas facile, et il faudra envoyer quelques-uns de nos mercenaires si nous voulons réussir. Mais c’est une occasion en or d’éliminer notre plus grand concurrent.\n"

HON_team_building:0 "Organiser un séminaire de cohésion"
HON_team_building_desc:0 "Notre équipe de direction a remarqué un moral en berne dans les bureaux et a eu une idée innovante pour le raviver. Nous pouvons emmener nos employés en sortie afin qu’ils participent à des activités de cohésion et renforcent leurs liens autour de leur amour pour la United Fruit Company. La participation et l’amusement sont, bien sûr, obligatoires.\n"

HON_raj_puppet:0 "Prendre le contrôle de l’Inde"
HON_raj_puppet_desc:0 "Notre coup d’État en Inde a été un franc succès, et ce nouveau gouvernement indépendant est entièrement loyal envers la United Fruit Company. Rendons cette loyauté officielle en faisant de l’Inde une filiale officielle de la compagnie.\n"

HON_consolidate_colecu:0 "Incorporer nos nouveaux actifs"
HON_consolidate_colecu_desc:0 "Maintenant que la United Fruit Company a pris le contrôle total de nos actifs en Colombie et en Équateur, nous pouvons pleinement les intégrer à notre entreprise. Les locaux n’en seront probablement pas ravis, mais cela devrait créer beaucoup de valeur pour nos actionnaires.\n"

HON_panamapeace:0 "Paix pour le canal de Panama"
HON_panamapeace_desc:0 "Si nous parvenons à nous défendre contre les invasions [USA.GetAdjective] et à conserver le canal de Panama suffisamment longtemps, [USA.GetNameDef] pourrait accepter notre possession du canal.\n"

HON_belizepeace:0 "Paix pour le Belize"
HON_belizepeace_desc:0 "Si nous parvenons à nous défendre contre les invasions [ENG.GetAdjective] et à conserver le Belize suffisamment longtemps, [ENG.GetNameDef] pourrait accepter notre possession du Belize.\n"

HON_curcaopeace:0 "Paix pour Curaçao"
HON_curcaopeace_desc:0 "Si nous parvenons à nous défendre contre les invasions [HOL.GetAdjective] et à conserver Curaçao suffisamment longtemps, les [HOL.GetAdjective] pourraient accepter notre possession de cette île.\n"

HON_puertopeace:0 "Paix pour Porto Rico"
HON_puertopeace_desc:0 "Si nous parvenons à nous défendre contre les invasions [USA.GetAdjective] et à conserver Porto Rico suffisamment longtemps, les [USA.GetAdjective] pourraient accepter notre possession de cette île.\n"

HON_engindiespeace:0 "Paix pour les Antilles britanniques"
HON_engindiespeace_desc:0 "Si nous parvenons à nous défendre contre les invasions [ENG.GetAdjective] et à conserver leurs îles caribéennes suffisamment longtemps, les [ENG.GetAdjective] pourraient accepter notre domination sur les Caraïbes.\n"

HON_fraindiespeace:0 "Paix pour les Antilles françaises"
HON_fraindiespeace_desc:0 "Si nous parvenons à nous défendre contre les invasions [FRA.GetAdjective] et à conserver leurs îles caribéennes suffisamment longtemps, les [FRA.GetAdjective] pourraient accepter notre domination sur les Caraïbes.\n"

HON_libven:0 "Transférer le Venezuela"
HON_libven_desc:0 "Maintenant que le Venezuela a été libéré de ses oppresseurs bourgeois, nous pouvons transférer son territoire à nos amis de Colombie afin qu’ils puissent revendiquer la Grande Colombie.\n"

HON_libecu:0 "Transférer l’Équateur"
HON_libecu_desc:0 "Maintenant que l’Équateur a été libéré de ses oppresseurs bourgeois, nous pouvons transférer son territoire à nos amis de Colombie afin qu’ils puissent revendiquer la Grande Colombie.\n"

HON_libgranperu:0 "Réclamer le sud de la Grande Colombie"
HON_libgranperu_desc:0 "La Grande Colombie a été réunifiée et l’héritage de Bolívar restauré. Cependant, [PRU.GetNameDef] détient toujours les territoires méridionaux de la Grande Colombie, et notre nouvel allié ne sera pas en sécurité tant que ces terres ne seront pas récupérées. Demandons à [PRU.GetNameDef] de céder ces terres légitimement colombiennes.\n"

HON_libhai:0 "Former Hispaniola"
HON_libhai_desc:0 "Maintenant qu’Haïti a été libéré de ses oppresseurs bourgeois, nous pouvons transférer son territoire à nos amis de [DOM.GetNameDef] afin d’unifier l’île d’Hispaniola une fois pour toutes !"

HON_libnedisles:0 "Réclamer les Antilles néerlandaises"
HON_libnedisles_desc:0 "La Fédération caribéenne a été formée, et nous pouvons désormais libérer les Antilles néerlandaises de leurs oppresseurs coloniaux. Réclamons leurs possessions caribéennes et voyons leur réponse. S’ils ont capitulé face à une autre nation, ils remettront probablement leurs îles sans combat.\n"

HON_libusaisles:0 "Réclamer Porto Rico"
HON_libengisles:0 "Réclamer les Antilles britanniques"
HON_libengisles_desc:0 "La Fédération caribéenne a été formée, et nous pouvons désormais libérer les Antilles britanniques de leurs oppresseurs coloniaux. Réclamons leurs possessions caribéennes et voyons leur réponse. S’ils ont capitulé face à une autre nation, ils remettront probablement leurs îles sans combat.\n"

HON_libfraisles:0 "Réclamer les Antilles françaises"
HON_libfraisles_desc:0 "La Fédération caribéenne a été formée, et nous pouvons désormais libérer les Antilles françaises de leurs oppresseurs coloniaux. Réclamons leurs possessions caribéennes et voyons leur réponse. S’ils ont capitulé face à une autre nation, ils remettront probablement leurs îles sans combat.\n"

HON_form_the_west_indies_federation:0 "Établir la République démocratique des Antilles"
HON_establish_west_indies_federation_tt:0 "§YLes Antilles seront libérées comme État fantoche§!"

HON_give_curacao_to_venezuela:0 "Transférer [695.GetName] au Venezuela"
HON_give_guantanamo_to_cuba:0 "Transférer [1050.GetName] à Cuba"

HON_newspain:0 "Prendre le trône d’Espagne"
HON_newspain_desc:0 "Notre glorieux roi a libéré l’Espagne et restauré la monarchie à sa juste place. Il est temps de couronner Juan Ier et de ramener la capitale à Madrid."

HON_new_north:0 "Réintégrer les territoires du Nord"
HON_new_north_desc:0 "Nous avons remporté une éclatante victoire contre les gringos, et les territoires qu’ils nous avaient volés lors de la guerre américano-mexicaine sont de nouveau nôtres. Nous pouvons désormais réintégrer ces États longtemps perdus au vice-royaume. Même s’ils étaient jadis une arrière-cour de la Nouvelle-Espagne, ils peuvent aujourd’hui devenir le joyau de notre empire restauré !\n"

HON_develop_mexoil:0 "Pétrole mexicain"
HON_develop_mexoil_desc:0 "Le Mexique exporte du pétrole depuis plusieurs années, mais il est temps d’en diriger une plus grande partie vers nos propres besoins. Développons notre production pétrolière au Mexique afin d’alimenter notre nation.\n"

HON_develop_panoil:0 "Forer au Panama"
HON_develop_panoil_desc:0 "Il existe actuellement un minuscule site de forage pétrolier au Panama, mais notre armée a besoin de bien plus que ce qu’il produit. Investissons dans l’extraction de pétrole au Panama afin de garantir un approvisionnement régulier.\n"

HON_develop_aluminium:0 "Produire de l’aluminium au Costa Rica"
HON_develop_aluminium_desc:0 "Même si le Costa Rica possède quelques gisements d’aluminium, peu d’intérêt a été porté à leur exploitation. Or, notre armée de l’air a désespérément besoin d’aluminium, et la construction d’une fonderie devrait nous en fournir suffisamment pour équiper nos nouvelles divisions aériennes.\n"

HON_develop_rubber:0 "Subventionner les plantations de caoutchouc"
HON_develop_rubber_desc:0 "L’Amérique centrale dispose d’un climat idéal pour le caoutchouc, mais personne n’a encore investi dans la création de plantations. Or, notre armée en a désormais besoin, et il serait sage d’investir des fonds publics dans l’établissement de plantations de caoutchouc à l’intérieur de nos frontières.\n"

HON_develop_tungsten:0 "Extraire le tungstène du Salvador"
HON_develop_tungsten_desc:0 "Certains prospecteurs nous ont signalé la présence de petites réserves de tungstène au Salvador. Si nous pouvons les localiser et les exploiter, nous disposerons de suffisamment de tungstène pour alimenter notre armée.\n"

HON_develop_steel:0 "Fonderies guatémaltèques"
HON_develop_steel_desc:0 "Il existe quelques mines de fer au Guatemala, mais la majeure partie de ce minerai est envoyée à l’étranger pour y être transformée. Si nous construisons quelques fonderies sur place, nous pourrons assurer un approvisionnement stable en acier pour notre nation.\n"

HON_develop_chromium:0 "Développer la production de chrome au Honduras"
HON_develop_chromium_desc:0 "Même si le Honduras possède une petite industrie minière, celle-ci est restée secondaire face à l’agriculture. Nous devrions utiliser des fonds publics pour développer notre secteur minier, afin de réduire notre dépendance aux importations de minerais.\n"

HON_seize_belize:0 "Prendre le Belize aux [ENG.GetAdjective]"
HON_seize_belize_desc:0 "Le Belize est une colonie de [ENG.GetNameDef], et ses paysans crient à la libération. Normalement, attaquer [ENG.GetNameDef] serait impensable, mais les Anglo-Saxons sont en pleine guerre qu’ils risquent de perdre. Comme le Belize n’est pas vital à l’effort de guerre [ENG.GetAdjective], nous pourrions peut-être le leur arracher discrètement. Cependant, ils nous déclareront probablement la guerre s’ils estiment que le Belize a plus de valeur qu’il n’y paraît.\n"

HON_seize_canal:0 "S’emparer du canal de Panama"
HON_seize_canal_desc:0 "Le canal de Panama est essentiel à tout le commerce des Amériques, et le contrôle [USA.GetAdjective] de ce canal confère aux gringos un avantage économique considérable. Mais [USA.GetNameDef] est aujourd’hui en guerre : nous pourrions en profiter pour nous emparer du canal pendant qu’ils sont distraits.\n"

HON_solidarity_march:0 "Organiser une marche de solidarité des campesinos"
HON_solidarity_march_desc:0 "Même si notre cause est juste, beaucoup de nos camarades souffrent d’un faible moral. Rappelons-leur pourquoi ils se battent en encourageant les campesinos à descendre dans les rues et à montrer leur amour pour notre révolution.\n"

HON_royal_parade:0 "Financer un défilé royaliste"
HON_royal_parade_desc:0 "Nombre de nos sujets ont oublié la gloire de l’ancien Empire espagnol et du vice-royaume de Nouvelle-Espagne. Ravivons ce sentiment royaliste en finançant un défilé dans notre capitale. Les participants défileront en costumes du Siglo de Oro et se souviendront de la joie et du bonheur que les conquistadors apportèrent à l’Amérique latine.\n"

HON_core_guat:0 "Intégrer le Guatemala"
HON_core_guat_desc:0 "Après la conquête du Guatemala lors d’une guerre spontanée, nous devons intégrer ce territoire à notre nation centraméricaine en pleine expansion.\n"

HON_core_salvador:0 "Intégrer le Salvador"
HON_core_salvador_desc:0 "Après la conquête du Salvador lors d’une guerre spontanée, nous devons intégrer ce territoire à notre nation centraméricaine en pleine expansion.\n"

HON_core_nicaragua:0 "Intégrer le Nicaragua"
HON_core_nicaragua_desc:0 "Après la conquête du Nicaragua lors d’une guerre spontanée, nous devons intégrer ce territoire à notre nation centraméricaine en pleine expansion.\n"

HON_core_costarica:0 "Intégrer le Costa Rica"
HON_core_costarica_desc:0 "Après la conquête du Costa Rica lors d’une guerre spontanée, nous devons intégrer ce territoire à notre nation centraméricaine en pleine expansion.\n"

HON_core_panama:0 "Intégrer le Panama"
HON_core_panama_desc:0 "Après la conquête du Panama lors d’une guerre spontanée, nous devons intégrer ce territoire à notre nation centraméricaine en pleine expansion.\n"

honcorestuff_decisions:0 "Unification de notre nouvelle nation"

