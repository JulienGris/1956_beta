######## ÉVÉNEMENTS ########

######## ÉVÉNEMENTS DE LA LOYA JIRGA ########

AFG_loya_jirga.1.t:0 "Début de la Loya Jirga de [GetYear]"
AFG_loya_jirga.1.desc:0 "Depuis des siècles, le code social pachtoune façonne les normes culturelles et sociales tant des populations que de l'élite. Selon cette tradition, les dirigeants du pays, accompagnés des chefs tribaux, tiennent une Loya Jirga annuelle pour définir la direction du pays en période d'incertitude. \n\nLa Jirga de cette année se concentrera sur des enjeux cruciaux, notamment le statut social des femmes, l'industrialisation de Kaboul, les réformes éducatives récemment introduites et la politique étrangère nationale. Le Roi, accompagné de son cabinet, devrait arriver prochainement. Cependant, les tensions montent, des rapports indiquant le mécontentement des paysans du Nimruz et du Farah concernant la distribution des approvisionnements, tandis que les habitants du nord de Takhar s’inquiètent des récentes attaques basmachi dans leur région. De plus, certaines factions au sein de l’armée pourraient exprimer leur insatisfaction face aux efforts de modernisation militaire en cours. En revanche, Kaboul devrait montrer un fort soutien, surtout après l’ouverture récente de la première université du pays. \n\nLe Roi a été conseillé de prendre une position ferme sur les questions militaires mais de rester ouvert aux concessions si le débat devenait trop houleux. Il faut éviter de répéter les erreurs de la Loya Jirga de 1928 et trouver un équilibre entre les passions des modernisateurs et des traditionalistes pour avancer sereinement."
AFG_loya_jirga.1.a:0 "Nous nous assurerons de ne pas la manquer."

AFG_loya_jirga.2.t:0 "La voie de la modernisation – Question de l’État"
AFG_loya_jirga.2.desc:0 "[AFG.GetNonIdeologyName] reste un État très décentralisé, le gouvernement exerçant peu d’autorité au-delà de la capitale, Kaboul. Cela entraîne une économie inefficace, une administration faible et une armée sous-développée. \n\nLes modernisateurs préconisent d’étendre le contrôle direct de Kaboul sur le pays et de centraliser le pouvoir de l’État, ce qui permettrait de rationaliser la gouvernance, de réduire les inefficiences bureaucratiques et d’améliorer la rentabilité. \n\nCependant, ce changement affecterait significativement la vie des Afghans en dehors de Kaboul, peu habitués à un tel niveau de supervision gouvernementale. Cette proposition devrait donc rencontrer une forte résistance des traditionalistes…"
AFG_loya_jirga.2.a:0 "[AFG.GetNonIdeologyName] doit suivre une voie de centralisation modérée."
AFG_loya_jirga.2.b:0 "Assurer une gouvernance forte et unifiée dans tout le pays est crucial !"

AFG_loya_jirga.3.t:0 "La voie de la modernisation – Statut des femmes"
AFG_loya_jirga.3.desc:0 "Alors que [AFG.GetNonIdeologyName] navigue dans les complexités de la modernisation, la question des droits des femmes est devenue un enjeu majeur lors de la Loya Jirga de cette année. Le clivage entre traditionalistes, qui veulent préserver les normes culturelles, et modernisateurs, qui cherchent à promouvoir les droits et opportunités des femmes, a suscité de vifs débats. \n\nLes traditionalistes estiment que le code social pachtoune doit continuer à guider le rôle des femmes, en soulignant l’importance de la famille et des valeurs culturelles. Ils craignent qu’un élargissement des droits ne compromette la stabilité sociale et n’érode les coutumes qui ont défini la vie afghane pendant des générations. \n\nEn revanche, les modernisateurs préconisent des réformes significatives, telles que l’accès accru à l’éducation, des droits légaux et la participation à la vie publique. Ils affirment que l’émancipation des femmes est essentielle pour le progrès national et contribuera à une société plus prospère et équitable."
AFG_loya_jirga.3.a:0 "Nous devons maintenir le statu quo…"
AFG_loya_jirga.3.b:0 "L’émancipation des femmes est cruciale pour l’avenir de [AFG.GetNonIdeologyName] !"

AFG_loya_jirga.4.t:0 "La voie de la modernisation – Question de l’Islam"
AFG_loya_jirga.4.desc:0 "Depuis un certain temps, de nombreux modernisateurs clés débattent de la compatibilité de l’Islam avec les objectifs futurs de [AFG.GetNonIdeologyName]. Ce débat crucial atteint maintenant son paroxysme, et il est temps de décider si l’Islam doit ou non être séparé de l’État. \n\nLes partisans de l’Islam affirment que l’identité du pays est intrinsèquement liée à ses valeurs religieuses et que la gouvernance doit refléter les enseignements du Coran. Selon eux, un cadre islamique est essentiel pour maintenir la cohésion sociale et l’intégrité morale, en veillant à ce que les lois correspondent aux croyances de la majorité. Le sécularisme représente pour eux un éloignement de la tradition et une menace potentielle pour le tissu de la société afghane. \n\nÀ l’inverse, les partisans du sécularisme considèrent que la séparation de la religion et de l’État est essentielle pour favoriser le progrès et garantir l’égalité des droits pour tous les citoyens, quelle que soit leur foi. Ils soulignent les avantages d’une gouvernance laïque, comme la liberté d’expression, la protection des minorités et la promotion de l’égalité des sexes. Cette faction estime que le sécularisme permettra à [AFG.GetNonIdeologyName] de se moderniser et de rivaliser à l’échelle mondiale tout en respectant les libertés individuelles."
AFG_loya_jirga.4.a:0 "Nous devons réaffirmer notre engagement envers les principes islamiques."
AFG_loya_jirga.4.b:0 "La séparation de la religion et de l’État est essentielle !"

AFG_loya_jirga.5.t:0 "La voie de la modernisation – Réformes sociales"
AFG_loya_jirga.5.desc:0 "La question de l’analphabétisme généralisé est enfin au centre de la Loya Jirga de cette année. Les délégués sont divisés sur la meilleure façon de résoudre ce problème, certains prônant un programme d’alphabétisation complet tandis que d’autres mettent en garde contre des changements trop rapides qui pourraient provoquer les traditionalistes. \n\nLes partisans d’un programme d’alphabétisation à grande échelle estiment qu’une action immédiate est nécessaire pour relever la nation et assurer sa prospérité future. Ils considèrent que l’investissement dans l’éducation est crucial pour développer une main-d’œuvre qualifiée, accroître la participation politique et stimuler la croissance économique. Cette approche ambitieuse envisage une initiative robuste pour éduquer les masses, en particulier les femmes, historiquement marginalisées dans l’accès à l’éducation. \n\nÀ l’inverse, les voix prudentes préconisent une approche plus graduelle, soulignant la nécessité de respecter les sensibilités culturelles et le mode de vie traditionnel. Ils avertissent qu’une poussée soudaine pour une éducation généralisée pourrait provoquer une réaction des factions traditionalistes, qui y verraient une atteinte à leurs coutumes et valeurs. Cette faction suggère de mettre en œuvre des programmes locaux s’appuyant sur les structures communautaires existantes, permettant une transition plus douce vers une alphabétisation accrue sans aliéner ceux méfiants face au changement."
AFG_loya_jirga.5.a:0 "L’élimination progressive de l’analphabétisme est cruciale."
AFG_loya_jirga.5.b:0 "Absurde, l’éducation est le pilier de la stabilité !"

AFG_loya_jirga.6.t:0 "Clôture de la Loya Jirga de [GetYear]"
AFG_loya_jirga.6.desc:0 "Après que tous les chefs tribaux et orateurs ont fait entendre leur voix, la Loya Jirga de [GetYear] est maintenant close.[GetLoyaJirgaEventDesc]. Il est désormais de notre responsabilité de mettre en œuvre les propositions et souhaits formulés par les membres de la Jirga. Bien que nous disposions de temps pour appliquer ces changements, trop de retard pourrait provoquer l’irritation des chefs tribaux."
AFG_loya_jirga.6.a:0 "Parfait."

AFG_loya_jirga_good:0 "Lors de la Jirga, le Roi et son gouvernement ont adopté une approche conciliante et amicale envers ses membres, exprimant un fort désir de coopération et le maintien du statu quo. Le Kābul Times a qualifié la Jirga de cette année de démocratique et transparente."
AFG_loya_jirga_bad:0 "Lors de la Jirga, le Roi et son gouvernement ont adopté une position agressive et peu amicale envers les réformes et les membres de l’assemblée, cherchant des réformes immédiates et radicales. Cette approche a rencontré une forte résistance des délégués et a été vivement critiquée par le Kābul Times et de nombreux autres médias."

AFG_loya_jirga.10.t:0 "Déroulement de la Loya Jirga de 1936"
AFG_loya_jirga.10.d:0 "Alors que la Loya Jirga est sur le point de commencer, nous disposons d’une courte fenêtre pour orienter la direction politique de l’assemblée de cette année. La régence, dirigée par le Premier ministre Muhammad Hashim Khan et le ministre de la Guerre Shah Mahmud Khan, a exhorté le Roi à poursuivre une centralisation et une modernisation graduelles, cherchant un équilibre délicat entre les exigences des modernisateurs et les préoccupations des traditionalistes. Par le passé, toute tentative de réforme rapide a rencontré une forte résistance des populations tribales, opposées aux changements qu’elles considèrent comme une menace pour le Pashtunwali, leur code ancestral de vie. \n\nCes simples citoyens recherchent la stabilité et le respect de leurs coutumes culturelles. Offrir des concessions et rechercher des compromis avec les traditionalistes, en termes d’autonomie locale et de ratification du Hasht Nafari, peut encourager leur coopération avec le gouvernement, assurant un [AFG.GetNonIdeologyName] plus pacifique et uni."
AFG_loya_jirga.10.a:0 "[AFG.GetNonIdeologyName] n’a pas de temps à perdre, les réformes doivent être mises en œuvre rapidement !"
AFG_loya_jirga.10.b:0 "Nous devons appliquer les réformes progressivement, afin de ne pas contrarier les traditionalistes…"

######## AUTRES ÉVÉNEMENTS ########

r56_afghanistan.1.t:0 "Les chefs tribaux offrent leur aide"
r56_afghanistan.1.d:0 "En cette période de besoin, une tribu locale nous a proposé de fournir des soldats pour renforcer notre armée. La tribu, connue pour ses compétences militaires et sa loyauté, est prête à nous assister.\n\nCependant, cette offre comporte des conséquences potentielles. La tribu s'attendra à un traitement préférentiel et pourra demander un rôle plus important dans nos opérations militaires. Si nous l'acceptons, notre armée pourrait devenir dépendante de ces tribus, ce qui pourrait causer des tensions avec d'autres factions du pays."
r56_afghanistan.1.a:0 "Nous pourrions utiliser toute l'aide possible."
r56_afghanistan.1.b:0 "Nous n'avons pas besoin d'une telle assistance."

r56_afghanistan.2.t:0 "[AFG.GetNonIdeologyName] demande un soutien politique"
r56_afghanistan.2.d:0 "[AFG.GetNonIdeologyName] manque de leaders politiques et de révolutionnaires pour diriger le peuple et le Hezb-e Khalq. Nous devrions envoyer des conseillers tadjiks à [AFG.GetNonIdeologyName], car ils sont culturellement et linguistiquement proches de la population locale. Si nous choisissons de ne pas envoyer de soutien diplomatique et politique, [AFG.GetNonIdeologyName] pourrait s'éloigner de nous et suivre une autre voie que celle de [SOV.Capital.GetCapitalVictoryPointName] !"
r56_afghanistan.2.a:0 "Envoyons Nisar Muhammad Yousafzai, le héros de la troisième guerre anglo-afghane."
r56_afghanistan.2.b:0 "Dmitri Protopopov, jeune mais loyal, est l'homme qu'il nous faut."
r56_afghanistan.2.c:0 "Ils ne méritent pas notre temps précieux !"

r56_afghanistan.3.t:0 "Le problème du Tadjikistan"
r56_afghanistan.3.d:0 "Le gouvernement [AFG.GetAdjective] nous a approchés avec une demande intéressante : le transfert de la propriété de [742.GetName] à l'Afghanistan. Cela n'est pas sans raison : les populations tadjikes et pachtounes ont vécu en relative paix pendant des siècles dans [AFG.GetNonIdeologyName] et ont beaucoup en commun. Il serait judicieux d'accorder cette concession, car ils rencontreraient probablement moins de résistance politique de la part des Tadjiks."
r56_afghanistan.3.a:0 "Nous récompenserons la loyauté de [AFG.GetNonIdeologyName]..."
r56_afghanistan.3.b:0 "Ridicule ! Le Tadjikistan fait partie intégrante de [ROOT.GetNameDef] !"

r56_afghanistan.4.t:0 "Les [SOV.GetAdjective] acceptent notre proposition"
r56_afghanistan.4.d:0 "Après avoir reçu notre lettre il y a quelques jours, [SOV.Capital.GetCapitalVictoryPointName] a accepté notre proposition : [742.GetName] sera intégré à [AFG.GetNonIdeologyName]. Nous devons espérer que les Tadjiks n'opposeront pas de résistance à ce changement de gouvernement et de direction locale. Cependant, il faudra à l'avenir équilibrer soigneusement les communautés tadjikes et le reste de [AFG.GetNonIdeologyName], qui est désormais une nation de tous les Tadjiks..."
r56_afghanistan.4.a:0 "Tadjiks et Pachtounes, à nouveau en harmonie !"

r56_afghanistan.5.t:0 "[AFG.GetNonIdeologyName] propose l'invasion de [PER.GetNonIdeologyName]"
r56_afghanistan.5.d:0 "Nous avons reçu une proposition intéressante du gouvernement [AFG.GetAdjective] : une invasion conjointe de [PER.GetNameDef] afin de sécuriser le front sud et éviter toute influence indésirable en Perse. Cela servirait également nos intérêts au Moyen-Orient, sécuriserait davantage de champs pétrolifères et protégerait nos propres ressources à Bakou."
r56_afghanistan.5.a:0 "Brillant ! Préparons les troupes pour l'invasion !"
r56_afghanistan.5.b:0 "Cela ne nous concerne pas pour le moment..."

r56_afghanistan.6.t:0 "Les [SOV.GetAdjective] rejettent notre proposition"
r56_afghanistan.6.d:0 "Après avoir reçu notre lettre il y a quelques jours, [SOV.Capital.GetCapitalVictoryPointName] a décidé de rejeter notre demande. Notre confiance dans le gouvernement [SOV.GetAdjective] est brisée. Bien qu'une grande partie de la population [AFG.GetAdjective] soit ethniquement tadjike, [AFG.GetNonIdeologyName] ne pourra jamais unifier les terres tadjikes !"
r56_afghanistan.6.a:0 "Mauvais choix, M. [SOV.GetLeader] !"

r56_afghanistan.7.t:0 "Des nomades s'installent à [AFG_nomad_state.GetName]"
r56_afghanistan.7.d:0 "De nombreux nomades des déserts et vallées voisins ont décidé de s'installer à [AFG_nomad_state.GetName], selon les rapports des gouverneurs de wilayat. Cela bénéficiera à notre économie, mais nous devons espérer que [AFG_nomad_state.GetName] puisse supporter un tel afflux en peu de temps."
r56_afghanistan.7.a:0 "Plus on est de fous, plus on rit !"

r56_afghanistan.12.t:0 "Visite d'État de [AFG.GetAdjective] à [GER.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.12.d:0 "Après avoir quitté Kābul il y a plusieurs semaines, la famille royale est arrivée à [GER.Capital.GetCapitalVictoryPointName]. À leur arrivée, ils ont été accueillis par [GER.GetLeader] lui-même, ravi de rencontrer la famille royale de [AFG.GetNonIdeologyName]. Lors de cette visite, Sardar Muhammad Hashim Khan a montré un grand intérêt pour le mode de vie et les traditions [GER.GetAdjective]. Lors d'un gala organisé par [GER.GetLeader], il a exprimé son souhait d'accroître la coopération économique et militaire avec [GER.GetNameDef]."
r56_afghanistan.12.a:0 "Peut-être [GER.GetNonIdeologyName] deviendra-t-il le plus fidèle allié de [AFG.GetNonIdeologyName]..."

r56_afghanistan.13.t:0 "Les [SOV.GetAdjective] rejettent l'invasion de [PER.GetNonIdeologyName]"
r56_afghanistan.13.d:0 "Le gouvernement [SOV.GetAdjective] a rejeté notre motion pour envahir [PER.GetNameDef]. Ils ont proclamé que le front sud n'était pas de grande importance et que [PER.GetNameDef] ne représente pas une menace pour les champs pétrolifères de Bakou."
r56_afghanistan.13.a:0 "Quel fiasco, ceux de [SOV.Capital.GetCapitalVictoryPointName]..."

r56_afghanistan.14.t:0 "Les élections [GetYear] en [AFG.GetAdjective]"
r56_afghanistan.14.d:0 "Le chemin vers la démocratie en [AFG.GetNonIdeologyName] a été long et difficile. Enfin, il a été accompli. Les élections [GetYear] en [AFG.GetAdjective] montrent que la démocratie est possible et réalisable, du moins c'est ce que certains disent. [GetElectionWinner]"
r56_afghanistan.14.a:0 "C'est ce que nous aimons voir : des élections libres et, surtout, justes !"
r56_afghanistan.14.b:0 "Un pas de plus vers la vraie démocratie !"
r56_afghanistan.14.c:0 "Falsifions les votes, nous ne pouvons pas nous permettre de perdre..."

r56_afghanistan.15.t:0 "Préparatifs du tour d'Europe d'Amanullah"
r56_afghanistan.15.d:0 "Depuis son retour en [AFG.GetNonIdeologyName], Amanullah planifie un tour royal en Europe. La dernière fois qu'il a tenté cela, il a été interrompu par une guerre civile. Cette fois, il prévoit de visiter Le Caire, Rome, Paris, [ENG.Capital.GetCapitalVictoryPointName], [GER.Capital.GetCapitalVictoryPointName], Varsovie et enfin Istanbul, sur environ 6 mois. Espérons que la situation intérieure reste stable et que le roi revienne sain et sauf."
r56_afghanistan.15.a:0 "Que le roi fasse un voyage sûr !"

r56_afghanistan.16.t:0 "Nisar Muhammad Yousafzai arrive de [SOV.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.16.d:0 "Il y a quelques jours, le rapport envoyé depuis Kābul est parvenu à [SOV.Capital.GetCapitalVictoryPointName] et à [SOV.GetLeader]. Après réception, une assemblée de ses hommes loyaux a débattu sur la proposition. Après de longues discussions, Nisar Muhammad Yousafzai, héros de la troisième guerre anglo-afghane, accompagné de Vitaly Primakov, arrivera bientôt à Kābul.

r56_afghanistan.16.a:0 "Camarade, bienvenue à [AFG.Capital.GetCapitalVictoryPointName] !"

r56_afghanistan.17.t:0 "Dmitri Protopopov arrive depuis [SOV.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.17.d:0 "Il y a quelques jours, le rapport envoyé depuis Kābul est arrivé à [SOV.Capital.GetCapitalVictoryPointName] entre les mains de [SOV.GetLeader]. Après avoir reçu la nouvelle, [SOV.GetLeader] a convoqué ses hommes les plus fidèles pour débattre avec soin de la proposition présentée. Après de longues heures de débats houleux, une décision a été prise : Dmitri Protopopov, figure éminente de la politique tadjike, accompagné de Vitaly Primakov, commandant adjoint du district militaire de Leningrad, arrivera bientôt à Kābul. Protopopov deviendra également le dirigeant principal du Khalq et de la nation [AFG.GetAdjective]."
r56_afghanistan.17.a:0 "Camarade, bienvenue à [AFG.Capital.GetCapitalVictoryPointName] !"

r56_afghanistan.18.t:0 "Les [SOV.GetAdjective] refusent notre demande !"
r56_afghanistan.18.d:0 "Il y a quelques jours, le rapport envoyé depuis Kābul est arrivé à [SOV.Capital.GetCapitalVictoryPointName] entre les mains de [SOV.GetLeader]. Après avoir reçu la nouvelle, [SOV.GetLeader] a convoqué ses hommes les plus fidèles pour débattre de la proposition présentée. Après de longues heures de discussions, en raison de désaccords importants parmi les bolcheviks, aucune décision n’a été prise. Il semble que [SOV.Capital.GetCapitalVictoryPointName] ne s’intéresse pas à [AFG.GetNonIdeologyName]. Nous ne pouvons qu’espérer que cela ne signifie pas la fin des relations [SOV.GetAdjective]-[AFG.GetAdjective]."
r56_afghanistan.18.a:0 "Comment osent-ils ! C’est inacceptable !"

r56_afghanistan.19.t:0 "La crise du Conseil"
r56_afghanistan.19.d:0 "Le Conseil révolutionnaire est trop longtemps resté sans président, nous ne pouvons pas nous attendre à ce qu’il continue à fonctionner sans un vrai dirigeant. Il est temps d’élire un président, car les [SOV.GetAdjective] n’ont pas fourni suffisamment de leaders capables de diriger le Conseil révolutionnaire. La stabilité et l’ordre doivent être maintenus au sein du parti !"
r56_afghanistan.19.a:0 "La stabilité doit être maintenue à tout prix !"
r56_afghanistan.19.b:0 "Favoriser les Parchamites..."

r56_afghanistan.20.t:0 "Festival annuel des sports turkmènes"
r56_afghanistan.20.d:0 "Le roi de [AFG.GetNonIdeologyName], Muhammad Zahir Shah, a assisté au festival annuel des sports turkmènes, organisé dans une ville proche de Kābul. Ce festival local de chevaux sert à distraire le peuple de [AFG.GetNonIdeologyName] d’un monde qui sombre peu à peu dans le chaos. Heureusement, le peuple [AFG.GetAdjective] n’a pas besoin de s’inquiéter : une invasion étrangère semble improbable, n’est-ce pas ?"
r56_afghanistan.20.a:0 "Avec le roi au pouvoir, [AFG.GetNonIdeologyName] est invincible !"
r56_afghanistan.20.b:0 "Il fait la fête tandis que le monde brûle... Honteux !"

r56_afghanistan.21.t:0 "Arrestation de Mawlana Qiamuddin Khadim"
r56_afghanistan.21.d:0 "Plus tôt dans la journée, un raid a été mené par le KhAD au domicile de Qiamuddin. Il a été arrêté pour un complot présumé contre le gouvernement et le parti d’Afghanistan. Le chef du KhAD a proposé trois solutions : l’exécuter, ce qui irriterait la faction Parcham mais éliminerait un de ses leaders les plus influents ; simplement l’arrêter et l’éloigner de la politique [AFG.GetAdjective] ; ou le libérer, ce qui provoquerait de l’instabilité mais renforcerait le Parcham."
r56_afghanistan.21.a:0 "Je dis, envoyons-le à la potence !"
r56_afghanistan.21.b:0 "Arrêtons le traître, il sera condamné à la prison à vie."
r56_afghanistan.21.c:0 "Libérons-le, nous devons chercher la coopération avec les Parchamites..."

r56_afghanistan.22.t:0 "Décès de Mawlana Qiamuddin Khadim en prison"
r56_afghanistan.22.d:0 "Pendant sa détention, le leader du Parcham, Mawlana Qiamuddin Khadim, est décédé aujourd’hui. De nombreuses personnes avaient boycotté et protesté contre son arrestation, mais nous avons réussi à réprimer ces manifestations. Beaucoup se demandent comment le Parcham continuera sans son leader."
r56_afghanistan.22.a:0 "Jusqu’où irons-nous ?"

r56_afghanistan.23.t:0 "Fin de la réforme éducative"
r56_afghanistan.23.d:0 "Après de nombreuses années et mois, [AFG.GetNonIdeologyName] a enfin terminé sa réforme éducative. De nombreuses écoles rurales ont été ouvertes à travers le pays afin d’éduquer le peuple. Presque tous les habitants de [AFG.GetNonIdeologyName] sont maintenant alphabétisés, y compris de nombreux adultes. Nous devons continuer à améliorer cette nation autant que possible. Espérons que la prochaine génération de penseurs [AFG.GetAdjective] apportera à notre nation la gloire et le respect qu’elle mérite !"
r56_afghanistan.23.a:0 "L’avenir de [AFG.GetNonIdeologyName] semble prometteur !"

r56_afghanistan.24.t:0 "Muhammad Amin Bughra nous approche"
r56_afghanistan.24.d:0 "Dans le corridor du Wakhan, une guerre éclate dans une contrée lointaine. Aujourd’hui à l’aube, environ quarante hommes sont arrivés à Kābul à cheval, venant de l’est, de la région d’Altishahr en guerre. Épuisés après plusieurs jours de voyage mais avec beaucoup à transmettre, ils ont immédiatement demandé à rencontrer [AFG.GetLeader]. Après identification, leur demande a été acceptée.\n\nLe leader de cette expédition n’était autre que Muhammad Amin Bughra, leader exilé de la République d’Asie orientale. Lui et certains de ses hommes ont parcouru des centaines de kilomètres pour annoncer la rébellion de Kashgar à Kābul et demander un soutien militaire pour [TNG.GetNameDef]. Nos généraux et officiers ont conseillé à [AFG.GetLeader] de les aider : notre soutien pourrait être crucial pour eux."
r56_afghanistan.24.a:0 "Vous avez notre soutien total !"
r56_afghanistan.24.b:0 "Juste... laissez partir les plus enthousiastes, nous ne voulons pas de problèmes..."
r56_afghanistan.24.c:0 "[AFG.GetNonIdeologyName] ne doit pas s’associer avec vous..."

r56_afghanistan.25.t:0 "Le vol au-dessus des montagnes du Pamir"
r56_afghanistan.25.d:0 "À l’aube du 24 août, trois hommes courageux entreprennent la tâche la plus audacieuse : traverser le Pamir. Après des semaines de préparation, ces trois hommes [GER.GetAdjective] opérant pour Lufthansa, une agence aérienne [GER.GetAdjective], décident que ce jour est celui du départ, espérant atteindre les montagnes et déserts au-delà. Si tout se passe bien, ils devraient revenir dans au moins deux semaines."
r56_afghanistan.25.a:0 "Quel merveilleux moment ! Que leur voyage soit sûr !"

r56_afghanistan.26.t:0 "Disparition du vol du Pamir"
r56_afghanistan.26.d:0 "Trois semaines ont passé sans nouvelles du vol du Pamir. Selon nos estimations, ils auraient dû arriver il y a quatre jours, mais ils ne sont pas là. Cependant, il reste de l’espoir : nos calculs pourraient être incorrects et ils pourraient arriver à tout moment. Nous prions pour leur retour sain et sauf."
r56_afghanistan.26.a:0 "Ô Seigneur, que leur est-il arrivé ?"

r56_afghanistan.27.t:0 "Le vol du Pamir atterrit à [AFG.Capital.GetCapitalVictoryPointName] !"
r56_afghanistan.27.d:0 "Après un mois, le vol du Pamir est enfin localisé et confirmé en vie. Quelques jours après le contact radio, l’équipage atterrit à Kābul et est accueilli comme des héros nationaux. Une grande réussite : le premier vol au-dessus du Pamir a eu lieu !"
r56_afghanistan.27.a:0 "Ouf... au moins ils sont en sécurité."
r56_afghanistan.27.b:0 "Ils doivent être proclamés Héros Nationaux de [AFG.GetNonIdeologyName] !"
r56_afghanistan.27.c:0 "Quel exploit historique ! Peut-être pourraient-ils aider l’aviation militaire..."

r56_afghanistan.28.t:0 "Capture de la famille royale"
r56_afghanistan.28.d:0 "Alors que le bruit des canons et des fusils s’éteint, on apprend que la famille royale de [AFG.GetNonIdeologyName], y compris le roi Zahir Shah, a été capturée lors de leur tentative de fuite. La famille royale voulait s’enfuir par avion, mais des circonstances imprévues ont fait échouer leurs plans aux mains de l’Armée Rouge [AFG.GetNonIdeologyName]. Enfin, le roi devra répondre de ses actes !"
r56_afghanistan.28.a:0 "Prêt... Visez... Feu !"

r56_afghanistan.29.t:0 "La famille royale de [AFG.GetNonIdeologyName] demande l’asile"
r56_afghanistan.29.d:0 "Suite au récent coup d’État à [AFG.GetNameDefCap] et à la chute du royaume de [AFG.GetNonIdeologyName], le roi Zahir Shah et la famille royale ont été déposés. Heureusement, ils ont échappé aux communistes et ont quitté le pays, cherchant refuge sur notre territoire."
r56_afghanistan.29.a:0 "Ils sont les bienvenus ici !"
r56_afghanistan.29.b:0 "Faites-les partir, il n'y a pas de place pour eux à [ROOT.Capital.GetCapitalVictoryPointName]..."

r56_afghanistan.30.t:0 "Jamiat-e Islami a été approché"
r56_afghanistan.30.d:0 "Après que Faqir a été contacté dans la récente lutte contre le Roi, le fait que le Roi ait adopté une approche purement symbolique, Muhammad Hashim Khan, le Premier ministre, étant une figure de gouvernance clairement libérale, la Jamiat a été approchée et Maududi, un activiste politique islamiste bien connu, a accepté d'émettre une fatwa contre Hashim Khan, le déclarant 'Taghut' ou 'Tyran', une personne contre laquelle la rébellion ouverte est justifiée."
r56_afghanistan.30.a:0 "La fatwa sera publique ! Nous ne tolérerons plus cette tyrannie !"
r56_afghanistan.30.b:0 "Émettez la fatwa avec prudence, entre les membres de la rébellion, pour ne pas provoquer de conflit..."

r56_afghanistan.31.t:0 "Les chefs tribaux promettent leur soutien"
r56_afghanistan.31.d:0 "Comme prochaine étape pour établir des sentiments anti-gouvernementaux dans le pays, nous contacterons les tribus largement isolées qui ne connaissent rien à la politique nationale, avec des promesses de les développer industriellement et de les rendre plus politiquement présentes. Nous pouvons sécuriser leur soutien, mais cela pourrait avoir des conséquences : si nous tentons de centraliser le pouvoir, ils pourraient se révolter dans certaines zones."
r56_afghanistan.31.a:0 "Super !"

r56_afghanistan.32.t:0 "Renforts de Jamiat-e Islami arrivés"
r56_afghanistan.32.d:0 "La Jamiat-e Islami, que nous avons beaucoup soutenue dans notre groupe de résistance, nous a apporté des renforts très nécessaires en grand nombre. Les forces islamistes ont traversé la ligne Durand et ont rejoint leurs compatriotes dans la lutte contre les tyrans de Kābul !"
r56_afghanistan.32.a:0 "Unis seulement, nous pourrons vaincre les tyrans de notre peuple !"

r56_afghanistan.33.t:0 "Renforts de Jamiat-e Islami arrivés"
r56_afghanistan.33.d:0 "La Jamiat-e Islami, que nous avons beaucoup soutenue dans notre groupe de résistance, nous a apporté des renforts très nécessaires en grand nombre. Les forces islamistes ont traversé la ligne Durand et ont rejoint leurs compatriotes dans la lutte contre les tyrans de Kābul !"
r56_afghanistan.33.a:0 "Unis seulement, nous pourrons vaincre les tyrans de notre peuple !"

r56_afghanistan.34.t:0 "Soutien tribal arrivé"
r56_afghanistan.34.d:0 "Les tribus ont tenu leur promesse d'aide et nous ont envoyé une grande quantité d'armes que nos moudjahidines peuvent utiliser dans leur jihad contre le gouvernement. Elles peuvent être anciennes, mais nous avons besoin de tout ce que nous pouvons obtenir."
r56_afghanistan.34.a:0 "Formidable !"

r56_afghanistan.35.t:0 "La Constitution de [AFG.GetNonIdeologyName] - Question du Shura"
r56_afghanistan.35.d:0 "Le Shura, ou 'Conseil' en pachto, représente un principe islamique ancien qui promeut l'établissement d'un conseil consultatif entre le leader et certains conseillers que le Roi ou l'Émir tiendrait près de lui. Pendant les premières phases de l'Islam, les califats, comme les Rashidun, ont mis en place des conseils de conseillers qui, en temps de besoin, aidaient le leader sur les affaires de l'État.\n\nCependant, pendant des siècles, la question de savoir qui exactement pouvait nommer ces conseillers n'a jamais été pleinement résolue. Certains pensent que seuls les élites les plus puissantes du pays devraient avoir une influence sur les choix du leader, d'autres pensent que le leader lui-même devrait avoir le droit d'élire son conseil, tandis qu'une approche plus moderne, la démocratie, gagne en popularité, permettant aux hommes de plus de vingt-cinq ans de voter pour les conseillers."
r56_afghanistan.35.a:0 "Seuls les plus brillants et les plus riches ont des intentions pures pour la nation !"
r56_afghanistan.35.b:0 "C'est l'affaire de l'Émir, et de l'Émir seulement !"
r56_afghanistan.35.c:0 "L'approche moderne semble certainement séduisante pour le peuple..."

r56_afghanistan.36.t:0 "La Constitution de [AFG.GetNonIdeologyName] - Mise en œuvre de la charia"
r56_afghanistan.36.d:0 "La charia est la loi divine que tout État islamique ou califat doit chercher à suivre et à mettre en œuvre, telle qu'écrite dans le Coran et ordonnée par le messager d'Allah, le prophète Muhammad, paix soit sur lui. Elle consiste en certaines des lois civiles, financières et sociales les plus fondamentales que chaque personne doit respecter, sous peine de jugement devant un tribunal de savants islamiques, appelés Qadis.\n\nDans le passé, il y a eu de nombreuses interprétations et mises en œuvre de ces lois, les trois principales étant l'interprétation de l'époque des Rashidun, qui promeut la loyauté envers le leader et le service militaire comme qualité suprême de tout homme apte, l'interprétation de l'époque des Omeyyades, qui se concentre surtout sur l'expansion territoriale rapide et radicale, le pouvoir et la diffusion subséquente de l'Islam, et enfin l'interprétation moderne de l'époque ottomane, axée sur la fusion de l'âge moderne et des technologies avec les enseignements de l'Islam, tout en protégeant les valeurs et traditions islamiques."
r56_afghanistan.36.a:0 "[AFG.GetNonIdeologyName] sera aussi vertueux que les Rashidun !"
r56_afghanistan.36.b:0 "Un nouvel âge d'or de l'Islam, voilà le but de [AFG.GetNonIdeologyName] !"
r56_afghanistan.36.c:0 "Fusionner la technologie moderne avec les enseignements de l'Islam est notre objectif !"

r56_afghanistan.37.t:0 "La Constitution de [AFG.GetNonIdeologyName] - Le rôle des Oulémas"
r56_afghanistan.37.d:0 "Les Oulémas, étant les plus brillants et les plus religieux, jouent un rôle très important dans toute nation islamique, parfois comme moteurs de réforme ou leaders dans les périodes difficiles. Il est toutefois essentiel pour une nation, et surtout pour son leader, de garder ses Oulémas loyaux et satisfaits.\n\nCela étant dit, la nation peut utiliser les Oulémas de nombreuses manières, que ce soit comme fonctionnaires et administrateurs, réformateurs militaires, modernisateurs et enseignants, ou financièrement, via banques et trésors, ainsi que dans l’éducation des enfants de la nation."
r56_afghanistan.37.a:0 "L'administration pourrait utiliser un coup de main..."
r56_afghanistan.37.b:0 "Un pays fort et puissant a besoin d'une armée forte et puissante !"
r56_afghanistan.37.c:0 "Les enfants de la nation n'apprendront qu'avec les meilleurs."

r56_afghanistan.38.t:0 "La Constitution de [AFG.GetNonIdeologyName] - Questions de la Zakat"
r56_afghanistan.38.d:0 "La Zakat est un principe fondamental de l'Islam, qui stipule que tout homme apte et travaillant doit donner une petite partie, presque 3 %, de son salaire aux pauvres et aux sans-abris, qui, malheureusement, ne peuvent subvenir à leurs besoins.\n\nIl existe plusieurs façons de donner la Zakat : elle peut être gérée par l'État, introduite comme un impôt ou tarif supplémentaire, ou organisée directement par le peuple, ce qui serait plus simple à mettre en œuvre, ou encore une combinaison des deux, avec coopération entre l'État et le peuple."
r56_afghanistan.38.a:0 "Seul l'État peut garantir que cela soit fait correctement !"
r56_afghanistan.38.b:0 "Direct et simple, il n'y a pas besoin d'intermédiaire."
r56_afghanistan.38.c:0 "Une union des deux propositions semble la plus séduisante..."

r56_afghanistan.39.t:0 "La Constitution de [AFG.GetNonIdeologyName] - Fondements du Jihad"
r56_afghanistan.39.d:0 "La lutte sainte ou 'Jihad' en arabe est l'un des principes les plus importants de l'Islam. Le Jihad est l'arme la plus importante de toute nation islamique, comme l'histoire l'a montré à maintes reprises. 
Le Jihad ne signifie pas seulement la lutte militaire et physique contre un ennemi, il peut aussi désigner la résistance pacifique et non-violente face à un occupant, par exemple. Ce que nous considérons comme la base du Jihad déterminera si le pays de [AFG.GetNonIdeologyName] triomphe ou périclite, comme les innombrables empires qui se sont effondrés avant lui..."
r56_afghanistan.39.a:0 "Ce n'est que par des moyens militaires que les objectifs de notre nation et de l'Islam peuvent être atteints !"
r56_afghanistan.39.b:0 "La vie de chaque homme sera son propre Jihad !"
r56_afghanistan.39.c:0 "L'Islam a survécu si longtemps grâce à sa résilience, et il continuera ainsi !"

r56_afghanistan.40.t:0 "La Constitution de [AFG.GetNonIdeologyName] est adoptée !"
r56_afghanistan.40.d:0 "Après d'innombrables discussions passionnées sur divers sujets, allant de l'administration, à la société, jusqu'au domaine militaire, le sceau de [AFG.GetNonIdeologyName] a enfin apposé la première constitution islamique de [AFG.GetNonIdeologyName]. Avec le soutien de la Loya Jirga, de la Shura et des Qadis et Sheikhs, la Constitution de [GetYear] est mise en œuvre et appliquée immédiatement. Que le nom de [AFG.GetNonIdeologyName] et le peuple [AFG.GetAdjective] prospèrent pendant mille ans et mille ans de plus, Inshallah !"
r56_afghanistan.40.a:0 "Vive [AFG.GetNonIdeologyName] !"

r56_afghanistan.41.t:0 "Rassemblement pacifique à [AFG_communist_state_target.GetName]"
r56_afghanistan.41.d:0 "Le dernier rassemblement du [PER.GetCommunistParty] à [AFG_communist_state_target.GetName] s'est déroulé pacifiquement, sans incidents. Cela améliorera grandement notre image et attirera beaucoup de monde vers notre cause. Nous ne pouvons qu'espérer que cela continue !"
r56_afghanistan.41.a:0 "Formidable !"

r56_afghanistan.42.t:0 "Rassemblement socialiste à [AFG_communist_state_target.GetName]"
r56_afghanistan.42.d:0 "Le dernier rassemblement du [PER.GetCommunistParty] à [AFG_communist_state_target.GetName] s'est déroulé relativement pacifiquement avec quelques incidents. Certains extrémistes communistes ont affronté l'opposition, ce qui a provoqué des altercations. La Police [PER.GetAdjective] a dû intervenir pour calmer la situation. Nous devons être prudents afin de ne pas provoquer de réactions violentes."
r56_afghanistan.42.a:0 "Nous devons être prudents."

r56_afghanistan.43.t:0 "Rassemblement violent à [AFG_communist_state_target.GetName]"
r56_afghanistan.43.d:0 "Le dernier rassemblement du [PER.GetCommunistParty] à [AFG_communist_state_target.GetName] a été désastreux, de nombreuses personnes ont été blessées des deux côtés, certaines grièvement, et ont été transportées à l'hôpital. Nous devons écraser cet extrémisme ! Si nous échouons, une guerre civile à [PER.GetNameDef] semble plus probable."
r56_afghanistan.43.a:0 "Cela devient plutôt dangereux..."

r56_afghanistan.44.t:0 "[AFG.GetNonIdeologyName] propose un cessez-le-feu"
r56_afghanistan.44.d:0 "En raison de la présence des forces [AFG.GetAdjective] sur des territoires au [PAK.GetNonIdeologyName], notre incapacité à les frapper a épuisé notre armée. Il semble préférable de céder ces territoires, qui ne nous ont apporté que des problèmes et sont peu développés."
r56_afghanistan.44.a:0 "Non ! Nous continuerons le combat jusqu'au bout !"
r56_afghanistan.44.b:0 "Ce qui est le mieux pour la nation..."

r56_afghanistan.45.t:0 "[AFG.GetNonIdeologyName] demande une assistance militaire"
r56_afghanistan.45.d:0 "Pour protéger leur nation et leur peuple, situés dans une zone stratégique, et sachant que le gouvernement [AFG.GetAdjective] est entouré d'ennemis potentiels sans accès à la mer, ce dernier a demandé l'envoi de troupes [GER.GetAdjective] pour garantir leur souveraineté et défendre les intérêts [GER.GetAdjective]."
r56_afghanistan.45.a:0 "Nous ne pouvons pas nous permettre de perdre un autre allié."
r56_afghanistan.45.b:0 "Nos troupes doivent rester chez elles, là où elles appartiennent !"

r56_afghanistan.46.t:0 "L'assistance militaire [GER.GetAdjective] arrive"
r56_afghanistan.46.d:0 "Le gouvernement [GER.GetAdjective] a accepté d'envoyer cinq détachements de la Wehrmacht pour aider notre armée à défendre notre territoire. Ils justifient cette aide par l'importance stratégique de [AFG.GetNonIdeologyName] et son rôle d'allié potentiel des [GER.GetAdjective] dans la région."
r56_afghanistan.46.a:0 "Excellent !"

r56_afghanistan.47.t:0 "Les [GER.GetAdjective] refusent notre demande"
r56_afghanistan.47.d:0 "Citant en particulier la priorité de la défense de leur territoire, les [GER.GetAdjective] ont refusé d'envoyer des troupes pour défendre [AFG.GetNameDef] et fournir une assistance militaire. Est-ce vraiment l'allié que [AFG.GetNonIdeologyName] souhaite avoir à ses côtés ?"
r56_afghanistan.47.a:0 "Quel triste excuse d'allié !"

r56_afghanistan.48.t:0 "Les communistes prennent d'assaut [266.GetName] !"
r56_afghanistan.48.d:0 "Aujourd'hui, les membres du [PER.GetCommunistParty] ont pris d'assaut la capitale et le Parlement de [PER.GetNameDef], renversant le gouvernement en place et proclamant la République socialiste iranienne. Le soutien à ce coup d'État a été suffisant pour que la résistance soit minimale. C'est la fin de [PER.GetRulingParty], mais le début du communisme en [PER.GetNameDef]."
r56_afghanistan.48.a:0 "Une défaite tragique !"

r56_afghanistan.50.t:0 "[AFG.GetNonIdeologyName] plaide pour une plus grande unité"
r56_afghanistan.50.d:0 "Grâce à notre coopération économique et politique croissante avec [AFG.GetNonIdeologyName], ils ont proposé une unification de [ROOT.GetNameDef] avec [AFG.GetNameDef] pour unir la flamme révolutionnaire du Moyen-Orient sous une seule bannière. À nous de décider d'accepter ou de rejeter cette proposition."
r56_afghanistan.50.a:0 "Une idée brillante !"
r56_afghanistan.50.b:0 "Absolument pas !"

r56_afghanistan.51.t:0 "[AFG.GetNonIdeologyName] réclame les terres pachtounes !"
r56_afghanistan.51.d:0 "Le gouvernement [AFG.GetAdjective] a demandé le contrôle des régions de [444.GetName], [442.GetName] et [445.GetName], invoquant leur revendication historique et le grand nombre de Pachtounes vivant dans ces zones. Pour maintenir de bonnes relations avec [AFG.GetNonIdeologyName], nous pourrions céder à leurs demandes."
r56_afghanistan.51.a:0 "Céder à leurs demandes."
r56_afghanistan.51.b:0 "'Terres pachtounes', quelle absurdité !"

r56_afghanistan.52.t:0 "Le retour du roi Amanullah"
r56_afghanistan.52.d:0 "Voyant que les conditions sont parfaites pour son retour, Amanullah Khan a été invité à revenir à [AFG.GetNonIdeologyName]. Il a accepté avec joie l'invitation, cherchant à améliorer [AFG.GetNonIdeologyName] et corriger ses erreurs passées qui avaient conduit à la révolte saqqawiste en 1929. Il a exprimé sa gratitude envers Haji Mirzali Khan pour l'invitation."
r56_afghanistan.52.a:0 "Offrez-lui un poste administratif important..."
r56_afghanistan.52.b:0 "Le roi est enfin de retour, et le royaume aussi !"

r56_afghanistan.53.t:0 "La deuxième guerre civile [AFG.GetAdjective]"
r56_afghanistan.53.d:0 "Au cours de la semaine passée, de nombreux chefs tribaux en [AFG.GetNonIdeologyName] se sont exprimés contre le Roi et la Régence, composée principalement de ses deux oncles, Muhammad Hashim Khan et Shah Mahmud Khan. À leurs yeux, le gouvernement de [AFG.GetNonIdeologyName] est devenu trop moderne et s'est trop éloigné des valeurs et coutumes traditionnalistes du peuple afghan. Dans cet esprit, ils ont décidé de lancer une rébellion à grande échelle pour renverser le régime. Beaucoup spéculent que le leader du Jamiat-e Islami, Abul A'la al-Maududi, est également impliqué dans le conflit, cependant, aucune preuve ne permet de confirmer ce soupçon."
r56_afghanistan.53.a:0 "Ce sont toujours les [AFG.GetAdjective]s, n'est-ce pas ?"
r56_afghanistan.53.b:0 "Mort aux tyrans ! Mort au Roi !"

r56_afghanistan.54.t:0 "Intervention militaire en [AFG.GetNonIdeologyName] ?"
r56_afghanistan.54.d:0 "Il y a seulement quelques mois, une guerre civile a éclaté en [AFG.GetNonIdeologyName]. La raison en était le mécontentement face au gouvernement, qui gagnait plus de contrôle sur la population, et la poussée accrue vers la modernisation. Ils ont décidé qu'il était temps de mettre fin à la prétendue tyrannie du gouvernement actuel et, par conséquent, des révoltes généralisées ont éclaté dans tout [AFG.GetNonIdeologyName]. Cependant, ce conflit dure depuis un certain temps, nous pourrions en profiter pour attaquer [AFG.GetNonIdeologyName] pendant qu'ils sont faibles et divisés. Que devons-nous faire ?"
r56_afghanistan.54.a:0 "La poussière retombera d'elle-même."
r56_afghanistan.54.b:0 "Un soutien matériel devrait suffire."
r56_afghanistan.54.c:0 "Mobilisez l'Armée Rouge !"

r56_afghanistan.55.t:0 "Résistance en [PAK.GetNonIdeologyName] ?"
r56_afghanistan.55.d:0 "La résistance en [PAK.GetNonIdeologyName] a atteint un niveau record ces dernières semaines, la cause est inconnue. Cependant, nos agents ont réussi à lier le gouvernement [AFG.GetAdjective] aux mouvements de résistance en [PAK.GetNonIdeologyName], car un stock d'équipements militaires a été saisi lors d'une perquisition chez un résistant [PAK.GetAdjective] suspecté. Nous avons pu confirmer que ces armes proviennent effectivement de [AFG.GetNonIdeologyName]. Que cela continue ou non, nous ne pouvons le savoir."
r56_afghanistan.55.a:0 "Nous devons rester vigilants..."

r56_afghanistan.56.t:0 "La tournée royale arrive au Caire"
r56_afghanistan.56.d:0 "Après avoir quitté Quetta, la tournée royale est arrivée au Caire où ils ont été accueillis par [EGY.GetLeader]. Un défilé militaire a eu lieu dans la capitale et Amanullah a salué les soldats [EGY.GetAdjective]. [EGY.GetLeader] et Amanullah ont ensuite discuté des liens entre les deux pays. Après avoir passé une semaine au Caire, la tournée royale a repris la mer, cette fois en direction de Rome."
r56_afghanistan.56.a:0 "Nos pays se ressemblent beaucoup, vous savez ?"

r56_afghanistan.57.t:0 "La famille royale arrive à Rome"
r56_afghanistan.57.d:0 "Après une semaine au Caire, la tournée royale a mis le cap sur Rome. À leur arrivée, ils ont été accueillis par une cérémonie militaire et [ITA.GetLeader]. Lors de sa dernière visite à Rome, Amanullah avait reçu l'Ordre suprême de la Très Sainte Annonciation par le roi de [ITA.GetNonIdeologyName]. Amanullah a également rencontré le pape Pie XI du Saint-Siège. Le roi a été impressionné par les avancées industrielles et technologiques qu'il a vues à Rome. La tournée royale a passé beaucoup de temps à Rome, mais après quelques semaines, ils ont embarqué pour Marseille."
r56_afghanistan.57.a:0 "Il semble y avoir beaucoup à apprendre des [ITA.GetAdjective]s."

r56_afghanistan.58.t:0 "Amanullah rencontre [FRA.GetLeader]"
r56_afghanistan.58.d:0 "La tournée royale s'est dirigée vers Marseille il y a environ un mois, puis a pris un train pour Paris. Une fois à Paris, ils ont été accueillis par un défilé militaire et une salve de coups de canon en l'honneur du roi Amanullah. [FRA.GetLeader] a accueilli le couple royal et leur a offert une Peugeot 202 haut de gamme. Après avoir passé une semaine à explorer la ville animée, Amanullah est parti pour [GER.Capital.GetCapitalVictoryPointName]."
r56_afghanistan.58.a:0 "Oh, cher [FRA.GetAdjective], toujours d'un goût exquis et somptueux, et généreux comme toujours !"

r56_afghanistan.59.t:0 "Le roi visite [GER.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.59.d:0 "Après avoir quitté Paris, le roi germanophile a pris un train pour [GER.Capital.GetCapitalVictoryPointName]. Après quelques jours, Amanullah a été accueilli sur le Pariser Platz par [GER.GetLeader]. Le roi a été impressionné par l'armée [GER.GetAdjective] au point de demander une livraison de Stahlhelms [GER.GetAdjective] à [AFG.GetNonIdeologyName]. Amanullah a pu prendre la parole au Reichstag, où son discours a été accueilli favorablement par les membres du [GER.GetRulingParty] et par [GER.GetLeader] lui-même. Après avoir admiré l'architecture et l'art [GER.GetAdjective], Amanullah a décidé de quitter [GER.Capital.GetCapitalVictoryPointName] pour [ENG.Capital.GetCapitalVictoryPointName]."
r56_afghanistan.59.a:0 "[GER.GetNonIdeologyName], véritable avant-garde de la technologie et de la modernité !"

r56_afghanistan.60.t:0 "Amanullah arrive à [ENG.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.60.d:0 "Après avoir quitté [GER.Capital.GetCapitalVictoryPointName], le couple royal a voyagé jusqu'à Dover à bord du SS 'Maid of Orleans'. Peu après, ils se sont dirigés vers [ENG.Capital.GetCapitalVictoryPointName], où ils ont été reçus par [ENG.GetLeader]. Une cérémonie militaire a eu lieu en l'honneur d'Amanullah. Le roi a souligné l'importance de [ENG.GetNameDef] pour [AFG.GetNonIdeologyName], tant comme partenaire militaire qu'économique. [ENG.GetLeader] a approuvé et déclaré que [ENG.GetNameDef] améliorerait la coopération entre les deux nations. Après avoir passé quelques semaines à [ENG.Capital.GetCapitalVictoryPointName], Amanullah et la tournée royale ont quitté pour Varsovie."
r56_afghanistan.60.a:0 "Magnifique !"

r56_afghanistan.61.t:0 "La tournée royale visite Varsovie"
r56_afghanistan.61.d:0 "Après leur visite à [ENG.Capital.GetCapitalVictoryPointName], le couple royal s'est rendu à Varsovie, où ils sont arrivés quelques semaines plus tard. À Varsovie, ils ont été accueillis par [POL.GetLeader]. Une cérémonie militaire a eu lieu en l'honneur d'Amanullah. Amanullah et [POL.GetLeader] ont parcouru la capitale en voiture tout en discutant de la politique européenne. Le roi a ensuite rencontré les ministres polonais qu'il a salués chaleureusement. Après un court séjour à Varsovie, la tournée royale a entamé son voyage vers sa destination finale, Istanbul."
r56_afghanistan.61.a:0 "Varsovie... était-ce vraiment nécessaire ?"

r56_afghanistan.62.t:0 "Amanullah rencontre [TUR.GetLeader]"
r56_afghanistan.62.d:0 "Après la visite à Varsovie, où la tournée royale n’a pas passé beaucoup de temps, Amanullah a quitté la Pologne pour la Turquie. Ils sont arrivés à Istanbul une semaine plus tard, où ils ont été accueillis par [TUR.GetLeader] et les soldats [TUR.GetAdjective] lors d'une parade en l'honneur d'Amanullah. [TUR.GetLeader] a souligné l'importance de la coopération au Moyen-Orient et les ambitions [TUR.GetAdjective] pour la région. Amanullah a largement approuvé les déclarations de [TUR.GetLeader] et a exprimé son soutien pour renforcer la coopération entre [TUR.GetNameDef] et [AFG.GetNonIdeologyName]. Comme il s'agissait de la dernière étape de la tournée royale en Europe, beaucoup de temps a été passé à Istanbul. Après deux semaines, Amanullah a quitté Istanbul pour Kābul."
r56_afghanistan.62.a:0 "Toujours un grand moment, j'imagine !"

r56_afghanistan.63.t:0 "La tournée royale revient à [AFG.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.63.d:0 "Enfin, après six mois à l’étranger, Amanullah Khan et la reine Soraya Tarzi sont arrivés à Kābul. Cela marque la fin de la tournée royale en Europe. Amanullah a été accueilli par le peuple à Kābul, puis escorté vers le palais de Darulaman. Après avoir passé beaucoup de temps à l’étranger, Amanullah revient avec de nouvelles perspectives sur la politique intérieure et étrangère. Amanullah a promis de réformer [AFG.GetNonIdeologyName], la transformant d’une région sous-développée en une nation moderne à l’occidentale."
r56_afghanistan.63.a:0 "Enfin, le roi revient... un homme nouveau..."

r56_afghanistan.64.t:0 "Autodétermination pour [442.GetName] ?"
r56_afghanistan.64.d:0 "Les terres du nord de [442.GetName], également appelées Pashtunkhwa ou Afghania, sont depuis des siècles habitées par les Pachtouns et les [AFG.GetAdjective]s. Ils sont bien sûr très différents de notre peuple, ce qui a conduit à leur désir d’indépendance depuis plus d’une décennie. Ainsi, les [AFG.GetAdjective] nous ont demandé de tenir un référendum permettant au peuple pachtoune vivant à [442.GetName] de choisir son propre destin, soit rester dans notre nation, soit rejoindre leurs frères [AFG.GetAdjective]. Cependant, si nous voulons que [442.GetName] reste nôtre, nous devrons faire d’importantes concessions aux Pachtouns vivant dans la région."
r56_afghanistan.64.a:0 "Peut-être pourrions-nous organiser un référendum..."
r56_afghanistan.64.b:0 "Jamais, c’est notre terre !"

r56_afghanistan.66.t:0 "Les Pachtouns favorisent la sécession"
r56_afghanistan.66.d:0 "Après un long et ardu processus de délibération, les Pachtouns ont finalement décidé de rejoindre [AFG.GetNameDef]. Le leader des Khidmatgars, Abdul Ghaffar Khan, a déclaré que, grâce aux concessions promises aux Pachtouns vivant à [442.GetName] et à nos similitudes culturelles, ils ont voté pour l’unification avec [AFG.GetNonIdeologyName] et leur sécession subséquente. Le référendum aurait été une victoire rapide pour [AFG.GetNonIdeologyName], avec [?AFG_percentage]% votant pour la sécession."
r56_afghanistan.66.a:0 "Une autre grande victoire pour [AFG.GetNonIdeologyName] !"

r56_afghanistan.67.t:0 "Les Pachtounes Favorisent l'Union"
r56_afghanistan.67.d:0 "Après un long et ardu processus de délibération et de réflexion, les Pachtounes ont finalement décidé de rejoindre [AFG.GetNameDef]. Le leader des Khidmatgars, Abdul Ghaffar Khan, a déclaré que, grâce aux concessions promises aux Pachtounes vivant à [442.GetName] et à notre volonté de coopérer avec eux, ils ont voté pour rester dans notre nation, mais avec une autonomie accrue. Le référendum a été rapporté comme une victoire rapide pour nous avec [?AFG.RAJ_PAK_percentage]% en faveur de l'union."
r56_afghanistan.67.a:0 "Excellent !"
r56_afghanistan.67.b:0 "Law aw Bar, Yaw Afghan !"

r56_afghanistan.68.t:0 "[FROM.GetNameDefCap] Rejette"
r56_afghanistan.68.d:0 "[FROM.GetNameDefCap] a rejeté la proposition de référendum à [442.GetName], probablement en raison de leur instabilité politique ou des tensions croissantes dans la géopolitique mondiale. Leur refus a été fortement critiqué à [442.GetName] par les Khudai Khidmatgars et d'autres groupes de résistance."
r56_afghanistan.68.a:0 "Honte à eux !"
r56_afghanistan.68.b:0 "Law aw Bar, Yaw Afghan !"

r56_afghanistan.69.t:0 "[FROM.GetNameDefCap] Accepte"
r56_afghanistan.69.d:0 "[FROM.GetNameDefCap] a accepté la proposition de référendum à [442.GetName]. C'est merveilleux, car cela permettra une résolution libre et démocratique de la question de [442.GetName], et les Pachtounes ethniques y vivant auront de nouveau le droit à l'autodétermination. Leur approbation du référendum a été très soutenue à [442.GetName] par les Khudai Khidmatgars et d'autres groupes de résistance."
r56_afghanistan.69.a:0 "Excellent !"

r56_afghanistan.70.t:0 "La Guerre Civile [PER.GetAdjective]"
r56_afghanistan.70.d:0 "Notre nation a souffert d'instabilité trop longtemps, mais tout comme l'eau a sa température d'ébullition, notre nation a atteint la sienne. Aujourd'hui, il a été rapporté que des groupes de résistance armés à travers le pays ont pris les armes pour combattre notre régime au nom du socialisme et du marxisme. C'est la fin de la route."
r56_afghanistan.70.a:0 "Combattez jusqu'au dernier homme !"

r56_afghanistan.71.t:0 "Soutien Tribal Arrive"
r56_afghanistan.71.d:0 "Les tribus ont tenu leur promesse d'aide et ont envoyé un important lot d'armes que nos moudjahidines peuvent utiliser dans leur jihad contre le gouvernement. Elles peuvent être anciennes, mais nous avons besoin de toutes les ressources disponibles."
r56_afghanistan.71.a:0 "Merveilleux !"

r56_afghanistan.72.t:0 "Rapprochement avec [AFG.GetNonIdeologyName] ?"
r56_afghanistan.72.d:0 "Le gouvernement [AFG.GetAdjective] nous a approchés dans l'espoir de réconcilier les relations diplomatiques [GetRajAdjective]-[AFG.GetAdjective]. Ils ont déclaré que [AFG.GetNonIdeologyName] ne voit pas [RAJ.GetNameDef] comme un ennemi, mais plutôt comme un ami dans la géopolitique régionale. Ils ont proposé un Traité d'Amitié ainsi qu'un Pacte de Non-Agression Mutuel. La question est : partageons-nous les mêmes vues que les [AFG.GetAdjective] ?"
r56_afghanistan.72.a:0 "Nous devons maintenir des relations cordiales avec [AFG.GetNonIdeologyName]."
r56_afghanistan.72.b:0 "Impossible, vieil ami."

r56_afghanistan.73.t:0 "[AFG_country_for_pakistan_press.GetNameDefCap] Accepte"
r56_afghanistan.73.d:0 "Le gouvernement [AFG_country_for_pakistan_press.GetAdjective] a pris la décision stratégique de nous céder le contrôle de [444.GetName], [442.GetName] et [445.GetName]. Ils ont exprimé le souhait de poursuivre la coopération avec [AFG.GetNonIdeologyName] et ont souligné que le gouvernement [AFG_country_for_pakistan_press.GetAdjective] voit [AFG.GetNonIdeologyName] davantage comme un allié que comme un ennemi."
r56_afghanistan.73.a:0 "Merveilleux !"

r56_afghanistan.74.t:0 "[AFG_country_for_pakistan_press.GetNameDefCap] Rejette"
r56_afghanistan.74.d:0 "Le gouvernement [AFG_country_for_pakistan_press.GetAdjective] a pris la décision de nous refuser le contrôle de [444.GetName], [442.GetName] et [445.GetName]. Ils ont déclaré que ces terres appartiennent de droit à [AFG_country_for_pakistan_press.GetNameDef], mais espèrent que cela ne nuira pas aux relations [AFG.GetAdjective]-[AFG_country_for_pakistan_press.GetAdjective]."
r56_afghanistan.74.a:0 "Mauvais choix."

r56_afghanistan.75.t:0 "Soutien [GER.GetAdjective] Arrive"
r56_afghanistan.75.d:0 "Plusieurs cargaisons d'armes et de munitions sont arrivées aujourd'hui à [AFG.GetNonIdeologyName] en provenance de [GER.GetNonIdeologyName]. Avec ces armes sont venus de nombreux soldats de la Wehrmacht et agents de l'Abwehr [GER.GetAdjective]. Carl August von Gablenz, célèbre aviateur [GER.GetAdjective], est également arrivé. Les guerriers tribaux ont déjà accueilli ce soutien précieux et ont exprimé leur gratitude envers les [GER.GetAdjective]."
r56_afghanistan.75.a:0 "Cela était grandement nécessaire !"

r56_afghanistan.76.t:0 "La Guerre Civile [PER.GetAdjective]"
r56_afghanistan.76.d:0 "Dans un tournant surprenant, la Perse est plongée dans une violente guerre civile, les insurgés communistes affrontant les forces gouvernementales au milieu de la guerre. Ce conflit, survenu il y a quelques jours, ajoute une nouvelle couche de complexité au paysage international déjà tumultueux. Il nous revient de décider si nous devons intervenir pour préserver nos intérêts dans la région ou non."
r56_afghanistan.76.a:0 "Mobilisez l'Armée Rouge !"
r56_afghanistan.76.b:0 "C'est leur affaire personnelle."

r56_afghanistan.77.t:0 "Les Forces [SOV.GetAdjective] Marchent sur la Perse"
r56_afghanistan.77.d:0 "Dans un mouvement audacieux et inattendu, les forces [SOV.GetAdjective] ont avancé dans le nord de [PER.GetNameDef]. L'invasion, commencée il y a quelques jours, a provoqué des secousses dans les cercles diplomatiques et suscité des inquiétudes quant aux conséquences géopolitiques pour la région. [SOV.GetNameDefCap] cite des raisons stratégiques, soulignant la nécessité de sécuriser des routes d'approvisionnement vitales, de saisir les grands champs pétrolifères du nord et de protéger ses propres réserves de pétrole à Bakou."
r56_afghanistan.77.a:0 "La révolution s'étend."
r56_afghanistan.77.b:0 "Ils veulent juste le pétrole !"
r56_afghanistan.77.c:0 "Gloire à la révolution !"

r56_afghanistan.78.t:0 "[FROM.GetNameDefCap] accepte"
r56_afghanistan.78.d:0 "Le gouvernement [FROM.GetAdjective] a accepté notre proposition de réconciliation dans l'espoir d'améliorer les relations diplomatiques [FROM.GetAdjective]-[AFG.GetAdjective]. Ils ont déclaré que [FROM.GetNameDef] ne considère pas [AFG.GetNonIdeologyName] comme un ennemi, mais plutôt comme un ami en géopolitique régionale. Ils ont proposé un Traité d'Amitié ainsi qu'un Pacte de Non-Agression Mutuel. La paix sur la ligne Durand sera maintenue !"
r56_afghanistan.78.a:0 "Merveilleux."

r56_afghanistan.79.t:0 "[FROM.GetNameDefCap] rejette"
r56_afghanistan.79.d:0 "Le gouvernement [FROM.GetAdjective] a rejeté notre proposition de réconciliation, peut-être en raison de leur instabilité politique ou de leur position actuelle vis-à-vis de [AFG.GetNonIdeologyName]. Ils sont restés vagues sur la question de la coopération avec [AFG.GetNonIdeologyName] et leurs ambitions politiques dans la région. L'avenir nous le dira..."
r56_afghanistan.79.a:0 "Nous devons rester prudents !"

r56_afghanistan.80.t:0 "Écoles inaugurées à [AFG_illiteracy_state.GetName]"
r56_afghanistan.80.d:0 "Après de nombreux mois de travail intense, les écoles et installations éducatives commencées à [AFG_illiteracy_state.GetName] ont enfin été achevées. [AFG.GetLeader], ainsi que le ministre de l'Éducation, M. Ahmed Ali Khan, ont tenu à visiter [AFG_illiteracy_state.GetName] et commémorer cet événement en inaugurant personnellement l'une des principales écoles désignées, à savoir le [AFG_illiteracy_state.GetCapitalVictoryPointName] Secondary School. Ainsi, [AFG.GetNonIdeologyName] se rapproche un peu plus de son objectif d'élimination de l'analphabétisme."
r56_afghanistan.80.a:0 "Excellente nouvelle !"

r56_afghanistan.81.t:0 "Subbhas Chandra Bose disparaît"
r56_afghanistan.81.d:0 "Depuis sa libération récente de prison, Subbhas Chandra Bose n'a plus été vu en public. Cependant, après la visite de la police [ROOT.GetAdjective] à son domicile, celui-ci a été trouvé vide et dépourvu des effets personnels de Bose. Son domicile a-t-il été perquisitionné et a-t-il été ensuite enlevé, ou s'agit-il d'un plan astucieux pour faciliter sa fuite avec l'aide des [GER.GetAdjective] ?"
r56_afghanistan.81.a:0 "Ce salaud !"

r56_afghanistan.82.t:0 "La fuite de Subbhas Chandra Bose"
r56_afghanistan.82.d:0 "Depuis sa libération récente, nous avons reçu des informations de [RAJ.GetNameDef] selon lesquelles Subbhas Chandra Bose s'est échappé et se dirige vers [GER.GetNonIdeologyName]. La dernière fois qu'il a été vu, il se trouvait à Calcutta, chez lui. Les autorités [GetRajAdjective] nous ont informés que Bose pourrait essayer de passer par [AFG.GetNonIdeologyName] pour atteindre [GER.GetNonIdeologyName]. Il est dit qu'il s'est déguisé en membre d'une tribu pachtoune et qu'il est escorté avec l'aide de l'Abwehr [GER.GetAdjective]. Devons-nous rester à l'affût de Bose ou fermer les yeux sur la situation ?"
r56_afghanistan.82.a:0 "Fermer les yeux."
r56_afghanistan.82.b:0 "Augmenter la présence policière, il doit être arrêté !"
r56_afghanistan.82.c:0 "Nous devons le recruter."

r56_afghanistan.83.t:0 "Subbhas Chandra Bose arrive à [ROOT.GetNameDef]"
r56_afghanistan.83.d:0 "Avec le soutien de nos agents secrets et autres correspondants, Subbhas Chandra Bose, le révolutionnaire [RAJ.GetAdjective], est arrivé à [ROOT.GetNameDef]. Il nous a approchés pour nous aider dans notre invasion de [RAJ.GetNameDef] car il souhaite libérer [RAJ.GetNonIdeologyName] sous son commandement. La question est : devons-nous faire confiance à Bose ? Après tout, il pourrait être un espion [RAJ.GetAdjective] essayant d'infiltrer nos rangs !"
r56_afghanistan.83.a:0 "Il est le bienvenu ici."
r56_afghanistan.83.b:0 "Nous n'avons pas besoin de son aide."

r56_afghanistan.84.t:0 "Subbhas Chandra Bose capturé"
r56_afghanistan.84.d:0 "Lors de sa tentative de fuir [RAJ.GetNameDef] via [AFG.GetNonIdeologyName], Subbhas Chandra Bose et ses escortes ont été capturés près de la ville de Māzar-i-Sharīf. Le révolutionnaire [RAJ.GetAdjective] se dirigeait vers l'Europe pour aider les ennemis de [RAJ.GetNameDef] dans leur combat. Cependant, avec sa capture, nous devons prendre une décision. Devons-nous remettre Bose aux autorités [GetRajAdjective], ou le laisser reprendre son voyage, aidant ainsi lui et les ennemis de [RAJ.GetAdjective] ?"
r56_afghanistan.84.a:0 "Le remettre aux autorités [GetRajAdjective]."
r56_afghanistan.84.b:0 "Le laisser partir."

r56_afghanistan.85.t:0 "Subbhas Chandra Bose capturé par les autorités [AFG.GetAdjective]"
r56_afghanistan.85.d:0 "Lors de son voyage à travers [AFG.GetNonIdeologyName], Subbhas Chandra Bose a été capturé et appréhendé par les autorités [AFG.GetAdjective]. Elles ont décidé de le remettre aux autorités [ROOT.GetAdjective] dès que possible. Nous devons être reconnaissants que la police [AFG.GetAdjective] soit restée vigilante et ait accompli sa tâche de capture de Bose."
r56_afghanistan.85.a:0 "Emprisonnez-le immédiatement !"

r56_afghanistan.86.t:0 "Subbhas Chandra Bose arrive à [FROM.GetNameDef]"
r56_afghanistan.86.d:0 "Au cours des derniers mois, Subbhas Chandra Bose a voyagé dans le but d'atteindre enfin [FROM.GetNameDef] et de leur demander de l'aide. Malheureusement, il a atteint son objectif et coopère désormais avec le commandement militaire [FROM.GetAdjective]. De nombreux politiciens [RAJ.GetAdjective] ont annoncé leur soutien à Bose, et d'autres suivront. Cela a considérablement déstabilisé la nation, de nombreux individus fuyant pour rejoindre Bose et sa Légion des Tigres !"
r56_afghanistan.86.a:0 "Très bien..."
r56_afghanistan.86.b:0 "Maudit soit-il !"

r56_afghanistan.87.t:0 "La crise interne"
r56_afghanistan.87.d:0 "Chaque jour qui passe, la situation en [AFG.GetNonIdeologyName] devient de plus en plus inquiétante. Avec des manifestations dans tout le pays et des condamnations publiques du gouvernement et du roi, le pays semble se diriger vers une voie dangereuse de guerre et de bain de sang. De nombreuses tribus, notamment les Hazaras, sont très mécontentes de la forte taxation imposée sur elles et de la mobilisation accrue de leurs membres. Il semble que ce soit réellement la goutte d’eau qui fait déborder le vase. \n\nLa question est de savoir si [AFG.GetNonIdeologyName] réussira à se redresser et à éviter un bain de sang inutile ou si l’histoire se répétera une fois de plus..."
r56_afghanistan.87.a:0 "Une tempête se prépare…"

r56_afghanistan.88.t:0 "Affrontements armés à [1009.GetName]"
r56_afghanistan.88.d:0 "Il y a quelques jours, quelques centaines de Hazaras ont affronté la police locale à [1009.GetName]. Environ 24 policiers et militaires ont été tués, et de nombreux autres blessés lors des combats avec les Hazaras, qui seraient lourdement armés. La raison de ces affrontements soudains et violents reste inconnue, mais une cause probable pourrait être la forte taxation récemment imposée, qui a conduit à une résistance ouverte contre le régime."
r56_afghanistan.88.a:0 "Les vents se calment…"

r56_afghanistan.87.t:0 "La crise intérieure"
r56_afghanistan.87.d:0 "À chaque jour qui passe, la situation en [AFG.GetNonIdeologyName] devient de plus en plus inquiétante. Avec des manifestations dans tout le pays et des condamnations publiques du gouvernement et du roi, le pays semble s'engager sur une voie dangereuse de guerre et de sang versé. De nombreux membres de tribus, en particulier les Hazaras, sont devenus très mécontents de la lourde fiscalité qui leur est imposée et de la mobilisation accrue de leurs semblables. Il semble que ce soit effectivement la goutte d'eau qui a fait déborder le vase. La question est : [AFG.GetNonIdeologyName] parviendra-t-il à se redresser et à éviter un bain de sang inutile ou l'histoire se répétera-t-elle encore une fois..."
r56_afghanistan.87.a:0 "Un orage se prépare..."

r56_afghanistan.88.t:0 "Affrontements armés à [1009.GetName]"
r56_afghanistan.88.d:0 "Il y a quelques jours, plusieurs centaines de membres de la tribu Hazara ont affronté les forces de police locales à [1009.GetName]. Environ 24 policiers et militaires ont été tués et de nombreux autres blessés lors des combats avec les Hazaras, qui seraient lourdement armés. La raison de ces affrontements soudains et violents avec les Hazaras reste inconnue, mais une cause probable pourrait être la lourde fiscalité récemment imposée, qui a conduit à une résistance ouverte contre le régime."
r56_afghanistan.88.a:0 "Les vents se calment..."

r56_afghanistan.89.t:0 "Raids de pillage à Ghazni"
r56_afghanistan.89.d:0 "Avec l'augmentation et la lourde fiscalité de la population locale à Ghazni, les membres de la tribu Wazir ont mené plusieurs raids de pillage dans les villes et villages voisins, dévastant la campagne [AFG.GetAdjective]. Au cours de leur longue et sanglante marche, de nombreux civils innocents ont été massacrés et tués de sang-froid, puis pillés et laissés pourrir. En période difficile, il faut prendre des décisions difficiles, et des mesures encore plus dures..."
r56_afghanistan.89.a:0 "La pluie commence..."

r56_afghanistan.90.t:0 "Le retour du roi Amanullah ?"
r56_afghanistan.90.d:0 "Avec la baisse des conditions de vie et du niveau de vie en [AFG.GetNonIdeologyName] à chaque seconde qui passe, et le roi étant directement responsable de cela, le peuple a besoin d'un héros, d'un sauveur ! Ainsi, des murmures et des rumeurs sur le retour du roi Amanullah en [AFG.GetNonIdeologyName] ont circulé dans tout le pays comme une traînée de poudre... Bien que non confirmée, le retour d'Amanullah reste très probable et, en raison de la résistance tribale et des troubles qui frappent le pays, certains chefs tribaux, bien que paradoxalement, sont favorables au règne d'Amanullah sur [AFG.GetNonIdeologyName]."
r56_afghanistan.90.a:0 "Un rayon de lumière ?"

r56_afghanistan.91.t:0 "La loyauté de Daoud Khan ?"
r56_afghanistan.91.d:0 "Le soutien du roi s'amenuise dans tous les aspects politiques de [AFG.GetNonIdeologyName]. Autrefois un bastion des Bārakzai, l'armée est devenue politisée et a acquis une autonomie significative vis-à-vis du gouvernement central et du roi. D'où la question de sa loyauté... De nombreux officiers et généraux [AFG.GetAdjective] ont des liens avec la population locale et les membres des tribus, et sont facilement achetés ou persuadés. Des rumeurs selon lesquelles Muhammad Daoud Khan, le gouverneur de Nangahar et général au sein de l'armée royale [AFG.GetAdjective], envisagerait de renverser le gouvernement ont circulé. L'armée est-elle digne de confiance ?"
r56_afghanistan.91.a:0 "La tempête se calme ?"

r56_afghanistan.92.t:0 "Alliance avec [PAK.GetNonIdeologyName] ?"
r56_afghanistan.92.d:0 "Après la création de [PAK.GetNameDef] il n'y a pas si longtemps et le début de la guerre indo-[PAK.GetAdjective], [PAK.GetLeader] a approché [AFG.GetNameDef] espérant une alliance militaire pour vaincre les [RAJ.GetAdjective]. Devons-nous nous aligner avec le gouvernement [PAK.GetAdjective] ou non, telle est la question."
r56_afghanistan.92.a:0 "Unis comme un seul !"
r56_afghanistan.92.b:0 "Il n'est pas nécessaire d'agir ainsi."

r56_afghanistan.93.t:0 "[FROM.GetNameDefCap] exige la soumission"
r56_afghanistan.93.d:0 "Avec [FROM.GetNameDef] poursuivant une doctrine panislamiste sous [FROM.GetLeader], tentant d'unir tous les adeptes de la parole d'Allah et de son unique messager Muhammad sous une seule bannière, [FROM.GetNameDef] a officiellement demandé notre soumission. Comme excuse pour leurs actions agressives, ils invoquent notre foi commune et d'autres similitudes. Accepterons-nous ou refuserons-nous leurs demandes, telle est la question."
r56_afghanistan.93.a:0 "Quelles demandes ridicules !"
r56_afghanistan.93.b:0 "Le sang fraternel ne sera pas versé aujourd'hui."

r56_afghanistan.94.t:0 "[FROM.GetNameDefCap] rejette la soumission"
r56_afghanistan.94.d:0 "Après nos demandes de soumission de [FROM.GetNameDef], le gouvernement [FROM.GetAdjective] a ensuite rejeté nos demandes et les a proclamées ridicules. C'est un véritable déshonneur, nous devons agir immédiatement !"
r56_afghanistan.94.a:0 "Qu'Allah nous guide vers la victoire !"

r56_afghanistan.95.t:0 "[FROM.GetNameDefCap] accepte la soumission"
r56_afghanistan.95.d:0 "Après nos demandes de soumission de [FROM.GetNameDef], le gouvernement [FROM.GetAdjective] a ensuite accepté nos demandes, peut-être en raison de notre supériorité militaire ou de la pression et de l'influence politique que nous avons exercées sur leur gouvernement. C'est encore une victoire pour les musulmans du monde entier."
r56_afghanistan.95.a:0 "Sous Allah, nous serons unis !"

r56_afghanistan.96.t:0 "Unification du monde islamique"
r56_afghanistan.96.d:0 "Notre poursuite d'une doctrine panislamiste sous [FROM.GetLeader], tentant d'unir tous les adeptes de la parole d'Allah et de son unique messager Muhammad sous une seule bannière, a contribué à ce que [AFG.GetNonIdeologyName] devienne un prétendant à toutes les régions majoritairement peuplées de musulmans et autrefois parties de l'Empire Rashidun ! Qu'Allah nous guide à travers les batailles et les luttes contre les impérialistes ! Nous sommes les véritables héritiers de Muhammad !"
r56_afghanistan.96.a:0 "Allahu Akbar !"

r56_afghanistan.97.t:0 "Restauration de [From.GetNameDef]"
r56_afghanistan.97.d:0 "Avec la conquête [From.GetOldAdjective] de ce qui constitue principalement le monde islamique moderne et la poursuite continue du gouvernement pour unir tous les musulmans, beaucoup, y compris des responsables gouvernementaux, ont appelé à la restauration officielle d'un empire longtemps oublié, [From.GetNameDef]. Ainsi, [From.GetLeader], descendant direct du Prophète, a décidé de céder à la pression populaire et a proclamé officiellement la restauration de [From.GetNameDef] et son intronisation en tant que Khalife. Les responsables [From.GetOldAdjective] ont maintenant confirmé que le nom officiel du pays sera '[From.GetNameDef]'."
r56_afghanistan.97.a:0 "Le rêve d'Al-Afghani a été réalisé."
r56_afghanistan.97.b:0 "Une nouvelle ère commence pour les musulmans du monde entier?"

r56_afghanistan.98.t:0 "[FROM.GetNameDefCap] Exige des Terres"
r56_afghanistan.98.d:0 "Alors que [FROM.GetNameDef] suit une doctrine pan-islamiste sous [FROM.GetLeader], tentant d’unir tous les fidèles de la parole d’Allah et de son unique messager Muhammad sous une seule bannière, [FROM.GetNameDef] a officiellement demandé notre retrait militaire de Syrie et le transfert ultérieur de la Syrie à [FROM.GetNameDefCap]. Devons-nous accepter ou refuser leurs demandes, telle est la question."
r56_afghanistan.98.a:0 "Quelles demandes ridicules !"
r56_afghanistan.98.b:0 "Nous devons céder..."

r56_afghanistan.99.t:0 "[FROM.GetNameDefCap] Rejette les Demandes"
r56_afghanistan.99.d:0 "Après nos demandes de transfert des terres musulmanes de [FROM.GetNameDef], le gouvernement [FROM.GetAdjective] a refusé nos demandes. C’est une honte totale, nous devons agir immédiatement et prendre ces terres nous-mêmes !"
r56_afghanistan.99.a:0 "Malheureusement..."
r56_afghanistan.99.b:0 "Cela signifie la guerre !"

r56_afghanistan.100.t:0 "[FROM.GetNameDefCap] Cède aux Demandes"
r56_afghanistan.100.d:0 "Après nos demandes de transfert des terres musulmanes de [FROM.GetNameDef], le gouvernement [FROM.GetAdjective] a accepté nos demandes, peut-être en raison de notre supériorité militaire ou de la pression politique que nous avons exercée sur leur gouvernement. C’est encore une victoire pour les musulmans du monde entier."
r56_afghanistan.100.a:0 "Sous Allah, nous serons unis !"

r56_afghanistan.101.t:0 "[FROM.GetNameDefCap] Exige des Terres"
r56_afghanistan.101.d:0 "Alors que [FROM.GetNameDef] suit une doctrine pan-islamiste sous [FROM.GetLeader], tentant d’unir tous les fidèles de la parole d’Allah et de son unique messager Muhammad sous une seule bannière, [FROM.GetNameDef] a officiellement demandé notre retrait militaire de Syrie et le transfert ultérieur de la Syrie à [FROM.GetNameDefCap]. Devons-nous accepter ou refuser leurs demandes, telle est la question."
r56_afghanistan.101.a:0 "Quelles demandes ridicules !"
r56_afghanistan.101.b:0 "Nous devons céder..."

r56_afghanistan.102.t:0 "[FROM.GetNameDefCap] Cède aux Demandes"
r56_afghanistan.102.d:0 "Après nos demandes de transfert des terres musulmanes de [FROM.GetNameDef], le gouvernement [FROM.GetAdjective] a accepté nos demandes, peut-être en raison de notre supériorité militaire ou de la pression politique que nous avons exercée sur leur gouvernement. C’est encore une victoire pour les musulmans du monde entier."
r56_afghanistan.102.a:0 "Sous Allah, nous serons unis !"

r56_afghanistan.103.t:0 "[FROM.GetNameDefCap] Accepte la Paix"
r56_afghanistan.103.d:0 "Après nos demandes pour un cessez-le-feu complet et une transition progressive vers la paix entre [FROM.GetNameDefCap] et [ROOT.GetNameDefCap], le gouvernement [FROM.GetAdjective] a décidé d’accepter nos demandes, peut-être en raison de notre supériorité militaire et de la pression subie par leur gouvernement. C’est encore une victoire pour [AFG.GetNonIdeologyName] !"
r56_afghanistan.103.a:0 "Heureux les artisans de paix !"

r56_afghanistan.104.t:0 "[FROM.GetNameDefCap] Rejette la Paix"
r56_afghanistan.104.d:0 "Après nos demandes pour un cessez-le-feu complet et une transition vers la paix entre [FROM.GetNameDefCap] et [ROOT.GetNameDefCap], le gouvernement [FROM.GetAdjective] a décidé de refuser nos demandes, peut-être parce qu’il estime posséder une supériorité militaire et ne voit aucune raison de faire la paix."
r56_afghanistan.104.a:0 "Sage ou non, leur choix est fait."

r56_afghanistan.105.t:0 "La Deuxième Guerre Civile [AFG.GetAdjective]"
r56_afghanistan.105.a:0 "Ce sont toujours les [AFG.GetAdjective], n’est-ce pas ?"
r56_afghanistan.105.b:0 "À bas le roi ! Vive le prolétariat !"
r56_afghanistan.105.d:0 "Au cours de la semaine passée, les chefs militaires de [AFG.GetNonIdeologyName] se sont élevés contre le roi et la régence, composée principalement de ses deux oncles, Muhammad Hashim Khan et Shah Mahmud Khan. À leurs yeux, le gouvernement de [AFG.GetNonIdeologyName] est trop rétrograde, tant politiquement qu’économiquement, sans aucun plan de modernisation. Dans ce contexte, ils ont décidé de lancer une révolution à grande échelle pour renverser le régime et établir une république socialiste. Beaucoup spéculent que les forces [SOV.GetAdjective] ont pu instiguer le conflit, mais aucune preuve n’a été trouvée."

r56_afghanistan.106.t:0 "Soutien [SOV.GetAdjective] Arrive"
r56_afghanistan.106.a:0 "Nous vous sommes redevables, camarades !"
r56_afghanistan.106.d:0 "Alors que [AFG.GetNonIdeologyName] sombre dans le chaos et que la nation entière est mobilisée pour combattre et mourir pour chaque camp, les [SOV.GetAdjective] ont, comme convenu, décidé de nous apporter un soutien précieux et bénéfique, pouvant changer le cours de la Deuxième Guerre Civile Afghane ! Cela inclut de nombreux volontaires [SOV.GetAdjective] et du matériel militaire pour combattre les loyalistes !"

r56_afghanistan.107.t:0 "Nisar Muhammad Yousafzai Rejoint la Cause"
r56_afghanistan.107.a:0 "Celui qui aime sa patrie combattra pour la DRA !"
r56_afghanistan.107.d:0 "Alors que [AFG.GetNonIdeologyName] sombre dans le chaos et que la nation entière est mobilisée pour combattre et mourir pour chaque camp, Nisar Muhammad Yousafzai, un Afghan ayant combattu lors de la Seconde Guerre anglo-afghane et dédié au communisme et au développement du Tadjikistan, a décidé de rejoindre notre cause et de nous aider contre les loyalistes !"

r56_afghanistan.108.t:0 "Formation du Front National !"
r56_afghanistan.108.a:0 "Une grande menace, ou une grande opportunité, qui peut le dire ?"
r56_afghanistan.108.d:0 "Après la légalisation des syndicats, l’Union des Étudiants de l’Université de Kābul est sortie publiquement, prenant parti pour le [AFG.GetCommunistParty]. Cela a renforcé le [AFG.GetCommunistParty], ce qui a conduit Abdulrahman Mahmudi, chef des 'Khalqistes', à entrer en coalition avec le [AFG.GetDemocraticParty], nommée le Front National. Ils cherchent à démocratiser la nation et à donner des droits aux minorités, telles que les Tadjiks et Ouzbeks, pour réellement unir [AFG.GetNonIdeologyName]."

r56_afghanistan.109.t:0 "Crise autour du Durand !"
r56_afghanistan.109.a:0 "C’est inquiétant…"
r56_afghanistan.109.d:0 "L’année écoulée a été marquée par des tensions croissantes entre la population musulmane parlant l’ourdou du Nord-Ouest de l’Inde et les régions hindoues parlant l’hindi de l’Inde. Ces tensions ont apparemment atteint leur paroxysme avec la proclamation d’indépendance et la fondation d’un nouvel État au sud de [AFG.GetNonIdeologyName], appelé Pakistan. Le gouvernement [RAJ.GetAdjective] a déclaré cette proclamation illégale, et une guerre ouverte a éclaté sur le sous-continent indien. De nombreuses personnes ont été déplacées par la guerre, avec de nombreux hindous franchissant la frontière pour rejoindre l’Inde, et les musulmans vivant du côté hindou faisant exactement la même chose.\n\nLa raison particulière pour laquelle ce conflit est crucial pour l’avenir de [AFG.GetNonIdeologyName] tient aux zones majoritairement peuplées de Pachtounes que sont [442.GetName] et, dans une certaine mesure, [445.GetName], qui constituent désormais une grande partie du nouvel État du Pakistan. Ce conflit pourrait représenter pour [AFG.GetNonIdeologyName] l’opportunité tant attendue d’unifier enfin les Pachtounes au sein d’un seul État, ainsi que d’obtenir un accès nécessaire à la mer, ce qui faciliterait le commerce international et bénéficierait grandement à l’économie [AFG.GetAdjective]… La question est : quelle position [AFG.GetNonIdeologyName] devrait-elle adopter en cette période chaotique pour la région ?"

r56_afghanistan.200.t:0 "Conséquences de la guerre civile de [GetYear]"
r56_afghanistan.200.a:0 "C’est inquiétant…"
r56_afghanistan.200.d:0 "Avec la conclusion de la guerre civile de [GetYear], des célébrations éclatent à travers la nation, saluant la victoire triomphante de l’Armée Rouge sur les royalistes. Pourtant, une célébration prématurée pourrait se révéler dangereuse, car cette victoire ne marque pas la fin, mais le début d’une nouvelle lutte, une lutte qui oppose la nation à son propre peuple. Des rapports font déjà état de forces tribales organisant des poches de résistance à travers [AFG.GetNonIdeologyName]. Seul l’avenir révélera le sort réservé à notre nation…"

######## FOCUSES ########

AFG_first_loya_jirga:0 "La Loya Jirga de [GetYear]"
AFG_first_loya_jirga_desc:0 "La Loya Jirga, qui se traduit simplement du pachto par 'Le Grand Conseil', est une méthode ancienne et primitive de résolution des problèmes dans [AFG.GetNonIdeologyName]. Les Loya Jirgas sont généralement organisées par les chefs d’État, cherchant le soutien pour des réformes ou une cérémonie de couronnement. Sont présents divers chefs tribaux venus de tout [AFG.GetNonIdeologyName], chacun représentant sa propre tribu et défendant ses intérêts…"

AFG_handle_the_king:0 "Gérer le Roi"
AFG_handle_the_king_desc:0 "Quelque chose cloche avec le Roi… On sent qu’il a changé… Il ne se désintéresse plus de la politique au sein du Royaume… En fait, il a lui-même poussé de nombreuses réformes proposées lors de la Loya Jirga… Peut-être que ses idées sont trop modernes, trop ambitieuses, trop déstabilisantes pour ce pauvre pays… Il faut agir…"

AFG_power_to_the_king:0 "Pouvoir au Roi"
AFG_power_to_the_king_desc:0 "Au fil des jours, des mois, des années, le peuple de [AFG.GetNonIdeologyName] constate que rien ne change, et ne changera tant que le peuple lui-même ne voudra rien changer. Le changement est la mère de tous les maux et de tous les biens ; donc, si rien ne change, personne n’est blessé, n’est-ce pas ? Ainsi passe le temps, et le statu quo est maintenu…"

######## ECONOMY FOCUSES ########

AFG_begin_westernization:0 "Poursuivre le Premier Plan Septennal"
AFG_begin_westernization_desc:0 "Si [AFG.GetNonIdeologyName] ne modernise pas son agriculture et ne s’industrialise pas, son économie restera dépendante des autres pays, ce qui pourrait mettre en péril son indépendance. L’industrialisation est cruciale pour la survie de notre État et l’amélioration de notre économie !"

AFG_start_the_second_seven_year_plan:0 "Lancer le Second Plan Septennal"
AFG_start_the_second_seven_year_plan_desc:0 ""

AFG_import_electronics:0 "Importer des Électroniques"
AFG_import_electronics_desc:0 "[AFG.GetNameDefCap] doit importer de nombreux équipements électroniques de pays comme [GER.GetName] ou [SOV.GetName] si nous voulons améliorer nos travaux publics et notre administration, ainsi qu’apprendre des technologies qui nous sont fournies."

AFG_rural_schools:0 "Améliorer l'Éducation Rurale"
AFG_rural_schools_desc:0 "Les régions rurales, déconnectées de Kaboul et de l’administration centrale de [AFG.GetNameDefCap], sont les principales contributrices au problème d’analphabétisme que connaît actuellement [AFG.GetNameDefCap]. Nous devons améliorer les méthodes éducatives en milieu rural."

AFG_develop_hydroelectric_power:0 "Développer l'Énergie Hydroélectrique"
AFG_develop_hydroelectric_power_desc:0 ""

AFG_aquire_foreign_machinery:0 "Acquérir des Machines Étrangères"
AFG_aquire_foreign_machinery_desc:0 ""

AFG_improve_national_infra:0 "Améliorer les Infrastructures Nationales"
AFG_improve_national_infra_desc:0 ""

AFG_bolster_the_textile_industry:0 "Renforcer l'Industrie Textile"
AFG_bolster_the_textile_industry_desc:0 "[AFG.GetNonIdeologyName] disposait d’une industrie textile importante avant la guerre civile de 1929 et la chute d’Amanullah Khan. Relancer et renforcer cette industrie pourrait être un maillon essentiel pour améliorer l’économie [AFG.GetAdjective] !"

AFG_monopolize_the_karakul_trade:0 "Monopoliser le Commerce de Karakul"
AFG_monopolize_the_karakul_trade_desc:0 ""

AFG_railroad_development:0 "Connecter la Nation"
AFG_railroad_development_desc:0 "[AFG.GetNameDefCap] est un pays déconnecté, sans voies ferrées ni connaissance de celles-ci. Il faut développer le réseau ferroviaire pour rendre l’économie plus efficace et permettre la circulation des marchandises."

AFG_expand_university:0 "Étendre l'Université de Kaboul"
AFG_expand_university_desc:0 "L’université de Kaboul, ouverte depuis 1932, a accueilli de nombreux étudiants. La demande en éducation est forte, et nous devons y répondre. L’extension de l’université est un bon point de départ."

AFG_expand_the_directorate_of_mines:0 "Étendre la Direction des Mines"
AFG_expand_the_directorate_of_mines_desc:0 "[AFG.GetNameDefCap] est riche en ressources comme l’acier, le pétrole et le chrome. Nous pouvons tirer parti de ces ressources en invitant des entreprises étrangères à les exploiter, améliorant ainsi notre économie."

AFG_explore_helmand_uranium_deposits:0 "Explorer les Gisements d'Uranium de Helmand"
AFG_explore_helmand_uranium_deposits_desc:0 ""

AFG_rejuvenate_the_gold_mines:0 "Rajeunir les Mines d'Or"
AFG_rejuvenate_the_gold_mines_desc:0 ""

AFG_intensify_copper_mining:0 "Intensifier l'Exploitation du Cuivre"
AFG_intensify_copper_mining_desc:0 ""

AFG_womens_education:0 "Éducation des Femmes"
AFG_womens_education_desc:0 "Actuellement, toutes les écoles afghanes n’acceptent que des garçons, environ 80 à 90 % des écoles étant exclusivement masculines. Nous devons éduquer également les femmes de [AFG.GetNonIdeologyName]."

AFG_afghanistan_bank:0 "Ouvrir la Banque de [AFG.GetNonIdeologyName]"
AFG_afghanistan_bank_desc:0 "Le secteur bancaire de [AFG.GetNameDefCap] a peu évolué ces dernières années. L’ouverture de la 'Banque de [AFG.GetNonIdeologyName]', une nouvelle banque centrale, nous permettra d’améliorer notre secteur bancaire et notre économie."

AFG_free_trade_focus:0 "Ouvrir les Marchés"
AFG_free_trade_focus_desc:0 "[AFG.GetNameDefCap] a été un État très isolé pendant une grande partie de son histoire. Il est temps de changer cela. [AFG.GetNonIdeologyName] doit ouvrir ses marchés au monde pour attirer plus d’investisseurs et de personnes."

AFG_coffee_plantations:0 "Plantations de Café"
AFG_coffee_plantations_desc:0 "[AFG.GetNonIdeologyName] est un endroit idéal pour les plantations de café. Nous devons exploiter pleinement nos terres pour améliorer notre économie."

AFG_begin_rearmament:0 "Commencer le Réarmement"
AFG_begin_rearmament_desc:0 ""

AFG_establish_ammunition_factories:0 "Rénover les Usines de Munitions"
AFG_establish_ammunition_factories_desc:0 ""

AFG_kabul_arsenal:0 "Raviver l'Arsenal de Kaboul"
AFG_kabul_arsenal_desc:0 "[AFG.GetNonIdeologyName] manque de personnel qualifié et de ressources pour produire du matériel militaire. Nous devons cependant améliorer notre capacité de production militaire pour réduire notre dépendance aux puissances étrangères."

AFG_the_nomad_population:0 "Intégrer la Population Nomade"
AFG_the_nomad_population_desc:0 "De nombreuses personnes de [AFG.GetNonIdeologyName] ont rejeté le mode de vie moderne. Ces nomades représentent une grande partie de la population, mais ne participent pas à l’économie. Il serait donc sage de les intégrer pour renforcer l’économie."

AFG_afghan_miracle:0 "Le Miracle [AFG.GetAdjective]"
AFG_afghan_miracle_desc:0 "Après de nombreuses années d’investissements progressifs et de guidage de notre économie dans ces temps difficiles, [AFG.GetNameDefCap] en ressort plus fort que jamais, avec des résultats tangibles !"

######## ORIENTATIONS MILITAIRES ########

AFG_afghan_royal_army:0 "[NomDeL'ArméeAfghane]"
AFG_afghan_royal_army_desc:0 "[DescriptionDeL'ArméeAfghane]"
AFG_afghan_royal_army_army:0 "Armée Royale [AFG.GetAdjective]"
AFG_afghan_royal_army_army_desc:0 "L'Armée Royale [AFG.GetAdjective] est aussi ancienne que [AFG.GetNameDef] elle-même et a été fondée au XVIIIe siècle. L'armée royale de [AFG.GetNonIdeologyName] a affronté de nombreux défis au cours de son histoire. Elle a mené et remporté de nombreuses guerres, comme la Troisième Guerre anglo-afghane, au cours de laquelle [AFG.GetNonIdeologyName] a gagné son indépendance et expulsé les [ENG.GetAdjective] !"
AFG_afghan_army_focus:0 "Forces Armées [AFG.GetAdjective]"
AFG_afghan_army_focus_desc:0 "Les Forces Armées [AFG.GetAdjective] sont aussi anciennes que [AFG.GetNameDef] elle-même et ont été fondées au XVIIIe siècle. Elles ont affronté de nombreux défis et ont remporté plusieurs guerres, comme la Troisième Guerre anglo-afghane, au cours de laquelle [AFG.GetNonIdeologyName] a gagné son indépendance et expulsé les [ENG.GetAdjective] !"
AFG_army_modernization:0 "Poursuivre la modernisation de l'armée"
AFG_army_modernization_desc:0 "L'[GetAfghanArmyFocusName] dispose d'équipements obsolètes, manque de soldats entraînés et est globalement dans un état préoccupant. Une réforme militaire est nécessaire pour transformer l'[GetAfghanArmyFocusName] en une armée moderne capable d'affronter même les forces les plus avancées technologiquement du monde. Le moment de la modernisation est venu !"
AFG_army_status_quo:0 "Maintenir le statu quo"
AFG_army_status_quo_desc:0 "Des changements rapides et radicaux à [AFG.GetNameDefCap] ont souvent entraîné de terribles conséquences, avec de nombreuses pertes humaines et des souffrances pour la nation. Nous ne pouvons pas risquer une nouvelle guerre civile ; il faut maintenir le statu quo !"
AFG_form_the_paratrooper_brigade:0 "Soldats du ciel"
AFG_form_the_paratrooper_brigade_desc:0 "Comme nous possédons déjà certaines connaissances aériennes suite à l'achat récent d'avions aux [ENG.GetAdjective], nous devrions créer une brigade de parachutistes afin d'améliorer nos capacités militaires !"
AFG_legacy_of_cavalrymen:0 "Héritage des cavaliers"
AFG_legacy_of_cavalrymen_desc:0 "L'héritage de cavalerie de [AFG.GetNonIdeologyName] et l'utilisation des chevaux dans l'armée remontent à plusieurs milliers d'années. Nos ancêtres étaient de grands cavaliers ; nous devons suivre leurs traces !"
AFG_arms_purchase:0 "Acheter de l'équipement"
AFG_arms_purchase_desc:0 "[AFG.GetNameDefCap] peut acheter des équipements [ENG.GetAdjective] ou [SOV.GetAdjective] pour son armée, mais il faut être prudent quant au fournisseur choisi afin de ne pas nous lier trop étroitement à un seul pays !"
AFG_tank_purchase:0 "Importer des chars étrangers"
AFG_tank_purchase_desc:0 "Importer des chars [SOV.GetAdjective] profiterait grandement à la nation, et nous pourrions les étudier pour commencer à les produire dans nos propres usines !"
AFG_develop_domestic_designs:0 "Développer des modèles nationaux"
AFG_develop_domestic_designs_desc:0 "[AFG.GetNameDefCap] n'a pas encore été capable de produire ses propres fusils et équipements militaires, mais cela doit changer. Nous devons encourager les fabricants locaux et produire nos propres armes pour rendre notre pays indépendant de l'influence militaire étrangère !"
AFG_motorized_research:0 "Motoriser l'armée"
AFG_motorized_research_desc:0 "[AFG.GetNameDefCap] dépend principalement de sa cavalerie pour les attaques rapides et la logistique. En motorisant l'armée, nous pouvons améliorer le ravitaillement et lancer des offensives plus rapides afin de surprendre l'ennemi !"
AFG_improve_our_logistics:0 "Améliorer notre logistique"
AFG_improve_our_logistics_desc:0 "Nous devons renforcer notre chaîne logistique afin d'assurer un meilleur approvisionnement et un soutien plus rapide à nos troupes sur le terrain."
AFG_prussians_orient:0 "Les Prussiens de l'Orient"
AFG_prussians_orient_desc:0 "[AFG.GetNameDefCap] a fortement amélioré son armée, au point de se voir attribuer le titre de 'Prussiens de l'Orient' par de nombreux étrangers. L'avenir militaire de [AFG.GetNameDefCap] est prometteur !"
AFG_first_afghani_navy:0 "Première Marine [AFG.GetAdjective]"
AFG_first_afghani_navy_desc:0 "[AFG.GetNameDefCap] a maintenant accès à la mer. Il est temps de la maîtriser et de devenir une puissance navale. Nous devons développer nos ports et chantiers navals pour y parvenir !"
AFG_build_convoys:0 "Étendre la flotte marchande"
AFG_build_convoys_desc:0 "Maintenant que nous possédons un littoral, nous pouvons développer le commerce maritime avec les puissances étrangères, ce qui nous fera économiser beaucoup d'argent. Cependant, sans protection, de nombreuses vies pourraient être perdues sur les navires marchands."
AFG_submarines:0 "Développer une flotte de sous-marins"
AFG_submarines_desc:0 "Une flotte de sous-marins, utilisable pour intercepter le commerce et d'autres missions furtives, est ce dont [AFG.GetNameDefCap] a besoin."
AFG_destroyers:0 "Développer une flotte de destroyers"
AFG_destroyers_desc:0 "Une flotte de destroyers, utile pour le combat rapproché et le minage, est ce dont [AFG.GetNameDefCap] a besoin."
AFG_cruisers:0 "Développer des croiseurs"
AFG_cruisers_desc:0 "Une flotte de croiseurs légers, destinée à protéger nos autres navires et à combattre au contact, est ce dont [AFG.GetNameDefCap] a besoin."
AFG_battleships:0 "Développer des cuirassés"
AFG_battleships_desc:0 "Une flotte de cuirassés, pour protéger nos autres navires et combattre à longue distance, est ce dont [AFG.GetNameDefCap] a besoin."
AFG_naval_building:0 "Encourager la construction navale civile"
AFG_naval_building_desc:0 "Encourager la construction navale aidera à trouver de bons fabricants locaux prêts à soutenir le gouvernement de [AFG.GetNameDefCap]."
AFG_under_the_radar:0 "Naviguer sous le radar"
AFG_under_the_radar_desc:0 "Pour développer une force de sous-marins efficace, nous devons améliorer la formation de nos équipages. Ainsi, nous pourrons espérer passer inaperçus et frapper nos ennemis par surprise !"
AFG_protect_our_convoys:0 "Étudier la lutte anti-sous-marine"
AFG_protect_our_convoys_desc:0 "Nous devons nous concentrer sur la protection de nos convois et navires marchands plutôt que sur la destruction des navires ennemis. Cela favorisera notre économie et le commerce maritime !"
AFG_naval_defense_fund:0 "Créer un fonds de défense navale"
AFG_naval_defense_fund_desc:0 "Nous devons rééquilibrer le budget et créer un fonds pour financer la construction navale. Des mesures importantes sont nécessaires pour maintenir ou renforcer notre présence et notre puissance maritime !"
AFG_naval_bombers:0 "Améliorer la coordination air-mer"
AFG_naval_bombers_desc:0 "Pour obtenir un avantage dans les combats navals, nous devons assurer la supériorité aérienne sur le champ de bataille. Il faut donc établir notre propre aviation navale de bombardiers et de chasseurs !"
AFG_royal_air_force:0 "[NomDuFocusAérienAfghan]"
AFG_royal_air_force_desc:0 "[DescriptionDuFocusAérienAfghan]"
AFG_royal_air_force_royal:0 "Force Aérienne Royale [AFG.GetAdjective]"
AFG_royal_air_force_royal_desc:0 "La Force Aérienne Royale [AFG.GetAdjective] a été fondée en 1921 et, au cours des quinze dernières années, a accumulé un petit nombre d'avions et de techniciens étrangers. Malheureusement, une grande partie des avions [AFG.GetAdjective] ont été abattus ou mis hors service à cause de guerres récentes comme la guerre civile [AFG.GetAdjective] de 1929."
AFG_air_force_focus:0 "Force Aérienne [AFG.GetAdjective]"
AFG_air_force_focus_desc:0 "La Force Aérienne [AFG.GetAdjective] a été fondée en 1921 et, au cours des quinze dernières années, a accumulé un petit nombre d'avions et de techniciens étrangers. Malheureusement, une grande partie des avions [AFG.GetAdjective] ont été abattus ou mis hors service à cause de guerres récentes comme la guerre civile [AFG.GetAdjective] de 1929."
AFG_train_our_personnel_abroad:0 "Former notre personnel à l'étranger"
AFG_train_our_personnel_abroad_desc:0 "Nous devons envoyer notre personnel militaire à l'étranger pour bénéficier d'une formation avancée et acquérir des compétences qui renforceront notre armée nationale."
AFG_import_planes:0 "Acheter des avions étrangers"
AFG_import_planes_desc:0 "Nous pouvons acheter des avions [ENG.GetAdjective] ou [ITA.GetAdjective] pour renforcer notre force aérienne, en veillant à choisir des partenaires fiables."

AFG_invite_foreign_instructors:0 "Inviter des instructeurs étrangers"
AFG_invite_foreign_instructors_desc:0 "Nous devons inviter des instructeurs étrangers afin de former nos pilotes et techniciens plus rapidement et efficacement."

AFG_import_italian_fighters:0 "Chasseurs fabriqués en [ITA.GetAdjective]"
AFG_import_italian_fighters_desc:0 "Lors d'une compétition avec les [ENG.GetNameDefCap], [ITA.GetNameDefCap] nous a proposé un lot de chasseurs CR.32 [ITA.GetAdjective] accompagnés de plusieurs opérateurs et techniciens qualifiés afin d’étendre son marché à [AFG.GetNameDefCap]."

AFG_import_british_fighters:0 "Bombardiers fabriqués en [ENG.GetAdjective]"
AFG_import_british_fighters_desc:0 "Lors d'une compétition avec les [ITA.GetNameDefCap], [ENG.GetNameDefCap] nous a proposé un lot de bombardiers légers Fairey Gordon [ENG.GetAdjective] accompagnés de plusieurs opérateurs et techniciens qualifiés afin d’étendre son marché à [AFG.GetNameDefCap]. [AFG.GetNameDefCap] a déjà acheté aux [ENG.GetAdjective] par le passé et ils se sont révélés de très bons partenaires commerciaux."

AFG_kabul_air_college:0 "Ouvrir l’Académie aéronautique de Kābul"
AFG_kabul_air_college_desc:0 "[AFG.GetNameDefCap] doit former ses propres techniciens afin de ne pas dépendre des étrangers, qui peuvent être influencés ou rappelés à tout moment. Il faut donc ouvrir une académie aéronautique à Kābul !"

AFG_purhcase_czech_weaponry:0 "Acheter des armes [CZE.GetAdjective]"
AFG_purhcase_czech_weaponry_desc:0 "Nous pouvons acquérir des armes [CZE.GetAdjective] pour renforcer notre arsenal national et réduire notre dépendance à l’importation."

AFG_redesign_military_curriculum:0 "Refondre le programme militaire"
AFG_redesign_military_curriculum_desc:0 "Nous devons moderniser notre programme militaire afin de mieux former nos soldats aux tactiques contemporaines et aux nouvelles technologies."

AFG_develop_the_tank_industry:0 "Développer l’industrie des chars"
AFG_develop_the_tank_industry_desc:0 "Il est temps de commencer la production nationale de chars afin de renforcer notre armée et réduire notre dépendance aux importations."

AFG_bolster_national_arms_manufacturing:0 "Renforcer la production nationale d’armes"
AFG_bolster_national_arms_manufacturing_desc:0 "Nous devons encourager la production locale d’armes pour assurer l’indépendance militaire du pays."

AFG_finance_army_mechanization:0 "Financer la mécanisation de l’armée"
AFG_finance_army_mechanization_desc:0 "Il est crucial de moderniser notre armée en remplaçant une partie de la cavalerie par des véhicules motorisés et blindés."

AFG_introduce_new_uniforms:0 "Introduire de nouveaux uniformes"
AFG_introduce_new_uniforms_desc:0 "Pour moderniser l’armée et renforcer son identité, il faut concevoir et adopter de nouveaux uniformes."

AFG_know_thy_enemy:0 "Connaître son ennemi"
AFG_know_thy_enemy_desc:0 "L’étude approfondie des forces ennemies et de leurs tactiques nous donnera un avantage stratégique sur le champ de bataille."

AFG_modernize_military_hospitals:0 "Moderniser les hôpitaux militaires"
AFG_modernize_military_hospitals_desc:0 "Les hôpitaux militaires doivent être équipés et organisés selon les normes modernes pour soigner efficacement les soldats blessés."

AFG_study_the_blitzkrieg:0 "Étudier la guerre de mouvement"
AFG_study_the_blitzkrieg_desc:0 "Analyser les tactiques de guerre de mouvement nous permettra de mener des offensives rapides et décisives contre nos ennemis."

AFG_victory_through_firepower:0 "Victoire par la puissance de feu"
AFG_victory_through_firepower_desc:0 "En augmentant la puissance de feu de nos forces, nous pouvons dominer le champ de bataille et assurer la victoire."

AFG_expand_military_airports:0 "Étendre les bases aériennes militaires"
AFG_expand_military_airports_desc:0 "Pour soutenir la croissance de la force aérienne, nous devons développer et moderniser nos bases aériennes."

AFG_the_242nd_parachute_battalion:0 "Le 242ᵉ Bataillon de parachutistes"
AFG_the_242nd_parachute_battalion_desc:0 "La création du 242ᵉ bataillon de parachutistes renforcera notre capacité à mener des opérations aéroportées et rapides sur le terrain."
AFG_the_242nd_parachute_battalion_desc:0 ""

######## FOCUSES COMMUNISTES ########

AFG_form_weekh_zalmian:0 "Le Weekh Zalmiān"
AFG_form_weekh_zalmian_desc:0 "Le Weekh Zalmiān est un mouvement politique socialiste en [AFG.GetNonIdeologyName] dirigé par Mawlana Qiamuddin Khadim, un poète réputé, et le Dr Abdulrahman Mahmudi, médecin. Le mouvement appelle à une modernisation à grande échelle et à plus de droits pour les femmes, et s'est divisé en une faction pro-[SOV.GetAdjective] et anti-[SOV.GetAdjective], les Khalq et Parcham."

AFG_approach_the_soviets:0 "Approcher les [SOV.GetAdjective]"
AFG_approach_the_soviets_desc:0 "Approcher les [SOV.GetAdjective] est crucial pour un coup d’État contre le roi. Ce n’est qu’avec la force et le soutien étranger que nous pouvons renverser le gouvernement actuel et le remplacer par le nôtre."

AFG_form_worker_communes:0 "Créer des syndicats"
AFG_form_worker_communes_desc:0 "Le peuple [AFG.GetAdjective] doit être éclairé sur ses droits sociaux et professionnels. En créant des syndicats et des coopératives, nous ouvrirons les yeux du peuple sur le mépris total du gouvernement pour les travailleurs de [AFG.GetNonIdeologyName]."

AFG_utilize_the_military:0 "Utiliser l’armée"
AFG_utilize_the_military_desc:0 ""

AFG_depose_the_king:0 "À bas le roi !"
AFG_depose_the_king_desc:0 "Le jour est enfin arrivé où le régime autoritaire instauré par la bourgeoisie prendra fin et les flammes de la révolution embraseront tout [AFG.GetNonIdeologyName]. Un comité révolutionnaire dirigé par Mawlana Qiamuddin Khadim est installé !"

AFG_national_front:0 "Le Front National"
AFG_national_front_desc:0 "Le Front National de Libération, ou NLB, est une coalition politique partageant de nombreux points de vue avec la faction Parcham dirigée par Mawlana Qiamuddin Khadim et Ghulam Muhammad Ghubar du Parti démocratique populaire de [AFG.GetNonIdeologyName]."

AFG_soviet_expedition:0 "Inviter des envoyés [SOV.GetAdjective]"
AFG_soviet_expedition_desc:0 "Les [SOV.GetAdjective] se sont beaucoup intéressés au récent coup communiste en [AFG.GetNonIdeologyName] qui a renversé la bourgeoisie et élevé le prolétariat. Ils ont offert un soutien militaire, économique et politique, peut-être devrions-nous accepter leur offre."

AFG_purge_the_bourgeoisie:0 "Épurer la bourgeoisie"
AFG_purge_the_bourgeoisie_desc:0 "Après le coup d’État en [AFG.GetNonIdeologyName], une grande partie de la bourgeoisie a fui le pays vers [PAK.GetNonIdeologyName] et l’Iran, craignant ce qui pourrait leur arriver sous le nouveau régime tout en essayant de préserver leur richesse. Nous devons traiter la partie significative qui a choisi de rester."

AFG_form_khad:0 "Créer le KhAD"
AFG_form_khad_desc:0 "Tout régime communiste a besoin d’un moyen pour contrôler la population. En créant le Khadamat-e Aetla'at-e Dawlati, nous pouvons le faire et assurer la sécurité de l’État."

AFG_arrest_qiamuddin:0 "Éliminer les Parchamites"
AFG_arrest_qiamuddin_desc:0 "Le leader du Parcham, Mawlana Qiamuddin Khadim, peut être très dangereux pour notre régime. Il est crucial de l’éliminer politiquement, ce qui bien sûr irritera le Parcham mais garantira la place des Khalq au gouvernement."

AFG_socialist_education:0 "Fusionner islam et marxisme"
AFG_socialist_education_desc:0 "L’islam, bien que ne reflétant pas les idées du marxisme, est un bon outil de guidance. Nous devons le préserver et l’unifier avec notre idéologie, la coopération avec les madrasas ouvrira la voie."

AFG_begin_colectivization:0 "Commencer la collectivisation industrielle"
AFG_begin_colectivization_desc:0 "Les secteurs agricole et industriel de [AFG.GetNameDefCap] sont très basiques et traditionnels, utilisant de vieux outils et techniques. Pour prospérer, nous devons moderniser ces secteurs avec du matériel et des méthodes de production modernes."

AFG_universal_suffarage:0 "Élever le statut des femmes"
AFG_universal_suffarage_desc:0 "Dans les montagnes escarpées de [AFG.GetNonIdeologyName], un groupe déterminé a travaillé pour instaurer le suffrage universel, où la voix de chaque Afghan contribue à un destin démocratique inclusif."

AFG_give_hazara_rights:0 "Protéger les droits des Hazaras"
AFG_give_hazara_rights_desc:0 "Les Hazaras, vivant principalement à [1009.GetName], ont été très isolés du gouvernement. En leur accordant plus de droits, nous espérons étendre la révolution et la pensée marxiste à leur communauté."

AFG_crush_hazara_nationalism:0 "Réprimer le nationalisme hazara"
AFG_crush_hazara_nationalism_desc:0 "Les tribus hazaras, très isolées, n’ont pas été pleinement touchées par la révolution en [AFG.GetNonIdeologyName]. Elles conservent leurs traditions tribales et nationalistes."

AFG_marxist_thought:0 "Ancrer la pensée marxiste"
AFG_marxist_thought_desc:0 "Pour former une nouvelle génération de [AFG.GetAdjective] libres penseurs, nous devons ancrer la pensée marxiste dans l’esprit du peuple. Encourager les parents à éduquer leurs enfants est la clé pour préparer nos futures générations aux temps difficiles."

AFG_socialist_constitution:0 "Formaliser la nouvelle constitution"
AFG_socialist_constitution_desc:0 "[AFG.GetNonIdeologyName], pays isolé, manque de système juridique et de moyens de l’appliquer. Nous devons élaborer une nouvelle constitution, plus socialiste."

AFG_invite_pakistani_military:0 "Inviter des sympathisants [PAK.GetAdjective]"
AFG_invite_pakistani_military_desc:0 "Nous devons inviter des généraux et officiers communistes [PAK.GetAdjective] à rejoindre notre cause pour propager la révolution dans l’Orient."

AFG_reform_the_education_system:0 "Réformer le système éducatif"
AFG_reform_the_education_system_desc:0 "Même si [AFG.GetNonIdeologyName] n’offre pas la meilleure éducation, nous pouvons façonner les opinions politiques des générations futures en semant la graine de la révolution dans leur esprit."

AFG_persecute_believers:0 "Imposer l’athéisme d’État"
AFG_persecute_believers_desc:0 "Le communisme et l’islam ne peuvent coexister. La religion est considérée comme un outil bourgeois visant à contrôler l’humanité."
AFG_afghan_ssr:0 "Plier le genou"
AFG_afghan_ssr_desc:0 "La lutte des classes est la division ultime des peuples, il n’existe pas de fracture plus grande que celle de la lutte des classes. Ainsi, nous devons unir les deux révolutions de [AFG.GetNonIdeologyName] et [SOV.GetNonIdeologyName] en une seule. En devenant une République socialiste soviétique, nous renoncerons à notre liberté et à notre autonomie, mais renforcerons finalement la révolution."
AFG_incorporate_tajikistan:0 "Résoudre la question tadjike"
AFG_incorporate_tajikistan_desc:0 "Les tribus tadjikes et pachtounes coexistent depuis des siècles, à l’intérieur comme à l’extérieur des frontières de [AFG.GetNonIdeologyName]. Mais avec l’intégration récente de la RSS tadjike à [AFG.GetNameDefCap], nous devons améliorer la coopération entre nos deux peuples. En accordant certaines concessions aux Tadjiks, nous gagnerons leur faveur, contrairement au régime précédent à [SOV.Capital.GetCapitalVictoryPointName]."
AFG_loyalty_to_moscow:0 "Loyauté envers [SOV.Capital.GetCapitalVictoryPointName]"
AFG_loyalty_to_moscow_desc:0 "[SOV.GetNameDefCap] s’est montré un allié fiable pour le peuple [AFG.GetAdjective], en soutenant le régime de [AFG.GetNonIdeologyName] et en améliorant l’économie de notre nation autrefois pauvre. Nous ne pouvons donc que tenir notre promesse et rester loyaux envers le gouvernement de [SOV.Capital.GetCapitalVictoryPointName]."
AFG_afghan_workers_program:0 "Lancer le programme d’échange des travailleurs"
AFG_afghan_workers_program_desc:0 "Les [SOV.GetAdjective] et [AFG.GetAdjective] sont liés depuis que [AFG.GetNonIdeologyName] a gagné son indépendance en 1919 après la Troisième Guerre anglo-[AFG.GetAdjective]. L’intégration de notre nation à l’union a renforcé ces liens. En échangeant et envoyant nos travailleurs à l’étranger, nous renforcerons une fois de plus la coopération entre nos deux nations."
AFG_our_own_path:0 "Établir le Front socialiste [AFG.GetAdjective]"
AFG_our_own_path_desc:0 "Il est temps que les révolutions s’unissent sous la bannière de [AFG.GetNonIdeologyName]. En créant le Front socialiste [AFG.GetAdjective], nous visons à répandre la révolution dans les pays voisins, mais non sous la bannière des [SOV.GetAdjective]. Une nouvelle flamme s’allumera à travers le Moyen-Orient et l’Asie centrale, et celle de [SOV.Capital.GetCapitalVictoryPointName] sera éteinte !"
AFG_persian_socialism:0 "Raviver le Mouvement de la Jungle"
AFG_persian_socialism_desc:0 "Nous devons allumer la flamme de la révolution en Perse, semant ainsi les graines du socialisme et du communisme dans le sol fertile des cœurs et esprits [PER.GetAdjective]. Il est de notre devoir d’ouvrir les yeux du peuple [PER.GetAdjective] !"
AFG_soviet_menace:0 "Révéler le ventre de l’ours"
AFG_soviet_menace_desc:0 "[AFG.GetNonIdeologyName] occupe une position stratégique idéale, rendant l’invasion de [SOV.GetNameDef] facile et simple. Nous pouvons utiliser notre position géographique pour frapper les [SOV.GetAdjective] là où ça fait le plus mal : droit dans le ventre de l’ours !"
AFG_revolution_through_belief:0 "Révolution par la paix !"
AFG_revolution_through_belief_desc:0 "Le communisme n’est pas une idéologie de guerre et de sang, mais une idéologie de paix, de fraternité et d’égalité pour tous. Seuls les extrémistes prônent la propagation forcée du communisme par la guerre et le sang de nos frères !"
AFG_revolution_through_force:0 "Révolution par le sang !"
AFG_revolution_through_force_desc:0 "Le communisme ne peut se propager autrement que par la force. Certains communistes croient que le communisme peut se diffuser par la paix, en appelant à la fraternité et à l’unité entre tous, mais c’est faux et cela mènerait à la fin du communisme !"
AFG_secure_the_corridor:0 "Sécuriser le corridor du Wakhan"
AFG_secure_the_corridor_desc:0 "Le corridor du Wakhan, reliant [AFG.GetNonIdeologyName] à l’Altishahr, a été accordé à [AFG.GetNonIdeologyName] pour déconnecter les possessions coloniales [ENG.GetAdjective] en [RAJ.GetNonIdeologyName] et les territoires d’Asie centrale de la Russie au XIXe siècle. Nous devons sécuriser ce corridor pour maintenir la stabilité régionale !"
AFG_socialist_economic_union:0 "Améliorer la coopération économique"
AFG_socialist_economic_union_desc:0 "Pour que nos économies croissent plus rapidement qu’elles ne le font actuellement, nous devons réduire voire supprimer les taxes sur les importations et exportations entre nos nations socialistes. Cela bénéficiera fortement à nos économies."
AFG_socialist_welfare:0 "Moderniser l’État-providence [ROOT.GetAdjective]"
AFG_socialist_welfare_desc:0 "Même si nous sommes une nation communiste, les différences de classe existent encore. Il est donc crucial de mettre en place un système de protection sociale pour la classe ouvrière, le prolétariat. Tous les [AFG.GetAdjective] unis sous une même bannière dans notre lutte contre le capitalisme !"
AFG_the_perso_afghan_union:0 "Unité par la foi !"
AFG_the_perso_afghan_union_desc:0 "Les [AFG.GetAdjective] et [PER.GetAdjective] se ressemblent beaucoup, au point que nos deux nations ressemblent pratiquement à un seul pays divisé en régions fédérales. Faire ce petit pas pour unifier complètement nos deux pays n’est donc pas difficile ! Tous les [AFG.GetAdjective] et [PER.GetAdjective], unis sous une même bannière, une seule idéologie, une seule foi !"
AFG_land_redistribution:0 "Adopter la loi de réforme agraire"
AFG_land_redistribution_desc:0 "Une grande partie de la bourgeoisie a quitté le pays pour chercher refuge dans les pays capitalistes voisins, laissant derrière elle de vastes terres. Nous pouvons les donner aux paysans et ouvriers de [AFG.GetNonIdeologyName] qui les cultiveront et amélioreront notre agriculture, bien qu’il faille noter que ces terres sont en grande partie infertiles."
AFG_into_pakistan:0 "Redessiner la ligne Durand"
AFG_into_pakistan_desc:0 "Les plaines fertiles et les montagnes imposantes de [PAK.GetNonIdeologyName] ont été habitées par les Pachtouns pendant des millénaires. Il est donc de notre devoir d’incorporer ces territoires majoritairement pachtouns à [AFG.GetNonIdeologyName] pour protéger notre peuple des mauvais traitements et du colonialisme qu’ils subissent depuis des siècles !"
AFG_anti_fascist_league:0 "Le rempart antifasciste"
AFG_anti_fascist_league_desc:0 "[AFG.GetNonIdeologyName] doit être le rempart contre tout fascisme en Orient et au-delà ! Nous devons empêcher la propagation du fascisme à tout prix, quel qu’en soit le coût humain !"
AFG_operation_coutenance:0 "L’invasion [SOV.GetAdjective]-[AFG.GetAdjective] de [PER.GetNonIdeologyName]"
AFG_operation_coutenance_desc:0 "Pour sécuriser le front sud, nous devons d’abord régler la question [PER.GetAdjective]. En plus de sécuriser les lignes de ravitaillement et les positions défendables, saisir les grandes réserves de pétrole au nord de la Perse pourrait nous être très utile."
AFG_five_year_plan:0 "Le Plan quinquennal"
AFG_five_year_plan_desc:0 "Après avoir obtenu des experts économiques, le moment est enfin venu pour le Premier Plan Quinquenal en [AFG.GetNonIdeologyName]. Cela stimulera notre économie de manière substantielle et mettra [AFG.GetNonIdeologyName] sur la voie d'une nation développée et prospère !"
AFG_combined_training:0 "Entraînement Militaire [SOV.GetAdjective]-[AFG.GetAdjective]"
AFG_combined_training_desc:0 "L'armée [AFG.GetAdjective] est composée principalement de tribus et de guerriers non entraînés. En initiant des exercices conjoints avec l'Armée Rouge [SOV.GetAdjective], nos soldats et commandants militaires acquerront l'expérience de combat nécessaire."
AFG_undermine_moscow:0 "Saper [SOV.Capital.GetCapitalVictoryPointName]"
AFG_undermine_moscow_desc:0 "Depuis notre soumission à [SOV.GetNameDef], [AFG.GetNonIdeologyName] a été négligée et mise de côté. Nous ne subirons plus cela ! Le moment est venu pour l'ascension de [AFG.GetNonIdeologyName] et la chute subséquente de [SOV.Capital.GetCapitalVictoryPointName] !"
AFG_sabotage_soviet_railways:0 "Saboter les Chemins de Fer [SOV.GetAdjective]"
AFG_sabotage_soviet_railways_desc:0 "Pour que notre invasion contre les [SOV.GetAdjective] réussisse, nous devons perturber leurs lignes d'approvisionnement en sabotant leurs chemins de fer. Nous enverrons des équipes de démolition et de sabotage pour détruire les voies ferrées, rendant l'approvisionnement de leurs troupes très difficile et nous permettant de marcher facilement sur leur territoire."
AFG_seize_gun_stockpiles:0 "Saisir les Stocks d'Armes [SOV.GetAdjective]"
AFG_seize_gun_stockpiles_desc:0 "Chaque armée a besoin d'équipements pour approvisionner ses soldats, et nous aussi. Si tel est le cas, pourquoi ne pas saisir le matériel de nos futurs ennemis en [SOV.GetNameDef] ? Être voisins des [SOV.GetAdjective] rend cela beaucoup plus facile."
AFG_end_soviet_rule:0 "Mettre fin au Règne [SOV.GetAdjective]"
AFG_end_soviet_rule_desc:0 "Après avoir terminé les préparatifs de notre invasion en Asie Centrale, le moment est enfin venu d'appeler nos frères du nord à prendre les armes contre la tyrannie de [SOV.GetNameDef] ! Frères, levez-vous pour votre liberté !"
AFG_ministry_for_propogation_of_virtue:0 "Le Ministère de la Propagation de la Vertu"
AFG_ministry_for_propogation_of_virtue_desc:0 "La Propagation de la Vertu et la Prévention du Vice sont essentielles à notre religion, et si notre État doit être fondé sur notre religion, nous devons manifester cet enseignement à travers une institution gouvernementale."

######## HISTORICAL FOCUSES ########

 AFG_the_regency:0 "Préserver la Régence"
 AFG_the_regency_desc:0 "Il est d'une importance capitale de préserver la Régence Royale, le Roi est encore trop jeune pour gérer la politique intérieure, sans parler de la politique étrangère. Cela permettrait de maintenir la nation stable pendant ces temps sombres, n'est-ce pas ?"
 AFG_appoint_hashim:0 "Poursuivre le mandat de Hashim"
 AFG_appoint_hashim_desc:0 "Sardar Muhammad Hashim Khan est le membre le plus âgé de la Régence Royale, il doit donc être le plus sage. Il guidera [AFG.GetNonIdeologyName] à travers des eaux troubles et maintiendra l'ordre dans le pays !"
 AFG_appoint_mahmud:0 "Nommer Mahmud Ministre"
 AFG_appoint_mahmud_desc:0 "Contrairement à son frère, Sardar Shah Mahmud Khan est une figure plus libérale. Entre ses mains, [AFG.GetNonIdeologyName] sera réformé en une nation occidentale moderne avec un système démocratique et une économie florissante !"
 AFG_institutionalize_pashto:0 "Institutionnaliser le pachto"
 AFG_institutionalize_pashto_desc:0 "Beaucoup au sein de [AFG.GetNonIdeologyName] continuent de parler le persan, parfois comme moyen de communication entre différentes tribus, et même à l'époque moderne, l'influence du persan est encore visible dans [AFG.GetNonIdeologyName]. Il est impératif qu'une langue nationale, comme le pachto, soit renforcée et enseignée à tous nos citoyens, si [AFG.GetNonIdeologyName] veut survivre en tant que nation !"
 AFG_treaty_of_saadabad_hist:0 "Traité de Saadabad"
 AFG_treaty_of_saadabad_hist_desc:0 "Le Moyen-Orient est d'une importance capitale pour [AFG.GetNonIdeologyName], car les changements dans la politique de ces pays peuvent fortement impacter notre économie, notre armée et notre politique. Nous devons tendre la main vers l'est ! Peut-être en proposant un pacte d'amitié et de non-agression."
 AFG_visit_berlin:0 "Visite d'État à [GER.Capital.GetCapitalVictoryPointName]"
 AFG_visit_berlin_desc:0 "[AFG.GetNonIdeologyName] est déchiré entre deux maux : au nord se trouvent les [SOV.GetAdjective]s, au sud se trouvent les [ENG.GetAdjective]. Nous devons établir une troisième puissance influente dans [AFG.GetNonIdeologyName] pour maintenir l'équilibre des pouvoirs. Ainsi, nous devons nous tourner vers les [GER.GetAdjective]s et demander leur soutien."
 AFG_invite_wehrmacht_officers:0 "Inviter des officiers de la Wehrmacht"
 AFG_invite_wehrmacht_officers_desc:0 "L'armée [AFG.GetAdjective] pourrait bénéficier d'un soutien étranger, peut-être de [GER.GetNonIdeologyName]. Pendant la Première Guerre mondiale, une mission militaire [GER.GetAdjective] avait été envoyée à [AFG.GetNonIdeologyName] dans l'espoir d'établir des liens diplomatiques et de la contraindre à entrer en guerre. Il serait judicieux de réinviter le chef de la mission, Werner Otto von Hentig."
 AFG_bolster_the_nationalists:0 "Renforcer les nationalistes"
 AFG_bolster_the_nationalists_desc:0 ""
 AFG_purge_the_nationalists:0 "Écarter les nationalistes"
 AFG_purge_the_nationalists_desc:0 ""
 AFG_acquire_german_radios:0 "Acquérir des radios [GER.GetAdjective]"
 AFG_acquire_german_radios_desc:0 ""
 AFG_invite_abwehr_agents:0 "Inviter des agents de l'Abwehr"
 AFG_invite_abwehr_agents_desc:0 "En invitant l'Abwehr [GER.Adjective] à établir une base avancée à [AFG.GetNonIdeologyName], cela permettrait à nous et aux services de renseignement [GER.Adjective] de surveiller les [ENG.GetAdjective] en [RAJ.GetNameDef] et en Asie. Cela améliorerait également notre sécurité nationale et empêcherait probablement toute invasion sans notre connaissance préalable."
 AFG_enact_censorship:0 "Appliquer la censure des médias"
 AFG_enact_censorship_desc:0 "Les médias sont un outil puissant, ils servent d'intermédiaire entre le gouvernement et le peuple. Cependant, tout n'a pas besoin d'être publié, n'est-ce pas ? Surtout lorsque le contenu est nuisible au gouvernement."
 AFG_build_up_roads:0 "Traiter avec l'Organisation Todt"
 AFG_build_up_roads_desc:0 "Les [GER.GetAdjective]s ont proposé un accord industriel lucratif selon lequel l'Organisation Todt, en coopération avec le gouvernement [AFG.GetAdjective], construirait des routes à travers [AFG.GetNonIdeologyName]. Cela renforcerait considérablement l'économie [AFG.GetAdjective] et la qualité de vie du peuple [AFG.GetAdjective]."
 AFG_german_investments_program:0 "Programme d'investissements [GER.GetAdjective]"
 AFG_german_investments_program_desc:0 "Les investissements [GER.GetAdjective]s dans [AFG.GetNonIdeologyName] sont vitaux pour le développement économique et la croissance des infrastructures de notre nation. Ces partenariats apportent non seulement un soutien financier mais également une expertise et une technologie précieuses, favorisant un avenir prospère et durable pour [AFG.GetNonIdeologyName] grâce à des collaborations mutuellement bénéfiques."
 AFG_fund_the_army:0 "Détourner des fonds vers l'armée"
 AFG_fund_the_army_desc:0 "Financer l'armée afghane est primordial pour la sécurité et la stabilité de la nation. Il est du devoir de chaque citoyen de contribuer au soutien financier de nos forces armées, afin qu'elles restent bien équipées et prêtes à défendre notre souveraineté contre toute menace."
 AFG_stabilize_the_currency:0 "Stabiliser la monnaie"
 AFG_stabilize_the_currency_desc:0 "Stabiliser la monnaie est particulièrement important pour assurer la confiance des investisseurs. Une monnaie stable encourage le développement, attire les investissements étrangers et contribue à la prospérité économique et au bien-être social de nos citoyens."
 AFG_irrigation_scheme:0 "Signer le Programme des Quatre Points"
 AFG_irrigation_scheme_desc:0 "Nos agriculteurs de l'ouest ne bénéficient pas des mêmes privilèges que ceux de l'est. Ces divisions finissent par déchirer une nation et son peuple. Nous ne devons pas laisser cela se produire, peut-être en construisant des systèmes d'irrigation modernes pour ces agriculteurs défavorisés, nous pourrions gagner leur soutien."
 AFG_the_getyear_general_elections:0 "Les élections générales de [GetYear]"
 AFG_the_getyear_general_elections_desc:0 "Dans son histoire, [AFG.GetNonIdeologyName] n'a jamais eu quoi que ce soit qui ressemble de près ou de loin à un système démocratique. Aujourd'hui, cela va changer. C'est la première fois de son histoire que [AFG.GetNonIdeologyName] aura des élections libres où tous ses citoyens pourront voter et exprimer leur opinion !"
 AFG_shah_mahmud_prevails:0 "Réélection pour les conservateurs"
 AFG_shah_mahmud_prevails_desc:0 "Nous ne devons pas nous éloigner trop de notre système actuel. Il est important de maintenir les valeurs fondamentales de [AFG.GetNonIdeologyName]. Le Parti conservateur dirigé par Sardar Shah Mahmud Khan semble très prometteur dans cette démarche."
 AFG_fatherland_party_triumph:0 "Le triomphe du Parti de la Patrie"
 AFG_fatherland_party_triumph_desc:0 "La démocratie ne doit pas être limitée par notre culture et nos visions rétrogrades du monde moderne ! Sous le Parti de la Patrie dirigé par Ghulam Muhammad Ghubar, [AFG.GetNonIdeologyName] sera transformé en un phare de la démocratie libérale en Orient !"
 AFG_infrastructure_privatization:0 "Privatiser les infrastructures nationales"
 AFG_infrastructure_privatization_desc:0 "La privatisation des infrastructures et des autoroutes est essentielle pour stimuler la croissance économique dans le secteur public. En encourageant l'implication du secteur privé, nous visons à assurer la durabilité à long terme de nos réseaux de transport."
 AFG_british_exchange_program:0 "Le programme d'échange [ENG.GetAdjective]"
 AFG_british_exchange_program_desc:0 "L'échange de technologies et d'avancées militaires avec [ENG.GetNameDef] est crucial afin de renforcer les capacités de défense de notre armée. Nous espérons que cela favorisera de bonnes relations et la coopération avec [ENG.GetNameDef]."
 AFG_liberal_constitution:0 "Adopter une constitution libérale"
 AFG_liberal_constitution_desc:0 "[AFG.GetNonIdeologyName] avait autrefois une constitution quelque peu libérale sous le roi Amanullah, soutenue par la Loya Jirga et le public. Nous devrions viser à réintroduire une constitution similaire tout en conservant la plupart des mêmes valeurs mais aussi en la restructurant pour qu'elle réponde aux standards actuels."
 AFG_the_afghan_new_deal:0 "Le New Deal [AFG.GetAdjective]"
 AFG_the_afghan_new_deal_desc:0 "De la même manière que le New Deal [USA.GetAdjective], introduit par le président [USA.GetAdjective] Franklin D. Roosevelt, [AFG.GetNonIdeologyName] prévoit d'introduire une série de programmes économiques similaires pour lutter contre le chômage et d'autres problèmes dans l'espoir de relancer l'économie [AFG.GetAdjective]."
 AFG_form_watan_party:0 "Former le Parti de la Patrie"
 AFG_form_watan_party_desc:0 "La création du Parti Watan est cruciale pour [AFG.GetNonIdeologyName], car elle signifie un engagement envers les principes démocratiques et la gouvernance inclusive. Cette entité politique vise à offrir une plateforme pour toutes les voix de [AFG.GetNonIdeologyName], contribuant au développement démocratique de la nation et garantissant un gouvernement représentant les aspirations et intérêts de l'ensemble du pays."
 AFG_economic_privatization:0 "Privatiser le secteur industriel"
 AFG_economic_privatization_desc:0 "La privatisation du secteur industriel est cruciale pour stimuler la croissance économique et créer une économie compétitive. En encourageant la propriété et la gestion privées, nous visons à créer une économie autonome alimentée par des entreprises et sociétés privées."
 AFG_reapproachment_with_RAJ:0 "Rapprochement avec le Raj"
 AFG_reapproachment_with_RAJ_desc:0 "Afin de maintenir la stabilité et la paix régionales, il est essentiel de préserver des relations cordiales avec [RAJ.GetNameDef]. Nous devons tendre une branche d'olivier à [RAJ.GetNameDef], pour le bien de [AFG.GetNonIdeologyName] et du peuple [AFG.GetAdjective] !"
 AFG_join_the_axis:0 "Rejoindre l'Axe"
 AFG_join_the_axis_desc:0 "Les puissances de l'Axe nous ont promis grandeur et sécurité en échange de notre adhésion. Le temps où [AFG.GetNonIdeologyName] dépendait de [ENG.GetNameDef] et [SOV.GetNameDef] est révolu. L'ère d'un [AFG.GetNonIdeologyName] moderne, développé et politiquement indépendant ne fait que commencer !"
 AFG_from_the_leopard_corps:0 "Former le corps Léopard"
 AFG_from_the_leopard_corps_desc:0 "Nous avons besoin d'une force armée moderne, bien équipée et disciplinée, et rien ne peut remplacer l'expertise et l'entraînement de l'élite. Inspirée par le corps d'élite [GER.GetAdjective], cette unité spéciale servira de force d'intervention rapide pour protéger le pays contre toutes menaces internes et externes."
AFG_operation_tiger:0 "Opération Tigre"
AFG_operation_tiger_desc:0 "Les plaines verdoyantes et les montagnes imposantes de [PAK.GetNonIdeologyName] sont habitées par les Pachtouns depuis des millénaires. Il est donc de notre devoir absolu d’incorporer ces territoires à majorité pachtoune à [AFG.GetNonIdeologyName] afin de protéger notre peuple contre les horribles mauvais traitements et le colonialisme auxquels ils ont été soumis pendant des siècles !"
AFG_operation_blue_mosque:0 "Opération Mosquée Bleue"
AFG_operation_blue_mosque_desc:0 "Pour sécuriser la frontière occidentale, nous devons régler la question [PER.GetAdjective]. Outre la sécurisation des lignes d’approvisionnement vitales et l’élimination de toute influence indésirable en Perse, s’emparer des importantes réserves de pétrole dans le nord de la Perse pourrait nous être très utile."
AFG_neutrality_reaffirmed:0 "Réaffirmer la Neutralité"
AFG_neutrality_reaffirmed_desc:0 "[AFG.GetNonIdeologyName] est neutre depuis la guerre de 1919, lorsqu’il a obtenu son indépendance à l’issue d’un conflit brutal et sanglant contre le plus grand et le plus avancé Empire de l’époque, l’Empire britannique. Si ça fonctionne, pourquoi changer ?"
AFG_deterrence_focus:0 "Défendre la Patrie"
AFG_deterrence_focus_desc:0 "Dissuader les invasions militaires est un objectif primordial pour le gouvernement afghan afin d’assurer la souveraineté et la sécurité de notre nation. En renforçant nos capacités défensives, nous créons un effet de dissuasion contre les menaces extérieures, protégeant ainsi le bien-être de nos citoyens. Pour la Patrie !"
AFG_implement_autarky:0 "Mettre en œuvre l'Autarcie"
AFG_implement_autarky_desc:0 "Nous devons mettre en œuvre l’autarcie afin d’atteindre l’autosuffisance économique et réduire notre dépendance aux ressources extérieures. En donnant la priorité à la production locale, nous cherchons à renforcer la résilience de notre nation face aux incertitudes économiques mondiales."
AFG_combat_foreign_influence:0 "L'Esprit de la Neutralité"
AFG_combat_foreign_influence_desc:0 "Maintenir l’esprit de neutralité est essentiel pour le gouvernement afghan afin de préserver l’indépendance de notre nation face à l’influence [SOV.GetAdjective] ou [ENG.GetAdjective]."
AFG_fortify_the_durand_line:0 "Renforcer la Ligne Durand"
AFG_fortify_the_durand_line_desc:0 "Renforcer la Ligne Durand, la frontière avec [RAJ.GetNameDef], est impératif afin d’assurer la sécurité, de réguler les activités transfrontalières et de protéger la frontière sud de [AFG.GetNonIdeologyName]. En fortifiant cette frontière, nous visons à améliorer notre préparation militaire si un conflit avec l’armée [GetRajAdjective] devait survenir."
AFG_the_uneasey_border:0 "Renforcer la Frontière Instable"
AFG_the_uneasey_border_desc:0 "Renforcer la frontière [SOV.GetAdjective]-[AFG.GetAdjective] est d’une importance capitale afin de maintenir l’intégrité territoriale et de sécuriser la nation contre les menaces extérieures. Le renforcement des défenses frontalières vise à améliorer notre préparation militaire si un conflit avec [SOV.GetAdjective] devait éclater."
AFG_expand_the_welfare_state:0 "Étendre l'État-Providence"
AFG_expand_the_welfare_state_desc:0 ""
AFG_join_allies:0 "Rejoindre les Alliés"
AFG_join_allies_desc:0 "Les Alliés, symbole de stabilité, de paix et surtout de démocratie, font l’objet de débats parmi les politiciens [AFG.GetAdjective] depuis un certain temps. Cependant, le consensus est que [AFG.GetNonIdeologyName] partage de nombreuses valeurs avec les nations alliées. Dans cette optique, il est juste que [AFG.GetNonIdeologyName] rejoigne les Alliés !"
AFG_press_for_pakistan:0 "Appuyer l’Intégration de [PAK.GetNonIdeologyName]"
AFG_press_for_pakistan_desc:0 "Les plaines verdoyantes et les montagnes imposantes de [PAK.GetNonIdeologyName] sont habitées par les Pachtouns depuis des millénaires. Il est donc de notre devoir absolu d’incorporer ces territoires à majorité pachtoune à [AFG.GetNonIdeologyName] afin de protéger notre peuple contre les horribles mauvais traitements et le colonialisme auxquels ils ont été soumis pendant des siècles !"
AFG_aquire_british_ships:0 "Acquérir des Navires [ENG.GetAdjective]"
AFG_aquire_british_ships_desc:0 "Acquérir des navires auprès de [ENG.GetNameDef] est crucial afin de renforcer les capacités de sécurité maritime de la Marine [AFG.GetAdjective]. Cependant, cela peut nous coûter une somme importante que nous ne pourrions peut-être pas nous permettre pour le moment."
AFG_operation_red_mosque:0 "Opération Mosquée Rouge"
AFG_operation_red_mosque_desc:0 "Le communisme est une idéologie perverse qui ne provoque que mort et destruction partout où elle s’installe, du moins c’est ce que nous pensons. Il est de notre devoir de mettre fin au communisme une bonne fois pour toutes et d’éviter toute souffrance future des peuples sous son emprise. Nous devons frapper le fléau [SOV.GetAdjective] au nord !"
AFG_increase_school_funding:0 "Augmenter le Financement des Écoles"
AFG_increase_school_funding_desc:0 "Augmenter le financement des écoles est une priorité afin d’assurer un avenir meilleur pour notre nation. En allouant davantage de ressources à l’éducation, nous visons à améliorer la qualité des établissements et à donner à notre jeunesse les connaissances et compétences nécessaires pour contribuer au développement social et économique de [AFG.GetNonIdeologyName]."
AFG_beacon_of_the_orient:0 "Phare de l’Orient"
AFG_beacon_of_the_orient_desc:0 "Protéger la démocratie en Orient est d’une importance capitale, car cela symbolise notre engagement envers la liberté et l’unité. En défendant les principes démocratiques, nous cherchons à maintenir la stabilité et à promouvoir les valeurs démocratiques en Orient et au-delà !"
AFG_legacy_of_the_yellow_expedition:0 "Héritage de l’Expédition Jaune"
AFG_legacy_of_the_yellow_expedition_desc:0 "L’Expédition Jaune de 1932, menée par quatre hommes représentant Citroën, a traversé [AFG.GetNonIdeologyName] pour promouvoir leur nouvel équipement, le P17 Kégresse. La possibilité d’acheter ces semi-chenilles n’a jamais été exclue, nous pourrions encore le faire si nous le souhaitons."
AFG_grant_land_concessions:0 "Accorder des Concessions Foncières"
AFG_grant_land_concessions_desc:0 "Accorder des concessions foncières dans des régions riches en pétrole aux compagnies [USA.GetAdjective] en [AFG.GetNonIdeologyName] est essentiel pour stimuler le développement économique. Nous espérons ainsi attirer des investissements étrangers et améliorer notre coopération économique avec [USA.GetNameDef]."
AFG_specialization_of_units_focus:0 "Unités Spécialisées"
AFG_specialization_of_units_focus_desc:0 "Bien qu’il soit possible d’avoir de nombreuses divisions et bataillons d’infanterie peu entraînés et équipés, il serait utile de développer des unités spécialisées pour combattre dans différents terrains. Étant donné que le territoire de [AFG.GetNonIdeologyName] est majoritairement montagneux, il est logique de se spécialiser dans le combat en montagne, n’est-ce pas ?"
AFG_ramp_up_military_production:0 "Accroître la Production Militaire"
AFG_ramp_up_military_production_desc:0 "La production militaire de [AFG.GetNonIdeologyName] est pratiquement inexistante. Cela rend la protection de notre nation contre les menaces et influences extérieures extrêmement difficile, car nous dépendons d’autres pays pour le matériel militaire. [AFG.GetNonIdeologyName] doit commencer à produire ses propres armes pour sa souveraineté et sa sécurité !"
AFG_study_our_surroundings:0 "S’adapter à Notre Environnement"
AFG_study_our_surroundings_desc:0 "Pour mieux nous défendre, nous devons étudier notre environnement et développer des tactiques qui nous donneront un avantage significatif contre les envahisseurs étrangers. En utilisant notre terrain, nous pouvons infliger de lourdes pertes à l’ennemi sans subir de grandes pertes nous-mêmes !"
AFG_mass_produce_equipment:0 "Produire en Masse l’Équipement"
AFG_mass_produce_equipment_desc:0 "Pour maintenir notre force militaire, nous devons nous concentrer sur le nombre de soldats et équiper chacun d’entre eux. Deux hommes avec des fusils médiocres valent toujours mieux qu’un seul homme avec un fusil supérieur !"
AFG_live_off_the_land:0 "Vivre de la Terre"
AFG_live_off_the_land_desc:0 "Nous devons travailler sur des tactiques qui aideront nos troupes à survivre aux hivers froids et rigoureux ou dans des situations où les approvisionnements sont difficiles à obtenir. Elles doivent être formées pour survivre avec ce qu’on leur donne !"
AFG_terror_of_the_sea:0 "Terreur des Mers"
AFG_terror_of_the_sea_desc:0 "La Terreur des Mers, un navire si grand et massif, un navire qui transporte de nombreux avions frappant les navires ennemis avec des frappes dévastatrices ! Nous devons travailler à la production d’un tel navire car il nous assurera certainement la victoire dans tout combat naval !"
AFG_destroyer_of_worlds:0 "Destructeur de Mondes"
AFG_destroyer_of_worlds_desc:0 "C’est le rêve de tout scientifique de pouvoir enfin exploiter l’énergie de l’atome. Cette immense quantité d’énergie pourrait provoquer la destruction totale de villes et de régions entières. Nous devons être prudents, car l’énergie nucléaire pourrait représenter une menace plus grande que son bénéfice pour l’humanité."

######## FOCUSES MONARCHISTES ALTERNATIFS ########

 AFG_abolish_the_regency:0 "Abolir la Régence"
 AFG_abolish_the_regency_desc:0 "Le Roi doit conduire [AFG.GetNonIdeologyName] vers la gloire et la prospérité ! Avec sa gestion de la Loya Jirga, il a montré qu'il est capable de gérer la politique étrangère et intérieure de [AFG.GetNonIdeologyName]. Nous ne pouvons qu'espérer que le pouvoir ne lui montera pas à la tête."
 AFG_backtrack_on_reforms:0 "Abroger les réformes de Nadir Shah"
 AFG_backtrack_on_reforms_desc:0 "Le gouvernement de [AFG.GetNonIdeologyName] a été trop ambitieux avec la modernisation et les réformes dans le passé. Nous ne devons pas laisser la modernisation et les réformes diviser à nouveau notre nation, comme ce fut le cas en 1929 sous le règne du roi Amanullah. Le progrès est ce qui pourrait finalement déchirer notre nation !"
 AFG_continute_nadir_shahs_reforms:0 "Poursuivre les réformes de Nadir Shah"
 AFG_continute_nadir_shahs_reforms_desc:0 "Tout doucement mais sûrement ! Nous devons promouvoir des réformes lentes qui n'affecteront pas trop le mode de vie du peuple [AFG.GetAdjective]. Le progrès doit être maintenu, un excellent exemple en est le règne du défunt père du roi Muhammad Zahir Shah, le roi Nadir Shah. Son fils suivra ses traces !"
 AFG_construct_the_great_north_road:0 "Construire la Grande Route du Nord"
 AFG_construct_the_great_north_road_desc:0 "[1011.GetName] a été sous-développé trop longtemps. Il est donc important d’urbaniser et d’industrialiser la région. Et quoi de mieux pour cela que de construire une autoroute reliant le nord à Kābul !"
 AFG_foreign_economic_aid:0 "Chercher des investissements économiques étrangers"
 AFG_foreign_economic_aid_desc:0 "[AFG.GetNonIdeologyName] est un pays pauvre, il faut l’admettre. Cependant, il n’est pas obligé de le rester ! Pour apporter prospérité économique et sociale à notre peuple, il est primordial d’établir des relations avec les grandes puissances étrangères. De grands bénéfices pourraient nous attendre."
 AFG_centralize_the_bank_of_afg:0 "Centraliser la Banque de [AFG.GetNonIdeologyName]"
 AFG_centralize_the_bank_of_afg_desc:0 "Le secteur bancaire [AFG.GetAdjective] est actuellement très sous-développé. Cela découle du manque de réformes et de modernisation ainsi que de l’absence générale de besoin d’un système bancaire dû au déficit de capital. Si [AFG.GetNonIdeologyName] veut entrer sur la scène mondiale ou devenir un pays développé, il est nécessaire de développer le secteur bancaire."
 AFG_push_army_reforms:0 "Introduire de nouvelles réformes militaires"
 AFG_push_army_reforms_desc:0 "Bien que les chefs tribaux et les membres de la Loya Jirga ne soient peut-être pas favorables, il est nécessaire de promouvoir des réformes militaires limitées. L’Armée Royale [AFG.GetAdjective] est faible ; en poussant ces réformes, nous la renforcerons !"
 AFG_annul_the_hasht_nafari:0 "Annuler le Hasht Nafari"
 AFG_annul_the_hasht_nafari_desc:0 "Il y a de nombreuses années, sous le règne d’Abdur Rahman Khan, grand émir de [AFG.GetNonIdeologyName], un accord fut conclu entre le gouvernement et les chefs tribaux. Cet accord, appelé « Hasht Nafari » ou « Huit Personnes », stipule que chaque huit personnes, choisies par les chefs tribaux, doivent servir dans l’armée pendant un certain temps. Pour moderniser l’armée, cette loi non écrite doit être annulée !"
 AFG_introduce_new_taxes:0 "Introduire de nouvelles taxes"
 AFG_introduce_new_taxes_desc:0 "Jusqu’où ira notre pouvoir ? [AFG.GetNonIdeologyName] est devenu une dictature sous le roi Muhammad Zahir Shah. Tout semble possible avec le roi aux commandes. Espérons que l’histoire ne se répète pas, sinon [AFG.GetNonIdeologyName] pourrait de nouveau plonger dans le chaos."
 AFG_amend_the_constitution:0 "Amender la Constitution de 1931"
 AFG_amend_the_constitution_desc:0 "Le moment est enfin venu, le roi Muhammad Zahir Shah va se lever et devenir le roi que son père lui a préparé ! La Loya Jirga, la Régence, tous disparaîtront bientôt, et le roi dirigera à nouveau [AFG.GetNonIdeologyName] d’une main de fer ! D’un simple coup de stylo, il atteindra la gloire !"
 AFG_the_generals_coup:0 "Le Coup des Généraux"
 AFG_the_generals_coup_desc:0 "[AFG.GetNonIdeologyName] est actuellement profondément divisé. Certains restent loyaux au roi tandis que d’autres attendent sa chute. Daoud Khan, voyant une opportunité, prépare son coup dans l’ombre..."
 AFG_the_exiled_king:0 "Le Roi Exilé"
 AFG_the_exiled_king_desc:0 "La situation à [AFG.GetNonIdeologyName] étant de plus en plus critique, il semble que personne ne puisse sauver le pays des griffes de l’instabilité... [AFG.GetNonIdeologyName] est condamné à un destin instable ! Cependant, des rumeurs circulent selon lesquelles le roi exilé et émir Amanullah Khan serait revenu pour renverser le roi ! Seul Dieu peut le dire."
 AFG_university_in_herat:0 "Fonder l’Université de Hérat"
 AFG_university_in_herat_desc:0 "[AFG.GetNonIdeologyName] n’a pas beaucoup à offrir en matière d’éducation. Il est donc de notre devoir de remédier à cela ! En créant une université à [415.GetName], une ville très peuplée de l’ouest, nous espérons améliorer la qualité globale de l’enseignement et offrir une alternative à l’université de Kābul pour nos futurs étudiants !"
 AFG_adopt_constitutional_monarchy:0 "Réaffirmer le Monarchisme Constitutionnel"
 AFG_adopt_constitutional_monarchy_desc:0 "Sous le roi Muhammad Zahir Shah, [AFG.GetNonIdeologyName] deviendra une monarchie constitutionnelle avec des élections tous les 4 ans. Bien que le roi conserve la majorité de ses pouvoirs, c’est un progrès considérable vers un [AFG.GetNonIdeologyName] démocratique et libre !"
 AFG_treaty_of_saadabad:0 "Traité de Saadabad"
 AFG_treaty_of_saadabad_desc:0 "Le Moyen-Orient est d’une importance capitale pour [AFG.GetNonIdeologyName], car les changements de politique de ces pays peuvent impacter notre économie, notre armée et notre politique. Nous devons tendre la main à l’est ! Peut-être en proposant un pacte d’amitié et de non-agression."
 AFG_nationalize_banks:0 "Nationaliser les Banques [AFG.GetAdjective]"
 AFG_nationalize_banks_desc:0 "Bien que [AFG.GetNonIdeologyName] ne possède pas un grand secteur bancaire, nous devrions nationaliser les quelques banques existantes. En les gérant directement, nous pourrons améliorer notre économie plus efficacement."
 AFG_ban_political_parties:0 "Interdire l’Activité Politique"
 AFG_ban_political_parties_desc:0 "En cette période difficile pour [AFG.GetNonIdeologyName], il n’y a pas besoin de pluralité politique ! Permettre la formation de plusieurs partis ne ferait qu’augmenter l’instabilité et diviser la nation, menant potentiellement à une nouvelle guerre civile..."
 AFG_disband_the_jirga:0 "Dissoudre la Loya Jirga"
 AFG_disband_the_jirga_desc:0 "Notre gouvernement bénéficie du soutien complet de l’armée, ce qui nous permet de dissoudre la Loya Jirga sans grande opposition des chefs tribaux. Cela permettra de stabiliser la nation et de réduire temporairement l’influence des tribus sur le gouvernement !"
 AFG_amanullahs_visit_to_europe:0 "Tour Royal en Europe"
 AFG_amanullahs_visit_to_europe_desc:0 "Depuis son retour à [AFG.GetNonIdeologyName], Amanullah planifie un tour royal en Europe. Sa précédente tentative avait déclenché une guerre civile dans le pays pendant son absence. Espérons que l’histoire ne se répète pas !"
 AFG_restore_the_constitution:0 "Restaurer la Constitution de 1921"
 AFG_restore_the_constitution_desc:0 "La constitution de 1921, première constitution libérale de [AFG.GetNonIdeologyName], qui proclamait l’égalité de tous les [AFG.GetAdjective], doit voir ses valeurs maintenues dans la nouvelle constitution !"
 AFG_establish_radio_kabul:0 "Créer Radio Kābul"
 AFG_establish_radio_kabul_desc:0 "Avec les progrès technologiques, de nouvelles méthodes de communication apparaissent. Ainsi, avec l’invention de la radio, nous pouvons établir une station écoutable dans tout [AFG.GetNonIdeologyName] ! Cela nous aidera à diffuser nos vues politiques et nos informations !"
 AFG_export_based_economy:0 "Économie basée sur l’exportation"
AFG_export_based_economy_desc:0 "Bien que [AFG.GetNonIdeologyName] ne possède pas beaucoup de ressources, nous disposons de grands excédents de matériel mécanique et d'autres biens fabriqués en usine. Ces excédents devraient bien sûr être exportés pour générer un profit. Pour développer notre économie, nous devons encourager l'exportation de nos produits !"
AFG_subvert_soviet_influence_focus:0 "Saper l'influence [SOV.GetAdjective]"
AFG_subvert_soviet_influence_focus_desc:0 "Nous ne pouvons pas permettre aux [SOV.GetAdjective] d'influencer [AFG.GetNonIdeologyName], car cela pourrait s'avérer fatal pour notre gouvernement et notre nation. [AFG.GetNonIdeologyName] doit rester une nation souveraine avec sa propre politique étrangère indépendante. Nous serons les maîtres de notre propre destin !"
AFG_army_reform:0 "Mobiliser l'Armée"
AFG_army_reform_desc:0 "Afin de dissuader toute puissance étrangère d'envahir [AFG.GetNonIdeologyName], nous devons mobiliser nos forces armées et améliorer la préparation de notre armée pour les guerres éventuelles."
AFG_the_non_aligned_movement:0 "Le Mouvement des Non-Alignés"
AFG_the_non_aligned_movement_desc:0 "De nombreuses nations dans le monde se tiennent seules, sans alliés, non-alignées et neutres, pourrait-on dire. Nous devons créer une communauté pour les nations non-alignées du monde et ainsi nous protéger mutuellement pendant ces périodes difficiles ! Pour la paix et la prospérité !"
AFG_turkish_subsidized_factories:0 "Usines subventionnées [TUR.GetAdjective]"
AFG_turkish_subsidized_factories_desc:0 "Avec la poursuite de notre politique de coopération accrue au Moyen-Orient, nous devrions inviter des investisseurs et hommes d'affaires [TUR.GetAdjective] à subventionner des usines en [AFG.GetNonIdeologyName]. Cela augmenterait considérablement la coopération économique entre [AFG.GetNonIdeologyName] et [TUR.GetNameDef] !"
AFG_ally_with_the_young_afghans:0 "S'allier aux Jeunes Afghans"
AFG_ally_with_the_young_afghans_desc:0 "Les Jeunes Afghans sont un groupe politique au sein de [AFG.GetNonIdeologyName] et ils sont la force motrice pour la poursuite de l'occidentalisation et de la modernisation de [AFG.GetNonIdeologyName] ! Le roi Amanullah a entretenu des liens étroits avec cette organisation depuis son couronnement. Cependant, depuis la guerre civile de 1929, ces relations se sont tendues. Nous devons travailler à les rétablir !"
AFG_secular_education:0 "Introduire l'éducation laïque"
AFG_secular_education_desc:0 "Il est important de séparer religion et éducation, car ces deux éléments se sont révélés être un mélange dangereux lorsqu'ils sont combinés. Pour améliorer l'éducation de notre population, nous devons retirer l'Islam de toutes les salles de classe à travers [AFG.GetNonIdeologyName] !"
AFG_the_hazara_question:0 "La Question Hazara"
AFG_the_hazara_question_desc:0 "Les différences religieuses au sein de [AFG.GetNonIdeologyName] existent encore. Les Hazaras sont un groupe de personnes habitant [1009.GetName] et sont principalement chiites. Pour éviter les conflits internes, nous devons unir les communautés chiites et sunnites de [AFG.GetNonIdeologyName]. Aucune croyance en Islam n'est inférieure !"
AFG_implement_autarky_daoud:0 "Mettre en œuvre l'autarcie"
AFG_implement_autarky_daoud_desc:0 "Nous devons mettre en œuvre l'autarcie afin d'atteindre l'autosuffisance économique et de réduire notre dépendance aux ressources externes. En favorisant les industries locales et en priorisant la production nationale, nous cherchons à renforcer la résilience de notre nation face aux incertitudes économiques mondiales."
AFG_the_kabul_pact:0 "Le Pacte de Kaboul"
AFG_the_kabul_pact_desc:0 "Aujourd'hui, nous allons atteindre l'objectif ultime d'unifier le Moyen-Orient sous une seule bannière, un objectif commun ! En signant le Pacte de Kaboul avec la Turquie, l'Irak et l'Iran, nous comblerons les écarts existants qui nous divisent et redeviendrons une force majeure dans la politique régionale !"
AFG_self_determination_for_pakistan:0 "Autodétermination pour [442.GetName]"
AFG_self_determination_for_pakistan_desc:0 "Les plaines fertiles et les montagnes imposantes de [PAK.GetNonIdeologyName] ont été habitées par les Pachtouns depuis des millénaires. Ainsi, il est de notre devoir absolu d'essayer d'incorporer ces terres. Peut-être en demandant un référendum à [442.GetName] aux [GetRajAdjective], pourrions-nous y parvenir !"
AFG_continue_railway_development:0 "Poursuivre le développement ferroviaire"
AFG_continue_railway_development_desc:0 "Le réseau ferroviaire [AFG.GetAdjective] est pratiquement inexistant, seules quelques lignes mineures existent en [AFG.GetNonIdeologyName] et sont mal entretenues. Nous devons poursuivre nos plans pour connecter la nation ! Plus notre peuple est connecté, moins il y a de divisions !"
AFG_attaturks_legacy:0 "Honorer l'héritage d'Atatürk"
AFG_attaturks_legacy_desc:0 "Le défunt Mustafa Kemal Atatürk, révolutionnaire, général et Père de la Turquie. Il a fait beaucoup et sacrifié pour sa nation. Amanullah ne peut qu'aspirer à accomplir pour [AFG.GetNonIdeologyName] ce qu'Atatürk a déjà accompli pour la Turquie ! Amanullah poursuivra son héritage !"
AFG_deal_with_the_devil:0 "Faire un pacte avec le diable"
AFG_deal_with_the_devil_desc:0 "Parfois, pour atteindre ses objectifs, il faut faire un pacte avec le diable. Pour reconquérir nos terres perdues en [PAK.GetNonIdeologyName] et rendre [AFG.GetNonIdeologyName] grande à nouveau, nous devons nous allier à l'ennemi de notre ennemi. Après tout, l'ennemi de mon ennemi est mon ami, non ?"
AFG_maintain_neutrality_r56:0 "Maintenir la neutralité"
AFG_maintain_neutrality_r56_desc:0 "[AFG.GetNonIdeologyName] est neutre depuis la guerre de 1919 lorsqu'elle a obtenu son indépendance après un conflit brutal et sanglant contre le plus grand et le plus avancé Empire de l'époque, l'Empire britannique. Si ça ne fonctionne pas, ne changez rien."
AFG_form_the_afghan_red_crescent:0 "Former le Croissant-Rouge [AFG.GetAdjective]"
AFG_form_the_afghan_red_crescent_desc:0 "En ces temps difficiles, nous devons rester humains et aider. Aider le peuple de [AFG.GetNonIdeologyName] qui a besoin d'un toit ou de soins médicaux. Nous devons établir la Société du Croissant-Rouge [AFG.GetAdjective] ! Per humanitatem ad pacem !"
AFG_reclaim_our_land:0 "Reprendre nos terres"
AFG_reclaim_our_land_desc:0 "Les plaines fertiles et les montagnes imposantes de [PAK.GetNonIdeologyName] ont été habitées par les Pachtouns depuis des millénaires. Ainsi, il est de notre devoir absolu d'incorporer ces territoires majoritairement pachtouns à [AFG.GetNonIdeologyName] afin de protéger notre peuple du traitement horrible et du colonialisme qu'il subit depuis des siècles !"
AFG_greater_afghanistan:0 "Grand Afghanistan"
AFG_greater_afghanistan_desc:0 "Enfin, le rêve d'une terre unie pour tous les [AFG.GetAdjective]s a été réalisé. Ce sont nos terres et il est temps de faire savoir au monde que nous nous battrons et mourrons pour elles. Gloire à l'Afghanistan !"

 ######## FASCIST FOCUSES ########

AFG_contact_faqir:0 "Héritage de la rébellion de Khost"  
AFG_contact_faqir_desc:0 "Durant les deux dernières décennies d’indépendance [AFG.GetAdjective] vis-à-vis des [ENG.GetAdjective], [AFG.GetNonIdeologyName] a fait face à de nombreuses rébellions, soulèvements et coups d’État, dont la rébellion de Khost en 1924 contre les réformes radicales du roi Amanullah. Bien que la rébellion ait été écrasée à l’époque, son esprit perdure."  
AFG_waaidu:0 "Wa'aidu !"  
AFG_waaidu_desc:0 "Wa'aidu est une citation du Coran qui, traduite simplement, signifie 'Soyez prêts'. Nous avons attendu ce moment assez longtemps, et il est enfin arrivé : le peuple [AFG.GetAdjective] se lèvera contre la dictature imposée par les tyrans de Kaboul, et le roi ne régnera plus ! Allahu Akbar !"  
AFG_contact_tribes:0 "Assurer le soutien des tribus"  
AFG_contact_tribes_desc:0 "Les tribus isolées, qui n’ont aucune inquiétude politique ni connaissance de la politique (celle-ci étant principalement centrée sur Kaboul), sont prêtes à suivre notre lutte, avec les promesses de richesse, le retour de la charia et l’inversion des réformes radicales menées par la régence."  
AFG_invite_jamaat_islami:0 "Contacter Abul A'la al-Maududi"  
AFG_invite_jamaat_islami_desc:0 "Abul A'la al-Maududi est un théologien et érudit islamique très connu au [PAK.GetNonIdeologyName], il pourrait s’avérer très utile dans notre lutte pour mobiliser le peuple et légitimer notre djihad contre le roi et son gouvernement."  
AFG_maududi_as_sheikhulislam:0 "La guidance du Jamiat"  
AFG_maududi_as_sheikhulislam_desc:0 "Si ce n’était pour Abul A'la al-Maududi, l’étincelle de la rébellion ne se serait pas allumée et le peuple de [AFG.GetNonIdeologyName] aurait vécu éternellement sous un régime tyrannique. Ses formidables compétences organisationnelles nous ont tous rassemblés pour défendre nos croyances et traditions ! Il doit être proclamé Sheikh !"  
AFG_mirzali_as_emir:0 "L’Émir d’or"  
AFG_mirzali_as_emir_desc:0 "Haji Mirzali Khan a prouvé sa loyauté envers le peuple de [AFG.GetNonIdeologyName], combattant courageusement sur le champ de bataille contre nos ennemis. Pour cela, il est loué et vénéré par beaucoup dans nos rangs ! La seule manière de le récompenser pour ce qu’il a fait pour notre cause est de le proclamer Émir de l’Émirat islamique de [AFG.GetNonIdeologyName] !"  
AFG_widen_perspective_of_religion:0 "Élargir la perspective de la religion"  
AFG_widen_perspective_of_religion_desc:0 "Dans son dernier sermon, le Prophète a déclaré qu’aucun être humain n’est supérieur à un autre sauf par la foi. La population chiite Hazara élève la bannière de l’unicité de Dieu tout comme nous, et nous devons donc dépasser nos différences et leur accorder les mêmes droits et opportunités, notamment dans le service militaire."  
AFG_persecute_hazaras:0 "Exclure les Hazaras du service militaire"  
AFG_persecute_hazaras_desc:0 "La population chiite Hazara est très peu fiable, ayant trahi notre État à plusieurs reprises. Elle est plus sectaire que notre propre foi en Islam, il serait donc prudent de ne pas les employer dans le service militaire afin d’éviter des désastres moraux et des problèmes politiques futurs."  
AFG_the_constitution_question:0 "Rédiger une constitution islamique"  
AFG_the_constitution_question_desc:0 "Une constitution peut sembler confuse pour certains, étant donné que nos enseignements islamiques prônent la charia. Cependant, une constitution ou toute forme de loi est nécessaire pour préserver l’ordre et les droits des citoyens. La charia restera néanmoins la loi suprême de [AFG.GetNameDefCap]."  
AFG_tulaia_mutaharrika:0 "Les pas de Tulaia Mutaharrika"  
AFG_tulaia_mutaharrika_desc:0 "Les Tulaia Mutaharrika, ou 'Garde mobile' en arabe, étaient des unités d’élite des premiers califats Rashidun. Pour propager la vertu et le culte de combattre pour Dieu, nous lancerons le recrutement et la formation de ces élites."  
AFG_mix_sciences_with_religion:0 "Mélanger éducation religieuse et scientifique"  
AFG_mix_sciences_with_religion_desc:0 "Suivant l’exemple de théologiens comme Hassan al-Banna, Said Nursi et Shakib Arslan, qui prônent un curriculum mêlant religion et sciences, nous mettrons en œuvre ces idées et éliminerons la division madrasah-école, bien que cela puisse être difficile si nous avons déjà accordé le contrôle éducatif à des oulémas plus conservateurs."  
AFG_international_mujahideen:0 "Moudjahidines internationaux"  
AFG_international_mujahideen_desc:0 "Pour accroître l’influence afghane dans la région, nous enverrons nos moudjahidines à l’étranger pour soutenir nos frères dans d’autres parties du monde !"  
AFG_you_cannot_kill_a_believer:0 "Renforcer le fanatisme religieux"  
AFG_you_cannot_kill_a_believer_desc:0 "Pour augmenter notre influence et notre emprise sur l’armée, ainsi que pour maintenir bravoure et moral, nous lancerons des campagnes d’encouragement et d’endoctrinement de nos troupes jusqu’à ce qu’elles n’aient plus peur du champ de bataille !"  
AFG_utilize_the_sufis:0 "Utiliser les soufis"  
AFG_utilize_the_sufis_desc:0 ""  
AFG_tunganistan:0 "Libérer les musulmans de l’Est"
AFG_tunganistan_desc:0 "Pendant de nombreuses années, le peuple Ouïghour a souffert sous le régime [CHI.GetAdjective], mais cela ne sera plus le cas ! Nous devons libérer nos frères de leurs oppresseurs. Nous devons aider ceux qui sont dans le besoin, et nous serons aidés en retour."
AFG_request_german_reinforcements:0 "Demander un soutien militaire [GER.GetAdjective]"
AFG_request_german_reinforcements_desc:0 "L'armée [AFG.GetAdjective] ne peut pas se qualifier de moderne, et encore moins de forte ; elle se compose en grande partie de mercenaires tribaux et de guerriers non entraînés et mal équipés. Cependant, il semble que les [GER.Adjective] pourraient être disposés à nous aider à améliorer notre armée. Peut-être devrions-nous demander leur soutien ?"
AFG_seize_royal_assets:0 "Saisir les biens royaux"
AFG_seize_royal_assets_desc:0 "Après avoir fui lâchement le pays, le roi a laissé une grande partie de ses possessions privées et de ses actifs en [AFG.GetNonIdeologyName]. Nous devrions saisir ces biens et les redistribuer, car le roi n’en a clairement plus besoin."
AFG_kabul_military_college:0 "Ouvrir le Collège militaire de Kābul"
AFG_kabul_military_college_desc:0 "Le personnel militaire [AFG.GetAdjective] est inexpérimenté, beaucoup sont peu instruits et ne comprennent même pas les notions de base de la guerre. Nous devons ouvrir un collège militaire afin d'éduquer et d'améliorer notre personnel militaire."
AFG_german_equipment:0 "Acheter du matériel [GER.GetAdjective]"
AFG_german_equipment_desc:0 "L'industrie militaire de [AFG.GetNonIdeologyName] est largement sous-développée et ne peut pas répondre aux besoins des forces armées [AFG.GetAdjective]. Ainsi, [AFG.GetNonIdeologyName] est obligé d’acheter du matériel militaire à l’étranger. Nous pourrions conclure un lucratif contrat d’armement avec les [GER.GetAdjective]."
AFG_support_the_palestinians:0 "Soutenir les Palestiniens"
AFG_support_the_palestinians_desc:0 ""
AFG_invite_amin_al_husseini:0 "Inviter Amin al-Husseini"
AFG_invite_amin_al_husseini_desc:0 "Le Grand Mufti de Jérusalem a déjà visité [AFG.GetNonIdeologyName] à plusieurs reprises. Nous pouvons l’inviter une fois de plus, cette fois pour qu’il reste en [AFG.GetNonIdeologyName], dirige la Résistance [PAL.GetAdjective] depuis [AFG.GetNonIdeologyName] et peut-être aider le gouvernement [AFG.GetAdjective]."
AFG_approach_mubashir:0 "Approcher Mubashir al-Tarazi"
AFG_approach_mubashir_desc:0 "Après avoir été exilé du Kazakhstan en avril 1930, Mubashir al-Tarazi a trouvé refuge en [AFG.GetNonIdeologyName] où il pouvait continuer sa résistance contre les [SOV.GetAdjective]. Il a reçu de hautes fonctions sous le règne de Nadir Shah et était très respecté. Il est crucial de gagner son soutien."
AFG_form_the_turkestan_legion_r56:0 "Former la Légion du Turkestan"
AFG_form_the_turkestan_legion_r56_desc:0 "Les peuples turcs d’Asie centrale sont opprimés par les [SOV.GetAdjective] depuis la Révolution d’octobre. Leur droit de croire et de pratiquer l’islam leur a été retiré. Nous devons raviver l’esprit rebelle de ces peuples !"
AFG_nationalize_spiznar:0 "Nationaliser l’industrie du coton"
AFG_nationalize_spiznar_desc:0 "La Sherkat-e Ettehadiya-ye Velayat-e Shomal emploie plus de 12 000 personnes. En mettant l’usine entre les mains du gouvernement, nous bénéficierions de nombreux avantages, tout comme le peuple [AFG.GetAdjective]."
AFG_cooperate_with_hazaras:0 "Coopérer avec les Hazaras"
AFG_cooperate_with_hazaras_desc:0 "Des différences religieuses existent encore en [AFG.GetNonIdeologyName]. Les Hazaras habitent [1009.GetName] et sont principalement chiites. Pour éviter des conflits internes, nous devons unir les communautés chiites et sunnites de [AFG.GetNonIdeologyName]. Aucune croyance en islam n’est inférieure !"
AFG_form_muslim_youth:0 "Créer la Jeunesse musulmane"
AFG_form_muslim_youth_desc:0 "Pour répandre l’islam, nous devons planter les graines de cette foi dans l’esprit des jeunes. Former une section jeunesse serait très efficace et utile pour cela."
AFG_eradicate_communism:0 "Éradiquer le communisme"
AFG_eradicate_communism_desc:0 "Le communisme est-il vraiment la racine de tout mal ? Nous ne savons pas, mais il vaut mieux ne pas le découvrir à nos dépens. Après tout, l’homme craint ce qu’il ne comprend pas. Il est donc préférable d’éradiquer cette doctrine maléfique, pour le bien de l’humanité, n’est-ce pas ?"
AFG_revive_the_basmachi_movement:0 "Relancer le mouvement Basmachi"
AFG_revive_the_basmachi_movement_desc:0 "Les peuples turcs d’Asie centrale sont opprimés par les [SOV.GetAdjective] depuis la Révolution d’octobre. Leur droit de croire et de pratiquer l’islam leur a été retiré. Nous devons raviver l’esprit rebelle de ces peuples ! Levez-vous frères !"
AFG_end_the_revolution:0 "Mettre fin à la Révolution"
AFG_end_the_revolution_desc:0 "Le communisme est une idéologie maléfique qui ne cause que mort et destruction partout où elle s’installe, ou du moins le pensons-nous. Il est de notre devoir de mettre fin au communisme une bonne fois pour toutes et de prévenir toute souffrance future sous son couvert. Nous devons frapper la menace [SOV.GetAdjective] au nord !"
AFG_the_fate_of_imperialism:0 "Le destin de l’impérialisme"
AFG_the_fate_of_imperialism_desc:0 "Au cours du siècle passé, [AFG.GetNonIdeologyName] a été abusé et envahi par les impérialistes à [ENG.Capital.GetCapitalVictoryPointName] et [SOV.Capital.GetCapitalVictoryPointName] à de nombreuses reprises. Nous ne nous agenouillerons plus devant ces puissances impérialistes. Le temps de la revanche est venu !"
AFG_proclaim_pashtunistan:0 "Promouvoir le Pashtunisme"
AFG_proclaim_pashtunistan_desc:0 "Enfin, le rêve d’une terre unie pour tous les Pachtouns est réalisé. Ce sont nos terres et il est temps de montrer au monde que nous sommes prêts à combattre et mourir pour elles. Gloire au Pashtunistan !"
AFG_pillars_of_islam:0 "Les Piliers de l’Islam"
AFG_pillars_of_islam_desc:0 "Nous devons nous concentrer sur le cœur de notre religion et ce qui nous différencie des autres. Pour construire une maison, il faut une base solide. Il en va de même pour l’Islam."
AFG_enforce_the_pashtunwali_r56:0 "Faire respecter le Pashtunwali"
AFG_enforce_the_pashtunwali_r56_desc:0 "Le Pashtunwali est un code de vie complet des Pachtouns. Il est proche de l’islam en prônant la justice et le courage, ainsi que d’autres valeurs importantes de la culture pachtoune. Pour maintenir l’ordre public, nous devons faire respecter ces valeurs."
AFG_islamic_cooperation:0 "Améliorer la coopération islamique"
AFG_islamic_cooperation_desc:0 "Divisés nous sommes faibles, unis nous sommes forts. Pour que l’islam prospère, nous devons améliorer la coopération économique entre nos alliés en augmentant le commerce et les investissements."
AFG_the_ten_lost_tribes:0 "Vengeance des Dix Tribus Perdues"
AFG_the_ten_lost_tribes_desc:0 "Les origines du peuple pachtoune sont inconnues ; certains pensent qu’ils descendent des Huns, d’autres des Pactyans. Cependant, une légende persiste depuis des siècles : les Pachtouns descendent des Dix Tribus Perdues d’Israël. Si tel est le cas, nous avons droit à la terre d’Israël comme patrie."
AFG_return_of_the_king:0 "Le retour du roi"
AFG_return_of_the_king_desc:0 "Le roi Amanullah a été exilé depuis la guerre civile Saqqawiste de 1929. Il est temps de le réinviter en [AFG.GetNonIdeologyName], en espérant qu’il ait tiré des leçons."
AFG_peace_through_islam:0 "L’Islam en une seule nation"
AFG_peace_through_islam_desc:0 "Il n’y a pas d’autre chemin vers la paix mondiale que l’unification complète de tous sous l’Islam. Ce n’est qu’à travers Allah que nous pouvons atteindre paix et prospérité pour l’humanité."
AFG_approach_pakistani_resistance:0 "Approcher la Résistance [PAK.GetAdjective]"
AFG_approach_pakistani_resistance_desc:0 "Nos frères musulmans du sud sont encore sous occupation impérialiste ! Nous devons traverser la ligne Durand et les libérer de leurs chaînes. Frères, levez-vous !"
AFG_global_islamic_revolution:0 "Continuer la Troisième Campagne du Waziristan"
AFG_global_islamic_revolution_desc:0 "Le djihad contre les impérialistes est le seul chemin pour unir nos peuples. De nombreuses batailles ont eu lieu et d’autres restent à mener jusqu’à ce que tous les Pachtouns soient à nouveau unis. Aujourd’hui nous combattons et donnons nos vies en Son nom, demain nous prospérerons."
AFG_german_junker_purchase:0 "Acheter des Junkers [GER.GetAdjective]"
AFG_german_junker_purchase_desc:0 "L’armée de l’air [AFG.GetAdjective] est pratiquement inexistante ; pour l’améliorer, nous devons acheter des avions étrangers, peut-être que les [GER.GetAdjective] peuvent nous aider. Après tout, [AFG.GetNonIdeologyName] possède déjà de nombreux techniciens et pilotes [GER.GetAdjective]."
AFG_bury_the_hatchet:0 "Enterrer la hache de guerre"
AFG_bury_the_hatchet_desc:0 "Des différences religieuses existent encore dans l’islam. Les Perses sont principalement chiites. Pour éviter les conflits internes, nous devons unir les communautés chiites et sunnites de Perse et de [AFG.GetNonIdeologyName]. Aucune croyance en islam n’est inférieure !"
AFG_in_alexanders_footsteps:0 "Suivre les pas d’Alexandre"
AFG_in_alexanders_footsteps_desc:0 "Il y a près de deux millénaires, Alexandre le Grand a traversé ces terres avec ses phalanges. En marchant sur ces terres, il les a conquises et son héritage a profondément marqué notre culture et notre histoire."
AFG_break_the_six_arrows:0 "Briser les six flèches du kémalisme"
AFG_break_the_six_arrows_desc:0 "Le sécularisme est un affront à la Terre. La séparation du gouvernement et de l’Islam est ridicule et méprisable. Nous devons éradiquer cette idéologie comme on arrache les mauvaises herbes d’un jardin !"

