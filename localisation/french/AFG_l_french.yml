AFG_reinstall_the_king:0 "Réinstaller le Roi [AFG.GetAdjective]"
AFG_invite_fakhri_pasha:0 "Inviter Fakhri Pasha"
AFG_imprison_political_opponents:0 "Emprisonner les Opposants Politiques"
AFG_rescind_the_turkish_afghan_defense_treaty:0 "Résilier le Traité de Défense [TUR.GetAdjective]-[AFG.GetAdjective]"

AFG_for_what_was_taken_from_us:0 "Pour Ce Qui Nous a Été Pris…"
AFG_for_what_was_taken_from_us_desc:0 "Les liens culturels, religieux et traditionnels que le peuple de la fertile plaine de l'Indus partage avec [AFG.GetNonIdeologyName] sont indéniables, et ne représentent que le fruit d’un lien séculaire créé entre ces terres. Les seules choses qui séparent réellement nos peuples sont des lignes imaginaires sur des cartes imaginaires..."
AFG_reintegrate_peshawar:0 "Réintégrer [442.GetName]"
AFG_restore_pashtun_rule_in_quetta:0 "Restaurer la Domination Pachtoune à [445.GetName]"
AFG_cooperate_with_the_balochis:0 "Coopérer avec les Séparatistes Balochis"
AFG_pashtunize_karachi:0 "Pachtouniser [1093.GetName]"
