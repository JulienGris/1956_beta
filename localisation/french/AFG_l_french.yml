# ÉCOLES RURALES #
AFG_rural_schools_category:0 "Construire des Écoles Rurales"
AFG_rural_schools_category_desc:0 "Les régions rurales, déconnectées de Kābul et de l'administration centrale de [AFG.GetNonIdeologyName], sont les principales contributrices au problème d'analphabétisme auquel [AFG.GetNonIdeologyName] fait face. Nous devons améliorer nos méthodes d'éducation rurale et leur accessibilité."
AFG_illiteracy_decrease_75:0 "La décision §YConstruire des Écoles Rurales§! coûte en pouvoir politique §Yréduit§! de §Y30%§! et le §Ytemps§! nécessaire pour §Yterminer§! la décision est §Yréduit§! à §Y75§! jours."
AFG_illiteracy_decrease_50:0 "La décision §YConstruire des Écoles Rurales§! coûte en pouvoir politique §Yréduit§! de §Y60%§! et le §Ytemps§! nécessaire pour §Yterminer§! la décision est §Yréduit§! à §Y60§! jours."
AFG_open_schools:0 "Construire des Écoles Rurales à [FROM.GetName]"

# INFILTRER LE PAKISTAN #
AFG_inflitrate_pakistan_category:0 "Résistance Pachtoune en [PAK.GetNonIdeologyName]"
AFG_inflitrate_pakistan_category_desc:0 "Les plaines luxuriantes et les montagnes escarpées de [PAK.GetNonIdeologyName] ont été le berceau de la civilisation pachtoune. La culture et le mode de vie pachtoune ont émergé de cette région il y a plusieurs milliers d'années ! Cependant, jusqu'à ce jour, notre peuple souffre sous le joug des puissances étrangères. Mais ne vous inquiétez pas, notre heure est enfin venue !"
AFG_declare_war:0 "[GetWarName]"

# INTÉGRER LE TADJIKISTAN #
AFG_tajikistan_category:0 "Incorporation du Tadjikistan"
AFG_tajikistan_category_desc:0 "Les tribus tadjikes et pachtounes coexistent depuis des siècles à l'intérieur et à l'extérieur des frontières de [AFG.GetNonIdeologyName], mais avec l'intégration récente de la RSS tadjike dans [AFG.GetNameDefCap], l'équilibre régional et la stabilité ont été quelque peu perturbés, entraînant une montée lente mais certaine du nationalisme et du séparatisme tadjik. En accordant certaines concessions aux Tadjiks, nous pourrions gagner leur faveur, contrairement au régime précédent à [SOV.Capital.GetCapitalVictoryPointName]."
AFG_build_housing_districts:0 "Étendre l'Industrie de Construction de [742.GetCapitalVictoryPointName]"
AFG_implement_tajik_language:0 "Institutionnaliser la Langue Tadjike"
AFG_agricultural_concessions:0 "Accorder des Concessions Agricoles aux Tadjiks"
AFG_integrate_tajikistan_decision:0 "Intégrer la RSS tadjike"
AFG_create_tajikistan_brigade_tt:0 "Créer une §YBrigade Populaire de Tojikiston§! à §Y[742.GetName]§!."

# SABOTER MOSCOU #
AFG_prepare_soviet_war:0 "Infiltrer le Territoire [SOV.GetAdjective]"
AFG_prepare_soviet_war_desc:0 "Avec le temps, un grand vide, tant économique que politique, s'ouvre entre [AFG.Capital.GetCapitalVictoryPointName] et [SOV.Capital.GetCapitalVictoryPointName]... Il semble qu'une rébellion se prépare, non seulement à l'intérieur des frontières de [AFG.GetNonIdeologyName], mais dans toute l'Asie centrale [SOV.GetAdjective], et il est certain que [AFG.Capital.GetCapitalVictoryPointName] en est à l'origine, soutenant les Basmachis anti-bolcheviques."
AFG_infiltrate_soviet_factories:0 "Infiltrer les Usines [SOV.GetAdjective]"
AFG_infiltrate_soviet_garissons:0 "Infiltrer les Garnisons [SOV.GetAdjective]"

# SOCIALISME PERSAN #
AFG_persian_socialism_decision_category:0 "Renaissance du Mouvement de la Jungle"
AFG_persian_socialism_decision_category_desc:0 "Dans les années 1920, un mouvement communiste en Perse appelé « Mouvement de la Jungle » était dirigé par Mirza Kuchik Ali et une RSS perse à Gilan fut formée. Bien qu'il s'agisse d'un État non reconnu, cela représentait une réussite pour l'époque. Nous devons raviver cet esprit révolutionnaire qui subsiste encore en Perse !"
AFG_propaganda_campaigns:0 "Campagnes de Propagande Socialiste [PER.GetAdjective]"
AFG_support_armed_resistance:0 "Soutenir les Combattants de la Résistance [PER.GetAdjective]"
AFG_organize_protests:0 "Organiser un Rassemblement à [FROM.GetName]"
AFG_coalition_with_democrats:0 "Coalition avec le [PER.GetDemocraticParty]"
AFG_march_on_tehran:0 "La Marche sur [266.GetName]"
AFG_ally_the_persian_uprising:0 "Allié aux Socialistes [PER.GetAdjective]"

# GUERRE CIVILE AFGHANE #
AFG_civil_war:0 "Deuxième Guerre Civile [AFG.GetAdjective]"
AFG_civil_war_desc:0 "Nos moudjahidines se sont à nouveau levés contre la tyrannie, cette fois en coopération avec les nombreuses tribus de [AFG.GetNonIdeologyName] et le Jamiat-e Islami clandestin. Haji Mizrali Khan nous a rassemblés contre le gouvernement, à savoir le Roi et sa Régence. Nous devons poursuivre notre lutte, de manière juste, mais il nous faut identifier certaines zones à attaquer."
AFG_plan_state_offensive:0 "Préparer l'Offensive de [FROM.GetName]"
AFG_handle_the_crisis_decision_category:0 "Apaiser les Troubles Publics"

# RÉSISTANCE PAKISTANAISE #
AFG_rebellion_in_pakistan_decision_category:0 "Résistance [PAK.GetAdjective]"
AFG_rebellion_in_pakistan_decision_category_desc:0 "La domination de l'homme sur l'homme est la cause de tout pouvoir corrompu. Ces paroles sages ont été prononcées par nul autre que Syed Abul A'la al-Maududi, l'un des plus grands penseurs islamiques de tous les temps. La domination des tyrans [GetRajAdjective] sur les [PAK.GetAdjective]s et les Pachtounes doit cesser une bonne fois pour toutes !"
AFG_infiltrate_nwfp:0 "Soutenir la Résistance [GetCorrectAdjective] à [FROM.GetName]"

# LA CONFÉRENCE DE PESHAWAR #
AFG_north_frontier_province:0 "Référendum de [442.GetName]"
AFG_north_frontier_province_desc:0 "Les terres de [442.GetName], connues de leurs habitants sous le nom de Khyber Pakhtunkhwa, ce qui signifie 'Terre des Pachtounes', ont été un champ de bataille pendant des centaines d'années. Cette fois, la bataille se jouera sur la scène politique."
