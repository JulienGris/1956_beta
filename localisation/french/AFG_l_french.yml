AFG_electrify_kabulistan:0 "Électrifier [267.GetName]"
AFG_improve_helmand_irrigation:0 "Étendre le Réseau d'Irrigation de l'Helmand"
AFG_develop_faryab:0 "Exploiter les Champs de Pétrole de [1008.GetName]"
AFG_develop_bamyan:0 "Développer les Mines d'Acier de [1009.GetName]"
AFG_develop_kabul:0 "Exploiter les Gisements de Chrome de [267.GetName]"
