# MOUVEMENT BASMACHI #
AFG_revive_basmachi_decision_category:0 "Le Mouvement Basmachi"
AFG_revive_basmachi_decision_category_desc:0 "Les peuples de l'Asie centrale [SOV.GetAdjective] ont été opprimés par le régime pendant trop longtemps. Leur culture, leur religion et leur mode de vie même ont été menacés par les [SOV.GetAdjective] ! Il est temps de se lever contre les oppresseurs ! Pour votre pays ! Pour votre foi ! Pour votre liberté !"
AFG_support_basmachi_resistance:0 "Soutenir la Résistance Basmachi dans [FROM.GetName]"
AFG_raid_soviet_factories:0 "Organiser des Sabotages d'Usines dans [FROM.GetName]"
