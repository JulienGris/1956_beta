 AFG_afghan_army:0 "[GetAfghanArmyFocusName]"
 AFG_afghan_army_desc:0 "La glorieuse [GetAfghanArmyFocusName] peut être fière d'avoir réussi à atteindre un niveau de renommée profonde à travers le monde, étant particulièrement difficile à battre, et constituant l'un des ennemis, sinon le plus dangereux, que l'on puisse affronter sur le champ de bataille, sans parler de combattre les [AFG.GetAdjective] sur leur propre territoire. En temps de paix, la [GetAfghanArmyFocusName] maintient environ 70 à 80 mille hommes disponibles à tout moment et entièrement préparés pour la guerre. Cependant, notre armée dépend fortement de l'équipement étranger, avec des nations comme [ENG.GetNonIdeologyName], [SOV.GetNonIdeologyName] et [GER.GetNonIdeologyName] servant de sources vitales d'équipement moderne et de technologie militaire.\n\nEn [AFG.GetNonIdeologyName], les jours sont longs, les montagnes sont hautes, et les batailles sont dures."

