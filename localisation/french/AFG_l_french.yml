 AFG_bank_millie_afghan:0 "Bânk-e Millie Afghân"
 AFG_bank_millie_afghan_desc:0 "La Bânk-e Millie Afghân fut fondée en 1932 comme société par actions, avec une large part de ses actions détenues par le gouvernement. Elle est dirigée par l'un des plus grands économistes afghans, Abdul Majid Zabuli, également sympathisant d'Adolf Hitler. La banque a fonctionné comme banque nationale de [AFG.GetNonIdeologyName] pendant quatre ans, maintenant son monopole sur le commerce gouvernemental. Grâce à sa coopération étroite avec le gouvernement, ses investissements dans les secteurs privé et public, et un monopole virtuel sur toute l'industrie et le commerce d'import-export au sein de [AFG.GetNonIdeologyName], la banque a généré d'énormes profits pour environ deux mille actionnaires, ainsi que pour le gouvernement."
 AFG_decentralized_economy:0 "Économie négligée"
 AFG_decentralized_economy_desc:0 "L'économie de [AFG.GetNonIdeologyName] reste largement sous-développée, dépendant fortement du commerce de matières premières telles que le coton, le karakul, le tabac et l'opium, qui joue un rôle significatif dans l'économie [AFG.GetAdjective]. Malgré sa position géographique cruciale comme carrefour entre l'Europe et l'Asie, [AFG.GetNonIdeologyName] n'a pas réussi à capitaliser pleinement sur sa situation stratégique, entravée par l'isolement et une structure économique rudimentaire."
 AFG_decentralized_economy_1:0 "Économie négligée"
 AFG_decentralized_economy_1_desc:0 "L'économie de [AFG.GetNonIdeologyName] reste largement sous-développée, dépendant fortement du commerce de matières premières telles que le coton, le karakul, le tabac et l'opium, qui joue un rôle significatif dans l'économie [AFG.GetAdjective]. Malgré sa position géographique cruciale comme carrefour entre l'Europe et l'Asie, [AFG.GetNonIdeologyName] n'a pas réussi à capitaliser pleinement sur sa situation stratégique, entravée par l'isolement et une structure économique rudimentaire."
 AFG_decentralized_economy_2:0 "Économie négligée"
 AFG_decentralized_economy_2_desc:0 "L'économie de [AFG.GetNonIdeologyName] reste largement sous-développée, dépendant fortement du commerce de matières premières telles que le coton, le karakul, le tabac et l'opium, qui joue un rôle significatif dans l'économie [AFG.GetAdjective]. Malgré sa position géographique cruciale comme carrefour entre l'Europe et l'Asie, [AFG.GetNonIdeologyName] n'a pas réussi à capitaliser pleinement sur sa situation stratégique, entravée par l'isolement et une structure économique rudimentaire."
 AFG_decentralized_economy_3:0 "Boom économique"
 AFG_decentralized_economy_3_desc:0 "En seulement quelques courtes années, [AFG.GetNonIdeologyName] s'est transformée d'un territoire sous-développé en une nation en modernisation rapide et prospère. Cette réalisation remarquable constitue une preuve indéniable que le progrès, autrefois considéré comme impossible, est maintenant à notre portée !"
 AFG_bank:0 "Da [AFG.GetNonIdeologyName] Bank"
 AFG_bank_improved:0 "Da [AFG.GetNonIdeologyName] Bank"

 AFG_illiteracy:0 "Analphabétisme généralisé"
 AFG_illiteracy_desc:0 "La population [AFG.GetAdjective] souffre d'un analphabétisme généralisé, avec moins de dix pour cent capable de lire ou d'écrire, largement dû à la mauvaise qualité de vie et à la mauvaise gestion du système éducatif. Cette grave pénurie de personnel qualifié a laissé les postes supérieurs et les rôles gouvernementaux soit vacants, soit occupés par des étrangers tels que les Turcs et les Allemands. Même l'université de Kābul nouvellement ouverte, établie en 1931, a fait face à des retards dans l'admission d'étudiants en raison d'un manque de personnel qualifié."
