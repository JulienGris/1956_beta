# ACHAT D'AVIONS ÉTRANGERS #
AFG_foreign_aircraft_category:0 "Achat d'Avions Étrangers"
AFG_foreign_aircraft_category_desc:0 "Après la brutale guerre civile afghane de 1929, la petite mais naissante force aérienne mise en place sous le règne du Roi Amanullah avait été totalement détruite et dévastée. Maintenant, avec la stabilité restaurée, [AFG.GetNonIdeologyName] est enfin capable d'acquérir et de constituer une nouvelle force aérienne moderne."
AFG_purchase_german_aircraft:0 "Acheter des Avions [GER.GetAdjective]"
AFG_purchase_british_aircraft:0 "Acheter des Avions [ENG.GetAdjective]"
AFG_purchase_italian_aircraft:0 "Acheter des Avions [ITA.GetAdjective]"

