 #Ideas from game start
 POR_lackluster_armed_forces:0 "Forces armées médiocres"
 POR_lackluster_armed_forces_desc:0 "Une intervention désastreuse durant la Grande Guerre, additionnée à des coupes budgétaires motivées par l’austérité, ont laissé les forces armées du Portugal incapables de défendre la nation. Alors que l’horloge tourne et que les conflits s’embrasent dans le monde, nous devons soit corriger les lacunes de notre armée, soit faire tout notre possible pour la tenir éloignée des premières lignes."

 POR_slowly_modernizing_armed_forces:0 "Forces armées en modernisation lente"
 POR_slowly_modernizing_armed_forces_desc:0 "Une intervention désastreuse durant la Grande Guerre, ainsi que des coupes budgétaires liées à l’austérité, ont rendu les forces armées du Portugal incapables de défendre la nation. Des progrès significatifs ont été réalisés pour les remettre à niveau, mais il ne fait aucun doute qu’elles sont encore loin d’être prêtes pour la défense nationale [POR.GetAdjective]."

 POR_towards_a_modern_european_army:0 "Vers une armée européenne moderne"
 POR_towards_a_modern_european_army_desc:0 "Si la Grande Guerre et l’austérité ont gravement nui à nos forces armées, nous avons accompli des avancées impressionnantes dans leur modernisation. Il ne faudra plus longtemps avant que nous soyons à nouveau considérés comme une force européenne professionnelle !"

 POR_disgruntled_republicans:0 "Républicains mécontents"
 POR_disgruntled_republicans_desc:0 "Les libéraux et les socialistes à travers le Portugal ont clairement fait savoir qu’ils refusaient de coopérer avec nos plans pour la nation. Bien qu’ils soient loin d’être notre seule préoccupation, le retour du Portugal à la stabilité dépend de l’écrasement de ces forces de la révolution avant que leurs propres tentatives de nous détruire n’aboutissent."

 POR_austerity_measures:0 "Mesures d’austérité"
 POR_austerity_measures_desc:0 "Malgré la Grande Dépression, la politique budgétaire de Salazar a préservé l’économie portugaise de l’endettement envers les Britanniques ou les Américains, mais au prix de notre niveau de vie et de nombreux services publics. Bien que leurs effets aient indéniablement porté leurs fruits, la question de leur poursuite devra être tranchée bientôt."

 POR_harrowing_illiteracy:0 "Analphabétisme accablant"
 POR_harrowing_illiteracy_desc:0 "Malgré notre histoire de puissance mondiale d’Europe occidentale, bien plus de la moitié de la population [POR.GetAdjective] reste partiellement ou totalement illettrée. Une action énergique du gouvernement central sera nécessaire pour lever cet obstacle à notre développement national."
 
 POR_illiteracy:0 "Analphabétisme"
 POR_illiteracy_desc:0 "Malgré notre histoire de puissance mondiale d’Europe occidentale, bien plus de la moitié de la population [POR.GetAdjective] reste partiellement ou totalement illettrée. Une action énergique du gouvernement central sera nécessaire pour lever cet obstacle à notre développement national."

 POR_lingering_illiteracy:0 "Analphabétisme persistant"
 POR_lingering_illiteracy_desc:0 "Malgré notre histoire de puissance mondiale d’Europe occidentale, une large part de la population [POR.GetAdjective] demeure partiellement ou totalement illettrée. Une action énergique du gouvernement est en cours, mais il faudra du temps pour que les résultats se matérialisent pleinement."

 #Towards a Greater Portugal category (decision expansionism)
 POR_towards_a_greater_portugal:0 "Vers un Portugal plus grand"
 POR_towards_a_greater_portugal_desc:0 "Malgré des siècles de déclin impérial, l’œuvre des explorateurs portugais a laissé une marque incroyable sur le monde. Les affaires mondiales évoluant sans cesse, c’est peut-être notre meilleure occasion de restaurer l’influence de Lisbonne dans le monde !"

 POR_unshackle_galicia:0 "Libérer la Galice"
 POR_unshackle_galicia_desc:0 "Malgré des siècles de domination par Madrid, la région historique de Galice partage bien davantage sa langue et sa culture avec le peuple portugais. La descente de l’Espagne dans la folie est allée trop loin ; elle met en jeu la sécurité et la vie de nos frères pour la dernière fois !"

 POR_integrate_galicia:0 "Intégrer la Galice"
 POR_integrate_galicia_desc:0 "Nous avons montré au peuple de Galice qu’il est mieux servi sous la sage direction de notre nation. Nous n’attendrons plus pour intégrer la province à notre patrie [ROOT.GetAdjective] !"

 POR_restore_the_iberian_union:0 "Restaurer l’union ibérique"
 POR_restore_the_iberian_union_desc:0 "Bien des siècles ont passé depuis que les Portugais étaient assujettis à la férule de Madrid. La révolution victorieuse chez nous, voici notre meilleure chance de nous unir à nos frères ibériques, auxquels nous ressemblons tant."
 POR_gains_claims_on_all_spanish_states_in_europe_tt:0 "Obtient des revendications sur tous les États §Yespagnols§! en Europe."
 POR_restore_the_iberian_union_tt:0 "Débloque les décisions §YIntégrer l’intérieur espagnol§!." 

 POR_relocate_the_capital_to_madrid:0 "Déplacer la capitale à Madrid"
 POR_relocate_the_capital_to_madrid_desc:0 "Madrid, l’ancienne capitale espagnole, se trouve au cœur des terres castillanes, au centre de notre nouvelle union. Ces facteurs en font un choix logique pour notre nouvelle capitale administrative."

 POR_restore_basque_regional_autonomy:0 "Rétablir l’autonomie régionale basque"
 POR_restore_basque_regional_autonomy_desc:0 "Bien que longtemps sous le joug de Madrid, les régions basques à travers l’Espagne ont résisté à l’assimilation. Accorder l’autonomie désirée par les Basques accélérerait grandement leur intégration dans une véritable nation pan-ibérique."

 POR_restore_catalan_regional_autonomy:0 "Rétablir l’autonomie régionale catalane"
 POR_restore_catalan_regional_autonomy_desc:0 "Malgré leurs nombreuses similitudes avec les Espagnols et les Portugais, il existe une forte identité catalane qui redoute un nouvel État centralisé qui ne ferait qu’étouffer leur culture et leur histoire. Notre combat n’a pas été mené pour aliéner nos frères de la péninsule !"

 POR_reorganize_the_spanish_administration:0 "Réorganiser l’administration espagnole"
 POR_reorganize_the_spanish_administration_desc:0 "La stabilité revenue sur la péninsule, il est temps d’écraser toute résistance restante et d’intégrer définitivement leur administration à la nôtre !"
 POR_reorganize_the_spanish_administration_tt:0 "Contrôle et possède au moins 30 % de conformité dans tous les États §Yespagnols§! métropolitains"

 POR_organize_elections_in_the_hispanic_regions:0 "Organiser des élections dans les régions hispaniques"
 POR_organize_elections_in_the_hispanic_regions_desc:0 "La consolidation de notre contrôle sur les terres espagnoles ne doit pas reposer uniquement sur la force brutale. Invitons nos frères hispaniques à notre grande démocratie revitalisée !"
 POR_organize_elections_in_the_hispanic_regions_tt:0 "Contrôle et possède au moins 25 % de conformité dans tous les États §Yespagnols§! métropolitains"

 POR_repudiate_the_1890_british_ultimatum:0 "Répudier l’ultimatum britannique de 1890"
 POR_repudiate_the_1890_british_ultimatum_desc:0 "L’ultimatum britannique de 1890 fut une tragédie nationale pour tout notre empire pluricontinental. L’occasion venue, nous pouvons enfin reconnecter nos possessions africaines !"

 #FOCUSES:
 #Navy
 POR_continue_the_naval_expansion:0 "Poursuivre l’expansion navale"
 POR_continue_the_naval_expansion_desc:0 "Bien que la marine [ROOT.GetAdjective] ait connu une expansion après la Grande Guerre, les efforts ont été largement réduits par les effets de la Grande Dépression. Notre économie étant en grande partie rétablie, continuons de bâtir la flotte du Portugal jusqu’à en faire une force capable de défendre nos intérêts."

 POR_protect_the_strategic_ports_r56:0 "Protéger les ports stratégiques"
 POR_protect_the_strategic_ports_r56_desc:0 "Alors que l’Europe et l’Asie deviennent chaque mois moins paisibles, nous devons renforcer nos défenses. Consolider nos bases d’outre-mer, comme Madère et les Açores, améliorerait grandement nos chances lors d’un nouveau conflit transatlantique."

 POR_expand_naval_production:0 "Étendre la production navale"
 POR_expand_naval_production_desc:0 "Malgré des siècles d’histoire comme puissance maritime, la marine [ROOT.GetAdjective] est surclassée en nombre et en puissance par de nombreux adversaires potentiels. Dédions des fonds pour restaurer l’industrie navale du Portugal au niveau requis !"

 POR_expand_the_alfeite_shipyard:0 "Agrandir l’arsenal de l’Alfeite"
 POR_expand_the_alfeite_shipyard_desc:0 "L’arsenal de l’Alfeite figure parmi les principaux sites de construction navale du pays. L’extension de notre production navale doit passer par le renforcement de ce chantier crucial."

 POR_expand_northern_repair_facilities:0 "Étendre les installations de réparation du Nord"
 POR_expand_northern_repair_facilities_desc:0 "Les provinces du Nord abritent des installations de réparation navale qui seraient vitales en cas de guerre impliquant notre flotte. Faisons ce qui est nécessaire pour les agrandir."

 POR_modernize_lisbons_naval_academy:0 "Moderniser l’Académie navale de Lisbonne"
 POR_modernize_lisbons_naval_academy_desc:0 "Si nous voulons redevenir une puissance navale, nous devons adopter un niveau d’ingénierie maritime sans égal. Lisbonne redeviendra un pôle de prestige et de fierté navale !"
 has_researched_at_least_3_naval_doctrine_tt:0 "A recherché au moins §Y3§! §Ydoctrines navales§!"

 POR_experiment_with_radar:0 "Expérimenter le radar"
 POR_experiment_with_radar_desc:0 "Bien qu’encore naissant, le radar a montré un potentiel incroyable, civil comme militaire. Alors que le monde s’échauffe à nouveau, nul doute que le radar protégera le Portugal de toutes les menaces."

 POR_expand_the_merchant_fleet:0 "Étendre la flotte marchande"
 POR_expand_the_merchant_fleet_desc:0 "La Grande Guerre a montré de première main la destruction qu’une guerre sous-marine peut infliger au commerce international. Assurons-nous que la flotte marchande [ROOT.GetAdjective] soit prête à contrer de telles perturbations."

 POR_anti_submarine_weaponry:0 "Armes anti-sous-marines"
 POR_anti_submarine_weaponry_desc:0 "La technologie anti-sous-marine a beaucoup progressé depuis la Grande Guerre. Modernisons notre marine en ce sens."

 POR_study_italian_submarines:0 "Étudier les sous-marins italiens"
 POR_study_italian_submarines_desc:0 "Les développements navals italiens ont été solides malgré une économie ne pouvant rivaliser avec l’Allemagne ou la Grande-Bretagne. Leur modèle pourrait nous inspirer des résultats similaires."

 POR_the_future_of_naval_deterrence:0 "L’avenir de la dissuasion navale"
 POR_the_future_of_naval_deterrence_desc:0 "Numériquement, notre marine ne peut affronter les menaces que poserait un voisin plus grand. De nouvelles technologies, notamment la pose de mines navales, pourraient certainement servir à défendre notre pays."
POR_restore_our_high_seas_presence:0 "Restaurer notre présence en haute mer"
POR_restore_our_high_seas_presence_desc:0 "Le Portugal est une nation à l’échelle du globe qui fait face à des menaces aux quatre coins du monde. Notre héritage impérial est un statut à défendre, et cela exige une flotte puissante en haute mer !"
POR_restoring_the_portuguese_high_seas_armada_r56:0 "Restaurer notre armada de haute mer"
POR_restoring_the_portuguese_high_seas_armada_r56_desc:0 "Le Portugal est une nation à l’échelle du globe qui fait face à des menaces aux quatre coins du monde. Notre héritage impérial est un statut à défendre, et cela exige une flotte puissante en haute mer !"

POR_advancing_our_tactics:0 "Faire progresser nos tactiques"
POR_advancing_our_tactics_desc:0 "Si nous voulons redevenir une grande puissance maritime, nous devons suivre les avancées initiées par des nations comme la Grande-Bretagne, le Japon et les États-Unis. La modernisation navale doit primer, quoi qu’il en coûte !"

POR_study_amphibious_operations:0 "Étudier les opérations amphibies"
POR_study_amphibious_operations_desc:0 "La guerre amphibie n’est ni nouvelle, ni étrangère à l’expérience du Portugal. Malgré cela, il est clair que des leçons restent à tirer des opérations de l’époque de la Grande Guerre, des évolutions que nous devrions étudier pour perfectionner nos propres stratégies."

POR_restore_the_naval_guard:0 "Rétablir la garde navale"
POR_restore_the_naval_guard_desc:0 "Dans un monde où les armées se professionnalisent toujours davantage, la spécialisation des troupes est cruciale pour la guerre moderne. Nous devrions rétablir la garde navale [ROOT.GetAdjective] afin qu’elle nous suive jusque dans les opérations maritimes les plus lointaines !"

POR_focus_on_submarine_production:0 "Se concentrer sur la production de sous-marins"
POR_focus_on_submarine_production_desc:0 "Les Allemands ont prouvé que les sous-marins constituent un élément décisif pour dissuader une flotte plus vaste par la dévastation économique. Nous devons privilégier un approvisionnement agressif de ces engins essentiels."
POR_towards_a_portuguese_raiding_armada_r56:0 "Vers une armada de raids [POR.GetAdjective]"
POR_towards_a_portuguese_raiding_armada_r56_desc:0 "Les Allemands ont prouvé que les sous-marins constituent un élément décisif pour dissuader une flotte plus vaste par la dévastation économique. Nous devons privilégier un approvisionnement agressif de ces engins essentiels."

POR_guide_the_future_of_naval_warfare:0 "Guider l’avenir de la guerre navale"
POR_guide_the_future_of_naval_warfare_desc:0 "Nos réformes navales nous poussent rapidement vers un regain de puissance en mer. Nous devons préparer le Portugal à tout ce que cela implique !"


# Army
POR_complete_the_military_restructuring:0 "Achever la restructuration militaire"
POR_complete_the_military_restructuring_desc:0 "À mesure que l’horloge de la paix européenne s’égrène, nous devons nous assurer que nos forces armées sont capables de protéger à la fois la stabilité politique et la nation entière contre toutes les menaces qui cherchent à la détruire."

POR_institute_of_higher_military_studies:0 "Institut des hautes études militaires"
POR_institute_of_higher_military_studies_desc:0 "Si le Portugal veut redevenir une puissance militaire, il est temps de réorganiser notre académie militaire en un véritable institut qui formera des générations de combattants courageux pour mener la nation vers l’avant !"
has_researched_elastic_defence_tt:0 "A recherché la §YDéfense élastique§!"
has_researched_at_least_3_air_doctrine_tt:0 "A recherché au moins §Y3§! §Ydoctrines aériennes§!"

POR_plan_for_a_defense_of_the_interior:0 "Planifier la défense de l’intérieur"
POR_plan_for_a_defense_of_the_interior_desc:0 "Alors que les conflits s’embrasent à travers le globe, il est possible que le Portugal devienne un jour le théâtre d’une destruction indicible. Il est impératif d’être prêts."

POR_prepare_for_a_war_of_logistics:0 "Préparer une guerre de logistique"
POR_prepare_for_a_war_of_logistics_desc:0 "Nation historiquement présente sur quatre continents, nous comprenons mieux que d’autres l’importance de systèmes logistiques pragmatiques. Une standardisation s’impose afin que nos soldats aient toujours les moyens de réussir sur le champ de bataille moderne."

POR_study_flexible_defense_plans:0 "Étudier des plans de défense flexibles"
POR_study_flexible_defense_plans_desc:0 "Le lieutenant suédois Axel Oscar Rappe, en collaboration avec des ingénieurs de combat finlandais, travaille à la construction d’une ligne défensive adaptative face à leur voisin russe bien plus puissant. Si nous n’avons pas l’économie pour une ligne Maginot portugaise, des efforts défensifs plus modestes comme ceux-ci pourraient être une dissuasion décisive pour nos ennemis !"

POR_modernize_our_infantry:0 "Moderniser notre infanterie"
POR_modernize_our_infantry_desc:0 "Malgré toutes les évolutions de l’art de la guerre, l’infanterie demeure la reine des batailles. Nous devons renforcer ses capacités défensives et offensives si nous voulons tenir dans les guerres à venir."

POR_utilize_the_inland_terrain:0 "Exploiter le relief de l’intérieur"
POR_utilize_the_inland_terrain_desc:0 "Même si Lisbonne, Porto et Beja tombaient sous l’agression de nos voisins, tout ennemi du Portugal peinerait à franchir nos crêtes à l’est. Des unités de montagne dédiées seraient décisives pour tenir ces forteresses naturelles."

POR_modernize_our_artillery_systems:0 "Moderniser nos systèmes d’artillerie"
POR_modernize_our_artillery_systems_desc:0 "À mesure que de nouvelles armes arrivent sur le champ de bataille, il reste essentiel de moderniser nos systèmes d’artillerie vieillissants, indispensables pour pilonner les ennemis de notre armée de terre !"

POR_contenders_on_the_world_stage:0 "Prétendants sur la scène mondiale"
POR_contenders_on_the_world_stage_desc:0 "L’armée [ROOT.GetAdjective] peut de nouveau se dire une force terrestre européenne professionnelle. S’il reste du travail, nous sommes désormais une armée à craindre sur le champ de bataille moderne !"
POR_due_to_a_bastion_of_combined_arms_warfare_not_being_completed_tt:0 "En raison de l’absence d’achèvement de §YUn bastion de la guerre interarmes§!, nous recevrons les effets suivants :"

POR_study_the_spanish_conflict:0 "Étudier le conflit espagnol"
POR_study_the_spanish_conflict_desc:0 "La guerre civile espagnole est devenue un banc d’essai pour d’innombrables innovations de la guerre moderne. La modernisation de nos forces armées doit s’appuyer sur l’étude attentive de ce front."
POR_studying_the_spanish_civil_war:0 "Étude de la guerre civile espagnole"
POR_studying_the_spanish_civil_war_desc:0 "La guerre civile espagnole est devenue un banc d’essai pour d’innombrables innovations de la guerre moderne. La modernisation de nos forces armées doit s’appuyer sur l’étude attentive de ce front."

POR_learn_from_guerrilla_operations:0 "Tirer les leçons des opérations de guérilla"
POR_learn_from_guerrilla_operations_desc:0 "Des conflits asymétriques récents, surtout dans le Rif espagnol et en Irlande, montrent la capacité d’une armée plus faible à infliger des pertes terribles même aux plus grandes puissances. Pour rester libre, le Portugal doit apprendre de ces actes de dévouement et de bravoure !"

POR_adapting_to_the_modern_battlefield:0 "S’adapter au champ de bataille moderne"
POR_adapting_to_the_modern_battlefield_desc:0 "Les trois dernières décennies ont vu naître des armes de guerre incroyables. Pour être prêts à un conflit moderne, nous devons développer nos propres contre-mesures face aux attaques blindées comme aéroportées."

POR_continue_the_fight_underground:0 "Poursuivre le combat dans l’ombre"
POR_continue_the_fight_underground_desc:0 "L’impensable arrive au Portugal, mais nous ne sommes pas vaincus ! Avec l’aide des amis du Portugal, nous reconquerrons notre grand territoire métropolitain ; en attendant, nous financerons les groupes de résistance pour qu’ils poursuivent le combat sur le front intérieur !"
POR_funding_underground_resistance_groups:0 "Financer les groupes de résistance clandestins"
POR_funding_underground_resistance_groups_desc:0 "L’impensable arrive au Portugal, mais nous ne sommes pas vaincus ! Avec l’aide des amis du Portugal, nous reconquerrons notre grand territoire métropolitain ; en attendant, nous financerons les groupes de résistance pour qu’ils poursuivent le combat sur le front intérieur !"

POR_study_mechanized_warfare:0 "Étudier la guerre mécanisée"
POR_study_mechanized_warfare_desc:0 "Des nations comme l’Allemagne et la Grande-Bretagne développent rapidement des véhicules de combat mobiles. Observons leurs performances sur le champ de bataille pour en tirer des enseignements !"

POR_towards_a_mobile_army:0 "Vers une armée mobile"
POR_towards_a_mobile_army_desc:0 "La plus grande leçon du conflit espagnol en cours est que la guerre moderne se gagne par une manœuvre décisive et adaptable. Si nos conseillers en Espagne nous l’affirment déjà, cela sera d’autant plus vrai avec le temps."

POR_subsidize_OGME:0 "Subventionner l’OGME"
POR_subsidize_OGME_desc:0 "Devenir autosuffisants dans la production de véhicules est un objectif à soutenir. Financer des entreprises comme l’OGME y contribuera sans aucun doute."

POR_specialized_auxiliary_tanks:0 "Chars auxiliaires spécialisés"
POR_specialized_auxiliary_tanks_desc:0 "Les chars ne sont pas et ne deviendront pas l’élément central du champ de bataille. La Grande Guerre a montré comment les employer comme unités d’appui au sein des bataillons d’infanterie ; notre armée n’en sera que plus redoutable !"

POR_experiment_with_amphibious_vehicles:0 "Expérimenter des véhicules amphibies"
POR_experiment_with_amphibious_vehicles_desc:0 "Le temps est venu pour les véhicules polyvalents de faire leur entrée sur le champ de bataille. Allouons des ressources à leur acquisition."

POR_a_bastion_of_combined_arms_warfare:0 "Un bastion de la guerre interarmes"
POR_a_bastion_of_combined_arms_warfare_desc:0 "Les récents développements ont mis les forces armées [ROOT.GetAdjective] sur la voie de devenir l’armée forte, mobile et adaptable de l’Ibérie. For­geons un nouvel héritage pour cette institution de la nation !"
POR_due_to_contenders_on_the_world_stage_not_being_completed_tt:0 "En raison de l’absence d’achèvement de §YPrétendants sur la scène mondiale§!, nous recevrons les effets suivants :"


# Army/Navy - Shared Airforce
POR_import_foreign_bombers:0 "Importer des bombardiers étrangers"
POR_import_foreign_bombers_desc:0 "Les bombardiers se sont révélés décisifs pour perturber les armées et les populations civiles des nations hostiles à nos intérêts. Importons des appareils de pays comme la Grande-Bretagne et l’Italie pour les étudier et les mettre en œuvre."

POR_study_british_fighters:0 "Étudier les chasseurs britanniques"
POR_study_british_fighters_desc:0 "Qu’il s’agisse de contrôler le ciel ou simplement de le défendre contre l’horreur des bombardements, étudier les avions aisément accessibles de la Grande-Bretagne pourrait être très bénéfique pour nos propres développements."

POR_experiment_with_torpedo_bombers:0 "Expérimenter des torpilleurs"
POR_experiment_with_torpedo_bombers_desc:0 "L’aéronavale est un domaine nouveau mais extrêmement prometteur pour des nations comme la nôtre, qui peuvent difficilement soutenir une vaste industrie navale. L’acquisition d’une petite flotte de torpilleurs pourrait grandement dissuader l’usage de la force contre nous en mer."

POR_modern_engines:0 "Moteurs modernes"
POR_modern_engines_desc:0 "Des moteurs fiables et rapides sont l’épine dorsale de tout chasseur. Concentrons notre R&D sur ce domaine."

POR_experiment_with_heavy_fighters:0 "Expérimenter des chasseurs lourds"
POR_experiment_with_heavy_fighters_desc:0 "Les chasseurs lourds sont essentiels à toute flotte aérienne qui souhaite protéger ses précieux bombardiers. Acquérons une flotte de ces appareils pour leur défense."

POR_grant_autonomy_to_the_air_force:0 "Accorder l’autonomie à l’Armée de l’air"
POR_grant_autonomy_to_the_air_force_desc:0 "Le rattachement de notre aviation à l’armée de terre affaiblit sa capacité d’action indépendante. Suivons la tendance des autres nations occidentales et accordons davantage d’autonomie à cette branche cruciale !"

POR_experiment_with_airborne_divisions:0 "Expérimenter des divisions aéroportées"
POR_experiment_with_airborne_divisions_desc:0 "Jeter depuis le ciel une armée motivée et bien entraînée est une façon extrêmement expérimentale de mener des opérations interarmes modernes. La peur que cela peut inspirer aux ennemis de la nation est considérable !"

POR_air_land_battle:0 "Bataille air-sol"
POR_air_land_battle_desc:0 "La coopération entre bombardiers, forces terrestres et forces navales sera un élément central de la guerre moderne. Œuvrons à moderniser davantage ces appareils."

POR_modernize_the_fighter_arsenal:0 "Moderniser l’arsenal des chasseurs"
POR_modernize_the_fighter_arsenal_desc:0 "On n’a jamais des avions trop adaptables face aux menaces du ciel."

POR_complete_the_separation:0 "Parachever la séparation"
POR_complete_the_separation_desc:0 "Le moment est venu de constituer une force aérienne [ROOT.GetAdjective] distincte et indépendante, qui nous mènera à la victoire dans les airs."
POR_portuguese_air_force_r56:0 "Armée de l’air [ROOT.GetAdjective]"
POR_portuguese_air_force_r56_desc:0 "L’aviation [POR.GetAdjective] est l’aboutissement d’années d’émancipation progressive vis-à-vis du reste de l’armée. Encore jeune, elle s’est déjà imposée comme une force professionnelle et moderne."


# Economic
POR_continue_the_public_works_r56:0 "Poursuivre les travaux publics"
POR_continue_the_public_works_r56_desc:0 "Les travaux publics sont un investissement judicieux qui nourrira un Portugal en croissance pendant des années. Étendre et lancer de nouveaux projets servira notre économie et montrera que nous sommes une force de stabilité pour la nation entière."

POR_support_continued_educational_expansion:0 "Soutenir l’essor continu de l’éducation"
POR_support_continued_educational_expansion_desc:0 "Alors que le monde occidental a poursuivi l’amélioration de l’enseignement primaire, le Portugal est resté en retrait. La situation étant stabilisée, œuvrons à moderniser cette honte nationale."

POR_subsidize_rolling_stock_production:0 "Subventionner la production de matériel roulant"
POR_subsidize_rolling_stock_production_desc:0 "La production de matériel roulant [ROOT.GetAdjective] est un élément essentiel pour alimenter nos ambitieux travaux publics. Continuons de subventionner cette industrie clé."

POR_finish_the_santa_luzia_dam:0 "Achever le barrage de Santa Luzia"
POR_finish_the_santa_luzia_dam_desc:0 "L’hydroélectricité au Portugal a montré jusqu’ici un potentiel remarquable. Le barrage de Santa Luzia est notre prochaine étape vers l’indépendance énergétique : il est temps d’achever ce projet ambitieux !"

POR_modernize_the_national_rail_network:0 "Moderniser le réseau ferroviaire national"
POR_modernize_the_national_rail_network_desc:0 "Le réseau national, centré sur Lisbonne, est un nœud majeur reliant la péninsule Ibérique à la mer. Investissons davantage pour moderniser cette partie de notre infrastructure."

POR_modernize_the_rural_regions:0 "Moderniser les régions rurales"
POR_modernize_the_rural_regions_desc:0 "Le Portugal urbain et le Portugal rural sont, à bien des égards, deux pays différents. Rapprochons nos campagnes des grands centres urbains."

POR_continue_the_national_electrification:0 "Poursuivre l’électrification nationale"
POR_continue_the_national_electrification_desc:0 "Étendre l’électrification au maximum du territoire sera capital si nous voulons rejoindre le rang des grandes économies prospères d’Europe."

POR_expand_the_mining_industry:0 "Développer l’industrie minière"
POR_expand_the_mining_industry_desc:0 "La géographie du pays nous a gratifiés d’abondantes ressources naturelles, le tungstène avant tout. Investir davantage dans l’extraction [ROOT.GetAdjective] est un choix avisé, pour la sécurité nationale comme pour l’essor de notre économie."

POR_import_foreign_machinery:0 "Importer des machines étrangères"
POR_import_foreign_machinery_desc:0 "Le Portugal ne dispose pas de tous les outils nécessaires à sa modernisation industrielle. Tournons-nous vers des pays comme l’Allemagne, la Grande-Bretagne et les États-Unis pour acquérir l’équipement qui fera tourner notre base industrielle."

POR_develop_portuguese_textiles:0 "Développer les textiles [ROOT.GetAdjective]"
POR_develop_portuguese_textiles_desc:0 "Que nous poursuivions l’autarcie ou retrouvions l’interdépendance mondiale, le textile reste une industrie critique, pour l’armée comme pour le civil. Investissons davantage sur ce front essentiel."
POR_never_another_la_lys:0 "Plus jamais une autre La Lys"
POR_never_another_la_lys_desc:0 "Le continent européen s’éloigne rapidement de la paix et de l’ordre pour lesquels tant ont saigné à Versailles. Alors que des décennies d’apaisement international touchent à leur fin, nous devons nous préparer, de peur de revivre ce que le Portugal a autrefois enduré. Plus jamais le conflit ne dévorera la nation !"
POR_never_another_la_lys_tt:0 "Achève l’objectif §YPlus jamais la Lys§!, qui confère :"
due_to_civilian_economy_being_active_we_will_receive_the_following_effects_tt:0 "Étant donné que l’§YÉconomie civile§! est active, nous recevrons les effets suivants :"
due_to_early_mobilization_being_active_we_will_receive_the_following_effects_tt:0 "Étant donné que la §YMobilisation précoce§! est active, nous recevrons les effets suivants :"

POR_the_resource_war:0 "La guerre des ressources"
POR_the_resource_war_desc:0 "Le Portugal est une nation riche en ressources naturelles, le tungstène avant tout. Alors que les machines de guerre d’Europe réclament des matières premières, notre économie doit être prête !"

POR_prepare_wartime_heavy_industry:0 "Préparer l’industrie lourde de guerre"
POR_prepare_wartime_heavy_industry_desc:0 "Les horreurs de la guerre ont suscité une nouvelle demande d’industrie lourde à travers l’Europe. Profitons-en pour faire du Portugal une économie qui s’industrialise à vive allure !"

POR_support_an_aerial_expansion:0 "Soutenir une expansion aérienne"
POR_support_an_aerial_expansion_desc:0 "Les conflits récents ont montré la dévastation que l’aviation provoque sur terre comme en mer. Une expansion marquée de la production aéronautique est notre meilleure chance de préserver notre avenir national !"

POR_rejuvenate_the_land_forces:0 "Rajeunir les forces terrestres"
POR_rejuvenate_the_land_forces_desc:0 "Malgré des avancées technologiques incroyables, l’infanterie reste la pièce maîtresse du champ de bataille. Avant d’embrasser des innovations nouvelles et non éprouvées, nous devons affiner, à la perfection, les besoins du soldat."
POR_rejuvenating_the_land_forces:0 "Rajeunissement des forces terrestres"
POR_rejuvenating_the_land_forces_desc:0 "Malgré des avancées technologiques incroyables, l’infanterie reste la pièce maîtresse du champ de bataille. Avant d’embrasser des innovations nouvelles et non éprouvées, nous devons affiner, à la perfection, les besoins du soldat."

POR_renew_the_portuguese_armada:0 "Renouveler l’armada [ROOT.GetAdjective]"
POR_renew_the_portuguese_armada_desc:0 "Nation présente sur plusieurs continents, nous aurons toujours besoin d’une marine forte et capable au cœur de notre sécurité nationale. Il est impératif de tout mettre en œuvre pour restaurer notre puissance en mer !"
POR_renewing_the_portuguese_armada:0 "Renouvellement de l’armada [ROOT.GetAdjective]"
POR_renewing_the_portuguese_armada_desc:0 "Nation présente sur plusieurs continents, nous aurons toujours besoin d’une marine forte et capable au cœur de notre sécurité nationale. Il est impératif de tout mettre en œuvre pour restaurer notre puissance en mer !"

# Colonies
POR_strengthen_the_colonial_administration:0 "Renforcer l’administration coloniale"
POR_strengthen_the_colonial_administration_desc:0 "Plus de la moitié de notre population vit dans nos nombreux territoires d’outre-mer, et cette proportion ne fera que croître. Tandis que d’autres nations occidentales s’orientent vers l’autonomie et l’indépendance, nous devons continuer à faire de nos colonies une source de croissance économique et de prestige."
POR_strengthen_the_colonial_administration_tt:0 "Débloque la loi d’occupation dans tous les États §Ynon européens§! :"
POR_strengthen_the_colonial_administration_trigger:0 "A achevé l’objectif §YLa question de nos colonies§! sans §Yse retirer§! d’icelles"

POR_develop_the_angolan_interior:0 "Développer l’intérieur angolais"
POR_develop_the_angolan_interior_desc:0 "L’Angola, comme nombre de nos colonies, reste très pauvre. Si nous voulons conserver cet immense territoire, nous devons aligner son économie sur celle du Portugal métropolitain."

POR_develop_mozambique_r56:0 "Développer le Mozambique"
POR_develop_mozambique_r56_desc:0 "Le Mozambique est le plus peuplé de nos nombreux territoires et demeure très démuni malgré ce qu’il apporte à notre nation. Investir dans l’économie locale profiterait à notre économie nationale et accroîtrait l’adhésion à notre gouvernance."
POR_mozambique_cash_crop_imports:0 "Importations de cultures de rente du Mozambique"
POR_mozambique_cash_crop_imports_desc:0 "Les cultures de rente, principalement le coton, abondent au Mozambique [POR.GetAdjective], ressource cruciale pour la production de textiles civils et militaires. Les importations alimentaires de ce territoire d’outre-mer servent aussi d’assurance contre les pénuries de la production nationale."

POR_expand_overseas_recruitment:0 "Étendre le recrutement d’outre-mer"
POR_expand_overseas_recruitment_desc:0 "Principale source de population de notre empire, les provinces d’outre-mer peuvent devenir l’épine dorsale de notre armée. Le recrutement indigène doit être étendu sans délai !"

POR_bolster_the_colonial_garrison:0 "Renforcer la garnison coloniale"
POR_bolster_the_colonial_garrison_desc:0 "Notre puissance mondiale ne doit pas être perdue au profit d’ingérences étrangères ni d’insurrections locales. Notre garnison coloniale doit rester une force professionnelle, mêlant soldats autochtones et européens, pour maintenir notre portée globale !"

# Politique – Révolution socialiste/démocrate (partagée)
POR_unite_against_salazar:0 "S’unir contre Salazar"
POR_unite_against_salazar_desc:0 "Le régime de l’Estado Novo de Salazar a transformé chaque promesse de la république portugaise en un enracinement du despotisme et du retard. Ramener le Portugal vers l’avant, comme jadis, suppose de mettre fin à son règne."
POR_unite_against_salazar_tt:0 "Débloque les décisions §YEnsemble contre Salazar§!"
POR_together_against_salazar:0 "Ensemble contre Salazar !"
POR_battle_nationalist_paramilitaries:0 "Combattre les paramilitaires nationalistes"
POR_battle_nationalist_paramilitaries_desc:0 "Les paramilitaires nationalistes [POR.GetAdjective] menacent tout ce pour quoi l’homme du peuple se bat. Écraser ces forces brutales qui veulent ramener le Portugal en arrière ralliera sans doute le soutien populaire à notre cause !"
POR_distribute_propaganda_pamphlets:0 "Distribuer des tracts de propagande"
POR_distribute_propaganda_pamphlets_desc:0 "Même les aveugles voient les horreurs de l’Estado Novo, mais nous devons montrer au peuple que nous avons des solutions. Mettons fin au monopole du ministère de la Propagande sur l’usage de la propagande."
POR_call_for_general_strike:0 "Appeler à la grève générale"
POR_call_for_general_strike_desc:0 "Le moment est venu d’afficher notre force contre Salazar. Le monde du travail, uni comme un seul homme, fera tomber son gouvernement !"

POR_seek_international_support:0 "Chercher un soutien international"
POR_seek_international_support_desc:0 "Nous ne sommes pas seuls face à Salazar et à son régime. Faisons le nécessaire pour aligner des intérêts étrangers sur les nôtres !"
POR_join_forces_with_the_spanish_popular_front:0 "Joindre nos forces au Front populaire espagnol"
POR_join_forces_with_the_spanish_popular_front_desc:0 "La société espagnole se déchire dans l’horreur de la guerre civile, et nous avons l’occasion d’intervenir. La République est le gouvernement légitime de l’Espagne ; nous lui apporterons l’aide nécessaire pour renverser la vapeur !"
POR_join_forces_with_the_spanish_popular_front_tt:0 "Si §Yl’Espagne§! est en guerre civile à l’achèvement de §YPrendre d’assaut l’Assemblée nationale§!, nous joindrons nos forces et obtiendrons les effets suivants :"
POR_join_forces_with_the_spanish_popular_front2_tt:0 "À l’achèvement de §YSe pencher sur la nouvelle Espagne§!, nous pourrons demander l’§Yannexion§! de l’§YEspagne§!"
POR_request_soviet_assistance:0 "Demander l’aide soviétique"
POR_request_soviet_assistance_tt:0 "S’ils sont en paix, les §YSoviétiques§! seront enclins à envoyer des §Yvolontaires§! de notre côté si nous entrons en guerre civile."
portugal.46.t:0 "Les socialistes portugais sollicitent l’aide soviétique"
portugal.46.d:0 "Ces derniers jours, des membres de plusieurs groupes socialistes portugais sont arrivés à Moscou pour organiser un soutien soviétique à leurs opérations. Si notre appui à leur régime servirait la projection de puissance de Moscou, leur lutte vaut-elle vraiment qu’on s’y engage ?"
portugal.46.a:0 "Le moment venu, ils auront notre soutien."
POR_NKVD_activity:0 "Activité du NKVD"
POR_NKVD_activity_desc:0 "Des agents du NKVD [SOV.GetAdjective] sont, sans nul doute, actifs dans le pays. Tout en combattant les ennemis du communisme, ils menacent aussi notre unité idéologique et l’idée d’un front populaire. Nous devrions contrecarrer au plus vite l’influence du NKVD."
portugal.46.b:0 "Nous avons plus urgent à gérer."

POR_ally_anti_colonial_resistance:0 "S’allier aux résistances anticoloniales"
POR_ally_anti_colonial_resistance_desc:0 "Notre empire pluricontinental est mûr pour des luttes de libération nationale. Coordonner notre cause avec les rebelles coloniaux aidera à faire s’effondrer la poigne de Salazar sur le Portugal."
POR_ally_anti_colonial_resistance_tt:0 "Si nous entrons en §Yguerre civile§!, la résistance augmentera fortement dans nos colonies et empêchera le déploiement de plusieurs divisions du camp adverse."

POR_storm_the_national_assembly:0 "Prendre d’assaut l’Assemblée nationale"
POR_storm_the_national_assembly_desc:0 "Nous sommes enfin en mesure de destituer l’homme responsable de tant d’années de retard ! À Lisbonne, nous renverserons Salazar et ses alliés réactionnaires, et forgerons le Portugal de demain que nous méritons !"
POR_if_authoritarian_popularity_is_above_30_or_if_decision_join_forces_with_the_spanish_popular_front_has_been_completed_tt:0 "Si la popularité §gAutoritaire§! dépasse 30 %, ou si la décision §YJoindre nos forces au Front populaire espagnol§! a été prise :"
POR_storm_the_national_assembly_tt:0 "§YUne guerre civile éclatera !§! La proportion d’unités sous notre commandement dépendra du soutien au gouvernement en place."
portugal.45.t:0 "Assaut sur l’Assemblée nationale"
portugal.45.d:0 "Aujourd’hui marque un nouveau jour pour le Portugal. Nous ne serons plus l’arrière-cour de l’Europe occidentale ! Salazar ne tyrannisera plus notre peuple. À la grande classe ouvrière portugaise :"
portugal.45.a:0 "Le moment de reprendre notre pays est venu !"
portugal.81.a:0 "La paix et la justice triompheront dans la nation !"
POR_reactionary_resistance:0 "Résistance réactionnaire"
POR_reactionary_resistance_desc:0 "Nos progrès au front ne suffisent pas à gagner pleinement les cœurs. Les réactionnaires, surtout dans les campagnes, nourrissent toujours un fort ressentiment envers notre pouvoir. Des politiques en faveur du monde rural, ou des outils de subversion plus durs, seront nécessaires pour apaiser cette menace."
POR_divided_revolution:0 "Révolution divisée"
POR_divided_revolution_desc:0 "Le Front populaire issu de notre lutte est profondément divisé sur la voie à suivre. Nous sommes à la croisée des chemins ; il faut agir avec fermeté pour redonner de la certitude au peuple."
POR_jose_mendes_dos_reis:0 "José Mendes dos Reis"
POR_armando_pereira_de_castro_agatao_lanca:0 "Armando Pereira de Castro Agatão Lança"

# Menu de décisions socialiste/démocrate
POR_maintaining_the_fire:0 "Entretenir la flamme !"
POR_maintaining_the_fire_desc:0 "La disparition de Salazar n’a jamais été le seul but de notre cause. L’heure est à l’avenir : agissons avec décision pour consolider notre emprise révolutionnaire sur la nation !"

POR_answer_the_question_of_our_colonies:0 "Répondre à la question de nos colonies"
POR_answer_the_question_of_our_colonies_desc:0 "Notre révolution a triomphé et nous contrôlons fermement la métropole. Il nous faut maintenant régler les questions internes, au premier rang desquelles nos possessions en Afrique et en Asie. Allons-nous nous retirer de ces régions que nous tenons depuis si longtemps ?"

POR_align_the_british_communist_alternative:0 "S’aligner sur l’alternative communiste britannique"
POR_align_the_british_communist_alternative_desc:0 "Les Britanniques nous ont longtemps protégés, et eux aussi cherchent désormais à s’élever vers de vrais idéaux socialistes. Unis à nouveau, le Portugal et la Grande-Bretagne ne seront plus jamais séparés !"

POR_align_with_moscow:0 "S’aligner sur Moscou"
POR_align_with_moscow_desc:0 "Malgré de profondes divergences sur plusieurs points, l’Union soviétique demeure la principale puissance socialiste d’Europe. L’avenir de nos idéaux en Europe de l’Ouest dépend du renforcement de nos liens avec Moscou."

POR_support_the_spanish_republic_r56:0 "Soutenir la République espagnole"
POR_support_the_spanish_republic_r56_desc:0 "La République espagnole mène une guerre de survie contre les maux de la réaction et du fascisme, et elle aura besoin de notre aide. La République est le gouvernement légitime de l’Espagne : nous combattrons à ses côtés jusqu’au bout !"
iberian_pact:0 "Pacte ibérique"
POR_support_the_spanish_republic_tt:0 "Débloque l’envoi de volontaires à toute §YEspagne républicaine§! §Ydémocratique§! ou §Ycommuniste§!."

POR_end_the_popular_front:0 "Mettre fin au Front populaire"
POR_end_the_popular_front_desc:0 "La mainmise de Salazar disparue, évitons que le fractionnalisme n’entrave une coalition aussi vaste. Sans oublier l’apport de nos frères d’armes, il est clair que le Front populaire ne peut plus durer avec tant d’idéologies côte à côte."
POR_grant_womens_suffrage:0 "Accorder le droit de vote aux femmes"
POR_grant_womens_suffrage_desc:0 "Un tel bouleversement de l’électorat entraînera peut-être un peu d’instabilité, mais les femmes de notre pays constituent une base de soutien précieuse pour asseoir la popularité du régime !"
POR_loosen_censorship_policies:0 "Assouplir la censure"
POR_loosen_censorship_policies_desc:0 "Des communistes autoritaires, au sein de notre comité révolutionnaire, cherchent — à l’instar des salazaristes — à subvertir les institutions libérales. Agissons pour garantir la tolérance du débat politique !"

POR_the_question_of_our_colonies:0 "La question de nos colonies"
POR_the_question_of_our_colonies_desc:0 "Notre révolution a triomphé et nous contrôlons fermement la métropole. Il nous faut maintenant régler les questions internes, au premier rang desquelles nos possessions en Afrique et en Asie. Allons-nous nous retirer de ces régions que nous tenons depuis si longtemps ?"
portugal.47.t:0 "La question de nos colonies"
portugal.47.desc:0 "Pendant plusieurs siècles, le Portugal a bâti un empire étendu, sur plusieurs continents. Notre révolution triomphant au pays, nous devons dire à notre peuple si nous allons nous retirer des vastes possessions historiques du Portugal."
portugal.47.a:0 "Notre cause est une et indivisible !"
portugal.47.a_tt:0 "Si leurs États sont sous notre contrôle, §Rtoute colonie africaine initiale sera libérée comme nation communiste indépendante§!."
portugal.47.b:0 "Peut-être qu’une certaine autonomie suffirait ?"
portugal.47.b_tt:0 "Si leurs États sont sous notre contrôle, §Y[ANG.GetNameDef]§!, §Y[MZB.GetNameDef]§! et §Y[GNB.GetNameDef]§! deviendront nos §Yprotectorats§!."
portugal.47.c:0 "À ce sujet…"
portugal.47.d:0 "Hmm… non."
portugal.48.t:0 "Le Portugal se retire de Macao"
portugal.48.desc:0 "Ces derniers jours, après des soulèvements armés à travers le pays, les forces coloniales portugaises ont abandonné plusieurs de leurs ports à l’échelle du globe. L’occasion se présente : que devons-nous faire de cet événement ?"
portugal.48.a:0 "Des fous. Alors, avançons nos pions !"
portugal.49.t:0 "Le Portugal se retire de Goa"
portugal.50.t:0 "Le Portugal se retire du Timor oriental"
portugal.50.b:0 "Cela ne nous concerne pas !"

POR_address_the_new_spain:0 "Se pencher sur la nouvelle Espagne"
POR_address_the_new_spain_desc:0 "L’Espagne, comme nous, a traversé horreurs de la guerre et décennies de troubles civils au nom de la libération. Peu susceptible de se relever avant des années, et notre révolution gagnée, nous devons nous demander : que faire de la situation chez notre grand voisin ?"
portugal.51.desc:0 "L’Espagne, comme nous, a traversé horreurs de la guerre et décennies de conflits civils au nom de valeurs souvent opposées. Peu susceptible de se relever avant des années, et notre pouvoir consolidé, nous devons nous demander : que faire de la situation chez notre grand voisin ?"
portugal.51.t:0 "Se pencher sur la nouvelle Espagne"
portugal.51.a:0 "Ensemble, nous avons fait preuve d’une résolution incroyable ! L’unité pan-ibérique est notre voie !"
portugal.51.b:0 "Approfondissons l’amitié déjà nouée !"
portugal.51.c:0 "Malgré nos différences, normaliser nos relations servira nos deux pays."
portugal.51.d:0 "Cette « nouvelle Espagne » menace tout ce que nous défendons !"
POR_annexes_and_gains_cores_on_all_spanish_states:0 "Annexe et gagne des cœurs sur tous les États §Y[SPR.GetAdjective]§!."
portugal.52.t:0 "Le Portugal demande un traité d’amitié et de non-agression"
portugal.52.d:0 "Notre ambassadeur à Madrid vient d’être approché par son homologue [POR.GetAdjective], qui nous informe du désir de conclure un traité officiel de non-agression et de défense mutuelle. Alors que l’Europe s’assombrit, que répondre à nos vieux amis de Lisbonne ?"
POR_pan_iberian_trade_r56:0 "Commerce pan-ibérique"
POR_pan_iberian_trade_r56_desc:0 "Dans un esprit de coopération, les nations [POR.GetAdjective] et [SPR.GetAdjective] se sont rapprochées pour nouer des liens politiques et économiques plus étroits. Tandis qu’une grande partie de l’Europe s’achemine vers la guerre, ces deux pays ont d’autres projets pour leur région."
POR_pan_iberian_cooperation_r56:0 "Coopération pan-ibérique"
POR_pan_iberian_cooperation_r56_desc:0 "Dans un esprit de coopération, les nations [POR.GetAdjective] et [SPR.GetAdjective] se sont rapprochées pour nouer des liens politiques et économiques plus étroits. Tandis qu’une grande partie de l’Europe s’achemine vers la guerre, ces deux pays ont d’autres projets pour leur région."
portugal.52.a:0 "Bien sûr ! Codifions l’amitié déjà établie !"
portugal.52.b:0 "Leurs affaires ne nous intéressent pas."
portugal.53.t:0 "Les Espagnols acceptent une coopération plus étroite !"
portugal.53.d:0 "L’ambassadeur espagnol des Affaires étrangères a répondu à notre requête en convenant que la coopération mutuelle sur la péninsule ne pourrait qu’être bénéfique à nos nations. C’est un bon jour pour la paix."
portugal.54.t:0 "Les Espagnols ont refusé !"
portugal.54.d:0 "L’ambassadeur espagnol des Affaires étrangères a répondu à notre requête en déclinant notre demande de coopération accrue. C’est sans aucun doute une déception pour nous tous."
portugal.55.t:0 "Le Portugal demande un pacte de non-agression"
portugal.55.d:0 "L’ambassadeur portugais des Affaires étrangères a récemment approché son homologue à Madrid pour demander officiellement un pacte de non-agression et la pleine normalisation des relations luso-espagnoles. Que devons-nous répondre à nos frères péninsulaires ?"
portugal.55.a:0 "Bien sûr ! Éviter la guerre sur la péninsule est dans l’intérêt de tous !"
portugal.55.b:0 "Leurs affaires ne nous intéressent pas !"
portugal.56.t:0 "Les Espagnols ont accepté !"
portugal.56.a:0 "Excellente nouvelle !"
portugal.57.t:0 "Les Espagnols ont refusé !"
portugal.57.a:0 "Dom- mage."
portugal.74.title:0 "Le Portugal propose d’unir la péninsule"
portugal.74.desc:0 "Alors que le Portugal comme nous avons triomphé dans notre lutte pour la survie face au fascisme, les appels à l’unité entre nos nations se multiplient. L’ambassadeur [POR.GetAdjective] des Affaires étrangères, avec l’appui du gouvernement national, propose un projet de gouvernement ibérique unifié, capable de tenir tête au fascisme dans le monde entier.\n\nQue répondre à nos amis de Lisbonne ?"
portugal.74.a:0 "Après tout ce que nous avons vécu, comment dire non à nos camarades d’armes ?"
portugal.74.b:0 "L’heure n’est pas à une telle union, mais nous renforcerons notre coopération !"
portugal.74.c:0 "Vous pensez vraiment être aux commandes ?"
portugal.75.title:0 "[POR.GetNameDefCap] souhaite étendre la coopération défensive"
portugal.75.desc:0 "L’ambassadeur [POR.GetAdjective] des Affaires étrangères a récemment approché son homologue à Madrid pour demander officiellement un élargissement de la coopération militaire entre nos nations.\n\nAlors que l’Europe s’ensanglante de semaine en semaine, que répondre à nos amis de Lisbonne ?"
portugal.75.a:0 "Signons une alliance totale ! L’ennemi de l’un sera l’ennemi de l’autre !"
portugal.75.b:0 "Un pacte de défense mutuelle est dans l’intérêt de nos deux pays !"
portugal.75.c:0 "Cette ambition [POR.GetAdjective] n’est pas dans l’intérêt de l’Espagne."
portugal.76.title:0 "[FROM.GetNameDefCap] accepte"
portugal.76.desc:0 "[FROM.GetNameDefCap] a officiellement répondu, s’engageant à apporter un plein soutien militaire à notre cause. C’est une excellente journée pour nos deux nations."
portugal.77.title:0 "[FROM.GetNameDefCap] accepte une coopération plus étroite"
portugal.77.desc:0 "[FROM.GetNameDefCap] a officiellement répondu qu’une alliance offensive est exclue pour l’instant, mais qu’un traité de défense mutuelle ainsi qu’une étroite coopération militaire constituent une initiative qu’ils sont prêts à soutenir."

POR_consolidate_the_revolution:0 "Consolider la révolution"
POR_consolidate_the_revolution_desc:0 "Les forces réactionnaires ont fait reculer le Portugal de plusieurs décennies. Malgré nos victoires, la révolution ne triomphera vraiment que lorsque toute menace de réaction sera annulée à jamais !"

POR_reopen_the_national_propaganda_secretariat:0 "Rouvrir le Secrétariat national à la propagande"
POR_reopen_the_national_propaganda_secretariat_desc:0 "Même victorieuse sur le champ de bataille, notre révolution doit rester vigilante : les menaces de contre-révolution rôdent encore !"
POR_direcao_geral_de_seguranca:0 "Direção-Geral de Segurança"
POR_repurposing_the_spn:0 "Reconversion du SPN"

POR_covert_return_to_the_world_stage:0 "Retour discret sur la scène mondiale"
POR_covert_return_to_the_world_stage_desc:0 "Situés à l’extrême ouest de l’Europe, nous sommes en position idéale pour devenir un bastion du communisme sur le continent. Nous ne transigerons pas dans la destruction des trois grands maux de ce continent : l’impérialisme, le capitalisme et le fascisme !"
POR_seek_an_alliance_with_spain_r56:0 "Chercher une alliance avec l’Espagne"
POR_seek_an_alliance_with_spain_r56_desc:0 "Ces derniers temps ont vu refleurir les relations luso-espagnoles. Allons plus loin et instaurons une coopération élargie !"

POR_diplomatic_pragmatism:0 "Pragmatisme diplomatique"
POR_diplomatic_pragmatism_desc:0 "Nation encore convalescente des horreurs de la guerre, nous devons éviter de nous aventurer dans des affaires étrangères qui ne servent pas les intérêts de [ROOT.GetNameDef]."

POR_join_the_global_fight_against_fascism:0 "Rejoindre la lutte mondiale contre le fascisme"
POR_join_the_global_fight_against_fascism_desc:0 "Nous ne pouvons rester inactifs tandis que le fléau fasciste s’enracine sur notre continent. Tant que le moment l’exige, la démocratie bourgeoise est un mal nécessaire et un allié potentiel dans notre combat contre la menace fasciste en Europe !"
POR_the_global_fight_against_fascism_r56:0 "La lutte mondiale contre le fascisme"
POR_the_global_fight_against_fascism_r56_desc:0 "Nous ne resterons pas les bras croisés pendant que ce mal ronge notre continent. Jusqu’à son éradication, nous combattrons jusqu’au bout pour hâter sa destruction !"

POR_the_red_army_of_the_west:0 "L’Armée rouge de l’Ouest"
POR_the_red_army_of_the_west_desc:0 "Pour retrouver notre place sur la scène mondiale, il est impératif de transformer nos brigades révolutionnaires en une armée moderne, hautement centralisée. L’Armée rouge offre un exemple rusé à suivre."
POR_the_red_army_of_the_west_tt:0 "Les décisions §YRenforcer les organisations socialistes§! §Gamélioreront§! cet esprit national"
POR_integrating_socialist_militias:0 "Intégrer les milices socialistes"
POR_integrating_socialist_militias_desc:0 "Nous intégrons les organisations de milices socialistes à notre cause. Le processus prendra du temps, mais il est capital pour bâtir une armée capable de protéger nos nouvelles valeurs socialistes !"
POR_protectors_of_the_revolution:0 "Protecteurs de la révolution"
POR_protectors_of_the_revolution_desc:0 "Les forces armées de notre république sont fortes, disciplinées et unies sous notre bannière idéologique ! Redoutées par les forces de réaction et de fascisme, elles sont aussi l’outil de la libération de notre peuple !"

POR_the_iberian_social_revolution:0 "La révolution sociale ibérique"
POR_the_iberian_social_revolution_desc:0 "Bien avant la funeste direction de l’Estado Novo de Salazar, le Portugal avait des décennies de retard sur l’Europe de l’Ouest. Abattons cet ordre inégal, détruisons les symboles d’oppression qu’il a utilisés et insufflons une nouvelle ferveur révolutionnaire à notre grand prolétariat !"
POR_promote_revolutionary_artwork:0 "Promouvoir l’art révolutionnaire"
POR_promote_revolutionary_artwork_desc:0 "Les réactionnaires de notre péninsule ont toujours haï ce qui remet en cause la fausse grandeur du catholicisme et du colonialisme. Une nouvelle renaissance naîtra en Europe lorsque nous montrerons au monde les valeurs réelles sur lesquelles repose notre nation !"
POR_suppress_symbols_of_portuguese_aristocracy:0 "Supprimer les symboles de l’aristocratie [ROOT.GetAdjective]"
POR_suppress_symbols_of_portuguese_aristocracy_desc:0 "Assez de ces fadaises : notre peuple ne sera plus jamais entravé par les symboles de notre passé réactionnaire ! Nous lancerons une campagne énergique contre tout symbole potentiel de réaction."

POR_crush_reactionary_impedance:0 "Écraser l’entrave réactionnaire"
POR_crush_reactionary_impedance_desc:0 "Les démocrates [ROOT.GetAdjective] n’ont rien appris des errements et de la lenteur de la Première République. Leurs plans pour le Portugal sont une mascarade qui ruinerait l’espoir de prospérité qu’une révolution doit apporter. Eux, comme les derniers salazaristes, doivent être extirpés de la nation à tout prix !"

POR_empower_socialist_organizations:0 "Renforcer les organisations socialistes"
POR_empower_socialist_organizations_desc:0 "Les mouvements de jeunesse sont l’épine dorsale de nombreuses idéologies au XXe siècle. Les mouvements socialistes [ROOT.GetAdjective] sont présents aux quatre coins du pays ; ils recevront le soutien nécessaire pour faire régner nos idées !"
POR_tap_aligned_laborer_organizations:0 "Mobiliser les organisations ouvrières alliées"
POR_tap_aligned_laborer_organizations_desc:0 "Le monde du travail organisé soutient fortement notre gouvernement. Puiser dans cette base nous donnera les moyens de consolider notre emprise sur la nation."
POR_arm_anti_fascist_militias:0 "Armer les milices antifascistes"
POR_arm_anti_fascist_militias_desc:0 "Notre victoire ne s’arrête pas à la fuite ou à la mort de Salazar. Tant que la menace fasciste et réactionnaire subsistera, la résolution de nos grands alliés antifascistes demeurera ! Ils recevront le soutien nécessaire pour affronter la tempête !"
POR_arm_anti_fascist_militias_tt:0 "§GSupprime§! tout soutien restant §Yautoritaire§! et §Yfasciste§!"

POR_towards_institutional_atheism:0 "Vers un athéisme institutionnel"
POR_towards_institutional_atheism_desc:0 "La place de l’Église en politique à travers [ROOT.GetName] est inacceptable. Nous devons mettre fin au règne qu’elle exerce sur nos travailleurs !"
POR_appropriate_church_riches:0 "S’approprier les richesses de l’Église"
POR_appropriate_church_riches_desc:0 "L’Église ne mérite pas et ne méritera jamais les concessions économiques que l’État lui a longtemps accordées. Pour des siècles de privilèges, nous corrigerons cette injustice en lui retirant ses richesses et en les utilisant au profit de l’État !"
POR_stamp_out_clergy_influence:0 "Éradiquer l’influence du clergé"
POR_stamp_out_clergy_influence_desc:0 "La puissance de la religion organisée dans la société [ROOT.GetAdjective] menace la conscience de notre peuple. Nous prendrons des mesures énergiques contre l’influence cléricale qui ronge depuis trop longtemps la société des travailleurs !"

POR_portugals_path_to_marxism_leninism:0 "La voie portugaise vers le marxisme-léninisme"
POR_portugals_path_to_marxism_leninism_desc:0 "En moins de vingt ans, Vladimir Lénine a fait passer la Russie d’un des pays les plus arriérés d’Europe à un bastion de la révolution redouté par l’Occident. Nous devons apprendre de ses accomplissements et les reproduire."
POR_portugals_path_to_socialism:0 "La voie portugaise vers le socialisme"

POR_solidify_the_economic_reforms:0 "Consolider les réformes économiques"
POR_solidify_the_economic_reforms_desc:0 "Nos politiques ont mis les travailleurs sur la voie de la prospérité et de l’égalité. Il est temps de privilégier la stabilisation économique et d’arrêter une ligne cohérente."
POR_our_path_to_economic_development_decisions_taken_6_or_greater_tt:0 "A mené §Y6§! décisions ou plus de §YNotre voie de développement économique§! (Progrès actuel : §Y[?POR_our_path_to_economic_development_decisions_taken]/6§!)"
POR_socialist_market_economy:0 "Économie de marché socialiste"
POR_socialist_market_economy_desc:0 "Nous avons vu les conséquences de collectivisations brutales et ne devons pas les imiter. Une économie de marché est, pour l’heure, suffisante pour stimuler l’innovation et la transformation industrielle ; il serait cynique de prétendre qu’on ne peut y promouvoir des valeurs socialistes."
POR_the_portuguese_new_economic_policy:0 "La nouvelle politique économique portugaise"
POR_the_portuguese_new_economic_policy_desc:0 "La transition soviétique du communisme de guerre vers la NEP de Lénine lui a valu l’appui du monde rural nécessaire pour gagner la guerre civile. Si notre développement économique a encore bien des étapes, la NEP offre un cadre solide sur lequel bâtir !"
POR_the_red_industrial_revolution:0 "La révolution industrielle rouge"
POR_the_red_industrial_revolution_desc:0 "Une politique modérée ne suffit pas à l’industrialisation rapide dont nous avons besoin. Une planification centrale vigoureuse est nécessaire pour instaurer l’économie industrielle socialiste qu’exigent nos travailleurs."

POR_pave_the_path_to_progress:0 "Tracer la voie du progrès"
POR_pave_the_path_to_progress_desc:0 "Notre cause ne triomphera jamais si les victoires d’aujourd’hui deviennent la routine de demain. Assurons-nous que la marche en avant du Portugal ne s’arrête jamais !"

POR_advance_the_cause_for_equality:0 "Faire avancer la cause de l’égalité"
POR_advance_the_cause_for_equality_desc:0 "Nos positions sociales nous placent en situation d’obtenir un fort soutien des femmes [ROOT.GetAdjective], notamment en milieu urbain. Tirons parti de ce fait et faisons réellement progresser l’égalité !"

POR_forge_portugals_own_five_year_plan:0 "Forger le plan quinquennal du Portugal"
POR_forge_portugals_own_five_year_plan_desc:0 "Des siècles de mauvaises politiques et l’obsession bornée de Salazar pour l’austérité ont créé des conditions qui exigent une intervention étatique vigoureuse. Élaborons un plan pour une réelle prospérité des travailleurs !"
POR_forge_portugals_own_five_year_plan_tt:0 "Débloque les décisions §YLa question des nationalisations§!"
POR_the_question_of_nationalization:0 "La question des nationalisations"
POR_the_question_of_nationalization_desc:0 "Nous avons proclamé des orientations générales, mais sans préciser nos politiques. Pour rallier le peuple, des mesures concrètes doivent suivre !"
POR_transitioning_to_a_mixed_economy:0 "Transition vers une économie mixte"
POR_transitioning_to_a_mixed_economy_desc:0 "Un modèle mixte, qui favorise l’initiative tout en protégeant les droits du peuple, a fait ses preuves et stimulera l’innovation à tous les niveaux."
POR_slow_collectivization:0 "Collectivisation graduelle"
POR_slow_collectivization_desc:0 "Une intervention modérée, au service de la croissance industrielle, peut apporter des progrès rapides tout en évitant les chocs constatés ailleurs."
POR_heavy_handed_central_planning:0 "Planification centrale dirigiste"
POR_heavy_handed_central_planning_desc:0 "Une planification appuyée peut apporter les changements rapides requis pour notre industrialisation et l’élévation des droits des travailleurs. Malgré les risques d’instabilité et de baisse temporaire du niveau de vie, l’enjeu en vaut la peine."
POR_looming_economic_disaster:0 "Catastrophe économique imminente"
POR_looming_economic_disaster_desc:0 "Nos politiques sont allées trop loin et affectent gravement la stabilité nationale. Éloignons-nous des collectivisations agressives pour éviter l’effondrement."
POR_our_path_to_economic_development:0 "Notre voie de développement économique"
POR_our_path_to_economic_development_desc:0 "Les travaux publics sont un investissement avisé qui nourrira un Portugal en croissance pendant des années. Les prolonger et en créer de nouveaux profitera à l’économie et montrera que nous stabilisons la nation."
POR_sell_off_seized_assets:0 "Vendre les actifs saisis"
POR_sell_off_seized_assets_desc:0 "Peut-être avons-nous trop saisi d’actifs capitalistes, au détriment de la stabilité. Vendons-en une partie pour financer le redressement de notre position économique."
POR_support_private_collectives:0 "Soutenir les collectifs privés"
POR_support_private_collectives_desc:0 "Les collectifs privés favorisent la croissance tout en garantissant de bonnes conditions de travail. Encourageons la formation de telles structures."
POR_land_redistribution:0 "Réforme agraire"
POR_land_redistribution_desc:0 "La répartition des terres à travers [ROOT.GetNameDef] est depuis longtemps scandaleusement inégale. Pour corriger cette injustice, nous devons mener une action radicale pour égaliser la propriété foncière dans notre nouvelle république !"

POR_restore_the_social_state:0 "Restaurer l’État social"
POR_restore_the_social_state_desc:0 "Au nom de l’austérité, Salazar a sabré le filet de sécurité du Portugal, menaçant nos conditions de vie. Réparons immédiatement ces ravages !"
POR_subsidize_rural_farming:0 "Subventionner l’agriculture rurale"
POR_subsidize_rural_farming_desc:0 "Les agriculteurs sont l’un des piliers de l’économie [ROOT.GetAdjective] et auront besoin de notre aide pour réussir. Donnons-leur les moyens de moderniser leurs pratiques et de générer de grands rendements !"
POR_invest_in_public_education:0 "Investir dans l’éducation publique"
POR_invest_in_public_education_desc:0 "Dans l’intérêt national, investissons davantage dans l’éducation de la jeunesse de [ROOT.GetNameDef]. Allouer des fonds pour quasi éradiquer l’analphabétisme est un noble objectif."

POR_end_the_educational_abyss:0 "Mettre fin à l’abîme éducatif"
POR_end_the_educational_abyss_desc:0 "Nous ne pouvons plus tolérer que le Portugal reste l’un des pays les plus obstinément analphabètes d’Europe. Des programmes d’éducation publique sont indispensables pour rejoindre le niveau des autres nations occidentales."

POR_escalate_the_industrialization:0 "Accélérer l’industrialisation"
POR_escalate_the_industrialization_desc:0 "Malgré notre passé d’ancienne puissance et des siècles de rapines, nous accusons un siècle de retard sur Britanniques et Allemands. Nous ne redeviendrons pas une nation moderne si nous acceptons cet arriérisme !"
POR_factory_recruitment_drive:0 "Campagne de recrutement pour les usines"
POR_factory_recruitment_drive_desc:0 "Les usines qui alimentent notre industrie de guerre manquent cruellement de bras. Nous lancerons des campagnes de recrutement par tous moyens pour fournir à nos arsenaux les travailleurs dont ils ont besoin !"
POR_direct_farmland_to_industrial_projects:0 "Convertir des terres agricoles à l’industrie"
POR_direct_farmland_to_industrial_projects_desc:0 "Triste vérité : l’agriculture comme source principale de revenus appartient au passé. Pour devenir une nation véritablement industrialisée et développée, nous devons réduire son emprise sur des terres cruciales afin d’accélérer notre industrialisation."

POR_prepare_for_a_war_of_annihilation:0 "Se préparer à une guerre d’anéantissement"
POR_prepare_for_a_war_of_annihilation_desc:0 "Nul doute que les nations occidentales complotent notre destruction. Assurons-nous que le pays soit prêt à défendre nos valeurs révolutionnaires !"

POR_restore_civil_liberties:0 "Rétablir les libertés civiles"
POR_restore_civil_liberties_desc:0 "Nous n’avons pas saigné pour désarmer Salazar afin de subir un nouveau régime tyrannique. Offrons à nos travailleurs ce qu’ils méritent vraiment : la liberté et la justice !"
POR_portugals_road_to_democracy:0 "La route du Portugal vers la démocratie"
POR_portugals_road_to_democracy_desc:0 "Ce serait une tragédie que notre lutte contre la tyrannie salazariste débouche sur un autre régime brutal. Instituons un gouvernement véritablement issu du peuple qui s’est tant battu pour notre cause !"
POR_restore_civil_liberties_tt:0 "Débloque les décisions §YRétablir les libertés civiles§!"
POR_foment_peace_with_the_church:0 "Favoriser la paix avec l’Église"
POR_foment_peace_with_the_church_desc:0 "Les relations entre l’Église catholique et les gouvernements républicains [ROOT.GetAdjective] ont rarement été productives. Il n’y a pas de meilleur moment qu’aujourd’hui pour entreprendre de résoudre nos différends et laisser chaque individu décider du rôle que la religion doit jouer dans sa vie."
POR_foment_peace_with_the_church_flag:0 "A terminé la décision §YFavoriser la paix avec l’Église§!"

POR_curb_political_militias:0 "Réfréner les milices politiques"
POR_curb_political_militias_desc:0 "L’activité des milices politiques a menacé, et continuera de menacer, la stabilité de notre nation tant que nous n’y mettrons pas fin. Notre révolution ayant triomphé au pays, le moment d’agir est venu."

POR_unity_and_reconciliation:0 "Unité et réconciliation"
POR_unity_and_reconciliation_desc:0 "Nous ne pouvons pas laisser les divisions de la Première République déchirer notre nation. Il est impératif de promouvoir la solidarité et l’unité, et d’écraser sur-le-champ les fractures entretenues par Salazar !"
POR_end_the_political_trials:0 "Mettre fin aux procès politiques"
POR_end_the_political_trials_desc:0 "La poursuite des procès politiques ne fait qu’attiser les divisions entre les révolutionnaires et ceux qui avaient des griefs légitimes ayant facilité l’ascension de Salazar. Mettre fin à la polarisation de notre société suppose d’achever ces procès qui dressent notre peuple les uns contre les autres."
POR_call_for_reconciliation:0 "Appel à la réconciliation"
POR_call_for_reconciliation_desc:0 "Si nous voulons rétablir les libertés civiles et éliminer la violence politique, nous devons nous opposer à tous ceux, des deux côtés, qui prônent la violence et la vengeance. La paix est notre meilleur chemin, et le peuple doit connaître cette vérité !"

POR_hold_fair_elections:0 "Organiser des élections libres"
POR_hold_fair_elections_desc:0 "Le moment est enfin venu pour le Portugal de revenir à la démocratie. Nous ne devons plus attendre pour donner au peuple ce qu’il mérite vraiment !"
POR_loosen_censorship_policies_flag:0 "A terminé la décision §YAssouplir les politiques de censure§!"
POR_end_the_political_trials_flag:0 "A terminé la décision §YMettre fin aux procès politiques§!"
portugal.58.t:0 "Les élections générales [ROOT.GetAdjective] de [GetYear]"
portugal.58.d:0 "Après plus d’une décennie de dictature et bien d’autres années de chaos et d’incertitude politiques, il n’y a aucun doute : le moment d’apporter la vraie liberté au peuple portugais, c’est aujourd’hui. Les principaux candidats au poste de Premier ministre sont :\n\nJosé Norton de Matos, ancien ministre de la Guerre et haut-commissaire de l’Angola. Modéré, il privilégierait le libéralisme politique et l’État de droit, en abandonnant largement les politiques économiques socialistes.\n\nJosé Domingues dos Santos, ancien Premier ministre durant les années de la Première République, ayant aussi occupé de nombreux postes de premier plan dans des gouvernements républicains. À l’instar de Norton de Matos, il chercherait sans doute à renforcer les institutions démocratiques, tout en s’engageant pour un solide État social et des réformes du travail, mais en renonçant aux nationalisations forcées et à d’autres mesures économiques radicales.\n\nBento António Gonçalves, secrétaire actuel du Parti communiste, qui a joué un rôle clé dans la chute du gouvernement de Salazar. Malgré son soutien de longue date aux idéologies socialistes autoritaires, il s’est montré, dans l’élan des réformes démocratiques, disposé à légiférer dans ce cadre. Il ne fait guère de doute que ses politiques économiques se poursuivraient largement, mais l’équilibre politique et la cadence de sa transition socialiste restent incertains.\n\nLa question est posée au peuple du Portugal. Qui nous guidera vers notre nouvel âge d’or ?"
portugal.58.a:0 "Matos, et son engagement inébranlable envers la nation, forgera un avenir plus radieux !"
portugal.58.b:0 "L’héritage de bonne gouvernance de Santos portera le Portugal vers l’avant !"
portugal.58.c:0 "La démocratie teintée de rouge de Gonçalves forgera un avenir meilleur pour notre peuple !"

POR_restore_economic_stability:0 "Rétablir la stabilité économique"
POR_restore_economic_stability_desc:0 "Il est temps de laisser de côté les réformes économiques radicales et déstabilisatrices. Notre voie consiste à bâtir une économie véritablement équitable qui améliore les conditions de nos travailleurs !"
POR_our_path_to_economic_development_decisions_taken_4_or_greater_tt:0 "A mené §Y4§! décisions ou plus de §YNotre voie de développement économique§! (Progrès actuel : §Y[?POR_our_path_to_economic_development_decisions_taken]/4§!)"
POR_upgrades_the_effects_of_all_our_path_to_economic_development_decisions_tt:0 "§GAméliore§! les effets de toutes les décisions §YNotre voie de développement économique§!."
POR_portuguese_mixed_economy:0 "Économie mixte portugaise"
POR_portuguese_mixed_economy_desc:0 "Si l’Estado Novo n’a pas servi l’économie de nos travailleurs, il est impératif de reconnaître ses rares domaines de réussite. Une économie stable, qui accorde une certaine récompense aux plus productifs, est importante pour notre développement national."
POR_democratic_collectivization:0 "Collectivisation démocratique"
POR_democratic_collectivization_desc:0 "Même si nombre de nos frères révolutionnaires sont trop brutaux dans leur approche, il est clair qu’une action décisive est nécessaire pour placer [ROOT.GetNameDef] sur une trajectoire économique viable. Une économie fortement planifiée est un élément nécessaire pour atteindre nos objectifs industriels tout en promouvant les droits des travailleurs à chaque étape."

POR_accommodate_europes_balance_of_power:0 "Préserver l’équilibre des puissances en Europe"
POR_accommodate_europes_balance_of_power_desc:0 "Malgré le travail accompli à Versailles, le revanchisme expansionniste est devenu la politique étrangère de bien trop de nations. Tout ordre sur le continent, si fragile soit-il, doit être protégé à tout prix."

POR_merit_above_ideology:0 "Le mérite avant l’idéologie"
POR_merit_above_ideology_desc:0 "La paix quitte rapidement le continent européen, et le Portugal doit être prêt. Que cela nous plaise ou non, la protection de la nation passe avant tout bénéfice d’une politisation accrue de nos forces armées."
POR_restoring_the_portuguese_armed_forces:0 "Restauration des forces armées [ROOT.GetAdjective]"
POR_expand_civil_amnesty:0 "Étendre l’amnistie civile"
POR_reintegrate_former_officers:0 "Réintégrer les anciens officiers"
POR_reintegrate_former_officers_flag:0 "A terminé la décision §YRéintégrer les anciens officiers§!"
POR_depoliticized_military:0 "Armée dépolitisée"

POR_western_europes_model_democracy:0 "Le modèle démocratique de l’Europe de l’Ouest"
POR_western_europes_model_democracy_desc:0 "En quelques années à peine, nous avons tiré [Root.GetNameDef] de son statut d’arrière-cour de l’Europe occidentale pour en faire une démocratie moderne qui promeut les libertés civiles et un équilibre des pouvoirs. Nous sommes la lumière au milieu des ténèbres sur notre continent !"
POR_red_tinted_democracy:0 "Démocratie teintée de rouge"
POR_red_tinted_democracy_desc:0 "En quelques années à peine, nous avons tiré [Root.GetNameDef] de son statut d’arrière-cour de l’Europe occidentale pour en faire une démocratie moderne qui défend l’homme du commun. Nous serons un exemple pour tous ceux qui souffrent sous les dictatures réactionnaires !"

POR_rehabilitate_the_armed_forces:0 "Réhabiliter les forces armées"
POR_rehabilitate_the_armed_forces_desc:0 "La consolidation de notre révolution ne s’achèvera pas par un relâchement de la surveillance de notre corps des officiers. Nous n’arrêterons pas tant que tous ceux qui menacent nos idéaux ne seront plus aux commandes !"
POR_protectors_of_portuguese_democracy:0 "Protecteurs de la démocratie [ROOT.GetAdjective]"
POR_protectors_of_portuguese_democracy_desc:0 "Les forces armées [ROOT.GetAdjective] doivent devenir une force largement apolitique, n’intervenant dans l’État que pour protéger nos valeurs démocratiques. Toute action antidémocratique, quelle qu’en soit l’idéologie, échouera tant que nos bannières flotteront dans le ciel !"
POR_demand_oaths_of_loyalty:0 "Exiger des serments de loyauté"
POR_demand_oaths_of_loyalty_desc:0 "Les réactionnaires dans nos forces armées nuisent à leur efficacité. Il est impératif d’assurer la diffusion de nos idéaux révolutionnaires au cœur de nos institutions militaires. Nous devons exiger immédiatement des serments de loyauté de tous ceux qui pourraient menacer la révolution."
POR_clamp_down_on_anti_revolutionary_dissent:0 "Réprimer la dissidence antirévolutionnaire"
POR_clamp_down_on_anti_revolutionary_dissent_desc:0 "La dissidence contre la révolution demeure répandue au sein de nos forces armées. Redoublons d’efforts pour stabiliser notre emprise sur ces institutions vitales à la défense de la nation."
POR_clamp_down_on_anti_democratic_leftists:0 "Réprimer les gauchistes antidémocratiques"
POR_clamp_down_on_anti_democratic_leftists_desc:0 "La dissidence dans l’armée pourrait gravement menacer la stabilité nationale, alors que diverses forces antidémocratiques s’emparent de pans de nos troupes. Agissons pour que l’État de droit et le libéralisme soient soutenus au sein de nos forces."
POR_army_of_the_revolution:0 "Armée de la révolution"
POR_army_of_the_revolution_desc:0 "Les forces armées de la nation sont devenues les défenseurs acharnés de la révolution populaire. Les troubles civils fomentés par les réactionnaires et les fascistes ne triompheront plus jamais tant que nos bannières flotteront dans le ciel !"

POR_modernize_the_junta_institutions:0 "Moderniser les institutions de la junte"
POR_modernize_the_junta_institutions_desc:0 "Si nous voulons restaurer notre statut parmi les nations européennes, nous devons poursuivre notre transition vers un gouvernement civil libre."
POR_a_new_status_for_the_colonies:0 "Un nouveau statut pour les colonies"
POR_a_new_status_for_the_colonies_desc:0 "Si nous avons atteint un niveau impressionnant d’intégration linguistique et créé une large population mestiça civilisée dans nos colonies, nous devons reconnaître les échecs de la mission civilisatrice. Une transition vers une véritable autonomie de nos colonies, du moins pour l’instant, est la seule façon d’assurer notre autorité sur ces lointaines provinces très peuplées."
POR_organize_guinean_provincial_elections:0 "Organiser des élections provinciales en Guinée"
POR_organize_mozambican_provincial_elections:0 "Organiser des élections provinciales au Mozambique"
POR_organize_angolan_provincial_elections:0 "Organiser des élections provinciales en Angola"
POR_create_a_constitutional_judiciary:0 "Créer une juridiction constitutionnelle"
POR_create_a_constitutional_judiciary_desc:0 "Notre révolution étant consolidée, nous devons garantir la pérennité des institutions libérales. Une cour judiciaire apolitique, chargée d’interpréter les lois, serait précieuse pour régler des différends qui, autrement, consumeraient notre Assemblée nationale."

POR_continue_popular_reform:0 "Poursuivre les réformes populaires"
POR_continue_popular_reform_desc:0 "La consolidation de notre autorité – et, plus important encore, de la démocratie [ROOT.GetAdjective] – ne doit pas consister à braquer un fusil sur la tempe du peuple. Gagner son véritable soutien est notre meilleur chemin !"

POR_fortify_portuguese_democracy:0 "Fortifier la démocratie [ROOT.GetAdjective]"
POR_fortify_portuguese_democracy_desc:0 "Notre démocratie révolutionnaire n’est pas la première du Portugal. Nous devons continuer à protéger nos nouvelles valeurs."

# Politique – Historique (maintenir la dictature de Salazar)
POR_continue_salazars_policies:0 "Poursuivre les politiques de Salazar"
POR_continue_salazars_policies_desc:0 "Malgré des décennies d’instabilité et les ravages de la Grande Dépression, l’Estado Novo de Salazar a apporté au pays stabilité politique et succès économique. Il reste beaucoup à faire, mais Salazar a plus que prouvé que la nation est mieux sous sa sage direction !"
POR_deus_patria_e_familia:0 "Deus, Pátria e Família"
POR_deus_patria_e_familia_desc:0 "Malgré des décennies d’instabilité et les ravages de la Grande Dépression, l’Estado Novo de Salazar a apporté à la fois stabilité politique et succès économique. Il reste beaucoup à faire, mais Salazar a plus que prouvé que la nation est mieux sous sa sage direction !"
POR_support_the_spanish_nationalists_aut:0 "Soutenir les nationalistes espagnols"
POR_support_the_spanish_nationalists_aut_desc:0 "La société espagnole sombre chaque jour un peu plus dans le chaos. La perspective d’une nation socialiste sur la péninsule Ibérique est inacceptable, et deviendra d’autant plus probable que nous tarderons. Aider les nationalistes dans leur juste lutte est pragmatique et logique !"
POR_support_the_spanish_nationalists_tt:0 "Débloque l’envoi de volontaires vers toute §YEspagne nationaliste§! §Yautoritaire§! ou §Yfasciste§!."

POR_found_the_portuguese_legion:0 "Fonder la Légion portugaise"
POR_found_the_portuguese_legion_desc:0 "La longue instabilité de la politique [ROOT.GetAdjective] montre la nécessité d’une organisation étatique regroupant les plus loyaux au régime. Avec notre appui, le Portugal aura son propre Freikorps contre le fléau bolchevique !"
POR_the_portuguese_legion:0 "La Légion portugaise"
POR_the_portuguese_legion_desc:0 "La Légion portugaise est une paramilitaire créée par l’Estado Novo de Salazar, chargée de défendre l’héritage spirituel de la nation et de combattre la violence de gauche qui menace notre peuple. En collaboration fréquente avec la police secrète, elle constitue une ligne de défense majeure pour le contrôle du pays par Salazar."

POR_employ_the_propaganda_secretariat:0 "Mobiliser le Secrétariat à la propagande"
POR_employ_the_propaganda_secretariat_desc:0 "Le secrétariat national à la propagande du Portugal peut devenir une force décisive contre tous les ennemis du régime. Donnons-lui les moyens de réussir."
POR_incite_fearmongering:0 "Attiser la peur"
POR_incite_fearmongering_desc:0 "Cachez vos enfants et vos familles, car des traîtres jalonnent notre route vers la prospérité ! Votre dévouement à notre cause est la seule chose qui puisse freiner le fléau bolchevique s’abattant sur toutes nos valeurs !"
POR_propagandize_success_by_the_regime:0 "Propagander les succès du régime"
POR_propagandize_success_by_the_regime_desc:0 "En quelques années, [ROOT.GetNameDef] est passé d’une nation instable et lourdement endettée à un modèle de gouvernance modeste et efficace. Faisons connaître ces victoires au peuple !"

POR_extend_PVDE_security_duties:0 "Étendre les attributions de sécurité de la PVDE"
POR_extend_PVDE_security_duties_desc:0 "Libéraux, syndicalistes et certaines branches monarchistes ont clairement montré leur refus de coopérer avec nos plans. Avant que la situation politique ne dégénère à nouveau, notre PVDE doit agir contre ces forces d’instabilité."

POR_cooperation_with_the_armed_forces:0 "Coopération avec les forces armées"
POR_cooperation_with_the_armed_forces_desc:0 "Notre réorganisation en cours a apporté succès et loyauté au sein des forces armées. Avec elles et le regard vigilant de notre PVDE, les ennemis de l’Estado Novo n’ont aucune chance !"
POR_send_in_the_army:0 "Envoyer l’armée"
POR_send_in_the_army_desc:0 "La menace des milices révolutionnaires empoisonne le quotidien de notre peuple et met la nation en danger. Si nécessaire, l’armée sera appelée pour disperser ces organisations violentes."

POR_silence_militant_revolutionaries:0 "Réduire au silence les révolutionnaires militants"
POR_silence_militant_revolutionaries_desc:0 "La situation nous étant favorable, nous intensifierons l’usage de la force contre les syndicalistes, les marionnettes étrangères et toute autre menace à la stabilité du régime !"
POR_ligering_republican_unrest:0 "Agitation républicaine persistante"
POR_ligering_republican_unrest_desc:0 "Bien que leur influence se fasse encore sentir, l’instabilité et la menace que font peser les socialistes mécontents sur le régime ont nettement diminué. Nous pouvons enfin proclamer que la stabilité est revenue."

POR_utilize_the_budget_surplus:0 "Utiliser l’excédent budgétaire"
POR_utilize_the_budget_surplus_desc:0 "Grâce à nos politiques fiscales avisées, nous avons dégagé un excédent que nous pouvons investir pour la richesse nationale. Récompensons nos loyaux sujets pour tout ce que nous avons accompli !"

POR_fight_price_instability:0 "Lutter contre l’instabilité des prix"
POR_fight_price_instability_desc:0 "Si nous voulons conserver le soutien des différentes classes de notre nation, nous devons poursuivre l’action vigoureuse contre l’instabilité des prix."

POR_push_forward_modest_social_benefits:0 "Avancer des prestations sociales modestes"
POR_push_forward_modest_social_benefits_desc:0 "Nous devrions affecter une partie de notre surplus budgétaire à un État social modeste, promouvant les valeurs du régime."

POR_support_for_portuguese_landowners:0 "Soutien aux propriétaires terriens [ROOT.GetAdjective]"
POR_support_for_portuguese_landowners_desc:0 "L’aristocratie portugaise a longtemps été loyale au régime et constitue une source de financement pour nos grands travaux. Récompensons cette loyauté en garantissant que nous ne remettrons pas en cause le statu quo lucratif."

POR_limited_economic_populism:0 "Populisme économique limité"
POR_limited_economic_populism_desc:0 "Pour maintenir le soutien populaire face à l’influence des idéologies socialistes sur la péninsule, nous devons renforcer nos promesses envers la classe ouvrière. Sans détruire les fondations de notre économie, nous pouvons donner davantage et récompenser nos sujets loyaux."

POR_expand_ministerial_control:0 "Accroître le contrôle ministériel"
POR_expand_ministerial_control_desc:0 "Notre sage gouvernance a apporté au Portugal une stabilité inconnue sous la République. Même si cela suscite une certaine résistance interne, ne perdons pas de temps à étendre notre emprise afin de récompenser les loyaux et d’écraser les traîtres."
POR_tighten_the_regime:0 "Durcir le régime"
POR_tighten_the_regime_desc:0 "Profitons de l’occasion pour renforcer notre pouvoir et écraser l’opposition persistante."
POR_make_examples_of_the_opposition:0 "Faire des exemples parmi l’opposition"
POR_make_examples_of_the_opposition_desc:0 "Querelles internes, appels à la violence, appels à renverser l’ordre que nous avons peiné à établir… est-ce là ce pour quoi notre peuple devrait se battre ? Modération et stabilité suffisent pour mener la nation à la prospérité !"
POR_crush_lingering_leftist_opposition_AUT:0 "Écraser l’opposition de gauche persistante"
POR_crush_lingering_leftist_opposition_AUT_desc:0 "La menace que fait peser le socialisme sur le peuple [ROOT.GetAdjective] s’estompe de jour en jour, mais cela ne signifie pas que nous puissions tolérer sa survie. Les fruits de la victoire étant proches, redoublons d’efforts contre cette menace avant que ces fous ne se réorganisent !"

POR_modernize_our_security_apparatus:0 "Moderniser notre appareil de sécurité"
POR_modernize_our_security_apparatus_desc:0 "Qu’il s’agisse du MI6, du NKVD ou des organisations anticoloniales, il devient crucial pour une nation comme la nôtre de disposer d’infrastructures de sécurité capables de détecter et détruire les menaces à notre sûreté nationale."

POR_strengthen_the_portuguese_youth:0 "Renforcer la Jeunesse portugaise"
POR_strengthen_the_portuguese_youth_desc:0 "La Jeunesse portugaise, branche essentielle de la Légion portugaise, favorisera une culture de loyauté et de dévouement à la nation. Renforçons-la et réduisons ses similitudes avec d’autres modèles étrangers."
POR_francisco_jose_nobre_guedes:0 "Francisco José Nobre Guedes"
POR_secretariat_of_national_information:0 "Secrétariat à l’information nationale"
POR_secretariat_of_national_information_desc:0 "Face à la montée de la propagande comme outil de subversion de l’indépendance des nations, nous devons disposer de notre propre institut, prêt à défendre les acquis de l’Estado Novo."

POR_government_of_national_consensus:0 "Gouvernement de consensus national"
POR_government_of_national_consensus_desc:0 "Par une action résolue et un engagement envers des politiques consensuelles, nous avons obtenu le soutien populaire nécessaire pour asseoir véritablement notre juste autorité sur le Portugal."
POR_does_not_have_national_spirit_disgruntled_republicans_tt:0 "Ne possède pas l’esprit national §YRépublicains mécontents§!"

POR_solidify_popular_support:0 "Consolider le soutien populaire"
POR_solidify_popular_support_desc:0 "Si nous jouissons d’une grande loyauté au sein de nos forces armées et de nos factions internes, nous devons aussi adopter des politiques qui renforceront le soutien populaire à travers tout le Portugal."

POR_promote_national_catholicism:0 "Promouvoir le catholicisme national"
POR_promote_national_catholicism_desc:0 "L’identité du Portugal en tant que nation catholique est importante pour l’homme du commun. Tandis que des régimes athées renversent les principes qui guident leurs peuples, nous, nous resterons fidèles à ceux qui guident le nôtre !"
POR_seek_concordat_with_the_holy_see:0 "Rechercher un concordat avec le Saint-Siège"
POR_seek_concordat_with_the_holy_see_desc:0 "Le catholicisme demeure essentiel dans la vie du peuple [ROOT.GetAdjective]. Rejoindre l’Italie, la Yougoslavie et l’Autriche en concluant un concordat avec le Vatican contribuerait grandement à légitimer notre autorité sur la nation."
POR_embrace_pluricontinentalism_aut:0 "Adopter le pluricontinentalisme"
POR_embrace_pluricontinentalism_aut_desc:0 "Nos colonies africaines ont longtemps été vitales à la réussite de l’économie [ROOT.GetAdjective], et notre mission civilisatrice a porté ses fruits, tant dans la diffusion de la langue portugaise que dans la promotion des autres symboles de notre culture d’exception. Si nous voulons conserver ces prestigieux atouts, assumons notre identité pluricontinentale et affirmons que les indigènes de nos nombreuses colonies ont le potentiel de devenir pleinement [ROOT.GetAdjective]."

POR_long_term_economic_planning:0 "Planification économique à long terme"
POR_long_term_economic_planning_desc:0 "La Grande Dépression étant en grande partie derrière nous et la stabilité restaurée au Portugal, mettons en œuvre des politiques qui hisseront notre pays au premier plan et donneront à notre peuple la récompense qu’il mérite pour son courage constant."

POR_tackle_demands_from_urban_centers:0 "Répondre aux demandes des centres urbains"
POR_tackle_demands_from_urban_centers_desc:0 "Si nous voulons conserver un soutien acceptable dans les centres urbains, nous devons fournir à ces régions ce dont elles ont besoin pour apporter succès et prestige à la nation."

POR_protectors_of_the_countryside:0 "Protecteurs des campagnes"
POR_protectors_of_the_countryside_desc:0 "Le plus grand crime de la jeune république portugaise fut d’abandonner l’humble paysan au chaos de politiques hâtives centrées sur les villes et à un laïcisme malvenu. Plaçons la cause de notre grande classe rurale au cœur de notre politique économique !"
POR_protectors_of_the_countryside_tt:0 "§GAméliore§! les effets de §YSubventionner l’agriculture rurale§! et §YAide sociale maternaliste§!"

POR_plan_for_popular_education:0 "Plan pour l’éducation populaire"
POR_plan_for_popular_education_desc:0 "Il n’y a aucune raison sensée pour qu’une ancienne grande puissance, riche nation d’Europe occidentale, affiche un taux d’alphabétisation en retard d’un siècle sur la Grande-Bretagne ou l’Allemagne. Avançons un plan sensé mais décisif pour garantir un niveau de base d’éducation et d’alphabétisation à tous les Portugais !"

POR_evaluate_the_changing_global_order:0 "Évaluer l’ordre mondial en mutation"
POR_evaluate_the_changing_global_order_desc:0 "L’ordre mondial se dissout rapidement sous l’effet des caprices du radicalisme et de l’expansionnisme. Pour affronter les difficultés à venir, le Portugal doit rester prudent et pragmatique."
POR_evaluate_the_changing_global_order_tt:0 "Débloque des décisions pour §YTraiter de la nouvelle Espagne§!"
POR_come_to_britains_aid:0 "Au secours de la Grande-Bretagne !"
POR_come_to_britains_aid_desc:0 "Les Britanniques ont longtemps été nos protecteurs et ils auront besoin de notre aide dans les épreuves à venir. Nous ferons tout notre possible pour soutenir nos vieux amis !"
POR_come_to_britains_aid_dem_desc:0 "Les Britanniques ont longtemps été nos protecteurs et sont les meilleurs garants de nos valeurs. Nos vieux amis auront notre soutien indéfectible face à la vague de radicalisme qui submerge notre continent !"
POR_contain_JAP:0 "Contenir [JAP.GetNameDef]"
POR_contain_JAP_desc:0 "L’expansionnisme japonais en Asie de l’Est menace gravement la paix régionale et la survie de notre présence outre-mer. Prenons des mesures clés pour contenir ce danger."
POR_expand_military_cooperation_with_the_spanish_r56:0 "Étendre la coopération militaire avec les [SPA.GetAdjective]"
POR_expand_military_cooperation_with_the_spanish_r56_desc:0 "Les relations luso-espagnoles se sont de nouveau épanouies ces derniers temps. Allons plus loin en instaurant une coopération plus large !"

POR_portugal_first:0 "Le Portugal d’abord !"
POR_portugal_first_desc:0 "La plus grande erreur du Portugal au XXe siècle fut notre désastreuse entrée dans la Grande Guerre, qui mena à une instabilité indicible et à la chute du gouvernement civil de Costa. L’Estado Novo ne mourra pas comme un chien !"

POR_expand_the_resource_trade:0 "Étendre le commerce des ressources"
POR_expand_the_resource_trade_desc:0 "Nous sommes en position de tirer grand profit des besoins de guerre des puissances européennes. Continuons d’ouvrir notre économie aux pays qui réclament nos ressources."

POR_embrace_the_capital_of_espionage:0 "Assumer le statut de capitale de l’espionnage"
POR_embrace_the_capital_of_espionage_desc:0 "Lisbonne abrite de nombreux agents de puissances étrangères, souvent plus intéressés par l’activité d’autres nations que par les affaires du Portugal. Lorsqu’elles ne menacent pas notre sécurité nationale, tolérons ces activités pour apprendre de leur présence."

POR_reenter_international_affairs:0 "Réintégrer la scène internationale"
POR_reenter_international_affairs_desc:0 "Notre plus grande erreur durant la Grande Guerre fut la diplomatie timorée de notre gouvernement, qui se conclut par une entrée non préparée dans le conflit. Soyons prêts et revenons sans tarder aux affaires du monde !"

POR_integrate_with_the_western_economies:0 "S’intégrer aux économies occidentales"
POR_integrate_with_the_western_economies_desc:0 "Nos alliés d’Europe occidentale ont le potentiel de devenir des partenaires commerciaux majeurs du Portugal. Encourageons l’interconnexion économique pour notre bénéfice mutuel."
POR_economic_interdependency:0 "Interdépendance économique"
POR_economic_interdependency_desc:0 "Convaincus que le commerce entre alliés est un atout mutuel pour l’effort de guerre, nous adoptons une politique qui favorise l’interdépendance."

POR_allied_intelligence_cooperation:0 "Coopération du renseignement alliée"
POR_allied_intelligence_cooperation_desc:0 "Nous avons beaucoup à gagner d’une coopération technologique avec nos alliés. Approfondissons-la sans tarder."

POR_international_and_state_defense_force:0 "Force internationale et de défense de l’État"
POR_international_and_state_defense_force_desc:0 "Le Portugal d’aujourd’hui est une nation hautement pluricontinentale, exposée à d’innombrables menaces contre son indépendance effective. Ces besoins culminent dans la création d’une organisation ultime au service de notre renseignement."

# Politique – Fasciste + Restauration de la monarchie
POR_restore_valiance_to_the_nation:0 "Rendre sa vaillance à la nation"
POR_restore_valiance_to_the_nation_desc:0 "Malgré la stabilité apportée par l’Estado Novo, la modestie de Salazar étrangle le potentiel du Portugal : devenir une grande puissance capable de défier le fléau du communisme dans le monde. L’occasion venue, nous forgerons un nouveau Portugal, phare du fascisme sur la péninsule Ibérique !"
POR_the_battle_for_the_nation:0 "La bataille pour la nation"
POR_restore_valiance_to_the_nation_category:0 "Redonner sa vaillance au Portugal"
POR_restore_valiance_to_the_nation_category_desc:0 "Malgré la stabilité apportée par l’Estado Novo, la modestie de Salazar étrangle le potentiel du Portugal : devenir une grande puissance capable de défier le fléau du communisme dans le monde. L’occasion venue, nous forgerons un nouveau Portugal, phare du fascisme sur la péninsule Ibérique !"

POR_one_revolution_to_end_them_all:0 "Une révolution pour les abolir toutes"
POR_one_revolution_to_end_them_all_desc:0 "Chaque mois où la domination de Salazar perdure aggrave la lutte des classes et fige la nation. La voie est claire : le règne de Salazar doit finir violemment, par une action rapide et décisive !"
POR_one_revolution_to_end_them_all_tt:0 "À l’achèvement de §YMarcher sur Lisbonne§!, §Rune guerre civile éclatera !§!"

POR_utilize_fascist_labor_organizations:0 "Mobiliser les organisations ouvrières fascistes"
POR_utilize_fascist_labor_organizations_desc:0 "Le XXe siècle a popularisé de nouvelles tactiques politiques : mouvements de jeunesse, syndicats alignés, etc. Nous pouvons placer ces organisations au cœur de la conquête des cœurs et des esprits."
POR_arm_fascist_trade_unions:0 "Armer les syndicats fascistes"
POR_arm_fascist_trade_unions_desc:0 "Les organisations ouvrières fascistes sont notre meilleur atout contre l’accusation de servir autre chose que l’homme du commun. Tandis que Salazar écrase toute organisation du travail, frappons avec une détermination sans faille !"
POR_sway_leftist_factory_workers:0 "Rallier les ouvriers d’usine de gauche"
POR_sway_leftist_factory_workers_desc:0 "Si le communisme est indubitablement une idéologie maléfique, nos grands ouvriers industriels ont mille griefs contre les effets du capitalisme au Portugal. Annonçons, dès le premier jour, notre plan pour travailler sans relâche à leur prospérité."

POR_mobilize_countryside_support:0 "Mobiliser le soutien des campagnes"
POR_mobilize_countryside_support_desc:0 "Même si les zones rurales [ROOT.GetAdjective] soutiennent fermement le régime actuel, des politiques sociales et économiques en leur faveur pourraient nous gagner leurs voix."
POR_affirm_support_for_land_reform:0 "Affirmer le soutien à la réforme agraire"
POR_affirm_support_for_land_reform_desc:0 "La campagne [ROOT.GetAdjective] demeure dans la dèche malgré la fin de la Dépression. C’est la preuve que l’Estado Novo de Salazar se moque de leur condition ! Annonçons un vaste plan de réforme agraire, qui coupera l’herbe sous le pied de toute influence communiste et renforcera notre cause !"

POR_radicalize_salazars_allies:0 "Radicaliser les alliés de Salazar"
POR_radicalize_salazars_allies_desc:0 "L’Estado Novo est une coalition d’idéologies que Salazar est incapable de tenir. Profitons de sa faiblesse — notamment de son soutien tiède, voire absent, à la monarchie — pour unir la droite."

POR_center_stage_against_communism:0 "Au premier plan contre le communisme"
POR_center_stage_against_communism_desc:0 "La droite portugaise est unie sur un point : le socialisme est la plus grande menace pour notre mode de vie et l’idée même de nation portugaise. Nous sommes la seule force capable de défendre les intérêts de classe tout en préservant l’unité nationale !"
POR_antagonize_socialist_organizations:0 "S’en prendre aux organisations socialistes"
POR_antagonize_socialist_organizations_desc:0 "Les véritables menaces à notre mode de vie sont les communistes et les libéraux, non les syndicats nationaux. Nos simples marches pacifiques suffisent à déclencher l’hystérie de ces diables rouges — à notre avantage — tandis que nous balayons leur idéologie pitoyable de la péninsule."

POR_integrate_the_monarchist_opposition:0 "Intégrer l’opposition monarchiste"
POR_integrate_the_monarchist_opposition_desc:0 "L’opposition à Salazar grandit au sein même de son Estado Novo. Dernière étape : unir la nation derrière trois choses — Dieu, la patrie et le roi ! À bas la république !"
POR_tap_monarchist_organizations:0 "Mobiliser les organisations monarchistes"
POR_tap_monarchist_organizations_desc:0 "Salazar a montré un inquiétant manque de soutien au roi légitime de [ROOT.GetNameDef]. En affichant notre loyauté, gagnons le soutien matériel et politique nécessaire au renforcement de notre camp."

POR_march_on_lisbon:0 "Marcher sur Lisbonne"
POR_march_on_lisbon_desc:0 "Le soutien à Salazar s’effrite rapidement. Saisissons l’occasion : marchons sur Lisbonne et mettons fin à cette ère de faiblesse et de compromission !"
POR_half_of_current_authoritarian_support_is_applied_as_a_stability_penalty_tt:1 "La moitié du soutien §YAutoritaire§! actuel est appliquée comme pénalité de §RStabilité§! :\n"
POR_march_on_lisbon_tt:0 "Si l’objectif §YUne révolution pour les abolir toutes§! est terminé :"
portugal.43.t:0 "Les Chemises bleues prennent d’assaut l’Assemblée nationale"
portugal.43.d:0 "Alors que l’emprise de Salazar sur le pouvoir se désagrégeait rapidement, des organisations socialistes et fascistes ont envahi les rues de Lisbonne. Salazar en a profité pour faire appel à l’armée nationale afin d’écraser notre juste cause. Après de longues heures de chaos, de larges pans de l’armée ont fait défection pour rallier notre camp, anéantissant définitivement la menace communiste !"
portugal.43.a:0 "Ce n’est que le début du nouvel âge d’or du Portugal !"
portugal.44.d:0 "Alors que l’emprise de Salazar sur le pouvoir se désagrégeait rapidement, des organisations socialistes et fascistes ont envahi les rues de Lisbonne. Salazar en a profité pour faire appel à l’armée nationale afin d’écraser les diverses milices se disputant la nation. La paix n’a plus sa place au Portugal ; la réalité du jour rend une chose claire :"

POR_economic_shocks:0 "Chocs économiques"
POR_economic_shocks_desc:0 "Le chaos politique et le démantèlement récent des politiques budgétaires de Salazar provoquent de graves difficultés pour l’économie [ROOT.GetAdjective]. Il est temps de placer le Portugal sur une nouvelle voie si nous voulons réussir."
POR_brawling_in_urban_centers:0 "Rixes dans les centres urbains"
POR_brawling_in_urban_centers_desc:0 "Malgré notre emprise croissante sur le pays, des groupes militants — principalement socialistes — mènent des affrontements à travers la nation, cherchant à nous diviser. Ces traîtres doivent être détruits à tout prix !"
POR_faltering_rural_support:0 "Soutien rural vacillant"
POR_faltering_rural_support_desc:0 "La campagne [ROOT.GetAdjective] se montre peu enthousiaste envers les politiques du national-syndicalisme. Nous devrons la conquérir pour éviter un conflit dévastateur dans les régions intérieures."
POR_apathy_throughout_rural_regions:0 "Apathie dans les régions rurales"
POR_growing_rural_support:0 "Soutien rural croissant"
POR_unifier_of_the_countryside:0 "Unificateur des campagnes"
POR_march_on_lisbon_category:0 "Rendre sa vaillance à la nation"
POR_march_on_lisbon_category_desc:0 "Le départ de Salazar n’est que le début de nos grandes ambitions. La menace communiste persiste et la dissidence interne guette : agissons vite pour rendre sa vaillance au Portugal !"

POR_all_against_the_bolshevik_threat:0 "Tous contre la menace bolchevique"
POR_all_against_the_bolshevik_threat_desc:0 "Malgré nos succès au front, le démon bolchevique hante encore notre pays. Tournez-nous vers cette menace sans tarder !"

POR_embark_upon_the_european_continent:0 "Nous lancer sur le continent européen"
POR_embark_upon_the_european_continent_desc:0 "La guerre civile espagnole achevée et notre grandeur retrouvée, il est temps de nous pencher sur les affaires qui engloutissent notre continent."
POR_refuse_the_naval_blockade_decision_tt:0 "Lorsque cette décision est activée, les pays en guerre contre §Y[ENG.GetNameDef]§! débloqueront des décisions pour utiliser nos convois et augmenter leur §YSoutien à la guerre§! en échange d’§Yusines civiles§! hors carte."
portugal.62.t:0 "Traiter la question galicienne"
portugal.62.d:0 "La guerre civile espagnole terminée, il nous faut planifier des relations à long terme avec le nouveau gouvernement de Madrid. En particulier, nous devons répondre à la question galicienne : que faire de nos frères du nord, soumis si longtemps au joug de Madrid ?"
portugal.62.a:0 "Oublions. Le nouveau régime de Madrid pourrait être un allié vital dans les temps à venir !"
portugal.62.b:0 "En échange de la Galice, ils auront notre amitié !"
portugal.62.c:0 "Nous exigerons immédiatement cette terre légitime !"
portugal.63.t:0 "Le Portugal exige la Galice !"
portugal.63.d:0 "Malgré nos revendications anciennes et légitimes, le gouvernement [FROM.GetAdjective] a adressé un ultimatum à notre ambassadeur, exigeant un retrait total de la province de Galice. Que penser de cette exigence ridicule ?"
portugal.64.t:0 "[FROM.GetName] refuse de céder la Galice"
portugal.64.d:0 "Bien que cette terre nous revienne de droit, le gouvernement de [FROM.GetName] a refusé de nous transférer la souveraineté sur la Galice. Que devons-nous faire ?"
portugal.64.a:0 "Ils en connaissent les conséquences."
portugal.64.b:0 "Abandonnons. Une petite province ne vaut pas notre indépendance."
portugal.65.t:0 "[FROM.GetName] nous accorde la Galice"
portugal.65.d:0 "Jour merveilleux pour tout le Portugal : [FROM.GetName] a officiellement accédé à nos demandes de retrait total de la province galicienne."
portugal.65.a:0 "Nos frères du nord sont enfin chez eux !"
portugal.78.title:0 "[POR.GetNameDefCap] propose une coopération en échange de la Galice"
portugal.78.desc:0 "Notre victoire dans la guerre civile à peine acquise, [POR.GetNameDefCap] nous soumet une offre intéressante concernant la Galice :\n\nEn échange de notre retrait complet à leur profit, les [POR.GetAdjective] nous offrent une coopération économique, tout en promettant vaguement de soutenir de possibles revendications irrédentistes [SPA.GetAdjective] dans le monde. Que répondre à nos frères de Lisbonne ?"

POR_peace_with_the_salazaristas:0 "Paix avec les Salazaristes"
POR_peace_with_the_salazaristas_desc:0 "Détenant le contrôle du pays, nous avons déjà accompli un exploit pour notre grande idéologie. Diviser la nation pour un contrôle total n’en vaut pas la peine."

POR_forcefully_nationalize_the_blueshirts:0 "Nationaliser de force les Chemises bleues"
POR_forcefully_nationalize_the_blueshirts_desc:0 "Bien qu’elles aient été essentielles à notre succès, les activités persistantes des Chemises bleues déstabilisent le pays. Pour restaurer l’ordre, nous devons mettre fin aux actions paramilitaires."
POR_restore_the_portuguese_legion_in_our_image:0 "Refonder la Légion portugaise à notre image"
POR_restore_the_portuguese_legion_in_our_image_desc:0 "La Légion portugaise est prometteuse pour cimenter l’unité nationale et rassembler le peuple [ROOT.GetAdjective] de toutes les classes. Y promouvoir nos idéaux renforcera notre contrôle gouvernemental."

POR_crush_moderate_defiance:0 "Écraser la défiance des modérés"
POR_crush_moderate_defiance_desc:0 "Marionnettes de Salazar, certains, malgré la menace communiste, continuent d’affaiblir la nation. Mettons fin à leur défiance avant que leur lâcheté ne nous perde."
POR_harass_reactionary_corporatists:0 "Harceler les corporatistes réactionnaires"
POR_harass_reactionary_corporatists_desc:0 "Les réactionnaires de l’Estado Novo sont une plaie à extirper si nous voulons réaliser nos objectifs. Ces sots ne valent pas mieux que les bolcheviques !"

POR_sponsor_blueshirt_activity:0 "Financer l’activité des Chemises bleues"
POR_sponsor_blueshirt_activity_desc:0 "Les Chemises bleues sont notre principale source de capital politique face aux forces de la réaction et du socialisme. Il est logique de renforcer leur recrutement et leur financement pour en faire une force capable de protéger la nation !"
POR_cement_the_dictatorship:0 "Cimenter la dictature"
POR_cement_the_dictatorship_desc:0 "Nous devons montrer à tout le Portugal que la dictature de Preto est une force pour le bien — et qu’elle restera jusqu’à l’achèvement de sa mission pour la nation. Toute opposition, au sein ou hors du gouvernement, sera écrasée."
POR_strengthen_the_secret_police:0 "Renforcer la police secrète"
POR_strengthen_the_secret_police_desc:0 "La police secrète est l’un de nos meilleurs outils contre les agitateurs socialistes, réactionnaires et libéraux. Donnons-leur les moyens de poursuivre leurs répressions contre toute menace à la stabilité intérieure."
POR_utilize_the_propaganda_ministry:0 "Mobiliser le ministère de la Propagande"
POR_utilize_the_propaganda_ministry_desc:0 "La propagande était un outil largement utilisé par le régime précédent. Inspirons-nous des succès de Salazar : l’emploi du ministère de la Propagande peut grandement renforcer le soutien populaire à notre cause !"
POR_western_europes_anti_communist_baston:0 "Le bastion anticommuniste d’Europe occidentale"
POR_western_europes_anti_communist_baston_desc:0 "Nous, peuple [ROOT.GetAdjective], comptons parmi les plus grands défenseurs mondiaux contre le fléau bolchevique qui menace nos vies à tous. Le monde entier saura et ressentira la justesse de notre lutte !"

POR_forge_a_cult_of_personality:0 "Forger un culte de la personnalité"
POR_forge_a_cult_of_personality_desc:0 "Chaque sujet de notre grand empire reconnaîtra en Preto l’homme exceptionnel et déterminé qu’il est. Le déclin du Portugal a cessé — et il sera inversé sous son règne inflexible !"
charismatic_dictator:0 "Dictateur charismatique"

POR_reorientate_the_economy:0 "Réorienter l’économie"
POR_reorientate_the_economy_desc:0 "Sous Salazar, les coupes massives ont frappé à la fois l’État social et nos fières forces armées. Notre nation renaissante ne peut plus être étranglée par ces politiques budgétaires ineptes !"

POR_draft_portugals_own_labor_charter:0 "Rédiger la charte du travail portugaise"
POR_draft_portugals_own_labor_charter_desc:0 "Il est temps de montrer à notre forte classe ouvrière urbaine que nous avons un plan plaçant ses besoins au premier rang, tandis que nous consolidons davantage notre pouvoir. Sous notre sage conduite, le Portugal sera une nation d’avenir !"
POR_towards_a_national_syndicalist_state:0 "Vers un État national-syndicaliste"

POR_support_fascist_labor_organizations:0 "Soutenir les organisations ouvrières fascistes"
POR_support_fascist_labor_organizations_desc:0 "Les organisations ouvrières adossées au parti symbolisent la force et le prestige des grandes valeurs de notre régime. Assurons-nous qu’elles disposent du soutien nécessaire pour accroître l’ancrage du régime dans la nation."
POR_completion_of_these_decisions_reduces_the_lingering_effects_of_economic_shocks_tt:0 "L’achèvement de ces §Ydécisions§! §Gréduit§! les effets persistants des §YChocs économiques§!"
POR_nationalize_struggling_industries:0 "Nationaliser les industries en difficulté"
POR_nationalize_struggling_industries_desc:0 "De nombreuses entreprises [ROOT.GetAdjective] ont souffert de l’instabilité récente. Profitons de l’occasion pour intervenir et solidifier notre contrôle sur l’économie !"

POR_syndicalize_the_vital_sectors:0 "Syndicaliser les secteurs vitaux"
POR_syndicalize_the_vital_sectors_desc:0 "Le travailleur [ROOT.GetAdjective] a assez longtemps subi un état pitoyable d’exploitation. Syndicalisons les secteurs directeurs de l’économie afin que nos grands travailleurs jouissent des droits qu’ils méritent — et qu’ils reçoivent notre appui tant que leurs intérêts convergent avec les nôtres."
POR_syndicalization_of_national_industry:0 "Syndicalisation de l’industrie nationale"
POR_syndicalize_the_vital_sectors_tt:0 "§GFusionne§! les effets de §YSyndicaliser les secteurs vitaux§! et §YVers un État national-syndicaliste§! en un esprit national plus puissant"

POR_prioritize_economic_stability:0 "Prioriser la stabilité économique"
POR_prioritize_economic_stability_desc:0 "Le Portugal ne va nulle part sous notre poigne forte. Nous pouvons défendre les intérêts de notre classe ouvrière sans détruire l’ordre économique existant, contrairement aux régimes d’hier."
POR_prioritizing_economic_stability:0 "Priorisation de la stabilité économique"
POR_prioritize_economic_stability_tt:0 "§GFusionne§! les effets de §YPriorisation de la stabilité économique§! et §YVers un État national-syndicaliste§! en un esprit national plus puissant"

POR_revanchist_rearmament:0 "Réarmement revanchard"
POR_revanchist_rearmament_desc:0 "En reniant rapidement la paix de Versailles, l’Europe s’élance de nouveau ! Pour que [ROOT.GetNameDef] rejoigne cette accélération, renforçons avec audace et célérité ses forces armées, et mettons fin à cette ère de paix et de faiblesse !"

POR_catholicism_over_class_struggle_r56:0 "Le catholicisme au-dessus de la lutte des classes"
POR_catholicism_over_class_struggle_r56_desc:0 "Investir dans l’éducation des campagnes est non seulement un droit dû à notre peuple, mais aussi un moyen pragmatique d’apporter l’innovation à ce long arrière-pays du Portugal."
POR_maternalistic_welfare:0 "État-providence maternaliste"
POR_maternalistic_welfare_desc:0 "Que serions-nous pour nous dire protecteurs du peuple si nous négligions la colonne vertébrale de la nation ? Chaque mère de [ROOT.GetNameDef] aura ce qu’il lui faut pour faire éclore une jeunesse prospère et foisonnante !"

POR_restore_prosperity_to_the_nation_r56:0 "Rendre la prospérité à la nation"
POR_restore_prosperity_to_the_nation_r56_desc:0 "À quoi bon revendiquer la défense de la classe ouvrière [ROOT.GetAdjective] si c’était pour négliger ses conditions, comme l’a fait Salazar ? Nos réformes économiques ont apporté de grands succès : qu’elles marquent le début d’un nouvel âge d’or pour l’économie [POR.GetAdjective] renaissante !"

POR_restore_the_empire:0 "Restaurer l’Empire"
POR_restore_the_empire_desc:0 "Notre cause première — la rédemption du Portugal — dépend de la restauration de la dynastie brigantine ! Par Dieu, la patrie et le roi, le Portugal retournera sur la scène mondiale !"
POR_joao_de_almeida:0 "João de Almeida"

POR_request_axis_membership:0 "Demander l’adhésion à l’Axe"
POR_request_axis_membership_desc:0 "Notre vieille amitié avec les Britanniques nous a beaucoup apporté — et se heurte désormais à nos intérêts. Les Allemands établissent un nouvel ordre sur le continent ; le nouveau Portugal en fera partie !"
POR_align_with_rome:0 "S’aligner sur Rome"
POR_align_with_rome_desc:0 "Si notre longue amitié avec les Britanniques nous a servi, il est clair qu’ils ne représentent plus les besoins du Portugal. Les Italiens œuvrent à étendre leur influence en Méditerranée ; une telle configuration épouse visiblement les intérêts [ROOT.GetAdjective] !"

POR_avenge_our_overseas_losses:0 "Venger nos pertes d’outre-mer"
POR_avenge_our_overseas_losses_desc:0 "Il est temps que le Portugal regarde au-delà de ses frontières et ne tolère plus la pitoyable faiblesse de son statut impérial. Remilitarisons-nous agressivement et réaffirmons notre grand héritage impérial — sur-le-champ !"
portugal.66.t:0 "La question de la « carte rose »"
portugal.66.desc:0 "La Grande-Bretagne déclinant et notre grande nation renaissant, il est grand temps d’aborder nos anciennes revendications coloniales africaines. Allons-nous de nouveau poursuivre la jonction du Mozambique et de l’Angola ?"
POR_forge_a_new_luso_spanish_order_r56:0 "Forger un nouvel ordre luso-espagnol"
POR_forge_a_new_luso_spanish_order_r56_desc:0 "À bien des égards, [POR.GetAdjective] et [SPR.GetAdjective] partagent une histoire — y compris, hélas, l’érosion de notre influence par les révoltes et l’ingérence étrangère. Même si le reste du monde nous est hostile, le Portugal et l’Espagne feront tout pour abattre les ennemis de notre souveraineté — comme nous l’avons déjà fait deux fois !"
portugal.66.a:0 "La guerre contre Londres nous détruirait. N’entretenons pas cette revendication pour l’instant."
portugal.66.b:0 "La position de Londres est précaire. Peut-être pouvons-nous en tirer parti…"
portugal.66.c:0 "Nous ne serons pas les premiers à humilier les Britanniques — ni les derniers !"
portugal.66.d:0 "L’emprise britannique faiblit. Attendre notre heure sera sage."
portugal.66.e:0 "La Grande-Bretagne a quitté la région : qui pourrait nous arrêter désormais ?"
portugal.67.t:0 "Le Portugal offre l’amitié contre des revendications coloniales historiques"
portugal.67.d:0 "Alors que le chaos gagne bon nombre de nos anciens dominions, l’ambassadeur portugais nous a rendu une visite inattendue. En échange d’un retour des revendications africaines portugaises du XIXe siècle, ils proposent une alliance globale — qui pourrait servir nos efforts pour restaurer le reste de notre empire. Que répondre à nos vieux amis portugais ?"
portugal.67.a:0 "L’alliance anglo-portugaise sera renforcée !"
portugal.67.b:0 "C’est absurde — évidemment non !"
portugal.80.title:0 "[POR.GetNameDefCap] propose une alliance"
portugal.80.desc:0 "Dans le sillage du réchauffement luso-espagnol, l’ambassadeur [POR.GetAdjective] a officiellement approché son homologue de Madrid pour proposer une coopération mutuelle. Tout indique que le Portugal cherche un allié pour servir ses ambitions mondiales en nous offrant un rôle dans l’ordre souhaité.\n\nNos empires [POR.GetAdjective] et [SPR.GetAdjective] déclinant depuis longtemps, que répondre à cette offre venue de Lisbonne ?"
portugal.80.b:0 "Une alliance n’est pas dans notre intérêt, mais nous restons ouverts à la coopération"

POR_expand_strategic_production_r56:0 "Étendre la production stratégique"
POR_expand_strategic_production_r56_desc:0 "Alors qu’une guerre juste s’annonce pour notre nation, nous devons tout faire pour conserver notre indépendance économique face au blocus et à la saisie de nos possessions d’outre-mer. Nous ne tomberons pas — jamais !"

POR_prepare_the_african_theater:0 "Préparer le théâtre africain"
POR_prepare_the_african_theater_desc:0 "Nous avons la détermination et la force de reconquérir nos terres perdues, mais l’infrastructure manque cruellement. Engageons-nous dans une montée en puissance militaire agressive dans nos colonies si nous voulons un jour les relier !"
POR_abandoned_african_colonial_claims_flag:0 " A §Rabandonné§! les revendications historiques dans ces terres ou les a déjà reçues"
POR_submit_an_ultimatum_to_britain:0 "Soumettre un ultimatum à la Grande-Bretagne"
POR_submit_an_ultimatum_to_britain_desc:0 "L’occasion de récupérer nos colonies légitimes viendra, mais tentons d’abord la voie pacifique. Adressons à Londres un ultimatum clair : retrait total de nos colonies de droit et reconnaissance de notre légitime autorité sur ces provinces d’outre-mer !"
POR_conquer_rhodesia:0 "Conquérir la Rhodésie"
POR_conquer_rhodesia_desc:0 "L’existence d’un État [ZIM.GetAdjective] pleinement indépendant menace clairement notre présence d’outre-mer. Soumettons un ultimatum à ces sots : capitulation complète dans notre grand empire [ROOT.GetAdjective] !"
POR_subjugate_malawi:0 "Subjuguer le Malawi"
POR_subjugate_malawi_desc:0 "Dotées d’un accès remarquable à l’une des plus grandes réserves mondiales d’eau douce, les terres de [MLI.GetNameDef] seraient un excellent ajout à notre empire ! Qu’est-ce qui nous empêcherait d’exercer nos revendications historiques ?"
POR_end_zambian_independence:0 "Mettre fin à l’indépendance [ZAM.GetAdjective]"
POR_end_zambian_independence_desc:0 "Les terres [ZAM.GetAdjective] constituent l’obstacle principal à la jonction terrestre de nos colonies africaines clés. À présent indépendantes, adressons un message clair à leurs dirigeants : vous vous soumettrez à notre autorité !"
POR_prepare_the_african_theater_tt:0 "Débloque des décisions pour §RExiger§! le contrôle de la §YZambie§!, de la §YRhodésie§! et du §YMalawi§!"
r56_logistical_buildup:0 "Renforcement logistique"
portugal.68.t:0 "Le Portugal exige des concessions en Afrique"
portugal.68.d:0 "L’ambassadeur [POR.GetAdjective] a remis un ultimatum à [ENG.GetLeader], « suggérant amicalement » que nous abandonnions nos garnisons coloniales sur les terres d’Afrique australe historiquement revendiquées par le Portugal. Une mobilisation portugaise étant détectée, que répondre à leurs menaces de guerre ?"
portugal.68.a:0 "Ces fous pensent pouvoir nous tenir tête ?"
portugal.68.b:0 "Vu notre situation, nous n’avons pas le choix."
portugal.69.t:0 "La Grande-Bretagne se retire de nos terres revendiquées !!"
portugal.69.d:0 "Aujourd’hui, la Grande-Bretagne s’est officiellement retirée de nos terres en Afrique, invoquant le « fardeau » que cela représentait pour sa sécurité nationale."
portugal.69.a:0 "Un immense triomphe pour la nation !"
portugal.70.t:0 "La Grande-Bretagne refuse de se retirer !"
portugal.70.d:0 "Londres nous a répondu officiellement : en aucun cas elle ne se retirera des territoires disputés d’Afrique australe."
portugal.71.b:0 "Nous ne nous sommes pas battus pour notre indépendance afin de nous asservir de nouveau !"
portugal.72.t:0 "[FROM.GetName] se soumet à notre autorité !"
portugal.72.d:0 "[FROM.GetName] a officiellement capitulé à notre exigence de subjugation complète à la couronne portugaise. Une grande victoire pour la nation !"
portugal.73.t:0 "[FROM.GetName] a refusé !"
portugal.73.d:0 "La faible et pitoyable nation de [FROM.GetName] a rejeté notre ultimatum. Ces insensés paieront le prix ultime de leur désobéissance."

POR_destabilize_brazil:0 "Déstabiliser le Brésil"
POR_destabilize_brazil_desc:0 "Le Brésil recèle d’innombrables causes et groupes ethniques qui, bien que peu enclins envers Lisbonne, peuvent affaiblir le régime et rendre possible notre annexion de ce territoire bien plus vaste."
r56_gains_claim_on_all_brazilian_states_and_all_states_owned_by_them_tt:0 "Obtient des revendications sur tous les cœurs §Y[BRA.GetAdjective]§! et §Y[URG.GetAdjective]§!, ainsi que sur les États qu’ils possèdent"
portugal.59.t:0 "Le Portugal revendique la couronne sur le Brésil !"
portugal.59.d:0 "Dans un discours incendiaire à Lisbonne, le [POR.GetLeader] portugais a déclaré que le Brésil, « produit de la civilisation portugaise », n’avait pas droit à la poursuite de son autodétermination. Il devient clair que ce Portugal belliqueux est une menace pour la stabilité mondiale."
portugal.59.a:0 "Et dire que je pensais que mes blagues étaient mauvaises."
POR_host_a_royal_wedding_in_brazil:0 "Organiser un mariage royal (Brésil)"
POR_host_a_royal_wedding_in_brazil_desc:0 "Si les sympathies monarchistes modernes au Brésil sont limitées, la reconquête du Brésil reste notre meilleure chance de redevenir une puissance impériale. Célébrer un mariage royal entre notre souverain Duarte de Bragance et la prétendante légitime brésilienne, Maria Francisca, renforcerait le soutien des milieux traditionalistes !"
POR_host_a_royal_wedding_in_brazil_tt:0 "À l’achèvement de §YVenger le désastre de 1821§!, une §Rguerre civile§! éclatera au Brésil !"
portugal.60.a:0 "Nous défendrons la patrie à tout prix !"

POR_avenge_the_1821_disaster:0 "Venger le désastre de 1821 !"
POR_avenge_the_1821_disaster_desc:0 "Le XIXe siècle a transformé le Portugal d’une puissance déclinante en une puissance moribonde. Malgré cette humiliation, en reconquérant promptement le cœur du Brésil, nous montrerons au monde ce que nous pouvons encore devenir !"
POR_avenge_the_1821_disaster_tt:0 "Une guerre civile promonarchiste éclatera au §YBrésil§!, §Rnous y entraînant !§!"
POR_avenge_the_1821_disaster_2_tt:0 "Si la décision §YOrganiser un mariage royal au Brésil§! a été prise, une guerre civile promonarchiste éclatera au §YBrésil§!, §Rnous y entraînant !§!"
POR_proclaim_porto_brazilian_reunification:0 "Proclamer la réunification porto-brésilienne"
POR_proclaim_porto_brazilian_reunification_desc:0 "Après notre victoire écrasante sur un Brésil brièvement divorcé, il est temps d’annoncer notre accomplissement : notre joyau est de retour entre nos mains !"
portugal.61.t:0 "Le Portugal exige une intégration directe"
portugal.61.a:0 "Nous n’avons pas d’autre choix que d’obéir"
POR_integrate_the_brazilian_administration:0 "Intégrer l’administration brésilienne"
POR_integrate_the_brazilian_administration_desc:0 "La conformité à notre autorité augmentant au Brésil, c’est peut-être le moment d’intégrer enfin ces terres longtemps séparées. Par Dieu, la patrie et le roi, nos peuples sont de nouveau unis !"
POR_integrate_the_brazilian_administration_tt:0 "Contrôle et au moins 40 % de conformité dans tous les États côtiers §Ybrésiliens§!"
POR_proclaim_the_fifth_empire:0 "Proclamer le Cinquième Empire"
POR_proclaim_the_fifth_empire_desc:0 "Bastion de civilisation sur tous les continents, nous sommes en position de porter spirituellement, culturellement et linguistiquement notre grande nation portugaise vers l’hégémonie mondiale. À l’image des Grecs et des Romains, gravons notre propre héritage dans le monde !"
POR_has_completed_decision_proclaim_porto_brazilian_reunification_tt:0 "A terminé la décision §YProclamer la réunification porto-brésilienne§!"
POR_repudiate_the_1890_british_ultimatum_flag:0 "A terminé la décision §YRépudier l’ultimatum britannique de 1890§!"
POR_the_fifth_empirer56:0 "Le Cinquième Empire"
POR_the_fifth_empirer56_desc:0 "Bastion de civilisation sur tous les continents, nous sommes en position de porter spirituellement, culturellement et linguistiquement notre grande nation portugaise vers l’hégémonie mondiale. À l’image des Grecs et des Romains, gravons notre propre héritage dans le monde !"
POR_gains_claim_on_all_INS_states_tt:0 "Obtient des revendications sur tous les États §Y[INS.GetAdjective]§!"
POR_gains_claim_on_singapore_brunei_and_all_MAL_states_tt:0 "Obtient des revendications sur §YSingapour§!, §YBrunei§! et tous les États §Y[MAL.GetAdjective]§!"

