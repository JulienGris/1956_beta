l_french:
 #Characters
 POR_antonio_de_oliveira_salazar_desc_r56:0 "António de Oliveira Salazar naquit le 28 avril 1889, dans une vie modeste au village de Vimieiro. N’ayant que 11 ans lors de la chute de la monarchie, Salazar forgea nombre de ses convictions en observant et en vivant le mépris rural pour les turbulences chaotiques et anticléricales qui marquèrent les débuts de la jeune république portugaise.\n\nPoursuivant la pratique de sa foi et ses études, Salazar devint un professeur d’économie très respecté à l’université de Coimbra. Son prestige académique lui valut, à la suite du coup d’État militaire du 28 mai 1926, que le président António Óscar Carmona lui confie un solide contrôle de la politique économique portugaise, où il parvint à créer un excédent budgétaire malgré de fortes turbulences économiques.\n\nCe succès rapide amena le président Carmona à déléguer une grande part de son autorité à ce ministre influent mais humble, qui sert désormais comme président du Conseil des ministres, faisant de lui le second personnage de l’État et le plus influent membre du gouvernement, appelé à diriger l’Estado Novo fondé en 1933."

 POR_bento_goncalves_desc_r56:0 "Bento António Gonçalves naquit le 2 mars 1902, dans la municipalité de Montalegre, où il devint très jeune tourneur-mécanicien dans divers secteurs civils et maritimes.\n\nIl se fit peu à peu un nom en 1924 durant son séjour en Angola portugais, où il soutint l’organisation du mouvement ouvrier dans les industries alimentant le chemin de fer de Luanda.\n\nAprès un engagement au sein du syndicat des travailleurs de la Marine et une visite commémorative à Moscou pour le 10e anniversaire de la Révolution d’Octobre, il fut élu secrétaire général du Parti communiste portugais, charge qu’il conserva malgré son emprisonnement en 1930 et une seconde visite en Union soviétique.\n\nEn 1935, de plus en plus désespérés, nombre de membres du Parti communiste portugais appelèrent à la création d’un Front populaire pour mener une révolte armée contre l’Estado Novo. Cette nouvelle union de la gauche survivra-t-elle maintenant que Gonçalves en tient les rênes ?"

 POR_jose_norton_de_matos_desc_r56:0 "José Norton de Matos naquit le 23 mars 1867, dans le village de Ponte de Lima. Il effectua une grande partie de ses études supérieures d’abord à Lisbonne, puis en mathématiques à Coimbra, avant d’entrer à l’école militaire.\n\nSon service au sein de la nation débuta en 1898, lorsqu’il travailla pour l’administration de l’Inde portugaise. Après des années de service, il rentra au pays pour servir dans les forces armées et devint finalement gouverneur général de l’Angola portugais en 1915.\n\nMatos servit durant la Grande Guerre comme ministre de la Guerre dans les gouvernements de José de Castro, António Almeida et Afonso Costa, avant de s’exiler à Londres après le coup d’État de Sidónio Pais en décembre 1917. À la chute du régime de Pais, Matos revint comme délégué du Portugal à la Conférence de la paix de Paris, puis se retira dans une vie plus discrète, entre diplomatie et fonctions gouvernementales.\n\nÀ la suite des récentes élections nationales, José Norton de Matos se tient prêt, figure de l’ancienne garde, à guider la transition démocratique du pays tout en mettant le Portugal au-dessus de tout !"

 POR_jose_domingues_dos_santos_desc_r56:0 "José Domingues dos Santos naquit le 8 mai 1887, au village de Lavra, au sein d’une modeste famille ouvrière. Il achevait un cursus de droit à l’université de Coimbra lorsque la monarchie fut renversée en 1910, et se fit ensuite une place dans la politique républicaine libérale.\n\nDevenu ministre du Travail et de la Sécurité sociale, Santos prit des mesures modestes en faveur de la classe ouvrière, avant d’être brièvement nommé président du Conseil des ministres en 1924. Il poursuivit ensuite son action au sein de son parti de gauche, le PRED, avant de s’exiler après le coup d’État militaire de Gomes da Costa en 1926.\n\nDe retour au Portugal, Santos s’engage à défendre les principes démocratiques et l’organisation du travail. Ayant gouverné à travers des temps difficiles, José Domingues dos Santos se dit prêt à tracer une voie prospère pour la nation."

 POR_rolao_preto_desc_r56:0 "Francisco de Barcelos Rolão Preto naquit le 12 février 1893, dans le village de Gavião. Après le renversement de la monarchie en 1910, Preto consacra chaque instant à la cause restaurationniste, ce qui lui valut une première incarcération en 1912, dont il s’évada avant de se réfugier en Belgique.\n\nRéfugié, Preto travailla pour la revue Alma Portuguesa, développant et étendant la cause monarchiste, sociale-traditionnaliste, intégraliste qu’il défendait : l’intégralisme lusitanien. Amnistié en 1917, il revint au Portugal, devint rédacteur du journal A Monarquia, appela au syndicalisme économique et participa à plusieurs tentatives de renversement de la république. Le succès vint finalement avec le coup d’État militaire de Gomes da Costa en 1926, repris par Óscar Carmona, ce qui réduisit l’influence de Preto sous ce dernier puis sous l’hostilité de Salazar envers le syndicalisme.\n\nExilé une nouvelle fois en 1934, Preto fréquenta la résidence du célèbre José Antonio Primo de Rivera, de la République espagnole, l’aidant à formuler ses 27 points. De retour au Portugal, Preto a promis de lutter avec ardeur pour l’organisation du travail et un traditionalisme social intransigeant. Inaugurera-t-il une nouvelle ère d’or pour le Portugal ?"

 POR_dom_duarte_nuno:0 "Dom Duarte Nuno"
 POR_king_duarte_nuno:0 "Roi Duarte Nuno"
 POR_king_duarte_nuno_desc:0 "Duarte Nuno de Bragance naquit à Seebenstein, en Autriche, le 23 septembre 1907 ; il n’avait que trois ans lorsque les révolutionnaires portugais renversèrent le bref règne de Manuel II. À la mort inattendue de Manuel II en 1932, Duarte Nuno, son cousin au second degré, détient désormais la plus forte prétention au trône, unissant la cause monarchiste comme légitime prétendant à la couronne portugaise.\n\nAvec le retour de la dynastie bragantine sur le trône, Duarte Nuno se tient prêt à restaurer la stabilité et la fierté de la nation !"

