l_french:
##Ajouter dans l’arbre de priorités le conflit entre l’influence allemande et la Garde de Hlinka plus radicale, imitant de plus en plus les SS et le Parti populaire slovaque (toujours fasciste)
#Gregorij Rožman, évêque slovène anticommuniste
 SLO_generic_focus:0 "Arbre de priorités national slovaque"
#  SLO_fascism_party:0 "SUS" # vanilla est meilleur selon Simpy, sinon à remplacer
#  SLO_fascism_party_long:0 "Slovenská ľudová Strana" # vanilla est meilleur selon Simpy, sinon à remplacer
 SLO_democratic_party:0 "DS"
 SLO_democratic_party_long:0 "Parti démocratique"
#  SLO_communism_party:0 "KSS" # idem vanilla
#  SLO_communism_party_long:0 "Komunistická Strana Slovenska" # idem vanilla
 SLO_neutrality_party:0 "SNS"
 SLO_neutrality_party_long:0 "Parti national slovaque"

 SLO_militarism_focus:0 "Renforcer la Garde de Hlinka"
 SLO_nationalism:0 "Nationalisme slovaque"
 SLO_planning_expertise:0 "Expertise en planification"
 SLO_fascism_banned:0 "Fascisme interdit"
 SLO_communist_army:0 "Armée communiste"
 SLO_pluralism:0 "Pluralisme"
 SLO_civilian_production:0 "Production civile"
 SLO_military_production:0 "Production militaire"
 SLO_agrarian_reform:0 "Réformes agraires"
 SLO_fascist_repression:0 "Répression fasciste"
 SLO_rapid_deployment:0 "Déploiement rapide"
 SLO_integrated_overlord_army:0 "Intégration dans l’armée du suzerain"
 SLO_integrated_overlord_army_desc:0 "Pour combattre efficacement, nous devons rester en contact permanent avec leur structure de commandement."

 #industriels
 apollo:0 "Apollo"
 zvolen_railway_factory:0 "Usine ferroviaire de Zvolen"

 #localisation additionnelle
 slovak_autonomy:0 "Coopération renforcée avec le suzerain"

 #arbre politique slovaque
 SLO_found_the_nation:0 "Fonder la nation"
 SLO_found_the_nation_desc:0 "En 1919, les nationalistes tchèques ont négocié en notre nom et nous ont forcés dans un mariage malheureux. Mais cette union est terminée et il est temps de montrer que nous sommes un peuple fier, libre et indépendant."
 SLO_assert_control_over_southern_slovakia:0 "Affirmer le contrôle sur la Slovaquie méridionale"
 SLO_assert_control_over_southern_slovakia_desc:0 "Notre contrôle sur la région industrielle stratégique de Slovaquie méridionale est désormais rétabli avec succès. Accueillons nos frères et sœurs sous la bannière du grand État [SLO.getAdjective]."
 SLO_purge_fascists:0 "Purger les fascistes"
 SLO_purge_fascists_desc:0 "Les temps de l’oppression sont enfin révolus. Plus de milices de Hlinka, plus de voyous tuant des innocents sans procès, plus d’antisémitisme fanatique. Hourra pour la destruction du fascisme !"
 SLO_technology_sharing:0  "Partage technologique"
 SLO_technology_sharing_desc:0  "Nos alliés pourraient être des atouts précieux dans notre processus de modernisation de l’industrie et des forces armées."

 #communistes
 SLO_communist_influence:0 "Influence communiste"
 SLO_communist_influence_desc:0 "Liberté, égalité, travail pour tous : derrière ces promesses simples, les masses se rassemblent. Le pouvoir doit être détenu par les travailleurs afin d’éradiquer les bourgeois et les aristocrates qui exploitent les masses sans défense. Le communisme est la prochaine étape de l’évolution de la société ; ne résistez pas à l’inévitable !"
 SLO_state_security_ministry:0 "Ministère de la Sécurité d’État"
 SLO_state_security_ministry_desc:0 "Afin de protéger la révolution des complots réactionnaires de la bourgeoisie, nous devons intensifier notre contrôle sur la population pour débusquer ces contre-révolutionnaires et les neutraliser."
 SLO_purge_the_army:0 "Purger l’armée"
 SLO_purge_the_army_desc:0 "L’armée a traditionnellement attiré des aristocrates et des officiers carriéristes réactionnaires. Ils constituent désormais un obstacle potentiel, susceptibles de menacer la glorieuse révolution prolétarienne. Ils doivent donc être écartés avant qu’ils ne causent des problèmes."
 SLO_new_army:0 "Une nouvelle armée"
 SLO_new_army_desc:0 "Avec notre armée réorganisée, nous disposons enfin d’une force idéologiquement cohérente qui protégera le prolétariat des ploutocrates fascistes."
 SLO_nationalize_factories:0 "Nationaliser les usines"
 SLO_nationalize_factories_desc:0 "Les capitalistes sont les tyrans du prolétariat. Pour libérer les masses, nous devons nationaliser les usines et engager la collectivisation. Ce processus nous permettra de saisir les moyens de reproduction des élites et d’abolir définitivement la bourgeoisie."
 SLO_indoctrinate_the_proletariat:0 "Endoctriner le prolétariat"
 SLO_indoctrinate_the_proletariat_desc:0 "Si le prolétariat n’est pas entièrement convaincu que nous œuvrons pour son bien, il pourrait tomber sous l’influence de « forces étrangères négatives ». Pour le succès de la révolution socialiste, au travail, camarades !"
 SLO_central_planning:0 "Planification centrale"
 SLO_central_planning_desc:0 "Grâce à notre emprise solide sur l’économie, nous pouvons désormais entamer la tâche cyclopéenne d’industrialiser le pays en réallouant les ressources vers l’industrie lourde. Vous aussi, assurez la réussite des premiers plans quinquennaux. Travailleurs slovaques : en avant !"

 #démocrates
 SLO_establish_pluralism:0 "Établir le pluralisme"
 SLO_establish_pluralism_desc:0 "La possibilité de partager et de contredire des idées est essentielle à l’instauration d’institutions démocratiques. Lorsque l’on fait taire — ou pire — celles et ceux qui s’expriment, le débat et le progrès cessent, car les pensées étrangères à la volonté de l’autorité centrale ne peuvent plus être formulées."
 SLO_seek_trading_partners:0 "Chercher des partenaires commerciaux"
 SLO_seek_trading_partners_desc:0 "Après l’instauration d’un système institutionnel juste, nous devons améliorer notre situation économique. Nous échangions des idées ; désormais, échangeons aussi des biens et, par la reconstruction et l’innovation, bâtissons graduellement une économie plus solide."
 SLO_attract_investors:0 "Attirer les investisseurs"
 SLO_attract_investors_desc:0 "Améliorer l’économie suppose de mobiliser des capitaux. Les soutiens internes étant limités, comptons sur des investisseurs étrangers pour financer notre système économique en y créant de nouvelles entreprises."
 SLO_efficient_economy:0 "Réformes économiques"
 SLO_efficient_economy_desc:0 "Certaines branches de notre économie demeurent institutionnellement inefficaces. Des réformes doivent être menées pour briser les monopoles restants et les remplacer par des entreprises concurrentes plus efficaces."
 SLO_agrarian_reforms:0 "Réformes agraires"
 SLO_agrarian_reforms_desc:0 "La terre est la pomme de discorde de l’Europe de l’Est. Tandis que certains pays tentent d’arracher des territoires à d’autres, les mouvements paysans contre les puissants propriétaires — et le manque de représentation de l’agriculture dans les institutions — plaident pour des réformes foncières et une modernisation agricole."
 SLO_defensive_preparation:0 "Préparatifs défensifs"
 SLO_defensive_preparation_desc:0 "La guerre change peut-être, mais nous serons prêts à l’affronter si nous pouvons en encaisser le choc et, avec l’aide de nos alliés, riposter pour remporter une victoire décisive en faveur de la liberté de l’humanité."
 SLO_why_we_fight:0 "La liberté mérite qu’on se batte !"
 SLO_why_we_fight_desc:0 "Nos institutions démocratiques consolidées, qui préférerait désormais les illusions des tyrannies rouge et noire ? Si nous n’exerçons pas nos libertés, elles s’éroderont. Le meilleur moyen de les protéger aujourd’hui est de filer au bureau d’engagement ! Rejoignez-nous aujourd’hui, célébrez la victoire demain !"

 #fascistes
 SLO_reinforce_hlinka_guard:0 "Renforcer la Garde de Hlinka"
 SLO_reinforce_hlinka_guard_desc:0 "La Garde de Hlinka est la véritable incarnation de l’esprit national slovaque. Protectrice de l’indépendance de l’État contre l’agression étrangère, il n’est guère surprenant que ses effectifs doivent être accrus pour défendre l’État slovaque et le peuple slovaque."
 SLO_catholic_dominance:0 "Suprématie catholique"
 SLO_catholic_dominance_desc:0 "Nous sommes pieux ; nos dirigeants sont des prêtres ; ils nous montrent la voie sacrée tracée par Dieu pour notre pays."
 SLO_militarize_the_hlinka_guard:0 "Militariser la Garde de Hlinka"
 SLO_militarize_the_hlinka_guard_desc:0 "Vigiles de notre indépendance, la Garde de Hlinka doit être pleinement mobilisée dans ce combat titanesque pour la liberté de l’Europe."

  SLO_integrate_german_army_structure:0 "Intégrer la structure de commandement du suzerain"
 SLO_integrate_german_army_structure_desc:0 "Pour combattre efficacement, nous devons rester en contact constant avec leur structure de commandement."

 SLO_hlinka_youth:0 "Jeunesse de Hlinka"
 SLO_hlinka_youth_desc:0 "Véritable incarnation de la volonté d’Andrej Hlinka, ces jeunes combattent pour une Slovaquie forte et pieuse !"
 SLO_ideological_fanaticism:0 "Fanatisme idéologique"
 SLO_ideological_fanaticism_desc:0 "Nous n’avons recouvré notre liberté que depuis quelques années ; pas question de retomber sous un joug étranger ! Nous ne voulons que ce qui nous revient de droit et nous sacrifierons tout pour le préserver. Slovaques, la patrie a besoin de vous ! Ralliez-vous au drapeau et défendez le pays !"
 SLO_faithful_ally:0 "Un allié fidèle"
 SLO_faithful_ally_desc:0 "Par notre engagement aux côtés de nos alliés, nous pouvons désormais prouver que nous méritons notre place en tant que partenaire légitime et indépendant."

 #Armée slovaque
 SLO_army_effort:0 "Organiser l’armée nationale"
 SLO_army_effort_desc:0 "Nous devons forger une véritable armée nationale à partir des restes des forces armées tchécoslovaques. D’abord, convaincre les rares officiers slovaques de la défunte armée tchécoslovaque de rejoindre nos rangs ; ensuite, promouvoir des officiers loyaux aux plus hauts postes ; enfin, attribuer à ces nouveaux officiers leurs unités respectives."
 SLO_equipment_effort:0 "Moderniser l’équipement d’infanterie"
 SLO_equipment_effort_desc:0 "Les limites de ce que l’infanterie peut emporter sont sans cesse repoussées. Nous donnerons à nos troupes les meilleurs outils possibles."
 SLO_mountain_brigades:0 "Brigades de montagne"
 SLO_mountain_brigades_desc:0 "La topographie montagneuse de notre pays impose à toute armée slovaque digne de ce nom d’inclure au moins quelques chasseurs alpins."
 SLO_motorization_effort:0 "Expérimenter la motorisation"
 SLO_motorization_effort_desc:0 "Mobilité et protection sont essentielles pour acheminer l’infanterie au front et l’en retirer en sécurité. En nous concentrant sur ces développements, nous pourrons agir rapidement."
 SLO_doctrine_effort:0 "Repensez les tactiques"
 SLO_doctrine_effort_desc:0 "Les doctrines qui ont défini le combat terrestre durant la Grande Guerre sont obsolètes. Confions à nos meilleurs esprits la tâche de façonner la pensée militaire de demain."
 SLO_support_bonus:0 "Équipes d’appui flexibles"
 SLO_support_bonus_desc:0 "Nous pouvons accroître la puissance de feu de notre infanterie grâce à un matériel plus lourd, tel que mortiers et mitrailleuses. Pour que ces armes soient employées efficacement, des ordres précis doivent être donnés et la coopération entre les servants optimisée."
 SLO_modern_artillery:0 "Artillerie moderne"
 SLO_modern_artillery_desc:0 "Avec le progrès technologique, les obus de petit calibre deviennent obsolètes face aux projectiles de plus gros calibre, capables d’une puissance destructrice supérieure à plus grande distance. Pour rendre nos artilleurs efficaces, développons au plus vite de plus grosses pièces."
 SLO_recon_companies:0 "Sections de reconnaissance"
 SLO_recon_companies_desc:0 "Savoir où se trouve l’ennemi est le premier pas pour tirer sur lui. Des opérations de reconnaissance adéquates sont donc cruciales pour recueillir des renseignements sur ses mouvements et ses plans."
 SLO_mechanization_effort:0 "Effort de mécanisation"
 SLO_mechanization_effort_desc:0 "En repensant les possibilités de l’infanterie motorisée, nous pouvons repousser les limites des véhicules que nous sommes capables de construire aujourd’hui."
 SLO_invite_german_military_mission:0 "Inviter une mission militaire allemande"
 SLO_invite_german_military_mission_desc:0 "Pour réussir la guerre de mouvement, il faudra repenser nos tactiques autour des camions et des chars. Inviter des experts allemands à former nos officiers à la guerre éclair épargnera un temps précieux et des vies."
 SLO_mobile_warfare_focus:0 "Priorité à la guerre de mouvement"
 SLO_mobile_warfare_focus_desc:0 "Si les tranchées symbolisent la Grande Guerre, les moteurs et la vitesse doivent être le symbole de celle-ci. En encerclant l’ennemi avant qu’il ne réagisse, nous gagnerons un avantage décisif tout en minimisant nos pertes."
 SLO_firepower_focus:0 "Priorité à la puissance de feu"
 SLO_firepower_focus_desc:0 "Pour vaincre l’ennemi, nous devons l’écraser sous un barrage d’artillerie écrasant, l’empêchant de répondre sous une pluie d’obus paralysante."
 SLO_planning_focus:0 "Planification détaillée"
 SLO_planning_focus_desc:0 "S’il est une leçon de la Grande Guerre, c’est que l’on ne lance pas d’opérations dans des conditions défavorables. Beaucoup se souviennent de leurs frères et fils morts de froid dans les Carpates ou bombardés par leur propre artillerie à Przemyśl. Ces cas d’incompétence du haut commandement austro-hongrois doivent être compris et ne jamais se reproduire."
 SLO_planning_focus_2:0 "Opérations préparées"
 SLO_planning_focus_2_desc:0 "Attaquer signifie souvent affronter un système défensif ennemi. En reconnaissant ses défenses et en coordonnant nos unités, nous pourrons créer et exploiter des points faibles, et démonter les lignes adverses morceau par morceau."
 SLO_mass_assault_focus:0 "Opérations massives"
 SLO_mass_assault_focus_desc:0 "Pour ébranler l’adversaire, toutes nos forces doivent frapper d’un même élan afin de l’engloutir sous le nombre."
 SLO_guerilla_tactics_focus:0 "Tactiques de guérilla"
 SLO_guerilla_tactics_focus_desc:0 "Des actions limitées et l’évasion face à l’ennemi seront souvent notre meilleure défense."

 SLO_rapid_deployment_focus:0 "Déploiement rapide"
 SLO_rapid_deployment_focus_desc:0 "Pour maintenir l’ennemi constamment submergé, les pertes doivent être remplacées par de nouvelles unités prêtes à prendre leur place au plus vite."

 SLO_artillery_regiments:0 "Régiments d’artillerie"
 SLO_artillery_regiments_desc:0 "Pour délivrer une quantité efficace d’explosifs sur les troupes ennemies, des unités d’artillerie bien équipées, assistées d’observateurs compétents, sont essentielles."
 SLO_armor_effort:0 "Copier les conceptions Škoda"
 SLO_armor_effort_desc:0 "Afin de produire nos nouveaux chars, il nous faut d’abord des plans éprouvés. Le moyen le plus simple serait d’obtenir l’accès aux modèles Škoda et de les utiliser comme base."
 SLO_special_forces:0 "Forces spéciales"
 SLO_special_forces_desc:0 "Parfois, la situation devient trop spécifique pour l’infanterie régulière. Dans ces cas, il faut des hommes spécialement formés. En montagne, sur l’eau ou dans les airs, ces troupes dédiées peuvent faire la différence et accomplir des tâches héroïques hors de portée du soldat ordinaire."
 SLO_committee_for_military_innovations:0 "Comité aux innovations militaires"
 SLO_committee_for_military_innovations_desc:0 "Concevoir et produire un armement moderne est une tâche ardue qui doit être centralisée. Ses membres superviseront l’ensemble du processus et auront pour mission de lever tout obstacle entre la conception et la production."

 SLO_aviation_effort:0 "Organiser l’armée de l’air"
 SLO_aviation_effort_tt:0 "Pas assez d’emplacements pour §YBase aérienne§!"
 SLO_aviation_effort_desc:0 "Maintenant que nous avons gagné l’indépendance et obtenu quelques biplans Avia, nous devons organiser une petite force aérienne et planifier son emploi futur ainsi que son potentiel de modernisation."
 SLO_fighter_focus:0 "Priorité aux chasseurs"
 SLO_fighter_focus_desc:0 "Les duels aériens n’ont pas disparu avec la Grande Guerre. Rester à la pointe dans le développement des chasseurs nous donnera l’avantage."
 SLO_bomber_focus:0 "Priorité aux bombardiers"
 SLO_bomber_focus_desc:0 "Quand on évoquera les horreurs des guerres d’aujourd’hui, le feu tombant du ciel sera au premier plan. Faisons en sorte que nos ennemis le racontent."
 SLO_airplanes_licenses:0 "Licences aéronautiques"
 SLO_form_mechanics:0 "Former des mécaniciens"
 SLO_form_mechanics_desc:0 "Former des mécaniciens"
 SLO_aviation_effort_2:0 "Formations avancées de pilotes"
 SLO_aviation_effort_2_desc:0 "Des avancées supplémentaires seront nécessaires pour bien intégrer notre armée de l’air avec les autres branches."
 SLO_CAS_effort:0 "Bombardiers monomoteurs"
 SLO_CAS_effort_desc:0 "Une armée moderne a besoin d’un appui venu du sol comme du ciel."
 SLO_a_new_fighter_focus:0 "Un nouveau chasseur"
 SLO_a_new_fighter_focus_desc:0 "L’innovation constante des cellules rend nos appareils obsolètes. Il nous faut donc des ressources pour concevoir une nouvelle cellule à jour, offrant plus d’agilité et de vitesse à nos futurs chasseurs."
 SLO_a_new_bomber_focus:0 "Un nouveau bombardier"
 SLO_a_new_bomber_focus_desc:0 "De plus gros bombardiers emportent plus de bombes. Si nous voulons frapper au cœur du territoire ennemi, concevons un bombardier capable de se défendre contre les intercepteurs tout en portant assez d’explosifs pour les mettre à genoux."
 SLO_rocket_effort:0 "Expériences sur les fusées"
 SLO_rocket_effort_desc:0 "Les moteurs fusées et à réaction permettent des vitesses inédites pour les engins pilotés ou non. Être pionniers dans ces technologies nous permettra de surprendre l’ennemi."
 SLO_NAV_effort:0 "Bombardiers torpilleurs"
 SLO_NAV_effort_desc:0 "Tout comme la guerre navale moderne se joue sous la surface, elle se joue aussi dans les airs au-dessus des flots."
 SLO_naval_effort:0 "Préparer la construction navale"
 SLO_naval_effort_tt:0 "Pas assez d’emplacements pour §YChantiers navals§!"
 SLO_naval_effort_desc:0 "L’extension de notre marine doit être prioritaire. Affectons toutes les ressources disponibles à de nouveaux chantiers et à la recherche sur les bâtiments légers."
 SLO_flexible_navy:0 "Marine flexible"
 SLO_flexible_navy_desc:0 "Réinventer la guerre navale à l’aune des progrès des sous-marins nous permettra de frapper efficacement les convois ennemis."
 SLO_large_navy:0 "Marine de surface"
 SLO_large_navy_desc:0 "Adapter nos doctrines à de grands bâtiments et sécuriser nos convois commerciaux nous apprendra quels navires nous devons construire."
 SLO_submarine_effort:0 "Effort sous-marin"
 SLO_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus passionnant depuis la vedette torpilleuse. Protégeons-nous des sous-marins et utilisons-les contre le trafic ennemi."
 SLO_cruiser_effort:0 "Effort croiseurs"
 SLO_cruiser_effort_desc:0 "Avant de nous lancer dans la recherche avancée sur les cuirassés, il faut remplacer nos croiseurs plus petits."
 SLO_destroyer_effort:0 "Effort destroyers"
 SLO_destroyer_effort_desc:0 "L’étude de la conception et de l’emploi des sous-marins nous a aussi appris à contrer ces stratégies. Les destroyers seront cruciaux."
 SLO_capital_ships_effort:0 "Effort bâtiments capitaux"
 SLO_capital_ships_effort_desc:0 "La nation qui possédera le plus de cuirassés dominera les océans. Cuirassés et porte-avions incarnent l’ancien et le nouveau visages de la supériorité navale."

 SLO_industrial_effort:0 "Modernisation manufacturière"
 SLO_industrial_effort_desc:0 "Concentrons tous nos efforts politiques sur l’essor de l’industrie civile dans un grand bond en avant."
 SLO_transslovak_railways:0 "Chemins de fer transslovaques"
 SLO_transslovak_railways_desc:0 "La géographie de notre pays exige une bonne infrastructure pour des communications et mouvements rapides de Bratislava, à l’extrême ouest, jusqu’aux contreforts de Ruthénie à l’est."
 SLO_construction_effort_tt:0 "Pas assez d’emplacements pour §YUsines civiles§!"
 SLO_bratislava_industrial_area:0 "Zone industrielle de Bratislava"
 SLO_bratislava_industrial_area_desc:0 "Notre capitale est déjà la ville la plus industrialisée, mais les nécessités exigent de produire davantage. Il faut donc créer rapidement une nouvelle zone industrielle pour répondre aux besoins actuels."
 SLO_extraction_focus:0 "Accroître la production de ressources"
 SLO_extraction_focus_desc:0 "Notre petit pays n’a que peu de ressources, comme le tungstène des montagnes. Il faut étendre et exploiter pleinement ces gisements pour satisfaire la demande d’artillerie."
 SLO_apollo_oil_refinery:0 "Raffinerie de pétrole Apollo"
 SLO_apollo_oil_refinery_desc:0 "La raffinerie Apollo est l’unique raffinerie de toute la région : un atout stratégique pour alimenter nos véhicules."
 SLO_uranium_mining:0 "Exploitation d’uranium"
 SLO_uranium_mining_desc:0 "Nos montagnes recèlent beaucoup de minerai d’uranium qui pourrait être exploité pour étudier les propriétés de cet élément. Certains physiciens affirment même qu’il permettrait une réaction en chaîne libérant une énergie presque inconcevable."
 SLO_small_arms_manufacturing:0 "Fabrication d’armes légères"
 SLO_small_arms_manufacturing_desc:0 "La première étape pour équiper notre armée nationale est de produire assez d’armes à feu pour notre infanterie."
 SLO_support_innovations:0 "Soutenir les innovations"
 SLO_support_innovations_desc:0 "Si nous voulons de nouvelles technologies, écoutons les innovateurs qui proposent des tactiques d’armement et des solutions de production intéressantes."
 SLO_develop_kosice:0 "Développer Košice"
 SLO_develop_kosice_desc:0 "Košice mérite un développement à la hauteur du reste de la nation."
 SLO_zvolen_railway_factory:0 "Usine ferroviaire de Zvolen"
 SLO_zvolen_railway_factory_desc:0 "Il est crucial de développer l’usine ferroviaire de Zvolen : c’est l’un des rares sites du pays disposant des installations lourdes nécessaires à la production de matériels de guerre lourds comme chars, trains blindés et artillerie lourde."
 SLO_synth_oil_effort_tt:0 "Pas assez d’emplacements pour §YRaffinerie synthétique§!"
 SLO_continue_industrialization:0 "Poursuivre l’industrialisation"
 SLO_continue_industrialization_desc:0 "Les premiers projets n’étaient que des pas de bébé pour lancer un réseau plus vaste d’usines qui garantiront une capacité suffisante pour répondre aux besoins de la nation."
 SLO_military_developments:0 "Développements militaires"
 SLO_military_developments_desc:0 "La guerre marque notre époque : nous n’avons d’autre choix que de prioriser la production militaire pour assurer la victoire finale sur le champ de bataille."
 SLO_civilian_developments:0 "Développements civils"
 SLO_civilian_developments_desc:0 "Les destructions de la guerre sont presque inconcevables ; organisons des structures civiles pour garantir une reconstruction rapide."

 SLO_victory_against_hungary:0 "Victoire lors de la « Petite Guerre »"
 claim_eastern_slovak_border_tooltip:0 "§RSI vous placez au moins une division à la frontière de la Slovaquie orientale, vous déclencherez un petit conflit avec la Slovaquie afin de reprendre toute la Carpathie. Vos chances de victoire sont très élevées. Les Allemands sont plutôt favorables et n’interviendront pas pour protéger les Slovaques… du moins pour l’instant.§!"

 SLO_gw_tank_equipment:0 "Tancik vz. 33"
 SLO_gw_tank_equipment_short:0 "T vz. 33"
 SLO_light_tank_equipment_1:0 "LT vz. 34"
