## variantes supplémentaires/ajouts aux points de départ
#NOR_GATHERING_STORM_DESC:0 "Politiquement stable depuis son indépendance, la Norvège a été frappée par la grande dépression et s’inquiète à mesure que les nuages s’accumulent sur l’Europe. Néanmoins, la politique pacifiste est toujours en place malgré les avertissements de l’armée. Entre-temps, la crise économique a rendu les classes populaires plus militantes, encouragées par le petit parti communiste, tandis que de petits groupes de nationalistes sont prêts à transformer radicalement la société.\n\n"
