## politique économique – bien-être
NOR_finish_the_post-depression_recovery:0 "Achever la sortie de crise"
NOR_finish_the_post-depression_recovery_desc:0 "Notre nation et notre économie étant désormais en bonne santé, nous pourrions allouer des fonds considérables pour éradiquer les effets persistants de la dépression et proclamer le programme social du gouvernement Nygaardsvold comme un succès éclatant. Le peuple norvégien apprécierait sans doute une telle initiative pendant des années."

## politique économique – commandes de matériel étranger
NOR_procure_british_destroyers:0 "Se procurer des destroyers britanniques"
NOR_procure_british_destroyers_desc:0 "Avec la coopération navale actuelle dans notre alliance avec les Britanniques, nous devrions pouvoir obtenir des destroyers à des prix très raisonnables, car il est dans l’intérêt de tous d’avoir une marine norvégienne forte."
NOR_procure_british_destroyers_tt:0 "Deux §Ydestroyers§! britanniques nous seront transférés une fois achevés. Avoir recherché les §Ydestroyers améliorés§! nous donnera des navires plus modernes."
NOR_procure_german_destroyers:0 "Se procurer des destroyers allemands"
NOR_procure_german_destroyers_desc:0 "Avec la coopération navale actuelle dans notre alliance avec les Allemands, nous devrions pouvoir obtenir des destroyers à des prix très raisonnables, car il est dans l’intérêt de tous d’avoir une marine norvégienne forte."
NOR_procure_german_destroyers_tt:0 "Deux §Ydestroyers§! allemands nous seront transférés une fois achevés. Avoir recherché les §Ydestroyers améliorés§! nous donnera des navires plus modernes."
ENG_GER_stop_procurements:0 "Arrêter les commandes navales norvégiennes"
ENG_GER_reallow_procurements:0 "Réautoriser les commandes navales norvégiennes"

## politique économique – lignes défensives et fortifications
NOR_glomma-halden_line:0 "Construire la ligne Glomma-Halden"
NOR_glomma-halden_line_desc:0 "Faire appel à des entrepreneurs pour construire une ligne de bunkers et de défenses à l’est d’Oslo devrait protéger cette ville vitale de tout agresseur. La route d’invasion traditionnelle venant de Suède vers nos terres centrales devrait comporter de sérieux obstacles pour tout ennemi."
NOR_lyngen_line:0 "Construire la ligne de Lyngen"
NOR_lyngen_line_desc:0 "Dans le cas d’une Suède neutre, nous pourrions stopper toute attaque terrestre venant du nord de la Norvège en construisant une série de fortifications et de bunkers dans les montagnes de la région de Lyngen, dans le Troms. Les frontières étroites aideraient également à canaliser tout assaillant craignant de violer la neutralité suédoise."

## politique économique – développement ferroviaire
NOR_railroad_development:0 "Développement ferroviaire"
NOR_railroad_development_desc:0 "De nombreuses nouvelles lignes de chemin de fer ont été construites en Norvège depuis les années 1800, reliant plus rapidement la population dispersée à travers un terrain difficile, sauf pour certaines liaisons maritimes, lacustres ou fluviales peut-être.\nNiveau actuel de §YDéveloppement ferroviaire§! :\n\nDans tous les cas, cela pourrait avoir des implications pour la manœuvre de notre armée, permettant des réponses plus rapides si l’armée est intégrée correctement à ces lignes. Avec suffisamment de développement, de nouveaux projets et avantages spéciaux pourraient même voir le jour. Projets disponibles au niveau §YDéveloppement ferroviaire§! :\nNiveau 1 : §Y0+§!    Niveau 2 : §Y6+§!    Niveau 3 : §Y12+§!"
NOR_railroad_development_icon_value:0 "[?NOR.railroad_development|0H]"
NOR_railroad_development_full_breakdown:0 "[Root.GetNameDefCap] a actuellement [?NOR.railroad_development|+0] §HDéveloppement ferroviaire§!. De nouvelles décisions et avantages peuvent être disponibles à mesure que cela augmente.\n"
NOR_railroad_development_add_1_tt:0 "\nAchever cela ajoutera §G1§! §YDéveloppement ferroviaire§!."
NOR_continued_electrification_of_dovrebanen:0 "Poursuivre l’électrification de la Dovrebanen"
NOR_continued_electrification_of_dovrebanen_desc:0 "Projet en cours, l’électrification de nouveaux tronçons de la Dovrebanen, la ligne de Dovre, pourrait non seulement rendre le transport plus efficace et fiable le long de ses gares, mais servir de pas vers une électrification générale dans toute la Norvège."
NOR_electrification_of_central_norways_railroads:0 "Électrification des chemins de fer du centre de la Norvège"
NOR_electrification_of_central_norways_railroads_desc:0 ""
NOR_electrification_of_eastern_norways_railroads:0 "Électrification des chemins de fer de l’est de la Norvège"
NOR_electrification_of_eastern_norways_railroads_desc:0 "Avec la Dovrebanen largement électrifiée, une étape suivante pourrait être de faire de même pour davantage de lignes dans l’est du pays. Bien que nous ne puissions pas toutes les électrifier immédiatement, en électrifier une partie significative devrait améliorer considérablement notre infrastructure."
NOR_electrification_of_northern_norways_railroads:0 "Électrification des chemins de fer du nord de la Norvège"
NOR_electrification_of_northern_norways_railroads_desc:0 ""
NOR_electrification_of_southern_norways_railroads:0 "Électrification des chemins de fer du sud de la Norvège"
NOR_electrification_of_southern_norways_railroads_desc:0 ""
NOR_electrification_of_western_norways_railroads:0 "Électrification des chemins de fer de l’ouest de la Norvège"
NOR_electrification_of_western_norways_railroads_desc:0 "L’ouest de la Norvège possède de vastes paysages propices à la production d’énergie hydroélectrique. Exploiter davantage ce potentiel par l’électrification des principales lignes ferroviaires de la région pourrait s’avérer un investissement des plus judicieux."
NOR_electrify_border_region_jamtland:0 "Électrifier la région frontalière du Jämtland"
NOR_electrify_border_region_jamtland_desc:0 "Les Suédois furent en grande partie pionniers dans l’électrification de leurs chemins de fer, grâce notamment à leur potentiel considérable de production d’hydroélectricité, comme nous. Tandis que la liaison Kiruna–Stockholm fut priorisée et s’est révélée un succès, maintenant que nous avons mené d’immenses projets dans nos centres de population et de production, consacrer quelques ressources à nos régions frontalières est possible. Les habitants du Jämtland pourraient apprécier grandement une telle initiative, et quiconque traversera la région le fera plus efficacement."
NOR_electrify_border_region_vaestergoetland:0 "Électrifier la région frontalière du Västergötland"
NOR_electrify_border_region_vaestergoetland_desc:0 "Les Suédois furent en grande partie pionniers dans l’électrification de leurs chemins de fer, grâce notamment à leur potentiel considérable de production d’hydroélectricité, comme nous. Tandis que la liaison Kiruna–Stockholm fut priorisée et s’est révélée un succès, maintenant que nous avons mené d’immenses projets dans nos centres de population et de production, consacrer quelques ressources à nos régions frontalières est possible. Le Västergötland, l’une des régions traditionnelles de Suède, en fait partie. Si nous menons ce projet alors que les Suédois contrôlent encore la région, ils ne manqueront pas de l’apprécier, en plus d’améliorer l’efficacité des déplacements pour tous ceux qui y transitent."
NOR_extend_nordlandsbanen_to_narvik:0 "Étendre la Nordlandsbanen jusqu’à Narvik"
NOR_extend_nordlandsbanen_to_narvik_desc:0 "Atteignant désormais Bodø, prolonger la Nordlandsbanen jusqu’au port libre de glace de Narvik permettrait de déplacer ressources et main-d’œuvre depuis et vers Narvik, et ce, sans dépendre du transport maritime. Bien que la majorité du minerai de fer suédois y soit expédiée à l’international, une telle liaison resterait bénéfique, même si la politique autour des extensions ferroviaires vers le Nord reste délicate pour l’instant."
NOR_extend_nordlandsbanen_to_tromsoe:0 "Étendre la Nordlandsbanen jusqu’à Tromsø"
NOR_extend_nordlandsbanen_to_tromsoe_desc:0 "Une autre extension jusqu’à la région de Lyngen et Tromsø relierait véritablement les pôles de population et d’économie du nord de la Norvège au reste du pays. Bien que le terrain soit difficile et la politique sur la longueur du tracé tout aussi âpre, atteindre Tromsø semble pour l’instant une limite raisonnable."
NOR_extend_raumabanen_to_molde_and_aalesund:0 "Étendre la Raumabanen vers Molde et Ålesund"
NOR_extend_raumabanen_to_molde_and_aalesund_desc:0 "Atteignant aujourd’hui Åndalsnes, dans la région intérieure du Romsdal, les extensions vers Kristiansund, Molde et/ou Ålesund ont été freinées, en partie à cause des luttes entre villes côtières sur le tracé à privilégier. Un blocage politique… Couper court aux querelles pour étendre la ligne vers ces importantes villes côtières pourrait être souhaitable. Cela se fera sûrement tôt ou tard. N’est-ce pas ?"
NOR_finalize_the_conversion_of_roerosbanen_to_standard-gauge:0 "Finaliser la conversion de la Rørosbanen à l’écartement standard"
NOR_finalize_the_conversion_of_roerosbanen_to_standard-gauge_desc:0 "L’un des premiers chemins de fer norvégiens, construit selon les normes de l’époque où les écartements réduits étaient courants, la Rørosbanen est actuellement en cours de conversion vers l’écartement standard moderne, en plusieurs étapes. Finaliser ce projet permettra des vitesses plus élevées et une utilisation plus efficace de cette ancienne ligne."
NOR_invest_in_the_cross-iceland_railroad:0 "Investir dans le chemin de fer trans-islandais"
NOR_invest_in_the_cross-iceland_railroad_desc:0 "Jusqu’à récemment, un chemin de fer traversant l’Islande n’était qu’une idée théorique. Mais avec le développement continu de nos lignes, certains militent désormais pour investir une partie de notre industrie, de nos matériaux et de nos fonds excédentaires afin de réaliser un tel projet, alimenté dès le départ par l’hydroélectricité locale. Un investissement aussi important renforcerait aussi nos relations commerciales et financières avec l’Islande."
NOR_prepare_bergensbanen_for_military_use:0 "Préparer la Bergensbanen à un usage militaire"
NOR_prepare_bergensbanen_for_military_use_desc:0 "Relier la capitale et plus grande ville, Oslo, au pôle commercial et deuxième ville, Bergen, a toujours été crucial pour les politiciens, les habitants et les entreprises depuis que les longues lignes ferroviaires sont devenues possibles. Traversant collines, plateaux et montagnes, cette ligne a rapidement prouvé sa valeur malgré son coût initial élevé. Déjà utilisable par nos forces armées en cas de besoin, la renforcer davantage pourrait être une sage décision vu son importance stratégique."
NOR_prepare_dovrebanen_for_military_use:0 "Préparer la Dovrebanen à un usage militaire"
NOR_prepare_dovrebanen_for_military_use_desc:0 "La Dovrebanen est une longue ligne traversant la majeure partie de la Norvège orientale et reliant cette région au centre vital du pays, avec plusieurs branches plus petites s’y connectant. La moderniser davantage pour faciliter les mouvements à travers les principales zones agricoles serait très judicieux. La connexion à Trondheim, déjà importante en soi, pourrait aussi devenir le point de départ d’une liaison vers le nord du pays."
NOR_prepare_raumabanen_for_military_use:0 "Préparer la Raumabanen à un usage militaire"
NOR_prepare_raumabanen_for_military_use_desc:0 "Assez courte et peu remarquable vue sur une carte, la Raumabanen traverse néanmoins les paysages alpins du Gudbrandsdal et du Sunnmøre, reliant l’est à l’ouest. Permettre des déplacements rapides de troupes ici pourrait faire la différence entre la survie et la capture pour nos soldats déployés."
NOR_prepare_soerlandsbanen_for_military_use:0 "Préparer la Sørlandsbanen à un usage militaire"
NOR_prepare_soerlandsbanen_for_military_use_desc:0 "La Sørlandsbanen a grandement profité à notre économie en reliant la ville maritime de Stavanger, sur la côte ouest de la Norvège, aux paysages du sud, puis au centre administratif et financier d’Oslo. Donner à nos troupes un accès rapide à ce tracé reliant l’ouest, le sud et l’est pourrait s’avérer d’une importance stratégique capitale."
## décisions de partage technologique
NOR_nordic_research:0 "Invitations à la recherche nordique"
NOR_invite_country_into_nordic_research:0 "Inviter [From.GetName] dans le groupe de recherche nordique"
NOR_invite_country_into_nordic_research_desc:0 "Mesure à la fois pratique et solidaire, la §YCollaboration de recherche nordique§! pourrait être élargie en invitant davantage de pays de notre sphère à rejoindre le groupe central de coopération scientifique."
## projets prestigieux
NOR_fund_the_royal_norwegian_society:0 "Financer la Société royale norvégienne"
NOR_fund_the_royal_norwegian_society_desc:0 "Fondée en 1760, « Det Kongelige Norske Videnskabers Selskab » est la plus ancienne institution scientifique et académique de Norvège, où les plus grands esprits du pays dans les sciences et domaines connexes sont élus, attribuant également des prix aux grandes découvertes et avancées norvégiennes.\n\nEn la finançant et en l’agrandissant, avec de nouveaux locaux, une coopération accrue avec nos autres institutions d’enseignement, et en invitant des universitaires étrangers via nos diplomates, nous pourrions partager nos méthodes et nos savoirs avec nos alliés, ainsi qu’organiser des recherches conjointes sur les sujets les plus prometteurs du moment. Bien que cela nous apporte sans doute plus de savoir et de prestige à long terme, élargir une institution d’élite à un nombre bien plus grand de membres ne manquera pas de susciter une certaine résistance au départ."
NOR_fund_additional_scientific_equipment:0 "Financer du matériel scientifique supplémentaire"
NOR_fund_additional_scientific_equipment_desc:0 "En finançant du matériel scientifique supplémentaire, les membres de la §YSociété royale norvégienne§! pourront tenter de reproduire certaines recherches prometteuses dans leurs domaines, assurant ainsi la validité de la science observée. Cela pourrait rendre notre collaboration encore plus efficace."
NOR_invite_foreign_academics_to_the_royal_norwegian_society:0 "Inviter des universitaires étrangers à la Société royale norvégienne"
NOR_invite_foreign_academics_to_the_royal_norwegian_society_desc:0 "Maintenant que la Société royale norvégienne a été élargie et que des universitaires étrangers en font déjà partie, inviter les chercheurs des nouveaux membres de notre alliance serait une formalité, si nous souhaitons étendre notre coopération éclairée."
## politique étrangère
NOR_share_military_tactics_with_iceland:0 "Partager nos tactiques militaires avec l’Islande"
NOR_share_military_tactics_with_iceland_desc:0 "Avec §Yl’Islande§! dans notre alliance, il serait judicieux de partager une partie de notre savoir-faire militaire général avec eux en ces temps graves, où il en va peut-être de la vie ou de la mort. Une coopération s’impose, étant donné notre proximité géographique et notre histoire largement commune."
NOR_share_specialized_tactics_with_iceland:0 "Partager nos tactiques spécialisées avec l’Islande"
NOR_share_specialized_tactics_with_iceland_desc:0 "Avec §Yl’Islande§! désormais plus qu’un simple membre de l’alliance, mais pratiquement une partie autonome de notre pays, nous pouvons partager certaines de nos connaissances spécialisées, telles que nos tactiques de montagne et notre expérience de la guerre hivernale. Si nous intégrons également des conseillers norvégiens aux forces de sécurité islandaises, elles seront mieux à même de se défendre, et nous pourrons avoir confiance dans la sécurité de l’Atlantique Nord."
## actions politiques
NOR_the_kings_choice:0 "Le choix du roi"
NOR_the_kings_choice_desc:0 "Un roi ému a reçu l’exigence de nos ennemis de capituler et de nommer un gouvernement collaborationniste. Le roi, en larmes, a dit au gouvernement et au parlement qu’il abdiquerait s’ils acceptaient de telles demandes. Offrons donc à nos ennemis le « Non » du roi, et que notre gouvernement appuie sa décision de lutter pour notre indépendance."
NOR_expand_the_kings_responsibilities:0 "Étendre les responsabilités du roi"
NOR_expand_the_kings_responsibilities_desc:0 "Même les monarques les plus symboliques peuvent avoir de nombreuses responsabilités. Déléguer certaines tâches à d’autres membres de la famille royale ou à des hommes d’État liés afin de libérer du temps pour des missions plus importantes pourrait être souhaitable. Dans notre pays monarchiste, le roi pourrait conseiller l’armée ou inspirer nos troupes et nos citoyens en temps de conflit."
NOR_rebrand_into_the_modern_kingdom:0 "Moderniser l’image du Royaume"
NOR_rebrand_into_the_modern_kingdom_desc:0 "Si nous le souhaitons, nous pourrions adopter de nouveau l’apparence et le drapeau modernes. Cela demanderait toutefois un grand effort de la part de nos diplomates et administrateurs, et une telle modernisation ne peut être faite fréquemment."
NOR_rebrand_into_the_traditional_kingdom:0 "Revenir au Royaume traditionnel"
NOR_rebrand_into_the_traditional_kingdom_desc:0 "Si nous le souhaitons, nous pourrions reprendre l’apparence et le drapeau traditionnels du Royaume de Norvège d’antan. Bien qu’une telle transition soudaine puisse coûter cher en ressources administratives et soit difficilement réversible, elle reste possible si tel est notre choix."
NOR_expand_the_duchy_of_icelands_administrative_duties:0 "Étendre les responsabilités administratives du duché d’Islande"
NOR_expand_the_duchy_of_icelands_administrative_duties_desc:0 "Déjà chargé d’administrer un territoire élargi, il serait judicieux de laisser notre duché autonome d’Islande administrer le Groenland, la grande île voisine qu’il connaît historiquement bien. Cela nous libérerait pour nous concentrer sur d’autres théâtres et pourrait même améliorer le développement à long terme du Groenland."
## soutien étranger (mesures de guerre)
NOR_petition_the_british_for_an_alliance:0 "Demander une alliance aux Britanniques"
NOR_petition_the_british_for_an_alliance_desc:0 "La neutralité armée n’a pas suffi à tenir la guerre éloignée de nos terres. Notre meilleure chance est peut-être de trouver un terrain d’entente avec les ennemis de notre ennemi. S’allier aux Britanniques pourrait être notre meilleur choix."
NOR_petition_the_french_for_an_alliance:0 "Demander une alliance aux Français"
