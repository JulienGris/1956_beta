####--Décisions--####
## politique monarchiste
NOR_monarchism_on_the_rise:0 "Montée du monarchisme norvégien"
NOR_monarchism_on_the_rise_desc:0 "Des éléments politiques vocaux ont commencé à se prononcer en faveur de nos valeurs traditionnelles et du Royaume d’antan, trouvant un soutien croissant au sein de la population. Le chemin vers des valeurs sûres et solides n’attend plus qu’un choix de transition, pacifique ou non."
NOR_prepare_for_monarchist_civil_war:0 "Préparer la guerre civile"
NOR_prepare_for_monarchist_civil_war_desc:0 "Nous n’avons pas le temps d’attendre les changements lents dans l’esprit du peuple de [Root.GetName]. Pour leur bien, nous devons forcer la question rapidement, même si certains doivent perdre la vie dans le processus."
NOR_expand_civil_monarchism_support:0 "Étendre le soutien populaire"
NOR_expand_civil_monarchism_support_desc:0 "Nous devons garantir l’expansion continue du soutien parmi le peuple de [Root.GetName], même si cela entraîne une déstabilisation de la société."
NOR_ensure_command_loyalty_for_monarchist_civil_war:0 "Assurer la loyauté du commandement militaire"
NOR_ensure_command_loyalty_for_monarchist_civil_war_desc:0 "Il est probable que nombre de nos commandants nourrissent des valeurs traditionalistes et souhaitent les promouvoir dans la société. Nous devrions les approcher tous et assurer leur loyauté en cas de conflit interne."
NOR_ensure_command_loyalty_for_monarchist_civil_war_tt:0 "Assure la loyauté de nos §YCommandants de l’armée§! et de nos §YCommandants de la marine§! en cas de §Rguerre civile§! pour le §Ymonarchisme§!.\n"
NOR_preliminary_monarchist_armament_industry:0 "Industrie d’armement loyaliste préliminaire"
NOR_preliminary_monarchist_armament_industry_desc:0 "Préparer une quantité limitée d’§Yindustrie d’armement§! dans nos États loyalistes.\n"
NOR_open_up_political_discourse_monarchism:0 "Ouvrir le discours politique"
NOR_open_up_political_discourse_monarchism_desc:0 "Nous devons favoriser l’acceptation des points de vue divergents au sein du gouvernement. Peut-être cela permettra-t-il un jour d’amener un changement politique pacifique dans notre nation."
NOR_discredit_government_monarchism:0 "Discréditer le gouvernement"
NOR_discredit_government_monarchism_desc:0 "En soulignant les nombreux défauts de notre gouvernement actuel, nous pouvons amener le peuple à réfléchir aux causes idéologiques de ces échecs."
NOR_ignite_the_monarchist_civil_war:0 "Déclencher la guerre civile"
NOR_ignite_the_monarchist_civil_war_desc:0 "L’heure est venue de se jeter à l’eau. Toutes les préparations jugées nécessaires ont été faites. Plus de retour en arrière possible. « Pour le Fedrelandet ! »"

## réintégration des terres norvégiennes
NOR_land_reintegration:0 "Réintégration des terres norvégiennes"
NOR_land_reintegration_desc:0 "Le Royaume de Norvège s’étendait autrefois largement à travers l’Europe du Nord, mais les guerres et les traités l’ont privé de plusieurs terres historiques. La Suède, le Danemark et, dans une moindre mesure, le Royaume-Uni, détiennent chacun leur « juste » part de ces anciennes îles, titres, paysages et régions frontalières. Pourtant, il n’est pas nécessaire de perdre espoir…\n\nSi nous reprenons possession de l’un de ces territoires, l’État norvégien moderne est désormais en bonne position pour les réintégrer, avec une économie solide et de nombreux hommes d’État compétents. Restaurer une partie de notre gloire passée est donc tout à fait réalisable."
