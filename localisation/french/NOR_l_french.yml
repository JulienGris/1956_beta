####--Accords de recherche--####
NOR_nordic_research_name:0 "Collaboration de recherche nordique"
NOR_nordic_research_desc:0 "Les pays nordiques se sont unis dans un accord de partage de recherche, visant à travailler pour le bien commun de tous. Bien que globalement solide, certaines spécialités développées par des pays nordiques pourraient faire de cette collaboration une référence mondiale dans certains domaines."
NOR_royal_norwegian_society_name:0 "Société Royale Norvégienne"
NOR_royal_norwegian_society_desc:0 "La Société Royale Norvégienne a invité d’autres pays alliés à collaborer dans le domaine scientifique et technologique. Avec la bénédiction du monarque norvégien, nos recherches n’ont jamais été aussi prestigieuses."
NOR_allied_research_name:0 "Collaboration de recherche alliée"
NOR_allied_research_desc:0 "Une collaboration transmaritime avec les Britanniques devrait profiter à tous, en particulier pour aider les petits alliés à se hisser au niveau requis."
NOR_german_research_name:0 "Collaboration de recherche allemande"
NOR_german_research_desc:0 "Collaborer avec la grande puissance industrielle d’Europe centrale, l’Allemagne, aidera chaque participant à mettre ses technologies et équipements au niveau moderne."
NOR_soviet_research_name:0 "Collaboration de recherche soviétique"
NOR_soviet_research_desc:0 "Pays vaste et diversifié, les Soviétiques d’Europe orientale et d’Asie du Nord ont développé eux-mêmes certaines technologies, ce qui en fait un partenaire solide dont tout pays peut apprendre."

####--Technologies uniques--####
NOR_mountain_tactics:0 "Tactiques d’infanterie à ski"
NOR_mountain_tactics_desc:0 "Les tactiques norvégiennes de haute montagne et de froid consistent en des attaques éclairs menées par de l’infanterie à ski, utilisant le terrain accidenté pour se couvrir ou pour observer.\n\nNos unités peuvent s’en servir pour se déplacer plus vite et frapper plus fort en terrain montagneux !"
NOR_concealed_skirmishers:0 "Tirailleurs dissimulés"
NOR_concealed_skirmishers_desc:0 "À mesure que l’ennemi avance, nos tirailleurs peuvent l’assaillir avec des tirs précis de fusils et de mitrailleuses depuis des positions dissimulées, forçant l’ennemi à s’arrêter. Pendant qu’il se prépare à contre-attaquer, nos hommes peuvent se replier ailleurs."

