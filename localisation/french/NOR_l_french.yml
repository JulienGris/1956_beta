####--Events--####
naw_norway.1.t:0 "La Norvège invite aux Trois Frères"
naw_norway.1.d:0 "Dans l’hymne national norvégien, au sixième couplet, il est question de l’union des Scandinaves dans les guerres. Les Norvégiens relancent maintenant le mouvement pan-scandinave et nous tendent la main."
naw_norway.1.a:0 "Frères dans la vie et la mort !"
naw_norway.1.b:0 "Peut-être pas dans la mort..."

naw_norway.2.t:0 "[From.GetName] rejoint les Trois Frères"
naw_norway.2.d:0 "Notre frère [From.GetName] a rejoint notre alliance. Que nos peuples s’unissent pour la victoire."
naw_norway.2.a:0 "Nous ne faisons qu’un !"
naw_norway.3.t:0 "[From.GetName] refuse notre main tendue"
naw_norway.3.d:0 "[From.GetName] a estimé, d’une manière ou d’une autre, qu’il était dans son intérêt de se tenir à l’écart de notre brillante idée de fraternité."
naw_norway.3.a:0 "Peut-être une autre fois alors..."

naw_norway.4.t:0 "La proposition de mandats de quatre ans est adoptée"
naw_norway.4.d:0 "Le Parlement norvégien a récemment décidé que dorénavant, les élections parlementaires auraient lieu tous les quatre ans au lieu de tous les trois ans, avec effet immédiat. Ils espèrent probablement qu’un gouvernement en place accomplira davantage avec une année supplémentaire. Bien entendu, il ne faut pas nier qu’une année de sécurité de l’emploi en plus est un effet secondaire plutôt agréable pour nos représentants."
naw_norway.4.a:0 "Très bien."
naw_norway.4.b:0 "Hé, ces malins..."
naw_norway.4.c:0 "Et maintenant, retour au débat sur le « samnorsk »..."

#naw_norway.5.t:0 "[From.GetName] adopte la proposition de mandats de quatre ans"
#naw_norway.5.d:0 "Les représentants parlementaires de [From.GetName] ont récemment adopté une proposition portant la durée des mandats de trois à quatre ans, avec effet immédiat. Sans doute espèrent-ils qu’un gouvernement en place pourra accomplir davantage grâce à cette année supplémentaire. La motion est passée sans difficulté."
#naw_norway.5.a:0 "Très bien alors."
#naw_norway.5.b:0 "Je n’ai pas d’opinion tranchée."
#naw_norway.5.c:0 "La politique norvégienne ? Bah !"

naw_norway.6.t:0 "[From.GetName] soutient la nouvelle Fraternité"
naw_norway.6.d:0 "Notre frère [From.GetName] nous soutient dans l’élargissement de notre alliance. Que nos nations libres se tiennent ensemble comme des frères."
naw_norway.6.a:0 "Nous sommes en effet unis dans la volonté !"

naw_norway.7.t:0 "La Norvège propose une collaboration nordique en recherche"
naw_norway.7.d:0 "Notre voisin nous a invités à une collaboration nordique en recherche, affirmant que cela profitera à toutes les nations de Scandinavie. Accéder aux avancées de nos voisins ne peut que nous être bénéfique. La question est : voyons-nous un risque à ce qu’ils accèdent aux nôtres ?"
naw_norway.7.a:0 "Plus d’avancées technologiques entre mains scandinaves, c’est aussi bon pour nous !"
naw_norway.7.b:0 "Une collaboration en recherche semble utile. Pourquoi ne pas leur prêter nos chimistes de temps à autre ?"
naw_norway.7.c:0 "Nos avancées technologiques entre des mains étrangères ? Un peu trop risqué..."

naw_norway.8.t:0 "[From.GetName] a rejoint la collaboration nordique en recherche"
naw_norway.8.d:0 "[From.GetName] a eu la sagesse de rejoindre notre collaboration en recherche."
naw_norway.8.a:0 "Et avec cela, nous gagnerons tous encore en sagesse."

naw_norway.9.t:0 "[From.GetName] refuse de rejoindre la collaboration nordique en recherche"
naw_norway.9.d:0 "[From.GetName] semble plus protecteur de sa technologie que nous ne l’avions anticipé."
naw_norway.9.a:0 "Nous attendions mieux d’eux."

naw_norway.10.t:0 "Invitation à la collaboration nordique en recherche"
naw_norway.10.d:0 "La Norvège nous a envoyés une invitation à la collaboration nordique en recherche, un accord qui, selon elle, profitera à tous les pays nordiques grâce à l’échange de développements technologiques."
naw_norway.10.a:0 "Bien sûr que la Finlande participera. Loistava aloite !"
naw_norway.10.b:0 "Les bonnes idées doivent être partagées. Loistava aloite !"
naw_norway.10.c:0 "Une belle initiative, mais nous ne pouvons risquer que notre technologie tombe entre de mauvaises mains."

naw_norway.11.t:0 "[From.GetName] a rejoint la collaboration nordique en recherche"
naw_norway.11.d:0 "[From.GetName] a eu la sagesse de rejoindre notre collaboration en recherche."
naw_norway.11.a:0 "Notre frère le Finlandais, il est des nôtres."

naw_norway.12.t:0 "[From.GetName] refuse de rejoindre la collaboration nordique en recherche"
naw_norway.12.d:0 "[From.GetName] semble plus protecteur de sa technologie que nous ne l’avions anticipé."
naw_norway.12.a:0 "Notre frère le Finlandais, un coup de pied au tibia ?"

naw_norway.13.t:0 "La Norvège veut collaborer avec les scientifiques du Commonwealth"
naw_norway.13.d:0 "La nation scandinave d’outre-mer veut signer une collaboration en recherche avec les nations du Commonwealth. Leurs scientifiques travailleront étroitement avec les nôtres et partageront leurs avancées."
naw_norway.13.a:0 "Un échange technologique serait mutuellement bénéfique."
naw_norway.13.b:0 "Collaborer avec nos amis est naturel."
naw_norway.13.c:0 "Trop déséquilibré. Pourquoi échanger des as contre des deux ?"

naw_norway.14.t:0 "[From.GetName] a accepté de mettre en place un accord de recherche"
naw_norway.14.d:0 "[From.GetName] a aimablement mis en place un accord de recherche et invité nos scientifiques à y participer, contribuer et apprendre."
naw_norway.14.a:0 "À la bonne heure."

naw_norway.15.t:0 "[From.GetName] nous refuse l’accès à la recherche du Commonwealth"
naw_norway.15.d:0 "[From.GetName] semble protecteur de ses technologies avancées en électronique et en construction navale, et nous a refusé l’accès à la recherche du Commonwealth."
naw_norway.15.a:0 "Ces fichus types."

naw_norway.16.t:0 "La Norvège veut collaborer avec les scientifiques de l’Axe"
naw_norway.16.d:0 "Nos amis nord-germaniques veulent signer une collaboration en recherche entre les nations de l’Axe. Leurs scientifiques travailleront étroitement avec les nôtres et partageront leurs avancées."
naw_norway.16.a:0 "Un échange technologique serait mutuellement bénéfique."
naw_norway.16.b:0 "Collaborer avec nos amis est naturel."
naw_norway.16.c:0 "Nein. Ils devront se contenter de louer ou de sous-licencier notre matériel."

naw_norway.17.t:0 "[From.GetName] a accepté de mettre en place un accord de recherche"
naw_norway.17.d:0 "[From.GetName] a aimablement mis en place un accord de recherche et invité nos scientifiques à y participer, contribuer et apprendre."
naw_norway.17.a:0 "Danke schön."

naw_norway.18.t:0 "[From.GetName] nous refuse l’accès à la recherche de l’Axe"
naw_norway.18.d:0 "[From.GetName] semble protecteur de ses techniques avancées de cryptage, de ses chars et de ses armes, et nous a refusé l’accès à la recherche de l’Axe."
naw_norway.18.a:0 "Ach so..."

naw_norway.19.t:0 "La Norvège veut collaborer avec les scientifiques du Komintern"
naw_norway.19.d:0 "Nos camarades socialistes de l’ouest veulent signer une collaboration en recherche entre nos nations. Leurs scientifiques travailleront étroitement avec les nôtres et partageront leurs avancées."
naw_norway.19.a:0 "Un échange technologique serait mutuellement bénéfique."
naw_norway.19.b:0 "Collaborer avec nos camarades est naturel."
naw_norway.19.c:0 "Nyet. Nous ne pouvons pas être trop prudents ces temps-ci."

naw_norway.20.t:0 "[From.GetName] a accepté de mettre en place un accord de recherche"
naw_norway.20.d:0 "[From.GetName] a aimablement mis en place un accord de recherche et invité nos scientifiques à y participer, contribuer et apprendre."
naw_norway.20.a:0 "Nous avons eu raison de faire confiance à nos camarades."

naw_norway.21.t:0 "[From.GetName] nous refuse l’accès à la recherche du Komintern"
naw_norway.21.d:0 "[From.GetName] semble protecteur de sa production industrielle efficace et de ses variantes ingénieuses de blindés, et nous a refusé l’accès à la recherche du Komintern."
naw_norway.21.a:0 "Ainsi soit-il."

naw_norway.22.t:0 "La Norvège nous invite à la Fraternité des Nations démocratiques"
naw_norway.22.d:0 "Les Norvégiens et leurs alliés, récemment connus sous les noms d’Alliance des Trois Frères, des Quatre Frères ou de Fraternité nordique selon les points de vue, nous ont invités à rejoindre leur alliance nouvellement renommée. Nul doute qu’ils espèrent maintenir leur élan diplomatique, et cette alliance pourrait être bénéfique pour notre sécurité et notre influence politique, mais cela impliquerait aussi un engagement auprès de nos nouveaux amis."
naw_norway.22.a:0 "Nous sommes frères !"
naw_norway.22.b:0 "Restons plutôt de simples amis cordiaux."
naw_norway.22.c:0 "Nous sommes frères, et les frères passent avant nos amis actuels."
naw_norway.22.p:0 "Nous ne pouvons trahir nos alliés actuels !"

naw_norway.23.t:0 "[From.GetName] rejoint la Fraternité des Nations démocratiques"
naw_norway.23.d:0 "Notre frère [From.GetName] a rejoint notre Fraternité. Que nos peuples s’unissent pour la victoire."
naw_norway.23.a:0 "Nous sommes nombreux, mais unis !"

naw_norway.24.t:0 "[From.GetName] refuse notre main généreuse"
naw_norway.24.d:0 "[From.GetName] a estimé qu’il était dans son intérêt de rester à l’écart de notre Fraternité de nations cordiales, puissantes et éprises de liberté. Qui sait à quoi ils pensaient ?"
naw_norway.24.a:0 "Décevant..."

naw_norway.25.t:0 "[From.GetName] renomme notre faction Fraternité démocratique des Nations"
naw_norway.25.d:0 "Vouloir élargir la faction pourrait nécessiter un changement de nom, pour qu’il soit plus englobant."
naw_norway.25.a:0 "Un nouvel objectif mondial est peut-être nécessaire."

naw_norway.26.t:0 "[From.GetName] exige Petsamo"
naw_norway.26.d:0 "Notre voisin [From.GetName] revendique ses anciens droits sur la péninsule de Kola, et souhaite ainsi une frontière continue avec cette région majoritairement russe. Pour cela, ils exigent que nous leur cédions notre territoire le plus septentrional, Petsamo. Bien que peu peuplé, il contient des gisements de nickel précieux et reste notre seul accès à la mer de Barents. Quelle doit être notre décision ?"
naw_norway.26.a:0 "Cédons Petsamo. Qu’ils aillent chatouiller l’ours s’ils le veulent..."
naw_norway.26.b:0 "Qu’ils l’aient, mais nous exigeons une compensation."
naw_norway.26.c:0 "Petsamo appartient aux Finlandais."

naw_norway.27.t:0 "[From.GetName] cède Petsamo"
naw_norway.27.d:0 "Les Finlandais ont eu la sagesse de nous céder la région de Petsamo, peu peuplée mais riche en ressources. Nous avons désormais une frontière continue avec nos anciennes revendications médiévales. C’est la preuve du prestige de notre nation en Europe et de l’habileté de nos diplomates et hommes d’État."
naw_norway.27.a:0 "Gloire à la Norvège, et santé à nos diplomates !"

naw_norway.28.t:0 "[From.GetName] refuse nos exigences sur Petsamo"
naw_norway.28.d:0 "Les Finlandais déclarent que la nature et l’étendue de leurs frontières ne sont pas négociables, et qu’ils ne céderont donc pas Petsamo, quels que soient nos motifs. Il semble que leur nature et leur étendue soient de nous décevoir... Une note de protestation officielle leur a été envoyée, mais pour l’heure nous devons accepter leur décision."
naw_norway.28.a:0 "La note mentionnait-elle combien ils nous ont déçus ?"

naw_norway.29.t:0 "[From.GetName] exige que nous nous soumettions à la Révolution"
naw_norway.29.d:0 "Les Norvégiens, ayant récemment vaincu Danois et Suédois, exigent maintenant que nous nous soumettions à leur autorité et à leurs idéaux communistes. Avec leur contrôle sur la Scandinavie, leur armée grandissante et leurs liens avec les Soviétiques, leur résister pourrait être très dangereux. D’un autre côté, notre indépendance est menacée dans les deux cas..."
naw_norway.29.a:0 "Nous devons nous soumettre, pris entre deux ennemis nous n’avons pas d’autre choix..."
naw_norway.29.b:0 "Nous devons nous soumettre, pris entre deux ennemis nous n’avons pas d’autre choix..."
naw_norway.29.c:0 "Les Norvégiens ont resserré leur emprise sur notre nation."
naw_norway.29.p:0 "Les Norvégiens ont resserré leur emprise sur notre nation."
naw_norway.29.e:0 "C’est ici que nous résistons : la Finlande indépendante est là pour durer."

naw_norway.30.t:0 "[From.GetName] se soumet à nous"
naw_norway.30.d:0 "Les Finlandais ont décidé de nous laisser le contrôle d’une grande partie de leurs affaires d’État. Avec cela, les nations nordiques sont toutes les nôtres à diriger."
naw_norway.30.a:0 "Parfait."

naw_norway.31.t:0 "[From.GetName] refuse de se soumettre à nous"
naw_norway.31.d:0 "Les Finlandais ont décidé de refuser notre offre généreuse de se soumettre tout en conservant leur autonomie. Apparemment, ils préfèrent être partagés entre nous et les Soviétiques, et il semble que les alcools forts soient bien trop faciles d’accès pour leurs dirigeants. À nous de décider maintenant : répandre la révolution parmi le peuple finlandais vaut-il une guerre ?"
naw_norway.31.a:0 "À la guerre."
naw_norway.31.b:0 "Ou peut etre pas ?"
naw_norway.32.t:0 "[From.GetName] s’allie à l’Allemagne après nous avoir promis le Slesvig"
naw_norway.32.d:0 "Les dirigeants norvégiens ont décidé de s’allier à l’Allemagne pour dissuader toute attaque de leur part. Naturellement, de nombreux Danois sont mécontents, car nous avons cédé nos îles de l’Atlantique Nord en échange d’un soutien pour reprendre tout le Slesvig, et peut-être même le Holstein. Et pire encore, si l’Allemagne vainc les autres grandes puissances, comment pourrons-nous nous défendre contre elle ? Nous partageons même une frontière avec eux… Tout au moins, nous pourrions adresser nos plaintes aux Norvégiens pour apaiser notre opinion publique et peut-être en tirer quelque chose ?"
naw_norway.32.a:0 "Transmettons nos plaintes au gouvernement norvégien."
naw_norway.32.b:0 "Ne nous plaignons pas, au moins nous avons la paix."

naw_norway.33.t:0 "[From.GetName] comprend notre décision de nous allier à l’Allemagne"
naw_norway.33.d:0 "Les Danois, bien que contrariés car nous leur avions promis de les aider à reprendre le Slesvig, comprennent notre pragmatisme dans le fait de nous allier à l’Allemagne : la sécurité immédiate doit primer. Et qui sait, si l’Allemagne commence à perdre la guerre, cette amitié pourrait ne pas durer..."
naw_norway.33.a:0 "[From.GetName] comprend notre pragmatisme."

naw_norway.34.t:0 "[From.GetName] proteste contre notre alliance avec l’Allemagne"
naw_norway.34.d:0 "Les dirigeants danois se sont montrés très irrités que nous nous soyons alliés à l’Allemagne. D’abord parce que nous leur avions promis de les aider à reprendre le Slesvig, ensuite parce qu’ils craignent que les Allemands viennent aussi pour nous, voire pour la partie danoise actuelle du Slesvig, malgré notre alliance. Comment devons-nous réagir ?"
naw_norway.34.a:0 "Ils doivent être indemnisés ! Compensation financière et le Groenland comme garantie."
naw_norway.34.b:0 "Cédons-leur temporairement le Groenland comme garantie."
naw_norway.34.c:0 "Ces imbéciles ! Ne comprennent-ils pas que nous devions faire cela ? Ils n’auront rien."

naw_norway.35.t:0 "Les Norvégiens acceptent de massives compensations"
naw_norway.35.d:0 "Les Norvégiens semblent avoir compris nos plaintes. Ils nous ont rendu le Groenland comme garantie temporaire, en plus de nous donner une importante compensation financière que nous réinvestissons dans notre industrie."
naw_norway.35.a:0 "Il est normal qu’ils paient, mais merci tout de même."

naw_norway.36.t:0 "Les Norvégiens nous remettent le Groenland"
naw_norway.36.d:0 "Pour l’instant, les Norvégiens nous ont rendu le Groenland comme garantie jusqu’à ce que nous reprenions le Slesvig. Notre opinion publique est satisfaite pour l’instant."
naw_norway.36.a:0 "Acceptable."

naw_norway.37.t:0 "Les Norvégiens nous refusent toute compensation"
naw_norway.37.d:0 "Prétendant avoir agi par nécessité, les Norvégiens nous refusent toute compensation, affirmant que s’allier à l’Allemagne était vital pour la survie de toutes nos nations. Cette décision difficile à digérer et leur manque de compromis ont sûrement encore terni la crédibilité des politiciens norvégiens."
naw_norway.37.a:0 "C’est le pire accord commercial de l’histoire des accords commerciaux."

naw_norway.38.t:0 "Respect de notre part du marché"
naw_norway.38.d:0 "Le Slesvig-Holstein est à nous, et les Norvégiens ont respecté leur part du marché. Des mesures sont prises pour leur rendre le Groenland, comme convenu."
naw_norway.38.a:0 "Prenez bien soin des Groenlandais !"

naw_norway.39.t:0 "[From.GetName] nous rend le Groenland"
naw_norway.39.d:0 "Les Danois, reconnaissant que nous avons tenu notre promesse en les aidant à reprendre le Slesvig, nous ont rendu le Groenland. Il ne s’agit plus d’une garantie temporaire : le Groenland fait désormais partie du royaume de Norvège, et les Inuits deviennent citoyens norvégiens."
naw_norway.39.a:0 "Merveilleux. Rarement les événements donnent une leçon de morale."

naw_norway.40.t:0 "[From.GetName] s’allie aux Russes après nous avoir promis la Carélie"
naw_norway.40.d:0 "Les dirigeants norvégiens ont décidé de s’allier aux Russes pour dissuader toute attaque de leur part. Naturellement, certains Finlandais sont contrariés que nous ayons cédé nos îles de la Baltique en échange d’un soutien pour reprendre la Carélie et mettre fin à la menace de l’est. Et pire encore, si la Russie bat les grandes puissances, comment pourrons-nous nous défendre contre elle, nous qui partageons une immense frontière avec elle ? Tout au moins, nous pourrions adresser nos plaintes aux Norvégiens pour calmer notre opinion publique et peut-être obtenir quelque chose."
naw_norway.40.a:0 "Adressons nos plaintes au gouvernement norvégien."
naw_norway.40.b:0 "Ne nous plaignons pas, au moins nous avons la paix."

naw_norway.41.t:0 "[From.GetName] comprend notre décision de nous allier à la Russie"
naw_norway.41.d:0 "Les Finlandais, bien que contrariés car nous leur avions promis de les aider à reprendre la Carélie (et sans doute plus encore de nous être alliés à une menace future), comprennent notre pragmatisme : la sécurité immédiate doit primer. Et qui sait, si la Russie commence à perdre la guerre, cette amitié pourrait ne pas durer..."
naw_norway.41.a:0 "[From.GetName] comprend notre pragmatisme."

naw_norway.42.t:0 "[From.GetName] proteste contre notre alliance avec l’Union soviétique"
naw_norway.42.d:0 "Les dirigeants finlandais sont très irrités que nous nous soyons alliés aux Russes. D’abord parce que nous leur avions promis d’aider à reprendre la Carélie, ensuite parce qu’ils craignent que les Soviétiques viennent aussi pour nous et la Finlande malgré notre alliance. Du moins, c’est ce que pensent les Finlandais. Comment devons-nous réagir ?"
naw_norway.42.a:0 "Ils doivent être indemnisés ! Offrons-leur une compensation financière."
naw_norway.42.b:0 "Nous ne pouvons pas les indemniser, nous avons besoin de nos ressources pour notre défense."

naw_norway.43.t:0 "Les Norvégiens acceptent de nous indemniser"
naw_norway.43.d:0 "Les Norvégiens semblent avoir compris nos plaintes. Ils vont nous offrir une compensation financière, que nous réinvestirons dans notre industrie."
naw_norway.43.a:0 "Ça suffira pour l’instant, merci."

naw_norway.44.t:0 "Les Norvégiens refusent de nous indemniser"
naw_norway.44.d:0 "Prétendant avoir agi par nécessité, les Norvégiens nous refusent toute compensation, affirmant que s’allier aux Soviétiques était vital pour la survie de toutes nos nations. Si l’expansion en Carélie est une chose, la défense de nos frontières face aux Russes est notre principale préoccupation. Et que les Norvégiens, confortablement installés loin de la menace, refusent même de nous compenser est extrêmement décevant..."
naw_norway.44.a:0 "Ces naïfs à l’abri de tout..."

naw_norway.45.t:0 "Motion de censure – Qui dirigera le nouveau gouvernement ?"
naw_norway.45.d:0 "L’ancien gouvernement a été renversé par la motion de censure, et un nouveau sera formé : une coalition dirigée par Høyre, notre parti conservateur. Cependant, il faut décider qui sera Premier ministre de Norvège. Deux bons candidats s’affrontent."
naw_norway.45.a:0 "Ivar Lykke – Il a l’expérience nécessaire et sait faire des compromis."
naw_norway.45.b:0 "C.J. Hambro – Il veut le poste, et a une expérience variée en politique et en littérature."

naw_norway.50.t:0 "[From.GetName] propose un accord"
naw_norway.50.d:0 "Après la séparation de la Norvège du royaume danois en 1814, le traité de Kiel nous donna leurs anciennes îles nord-atlantiques : le Groenland, l’Islande et les Féroé. Malgré quelques désaccords lors de l’occupation temporaire du Groenland oriental par des irrédentistes norvégiens, les Norvégiens reviennent aujourd’hui avec une proposition diplomatique.\n\nEn échange du retour des Féroé et de l’Islande, ils abandonneraient leurs revendications sur le Groenland, s’engageraient à nous défendre en cas d’attaque allemande, et aideraient à négocier le retour du Slesvig et du Holstein. Bien que leurs exigences soient nombreuses, les îles de l’Atlantique Nord n’ont pas une grande importance économique, alors que le Slesvig serait bien plus profitable. Devons-nous accepter, refuser, ou négocier un compromis ?"
naw_norway.50.a:0 "Acceptons, et ajoutons même le Groenland. Il faut se lier à nos frères du Nord à tout prix !"
naw_norway.50.b:0 "Acceptons. Les îles étaient norvégiennes, et le Slesvig-Holstein a plus de valeur."
naw_norway.50.c:0 "Négocions pour garder l’Islande. L’accord est bien trop favorable à la Norvège."
naw_norway.50.e:0 "Refusons. Seule la Norvège profiterait immédiatement d’un tel marché..."

naw_norway.51.t:0 "[From.GetName] accepte l’accord"
naw_norway.51.d:0 "L’accord dano-norvégien proposé a été accepté par [From.GetName], et nos anciennes îles sont de retour sous notre contrôle. Si un jour nous pouvons rendre le Slesvig au Danemark, nous devrons le faire pour respecter notre parole."
naw_norway.51.a:0 "Les Danois sont de bons alliés, réparant l’injustice du traité de Kiel."

naw_norway.52.t:0 "[From.GetName] accepte l’accord, avec une condition"
naw_norway.52.d:0 "Les Danois, bien qu’intéressés par l’accord, l’ont trouvé trop déséquilibré, car seuls les Norvégiens en profitaient immédiatement. Ils ont proposé de garder l’Islande, ce que nos diplomates ont jugé raisonnable et accepté."
naw_norway.52.a:0 "Pas parfait, mais acceptable."

naw_norway.53.t:0 "[From.GetName] rejette l’accord"
naw_norway.53.d:0 "Estimant que l’accord n’apportait rien d’immédiat pour [From.GetName] et que nos demandes étaient excessives, les Danois l’ont rejeté. Ce revers diplomatique pourrait nous pousser à provoquer des révoltes en Islande et aux Féroé, en exploitant leurs liens culturels et historiques avec la Norvège. Mais cela risquerait notre alliance, et si le Danemark ne cède pas, ce serait la guerre..."
naw_norway.53.a:0 "Nous ne risquerons pas notre amitié avec le Danemark. Qu’ils gardent les îles..."
naw_norway.53.b:0 "Inacceptable. Provoquons les révoltes et exigeons nos droits !"

naw_norway.54.t:0 "[From.GetName] provoque des sécessions dans les îles !"
naw_norway.54.d:0 "Les perfides Norvégiens n’ont pas accepté que nous gardions les îles, et ont fomenté des révoltes séparatistes en Islande et aux Féroé. En s’appuyant sur les mouvements autonomistes et nationalistes, ainsi que sur leurs liens culturels, ils ont fait basculer ces îles dans leur camp. Le Groenland reste sûr, mais devons-nous céder à leurs exigences, accepter le statu quo, ou rompre l’alliance et prendre les armes ?"
naw_norway.54.a:0 "Ajoutons même le Groenland et sauvez l’accord initial."
naw_norway.54.b:0 "N’osons rien. Acceptons le statu quo."
naw_norway.54.c:0 "Jamais nous ne tolérerons cette atteinte à notre territoire. À la guerre !"

naw_norway.55.t:0 "[From.GetName] plie et remet le Groenland"
naw_norway.55.d:0 "Les révoltes ont parfaitement réussi. Les Danois ont plié pour sauver l’accord initial, ne voulant pas risquer une guerre. Comme le Groenland était difficile à ravitailler, ils l’ont abandonné. Puisque l’accord initial nous était très favorable, pardonnons-leur et soutenons leurs droits sur le Slesvig si l’occasion se présente."
naw_norway.55.a:0 "Le coup de l’Islande a porté ses fruits."

naw_norway.56.t:0 "[From.GetName] accepte à contrecœur le nouveau statu quo"
naw_norway.56.d:0 "Les Danois, amers face à notre manœuvre, acceptent néanmoins le statu quo et restent dans l’alliance, à condition que leurs navires puissent toujours faire escale aux Féroé et en Islande. En outre, nous ne sommes plus obligés de soutenir leurs revendications sur le Slesvig."
naw_norway.56.a:0 "Obtenir quelque chose pour rien ? Quels hommes d’État de classe mondiale nous avons."

naw_norway.57.t:0 "[From.GetName] nous déclare la guerre !"
naw_norway.57.d:0 "Le coup de l’Islande a échoué de la pire façon ! Les Danois, dénonçant nos manigances comme une ingérence illégale, nous ont déclaré la guerre. Le seul aspect positif est qu’ils ont attaqué les premiers, ce qui pourrait convaincre nos alliés de se ranger à nos côtés."
naw_norway.57.a:0 "Parfois on reçoit plus que ce qu’on a négocié. Les Danois nous forcent la main..."

naw_norway.58.t:0 "[From.GetName] accepte l’accord, et plus encore !"
naw_norway.58.d:0 "L’accord dano-norvégien a été accepté par [From.GetName], et nos anciennes îles, y compris le Groenland ajouté de bonne foi, sont de retour sous notre contrôle. Si un jour nous pouvons rendre le Slesvig au Danemark, nous devrons le faire pour respecter notre parole."
naw_norway.58.a:0 "Les Danois sont de vrais alliés, réparant l’injustice du traité de Kiel."

naw_norway.59.t:0 "L’accord fennoscandien"
naw_norway.59.d:0 "Craignant des incursions sur leurs frontières orientales, les alliés fennoscandiens – Norvège, Suède et Finlande – ont conclu un pacte de garanties mutuelles. La Finlande a cédé les îles Åland à la Suède, tandis que la Suède a rendu le territoire norvégien de Båhuslen. La Norvège, moins exposée, est ainsi incitée à défendre ses alliés, la Suède a limité son ancien rival, et la Finlande bénéficie de garanties sur sa frontière orientale, notamment l’isthme de Carélie."
naw_norway.59.a:0 "Les amis trouvent toujours un accord. Intégrons notre armée dans la dissuasion."
naw_norway.59.b:0 "Ne nous fions pas trop à ces voisins intrigants…"

naw_norway.60.t:0 "Haakon VII abdique"
naw_norway.60.d:0 "Face aux tensions radicales croissantes en Norvège, le roi Haakon, respecté et démocrate, a cédé à la pression pour une nouvelle hiérarchie. Son abdication est immédiate : il a donc régné comme Haakon VII, roi de Norvège, de 1905 à [GetYear]."
naw_norway.60.a:0 "Aussi bon fût-il, la monarchie est dépassée."
naw_norway.60.b:0 "Que se passe-t-il chez nos amis ?"
naw_norway.60.c:0 "La monarchie est inutile au peuple."
naw_norway.60.p:0 "La radicalisation politique agit en Norvège…"

naw_norway.61.t:0 "[From.GetName] propose des conditions"
naw_norway.61.d:0 "Face à l’assaut de notre machine de guerre, les dirigeants [From.GetAdjective] cherchent la paix et proposent de devenir notre État satellite. Cela mettrait fin à la guerre et les obligerait à nous rejoindre dans nos conflits. Que décidons-nous ?"
naw_norway.61.a:0 "Acceptons de diriger [From.GetName] indirectement."
naw_norway.61.b:0 "Seule l’annexion totale est acceptable…"

naw_norway.62.t:0 "[From.GetName] accepte nos conditions"
naw_norway.62.d:0 "[From.GetName] a accepté nos termes de reddition, devenant ainsi notre État satellite. Cela signifie aussi qu’ils participeront à tous nos conflits. Peut-être y a-t-il un jour liberté et paix au loin ?"
naw_norway.62.a:0 "Hélas, nous n’avions plus d’autre choix…"

naw_norway.63.t:0 "[From.GetName] rejette nos conditions"
naw_norway.63.d:0 "[From.GetName] a rejeté nos termes de reddition, ne jugeant acceptable que la domination directe. Cela pourrait devenir un combat pour notre indépendance et notre existence !"
naw_norway.63.a:0 "Alors, la lutte est inévitable…"

naw_norway.64.t:0 "La faction nationaliste de [Root.GetNameDef]"
naw_norway.64.d:0 "Des mesures sont prises pour affirmer nos valeurs dans le monde. Une nouvelle faction pourrait voir le jour grâce au travail acharné de nos représentants. Quel nom donner à cette puissante alliance ?"
naw_norway.64.a:0 "« Aurores boréales », nous illuminerons le monde envieux."
naw_norway.64.b:0 "« Assemblée nordique », car sous notre conduite, le meilleur se réunira."
naw_norway.64.c:0 "« Pacte de pierre », car nous sommes inébranlables, comme nos montagnes."
naw_norway.64.p:0 "Voyons les autres options…"

naw_norway.65.t:0 "La faction nationaliste de [Root.GetNameDef]"
naw_norway.65.d:0 "Des mesures sont prises pour affirmer nos valeurs dans le monde. Une nouvelle faction pourrait voir le jour grâce au travail acharné de nos représentants. Quel nom donner à cette puissante alliance ?"
naw_norway.65.a:0 "« Royaume du Nord », simple et évocateur."
naw_norway.65.b:0 "« Union nordique », une alliance entre peuples frères."
naw_norway.65.c:0 "Reprenons depuis le début."
naw_norway.65.p:0 "Ne décidons pas tout de suite."

naw_norway.70.t:0 "Anciennes traditions ravivées"
naw_norway.70.d:0 "Les anciennes traditions de [ROOT.GetNameDef] connaissent un regain d’intérêt. Certains politiciens et citoyens suggèrent de rétablir les titres aristocratiques (mais sans privilèges), ou même l’ancien drapeau médiéval de Norvège. Quelle voie choisir ?"
naw_norway.70.a:0 "L’aristocratie est dépassée, gardons notre drapeau actuel."
naw_norway.70.b:0 "Des titres honorifiques pour nos citoyens méritants, mais conservons notre drapeau."
naw_norway.70.c:0 "Respectons nos traditions ! Aristocratie ET ancien drapeau glorieux."

naw_norway.71.t:0 "Le siège du pouvoir"
naw_norway.71.d:0 "Dans le passé, [ROOT.GetNameDef] eut plusieurs capitales, notamment Oslo, Bergen (Bjørgvin) et Trondheim (Nidaros). Avec le retour aux traditions, nous pouvons choisir une capitale plus ancienne. Oslo reste la plus grande ville, mais le choix pourrait être impopulaire…"
naw_norway.71.a:0 "Conservons Oslo comme capitale."
naw_norway.71.b:0 "Choisissons Bergen, ancienne capitale et ville commerçante majeure."
naw_norway.71.c:0 "Choisissons Trondheim, ancienne capitale et haut lieu religieux."
naw_norway.72.t:0 "Anciens noms de villes ?"
naw_norway.72.d:0 "Maintenant que des questions symboliques ont été tranchées, il est peut-être temps de se demander si nous devrions rétablir les anciens noms de lieux, notamment pour nos villes. Devons-nous conserver ce que connaissent les générations actuelles, renommer nos plus grandes cités, ou même lancer un vaste programme de renommage incluant aussi certaines petites villes ?"
naw_norway.72.a:0 "N’y touchons pas. L’essentiel, c’est qu’il n’y ait plus de Christiania."
naw_norway.72.b:0 "Renommons les grandes villes. Bjørgvin et Nidaros revivront."
naw_norway.72.c:0 "Un rebranding en profondeur ! Bergen, Trondheim, Ålesund et Hamar pour commencer."

naw_norway.73.t:0 "La coalition monarchiste"
naw_norway.73.d:0 "Maintenant que la coalition monarchiste est au pouvoir, qui doit la diriger dans ses premiers pas pour façonner notre royaume ? Notre plus vieux parti politique, le Parti libéral ? Le Parti agrarien, défenseur des traditions ? Ou peut-être les conservateurs ?"
naw_norway.73.a:0 "Le Parti libéral."
naw_norway.73.b:0 "Le Parti agrarien."
naw_norway.73.c:0 "Le Parti conservateur."

naw_norway.74.t:0 "L’étendue du pouvoir"
naw_norway.74.d:0 "Avec le retour des anciennes traditions, politiciens et partisans du nouvel ancien État se demandent comment celui-ci doit être gouverné. Le Premier ministre doit-il rendre des comptes au roi pour tout, ou conserver une partie des pouvoirs parlementaires ? À quelle fréquence organiser des élections ? Et surtout, jusqu’où doit aller le pouvoir royal dans ce royaume remodelé ?"
naw_norway.74.a:0 "Des élections comme d’habitude, et une monarchie traditionnelle mais constitutionnelle."
naw_norway.74.b:0 "Plus de pouvoirs au roi, mais toujours une monarchie constitutionnelle avec élections."
naw_norway.74.c:0 "Le Premier ministre doit répondre au roi, mais des élections seront maintenues."
naw_norway.74.p:0 "Le roi aura des pouvoirs étendus : une véritable monarchie traditionnelle."

naw_norway.75.t:0 "Des traditions pour lesquelles se battre ?"
naw_norway.75.d:0 "Avec la vague monarchiste qui déferle sur notre pays, de nombreux citoyens rejoignent nos rangs. Faut-il saisir l’instant et recourir à la force, ou attendre que le peuple s’habitue à notre noble point de vue ?"
naw_norway.75.a:0 "Nous combattons à l’aube !"
naw_norway.75.b:0 "Disons plutôt à l’aube… dans un mois. Nous devons nous préparer."
naw_norway.75.c:0 "Le roi n’aimerait pas que l’on déclenche une guerre en son nom. Convainquons-les avec le temps."

naw_norway.76.t:0 "Prêts à combattre ?"
naw_norway.76.d:0 "Un mois s’est écoulé depuis le premier rassemblement de nos partisans monarchistes. Est-ce le moment de frapper, au risque d’une guerre civile ?"
naw_norway.76.a:0 "Nous sommes prêts. À la guerre !"
naw_norway.76.b:0 "Finalement, ce n’était peut-être pas une si bonne idée…"

naw_norway.77.t:0 "La Norvège nous invite à son alliance"
naw_norway.77.d:0 "Dans l’hymne national norvégien, au sixième couplet, il est dit que les Scandinaves doivent se tenir ensemble dans les guerres. Les Norvégiens relancent maintenant le mouvement pan-scandinave (ou pan-nordique) et nous tendent la main."
naw_norway.77.a:0 "Royaumes frères dans la vie et la mort !"
naw_norway.77.b:0 "Peut-être pas dans la mort…"

naw_norway.78.t:0 "[From.GetName] rejoint [Root.GetFactionName]"
naw_norway.78.d:0 "Notre frère [From.GetName] a rejoint notre faction. Que nos peuples s’unissent pour la victoire !"
naw_norway.78.a:0 "Encore quelques bonnes cartes, et nous aurons une quinte royale."

naw_norway.79.t:0 "[From.GetName] refuse notre main"
naw_norway.79.d:0 "[From.GetName] a estimé qu’il était dans son intérêt de refuser notre alliance fondée sur la tradition."
naw_norway.79.a:0 "Un fiasco royal…"

naw_norway.80.t:0 "Les îles Féroé réintégrées"
naw_norway.80.d:0 "Ayant ravivé nos liens avec nos cousins des Féroé, ils se sentent désormais chez eux et cherchent à s’intégrer dans leur ancienne patrie. [Root.GetName] les accueille à nouveau. Mais comment nommer ces îles désormais intégrées ?"
naw_norway.80.a:0 "Avec le bokmål, langue écrite de la majorité."
naw_norway.80.b:0 "Avec le nynorsk, langue écrite la plus proche des dialectes et de l’ancien norvégien."
naw_norway.80.c:0 "Utilisons la langue des Féringiens eux-mêmes."

naw_norway.81.t:0 "L’Islande réintégrée"
naw_norway.81.d:0 "Le destin nous réunit à nouveau avec l’île des sagas vikings. D’abord colonisée par des Norvégiens fuyant leur roi, intégrée ensuite au royaume norvégien, puis perdue avec le traité de Kiel, l’Islande retrouve aujourd’hui sa place naturelle à nos côtés grâce à notre culture, notre histoire et notre parenté."
naw_norway.81.a:0 "Un nouvel épisode digne d’une saga."

naw_norway.82.t:0 "Le Groenland réintégré"
naw_norway.82.d:0 "Si les colons norvégiens et islandais disparurent jadis, le Groenland fut réintégré au XVIIIe siècle par une mission dano-norvégienne. Le traité de Kiel nous l’arracha sans notre consentement. Aujourd’hui, il revient enfin à nous. Les Inuits, bien qu’intégrés plus difficilement car sans ascendance norvégienne directe, commencent à trouver leur place dans notre nation."
naw_norway.82.a:0 "Les Groenlandais prospéreront dans notre pays."

naw_norway.83.t:0 "Le Jämtland réintégré"
naw_norway.83.d:0 "Les paysages rudes et magnifiques du Jämtland, ainsi que ses habitants, font à nouveau partie de notre nation. Mais comment nommer cette région ? Avec le bokmål moderne, le nynorsk plus traditionnel, ou encore son ancien nom en vieux norrois ?"
naw_norway.83.a:0 "Utilisons la langue de la majorité : le bokmål."
naw_norway.83.b:0 "Restons fidèles aux traditions et dialectes locaux : le nynorsk."
naw_norway.83.c:0 "Retournons à nos racines communes : le vieux norrois."

naw_norway.84.t:0 "Le Båhuslen réintégré"
naw_norway.84.d:0 "Le Båhuslen fut terre norvégienne pendant 800 ans avant d’être perdu dans les guerres dano-suédoises. Récupéré brièvement, il ne fut jamais inscrit dans les traités de paix. Aujourd’hui, il revient à nous, et ses habitants se montrent prêts à contribuer à leur nouvelle patrie, forts de notre histoire et de notre héritage commun."
naw_norway.84.a:0 "Notre population croît, et notre littoral aussi."
naw_norway.84.b:0 "Notre très ancien littoral norvégien."
naw_norway.84.c:0 "Très, très ancien, en effet…"

naw_norway.85.t:0 "Les Shetland réintégrées"
naw_norway.85.d:0 "Les Shetland faisaient jadis partie du Jarldom norvégien des Orcades, l’un des titres les plus prestigieux du royaume. Repassées sous notre contrôle, nous travaillons à les réintégrer. Mais comment les nommer : Shetland ou Hjaltland ?"
naw_norway.85.a:0 "Shetland est une version moderne acceptable…"
naw_norway.85.b:0 "Mais l’original est imbattable : ce sera Hjaltland !"

naw_norway.86.t:0 "Les Orcades réintégrées"
naw_norway.86.d:0 "Les Orcades furent jadis le cœur du Jarldom éponyme. Aujourd’hui de retour sous notre souveraineté, elles présentent un héritage mêlé de norrois, de celte et d’écossais. Les habitants sont intégrés, mais reste la question du nom : moderne, traditionnel ou ancestral ?"
naw_norway.86.a:0 "Le bokmål moderne suffira. Avec le samnorsk, c’est assez norvégien."
naw_norway.86.b:0 "Nynorsk bien sûr ! Une langue basée sur la façon de parler norvégienne."
naw_norway.86.c:0 "Reprenons où nous avions laissé : avec le vieux norrois."

naw_norway.100.t:0 "Les procès de Moscou"
naw_norway.100.d:0 "L’Union soviétique traverse de profonds bouleversements internes. De nombreuses figures de pouvoir ont été jugées lors des déjà tristement célèbres procès de Moscou.\n\nLa presse internationale a noté que beaucoup d’accusés ont avoué d’énormes crimes. Ont-ils été forcés ? Le secrétaire général veut-il éliminer ses opposants ?\n\nEn Norvège, l’opinion publique condamne ces procès jugés injustes et douteux. Plusieurs partis prennent leurs distances du Komintern. Comment devons-nous réagir ?"
naw_norway.100.a:0 "Condamnons ces procès injustes et laissons la presse informer librement."
naw_norway.100.b:0 "Occultons le pire, les travailleurs ont besoin du socialisme."
naw_norway.100.c:0 "Utilisons cette farce pour nourrir le nationalisme et l’anticommunisme."
naw_norway.100.p:0 "Preuve que nos traditions solides sont le meilleur rempart contre l’extrémisme."

naw_norway.101.t:0 "La Norvège se rapproche de l’Allemagne"
naw_norway.101.d:0 "[From.GetLeader] a annoncé que [From.GetName] devait renforcer ses liens avec son peuple frère allemand. Les ministres allemands s’en réjouissent, et lors d’une récente visite d’État, une coopération mutuelle a été actée."
naw_norway.101.a:0 "Un choix avisé."
naw_norway.101.b:0 "Que manigancent nos voisins ?"
naw_norway.101.c:0 "Apportez le schnaps, portons un toast à nos nouveaux amis !"
naw_norway.101.p:0 "Les amis de nos amis pourraient être nos amis !"
naw_norway.101.e:0 "Quel jugement douteux en Europe du Nord-Ouest…"
naw_norway.101.f:0 "Prenons bonne note de cet événement."

naw_norway.102.t:0 "La Norvège se rapproche des Soviétiques"
naw_norway.102.d:0 "\n[From.GetLeader] a annoncé l’amitié et la coopération mutuelle entre [From.GetName] et ses voisins orientaux. Les Russes s’en réjouissent, et lors d’une récente visite, la bonne entente était manifeste."
naw_norway.102.a:0 "Un choix avisé."
naw_norway.102.b:0 "Que manigancent nos voisins ?"
naw_norway.102.c:0 "Apportez la vodka, portons un toast à nos nouveaux amis !"
naw_norway.102.p:0 "Les amis de nos amis pourraient être nos amis !"
naw_norway.102.e:0 "Quel jugement douteux en Europe du Nord-Ouest…"
naw_norway.102.f:0 "Prenons bonne note de cet événement."

naw_norway.140.t:0 "La guerre civile norvégienne"
naw_norway.140.d:0 "Alors que le monde voit émerger de nouveaux idéaux radicaux, la Norvège suit une autre voie. Beaucoup souhaitent un retour aux valeurs anciennes et à un royaume traditionnel – cette fois sans Copenhague ni Stockholm.\n\nLes conservateurs, centristes, agrariens et monarchistes, avec une partie de l’armée, veulent restaurer cet État. Dans la capitale, une forte résistance s’organise et des volontaires étrangers affluent. La guerre civile norvégienne a commencé."
naw_norway.140.a:0 "Famille et traditions d’abord !"
naw_norway.140.b:0 "Fraternité et démocratie avant tout !"
naw_norway.140.c:0 "Une guerre civile voisine ? Mieux vaut rester prudents…"
naw_norway.140.p:0 "Combattre pour la monarchie ? Cela ne profite pas au peuple. Les monarchistes norvégiens se bercent d’illusions…"
naw_norway.140.e:0 "Comment cela a-t-il pu arriver en Norvège ?"

naw_norway.141.t:0 "Fin de la guerre civile – Opposition capturée !"
naw_norway.141.d:0 "Après la prise d’Oslo et des derniers bastions ennemis, nous avons capturé les chefs rebelles. Certains exigent des punitions sévères, d’autres prônent la clémence. Que faire ?"
naw_norway.141.a:0 "Travaux forcés pour tous ceux qui ont poussé à l’insurrection !"
naw_norway.141.b:0 "Travaux forcés seulement pour les pires coupables."

naw_norway.142.t:0 "La guerre civile norvégienne est terminée"
naw_norway.142.d:0 "Après la prise d’Oslo, la victoire monarchiste était inévitable. Les forces monarchistes et traditionalistes ont rétabli la monarchie, et la réforme peut commencer.\n\nLes opposants seront jugés, et le roi Haakon, hostile à la guerre civile, se réjouit du retour de la paix. Le temps est venu de guérir les blessures."
naw_norway.142.a:0 "La victoire est à nous !"
naw_norway.142.b:0 "Le peuple norvégien ne souffrira plus de la guerre."
naw_norway.142.c:0 "Bonne nouvelle."

naw_norway.145.t:0 "Séparatistes aux Féroé et en Islande"
naw_norway.145.d:0 "La guerre entre Norvège et Danemark prend une nouvelle tournure : les Norvégiens, avec des Islandais et Féringiens influents, ont déclenché des révoltes contre la domination danoise. Cela affaiblira sûrement la cause danoise."
naw_norway.145.a:0 "Une victoire diplomatique, même en temps de guerre."
naw_norway.145.b:0 "Une manœuvre bien sale, même en temps de guerre."
naw_norway.145.c:0 "Peut-être que les Norvégiens avaient leurs raisons après tout…"

naw_norway.146.t:0 "Le Groenland confié à [ICE.GetNameDef]"
naw_norway.146.d:0 "\nDésormais duché autonome de [NOR.GetNameDef], le Groenland a été confié à [ICE.GetNameDef] par le gouvernement [NOR.GetAdjective], probablement avec l’aval du monarque. Cela permet aux Norvégiens du continent de concentrer leurs efforts ailleurs. Des conseillers norvégiens restent intégrés aux forces islandaises pour assurer une défense adéquate."
naw_norway.146.a:0 "Le Groenland a déjà été terrain islandais, ils sauront gérer."
naw_norway.146.b:0 "Le Groenland a déjà été terrain islandais. Nous sommes confiants."
naw_norway.146.c:0 "On délègue aux gouvernements locaux ? Il semblerait que certains soient débordés."

naw_norway.150.t:0 "La faction monarchiste de [Root.GetNameDef]"
naw_norway.150.d:0 "Des mesures sont prises pour affirmer nos valeurs dans le monde. Une nouvelle faction ambitieuse pourrait voir le jour. Quel nom donner à cette alliance ?"
naw_norway.150.a:0 "« Ligue royale ». Et maintenant, si vous le permettez, une petite pause football."
naw_norway.150.b:0 "« Union monarchiste ». Pas besoin de laisser place à l’imagination."
naw_norway.150.c:0 "« Union des rois ». Le pluriel est important pour que Danois et Suédois n’aient pas d’idées."
naw_norway.150.p:0 "Voyons les autres options…"
naw_norway.151.t:0 "La faction monarchiste de [Root.GetNameDef]"
naw_norway.151.d:0 "Des mesures sont bel et bien prises pour projeter nos valeurs dans le monde. Une nouvelle faction pourrait voir le jour après le travail acharné de nos représentants et hommes d’État. Quel nom donner à cette nouvelle alliance ambitieuse ?"
naw_norway.151.a:0 "« Royaumes fraternels » sonne bien. Cela a une belle résonance."
naw_norway.151.b:0 "« Royaume du Nord », bien sûr. La géographie est trop sous-estimée."
naw_norway.151.c:0 "« Union nordique ». Simple, et cela laisse la place à d’éventuelles républiques traditionalistes. Hei Suomi !"
naw_norway.151.p:0 "Hmmm… Voyons encore plus d’options, s’il vous plaît…"

naw_norway.152.t:0 "La faction monarchiste de [Root.GetNameDef]"
naw_norway.152.d:0 "Des mesures sont bel et bien prises pour projeter nos valeurs dans le monde. Une nouvelle faction pourrait voir le jour après le travail acharné de nos représentants et hommes d’État. Quel nom donner à cette nouvelle alliance ambitieuse ?"
naw_norway.152.a:0 "« Grande Alliance du Nord », car la monarchie garde toujours une part de grandeur."
naw_norway.152.b:0 "« Pacte princier », simple et élégant."
naw_norway.152.c:0 "Reprenons tout depuis le début."
naw_norway.152.p:0 "Ne faisons pas ce choix tout de suite."

naw_norway.153.t:0 "Invitation à la Société royale de Norvège"
naw_norway.153.d:0 "La Société royale de Norvège est l’institution scientifique et savante la plus ancienne de [From.GetNameDef]. Désormais, [From.GetNameDef], s’intéressant de plus en plus au-delà de ses frontières, a transformé cette société autrefois nationale, qui décernait des prix aux innovations norvégiennes, en une institution académique internationale. Prestigieuse, elle est placée sous la protection du monarque de Norvège, et nous avons reçu une invitation à y participer. Cette collaboration pourrait permettre le partage de technologies entre tous les États membres. Quelle doit être notre réponse ?"
naw_norway.153.a:0 "Évidemment que nous rejoindrons. C’est un honneur."
naw_norway.153.b:0 "Même si cela semble profitable à tous, nous tenons à notre indépendance : refusons."
naw_norway.153.c:0 "Ça a l’air intéressant, mais nous devons décliner, désolé."

naw_norway.154.t:0 "[From.GetName] envoie des universitaires à la Société royale de Norvège"
naw_norway.154.d:0 "[From.GetName] a décidé de rejoindre notre prestigieuse institution académique, la Société royale de Norvège. Un peu d’influence extérieure peut nous être bénéfique, tout comme nos savants leur seront utiles."
naw_norway.154.a:0 "Nous accueillons leurs érudits dans notre Société !"

naw_norway.155.t:0 "[From.GetName] refuse de rejoindre la Société royale de Norvège"
naw_norway.155.d:0 "[From.GetName] a décidé de ne pas rejoindre notre prestigieuse institution académique. Même si cela aurait pu profiter à tous, ils préfèrent garder leurs plus brillants esprits pour eux seuls."
naw_norway.155.a:0 "Dommage, nous aurions accueilli leurs savants avec plaisir."

naw_norway.160.t:0 "[From.GetName] veut s’allier avec le Kaiserreich"
naw_norway.160.d:0 "[From.GetName] nous a adressé une demande d’alliance. Le royaume traditionnel du Nord et ses États soumis se joindraient à nous si nous acceptons."
naw_norway.160.a:0 "Acceptons. Plus d’amis pour le Kaiserreich."
naw_norway.160.b:0 "Refusons. Nous nous débrouillons très bien seuls."

naw_norway.161.t:0 "[From.GetName] accepte de nous intégrer à son alliance"
naw_norway.161.d:0 "Le Kaiser allemand et ses représentants ont accepté notre adhésion à leur faction. Construisons ensemble un monde meilleur."
naw_norway.161.a:0 "Excellente nouvelle."

naw_norway.162.t:0 "[From.GetName] rejette notre demande d’alliance…"
naw_norway.162.d:0 "Le Kaiser allemand a refusé notre généreuse proposition de nous allier à lui."
naw_norway.162.a:0 "Une bien triste nouvelle."

naw_norway.163.t:0 "[From.GetName] veut s’allier avec l’Empire"
naw_norway.163.d:0 "[From.GetName] nous a adressé une demande d’alliance. Le royaume traditionnel du Nord et ses États soumis se joindraient à nous si nous acceptons."
naw_norway.163.a:0 "Acceptons. Plus d’amis pour l’Empire."
naw_norway.163.b:0 "Refusons. Nous nous débrouillons très bien seuls."

naw_norway.164.t:0 "[From.GetName] accepte de nous intégrer à son alliance"
naw_norway.164.d:0 "Le roi britannique et ses représentants ont accepté notre adhésion à leur faction. Construisons ensemble un monde meilleur."
naw_norway.164.a:0 "Excellente nouvelle."

naw_norway.165.t:0 "[From.GetName] rejette notre demande d’alliance…"
naw_norway.165.d:0 "Le roi britannique a refusé notre généreuse proposition de nous allier à lui."
naw_norway.165.a:0 "Une bien triste nouvelle."

naw_norway.170.t:0 "[From.GetName] demande une compensation pour son aide"
naw_norway.170.d:0 "Les Norvégiens, après s’être alliés à nous, ont déclaré vouloir une compensation pour leur aide à la défense de nos terres et de notre Empire. Leur demande : la restitution de leur ancien territoire, les îles Shetland."
naw_norway.170.a:0 "C’est juste, qu’ils reprennent les Shetland."
naw_norway.170.b:0 "Non, nous gardons ces îles."

naw_norway.171.t:0 "[From.GetName] accepte de céder les Shetland"
naw_norway.171.d:0 "Les Britanniques ont accepté notre accord : les Shetland seront transférées prochainement. Les frontières maritimes seront réglées plus tard."
naw_norway.171.a:0 "Merci beaucoup."

naw_norway.172.t:0 "[From.GetName] refuse de céder les Shetland"
naw_norway.172.d:0 "Les Britanniques ont jugé notre proposition inacceptable : les Shetland resteront à eux."
naw_norway.172.a:0 "Décevant."

naw_norway.173.t:0 "[From.GetName] demande une compensation pour son aide"
naw_norway.173.d:0 "Les Norvégiens, après s’être alliés à nous, ont déclaré vouloir une compensation pour leur aide à la défense de nos terres et de notre Empire. Cette fois, ils visent les îles Orcades et Shetland. Devons-nous céder, négocier à la baisse, ou refuser net ?"
naw_norway.173.a:0 "Qu’ils reprennent leurs anciennes îles !"
naw_norway.173.b:0 "Ne donnons que les Shetland, ils finiront par accepter."
naw_norway.173.c:0 "Rejetons toute concession."

naw_norway.174.t:0 "[From.GetName] accepte de céder les Orcades et Shetland"
naw_norway.174.d:0 "Les Britanniques jugent notre accord équitable et ont commencé le transfert des îles. Les frontières maritimes seront fixées ensuite."
naw_norway.174.a:0 "Merci infiniment."

naw_norway.175.t:0 "[From.GetName] accepte de céder les Shetland mais pas les Orcades"
naw_norway.175.d:0 "Les Britanniques ont trouvé l’accord presque acceptable, mais souhaitent garder les Orcades. Nos diplomates ont accepté par peur de repartir les mains vides."
naw_norway.175.a:0 "Merci tout de même."

naw_norway.176.t:0 "[From.GetName] rejette toute cession d’îles"
naw_norway.176.d:0 "Les Britanniques jugent notre accord inacceptable et conservent toutes leurs îles. Nos diplomates sont revenus bredouilles."
naw_norway.176.a:0 "Merci d’avoir écouté…"

naw_norway.180.t:0 "Une faction anti-bolchevique ?"
naw_norway.180.d:0 "Face aux menaces grandissantes contre l’ordre ancien et les traditions, [FROM.GetNameDef] nous a invités à rejoindre une nouvelle faction de pays monarchistes et traditionalistes. Selon eux, cette alliance vise à contrer les idéologies extrêmes et l’agression militaire, en particulier le bolchevisme.\n\n Devons-nous la rejoindre ? Nos pays vassaux suivraient, mais nos autres alliés actuels auraient le choix."
naw_norway.180.a:0 "Oui, que cette grande alliance voie le jour !"
naw_norway.180.b:0 "Ne vaudrait-il pas mieux qu’ils nous rejoignent ? Faisons une contre-proposition."
naw_norway.180.c:0 "Comment le Nord peu peuplé pourrait-il nous aider ?"

naw_norway.181.t:0 "[FROM.GetName] rejoint l’Alliance traditionaliste"
naw_norway.181.d:0 "Nous accueillons nos nouveaux amis de [FROM.GetName] dans notre alliance. Un grand jour pour nos valeurs."
naw_norway.181.a:0 "Nous en sortons renforcés !"

naw_norway.182.t:0 "[FROM.GetName] refuse de rejoindre l’Alliance traditionaliste"
naw_norway.182.d:0 "[FROM.GetName] estime qu’il est dans son intérêt de suivre sa propre voie, sans nous."
naw_norway.182.a:0 "Visiblement, ce n’était pas pour eux."

naw_norway.183.t:0 "La contre-proposition diplomatique de [FROM.GetName]"
naw_norway.183.d:0 "[FROM.GetNameDefCap], à la tête d’une alliance, ne souhaite pas rejoindre directement la nôtre, mais propose que nous et nos États dépendants rejoignions la sienne à la place. Comment répondre ?"
naw_norway.183.a:0 "Acceptons, suivons leur direction."
naw_norway.183.b:0 "Tentant, mais se soumettre à leur direction serait nous dévaloriser."

naw_norway.184.t:0 "[FROM.GetName] accepte notre contre-proposition"
naw_norway.184.d:0 "Les dirigeants [FROM.GetAdjective] ont accepté notre offre généreuse de rejoindre notre faction au lieu que nous rejoignions la leur. Le compromis a encore triomphé."
naw_norway.184.a:0 "Un choix avisé."

naw_norway.185.t:0 "[FROM.GetName] rejette notre contre-proposition"
naw_norway.185.d:0 "Les dirigeants [FROM.GetAdjective] ont rejeté notre offre généreuse de rejoindre notre faction au lieu que nous rejoignions la leur. Dommage qu’ils ne puissent pas faire preuve de compromis."
naw_norway.185.a:0 "Il semble qu’ils ignorent tout de l’art du compromis."

naw_norway.186.t:0 "Le chef de faction rejoint celle de [FROM.FROM.GetNameDef]"
naw_norway.186.d:0 "Notre ancien chef de faction [FROM.GetName] a décidé de renforcer l’alliance en rejoignant la faction de [FROM.FROM.GetName]. Les autres membres, nous compris, sont invités à les suivre."
naw_norway.186.a:0 "Bien sûr, allons avec eux."
naw_norway.186.b:0 "Non, restons indépendants."

naw_norway.187.t:0 "Un membre de la faction de [FROM.FROM.GetNameDef] nous rejoint"
naw_norway.187.d:0 "En plus du chef de faction [FROM.FROM.GetName], d’autres pays avaient le choix de nous suivre. [FROM.GetNameDef] a décidé de le faire."
naw_norway.187.a:0 "Eh bien, bienvenue dans notre faction."

naw_norway.188.t:0 "Un membre de la faction de [FROM.FROM.GetNameDef] reste à l’écart"
naw_norway.188.d:0 "En plus du chef de faction [FROM.FROM.GetName], d’autres pays avaient le choix de nous suivre. Dans ce cas, [FROM.GetNameDef] a décidé de rester à l’écart."
naw_norway.188.a:0 "Bonne chance à eux, malgré tout."

naw_norway.199.t:0 "Les multiples responsabilités du roi"
naw_norway.199.d:0 "Le risque de conflit avec sa patrie d’origine, [DEN.getName], étant moindre, le roi Haakon VII peut désormais envisager un rôle plus direct en temps de guerre. Bien qu’il ait déjà de lourdes responsabilités en tant que monarque, certaines peuvent être déléguées. Cela libérerait le roi pour un rôle supplémentaire, susceptible d’inspirer l’armée et le peuple.\n\nEn théorie chef suprême, le commandement opérationnel reste confié aux officiers de carrière. Le rôle de conseiller serait le plus sûr. Mais Haakon pourrait aussi servir de commandant de l’armée, ce qui galvaniserait les troupes, ou de commandant naval, son domaine de compétence."
naw_norway.199.a:0 "Qu’Haakon VII soit §Yconseiller§!, c’est sensé et sûr."
naw_norway.199.b:0 "Qu’Haakon VII soit §Ycommandant de l’armée§!, cela inspirera les soldats."
naw_norway.199.c:0 "Qu’Haakon VII soit §Ycommandant naval§!, c’est son domaine."
naw_norway.199.p:0 "Il devrait simplement garder ses fonctions actuelles. Mauvaise idée."

naw_norway.200.t:0 "La garde de neutralité [ROOT.GetAdjective]"
naw_norway.200.d:0 "[ROOT.GetLeader] et [ROOT.GetRulingParty] ont décidé de maintenir [ROOT.GetNameDef] à l’écart des conflits par les mêmes moyens qu’au temps de la Grande Guerre : une neutralité armée. Espérons que les grandes puissances l’acceptent encore. Sinon, une garde de neutralité moderne devra dissuader toute agression. Cela passe par une flotte côtière et une armée bien équipée."
naw_norway.200.a:0 "Parfait. Une armée forte dissuadera toute invasion."
naw_norway.200.b:0 "Parfait. Une politique équilibrée, terre et mer sont toutes deux vitales."
naw_norway.200.c:0 "Parfait. Une présence navale forte dissuadera toute tentative."

naw_norway.201.t:0 "[From.GetName] déclare la neutralité armée"
naw_norway.201.d:0 "[From.GetNameDefCap] a décidé de rester neutre comme en 14–18. Soutenue par une préparation militaire accrue, cette politique vise à éloigner tout conflit de leurs frontières. Mais le monde respectera-t-il cette neutralité ?"
naw_norway.201.a:0 "Pour l’instant, aucun danger immédiat."
naw_norway.201.b:0 "Cette neutralité résistera-t-elle aux agressions régionales ?"
naw_norway.201.c:0 "Bah, ils auront essayé…"
naw_norway.201.p:0 "Si ça a marché la dernière fois…"

naw_norway.202.t:0 "[GER.GetName] viole la neutralité [NOR.GetAdjective] !"
naw_norway.202.d:0 "[GER.GetName] refuse d’avoir [NOR.GetNameDef] comme voisin neutre. Quoi qu’il en soit, la Norvège est maintenant menacée par la puissance industrielle du Sud."
naw_norway.202.a:0 "Heureusement, nous semblons prêts."
naw_norway.202.b:0 "Nos forces semblent au moins à la hauteur."
naw_norway.202.c:0 "Hélas, nous ne sommes pas préparés."
naw_norway.202.p:0 "Au final, les Norvégiens auraient pris le parti de nos ennemis…"
naw_norway.202.e:0 "[GER.GetNameDef] n’a jamais fait confiance à la neutralité norvégienne."

naw_norway.203.t:0 "[ENG.GetName] viole la neutralité [NOR.GetAdjective] !"
naw_norway.203.d:0 "[ENG.GetName] refuse d’avoir [NOR.GetNameDef] comme voisin neutre. Veulent-ils couper le fer suédois vers l’Allemagne ? Quoi qu’il en soit, la Norvège est menacée par son voisin de la mer du Nord."
naw_norway.203.a:0 "Heureusement, nous semblons prêts."
naw_norway.203.b:0 "Nos forces semblent au moins à la hauteur."
naw_norway.203.c:0 "Hélas, nous ne sommes pas préparés."
naw_norway.203.p:0 "Impossible de les laisser commercer avec nos ennemis."
naw_norway.203.e:0 "[ENG.GetNameDef] n’a jamais fait confiance à la neutralité norvégienne."

naw_norway.204.t:0 "La neutralité [NOR.GetAdjective] violée !"
naw_norway.204.d:0 "Les ennemis de [NOR.GetNameDef] ont jugé qu’il était dans leur intérêt de ne pas laisser [NOR.GetNameDef] neutre. Observateurs extérieurs s’interrogent : commerce suspect ? Méfiance excessive ?"
naw_norway.204.a:0 "Heureusement, nous semblons prêts."
naw_norway.204.b:0 "Nos forces semblent au moins à la hauteur."
naw_norway.204.c:0 "Hélas, nous ne sommes pas préparés."
naw_norway.204.p:0 "Peu importe ce que pensent les observateurs, nous seuls comprenons notre plan !"
naw_norway.204.e:0 "Pourquoi une telle décision soudaine et radicale ?"

naw_norway.205.t:0 "[From.GetName] demande à rejoindre notre faction"
naw_norway.205.d:0 "Après la violation de leur neutralité, [From.GetNameDef] sollicite notre protection en rejoignant notre faction. Devons-nous les accepter ?"
naw_norway.205.a:0 "Oui, ils peuvent compter sur nous."
naw_norway.205.b:0 "Non, ce ne serait qu’un fardeau…"

naw_norway.206.t:0 "[From.GetName] accepte notre adhésion"
naw_norway.206.d:0 "Nos amis de [From.GetNameDef] nous accueillent dans leur alliance. Nos agresseurs sauront que nous avons du soutien !"
naw_norway.206.a:0 "De vrais amis répondent toujours à l’appel."

naw_norway.207.t:0 "[From.GetName] refuse notre adhésion"
naw_norway.207.d:0 "[From.GetName] a estimé que nous aider serait trop contraignant…"
naw_norway.207.a:0 "Pas de chance… Faut-il chercher ailleurs ?"

naw_norway.210.t:0 "[From.GetName] demande une révision du traité de Kiel"
naw_norway.210.d:0 "Le traité de Kiel, signé après les guerres napoléoniennes, a séparé la Norvège de ses territoires atlantiques. Les Norvégiens affirment que ces îles avaient de forts liens avec eux, contrairement au Danemark. Allons-nous les soutenir ?"
naw_norway.210.a:0 "D’accord, soutenons leur demande."
naw_norway.210.b:0 "Non, ne bousculons pas le statu quo."

naw_norway.211.t:0 "[From.GetName] accepte la révision du traité de Kiel"
naw_norway.211.d:0 "Grâce à nos arguments et à notre utilité dans l’effort de guerre, [From.GetName] a décidé de soutenir notre proposition. Une grande injustice corrigée !"
naw_norway.211.a:0 "Excellente nouvelle."

naw_norway.212.t:0 "[From.GetName] rejette la révision du traité de Kiel"
naw_norway.212.d:0 "Malgré nos arguments solides, [From.GetName] a décidé de maintenir le statu quo. Une grande injustice demeure."
naw_norway.212.a:0 "Terrible nouvelle."

naw_norway.213.t:0 "[From.GetName] accepte la révision du traité de Kiel"
naw_norway.213.d:0 "Nos arguments étaient solides, mais [From.GetName] soutient la Norvège. Espérons au moins qu’ils compensent le Danemark."
naw_norway.213.a:0 "Mauvaise nouvelle, était-ce vraiment une priorité ?"

naw_norway.214.t:0 "[From.GetName] accepte la révision du traité de Kiel"
naw_norway.214.d:0 "[From.GetName] a décidé de soutenir les revendications norvégiennes. Cela nous rapprochera sûrement des Norvégiens. Est-ce une bonne chose ? Espérons que oui."
naw_norway.214.a:0 "De la famille éloignée à la famille proche."
naw_norway.214.b:0 "Non, même si ce ne sont pas les Danois, refusons cela."
naw_norway.215.t:0 "[From.GetName] consent à notre réunification"
naw_norway.215.d:0 "Les [FROM.GetAdjectiveCap] peuvent en fait être considérés comme certains des plus purs fils de [ROOT.GetNameDef], du moins si l’on en croit l’histoire ancienne, et ils ont désormais accepté notre réunification, bien que les termes leur aient accordé une certaine autonomie."
naw_norway.215.a:0 "Bienvenue parmi nous, frères !"

naw_norway.216.t:0 "[From.GetName] rejette notre réunification"
naw_norway.216.d:0 "Les [FROM.GetAdjectiveCap] peuvent en fait être considérés comme certains des plus purs fils de [ROOT.GetNameDef], du moins si l’on en croit l’histoire ancienne, mais malgré cela, ils ont refusé la réunification de [FROM.GetName] et [ROOT.GetName], bien qu’une autonomie ait été promise."
naw_norway.216.a:0 "Nos frères ne sont pas revenus..."

naw_norway.230.t:0 "Création de Nortraship"
naw_norway.230.d:0 "Alors que le conflit s’abat sur nous, la création d’une administration maritime commune pour gérer et exploiter notre vaste et moderne flotte marchande en temps de guerre a été proposée et mise en place. Avec des bureaux situés dans des pays amis, la flotte marchande pourra aussi être administrée depuis des territoires neutres ou alliés si le besoin s’en fait sentir.\n\nL’initiative a été baptisée « Norwegian Shipping and Trade Mission », ou Nortraship en abrégé, et elle pourrait devenir très importante, non seulement pour nos marins et notre pays, mais aussi pour tout grand allié de [ROOT.GetNameDef], car la portée, l’ampleur et l’efficacité de la flotte marchande [ROOT.GetAdjective] sont de tout premier plan, avec des navires allant des vieux bateaux à vapeur aux moteurs modernes, et aussi variés que des pétroliers, des baleiniers, des cargos de fruits et bien plus encore. Grâce à cela, le flux de ravitaillement à travers l’océan Atlantique ne devrait pas s’interrompre de sitôt."
naw_norway.230.a:0 "Un plan pour l’administration de la flotte marchande est désormais établi."

naw_norway.231.t:0 "[FROM.GetName] coordonne la flotte marchande avec [ENG.GetNameDef]"
naw_norway.231.d:0 "\nEngagé dans le conflit, [FROM.GetNameDef] a mis en place une administration maritime commune pour gérer sa vaste flotte marchande [FROM.GetAdjective] en temps de guerre, appelée « Norwegian Shipping and Trade Mission », ou Nortraship en abrégé. Grâce à cela, les intérêts de [FROM.GetNameDef] et de ses marins [FROM.GetAdjective] devraient être protégés, tout en assurant le flux d’approvisionnement vers leurs principaux alliés.\n\nL’accord entre les délégués [FROM.GetAdjective] et [ENG.GetAdjective] a finalement été signé, bien que des compromis aient été nécessaires, tant sur l’administration de la flotte que sur les salaires des marins. Les inquiétudes de [ENG.GetName] quant à l’acheminement de suffisamment de pétrole et de ravitaillement à travers l’Atlantique ont ainsi été fortement réduites."
naw_norway.231.a:0 "Même face aux puissants intérêts et à l’influence de [ENG.GetNameDef], un bon accord."
naw_norway.231.b:0 "[FROM.GetName] avait des exigences difficiles, mais un accord a finalement été trouvé sur ce point crucial."
naw_norway.231.c:0 "La flotte marchande [FROM.GetAdjective] travaille désormais contre nous, une victoire majeure pour nos ennemis."
naw_norway.231.p:0 "La flotte marchande [FROM.GetAdjective] travaille désormais pour [ENG.GetNameDef], un grand avantage pour eux."

naw_norway.232.t:0 "[FROM.GetName] coordonne la flotte marchande avec [GER.GetNameDef]"
naw_norway.232.d:0 "\nEngagé dans le conflit, [FROM.GetNameDef] a mis en place une administration maritime commune pour gérer sa vaste flotte marchande [FROM.GetAdjective] en temps de guerre, appelée « Norwegian Shipping and Trade Mission », ou Nortraship en abrégé. Grâce à cela, les intérêts de [FROM.GetNameDef] et de ses marins [FROM.GetAdjective] devraient être protégés, tout en assurant le flux d’approvisionnement vers leurs principaux alliés.\n\nL’accord entre les délégués [FROM.GetAdjective] et [GER.GetAdjective] a finalement été signé, bien que des compromis aient été nécessaires, tant sur l’administration de la flotte que sur les salaires des marins. Même si [FROM.GetNameDef] a pu se sentir contraint par les circonstances, la coordination navale norvégienne-allemande est désormais bien réelle."
naw_norway.232.a:0 "Même face aux puissants intérêts et à l’influence de [GER.GetNameDef], un bon accord."
naw_norway.232.b:0 "[FROM.GetName] avait des exigences difficiles, mais un accord a finalement été trouvé sur ce point crucial."
naw_norway.232.c:0 "La flotte marchande [FROM.GetAdjective] travaille désormais contre nous, une victoire majeure pour nos ennemis."
naw_norway.232.p:0 "La flotte marchande [FROM.GetAdjective] travaille désormais pour [GER.GetNameDef], un grand avantage pour eux."

naw_norway.233.t:0 "[FROM.GetName] coordonne la flotte marchande avec [GER.GetNameDef]"
naw_norway.233.d:0 "\nEngagé dans le conflit, [FROM.GetNameDef] a mis en place une administration maritime commune pour gérer sa vaste flotte marchande [FROM.GetAdjective] en temps de guerre, appelée « Norwegian Shipping and Trade Mission », ou Nortraship en abrégé. Grâce à cela, les intérêts de [FROM.GetNameDef] et de ses marins [FROM.GetAdjective] devraient être protégés, tout en assurant le flux d’approvisionnement vers leurs principaux alliés.\n\nL’accord entre les délégués [FROM.GetAdjective] et [GER.GetAdjective] a finalement été signé, bien que des compromis aient été nécessaires, tant sur l’administration de la flotte que sur les salaires des marins. Malgré de solides liens historiques avec [ENG.GetNameDef], les circonstances politiques récentes ont conduit [FROM.GetNameDef] à s’aligner sur [GER.GetNameDef]."
naw_norway.233.a:0 "Même face aux puissants intérêts et à l’influence de [GER.GetNameDef], un bon accord."
naw_norway.233.b:0 "[FROM.GetName] avait des exigences difficiles, mais un accord a finalement été trouvé sur ce point crucial."
naw_norway.233.c:0 "La flotte marchande [FROM.GetAdjective] travaille désormais contre nous, une victoire majeure pour nos ennemis."
naw_norway.233.p:0 "La flotte marchande [FROM.GetAdjective] travaille désormais pour [GER.GetNameDef], un grand avantage pour eux."

naw_news.100.t:0 "La chute de Copenhague"
naw_news.100.d:0 "Les forces norvégiennes avançant à travers le Sjaelland ont réussi à capturer Copenhague.\n\nLes combats, désormais sporadiques, diminuent peu à peu, et heureusement, la résistance féroce et les bombardements d’artillerie s’étaient déjà réduits à des échanges d’armes légères avant que les troupes norvégiennes n’atteignent Fredriksstaden avec le palais d’Amalienborg, laissant l’architecture rococo pour l’essentiel intacte.\n\nCertains Danois décidés à poursuivre la résistance ont évacué dans les heures précédant et durant l’invasion, mais la ville est désormais presque silencieuse, les Norvégiens renforçant leur emprise sur la population et la cité.\n\nLa lutte danoise contre [NOR.GetNameDef] pourrait bien se poursuivre ailleurs, mais la perte de leur capitale est un coup sûr porté aux capacités gouvernementales et militaires danoises."
naw_news.100.a:0 "Le Danemark n’a pas pu tenir tête à [NOR.GetNameDef]."
naw_news.100.b:0 "Une victoire glorieuse pour les fils de Norvège !"
naw_news.100.c:0 "Comme si l’invasion de Copenhague par les Suédois n’était pas déjà assez mauvaise."

naw_news.101.t:0 "La chute de Stockholm"
naw_news.101.d:0 "Alors que les combats font rage ailleurs en [SWE.GetNameDef], des rapports confirment l’entrée de détachements de troupes norvégiennes dans la capitale suédoise.\n\nLes civils suédois et les forces norvégiennes semblent tous dans une ambiance étrange, alors que se révèle au grand jour le dénouement de ce conflit inattendu entre les deux pays. Un bref défilé de victoire a eu lieu après que les institutions suédoises de Stockholm ont été sécurisées par les Norvégiens. Comme les combats se sont vite réduits à des échanges d’armes légères, la ville est encore en bon état, bien que la vieille tour téléphonique de Stockholm se soit partiellement effondrée après avoir été touchée par des tirs de mortier.\n\nLa résolution suédoise devrait s’en trouver fortement affaiblie."
naw_news.101.a:0 "[NOR.GetNameDefCap] frappe apparemment au-dessus de sa catégorie."
naw_news.101.b:0 "L’équilibre du pouvoir s’est enfin déplacé vers la Scandinavie occidentale."
naw_news.101.c:0 "C’est absolument incroyable !"

naw_news.102.t:0 "La chute d’Helsinki"
naw_news.102.d:0 "Des rapports en provenance du sud de la Finlande confirment maintenant que la capitale finlandaise a été capturée par les troupes norvégiennes en progression.\n\nDes tirs d’armes légères se font encore entendre dans certains quartiers et à la périphérie, mais aucune force finlandaise significative n’a été aperçue dans la ville.\n\nDe plus, un détachement de tireurs d’élite norvégiens a pris position près de l’Université d’Helsinki, limitant ainsi les possibilités de contre-attaques finlandaises dans la zone. Le gouvernement finlandais et d’autres hauts responsables semblent également avoir évacué avant que les combats n’atteignent Helsinki."
naw_news.102.a:0 "L’armée [NOR.GetAdjectiveCap] est encore en marche, semble-t-il."
naw_news.102.b:0 "Les Finlandais doivent maintenant rentrer dans le rang."
naw_news.102.c:0 "Mais que veulent donc les Norvégiens ici ?"

naw_news.200.t:0 "Le traité de Kiel révisé par [ENG.GetNameDef]"
naw_news.200.d:0 "\n\nLe traité de Kiel fut le traité d’après-guerres napoléoniennes qui sépara d’eux les anciennes parties intégrantes du Royaume de Norvège, lorsque l’union dano-norvégienne prit fin du fait de leur défaite. Les Norvégiens ont soutenu que les îles de l’Atlantique Nord avaient de forts liens avec la Norvège et quasiment aucun avec le Danemark à l’époque. En effet, l’islandais, le féroïen et le norvégien sont tous des langues issues du vieux norrois occidental, contrairement au danois et au suédois. Aujourd’hui, [NOR.GetNameDef] a réussi à convaincre [ENG.GetNameDef] de réviser le traité, transférant ces îles nord-atlantiques sous contrôle [NOR.GetAdjective]."
naw_news.200.a:0 "Une grande injustice faite à [FROM.GetNameDef] a été réparée. Nous sommes reconnaissants."
naw_news.200.b:0 "Même en réparant leurs erreurs passées, [FROM.GetName] ferait bien de nous aider à l’avenir."
naw_news.200.c:0 "Les [ENG.GetAdjectiveCap] sont manifestement très attachés à garder [FROM.GetName] à leurs côtés."
naw_news.200.p:0 "Les [ENG.GetAdjectiveCap] nous ont donné un coup de pied alors que nous étions à terre. Nous attendons réparation en temps voulu..."

