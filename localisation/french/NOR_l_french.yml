NOR_recreate_the_kingdom_of_the_isles:0 "Recréer le Royaume des Îles"
NOR_recreate_the_kingdom_of_the_isles_desc:0 "Ayant pris le contrôle des Hébrides et des Highlands, nous pourrions tenter d’établir un État satellite basé sur l’ancien Royaume des Îles. Sous notre autorité, il sera un duché autonome promouvant les liens nordico-gaéliques afin d’aligner la population avec nous.\n\nBien que cela demande des efforts et des ressources, il pourrait être très profitable pour nous de gouverner la région indirectement, à travers les seigneurs locaux, propriétaires terriens et politiciens."
NOR_lords_of_the_isles_propaganda_lanark:0 "Diffuser la propagande des Seigneurs des Îles à Lanark"
NOR_lords_of_the_isles_propaganda_lanark_desc:0 "En promouvant non seulement les liens nordico-gaéliques, mais aussi les liens des Highlanders et des Écossais côtiers, nous pourrions intégrer les habitants de Lanark dans notre État satellite, [LOI.GetNameDef]. Ainsi, ils disposeront d’une base de population plus importante pour recruter, et notre bastion loyaliste dans les îles britanniques grandira considérablement."

