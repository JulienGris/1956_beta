NOR_initiate_cooperation_with_the_british:0 "Initier une coopération avec les Britanniques"
NOR_initiate_cooperation_with_the_british_desc:0 "Faisant partie de l’alliance britannique, il serait avisé de rechercher une coopération plus étroite dans les domaines de la communication, du transport et, bien sûr, de la guerre."
NOR_initiate_cooperation_with_the_germans:0 "Initier une coopération avec les Allemands"
NOR_initiate_cooperation_with_the_germans_desc:0 "Faisant partie de l’alliance allemande, il serait avisé de rechercher une coopération plus étroite dans les domaines de la communication, du transport et, bien sûr, de la guerre."
NOR_initiate_cooperation_with_the_russians:0 "Initier une coopération avec les Russes"
