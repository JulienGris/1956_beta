l_french:
 norwegian_focus:0 "Arbre national norvégien"
 ####--Focuses--####

 ##filtres uniques
 FOCUS_FILTER_NAW_UNIQUE_TACTICS:0 "Tactiques et technologies uniques"

 ##info-bulles génériques
 NOR_wip_tt:0 "\n§RTRAVAIL EN COURS§! – Les fonctionnalités complètes ne sont pas encore implémentées pour ce §Yfocus§!. Envisagez une autre voie pour l’instant, car il n’apporte qu’une fonctionnalité partielle.\n"
 NOR_wip_light_tt:0 "\n§RTRAVAIL EN COURS§! – Des fonctionnalités de base suffisantes sont présentes pour ce §Yfocus§!, mais il n’est pas encore développé comme prévu. Il peut toutefois être choisi sans problème et apporte déjà du contenu jouable.\n"
 NOR_enable_puppet_states_tt:0 "Permet la création d’§YÉtats fantoches§! lors des conférences de paix.\n"
 NOR_icelandic_subject_benefits_tt:0 "\nSi l’§YIslande§! existe en tant que §Ysujet§! autonome ou comme membre de notre §Yfaction§!, elle bénéficiera également de cette politique.\n\n"
 NOR_political_advisor_needed_tt:0 "\nUn §Yconseiller politique§! sera nécessaire pour achever notre transition vers une nouvelle §Yforme de gouvernement§!, que ce soit par élection, référendum ou par la force.\n\n"
 NOR_new_commanders_enabled_tt:0 "\nDe nouveaux §Ycommandants§! seront disponibles pour le service actif une fois ce focus terminé.\n"
 NOR_enable_british_naval_procurements_tt:0 "\nConclure un accord avec les Britanniques permettra d’accéder à des §Ydécisions§! pour acquérir des §Ynavires§! et des §Ysous-marins§! britanniques pour la marine norvégienne.\n"
 NOR_enable_german_naval_procurements_tt:0 "\nConclure un accord avec les Allemands permettra d’accéder à des §Ydécisions§! pour acquérir des §Ynavires§! et des §Ysous-marins§! allemands pour la marine norvégienne.\n"
 NOR_cosmetic_tag_enabled_tt:0 "\nPermet de basculer vers l’apparence traditionnelle et médiévale du §YRoyaume de Norvège§!, pour un prix élevé. Cette option est purement cosmétique et n’apporte aucun autre avantage.\n"
 NOR_cosmetic_tag_switch_tt:0 "\nChange l’apparence pour celle du §YRoyaume de Norvège§! médiéval et traditionnel. Comme c’est le moment idéal pour le faire, un puissant §Gbonus unique de réduction§! s’applique ici, et uniquement ici…"

 #Avertissements R56
 NOR_not_making_faction_warning_tt:0 "§RAvertissement ! Choisir cette option bloquera les focuses « Approches », car ils exigent que vous soyez chef de faction.§!\n"

 ##marine
 NOR_encourage_fishing:0 "Encourager la pêche"
 NOR_encourage_fishing_desc:0 "En encourageant l’utilisation de notre longue côte et des riches zones de pêche environnantes, notre économie pourrait en tirer profit."
 NOR_establish_nortraship:0 "Fonder le Nortraship"
 NOR_establish_nortraship_desc:0 "Les armateurs norvégiens possèdent des centaines de navires marchands modernes transportant des cargaisons dans le monde entier. Nous devrions créer une organisation d’État pour réquisitionner et administrer ces navires en cas de besoin."
 NOR_establish_nortraship_tt:0 "\nAvec le §YNortraship§! établi, nous pourrons non seulement prendre le contrôle direct de notre flotte marchande, mais aussi éventuellement déléguer son contrôle à des alliés importants.\n"
 NOR_landing_crafts:0 "Chalands de débarquement Nortraship"
 NOR_landing_crafts_desc:0 "Nortraship et nos compagnies maritimes développent de nouveaux chalands de débarquement pour nos forces. La marine envisage de créer des troupes spécialisées pour les utiliser."
 NOR_navy:0 "Développer la marine"
 NOR_navy_desc:0 "La flotte a toujours été la force de la Norvège. Nous ne devons pas négliger cet héritage grandiose."
 NOR_nortraship_production_incentives:0 "Incitations à la production Nortraship"
 NOR_nortraship_production_incentives_desc:0 "Les navires marchands et convois sont sans défense par eux-mêmes. Nous devrions donc encourager la production navale et peut-être attirer des concepteurs spécialisés pour les besoins de notre flotte marchande."
 NOR_coastal_defense_specialization:0 "Spécialisation dans la défense côtière"
 NOR_coastal_defense_specialization_desc:0 "En concentrant les efforts de nos industries navales bien établies et de la marine norvégienne, nous pourrions développer des navires et tactiques adaptés à nos besoins : une flotte de défense côtière capable à la fois de soutenir les troupes terrestres et de mener des raids limités en haute mer."
 NOR_naval_conferences:0 "Conférences navales"
 NOR_naval_conferences_desc:0 "En organisant des conférences avec d’autres puissances navales alliées, nous pourrions obtenir les derniers enseignements nécessaires pour perfectionner nos amiraux en mer. Prenons l’initiative de les convoquer."
 NOR_escorts:0 "Navires d’escorte modernes"
 NOR_escorts_desc:0 "Avec notre grande flotte marchande, nous devrions utiliser des escortes modernes pour la défendre contre d’éventuelles attaques."
 NOR_submarines:0 "Développement des sous-marins"
 NOR_submarines_desc:0 "Les sous-marins sont excellents pour patrouiller nos côtes en toute discrétion. Exploitons tout le potentiel des modèles modernes."
 NOR_develop_naval_tactics:0 "Poursuivre l’héritage de Tordenskjold"
 NOR_develop_naval_tactics_desc:0 "Des tactiques navales audacieuses et inventives ont marqué la carrière de notre héros national, le vice-amiral Peter Wessel Tordenskjold. Il a prouvé que l’innovation pouvait gagner des batailles, voire des guerres. Honorons cet héritage."
 NOR_capital_ships:0 "Navires capitaux"
 NOR_capital_ships_desc:0 "Nous devrions envisager de construire quelques navires capitaux pour appuyer nos escortes légères. L’amélioration de nos chantiers nous permettra de les produire sans difficulté."
 NOR_capital_ships_tt:0 "\nUne version améliorée du §Ychantier naval de Horten§! sera débloquée.\nSi vous l’avez déjà comme §Yconcepteur naval§!, ce focus le §Gmettra à jour gratuitement§!.\n\n"
 NOR_naval_equipment:0 "Équipement naval"
 NOR_naval_equipment_desc:0 "La modernisation de notre équipement naval est essentielle pour donner une chance à notre marine face aux grandes puissances. Une coque moderne n’est rien sans de bons canons, obus et systèmes de contrôle."
 NOR_navy_wing:0 "Aviation navale"
 NOR_navy_wing_desc:0 "Développons notre aviation navale pour soutenir la flotte lorsqu’elle opère le long de la côte."
 NOR_carriers:0 "Porte-avions"
 NOR_carriers_desc:0 "Bien que notre longue côte donne déjà une bonne portée à nos avions, une flotte de porte-avions offrirait une mobilité aérienne encore plus grande, avec des aérodromes mobiles où ils sont nécessaires."
##air
 NOR_air_bases:0 "Bases aériennes"
 NOR_air_bases_desc:0 "Compte tenu des longues distances dans notre pays, construire des bases aériennes à travers le territoire pourrait être la meilleure option si nous voulons fournir à nos avions les infrastructures et le carburant nécessaires pour fonctionner correctement."
 NOR_merge_the_air_wings:0 "Fusionner les ailes aériennes"
 NOR_merge_the_air_wings_desc:0 "Avec nos petites ailes aériennes et un commandement aérien fragmenté, il pourrait être préférable de fusionner l’aile de l’armée et celle de la marine sous un seul commandement. Fondons ainsi une troisième branche de l’armée norvégienne, la Force aérienne norvégienne."
 NOR_light_fighters:0 "Chasseurs légers"
 NOR_light_fighters_desc:0 "Les chasseurs légers sont abordables, agiles et rapides. Ils peuvent soutenir les troupes, affronter les avions ennemis et même intercepter les bombardiers qui approchent."
 NOR_fortify_military_bases:0 "Fortifier nos bases militaires"
 NOR_fortify_military_bases_desc:0 "Nous devons installer des fortifications, bunkers et défenses anti-aériennes autour de nos bases militaires afin que notre armée, notre marine et notre aviation puissent rester approvisionnées et équipées."
 NOR_medium_aircraft:0 "Appareils moyens"
 NOR_medium_aircraft_desc:0 "Nous devrions envisager de construire des avions avec une plus grande portée pour pouvoir défendre nos mers tout en opérant depuis la côte norvégienne."
 NOR_resurrect_norsk_aeroplanfabrik:0 "Ressusciter Norsk Aeroplanfabrik"
 NOR_resurrect_norsk_aeroplanfabrik_desc:0 "En relançant Norsk Aeroplanfabrik, une usine aéronautique nationale, nous pourrions réduire notre dépendance aux importations étrangères et garantir un approvisionnement continu en avions neufs et en pièces de rechange, là où la chaîne d’approvisionnement risquerait autrement d’être perturbée."

##army
 NOR_army:0 "L’armée norvégienne"
 NOR_army_desc:0 "Hæren, ou l’armée de terre, bien que négligée sur le plan économique, conserve beaucoup de savoir-faire et de talents. Voyons ce que nous pouvons faire pour renforcer cette base, même avec des contraintes financières."
 NOR_army_wing:0 "Aile terrestre"
 NOR_army_wing_desc:0 "Développons davantage notre aile terrestre afin qu’elle puisse soutenir l’armée dans les opérations au sol."
 NOR_ski_infantry:0 "Infanterie de ski"
 NOR_ski_infantry_desc:0 "En 1747, le premier corps officiel de ski du monde a été établi en Norvège, et depuis, l’utilisation des skis est largement adoptée dans notre armée. Les avantages de cette compétence se manifestent clairement en hiver et en altitude."
 NOR_ski_infantry_tt:0 "\nDébloque l’§Hinfanterie de ski§!\n§HToute l’infanterie et mot./méca. :\n    Collines§!: Attaque : §G+5%§!\n§H    Collines§!: Défense : §G+5%§!\n§H    Collines§!: Mouvement : §G+10%§!\n§H    Montagnes§!: Attaque : §G+10%§!\n§H    Montagnes§!: Défense : §G+10%§!\n§H    Montagnes§!: Mouvement : §G+20%§!\n"
 NOR_mountaineers:0 "Chasseurs alpins"
 NOR_mountaineers_desc:0 "Bien que notre pays compte de nombreuses personnes talentueuses en montagne, une spécialisation militaire permettra à certains d’exceller véritablement dans les opérations alpines. Avec de telles troupes spécialisées, les Allemands infligèrent de lourdes défaites aux Italiens pendant la Grande Guerre, prouvant leur valeur."
 NOR_mountaineers_tt:0 "\nNous pouvons désormais déployer des §Ydivisions de montagne§!.\n\n"
 NOR_urban_defenses:0 "Défenses urbaines"
 NOR_urban_defenses_desc:0 "Nous devrions fortifier toutes nos grandes villes pour les protéger contre de potentielles invasions. En plus des fortifications, une ligne défensive allant de Halden au grand fleuve Glomma pourrait empêcher les envahisseurs venant des régions frontalières suédoises de menacer les zones urbaines du fjord intérieur d’Oslo."
 NOR_urban_defenses_tt:0 "\nDébloque des §Ydécisions§! pour construire la §Yligne défensive Glomma-Halden§! et la §Yligne défensive de Lyngen§!.\n"
 NOR_merge_jegerbataljonene:0 "Fusionner les Jegerbataljonene"
 NOR_merge_jegerbataljonene_desc:0 "Au début des années 1930, le régiment de chasseurs Jegerkorpset IR 2 fut divisé en trois bataillons distincts. Une nouvelle idée a émergé : concentrer notre puissance limitée en formations plus importantes. Nous allons donc fusionner ces bataillons pour former la 1re division de chasseurs."
 NOR_merge_jegerbataljonene_tt:0 "Obtient une §Ydivision d’infanterie d’élite§! en Østlandet.\n"
 NOR_continued_motorization_efforts:0 "Poursuivre la motorisation"
 NOR_continued_motorization_efforts_desc:0 "Bien que la motorisation de l’armée ait déjà été entamée, il serait utile de l’élargir afin que de plus grandes portions puissent réagir rapidement. En plus de transporter nos troupes, les camions peuvent aussi acheminer du ravitaillement et servir d’hôpitaux de campagne mobiles."
 NOR_bicycle_battalions:0 "Bataillons cyclistes"
 NOR_bicycle_battalions_desc:0 "Le carburant est coûteux, et pour éviter que nos troupes soient paralysées par une pénurie, l’utilisation du vélo, pratique et polyvalent, semble judicieuse. Créons donc de nouveaux bataillons cyclistes pour améliorer les déplacements en ville et en campagne."
 NOR_armored_battalions:0 "Bataillons blindés"
 NOR_armored_battalions_desc:0 "Pour briser l’impasse de la Grande Guerre, la Grande-Bretagne et la France développèrent de puissantes machines de guerre blindées, insensibles aux tirs de mitrailleuses. Aujourd’hui, avec de nouveaux moteurs, châssis et canons, ces véhicules sont plus puissants que jamais. Nous devons rattraper les grandes puissances, même au prix de lourdes dépenses en carburant."
 NOR_armored_battalions_tt:0 "\n\nUn programme blindé norvégien pour rattraper les grandes puissances d’Europe et d’Amérique du Nord bénéficierait grandement d’une §Yalliance§! avec une nation productrice de chars ou d’une §Ycoopération technologique§!. Idéalement les deux.\n"
 NOR_equipment_effort:0 "Effort en équipement"
 NOR_equipment_effort_desc:0 "L’infanterie de base est l’épine dorsale de toute armée. Assurons-nous qu’elle dispose toujours du meilleur matériel."
 NOR_encourage_recreational_shooting:0 "Encourager le tir récréatif"
 NOR_encourage_recreational_shooting_desc:0 "La Norvège est un pays où beaucoup pratiquent le tir sportif et la chasse. En les encourageant, nous améliorerons les compétences générales en armes et la capacité de survie de la population."
 NOR_encourage_recreational_shooting_tt:0 "\nEn terminant cet objectif, on débloque §YFeu croisé disruptif§!, une nouvelle tactique défensive utilisant des tirs précis d’armes légères depuis des positions camouflées pour retarder l’ennemi.\n"
 NOR_establish_heimevernet:0 "Établir le Heimevernet"
 NOR_establish_heimevernet_desc:0 "Créons une force de première ligne pour encaisser le premier choc d’une invasion étrangère. Avec un entraînement régulier, une garde nationale rapidement mobilisée pourrait se révéler précieuse."
 NOR_fund_the_rearmament:0 "Financer le réarmement"
 NOR_fund_the_rearmament_desc:0 "Corrigeons la négligence et le manque de ressources qui affectent nos forces armées."
 NOR_fund_the_rearmament_tt:0 "Certains de nos commandants deviendront disponibles comme §Ythéoriciens§!.\n\n"
 NOR_a_serious_defense_budget:0 "Un budget de défense sérieux"
 NOR_a_serious_defense_budget_desc:0 "Augmenter encore les dépenses garantira que nos forces soient prêtes au pire."

##economy
 NOR_armament_investments:0 "Investissements initiaux dans l’armement"
 NOR_armament_investments_desc:0 "Commençons le réarmement en allouant des fonds à la production d’armement nationale."
 NOR_armament_investments_2:0 "Poursuivre l’expansion de la production d’armement"
 NOR_armament_investments_2_desc:0 "Continuons à développer nos installations d’armement et diversifions notre production après cette première impulsion."
 NOR_armament_investments_3:0 "Établir des parcs industriels militaires"
 NOR_armament_investments_3_desc:0 "En construisant de vastes complexes industriels pour sécuriser une chaîne de production nationale complète, de la plus petite pièce aux plus grands véhicules ou navires, nous pouvons créer une industrie militaire florissante."
 NOR_kongsberg_research:0 "Recherche à Kongsberg"
 NOR_kongsberg_research_desc:0 "Nos concepteurs d’armement à Kongsberg peuvent désormais élargir leur département de recherche grâce à des financements supplémentaires. Cela devrait nous aider à suivre les développements modernes."
 NOR_de_norske_statsbaner:0 "De Norske Statsbaner"
 NOR_de_norske_statsbaner_desc:0 "De Norske Statsbaner, les Chemins de fer d’État norvégiens, furent créés en 1883 comme compagnie publique pour toutes les lignes ouvertes depuis 1861. Financer de nouveaux projets dans le sud de la Norvège pourrait apporter des bénéfices économiques à long terme."
 NOR_nordlandsbanen:0 "Achever la ligne du Nordland"
 NOR_nordlandsbanen_desc:0 "La Nordlandsbanen est un projet ferroviaire en cours depuis les années 1920. En accélérant sa construction, nous pourrions relier nos comtés du nord, peu peuplés mais riches en ressources, au reste du pays."
 NOR_railroad_development_add_2_tt:0 "\nEn terminant, on ajoute §G2§! points de §Ydéveloppement ferroviaire§!."
 NOR_norsk_jernverk:0 "A/S Norsk Jernverk"
 NOR_norsk_jernverk_desc:0 "Créons une entreprise commune pour nous approvisionner en fer, acier et autres métaux."
 NOR_expand_domestic_steel_production:0 "Accroître la production d’acier nationale"
 NOR_expand_domestic_steel_production_desc:0 "Invitons Norsk Jernverk à développer de nouvelles mines et fonderies en utilisant des technologies modernes."
 NOR_access_the_small_deposits:0 "Exploiter les petits gisements"
 NOR_access_the_small_deposits_desc:0 "Bien que peu rentables, les gisements du sud de la Norvège peuvent être utilisés en cas de besoin."
 NOR_statmin:0 "Statmin"
 NOR_statmin_desc:0 "En regroupant toutes les compagnies minières sous une seule entité, elles pourront partager leurs connaissances et leur expérience."
 NOR_lumber_industries:0 "Développer l’industrie du bois"
 NOR_lumber_industries_desc:0 "Le bois abonde partout dans notre pays et contribua largement à la prospérité de la Norvège au début du XXe siècle. Développons encore cette industrie profitable. Qui sait, peut-être qu’un jour une entreprise norvégienne deviendra le leader mondial du papier ?"
 NOR_invest_in_district_industries:0 "Investir dans les districts"
 NOR_invest_in_district_industries_desc:0 "Investissons dans nos districts et zones rurales. Avec des producteurs et services locaux, notre population tirera parti de chaque recoin du pays."
 NOR_nth:0 "NTH"
 NOR_nth_desc:0 "Une grande partie de notre expertise nationale se trouve au Norges tekniske høiskole, l’Institut norvégien de technologie de Trondheim. En soutenant cette institution d’enseignement supérieur, nous prospérerons. Peut-être pourrons-nous même l’agrandir en université ?"
 NOR_tungtvann:0 "Investir dans les installations d’eau lourde"
 NOR_tungtvann_desc:0 "Bien que les usines et laboratoires de Norsk Hydro à Vemork et Rjukan nous fournissent déjà énergie et produits chimiques, l’eau lourde excédentaire qu’ils produisent pourrait aussi nous aider à progresser dans des domaines scientifiques inexplorés. Peut-être même avec une application militaire… inutile de trop s’attarder là-dessus."
 NOR_norsk_hydro_focus:0 "Soutenir Norsk Hydro"
 NOR_norsk_hydro_focus_desc:0 "Norsk Hydro est une entreprise pionnière de la science et de l’industrie norvégiennes, active dans des domaines variés tels que l’électricité, la chimie, les engrais et l’eau lourde."
 NOR_hydroelectric_power_generation:0 "Production hydroélectrique"
 NOR_hydroelectric_power_generation_desc:0 "Depuis les années 1890, nous avons construit de nombreuses centrales hydroélectriques, dont certaines figuraient parmi les plus grandes du monde. Il reste encore du potentiel : produire plus d’électricité, moderniser le confort de nos citoyens et alimenter nos industries lourdes."
 NOR_expanded_aluminium_production:0 "Augmenter la production d’aluminium"
 NOR_expanded_aluminium_production_desc:0 "Nous devrions utiliser l’énergie excédentaire de nos barrages hydroélectriques pour développer notre industrie de l’aluminium, comme l’a déjà fait avec succès Norsk Aluminium Co. à Høyanger."

##political
 NOR_til_dovre_faller:0 "Enig og tro til Dovre faller"
 NOR_til_dovre_faller_desc:0 "Unis et fidèles jusqu’à l’effondrement des montagnes de Dovre. Telles furent les paroles de nos ancêtres lors de la Constitution de 1814. Où que notre chemin nous mène, la Norvège a été, et restera, une nation construite par les efforts conjoints d’un peuple uni et d’une volonté commune."

##democratic branch
 NOR_affirm_constitutional_monarchy:0 "Affirmer la monarchie constitutionnelle"
 NOR_affirm_constitutional_monarchy_desc:0 "En confirmant notre équilibre actuel entre tradition et modernité, nous pouvons être sûrs que Hans Majestet Kongens Garde, la garde royale, sera toujours prête à défendre le roi et à inspirer le peuple."
 NOR_continuous_politics:0 "Continuité politique"
 NOR_continuous_politics_desc:0 "Donnons à notre gouvernement actuel une confiance continue dans sa ligne politique. Après tout, ce pays est bâti sur la confiance mutuelle."
 NOR_continuous_politics_tt:0 "\nDébloque une §Ydécision§! pour achever les programmes sociaux du gouvernement Nygaardsvold, destinés à combattre la Grande Dépression et ses effets.\n\n"
 NOR_change_starts_within:0 "Le changement commence de l’intérieur…"
 NOR_change_starts_within_desc:0 "Plutôt que de continuer sur une voie risquée ou de renverser le gouvernement, nous pourrions opérer quelques changements internes, inviter des membres d’autres partis pour collaborer et conseiller. Un rapprochement vers la politique plus modérée du Parti des Fermiers plutôt que celle du Parti travailliste pourrait nous aider."
 NOR_motion_of_no_confidence:0 "Motion de censure"
 NOR_motion_of_no_confidence_desc:0 "Le gouvernement s’est montré aveugle aux tensions croissantes dans le reste du monde. Une nouvelle orientation est nécessaire."
 NOR_seek_a_british_alliance:0 "Chercher une alliance britannique"
 NOR_seek_a_british_alliance_desc:0 "Engageons-nous dans une alliance avec l’Empire britannique. Avoir la puissance de la Royal Navy à nos côtés devrait dissuader bien des agresseurs, et nos liens historiques rendent cela probable."
 NOR_allied_technology_sharing:0 "Partage technologique allié"
 NOR_allied_technology_sharing_desc:0 "Élargissons notre coopération avec les Britanniques et le Commonwealth grâce à un accord de recherche mutuellement bénéfique."
 NOR_allied_technology_sharing_tt:0 "Inviter [ENG.GetNameDef] à former un §Ygroupe de partage technologique§! avec nous.\n\nDe §Gbonnes relations§! assureront probablement leur accord.\n\n"
 NOR_expand_allied_technology_sharing:0 "Élargir le partage technologique allié"
 NOR_expand_allied_technology_sharing_desc:0 "Importons des experts britanniques pour accélérer nos recherches."
 NOR_delegate_control_of_the_merchant_fleet:0 "Déléguer le contrôle de la flotte marchande"
 NOR_delegate_control_of_the_merchant_fleet_desc:0 "Maintenant que nous sommes en guerre commune avec les Britanniques, il est peut-être temps de conclure un accord sur la gestion de notre vaste flotte marchande. Tant que nos intérêts commerciaux après-guerre et les salaires de nos marins sont protégés, les Britanniques pourraient nous fournir des navires de guerre et sous-marins à prix réduit."
 NOR_north_atlantic_defense_focus:0 "Initiative de défense de l’Atlantique Nord"
 NOR_north_atlantic_defense_focus_desc:0 "En proposant une initiative de défense de l’Atlantique Nord, nous pourrions sécuriser les côtes de nos alliés et les nôtres contre les invasions et la piraterie. Un état-major commun et des exercices militaires profiteraient à tous, surtout à nous vu l’écart de puissance."
 NOR_north_atlantic_defense_focus_tt:0 "Forme l’§Yinitiative de défense de l’Atlantique Nord§! avec les nations du Commonwealth atlantique. La coopération étroite et l’état-major commun permettront à leurs troupes de mieux combattre au fil du temps.\n\nSelon notre politique de réarmement choisie, cette initiative pourra varier légèrement.\n\n"
 NOR_american_military_support:0 "Obtenir un soutien militaire américain"
 NOR_american_military_support_desc:0 "Maintenant que les États-Unis sont devenus nos alliés, nous pourrions bénéficier de leur aide militaire. Leurs ressources immenses leur permettront sûrement de nous enseigner quelque chose, et un allié plus fort leur sera profitable en retour."
 NOR_british_military_support:0 "Obtenir un soutien militaire britannique"
 NOR_british_military_support_desc:0 "Maintenant que le Royaume-Uni est devenu notre allié, nous pourrions bénéficier de leur aide militaire. Leurs ressources et leur expérience de guerre ont beaucoup à nous apporter."
 NOR_request_allied_favors:0 "Demander des faveurs aux alliés"
NOR_request_allied_favors_desc:0 "Bien que nous ne soyons pas une grande puissance, notre flotte marchande, notre force navale régionale, nos bases maritimes ainsi que notre aide en matière de renseignement et de mouvements de résistance apportent de réels bénéfices à nos alliés. Dans cette optique, nous pourrions demander quelques faveurs en retour de ces contributions."
NOR_request_allied_favors_tt:0 "Cela permet d’obtenir §Yde l’industrie hors-carte§!, de la §Ymain-d’œuvre§!, de l’§Yéquipement§! et d’autres soutiens de la part de vos alliés.\n"
NOR_a_beacon_among_democracies:0 "Un phare parmi les démocraties"
NOR_a_beacon_among_democracies_desc:0 "La guerre a de nouveau causé de grandes souffrances en Europe et au-delà. Peut-être est-il temps de créer de nouvelles organisations internationales, d’encourager le commerce mondial et la coopération entre nations pour rendre la guerre à grande échelle impossible. En tant que démocratie stable, nous pourrions montrer la voie vers la démocratisation et/ou les efforts humanitaires si nous le souhaitons."
NOR_revise_the_treaty_of_kiel:0 "Réviser le traité de Kiel"
NOR_revise_the_treaty_of_kiel_desc:0 "Alors que nous avons été entraînés dans la guerre aux côtés du [DEN.GetName], si nous nous rendons utiles aux grandes puissances, une ambitieuse manœuvre politique s’offre à nous : convaincre nos alliés de réviser le traité de Kiel (issu des guerres napoléoniennes), par lequel le Danemark a obtenu des îles historiquement intégrées au royaume de Norvège, à savoir les §Yîles Féroé§!, l’§YIslande§! et le §YGroenland§!. C’est tout simplement juste."
NOR_revise_the_treaty_of_kiel_tt:0 "§Y[ROOT.GetName]§! : doit avoir une £legitimacy §Ylégitimité§! supérieure à celle du §Y[DEN.GetName]§!."
NOR_armed_neutrality_once_more:0 "Neutralité armée à nouveau"
NOR_armed_neutrality_once_more_desc:0 "Beaucoup de nos politiciens et diplomates estiment que la meilleure option face aux conflits à venir est de reprendre notre politique de neutralité armée, comme lors de la Grande Guerre. Avec une armée décente, nous pourrions dissuader les agresseurs et, si nous étions attaqués, nous pourrions alors rejoindre les adversaires de nos agresseurs potentiels…"
NOR_armed_neutrality_once_more_tt:0 "\nTente de maintenir [Root.GetNameDef] neutre. Si un agresseur viole notre §Yneutralité§!, ce focus permettra d’activer des §Ydécisions§! pour solliciter des alliances auprès des grandes puissances.\n\n"
NOR_three_brothers:0 "Les trois frères"
NOR_three_brothers_desc:0 "Dans le sixième couplet de notre hymne national, nous chantons à propos des trois frères. Vivons ces paroles en initiant une alliance avec la Suède et le Danemark : le pan-scandinavisme mérite une renaissance."
NOR_three_brothers_tt:0 "\nL’acceptation par d’autres pays pour rejoindre notre faction est moins probable avec de mauvaises relations, alors que de bonnes relations les assureront quasiment.\n"
NOR_nordic_technology_sharing:0 "Partage technologique nordique"
NOR_nordic_technology_sharing_desc:0 "Développons notre coopération avec nos voisins grâce à un accord de recherche. Nos liens étroits, nos économies similaires et nos cultures proches devraient rendre cette collaboration gérable."
NOR_nordic_technology_sharing_tt:0 "Invite [DEN.GetNameDef] et [SWE.GetNameDef] à former un §Ygroupe de partage technologique§! avec nous.\n\nDe très §Gbonnes relations§! assureront probablement leur accord.\n\n"
NOR_expand_nordic_technology_sharing:0 "Élargir le partage technologique nordique"
NOR_expand_nordic_technology_sharing_desc:0 "Importons des experts de nos voisins pour accélérer nos recherches et approfondir ce partage technologique."
NOR_expand_nordic_technology_sharing_tt:0 "\nAccorde des §Ybonus de recherche§! à la Norvège et à ses alliés.\nLe nombre de §Ybonus de recherche§! augmente avec le nombre de pays nordiques membres de notre faction.\n\n"
NOR_fourth_brother:0 "Le quatrième frère"
NOR_fourth_brother_desc:0 "Bien qu’il ne soit pas mentionné dans l’hymne, nous devrions inclure la Finlande en raison de ses liens historiques avec la Scandinavie, de sa culture similaire et de sa chaleureuse compagnie. Le pan-scandinavisme laisse place au pan-nordisme. Ce que cela signifie pour l’Estonie reste incertain."
NOR_fourth_brother_tt:0 "\nL’acceptation par d’autres pays pour rejoindre notre faction est moins probable avec de mauvaises relations, alors que de bonnes relations les assureront quasiment.\n"
NOR_invite_finland:0 "Inviter la Finlande"
NOR_invite_finland_desc:0 "Avec la Finlande dans notre faction, il serait logique qu’elle participe aussi à notre accord de recherche. Leur culture similaire mais leur terrain, leurs voisins et leur situation diplomatique différents leur donneront des perspectives uniques sur les priorités."
NOR_invite_finland_tt:0 "Invite la Finlande à rejoindre la §Ycollaboration de recherche nordique§!.\n\nDe très §Gbonnes relations§! assureront probablement leur accord.\n\n"
NOR_the_dano-norwegian_deal:0 "L’accord dano-norvégien"
NOR_the_dano-norwegian_deal_desc:0 "Proposons un échange avec les Danois : nos anciennes îles, les Féroé et l’Islande, nous sont rendues en échange de l’abandon de notre revendication sur le Groenland et du soutien à la revendication danoise sur le Schleswig-Holstein, si jamais ils peuvent le récupérer."
NOR_the_dano-norwegian_deal_tt:0 "\nPour que le §Ytransfert de territoires§! et le §Ycœur national danois sur le Schleswig-Holstein§! prennent effet, §Y[DEN.GetNameDef]§! devra accepter notre proposition. §GDe meilleures relations§! mèneront probablement à de meilleurs résultats.\n\n"
NOR_the_fennoscandian_deal:0 "L’accord fennoscandien"
NOR_the_fennoscandian_deal_desc:0 "Avec la Suède et la Finlande dans l’alliance, des pragmatiques des trois nations ont conclu un accord secret visant à redéfinir les frontières vers l’est et à sécuriser la frontière orientale de la Finlande. La Suède cède l’ancien territoire norvégien du Båhuslen à la Norvège, la Finlande renonce à la convention des Åland, et si une éventuelle attaque soviétique est repoussée, la Carélie sera cédée à la Finlande."
NOR_the_fennoscandian_deal_tt:0 "\nContrairement à l’accord dano-norvégien, l’accord fennoscandien est si §Gmutuellement bénéfique§! que nous pouvons garantir son acceptation tant que la §YSuède§! et la §YFinlande§! restent dans notre alliance. Toutefois, cela risque d’accroître la §Rméfiance russe§! envers notre faction.\n\n"
NOR_seek_american_support:0 "Chercher le soutien américain"
NOR_seek_american_support_desc:0 "En exploitant nos liens commerciaux, l’aide des Américains d’origine nordique et nos valeurs communes, nous pourrions améliorer notre image auprès des Américains. Ils pourraient alors nous soutenir ou nous protéger en cas de besoin. Mais rien n’est garanti : les Américains attachent de l’importance à leur neutralité et à la paix…"
NOR_pragmatic_diplomacy:0 "Diplomatie pragmatique"
NOR_pragmatic_diplomacy_desc:0 "Même avec une Europe du Nord unie, nous ne pourrons pas résister à une attaque conjointe de l’Allemagne et de la Russie. Pour survivre, nous devons solliciter l’aide des grandes puissances, et cela pourrait ne pas suffire. Choisir un camp pourrait être notre seule chance…"
NOR_stand_against_communism:0 "Se dresser contre le communisme"
NOR_stand_against_communism_desc:0 "Prendre parti pour l’Allemagne, avec des pactes de non-agression, le libre-échange et la libre circulation maritime dans la Baltique, pourrait être une meilleure option. Mais les Danois risquent de mal le prendre, car nous leur avons promis le Schleswig. Et les Russes n’apprécieront sûrement pas…"
NOR_stand_against_communism_tt:0 "\nPrendre parti pourrait être nécessaire pour éviter une guerre sur deux fronts. Ceux que nous approchons auront tendance à nous §Glaisser tranquilles§! ou même à nous §Ydevenir amis§!, tandis que l’autre camp sera plus susceptible de nous §Rattaquer§!.\n"
NOR_stand_against_fascism:0 "Se dresser contre le fascisme"
NOR_stand_against_fascism_desc:0 "Prendre parti pour la Russie, avec des pactes de non-agression, le libre-échange et une frontière orientale fixée, pourrait être préférable. Mais les Finlandais n’apprécieront pas que nous nous rangions du côté de la Russie contre l’Allemagne, affirmant que ce n’est pas leur combat et que les Russes reviendront une fois l’Allemagne vaincue. Et les Allemands n’apprécieront sûrement pas…"
NOR_stand_against_fascism_tt:0 "\nPrendre parti pourrait être nécessaire pour éviter une guerre sur deux fronts. Ceux que nous approchons auront tendance à nous §Glaisser tranquilles§! ou même à nous §Ydevenir amis§!, tandis que l’autre camp sera plus susceptible de nous §Rattaquer§!.\n"
NOR_end_foreign_influence:0 "Mettre fin à l’influence étrangère"
NOR_end_foreign_influence_desc:0 "Encourageons les politiciens et médias de notre alliance à contrer les influences étrangères sur notre peuple. Notre politique doit rester la nôtre !"
NOR_end_foreign_influence_tt:0 "Supprime les influences politiques étrangères chez nous et nos proches alliés.\n"
NOR_nordic_joint_defense_focus:0 "Initiative de défense commune nordique"
NOR_nordic_joint_defense_focus_desc:0 "Certains des plus brillants diplomates et experts en défense des pays nordiques plaident pour une coopération militaire commune, avec un état-major intégré et des exercices conjoints. Il est temps de prendre l’initiative et d’inviter nos alliés. Cela pourrait bien être la clé de notre liberté et prospérité durables."
NOR_nordic_joint_defense_focus_tt:0 "Forme l’§Yinitiative de défense commune nordique§! avec les autres membres de la faction nordique. La coopération étroite et l’état-major commun permettront à leurs troupes d’améliorer leurs performances au fil du temps.\n\nSelon la politique de réarmement choisie, cette initiative pourra varier.\n\n"
NOR_the_brotherhood_of_nations:0 "La fraternité des nations démocratiques"
NOR_the_brotherhood_of_nations_desc:0 "Notre alliance mérite un nouveau nom, surtout maintenant que nous avons dépassé le cadre des « trois frères ». Nous rebaptiser la Fraternité des nations démocratiques et inclure quelques autres pays pacifiques européens devrait maintenir notre dynamique diplomatique."
NOR_the_brotherhood_of_nations_tt:0 "\nL’acceptation par d’autres pays pour rejoindre notre faction est moins probable avec de mauvaises relations, alors que de bonnes relations les assureront quasiment.\n"
NOR_support_neighbors:0 "Soutenir nos voisins"
NOR_support_neighbors_desc:0 "Nous devons être prêts à soutenir nos voisins s’ils ont besoin d’aide contre des envahisseurs étrangers."
NOR_gutta_paa_skauen:0 "Résistance nationale"
NOR_gutta_paa_skauen_desc:0 "Certains sont prêts à se cacher et à infiltrer les lignes ennemies pour notre roi et notre cause, et se portent volontaires si nos alliés sont en guerre. Nous devrions encourager ces hommes."
NOR_gutta_paa_skauen_tt:0 "\nAvoir un §Ychef partisan§! comme conseiller rendra nos mouvements de résistance plus puissants, notre renseignement plus efficace et donnera un avantage supplémentaire à nos troupes sur notre territoire.\n\n"
NOR_saboteurs:0 "Saboteurs"
NOR_saboteurs_desc:0 "Avec un mouvement de résistance en place, il est temps de former certains de nos partisans pour des opérations de sabotage clandestines derrière les lignes ennemies. Une fois entraînés, ces commandos mèneront nos opérations secrètes planifiées. Leur mission pourrait être la plus importante de leur vie."
NOR_saboteurs_tt:0 "Débloque des §Ydécisions§! pour mener des §Yopérations partisanes§! contre les ennemis occupant le territoire norvégien.\n"

##monarchist branch
NOR_traditions_and_monarchy:0 "Raviver les traditions monarchistes"
NOR_traditions_and_monarchy_desc:0 "Beaucoup prônent la prudence en ces temps incertains. Et quelle meilleure façon de rester prudent que de revenir à nos racines éprouvées ? Raviver la tradition a toujours été une stratégie importante pour ceux au pouvoir."
NOR_traditions_and_monarchy_tt:0 "\nAvoir un §Ymonarchiste convaincu§! comme conseiller permet d’activer des §Ydécisions§! spéciales en préparation d’une §Rguerre civile§! ou d’une prise de pouvoir monarchiste.\n\n"
NOR_develop_the_kingdom:0 "Développer le royaume"
NOR_develop_the_kingdom_desc:0 "Nous devons commencer à bâtir un royaume solide en construisant une infrastructure digne de ce nom. Une base solide sera indispensable pour soutenir l’État, le peuple et nos valeurs."
NOR_traditions_worth_fighting_for:0 "Des traditions qui valent la peine d’être défendues"
NOR_traditions_worth_fighting_for_desc:0 "Avec le monarchisme et les valeurs traditionnelles gagnant en popularité, se pose la question de savoir comment concrétiser ce retour aux valeurs. Attendrons-nous les élections ? Lancerons-nous un coup d’État ? Ou irons-nous jusqu’au combat s’il le faut ?"
NOR_traditions_worth_fighting_for_tt:0 "\nPourrait potentiellement conduire à une §Rguerre civile§!.\n\n"
NOR_matters_of_presentation:0 "Questions de représentation"
NOR_matters_of_presentation_desc:0 "Avec notre royaume traditionnel restauré, certains s’interrogent sur la façon dont nous voulons présenter notre nation au monde et à notre propre population. Garderons-nous l’abolition de l’aristocratie ? Reviendrons-nous sur notre symbolique nationale, notamment le drapeau ?"
NOR_the_location_of_power:0 "Le lieu du pouvoir"
NOR_the_location_of_power_desc:0 "Autre question de représentation : notre capitale. Quelle image renvoie-t-elle au monde ? Et surtout, où devrait-elle se situer géographiquement ?"
NOR_a_prosperous_kingdom:0 "Un royaume prospère"
NOR_a_prosperous_kingdom_desc:0 "Avec le « Norgesveldet », l’ancien grand royaume, largement restauré, l’économie consolidée et aucun danger immédiat, nous pouvons célébrer cette réussite et orienter la population vers la préservation de cet héritage pour l’avenir."
NOR_matters_of_practicality:0 "Questions de praticité"
NOR_matters_of_practicality_desc:0 "Nos partisans nous ont guidés dans les premières étapes du retour à un pays fondé sur de vieilles valeurs. Mais il nous faut maintenant décider qui dirigera la coalition monarchiste dans ces réformes cruciales…"
NOR_the_extent_of_power:0 "L’étendue des pouvoirs"
NOR_the_extent_of_power_desc:0 "Avec une coalition prête à agir, la dernière question pratique est de définir l’étendue des pouvoirs du roi. Doit-il s’agir d’une monarchie constitutionnelle moderne et symbolique ? Le roi doit-il avoir des pouvoirs réels ? Le Premier ministre doit-il lui répondre ? Et qu’en est-il des élections ?"
NOR_foreign_relations:0 "Renforcer les relations étrangères"
NOR_foreign_relations_desc:0 "En établissant de solides relations diplomatiques et commerciales, nous pouvons améliorer nos chances d’éviter les ennuis lors d’une nouvelle guerre européenne, si nous choisissons de rester neutres."
NOR_foreign_relations_tt:0 "\nApaiser le §YRoyaume-Uni§! et l’§YAllemagne§! devrait réduire fortement le risque d’hostilité immédiate.\n\n"
NOR_the_nordic_policy:0 "La politique nordique"
NOR_the_nordic_policy_desc:0 "Les questions diplomatiques les plus immédiates (et donc aussi les plus importantes) de tout pays concernent toujours ses voisins proches. Devons-nous nous lier d’amitié avec les autres pays nordiques, ou bien un État norvégien doit-il exercer sa force à l’étranger pour la première fois depuis plus d’un demi-millénaire ?"
NOR_reclaim_the_islands:0 "Reprendre les îles"
NOR_reclaim_the_islands_desc:0 "Si le royaume de Norvège doit réellement être restauré dans toute sa gloire passée, nous devons reprendre les anciennes îles norvégiennes des Féroé, de l’Islande et du Groenland, injustement données au Danemark par le traité de Kiel."
NOR_icelandic-faroese_revolt:0 "Révolte islandaise-féroïenne"
NOR_icelandic-faroese_revolt_desc:0 "Puisque nous sommes en conflit avec les Danois, nous pourrions fomenter des révoltes en Islande et aux Féroé, anciennes îles norvégiennes aux liens historiques et culturels plus proches de la Norvège que du Danemark. Cela devrait voir les Féroé annexés à la Norvège, tandis que l’Islande rejoindra notre cause indirectement comme un territoire dépendant mais autonome."
NOR_icelandic-faroese_revolt_tt:0 "\nTransfère la propriété des §Yîles Féroé§! à nous, et fait de l’§YIslande§! un §Ysujet§! autonome.\n\n"
NOR_develop_iceland:0 "Développer l’Islande"
NOR_develop_iceland_desc:0 "Avec l’Islande sous notre contrôle, nous devrions développer cette vaste île, riche en eau, en main-d’œuvre robuste, en zones de pêche abondantes et en moutons vigoureux. Les régions périphériques de notre pays devraient également pouvoir contribuer à nos efforts."
NOR_develop_the_faroes:0 "Développer les Féroé"
NOR_develop_the_faroes_desc:0 "Avec les Féroé de retour sous notre contrôle, il n’y a aucune raison de ne pas utiliser leurs ressources, poissons, baleines et moutons, pour l’industrie."
NOR_develop_the_jarldom_of_orkney:0 "Développer le jarldom des Orcades"
NOR_develop_the_jarldom_of_orkney_desc:0 "L’ancien jarldom des Orcades, désormais sous notre contrôle, est un territoire prestigieux en soi, mais avec plus d’industrie il pourrait aussi apporter davantage de contributions matérielles."
NOR_reclaim_the_mainland:0 "Reprendre le continent"
NOR_reclaim_the_mainland_desc:0 "Même si la Norvège a possédé de nombreuses îles au fil de son histoire, le continent et ses îles attenantes ont toujours été le centre du pouvoir, de l’économie et de la population. Au milieu du XVIIe siècle, la Suède a amputé ce territoire norvégien historique, et nous devons saisir l’occasion de récupérer ce qui nous revient de droit !"
NOR_subjugate_finland:0 "Subjuguer la Finlande"
NOR_subjugate_finland_desc:0 "La Finlande ne possède pas de terres historiquement norvégiennes, mais puisque nous avons déjà récupéré certaines de nos terres intégrales, nous pourrions justifier d’utiliser à nouveau la force pour intégrer la Finlande dans notre sphère et sécuriser notre flanc est. Bien entendu, les Finlandais bénéficieraient aussi de cette protection à long terme. Devons-nous leur envoyer un ultimatum ?"
NOR_approach_denmark:0 "Se rapprocher du Danemark"
NOR_approach_denmark_desc:0 "Les Danois seraient mieux comme amis. Ils ne nous ont pas pris de terres par la force (mais par traité imposé par les grandes puissances), et le partenariat commercial fonctionnait bien durant l’union. Proposer une alliance aux Danois semblerait donc une bonne voie."
NOR_approach_sweden:0 "Se rapprocher de la Suède"
NOR_approach_sweden_desc:0 "Les Suédois seraient d’excellents amis pour les Norvégiens. Ce n’est que par l’ingérence excessive des Danois qu’ils durent envahir la Norvège par le passé. Cela leur coûta souvent cher aussi. Pardonnons donc et faisons la paix avec nos frères de l’est. N’oublions pas que durant l’union avec la Suède, sous leur règne clément, notre économie et notre culture prospérèrent."
NOR_approach_finland:0 "Se rapprocher de la Finlande"
NOR_approach_finland_desc:0 "Les Finlandais n’ont jamais été des ennemis de la Norvège de leur propre volonté, car les soldats finlandais qui envahirent notre pays obéissaient aux ordres de rois suédois agressifs. N’était-ce pas une femme kvène qui risqua sa vie pour contrecarrer une de ces invasions ? Les Finlandais sont sans doute les alliés naturels du peuple norvégien, qui pourrait être plus digne d’une alliance que nos cousins de l’est ?"
NOR_the_european_policy:0 "La politique européenne"
NOR_the_european_policy_desc:0 "Avec la patrie sécurisée, garder un œil sur l’évolution politique de l’Europe semble judicieux. Après tout, mieux vaut éloigner les ennuis que de les voir venir jusqu’à nous."
NOR_take_no_sides:0 "Ne prendre aucun parti"
NOR_take_no_sides_desc:0 "À l’exception de la Finlande qui faisait partie de l’Empire russe, les nations nordiques restèrent en dehors de la Grande Guerre avec succès. Même si la neutralité fit payer un tribut au commerce maritime, l’État norvégien fut compensé, l’Entente ayant profité de notre flotte marchande. Pourquoi alors ne pas chercher à ce que l’Europe du Nord reste encore une fois à l’écart des conflits destructeurs ?"
NOR_a_piece_in_the_greater_game:0 "Un pion dans le grand jeu"
NOR_a_piece_in_the_greater_game_desc:0 "Si nous voulons être pris au sérieux dans le monde, nous devons être proactifs et contribuer à le façonner. Pour ce faire, nous pourrions choisir un camp parmi les grandes puissances partageant nos vues, ou bien tendre la main à d’autres puissances locales afin de contrer les menaces pesant sur notre État traditionnel."
NOR_the_british_empire:0 "L’Empire britannique"
NOR_the_british_empire_desc:0 "Si nous nous rangeons du côté du plus grand empire qui ait jamais existé, nous ne pourrons sûrement pas perdre. C’est un choix sûr, si tant est qu’ils nous acceptent, et s’allier aux vainqueurs apporte toujours une certaine influence. Mais celle-ci peut être limitée en raison de la place que tiennent les grandes puissances comparée à nous."
NOR_a_deal_with_britain:0 "Un accord avec la Grande-Bretagne"
NOR_a_deal_with_britain_desc:0 "En aidant le Royaume-Uni à maintenir son empire, nous pourrions récupérer certaines de nos anciennes îles, illégalement engagées par le Danemark, en échange. Après tout, que représentent les Shetland et les Orcades pour un empire mondial ?"
NOR_a_deal_with_britain_tt:0 "\nEnvoie une proposition de transfert des §YShetland§! et des §YOrcades§!. La Grande-Bretagne peut §Gaccepter§!, se limiter aux §YShetland§!, ou §Rrefuser§!. Avoir de §Gbonnes relations§! et être un allié utile augmente les chances d’un §Gbon résultat§!.\n"
NOR_the_north_sea_deal:0 "L’accord de la mer du Nord"
NOR_the_north_sea_deal_desc:0 "À mesure que l’Allemagne et la Grande-Bretagne se rapprochent, rejoignons aussi ce rapprochement. Peut-être pourrons-nous négocier le retour des Shetland en aidant ces grandes puissances à vaincre leurs ennemis."
NOR_the_north_sea_deal_tt:0 "\nEnvoie une demande à la Grande-Bretagne pour le retour des §YShetland§!. Ils peuvent §Gaccepter§! ou §Rrefuser§!. De §Gbonnes relations§! et être un allié utile augmentent les chances d’un §Gbon résultat§!.\n"
NOR_the_german_kaiserreich:0 "Le Kaiserreich allemand"
NOR_the_german_kaiserreich_desc:0 "Si nous nous allions au Kaiserreich renaissant, nous pourrions accroître énormément notre influence dans le monde. Contrairement à un rapprochement avec les Britanniques, c’est plus risqué car ils ne sont pas aussi puissants que l’Allemagne du Second Reich, mais les récompenses pourraient être bien plus grandes pour nous..."
NOR_a_deal_with_germany:0 "Un accord avec l’Allemagne"
NOR_a_deal_with_germany_desc:0 "Si nous aidons l’Allemagne à renverser le traité de Versailles, il est juste que nous récupérions aussi certaines de nos anciennes îles, à savoir les Shetland et les Orcades. Le Kaiser ne pourra qu’accepter ces demandes raisonnables."
NOR_baltic_anti-communist_league:0 "Ligue antibolchévique baltique"
NOR_baltic_anti-communist_league_desc:0 "Le communisme est peut-être la plus grande menace qui ait jamais existé pour la monarchie et les valeurs familiales traditionnelles. En recherchant des gouvernements partageant nos idées en Europe de l’Est et dans les pays baltes, nous pourrions former un rempart impressionnant contre les bolcheviks corrupteurs."
NOR_baltic_league_strikes_west:0 "La grande offensive vers l’ouest"
NOR_baltic_league_strikes_west_desc:0 "Bien que l’idée initiale de l’alliance fût de dissuader les bolcheviks à l’est, les fascistes et agresseurs de l’ouest sont récemment devenus une menace grandissante. L’alliance doit-elle agir ensemble pour abattre cette menace avant qu’elle ne devienne incontrôlable ?"
NOR_baltic_league_deterrence:0 "Politique de dissuasion de la Ligue balte"
NOR_baltic_league_deterrence_desc:0 "Notre alliance est avant tout défensive, dissuadons tout agresseur potentiel et faisons-les payer s’ils viennent attaquer notre grande alliance trans-balte."
NOR_baltic_league_strikes_east:0 "La grande offensive vers l’est"
NOR_baltic_league_strikes_east_desc:0 "La Ligue balte fut fondée principalement en réaction à la menace bolchévique contre la souveraineté et le mode de vie des pays modérés. Mettons fin une bonne fois pour toutes à cette menace avant qu’elle ne détruise tout ce qui nous est cher."
NOR_reject_constitutional_monarchy:0 "Rejeter la monarchie constitutionnelle"
NOR_reject_constitutional_monarchy_desc:0 "Le roi fait obstacle à la véritable voie. De même que les blocages doivent être levés, la royauté obstinée doit abdiquer ! Avec un peu de propagande en faveur de l’autoritarisme moderne et du collectivisme, nous pouvons renverser ce système archaïque et apporter un véritable changement."
NOR_support_radical_nationalism:0 "Soutenir le nationalisme radical"
NOR_support_radical_nationalism_desc:0 "Nous devrions soutenir notre seul véritable parti nationaliste, le Nasjonal Samling, dirigé par le dynamique Vidkun Quisling."
NOR_hirden_paramilitary:0 "Armer le Hirden"
NOR_hirden_paramilitary_desc:0 "La garde personnelle de nos rois médiévaux s’appelait le Hirden. Rétablissons une telle garde, désormais fidèle aux idéaux nationalistes et aux chefs de parti plutôt qu’à un roi. Pour commencer, le Hirden politique moderne doit devenir un groupe paramilitaire."
NOR_rinnanbanden:0 "Coopérer avec la bande Rinnan"
NOR_rinnanbanden_desc:0 "Certains hommes loyaux à notre cause offrent leur aide pour infiltrer toute résistance ou dissidence."
NOR_rinnanbanden_tt:0 "\nAvoir un §YPrince de la terreur§! comme conseiller nous permettra de contrer plus efficacement les mouvements de résistance et les activités subversives ennemies, ainsi que d’accroître notre réserve de main-d’œuvre non nationale.\n\n"
NOR_norway_first:0 "La Norvège d’abord"
NOR_norway_first_desc:0 "Nous devons restaurer la Norvège dans toute sa gloire passée."
NOR_reclaim_danish:0 "Reprendre les terres danoises"
NOR_reclaim_danish_desc:0 "Reprenons les terres perdues au profit du Danemark, oubliées après les guerres napoléoniennes et le traité de Kiel."
NOR_reclaim_swedish:0 "Reprendre les terres suédoises"
NOR_reclaim_swedish_desc:0 "Reprenons les terres perdues au profit de la Suède durant les guerres entre Danemark et Suède."
NOR_join_axis:0 "Rejoindre l’Axe"
NOR_join_axis_desc:0 "S’allier à nos frères du Troisième Reich ne pourrait que nous être bénéfique. Commençons par nouer des relations et assurer la paix entre nos nations."
NOR_invite_terboven:0 "Inviter Terboven"
NOR_invite_terboven_desc:0 "En tant que petite nation, nous ne pouvons pas tout faire seuls. Invitons des experts allemands pour nous aider à gouverner, bâtir et fortifier notre pays."
NOR_invite_terboven_tt:0 "\nAvoir un §Yingénieur en fortifications§! comme conseiller nous permettra de construire des fortifications telles que des forts à moindre coût.\n\n"
NOR_festung_norwegen:0 "Festung Norwegen"
NOR_festung_norwegen_desc:0 "L’idée de transformer toute notre côte en forteresse est possible, mais elle exige un effort colossal. Nous n’en doutions pas."
NOR_german_puppet:0 "Accepter la domination allemande"
NOR_german_puppet_desc:0 "Avec l’armée allemande attaquant notre nation, certains partisans fascistes suggèrent qu’il vaudrait mieux céder aux Allemands. Ils pourraient nous accorder des conditions plus clémentes si nous acceptons leur influence et l’utilisation de nos bases navales."
NOR_german_technology_sharing:0 "Partage technologique allemand"
NOR_german_technology_sharing_desc:0 "Développons notre coopération avec les Allemands via un accord de recherche. Leur expertise dans l’industrie, le chiffrement et les véhicules blindés pourrait nous être très bénéfique."
NOR_german_technology_sharing_tt:0 "Invite [GER.GetNameDef] à former un §Ygroupe de partage technologique§! avec nous.\n\nDe très §Gbonnes relations§! assureront probablement leur accord.\n\n"
NOR_expand_german_technology_sharing:0 "Élargir le partage technologique allemand"
NOR_expand_german_technology_sharing_desc:0 "Faisons venir des experts allemands pour nous aider dans nos recherches, tout en resserrant nos liens avec l’Allemagne et ses alliés."
NOR_german_naval_coordination:0 "Coordination navale allemande"
NOR_german_naval_coordination_desc:0 "Avec notre vaste marine marchande, nous serons sans doute un atout pour les Allemands. En échange du contrôle d’une partie de celle-ci, nous devrions pouvoir commander des navires et sous-marins à prix réduit. Une forte présence norvégienne en mer bénéficiera grandement à notre alliance."
NOR_at_any_cost:0 "À tout prix"
NOR_at_any_cost_desc:0 "Guidés par l’idéologie et le bien commun, certains de nos pilotes sont prêts à tout sacrifier. Nous honorerons leur grand sacrifice en menant la nation vers la grandeur."
NOR_demand_the_northern_isles:0 "Revendiquer les îles du Nord"
NOR_demand_the_northern_isles_desc:0 "Réclamons les terres perdues à cause des engagements illégaux du Danemark, que nous avons tenues jusqu’à la fin du Moyen Âge. Si nous devons réclamer un territoire britannique, commençons par là. Les habitants des Shetland et des Orcades possèdent un riche héritage norvégien et prospéreraient dans notre nouvelle nation. Quant au Caithness, il faisait partie intégrante du comté norvégien des Orcades, il doit donc suivre."
NOR_demand_overseas_colonies:0 "Revendiquer des colonies d’outre-mer"
NOR_demand_overseas_colonies_desc:0 "La Norvège a toujours été une nation maritime, et elle aurait pu devenir un empire colonial si les Danois ne nous avaient pas retenus pendant 300 ans sombres. Réparons cette injustice en réclamant notre juste part de l’empire colonial britannique."
NOR_demand_scottish_lands:0 "Revendiquer des terres écossaises"
NOR_demand_scottish_lands_desc:0 "Certaines parties de l’Écosse faisaient partie de la Norvège depuis l’époque viking jusqu’au Moyen Âge. Utilisons cela pour convaincre les grandes puissances de nous céder l’Écosse lors d’un futur traité de paix."
NOR_demand_russian_territories:0 "Revendiquer des territoires russes"
NOR_demand_russian_territories_desc:0 "Vidkun Quisling lui-même souhaite établir des colonies norvégiennes dans le nord de la Russie maintenant que nous participons à la lutte contre le bolchevisme. L’un de nos rois médiévaux revendiquait toutes les terres jusqu’à la mer Blanche comme norvégiennes : commençons par y affirmer nos droits, près de chez nous."
NOR_demand_russian_territories_tt:0 "\nCe focus enverra également une demande de §YPetsamo§! à la §YFinlande§!, si elle en est propriétaire. L’acceptation finlandaise est plus probable si nous sommes dans la même §Yfaction§!, avons de §Gbonnes relations§!, ou possédons une §Garmée puissante§!.\nPour l’assurer, il faut qu’ils soient notre §Ymarionnette§!, ou que nous ayons à la fois la même §Yfaction§!, de §Gbonnes relations§! et une §Garmée puissante§!.\n"
##communist sub-branch
NOR_support_radical_socialism:0 "Soutenir le socialisme radical"
NOR_support_radical_socialism_desc:0 "Nous devons soutenir la véritable voie du Norges Kommunistiske Parti, le Parti communiste norvégien. Le parti d’Adam Egede-Nissen mènera assurément le peuple vers le pouvoir et l’égalité."
NOR_join_comintern:0 "Rejoindre le Komintern"
NOR_join_comintern_desc:0 "S’allier à la puissante Union soviétique, soucieuse d’égalité, ne pourrait que nous être bénéfique. Commençons par renforcer nos relations et assurer la paix entre nos États."
NOR_soviet_technology_sharing:0 "Partage technologique soviétique"
NOR_soviet_technology_sharing_desc:0 "Élargissons notre coopération avec les Soviétiques par un accord de recherche. Leurs techniques industrielles et leurs avancées dans le domaine des blindés pourraient nous être utiles."
NOR_soviet_technology_sharing_tt:0 "Inviter [SOV.GetNameDef] à former avec nous un §Ygroupe de partage technologique§!.\n\nDe très §Gbonnes relations§! rendraient probablement leur adhésion plus certaine.\n\n"
NOR_expand_soviet_technology_sharing:0 "Élargir le partage technologique soviétique"
NOR_expand_soviet_technology_sharing_desc:0 "Faire venir des experts soviétiques pour épauler nos recherches, tout en resserrant nos liens avec eux et avec les autres fidèles amis de la Révolution."
NOR_collectivism:0 "Collectivisme"
NOR_collectivism_desc:0 "Chaque homme et chaque femme doivent travailler pour le bien commun ; le collectivisme finit toujours par porter ses fruits."
NOR_heavy_industry_plan:0 "Plan pour l’industrie lourde"
NOR_heavy_industry_plan_desc:0 "Seul le renforcement des ouvriers et de la base industrielle soutenant l’État garantira la victoire du prolétariat et de sa révolution."
NOR_prepare_the_proletariat_for_war:0 "Préparer le prolétariat à la guerre"
NOR_prepare_the_proletariat_for_war_desc:0 "La guerre contre les forces contre-révolutionnaires est inévitable ; le prolétariat doit être mobilisé pour le conflit à venir."
NOR_a_communist_alternative:0 "Une alternative à l’URSS"
NOR_a_communist_alternative_desc:0 "L’avant-garde bolchévique a été corrompue et détruite par la bureaucratie qui a infiltré le parti. Ce mouvement a trahi les travailleurs et les principes de la révolution. Seule une nouvelle Internationale pourra rendre espoir au cœur des travailleurs du monde et enfin les unir."
NOR_folkearmeen:0 "Folkestyrken"
NOR_folkearmeen_desc:0 "Établir la Folkestyrken, la Force du Peuple, une grande force loyale chargée de protéger les responsables de notre Parti."
NOR_unite_the_scandinavian_workers:0 "Unir les travailleurs scandinaves"
NOR_unite_the_scandinavian_workers_desc:0 "Maintenant que nous suivons la voie de la véritable égalité, il serait égoïste de ne pas la partager avec nos frères scandinaves. Unissons la Scandinavie par tous les moyens nécessaires !"
NOR_pressure_finland:0 "Faire pression sur la Finlande"
NOR_pressure_finland_desc:0 "Notre victoire sur nos voisins scandinaves n’est pas passée inaperçue. L’équilibre des forces nordiques est bouleversé, et avec l’accès aux ressources et aux industries de Scandinavie nous sommes devenus une puissance redoutable. Pourquoi devrions-nous alors tolérer que les Finlandais se dressent sur notre route vers un rapprochement avec les Soviétiques ? Leur meilleur choix serait assurément de se soumettre."
NOR_pressure_finland_tt:0 "\nTenter de contraindre la Finlande à devenir notre §YÉtat sujet§!. Une armée puissante rendra leur acceptation plus probable.\nPour garantir cela, nous devons avoir d’excellentes relations, appartenir à la même faction que l’Union soviétique, et posséder, eux comme nous, des armées solides.\n\nSi la Finlande est déjà notre sujet, cet objectif réduira son §Yautonomie§!.\n\n"
NOR_establish_a_secret_police:0 "Créer une police secrète"
NOR_establish_a_secret_police_desc:0 "Inspirons-nous de l’expérience de nos camarades russes pour établir une police secrète, calquée sur leur « Narodnyi Komissariat Vnutrennikh Del », ou NKVD. Cela nous aidera à contrôler les affaires internes et l’opinion publique, rendant notre pays bien plus stable. Après tout, l’intégrité et l’opinion de l’individu ne peuvent rivaliser avec la stabilité et la sécurité de l’État dans son ensemble."
NOR_perfect_state_propaganda:0 "Parfaire notre propagande d’État"
NOR_perfect_state_propaganda_desc:0 "La propagande est un art. Pour façonner l’État et son Peuple en une machine bien huilée, nous devons perfectionner cet art. Quand chacun connaît sa place et son devoir, la Société et notre Peuple récolteront les fruits de notre propre Utopie."
NOR_secret_departments:0 "Départements secrets"
NOR_secret_departments_desc:0 "L’éradication des éléments bourgeois réactionnaires qui sapent la révolution ne peut se faire sans mettre en pratique la dictature du prolétariat."
NOR_expand_the_intelligence_service:0 "Développer le [NOR.getAgency]"
NOR_expand_the_intelligence_service_desc:0 "Des bureaux plus vastes et des agents privilégiés deviendront l’avant-garde du parti et des travailleurs pour l’instauration d’une société juste et égalitaire."
##for temporary tags (Note: Currently not used!)
NOR_recover_from_civil_war:0 "Se relever de la guerre civile"
NOR_recover_from_civil_war_desc:0 "Ayant réussi à triompher de nos ennemis lors de la récente guerre civile, nous pouvons désormais nous concentrer sur la reconstruction de notre pays et de ses infrastructures. La confiance devra être rétablie entre les différentes régions et populations de Norvège."
 
####--Ideas--####
##country ideas/national spirits
NOR_state_investments:0 "Investissements d’État"
NOR_state_investments_desc:0 "L’État norvégien a récemment financé un projet, ce qui réduit temporairement les fonds disponibles pour d’autres tâches."
NOR_large_state_investments:0 "Grands investissements d’État"
NOR_large_state_investments_desc:0 "L’État norvégien a récemment réalisé un investissement conséquent dans un projet. Il faudra du temps avant de libérer à nouveau des fonds."
NOR_large_armament_investments:0 "Grands investissements dans l’armement"
NOR_large_armament_investments_desc:0 "Nous avons récemment financé une importante expansion de notre industrie d’armement. Si les usines sont désormais construites, il faudra encore y affecter des fonds pour que les chaînes de production tournent à plein régime. Espérons que cela suffira pour l’emporter."
NOR_aftermath_of_the_depression:0 "Les suites de la Grande Dépression"
NOR_aftermath_of_the_depression_desc:0 "Bien que la Norvège ait traversé plusieurs crises durant les années 1920, dont la Grande Dépression, la nation a été relativement épargnée comparée aux autres pays occidentaux. Malgré un chômage élevé, nos exportations et notre industrie navale sont en plein essor, posant les bases de notre industrialisation complète. Si nous investissons judicieusement maintenant, nous pourrions sortir définitivement de la dépression."
NOR_fishing:0 "Développement de la pêche"
NOR_fishing_desc:0 "Une flotte de pêche moderne et des installations de transformation côtières nous permettront de tirer parti des riches zones de pêche le long de notre littoral."
NOR_dockyard_investments:0 "Expansion de l’industrie navale"
NOR_dockyard_investments_desc:0 "Les investissements dans nos chantiers navals et installations maritimes nous placent à l’avant-garde de l’innovation et de la production navale."
NOR_grand_naval_expansion:0 "Grande expansion navale"
NOR_grand_naval_expansion_desc:0 "L’État, Nortraship, le chantier naval de Horten et d’autres industries maritimes ont uni leurs ressources pour accroître massivement nos capacités navales."
NOR_specialized_naval_industry:0 "Industrie navale spécialisée"
NOR_specialized_naval_industry_desc:0 "Nos industries maritimes conçoivent désormais des navires innovants spécialisés dans la défense côtière et les opérations limitées, les croiseurs lourds et autres bâtiments majeurs apportant un appui-feu aux forces terrestres et aux flottilles de protection. Notre marine a également adopté des tactiques optimisées pour exploiter ces atouts. Si nos navires seront plus performants que jamais, leur coût de production s’en trouve néanmoins accru."
NOR_policy_of_disarmament:0 "Politique de désarmement durable"
NOR_policy_of_disarmament_desc:0 "Hormis les sous-marins allemands s’attaquant à la navigation neutre durant la Grande Guerre, la Norvège et son peuple n’ont connu aucune menace militaire réelle au XXe siècle. Le gouvernement a donc réduit toujours plus ses dépenses militaires, culminant avec celui de Johan Nygaardsvold. Au moins, ces fonds profitent aux affaires civiles."
NOR_meager_defense_budget:0 "Budget de défense dérisoire"
NOR_meager_defense_budget_desc:0 "Si les récentes dépenses militaires ont stoppé le déclin de nos forces, notre budget consacré à la défense reste disproportionnellement faible comparé aux autres nations, plus prudentes, du monde."
NOR_new_defense_budget:0 "Nouveau budget de défense"
NOR_new_defense_budget_desc:0 "Peut-être par anticipation d’un danger imminent, notre gouvernement est enfin parvenu à inverser la politique de désarmement précédente. Ce nouveau budget de défense doit permettre d’équiper et d’entraîner nos forces à un niveau inégalé depuis des décennies."
NOR_winter_training:0 "Entraînement hivernal"
NOR_winter_training_desc:0 "Le ski est ancestral en Norvège et l’armée l’utilise depuis longtemps. Si cette compétence est déjà quasi obligatoire pour tous les soldats, y ajouter un entraînement saisonnier au ski combiné à une formation à la survie hivernale rendra nos troupes encore plus endurcies. Cela nous donnera un avantage global en conditions hivernales et en montagne."
ICE_norwegian_advisors:0 "Conseillers norvégiens"
ICE_norwegian_advisors_desc:0 "Dans le cadre de l’intégration des forces de sécurité islandaises avec l’armée norvégienne, un accord prévoit la présence de conseillers norvégiens pour améliorer les choix tactiques et la résilience de nos troupes. Un atout pour l’Islande comme pour la Norvège."
NOR_recreational_shooting:0 "Promotion du tir récréatif"
NOR_recreational_shooting_desc:0 "Le gouvernement encourage désormais notre peuple à continuer de pratiquer le tir de loisir et la chasse. Cela leur apporte une maîtrise générale des armes ainsi qu’une meilleure connaissance du territoire."
NOR_heimevernet:0 "Heimevernet"
NOR_heimevernet_desc:0 "La mission du Heimevernet, la Garde nationale norvégienne, est d’être la première ligne de défense sur notre sol. Grâce à un entraînement régulier, notre peuple sera prêt à prendre les armes en cas de nécessité."
NOR_district_investments:0 "Investissements dans les districts"
NOR_district_investments_desc:0 "Investir dans l’agriculture, les producteurs locaux et les services publics assurera prospérité et bien-être à notre peuple. Cela réduira les risques de voir toute notre industrie paralysée par un ennemi et garantira une exploitation complète de nos ressources. L’argent public n’a jamais été mieux employé."
NOR_heavy_water:0 "Eau lourde de Rjukan"
NOR_heavy_water_desc:0 "Les installations et laboratoires d’eau lourde de Rjukan seront un atout pour nos scientifiques."
NOR_haakon:0 "Haakon VII"
NOR_haakon_desc:0 "Bien qu’il soit né prince danois, il s’est montré depuis 1905 un roi loyal et dévoué, gagnant le respect du peuple norvégien. Le roi Haakon VII est devenu un véritable symbole d’unité pour une Norvège indépendante.\n\n« Alt for Norge ! » (« Tout pour la Norvège ! »)\n- Devise royale du roi Haakon VII"
NOR_kongens_garde:0 "Hans Majestet Kongens Garde"
NOR_kongens_garde_desc:0 "La Garde royale du Roi. Formée aussi bien pour la cérémonie que pour le combat, elle reste inébranlable dans son devoir.\n\n« Alt for Kongen ! » (« Tout pour le Roi ! »)\n- Devise de la Garde royale"
NOR_wave_of_monarchism:0 "Vague de monarchisme"
NOR_wave_of_monarchism_desc:0 "Une vague de sentiments monarchistes et traditionalistes déferle sur le pays. Peut-être est-ce l’occasion de rétablir une forme de gouvernement plus traditionnelle ?"
NOR_building_the_kingdom:0 "Bâtir le Royaume"
NOR_building_the_kingdom_desc:0 "Pour protéger notre royaume traditionnel, nous devons travailler ensemble à lui donner de solides fondations : infrastructures et industrie."
NOR_preserving_the_kingdom:0 "Préserver le Royaume"
NOR_preserving_the_kingdom_desc:0 "Après avoir en grande partie restauré le « Norgesveldet », le grand royaume norvégien du Moyen Âge, nous avons décidé de recentrer nos efforts sur sa préservation et sa protection afin qu’il perdure à travers les âges."
NOR_diplomatic_efforts:0 "Efforts diplomatiques"
NOR_diplomatic_efforts_desc:0 "Nos diplomates et ambassadeurs sillonnent actuellement le monde pour renforcer nos liens avec des partenaires commerciaux importants. Cela absorbe des ressources administratives précieuses, mais c’est une occasion idéale de nouer des amitiés solides."
NOR_deterrence_investments:0 "Investissements de dissuasion dans la Baltique"
NOR_deterrence_investments_desc:0 "La grande alliance baltique anti-extrémiste et anti-bolchévique a décidé d’investir dans la dissuasion militaire, afin que toute nation extrémiste menaçant leur souveraineté ou leur intégrité territoriale réfléchisse à deux fois avant d’agresser."
NOR_national_collectivism:0 "Collectivisme national"
NOR_national_collectivism_desc:0 "Encourageons le collectivisme national, travaillons ensemble pour notre nation, en la plaçant au-dessus de tout."
NOR_socialist_collectivism:0 "Collectivisme socialiste"
NOR_socialist_collectivism_desc:0 "Encourageons le collectivisme socialiste, travaillons ensemble pour les idéaux radicaux, en plaçant la création et le maintien d’un État ouvrier au-dessus de tout."
NOR_german_advisors:0 "Conseillers allemands"
NOR_german_advisors_desc:0 "Des conseillers allemands sont désormais présents en Norvège, aidant notre armée à intégrer les tactiques, technologies et doctrines les plus récentes de la guerre européenne."
NOR_festung:0 "Festung Norwegen"
NOR_festung_desc:0 "« Festung Norwegen », ou forteresse Norvège, est l’idée de transformer l’ensemble de notre littoral en une forteresse imprenable, rendant notre pays invulnérable aux attaques occidentales. Puisque l’idée vient des Allemands, ils ont aussi choisi le nom..."
NOR_hirden:0 "Hirden"
NOR_hirden_desc:0 "La Hirden, ou « Hird », tire son nom de la garde personnelle et de la suite des rois médiévaux norvégiens. Réétablie sous une nouvelle forme, la Hirden moderne protège désormais nos membres du parti et combat pour notre cause si nécessaire."
NOR_hirdens_air_corps:0 "Corps aérien de la Hirden"
NOR_hirdens_air_corps_desc:0 "Avec l’expansion de la Hirden moderne, celle-ci n’est plus seulement un groupe politique, symbolique et paramilitaire ; elle évolue vers une force plus professionnelle, capable même d’appuyer les forces armées. Comme la maîtrise du ciel est devenue un enjeu crucial, la Hirden a fondé son propre corps aérien, axé sur les tactiques offensives, pour nous aider à arracher le contrôle des airs aux ennemis de la nation."
NOR_rinnanbanden_idea:0 "Rinnanbanden"
NOR_rinnanbanden_idea_desc:0 "La Rinnanbanden, ou bande de Rinnan, est un groupe de fidèles à notre cause qui se sont portés volontaires pour infiltrer les groupes de dissidents. Leur nom vient de leur chef, Henry Rinnan."
NOR_folkestyrken:0 "Folkestyrken"
NOR_folkestyrken_desc:0 "Une Garde du Peuple, chargée de protéger les responsables du parti et leurs intérêts. Elle peut également combattre pour l’État si nécessaire."
NOR_secret_police_idea:0 "Police secrète"
NOR_secret_police_idea_desc:0 "Avec notre propre police secrète, inspirée à la fois de la NKVD soviétique et de la Gestapo allemande, nous pouvons désormais mieux contrôler notre population et nous protéger de nos ennemis. Cependant, la contre-espionnage et la propagande restent des domaines dans lesquels nous pouvons et devons progresser."
NOR_secret_police_idea_2:0 "Police secrète"
NOR_secret_police_idea_2_desc:0 "Avec notre propre police secrète d’État, inspirée de la NKVD soviétique et de la Gestapo allemande, nous pouvons désormais mieux contrôler notre population et nous protéger de nos ennemis. Nos opérations clandestines et notre propagande portent déjà leurs fruits."
NOR_gutta_paa_skauen_idea:0 "Gutta på skauen"
NOR_gutta_paa_skauen_idea_desc:0 "« Gutta på skauen », un groupe de patriotes fidèles à notre pays et à nos valeurs, prêts à se porter volontaires dans des guerres étrangères ou même à agir comme partisans et espions pour servir notre cause."
NOR_continuous:0 "Politique continue"
NOR_continuous_desc:0 "Construire la paix est la voie à suivre. Si la guerre éclate, nos amis viendront à notre secours. N’est-ce pas ?"
NOR_pro-rearmament_politics:0 "Politique de réarmement"
NOR_pro-rearmament_politics_desc:0 "Il existe enfin une volonté gouvernementale d’investir dans nos forces armées, longtemps négligées. Profitons-en tant que c’est possible !"
NOR_change:0 "Troubles politiques"
NOR_change_desc:0 "La motion de censure n’a pas été adoptée sans heurts. Des critiques véhémentes l’ont jugée trop radicale, et une partie des politiciens ainsi qu’une fraction significative de la population l’ont perçue non pas comme une mesure nécessaire, mais comme une manœuvre intéressée des conservateurs. Heureusement, avec des efforts pour démontrer le contraire et un peu de temps, la situation politique devrait se stabiliser."
NOR_atlantic_balanced_policy:0 "Politique atlantique équilibrée"
NOR_atlantic_balanced_policy_desc:0 "Avec la récente Initiative de défense atlantique, notre gouvernement a reconnu qu’il devait contribuer à la défense de notre alliance. Il adopte désormais une politique plus équilibrée entre affaires civiles et réarmement naval. Le nouveau haut commandement conjoint et les exercices communs devraient rapidement professionnaliser notre armée, même si les grandes puissances en tireront un bénéfice plus limité."
NOR_atlantic_defense_policy:0 "Politique centrée sur l’Atlantique Nord"
NOR_atlantic_defense_policy_desc:0 "Avec la nouvelle Initiative de défense atlantique, notre gouvernement a reçu toutes les confirmations nécessaires pour considérer que le réarmement était le bon choix. Il faudra toutefois coordonner davantage nos besoins de défense avec nos alliés, ce qui demandera plus d’efforts pour la Marine. Mais à terme, le haut commandement conjoint et les exercices communs devraient rapidement hausser nos forces à un niveau plus professionnel, même si les grandes puissances en tireront un bénéfice limité."
NOR_nordic_balanced_policy:0 "Politique de défense équilibrée"
NOR_nordic_balanced_policy_desc:0 "Avec la récente Initiative de défense nordique, notre gouvernement a reconnu qu’il devait contribuer à la défense de notre alliance. Il adopte désormais une politique plus équilibrée entre affaires civiles et réarmement militaire. Le nouveau haut commandement conjoint et les exercices communs devraient rapidement professionnaliser notre armée."
NOR_nordic_defense_policy:0 "Politique centrée sur la défense nordique"
NOR_nordic_defense_policy_desc:0 "Avec la nouvelle Initiative de défense nordique, notre gouvernement a reçu toutes les confirmations nécessaires pour considérer que le réarmement était le bon choix. Il faudra toutefois coordonner nos besoins de défense avec nos alliés. Mais à terme, le haut commandement conjoint et les exercices communs devraient rapidement hausser nos forces à un niveau plus professionnel."
##infiltration/sabotage ideas (generally temporary ideas)
NOR_intelligence_gathered:0 "Renseignements obtenus"
NOR_intelligence_gathered_desc:0 "Les infiltrés et résistants norvégiens ont réussi à découvrir les plans de ceux qui occupent notre territoire. Cela nous donnera un aperçu de leurs ressources ainsi que de leurs projets pour l’avenir immédiat."
NOR_intelligence_compromised:0 "Renseignements compromis"
NOR_intelligence_compromised_desc:0 "Des infiltrés étrangers ont réussi à dérober des documents contenant des informations vitales. Malheureusement, cela signifie qu’ils seront désormais capables d’évaluer plus précisément nos ressources et nos plans à court terme."
NOR_resistance_strengthened:0 "Résistance norvégienne renforcée"
NOR_resistance_strengthened_desc:0 "Notre mouvement de résistance et nos fidèles infiltrés ont réussi à harceler l’ennemi en territoire norvégien occupé. Ce soutien civil à notre cause, qui se diffuse dans la société occupée, devrait rendre leur position plus inconfortable."
##country ideas/national spirits applied to other countries
NOR_north_atlantic_joint_defense:0 "Défense conjointe de l’Atlantique Nord"
NOR_north_atlantic_joint_defense_desc:0 "Avec la nouvelle Initiative de défense de l’Atlantique Nord, notre alliance avec nos voisins d’outre-mer est plus étroite que jamais. Les Norvégiens se réarment rapidement, et nous ne pouvons les laisser nous dépasser. Pour répondre aux standards attendus par nos nouveaux amis, la production et le recrutement devront être augmentés. Mais avec de nouvelles responsabilités viennent aussi de nouvelles opportunités ; un haut commandement commun et des exercices conjoints devraient nous apporter certains bénéfices militaires."
NOR_nordic_joint_defense:0 "Initiative de défense conjointe nordique"
NOR_nordic_joint_defense_desc:0 "Avec la nouvelle Initiative de défense nordique, notre alliance avec nos voisins est plus étroite que jamais. Les Norvégiens se réarment rapidement, et nous ne pouvons les laisser nous dépasser. Pour répondre aux standards exigés par tous nos amis, la production et le recrutement devront être augmentés. Mais avec de nouvelles responsabilités viennent aussi de nouvelles opportunités ; un haut commandement commun et des exercices conjoints devraient profiter à notre armée."
NOR_norwegian_destroyer_order:0 "Commande norvégienne de destroyers"
NOR_norwegian_destroyer_order_desc:0 "Nos alliés norvégiens ont commandé des destroyers dans nos chantiers navals. Si nous en retirons un paiement et que cela renforce nos alliés, cela ralentira bien entendu nos propres projets jusqu’à la livraison des navires."
NOR_norwegian_destroyer_order_strong_shipbuilding:0 "Commande norvégienne de destroyers (industrie navale solide)"
NOR_norwegian_destroyer_order_strong_shipbuilding_desc:0 "Nos alliés norvégiens ont commandé des destroyers dans nos chantiers navals. En retour, nous recevons un paiement équitable et un allié renforcé. Grâce à notre industrie navale solide, nos propres projets ne devraient pas être trop retardés par la construction de quelques bâtiments."
##designers
NOR_thunes_mekaniske_verksted:0 "Thunes Mekaniske Verksted"
NOR_thunes_mekaniske_verksted_desc:0 "Important producteur de turbines et de locomotives pour nos chemins de fer, Thune’s Mechanical Workshop pourrait être désigné comme fabricant national de chars. Ses installations étant déjà adaptées aux véhicules lourds, c’est probablement le meilleur choix pour une telle entreprise.\n"
NOR_kjeller_flyfabrikk:0 "Kjeller Flyfabrikk"
NOR_det_norske_luftfartselskap:0 "Det Norske Luftfartselskap"
NOR_horten_naval_yard:0 "Chantier naval de Horten"
NOR_horten_naval_yard_desc:0 "Le Horten Verft, ou chantier naval de Horten, est à la fois la principale base de la Marine royale norvégienne et un chantier naval national. Au siècle dernier, la base portait le nom de Karljohansvern en hommage au roi de l’ancienne union Suède-Norvège. Ses fonctions furent héritées de Fredriksvern à Stavern à partir de 1850.\n"
NOR_marinens_hovedverft:0 "Marinens Hovedverft"
NOR_marinens_hovedverft_desc:0 "Le Horten Verft, ou chantier naval de Horten, est à la fois la principale base de la Marine royale norvégienne et un chantier naval national. Au siècle dernier, la base portait le nom de Karljohansvern en hommage au roi de l’ancienne union Suède-Norvège. Ses fonctions furent héritées de Fredriksvern à Stavern à partir de 1850.\n\nLes installations ont désormais été agrandies pour produire des navires de ligne nationaux, en particulier des navires de défense côtière appelés « Panserskip », des bâtiments cuirassés de l’ère post-Monitor. Ces croiseurs lourds devraient se révéler polyvalents, solides et abordables pour la défense côtière de notre Marine.\n"
NOR_nortraship_dock_limited:0 "Nortraship Escort Docks"
NOR_nortraship_dock_limited_desc:0 "En mobilisant l’expertise des armateurs et leur intérêt pour protéger les navires qu’ils financent, nous pouvons fonder une nouvelle société chargée d’assurer la protection de notre commerce maritime."
NOR_tandbergs_radiofabrikk_desc:0 "Tandbergs Radiofabrikk a été fondée en 1933 par l’ingénieur civil Vebjørn Tandberg. L’usine de radios, basée à Oslo, a connu une expansion rapide et représente un grand espoir pour l’industrie électronique norvégienne, notamment en matière de technologies radio et d’enregistrement.\n"
NOR_norsk_hydro_desc:0 "D’abord appelée « Norsk Hydro-Elektrisk Kvælstofaktieselskab », l’entreprise a été fondée en décembre 1905 par Sam Eyde et Kristian Birkeland, avec le soutien financier de la famille suédoise Wallenberg et de banques françaises. Elle fut créée pour exploiter le procédé Birkeland-Eyde, utilisant des arcs électriques pour produire des composants nitrés (destinés aux engrais). Ce procédé était extrêmement énergivore (comme beaucoup des projets ultérieurs d’Hydro), et nécessitait donc une énergie bon marché. Heureusement, l’hydroélectricité norvégienne devenait abondante à l’époque. Mais ce procédé ne s’imposa pas ailleurs dans le monde et l’entreprise adopta finalement des méthodes moins énergivores. En 1927, elle passa au procédé Haber-Bosch en coopération avec le géant chimique IG Farben.\n\nLes usines de Norsk Hydro à Rjukan et Notodden produisent désormais de l’ammoniac liquide, transporté vers leurs nouvelles installations d’Herøya pour la production de nitrate de calcium, connu sous le nom de salpêtre norvégien. Norsk Hydro se diversifie aujourd’hui dans de nouveaux domaines : en 1934, la première usine commerciale d’eau lourde au monde a été construite à Vemork, produisant industriellement cette nouvelle ressource.\n"
NOR_christiania_spigerverk:0 "Christiania Spigerverk"
NOR_christiania_spigerverk_desc:0 "« Christiania Spiger- og Valtse Værk », tel était son nom d’origine, était une fonderie de clous locale fondée dans la capitale norvégienne en 1853. Au départ, elle utilisait du fer importé, puis des rebuts de fer nationaux, avant d’adopter les machines Coates révolutionnaires pour le forgeage à chaud des clous, au lieu du forgeage à froid. Ces méthodes innovantes et efficaces permirent à la fonderie locale de devenir en moins de trente ans une usine de premier plan.\n\nAvec l’élargissement des marchés, l’usine basée à Oslo se mit à produire des outils et d’autres biens métalliques. Pendant la Grande Guerre et les années 1920, elle élargit encore ses activités en construisant des fonderies nationales.\n"
NOR_kongsberg:0 "Kongsberg"
NOR_raufoss_ammunisjonsfabrikker:0 "Raufoss Ammunisjonsfabrikker"
##character ideas (advisors/theorists)
NOR_haakon_vii_hc:0 "Haakon VII"
NOR_haakon_vii_hc_desc:0 "Ayant lui-même servi comme officier de marine, le roi Haakon VII peut apporter son expérience au commandement naval, héritée de son service dans la marine danoise."
NOR_otto_ruge_ac:0 "Otto Ruge"
NOR_otto_ruge_ac_desc:0 "Chef d’état-major général de Norvège depuis 1933, Otto Ruge est l’un des plus hauts commandants du pays. Il laisse une grande liberté d’action aux jeunes officiers subalternes lorsque nécessaire, suivant en cela une doctrine de commandement décentralisé, au moins quand les options sont limitées."
NOR_kristian_laake_ac:0 "Kristian K. Laake"
NOR_kristian_laake_ac_desc:0 "Kristian Kristiansen Laake, l’un de nos principaux commandants et un homme de convictions, a souvent dénoncé le désintérêt pour nos forces armées. Lors d’un voyage en Allemagne, il observa leur réarmement massif et en fit part avec inquiétude aux politiciens. Il privilégie la défense par la préparation et la prévention plutôt que l’improvisation une fois le danger présent."
NOR_kristian_laake_theorist:0 "Kristian K. Laake"
NOR_kristian_laake_theorist_desc:0 "Kristian Kristiansen Laake, l’un de nos principaux commandants et un homme de convictions, a plusieurs fois dénoncé le désintérêt pour nos forces armées. Lors d’un voyage en Allemagne, il observa leur réarmement massif et en informa avec inquiétude les politiciens. C’est un commandant conscient, capable et habile à planifier l’avenir."
NOR_carl_gustav_fleischer_theorist:0 "Carl Gustav Fleischer"
NOR_carl_gustav_fleischer_theorist_desc:0 "Même lorsque le gouvernement négligeait les dépenses militaires, Fleischer préparait déjà la meilleure manière de défendre la Norvège. Il s’est aujourd’hui concentré sur les tactiques visant à couper les têtes de pont ennemies."
NOR_wilhelm_von_tangen_hansteen_ac:0 "Wilhelm von Tangen Hansteen"
NOR_wilhelm_von_tangen_hansteen_hc:0 "Wilhelm von Tangen Hansteen"
NOR_carsten_tank-nielsen:0 "Carsten Tank-Nielsen"
NOR_edvard_christian_danielsen_nc:0 "Edvard Christian Danielsen"
NOR_skule_storheill_theorist:0 "Skule Storheill"
NOR_josef_terboven_desc:0 "L’homme d’Hitler en Norvège, avec de grands projets concrets pour le pays."
NOR_henry_oliver_rinnan:0 "Henry Oliver Rinnan"
NOR_henry_oliver_rinnan_desc:0 "De petite taille mais charmant, sociable, rusé et farouchement anticommuniste, Henry Oliver Rinnan pourrait être très utile à notre régime. Il s’est porté volontaire pour infiltrer les groupes de résistance afin d’y débusquer les dissidents."
NOR_gunnar_soensteby:0 "Gunnar F. T. Sønsteby"
NOR_gunnar_soensteby_desc:0 "Gunnar Fridtjof Thurmann Sønsteby est un jeune homme sportif aux multiples talents qui vient de terminer son service militaire dans la Garde royale. Il s’est à nouveau porté volontaire pour servir l’indépendance et la prospérité de la Norvège."
NOR_fredrik_wedel_jarlsberg:0 "Fredrik Wedel Jarlsberg"
NOR_fredrik_wedel_jarlsberg_desc:0 "Fredrik « Fritz » H. H. Wedel Jarlsberg est un aristocrate, juriste et diplomate norvégien. Il fut l’un des rares Norvégiens à disposer d’une vaste expérience des relations internationales lors de la déclaration d’indépendance de 1905. Il défendit alors l’instauration d’un roi plutôt que d’un président, choix jugé plus sûr et plus diplomatique.\n\nIssu d’une illustre famille noble norvégienne et danoise, il détient le titre de baron au Danemark. En Norvège, il n’a cependant aucun titre formel, l’aristocratie ayant été abolie par la loi de 1821. Diplomate chevronné, Wedel joua un rôle central dans l’acquisition de l’archipel du Svalbard par la Norvège, attribué en partie pour compenser les pertes subies par la marine marchande neutre, qui avait discrètement aidé l’Entente durant la Grande Guerre."
NOR_haakon_steen_lie:0 "Haakon Steen Lie"
NOR_rolf_joergen_fuglesang:0 "Rolf Jørgen Fuglesang"
NOR_just_ebbesen_von_der_lippe:0 "Just Ebbesen von der Lippe"
##character ideas (Isles)
LOI_douglas_neil_wimberley_ac:0 "Douglas Neil Wimberley"
LOI_andrew_miller_nc:0 "Andrew Miller"
LOI_arthur_william_tedder_ac:0 "Arthur William Tedder"
LOI_john_william_balfour_paul_theorist:0 "John William Balfour Paul"

####--Leader Descriptions--####
NOR_johan_nygaardsvold_desc:0 "Né fils de fermier à Hommelvik (aujourd’hui commune de Malvik), Johan Nygaardsvold travailla dès 12 ans dans une scierie. En 1902, jeune adulte, il émigra au Canada puis aux États-Unis, occupant divers emplois en Colombie-Britannique, au Montana et à Washington.\n\nDe retour en Norvège cinq ans plus tard, il s’engagea en politique et fut élu en 1910 au conseil de l’éducation du Parti travailliste. Il a depuis marqué la politique norvégienne, notamment en participant à l’« accord de crise » avec le Parti des agriculteurs, qui lui permit de former un gouvernement en 1935. Son gouvernement défendit de vastes réformes sociales pour atténuer les effets de la Dépression, mais resta peu enclin aux dépenses militaires et à une politique étrangère vigilante."
NOR_nils_traedal:0 "Nils Trædal"
NOR_nils_traedal_desc:0 "Né fils de fermier à Sunndal, Nils Trædal a cumulé responsabilités et expériences politiques tout au long de sa vie. Prêtre, maire, ministre de l’Église et de l’Éducation dans les gouvernements Kolstad et Hundeid (1931-1933), Premier ministre et ministre des Affaires étrangères par intérim (1932), représentant du comté de Møre og Romsdal et ancien membre du Parti libéral, il est aussi cofondateur du prédécesseur du Parti des agriculteurs. Aujourd’hui, à la tête de ce parti, il défend la réforme agricole et met son expérience variée au service du pays."
NOR_ivar_lykke:0 "Ivar Lykke"
NOR_ivar_lykke_desc:0 "Né à Trondhjem, fils d’un commerçant, Ivar Lykke travailla dans l’entreprise familiale avant de se lancer en politique. Élu député en 1916, il se fit connaître comme un homme politique modéré, sobre et proche des milieux d’affaires. Favorable aux réformes sociales libérales et apprécié pour son humilité, il gagna la confiance de beaucoup. Devenu Premier ministre en 1926, il poursuivit sa carrière, marquée entre autres par le compromis qu’il proposa en 1931 dans le conflit autour du nom de sa ville natale : Trondhjem ou Nidaros. Il trancha pour Trondheim."
NOR_carl_joachim_hambro:0 "Carl Joachim Hambro"
NOR_carl_joachim_hambro_desc:0 "Né en 1885 à Bergen, Hambro fut longtemps journaliste et rédacteur en chef du Morgenbladet, premier quotidien du pays. Orateur brillant, il fut élu en 1919 au Storting (Parlement norvégien) et en devint président, vice-président et chef du groupe parlementaire conservateur. Décoré du grand-croix de l’Ordre de Saint-Olaf en 1937, cultivé et efficace, Hambro sait faire avancer les choses rapidement quand il le faut."
NOR_johan_ludwig_mowinckel_desc:0 "Né à Bergen en 1870, Johan L. Mowinckel appartenait à une vieille famille commerçante. Il étudia langues et commerce en Allemagne, en Angleterre et en France, avant de fonder sa propre compagnie maritime en 1898. Élu conseiller municipal, puis maire de Bergen lors de la dissolution de l’Union avec la Suède, il entra au Parlement en 1907. Trois fois Premier ministre, il occupa aussi les postes de ministre de l’Industrie, du Commerce, des Affaires étrangères et de président du Storting. Une figure majeure de la politique norvégienne."
NOR_haakon_vii:0 "Haakon VII"
NOR_haakon_vii_desc:0 "Né en 1872, prince de Danemark et d’Islande sous le nom de Christian Frederik Carl Georg Valdemar Axel, il servit dans la marine danoise avec le grade de lieutenant. Époux de la princesse britannique Maud en 1896, il devint en 1905 roi de Norvège à l’invitation des politiciens norvégiens, qui souhaitaient un souverain après la dissolution de l’union avec la Suède. Devenu Haakon VII, il prêta serment le 27 novembre 1905 comme premier roi indépendant depuis 518 ans.\n\nAujourd’hui, sous l’influence de courants plus traditionalistes, ce roi démocrate se retrouve paradoxalement plus absolu que jamais. Qui peut bien être à l’origine d’un tel revirement ?"
NOR_monarchist_coalition:0 "Coalition monarchiste"
NOR_monarchist_coalition_desc:0 "Politiciens et citoyens, ruraux et citadins, agrariens, conservateurs, libéraux monarchistes et autres : la coalition monarchiste regroupe un large éventail d’acteurs, unis par une même cause — restaurer le royaume de Norvège dans son indépendance passée."
NOR_vidkun_quisling_desc:0 "Originaire de Fyresdal, Vidkun Quisling fut un étudiant brillant en sciences humaines, histoire et sciences naturelles. Entré à l’Académie militaire en 1905, il obtint le meilleur score d’entrée et poursuivit une carrière d’officier. Observateur de la Russie, attaché militaire, collaborateur de Nansen dans l’aide humanitaire, ministre de la Défense en 1931, il fonda finalement le parti Nasjonal Samling. Ses idées mêlent nationalisme et socialisme."
NOR_adam_egede_nissen_desc:0 "Adam Hjalmar Egede-Nissen, né à Frol, travailla dans la poste tout en étudiant la philosophie. Député en 1900 sous l’étiquette libérale, il rejoignit le Parti travailliste en 1905, puis devint maire de Stavanger. Radical, il fit passer clandestinement de la littérature révolutionnaire, fonda un syndicat de mineurs, participa à la grève générale de 1919 en soutien à la révolution russe, rencontra Lénine et assista à la fondation du Komintern. En 1923, il rejoignit le Parti communiste norvégien (NKP) après la scission du Parti travailliste."

