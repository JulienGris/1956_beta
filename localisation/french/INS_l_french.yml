#Arbre de priorités
INS_claim_guinea:0 "Poursuivre l’expédition"
INS_claim_guinea_desc:0 "Qu’elle soit allemande ou australienne, l’île de Nouvelle-Guinée est depuis longtemps contrôlée par des puissances étrangères sans intérêt ni légitimité sur son peuple. Nous allons corriger cela."
INS_form_the_home_guard:0 "Former la Garde nationale"
INS_form_the_home_guard_desc:0 "Toute action militaire commencera par la défense, l’offensive viendra ensuite. Il est donc primordial de reconstituer notre Garde nationale en une force de combat efficace."
INS_interventionism:0 "Promouvoir l’interventionnisme"
INS_interventionism_desc:0 "Le KNIL a une longue tradition de volontariat ; il est naturel de porter cet enthousiasme au XXe siècle."
INS_ambonese_auxilaries:0 "Recruter les Ambonais"
INS_ambonese_auxilaries_desc:0 "Bien que minoritaires, les Ambonais se sont toujours montrés fiables en période de conflit ; les organiser en forces auxiliaires est une évidence."
INS_city_fortifications:0 "Fortifications urbaines"
INS_city_fortifications_desc:0 "Maintenant que nous avons une garnison dédiée, il est temps de la mettre au travail pour ériger les premières défenses de nos villes. Même les efforts les plus modestes paieront en cas de malheur."
INS_expand_the_officers_corps:0 "Élargir le corps des officiers"
INS_expand_the_officers_corps_desc:0 "La ségrégation et les déséquilibres raciaux sont monnaie courante dans notre commandement. En offrant une véritable formation et un soutien aux officiers indigènes, notre armée ne pourra qu’y gagner."
INS_raaf_assistance:0 "Coopérer avec la R.A.A.F."
INS_raaf_assistance_desc:0 "[AST.GetNameDefCap] est l’allié le plus proche à pouvoir nous soutenir en cas de crise ; accroître l’assistance aérienne est une étape simple mais vitale."
INS_indonesian_fighter_schools:0 "Écoles de pilotes [INS.GetAdjective]"
INS_indonesian_fighter_schools_desc:0 "La théorie et le matériel ne suffisent pas ; si notre aviation doit progresser, nous devons former la prochaine génération d’as de l’air."
INS_air_by_sea:0 "Assurer la suprématie aéronavale"
INS_air_by_sea_desc:0 "Des stratèges britanniques nous ont déjà sollicités pour renforcer la coopération militaire dans la défense de leurs colonies asiatiques ; il est peut-être temps de répondre."
INS_the_flying_dutchmen:0 "Les Hollandais volants"
INS_the_flying_dutchmen_desc:0 "Rêver n’a jamais fait de mal."
INS_stay_with_the_netherlands:0 "Réaffirmer notre loyauté"
INS_stay_with_the_netherlands_desc:0 "Si l’indépendance est séduisante, elle n’est pas réaliste dans le contexte mondial actuel. Il est plus sage, du moins pour l’instant, de maintenir notre alignement sur le statu quo."
INS_jewel_of_the_pacific:0 "Joyau du Pacifique"
INS_jewel_of_the_pacific_desc:0 "Si [RAJ.GetNameDef] est le joyau de l’Empire britannique, alors les Indes orientales sont le nôtre. Nos richesses et nos ressources sont l’ultime vestige de l’empire maritime néerlandais, et nous devons les protéger à tout prix."
INS_empower_the_volksraad:0 "Réformer le Volksraad"
INS_empower_the_volksraad_desc:0 "Notre conseil populaire n’est qu’un geste symbolique : faible, inefficace et sans véritable pouvoir. Renforcer ce parlement est nécessaire si nous voulons devenir une démocratie véritable."
INS_kebangkitan:0 "Radicaliser les nationalistes"
INS_kebangkitan_desc:0 "Réveillez-vous, Indonésiens, et redécouvrez l’héritage de votre terre natale. « Longue vie à ma terre, longue vie à mon pays, à mon peuple, à ma patrie tout entière ; que son âme s’élève, que son corps s’éveille. »"
INS_PNI:0 "La voie de la liberté"
INS_PNI_desc:0 "La seule voie d’avenir, et la seule chance de survie, passe par un État nationaliste fort, comme le promet le Grand Parti indonésien. La coopération ne fait qu’affaiblir nos chances de liberté."
INS_java_shipyards:0 "Étendre les chantiers navals de [446.GetName]"
INS_java_shipyards_desc:0 "Si nous voulons être une puissance navale autonome, nous devons agir comme telle. Construire de véritables chantiers navals est le premier pas."
INS_fortify_the_ports:0 "Fortifier les ports"
INS_fortify_the_ports_desc:0 "Nos bases navales sont notre première ligne de défense ; les protéger doit être notre priorité."
INS_naval_autonomy:0 "Demander l’autonomie navale"
INS_naval_autonomy_desc:0 "La marine [HOL.GetAdjective] entretient une force importante sur nos côtes, mais nous n’avons aucun mot à dire sur son emploi. Réclamer l’autonomie navale est le premier pas vers notre maîtrise des mers."
INS_the_test_flight_service:0 "Service d’essais en vol"
INS_the_test_flight_service_desc:0 "Depuis 1915, le KNIL a une présence dans le ciel. Il est temps que notre « Service d’essais en vol » bénéficie du développement qu’il mérite."
INS_knil_integration:0 "Coordination terre-air"
INS_knil_integration_desc:0 "Depuis sa création, notre aviation a toujours été pensée comme un soutien à l’armée. En construisant des bases stratégiques dans la région, nous pourrons assurer ce rôle de manière bien plus efficace."
INS_coastal_entrenchment:0 "Retranchements côtiers"
INS_coastal_entrenchment_desc:0 "Une ingénierie appropriée est la dernière étape pour garantir nos défenses côtières. Nos rivages seront imprenables."
INS_british_ship_designs:0 "Étudier les plans navals [ENG.GetAdjective]"
INS_british_ship_designs_desc:0 "Nos homologues [HOL.GetAdjective] ont récemment acquis des modèles de navires auprès des [ENG.GetAdjective] ; les réclamer pour nos chantiers est une décision prudente."
INS_ABDA:0 "ABDA"
INS_ABDA_desc:0 "La coordination entre les puissances navales de la région est la meilleure réponse aux menaces croissantes. Ensemble, nous sommes forts."
INS_joint_wargames:0 "Manœuvres conjointes"
INS_joint_wargames_desc:0 "Il est temps de démontrer notre nouvelle puissance navale dans la région. Que tous prennent acte de notre supériorité."
INS_convoy_protection:0 "Protéger nos convois"
INS_convoy_protection_desc:0 "Aucune suprématie navale ne vaut si nos lignes d’approvisionnement sont vulnérables. Pour dominer réellement nos mers, nous devons sécuriser nos convois."
INS_ship_a_day_tactics:0 "Loups de mer"
INS_ship_a_day_tactics_desc:0 "Nos navires ne sont pas des colosses, mais des loups, prêts à fondre sur des ennemis inattentifs. Notre doctrine navale doit s’en inspirer."
INS_koninklijk_nederlands_indisch_leger:0 "Armée de [ROOT.GetNameDef]"
INS_koninklijk_nederlands_indisch_leger_desc:0 "Notre armée – si l’on peut l’appeler ainsi – est désorganisée, négligée et presque obsolète. C’est donc sur elle que doivent porter nos efforts en priorité."
INS_naval_warfare:0 "Étudier la guerre navale"
INS_naval_warfare_desc:0 "Sans capacité de débarquement, toute suprématie navale est vaine. Notre stratégie doit en tenir compte."
INS_KNIL_marines:0 "Marines du KNIL"
INS_KNIL_marines_desc:0 "La guerre se mène sur tous les fronts ; pour nous, au Pacifique, cela signifie surtout les plages."
INS_reform_the_knil:0 "Réorganiser le KNIL"
INS_reform_the_knil_desc:0 "Nos réformes, bien que longues et douloureuses, ont porté leurs fruits ! Nos fils porteront [INS.GetNameDef] tel un oiseau de proie, vigilant face à tout ennemi."
INS_non_discriminatory_conscription:0 "Conscription sans discrimination"
INS_non_discriminatory_conscription_desc:0 "Nos méthodes de recrutement, bancales depuis trente ans, ont cherché à maintenir une majorité européenne tout en fournissant des effectifs suffisants, ce qui a causé d’innombrables problèmes. Supprimer ces quotas raciaux est le meilleur moyen de rationaliser notre armée."
INS_guerilla_tactics:0 "Tactiques de guérilla"
INS_guerilla_tactics_desc:0 "Nous devons préparer nos troupes à se battre pour chaque parcelle de terrain, dans la jungle, les montagnes et les plaines, si nous voulons avoir la moindre chance de survie."
INS_preemptive_defense:0 "Défense préventive"
INS_preemptive_defense_desc:0 "Si nous devons faire la guerre, qu’elle se fasse à l’échelle véritablement moderne ; alors seulement nous serons assurés de la victoire."
INS_the_royal_batavian_society:0 "Société royale de Batavia"
INS_the_royal_batavian_society_desc:0 "Fondée il y a plus de 150 ans, la Société de Batavia symbolise l’histoire partagée de la colonie avec le progrès scientifique. La mettre en valeur est le premier pas vers un esprit scientifique national."
INS_phillips_radio:0 "Radio Philips"
INS_phillips_radio_desc:0 "La radio est une fierté des Pays-Bas, et en 1927 nous avons entendu la voix de notre Reine traverser les océans. Nous devons capitaliser sur cette expertise pour nos propres ambitions."
INS_royal_scientific_cooperation:0 "Coopération scientifique"
INS_royal_scientific_cooperation_desc:0 "Des équipes de recherche de [HOL.GetNameDef] et des Indes orientales doivent unir leurs efforts pour créer un processus scientifique commun. Avec chaque coin du globe mobilisé, aucun problème n’est insurmontable."
INS_knowledge_economy:0 "Économie du savoir"
INS_knowledge_economy_desc:0 "La population de [INS.GetNameDefCap] est sa plus grande richesse. En valorisant ce capital humain, notre économie et notre technologie atteindront de nouveaux sommets."
INS_local_universities:0 "Universités locales"
INS_local_universities_desc:0 "En développant l’enseignement supérieur, nous avons attaqué le cœur du problème. Notre nation se renforcera grâce aux esprits brillants de demain."
INS_scientific_exceptionalism:0 "Université de Batavia"
INS_scientific_exceptionalism_desc:0 "Après avoir posé les fondations de la recherche, nous pouvons désormais cultiver un esprit scientifique national et promouvoir l’exceptionnalisme indonésien."
INS_foreign_experts:0 "Experts étrangers"
INS_foreign_experts_desc:0 "En collaborant avec des savants venus du monde entier, nous exploiterons pleinement nos ressources scientifiques et renforcerons notre place sur la scène mondiale."
INS_industrial_centralisation:0 "Centralisation industrielle"
INS_industrial_centralisation_desc:0 "Nos ressources sont immenses, mais notre économie civile est inexistante, et une grande partie de nos richesses est exportée sans retour pour notre peuple. Concentrons-nous sur la création d’une base industrielle stable."
INS_restore_the_arms_factories:0 "Relancer les usines d’armement"
INS_restore_the_arms_factories_desc:0 "Depuis des années, aucune production d’armes majeure n’a eu lieu sur nos terres. Nos usines doivent renaître pour fournir un armement moderne à nos soldats."
INS_colonial_infrastructure:0 "Restaurer l’infrastructure coloniale"
INS_colonial_infrastructure_desc:0 "Les anciens projets coloniaux de connexion sont un point de départ idéal pour créer un [INS.GetName] interconnecté."
INS_connect_the_islands:0 "Relier les îles"
INS_connect_the_islands_desc:0 "Nous ne pouvons pas dépendre uniquement de l’infrastructure continentale ; de grands travaux doivent avoir lieu sur toutes nos îles pour accompagner l’industrialisation."
INS_expand_our_industries:0 "Développer nos industries"
INS_expand_our_industries_desc:0 "Depuis toujours, l’économie des Indes orientales repose sur l’exportation. Même si nous devons diversifier nos activités, il serait insensé d’abandonner cette industrie lucrative."
INS_economic_independence:0 "Indépendance économique"
INS_economic_independence_desc:0 "L’autosuffisance est la seule véritable autonomie. Notre souveraineté ne sera entière que lorsque nos ressources appartiendront à notre peuple et que nous ne dépendrons plus de personne."
INS_earthworks:0 "Exploiter notre sol"
INS_earthworks_desc:0 "Avec la capacité de remodeler notre terrain, nous pouvons enfin nous approprier la terre de notre patrie et en tirer tout son potentiel."
INS_continue_the_modernisation:0 "Poursuivre la modernisation"
INS_continue_the_modernisation_desc:0 "La politique éthique néerlandaise a été bénéfique, offrant un certain bien-être à nos sujets. Mais elle reste insuffisante ; il faut désormais augmenter les investissements pour poursuivre la modernisation des Indes orientales."
INS_civilian_works:0 "Exploiter les travaux civils"
INS_civilian_works_desc:0 "Une vaste déforestation et la construction de nouvelles usines dynamiseront notre économie, créant de nouveaux cœurs industriels."
INS_airborne_industries:0 "Industries aéronautiques"
INS_airborne_industries_desc:0 "Développer une industrie aéronautique solide est essentiel à la connectivité d’une nation insulaire. En nationalisant les lignes aériennes, nous pouvons y parvenir."
INS_envoy_to_japan:0 "Envoyer un émissaire à [JAP.GetNameDef]"
INS_envoy_to_japan_desc:0 "Le seul pays nationaliste de notre région est aussi la plus grande puissance locale. Nouer des relations renforcées avec lui est logique pour légitimer notre mouvement."
INS_the_agreement:0 "L’accord"
INS_the_agreement_desc:0 "Il n’est pas secret que les [JAP.GetAdjective] ont des intérêts sur nos terres ; peut-être pouvons-nous en tirer avantage dans notre lutte pour la liberté."
INS_begin_the_transition:0 "Commencer la transition"
INS_begin_the_transition_desc:0 "Le grand esprit de [INS.GetNameDef] a triomphé de tous ses ennemis. Mais notre nation appartient à son peuple, et il est temps de la lui rendre."
INS_guided_democracy:0 "Démocratie dirigée"
INS_guided_democracy_desc:0 "La démocratie occidentale est corrompue et n’est pas meilleure que le fascisme. Il est temps d’instaurer un nouveau système, guidé et propre à notre nation."
INS_soeara_rakyat:0 "« Si j’étais Hollandais »"
INS_soeara_rakyat_desc:0 "Si nous voulons être un mouvement du peuple, notre message doit d’abord atteindre le peuple. Journaux locaux et pamphlets politiques deviendront la voix de la révolution."
INS_envoy_to_moscow:0 "Envoyer un émissaire à Moscou"
INS_envoy_to_moscow_desc:0 "Bien que lointains, les [SOV.GetAdjective] pourraient soutenir notre cause, ne serait-ce que pour nous empêcher de nous allier à une autre grande puissance."
INS_claim_timor:0 "Unifier Pulau Timor"
INS_claim_timor_desc:0 "La présence [POR.GetAdjective] au Timor est mineure mais reste une influence coloniale ; si nous sommes de véritables libérateurs, aucune puissance coloniale ne doit contrôler nos îles."
INS_military_indoctrination:0 "Endoctrinement militaire"
INS_military_indoctrination_desc:0 "Nous avons la liberté, et nous avons le pouvoir, mais ces deux choses sont fragiles. Un ancrage plus profond du pouvoir militaire est nécessaire pour assurer notre place dans l’histoire."
INS_collectivise_industry:0 "Collectiviser l’industrie"
INS_collectivise_industry_desc:0 "La révolution a triomphé ; il est désormais temps que les fruits de notre labeur reviennent au peuple auquel ils appartiennent."
INS_reunify_pppki:0 "Réunifier le PPPKI"
INS_reunify_pppki_desc:0 "La première Association des Organisations Politiques Nationales d’Indonésie a été dissoute à cause des désaccords internes entre ses fondateurs, Soekarno et Soekiman. Mais les temps changent, et les nationalistes restants ont plus que jamais besoin d’unité face au renforcement du contrôle néerlandais. Unis nous tiendrons, ensemble nous tomberons !"
INS_one_country_one_people_one_language:0 "Un pays, un peuple, une langue"
INS_one_country_one_people_one_language_desc:0 "Si nous voulons unir notre peuple, nous ne devons pas être divisés par de futiles questions de langue ou de race. Dans cette grande lutte, nous sommes tous [INS.GetAdjective]."
INS_our_own_path:0 "Notre propre voie"
INS_our_own_path_desc:0 "Ni [JAP.GetNameDef] ni [SOV.GetNameDef] ne nous offrent les moyens de notre libération ; c’est seulement par nous-mêmes que nous pourrons véritablement garantir notre souveraineté."
INS_hari_kemerdekaan:0 "Hari Kemerdekaan"
INS_hari_kemerdekaan_desc:0 "Nous avons attendu si longtemps notre liberté qu’il est difficile de croire qu’elle soit enfin là. Que les [INS.GetAdjective]s se souviennent à jamais du jour de notre indépendance !"
INS_gather_the_opposition:0 "Rassembler l’opposition"
INS_gather_the_opposition_desc:0 "Notre lutte pour la liberté est une lutte noble, non pas de violence ni de soulèvement. À chaque pas que nous faisons, nous montrons au monde notre droit à une autogouvernance indépendante et souveraine."
INS_allied_but_equal:0 "Alliés mais égaux"
INS_allied_but_equal_desc:0 "Notre meilleure chance d’indépendance est d’approcher les [HOL.GetAdjective] comme des amis, non comme des adversaires. Si nous pouvons les convaincre que nous serons plus utiles en tant qu’égal qu’en tant que sujet, la liberté est assurée."
INS_gapi_focus:0 "Le Gaboengan Politik Indonesia"
INS_gapi_focus_desc:0 "La diversité de notre nation est une richesse dont nous devons être fiers, et ce n’est qu’en soutenant et en valorisant nos cultures que nous réussirons à devenir libres. En unissant les différents groupes nationalistes légalement reconnus en une seule fédération politique, nos voix seront assurément mieux entendues !"
INS_invite_foreign_investors:0 "Inviter des investisseurs étrangers"
INS_invite_foreign_investors_desc:0 "Accepter les investissements transfrontaliers de sociétés étrangères est la clé pour développer notre marché local naissant et nous orienter vers la mondialisation."
INS_koninklijk_paketvaart_maatschappij:0 "Koninklijk Paketvaart Maatschappij"
INS_koninklijk_paketvaart_maatschappij_desc:0 "Les routes commerciales des Indes furent jadis une immense source de richesse pour la Compagnie des Indes orientales. Avec un soutien gouvernemental approprié, notre économie peut prospérer de la même manière."
INS_maphilindo:0 "La Confédération pan-malaisienne"
INS_maphilindo_desc:0 "Notre engagement envers la démocratie et la liberté pour toutes les nations est irréprochable. Il est temps d’approcher les grandes puissances et de leur demander l’union de nos frères et sœurs dans la liberté et l’unité."
maphilindo:0 "Maphilindo"
INS_peacetime_economics:0 "Économie de temps de paix"
INS_peacetime_economics_desc:0 "Notre liberté a été longue à venir, et il est maintenant temps de profiter des fruits de notre dur labeur ; le peuple de [INS.GetNameDef] ne connaîtra plus les troubles ni la guerre, mais la paix et la prospérité."
INS_unity_in_diversity:0 "Unité dans la diversité"
INS_unity_in_diversity_desc:0 "Bien que dispersés et séparés, la nouvelle nationalité partagée que nous avons en tant que peuple est un excellent facteur d’union en ces temps troublés. Chaque homme et chaque femme doit être fier de se dire [INS.GetAdjective]."
INS_PKI:0 "Libérer les communistes exilés"
INS_PKI_desc:0 "Le véritable mal du colonialisme réside dans le pillage des richesses et du confort des peuples indigènes par les riches et les puissants. Le Parti communiste indonésien réparera cette injustice."
INS_political_concessions:0 "Concessions politiques"
INS_political_concessions_desc:0 "Le climat politique actuel étant fracturé, en échange de la stabilité relative que nous offrons, nos partisans peuvent arracher une autonomie politique."
INS_defensive_politics:0 "Politique défensive"
INS_defensive_politics_desc:0 "Ayant stabilisé nos facteurs internes, nous devons présenter extérieurement un front politique uni. Choisir une politique défensive garantira une plus grande cohésion dans notre sphère politique."
INS_asian_superiority:0 "Suprématie asiatique"
INS_asian_superiority_desc:0 "Notre ascension est fulgurante, notre héritage assuré. Il ne nous reste plus qu’à montrer au monde la véritable puissance des mers d’Asie."
INS_strike_japan:0 "Frapper [JAP.GetNameDef]"
INS_strike_japan_desc:0 "Le belliciste fasciste de [JAP.GetNameDef] est une menace constante pour la stabilité de la région ; ce n’est qu’en neutralisant ce danger permanent que nous pourrons assurer notre prospérité continue."
INS_konfrontasi:0 "Mettre en œuvre la Konfrontasi"
INS_konfrontasi_desc:0 "[MAL.GetNameDefCap] n’est rien de plus qu’un État fantoche, une tache répugnante sur les peuples libres d’Asie du Sud-Est. Nous effacerons cette souillure et cimenterons davantage la domination de [INS.GetNameDef] dans la région."
INS_liberate_the_philippines:0 "Libérer les Philippines"
INS_liberate_the_philippines_desc:0 "Le contrôle [USA.GetAdjective] de [PHI.GetNameDef] ne vaut pas mieux que celui des colonies des autres vieilles puissances. Nous libérerons nos frères de leurs geôliers [USA.GetAdjective] !"
INS_westernisation:0 "Promouvoir la coopération politique"
INS_westernisation_desc:0 "Notre gouvernement colonial, bien que bienveillant, reste extrêmement impopulaire. Si nous pouvons adapter les valeurs et idées occidentales en quelque chose d’acceptable pour notre population, elle sera probablement bien plus encline à accepter notre régime."
INS_limited_autonomy:0 "La question du Commonwealth"
INS_limited_autonomy_desc:0 "Malgré les défis persistants qui affirment le contraire, nous avons constamment prouvé notre loyauté envers le gouvernement [HOL.GetAdjective]. Peut-être cette fois nous accorderont-ils une véritable autonomie, en échange d’une meilleure gestion des Indes orientales."
INS_join_allies:0 "Rejoindre les Alliés"
INS_join_allies_desc:0 "Formaliser nos accords de défense avec nos voisins signifie abandonner notre neutralité dans la région, mais c’est un petit prix à payer pour la protection."
INS_modernize_the_military:0 "Moderniser l’armée"
INS_braat_overvalwagen:0 "Braat Overvalwagen"
INS_braat_overvalwagen_desc:0 "Peut-être, avec les matériaux fournis par les entreprises de véhicules existantes, devrions-nous créer notre propre voiture blindée, mieux adaptée à notre terrain. Des rues animées de Soerabaja jusqu’aux profondeurs des jungles de Nouvelle-Guinée !"

INS_spawn_landstorm_division:0 "Crée une division §YOost-Indie Landstorm§! à §Y[THIS.GetName]§!."
INS_spawn_irregular_division:0 "Crée §Y2 divisions Irreguliere Divisie§! à §Y[THIS.GetName]§!."

netherlands_research_name:0 "Recherche [HOL.GetNonIdeologyName]"
netherlands_research_desc:0 "La coopération internationale entre les Pays-Bas et leurs colonies permet de plus grandes avancées technologiques."

INS_naval_autonomy_tooltip:0 "Même si [HOL.GetNameDef] refuse, nous recevrons tout de même une petite récompense."
INS_bunker_tooltip:0 "Ajoute des forts dans les provinces clés."
INS_ports_tooltip:0 "Ajoute des fortifications côtières dans les principales bases navales."

committed_colonialist:0 "Colonialiste convaincu"
committed_colonialist_desc:0 "Ce dirigeant est farouchement loyal à l’administration coloniale et résiste à tout mouvement d’indépendance."
nationalist_uniter:0 "Unificateur nationaliste"
nationalist_uniter_desc:0 "Ce dirigeant croit en l’autodétermination des peuples et est tout à fait disposé à leur tendre la main."
committed_revolutionary:0 "Révolutionnaire convaincu"
committed_revolutionary_desc:0 "Ce dirigeant est dévoué à la révolution internationale et ne reculera devant rien pour apporter la liberté à ses voisins."
democratic_defender:0 "Défenseur de la démocratie"
democratic_defender_desc:0 "Ce dirigeant considère que la démocratie de son pays est un droit chèrement acquis et la défendra."

