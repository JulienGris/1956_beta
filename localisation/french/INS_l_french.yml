INS_pal_surabaya:0 "Penataran Angkatan Laoet - Surabaya"
INS_pal_surabaya_desc:0 "Le premier chantier naval indonésien, acquis par la nationalisation de la Soerabaja DM à différentes périodes entre 1945 et 1957."
