RULE_OPTION_COLONIAL_INS_HISTORICAL:0 "Colonial – Historique"
RULE_OPTION_COLONIAL_INS_HISTORICAL_DESC:0 "L’Indonésie restera sous domination néerlandaise et demeurera une colonie."
RULE_OPTION_COMMUNIST_INS_AI_DESC:0 "Le PKI sera réorganisé et Munawar Musso reviendra pour diriger l’Indonésie."
RULE_OPTION_MARHAENIST:0 "Marhaénisme – Socialisme"
RULE_OPTION_MARHAENIST_INS_AI_DESC:0 "Le PNI sera réformé avec Sukarno à sa tête."
RULE_OPTION_FASCIST_INS_AI:0 "Nationalisme de droite"
RULE_OPTION_FASCIST_INS_AI_DESC:0 "Le Parindra sera radicalisé et le Dr Soetomo effectuera un coup d’État."
RULE_OPTION_DEMOCRATIC_INS_AI_DESC:0 "Le PSII fera pression pour obtenir une autonomie accrue, jusqu’à y parvenir."

