#focus ideas
INS_volunteers_idea:0 "Interventionnisme"
INS_volunteers_idea_desc:0 "Le KNIL a une longue tradition de volontariat ; il est naturel de prolonger cet enthousiasme au XXe siècle."
INS_army_idea_two:0 "Réformes de l’armée"
INS_army_idea_two_desc:0 "Bien que de véritables réformes soient encore lointaines, voici la première étape."
INS_army_idea_two_1:0 "Réformes de l’armée"
INS_army_idea_two_1_desc:0 "Bien que de véritables réformes soient encore lointaines, voici la première étape."
INS_army_idea_two_2:0 "Réformes de l’armée"
INS_army_idea_two_2_desc:0 "Bien que de véritables réformes soient encore lointaines, voici l’étape suivante."
INS_army_idea_two_3:0 "Réformes de l’armée"
INS_army_idea_two_3_desc:0 "Bien que de véritables réformes soient encore lointaines, voici la dernière étape."
INS_army_idea_six:0 "Kartika Eka Paksi"
INS_army_idea_six_desc:0 "Nos réformes, longues et douloureuses, ont été un succès ! Nos fils porteront [INS.GetNameDef] comme un oiseau de proie, vigilant face à tous ses ennemis."
INS_ace_idea:0 "Ailes de la mère patrie"
INS_ace_idea_desc:0 "[INS.GetNameDef] dominera ses cieux."
INS_coastal_entrenchment_idea:0 "Fortification côtière"
INS_coastal_entrenchment_idea_desc:0 "Nos capacités de défense côtière sont limitées, mais avec une gestion prudente de nos ressources, nous pouvons nous permettre de construire quelques forts côtiers dans nos principales bases navales de l’archipel."
INS_abda_idea:0 "ABDA"
INS_abda_idea_desc:0 "Commandement américano-britanno-néerlandais-australien"
INS_science_idea_1:0 "Réformes de l’éducation"
INS_science_idea_1_desc:0 "Bien qu’en progrès, l’éducation reste strictement réservée aux élites, au détriment de notre nation."
INS_science_idea_two:0 "Universités locales"
INS_science_idea_two_desc:0 "Nos établissements d’enseignement sont la fierté de l’Asie du Sud-Est ; nous avons bien fait d’enseigner aux leaders de demain les leçons d’aujourd’hui."
INS_economy_idea_two:0 "Koninklijk Paketvaart Maatschappij"
INS_economy_idea_two_desc:0 "Les richesses de l’Indonésie sont de retour, cette fois, pour le peuple."
INS_political_idea_two:0 "Loyauté coloniale"
INS_political_idea_two_desc:0 "Il n’y a pas lieu de parler de révolution violente pour l’instant ; nous devons concentrer tous nos efforts sur une séparation pacifique de la métropole."
INS_political_idea_two_1:0 "Loyauté coloniale"
INS_political_idea_two_1_desc:0 "Il n’y a pas lieu de parler de révolution violente pour l’instant ; nous devons concentrer tous nos efforts sur une séparation pacifique de la métropole."
INS_political_idea_democratic:0 "Soutien démocratique"
INS_political_idea_democratic_desc:0 "La démocratie est l’avenir ; œuvrons pour l’atteindre."
INS_political_idea_fascism:0 "Soutien fasciste"
INS_political_idea_fascism_desc:0 "Une nation forte est nécessaire pour obtenir l’indépendance, et un dirigeant fort pour la guider."
INS_political_idea_fascism_1:0 "Soutien fasciste"
INS_political_idea_fascism_1_desc:0 "Une nation forte est nécessaire pour obtenir l’indépendance, et un dirigeant fort pour la guider."
INS_political_idea_communism:0 "Soutien communiste"
INS_political_idea_communism_desc:0 "Trop longtemps les riches ont dominé les classes populaires. Cela ne sera plus."
INS_political_idea_democratic_1:0 "Transition démocratique"
INS_political_idea_democratic_1_desc:0 "Notre liberté est un succès ! Il est temps de ramener notre gouvernement à la paix."
INS_political_idea_democratic_2:0 "Démocratie guidée"
INS_political_idea_democratic_2_desc:0 "Ni les traditions de l’Ouest, ni celles de l’Est : notre solution est la nôtre."
INS_political_idea:0 "Kebangkitan Nasional"
INS_political_idea_desc:0 "Le sentiment nationaliste est omniprésent dans toutes les couches de la société indonésienne, en particulier parmi les classes populaires. Les mauvaises conditions de vie engendrées par des années d’abus coloniaux poussent le peuple d’Indonésie à devenir chaque jour plus radical. Cependant, tout n’est pas noir ou blanc dans le paysage politique indonésien : de nombreux partis et mouvements sont encore disposés à coopérer avec les administrateurs [HOL.GetAdjective] afin de promouvoir et de protéger les intérêts indonésiens."
INS_kebangkitan_nasional:0 "Kebangkitan Nasional"
INS_kebangkitan_nasional_desc:0 "Le sentiment nationaliste est omniprésent dans toutes les couches de la société indonésienne, en particulier parmi les classes populaires. Les mauvaises conditions de vie engendrées par des années d’abus coloniaux poussent le peuple d’Indonésie à devenir chaque jour plus radical. Cependant, tout n’est pas noir ou blanc dans le paysage politique indonésien : de nombreux partis et mouvements sont encore disposés à coopérer avec les administrateurs [HOL.GetAdjective] afin de promouvoir et de protéger les intérêts indonésiens."
INS_kebangkitan_nasional_2_desc:0 "Le sentiment nationaliste est omniprésent dans toutes les couches de la société indonésienne, en particulier parmi les classes populaires. Les mauvaises conditions de vie engendrées par des années d’abus coloniaux poussent le peuple d’Indonésie à devenir chaque jour plus radical. Cependant, tout n’est pas noir ou blanc dans le paysage politique indonésien : de nombreux partis et mouvements sont encore disposés à coopérer avec les administrateurs [HOL.GetAdjective] afin de promouvoir et de protéger les intérêts indonésiens."
INS_kebangkitan_nasional_3_desc:0 "Le sentiment nationaliste est omniprésent dans toutes les couches de la société indonésienne, en particulier parmi les classes populaires. Les mauvaises conditions de vie engendrées par des années d’abus coloniaux poussent le peuple d’Indonésie à devenir chaque jour plus radical. Cependant, tout n’est pas noir ou blanc dans le paysage politique indonésien : de nombreux partis et mouvements sont encore disposés à coopérer avec les administrateurs [HOL.GetAdjective] afin de promouvoir et de protéger les intérêts indonésiens."
INS_political_idea_4:0 "Unité dans la diversité"
INS_political_idea_4_desc:0 "Nous sommes unis en tant que peuple par la paix, et non par la violence."
INS_political_idea_5:0 "Économie en temps de paix"
INS_political_idea_5_desc:0 "Notre liberté a été longue à obtenir, et il est maintenant temps de profiter des fruits de nos efforts ; le peuple de [INS.GetNameDef] ne connaîtra plus les troubles ni la guerre, mais la paix et la prospérité."
INS_political_idea_five:0 "Kemerdekaan"
INS_political_idea_five_desc:0 "Nous avons attendu si longtemps notre liberté qu’il est difficile de croire qu’elle soit enfin là. Puissent les [INS.GetAdjective]s se souvenir à jamais du jour de notre indépendance !"
INS_political_idea_five_1:0 "Kemerdekaan"
INS_political_idea_five_1_desc:0 "Nous avons attendu si longtemps notre liberté qu’il est difficile de croire qu’elle soit enfin là. Puissent les [INS.GetAdjective]s se souvenir à jamais du jour de notre indépendance !"

INS_army_idea:0 "Armée désunie"
INS_army_idea_desc:0 "Bien qu’adéquate pour le maintien de l’ordre, la dépendance de notre armée au soutien [HOL.GetAdjective], conjuguée à l’absence d’officiers locaux dans nos rangs, a laissé nos forces armées affaiblies et inefficaces ; une réforme profonde est nécessaire."
INS_economy_idea:0 "[Root.getinseconname]"
INS_economy_idea_desc:0 "[Root.getinsecondesc]"
INS_colonial_economy:0 "La Malaise"
INS_colonial_economy_desc:0 "Bien que nous soyons une nation prospère, une grande partie de ce que nous produisons est envoyée à l’étranger, si bien que notre économie locale en souffre, alors même que nous luttons contre notre propre crise économique."
INS_postcolonial_economy:0 "Économie post-coloniale"
INS_postcolonial_economy_desc:0 "Les ruines économiques laissées à la fois par la Malaise et la récente révolution constituent une cicatrice profonde. Nous devons les réparer avant que l’insoutenabilité de notre économie ne devienne un problème politique."
INS_science_idea:0 "Réformes de l’éducation"
INS_science_idea_desc:0 "Bien qu’en progrès, l’éducation reste strictement réservée aux élites, au détriment de notre nation."

indonesia.1.t:0 "Une offre des Indes orientales"
indonesia.1.desc:0 "Bien que la principale ville de Singapour soit bien défendue, il n’est pas secret qu’une présence navale plus importante est nécessaire pour protéger nos colonies d’Asie orientale. Un communiqué du gouvernement colonial des Indes orientales nous offre une opportunité intéressante : un soutien aérien en échange d’un accès militaire. Devons-nous accepter ?"
indonesia.1.a:0 "Parfait !"
indonesia.1.b:0 "Nos défenses actuelles suffisent amplement, merci."

indonesia.4.t:0 "Autonomie navale pour les Indes orientales ?"
indonesia.4.desc:0 "Bien que notre position navale actuelle dans les Indes orientales soit assurée, nos chantiers navals sont éloignés de Java. Le gouvernement colonial a demandé une autonomie navale ainsi que le commandement d’une escadre de nos navires pour compenser cela. Devons-nous accéder à cette demande ?"
indonesia.4.a:0 "Très bien."
indonesia.4.b:0 "Nous ne pouvons pas nous permettre de perdre un seul navire."

indonesia.5.t:0 "[HOL.GetNameDefCap] accepte !"
indonesia.5.desc:0 "Par apathie ou par réelle conviction, le gouvernement [HOL.GetAdjective] nous a accordé une autonomie navale limitée dans notre région."
indonesia.5.a:0 "Nous saisirons cette opportunité !"

indonesia.6.t:0 "[HOL.GetNameDefCap] refuse"
indonesia.6.desc:0 "Préférant garder un contrôle direct sur la région, La Haye a rejeté notre demande d’autonomie navale."
indonesia.6.a:0 "Nous irons de l’avant sans eux."

indonesia.7.t:0 "Manœuvres navales en Asie du Sud-Est"
indonesia.7.desc:0 "Vu le climat tendu en Asie, il n’est pas surprenant que les nations cherchent à afficher leur puissance. [ROOT.GetNameDefCap] ne fait pas exception et commence à démontrer sa nouvelle force navale dans la région."
indonesia.7.a:0 "Inquiétant."
indonesia.7.b:0 "Nous avons montré notre force au monde."
indonesia.7.c:0 "Ils grandissent si vite."
indonesia.7.d:0 "Un nouveau rival ?"

indonesia.8.t:0 "La pétition Soetardjo"
indonesia.8.desc:0 "Bien que les sympathies nationalistes aient été fortes dans nos colonies, le gouvernement colonial en place a réussi à apaiser la population locale et à la maintenir relativement satisfaite. Cependant, de nombreux extrémistes et radicaux parmi les nationalistes et les partisans de l’indépendance ont exigé, sinon la liberté totale, au moins une autonomie accrue pour les Indes orientales. C’est ainsi que la pétition Soetardjo a été déposée il y a quelques jours au Volksraad et est arrivée jusqu’ici."
indonesia.8.a:0 "Un petit prix à payer pour la stabilité."
indonesia.8.b:0 "La situation actuelle nous convient parfaitement."

indonesia.9.t:0 "[FROM.GetNameDefCap] accepte"
indonesia.9.desc:0 "Après, sans doute, de vifs et passionnés débats sur la pétition Soetardjo, il a été décidé que [ROOT.GetNameDefCap] obtiendra une autonomie accrue, voire totale, au sein du Commonwealth des Pays-Bas. C’est une grande victoire, et il y a bien sûr quelqu’un à remercier : Soetardjo Kartohadikusumo, chef de l’Association des fonctionnaires indigènes, ainsi que tous ses partisans."
indonesia.9.a:0 "Un pas de plus vers la liberté !"

indonesia.10.t:0 "Liberté pour les Indes orientales ?"
indonesia.10.desc:0 "Les sympathies nationalistes ont atteint un point de rupture dans nos colonies. Des agitateurs démocrates aux Indes orientales réclament des élections libres et la fin du contrôle colonial, mais se disent prêts à une alliance future. Comment réagir ?"
indonesia.10.a:0 "Mieux vaut eux que les communistes."
indonesia.10.b:0 "Ingrats de colons !"

indonesia.33.t:0 "[INS.GetNameDefCap] revendique la Nouvelle-Guinée !"
indonesia.33.desc:0 "Notre frontière commune avec les Indes orientales sur l’île de Nouvelle-Guinée a toujours été une affaire tendue mais contenue. Cependant, la situation a explosé : le nouveau gouvernement [INS.GetAdjective] exige le contrôle total et la souveraineté sur l’île. Que devons-nous faire ?"
indonesia.33.a:0 "Céder à leurs exigences."
indonesia.33.b:0 "Leur indépendance les a rendus arrogants ; ignorons-les."

indonesia.34.t:0 "[AST.GetNameDefCap] cède !"
indonesia.34.desc:0 "Nos menaces ont porté leurs fruits ; [Ast.GetNameDef] a renoncé à toutes ses revendications sur la Nouvelle-Guinée, et le contrôle nous est transféré immédiatement."
indonesia.34.a:0 "Une victoire diplomatique !"

indonesia.35.t:0 "[AST.GetNameDefCap] refuse !"
indonesia.35.desc:0 "La diplomatie a échoué malgré tous nos efforts ; [Ast.GetNameDef] a ignoré toutes nos demandes et agit comme si de rien n’était."
indonesia.35.a:0 "Très bien."
indonesia.35.b:0 "Ils paieront pour cette insolence."

indonesia.36.t:0 "[INS.GetNameDefCap] revendique le Timor !"
indonesia.36.desc:0 "Notre frontière commune avec les Indes orientales sur l’île de Timor a toujours été une affaire tendue mais contenue. Cependant, la situation a atteint un point critique : le nouveau gouvernement [INS.GetAdjective] exige le contrôle total et la souveraineté sur l’île. Que devons-nous faire ?"
indonesia.36.a:0 "Céder à leurs exigences."
indonesia.36.b:0 "Leur indépendance les a rendus arrogants ; ignorons-les."

indonesia.37.t:0 "[721.Owner.GetNameDefCap] cède le Timor !"
indonesia.37.desc:0 "Le gouvernement [721.Owner.GetAdjective], incapable de projeter ses forces, a décidé d’accepter nos exigences plutôt que de risquer la guerre."
indonesia.37.a:0 "Une victoire diplomatique !"

indonesia.38.t:0 "[POR.GetNameDefCap] refuse !"
indonesia.38.desc:0 "La diplomatie a échoué malgré tous nos efforts ; [POR.GetNameDef] a ignoré toutes nos demandes et agit comme si de rien n’était."
indonesia.38.a:0 "Très bien."
indonesia.38.b:0 "Ils paieront pour cette insolence."

################

indonesia.40.t:0 "[FROM.GetNameDefCap] réclame la liberté coloniale"
indonesia.40.desc:0 "Le monde a énormément changé depuis la Grande Guerre, et l’époque des empires coloniaux paraît désormais dépassée. Le récent cas de [FROM.GetName], nouvellement indépendant, illustre bien la lutte des peuples autochtones sous domination coloniale pour leur liberté. Des diplomates du gouvernement [FROM.GetAdjective] nous ont adressé une pétition afin que nous accordions l’indépendance à nos possessions d’Asie du Sud-Est, en échange d’une garantie de protection [INS.GetAdjective]. Que devons-nous penser de cette offre ?"
indonesia.40.a:0 "Cela pourrait être dans l’intérêt de tous..."
indonesia.40.c:0 "Nos colonies sont d’une importance stratégique et économique majeure, nous n’accepterons pas."

indonesia.41.t:0 "[FROM.GetNameDefCap] accepte notre pétition !"
indonesia.41.desc:0 "Le gouvernement [FROM.GetAdjective] a accepté de retirer ses forces militaires et ses diplomates de ses colonies d’Asie du Sud-Est. Très probablement sous la pression [ROOT.GetAdjective], il a jugé que cela pouvait être dans l’intérêt de tous, ne souhaitant pas avoir [ROOT.GetNameDef] comme ennemi dans la région. Quoi qu’il en soit, cela marque une nouvelle étape vers la liberté des peuples asiatiques !"
indonesia.41.a:0 "Une victoire diplomatique !"

indonesia.42.t:0 "L’indépendance [ROOT.GetAdjective] est accomplie !"
indonesia.42.desc:0 "Nos frères de [FROM.GetNameDef] n’ont pas pris leur indépendance à la légère. Ils ont adressé une pétition à [OVERLORD.GetNameDef] pour obtenir l’indépendance totale de [ROOT.GetNameDef] et le retrait des forces [OVERLORD.GetAdjective] d’Asie du Sud-Est. La fin du colonialisme est proche : notre indépendance n’est qu’une étape de plus vers cet objectif !"
indonesia.42.a:0 "Gloire à la libération du peuple [ROOT.GetAdjective] !"
indonesia.42.b:0 "Notre avenir est aux côtés de [OVERLORD.GetNameDef]..."

indonesia.45.t:0 "[FROM.GetNameDefCap] refuse !"
indonesia.45.desc:0 "En dépit de nos bonnes intentions, notre pétition est restée lettre morte. [FROM.GetNameDefCap] n’a aucune intention d’abandonner ses possessions coloniales en Asie du Sud-Est. Malheureusement, colonialisme et impérialisme gagnent un sursis !"
indonesia.45.a:0 "Il n’y a rien que nous puissions faire..."
indonesia.45.b:0 "Le colonialisme doit disparaître, d’une manière ou d’une autre !"

indonesia.46.t:0 "La mort du Dr Soetomo"
indonesia.46.d_1:0 "Des rapports sont arrivés de Soerabaja annonçant le décès, hier soir, du docteur Soetomo, chef du Parindra, des suites d’un cancer du foie.\n\nFondateur du Boedi Oetomo, le premier mouvement politique Boemipoetra dans les Indes, le Dr Soetomo a constamment démontré qu’en exaltant la vertu, l’indépendance pouvait être obtenue par des moyens non violents, contrairement aux mouvements plus radicaux tels que le Sarekat Islam et le Partai Nasional Indonesia. Une procession funéraire aura lieu à Soerabaja, en présence de ses partisans du Parindra, comme son successeur Woerjaningrat et le chef de la faction nationaliste au Volksraad, Mohammad Hoesni Thamrin."
indonesia.46.d_2:0 "Des rapports sont arrivés de Soerabaja annonçant le décès, hier soir, du président Soetomo, chef de notre nation et de notre parti Parindra, des suites d’un cancer du foie.\n\nFondateur du Boedi Oetomo, le premier mouvement politique Boemipoetra dans les Indes, le Dr Soetomo a constamment démontré que, si l’indépendance pouvait être obtenue par des moyens non violents, les Indonésiens devaient avant tout exalter leurs vertus et s’affirmer comme les propriétaires légitimes de la patrie indonésienne.\n\nAlors que Woerjaningrat lui succède à la tête du parti, une convention spéciale est organisée pour élire le prochain président de [INS.GetNameDef]. Par acclamation :"
indonesia.46.a:0 "Une force du bien s’en est allée"
indonesia.46.b:0 "Mohammad Hoesni Thamrin dirigera notre nation !"
indonesia.46.c:0 "Woerjaningrat doit veiller à ce que la transition se déroule comme prévu"

indonesia.47.t:0 "Changement de commandement"
indonesia.47.d:0 "Avec la récente promotion du contre-amiral Ferwerda et de Furstner dans la Koninklijke Marine, le vice-amiral Maarten van Dulm est officiellement mis à la retraite à l’âge de 57 ans, après avoir servi la flotte des Indes orientales de 1934 à aujourd’hui."
indonesia.47.a:0 "Le Royaume a encore besoin de lui"
indonesia.47.b:0 "Merci pour vos services"

indonesia.48.t:0 "Choisir le candidat royal"
indonesia.48.d:0 "La direction du Parindra s’est réunie aujourd’hui pour élire notre futur monarque pour le sultanat indonésien. Si la décision d’adopter la Maison de Mataram comme dynastie a été immédiatement acceptée, le trône lui-même fait l’objet de deux revendications concurrentes : la branche aînée menée par la Maison de Pakoe Boewono et la branche cadette menée par la Maison de Hamengkoe Boewono. Qui sera notre monarque choisi ?"
indonesia.48.a:0 "La branche aînée, la Maison de Pakoe Boewono"
indonesia.48.b:0 "La branche cadette, la Maison de Hamengkoe Boewono"

indonesia.49.t:0 "La mort de Pakoe Boewono X"
indonesia.49.d_1:0 "Sri Soesoehonan Pakoe Boewono le Dixième, monarque de Soerakarta, est décédé après une longue maladie liée à son âge avancé. La procession funéraire a été suivie par de nombreux dignitaires javanais, indonésiens et même néerlandais, car il était largement respecté pour son acceptation du processus de modernisation dans les Indes orientales. On s’attend à ce que Raden Mas Ontoseno, Pangeran Hangabehi, hérite du trône de son père en tant que Sri Soesoehonan Pakoe Boewono XI."
indonesia.49.d_2:0 "Sri Soesoehonan Pakoe Boewono le Dixième, notre monarque actuel, est décédé après une longue maladie liée à son âge avancé. La procession funéraire a été suivie par de nombreux responsables indonésiens, dont le Premier ministre Woerjaningrat lui-même. On s’attend à ce que Raden Mas Ontoseno, Pangeran Hangabehi, hérite du trône de son père en tant que Sri Soesoehonan Pakoe Boewono XI."
indonesia.49.a:0 "Nous présentons nos condoléances"
indonesia.49.b:0 "La nation est en deuil"

indonesia.50.t:0 "La mort de Hamengkoeboewono VIII"
indonesia.50.d_1:0 "Sri Sultan Hamengkoeboewono le Huitième, monarque de Djogdjakarta, est décédé d’une crise cardiaque soudaine dans un train sur le chemin du retour. La procession funéraire a été suivie par de nombreux dignitaires javanais, indonésiens et même néerlandais, dont H. J. van Mook, qui était un ami personnel du défunt sultan durant ses années d’agent agricole à Djogdjakarta. On s’attend à ce que Goesti Raden Mas Dorodjatoen hérite du trône de son père en tant que Sri Sultan Hamengkoeboewono IX."
indonesia.50.d_2:0 "Sri Sultan Hamengkoeboewono le Huitième, monarque de Djogdjakarta, est décédé d’une crise cardiaque soudaine dans un train sur le chemin du retour. La procession funéraire a été suivie par de nombreux responsables indonésiens, dont [INS.GetLeader] lui-même. On s’attend à ce que Goesti Raden Mas Dorodjatoen hérite du trône de son père en tant que Sri Sultan Hamengkoeboewono IX."
indonesia.50.d_3:0 "Sri Sultan Hamengkoeboewono le Huitième, notre monarque actuel, est décédé d’une crise cardiaque soudaine dans un train sur le chemin du retour. La procession funéraire a été suivie par de nombreux responsables indonésiens, dont le Premier ministre Woerjaningrat lui-même. On s’attend à ce que Goesti Raden Mas Dorodjatoen hérite du trône de son père en tant que Sri Sultan Hamengkoeboewono IX."
indonesia.50.a:0 "Adieu, vieil ami."
indonesia.50.b:0 "Nous présentons nos condoléances"
indonesia.50.c:0 "La nation est en deuil"

indonesia.51.t:0 "La chute des Indes orientales"
indonesia.51.d:0 "Notre île la plus précieuse est de plus en plus menacée par les mains de l’ennemi, et la probabilité que Java soit bientôt envahie augmente. Dans une telle position vulnérable, certains hauts responsables ont reçu l’ordre d’évacuer vers un lieu plus sûr afin de poursuivre le combat de loin. Pour ceux qui restent, que devons-nous faire ?"
indonesia.51.a:0 "Nous devons continuer la lutte à l’étranger !"
indonesia.51.b:0 "Combattre jusqu’au bout !"

indonesia.52.t:0 "Conquête des territoires du Sud riches en ressources"
indonesia.52.d:0 "Avec la chute de Java, tout l’effort du [INS.GetFactionName] dans la région est complètement anéanti, et l’océan Indien est désormais grand ouvert à notre avancée. Plusieurs membres de groupes nationalistes indonésiens se sont présentés aux forces d’invasion, cherchant clairement à collaborer avec nous, en échange de l’exportation libre de leurs richesses pour alimenter notre effort de guerre, exactement comme prévu depuis le début."
indonesia.52.a:0 "Nous devons garder un contrôle direct"

indonesia.53.t:0 "Mort de Frederik de Hoog"
indonesia.53.d:0 "Ce matin, une nouvelle choquante est parvenue de la métropole. Frederik Hermanus de Hoog, chef de l’Indo-Europeesch Verbond, est décédé d’une attaque cérébrale alors qu’il était en vacances pour se remettre d’une insuffisance cardiaque survenue plus tôt cette année.\n\nFrederik de Hoog était un membre éminent de la société des Indes orientales, ayant grandement contribué à aider ses compatriotes indo durant la Malaise. Diplômé de l’université de Leyde, il était membre de l’IEV depuis 1920, nommé officier principal au Staatspoor en Tramwegen en 1922, puis élu membre du Volksraad en 1923, représentant l’IEV. Durant son mandat, il défendit l’émancipation politique et économique, à la fois pour offrir l’égalité des chances à toutes les couches sociales des Indes et pour éviter que des idées plus extrêmes ne s’imposent dans l’archipel.\n\nIl doit être enterré à Bandoeng, en présence de membres de l’IEV, du Volksraad et de responsables du gouvernement de Batavia."
indonesia.53.a:0 "Repose en paix, Frederik"

indonesia.54.t:0 "La révolution éclate !"
indonesia.54.d:0 "À peine quelques heures après notre proclamation d’indépendance, les vestiges de la domination néerlandaise ont repris les postes gouvernementaux clés de Batavia, de Sumatra Nord et des Grandes Indes. Il est clair qu’ils ne s’arrêteront pas avant que notre résistance soit totalement écrasée."
indonesia.54.a:0 "Merdeka atau Mati !!!"
INS_NATREV_aggressor_tt:0 "§RNous combattrons jusqu’au bout contre les oppresseurs étrangers !§!\n"

indonesia.55.t:0 "L’insurrection indonésienne"
indonesia.55.desc:0 "Toutes nos tentatives de contacter Batavia ces six dernières heures depuis minuit se sont heurtées à un silence inquiétant, mais un message frénétique vient tout juste d’arriver de Soerabaja via Singapour. Après la fermeture du Volksraad, les tensions entre les militants Bumiputra et le gouvernement colonial, soutenu par les sympathisants du NSB, ont débouché sur une révolution menée par les restes du Parti communiste indonésien."
indonesia.55.a:0 "Nous sommes trop occupés pour l’instant"
indonesia.55.b:0 "Reprenons notre joyau de la Couronne !"
indonesia.55.c:0 "Nous devons prendre le contrôle direct de la situation !"
indonesia.55.d:0 "Sécurisez immédiatement la Nouvelle-Guinée !"

indonesia.56.t:0 "[FROM.GetNameDefCap] rejette"
indonesia.56.desc:0 "Après, sans doute, de vifs débats autour de la pétition Soetardjo, il a été décidé que [ROOT.GetNameDefCap] conservera son statut administratif et colonial actuel au sein du Commonwealth des Pays-Bas. Il semble que [FROM.GetNameDef] souhaite maintenir le statu quo, craignant qu’accepter puisse être perçu comme une faiblesse."
indonesia.56.a:0 "Au moins, ils nous ont répondu."
indonesia.56.b:0 "Trop, c’est trop ! La liberté doit être obtenue par tous les moyens nécessaires !"

indonesia.100.t:0 "Éliminer l’influence colonialiste"
indonesia.100.desc:0 "Maintenant que nous sommes indépendants, une bonne première étape pour affirmer notre autonomie serait de renommer certaines de nos villes. L’influence [HOL.GetAdjective] n’a pas sa place dans notre nouvelle nation."
indonesia.100.a:0 "Il en sera ainsi !"
indonesia.100.b:0 "J’aime bien Hollandia."

indonesia.105.t:0 "Le nouveau gouverneur"
indonesia.105.desc:0 "La retraite de Cornelis de Jonge, gouverneur général des Indes orientales, marque la fin d’une époque. Homme fort et têtu, Jonge s’opposait fermement à l’autonomie locale et était résolument pro-néerlandais dans son administration, rejetant la plupart des efforts visant à accroître l’autonomie coloniale. Son successeur, Stachouwer, n’a pas encore indiqué quelle direction prendra son administration, mais beaucoup espèrent un souffle nouveau pour relancer les mouvements indépendantistes."
indonesia.105.a:0 "Puisse-t-il bien gouverner."

indonesia.107.t:0 "Le premier Sila"
indonesia.107.desc:0 "Le Comité d’enquête pour les travaux préparatoires de l’indépendance a rédigé un projet des principes directeurs de notre jeune pays, connus sous le nom de Pancasila ou des Cinq Principes. Toutefois, un désaccord est apparu quant au premier Sila. Cela déterminera la place de l’Islam dans le gouvernement. Certains prônent l’application de la charia pour les musulmans, tandis que d’autres voudraient aller plus loin et obliger chaque citoyen à rendre des comptes selon sa propre religion. Une minorité au sein du comité s’est également prononcée en faveur d’une Indonésie laïque, et une autre en faveur d’une monarchie. Après délibération, le comité a décidé que le premier Sila serait..."
indonesia.107.a:0 "...de suivre la charia et marcher avec Allah."
indonesia.107.c:0 "...d’honorer Dieu, le sultan et la patrie."
indonesia.107.d:0 "...ce que proposent les laïcs."
#descripts
INS_reforming_the_army:0 "Réorganisation de l’Armée"
INS_reforming_the_army_desc:0 "Nos réformes, bien que longues et douloureuses, touchent bientôt à leur fin ! Nos fils porteront [INS.GetNameDef] tels des oiseaux de proie, vigilants face à tous nos ennemis."
INS_naval_autonomy_ships:0 "§Y[HOL.GetName]§! transférera plusieurs destroyers et croiseurs légers à [INS.GetNameDef]."
INS_naval_autonomy_ships_desc:0 "Il est temps d’obtenir une plus grande autonomie navale vis-à-vis de La Haye en réclamant la Flotte des Indes orientales. Cela renforcera assurément nos capacités maritimes et constituera notre première ligne de défense en cas d’attaque surprise d’un ennemi étranger."
INS_increase_convoy_production:0 "Accroître la Production de Convoyeurs"
INS_increase_convoy_production_desc:0 "Nos îles sont nombreuses et notre commerce s’étend jusqu’en Europe et même aux Amériques. Nous devons considérablement développer notre production de navires marchands pour soutenir à la fois nos futures exportations et nos importations de produits de qualité."
INS_concessions_to_the_nationalists:0 "Concessions aux Élites Nationales"
INS_concessions_to_the_nationalists_desc:0 "En accordant des concessions limitées aux divers chefs régionaux de l’archipel, nous pouvons garantir leur loyauté envers le Royaume et affaiblir les restants de sentiments nationalistes radicaux, qu’ils soient indiens ou indonésiens."
INS_promote_national_independence:0 "Promouvoir l’Indépendance Nationale"
INS_promote_national_independence_desc:0 "Les Indes sont devenues une nation à part entière, car le peuple reconnaît désormais sa patrie commune comme ciment de l’unité, plutôt que la religion ou l’ethnie. Nous devons renforcer ce sentiment afin de nous tenir aux côtés des Pays-Bas, à égalité, au sein du Royaume dans ses heures de besoin !"
INS_demand_volksraad_elections:0 "Exiger des Élections pour le Volksraad"
INS_demand_volksraad_elections_desc:0 "Avoir un dirigeant qui représente réellement les volontés de ses électeurs est un privilège d’une nation démocratique – et la nôtre l’est, incontestablement ! Il est temps d’organiser les premières élections en [INS.GetNameDef] afin d’élire un Premier ministre qui représentera notre nation !"
INS_nationalize_the_factories:0 "Nationaliser les Usines"
INS_nationalize_the_factories_desc:0 "Malgré le grand nombre d’usines et de chantiers navals dans notre archipel, la plupart appartiennent au secteur privé, invités par le gouvernement colonial pour industrialiser la région. Nous devons les utiliser au bénéfice de notre peuple, d’une manière ou d’une autre."
INS_issue_emergency_powers:0 "Octroyer les Pouvoirs d’Exception"
INS_issue_emergency_powers_desc:0 "La situation exceptionnelle actuelle appelle des mesures exceptionnelles. Hubertus Johannes van Mook est considéré par beaucoup comme un homme exceptionnel, notamment en raison de ses récentes négociations avec les délégués économiques japonais. Il est temps de lui confier la responsabilité de défendre l’archipel !"
INS_implement_the_sharia:0 "Mettre en Place la Charia"
INS_implement_the_sharia_desc:0 "Notre nation est sans conteste religieuse, et les quatre-cinquièmes de notre population se soumettent à Allah. Nous devons garantir la liberté de culte, tout en imposant à nos coreligionnaires musulmans l’application de la loi islamique."
INS_equal_under_god:0 "Égaux devant Dieu"
INS_equal_under_god_desc:0 "Comme l’énonce l’Écriture, tous les hommes naissent égaux, même s’ils ne sont pas identiques. Ainsi, notre nation indonésienne, malgré nos différences religieuses, croit en un être suprême unique. Assez de l’exploitation de l’homme par l’homme !"
INS_death_to_colonialism:0 "À Mort le Colonialisme !"
INS_death_to_colonialism_desc:0 "Si nous sommes reconnaissants de notre liberté, beaucoup d’autres dans notre région restent encore asservis. Que notre liberté soit le premier coup de glas du colonialisme !"
INS_unite_the_ummah:0 "Unifier l’Oumma"
INS_unite_the_ummah_desc:0 ""
INS_liberate_the_northern_muslims:0 "Libérer les Musulmans du Nord"
INS_liberate_the_northern_muslims_desc:0 "Nos plus anciens voisins sont depuis trop longtemps soumis au joug britannique. Il est temps de le briser et de nous unir enfin à nos frères !"
INS_consolidate_the_right:0 "Consolider la Droite"
INS_consolidate_the_right_desc:0 "Les nationalistes indonésiens sont longtemps restés divisés, malgré leur lutte commune contre les Néerlandais. Unissons-les afin d’être assez forts pour briser nos chaînes !"
INS_favour_the_radicals:0 "Favoriser les Radicaux"
INS_favour_the_radicals_desc:0 "Depuis Boedi Oetomo, notre mouvement national a cherché à coopérer avec le gouvernement colonial pour obtenir notre liberté. Cela suffit ! Nous ne pouvons attendre que tous finissent déportés à Digoel un par un. Avec la crise actuelle, nous devons frapper maintenant !"
INS_reinvigorate_the_pfi:0 "Réanimer le PFI"
INS_reinvigorate_the_pfi_desc:0 "En 1933, Raden Notonindito et d’autres ultra-monarchistes ont fondé le Partai Fasis Indonesia pour restaurer la gloire de Majapahit. Bien que son ancienne direction soit tombée dans l’oubli, nous garderons l’idée vivante. Pour une Grande Indonésie !"
INS_choosing_royal_after_coup_tt:0 "Après le succès du coup, une §Gpériode de transition§! visant à transformer l’Indonésie en une §YMonarchie§! commencera."
INS_utilize_the_youth:0 "Mobiliser la Jeunesse"
INS_utilize_the_youth_desc:0 ""
INS_reorganize_the_underground:0 "Réorganiser le PKI"
INS_reorganize_the_underground_desc:0 "La crise politique et économique actuelle, causée par l’incompétence capitaliste et impérialiste, a ravivé les idées de gauche au sein de la classe ouvrière. Peut-être n’étions-nous pas assez forts en 1926, mais cette seconde chance pourrait être la bonne pour briser nos chaînes !"
INS_the_new_party_leadership:0 "Remplacer la Direction du Parti"
INS_the_new_party_leadership_desc:0 "Plutôt que de rester sous l’égide des staliniens défaillants, nous remettrons l’étendard révolutionnaire au toujours populaire Parti National Indonésien. Les noms de Soekarno et Hatta résonnent encore davantage alors qu’ils languissent en exil dans l’Est indonésien. Que le cauchemar des Hollandais devienne réalité…"
INS_launch_the_revolution:0 "Lancer la Révolution"
INS_launch_the_revolution_desc:0 "Il est temps de nous lever ! Nous devons briser les chaînes imposées par ces impérialistes et nous battrons jusqu’au dernier homme et à la dernière femme !\n« Réveillez-vous, âmes et cœurs, pour une Indonésie libre ! »"
INS_the_coup:0 "Le Coup de [GetMonth]"
INS_the_coup_desc:0 "Il est temps d’asséner le coup fatal au système colonial qui nous enchaîne depuis bien trop longtemps. Âmes et corps indonésiens, levez-vous pour une Grande Indonésie !"
INS_reinforce_the_national_identity:0 "Renforcer l’Identité Nationale"
INS_reinforce_the_national_identity_desc:0 "Notre nationalisme indonésien ne se fonde pas sur une appartenance ethnique ou religieuse particulière : il naît de l’amour de notre peuple, quelle que soit son origine. Qu’il soit enseigné à nos compatriotes afin de cimenter notre identité commune."
INS_implement_a_democratic_system:0 "Mettre en Place un Système Démocratique"
INS_implement_a_democratic_system_desc:0 "Notre gouvernement découle de la vie du peuple ordinaire et existe en fin de compte pour le servir. Que nos divergences soient discutées afin d’atteindre un consensus commun."
INS_establish_true_equality:0 "Établir la Véritable Égalité"
INS_establish_true_equality_desc:0 "Sous le joug hollandais, il y avait des inégalités de richesse, de statut et d’ethnie. Rien de tout cela n’a sa place dans notre nation révolutionnaire. Balayons-les toutes."
INS_join_the_comintern:0 "Rejoindre le Komintern"
INS_join_the_comintern_desc:0 "Le [SOV.GetName] nous a aidés à obtenir notre indépendance vis-à-vis des Néerlandais. Nous devons montrer notre gratitude en rejoignant le [SOV.GetFactionName], et ainsi propager ensemble la révolution prolétarienne !"

INS_popular_front:0 "Front Populaire"
INS_popular_front_desc:0 "Notre mouvement national rassemble de nombreuses organisations, toutes guidées par le même objectif : l’indépendance et l’autodétermination souveraine !"
INS_emergency_powers:0 "Pouvoirs d’Exception"
INS_emergency_powers_desc:0 "Notre gouvernement est en guerre, et nous assurerons la victoire par tous les moyens nécessaires."
INS_equal_under_god_idea:0 "Égaux devant Dieu"
INS_equal_under_god_idea_desc:0 "Comme l’énonce l’Écriture, tous les hommes naissent égaux, même s’ils ne sont pas identiques. Ainsi, notre nation indonésienne, malgré nos différences religieuses, croit en un être suprême unique. Assez de l’exploitation de l’homme par l’homme !"
INS_unified_right:0 "Droite Unifiée"
INS_unified_right_desc:0 "Nos mouvements nationalistes autrefois divisés sont désormais réunis sous la bannière du Partai Indonesia Raya. Unis, nous sommes forts ; divisés, nous sommes faibles !"
INS_indonesian_national_identity:0 "Identité Nationale Indonésienne"
INS_jewel_of_the_pacific_idea:0 "Joyau du Pacifique"
INS_jewel_of_the_pacific_idea_desc:0 "Si [RAJ.GetNameDef] est le joyau de l’Empire britannique, alors les Indes orientales sont le nôtre. Nos richesses et nos ressources sont le dernier vestige significatif de l’empire maritime néerlandais, et nous devons tout faire pour les protéger."
INS_sharia_idea:0 "Charia"
INS_sharia_idea_desc:0 "Notre nation est sans conteste religieuse, et les quatre-cinquièmes d’entre nous se soumettent à Allah. Nous devons garantir la continuité de la liberté de culte, tout en imposant à nos coreligionnaires musulmans l’application de la loi islamique."

