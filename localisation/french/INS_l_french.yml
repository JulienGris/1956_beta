INS_ptdi_desc:0 "Créé de toutes pièces en 1946 à Madioen, Java oriental."
INS_sstw:0 "Staatspoor en Tramwegen"
INS_sstw_desc:0 "Fondé en 1875 à Bandoeng, le Service des chemins de fer et tramways d’État est l’équivalent public de la Compagnie des chemins de fer des Indes néerlandaises."
INS_dkari:0 "Djawatan Kereta Api Repoeblik Indonesia"
INS_dkari_desc:0 "Créé durant la Révolution nationale, actifs acquis par la nationalisation du SSTW et de la NISM."
INS_daf:0 "Doorne's Aanhangwagen Fabriek - Division des Indes orientales"
INS_gm_java:0 "General Motors - Compagnie de Java"
INS_gm_java_desc:0 "Fondée en 1927 à Tandjoeng Priok, la première usine de camions a ouvert en 1938."
