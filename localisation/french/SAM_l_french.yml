 SAM_aftermath_of_the_goodwill_mission:0 "Suite de la mission de bonne volonté"
 SAM_aftermath_of_the_goodwill_mission_desc:0 "Après des négociations fructueuses avec le gouvernement [NZL.GetAdjective], nous avons obtenu un haut degré d’autonomie. Où allons-nous à partir d’ici ?"
 SAM_with_the_crown:0 "Loyauté envers l’Empire"
 SAM_with_the_crown_desc:0 "La place des Samoa est dans l’Empire. Nous ne serions pas mieux lotis en tant que nation libre, et d’autres puissances pourraient nous voir comme une proie facile à conquérir."
