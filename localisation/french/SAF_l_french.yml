#idées
 SAF_joint_air_training_scheme:0 "Programme conjoint d’entraînement aérien"
 SAF_joint_air_training_scheme_desc:0 "Les nations du Commonwealth mettent en commun leurs ressources et leur expérience pour faciliter et accélérer la formation des pilotes et des équipages."

 SAF_voortrekker_monument:0 "Monument des Voortrekkers"
 SAF_voortrekker_monument_desc:0 "Un monument dédié aux Voortrekkers qui entreprirent le Grand Trek renforcera l’esprit national et l’unité en ces temps troublés."

#priorités
 SAF_railway_development:0 "Développement ferroviaire"
 SAF_railway_development_desc:1 "Le premier réseau ferroviaire sud-africain fut construit en 1859, reliant Durban à Harbour Point. Nous devons désormais moderniser ce réseau et le connecter au reste de la nation pour accroître la productivité. Posons dès maintenant les fondations de ce projet."
 SAF_mining_development:0 "Boom minier"
 SAF_mining_development_desc:1 "Les terres de notre nation regorgent de ressources. Toutefois, elles ne servent à rien tant qu’elles restent sous terre. Nous devons moderniser nos techniques et notre industrie minières afin d’exploiter les richesses cachées dans notre sol."
 SAF_develop_gold_extraction:0 "Développer l’extraction d’or"
 SAF_develop_gold_extraction_desc:1 "Johannesburg est surnommée la « ville de l’or » — et ce n’est pas sans raison. Les vastes gisements ont longtemps soutenu notre économie. Nous devons maintenant exploiter ces réserves et augmenter nos exportations pour la renforcer."
 SAF_amcor_thabazimbi_iron_mine:0 "Mine de fer Amcor à Thabazimbi"
 SAF_amcor_thabazimbi_iron_mine_desc:0 "Amcor, entreprise anglo-américaine, a ouvert une mine de fer à Thabazimbi, produisant du minerai chez nous. Nous devons étendre ces mines afin d’accroître nos réserves d’acier, pour l’export comme pour les armées."
 SAF_amcor_plate_mill:0 "Laminoir Amcor"
 SAF_amcor_plate_mill_desc:0 "Maintenant que nous disposons d’une source régulière de minerai de fer, nous pouvons construire des laminoirs afin d’assurer la production continue d’un acier [Root.GetAdjective] de haute qualité !"
 SAF_transvaal_urbanization:0 "Urbanisation du Transvaal"
 SAF_transvaal_urbanization_desc:1 "Le Transvaal est situé près de la rivière Vaal, un emplacement idéal pour l’urbanisation. Engageons-nous dès maintenant et urbanisons le Transvaal afin d’y poursuivre l’industrialisation."
 SAF_economic_expansion:0 "Expansion économique"
 SAF_economic_expansion_desc:1 "L’économie sud-africaine n’est pas florissante. Depuis la formation de l’Union, elle s’est délabrée. Il est temps de rassembler les morceaux pour en faire un beau vase — une meilleure économie."
 SAF_expand_iscor_pretoria_works:0 "Étendre l’usine Iscor de Pretoria"
 SAF_expand_iscor_pretoria_works_desc:1 "La première usine ouverte à Pretoria par Iscor visait surtout à fournir de l’emploi, et la production d’acier a démarré en 1934. Il est temps de transformer cette aciérie, d’un outil d’emploi, en véritable site d’extraction et de production utile à l’État."
 SAF_magazine_hill_ammunition_plant:0 "Usine de munitions de Magazine Hill"
 SAF_magazine_hill_ammunition_plant_desc:1 "Magazine Hill demeure un lieu idéal pour implanter une usine de munitions. Sa proximité avec la rivière Vaal, ainsi que nos récents projets de développement dans la région, favoriseront sa prospérité."
 SAF_industrial_innovations:0 "Innovations industrielles"
 SAF_industrial_innovations_desc:1 "Pour disposer d’une industrie vaste et dynamique, nous devons rester à jour des avancées récentes en science et technologie. Pour cela, élaborons nos propres innovations et augmentons les financements destinés à nos scientifiques."
 SAF_sasol_synthetic_fuel_researches:0 "Projets carburants de Sasolburg"
 SAF_sasol_synthetic_fuel_researches_desc:1 "Le carburant et l’huile synthétique sont vitaux à la survie de toute nation. Il est essentiel d’exploiter les gisements autour de Sasolburg pour la production d’huile synthétique."
 SAF_local_manufacturing_industry:0 "Industrie manufacturière locale"
 SAF_local_manufacturing_industry_desc:1 "Les industries locales sont cruciales : elles reflètent la culture du pays, fournissent de l’emploi et stimulent le développement dans les zones rurales. Encourageons-les pour améliorer l’économie rurale."
 SAF_expand_around_magazine_hill:0 "Étendre la zone de Magazine Hill"
 SAF_expand_around_magazine_hill_desc:1 "Magazine Hill a été fortement militarisé ces dernières années. Poursuivons cet effort et développons davantage l’usine de munitions de Magazine Hill en l’étendant vers l’extérieur."
 SAF_atomic_energy_board:0 "Office de l’énergie atomique"
 SAF_atomic_energy_board_desc:1 "Avec la récente découverte de la fission nucléaire à Berlin, il est important d’apprendre, nous aussi, à maîtriser cette énergie. Ce pas pourrait non seulement doper l’économie, mais aussi nous permettre de développer quelques armes secrètes…"
 SAF_war_technologies:0 "Technologies de guerre"
 SAF_war_technologies_desc:1 "Compte tenu des progrès du conflit et de nos investissements élevés dans l’industrie, il devient évident que nous devons mettre au point nos propres tactiques et technologies si nous voulons survivre."
 SAF_uranium_mining:0 "Extraction d’uranium"
 SAF_uranium_mining_desc:0 "Les échantillons de nos prospections géologiques révèlent que certaines zones de notre territoire contiennent du minerai d’uranium. Assurer l’approvisionnement en ce minerai stratégique sera vital pour notre autonomie."

 SAF_air_expansion_plan:0 "Plan d’expansion aérienne"
 SAF_air_expansion_plan_desc:0 "Dans le monde moderne, le soutien aérien est la clé de la victoire. Or notre force aérienne peut se résumer en un mot : « inefficace ». Pour survivre, nous devons la moderniser et la reconstruire."
 SAF_patrol_the_sea:0 "Patrouiller les mers"
 SAF_patrol_the_sea_desc:1 "Notre nation relie deux océans, l’océan Indien et l’Atlantique. Il est nécessaire de patrouiller afin d’assurer à nos alliés un commerce sûr et de tenir nos ennemis à distance !"
 SAF_mobilize_the_bernard_institute:0 "Mobiliser l’Institut Bernard Price"
 SAF_mobilize_the_bernard_institute_desc:1 "L’Institut Bernard Price de recherche géophysique est l’une des plus anciennes et prestigieuses institutions d’Afrique du Sud. Au vu de l’actualité, nous devons veiller à ce qu’il contribue pleinement à nos efforts."
 SAF_appoint_new_commander:0 "Nommer un nouveau commandant"
 SAF_appoint_new_commander_desc:1 "En bataille, les commandants décident de tout. Or nos chefs actuels sont des défaitistes incompétents. Nous devons nommer de nouveaux commandants suprêmes pour diriger efficacement nos armées !"
 SAF_aircraft_modernization:0 "Modernisation des avions"
 SAF_aircraft_modernization_desc:1 "Envoyez 5 Airco DH.2 contre un Bf 109, et vous obtenez 5 pertes alliées de plus. Voilà l’importance de la modernisation aérienne. Pour rivaliser dans le ciel, modernisons notre aviation et balayons l’ennemi des airs !"
 SAF_replace_imperial_airways:0 "Remplacer Imperial Airways"
 SAF_replace_imperial_airways_desc:1 "Imperial Airways visait à relier les possessions d’outre-mer britanniques. Pour le dire gentiment… « inefficace », avec des accidents fréquents. Remplaçons sans tarder cette compagnie embarrassante et forgerons la nôtre, efficace."
 SAF_seize_south_african_airways_aircrafts:0 "Réquisitionner les avions de South African Airways"
 SAF_seize_south_african_airways_aircrafts_desc:1 "South African Airways est synonyme d’efficacité… mais nombre de ses appareils proviennent de l’ennemi, l’Allemagne. Réquisitionnons immédiatement ces avions et reconfigurons-les pour servir dans l’aviation impériale sud-africaine."
 SAF_formalize_air_doctrine:0 "Formaliser la doctrine aérienne"
 SAF_formalize_air_doctrine_desc:1 "L’heure est venue pour les pilotes sud-africains de montrer leur talent. Mais… comment les avons-nous formés ? Il est indispensable de formaliser une doctrine aérienne afin qu’ils performent de façon optimale."
 SAF_air_training_scheme:0 "Programme d’entraînement aérien"
 SAF_air_training_scheme_desc:1 "Les Britanniques sont nos amis. Formons nos pilotes en coopération avec les leurs pour que, le moment venu, nous ayons l’avantage dans les airs."
 SAF_national_air_training:0 "Formation aérienne nationale"
 SAF_national_air_training_desc:1 "Les Britanniques nous ont trahis. Il est temps de créer un programme national d’entraînement des pilotes pour les préparer au pire…"
 SAF_the_prides_of_the_nation:0 "Les braves pilotes d’Afrique du Sud"
 SAF_the_prides_of_the_nation_desc:1 "Nos pilotes ont fait preuve de bravoure partout — en Europe, en Afrique, en Asie. Certains se sont illustrés de façon exceptionnelle : promouvons-les au rang d’as. Ils aideront la nation dans le ciel et galvaniseront nos autres aviateurs."

 SAF_organize_district_commands:0 "Organiser les commandements de district"
 SAF_organize_district_commands_desc:0 "L’armée [Root.GetAdjective] est dans un état pitoyable, inapte aux rigueurs d’une guerre moderne. Sa réorganisation peut être menée en redésignant les unités disponibles pour qu’elles soient regroupées sous des commandements de district, avec leurs éléments de soutien correspondants."
 SAF_mission_to_europe:0 "Mission en Europe"
 SAF_mission_to_europe_desc:0 "Nos dirigeants militaires actuels manquent cruellement de nouvelles idées et méthodes pour mener les batailles à leur terme. Nous devrions organiser une mission militaire dans plusieurs pays alliés d’Europe, afin de les exposer aux tactiques et idées modernes utilisées par ces armées."
 SAF_prepare_for_bush_warfare:0 "Se préparer à la guerre de brousse"
 SAF_prepare_for_bush_warfare_desc:0 "L’étude du terrain de notre pays montre que l’infanterie, avec son arme de confiance, est le moyen le plus rentable de défendre la nation. Nous devons moderniser notre infanterie."
 SAF_jungle_specialization:0 "Spécialisation jungle"
 SAF_jungle_specialization_desc:0 "Les jungles d’Afrique du Sud comptent parmi les terrains les plus éprouvants, où toute armée subira de lourdes pertes. Nous formerons notre armée à combattre dans la jungle là où les autres échoueront."
 SAF_desert_specialization:0 "Spécialisation désert"
 SAF_desert_specialization_desc:0 "Les déserts de l’Afrique du Sud-Ouest sont parfaits pour entraîner nos troupes au combat en milieu désertique. Nous formerons des unités spécialisées et préparerons les soldats ordinaires à endurer la chaleur écrasante."
 SAF_reform_staff_officers_training:0 "Réformer la formation des officiers d’état-major"
 SAF_elite_training:0 "Entraînement d’élite"
 SAF_elite_training_desc:0 "L’armée [Root.GetName] bénéficiera de la formation d’unités spécialisées capables de mener des assauts et de percer dans des terrains difficiles. Un vaste programme de formation sera mis en place pour répondre à ces besoins."
 SAF_military_innovations:0 "Innovations militaires"
 SAF_military_innovations_desc:0 "L’expansion de notre armée a montré que le courage seul ne suffit plus pour une guerre moderne. Nous devons équiper nos soldats des armes les plus récentes, capables d’anéantir l’ennemi."
 SAF_reorganize_the_artillery:0 "Réorganiser l’artillerie"
 SAF_reorganize_the_artillery_desc:0 "En 1934, le contrôle de toute l’artillerie [Root.GetName] a été unifié sous le corps d’artillerie [Root.GetAdjective]. Grâce à notre production nationale d’armes, nous moderniserons l’équipement de ce service."
 SAF_modernize_infantry_equipment:0 "Moderniser l’équipement d’infanterie"
 SAF_modernize_infantry_equipment_desc:0 "Le fantassin [ROOT.GetAdjective] combattra dans une grande variété de terrains. Nous devons lui fournir un paquetage moderne pour garantir son succès au combat."
 SAF_prioritize_q_service_corps:0 "Prioriser le Q Service Corps"
 SAF_prioritize_q_service_corps_desc:0 "Le Q Service Corps gère l’aspect le plus important de l’armée : la logistique. Nous ne pouvons nous permettre de négliger ce volet des forces armées."
 SAF_prioritize_t_service_corps:0 "Prioriser le T Service Corps"
 SAF_prioritize_t_service_corps_desc:0 "Le service technique est responsable de l’entretien sur le terrain des véhicules de l’armée et de la construction de fortifications. Nous devons renforcer ses capacités sans délai."
 SAF_locally_built_armored_cars:0 "Véhicules blindés locaux"
 SAF_locally_built_armored_cars_desc:0 "L’ère de la cavalerie montée touche à sa fin avec l’introduction des véhicules blindés. Ces engins sur roues nous transporteront au combat avec une protection appréciable contre le feu ennemi."
 SAF_local_tank_program:0 "Programme national de chars"
 SAF_local_tank_program_desc:0 "Les chars sont désormais au premier plan des guerres. Nous ne devons pas permettre à notre armée d’aller au combat avec des versions obsolètes. Nous lancerons un programme de modernisation des chars pour nos troupes et nos alliés."
 SAF_SAR_and_H_brigade:0 "Brigade SAR & H"
 SAF_SAR_and_H_brigade_desc:0 "La sécurité de nos chemins de fer et de nos ports est assurée par les braves hommes de cette brigade. Il est temps d’élargir leurs capacités pour mieux répondre à nos besoins."

 #le « General Botha » est un ancien navire de guerre converti en navire-école, embryon de la défense maritime.
 SAF_cadets_of_the_general_botha:0 "Cadets du « General Botha »"
 SAF_cadets_of_the_general_botha_desc:0 "Il y a dix ans, un riche philanthrope nommé Thomas Benjamin Frederick Davis nous a fait don d’un navire, destiné à former les futures générations de cadets de marine. Nous allons désormais le rappeler pour préparer nos cadets à la guerre en mer."
 SAF_establish_seaward_defense_force:0 "Établir la Seaward Defense Force"
 SAF_establish_seaward_defense_force_desc:0 "La Seaward Defense Force est la première ligne de défense contre les agresseurs en mer. Nous devons développer ses capacités."
 SAF_torpedo_development:0 "Développement des torpilles"
 SAF_torpedo_development_desc:0 "La torpille, avec son compagnon le sous-marin, représente une grave menace pour toute flotte ennemie. Renforcer cette arme sous-marine inspirera la crainte à toute nation voulant nous nuire."
 SAF_anti_submarine_equipment:0 "Équipement anti-sous-marin"
 SAF_anti_submarine_equipment_desc:0 "La perspective qu’un ennemi bloque nos routes commerciales maritimes nous est insupportable. Nous devons moderniser notre marine et adapter nos moyens existants pour contrer cette menace."
 SAF_expand_cape_town_yards:0 "Agrandir les chantiers du Cap"
 SAF_expand_cape_town_yards_desc:0 "Nos navires ont besoin de chantiers pour accélérer réparations et entretien. Construire de nouveaux chantiers au Cap répondra parfaitement à nos besoins."
 SAF_expand_durban_yards:0 "Agrandir les chantiers de Durban"
 SAF_expand_durban_yards_desc:0 "La ville côtière de Durban est un site idéal pour des chantiers navals, et garantira un flux constant de main-d’œuvre pour répondre aux besoins de notre marine."
 SAF_a_true_navy:0 "Une véritable marine"
 SAF_a_true_navy_desc:0 "L’Afrique du Sud dispose désormais d’un nombre important de chantiers navals et de l’expertise nécessaire pour constituer une flotte digne de ce nom. Prenons la mer !"
 SAF_naval_ambition:0 "Ambition navale"
 SAF_naval_ambition_desc:0 "Bien que nous n’ayons jamais eu une grande marine, il n’est pas trop tard. La construction de puissants navires de guerre inspirera la crainte à nos ennemis."
 SAF_salisbury_island_base:0 "Base de Salisbury Island"
 SAF_salisbury_island_base_desc:0 "Notre marine a besoin d’une base d’opérations. Salisbury Island sera notre Scapa Flow, garantissant la sécurité des mers autour de nous."
 SAF_naval_aviation:0 "Aviation navale"
 SAF_naval_aviation_desc:0 "L’ère des gros canons navals est révolue. Voici l’aube de l’ère des porte-avions et de leurs aéronefs, qui domineront les mers et les cieux."

