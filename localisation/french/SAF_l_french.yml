 SAF_lenz_bomb_factory:0 "Usine de bombes de Lenz"
 SAF_lenz_bomb_factory_desc:1 "Lenz se trouve dans la zone très industrialisée de Johannesburg. Les ressources localement disponibles à Lenz peuvent servir à fabriquer des explosifs et des bombes ; nous devons donc exploiter ces ressources sans tarder et y ouvrir une nouvelle « usine de bombes »."
