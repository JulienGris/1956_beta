 SAF_support_kenya:0 "Soutenir le Kenya"
 SAF_support_mozambique:0 "Soutenir le Mozambique"
 SAF_support_zimbabwe:0 "Soutenir le Zimbabwe"
 SAF_give_smuts_field_command:0 "Donner un commandement militaire à Jan Smuts"

#Infobulles
 SAF_republicanism:0 "Républicanisme sud-africain"
 SAF_hertzog_in_power:0 "Hertzog au pouvoir"
 SAF_smuts_in_power:0 "Smuts au pouvoir"

 ###POLITIQUE###
 SAF_ethnic_legislation:0 "Législation ethnique"
 SAF_ethnic_legislation_desc:0 "Nous devons nous employer à définir les droits de nos citoyens, ce qui nous permettra d’adopter d’autres lois et règlements à l’avenir, aux conséquences de grande portée."
 SAF_sensibilize_the_africans:0 "Sensibiliser les Africains"
 SAF_sensibilize_the_africans_desc:0 "Les peuples d’Afrique doivent connaître leurs droits et entamer la lutte pour une gouvernance majoritaire dans leur propre pays."
 SAF_organize_the_party:0 "Organiser notre parti"
 SAF_organize_the_party_desc:0 "Nous devons regrouper les personnes partageant nos idées, prêtes à participer à notre lutte pour l’égalité des droits pour tous dans ce pays. Un Afrikaner, fils d’un président de cour, a proposé ses services à l’administration à cette fin."
 SAF_rally_the_indians:0 "Rallier la communauté indienne"
 SAF_rally_the_indians_desc:0 "Les Indiens sont nos compatriotes dans ce combat. Nous ne ménagerons aucun effort pour obtenir leur soutien lors des futures batailles."
 SAF_paralyze_the_country:0 "Révolution indigène"
 SAF_paralyze_the_country_desc:0 "L’heure est venue. Nous nous battrons pour tous les peuples, de toutes les races, sur cette terre !"
 SAF_liberation_revolution:0 "Révolution unifiée"
 SAF_liberation_revolution_desc:0 "À présent que nous avons libéré notre pays des capitalistes oppresseurs, nous devons réunir les travailleurs en un seul peuple, autour d’un but commun !"
 SAF_alliance_with_ussr:0 "Alliance avec l’Union"
 SAF_alliance_with_ussr_desc:0 "La patrie du communisme restera notre allié le plus sûr dans ce monde cruel !"
 SAF_side_by_side_as_equals:0 "Vivre en égaux"
 SAF_side_by_side_as_equals_desc:0 "Quelle que soit la race ou la croyance, nous vivons tous sur la même terre, avec les mêmes besoins. Nous éduquerons les travailleurs de cette nation à cette réalité."
 SAF_black_republic:0 "La République noire"
 SAF_black_republic_desc:0 "Le rêve d’un pays à nous, pour notre peuple, s’est enfin réalisé. Nous annoncerons au monde la formation de notre nouvelle nation."
 SAF_redistribute_the_land:0 "Réorganiser la gestion des terres"
 SAF_redistribute_the_land_desc:0 "Les terres ne seront plus réservées à quelques privilégiés. Elles reviendront à ceux qui les travaillent, sous notre regard vigilant."
 SAF_control_former_exploiters:0 "Contrôler les anciens exploiteurs"
 SAF_control_former_exploiters_desc:0 "La redistribution des machines et des installations détenues par nos anciens maîtres sur nos terres va commencer ; le contrôle de ces entreprises est désormais entre nos mains."
 SAF_support_african_seperatists:0 "Soutenir les séparatistes coloniaux"
 SAF_support_african_seperatists_desc:0 "Nous entreprendrons la libération de nos frères soumis à d’autres oppresseurs coloniaux sur ce continent !"
 SAF_policy_of_cooperation:0 "Politique de coopération"
 SAF_policy_of_cooperation_desc:0 "[ROOT.GetName] devra veiller à maintenir des relations fortes et amicales avec la Mère patrie."
 SAF_research_cooperation:0 "Coopération de recherche du Commonwealth"
 SAF_research_cooperation_desc:0 "L’Afrique du Sud ne doit pas prendre de retard dans ses efforts scientifiques. Nous lancerons une coordination de la recherche avec les pays du Commonwealth."
 SAF_commonwealth_industrial_cooperation:0 "Aide industrielle du Commonwealth"
 SAF_commonwealth_industrial_cooperation_desc:0 "Le [ROOT.GetName] lancera un programme de modernisation industrielle avec l’aide de la Grande-Bretagne."
 SAF_finance_legislation:0 "Législation financière"
 SAF_finance_legislation_desc:0 "La croissance de nos villes et de nos colonies doit se poursuivre grâce au financement de nouvelles infrastructures et usines pour l’alimenter."
 SAF_guard_the_cape:0 "Garder le Cap"
 SAF_guard_the_cape_desc:0 "Le cap de Bonne-Espérance est situé sur une artère du commerce maritime. Nous devons fortifier ces côtes afin que nul n’entrave nos entreprises."
 SAF_remobilize_the_cape_corps:0 "Remobiliser le Cape Corps"
 SAF_remobilize_the_cape_corps_desc:0 "Défenseur indéfectible à travers les âges, le Cape Corps a décliné ces derniers temps. Nous devons inverser la tendance et engager une expansion rapide de nos forces afin d’écraser toute menace future avant qu’elle n’émerge."
 SAF_crush_ossewabrandwag:0 "Éliminer l’Ossewabrandwag"
 SAF_crush_ossewabrandwag_desc:0 "La présence de l’Ossewabrandwag est un mouvement de cinquième colonne intolérable sur nos terres. Nous éradiquerons son influence partout où nous la trouverons."
 SAF_the_aliens_act:0 "Adopter l’Aliens Act"
 SAF_the_aliens_act_desc:0 "L’immigration d’étrangers vers le [ROOT.GetName] constitue un risque pour la sécurité nationale que nous devons strictement limiter pour l’instant."
 SAF_expand_the_union:0 "Étendre l’Union"
 SAF_expand_the_union_desc:0 "Nos liens renforcés avec [ENG.GetName] et l’expansion de nos défenses nous donnent la capacité réelle de défendre nos intérêts communs sur le continent. Nous pousserons à l’unification de plusieurs territoires sous notre contrôle, pour une administration bien plus efficace."
 SAF_push_the_unp_towards_independence:0 "Pousser l’UNP vers l’indépendance"
 SAF_push_the_unp_towards_independence_desc:0 "Le United Party est notre meilleure chance d’obtenir l’indépendance vis-à-vis de la Mère patrie. Nous devons mettre en place les étapes appropriées."
 SAF_radicalize_the_afrikaner_broederbond:0 "Radicaliser le Parti national"
 SAF_radicalize_the_afrikaner_broederbond_desc:0 "Le Parti national sera notre prochain levier pour assurer notre domination sur ce pays."
 SAF_celebrate_the_voortrekkers:0 "Célébrer les Voortrekkers"
 SAF_celebrate_the_voortrekkers_desc:0 "Les fondateurs de cette nation furent les premiers à se soustraire au joug colonial. Nos combats futurs refléteront leur courage à rompre avec nos maîtres."
 SAF_form_the_ossewabrandwag:0 "Former l’Ossewabrandwag"
 SAF_form_the_ossewabrandwag_desc:0 "Tous ne soutiennent pas la domination britannique sur l’Afrique du Sud. Un patchwork de groupes commence à résister à des maîtres lointains. L’Ossewabrandwag unira ces gens sous une cause commune !"
 SAF_solidify_german_contacts:0 "Rassembler la communauté afrikaner radicale"
 SAF_solidify_german_contacts_desc:0 "Notre voie ne s’accorde plus avec le libéralisme ni le capitalisme. Nous rassemblerons des personnes partageant nos vues, prêtes à acheter notre indépendance par l’action directe."
 SAF_return_to_republicanism:0 "Retour au républicanisme"
 SAF_return_to_republicanism_desc:0 "Un pays ne se fait pas par décret, mais par l’accord tacite de son peuple. Le [ROOT.GetName] renouera avec ses racines en ramenant l’idée d’État d’un monarque lointain à un pouvoir bien plus proche : son peuple, sur nos propres terres."
 SAF_stormjaers_militias:0 "Professionnaliser les Stormjaers"
 SAF_stormjaers_militias_desc:0 "Nos Stormjaers ont besoin d’une bénédiction officielle de l’administration s’ils doivent défendre nos intérêts à l’intérieur de nos frontières. Leur professionnalisation donnera l’élan à une branche plus élitiste de nos forces."
 SAF_sharpshooting_tradition:0 "Traditions de tir d’élite"
 SAF_sharpshooting_tradition_desc:0 "Nos forces armées tirent leurs traditions d’anciens colonisateurs qui menaient des guerres victorieuses grâce au tir à longue distance et à la mobilité. Suivons leurs traces si nous voulons prospérer."
 SAF_get_rid_of_the_british:0 "Se débarrasser des Britanniques"
 SAF_get_rid_of_the_british_desc:0 "Nous ne tolérerons plus l’influence des Îles. Nous les écraserons afin de la faire cesser une bonne fois pour toutes !"
 SAF_contact_rhodesian_afrikaners:0 "Direction afrikaner en Rhodésie"
 SAF_contact_rhodesian_afrikaners_desc:0 "Le moment est venu de prendre en main d’anciennes colonies de notre ancien suzerain. L’intégration des terres et des peuples se fera sous notre direction incontestée sur le continent !"
 SAF_axis_alliance:0 "Consolider les contacts allemands"
 SAF_axis_alliance_desc:0 "Le gouvernement allemand a récemment multiplié les gestes pour entretenir de bonnes relations avec nous. Nos destins sont liés : voyons désormais notre heure au soleil !"
 SAF_build_a_new_state:0 "Reconstruire le gouvernement"
 SAF_build_a_new_state_desc:0 "Notre voie ne passe plus par Westminster. Nous organiserons un référendum pour sortir de l’influence britannique dans notre administration."
 SAF_separation_policy:0 "Politiques de séparation"
 SAF_separation_policy_desc:0 "Nos peuples portent encore les cicatrices de l’apartheid."
 SAF_relax_racial_laws:0 "Assouplir les politiques raciales"
 SAF_relax_racial_laws_desc:0 "La force d’une république vient de ses peuples. Nous ne pouvons plus tolérer la répression basée sur des lignes imaginaires tracées par une poignée de privilégiés."
 SAF_relax_racial_laws_tt:0 "Déverrouille de nombreux conseillers politiques, généraux et amiraux noirs."
 SAF_laager_doctrine:0 "Doctrine du laager"
 SAF_laager_doctrine_desc:0 "Nos peuples sont désormais unis sous un même drapeau, et non plus sous l’autorité d’un seigneur venu d’outre-mer !"

 NMB_graveyard_coast:0 "Côte des cimetières"
 NMB_graveyard_coast_desc:0 "Cette côte est semée d’obstacles naturels et de terrains hostiles qui rendent extrêmement difficiles la construction de ports et la logistique."

 SAF_event.1.t:0 "Le gouvernement conservateur tombe !"
 SAF_event.1.desc:0 "Avec le vote du parlement en faveur de l’entrée en guerre aux côtés de la Grande-Bretagne, la politique de neutralité du gouvernement conservateur a été totalement discréditée. Le libéral Jan Smuts, favorable à la déclaration de guerre, a été chargé de former un nouveau gouvernement. Pour établir une armée, il a été placé à la tête de l’ensemble des forces armées sud-africaines."
 SAF_event.1.a:0 "L’Empire sera défendu !"

 SAF_event.2.t:0 "Organiser le parti"
 SAF_event.2.d:0 "Notre parti communiste est très fragile, et pour réussir à prendre le pouvoir nous devons d’abord l’organiser."
 SAF_event.2.a:0 "Thabo Edwin Mofutsanyana dirigera notre parti."
 SAF_event.2.b:0 "Moses Kotane dirigera notre parti."

 SAF_event.3.t:0 "Renverser le gouvernement colonial"
 SAF_event.3.d:0 "Nous avons renversé le précédent gouvernement colonial et coupé TOUT lien avec la Grande-Bretagne ; nous devons maintenant établir notre propre république !"
 SAF_event.3.a:0 "Parfait."

 SAF_event.4.t:0 "Coup d’État afrikaner"
 SAF_event.4.d:0 "Les Afrikaners avaient peu à peu été relégués, mais à présent que nous avons rassemblé des organisations comme l’Afrikaner Broederbond et l’Ossewabrandwag, nous pouvons renverser le gouvernement et rétablir la république afrikaner que les Britanniques ont fait tomber !"
 SAF_event.4.a:0 "Ils ne nous vaincront pas !"

 SAF_event.5.t:0 "Référendum sur l’indépendance"
 SAF_event.5.d:0 "Si, en matière de gestion étatique, nous sommes devenus indépendants, la question de nos relations avec le Royaume-Uni demeure. Nous pourrions devenir un allié d’égal à égal ; cependant, si nous choisissons cette voie, notre Premier ministre Hertzog démissionnera, ainsi que Jan Smuts, commandant et homme politique pro-britannique."
 SAF_event.5.a:0 "Nous avons encore besoin des Britanniques."
 SAF_event.5.b:0 "Nous n’avons pas besoin d’eux."

 SAF_event.6.t:0 "Jan Smuts prend sa retraite"
 SAF_event.6.desc:0 "Sous la pression du gouvernement, en raison de son alignement idéologique évident, Jan Smuts a été contraint de démissionner de son poste et de quitter le pays."
 SAF_event.6.a:0 "Il ne nous manquera pas."

 SAF_event.7.t:0 "Une offre venue de loin"
 SAF_event.7.desc:0 "Robey Leibbrandt, un militant afrikaner affirmant représenter une organisation appelée Ossewabrandwag, nous a contactés. Il souhaite revenir dans sa patrie et libérer son pays de l’oppression étrangère. Il espère que nous soutiendrons la lutte du peuple afrikaner pour la terre et la liberté. Il souhaite rejoindre nos services de renseignement et rentrer chez lui pour poursuivre son combat."
 SAF_event.7.a:0 "Organiser un rendez-vous avec un officier de liaison."
 SAF_event.7.b:0 "Refuser poliment."

 unite_tanganyika_zanzibar:0 "Unifier [TZN.GetNonIdeologyName] et [ZAN.GetNonIdeologyName]"
