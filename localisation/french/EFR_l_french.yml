 EFR_collaboration:0 "Collaboration Française"
 EFR_STO_idea:0 "Service du Travail Obligatoire"
 EFR_STO_idea_desc:0 "Le « Service du Travail Obligatoire » (S.T.O. en français) fut un moyen pour Vichy de placer un élément dans les négociations fondamentalement déséquilibrées avec les forces d’occupation. En envoyant des travailleurs en Allemagne, ils obtinrent la libération de centaines de milliers de prisonniers de guerre, mais durent envoyer plusieurs ouvriers pour chaque soldat libéré. Pour les Allemands, c’était une concession mineure qui leur permettait de remplir leurs usines et de poursuivre la production de guerre, alors que la conscription envoyait de plus en plus d’Allemands loin des usines."
 EFR_STO2_idea:0 "Service du Travail Obligatoire"
 EFR_STO2_idea_desc:0 "Le « Service du Travail Obligatoire » (S.T.O. en français) fut un moyen pour Vichy de placer un élément dans les négociations fondamentalement déséquilibrées avec les forces d’occupation. En envoyant des travailleurs en Allemagne, ils obtinrent la libération de centaines de milliers de prisonniers de guerre, mais durent envoyer plusieurs ouvriers pour chaque soldat libéré. Pour les Allemands, c’était une concession mineure qui leur permettait de remplir leurs usines et de poursuivre la production de guerre, alors que la conscription envoyait de plus en plus d’Allemands loin des usines."
 EFR_STO3_idea_desc:0 "Le « Service du Travail Obligatoire » (S.T.O. en français) fut un moyen pour Vichy de placer un élément dans les négociations fondamentalement déséquilibrées avec les forces d’occupation. En envoyant des travailleurs en Allemagne, ils obtinrent la libération de centaines de milliers de prisonniers de guerre, mais durent envoyer plusieurs ouvriers pour chaque soldat libéré. Pour les Allemands, c’était une concession mineure qui leur permettait de remplir leurs usines et de poursuivre la production de guerre, alors que la conscription envoyait de plus en plus d’Allemands loin des usines."
