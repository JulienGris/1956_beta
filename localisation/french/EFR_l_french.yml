 idea_EFR_terms_of_compiegne_armistice:0 "Les Conditions de l’Armistice de Compiègne"
 idea_EFR_terms_of_compiegne_armistice_desc:0 "Les conditions de l’armistice ont permis notre survie et le début de la « révolution nationale ». Mais le coût économique de l’occupation, les indemnités versées à l’Allemagne, et la perte de tant de nos jeunes hommes est un fardeau presque insoutenable. C’est pourquoi nous avons besoin du héros de Verdun. Seule sa force de volonté peut nous guider à travers ces temps sombres."
 idea_EFR_shattered_economy:0 "Économie Dévastée"
 idea_EFR_shattered_economy_desc:0 "Le manque d’hommes, les réquisitions des forces d’occupation et la fermeture forcée de la plupart de nos arsenaux frappent à la fois notre économie civile et notre capacité à produire de nouveaux équipements."
 idea_EFR_shattered_economy2:0 "Économie Dévastée"
 idea_EFR_shattered_economy2_desc:0 "Le manque d’hommes, les réquisitions des forces d’occupation et la fermeture forcée de la plupart de nos arsenaux frappent à la fois notre économie civile et notre capacité à produire de nouveaux équipements."
 idea_EFR_hidden_rifles:0 "Armes Cachées"
 idea_EFR_hidden_rifles_desc:0 "Après notre reddition aux Allemands, certains éléments de l’armée ont réussi à mettre à l’abri des armes qui pourraient être mobilisées plus tard et augmenter rapidement la taille de notre armée au-delà de la limite des 100 000 hommes."

 EFR_aviation_effort:0 "Reconstruire l’Armée de l’Air"
 EFR_aviation_effort_desc:0 "Notre aviation a été écrasée par la défaite mais nous devons poursuivre nos efforts et la reconstruire pour assurer la protection de notre ciel."
 EFR_light_fighters_focus:0 "Chasseurs Légers"
 EFR_light_fighters_focus_desc:0 "Comme nous pouvons déployer nos avions près des zones où nous attendons intercepter l’ennemi, nous devrions nous concentrer sur l’agilité des avions monoplaces."
 EFR_heavy_fighters_focus:0 "Chasseurs Lourds"
 EFR_heavy_fighters_focus_desc:0 "La doctrine aérienne des années 1930 théorisait que les bombardiers pouvaient détruire entièrement un pays ennemi. Pour éviter cela, nous devons être capables d’intercepter tout bombardier menaçant notre ciel. Un chasseur lourd pourra porter un armement plus important, voler plus haut et abattre les appareils les plus massifs."
 EFR_bomber_focus:0 "Axe sur les Bombardiers"
 EFR_aviation_effort_2:0 "Tactiques Aériennes Avancées"
 EFR_bombing_awareness:0 "Conscience du Bombardement"
 EFR_bombing_awareness_desc:0 "Sans défenses anti-aériennes adéquates pour protéger notre « neutralité », nous deviendrons la proie sans défense des bombardiers ennemis."
 EFR_naval_effort:0 "Effort Naval"
 EFR_flexible_navy:0 "Marine Flexible"
 EFR_flexible_navy_desc:0 "Les doctrines et les tactiques ennemies évoluent constamment. C’est pourquoi nous devons adopter un système flexible, utilisant l’air et les profondeurs de la mer pour dissimuler nos forces plutôt que de simplement occuper la surface de l’océan."
 EFR_pride_of_the_nation:0 "Fierté de la Nation"
 EFR_pride_of_the_nation_desc:0 "La plupart de notre marine est neutralisée mais elle demeure la fierté de notre nation et si nous pouvions la moderniser, nous pourrions à nouveau contester la domination des mers."
 EFR_submarine_effort:0 "Effort Sous-Marin"
 EFR_submarine_effort_desc:0 "Invisible sous l’eau, la reconstruction de notre marine passera par la création d’une flotte de sous-marins."
 EFR_cruiser_effort:0 "Effort Croiseurs"
 EFR_cruiser_effort_desc:0 "Rien de mieux pour sillonner la Méditerranée qu’un croiseur moderne !"
 EFR_destroyer_effort:0 "Effort Contre-Torpilleurs"
 EFR_destroyer_effort_desc:0 "La menace des torpilles sous-marines doit être contrée par de nouveaux « contre-torpilleurs »."
 EFR_capital_ships_effort:0 "Navires Capitaux"
 EFR_capital_ships_effort_desc:0 "Les navires capitaux sont les joyaux et la terreur des mers et nous devons en construire de plus modernes."

 EFR_marechal_nous_voila:0 "Maréchal, Nous Voilà !"
 EFR_marechal_nous_voila_desc:0 "Maréchal, nous voilà ! Prêts à servir l’État Français et à commencer la révolution nationale qui régénérera l’âme de la France éternelle. Il nous a sauvés à Verdun et il nous protégera dans l’heure la plus sombre de notre pays."
 EFR_travail:0 "Travail"
 EFR_travail_desc:0 "Français, vous devez travailler pour reconstruire le pays ! Le travail manuel est une valeur essentielle de la révolution nationale car il est aussi éloigné que possible de la corruption de l’argent, cause première de notre défaite."
 EFR_recycling:0 "Recyclage"
 EFR_recycling_desc:0 "Saviez-vous que de vieux films peuvent être transformés en cirage ? Les bas sont inabordables ? Peignez vos jambes et personne n’y verra que du feu !\nSi vous avez du métal de récupération, apportez-le dans un point de collecte et échangez-le contre des tickets de rationnement, notre industrie en a besoin. Certains commerces locaux échangent aussi des métaux contre des produits alimentaires, par exemple 200 g de cuivre contre 1 l de vin."
 EFR_gazogenes_and_michelin_tires:0 "Gazogènes"
 EFR_gazogenes_and_michelin_tires_desc:0 "Alors que le pétrole se raréfie chaque jour, nous devons trouver des substituts. La plupart des civils se déplacent désormais à vélo, mais nos voitures peuvent aussi fonctionner avec des carburants de substitution. Les gazogènes permettent d’extraire l’énergie de la combustion du charbon et même du bois."
 EFR_STO:0 "Mettre en Place le S.T.O."
 EFR_STO_desc:0 "Le Service du Travail Obligatoire est un système d’échange où des travailleurs français sont envoyés en Allemagne, le Reich manquant de main-d’œuvre pour ses divisions et ses usines. Cela a permis la libération de dizaines de milliers de soldats, mais certains sont restés en Allemagne comme ouvriers libres."
 EFR_STO_2:0 "Envoyer Plus de Travailleurs en Allemagne"
 EFR_STO_2_desc:0 "Travailleur ! En travaillant pour l’Europe, tu protèges ton pays et ton foyer. Tu seras aussi l’ambassadeur de la qualité française et assureras la stabilité financière de ta famille."
 EFR_industrial_advisory_comitee:0 "Comité Consultatif Industriel"
 EFR_industrial_advisory_comitee_desc:0 "Les directeurs de toutes les grandes entreprises industrielles doivent être représentés dans une organisation commune afin de répartir efficacement les travaux de recherche. Leur fiabilité politique est garantie puisque la plupart soutenaient déjà des organisations d’extrême-droite telles que le complot de « la Cagoule »."
 EFR_famille:0 "Famille"
 EFR_famille_desc:0 "Le Maréchal Pétain pense chaque jour à toutes les familles de France avec un mari, un fils, un frère prisonnier en Allemagne. Il pense aux petits enfants et à leur avenir dans une Europe réconciliée.\nDe plus, il a institué la fête des mères pour permettre à chaque enfant de montrer combien il aime sa maman."
 EFR_divine_surprise:0 "La Divine Surprise"
 EFR_rationing:0 "Rationnement"
EFR_rationing_desc:0 "Afin d’économiser les maigres ressources dont nous disposons, un système de rationnement doit être instauré. La liste des produits restreints est longue et inclut l’huile d’olive, le pain, le beurre, la viande, le lait et les œufs. Les confiseries sont interdites et la presse doit publier des guides expliquant comment cuisiner toutes sortes de plats avec des produits de substitution, tels que la soupe de rutabaga, la salade de chardon râpé, ou encore le café sans café..."
 EFR_patrie_focus:0 "Patrie"
 EFR_patrie_focus_desc:0 "Nous devons reconstruire l’État afin de panser les blessures récentes. Premièrement, la hache des Francs, la francisque, deviendra l’emblème du nouveau régime. Deuxièmement, l’administration doit être purgée des ennemis de la révolution nationale. Enfin, les forces de police doivent prêter serment de loyauté au Maréchal Pétain. Vive Pétain, vive la France !"
 EFR_armistice_army:0 "Organiser l’Armée de l’Armistice"
 EFR_armistice_army_desc:0 "Même si nous sommes restreints dans ce que nous pouvons faire avec les vestiges de notre armée, nous devons néanmoins l’organiser correctement et réviser nos tactiques afin d’être prêts à combattre tout ennemi de la France."
 EFR_hide_military_equipment:0 "Cacher l’Armement"
 EFR_chantiers_de_la_jeunesse:0 "Chantiers de la Jeunesse"
 EFR_chantiers_de_la_jeunesse_desc:0 "Le service militaire ayant été aboli, la jeunesse doit servir à la place dans les « chantiers de la jeunesse ». Dans ces camps en plein air, ils réaliseront de petits travaux d’infrastructure, feront des marches en pleine nature et participeront à d’autres activités physiques."
 EFR_negociate_the_release_of_officers:0 "Négocier la Libération des Officiers"
 EFR_negociate_the_release_of_officers_desc:0 "Facilitée par notre attitude en faveur de la collaboration européenne, nous avons finalement obtenu une concession majeure du chancelier du Reich, Hitler : la libération de milliers d’officiers prisonniers en Allemagne."
 EFR_LVF:0 "Légion des Volontaires Français"
 EFR_secret_military_researches:0 "Recherches Militaires Secrètes"
 EFR_secret_military_researches_desc:0 "Bien que l’utilisation de certains équipements comme les chars soit interdite par l’armistice, nous pouvons continuer à expérimenter en secret, en utilisant ce que le reste de la société emploie dans d’autres domaines : les ersatz."
 EFR_bulldozer_experiments:0 "Expérimentations sur Bulldozers"
 EFR_bulldozer_experiments_desc:0 "Nous n’avons pas le droit de posséder de chars, mais nous pouvons acquérir des véhicules à chenilles en achetant de lourds engins de déneigement ou des bulldozers. Ceux-ci ne seront pas utilisés au combat mais fourniront les données techniques nécessaires pour les chars futurs."
 EFR_contact_renault:0 "Contacter Renault"
 EFR_contact_renault_desc:0 "Alors que Renault produit des camions pour les forces d’occupation, nous devons les contacter afin de voir s’ils peuvent concevoir en secret des véhicules modernes pour nous."
 EFR_autorized_modernization:0 "Modernisation Autorisée"
 EFR_autorized_modernization_desc:0 "Nous avons enfin l’opportunité de concevoir de nouveaux équipements et de moderniser pleinement notre armée."
 EFR_restart_heavy_water_production:0 "Relancer la Production d’Eau Lourde"
 EFR_restart_heavy_water_production_desc:0 "L’une des grandes ressources stratégiques ayant échappé aux griffes allemandes fut le stock d’eau lourde évacué vers la Grande-Bretagne lors de l’invasion. Avec le retour de nos ambitions militaires, ce projet exploitant les propriétés prometteuses de l’uranium doit être relancé."
 EFR_military_youth:0 "Jeunesse Militaire"
 EFR_military_youth_desc:0 "Jeunesse de France ! Ce combat n’est pas seulement celui de vos parents, c’est aussi le vôtre ! C’est un combat pour votre avenir même ! Il est temps d’agir contre les traîtres anglo-américains ! Comment certains peuvent-ils faire les zazous en une époque aussi cruciale pour l’avenir de l’Europe et du monde entier ? Jeunesse de France, pour une révolution nationale et socialiste complète : levez-vous !"
 EFR_milice_francaise:0 "Milice Française"
 EFR_milice_francaise_desc:0 "La Milice française est l’instrument de répression du régime contre les éléments séditieux tels que les Juifs, les communistes, les gaullistes et les partisans en général."
 EFR_phalange_africaine:0 "Phalange Africaine"
 EFR_phalange_africaine_desc:0 "La phalange africaine était une unité créée pour repousser les forces alliées en Afrique du Nord. Elle fut recrutée parmi la population française vivant en Algérie."
 EFR_ideological_fanaticism:0 "Fanatisme Idéologique"
 EFR_ideological_fanaticism_desc:0 "Nous avons juré fidélité à Pétain et à la France. Nous ne trahirons pas ce serment, contrairement aux Anglais qui sont judaïsés depuis des décennies."
 EFR_technology_sharing:0 "Partage Technologique"
 EFR_technology_sharing_desc:0 "La collaboration aide aussi sur le plan scientifique. Une rencontre entre scientifiques français et allemands, partageant leurs savoirs en paix, est un nouvel exemple de l’unité de l’Europe face à ses ennemis."
