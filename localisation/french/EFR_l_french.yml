 FRA_FREE_army:0 "French Liberation Army"
 FRA_FREE_henry_de_rancourt_de_mimerand:0 "Henry de Rancourt de Mimérand"

 VIC_gazogenes_and_michelin_tires:0 "Gazogenes"
 VIC_gazogenes_and_michelin_tires_desc:0 "As oil is becoming scarcer every day we must find substitute. Most of the civilian population now rely on cycling but we cars can also work with substitute fuels. Gazogenes enable to extract the energy of the combustion of coal and even wood."
 VIC_STO_desc:0 "The "Service du Travail Obligatoire, (mandatory work service) is a system of exchange between workers sent to work Germany as the Reich lacked manpower to fill both their divisions and their factories. It lead to the release of tens of thousands of soldiers, but some of them stayed in Germany as freed workers."
 VIC_reinforce_the_STO:0 "Reinforce the STO"
 VIC_reinforce_the_STO_desc:0 "Worker! By working for Europe you protect your country and your home. You will also be the ambassador of french quality and ensure financial stability to your family."
 VIC_rationing:0 "Rationing"
 VIC_rationing_desc:0 "In order to save the little resources we have, a rationing system must be established. The list of restricted products is long and includes olive oil, bread, butter, meat, milk and eggs. Candies are forbidden and the press must publish guides on how to cook all sorts of dishes with substitution product such as rutabaga soup, grated thistle salad, coffee without coffee...."
 VIC_armistice_army:0 "Organize the Armistice Army"
 VIC_armistice_army_desc:0 "Even if we are restricted on what we could do with the remnants of our army, we still have to organize it correctly and prepare the revision of our tactics in order to be ready to fight any enemy of France."
 VIC_hide_military_equipment:0 "Hide Military Equipment"
 VIC_chantiers_de_la_jeunesse:0 "Chantiers de la Jeunesse"
 VIC_chantiers_de_la_jeunesse_desc:0 "As the military service has been abolished, the youth must served instead in the so called "chantiers de la jeunesse" (youth work sites). In those open camps they will do small infrastructure works, marches in the wilderness and other physical activities."
 VIC_negociate_the_release_of_officers:0 "Negotiate the Release of Officers"
 VIC_negociate_the_release_of_officers_desc:0 "Eased by our attitude regarding european collaboration, we have finally gained a major concession from the Reich chancellor Hitler: the liberation of thousands of officers who were prisoners in Germany."
 VIC_LVF:0 "Légion des Volontaires Français"
 VIC_secret_military_researches:0 "Secret Military Researches"
 VIC_secret_military_researches_desc:0 "While the use of some equipment like tanks is forbidden by the armistice, we could continue to experiment in secret using what the rest of society is using in other domains: ersatzs."
 VIC_bulldozer_experiments:0 "Bulldozer Experiments"
 VIC_bulldozer_experiments_desc:0 "We aren't allowed to have tanks but we can acquire vehicles with tracks if we buy heavy snow removing vehicles or bulldozers. Those won't be used in combat but will provide the necessary technical data for future tanks."
 VIC_contact_renault:0 "Contact Renault"
 VIC_contact_renault_desc:0 "While the Renault is producing trucks for the occupying forces, we must contact them to see if they can design some modern vehicles for us in secret."
 VIC_autorized_modernization:0 "Autorized Modernization"
EFR_battle_cruiser_1:0 "Projet Durand-Viel"
EFR_battle_cruiser_1_desc:0 "Le projet de croiseur de bataille Durand-Viel faisait partie d’une série d’études remontant à la Première Guerre mondiale. Il s’agissait essentiellement de versions « croiseur de bataille » des classes de cuirassés Normandie et Lyon, équipés des mêmes tourelles quadruples et canons mais en nombre réduit. Comme les croiseurs de bataille contemporains des autres marines, ils auraient été plus rapides mais moins blindés qu’un cuirassé. Ils furent annulés avant le début de la Première Guerre mondiale."
EFR_battle_cruiser_2:0 "Classe Dunkerque"
EFR_battle_cruiser_2_desc:0 "Les Dunkerque furent conçus pour contrer les cuirassés de poche allemands de la classe Deutschland. Ils représentaient l’aboutissement d’une série d’études commencées au milieu des années 1920 et poursuivies jusqu’au début des années 1930. Autorisés dans les programmes navals de 1931 et 1934, ils étaient similaires aux cuirassés britanniques de la classe Nelson, avec toutes leurs tourelles principales concentrées à l’avant. Cela permettait un blindage latéral plus court et donc un navire plus petit, conforme aux limitations des traités navals."
EFR_battleship_1:0 "Classe Courbet"
EFR_battleship_1_desc:0 "Les cuirassés de la classe Courbet furent les premiers super-dreadnoughts construits pour la Marine française avant et pendant la Première Guerre mondiale. Autorisés dans les programmes navals de 1910 et 1911, ils participèrent peu au conflit mais restèrent actifs pendant la Seconde Guerre mondiale. Bien qu’ils aient eu un blindage plus épais et une artillerie plus puissante que la précédente classe Dante, ils restaient inférieurs aux cuirassés contemporains américains et britanniques. Ils déplaçaient un peu plus de 22 000 tonnes et n’avaient reçu que des modernisations limitées avant la Seconde Guerre mondiale, notamment une DCA renforcée et de nouvelles chaudières."
#EFR_battleship_1b: "Classe Bretagne"
EFR_battleship_2:0 "Classe Richelieu"
EFR_battleship_2_desc:0 "Les cuirassés de la classe Richelieu furent les derniers cuirassés mis en service dans la Marine française. Ils représentaient une version améliorée de la classe Dunkerque et furent autorisés dans les programmes navals de 1935 et 1938. Ils disposaient d’une excellente DCA, d’une bonne vitesse et d’une grande autonomie, ce qui en faisait de redoutables navires capitaux. Sur les quatre commandés, seuls deux furent lancés et un seul achevé avant la Chute de la France. Plusieurs projets furent envisagés pour terminer les navires restants, allant du cuirassé antiaérien au cuirassé-porte-avions hybride, mais aucun ne fut mené à terme."
EFR_battleship_3:0 "Classe Gascogne"
EFR_battleship_3_desc:0 "Les cuirassés de la classe Gascogne étaient une sous-classe des Richelieu. Trois unités furent commandées dans le programme naval de 1940 mais aucune ne fut commencée. Le projet reprenait la conception des Richelieu, mais avec l’artillerie principale répartie à l’avant et à l’arrière, une DCA améliorée et des moteurs plus puissants, ce qui en aurait fait de meilleurs navires."
EFR_battleship_4:0 "Classe Alsace"
EFR_battleship_4_desc:0 "Les cuirassés de la classe Alsace étaient destinés à succéder aux Richelieu. Quatre furent commandés, les études achevées en 1939, autorisés en 1940 et la construction devait débuter en 1941, mais la Chute de la France empêcha leur mise en chantier. Ils amélioraient la conception des Richelieu avec une artillerie principale plus lourde et plus nombreuse, une DCA renforcée, un blindage plus épais et des moteurs plus puissants."
EFR_SH_battleship_1:0 "Classe Charlemagne"
EFR_SH_battleship_1_desc:0 "Les cuirassés super-lourds de la classe Charlemagne constituaient une conception hypothétique destinée à rivaliser avec les grands cuirassés des autres marines. Ils étaient dotés d’une artillerie principale concentrée à l’avant en positions superposées, d’une forte DCA et d’un blindage très épais. Leur conception reprenait des éléments des Richelieu et des cuirassés britanniques de la classe Nelson."
EFR_SH_battleship_2:0 "Classe Napoléon Bonaparte"
EFR_SH_battleship_2_desc:0 "Les cuirassés de la classe Napoléon Bonaparte étaient un projet hypothétique basé sur les classes Alsace et Gascogne. Leur puissante artillerie principale était répartie à l’avant et à l’arrière en tourelles triples, complétée par des tourelles secondaires en superposition et une lourde DCA. Un blindage épais et de puissants moteurs leur auraient donné la vitesse et la protection nécessaires pour accompagner le reste de la flotte et affronter efficacement leurs adversaires."
EFR_carrier_1:0 "Classe Béarn"
EFR_carrier_1_desc:0 "Le Béarn fut initialement posé comme cuirassé de la classe Normandie, puis achevé en tant que porte-avions. Déplaçant 22 100 tonnes, il servit durant l’entre-deux-guerres et la Seconde Guerre mondiale. En tant que porte-avions converti, il était lent et avait une capacité d’emport d’avions limitée, mais sa ceinture blindée moyenne et sa grande autonomie compensaient ces défauts. Sa construction permit aux ingénieurs français du DCAN (Direction des Constructions et Armes Navales) d’acquérir une expérience précieuse, qui donna lieu à une série d’études de conception par la suite."
EFR_carrier_2:0 "Classe Joffre"
EFR_carrier_2_desc:0 "Les porte-avions de la classe Joffre (projet PA-16) représentaient la nouvelle génération de porte-avions français. Ils constituaient l’aboutissement des études commencées en 1929 et terminées en 1937. Deux unités furent autorisées dans le programme naval de 1938, mais les tensions croissantes ralentirent leur construction et la Chute de la France empêcha leur achèvement. Ils auraient eu un déplacement d’environ 20 000 tonnes, une bonne DCA, un blindage et une vitesse corrects, mais un groupe aérien inférieur à la moyenne. Dans l’ensemble, ils auraient été des porte-avions équilibrés et polyvalents."
EFR_carrier_3:0 "Classe Jean Bart"
EFR_carrier_3_desc:0 "Le porte-avions Jean Bart était une proposition de guerre visant à convertir le cuirassé inachevé de la classe Richelieu, le Jean Bart, en porte-avions, à la manière du Shinano japonais. La grande taille de la coque permettait d’accueillir un important groupe aérien, et ses puissants moteurs lui auraient donné une grande vitesse et autonomie. Une DCA lourde d’origine américaine aurait assuré une défense efficace contre les avions et les petites unités de surface."
EFR_carrier_4:0 "Classe Clemenceau"
EFR_carrier_4_desc:0 "Les porte-avions de la classe Clemenceau (projet PA-28) constituaient la première conception d’après-guerre pour la Marine française. Ils étaient très proches des porte-avions inachevés de la classe Joffre, mais avec des équipements et armements français modernes. L’acquisition de porte-avions d’escorte américains et britanniques, ainsi que la situation économique de la France d’après-guerre, empêcha leur construction. À ne pas confondre avec la classe Clemenceau ultérieure (projet PA-54), dont les navires furent posés en 1955 et 1957."
FRA_FREE_army:0 "Armée de la Libération Française"
FRA_FREE_henry_de_rancourt_de_mimerand:0 "Henry de Rancourt de Mimérand"

VIC_gazogenes_and_michelin_tires:0 "Gazogènes"
VIC_gazogenes_and_michelin_tires_desc:0 "Alors que le pétrole se raréfie chaque jour, nous devons trouver des substituts. La majorité de la population civile se tourne désormais vers le vélo, mais les voitures peuvent aussi fonctionner avec des carburants de substitution. Les gazogènes permettent d’extraire l’énergie de la combustion du charbon et même du bois."

VIC_STO_desc:0 "Le « Service du Travail Obligatoire » est un système d’échange dans lequel des travailleurs sont envoyés en Allemagne, le Reich manquant de main-d’œuvre pour ses divisions comme pour ses usines. Cela entraîna la libération de dizaines de milliers de soldats, mais certains restèrent en Allemagne en tant que travailleurs libres."

VIC_reinforce_the_STO:0 "Renforcer le STO"
VIC_reinforce_the_STO_desc:0 "Travailleur ! En travaillant pour l’Europe, tu protèges ton pays et ton foyer. Tu seras aussi l’ambassadeur de la qualité française et tu assureras la stabilité financière de ta famille."

VIC_rationing:0 "Rationnement"
VIC_rationing_desc:0 "Afin d’économiser les maigres ressources dont nous disposons, un système de rationnement doit être mis en place. La liste des produits restreints est longue et inclut l’huile d’olive, le pain, le beurre, la viande, le lait et les œufs. Les confiseries sont interdites et la presse doit publier des guides expliquant comment cuisiner divers plats avec des produits de substitution tels que la soupe de rutabaga, la salade de chardon râpé, ou le café sans café..."

VIC_armistice_army:0 "Organiser l’Armée d’Armistice"
VIC_armistice_army_desc:0 "Même si nous sommes limités dans l’utilisation des restes de notre armée, nous devons l’organiser correctement et préparer la révision de nos tactiques afin d’être prêts à combattre tout ennemi de la France."

VIC_hide_military_equipment:0 "Cacher le Matériel Militaire"

VIC_chantiers_de_la_jeunesse:0 "Chantiers de la Jeunesse"
VIC_chantiers_de_la_jeunesse_desc:0 "Le service militaire ayant été aboli, la jeunesse doit désormais servir dans les « chantiers de la jeunesse ». Dans ces camps en plein air, ils participent à de petits travaux d’infrastructure, effectuent des marches en pleine nature et d’autres activités physiques."

VIC_negociate_the_release_of_officers:0 "Négocier la Libération des Officiers"
VIC_negociate_the_release_of_officers_desc:0 "Grâce à notre attitude favorable à la collaboration européenne, nous avons enfin obtenu une concession majeure du chancelier du Reich, Hitler : la libération de milliers d’officiers prisonniers en Allemagne."

VIC_LVF:0 "Légion des Volontaires Français"

VIC_secret_military_researches:0 "Recherches Militaires Secrètes"
VIC_secret_military_researches_desc:0 "Alors que l’utilisation de certains équipements comme les chars est interdite par l’armistice, nous pouvons continuer à expérimenter en secret en utilisant ce que le reste de la société utilise dans d’autres domaines : les ersatz."

VIC_bulldozer_experiments:0 "Expériences avec les Bulldozers"
VIC_bulldozer_experiments_desc:0 "Nous n’avons pas le droit de posséder de chars, mais nous pouvons acquérir des véhicules à chenilles en achetant de lourds chasse-neige ou des bulldozers. Ceux-ci ne seront pas utilisés au combat, mais fourniront des données techniques précieuses pour les futurs chars."

VIC_contact_renault:0 "Contacter Renault"
VIC_contact_renault_desc:0 "Alors que Renault produit des camions pour les forces d’occupation, nous devons les contacter pour voir s’ils peuvent concevoir en secret des véhicules modernes pour nous."

VIC_autorized_modernization:0 "Modernisation Autorisée"
VIC_autorized_modernization_desc:0 "Nous avons enfin l’opportunité de concevoir de nouveaux équipements et de moderniser pleinement notre armée."

VIC_restart_heavy_water_production:0 "Relancer la Production d’Eau Lourde"
VIC_restart_heavy_water_production_desc:0 "L’une des grandes ressources stratégiques ayant échappé aux griffes allemandes fut le stock d’eau lourde évacué vers la Grande-Bretagne au moment de l’invasion. Avec la restauration de nos ambitions militaires, ce projet d’exploitation des propriétés prometteuses de l’uranium doit être relancé."

VIC_military_youth:0 "Jeunesse Militaire"
VIC_military_youth_desc:0 "Jeunesse de France ! Ce combat n’est pas seulement celui de vos parents, c’est le vôtre ! C’est un combat pour votre propre avenir ! Le moment est venu d’agir contre les traîtres anglo-américains ! Comment certains peuvent-ils jouer les zazous en une époque aussi cruciale pour l’avenir de l’Europe et du monde entier ? Jeunesse de France, pour une révolution nationale et socialiste totale : levez-vous !"

VIC_milice_francaise:0 "Milice Française"
VIC_milice_francaise_desc:0 "La Milice française est l’instrument de répression du régime contre les éléments séditieux tels que les Juifs, les communistes, les gaullistes et les partisans en général."

VIC_phalange_africaine:0 "Phalange Africaine"
VIC_phalange_africaine_desc:0 "La Phalange africaine était une unité créée pour combattre les forces alliées en Afrique du Nord. Elle fut recrutée parmi la population française vivant en Algérie."

VIC_ideological_fanaticism:0 "Fanatisme Idéologique"
VIC_ideological_fanaticism_desc:0 "Nous avons prêté serment à Pétain et à la France. Nous ne trahirons pas cette parole comme les Anglais, corrompus depuis des décennies."

VIC_technology_sharing:0 "Partage Technologique"
VIC_technology_sharing_desc:0 "La collaboration profite aussi au niveau scientifique. Une rencontre entre savants français et allemands, partageant leurs connaissances dans la paix, est un autre exemple de l’unité de l’Europe face à ses ennemis."

VIC_police_nationale:0 "Police Nationale"
VIC_police_nationale_desc:0 "Afin de protéger la police de la menace des ennemis intérieurs et extérieurs, les forces de police municipales doivent être réorganisées en Police Nationale. Avec de nouveaux locaux, plus modernes, et des uniformes inspirés de la police SS."

EFR_strengthen_government_support_focus:0 "Renforcer le soutien au gouvernement"

