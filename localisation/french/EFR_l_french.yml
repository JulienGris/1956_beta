 EFR_victors_of_wwi:0 "Vainqueurs de la Grande Guerre"
 EFR_victors_of_wwi_desc:0 "Sortie victorieuse de la Grande Guerre, l’armée a développé une dangereuse complaisance, ce qui ralentit les évolutions stratégiques et les rend réticentes."
 EFR_disjointed_government:0 "Gouvernement Divisé"
 EFR_disjointed_government_desc:0 "L’état de la politique française est loin d’être stable. Bien que les réformes soient nécessaires et bienvenues, la nation est divisée et entrer dans un conflit l’exposerait à de grands risques."
 EFR_protected_by_the_maginot_line:0 "Protégée par la Ligne Maginot"
 EFR_protected_by_the_maginot_line_desc:0 "La fortification de la frontière offre à la France la possibilité de planifier et de se préparer soigneusement, mais cela réduit la flexibilité en cas d’événement imprévu."
