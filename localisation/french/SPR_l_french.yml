 aeronautica_industrial_sa:0 "Aeronáutica Industrial S.A."
 hispano_aviacion:0 "Hispano Aviación"
 euskalduna:0 "Euskalduna"
 SPR_mza:0 "MZA"

 SPR_communism_party_psoe_long:0 "Partido Socialista Obrero Español"
 caudillo_trait:0 "Caudillo"
 SPR_juan_iii:0 "Juan III"
 SPR_democratic_party_plc_long:0 "Partido Liberal Constitucional"
 SPR_peseta_surevaluated:0 "Peseta surévaluée"
 SPR_democratic_party_plc:0 "PLC"
 SPR_communism_party_psoe:0 "PSOE"
 SPR_ini:0 "Instituto Nacional de Industria"
 spanish_civil_war_started_flag:0 "La guerre civile espagnole a commencé"
 sided_with_the_nationalists_spanish_civil_war_flag:0 "A pris parti pour les nationalistes"
 sided_with_the_republicans_spanish_civil_war_flag:0 "A pris parti pour les républicains"
 SPR_neutrality_party_house_of_bourbon_long:0 "Maison de Bourbon"
 SPR_neutrality_party_house_of_bourbon_parma_long:0 "Maison de Bourbon-Parme"
 SPR_nationalist_victory:0 "Victoire nationaliste"
 SPR_nationalist_victory_desc:0 "Les forces nationalistes menées par le général Franco ont réussi à écraser les forces loyales à la Seconde République. Une nouvelle ère commence pour l’Espagne, loin des dangers du marxisme."
 SPR_republican_victory:0 "Victoire républicaine"
 SPR_republican_victory_desc:0 "Les forces fidèles à la Seconde République ont pu vaincre celles du coup d’État. La République ne mourra jamais dans le cœur des Espagnols !"
 SPR_cement_franco_rule:0 "Consolider le pouvoir de Franco"
 SPR_cement_franco_rule_desc:0 "Franco semble être la meilleure personne pour diriger l’Espagne durant cette période de reconstruction et de transformation. Jusqu’à nouvel ordre, il sera le membre le plus haut placé du gouvernement espagnol."
 SPR_restore_the_monarchy:0 "Rétablir la monarchie"
 SPR_restore_the_monarchy_desc:0 "La République désormais enterrée, il est temps pour l’Espagne de revenir à sa forme traditionnelle de gouvernement : la monarchie. Reste à savoir qui sera choisi comme nouveau roi, les monarchistes étant divisés entre les alphonsistes, qui voudraient voir Juan sur le trône, et les carlistes, qui ont choisi leur régent Javier comme nouveau prétendant."
 SPR_king_juan_iii:0 "Le roi Juan III"
 SPR_king_juan_iii_desc:0 "L’infant Juan a été choisi comme nouveau roi d’Espagne. Héritier désigné d’Alphonse, beaucoup le sous-estiment en raison de ses idées partiellement libérales, notamment la recréation partielle d’une démocratie espagnole."
 SPR_king_javier_I:0 "Le roi Javier Iᵉʳ"
 SPR_king_javier_I_desc:0 "Francisco Javier de Borbón-Parma y de Braganza, ancien régent carliste désigné par ce mouvement, a été choisi comme nouveau monarque espagnol. Carliste traditionnel, il représente une victoire de ce courant profondément enraciné en Espagne."
 SPR_restore_democracy:0 "Rétablir la démocratie"
 SPR_adapt_the_constitution_of_1876:0 "Adapter la constitution de 1876"
 SPR_british_alignment:0 "Alignement britannique"
 SPR_british_alignment_desc:0 "Alors que l’ombre de la guerre s’étend sur l’Europe, la Grande-Bretagne demeure, inébranlable. Il est temps de renouer nos bonnes relations et de signer un traité d’alliance formel entre nos deux nations."
 SPR_stay_out_of_conflicts:0 "Rester en dehors des conflits"
 SPR_stay_out_of_conflicts_desc:0 "Notre neutralité durant la Grande Guerre nous a permis de profiter d’une forte croissance économique tout en évitant de nombreux problèmes internes. Nous devrions faire de même cette fois."
 SPR_the_transition:0 "La Transition"
 SPR_the_transition_desc:0 "Il est temps de réécrire la constitution espagnole et de restaurer le pouvoir des Cortes, et par extension celui du peuple espagnol."
 SPR_support_the_free_market:0 "Soutenir le libre-marché"
 SPR_support_the_free_market_desc:0 "Un bon moyen de relancer l’économie espagnole serait de réduire l’intervention de l’État. Nous favoriserons ainsi l’arrivée d’investissements étrangers."
 SPR_dios:0 "Dios"
 SPR_patria:0 "Patria"
 SPR_patria_desc:0 "Le peuple espagnol forme une nation unique et indivisible. Tous les peuples — Catalans, Basques, Galiciens ou Castillans — doivent être unis dans la préservation de leurs traditions."
 SPR_dios_desc:0 "Le carlisme considère l’Église catholique comme essentielle non seulement dans la société, mais aussi dans les décisions gouvernementales. La création d’un ministère des affaires religieuses garantira son influence sur nos choix."
 ITA_align_with_italy:0 "S’aligner sur l’Italie"
 ITA_align_with_italy_desc:0 "L’extension des protocoles de Rome montre que l’Italie veut tenir sa place dans le monde. Nous devrions nous rapprocher d’elle pour nous dresser contre le nazisme comme contre le libéralisme occidental."
 SPR_fueros:0 "Fueros"
 SPR_rey:0 "Rey"
 SPR_establish_traditional_cortes:0 "Établir des Cortes traditionnelles"
 SPR_establish_traditional_cortes_desc:0 "Malgré la pleine légitimité du roi sur l’Espagne, son pouvoir doit être limité — d’abord par l’Église, au-dessus de lui — mais aussi par la création d’une chambre basse censée soutenir les traditions espagnoles."
 SPR_decentralize_the_kingdom:0 "Décentraliser le royaume"
 SPR_decentralize_the_kingdom_desc:0 "Même si de nombreux séparatistes des différentes régions se sont rangés du côté de la République, nous devons montrer notre bonne volonté envers ces peuples. Nous rétablirons le système des fueros, ces droits particuliers accordés à certaines régions au Moyen Âge, leur conférant un certain degré d’autonomie."
 SPR_claim_gibraltar:0 "Revendiquer Gibraltar"
 SPR_issue_political_amnesties:0 "Accorder des amnisties politiques"
 SPR_issue_political_amnesties_desc:0 "Si nous voulons un peuple espagnol pleinement uni, il faut faire preuve de clémence envers ceux qui furent nos ennemis. En amnistiant un grand nombre de républicains non extrémistes, nous montrerons que le nouveau gouvernement agit pour tous."
 SPR_claims_against_italy:0 "Revendiquer contre l’Italie"
 SPR_claims_against_italy_desc:0 "Les régions de Sardaigne et de Sicile faisaient autrefois partie de la couronne d’Espagne. Nous pourrions profiter de l’opposition britannique à l’Italie pour réaffirmer nos revendications sur ces territoires."
 SPR_expand_pyrenees_fortifications:0 "Étendre les fortifications des Pyrénées"
 SPR_expand_pyrenees_fortifications_desc:0 "La France risque d’être entraînée de plein fouet dans la guerre, d’où qu’elle vienne. Pour dissuader toute extension du conflit vers l’Ibérie, nous établirons de nouvelles fortifications le long des Pyrénées."
 SPR_reclaim_gibraltar:0 "Récupérer Gibraltar"
 SPR_reclaim_gibraltar_desc:0 "Gibraltar est une partie intégrante de l’Espagne ! Ces traîtres britanniques occupent ce territoire depuis des siècles — une véritable humiliation pour la nation ! Il est temps d’y mettre fin."
 SPR_ministry_of_religous_affairs:0 "Ministère des Affaires religieuses"
 SPR_ministry_of_religous_affairs_desc:0 "Le carlisme accorde à l’Église catholique un rôle central dans la société et dans la décision publique. Un ministère dédié aux affaires religieuses garantira son influence."
 SPR_pursue_autarky_policies:0 "Poursuivre l’autarcie"
 SPR_pursue_autarky_policies_desc:0 "Depuis des décennies, de nombreux groupes défendent l’indépendance économique. Nous continuerons à favoriser la production locale et à réduire notre dépendance, notamment en matière d’armement."
 SPR_policia_armada:0 "Policía Armada"
 SPR_policia_armada_desc:0 "Nous avons vaincu les traîtres républicains sur le champ de bataille, mais nombre de leurs partisans se terrent encore dans l’ombre, probablement en train de comploter contre le nouveau régime. Cela doit cesser."
 SPR_sindicato_vertical:0 "Sindicato Vertical"
 SPR_sindicato_vertical_desc:0 "Pour remplacer les syndicats interdits, nous devons en créer un qui reflète le corporatisme : employés et employeurs doivent coopérer pour une économie nationaliste."
 SPR_common_front_against_nazism:0 "Front commun contre le nazisme"
 SPR_common_front_against_nazism_desc:0 "Autant nous détestons leur libéralisme, autant il est clair que, dans ce conflit mondial, nos intérêts résident dans une victoire britannique. Mettons nos différends de côté et unissons-nous pour mettre fin à la menace allemande."
 SPR_join_italy:0 "Rejoindre l’Italie"
 SPR_join_italy_desc:0 "L’Italie nous a grandement aidés contre les forces républicaines et a inspiré notre régime. Nos intérêts sont liés : unissons-nous."
 SPR_join_the_axis:0 "Rejoindre l’Axe"
 SPR_join_the_axis_desc:0 "À l’aube d’un nouveau conflit mondial, l’Allemagne est plus puissante et plus effrayante que jamais. Nous rapprocher d’elle garantirait à l’Espagne sa juste place à ses côtés."
 SPR_francoist_neutrality:0 "Neutralité franquiste"
 SPR_francoist_neutrality_desc:0 "Nous aligner sur un camp ou un autre risquerait davantage d’abattre notre fragile régime que de nous être utile. Pour l’instant, la neutralité est la meilleure option."
 SPR_further_the_iberian_pact:0 "Approfondir le pacte ibérique"
 SPR_further_the_iberian_pact_desc:0 "Après un premier traité d’amitié et de non-agression avec le Portugal, nous pourrions l’étendre afin de garantir une protection mutuelle et une neutralité ibérique en cas de conflit européen."
 SPR_retake_gibraltar:0 "Reprendre Gibraltar"
 SPR_retake_gibraltar_desc:0 "Il est temps de reprendre Gibraltar, territoire espagnol de droit !"
 SPR_unify_iberia:0 "Unifier l’Ibérie"
 SPR_unify_iberia_desc:0 "Pour montrer notre grandeur et notre force à nos alliés, nous devrions réunifier le Portugal et l’Espagne, comme à l’époque de l’Union ibérique."
 SPR_claim_sardinia_and_sicily:0 "Revendiquer la Sardaigne et la Sicile"
 SPR_claim_sardinia_and_sicily_desc:0 "Même si elle nous a inspirés, l’Italie a choisi de soutenir l’Allemagne nazie. Nous pourrions exploiter leur alliance pour justifier nos revendications sur la Sicile et la Sardaigne, jadis espagnoles."
 SPR_uphold_the_1931_constitution:0 "Maintenir la constitution de 1931"
 SPR_rebuild_the_republic:0 "Reconstruire la République"
 SPR_rebuild_the_republic_desc:0 "Le coup d’État ayant été vaincu, il est temps de restaurer les institutions républicaines."
 SPR_get_rid_of_azana:0 "Se débarrasser d’Azaña"
 SPR_get_rid_of_azana_desc:0 "Malgré son attachement à la République, Azaña est bien trop modéré sur les questions sociales et économiques. Le PCE et le PSOE ont gagné assez d’influence pour le pousser à la démission sans trop de difficulté."
 SPR_the_third_republic:0 "La Troisième République"
 SPR_the_third_republic_desc:0 "Profitons du climat révolutionnaire qui a accompagné notre victoire pour réorganiser le gouvernement et créer une République plus forte, au service du peuple."
 SPR_psoe_leadership:0 "Direction du PSOE"
 SPR_psoe_leadership_desc:0 "WIP"
 SPR_PCE_leadership:0 "Direction du PCE"
 SPR_PCE_leadership_desc:0 "WIP"
 SPR_continue_azana_work:0 "Poursuivre l’œuvre d’Azaña"
 SPR_continue_azana_work_desc:0 "WIP"
 SPR_continue_the_secularization_policies:0 "Maintenir les politiques de laïcisation"
 SPR_continue_the_secularization_policies_desc:0 "Le choix de l’Église catholique de soutenir les forces nationalistes prouve qu’elle constitue une cinquième colonne au sein de la République. Nous poursuivrons nos réformes pour limiter son influence et en décourager la pratique."
 SPR_the_reformist_wing:0 "L’aile réformiste"
 SPR_appease_the_workers:0 "Apaiser les travailleurs"
 SPR_appease_the_workers_desc:0 "WIP"
 SPR_the_left_front:0 "Le Front de gauche"
 SPR_the_left_front_desc:0 "Tous les partis opposés au capitalisme et les syndicats doivent s’unir pour mener une révolution ouvrière. En coopérant, nous éviterons les blocages dus aux oppositions internes."
 SPR_socialize_the_means_of_production:0 "Socialiser les moyens de production"
 SPR_socialize_the_means_of_production_desc:0 "WIP"
 SPR_purge_the_liberals:0 "Purger les libéraux"
 SPR_purge_the_liberals_desc:0 "WIP"
 SPR_begin_collectivization:0 "Commencer la collectivisation"
 SPR_begin_collectivization_desc:0 "WIP"
 SPR_establish_soviet_democracy:0 "Établir une démocratie des soviets"

 SPR_establish_soviet_democracy_desc:0 "Il est temps de remplacer le système parlementaire bourgeois par un système de communisme des conseils, bien mieux adapté à la révolution sociale."
 SPR_establish_the_oraa_desc:0 "L’« organisation pour la répression des activités antirévolutionnaires » sera calquée sur le NKVD soviétique et aura pour but de traquer les opposants au nouveau régime communiste."
 SPR_establish_the_oraa:0 "Créer l’ORAA"
 SPR_uphold_the_1931_constitution_desc:0 "La constitution de 1931 doit être défendue à tout prix. La démocratie espagnole ne se laissera détruire ni de l’intérieur ni de l’extérieur."
 SPR_repair_relations_with_the_west:0 "Rétablir les relations avec l’Occident"
 SPR_repair_relations_with_the_west_desc:0 "À présent que la République s’est imposée comme seule autorité en Espagne et que les éléments les plus communistes ont été contenus, nous pouvons tenter de renouer des relations amicales avec les démocraties occidentales."
 SPR_align_with_the_new_france:0 "S’aligner sur la nouvelle France"
 SPR_align_with_the_new_france_desc:0 "Le nouveau régime français se montre plus que sceptique quant à la coopération avec les Soviétiques. Nous devrions peut-être faire de même."
 SPR_join_the_comintern:0 "Rejoindre le Komintern"
 SPR_join_the_comintern_desc:0 "L’Union soviétique fut notre principal allié dans la victoire contre les forces nationalistes. Il serait naturel de nous en rapprocher."
 SPR_intervention_in_portugal:0 "Intervenir au Portugal"
 SPR_intervention_in_portugal_desc:0 "L’Estado Novo a largement coopéré avec les forces nationalistes. Il est clair que cela ne peut rester sans conséquences."
 SPR_confront_the_hearth_of_fascism:0 "Affronter le foyer du fascisme"
 SPR_confront_the_hearth_of_fascism_desc:0 "L’Italie a été l’un des principaux soutiens des forces franquistes et continue de défendre le fascisme. Il est temps d’en finir avec le régime mussolinien."
 SPR_convince_portugal:0 "Convaincre le Portugal"
 SPR_demand_gibraltar:0 "Exiger Gibraltar"
 SPR_demand_gibraltar_desc:0 "La présence britannique à Gibraltar représente un risque en cas de conflit en Méditerranée. Le Rocher serait bien mieux aux mains du Comité ; nous devons en exiger la restitution."
 SPR_a_permanent_legion_condor:0 "Une Légion Condor permanente"
 SPR_a_permanent_legion_condor_desc:0 "Nous pouvons beaucoup apprendre des succès de la Légion Condor allemande. En demandant une mission militaire à l’Allemagne, nous pourrions moderniser notre aviation sur leur modèle."
 SPR_claims_on_france:0 "Revendiquer contre la France"
 SPR_claims_on_france_desc:0 "Nos revendications vis-à-vis de la France sont nombreuses, notamment le contrôle du Maroc. Nous pourrions aussi tenter de récupérer le Roussillon, toujours partie de la Catalogne historique et, par extension, de la grande Espagne."
 SPR_learn_from_the_regia_marina:0 "S’inspirer de la Regia Marina"
 SPR_learn_from_the_regia_marina_desc:0 "L’Italie possède l’une des marines les plus développées d’Europe. S’inspirer d’elle serait judicieux pour améliorer la nôtre."
 SPR_help_the_royal_navy:0 "Aider la Royal Navy"
 SPR_help_the_royal_navy_desc:0 "La position de l’Espagne est idéale pour contrôler l’Atlantique comme la Méditerranée. Il serait donc sage d’améliorer notre marine en nous inspirant de celle des Britanniques."
 SPR_take_gibraltar_by_force:0 "Prendre Gibraltar par la force"
 SPR_western_economic_cooperation:0 "Coopération économique occidentale"
 SPR_learn_from_the_royal_navy:0 "S’inspirer de la Royal Navy"
 SPR_post_depression_recovery:0 "Relance post-crise"
 SPR_post_depression_recovery_desc:0 "Même si elle a touché l’Espagne moins durement que d’autres pays, la Grande Dépression a provoqué de nombreux problèmes économiques. Maintenant que ses effets se dissipent, nous pouvons stimuler le développement économique."
 SPR_increase_public_investments:0 "Augmenter l’investissement public"
 SPR_increase_public_investments_desc:0 "Un investissement accru de l’État dans le secteur public apportera davantage de stabilité et d’indépendance économique."
 SPR_surevaluate_the_peseta:0 "Surévaluer la peseta"
 SPR_surevaluate_the_peseta_desc:0 "La surévaluation de la monnaie empêchera la hausse des prix et réduira le coût des investissements étrangers, permettant à l’Espagne de retrouver sa place sur le marché mondial."
 SPR_repair_the_national_roads:0 "Réparer les routes nationales"
 SPR_repair_the_national_roads_desc:0 "De nombreuses routes et voies ferrées ont été dévastées par la guerre civile. Il faut les réparer et en construire de nouvelles pour relancer l’économie nationale."
 SPR_create_the_ini:0 "Créer l’INI"
 SPR_create_the_ini_desc:0 "L’« Instituto Nacional de Industria » aura pour mission de financer et d’accélérer la reprise économique afin de rétablir un secteur industriel efficace."
 SPR_create_instalaza:0 "Créer Instalaza"
 SPR_create_instalaza_desc:0 "Instalaza sera une entreprise dédiée à la production d’armes légères. Nous pourrons ainsi développer le secteur de l’armement."
 SPR_save_the_education_budget:0 "Sauvegarder le budget de l’éducation"
 SPR_save_the_education_budget_desc:0 "La reconstruction nous a forcés à réduire le budget de l’éducation, ce qui l’a pénalisé. Nous devrions revenir au niveau antérieur, voire l’augmenter."
 SPR_public_work_projects:0 "Grands travaux publics"
 SPR_support_the_heavy_industry:0 "Soutenir l’industrie lourde"
 SPR_support_the_heavy_industry_desc:0 "Pour répondre aux besoins d’armement de l’armée, un développement plus poussé de l’industrie lourde s’impose."
 SPR_expand_the_mines:0 "Étendre les mines"
 SPR_expand_the_mines_desc:0 "Notre sous-sol est riche, notamment en tungstène. Améliorer nos capacités d’extraction nous permettra d’en tirer parti pour notre expansion industrielle."
 SPR_una_grande_y_libre:0 "Una, Grande y Libre"
 SPR_una_grande_y_libre_desc:0 "L’Espagne est une nation libre de toute influence étrangère ; nous n’avons besoin de l’aide de personne pour affirmer notre place dans le monde !"

 SPR_befriend_portugal:0 "Se rapprocher du Portugal"
 SPR_befriend_portugal_desc:0 "Notre voisin ibérique est un partenaire essentiel dans ce monde agité."

 SPR_francisco_franco:0 "Francisco Franco"

 SPR_tallares_mecanicos_y_garaje:0 "Talleres Mecánicos y Garaje RAG S.A."

 SPA_ally_the_french:0 "S’allier aux Français"
 SPA_ally_the_french_desc:0 "Le nouveau gouvernement français, sous la sage direction de [FRA.getleader], semble aligné sur nos intérêts. La possibilité d’une alliance mérite d’être étudiée."

 # utilisé pour l’arbre DLC pour l’instant
 SPR_naval_design_bureau:0 "Bureau de conception navale"
 SPR_naval_design_bureau_desc:0 "Rassembler des ingénieurs au sein d’un Bureau de conception navale permettra aux meilleurs esprits de repenser l’équipement de notre marine."
 SPR_naval_equipment:0 "Équipement naval"
 SPR_naval_equipment_desc:0 "Pour préparer la marine républicaine aux menaces de notre temps, nous devons améliorer son équipement."
 SPA_naval_equipment:0 "Équipement naval"
 SPA_naval_equipment_desc:0 "La nouvelle flotte a besoin du matériel le plus moderne pour rivaliser avec ses adversaires. Revitalisons l’Armada."
 SPA_equip_the_new_armada:0 "Équiper la nouvelle Armada"
 SPA_equip_the_new_armada_desc:0 "La nouvelle flotte a besoin du matériel le plus moderne pour défier ses rivales. Revitalisons l’Armada."

 SPR_crush_regional_governments:0 "Écraser les gouvernements régionaux"
 SPR_crush_regional_governments_desc:0 "L’Espagne doit être unie !"
 SPR_crush_regional_governments_r56:0 "Écraser les gouvernements régionaux"
 SPR_crush_regional_governments_r56_desc:0 "L’Espagne doit être unie !"
 SPA_spanish_austrian_diplomatic_unity:0 "Unité diplomatique hispano-autrichienne"
 SPA_spanish_austrian_diplomatic_unity_desc:0 "Même si les couronnes d’Autriche et d’Espagne ne sont plus unies dynastiquement depuis le début du XVIIIᵉ siècle, les menaces du monde moderne soulignent la nécessité d’une alliance forte des monarques d’Europe."

 SPA_r56_spanish_austrian_diplomatic_unity:0 "Unité diplomatique hispano-autrichienne"
 SPA_r56_spanish_austrian_diplomatic_unity_desc:0 "Même si les couronnes d’Autriche et d’Espagne ne sont plus unies dynastiquement depuis le début du XVIIIᵉ siècle, les menaces du monde moderne soulignent la nécessité d’une alliance forte des monarques d’Europe."

 SPA_alliance_with_the_kaiserreich:0 "Alliance avec le Kaiserreich"
 SPA_alliance_with_the_kaiserreich_desc:0 "Le retour des Hohenzollern sur le trône d’Allemagne nous offre l’occasion de rejoindre leur alliance pour défendre le droit divin de régner."

 SPA_carlist_diplomacy:0 "Diplomatie carliste"
 SPA_carlist_diplomacy_desc:0 "Nous devons trouver des alliés dans ce monde en perpétuel changement afin de rester fermement assis sur notre trône."
 holy_alliance:0 "Sainte-Alliance"

 SPA_r56_alliance_with_the_kaiserreich:0 "Alliance avec le Kaiserreich"
 SPA_r56_alliance_with_the_kaiserreich_desc:0 "Le retour des Hohenzollern sur le trône d’Allemagne nous offre l’occasion de rejoindre leur alliance pour défendre le droit divin de régner."

 SPA_r56_carlist_diplomacy:0 "Diplomatie carliste"
 SPA_r56_carlist_diplomacy_desc:0 "Nous devons trouver des alliés dans ce monde en perpétuel changement afin de rester fermement assis sur notre trône."

 SPR_direct_NKVD_assistance:0 "Expertise tchékiste"
 SPR_direct_NKVD_assistance_desc:0 "L’aide des Tchékistes serait inestimable pour protéger la révolution."

 SPR_voluntary_mountain_militias:0 "Milices de montagne volontaires"
 SPR_voluntary_mountain_militias_desc:0 "Pour combattre efficacement en montagne, nous devons recruter des volontaires valides et former des unités spécialisées."

 r56_SPR_post_civil_war_resistance:0 "Résistance partisane"
