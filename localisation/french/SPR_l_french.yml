 #Décisions supplémentaires pour les joueurs avec DLC
 SPA_prepare_the_merge_of_falanga_with_carlists:0 "Préparer la fusion de la Phalange et des Carlistes"
 SPA_prepare_the_merge_of_falanga_with_carlists_desc:0 "Les divisions entre les groupes anti-républicains risquent de devenir incontrôlables si elles ne sont pas contenues. En utilisant l’influence d’une nouvelle figure politique unificatrice, nous pouvons poser les bases d’un nouveau parti capable de représenter les intérêts de tous les membres de cette alliance de circonstance."
 SPA_appease_anti_secular_elements:0 "Apaiser les éléments anticléricaux"
 SPA_appease_anti_secular_elements_desc:0 "La Comunión Tradicionalista ultracatholique et anticléricale bénéficie d’un fort soutien parmi le clergé et les éléments traditionalistes du pays. En adoptant quelques lois antiséculières, nous pouvons encore renforcer leur attitude positive envers le gouvernement."

 #Focalisations et modificateurs liés à la guerre civile
 SPR_back_the_ceda:0 "Soutenir la CEDA"
 SPR_back_the_ceda_tt:0 "§WLes§! §YNationalistes§! §Wcommenceront la guerre civile avec §G75§! §Wde pouvoir politique.§! §WLes§! §YRÉPUBLICAINS§! §Wla commenceront avec§! §Y0§! §Wde pouvoir politique.§!\n "
 SPR_back_the_ceda_2_tt:0 "§RNous soutiendrons les§! §YNationalistes§! §Rlorsque la guerre civile éclatera§!\n "
 SPR_civil_war_load_tt:0 "§WLes focalisations de§! §Yguerre civile§! §Wdeviennent§! §Gdisponibles§!\n "
 SPR_back_the_ceda_desc:0 "Soutenir la CEDA. Pour l’Espagne !"
 SPR_establish_a_conspiracy:0 "Élargir le complot militaire"
 SPR_establish_a_conspiracy_tt:0 "§WLes§! §YNationalistes§! §Wcommenceront la guerre civile avec :\nExpérience de l’armée :§! §G+10§!§W.§!"
 SPR_establish_a_conspiracy_desc:0 "Nous devons agir vite ! Avant que nos ennemis ne découvrent notre complot !"
 SPR_strike_first:0 "Frapper les premiers"
 SPR_strike_first_desc:0 "Nous devons prendre l’initiative si nous voulons vaincre nos ennemis ! Il nous faut frapper les premiers !"
 SPR_r56_strike_first:0 "Initiative de la guerre civile"
 SPR_r56_strike_first_desc:0 "Nous avons agi les premiers et avons un avantage temporaire sur nos ennemis !"
 SPR_maintain_the_popular_front:0 "Soutenir le Front populaire"
 SPR_maintain_the_popular_front_desc:0 "Soutenir le Front populaire. Pour l’Espagne !"
 SPR_maintain_the_popular_front_tt:0 "§WLes§! §YRÉPUBLICAINS§! §Wcommenceront la guerre civile avec §G75§! §Wde pouvoir politique.§! §WLes§! §YNationalistes§! §Wla commenceront avec§! §Y0§! §Wde pouvoir politique.§!\n "
 SPR_maintain_the_popular_front_2_tt:0 "§RNous soutiendrons les§! §YRÉPUBLICAINS§! §Rlorsque la guerre civile éclatera§!\n "
 SPR_the_army_of_africa_connection:0 "La connexion avec l’Armée d’Afrique"
 SPR_the_army_of_africa_connection_desc:0 "Les meilleures troupes entraînées d’Espagne nous aideront à combattre les Républicains. Elles soutiendront le complot militaire."
 SPR_the_army_of_africa_connection_tt:0 "§WLes§! §YNationalistes§! §Wcommenceront la guerre civile avec :\n§Y1,00K§! §Wunités d’§! §Yéquipement d’infanterie§!."
 SPR_maintain_the_civil_guards_loyality:0 "Maintenir la loyauté de la Garde civile"
 SPR_maintain_the_civil_guards_loyality_desc:0 "La Garde civile défend la République ! Nous devons garantir sa loyauté."
 SPR_r56_civil_war_tt:0 "§RLa guerre civile va commencer !§!"
 SPR_maintain_the_civil_guards_loyality_tt:0 "§WLes§! §YRÉPUBLICAINS§! §Wcommenceront la guerre civile avec :\nExpérience de l’armée :§! §G+10§!§W.§!"
 SPR_proclaim_a_general_strike:0 "Proclamer une grève générale"
 SPR_proclaim_a_general_strike_desc:0 "Proclamons une grève générale et commençons à collecter et distribuer des armes ! Cela nous permettra de transformer les syndicats en unités militaires pour le combat à venir !"
 SPR_proclaim_a_general_strike_tt:0 "§WLes§! §YRÉPUBLICAINS§! §Wcommenceront la guerre civile avec :\n§Y1,00K§! §Wunités d’§! §Yéquipement d’infanterie§!."
 SPR_strike_first_tt:0 "§WAu début de la§! §Yguerre civile§! §Wle camp que nous avons soutenu :§!"
 SPR_unionify_the_faction:0 "Unifier notre faction"
 SPR_unionify_the_faction_desc:0 "Si nous espérons gagner cette guerre civile, nous devons nous assurer que tout le monde dans notre faction est sur la même ligne."
 SPR_solidify_the_fronts:0 "Solidifier les fronts"
 SPR_solidify_the_fronts_desc:0 "Maintenant que les lignes de front sont claires, il est temps de s’y retrancher et de consolider nos positions."
 SPR_equipment_shipments_r56:0 "Livraisons d’équipement"
 SPR_equipment_shipments_r56_desc:0 "De nombreuses puissances mondiales ont la « bonté » de nous donner des armes pour soutenir notre cause."
 SPR_tackle_the_weak_fronts_r56:0 "Exploiter les fronts faibles"
 SPR_tackle_the_weak_fronts_r56_desc:0 "Nous savons bien mieux que les Républicains quels fronts sont vulnérables et exploitables. Une nouvelle campagne offensive peut donc commencer !"
 SPR_new_approach_r56:0 "Une nouvelle approche"
 SPR_new_approach_r56_desc:0 "Si nous voulons gagner cette guerre, il nous faut de nouvelles tactiques."
 SPR_international_brigdes_r56:0 "Brigades internationales"
 SPR_international_brigdes_r56_desc:0 "Des gens du monde entier rejoignent la République pour arrêter la vermine nationaliste !"
 SPR_excavate_the_gold_reserves:0 "Exploiter les réserves d’or"
 SPR_excavate_the_gold_reserves_desc:0 "Nous avons réussi à saisir les réserves d’or du gouvernement dans les premières étapes de la guerre civile. Malheureusement, peu de pays accepteront de les utiliser comme paiement, sauf les Russes. Avec les fascistes qui nous pressent de tous côtés, il est peut-être temps de transférer ces réserves outre-mer, entre les mains sûres de [SOV.GetNameDef]. En échange, ils sont prêts à nous aider."
 SPR_excavated_gold_reserves:0 "Réserves d’or exploitées"
 SPR_expand_axis_aide:0 "Étendre l’aide de l’Axe"
 SPR_expand_axis_aide_desc:0 "Étendre l’aide que l’Axe nous fournit est une étape logique pour garantir la victoire."

 SPR_join_the_communist_opposition:0 "Rejoindre l’opposition communiste"
 SPR_join_the_communist_opposition_desc:0 "Le stalinisme a trahi les idéaux de la révolution, mais d’autres en ont préservé le véritable esprit."

 #Idées liées à la guerre civile
 SPR_unionify_the_faction_idea:0 "Faction unie"
 SPR_unionify_the_faction_idea_desc:0 "Même si notre camp connaît des divergences, nous sommes unis par un objectif commun : la victoire."
 SPR_solidify_the_fronts_idea:0 "Fronts consolidés"
 SPR_solidify_the_fronts_idea_desc:0 "Avec des lignes de front désormais claires, il est plus facile de défendre que d’attaquer. Acceptons cette réalité."
 SPR_weak_fronts:0 "Exploiter les fronts faibles"
 SPR_international_brigdes_r56_idea:0 "Brigades internationales"
 SPR_anarchist_insurrection:0 "Insurrection anarchiste"
 SPR_anarchist_insurrection_desc:0 "Notre alliance avec les anarchistes a pris fin, entraînant une insurrection derrière nos lignes qu’il faudra du temps pour écraser."
 #Missions
 r56_SPR_anarchist_insurrection_mission:0 "Insurrection anarchiste imminente"
 r56_SPR_anarchist_insurrection_mission_desc:0 "Notre alliance avec les anarchistes finira inévitablement par se briser. Lorsque ce sera le cas, nous devrons les affronter."
 #Drapeaux du pays
 r56_SPR_nationalist_check:0 "Nous sommes les Nationalistes"
 r56_i_am_the_nat_start_up_and_bypass:0 "La guerre civile a commencé"
 SPR_back_the_ceda_finished:0 "Nous avons soutenu les Nationalistes"
 r56_i_am_the_spr_start_up_and_bypass:0 "Nous sommes les Républicains"
 r56_SPR_republican_check:0 "Nous avons soutenu le Front populaire"

 SPR_pcd_democratic_party:0 "PCD"
 SPR_pcd_democratic_party_long:0 "Partido del Centro Democrático"

 SPR_izquierda_republicana_party:0 "IR"
 SPR_izquierda_republicana_party_long:0 "Izquierda Republicana"

 SPR_spain.1.t:0 "Les réactionnaires ont été écrasés !"
 SPR_spain.1.desc:0 "Après des efforts héroïques, le peuple espagnol, aidé par des antifascistes venus du monde entier, a écrasé les rebelles fascistes et assuré le triomphe du Front populaire. Notre victoire nous libère de la tyrannie des réactionnaires, mais les combats et les mesures de sécurité nécessaires ont fortement perturbé l’économie. Après tant de souffrances, il est clair que notre population n’a qu’un seul désir : la paix."
 SPR_spain.1.a:0 "La paix, enfin !"

 SPR_democratic_party_ceda_long:0 "Confederación Española de Derechas Autónomas"
 SPR_democratic_party_ceda:0 "CEDA"

 SPR_spain.2.t:0 "La CEDA devient un parti démocratique"
 SPR_spain.2.desc:0 "Cet événement permet de faire de la CEDA le parti démocratique si l’idéologie espagnole passe à la démocratie, notamment grâce au soutien britannique pour renforcer la démocratie en Espagne. Ainsi, cet événement évite à l’Espagne de se retrouver sans parti."
 SPR_spain.2.a:0 "D’accord"

 SPR_spain.3.t:0 "Mort de Manuel Azaña"
 SPR_spain.3.desc:0 "Manuel Azaña, président de la République espagnole, est mort hier soir.\n\nFigure la plus importante de la Seconde République, surtout durant la guerre civile, il a consacré sa vie à l’égalité démocratique de tous les citoyens devant la loi et à la création d’un système politique moderne répondant aux attentes d’une démocratie contemporaine, entre présidentialisme et parlementarisme.\n\nJosé Giral, l’un des plus proches partenaires d’Azaña et ancien Premier ministre, a été choisi pour lui succéder."
 SPR_spain.3.a:0 "Plus qu’un président, un symbole de la République"

 SPR_spain.4.t:0 "L’Espagne propose un traité de défense mutuelle"
 SPR_spain.4.desc:0 "Depuis l’instauration du régime franquiste, les relations entre l’Espagne et le Portugal se sont nettement réchauffées et la coopération entre nos deux nations semblait de plus en plus étroite.\n\nLe gouvernement espagnol propose maintenant de signer un accord garantissant notre frontière commune, une assistance mutuelle en cas de conflit défensif et l’engagement de ne pas soutenir une tierce puissance dans un conflit de plus grande ampleur."
 SPR_spain.4.a:0 "Ce serait bénéfique pour nous deux"
 SPR_spain.4.b:0 "Cela irait à l’encontre des intérêts portugais"

 SPR_spain.5.t:0 "L’Espagne exige Gibraltar"
 SPR_spain.5.desc:0 "Le gouvernement espagnol, soutenu par l’appui soviétique à ses revendications, nous a envoyé un ultimatum exigeant le retour du rocher de Gibraltar à l’Espagne, sous peine d’action militaire en cas de refus.\n\nLa neutralité affichée par la Grande-Bretagne durant la guerre civile n’a guère aidé à recréer des relations amicales entre le Royaume-Uni et le nouveau gouvernement communiste espagnol, qui s’est donc rapproché de l’Union soviétique et du Komintern.\n\nGibraltar représente un atout stratégique majeur : celui qui contrôle le rocher contrôle les entrées et sorties de la Méditerranée, ce qui en fait un point crucial en cas de conflit avec toute puissance méditerranéenne.\n\nMais malgré ces avantages, valent-ils le risque d’une guerre avec l’Espagne et l’Union soviétique ?"
 SPR_spain.5.a:0 "Gibraltar est et restera britannique"
 SPR_spain.5.b:0 "Il serait plus sage de l’abandonner"

 SPR_spain.6.t:0 "La Grande-Bretagne refuse de rendre Gibraltar"
 SPR_spain.6.desc:0 "Le gouvernement britannique a rejeté notre demande de restitution du territoire de Gibraltar. Nous avions menacé de représailles militaires en cas de refus, mais peut-être serait-il plus prudent de reculer ?"
 SPR_spain.6.a:0 "Gibraltar sera espagnol, par la force si nécessaire !"
 SPR_spain.6.b:0 "Cet ultimatum était une mauvaise idée"

 SPR_spain.7.t:0 "Une vieille connaissance est revenue"
 SPR_spain.7.desc:0 "Nos services ont identifié qu’Alexander Mikhaïlovitch Orlov (né Leiba Lazarevitch Feldbin selon nos données) est retourné aux États-Unis après la fin de la guerre civile espagnole. Nos sources indiquent qu’il était un agent du NKVD mais qu’il a refusé de revenir en [SOV.getnamedef]."
 SPR_spain.7.a:0 "S’il veut se cacher des communistes, laissons-le."
 SPR_spain.7.b:0 "Essayez de le recruter !"

 spain.10.t:0 "Dissolution des Cortes"
 spain.10.a:0 "Des élections rassembleront tout le monde"

 spain.21.t:0 "Arrivée de Vicente Rojo"
 spain.21.d:0 "Vicente Rojo a accepté notre invitation et est arrivé dans notre pays. Nous n’avons pas encore décidé de la manière de l’employer ici ; il faut trancher maintenant."
 spain.21.a:0 "Nous avons besoin de ses compétences sur le terrain"
 spain.21.b:0 "Son expertise nous serait précieuse"
 spain.21.c:0 "Lui accorder l’asile suffira"

 spain.22.t:0 "Arrivée de généraux républicains"
 spain.22.d:0 "José Miaja et d’autres généraux espagnols ont accepté notre invitation et sont arrivés dans notre pays. Nous n’avons pas encore décidé de la manière de les employer ici ; il faut trancher maintenant."
 spain.22.a:0 "Soutenir leur mouvement antifasciste"
 spain.22.b:0 "Les intégrer de force dans l’armée"

 spain.23.t:0 "Les réserves d’or espagnoles"
 spain.23.d:0 "Face aux fascistes et à la pression internationale grandissante, l’Espagne a décidé de nous confier ses réserves d’or en échange d’une aide militaire symbolique. Même s’ils affirment que ce n’est que temporaire, la meilleure manière de « rembourser » notre aide serait que nous les conservions pour l’avenir prévisible."
 spain.23.a:0 "Bien sûr que nous rendrons tout cela."

 SPR_the_black_years:0 "Les années noires"
 SPR_the_black_years_desc:0 "Les fondations de la jeune République s’affaiblissent de jour en jour. Les troubles grandissent depuis la grève des mineurs des Asturies en 1934. La droite se radicalise ; la CEDA se montre de plus en plus hostile au système démocratique, et les phalangistes gagnent en popularité. Des rumeurs de complot militaire ont rendu la gauche suffisamment paranoïaque pour que les syndicats s’organisent en milices de fortune. Cela a conduit à des affrontements entre adversaires politiques, se terminant souvent dans la violence.\n\nL’Espagne a dépassé le point de non-retour : une guerre civile est pratiquement inévitable."

