r56_aus_german_resistance_armed_desc:0 "Des cellules de résistance anti-gouvernementales opérant dans cet État sont loyales au gouvernement rival de Vienne."

AUS_intervention_italy_category:0 "Intervention dans la guerre civile italienne"
AUS_intervention_italy_category_desc:0 "Une guerre civile a éclaté en Italie. Nous pourrions intervenir dans une certaine mesure pour protéger nos intérêts."
AUS_south_tyrol_border_war:0 "Saisir [39.GetName]"
AUS_south_tyrol_border_war_desc:0 "Le territoire de [39.GetName] est légitimement autrichien, avec une population majoritairement allemande. Nous devrions profiter du chaos de la guerre civile pour le saisir."
AUS_border_war_south_tyrol:0 "Conflit frontalier imminent à [39.GetName]"

