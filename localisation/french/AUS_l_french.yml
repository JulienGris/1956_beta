 r56_bundeslaender_category:0 "Juillet suivit Juin"
 r56_bundeslaender_category_desc:0 "Un an après l'interdiction du Parti nazi autrichien, le 19 juin 1933, la Schutzstaffel mena un putsch raté contre le gouvernement du Front patriotique. Lors du sanglant coup d'État lancé le 25 juillet, toute l'armée fédérale fut mobilisée pour combattre les troupes SS et finit par les vaincre, mais le chancelier Engelbert Dollfuss fut tué au combat, laissant notre nouveau régime dans une situation très vulnérable.\n\nAprès avoir pris la relève à la mort de Dollfuss, Kurt Schuschnigg a juré qu'un tel événement ne se reproduirait jamais. Cependant, il reste encore de nombreux partisans nazis, ce qui déstabilise fortement notre nation. Nous devons nous assurer de réprimer leurs actions, ou nous risquons de subir de graves conséquences.\n\n§POur limiter l'influence des nazis, nous devons combattre leurs forces dans chaque État de notre nation. Certains États sont plus stratégiques que d'autres, il serait donc préférable d'élaborer un plan pour les vaincre ou, si nécessaire, de diviser leur soulèvement afin qu'il ne représente pas une menace majeure.§!\n\n§RSi les nazis prennent le contrôle de 70 % de nos divisions, ou si nous entrons dans une alliance ou en guerre avec [GER.GetNameDef], une guerre civile éclatera !§!"

