AUS_move_capital_to_berlin:0 "Déplacer la capitale à Berlin"
AUS_move_capital_to_berlin_desc:0 "Maintenant que Berlin est sous notre contrôle, nous devons y déplacer notre capitale comme preuve finale d'unité."

AUS_integrate_slovenia:0 "Intégrer la Slovénie"
AUS_integrate_slovenia_desc:0 "Le peuple de Slovénie a longtemps fait partie des Allemands du Sud. Maintenant qu'ils ont choisi de soutenir notre gouvernement, nous pouvons les intégrer pleinement à notre grande nation."

AUS_integrate_sudetenland:0 "Intégrer les Sudètes"
AUS_integrate_sudetenland_desc:0 "Les Allemands des Sudètes faisaient partie de l'Empire autrichien et ont toujours été partie de la nation autrichienne. Nous devons leur accorder la pleine citoyenneté en tant que citoyens égaux du pays."
AUS_integrate_silesia:0 "Intégrer la Silésie"
AUS_integrate_silesia_desc:0 "Les Allemands de Silésie ont été arrachés de force à l'empire par les Prussiens et ont été forcés de renoncer à leur identité autrichienne. Maintenant que notre domination est établie, nous pouvons enfin les réintégrer."

AUS_eisenstadt_conference_category:0 "La conférence d'Eisenstadt"
AUS_eisenstadt_conference_category_desc:0 "Si nous voulons retrouver notre gloire passée et réunir notre empire, nous devons tirer les leçons des erreurs du passé. Un empire austro-hongrois moderne doit soutenir tous les peuples de l'empire, pas seulement les Autrichiens.\n\n[HUN.GetNameDefCap] a accepté de venir à la table des négociations avec nous, et si nous voulons obtenir leur soutien, nous ne devons pas aller trop loin dans nos demandes.\n\n§RSi nous demandons trop, la conférence pourrait échouer, déclenchant une guerre !§!"
AUS_conference_ongoing:0 "Conférence en cours"
AUS_propose_economical_linking:0 "Proposer un lien économique"
AUS_propose_military_linking:0 "Proposer une intégration de production"
AUS_propose_trade_linking:0 "Proposer un commerce unifié"
AUS_transfer_burgenland:0 "Proposer le transfert du Burgenland"
AUS_eisenstadt_conference_category_HUN:0 "La Conférence d'Eisenstadt"
AUS_eisenstadt_conference_category_HUN_desc:0 "Avec le retour des Habsbourg en Autriche, il était naturel qu'ils tournent finalement leur attention vers nous. Ayant été invités à une conférence sur l'avenir de nos nations, nous devrions écouter ce qu'ils ont à dire, mais si leurs exigences sont trop élevées, il pourrait être préférable d'annuler complètement la conférence."
AUS_conference_ongoing_HUN:0 "Conférence en cours"

AUS_infiltrate_croatia_category:0 "Infiltration en Croatie"
AUS_infiltrate_croatia_category_desc:0 "[AUSGetCroatiaDesc]"
AUS_infiltrate_croatia_category_desc_AUS_KINGDOM:0 "Depuis sa formation après l'effondrement de notre empire, [YUG.GetNameDef] a été une nation instable remplie de troubles internes.\n\nLe gouvernement central à Belgrade favorise la population serbe, ce qui a provoqué l'opposition de nombreux Croates au Royaume. Nous devrions tirer parti de cette situation en armant ces rebelles contre Belgrade pour nous aider dans notre guerre contre les Yougoslaves."
AUS_infiltrate_croatia_category_desc_AUS_COMMUNIST:0 "Depuis sa formation après l'effondrement de notre empire, [YUG.GetNameDef] a été une nation instable avec de nombreux troubles internes.\n\nBien que Josef Broz Tito soit Croate, le gouvernement communiste est profondément impopulaire dans de nombreuses régions du pays. Nous devrions utiliser cela à notre avantage, en armant ces rebelles contre Belgrade pour nous aider dans notre guerre contre les Yougoslaves."
AUS_infiltrate_croatia_category_desc_YUG:0 "Au cours des derniers mois, nous avons reçu des rapports concernant des armes produites par [AUS.GetAdjective] trouvées parmi des milices croates. Avec le retour des Habsbourg sur le trône d'Autriche, il semble probable que ces incidents ne soient pas isolés, et que les [AUS.GetAdjective] arment des séparatistes croates pour affaiblir notre nation. Nous devons détruire cette infiltration et écraser la menace Habsbourg une bonne fois pour toutes !"
