AUS_border_war_liechtenstein_category_desc:0 "[LIE.GetNameDefCap] a toujours été un État suivant notre gouvernement, mais avec les récents changements dans le monde, il semble que cette relation se soit tendue. Nous devons intervenir et réinstaller un gouvernement ami à [LIE.GetNonIdeologyName]."
