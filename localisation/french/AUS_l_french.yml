AUS_industrial_funds_category:0 "L'industrie autrichienne"
AUS_industrial_funds_category_desc:0 "Depuis l'effondrement de l'Empire austro-hongrois, notre économie s'est retrouvée paralysée après la perte de grands centres industriels dans d'anciennes couronnes comme la Bohême. Alors que notre économie s'effondrait rapidement, le gouvernement a été contraint de contracter de nombreux prêts internationaux auprès de la Société des Nations, laissant la nation lourdement endettée, et la Grande Dépression mondiale n'a fait qu'empirer la situation.\n\nSi nous voulons relancer notre économie, nous pourrions détourner des fonds vers des investissements industriels, ce qui pourrait prendre du temps, ou prendre le risque de contracter davantage de prêts, ce qui pourrait donner un bénéfice à court terme mais mettre notre économie en danger sur le long terme. Équilibrer les deux options est probablement notre meilleur choix actuellement.\n\nNous disposons actuellement de [?AUS_industrial_funds|+] Fonds industriels."
AUS_take_out_loan:0 "Contracter un prêt international"
AUS_industrial_subsidies:0 "Subventions industrielles"
AUS_divert_construction_funding:0 "Détourner les fonds de construction"
AUS_divert_production_funding:0 "Détourner les fonds de production"
AUS_repay_loans:0 "Rembourser les prêts internationaux"

AUS_war_plan_dr_category:0 "Kriegsfall DR"
AUS_war_plan_dr_category_desc:0 "Élaboré par Alfred Jansa, le Kriegsfall DR est notre meilleur plan d'action en cas d'invasion allemande. S'ils attaquent, nous serons prêts."
AUS_enact_warplan_DR:0 "Appliquer le Kriegsfall DR"

AUS_make_crownland_category:0 "Accorder le statut de Couronne"
AUS_make_crownland_category_desc:0 "Alors que nous regagnons des terres pour notre empire, il peut encore y avoir de la résistance parmi la population locale. Nous pourrions essayer de gagner le soutien de la population en accordant un statut spécial à certaines terres."
AUS_make_crownland_map_area:0 "Sélectionner les États à accorder le statut de Couronne"
AUS_make_crownland:0 "Accorder le statut de Couronne à [FROM.GetName]"

AUS_german_unification_category:0 "Unification allemande"
AUS_german_unification_category_desc:0 "Le moment de l'unification allemande est arrivé. Après avoir pris le contrôle de l'ancien gouvernement allemand, nous devons intégrer nos nouvelles terres dans notre grande Allemagne unie."
AUS_german_unification_map_area:0 "Voir les États intégrables"

AUS_german_resistance_category:0 "Armer la résistance allemande"
AUS_german_resistance_category_desc:0 "De nombreux Allemands ne soutiennent pas le gouvernement tyrannique de [GER.GetLeader]. Tout ce dont ils ont besoin est un flux d'armements, et ils pourraient devenir un sérieux problème pour la Wehrmacht."
AUS_german_infiltration_map_area:0 "Choisir où soutenir la résistance allemande"
AUS_infiltrate_state_germany:0 "Soutenir la résistance à [FROM.GetName]"
