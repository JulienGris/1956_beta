#POLITICS
AUS_fascism_ideology_desc:0 "Une combinaison unique du fascisme de Mussolini et du fascisme clérical, §YAustrofascisme§! est un mouvement d’extrême droite qui s’est formé lors de la transformation progressive de la République en État fédéral sous Engelbert Dolfuss.\n\nEn tant qu’idéologie officielle du VF, l’Austrofascisme prône un §YNationalisme catholique§! radical et un §8Corporatisme étatique§!, tout en s’opposant fermement au national-socialisme et à toute unification entre l’Autriche et l’Allemagne, considérant la majorité protestante de cette dernière comme une menace pour l’identité catholique autrichienne."
AUS_clerical_fascism_desc:0 "Une combinaison unique du fascisme de Mussolini et du fascisme clérical, §YAustrofascisme§! est un mouvement d’extrême droite qui s’est formé lors de la transformation progressive de la République en État fédéral sous Engelbert Dolfuss.\n\nEn tant qu’idéologie officielle du VF, l’Austrofascisme prône un §YNationalisme catholique§! radical et un §8Corporatisme étatique§!, tout en s’opposant fermement au national-socialisme et à toute unification entre l’Autriche et l’Allemagne, considérant la majorité protestante de cette dernière comme une menace pour l’identité catholique autrichienne."

AUS_democratic_socialism_desc:0 "Forme unique de socialisme façonnée par des figures du SDAPÖ comme Victor Adler à l’époque de l’Empire austro-hongrois, §YAustromarxisme§! est une idéologie de gauche qui cherche à concilier §8nationalisme§! et §Rsocialisme§! dans le §gcontexte impérial§!.\n\nAprès la chute de l’Empire, l’Austromarxisme a été transformé par le SDAPÖ en une vaste idéologie visant à réaliser une synthèse entre §RSocial-démocratie§! et §OSocialisme révolutionnaire§!, estimant que la conscience de classe pouvait être atteinte de manière organique grâce au maintien de l’autonomie nationale."
AUS_socialism_desc:0 "Forme unique de socialisme façonnée par des figures du SDAPÖ comme Victor Adler à l’époque de l’Empire austro-hongrois, §YAustromarxisme§! est une idéologie de gauche qui cherche à concilier §8nationalisme§! et §Rsocialisme§! dans le §gcontexte impérial§!.\n\nAprès la chute de l’Empire, l’Austromarxisme a été transformé par le SDAPÖ en une vaste idéologie visant à réaliser une synthèse entre §RSocial-démocratie§! et §OSocialisme révolutionnaire§!, estimant que la conscience de classe pouvait être atteinte de manière organique grâce au maintien de l’autonomie nationale."

#FOCUS 

#AIR

AUS_construct_the_tullnerfeld_airbase:0 "Construire la base aérienne de Tullnerfeld"
AUS_construct_the_tullnerfeld_airbase_desc:0 "Depuis longtemps, les plans de construction d’une base aérienne à Tullnerfeld sont restés en suspens. La guerre s’agite au nord, et il n’y a pas de meilleur moment pour les mettre à exécution."

AUS_announce_the_new_austrian_air_force:0 "Annoncer les nouvelles Luftstreitkräfte"
AUS_announce_the_new_austrian_air_force_desc:0 "Depuis la Grande Guerre, l’aviation est devenue la nouvelle arme potentielle fascinante du futur. Les autres nations ne peuvent pas nous devancer ; nous avons développé notre force aérienne en secret pendant des années, et nous sommes maintenant prêts à l’annoncer."

AUS_german_aeronautic_cooperation:0 "Coopération aéronautique [GER.GetAdjective]"
AUS_german_aeronautic_cooperation_desc:0 "L’ingénierie [GER.GetAdjective] a révolutionné presque tous les domaines de la guerre, y compris la guerre aérienne. Nous avons beaucoup en commun et toutes les raisons de coopérer dans nos recherches technologiques. Cependant, l’accès que nous leur accordons pourra influencer notre politique."

AUS_british_aeronautic_cooperation:0 "Coopération aéronautique [ENG.GetAdjective]"
AUS_british_aeronautic_cooperation_desc:0 "[ENG.GetNameDefCap] cherche désespérément à se faire des alliés en Europe centrale, et nous avons besoin de leur expertise technologique. Leur force aérienne est l’une des plus puissantes au monde, et nous pouvons en bénéficier avec seulement une légère perte d’influence interne."

AUS_soviet_aeronautic_cooperation:0 "Coopération aéronautique [SOV.GetAdjective]"
AUS_soviet_aeronautic_cooperation_desc:0 "[SOV.GetNameDefCap] cherche toujours à étendre son influence dans la sphère européenne, et nous souhaitons moderniser notre force aérienne. Nous pouvons accéder à leur expertise industrielle moyennant quelques concessions politiques."

AUS_innsbruck_airbase_project:0 "Projet de base aérienne d’Innsbruck"
AUS_innsbruck_airbase_project_desc:0 "L’aéroport d’Innsbruck est situé dans une grande vallée, idéale pour le décollage des avions de guerre et civils. Le transformer en aérodrome militaire le rendra plus adapté à nos besoins."
AUS_innsbruck_airbase_project_tt:0 "Ajouter §Y2 forts terrestres§! à Innsbruck."

AUS_protect_our_skies:0 "Protéger nos cieux"
AUS_protect_our_skies_desc:0 "Le vol était autrefois une nouveauté, mais les avions ont changé, et la guerre aéronautique aussi. Nous ne pouvons ignorer les menaces venues du ciel – il nous faut donc nous préparer en conséquence."
AUS_protect_our_skies_tt:0 "Ajouter §Y2 Anti-Aérien§! à tous les territoires contrôlés de l’Autriche-Hongrie."

AUS_fortify_our_airfields:0 "Fortifier nos aérodromes"
AUS_fortify_our_airfields_desc:0 "Aucune de nos bases aériennes n’est très en profondeur dans nos frontières, et nous ne pouvons exclure une frappe ciblée qui en capturerait une. Les fortifier toutes deux réduira ce risque."
AUS_fortify_our_airfields_tt:0 "Ajouter §Y2 forts terrestres§! aux aérodromes autrichiens."

AUS_investigate_jet_technology:0 "Rechercher la technologie des réacteurs"
AUS_investigate_jet_technology_desc:0 "Notre département d’ingénierie signale un nouveau moteur à turbine à réaction théorique capable de produire des avions plus rapides, plus hauts et plus éloignés que jamais. Si une recherche peut nous donner un avantage tactique, nous la poursuivrons."

AUS_experimental_bomber_programme:0 "Programme expérimental de bombardiers"
AUS_experimental_bomber_programme_desc:0 "Les plans théoriques de la prochaine génération de bombardiers sont déjà prêts, ce qui nous donnera un avantage dans les guerres à venir. Il nous suffit d’allouer des fonds pour le prototypage afin de lancer ce programme."

AUS_establish_the_austrian_airforce_academy:0 "Créer l’Académie de l’Air [AUS.GetAdjective]"
AUS_establish_the_austrian_airforce_academy_desc:0 "Notre jeune force aérienne se développe bien, mais si notre technologie est correcte, notre formation laisse à désirer. Nous pouvons y consacrer des ressources et n’avons aucune excuse pour ne pas le faire."

#NAVY

AUS_repair_pola_naval_base:0 "Réparer la base navale de Pola"
AUS_repair_pola_naval_base_desc:0 "La base navale de Pola fut autrefois l’une des principales installations de la Kriegsmarine autrichienne. Depuis que nous avons été chassés de la mer, elle est tombée en ruine, mais nous pouvons et devons mettre tout en œuvre pour la rendre à nouveau utilisable."

AUS_recreate_the_kuk_kriegsmarine:0 "Recréer la K.u.K Kriegsmarine"
AUS_recreate_the_kuk_kriegsmarine_desc:0 "La Marine de guerre royale et impériale était la flotte autrichienne jusqu’à ce que nous perdions l’accès à la mer après la Grande Guerre. Nous pouvons lui rendre sa gloire passée avec un effort conséquent."

AUS_acquire_skoda_naval_artillery_experience:0 "Acquérir l’expérience navale de Škoda"
AUS_acquire_skoda_naval_artillery_experience_desc:0 "Škoda a conçu les canons de la marine austro-hongroise ; il est temps de remettre cette expertise à profit."

AUS_rijeka_naval_academy:0 "Académie navale de Rijeka"
AUS_rijeka_naval_academy_desc:0 "Rijeka est l’une des plus grandes villes portuaires de la région croate et l’un des atouts navals majeurs pour la cause austro-hongroise. Habituée à la navigation et à la guerre navale, elle peut nous transmettre son savoir-faire."

AUS_trieste_shipyards:0 "Chantiers navals de Trieste"
AUS_trieste_shipyards_desc:0 "Trieste est une ville possédant déjà une industrie de construction navale que nous devrions subventionner et exploiter. Cela nous permettra d’assurer notre domination en Méditerranée."
AUS_trieste_shipyards_tt:0 "Permet l’embauche du concepteur naval « Chantiers navals de Trieste ».\n"

AUS_expand_cattaro_harbour:0 "Agrandir le port de Cattaro"
AUS_expand_cattaro_harbour_desc:0 "Cattaro est une baie intérieure, un lieu abrité où une flotte pourrait être stationnée en sécurité. C’est un atout stratégique naturel, et nous devons le traiter comme tel. Notre prochaine expansion se fera ici."

AUS_a_stealthier_approach:0 "Une approche plus discrète"
AUS_a_stealthier_approach_desc:0 "La marine [AUS.GetAdjective] n’est plus ce qu’elle était – en réalité, elle n’existe plus. Nous ne pouvons pas consacrer des ressources massives à des navires qui seraient simplement détruits par des forces supérieures. Une guerre sous-marine plus furtive est notre avenir."

AUS_sieze_the_adriatic:0 "S’emparer de l’Adriatique"
AUS_sieze_the_adriatic_desc:0 "L’Adriatique est l’un de nos principaux points d’accès vers la péninsule italienne et l’un des tronçons de côte les plus stratégiques de notre territoire. La sécuriser avec des navires spécialisés pour mers intérieures, comme les croiseurs, serait judicieux."

AUS_push_for_the_mediterranean:0 "Percée vers la Méditerranée"
AUS_push_for_the_mediterranean_desc:0 "La Méditerranée est une mer historique, soutien et berceau de nombreux empires africains et européens. Elle redeviendra le berceau de notre nation – si nous parvenons à la sécuriser."

AUS_reform_the_kuk_seefliegerkorps:0 "Réformer le Seefliegerkorps"
AUS_reform_the_kuk_seefliegerkorps_desc:0 "L’aéronavale autrichienne était distincte de la flotte principale, avec ses spécialisations et fonctions propres. Son utilité sera précieuse à l’avenir – nous devons investir dans sa réforme."

AUS_found_the_austrian_marines:0 "Fonder les Marines [AUS.GetAdjective]"
AUS_found_the_austrian_marines_desc:0 "Depuis que nous sommes enclavés, un corps de notre armée tombé dans un état de négligence inacceptable est celui de nos marines. Nous pouvons réparer les dégâts avec un financement et un peu de temps."

# MILITARY

AUS_rearm_the_bundesheer:0 "Réarmer le Bundesheer"
AUS_rearm_the_bundesheer_desc:0 "Les forces armées autrichiennes ont été durement touchées par le traité de Saint-Germain-en-Laye. Mais avec [GER.GetLeader] préparant ses troupes, il n’y a jamais eu de meilleur moment pour nous réarmer, que nous soyons avec ou contre lui."

AUS_cement_the_jansa_plan:0 "Consolider le plan Jansa"
AUS_cement_the_jansa_plan_desc:0 "Le maréchal Alfred Jansa a présenté un plan brillant pour se défendre contre une invasion allemande. Nous devons lui donner toutes les ressources nécessaires pour se préparer."

AUS_fortify_river_traun:0 "Fortifier la rivière Traun"
AUS_fortify_river_traun_desc:0 "La rivière Traun est idéalement placée pour défendre Vienne. Nous devons la fortifier conformément aux recommandations du maréchal Jansa."

AUS_defence_focus:0 "Priorité à la défense"
AUS_defence_focus_desc:0 "Notre nation est petite. Nous devons penser à tenir la ligne avant d’envisager l’attaque."

AUS_continue_choke_fortifications:0 "Poursuivre les fortifications des points de passage"
AUS_continue_choke_fortifications_desc:0 "Notre pays possède de nombreux points d’étranglement que nous pouvons exploiter pour défendre notre territoire. Nous devrions les fortifier pour les rendre imprenables."

AUS_home_defense:0 "Défenses aériennes de [AUS.GetCapital.GetCapitalVictoryPointName]"
AUS_home_defense_desc:0 "Nous devons admettre que nous ne pouvons pas rivaliser avec la force aérienne ennemie dans les cieux. Il faut donc construire des défenses anti-aériennes au sol pour protéger notre ville."

AUS_artillery_modernization:0 "Modernisation de l’artillerie"
AUS_artillery_modernization_desc:0 "L’artillerie s’est imposée comme la reine de la guerre moderne. Nous devons nous assurer de ne pas rester à la traîne dans ses améliorations."

AUS_artillery_supremacy:0 "La reine des batailles"
AUS_artillery_supremacy_desc:0 "Ce n’est qu’en ayant une artillerie supérieure à celle de l’ennemi que nous pourrons faire pleuvoir l’enfer sur ses soldats et remporter la victoire."

AUS_restart_steyr:0 "Commander des armes à Steyr"
AUS_restart_steyr_desc:0 "Steyr, le plus grand producteur d’armes de notre pays, a prouvé son engagement envers les conceptions modernes avec l’introduction du MP-34. Leur commander de nouvelles conceptions d’armes profiterait grandement à notre armée."

AUS_tried_and_tested:0 "Éprouvé et approuvé"
AUS_tried_and_tested_desc:0 "La véritable guerre d’infanterie a été testée et éprouvée depuis des siècles. Il n’y a aucune raison de s’en écarter, puisqu’elle a fait ses preuves."

AUS_alpine_warfare:0 "Guerre alpine"
AUS_alpine_warfare_desc:0 "Nous devons exploiter nos atouts en formant nos troupes à bien combattre dans le relief accidenté des Alpes, afin de l’utiliser comme barrière naturelle contre les attaques."

AUS_anti_tank_infantry:0 "Infanterie Anti-Chars"
AUS_anti_tank_infantry_desc:0 "Notre industrie est trop petite pour produire des chars, mais nous pouvons toujours freiner l'ennemi en équipant notre infanterie d'armes efficaces pour les combattre."

AUS_combat_engineering:0 "Génie de Combat"
AUS_combat_engineering_desc:0 "En soutenant nos unités avec des ingénieurs de combat, nous pouvons accroître leur efficacité sur le champ de bataille."

AUS_found_the_jagdkommando_school:0 "Créer l'École Jagdkommando"
AUS_found_the_jagdkommando_school_desc:0 "Des plans ont été élaborés pour former une unité de forces spéciales composée de nos meilleurs soldats, capable d'opérer derrière les lignes ennemies. Tout ce qu'il leur faut, c'est un financement pour être opérationnelle."

AUS_fund_the_gebirgsjaeger_programme:0 "Financer le Programme Gebirgsjäger"
AUS_fund_the_gebirgsjaeger_programme_desc:0 "Notre territoire est montagneux, et nous devons nous adapter à ce que la nature nous a donné. Quiconque attaquera notre territoire trouvera nos forces très bien équipées pour le terrain."

AUS_abandon_jansa_plan:0 "Abandonner le Plan Jansa"
AUS_abandon_jansa_plan_desc:0 "Pour que notre armée entre dans l'ère moderne, nous devons abandonner les plans de défense statiques et rendre notre armée aussi flexible que possible."

AUS_manoeuvre_warfare:0 "Guerre de Manœuvre"
AUS_manoeuvre_warfare_desc:0 "La guerre a changé, et nous devons changer avec elle. La clé de la victoire dans une guerre moderne est une attaque rapide et puissante, pas l'attente passive !"

AUS_mechanization_research:0 "Recherche sur la Mécanisation"
AUS_mechanization_research_desc:0 "En transportant notre infanterie dans des véhicules blindés, nous réduisons le risque d'attaques pendant leurs déplacements."

AUS_doctrine_innovation:0 "Innovation Doctrine"
AUS_doctrine_innovation_desc:0 "Nous devons former une nouvelle doctrine pour la guerre moderne, basée sur la vitesse et la manœuvrabilité."

AUS_motorization_effort:0 "Effort de Motorisation"
AUS_motorization_effort_desc:0 "En motorisant notre armée et notre logistique, nous pouvons grandement améliorer l'efficacité de nos forces."

AUS_mechanized_army:0 "Armée Mécanisée"
AUS_mechanized_army_desc:0 "La mécanisation de notre armée a considérablement augmenté la puissance de notre infanterie mobile."

AUS_rocket_innovations:0 "Innovations en Fusées"
AUS_rocket_innovations_desc:0 "La technologie des fusées est toute nouvelle, mais peut avoir un effet dévastateur. Nous devrions nous y intéresser."

AUS_local_tank_research:0 "Recherche Locale sur les Blindés"
AUS_local_tank_research_desc:0 "Bien que notre industrie soit petite, cela ne nous empêche pas de nous pencher sur une production locale limitée de chars."

AUS_radio_improvements:0 "Améliorations Radio"
AUS_radio_improvements_desc:0 "En équipant nos unités de nouvelles radios, nous pouvons améliorer leur organisation et leurs communications."

AUS_modernize_officer_training:0 "Moderniser la Formation des Officiers"
AUS_modernize_officer_training_desc:0 "Une grande partie de la formation des officiers est encore héritée de la Grande Guerre et de l'ancien empire. Nous devrions la réformer pour être prêts pour la nouvelle ère."

AUS_shock_troop_offensive:0 "Offensive des Troupes d'Assaut"
AUS_shock_troop_offensive_desc:0 "Vers la fin de la Grande Guerre, nos alliés allemands ont utilisé les troupes d'assaut avec grand succès. Nous devrions apprendre d'eux."

AUS_liechtenstein_treaty:0 "Traité du Liechtenstein"
AUS_liechtenstein_treaty_desc:0 "[GER.GetNameDefCap] n'est plus une puissance mondiale responsable dirigée par un Kaiser fort et stable. À la place, le fou [GER.GetLeader] menace toute l'Europe avec ses politiques expansionnistes. [AUS.GetNameDefCap] doit chercher tous les alliés possibles pour survivre - [SWI.GetNameDef] inclus."

AUS_intervention:0 "Intervention Continentale"
AUS_intervention_desc:0 "Le continent est au bord du précipice, et nous devons agir pour lutter contre le nazisme et le bolchevisme, sous peine d'être engloutis."

# ECONOMIE
AUS_end_the_depression:0 "Mettre fin à la Dépression"
AUS_end_the_depression_desc:0 "Le pire de la dépression est derrière nous. Nous devrions prendre la dernière étape pour en annuler les effets."

AUS_subsidize_kapsch:0 "Subventionner Kapsch"
AUS_subsidize_kapsch_desc:0 "Nous devrions subventionner les entreprises électroniques comme Kapsch pour propulser notre nation dans l'ère technologique."

AUS_expand_vienna_university:0 "Étendre l'Université de Vienne"
AUS_expand_vienna_university_desc:0 "L'université de Vienne est l'une des plus prestigieuses d'Europe. Nous devons l'étendre pour former une nouvelle génération d'esprits brillants."

AUS_strabag_construction:0 "Projets de Construction STRABAG"
AUS_strabag_construction_desc:0 "En confiant à STRABAG nos projets de construction, nous pouvons accélérer l'expansion de notre industrie."

AUS_mixed_economy:0 "Politique Économique Mixte"
AUS_mixed_economy_desc:0 "Nous devrions travailler à une économie mixte qui sert le peuple et répond à ses besoins. Seul un équilibre entre marché et protection sociale peut garantir notre stabilité."

AUS_subsidies_for_farmers:0 "Subventions aux Agriculteurs"
AUS_subsidies_for_farmers_desc:0 "Certains agriculteurs ont été pénalisés par l'expansion industrielle rapide. Nous devons veiller à leurs besoins, car nous dépendons d'eux."

AUS_industry_nationalizations:0 "Nationaliser STRABAG"
AUS_industry_nationalizations_desc:0 "En nationalisant STRABAG, nous pouvons le placer sous contrôle gouvernemental et libérer des ressources pour d'autres entreprises."

AUS_urban_industry_expansion:0 "Usines à Vienne"
AUS_urban_industry_expansion_desc:0 "Nous devons étendre notre industrie dans les zones urbaines, où vivent la majorité des travailleurs."

AUS_fund_public_infrastructure:0 "Expansion des Infrastructures Nationales"
AUS_fund_public_infrastructure_desc:0 "Pour que notre population puisse se déplacer efficacement, nous devrions développer routes et transports dans tout le pays."

AUS_invite_scientists:0 "Inviter des Scientifiques Étrangers"
AUS_invite_scientists_desc:0 "Notre nation doit être un phare d'éducation et de recherche scientifique. Pour cela, nous devrions inviter des scientifiques du monde entier à nous aider."

AUS_suburban_development_plan:0 "Plan de Développement Suburbain"
AUS_suburban_development_plan_desc:0 "Avec l'expansion récente des infrastructures autour de nos grandes villes, nous devons développer de nouveaux terrains pour soutenir l'économie des banlieues."

AUS_graz_industry_expansion:0 "Expansion Industrielle à Graz"
AUS_graz_industry_expansion_desc:0 "Nos territoires du sud accusent du retard industriel. Nous devrions lancer des projets de construction pour y remédier."

AUS_the_corporate_model:0 "Le Modèle Corporatif"
AUS_the_corporate_model_desc:0 "La seule façon de progresser est de suivre l'exemple de Mussolini en organisant la société en groupes servant nos intérêts communs."

AUS_mixed_industrial_development:0 "Développement Industriel Mixte"
AUS_mixed_industrial_development_desc:0 "Nous ne devons pas pencher trop d'un côté. Une industrie civile forte est importante, mais notre nation doit pouvoir se défendre."

AUS_farmers_to_factories:0 "Des Fermiers aux Usines"
AUS_farmers_to_factories_desc:0 "Nous ne pouvons plus compter sur les anciennes provinces pour nos besoins industriels. Il faut transférer les fermiers vers les usines."

AUS_factories_in_countryside:0 "Usines à la Campagne"
AUS_factories_in_countryside_desc:0 "Construire des usines dans les zones rurales pourrait élargir notre main-d'œuvre en offrant du travail aux populations rurales."

AUS_empower_private_enterprises:0 "Renforcer les Grandes Entreprises"
AUS_empower_private_enterprises_desc:0 "Renforcer les grandes entreprises permet de mieux contrôler l'économie en travaillant avec moins de sociétés individuelles."

AUS_shift_strabag:0 "Réorienter STRABAG"
AUS_shift_strabag_desc:0 "Nous pouvons mieux utiliser STRABAG en orientant ses projets vers la construction militaire."

AUS_commit_to_autarky:0 "S'engager vers l'autarcie"
AUS_commit_to_autarky_desc:0 "Nous sommes entourés d'ennemis et ne pouvons dépendre que de nous-mêmes. Pour survivre, nous devons devenir totalement autosuffisants."

AUS_fund_coal_industries:0 "Développer les mines de charbon d'Ampflwang"
AUS_fund_coal_industries_desc:0 "Financer les industries charbonnières nous rendra indépendants énergétiquement et stimulera notre économie."

AUS_military_industrial_funding:0 "Expansion militaire de Vienne"
AUS_military_industrial_funding_desc:0 "Financer notre complexe militaro-industriel est nécessaire pour produire notre propre équipement et ne pas dépendre des importations d'autres nations."

AUS_salzburg_military_hub:0 "Hub militaire de Salzbourg"
AUS_salzburg_military_hub_desc:0 "La position centrale de Salzbourg dans notre pays en fait un excellent emplacement pour un hub militaire."

AUS_steel_industry_funds:0 "Développer l'industrie sidérurgique de Linz"
AUS_steel_industry_funds_desc:0 "Notre pays a besoin de plus d'acier pour fabriquer davantage d'armes. Nous devons étendre nos industries sidérurgiques existantes pour soutenir cette expansion."

AUS_local_weapons_manufacturing:0 "Production massive d'armes"
AUS_local_weapons_manufacturing_desc:0 "Nous devons accélérer la production d'armes – le temps presse et nous ne sommes pas préparés."

#POLITICS
AUS_clock_ticks_down:0 "Le Temps Presse"
AUS_clock_ticks_down_desc:0 "Ça a commencé. Les nazis ont marché sur la Rhénanie, leur premier mépris flagrant officiel du traité de Versailles. Comme ce traité garantit notre indépendance, nous devons trouver un moyen de faire réfléchir les Allemands à deux fois avant qu'ils ne marchent sur notre frontière.\n\nTic, Tac."

AUS_austria_awaken:0 "Autriche, Réveille-toi !"
AUS_austria_awaken_desc:0 "Réveille-toi !\n\nNotre grande Österreich est en grave danger. Nous devons regarder vers l'extérieur et trouver du soutien, de peur que les nazis ne frappent à notre porte."

AUS_look_west:0 "Regarder vers l'Ouest"
AUS_look_west_desc:0 "Bien que nous ayons de bonnes relations avec [ITA.GetNameDef], ils commencent à être trop amicaux avec les nazis, ce qui nous met en danger. Nous devrions plutôt nous tourner vers l'ouest, vers la Grande-Bretagne et la France, qui ne partagent peut-être pas nos idées, mais ne veulent pas voir l'Autriche unie à l'Allemagne autant que nous."

AUS_repeal_party_ban:0 "Annuler l'Interdiction des Partis"
AUS_repeal_party_ban_desc:0 "Depuis la prise de pouvoir du VF, les partis d'opposition ont été interdits pour consolider le pouvoir. Si nous voulons rendre le pays à la démocratie, nous devons abroger cette loi."

AUS_disband_paramilitaries:0 "Dissoudre les Groupes Paramilitaires"
AUS_disband_paramilitaries_desc:0 "Pour stabiliser la nation, nous devons enfin dissoudre les nombreux groupes paramilitaires existants. Ils ne servent qu'à déstabiliser notre pays."

AUS_reorganize_the_right:0 "Réorganiser la Droite"
AUS_reorganize_the_right_desc:0 "Les élections approchent, et pour gagner, nous devons réorganiser notre parti pour toucher une base plus large."

AUS_return_otto_bauer:0 "Retourner Otto Bauer de l'Exil"
AUS_return_otto_bauer_desc:0 "Otto Bauer est un socialiste autrichien bien connu et membre de longue date du Parti social-démocrate. Exilé depuis la prise de pouvoir du VF, beaucoup souhaitent son retour pour restaurer la démocratie. Cependant, certains ne lui font pas confiance à cause de sa position pro-unification avec l'Allemagne, mais cela est-il vraiment crucial ?"

AUS_begin_election_campaigns:0 "Lancer les Campagnes Électorales"
AUS_begin_election_campaigns_desc:0 "Il est temps. Après avoir enfin restauré le régime démocratique, nous commencerons à faire campagne pour nos premières élections."

AUS_sdapo_victory:0 "Victoire du SDAPÖ"
AUS_sdapo_victory_desc:0 "Enfin, le SDAPÖ sort victorieux des élections. Nous pouvons désormais travailler à une Autriche libre et égalitaire !"

AUS_bauer_government:0 "Le Cabinet de Bauer"
AUS_bauer_government_desc:0 "La seule voie est de laisser Otto Bauer diriger notre gouvernement vers l'avenir. Sa passion pour les idéaux socialistes fera avancer la nation."

AUS_restart_linz_program:0 "Un Nouveau Programme de Linz"
AUS_restart_linz_program_desc:0 "Le programme de Linz de 1926 est terminé, mais ensemble, nous pouvons unir et former un nouvel esprit national pour effacer les conflits du passé."

AUS_democracy_of_the_proletariat:0 "Démocratie du Prolétariat"
AUS_democracy_of_the_proletariat_desc:0 "Notre nation doit devenir une société où tous sont égaux, libres de toute oppression."

AUS_revive_the_schutzbund:0 "Raviver le Schutzbund"
AUS_revive_the_schutzbund_desc:0 "Le Republikaner Schutzbund, qui a courageusement défendu notre démocratie en 1934, a été dissous après la guerre civile. Nous devons le raviver pour protéger notre démocratie."

AUS_healthcare_subsidization:0 "Subventions pour la Santé"
AUS_healthcare_subsidization_desc:0 "Nous devons garantir à chaque personne de notre nation l'accès aux soins de santé si nous voulons réaliser notre vision d'une grande Autriche."

AUS_reverse_brain_drain:0 "Inverser la Fuite des Cerveaux"
AUS_reverse_brain_drain_desc:0 "De nombreux esprits brillants ont été contraints de quitter notre nation à cause du gouvernement fasciste. Nous devons les ramener pour permettre à notre pays de se développer."

AUS_public_housing_programs:0 "Plan National du Logement"
AUS_public_housing_programs_desc:0 "Dans de nombreuses régions, les travailleurs ne trouvent pas de logement adéquat et vivent dans des espaces exigus. Nous devons corriger cette injustice."

AUS_democracy_worth_defending:0 "Une Démocratie qui Vaut la Peine"
AUS_democracy_worth_defending_desc:0 "Après avoir perdu notre démocratie une fois, nous ne pouvons plus être apathiques. Chaque citoyen doit comprendre son devoir de défendre sa liberté, son foyer et sa patrie."

AUS_the_three_arrows:0 "Les Trois Flèches"
AUS_the_three_arrows_desc:0 "Nous avons réussi à libérer notre pays, mais nous devons maintenant nous tenir unis contre tous les totalitaires du monde."

AUS_strike_the_heart:0 "Frapper le Cœur"
AUS_strike_the_heart_desc:0 "Le fascisme a commencé en Italie et s'est depuis répandu à de nombreuses nations. Nous devons frapper à la source et le détruire une fois pour toutes."

AUS_stop_the_spread:0 "Arrêter la Propagation"
AUS_stop_the_spread_desc:0 "Nos voisins ont été pris par des tyrans fascistes. Il est de notre devoir de les libérer."

AUS_remember_red_vienna:0 "Souvenir de Vienne Rouge"
AUS_remember_red_vienna_desc:0 "Vienne Rouge, cœur battant du socialisme autrichien, fut autrefois une grande utopie de la Première République. Nous devons raviver cet esprit pour propulser la ville et notre pays tout entier !"

AUS_equal_rights_women:0 "Révolution des Femmes"
AUS_equal_rights_women_desc:0 "Cette révolution sociale ne concerne pas seulement les hommes, mais toute la société. Intégrer les femmes dans l'armée et le travail augmentera considérablement nos capacités."

AUS_renner_government:0 "Coalition de Renner"
AUS_renner_government_desc:0 "Otto Bauer a un bon esprit, mais il est trop ambitieux. Karl Renner peut nous mener vers un futur de prospérité et de pragmatisme."

AUS_toe_the_line:0 "Respecter la Ligne"
AUS_toe_the_line_desc:0 "Nous avons besoin d'unité, pas de division. Nous ne pouvons pas être trop radicaux dans notre approche."

AUS_national_unity_government:0 "Gouvernement d'Unité Nationale"
AUS_national_unity_government_desc:0 "Les menaces sont nombreuses, et nous ne pouvons pas perdre de temps sur des querelles internes. Nous devons former un gouvernement d'unité nationale pour protéger le peuple autrichien."

AUS_remove_miklas:0 "Écarter Miklas"
AUS_remove_miklas_desc:0 "Le président Wilhelm Miklas est resté passif lorsque Dolfuss a détruit la Première République, n'utilisant aucun de ses pouvoirs pour l'arrêter. Il a manqué à son devoir et doit être retiré du pouvoir."

AUS_compromise_miklas:0 "Compromis avec Miklas"
AUS_compromise_miklas_desc:0 "Même si nous ne sommes pas d'accord avec lui, le président Miklas doit rester au pouvoir pour maintenir la paix. Nous devons plutôt le pousser à soutenir notre gouvernement."

AUS_proclaim_the_second_republic:0 "Proclamer la Seconde République"
AUS_proclaim_the_second_republic_desc:0 "Après de nombreuses épreuves, l'Autriche a tenu bon face aux nazis, fascistes et communistes. Aujourd'hui, nous pouvons être fiers de notre nouvelle république, pour tous ceux qui n'ont pu voir son retour."

AUS_bring_in_left:0 "Intégrer la Gauche"
AUS_bring_in_left_desc:0 "Nous devons intégrer davantage l'aile gauche de notre parti pour éviter le fractionnement et promouvoir l'unité."

AUS_compromise_with_conservatives:0 "Compromis avec les Conservateurs"
AUS_compromise_with_conservatives_desc:0 "Bien que rivaux, certains conservateurs sont prêts à coopérer pour atteindre des objectifs communs."

AUS_reform_education_system:0 "Réformes Éducatives Universelles"
AUS_reform_education_system_desc:0 "Nous devons donner à chaque esprit brillant les ressources nécessaires pour réussir, afin que la prochaine génération soit éduquée et productive."

AUS_proletarians_of_today:0 "Les Prolétaires d'Aujourd'hui"
AUS_proletarians_of_today_desc:0 "Chaque homme et femme de la République autrichienne doit défendre son foyer.\n\nEt nous nous demandons : sommes-nous des hommes, les prolétaires d'aujourd'hui sont-ils encore des moutons que l'on peut conduire à l'abattoir ?"

AUS_land_reform:0 "Réformes Agraires"
AUS_land_reform_desc:0 "Réformer le système foncier aidera les communautés agricoles pauvres et améliorera l'autosuffisance de la nation."

AUS_defence_of_the_republic:0 "Défense de la République"
AUS_defence_of_the_republic_desc:0 "Karl Renner, père de notre république, nous a menés vers la paix et la stabilité. Les épreuves ont été difficiles, mais nous pouvons lui faire confiance pour l'avenir."

AUS_father_of_republic:0 "Père de la République"
AUS_father_of_republic_desc:0 "Depuis la Première République, Karl Renner a montré son dévouement pour établir une république autrichienne bénéfique pour tous les citoyens. Le Père de notre république doit être reconnu."

AUS_dismantle_corporatism:0 "Démanteler le corporatisme"
AUS_dismantle_corporatism_desc:0 "Des éléments du système corporatiste des fascistes subsistent encore. Ils doivent être détruits et remplacés par des institutions au service de l’homme du peuple."

AUS_strike_the_snake:0 "Décapiter le serpent"
AUS_strike_the_snake_desc:0 "Assez attendu. Ensemble, nous pouvons renverser le gouvernement d’Hitler une bonne fois pour toutes."

AUS_danubian_economic_alliance:0 "Alliance économique danubienne"
AUS_danubian_economic_alliance_desc:0 "Tendre la main aux nations amies de notre voisinage et établir des liens économiques avec elles nous aiderait grandement à sortir de la crise économique dans laquelle nous nous trouvons."

AUS_danubian_defensive_pact:0 "Entente danubienne"
AUS_danubian_defensive_pact_desc:0 "Plutôt que de nous allier à l’Ouest, nous pourrions former une entente danubienne pour servir de rempart contre les grandes puissances européennes."

AUS_bolshevik_reconciliation:0 "Réconciliation bolchévique"
AUS_bolshevik_reconciliation_desc:0 "Bien que notre parti se soit parfois opposé au gouvernement de Moscou, nous voyons désormais qu’il est le véritable champion du socialisme en Europe, et nous devons donc nous allier avec lui pour libérer le continent."

AUS_realize_unity:0 "Réaliser notre unité"
AUS_realize_unity_desc:0 "L’Autriche seule n’est rien. Nous devons réaliser notre grande unité allemande avec nos voisins du nord, et assumer notre responsabilité de les libérer de leur gouvernement totalitaire."

AUS_arm_german_resistance:0 "Armer la résistance allemande"
AUS_arm_german_resistance_desc:0 "Il existe encore de nombreux groupes armés en Allemagne opposés au régime totalitaire actuel. Nous devons leur envoyer du soutien pour qu’ils soient prêts lorsque viendra le moment de frapper."

AUS_for_a_free_germany:0 "Unité, Justice, Liberté"
AUS_for_a_free_germany_desc:0 "Le moment est venu. Nous ne devons pas oublier ce qui nous anime en tant que peuple : l’attachement à une nation juste, libre et unie pour tous les Allemands."

AUS_negotiate_reunification:0 "Négocier la réunification"
AUS_negotiate_reunification_desc:0 "Une fois les nazis renversés, nous devons entamer des négociations de réunification avec le nouveau gouvernement allemand. Rien ne peut nous empêcher de réaliser une grande Allemagne unifiée."

AUS_join_the_west:0 "Rejoindre l’Ouest"
AUS_join_the_west_desc:0 "Si nous voulons être protégés contre la tempête à venir, nous devons rejoindre les alliés occidentaux dans leur lutte."

AUS_support_the_bauernbund:0 "Soutenir le Bauernbund"
AUS_support_the_bauernbund_desc:0 "Soutenir les syndicats agricoles de notre nation, comme le Bauernbund, augmenterait grandement notre popularité auprès des électeurs ruraux."

AUS_landbund_support:0 "Inviter les ministres du Landbund"
AUS_landbund_support_desc:0 "De nombreux membres du Landbund pourraient être de précieux conseillers dans notre cabinet. Nous devrions les inviter à rejoindre notre gouvernement."

AUS_cs_victory:0 "Victoire du CSP"
AUS_cs_victory_desc:0 "Avec un peu de « guidance », le Christlichsoziale Partei est sorti victorieux des élections, et nous pouvons poursuivre notre travail pour faire de l’Autriche un grand État catholique."

AUS_crush_heimwehr_remnants:0 "Écraser les restes du Heimwehr"
AUS_crush_heimwehr_remnants_desc:0 "Le Heimwehr reste une force influente dans notre pays, et nous devons réduire son influence si nous voulons que notre cause réformiste gagne du terrain."

AUS_reform_the_sturmscharen:0 "Réformer les Sturmscharen"
AUS_reform_the_sturmscharen_desc:0 "Le dirigeant réformiste Leopold Figl est également commandant des Sturmscharen de Basse-Autriche. Il pourrait utiliser son influence dans l’organisation pour la rallier progressivement à la cause réformiste, nous offrant ainsi une précieuse influence sur les forces paramilitaires du pays."

AUS_empower_the_economic_council:0 "Renforcer le Conseil économique"
AUS_empower_the_economic_council_desc:0 "De nombreux membres du Conseil économique fédéral soutiennent notre cause réformiste. Leopold Figl devrait utiliser son influence pour leur rallier un soutien, afin de renforcer le mouvement réformiste."

AUS_miklas_support:0 "Influencer Miklas"
AUS_miklas_support_desc:0 "Le président Wilhelm Miklas est peut-être un lâche sans colonne vertébrale, mais il est au moins sympathique à notre cause. Le convaincre de soutenir nos efforts pourrait constituer un solide atout politique."

AUS_oust_schuschnigg:0 "Motion de censure"
AUS_oust_schuschnigg_desc:0 "Le moment est venu. Nous avons réuni assez de pouvoir politique et de soutien au sein du CSP pour demander une motion de censure contre le chancelier Schuschnigg. Enfin, nous pouvons remodeler l’Autriche pour en faire la grande nation démocratique et conservatrice qu’elle pourrait être."

AUS_economic_liberalization:0 "Libéralisation économique"
AUS_economic_liberalization_desc:0 "L'État corporatiste a été un désastre pour notre économie. Nous devons œuvrer à instaurer une économie de marché libre afin de stimuler la croissance de notre nation."

AUS_grand_coalition:0 "Une grande coalition"
AUS_grand_coalition_desc:0 "Pour éviter que ne reprennent les luttes internes qui ont miné la Première République, nous devons coopérer avec le SDAPÖ et former une grande coalition pour faire avancer notre nation. Ensemble seulement, nous pouvons défendre l’Autriche contre les menaces extérieures."

AUS_impede_socialists:0 "Entraver les partis socialistes"
AUS_impede_socialists_desc:0 "Les partis socialistes menacent notre stabilité. Nous devons freiner leurs efforts pour s’emparer du pouvoir afin de consolider notre autorité."

AUS_austrian_catholic_identity:0 "Identité catholique autrichienne"
AUS_austrian_catholic_identity_desc:0 "Le destin de l’Autriche lui est propre, distinct de celui des protestants du nord. Nous sommes un peuple à part, uni par nos croyances catholiques, prêt à se tenir debout dans la famille des nations."

AUS_destroy_dolfuss_legacy:0 "Dénoncer l’héritage de Dolfuss"
AUS_destroy_dolfuss_legacy_desc:0 "La prise de pouvoir d’Engelbert Dolfuss est la raison pour laquelle nous en sommes là aujourd’hui. Sa quête de pouvoir a presque mené l’Autriche sur une voie sombre. Il doit être rappelé comme un dictateur et une tache sur notre histoire."

AUS_preserve_dolfuss_legacy:0 "Préserver l’héritage de Dolfuss"
AUS_preserve_dolfuss_legacy_desc:0 "Engelbert Dolfuss fut un héros et un véritable dirigeant qui sauva la nation de l’emprise allemande. Il doit être reconnu comme le fondateur de l’Autriche moderne et son héritage préservé."

AUS_austria_alone:0 "L’Autriche seule"
AUS_austria_alone_desc:0 "Bien que nous ne soyons plus aussi puissants qu’autrefois, l’Autriche se tient fièrement comme nation indépendante, capable de se défendre sans céder aux grandes puissances."

AUS_work_with_heimwehr:0 "Utiliser les restes de la Heimwehr"
AUS_work_with_heimwehr_desc:0 "Les restes de la Heimwehr pourraient être intégrés à notre parti, affaiblissant le parlement et la cause réformiste."

AUS_appoint_loyal_judges:0 "Nommer des juges loyaux"
AUS_appoint_loyal_judges_desc:0 "Pour sécuriser les tribunaux, nous devons utiliser notre pouvoir afin de nommer des juges fidèles qui renforceront notre influence dans le pays."

AUS_exploit_constitutional_loopholes:0 "Exploiter les failles constitutionnelles"
AUS_exploit_constitutional_loopholes_desc:0 "La nation est toujours officiellement régie par la Constitution de mai 1934. De nombreuses failles nous permettent de réduire l’influence politique des réformistes."

AUS_depose_miklas:0 "Déposer Miklas"
AUS_depose_miklas_desc:0 "Miklas a été un pantin utile, mais son temps est révolu. Il doit être démis de ses fonctions et ses pouvoirs transférés au chancelier."

AUS_constrict_the_parliament:0 "Réduire le Parlement"
AUS_constrict_the_parliament_desc:0 "Grâce à notre influence, nous pouvons enfin réduire la menace que représente le Parlement pour notre pouvoir et ainsi neutraliser l’influence des réformistes, consolidant notre autorité."

AUS_a_good_show:0 "Donner le change"
AUS_a_good_show_desc:0 "Pour conserver le soutien de nos alliés occidentaux, nous devons donner le change et montrer au monde nos soi-disant « réformes »."

AUS_token_constitution_reforms:0 "Réformes constitutionnelles symboliques"
AUS_token_constitution_reforms_desc:0 "Nous devons continuer à sauver les apparences en réformant certains aspects de notre constitution, bien que ces changements ne modifient en rien la structure réelle du pays."

AUS_moderate_restoration:0 "Une restauration modérée"
AUS_moderate_restoration_desc:0 "Ce dont l’Autriche a besoin en ce moment, c’est d’une figure populaire pour l’unir en ces temps troublés. Une restauration modérée d’Otto von Habsbourg est la solution."

AUS_repeal_may_constitution:0 "Abolir la Constitution de mai"
AUS_repeal_may_constitution_desc:0 "La Constitution de mai est une honte pour notre nation. Elle doit être abolie afin d’ouvrir la voie à une nouvelle Autriche démocratique."

AUS_reform_the_bundesheer:0 "Réformer le Bundesheer"
AUS_reform_the_bundesheer_desc:0 "Pour éviter la corruption et les tendances autoritaires dans l’armée, nous devons enquêter sur les officiers suspects."

AUS_minister_reshuffling:0 "Remaniement ministériel"
AUS_minister_reshuffling_desc:0 "En remaniant régulièrement les ministres, nous pouvons éviter qu’ils ne tissent trop de liens et ne deviennent corrompus."

AUS_fight_kaiser_influence:0 "Combattre l’influence du Kaiser"
AUS_fight_kaiser_influence_desc:0 "Le Kaiser est utile comme figure unificatrice, mais sa soif de pouvoir pourrait condamner notre nation une fois de plus. Pour continuer à prospérer, nous devons limiter son autorité."

AUS_use_miklas:0 "Utiliser Miklas"
AUS_use_miklas_desc:0 "Le président Miklas pourrait être un outil utile à nos efforts. Si nous obtenons son soutien, nous accroîtrons considérablement notre influence."

AUS_a_new_austria:0 "Une nouvelle Autriche"
AUS_a_new_austria_desc:0 "L’Autriche de demain ne sera pas celle d’hier. Elle sera une société démocratique et pluraliste où chacun aura sa place et sera traité sur un pied d’égalité. Nous devons garder cet objectif en ligne de mire."

AUS_fall_from_grace:0 "Une chute de grâce"
AUS_fall_from_grace_desc:0 "En contournant les stratagèmes utilisés par le Kaiser, nous avons consolidé notre position comme principale force politique du pays. Nous pouvons désormais avancer vers nos objectifs."

AUS_unite_the_nation:0 "Unir la Nation"
AUS_unite_the_nation_desc:0 "Le moment de l'unité est arrivé. Avec la menace allemande à nos portes, nous devons travailler ensemble pour survivre à la tempête."

AUS_national_defence_effort:0 "Effort de Défense Nationale"
AUS_national_defence_effort_desc:0 "Nous devons mobiliser l'industrie pour être prêts à défendre la nation."

AUS_national_mobilization:0 "Mobilisation Nationale"
AUS_national_mobilization_desc:0 "Nous devons recruter le plus de personnes possible dans l'armée, et rapidement, si nous voulons avoir assez d'hommes pour survivre à l'assaut."

AUS_foreign_arms_purchases:0 "Achats d'Armes Étrangères"
AUS_foreign_arms_purchases_desc:0 "Nos industries peuvent produire beaucoup d'armes, mais il serait judicieux d'acheter aussi du matériel étranger pour renforcer notre stock."

AUS_antifascist_bulwark:0 "Rempart Antifasciste"
AUS_antifascist_bulwark_desc:0 "Ensemble, nous serons un rempart contre la menace fasciste qui nous entoure."
AUS_antifascist_bulwark_ns_target_tt:0 "Bonus d'attaque contre §Yles principaux pays fascistes en Europe§!: §G+10.0%§!\nBonus de défense contre §Yles principaux pays fascistes en Europe§!: §G+10.0%§!"

AUS_strike_the_source:0 "Frapper à la Source"
AUS_strike_the_source_desc:0 "L'Italie n'est pas seulement la source du fascisme, mais détient aussi des terres chères aux Autrichiens. Nous devons libérer notre peuple, et le leur."

AUS_preemptive_strike:0 "Frappe Préventive"
AUS_preemptive_strike_desc:0 "Il n'est pas secret que les Allemands viennent pour nous. Au lieu d'attendre, il est temps de frapper d'abord, et rapidement !"

AUS_south_german_union:0 "Une Union Sud-Allemande"
AUS_south_german_union_desc:0 "Le peuple d'Autriche n'est pas seulement autrichien, mais plutôt sud-allemand, un groupe distinct de catholiques allemands. Nous devons promouvoir cette identité."

AUS_our_own_pact:0 "Notre Propre Pacte"
AUS_our_own_pact_desc:0 "Nous devons abandonner les grandes alliances et former notre propre pacte de défense danubien, pour la protection de toutes les petites nations d'Europe."

AUS_a_danubian_association:0 "Une Association Danubienne"
AUS_a_danubian_association_desc:0 "Notre fraternité avec les nations de l'ancien Empire ne doit pas être oubliée. Nous devrions les contacter et former une association mutuelle avec une politique étrangère unifiée."

AUS_slovenia_for_alliance:0 "La Slovénie pour l'Alliance"
AUS_slovenia_for_alliance_desc:0 "Le peuple slovène est germanique. Nous pourrions conclure un accord avec le gouvernement yougoslave, où nous recevrions la Slovénie en échange de notre protection contre les Italiens."

AUS_invite_hungary:0 "Inviter la Hongrie"
AUS_invite_hungary_desc:0 "Nous devrions inviter la Hongrie à l'association danubienne, pour renforcer notre position."

AUS_topple_hungary:0 "Renverser [HUN.GetLeader]"
AUS_topple_hungary_desc:0 "L'agression [HUN.GetAdjective] dans les Balkans, y compris la revendication de notre territoire légitime, a trop longtemps déstabilisé la région ! Nous devons renverser le gouvernement de [HUN.GetLeader] et installer une administration responsable !"
AUS_rewrite_may_constitution:0 "Réécrire la Constitution de Mai"
AUS_rewrite_may_constitution_desc:0 "En réécrivant simplement la Constitution de Mai, nous pouvons conserver certaines failles bénéfiques pour saisir plus de pouvoir."
AUS_forge_government_ties:0 "Forger des Liens Gouvernementaux"
AUS_forge_government_ties_desc:0 "En forgeant certains liens au sein du gouvernement, nous pourrions obtenir le soutien de ministres utiles."
AUS_negotiate_with_loyal_officers:0 "Négocier avec les Officiers Loyaux"
AUS_negotiate_with_loyal_officers_desc:0 "De nombreux officiers de l'armée soutiennent le Kaiser. Nous pouvons utiliser leur influence pour avancer nos plans."
AUS_austria_first:0 "L'Autriche d'abord"
AUS_austria_first_desc:0 "Assez de faiblesse ! Les Allemands ont essayé de nous éclipser trop longtemps ! L'Autriche sera indépendante, libre de la domination allemande, et retrouvera sa gloire perdue !"
AUS_second_enabling_act:0 "Le Second Acte d'Habilitation"
AUS_second_enabling_act_desc:0 "En exploitant les failles que nous avons créées dans la constitution, nous avons réussi à minimiser l'influence du Parlement. Il est maintenant temps de reprendre la gloire de l'Autriche !"
AUS_cousins_not_brothers:0 "Cousins, pas Frères"
AUS_cousins_not_brothers_desc:0 "La chute de l'Empire austro-hongrois était inévitable, mais nous ne devons pas ignorer la grande amitié entre nos nations. En formant une alliance avec la Hongrie, nous pouvons récupérer ensemble nos terres volées."
AUS_partition_czechoslovakia:0 "Partitionner la Tchécoslovaquie"
AUS_partition_czechoslovakia_desc:0 "La Bohême a longtemps été le cœur industriel de l'Empire autrichien. En partitionnant la Tchécoslovaquie avec la Hongrie, nous pouvons récupérer nos territoires perdus."
AUS_expand_bohemian_industry:0 "Étendre l'industrie bohémienne"
AUS_expand_bohemian_industry_desc:0 "L'industrie bohémienne est vitale pour notre nation et dispose d'une bonne infrastructure pour s'étendre. Nous devrions nous concentrer sur son expansion, ce qui améliorerait probablement aussi l'opinion des locaux sur notre gouvernement."
AUS_integrate_bohemia:0 "Intégrer la Bohême"
AUS_integrate_bohemia_desc:0 "Les Tchèques font partie depuis longtemps du peuple germanique. Nous pouvons les intégrer à nos terres centrales comme signe de fraternité."
AUS_loyalty_for_properties:0 "Restituer les propriétés [LIE.GetAdjective]"
AUS_loyalty_for_properties_desc:0 "Avant l'effondrement de l'Empire austro-hongrois, de nombreux citoyens [LIE.GetAdjective] possédaient des biens en Bohême, confisqués après la création de la République tchécoslovaque. Maintenant que nous contrôlons la Bohême, nous pouvons offrir de les restituer en échange de leur loyauté."
AUS_ally_poland:0 "Allier [POL.GetNameDef]"
AUS_ally_poland_desc:0 "Bien que nous ayons des revendications sur la Pologne, il pourrait être préférable d'abandonner ces terres en échange d'une alliance contre les Allemands."
AUS_claims_on_galicia:0 "Revendiquer la Galicie"
AUS_claims_on_galicia_desc:0 "La Galicie faisait autrefois partie du grand Empire autrichien, notre terre, et nous ne l'abandonnerons pas !"
AUS_avenge_brother_war:0 "Venger la guerre des Frères"
AUS_avenge_brother_war_desc:0 "L'Empire autrichien a été ruiné par la guerre des Frères, détruisant nos chances de devenir l'État allemand dominant. Nous devons venger cette grande injustice !"
AUS_ally_bulgaria:0 "Allier [BUL.GetNameDef]"
AUS_ally_bulgaria_desc:0 "Les Bulgares furent de bons alliés pendant la Grande Guerre. Nous devrions tenter de renouer avec eux."
AUS_ally_yugoslavia:0 "Allier [YUG.GetNameDef]"
AUS_ally_yugoslavia_desc:0 "Nous et les Yougoslaves avons des revendications sur [ITA.GetNameDef]. Former une alliance contre la menace italienne augmenterait nos chances."
AUS_ally_romania:0 "Allier [ROM.GetNameDef]"
AUS_ally_romania_desc:0 "[ROM.GetNameDefCap] est la nation la plus puissante des Balkans. S'allier avec elle renforcerait notre influence."
AUS_the_adriatic_coast:0 "La côte adriatique"
AUS_the_adriatic_coast_desc:0 "Pour dominer l'Adriatique comme autrefois, nous devons reprendre la côte croate à [YUG.GetNameDef] et affirmer notre suprématie."
AUS_italian_reconciliation:0 "Réconciliation italienne"
AUS_italian_reconciliation_desc:0 "Maintenant que les Alliés occidentaux nous ont abandonnés, nous devrions essayer de nous réconcilier avec les Italiens, même si nous revendiquons leurs terres."
AUS_our_western_lands:0 "Traîtres de la Grande Guerre"
AUS_our_western_lands_desc:0 "[ITA.GetNameDefCap] nous a trahis dans notre heure la plus sombre, rejoignant les puissances occidentales malgré notre alliance. Leur trahison et l'occupation de nos territoires centraux ne seront jamais oubliées et ils seront punis !"
AUS_depose_the_imbecile:0 "Déposer l'Imbécile"
AUS_depose_the_imbecile_desc:0 "Miklas n'a été qu'une marionnette de celui qui lui parlait le dernier. Nous devons enfin nous débarrasser de l'imbécile sans colonne vertébrale."
AUS_for_kaiser_and_fatherland:0 "Pour le Kaiser et la Patrie"
AUS_for_kaiser_and_fatherland_desc:0 "C'est une époque de changement en Europe, et la place de [AUS.GetNameDef] sera déterminée par la volonté de l'État et du peuple de se sacrifier. Il est temps que chaque homme valide se lève pour le Kaiser et la Patrie."
AUS_grant_crownland_status:0 "Accorder le statut de Couronne"
AUS_grant_crownland_status_desc:0 "En reprenant des terres pour notre empire, il peut y avoir encore de la résistance parmi la population. Nous pourrions obtenir leur soutien en accordant un statut spécial à certaines régions."
AUS_pressure_for_slovenia:0 "Faire pression pour la Slovénie"
AUS_pressure_for_slovenia_desc:0 "Depuis la dissolution de Venise en tant qu'État, la Slovénie est à nous, et les Slovènes ont toujours voulu faire partie du peuple germanique. Ils sont séparés de nous par le temps, mais nous prouverons au monde que toute différence peut être réconciliée."
AUS_pressure_for_slovenia_tt:0 "§RCela peut provoquer une guerre avec [YUG.GetNameDef].§!"
AUS_crack_down_nazis:0 "Réprimer les éléments nazis"
AUS_crack_down_nazis_desc:0 "Nous devons réprimer les éléments nazis restants pour éviter qu'ils ne soutiennent une réunification avec l'Allemagne."
AUS_bolster_defences:0 "Renforcer la défense nationale"
AUS_bolster_defences_desc:0 "Même avec l'Italie comme protection, une invasion allemande reste possible. Nous devons donc renforcer notre armée pour pouvoir nous défendre."
AUS_crackdown_on_socialists:0 "Réprimer les socialistes"
AUS_crackdown_on_socialists_desc:0 "Nous ne pouvons pas permettre aux socialistes comme le SDAPÖ d'utiliser cette crise pour gagner en influence. Ils doivent être réprimés immédiatement."
AUS_past_glories:0 "Les gloires passées"
AUS_past_glories_desc:0 "Assez de faiblesse ! Les traités qui nous ont affaiblis après la Grande Guerre sont la seule raison pour laquelle nous ne pouvons pas affronter seuls l'Allemagne ! Nous devons réparer cette grande injustice une bonne fois pour toutes !"
AUS_repeal_habsburg_law:0 "Abroger la loi des Habsbourg"
AUS_repeal_habsburg_law_desc:0 "La \"loi des Habsbourg\" signée par le gouvernement républicain illégitime a confisqué les biens et titres des Habsbourg. Cette grande injustice est une tache sur notre nation et doit être annulée !"
AUS_bring_exiled_monarchists:0 "Intégrer le Reichsbund"
AUS_bring_exiled_monarchists_desc:0 "La Ligue impériale des Autrichiens, ou Reichsbund der Österreicher, est une faction monarchiste proche du Front de la Patrie. Les intégrer au gouvernement pourrait renforcer l'influence monarchiste."
AUS_return_of_habsburgs:0 "Retour des Anciens"
AUS_return_of_habsburgs_desc:0 "Les 20 dernières années de gouvernement républicain n'ont apporté que chaos et dépression. Schuschnigg doit démissionner et laisser Otto Von Habsburg revenir diriger la nation. Lui seul peut nous mener à la gloire !"
AUS_the_eisenstadt_conference:0 "La conférence d'Eisenstadt"
AUS_the_eisenstadt_conference_desc:0 "Maintenant que les Habsbourg sont revenus au trône, il est temps de commencer la réunification de notre grand empire. Nous devrions inviter les Hongrois à une conférence pour récupérer ensemble nos terres perdues."
AUS_old_friends_not_forgotten:0 "Les vieux amis ne sont pas oubliés"
AUS_arrest_nazis:0 "Arrêter les propagandistes nazis"
AUS_arrest_nazis_desc:0 "De nombreux éléments des groupes paramilitaires qui s'opposent à notre gouvernement sont soutenus par des propagandistes nazis. Arrêter ces sympathisants pro-allemands réduirait l'influence des paramilitaires, au prix de relations tendues avec l'Allemagne."

AUS_integrate_militias:0 "Intégrer les milices loyales"
AUS_integrate_militias_desc:0 "Intégrer les milices loyales à notre État dans l'armée permettrait de contrer l'influence des paramilitaires anti-gouvernementaux."

AUS_crush_the_heimwehr:0 "Écraser la Heimwehr"
AUS_crush_the_heimwehr_desc:0 "La Heimwehr est l'une des nombreuses milices anti-gouvernementales, mais elle est la plus importante. Avec l'influence que nous avons acquise, nous devons la détruire complètement, ce qui fera plier les autres paramilitaires."

AUS_convince_miklas:0 "Convaincre Miklas"
AUS_convince_miklas_desc:0 "Nous devons convaincre le président Miklas de soutenir notre gouvernement si nous voulons consolider notre pouvoir."

AUS_a_modern_empire:0 "Un empire moderne"
AUS_a_modern_empire_desc:0 "Bien que l'héritage du vieil empire ne doive pas être oublié, nous devons reconnaître les raisons de son effondrement et nous assurer que notre nouvel empire soit adapté à l'époque moderne."

AUS_support_transylvanian_claims:0 "Soutenir les revendications hongroises sur la Transylvanie"
AUS_support_transylvanian_claims_desc:0 "Pour montrer notre bonne volonté envers [HUN.GetNameDef], nous devrions reconnaître leurs revendications sur la Transylvanie et que le peuple hongrois de la région doit être libéré sous domination hongroise."

AUS_transylvanian_independence:0 "Préférer l'autonomie de la Transylvanie"
AUS_transylvanian_independence_desc:0 "Bien que nous reconnaissions la détresse de la population hongroise en Transylvanie, transférer le territoire à [HUN.GetNameDef] n’aboutirait qu’à l’oppression des Roumains. Nous devrions plaider pour une région autonome protégeant Roumains et Hongrois."

AUS_support_croatian_independence:0 "Soutenir l'indépendance croate"
AUS_support_croatian_independence_desc:0 "Le gouvernement instable de [YUG.GetNameDef] nous permet d'exploiter des mouvements séparatistes pour atteindre nos objectifs. Nous devrions armer certains mouvements pour l'indépendance croate afin de nous soutenir contre les Serbes."

AUS_recognize_hungarian_croatia:0 "Reconnaître la Croatie hongroise"
AUS_recognize_hungarian_croatia_desc:0 "Les Hongrois revendiquent depuis longtemps les terres de Croatie. Il est peut-être temps de reconnaître leurs revendications afin de garantir leur soutien à l'empire."

AUS_franz_ferdinand_legacy:0 "L'héritage de Franz Ferdinand"
AUS_franz_ferdinand_legacy_desc:0 "Franz Ferdinand fut le premier à comprendre qu'un empire autrichien moderne ne peut survivre sans accepter les minorités comme citoyens égaux. Nous devons suivre son héritage et construire un empire durable."

AUS_empower_the_parliament:0 "Renforcer le Parlement"
AUS_empower_the_parliament_desc:0 "Nous devons reconnaître l'ère des monarchies constitutionnelles et renforcer le parlement afin de donner au peuple de l'empire sa juste voix."

AUS_cement_kaiser_power:0 "Renforcer le pouvoir du Kaiser"
AUS_cement_kaiser_power_desc:0 "Le monde brûle et ce n'est pas le moment de se perdre dans des querelles internes. Le parlement a sa place, mais le Kaiser doit pouvoir agir rapidement lorsque la nation en a besoin."

AUS_monarchic_enabling_acts:0 "Décrets d'urgence monarchiques"
AUS_monarchic_enabling_acts_desc:0 "Le Kaiser doit pouvoir gouverner par décret en période de crise. Certaines situations sont trop urgentes pour être débattues au parlement."

AUS_invest_in_cisleithania:0 "Investir en Cisleithanie"
AUS_invest_in_cisleithania_desc:0 "Pour obtenir le soutien des peuples de l'empire, nous devons investir dans leurs industries et leur armée."

AUS_reform_the_constitution:0 "Réformer la Constitution"
AUS_reform_the_constitution_desc:0 "L'époque des monarchies absolues est révolue. La voix du peuple doit être entendue et il décidera de notre avenir."

AUS_federalisation_of_cisleithania:0 "Fédéralisation de la Cisleithanie"
AUS_federalisation_of_cisleithania_desc:0 "Le moment est venu d'accorder à nos frères et sœurs de Cisleithanie les droits égaux qu'ils méritent. Ensemble, nous pouvons construire un grand avenir pour l'empire."

AUS_one_empire_two_systems:0 "Un empire, deux systèmes"
AUS_one_empire_two_systems_desc:0 "Les Hongrois n'accepteront jamais d'être intégrés à notre fédération, et ils doivent donc pouvoir pratiquer leur propre forme de gouvernement tout en suivant la politique étrangère de Vienne."

AUS_federalize_transleithania:0 "Fédéralisation de la Transleithanie"
AUS_federalize_transleithania_desc:0 "Les Hongrois ne nous empêcheront pas de fédéraliser complètement l'empire ! S'ils veulent résister, qu'il en soit ainsi !"

AUS_continue_austrohungarian_dominance:0 "Maintenir la domination austro-hongroise"
AUS_continue_austrohungarian_dominance_desc:0 "Les peuples de notre empire ne sont pas encore prêts à devenir égaux. Le pouvoir doit rester entre les mains de Vienne et Budapest pour le moment."
AUS_form_donaubund:0 "Former le Donaubund"
AUS_form_donaubund_desc:0 "Si l’Autriche veut redevenir une grande nation, nous ne devons pas devenir les marionnettes d’une grande puissance. Nous devons plutôt construire notre propre sphère, libre de l’influence des grandes nations d’Europe."

AUS_old_ties:0 "Anciennes Alliances"
AUS_old_ties_desc:0 "Avec le retour du Kaiser sur le trône de l’Allemagne, nous devons rester unis avec lui. Ensemble seulement, nous pourrons retrouver notre gloire !"

AUS_ally_albania:0 "Allier [ALB.GetNameDef]"
AUS_ally_albania_desc:0 "Les Albanais ont des revendications sur [YUG.GetNameDef]. Ils pourraient être utiles en cas de guerre."

AUS_destroy_the_compromise:0 "Détruire le Compromis"
AUS_destroy_the_compromise_desc:0 "Le Compromis austro-hongrois de 1867 fut le moment où notre glorieux empire a commencé à s’effondrer. Nous devons corriger cette erreur et rappeler aux Hongrois leur place !"

AUS_centralize_power:0 "Centraliser le Pouvoir"
AUS_centralize_power_desc:0 "Nous devons centraliser le pouvoir gouvernemental en supprimant les vestiges de la République pour consolider notre règne."

AUS_reinstate_hungarian_civilian_government:0 "Restaurer le Gouvernement Civil Hongrois"
AUS_reinstate_hungarian_civilian_government_desc:0 "Pour intégrer les Hongrois à notre nation, nous devons rétablir le gouvernement civil en Hongrie, même si cela crée une instabilité à court terme."

AUS_martial_law_hungary:0 "Loi Martiale en Hongrie"
AUS_martial_law_hungary_desc:0 "Nous devons déclarer la loi martiale en Hongrie pour réprimer la résistance et préparer l’intégration du territoire."

AUS_ban_paramilitary_organizations:0 "Interdire les Organisations Paramilitaires"
AUS_ban_paramilitary_organizations_desc:0 "De nombreuses organisations paramilitaires persistent depuis la République instable. Nous devons neutraliser ces menaces qui s’opposent au règne légitime du Kaiser."

AUS_centralize_imperial_army:0 "Centraliser l’Armée Impériale"
AUS_centralize_imperial_army_desc:0 "La centralisation de l’armée impériale empêchera tout officier rebelle de saisir le pouvoir."

AUS_stir_monarchist_sentiment:0 "Éveiller le Sentiment Monarchiste"
AUS_stir_monarchist_sentiment_desc:0 "L’histoire a montré que la nation autrichienne n’a été stable que sous les Habsbourg. Nous devons faire comprendre au peuple que seule leur autorité garantit notre prospérité."

AUS_power_to_the_kaiser:0 "Pouvoir au Kaiser"
AUS_power_to_the_kaiser_desc:0 "Une fois les paramilitaires neutralisés, nous devons centraliser le pouvoir autour d’Otto von Habsburg, notre grand Kaiser. Lui seul peut nous mener à la victoire !"

AUS_utilize_paramilitaries:0 "Utiliser les Organisations Paramilitaires"
AUS_utilize_paramilitaries_desc:0 "Au lieu de combattre les paramilitaires, nous pouvons les utiliser à notre avantage, en les intégrant à notre armée pour renforcer nos effectifs et notre influence."

AUS_military_dictatorship:0 "Utiliser l’Armée"
AUS_military_dictatorship_desc:0 "L’armée impériale est un outil. Nous ne pouvons pas nous permettre un gouvernement civil alors que des ennemis nous entourent."

AUS_what_was_taken:0 "Ce Qui a été Pris"
AUS_what_was_taken_desc:0 "Notre perte lors de la Grande Guerre nous a tout enlevé. Nos terres légitimes ont été volées et notre monarchie humiliée. Mais nous reprendrons notre empire perdu, et l’Autriche redeviendra une puissance redoutée !"

AUS_forced_german_command:0 "Haut Commandement Allemand"
AUS_forced_german_command_desc:0 "La question de la langue est simple : le Haut Commandement sera exclusivement germanophone, et les unités subalternes doivent être dirigées par un officier parlant à la fois allemand et la langue de l’unité."

AUS_split_army:0 "Division Linguistique de l’Armée"
AUS_split_army_desc:0 "Notre armée sera divisée par langue. Ainsi, seuls les officiers supérieurs devront parler allemand, ce qui facilitera le recrutement."

AUS_avenge_yugoslav_humiliation:0 "Venger l’Humiliation"
AUS_avenge_yugoslav_humiliation_desc:0 "La Serbie, nation ayant assassiné notre Archiduc et provoqué la Grande Guerre, a pris une grande partie de nos terres. Nous devons venger cette humiliation !"

AUS_transylvania_or_war:0 "Transylvanie ou Guerre"
AUS_transylvania_or_war_desc:0 "Les Roumains, qui se sont rendus à nos armées, ont pris la Transylvanie aux Hongrois lorsqu’ils étaient faibles. Ils doivent apprendre que leur trahison ne sera pas pardonnée !"

AUS_reclaim_bohemia:0 "Reprendre la Bohême"
AUS_reclaim_bohemia_desc:0 "La Bohême a longtemps été le cœur industriel de l’empire autrichien. Sa perte a failli détruire notre économie. Nous devons reprendre nos terres et libérer notre peuple !"

AUS_arm_sudeten_germans:0 "Armer les Allemands des Sudètes"
AUS_arm_sudeten_germans_desc:0 "Les Allemands des Sudètes faisaient partie de l’Empire autrichien et de la nation autrichienne. Nous ne pouvons pas rester passifs face à leur oppression par le gouvernement tchèque illégitime."

AUS_retake_slovakia:0 "Reprendre la Slovaquie"
AUS_retake_slovakia_desc:0 "La Slovaquie faisait partie de notre empire et abritait une grande population germanophone. Nous devons la récupérer !"
AUS_imperial_infrastructure:0 "Infrastructure impériale"
AUS_imperial_infrastructure_desc:0 "Développer l'infrastructure de notre empire est essentiel pour relier nos populations et les intégrer."
AUS_prioritize_austria:0 "Prioriser l'Autriche"
AUS_prioritize_austria_desc:0 "L'Autriche est le cœur de l'empire, nous devons continuer à prioriser son développement."
AUS_promote_cross_empire_integration:0 "Développement inter-empire"
AUS_promote_cross_empire_integration_desc:0 "Développer toutes les parties de notre empire augmenterait considérablement notre soutien dans les régions sous-développées et bénéficierait à notre synergie économique."

AUS_austrofascism_not_nazism:0 "Austrofascisme, pas nazisme"
AUS_austrofascism_not_nazism_desc:0 "L'Autriche ne sera jamais l'Allemagne ! Les protestants ont essayé de nous opprimer pendant si longtemps, nous ne pouvons plus les laisser nous dominer !"
AUS_agreement_with_germany:0 "Compromis avec l'Allemagne"
AUS_agreement_with_germany_desc:0 "Nous devons accepter que notre économie est en désarroi et ne peut être sauvée sans accorder des concessions à [GER.GetNameDef] pour qu'ils lèvent leur embargo."

AUS_militarize_the_rome_protocols:0 "Militariser les Protocoles de Rome"
AUS_militarize_the_rome_protocols_desc:0 "Les Protocoles de Rome étaient des accords signés avec l'Italie et la Hongrie concernant la coopération économique entre nos trois nations et une position contre l'intégrité territoriale de la Yougoslavie. Transformer ces accords en traité d'alliance permettrait de se défendre contre les menaces de [GER.GetNameDef] et préparerait notre domination des Balkans."
AUS_purge_karntner_heimwehr:0 "Purger la Kärntner Heimwehr"
AUS_purge_karntner_heimwehr_desc:0 "Certaines branches de la Heimwehr soutiennent ouvertement la politique nazie et l'unification avec l'Allemagne. Nous devons les purger, affaiblissant ainsi à la fois les nazis et la Heimwehr."
AUS_utilize_the_heimwehr:0 "Utiliser la Heimwehr"
AUS_utilize_the_heimwehr_desc:0 "Nous pouvons utiliser la Heimwehr pour combattre l'influence nazie dans notre pays, mais leur dépendance renforcera leur influence, donc il faut être prudent."
AUS_secure_vatican_support:0 "Assurer le soutien du Vatican"
AUS_secure_vatican_support_desc:0 "Sa Sainteté a exprimé son soutien à la grande croisade de notre gouvernement. Améliorer nos relations avec le Vatican renforcera notre image dans le monde catholique."
AUS_catholic_education:0 "Éducation catholique"
AUS_catholic_education_desc:0 "Notre prochaine génération doit être élevée selon nos grandes valeurs catholiques. Nous devons reconstruire le système éducatif pour enseigner à nos enfants la grandeur de notre nation."
AUS_promote_militarism:0 "Promouvoir le militarisme"
AUS_promote_militarism_desc:0 "Depuis notre victoire à Vienne en 1683, l'Autriche a toujours eu une grande histoire militaire. Nous devons être fiers de notre patrimoine et de la puissance de nos ancêtres."
AUS_red_white_red_until_death:0 "Rouge Blanc Rouge - Jusqu'à la mort !"
AUS_red_white_red_until_death_desc:0 "L'Autriche n'est pas seulement une séparation de l'Allemagne, nous sommes quelque chose de plus grand. Nous devons défendre notre liberté contre les agresseurs, à tout prix !"

AUS_integrate_frontmilliz:0 "Intégrer la Frontmilliz"
AUS_integrate_frontmilliz_desc:0 "Après avoir marginalisé la Heimwehr en l'incluant dans l'organisation Frontmilliz contrôlée par le gouvernement, il est temps de sceller le contrôle. Nous intégrerons la Frontmilliz et la Heimwehr dans le Bundesheer, supprimant toute influence politique, et consolidant le contrôle du VF."
AUS_better_germany:0 "La meilleure Allemagne"
AUS_better_germany_desc:0 "Les Prussiens ont longtemps voulu unir tous les peuples germanophones dans leur empire, sans tenir compte des cultures locales. Le peuple autrichien doit montrer sa résistance à cette menace, car nous ne sommes pas n'importe quels Allemands, mais LES Allemands qui ont dominé l'Europe pendant des siècles."
AUS_consolidate_bundesheer:0 "Consolider le Bundesheer"
AUS_consolidate_bundesheer_desc:0 "Avec les derniers vestiges de l'influence des milices disparus, nous avons enfin réussi à unifier notre armée en une force solide capable de se mesurer aux grandes puissances du monde !"
AUS_corporate_industrialization:0 "Industrialisation corporative"
AUS_corporate_industrialization_desc:0 "Pour survivre à la tempête qui se prépare, nous devons commencer l'industrialisation de tous les secteurs de notre société."
AUS_seize_socialist_media:0 "Saisir les médias socialistes"
AUS_seize_socialist_media_desc:0 "Avec l'influence de la Heimwehr et des nazis écrasée, seuls les socialistes s'opposent encore à notre gouvernement. Nous devons saisir tous les médias qui soutiennent leurs partis pour garantir le contrôle."
AUS_disband_the_presidency:0 "Dissoudre la présidence"
AUS_disband_the_presidency_desc:0 "Bien que le président Miklas ne soit qu'une marionnette de notre gouvernement, il est encore le seul à pouvoir entraver nos efforts. Nous devons dissoudre le bureau une fois pour toutes, sécurisant totalement notre pouvoir."
AUS_expand_church_influence:0 "Étendre l'influence de l'Église"
AUS_expand_church_influence_desc:0 "Notre alliance avec l'Église catholique s'est avérée cruciale pour notre gouvernement. Nous devons étendre notre coopération pour renforcer notre pouvoir."
AUS_success_of_austrofascism:0 "L'expérience austrofasciste"
AUS_success_of_austrofascism_desc:0 "Contre toute attente, nous avons créé quelque chose de nouveau, une forme de gouvernement jamais vue auparavant. Nous pouvons être fiers de savoir qu'avec nos troubles internes apaisés, nous sommes unis et prêts à affronter la tempête à venir."
AUS_no_more_the_fool:0 "Plus de l'idiot"
AUS_no_more_the_fool_desc:0 "Beaucoup doutaient des capacités du chancelier Schuschnigg. Beaucoup le méprisaient pour sa faiblesse et tentaient de prendre le pouvoir pour eux.\n\nPlus maintenant."

AUS_empower_the_heimatblock:0 "Renforcer le Heimatblock"
AUS_empower_the_heimatblock_desc:0 "Schuschnigg s'est montré trop faible pour ramener notre nation à la grandeur. Le vice-chancelier Starhemberg, véritable successeur de Dolfuss, est le seul capable de nous mener à la victoire !"
AUS_weaken_federal_army:0 "Affaiblir l'armée fédérale"
AUS_weaken_federal_army_desc:0 "Pour que la Heimwehr gagne en influence, nous devons affaiblir le Bundesheer, rendant le gouvernement encore plus dépendant de nos milices."
AUS_replace_miklas:0 "Remplacer Miklas"
AUS_replace_miklas_desc:0 "Avec notre nouvelle influence politique, nous pouvons propulser Starhemberg à la présidence, supprimant la marionnette de Schuschnigg, Miklas."
AUS_utilize_fey:0 "Utiliser Fey"
AUS_utilize_fey_desc:0 "Emil Fey, leader de la Heimwehr et rival de Starhemberg, gêne nos efforts, mais avec suffisamment de persuasion, il pourrait être compromis."
AUS_get_rid_of_schuschnigg:0 "Le second putsch de la Heimwehr"
AUS_get_rid_of_schuschnigg_desc:0 "Nous avons enfin accumulé suffisamment d'influence dans le pays. Starhemberg dirigera un putsch à Vienne, et la police n'interviendra pas !"
AUS_new_austrian_state:0 "Un Nouvel État Autrichien"
AUS_new_austrian_state_desc:0 "Avec Schuschnigg écarté, nous avons enfin éliminé la faiblesse et le défaitisme qui affligeaient notre nation. Il est temps de reprendre notre place en tant que grande puissance en Europe !"

AUS_purge_opposition:0 "Éliminer l'Opposition"
AUS_purge_opposition_desc:0 "Après avoir pris le pouvoir, nous devons purger les opposants dans notre gouvernement qui restent fidèles à Schuschnigg."

AUS_purge_fey:0 "Éliminer Fey"
AUS_purge_fey_desc:0 "Fey a été utile dans la lutte contre Schuschnigg, mais il a accompli son rôle. Il est temps de purger lui et sa faction, consolidant le pouvoir sous Starhemberg."
AUS_compromise_with_fey:0 "Compromis avec Fey"
AUS_compromise_with_fey_desc:0 "Bien que Starhemberg et Fey aient eu leurs différends, nous travaillons ensemble pour un objectif commun et devons coopérer."
AUS_dolfuss_true_successor:0 "Le Véritable Successeur de Dolfuss"
AUS_dolfuss_true_successor_desc:0 "Starhemberg était le successeur désigné par Dolfuss, et seule l'intervention du président Miklas a permis à Schuschnigg de devenir chancelier. Avec Schuschnigg parti, le peuple peut enfin reconnaître le véritable successeur de Dolfuss !"

AUS_empower_the_industrialists:0 "Renforcer les Industrialistes"
AUS_empower_the_industrialists_desc:0 "Une grande partie de notre soutien provient des industrialistes faisant partie de notre système corporatif. Nous devons les renforcer, pour le bien de notre industrie."
AUS_reorganize_the_heimwehr:0 "Réorganiser la Heimwehr"
AUS_reorganize_the_heimwehr_desc:0 "Pour préserver notre influence sur la nation, nous devons réorganiser la Heimwehr en une armée fonctionnelle capable de protéger nos intérêts."
AUS_integrate_into_the_bundesheer:0 "Intégrer au Bundesheer"
AUS_integrate_into_the_bundesheer_desc:0 "Nous ne devons pas laisser nos objectifs politiques compromettre la sécurité de la nation. Nous devons intégrer la Heimwehr au Bundesheer, sacrifiant un peu de pouvoir politique pour une armée plus compétente."
AUS_mass_industrialization:0 "Industrialisation de Masse"
AUS_mass_industrialization_desc:0 "Pour reconstruire notre économie à la taille d'une puissance régionale, nous devons entreprendre une industrialisation massive et développer de nouveaux secteurs industriels dans tout le pays."
AUS_catholic_german_identity:0 "Identité Catholique Allemande"
AUS_catholic_german_identity_desc:0 "Notre identité catholique n'est pas seulement autrichienne, mais fait partie d'une plus grande identité catholique allemande, partagée avec nos frères voisins. Nous devons réaliser notre unité et les libérer !"
AUS_our_bavarian_brothers:0 "Nos Frères Bavarois"
AUS_our_bavarian_brothers_desc:0 "Nos frères catholiques en Bavière sont opprimés par la botte nazie. Nous devons les libérer !"

AUS_go_it_alone:0 "Aller Seul"
AUS_go_it_alone_desc:0 "Assez ! L'Autriche fut autrefois et sera à nouveau une grande puissance. Nous n'avons besoin de personne pour nous protéger, nous pouvons compter sur nous-mêmes !"
AUS_ally_italy:0 "Poursuivre l'Alliance Italienne"
AUS_ally_italy_desc:0 "Les fascistes italiens se sont longtemps révélés être nos plus grands alliés. Après nous avoir aidés lors du brutal putsch de juillet, nous pouvons leur faire confiance pour nous protéger contre les nazis."
AUS_accept_inevitable:0 "Accepter l'inévitable"
AUS_accept_inevitable_desc:0 "C'est inutile. Les Alliés occidentaux ne nous protégeront jamais, et les Italiens sont trop amicaux avec les Allemands pour être fiables. Nous devrions essayer d'entrer en négociations avec les Allemands, peut-être pour obtenir des conditions favorables."

AUS_appoint_inquart:0 "Nommer Seyss-Inquart"
AUS_appoint_inquart_desc:0 "Arthur Seyss-Inquart est un allié fidèle des nazis. Le nommer au gouvernement sera un geste de bonne volonté."

AUS_support_southern_heimwehr:0 "Soutenir la Heimwehr du Sud"
AUS_support_southern_heimwehr_desc:0 "Les milices Heimwehr du sud soutiennent notre cause. Nous devrions leur envoyer autant d'aide que possible en échange de leur soutien à notre coup d'État."

AUS_integrate_heimwehr:0 "Intégrer la Heimwehr"
AUS_integrate_heimwehr_desc:0 "Laisser la Heimwehr opérer en tant qu'entité séparée peut être bénéfique à court terme, mais déstabilisera sûrement notre nation à long terme. Il serait préférable de les intégrer directement à nos forces."

AUS_secure_the_countryside:0 "Sécuriser la campagne"
AUS_secure_the_countryside_desc:0 "Nous ne pouvons pas espérer défier la police dans les centres urbains denses. Nous devons plutôt sécuriser notre emprise déjà forte sur la campagne et y consolider notre domination."

AUS_infiltrate_vienna:0 "Infiltrer Vienne"
AUS_infiltrate_vienna_desc:0 "Bien que cela puisse être dangereux, infiltrer la capitale serait un coup décisif contre le gouvernement, avec nos partisans sous leur nez."

AUS_cast_the_die:0 "Jeter le dé"
AUS_cast_the_die_desc:0 "Le moment est venu. L'Autriche sera à nouveau allemande !"

AUS_independent_nazi:0 "Notre destin à nous seuls"
AUS_independent_nazi_desc:0 "Tout en admirant les idéaux d'Adolf Hitler et en soutenant volontiers ses efforts, l'Autriche doit rester un État indépendant protégeant les intérêts de son peuple."

AUS_integrate_vf_remnants:0 "Le Deutschsozialer Volksbund"
AUS_integrate_vf_remnants_desc:0 "En intégrant certains vestiges du gouvernement VF, nous pouvons contrer l'influence allemande dans notre parti et ouvrir la voie à un État nazi autrichien indépendant."

AUS_political_crackdowns:0 "Répression politique"
AUS_political_crackdowns_desc:0 "Nous devons réprimer toute opposition à notre gouvernement. Nous ne pouvons pas laisser la dissidence se développer."

AUS_austria_is_austrian:0 "L'Autriche est autrichienne"
AUS_austria_is_austrian_desc:0 "Bien que le peuple autrichien fasse partie de l'identité germanique élargie, nous avons tracé notre propre chemin, où le peuple autrichien se gouverne lui-même."

AUS_the_austrian_fuhrer:0 "Le Führer autrichien"
AUS_the_austrian_fuhrer_desc:0 "Josef Leopold a réussi à unir le peuple autrichien contre nos ennemis et à sauver la nation de la ruine totale. Il est véritablement le Führer autrichien."

AUS_destroy_heimwehr:0 "Détruire la Heimwehr"
AUS_destroy_heimwehr_desc:0 "Avec la guerre civile terminée, il est temps de se débarrasser des vestiges de la Heimwehr qui déstabilisent encore notre nation."

AUS_intervention_in_liechtenstein_nazi:0 "Intervention au Liechtenstein"
AUS_intervention_in_liechtenstein_nazi_desc:0 "Le Liechtenstein possède un mouvement pro-nazi actif réprimé par le gouvernement. Nous devons intervenir pour les mettre au pouvoir."

AUS_italian_reconciliation_nazi:0 "Se réconcilier avec l'Italie"
AUS_italian_reconciliation_nazi_desc:0 "Bien que nous ayons des revendications sur les Italiens, il pourrait être préférable de les abandonner afin de sécuriser une alliance pour nous défendre."

AUS_inquart_backstab:0 "La trahison de Seyss-Inquart"
AUS_inquart_backstab_desc:0 "Le destin de l'Autriche doit être lié à celui de l'Allemagne. Arthur Seyss-Inquart doit prendre le contrôle du gouvernement et rapprocher notre nation de l'Allemagne."

AUS_german_economic_development:0 "Développement économique allemand"
AUS_german_economic_development_desc:0 "Les sanctions allemandes ont lourdement affecté l'économie autrichienne. Avec le soutien allemand, nous pouvons propulser notre nation vers de nouveaux sommets."

AUS_anschluss:0 "Anschluss"
AUS_anschluss_desc:0 "L'Autriche est allemande, a toujours été allemande et sera désormais officiellement réunie avec nos frères allemands."

AUS_rp_ostmark:0 "Reichsgau Ostmark"
AUS_rp_ostmark_desc:0 "Bien que notre nation soit liée à l'Allemagne, un certain degré d'autonomie serait préférable pour préserver les aspects uniques de la culture autrichienne."

AUS_integrate_economy:0 "Économies intégrées"
AUS_integrate_economy_desc:0 "Pour résoudre nos problèmes économiques, nous devons intégrer étroitement notre économie à celle de l'Allemagne."

AUS_technology_integration:0 "Partage technologique allemand"
AUS_technology_integration_desc:0 "Nous devrions intégrer nos installations de recherche avec celles des Allemands pour améliorer nos capacités."

AUS_german_industrial_investments:0 "Investissements industriels allemands"
AUS_german_industrial_investments_desc:0 "Convaincre les Allemands d'investir dans nos terres améliorera grandement notre capacité à les soutenir dans leurs guerres."

AUS_use_the_ss:0 "Utiliser la SS"
AUS_use_the_ss_desc:0 "Utiliser la SS pour réprimer toute opposition aidera à consolider davantage notre pouvoir."

AUS_request_control_slovenia:0 "Demander le contrôle de la Slovénie"
AUS_request_control_slovenia_desc:0 "Depuis la disparition de Venise en tant qu'État, la Slovénie nous appartient, et les Slovènes ont toujours voulu faire partie du peuple germanique. Nous devrions demander aux Allemands d'en prendre le contrôle auprès de [102.controller.GetNameDef]."

AUS_july_followed_june:0 "Juillet a suivi juin"
AUS_july_followed_june_desc:0 "Un an après l'interdiction du parti nazi autrichien le 19 juin 1933, la Schutzstaffel a mené un putsch raté contre le gouvernement de la Vaterländische Front. Pendant le sanglant coup du 25 juillet, l'armée fédérale a été mobilisée pour combattre les troupes SS, réussissant finalement à les vaincre, mais le chancelier Engelbert Dollfuss a été tué, laissant notre nouveau régime très vulnérable.\n\nAprès avoir pris le pouvoir suite à la mort de Dollfuss, Kurt Schuschnigg a juré de s'assurer qu'un tel événement ne se reproduira jamais, mais de nombreux partisans nazis subsistent, déstabilisant fortement notre nation."

AUS_memories_of_februarkampfe:0 "Souvenirs des Februarkämpfe"
AUS_memories_of_februarkampfe_desc:0 "Lors de la prise de contrôle de la Vaterländische Front, une brève guerre civile a opposé les forces gouvernementales sous le régime fasciste d'Engelbert Dollfuss à la Ligue de défense républicaine social-démocrate. Le gouvernement fédéral a finalement vaincu les forces républicaines, mais les cicatrices demeurent, et dans de nombreuses grandes villes, le soutien aux partis socialistes reste important."

AUS_reliant_on_lon_1:0 "Légère dépendance aux prêts de la SDN"
AUS_reliant_on_lon_1_desc:0 "Depuis que la Société des Nations nous a accordé un prêt en 1922 pour sauver notre économie, notre nation dépend des prêts internationaux pour rester à flot. Tout bouleversement du statu quo international serait catastrophique."

AUS_reliant_on_lon_2:0 "Dépendance modérée aux prêts de la SDN"
AUS_reliant_on_lon_2_desc:0 "Depuis que la Société des Nations nous a accordé un prêt en 1922 pour sauver notre économie, notre nation dépend des prêts internationaux pour rester à flot. Tout bouleversement du statu quo international serait catastrophique."

AUS_reliant_on_lon_3:0 "Forte dépendance aux prêts de la SDN"
AUS_reliant_on_lon_3_desc:0 "Depuis que la Société des Nations nous a accordé un prêt en 1922 pour sauver notre économie, notre nation dépend des prêts internationaux pour rester à flot. Tout bouleversement du statu quo international serait catastrophique."

AUS_reliant_on_lon_4:0 "Dépendance extrême aux prêts de la SDN"
AUS_reliant_on_lon_4_desc:0 "Depuis que la Société des Nations nous a accordé un prêt en 1922 pour sauver notre économie, notre nation dépend des prêts internationaux pour rester à flot. Tout bouleversement du statu quo international serait catastrophique."
AUS_president_miklas:0 "Wilhelm Miklas (Président d'Autriche)"
AUS_president_miklas_desc:0 "Élu par l'Assemblée fédérale en 1928, le président Wilhelm Miklas a été témoin de deux guerres civiles et de la transition de l'Autriche d'une république démocratique à un État fasciste, sans jamais utiliser son pouvoir pour intervenir. Cette passivité a fait de lui une marionnette du gouvernement Schuschnigg."
AUS_president_miklas_supportive:0 "Wilhelm Miklas (Président d'Autriche)"
AUS_president_miklas_supportive_desc:0 "Suite à l'effondrement récent du gouvernement Schuschnigg, le président Miklas a exprimé son soutien à la nouvelle administration."
AUS_president_seitz:0 "Karl Seitz (Président d'Autriche)"
AUS_president_seitz_desc:0 "Membre de longue date du SDAPÖ, Karl Seitz a été président de l'Autriche de l'effondrement de l'empire en 1918 jusqu'à la perte de pouvoir du SDAPÖ en 1920. Il reste membre du parti jusqu'à l'interdiction des partis d'opposition sous le gouvernement Dolfuss. Lorsque le SDAPÖ reprend le pouvoir, Seitz, voyant le besoin d'un dirigeant expérimenté, se porte volontaire pour devenir président."
AUS_president_starhemberg:0 "Ernst Rüdiger Starhemberg (Président d'Autriche)"
AUS_president_starhemberg_desc:0 "Commandant du Heimwehr et rival de Schuschnigg pour succéder à Dolfuss, Ernst Rüdiger Starhemberg est un ennemi acharné de Schuschnigg depuis la formation du Front de la Patrie. Alors que le pouvoir penche du côté du Heimwehr, le Heimatblock a pu placer Starhemberg au poste de président, bien que beaucoup pensent que ce n'est que le premier pas vers sa quête de pouvoir."
AUS_lon_collapsed:0 "Effondrement de la Société des Nations"
AUS_lon_collapsed_desc:0 "Avec l'effondrement de la Société des Nations, notre dépendance aux prêts internationaux nous plonge dans une crise économique temporaire. Il nous faut y remédier correctement."
AUS_great_depression:0 "La Grande Dépression"
AUS_great_depression_desc:0 "Bien que le pire de la Grande Dépression soit derrière nous, notre dépendance aux prêts internationaux pour financer notre reprise nous laisse dans une situation difficile."
AUS_coal_mining:0 "Mines de charbon d'Ampflwang"
AUS_coal_mining_desc:0 "Exploiter au maximum nos réserves de charbon réduit notre besoin de dépendre des exportations étrangères."
AUS_constricted_parliament:0 "Parlement restreint"
AUS_constricted_parliament_desc:0 "Bien que nous accordions une certaine autonomie au parlement, il ne doit pas s'écarter des directives de [AUS.GetLeader]."
AUS_thousand_mark_ban:0 "La taxe des mille marks"
AUS_thousand_mark_ban_desc:0 "Mise en place peu après l'accession au pouvoir d'Engelbert Dolfuss, la taxe des mille marks, qui obligeait tout citoyen allemand entrant en Autriche à payer 1 000 marks au Reich, n'est qu'une des nombreuses sanctions économiques imposées par l'Allemagne. Ces sanctions ont affaibli l'économie autrichienne et nous devons trouver un moyen de lever cet embargo."
AUS_july_agreement:0 "Juliabkommen"
AUS_july_agreement_desc:0 "L'accord récent signé avec les Allemands a levé leur embargo contre nous, mais à un prix élevé, nous obligeant à nommer plusieurs ministres nazis dans notre gouvernement, rapprochant notre nation de la sphère de [GER.GetNameDef]."
AUS_finding_new_trade_partners:0 "Recherche de nouveaux partenaires commerciaux"
AUS_finding_new_trade_partners_desc:0 "Face au refus des nazis de lever leurs sanctions, nous devons chercher de nouveaux partenaires commerciaux pour relancer notre économie."
AUS_church_influence:0 "Influence de l'Église catholique"
AUS_church_influence_desc:0 "Notre alliance avec l'Église catholique est primordiale et nous apporte de grands bénéfices."
AUS_industrialist_support:0 "Soutien des industriels"
AUS_industrialist_support_desc:0 "Notre gouvernement bénéficie du soutien des principaux industriels du pays, qui profitent à notre économie."
AUS_weakened_federal_army:0 "Armée fédérale affaiblie"
AUS_weakened_federal_army_desc:0 "Certains éléments du Heimatblock affaiblissent le Bundesheer pour rendre le gouvernement plus dépendant du Heimwehr."
AUS_militia_army:0 "Armée de milice"
AUS_militia_army_desc:0 "En affaiblissant le Bundesheer, nous avons étendu notre pouvoir politique mais avons également légèrement diminué nos capacités militaires, le Heimwehr n'étant pas une force professionnelle."
AUS_integrated_army:0 "Heimwehr intégrée"
AUS_integrated_army_desc:0 "Les milices Heimwehr ont été intégrées au Bundesheer, renforçant considérablement nos capacités militaires, bien que cela réduise notre influence politique."
AUS_liechtenstein_properties:0 "Propriétés bohémiennes restituées"
AUS_liechtenstein_properties_desc:0 "La restitution de nos propriétés en Bohême à leurs propriétaires légitimes a fortement stimulé notre économie."
AUS_united_front:0 "Front uni"
AUS_united_front_desc:0 "Face à la menace allemande, nous avons formé un Front uni avec tous les éléments de notre société. Ensemble, nous pouvons défendre une Autriche indépendante !"
AUS_may_constitution_repealed:0 "Constitution de mai abrogée"
AUS_may_constitution_repealed_desc:0 "La Constitution de mai, qui a tant humilié notre nation, a enfin été abrogée. Nous pouvons désormais travailler à la construction d'un futur démocratique pour l'Autriche."
AUS_hungarian_opposition:0 "Opposition hongroise"
AUS_hungarian_opposition_desc:0 "L'échec de la conférence d'Eisenstadt a provoqué une révolte de la population hongroise contre notre gouvernement. Toute intégration de la Hongrie devra être traitée de manière spéciale."
AUS_hungarian_civilian_government:0 "Gouvernement civil hongrois"
AUS_hungarian_civilian_government_desc:0 "La réinstauration d'un gouvernement civil en Hongrie permet aux Hongrois d'exprimer leurs griefs de manière appropriée, facilitant l'intégration de la région."
AUS_hungarian_martial_law:0 "Loi martiale en Hongrie"
AUS_hungarian_martial_law_desc:0 "Nous avons déployé l'armée pour réprimer la résistance en Hongrie, au prix de ressources précieuses mais en limitant efficacement toute opposition."
AUS_heimwehr_remnants:0 "Restes du Heimwehr"
AUS_heimwehr_remnants_desc:0 "Le choix de ne pas intégrer le Heimwehr avant la guerre civile a déstabilisé notre nation."
AUS_austria_is_german:0 "L’Autriche est allemande"
AUS_austria_is_german_desc:0 "Personne ne peut contester le fait indéniable que l’Autriche est et a toujours été une nation allemande !
Notre destin ne se réalise que si nous restons unis !"

AUS_imperial_naval_academy:0 "Académie navale de Rijeka"
AUS_imperial_naval_academy_desc:0 "L’Académie navale de Rijeka formera les officiers les plus brillants et les plus compétents."

AUS_farmer_payments:0 "Paiements agricoles"

AUS_integrated_economies:0 "Économies intégrées"
AUS_integrated_economies_desc:0 "La liaison de notre économie avec [AUS.GetNameDefCap] a permis à nos industries civiles de collaborer plus efficacement."

AUS_integrated_military:0 "Production intégrée"
AUS_integrated_military_desc:0 "La liaison de notre production avec [AUS.GetNameDefCap] a permis à nos industries militaires de travailler ensemble plus efficacement."

AUS_integrated_trade:0 "Commerce intégré"

AUS_language_issue:0 "Problème de langue dans l’armée"
AUS_language_issue_desc:0 "Avec notre récente expansion et nos tentatives de recrutement de populations non germanophones dans nos nouveaux territoires, notre armée a été frappée par des problèmes de coordination causés par le fait que de nombreux officiers subalternes ne comprennent pas les ordres donnés en allemand par leurs supérieurs.
Cela paralyse la structure organisationnelle de notre armée, et une solution doit être trouvée rapidement."

AUS_german_aero_tech:0 "Conceptions aéronautiques [GER.GetAdjective]"
AUS_german_aero_tech_desc:0 "Nos alliés [GER.GetAdjective] nous ont donné accès à leurs dernières conceptions d’avions."

AUS_british_aero_tech:0 "Conceptions aéronautiques [ENG.GetAdjective]"
AUS_british_aero_tech_desc:0 "Nos alliés [ENG.GetAdjective] nous ont donné accès à leurs dernières conceptions d’avions."

AUS_soviet_aero_tech:0 "Conceptions aéronautiques [SOV.GetAdjective]"
AUS_soviet_aero_tech_desc:0 "Nos alliés [SOV.GetAdjective] nous ont donné accès à leurs dernières conceptions d’avions."

#EVENT

austria.0.t:0 "La troisième guerre civile autrichienne"
austria.0.d:0 "Depuis le Putsch de juillet, beaucoup craignaient que le parti nazi ne tente de frapper à nouveau le gouvernement. Leurs craintes se sont avérées justes.

Aujourd’hui, des divisions de l’armée partout dans le pays, réputées secrètement loyales aux nazis, se sont soulevées contre le gouvernement en soutien au gouvernement nazi en Allemagne. Le gouvernement a rassemblé toutes les unités militaires restantes pour tenter de les arrêter, mais seul l’avenir dira si cela sera un succès."
austria.0.a:0 "Les traîtres doivent être écrasés !"
austria.0.b:0 "Vive une Autriche allemande !"

austria.1.t:0 "La remilitarisation de la Rhénanie"
austria.1.d:0 "C’était inévitable.

Tout le monde savait que le traité de Versailles ne durerait pas, mais beaucoup ont été surpris de le voir violé si rapidement. Cela est d’une importance capitale pour nous, car ce traité garantit notre indépendance, bien qu’une grande partie des populations allemandes et autrichiennes souhaite l’unification des deux nations.

Si nous voulons préserver notre indépendance, nous devons regarder au-delà de nos frontières, et vite, avant que les nazis ne commencent à envisager l’expansion."
austria.1.a:0 "Le temps presse."

austria.2.t:0 "Regarder au-delà de nos frontières"
austria.2.desc:0 "Il faut se rendre à l’évidence : l’Autriche ne peut se tenir seule face à l’Allemagne. Pour préserver notre indépendance, nous devons chercher une protection extérieure.

Trois options se présentent :

La première option est de renforcer notre alliance avec [ITA.GetNameDef]. C’est le choix logique, car les [ITA.GetAdjective] soutiennent déjà notre régime et ne feraient probablement pas de demandes politiques. Cependant, certains membres du gouvernement soulignent que les [ITA.GetAdjective] se rapprochent des nazis en Allemagne et pourraient nous abandonner si nous devenons un fardeau.

La deuxième option est d’entrer en négociation avec les puissances occidentales. Bien que nous ne soyons pas toujours d’accord politiquement, la Grande-Bretagne et la France souhaitent maintenir l’Allemagne faible. En protégeant notre indépendance, elles atteignent cet objectif. Cependant, elles pourraient imposer des réformes à notre administration, conditionnant leur soutien à certaines modifications.

La troisième et dernière option est d’entrer en négociation avec l’Allemagne. Bien que Schuschnigg s’y oppose, certains membres du gouvernement veulent le pousser à négocier avec les nazis, peut-être pour obtenir une autonomie limitée plutôt qu’une annexion complète.

Il est temps de choisir. Nous ne pouvons plus attendre."
austria.2.a:0 "Les Italiens sont nos alliés. Ils sont dignes de confiance."
austria.2.b:0 "Les Italiens sont trop proches des Allemands. Regardons vers l’Ouest."
austria.2.c:0 "Nous devons accepter l’inévitable. Pressons Schuschnigg et négocions."
austria.2.d:0 "Assez ! Nous pouvons nous défendre !"
austria.2.e:0 "Nous sommes seuls. Que Dieu nous vienne en aide."

austria.3.t:0 "[AUS.GetNameDefCap] demande protection"
austria.3.d:0 "[AUS.GetLeader] est venu nous voir concernant la récente remilitarisation de la Rhénanie par l’Allemagne. La direction [AUS.GetAdjective] estime qu’après avoir montré son mépris pour le traité de Versailles, il est seulement question de temps avant que l’Allemagne tente d’intégrer l’Autriche. Elle vient donc chercher protection auprès de nous, conformément à notre alliance.

Certains membres du gouvernement estiment que nous devons protéger l’Autriche, notre alliée, tandis que d’autres jugent que le risque de ruiner nos relations avec l’Allemagne est trop élevé.

Que devons-nous faire ?"
austria.3.a:0 "Ils sont nos alliés. Protégeons-les."
austria.3.b:0 "Nous ne pouvons pas risquer de nuire à nos relations avec l’Allemagne."

austria.4.t:0 "[ITA.GetNameDefCap] accepte de nous protéger"
austria.4.d:0 "[ITA.GetLeader] a accepté de nous protéger contre l’Allemagne, citant la grande alliance entre nos nations fascistes. Nous ne pouvons qu’espérer que cela suffira à dissuader l’Allemagne."
austria.4.a:0 "Nous pouvons compter sur eux."

austria.5.t:0 "[ITA.GetNameDefCap] refuse de nous protéger"
austria.5.d:0 "[ITA.GetLeader] a refusé de nous protéger contre l’Allemagne. Il semble que son désir de s’allier aux Allemands l’emporte sur notre alliance."
austria.5.a:0 "Nous sommes seuls. Que Dieu nous vienne en aide."
austria.5.b:0 "Nous devons chercher d’autres options."

austria.6.t:0 "[AUS.GetNameDefCap] demande protection"
austria.6.d:0 "[AUS.GetLeader] est venu nous voir concernant la récente remilitarisation de la Rhénanie par l’Allemagne. La direction [AUS.GetAdjective] estime qu’après le mépris flagrant des Allemands pour le traité de Versailles, il ne sera bientôt qu’une question de temps avant qu’ils tentent d’intégrer l’Autriche. Elle cherche donc protection auprès de nous. Comme notre objectif est d’affaiblir l’Allemagne, cela pourrait valoir la peine, mais nous devrions exiger des réformes gouvernementales et le rétablissement éventuel des élections libres si nous les protégeons."
austria.6.a:0 "Nous le ferons, mais ils doivent se réformer."
austria.6.b:0 "Cela n’est pas dans nos intérêts."
austria.7.t:0 "[FROM.GetNameDefCap] Demande des réformes démocratiques"
austria.7.d:0 "[FROM.GetLeader] a exprimé que [FROM.GetNameDef] est disposé à nous protéger, mais en retour, ils exigent que nous levions nos restrictions sur les partis d'opposition et que nous avancions vers la tenue d'élections libres à l'avenir. Cette demande a été jugée ridicule par de nombreux membres du gouvernement, cependant, beaucoup considèrent cette alliance comme notre seule chance d'être protégés contre l'Allemagne.\n\nAvec le pays divisé par ce choix, Schuschnigg lui-même a évoqué l'idée de proposer une restauration modérée d'Otto Von Habsburg en tant que figure unificatrice de la nation en ces temps, et il croit que les Alliés sont trop désireux d'affaiblir l'Allemagne pour nous refuser cette demande.\n\nQuel sera notre choix ?"
austria.7.a:0 "Accepter les réformes. C'est notre seul choix."
austria.7.b:0 "Peut-être seront-ils prêts à accepter notre compromis."
austria.7.c:0 "Pas de compromis ! Nous trouverons quelqu'un d'autre."

austria.8.t:0 "[AUS.GetNameDef] accepte nos demandes"
austria.8.d:0 "La direction [AUS.GetAdjective] a accepté nos demandes. Nous les protégerons contre les Allemands, et ils commenceront les réformes démocratiques. C'est une grande victoire pour nous, car nous avons à la fois affaibli l'Allemagne et intégré un nouveau pays dans notre sphère d'influence."
austria.8.a:0 "Très bien."

austria.9.t:0 "[AUS.GetNameDefCap] propose un compromis Habsbourg"
austria.9.d:0 "[AUS.GetLeader] est revenu vers nous avec un compromis concernant nos demandes - Otto Von Habsburg sera restauré comme figure constitutionnelle d'un Empire autrichien modéré. Certains membres du gouvernement trouvent cela ridicule - nous avons combattu contre eux il y a moins de 20 ans. Cependant, certains pensent que laisser l'Autriche tomber sous l'influence de l'Allemagne est un risque trop grand, et que nous devrions accepter malgré tout."
austria.9.a:0 "Ils peuvent avoir leur restauration."
austria.9.b:0 "Nos demandes sont claires."

austria.10.t:0 "[FROM.GetNameDefCap] accepte le compromis Habsbourg"
austria.10.d:0 "Les délégués [FROM.GetAdjective] ont accepté notre compromis - Otto Von Habsburg sera restauré comme figure constitutionnelle d'un Empire autrichien modéré."
austria.10.a:0 "Une grande réussite !"

austria.11.t:0 "[FROM.GetNameDefCap] refuse le compromis Habsbourg"
austria.11.d:0 "Les délégués [FROM.Adjective] ont purement et simplement refusé notre compromis, affirmant qu'ils ne soutiendront pas la restauration du même empire qu'ils ont combattu il y a moins de 20 ans. Ils continuent à exiger que nous levions nos restrictions sur les partis d'opposition et que nous avancions vers la tenue d'élections libres à l'avenir."
austria.11.a:0 "Nous devrions accepter leurs demandes avant qu'il ne soit trop tard."
austria.11.b:0 "Nous en avons fini ici. Nous pouvons trouver des alliés ailleurs."

austria.12.t:0 "[FROM.GetNameDefCap] refuse de nous protéger"
austria.12.d:0 "[FROM.GetLeader] a catégoriquement refusé de nous protéger contre les Allemands. Peut-être que nos différences étaient trop grandes après tout."
austria.12.a:0 "Nous devons trouver d'autres options."

austria.13.t:0 "[AUS.GetNameDefCap] demande des négociations"
austria.13.d:0 "[AUS.GetLeader] a contacté notre gouvernement, affirmant qu'il est de plus en plus évident que nous souhaitons les intégrer dans notre royaume, et qu'ils souhaitent négocier.\n\nLes [AUS.GetAdjective] ont proposé que l'Autriche devienne un sujet autonome de l'Allemagne, et en échange, nous ne les occuperions pas."
austria.13.a:0 "Nous pouvons accepter ce compromis, mais un gouvernement amical doit prendre le pouvoir."
austria.13.b:0 "Nous avons d'autres plans pour eux."

austria.14.t:0 "[GER.GetNameDefCap] exige la prise de contrôle nazie"
austria.14.d:0 "[GER.GetLeader] a accepté notre demande de devenir un sujet autonome, mais il exige que nous installions un gouvernement favorable au régime nazi, ce qui impliquerait la prise de contrôle par les nazis autrichiens."
austria.14.a:0 "Schuschnigg ne cédera pas le pouvoir si facilement, mais nous pouvons nous en occuper."
austria.14.b:0 "Inacceptable ! Nous trouverons de meilleurs alliés !"

austria.15.t:0 "[AUS.GetNameDefCap] accepte"
austria.15.d:0 "La direction autrichienne nous a contactés et a promis que Schuschnigg sera traité comme demandé."
austria.15.a:0 "Nous attendons de voir."

austria.16.t:0 "[AUS.GetNameDefCap] refuse"
austria.16.d:0 "Les délégués autrichiens ont catégoriquement refusé tout changement de gouvernement, et les négociations ont échoué."
austria.16.a:0 "Nous nous en occuperons bientôt."

austria.17.t:0 "[GER.GetNameDefCap] refuse les négociations"
austria.17.d:0 "Nos tentatives de négociation avec l'Allemagne ont été ignorées. Nous ne pouvons qu'assumer que le pire est à venir, et nous devons nous y préparer."
austria.17.a:0 "Nous devons trouver quelqu'un d'autre pour nous protéger."
austria.17.b:0 "Peut-être serait-il encore avantageux de suivre le gouvernement d'Hitler."

austria.18.t:0 "[AUS.GetNameDefCap] reçoit une protection étrangère"
austria.18.d:0 "Les [AUS.GetAdjective], probablement voyant nos politiques expansionnistes, ont reçu une protection étrangère contre toute menace venant de nous. Cela met effectivement fin à nos plans pour un Anschluss, car il n'est pas judicieux de risquer une guerre contre un pays majeur à ce stade."
austria.18.a:0 "Abandonner nos plans pour l'Anschluss"
austria.18.b:0 "Cela ne nous arrêtera pas !"

austria.19.t:0 "Primature de la SDAPÖ"
austria.19.d:0 "Avec le retour d'Otto Bauer de l'exil, beaucoup se demandent qui dirigera la SDAPÖ lors des élections actuelles. Karl Renner et Otto Bauer ont dirigé le parti ensemble pendant la Première République, mais maintenant avec la menace allemande au nord, les deux hommes ont des plans différents pour l'avenir de l'Autriche.\n\nAlors que Renner croit que notre meilleure chance de survivre à la tempête à venir est de fortifier notre pays, la perspective plus idéaliste de Bauer est qu'il est de notre devoir de renverser le régime totalitaire en Allemagne une fois pour toutes, comme étape finale pour unir nos nations.\n\nQue doit choisir le parti ?"
austria.19.a:0 "Le plan de Renner est le seul moyen de survivre."
austria.19.b:0 "Bauer a le bon esprit !"

austria.20.t:0 "Retour du Kaiser"
austria.20.d:0 "Aujourd'hui, sous la forte pression des alliés occidentaux et de son gouvernement, le chancelier Schuschnigg a annoncé à la radio qu'il démissionnerait pour préserver l'indépendance de la nation autrichienne.\n\nDans son discours émouvant, Schuschnigg a proclamé que, face à la menace allemande, c'était le moment de l'unité et non de la division, et qu'Otto von Habsburg reviendrait de l'exil comme figure unificatrice pour guider le peuple autrichien.\n\nBien que beaucoup voient cela comme une victoire triomphante et le retour à l'ancienne gloire autrichienne, la vérité est qu'Otto revient pour n'être rien de plus qu'une figure symbolique d'un parlement profondément divisé.\n\nPour lui, beaucoup de travail reste à faire."
austria.20.a:0 "Longue vie au Kaiser !"

austria.21.t:0 "Otto assume la couronne autrichienne"
austria.21.d:0 "Aujourd'hui, dans un discours émouvant, le chancelier Kurt Schuschnigg d'Autriche a annoncé sa démission en préparation du retour des Habsbourg au trône.\n\nL'Autriche est sous pression depuis la remilitarisation de la Rhénanie pour trouver protection contre les Allemands, mais ces protections ont un coût. La pression des alliés occidentaux a effectivement réduit les nouveaux pouvoirs d'Otto à une position purement symbolique, au grand désarroi du nouveau Kaiser. Beaucoup craignent que la quête de pouvoir d'Otto ne mène à une instabilité accrue, mais pour l'instant, l'avenir de l'Autriche n'est pas encore clair."
austria.21.a:0 "Cela pourrait-il déstabiliser davantage le continent ?"
austria.21.b:0 "Beaucoup de travail reste à faire."

austria.22.t:0 "Chute en disgrâce"
austria.22.d:0 "Comme aboutissement de mois de manœuvres politiques entre le parlement et le Kaiser, plusieurs lois ont été adoptées aujourd'hui qui limitent davantage les pouvoirs du Kaiser, réduisant effectivement son pouvoir déjà limité à une position purement cérémoniale.\n\nCela marque effectivement la fin de la lutte politique, car la SDAPÖ et ses alliés sont devenus la force politique dominante du pays, écartant à la fois Otto et leurs rivaux conservateurs.\n\nPeut-être que le retour des Habsbourg n'était pas le retour à l'ancienne gloire, mais le début de nouvelles prospérités."
austria.22.a:0 "Une grande victoire pour la démocratie."

austria.23.t:0 "Le deuxième acte habilitant"
austria.23.d:0 "Comme aboutissement de mois de manœuvres politiques entre le parlement et le Kaiser, aujourd'hui, des fonctionnaires loyaux au Kaiser ont adopté un acte habilitant accordant à Otto de nombreux pouvoirs qui font de lui la force politique dominante du pays, le parlement étant fermement sous son influence.\n\nÉtrangement similaire à l'acte habilitant de Dolfuss en 1934, beaucoup voient cela comme la fin de l'Autriche poussée par d'autres puissances et un retour à l'ancienne gloire, mais les conséquences pourraient tendre nos relations avec nos alliés et nous mettre en danger."
austria.23.a:0 "Une grande victoire pour notre gloire !"

austria.24.t:0 "Cousins, pas frères ?"
austria.24.d:0 "Aujourd'hui, [AUS.GetLeader] nous a proposé une alliance entre nos nations. Il affirme qu'il est insensé de ne pas voir que l'ancien empire austro-hongrois était instable et que notre rivalité a conduit à son déclin, mais nos deux grandes nations ont été humiliées après la Grande Guerre et nous devons nous unir en partenaires pour retrouver notre gloire perdue.\n\nCela pourrait être une excellente opportunité de récupérer nos territoires perdus. Acceptons-nous ?"
austria.24.a:0 "Nous avancerons ensemble."
austria.24.b:0 "Nous en avons assez des promesses vaines des Autrichiens !"

austria.25.t:0 "[HUN.GetNameDefCap] accepte !"
austria.25.d:0 "[HUN.GetLeader] a accepté notre proposition d'alliance entre nos nations. C'est un grand jour."
austria.25.a:0 "Nous devons maintenant regarder autour de nous."

austria.26.t:0 "[HUN.GetNameDefCap] décline"
austria.26.d:0 "[HUN.GetLeader] a refusé notre demande, affirmant que le peuple hongrois ne veut plus rien avoir à
austria.26.a:0 "Ils vont le regretter."

austria.27.t:0 "[AUS.GetNameDefCap] propose le partage de la Tchécoslovaquie"
austria.27.d:0 "Conformément à notre alliance, [AUS.GetLeader] nous a présenté une proposition pour récupérer notre territoire perdu. Il propose de partager les terres tchécoslovaques entre nous, l'Autriche recevant la Bohême et nous la Slovaquie. Devons-nous saisir cette opportunité ?"
austria.27.a:0 "Nous devrions agir immédiatement."
austria.27.b:0 "Nous avons d'autres priorités."

austria.28.t:0 "[HUN.GetNameDefCap] accepte notre proposition"
austria.28.d:0 "[HUN.GetLeader] a accepté notre proposition de partager la Tchécoslovaquie entre nous."
austria.28.a:0 "Allons-y."

austria.29.t:0 "[HUN.GetNameDefCap] rejette notre proposition"
austria.29.d:0 "[HUN.GetLeader] a rejeté notre proposition, disant que nous ne sommes pas prêts pour une telle guerre et avons d'autres choses à gérer."
austria.29.a:0 "Nous ne pouvons pas le faire seuls."
austria.29.b:0 "Nous n'avons pas besoin de leur aide."

austria.30.t:0 "[AUS.GetNameDefCap] exige un partage"
austria.30.d:0 "C'est arrivé. Depuis le retour des Habsbourg sur le trône en Autriche, beaucoup craignaient une invasion d'un Empire autrichien renaissant.\n\nAujourd'hui, les troupes autrichiennes se sont massées à notre frontière et nous avons reçu un ultimatum : laisser notre nation être partagée entre eux et leurs alliés, ou faire face à la guerre. Nous devons agir vite."
austria.30.a:0 "Nous n'avons pas le choix..."
austria.30.b:0 "La mort avant la honte !"

austria.31.t:0 "[CZE.GetNameDefCap] défiant"
austria.31.d:0 "Le gouvernement [CZE.GetAdjective] a ignoré notre ultimatum et mobilisé son armée. [CZE.GetLeader] a promis que tout envahisseur trouverait l'armée plus que prête à défendre le pays jusqu'au dernier homme."
austria.31.a:0 "Cela signifie la guerre."

austria.32.t:0 "[CZE.GetNameDefCap] se rend"
austria.32.desc:0 "Souhaitant éviter une guerre destructive, le gouvernement [CZE.GetAdjective] s'est retiré et a permis à nos forces de prendre le contrôle. Aujourd'hui est un grand jour pour l'Autriche.\n\nNous devons maintenant choisir comment diviser leurs territoires."
austria.32.a:0 "Annexer la Bohême et transférer la Slovaquie à nos alliés hongrois."
austria.32.b:0 "Annexer les Sudètes avec un gouvernement loyal en Bohême et donner la Slovaquie à la Hongrie."
austria.32.c:0 "Annexer la Bohême et installer un gouvernement loyal en Slovaquie."
austria.32.d:0 "Annexer les Sudètes et installer des gouvernements loyaux en Bohême et Slovaquie."

austria.33.t:0 "Effondrement de la Société des Nations"
austria.33.d:0 "La Société des Nations s'est effondrée. Notre dépendance aux prêts internationaux nous laisse dans une situation où nous n'avons pas assez de fonds pour soutenir nos dépenses. Notre économie ralentit, et tout ce que nous pouvons faire est d'attendre et de relancer lorsque nous aurons suffisamment de fonds."
austria.33.a:0 "Pas bon."

austria.34.t:0 "Retour du Kaiser"
austria.34.d:0 "Aujourd'hui, sous forte pression de son gouvernement, le chancelier Schuschnigg a annoncé à la radio sa démission pour préserver l'indépendance de la nation autrichienne.\n\nDans son discours, il a proclamé qu'à cause de la menace allemande, le moment était venu pour l'unité et non la division, et Otto von Habsburg revient de l'exil comme figure unificatrice pour guider le peuple autrichien dans ces jours sombres.\n\nPour beaucoup, c'est une victoire triomphante et un retour à la gloire autrichienne, mais la vérité est qu'Otto revient diriger une nation dont l'existence est menacée."
austria.34.a:0 "Vive le Kaiser !"

austria.35.t:0 "Otto assume la couronne autrichienne"
austria.35.d:0 "Depuis la remilitarisation de la Rhénanie, beaucoup se demandaient quel serait le destin de l'État autrichien. Schuschnigg prévoyait de démissionner face à la menace allemande, mais peu s'attendaient à ceci.\n\nAujourd'hui, le chancelier Kurt Schuschnigg a annoncé sa démission pour préparer le retour des Habsbourg au trône. Le nouvellement couronné Otto von Habsburg a déjà adressé la nation, déclarant que beaucoup de travail reste à faire, mais que l'héritage de grandeur pour l'Autriche n'est pas perdu.\n\nQuel que soit l'avenir de l'Europe, le discours d'Otto a secoué tout le continent."
austria.36.t:0 "Crise économique"
austria.36.d:0 "L'économie autrichienne montre des signes inquiétants. Le chômage augmente, les prix grimpent, et les prêts internationaux se raréfient. Le gouvernement cherche des solutions pour stabiliser la situation et éviter un effondrement complet."
austria.36.a:0 "Nous devons agir rapidement."
austria.36.b:0 "Restons prudents et surveillons la situation."

austria.37.t:0 "Tensions avec l'Italie"
austria.37.d:0 "L'Italie commence à revendiquer certaines régions frontalières autrichiennes. Les diplomates tentent de calmer les tensions, mais la menace d'un conflit reste réelle."
austria.37.a:0 "Préparons notre armée."
austria.37.b:0 "Essayons la diplomatie avant tout."

austria.38.t:0 "Nouveau pacte avec la Hongrie"
austria.38.d:0 "Après plusieurs négociations, l'Autriche et la Hongrie ont signé un pacte de coopération économique et militaire. Ce traité renforce notre alliance et stabilise nos relations."
austria.38.a:0 "Un pas dans la bonne direction."
austria.38.b:0 "Nous devons rester vigilants."

austria.39.t:0 "Réformes intérieures"
austria.39.d:0 "Le gouvernement autrichien annonce une série de réformes visant à moderniser l'économie et le système politique. Des mesures pour améliorer l'éducation, l'infrastructure et les services publics sont prévues."
austria.39.a:0 "Avançons avec détermination."
austria.39.b:0 "Nous devons y aller progressivement."

austria.40.t:0 "Mobilisation générale"
austria.40.d:0 "Face à la montée des tensions régionales, le gouvernement ordonne une mobilisation générale. Les forces armées se préparent à défendre le pays contre toute agression possible."
austria.40.a:0 "Chaque citoyen doit se préparer."
austria.40.b:0 "Espérons que ce ne soit pas nécessaire."

austria.41.t:0 "Alliance avec l'Allemagne"
austria.41.d:0 "Après de longues discussions, l'Autriche signe un accord de coopération militaire et économique avec l'Allemagne. Cette alliance pourrait protéger nos frontières et renforcer notre position en Europe centrale."
austria.41.a:0 "Une alliance stratégique essentielle."
austria.41.b:0 "Nous devons rester prudents face à l'influence allemande."

austria.42.t:0 "Crise diplomatique avec la Tchécoslovaquie"
austria.42.d:0 "Les tensions avec la Tchécoslovaquie s'aggravent. Des désaccords sur les frontières et le partage des territoires provoquent une crise diplomatique qui pourrait dégénérer en conflit."
austria.42.a:0 "Nous devons négocier rapidement."
austria.42.b:0 "Préparons-nous à la guerre."

austria.43.t:0 "Réforme militaire"
austria.43.d:0 "Le gouvernement lance une réforme de l'armée pour moderniser les forces et améliorer leur efficacité. Des fonds supplémentaires sont alloués à l'équipement et à l'entraînement."
austria.43.a:0 "Renforçons notre armée immédiatement."
austria.43.b:0 "Concentrons-nous d'abord sur l'économie."

austria.44.t:0 "Crise politique interne"
austria.44.d:0 "Des conflits internes au gouvernement affaiblissent la position de l'Autriche. Différents partis politiques s'opposent sur la stratégie économique et militaire à adopter."
austria.44.a:0 "Unité avant tout."
austria.44.b:0 "Laissons les débats continuer."

austria.45.t:0 "Expansion territoriale"
austria.45.d:0 "L'Autriche examine la possibilité d'annexer certains territoires voisins pour renforcer sa position. Les plans sont en cours d'élaboration, mais l'opinion publique est partagée."
austria.45.a:0 "Allons de l'avant avec audace."
austria.45.b:0 "Soyons prudents et diplomates."

austria.46.t:0 "Crise énergétique"
austria.46.d:0 "Une pénurie d'énergie affecte l'Autriche. Le gouvernement cherche des solutions pour garantir l'approvisionnement et éviter des coupures qui pourraient paralyser le pays."
austria.46.a:0 "Investissons dans de nouvelles sources."
austria.46.b:0 "Rationnons l'énergie pour le moment."

austria.47.t:0 "Protestations populaires"
austria.47.d:0 "Des manifestations éclatent dans plusieurs villes, réclamant des réformes et une meilleure gestion économique. La situation risque de devenir incontrôlable si le gouvernement n'agit pas rapidement."
austria.47.a:0 "Écoutons les revendications."
austria.47.b:0 "Maintenons l'ordre à tout prix."

austria.48.t:0 "Stabilité retrouvée"
austria.48.d:0 "Après plusieurs mois de crises, l'Autriche retrouve une certaine stabilité politique et économique. Le gouvernement a réussi à calmer les tensions internes et à renforcer ses alliances."
austria.48.a:0 "Célébrons cette victoire."
austria.48.b:0 "Restons vigilants malgré tout."
austria.49.t:0 "Une baignade sur le Danube"
austria.49.d:0 "Alfred et Franz faisaient leur patrouille ensemble, surplombant le Danube depuis la rive près de Fischamend. Ils ne voyaient aucune raison à cela, après tout, la guerre civile était terminée depuis longtemps, et ils avaient seulement rejoint les Sturmscharen pour le salaire correct.\n\n« Hé Alfred ! », s'écria Franz en pointant vers un amas flottant ressemblant à des enveloppes. « Les Viennois ont encore oublié où était la poubelle. »\n\n« Je serais surpris qu'ils aient même une poubelle », répondit Alfred. Les deux hommes rirent et continuèrent leur patrouille comme d'habitude.\n\nQuelques heures plus tard, sur le chemin du retour, Franz repensa à l'incident. Quelques déchets flottant sur le fleuve n'étaient rien d'extraordinaire, mais avec les élections en cours, il valait peut-être mieux signaler ce genre de choses."
austria.49.a:0 "Mieux vaut prévenir que guérir."
austria.49.b:0 "Probablement rien dont s'inquiéter."

austria.50.t:0 "Un dictateur"
austria.50.d:0 "Leopold Figl sut immédiatement ce qui se passait lorsqu'il reçut le rapport de ses hommes. Il avait toujours su que Schuschnigg faisait tout ce qu'il pouvait pour se servir lui-même. Ces « élections démocratiques » n'étaient rien d'autre qu'un moyen de plaire aux Alliés occidentaux pour qu'ils soutiennent son gouvernement.\n\nEn tant que directeur de campagne du CSP, Leopold savait très bien que si il arrêtait la fraude électorale, les socialistes sortiraient certainement victorieux, ce contre quoi il s'était battu toute sa carrière. Mais à quoi servirait tout son travail pour s'opposer à la dictature VF de l'intérieur s'il abandonnait à la dernière minute ?\n\nUne décision devait être prise."
austria.50.a:0 "Il utiliserait son influence pour superviser les bulletins."
austria.50.b:0 "Il ne ferait rien."

austria.51.t:0 "Leopold Figl s'oppose au gouvernement Schuschnigg"
austria.51.d:0 "Suite à la victoire du CSP aux élections, il semblerait que les luttes internes ne soient pas terminées. Leopold Figl, directeur de campagne du parti pendant les élections, a annoncé que sa faction réformiste du CSP contesterait la direction de Schuschnigg.\n\nFigl a déclaré que l'avenir du CSP résidait avec l'ouest démocratique et que les politiques isolationnistes corrompues de Schuschnigg mèneraient seulement l'Autriche à la destruction."
austria.51.a:0 "Figl est notre chemin vers l'avenir !"
austria.51.b:0 "Schuschnigg nous a menés jusqu'ici, nous le soutiendrons !"

austria.53.t.a:0 "L'influence nazie en [r56_bundeslaender_crackdown_state] diminuée"
austria.53.d.a:0 "Nos efforts pour combattre l'influence nazie souterraine en [r56_bundeslaender_crackdown_state] ont été couronnés de succès. Nous sommes maintenant prêts à les combattre dans un autre État."
austria.53.t.b:0 "L'influence nazie en [r56_bundeslaender_crackdown_state] augmentée"
austria.53.d.b:0 "Nos efforts pour combattre l'influence du gouvernement national en [r56_bundeslaender_crackdown_state] ont été couronnés de succès. Nous sommes maintenant prêts à les combattre dans un autre État."
austria.53.a:0 "Très bien."

austria.54.t:0 "Otto Bauer revient de l'exil"
austria.54.d:0 "Avec la démocratisation progressive du gouvernement, de nombreux exilés politiques ayant fui le pays après la prise de contrôle du Front de la Patrie sont revenus.\n\nParmi eux se trouve Otto Bauer, leader du SDAPÖ-L, revenu pour diriger son aile du parti. Cependant, des rumeurs circulent sur sa mauvaise santé, ce qui pourrait affecter son leadership.\n\nIl pourrait être judicieux de lui fournir des soins médicaux pour éviter toute complication."
austria.54.a:0 "Il recevra tous les soins nécessaires."
austria.54.b:0 "Ce ne sont que des rumeurs."

austria.55.t.a:0 "Otto Bauer décède"
austria.55.d.a:0 "Plus tôt aujourd'hui, Otto Bauer, leader du SDAPÖ-L et socialiste éminent, est décédé d'une crise cardiaque dans son sommeil. Sa mort a surpris certains, mais beaucoup avaient prédit cet événement à cause de ses problèmes de santé.\n\nSans sa direction, la faction SDAPÖ-L a décidé de fusionner avec le SDAPÖ-R, avec Karl Renner comme leader du parti unifié."
austria.55.a:0 "Vraiment la fin d'une époque."
austria.56.t:0 "Planque nazie repérée à Vienne"
austria.56.d:0 "Plus tôt aujourd'hui, nos services de renseignement ont localisé une planque nazie suspecte à Vienne, contenant des armes et des documents du parti. Lancer un raid contre cette planque pourrait être une bonne étape pour réduire la présence nazie dans la ville, mais cela risquerait d'irriter davantage les Allemands, empêchant toute négociation future avec eux."
austria.56.a:0 "Lancer le raid."
austria.56.b:0 "Ne prenons pas le risque de fâcher les Allemands."

austria.57.t:0 "Planque nazie à Vienne prise d'assaut"
austria.57.d:0 "Suite à notre décision de lancer un raid sur la planque nazie découverte, la Garde nationale a mené une opération contre le repaire suspecté. Les nazis à l'intérieur se sont rendus rapidement et nos forces ont subi des pertes minimes.\n\nDans la planque se trouvaient un stock d'armes et des plans écrits pour un putsch contre notre gouvernement, soutenu par l'Allemagne."
austria.57.a:0 "Mon dieu."

austria.58.t:0 "Négocier avec l'Allemagne ?"
austria.58.d:0 "L'heure des spéculations est révolue. Il devient de plus en plus évident que les Allemands préparent une invasion de l'Autriche, et nous ne pouvons pas nous permettre de rester les bras croisés. Nos forces armées ont été placées en alerte maximale, mais une partie importante du gouvernement suggère de tenir une dernière conférence avec l'Allemagne pour tenter d'éviter un bain de sang."
austria.58.a:0 "Essayons de leur envoyer une offre."

austria.59.t:0 "La conférence de Berchtesgaden"
austria.59.d:0 "Ayant remarqué nos préparatifs contre un Anschluss, le gouvernement [AUS.GetAdjective] a tenté de négocier avec nous. Nous pourrions saisir cette occasion pour pousser [AUS.GetLeader] à nommer Arthur Seyss-Inquart, un nazi autrichien influent, comme ministre, afin qu'il influence le gouvernement autrichien pour ne pas résister à l'Anschluss."
austria.59.a:0 "Nous allons présenter nos exigences."

austria.60.t:0 "La conférence de Berchtesgaden"
austria.60.d:0 "Aujourd'hui, [AUS.GetLeader] et [GER.GetLeader] se sont rencontrés dans la ville frontalière bavaroise de Berchtesgaden pour discuter d'une solution possible au conflit à venir.\n\n[GER.GetLeader] a formulé des demandes simples : nommer le dirigeant nazi Arthur Seyss-Inquart au gouvernement et libérer tous les prisonniers nazis actuellement détenus."
austria.60.a:0 "Avons-nous vraiment le choix ?"
austria.60.b:0 "C'est inacceptable !"

austria.61.t:0 "[AUS.GetNameDefCap] accepte nos exigences"
austria.61.d:0 "[AUS.GetLeader] a cédé à nos exigences et nommé Arthur Seyss-Inquart au gouvernement. Cela nous permet d'influencer leur politique, ce qui pourrait faciliter l'acceptation de futures demandes."
austria.61.a:0 "Très bien."

austria.62.t:0 "[AUS.GetNameDefCap] refuse nos exigences"
austria.62.d:0 "[AUS.GetLeader] nous a clairement fait savoir qu'il considère nos exigences comme inacceptables et qu'il ne négociera plus avec nous. Cela nous empêche de contrôler le gouvernement [AUS.GetAdjective] et pourrait nous forcer à envisager une prise de pouvoir plus violente."
austria.62.a:0 "Si c'est ce qu'ils veulent."

austria.63.t:0 "[GER.GetLeader] s'adresse au Reichstag"
austria.63.d.a:0 "Aujourd'hui, à la suite des négociations entre [GER.GetLeader] et [AUS.GetLeader] à Berchtesgaden concernant la crise diplomatique entre l'Allemagne et l'Autriche, [GER.GetLeader] s'est adressé au Reichstag dans un grand discours, déclarant que le nouveau [GER.GetName] ne tolérera plus la suppression de dix millions de Germains en dehors de ses frontières et qu'il fera tout ce qu'il jugera nécessaire pour les libérer.\n\nDes acclamations ont éclaté dans tout le pays, tandis que les appels à l'unification de tous les Germains se multiplient."
austria.63.d.b:0 "Aujourd'hui, à la suite des négociations entre [GER.GetLeader] et [AUS.GetLeader] à Berchtesgaden concernant la crise diplomatique entre l'Allemagne et l'Autriche, [GER.GetLeader] s'est adressé au Reichstag dans un grand discours, déclarant que le nouveau [GER.GetName] ne tolérera plus la suppression de dix millions de Germains en dehors de ses frontières et qu'il fera tout ce qu'il jugera nécessaire pour les libérer.\n\nIl est évident que ce discours nous vise directement et concerne la crise diplomatique en cours.\n\nLe temps presse."
austria.63.d.c:0 "Aujourd'hui, à la suite des négociations entre [GER.GetLeader] et [AUS.GetLeader] à Berchtesgaden concernant la crise diplomatique entre l'Allemagne et l'Autriche, [GER.GetLeader] s'est adressé au Reichstag dans un grand discours, déclarant que le nouveau [GER.GetName] ne tolérera plus la suppression de dix millions de Germains en dehors de ses frontières et qu'il fera tout ce qu'il jugera nécessaire pour les libérer.\n\nBien que nous ne participions pas aux négociations en cours entre [AUS.GetNameDef] et [GER.GetNameDef], il est évident que ce discours nous vise aussi ainsi que les Germains vivant sur notre territoire. Nous devons nous préparer."
austria.63.a:0 "Vive la Grande Allemagne !"
austria.63.b:0 "Nous ne laisserons pas notre souveraineté être menacée !"
austria.63.c:0 "Nous ne laisserons pas notre intégrité être menacée !"
austria.64.t.a:0 "SDAPÖ propose un front uni"
austria.64.t.b:0 "CSP propose un front uni"
austria.64.d.a:0 "Au milieu de la crise diplomatique en cours, les dirigeants du SDAPÖ ont proposé de soutenir notre gouvernement contre les nazis si nous leur accordions des concessions politiques telles que la levée de l'interdiction de la presse socialiste et la levée des restrictions sur les symboles et drapeaux socialistes.\n\nC'est une concession énorme à faire, et qui annule pratiquement tous les progrès réalisés ces dernières années pour réprimer les socialistes, mais cela pourrait être notre seule chance d'obtenir suffisamment de soutien pour résister aux nazis."
austria.64.d.b:0 "Au milieu de la crise diplomatique en cours, les dirigeants du Parti social chrétien ont proposé de soutenir notre gouvernement contre les nazis si nous leur accordions des concessions politiques telles que la nomination de membres de leur parti à certains ministères du gouvernement et l'extension de l'influence de l'Église catholique dans le pays.\n\nC'est une concession énorme à faire, et qui annule pratiquement tous les progrès réalisés ces dernières années pour réprimer les vestiges du VF, mais cela pourrait être notre seule chance d'obtenir suffisamment de soutien pour résister aux nazis."
austria.64.a:0 "Pour une Autriche indépendante."
austria.64.b:0 "Nous n'avons pas besoin d'eux !"

austria.65.t:0 "La troisième guerre civile autrichienne"
austria.65.d.a:0 "Depuis le putsch de juillet qui a failli renverser le jeune gouvernement Dolfuss, beaucoup prédisaient que les problèmes internes en Autriche n'étaient pas encore terminés. Bien que les nazis aient été vaincus par la Vaterländische Front, le chancelier Dolfuss a été tué pendant les combats et de nombreuses unités de la SS ont réussi à se cacher.\n\nLeurs prédictions étaient exactes. Plus tôt aujourd'hui, suite au déclenchement de la guerre entre [AUS.GetNameDef] et [GER.GetNameDef], des unités nazies à travers le pays, loyales à Berlin, se sont soulevées contre le gouvernement de [AUS.GetLeader] en soutien à l'Allemagne.\n\nQuel que soit le destin de la nation [AUS.GetAdjective], cet événement a radicalement modifié l'équilibre des pouvoirs en Europe."
austria.65.d.b:0 "Depuis le putsch de juillet qui a failli renverser le jeune gouvernement Dolfuss, beaucoup prédisaient que les problèmes internes en Autriche n'étaient pas encore terminés. Bien que les nazis aient été vaincus par la Vaterländische Front, le chancelier Dolfuss a été tué pendant les combats et de nombreuses unités de la SS ont réussi à se cacher.\n\nLeurs prédictions étaient exactes. Plus tôt aujourd'hui, suite au déclenchement de la guerre entre [AUS.GetNameDef] et [GER.GetNameDef], des unités nazies à travers le pays se sont soulevées contre le gouvernement de [AUS.GetLeader] et l'Allemagne, avec le soutien des nazis ayant fui l'Allemagne à la fin de la guerre civile.\n\nQuel que soit le destin de la nation [AUS.GetAdjective], cet événement a radicalement modifié l'équilibre des pouvoirs en Europe."
austria.65.d.c:0 "Depuis le putsch de juillet qui a failli renverser le jeune gouvernement Dolfuss, beaucoup prédisaient que les problèmes internes en Autriche n'étaient pas encore terminés. Bien que les nazis aient été vaincus par la Vaterländische Front, le chancelier Dolfuss a été tué pendant les combats et de nombreuses unités de la SS ont réussi à se cacher.\n\nLeurs prédictions étaient exactes. Plus tôt aujourd'hui, des unités nazies à travers le pays, loyales à Berlin, se sont soulevées contre le gouvernement de [AUS.GetLeader] en soutien à l'Allemagne.\n\nQuel que soit le destin de la nation [AUS.GetAdjective], cet événement a radicalement modifié l'équilibre des pouvoirs en Europe."
austria.65.d.d:0 "Depuis le putsch de juillet qui a failli renverser le jeune gouvernement Dolfuss, beaucoup prédisaient que les problèmes internes en Autriche n'étaient pas encore terminés. Bien que les nazis aient été vaincus par la Vaterländische Front, le chancelier Dolfuss a été tué pendant les combats et de nombreuses unités de la SS ont réussi à se cacher.\n\nLeurs prédictions étaient exactes. Plus tôt aujourd'hui, des unités nazies à travers le pays se sont soulevées contre le gouvernement de [AUS.GetLeader], avec le soutien des nazis ayant fui l'Allemagne à la fin de la guerre civile.\n\nQuel que soit le destin de la nation [AUS.GetAdjective], cet événement a radicalement modifié l'équilibre des pouvoirs en Europe."
austria.65.a:0 "Le domino allemand fait une nouvelle victime."
austria.65.b:0 "Nous sortirons victorieux !"

austria.66.t:0 "Le CSP remporte les élections [AUS.GetAdjective]"
austria.66.desc:0 "Depuis que la Vaterländische Front a pris le pouvoir, beaucoup doutent de la capacité de l'Autriche à rester indépendante sans soutien étranger. Il semble qu'ils avaient raison, car au cours des derniers mois, le gouvernement de [AUS.GetNameDef] a cédé aux demandes des alliés occidentaux pour organiser des élections démocratiques.\n\nBien que beaucoup aient prédit l'effondrement du gouvernement Schuschnigg face à ces demandes, il semble qu'il ait réussi à conserver le pouvoir grâce au Parti Christlichsoziale réformé, et bien que beaucoup contestent la légitimité de l'élection, il semble que les alliés occidentaux aient accepté le résultat comme satisfaisant."
austria.66.a:0 "Tout se passe comme prévu."
austria.66.b:0 "Ils sont faibles d'avoir cédé à l'Occident."
austria.66.c:0 "Satisfaisant."
austria.66.d:0 "Ils refusent simplement leur héritage allemand !"
austria.66.e:0 "Nous félicitons Herr Schuschnigg."

austria.67.t:0 "Le SDAPÖ-R remporte les élections [AUS.GetAdjective]"
austria.67.desc:0 "Depuis que la Vaterländische Front a pris le pouvoir, beaucoup doutent de la capacité de l'Autriche à rester indépendante sans soutien étranger. Il semble qu'ils avaient raison, car au cours des derniers mois, le gouvernement de [AUS.GetNameDef] a cédé aux demandes des alliés occidentaux pour organiser des élections démocratiques.\n\nMême avant ces développements, beaucoup remettaient en question la popularité du régime autoritaire de Schuschnigg, citant les éléments socialistes encore forts dans la politique autrichienne. Il semble qu'ils avaient raison, car le Sozialdemokratische Partei Österreichs a remporté les élections facilement, en nommant l'aile modérée du parti pour diriger la coalition, avec Karl Renner comme chancelier."
austria.67.a:0 "Vienne est à nouveau rouge !"
austria.67.b:0 "Ils sont faibles d'avoir cédé à l'Occident."
austria.67.c:0 "Une surprise assurément, mais bienvenue."
austria.67.d:0 "Ils refusent simplement leur héritage allemand !"
austria.67.e:0 "Nous félicitons Herr Renner."

austria.68.t:0 "Le SDAPÖ-L remporte les élections [AUS.GetAdjective]"
austria.68.desc:0 "Depuis que la Vaterländische Front a pris le pouvoir, beaucoup doutent de la capacité de l'Autriche à rester indépendante sans soutien étranger. Il semble qu'ils avaient raison, car au cours des derniers mois, le gouvernement de [AUS.GetNameDef] a cédé aux demandes des alliés occidentaux pour organiser des élections démocratiques.\n\nMême avant ces développements, beaucoup remettaient en question la popularité du régime autoritaire de Schuschnigg, citant les éléments socialistes encore forts dans la politique autrichienne. Il semble qu'ils avaient raison, car le Sozialdemokratische Partei Österreichs a remporté les élections facilement, dirigé par son ancien leader exilé, Otto Bauer, revenu pour diriger le parti en ces temps difficiles."
austria.68.a:0 "Vienne est à nouveau rouge !"
austria.68.b:0 "Ils sont faibles d'avoir cédé à l'Occident."
austria.68.c:0 "Une surprise assurément, mais bienvenue."
austria.68.d:0 "Ils refusent simplement leur héritage allemand !"
austria.68.e:0 "Nous félicitons Herr Bauer."
austria.69.t:0 "La faute du cheval"
austria.69.d:0 "C'était censé être impossible. Les réformes du gouvernement devaient rester nominales, juste un bon spectacle pour les puissances occidentales. Pourtant, Figl l'a fait.\n\nÀ la tête d'une coalition rassemblant des membres de son aile du CSP et d'autres partis, Leopold Figl a réussi à provoquer un vote de défiance contre le chancelier Schuschnigg, le destituant ainsi que la plupart des vestiges du régime austrofasciste.\n\nFigl a annoncé la transformation du Parti chrétien-social en **Austrian People's Party**, se distançant du gouvernement VF. Seul l'avenir dira si ce nouveau gouvernement réussira là où Schuschnigg a échoué."
austria.69.a:0 "Parfois, le cavalier est nul."

austria.70.t:0 "Fini l'imbécile"
austria.70.d:0 "La pièce est devenue silencieuse lorsque la porte s'est refermée.\n\n\"Ainsi en est-il.\"\n\n\"Tu as été un outil utile, mais ton tempérament chaud te causera toujours des ennuis. Tu aurais dû rester avec le vice-chancelier.\"\n\n\"J'ai toujours pensé que tu étais faible, Kurt. Au moins je me suis trompé.\"\n\n\"Adieu, Ernst.\""
austria.70.a:0 "La douille est tombée par terre."

austria.71.t:0 "La direction nazie fuit l'Allemagne"
austria.71.d:0 "Avec l'effondrement du gouvernement nazi et la fin de la guerre civile allemande, les derniers membres du gouvernement nazi ont fui le pays. Certains se sont réfugiés en Autriche, espérant inciter la population à former un nouveau gouvernement nazi, mettant notre gouvernement en grave danger.\n\nQue devons-nous faire ?"
austria.71.a:0 "Ignorer, nous avons d'autres priorités."
austria.71.b:0 "Les arrêter et les remettre aux autorités allemandes !"

austria.72.t:0 "Les généraux nazis sortent de leur cachette"
austria.72.d:0 "Avec la récente prise de pouvoir nazie dans notre pays, les généraux nazis ayant échappé à l'effondrement du gouvernement allemand se sont révélés et proposent leur soutien à notre gouvernement."
austria.72.a:0 "Leur aide sera grandement appréciée."

austria.73.t:0 "La marche sur Vienne"
austria.73.d:0 "Tout le monde l'avait prévu. Aujourd'hui, les milices Heimwehr de tout le pays ont marché sur le parlement de Vienne, exigeant la démission de Schuschnigg, le qualifiant de dirigeant faible et inapte.\n\nBien que le Bundesheer se préparait à intervenir, il reçut l'ordre de rester à l'écart par Schuschnigg lui-même lorsqu'il sortit du parlement.\n\nDescendant les marches, il croisa Starhemberg."
austria.73.a:0 "\"Ne détruis pas ce que nous avons mis tant de temps à construire.\""

austria.74.t:0 "Rébellion des nazis autrichiens !"
austria.74.d:0 "Après l'échec de notre putsch contre le gouvernement autrichien en juillet 1934, nos forces nazies ont patienté pour frapper au bon moment. Aujourd'hui, voyant la faiblesse du gouvernement, de nombreuses milices rurales loyales ont déclenché une rébellion contre [AUS.GetLeader], plongeant le pays dans une guerre civile.\n\nS'ils gagnent, ils promettent de réunir l'Autriche à l'Allemagne, et il pourrait être dans notre intérêt de les soutenir, bien que cela risque d'escalader le conflit.\n\nQue devons-nous faire ?"
austria.74.a:0 "Envoyer un soutien, mais ne pas intervenir directement."
austria.74.b:0 "Nous allons libérer nos frères autrichiens !"

austria.75.t:0 "[AUS.GetNameDefCap] demande du soutien !"
austria.75.d:0 "Aujourd'hui, de nombreuses milices autrichiennes loyales au régime nazi ont organisé un coup d'État, déclenchant une guerre civile. Comme nous avons promis de protéger l'Autriche, [AUS.GetLeader] nous a suppliés d'intervenir pour écraser la rébellion.\n\nIntervenons-nous ?"
austria.75.a:0 "Une promesse est une promesse."
austria.75.b:0 "Nous ne pouvons pas risquer d'escalader la situation pour le moment."

austria.76.t:0 "[AUS.GetNameDefCap] propose le retour des propriétés bohémiennes"
austria.76.d:0 "Avant l'effondrement de l'Empire austro-hongrois, de nombreux citoyens possédaient des biens en Bohême, confisqués après la création de la République tchécoslovaque.\n\nMaintenant, avec [AUS.GetNameDef] contrôlant la Bohême, ils proposent de restituer ces biens en échange de loyauté. Acceptons-nous ?"
austria.76.a:0 "Affaire conclue."
austria.76.b:0 "Nous préférons préserver notre indépendance."

austria.77.t:0 "[LIE.GetNameDefCap] accepte notre offre"
austria.77.d:0 "Le gouvernement [LIE.GetAdjective] a accepté notre offre et a juré allégeance en échange de la restitution de leurs biens."
austria.77.a:0 "Très bien."

austria.78.t:0 "[LIE.GetNameDefCap] refuse notre offre"
austria.78.d:0 "Le gouvernement [LIE.GetAdjective] a refusé notre offre, préférant préserver son indépendance nationale."
austria.78.a:0 "S'ils le souhaitent ainsi."
austria.78.b:0 "Nous devons assurer le contrôle !"

austria.79.t:0 "[GER.GetLeader] remplace Josef Leopold"
austria.79.d:0 "Aujourd'hui, le gouvernement nazi allemand a montré son influence en Autriche en remplaçant Josef Leopold, Landesleiter d'Autriche, par une figure plus pro-allemande.\n\nBien que leader des nazis autrichiens depuis le putsch raté de juillet, sa position pro-indépendance déplait à Berlin, et [GER.GetLeader] le remplace par Hubert Klausner.\n\nAvec la chute de Leopold, le poste perd de son influence, laissant la direction du parti nazi aux mains d'Arthur Seyss-Inquart, allié de Heinrich Himmler."
austria.79.a:0 "Nous devons lutter contre l'influence allemande !"

austria.80.t:0 "Le coup de traître d'Inquart"
austria.80.d:0 "Aujourd'hui, dans ce qui semblait être un coup contre Josef Leopold pour son indépendance, des unités SS allemandes ont pris d'assaut le bureau du Landesleiter à Vienne.\n\nLe coup était orchestré par Arthur Seyss-Inquart avec le soutien de Hitler, visant à garder l'Autriche fermement sous contrôle allemand, ouvrant la voie à une possible annexion."
austria.80.a:0 "Le buffon est parti."
austria.80.b:0 "Non ! Nous ne devons pas nous soumettre à Berlin !"

austria.81.t:0 "Prise de pouvoir nazie !"
austria.81.d:0 "Avec le récent changement de gouvernement pro-nazi, les anciennes politiques ont été annulées, inaugurant une nouvelle ère pour l'Autriche."
austria.81.a:0 "Une Autriche allemande n'est pas notre rêve !"

austria.82.t:0 "[AUS.GetNameDefCap] propose l'Anschluss"
austria.82.d:0 "Le nouveau gouvernement autrichien, voyant l'avenir d'un grand État allemand, propose une intégration complète à l'Allemagne. Il est temps de concrétiser la volonté du peuple.\n\nCe qui était interdit par les traités de Saint-Germain et de Versailles se manifeste désormais : l'union germano-autrichienne sera réalisée, premier pas pour unir tous les peuples germaniques sous un seul État !"
austria.83.t:0 "Destin de l'Ostmark"
austria.83.d:0 "Avec la fin de la guerre civile autrichienne, notre nouveau protectorat au sud a connu une lutte de pouvoir entre la faction pro-indépendance dirigée par Josef Leopold et la faction pro-allemande dirigée par Arthur Seyss-Inquart. Grâce à notre soutien, Inquart a réussi à renverser la faction de Leopold et à placer l'Autriche fermement dans notre sphère d'influence.\n\nMaintenant, avec le destin de l'Autriche entre nos mains, nous devons décider de l'avenir du pays."
austria.83.a:0 "L'avenir de l'Autriche est lié à l'Allemagne."
austria.83.b:0 "Il serait peut-être préférable de la garder comme protectorat."

austria.84.t:0 "[AUS.GetNameDefCap] Veut exiger la Slovénie"
austria.84.d:0 "Le peuple slovène a longtemps fait partie des Allemands du Sud, et avec nos ambitions d'unifier tous les Allemands en un seul État, [AUS.GetLeader] nous a demandé d'exiger la Slovénie de [102.controller.GetNameDef] et de la transférer à leur administration."
austria.84.a:0 "Il a raison, nous devrions l'exiger."
austria.84.b:0 "Nous avons des affaires plus urgentes pour le moment."

austria.85.t:0 "[GER.GetNameDefCap] Accepte notre demande"
austria.85.d:0 "[GER.GetLeader] a accepté notre demande de réclamer la Slovénie et a entamé des négociations avec [102.controller.GetNameDef]."
austria.85.a:0 "Très bien."

austria.86.t:0 "[GER.GetNameDefCap] Refuse notre demande"
austria.86.d:0 "[GER.GetLeader] a refusé notre demande de réclamer la Slovénie, disant qu'ils ont d'autres priorités."
austria.86.a:0 "Peut-être une autre fois."

austria.87.t:0 "La Conférence d'Eisenstadt"
austria.87.d:0 "Avec le retour du règne des Habsbourg en [AUS.GetNameDef], il était évident que [AUS.GetLeader] tournerait tôt ou tard ses yeux vers notre nation. Ayant été autrefois en union avec eux, les Autrichiens exigent que nous organisions une conférence sur l'avenir de nos nations.\n\nAvec les souvenirs de l'effondrement de l'Autriche-Hongrie encore présents, le soutien au retour de l'empire est faible. Cependant, refuser la demande autrichienne conduirait sûrement à une rupture des relations, et peut-être à la guerre."
austria.87.a:0 "Peut-être qu'un retour à l'ancien est notre chemin vers le nouveau monde."
austria.87.b:0 "Notre indépendance ne sera plus jamais menacée !"

austria.88.t:0 "Début de la Conférence d'Eisenstadt"
austria.88.d:0 "Face à la réalité de la situation, [HUN.GetNameDef] a envoyé une délégation à Eisenstadt pour négocier les conditions du retour de l'Empire.\n\nActuellement, si la conférence réussissait, [HUN.GetNonIdeologyName] resterait un État nominalement indépendant en union personnelle avec [AUS.GetNameDef], mais nous pourrions proposer des mesures augmentant notre influence sur eux, en restant prudents : si les [HUN.GetAdjective]s sentent que nous exerçons trop d'influence, ils pourraient quitter la conférence, ouvrant la voie à la guerre."
austria.88.a:0 "Commençons."

austria.89.t:0 "[HUN.GetNameDefCap] Refuse nos demandes"
austria.89.d:0 "Notre délégation auprès du gouvernement [HUN.GetAdjective] est revenue les mains vides, car [HUN.GetLeader] a refusé de négocier, affirmant que l'indépendance de la Hongrie ne sera jamais menacée par l'impérialisme autrichien."
austria.89.a:0 "Ils ne nous laissent pas le choix."
austria.89.b:0 "Ils apprendront leur leçon tôt ou tard."

austria.90.t:0 "Échec des négociations à Eisenstadt"
austria.90.d.a:0 "Après un mois de négociations infructueuses, la délégation [HUN.GetAdjective] a quitté la conférence, affirmant que nos représentants ont clairement montré leur mépris envers la nation hongroise. [HUN.GetLeader] a dénoncé les efforts de [AUS.GetLeader] comme une nouvelle tentative de domination autrichienne."
austria.90.d.b:0 "Après un mois de négociations infructueuses, nous avons retiré notre délégation de la conférence à Eisenstadt. La délégation [AUS.GetAdjective] a clairement montré son mépris pour l'indépendance de notre nation et nous devons abandonner les négociations pour empêcher la domination autrichienne de notre pays."
austria.90.a:0 "Ils ne nous laissent pas le choix."
austria.90.b:0 "Ils apprendront leur leçon tôt ou tard."

austria.91.t:0 "[AUS.GetNameDefCap] Propose l'intégration économique"
austria.91.d:0 "La délégation [AUS.GetAdjective] a proposé de relier nos économies dans un système centralisé, augmentant l'efficacité de l'industrie impériale. Cependant, cette proposition placerait davantage notre industrie entre les mains des [AUS.GetAdjective], ce qui est inacceptable pour certains membres du gouvernement."
austria.91.a:0 "Leurs conditions sont acceptables."
austria.91.b:0 "Non ! Nous traçons la ligne ici !"

austria.92.t:0 "[HUN.GetNameDefCap] Accepte l'intégration économique"
austria.92.d:0 "La délégation [HUN.GetAdjective] a accepté notre demande d'intégration économique entre nos deux nations, nous permettant d'exercer davantage d'influence sur leur économie."
austria.92.a:0 "Très bien."

austria.93.t:0 "[HUN.GetNameDefCap] Refuse l'intégration économique"
austria.93.d:0 "La délégation [HUN.GetAdjective] a refusé notre demande d'intégration économique, affirmant qu'elle n'acceptera pas davantage d'influence autrichienne sur la nation."
austria.93.a:0 "Ils ne savent pas ce qui est bon pour eux."

austria.94.t:0 "[AUS.GetNameDefCap] Propose l'intégration de la production"
austria.94.d:0 "La délégation [AUS.GetAdjective] a proposé de relier notre industrie de production dans un système centralisé, augmentant l'efficacité militaire de l'empire. Cependant, cela placerait davantage notre production entre les mains des [AUS.GetAdjective], ce qui est inacceptable pour certains membres du gouvernement."
austria.94.a:0 "Leurs conditions sont acceptables."
austria.94.b:0 "Non ! Nous traçons la ligne ici !"

austria.95.t:0 "[HUN.GetNameDefCap] Accepte l'intégration de la production"
austria.95.d:0 "La délégation [HUN.GetAdjective] a accepté notre demande d'intégration de la production entre nos deux nations, nous permettant d'exercer davantage d'influence sur leur armée."
austria.95.a:0 "Très bien."

austria.96.t:0 "[HUN.GetNameDefCap] Refuse l'intégration de la production"
austria.96.d:0 "La délégation [HUN.GetAdjective] a refusé notre demande d'intégration de la production, affirmant qu'elle n'acceptera pas davantage d'influence autrichienne."
austria.96.a:0 "Ils ne savent pas ce qui est bon pour eux."

austria.97.t:0 "[AUS.GetNameDefCap] Propose l'intégration des ressources"
austria.97.d:0 "La délégation [AUS.GetAdjective] a proposé de centraliser l'extraction des ressources dans un système centralisé, augmentant l'efficacité commerciale de l'empire. Cependant, cela placerait davantage nos ressources entre les mains des [AUS.GetAdjective], ce qui est inacceptable pour certains membres du gouvernement."
austria.97.a:0 "Leurs conditions sont acceptables."
austria.97.b:0 "Non ! Nous traçons la ligne ici !"

austria.98.t:0 "[HUN.GetNameDefCap] Accepte l'intégration des ressources"
austria.98.d:0 "La délégation [HUN.GetAdjective] a accepté notre demande d'intégration des ressources entre nos deux nations, nous permettant d'exercer davantage d'influence sur leur commerce."
austria.98.a:0 "Très bien."
austria.99.t:0 "[HUN.GetNameDefCap] refuse l'intégration des ressources"
austria.99.d:0 "La délégation [HUN.GetAdjective] a refusé notre demande d'intégration pour l'exploitation des ressources, affirmant qu'elle n'acceptera pas une influence autrichienne supplémentaire sur la nation."
austria.99.a:0 "Ils ne savent pas ce qui est le mieux pour eux."

austria.100.t:0 "Les négociations à Eisenstadt se concluent"
austria.100.d:0 "Après un mois de négociations entre les délégations [AUS.GetAdjective] et [HUN.GetAdjective], un accord a été conclu avec succès.\n\n[AUS.GetNameDefCap] et [HUN.GetNameDefCap] entreront dans une union personnelle, [HUN.GetNameDefCap] conservant l'indépendance sur la plupart des affaires internes.\n\nDans tout le nouvel empire, des célébrations éclatent et le peuple retrouve l'espoir d'un retour aux anciennes gloires."
austria.100.a:0 "Longue vie à l'Empire !"

austria.101.t:0 "La conférence d'Eisenstadt"
austria.101.desc:0 "Avec le retour des Habsbourg sur le trône d'Autriche, les gouvernements de [AUS.GetNameDef] et [HUN.GetNameDef] se sont réunis à Eisenstadt pour négocier le retour du règne des Habsbourg sur la Hongrie.\n\nAprès un mois de négociations acharnées, il semble que celles-ci aient été couronnées de succès, car aujourd'hui [AUS.GetLeader] et [HUN.GetLeader] ont annoncé conjointement le retour de la Double Monarchie austro-hongroise, bouleversant fortement l'équilibre des pouvoirs en Europe centrale et dans les Balkans."
austria.101.a:0 "Longue vie à l'Empire !"
austria.101.b:0 "Un nouvel allié puissant au nord est très bénéfique pour nous."
austria.101.c:0 "Nous devons sécuriser nos frontières."
austria.101.d:0 "N'ont-ils pas tiré de leçon de la première fois ?"

austria.102.t:0 "Guerre sur le Danube"
austria.102.d:0 "Depuis le retour des Habsbourg sur le trône d'Autriche, les relations entre les gouvernements de [AUS.GetNameDef] et [HUN.GetNameDef] se sont tendues, [AUS.GetLeader] revendiquant non seulement le trône d'Autriche mais aussi celui de Hongrie.\n\nCette rupture a atteint son apogée aujourd'hui, [AUS.GetLeader] annonçant que le retour aux jours glorieux de l'ancien Empire autrichien est inévitable, et que si cela doit passer par la guerre, cela se fera, [HUN.GetLeader] restant ferme.\n\nL'avenir des deux nations reste incertain, mais cet événement secouera sûrement la fragile paix dans les Balkans."
austria.102.a:0 "Nous sortirons vainqueurs !"
austria.102.b:0 "Alors la chute de l'Empire était définitive."

austria.103.t:0 "Des éléments de la Heimwehr s'opposent au règne des Habsbourg"
austria.103.d:0 "Après nos négociations réussies avec la Hongrie, certains éléments radicaux restants du gouvernement austrofasciste de la Front patriotique dirigé par Ernst Rüdiger Starhemberg commencent à s'opposer à notre gouvernement, affirmant que nous avons montré de la faiblesse en n'affirmant pas notre domination sur les terres de l'ancien Empire.\n\nNous devrions surveiller de près cette situation, car un échec à contenir cette opposition pourrait conduire à un coup d'État à l'avenir."
austria.103.a:0 "Gardons un œil attentif sur cela."

austria.104.t:0 "Des éléments de la Heimwehr lancent un coup d'État !"
austria.104.d:0 "Après notre échec à gérer les éléments de la Heimwehr qui s'opposaient à notre gouvernement, Ernst Rüdiger Starhemberg et le reste de la Heimwehr ont lancé un coup d'État contre le Kaiser, visant à restaurer le gouvernement austrofasciste de la Front patriotique."
austria.104.a:0 "Ils seront écrasés !"
austria.104.b:0 "Le Kaiser a trahi l'Autriche pour la dernière fois !"

austria.105.t:0 "[HUN.GetNameDefCap] rompt les liens diplomatiques !"
austria.105.d:0 "Affirmant que [AUS.GetLeader] a une fois de plus montré que les Habsbourg travaillent contre l'État hongrois en refusant de reconnaître les territoires de la Grande Hongrie, [HUN.GetLeader] a annoncé aujourd'hui que [HUN.GetNameDef] se retire de la Double Monarchie et a déclaré l'indépendance de la nation."
austria.105.a:0 "Ils ne s'opposeront pas au progrès ! Ils doivent être écrasés !"
austria.105.b:0 "Qu'ils partent."

austria.106.t:0 "L'Autriche transfère la Slovaquie"
austria.106.d:0 "Avec la capitulation de [CZE.GetNameDefCap], [AUS.GetLeader] a reconnu notre revendication sur la Slovaquie, transférant les territoires à notre nation, nous rapprochant un peu plus de la formation de la Grande Hongrie."
austria.106.a:0 "C'est bien que nous soyons d'accord."

austria.107.t:0 "L'Autriche établit un État fantoche slovaque"
austria.107.d:0 "Avec la capitulation de [CZE.GetNameDefCap], [AUS.GetLeader] a rejeté notre revendication sur la totalité de la Slovaquie, créant plutôt un gouvernement sujet dans la majorité du pays, ne nous laissant que la Slovaquie du Sud et la Ruthénie subcarpathique."
austria.107.a:0 "Ne faisons pas de vagues."
austria.107.b:0 "Nous ne tolérerons plus ce manque de respect !"

austria.108.t:0 "L'Autriche reconnaît la Croatie hongroise"
austria.108.d:0 "Avec la guerre contre [YUG.GetNameDef] semblant imminente, [AUS.GetLeader] a exprimé son soutien à nos revendications sur la Croatie, des terres qui appartenaient autrefois à la Hongrie à l'époque de l'Empire."
austria.108.a:0 "C'est bien que nous soyons d'accord."

austria.109.t:0 "L'Autriche soutient l'indépendance croate"
austria.109.d:0 "Avec la guerre contre [YUG.GetNameDef] semblant imminente, [AUS.GetLeader] a exprimé son soutien à un royaume croate indépendant, s'opposant directement à nos revendications dans la région."
austria.109.a:0 "Ne faisons pas de vagues."
austria.109.b:0 "Nous ne tolérerons plus ce manque de respect !"

austria.110.t:0 "L'Autriche reconnaît les revendications transylvaniennes"
austria.110.d:0 "En signe de bonne volonté, [AUS.GetLeader] a exprimé son soutien à la domination hongroise sur notre territoire légitime de Transylvanie et a déclaré que l'Autriche aidera [HUN.GetNameDef] dans tout conflit contre [ROM.GetNameDef]."
austria.110.a:0 "C'est bien que nous soyons d'accord."
austria.111.t:0 "L'Autriche plaide pour l'autonomie de la Transylvanie"
austria.111.d:0 "Alors qu'une guerre avec [ROM.GetNameDef] semble imminente, [AUS.GetLeader] a exprimé son soutien à un gouvernement autonome en Transylvanie, capable de représenter les Hongrois de la région sans opprimer la population roumaine."
austria.111.a:0 "Ne faisons pas d'histoires."
austria.111.b:0 "Nous ne tolérerons plus ce manque de respect !"

austria.112.t:0 "[AUS.GetNameDefCap] pousse à la fédéralisation"
austria.112.d:0 "Avec les récentes réformes du gouvernement [AUS.GetAdjective], [AUS.GetLeader] a cherché à fédéraliser les terres cisleithaniennes en une nation unifiée.\n\nAccepter une telle proposition nous ferait perdre notre statut de nation semi-indépendante, mais rendrait notre peuple égal au sein de l'Empire.\n\nQue doit-on décider ?"
austria.112.a:0 "Un petit prix à payer pour le salut."
austria.112.b:0 "Nous ne serons pas intégrés dans le fief des Habsbourg !"

austria.113.t:0 "[FROM.GetNameDefCap] accepte la fédéralisation"
austria.113.d:0 "Le gouvernement [FROM.GetAdjective] a accepté notre demande de fédéralisation de nos territoires. [FROM.GetLeader] a exprimé son soutien aux réformes, affirmant qu'il souhaite voir enfin le peuple [FROM.GetAdjective] devenir un égal au sein de l'Empire."
austria.113.a:0 "Ensemble, nous sommes forts."

austria.114.t:0 "[FROM.GetNameDefCap] refuse la fédéralisation"
austria.114.d:0 "[FROM.GetLeader] a refusé notre offre de fédéralisation, estimant que notre objectif d'unifier la Cisleithanie n'est qu'une tentative de restaurer la domination autrichienne sur l'Empire."
austria.114.a:0 "S'ils le souhaitent."
austria.114.b:0 "Nous devrons les faire céder par la force !"

austria.115.t:0 "[AUS.GetNameDefCap] pousse à la fédéralisation"
austria.115.d:0 "Avec les récentes réformes du gouvernement [AUS.GetAdjective] et le succès de leur fédéralisation des terres de Cisleithanie, [AUS.GetLeader] cherche à poursuivre la fédéralisation de l'Empire vers les terres transleithaniennes.\n\nAccepter cette proposition nous ferait perdre notre statut de nation semi-indépendante, mais rendrait notre peuple égal au sein de l'Empire.\n\nQue doit-on décider ?"
austria.115.a:0 "Un petit prix à payer pour le salut."
austria.115.b:0 "Nous ne serons pas intégrés dans le fief des Habsbourg !"

austria.116.t:0 "[FROM.GetNameDefCap] accepte la fédéralisation"
austria.116.d:0 "Le gouvernement [FROM.GetAdjective] a accepté notre demande de fédéralisation de nos territoires. [FROM.GetLeader] a exprimé son soutien aux réformes, affirmant qu'il souhaite voir enfin le peuple [FROM.GetAdjective] devenir un égal au sein de l'Empire."
austria.116.a:0 "Ensemble, nous sommes forts."

austria.117.t:0 "[FROM.GetNameDefCap] refuse la fédéralisation"
austria.117.d:0 "[FROM.GetLeader] a refusé notre offre de fédéralisation, estimant que notre objectif d'unifier la Cisleithanie n'est qu'une tentative de restaurer la domination autrichienne sur l'Empire."
austria.117.a:0 "S'ils le souhaitent."
austria.117.b:0 "Nous devrons les faire céder par la force !"

austria.118.t:0 "[AUS.GetNameDefCap] pousse à la fédéralisation de la Transleithanie"
austria.118.d:0 "Plus tôt dans la journée, [AUS.GetLeader], outrepassant enfin son autorité, a exigé la fédéralisation des terres transleithaniennes au sein d'un Empire Habsbourg unifié. Une telle proposition serait désastreuse pour notre nation, nous soumettant définitivement aux griffes de la menace Habsbourg. Nous devons riposter !"
austria.118.a:0 "[HUN.GetLeader] ne nous a apporté que ruine ! Il faut se lever !"
austria.118.b:0 "Nous ne prendrons pas cette humiliation ! Il faut résister à l'oppression Habsbourg !"

austria.119.t:0 "Guerre civile en [HUN.GetNameDef] !"
austria.119.d:0 "Suite à nos récentes tentatives de fédéraliser les terres transleithaniennes de l'Empire, une guerre civile a éclaté contre le gouvernement de [HUN.GetLeader].\N\NLes rebelles, prétendant résister à la domination Habsbourg, ont pris le contrôle de la majeure partie de la nation, tandis que nos forces loyales subissent de lourdes pertes, pouvant servir de prétexte à intervenir et intégrer les forces loyalistes restantes."
austria.119.a:0 "Ils ne nous empêcheront pas d'agir !"
austria.119.b:0 "Mieux vaut ne pas intervenir."

austria.120.t:0 "[AUS.GetNameDefCap] propose le transfert du Burgenland"
austria.120.d:0 "Pour montrer que le [AUS.GetAdjective] respecte la volonté du peuple hongrois, [AUS.GetLeader] a proposé de restituer le Burgenland, ancien territoire hongrois, à notre nation. Si nous acceptons, nous serons sous pression pour accepter d'autres demandes autrichiennes, mais la chance de récupérer notre territoire perdu depuis Trianon pourrait valoir le risque."
austria.120.a:0 "Enfin, nous faisons un pas vers la vengeance de Trianon !"
austria.120.b:0 "Nous ne prendrons pas leurs miettes !"

austria.121.t:0 "[HUN.GetNameDefCap] accepte le transfert du Burgenland"
austria.121.d:0 "La délégation [HUN.GetAdjective] a accepté notre offre et l'État du Burgenland sera transféré à eux à la fin de la conférence."
austria.121.a:0 "Très bien."

austria.122.t:0 "[HUN.GetNameDefCap] refuse le transfert du Burgenland"
austria.122.d:0 "La délégation [HUN.GetAdjective] a refusé notre offre pour le transfert du Burgenland, affirmant que cela ne ferait que mettre la Hongrie sous pression pour accepter d'autres demandes [AUS.GetAdjective]."
austria.122.a:0 "C'est leur perte."

austria.123.t:0 "Infiltration [AUS.GetAdjective] en Croatie !"
austria.123.d:0 "Ces derniers mois, nous avons reçu des rapports d'armes [AUS.GetAdjective] retrouvées parmi les milices croates. Avec le retour des Habsbourg au trône d'Autriche, il semble probable que ces incidents ne soient pas isolés et que les [AUS.GetAdjective] arment des séparatistes croates pour affaiblir notre nation."
austria.123.a:0 "Nous devons rester vigilants et traiter ces révoltés."

austria.124.t:0 "Problèmes linguistiques dans l'armée"
austria.124.d:0 "Avec notre récente expansion et les tentatives de recruter des populations non germanophones de nos nouveaux territoires, notre armée est paralysée par des problèmes de coordination, car les officiers subalternes ne comprennent pas les ordres donnés en allemand par leurs supérieurs. Cela fragilise notre organisation et une solution doit être trouvée rapidement."
austria.124.a:0 "Nous trouverons une solution."

austria.125.t:0 "[AUS.GetLeader] pousse pour l'indépendance autrichienne"
austria.125.d:0 "Le nouveau dirigeant autrichien, [AUS.GetLeader], soutenu par nous pendant leur guerre civile, tente récemment d'accroître l'autonomie de l'Autriche. Il affirme que bien que l'Autriche ait beaucoup à apprendre des grandes victoires de [GER.GetLeader], et que les destins de [AUS.GetNameDef] et [GER.GetNameDef] soient liés, il ne croit pas qu'une union des deux nations soit dans l'intérêt de l'Autriche.\n\nNombre de nos conseillers mettent en garde contre la perte de contrôle sur l'Autriche, car la direction nazie du pays est instable et pourrait perdre le pouvoir si laissée à elle-même.\n\nNous avons l'option d'envoyer nos unités SS loyales, dirigées par Arthur Seyss-Inquart, pour effectuer un coup d'État contre le gouvernement de [AUS.GetLeader]. Le choix nous appartient."
austria.125.a:0 "Contactez Seyss-Inquart et dites-lui de lancer un coup d'État."
austria.125.b:0 "S'ils le souhaitent, ils doivent rester libres."

austria.126.t:0 "[AUS.GetLeader] résiste au coup d'État !"
austria.126.d:0 "Nos agents SS en Autriche ont rencontré de la résistance dans le coup d'État contre [AUS.GetLeader]. Pour sécuriser la nation, nous devons intervenir immédiatement."
austria.126.a:0 "Ils nous ont forcés la main."

austria.127.t:0 "Gérer l'interdiction des mille marks"
austria.127.d:0 "Mise en place peu après l'arrivée au pouvoir d'Engelbert Dollfuss, l'interdiction des mille marks, obligeant tout citoyen allemand entrant en Autriche à payer 1 000 marks au Reich, est l'une des nombreuses sanctions économiques contre l'Autriche.\n\nPour sortir notre nation du désastre économique actuel, nous devons gérer ces sanctions.\n\nCertains disent que la seule façon de sauver notre économie est de négocier avec [GER.GetNameDef], mais leurs conditions seraient coûteuses et renforceraient les nazis dans notre pays.\n\nSinon, nous pourrions chercher de nouveaux partenaires commerciaux, mais cela prendrait du temps."
austria.127.a:0 "Un accord avec l'Allemagne serait dangereux mais bénéfique."
austria.127.b:0 "Un accord avec l'Allemagne ne ferait que renforcer les nazis chez nous."

austria.128.t:0 "[AUS.GetNameDefCap] veut que nous levions l'interdiction des mille marks"
austria.128.d:0 "Mise en place après l'arrivée d'Engelbert Dollfuss, l'interdiction des mille marks, obligeant tout citoyen allemand entrant en Autriche à payer 1 000 marks, est l'une des nombreuses sanctions que nous avons imposées contre le gouvernement anti-nazi autrichien.\n\nLa semaine dernière, [AUS.GetLeader] a demandé la levée de cette interdiction et d'autres sanctions, offrant de nommer des ministres pro-nazis, renforçant ainsi l'influence de [AUS.GetNameDef]."
austria.128.a:0 "Intégrer des figures pro-nazies au gouvernement autrichien pourrait être bénéfique."
austria.128.b:0 "Les sanctions ont été imposées pour une raison."
austria.129.t:0 "[GER.GetNameDefCap] lève les sanctions économiques"
austria.129.d:0 "En acceptant notre proposition, [GER.GetLeader] a accepté de lever les sanctions économiques contre notre nation, mais ce compromis a un coût élevé pour notre pays, les Allemands nous ayant forcés à nommer plusieurs figures pro-nazies dans notre gouvernement."
austria.129.a:0 "Peut-être que le prix était trop élevé."

austria.130.t:0 "[GER.GetNameDefCap] refuse de lever les sanctions économiques"
austria.130.d:0 "[GER.GetLeader] a refusé de lever les sanctions sur notre nation, affirmant que tant qu'un gouvernement anti-nazi serait au pouvoir à Vienne, il n'y aurait aucune réconciliation entre nos deux nations."
austria.130.a:0 "Nous n'avons donc pas d'autre choix."

austria.131.t:0 "Éléments Heimwehr déstabilisant la nation"
austria.131.d:0 "Suite à notre décision de ne pas intégrer la Heimwehr lors de nos préparatifs pour la guerre civile, de nombreux éléments non contrôlés par les alliés du gouvernement circulent librement, déstabilisant notre nation."
austria.131.a:0 "Ils doivent être neutralisés dès que possible."

austria.132.t:0 "Signature du Juliabkommen"
austria.132.desc:0 "Il s'est écoulé un peu plus de trois ans depuis la formation du Front patriote anti-nazi en Autriche, mais il semblerait que la nation ait finalement été contrainte de céder à la pression de [GER.GetNameDef].\n\nPlus tôt cette semaine, estimant que l'effet de l'embargo [GER.GetAdjective] sur la nation [AUS.GetAdjective] était devenu trop important, [AUS.GetLeader] a rencontré [GER.GetLeader] pour renégocier plusieurs des sanctions [GER.GetAdjective].\n\nEn apparence, il semblerait que [AUS.GetLeader] ait réussi, car la plupart des sanctions ont été levées. Cependant, un examen plus approfondi révèle qu'il a été forcé de nommer de nombreux ministres pro-nazis dans son cabinet, entraînant la nation déjà fragile encore davantage dans la sphère d'influence [GER.GetAdjective]."
austria.132.a:0 "Nous ne pouvons qu'espérer le meilleur."
austria.132.b:0 "Tout se déroule comme prévu."
austria.132.c:0 "Nous ne pouvons pas laisser [AUS.GetNameDef] tomber dans la sphère allemande !"
austria.132.d:0 "Un autre domino tombe en place."

austria.133.t:0 "Héritage du putsch de juillet"
austria.133.d:0 "Un an après l'interdiction du parti nazi autrichien par Engelbert Dollfuss le 19 juin 1933, la Schutzstaffel a lancé un putsch raté contre le gouvernement du Front patriote. Pendant le coup sanglant lancé le 25 juillet, l'armée fédérale entière a été mobilisée pour combattre les troupes SS, réussissant finalement à les vaincre, mais le chancelier Dollfuss a été tué, laissant notre nouveau régime très vulnérable.\n\nAprès avoir pris le pouvoir suite à la mort de Dollfuss, Kurt Schuschnigg a juré de s'assurer qu'un tel événement ne se reproduise plus, mais il existe encore de nombreux partisans nazis, déstabilisant fortement notre nation. Nous devons nous en occuper pour affronter la tempête à venir."
austria.133.a:0 "Autriche, réveille-toi !"
austria.133.b:0 "L'Autriche ne peut pas gérer tant de choses à la fois..."

austria.134.t.a:0 "[AUS.GetLeader] refuse l'ultimatum allemand"
austria.134.t.b:0 "[GER.GetNameDefCap] recule face à l'Anschluss"
austria.134.d.a:0 "Au cours des derniers mois, une crise diplomatique s'est développée entre [GER.GetNameDef] et [AUS.GetNameDef], le gouvernement allemand exerçant une forte pression en vue d'une annexion de l'Autriche.\n\nCes événements ont culminé hier, lorsque [GER.GetLeader] a envoyé à [AUS.GetLeader] une dernière demande de nommer un chancelier pro-nazi qui annexerait la nation à l'Allemagne, demande qui a été refusée catégoriquement.\n\nAvec ce refus, il semble que [GER.GetLeader] ait déjà commencé à mobiliser son armée pour prendre l'Autriche par la force."
austria.134.d.b:0 "Au cours des derniers mois, une crise diplomatique s'est développée entre [GER.GetNameDef] et [AUS.GetNameDef], le gouvernement allemand exerçant une forte pression en vue d'une annexion de l'Autriche.\n\nCes événements ont culminé hier, lorsque [GER.GetLeader] a envoyé à [AUS.GetLeader] une dernière demande de nommer un chancelier pro-nazi qui annexerait la nation à l'Allemagne, demande qui a été refusée catégoriquement.\n\nIl semble alors que [GER.GetLeader] ait reculé, craignant une intervention des alliés de [AUS.GetNameDef]."
austria.134.a:0 "L'Autriche triomphera !"
austria.134.b:0 "Ils regretteront leurs actions."
austria.134.c:0 "Nous soutiendrons volontiers nos amis autrichiens."
austria.134.d:0 "Un geste audacieux."

austria.135.t:0 "Guerre civile en Italie"
austria.135.d:0 "Suite aux échecs de Benito Mussolini dans la guerre contre [ETH.GetNameDef], une rébellion contre sa direction a éclaté en guerre civile. Comme [ITA.GetNameDef] joue un rôle clé dans nos affaires étrangères et contrôle des territoires que nous revendiquons, il pourrait être judicieux d'intervenir d'une manière ou d'une autre."
austria.135.a:0 "Examinons nos options."

austria.136.t:0 "[39.GetName] saisi !"
austria.136.d:0 "Notre brève escarmouche avec les forces de [39.controller.GetNameDef] s'est soldée par une victoire écrasante ! Nous avons saisi [39.GetName] de l'oppression [39.controller.GetAdjective] et sommes un pas de plus vers la récupération de notre territoire légitime !"
austria.136.a:0 "Une grande victoire !"

austria.137.t:0 "Défaite à [39.GetName]"
austria.137.d:0 "À notre grand désarroi, l'escarmouche à [39.GetName] contre [39.controller.GetNameDef] s'est soldée par une défaite humiliante. Nos forces ont été mises en déroute et nous n'avons réussi à sécuriser aucun territoire. Cependant, les soldats [39.controller.GetAdjective] n'ont pas pénétré notre territoire. Peut-être aurons-nous une autre chance à l'avenir."
austria.137.a:0 "Nous nous préparerons pour la prochaine fois."

austria.138.t:0 "Défaite à [39.GetName]"
austria.138.d:0 "À notre grand désarroi, l'escarmouche à [39.GetName] contre [AUS.GetNameDef] s'est soldée par une défaite humiliante. Nos forces ont été mises en déroute et nous n'avons pas réussi à défendre la région."
austria.138.a:0 "Laissez-les faire. Nous avons d'autres choses à gérer."
austria.138.b:0 "Cette attaque ne restera pas impunie !"

austria.139.t:0 "Victoire à [39.GetName]"
austria.139.d:0 "Le [AUS.controller.GetAdjective] pensait pouvoir s'emparer de notre territoire, mais nous avons facilement vaincu leurs forces faibles."
austria.139.a:0 "Peut-être que cela leur servira de leçon."

austria.140.t:0 "Rassemblement [AUS.controller.GetAdjective] à la frontière."
austria.140.d:0 "Des rapports indiquent que des troupes [AUS.GetAdjective] se rassemblent à la frontière avec [39.GetName]. Certains pensent qu'il s'agit d'un bluff, mais d'autres estiment qu'ils pourraient profiter du chaos de notre guerre civile pour tenter de prendre le contrôle de la région."
austria.140.a:0 "Nous devons être prêts si c'est le cas."

austria.1000.t:0 "Retour du Saint-Empire romain ?"
austria.1000.d:0 "Avec notre conquête des anciennes villes clés du Saint-Empire romain, certains pensent qu'il est temps de déclarer la restauration de l'empire, pour annoncer pleinement le retour de la domination autrichienne en Europe."
austria.1000.a:0 "La nouvelle ère de la domination autrichienne ne fait que commencer !"
austria.1000.b:0 "Ces jours sont révolus."
austria.1001.t:0 "Retour du Saint-Empire romain"
austria.1001.d:0 "Au cours des dernières décennies, de nombreux experts avaient prédit qu'un État germanique unifié finirait par se former. Cependant, personne ne s'attendait à ce que cela se fasse de cette manière.\n\nAlors que les troupes autrichiennes marchent sur Prague, Rome et Francfort, [AUS.GetLeader] a déclaré le début d'une nouvelle ère de domination autrichienne sur l'Europe et a proclamé le retour du Saint-Empire romain, autrefois disparu.\n\nCet événement a complètement modifié l'équilibre des pouvoirs en Europe, établissant une nouvelle hégémonie des Habsbourg sur le continent."
austria.1001.a:0 "Un véritable retour à une époque révolue."

austria.1125.t:0 "[FROM.GetNameDefCap] réclame la Slovénie"
austria.1125.d:0 "Le gouvernement [FROM.GetAdjective] exerce depuis peu une pression politique sur la région de Slovénie. Une guerre contre eux pourrait être coûteuse, mais pouvons-nous vraiment céder ces terres si facilement ?"
austria.1125.a:0 "Si cela épargne des vies à notre peuple, oui."
austria.1125.b:0 "Jamais ! [ROOT.GetNameDefCap] défendra son territoire !"

austria.1126.t:0 "[YUG.GetNameDefCap] cède la Slovénie"
austria.1126.d:0 "Les [YUG.GetAdjective] ont judicieusement cédé les terres que nous demandions, accordant à nos troupes un accès complet ainsi que le contrôle de toutes les installations. Nos plans se déroulent comme prévu."
austria.1126.a:0 "Excellent."

austria.1127.t:0 "[YUG.GetNameDefCap] refuse nos demandes"
austria.1127.d:0 "La fausse nation émergente de [YUG.GetNameDef] semble vouloir nous résister. Quelle autre explication pourrait justifier un refus si impoli ? Nous devrons reprendre ce qui nous appartient."
austria.1127.a:0 "Il semble donc que nous n'ayons pas le choix."

austria.5006.t:0 "[AUS.GetNameDefCap] propose le traité de Liechtenstein"
austria.5006.d:0 "Des diplomates de [AUS.GetNameDef] sont arrivés avec une proposition de traité. Son objectif est clairement d'élargir sa liste d'alliés en cas de conflit armé. Avec l'expansionnisme [GER.GetAdjective] en hausse et l'Europe semblant se diriger vers une nouvelle guerre, il pourrait être sage d'écouter leurs propositions et de considérer sérieusement leur offre."
austria.5006.a:0 "Oui, nous devons chercher des alliés en cas d'une nouvelle guerre en Europe."
austria.5006.b:0 "Nous ne pouvons pas accepter une proposition qui pourrait compromettre notre neutralité."

austria.5007.t:0 "[FROM.GetNameDefCap] refuse notre traité"
austria.5007.d:0 "[FROM.GetNameDefCap] a rejeté notre proposition d'alliance, soit par désir de maintenir une neutralité stricte face au reste du monde, soit en raison de divergences avec notre gouvernement."
austria.5007.a:0 "Zut."

austria.5018.t:0 "Ultimatum de Transylvanie"
austria.5018.d:0 "[AUS.GetNameDefCap] nous a demandé de lui restituer la Transylvanie. Ils ont autrefois gouverné cette région, mais la Grande Guerre a changé cela. Cependant, la menace qu'ils représentent est maintenant réelle."
austria.5018.a:0 "Nous ne pouvons pas affronter seuls [AUS.GetNameDef]."
austria.5018.b:0 "Après leur défaite lors de la Grande Guerre, ils n'oseraient pas."

austria.5019.t:0 "[FROM.GetNameDefCap] refuse notre ultimatum"
austria.5019.d:0 "Il semble que le gouvernement de [FROM.GetNameDef] ne reconnaisse pas le pouvoir de la nation avec laquelle il traite. Ils ont refusé notre ultimatum, refusant d'admettre nos droits historiques sur la Transylvanie."
austria.5019.a:0 "Si la plume échoue, l'épée doit parler !"

