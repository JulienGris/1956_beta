ITA_liberalize_our_industries_idea:0 "Libéralisation des industries"
ITA_liberalize_our_industries_idea_desc:0 "La nationalisation et le contrôle strict des industries, bien qu’efficaces au départ, se sont révélés inefficaces à long terme. Pour garantir notre stabilité économique, nous autoriserons à nouveau les industries à fonctionner librement."
italo_balbo_pol:0 "Italo Balbo"
victor_emmanuel:0 "Vittorio Emanuele III"
ITA_military_research_stretched_thin:0 "Recherche militaire surchargée"
ITA_military_research_stretched_thin_desc:0 "Notre recherche militaire est étirée à l’extrême dans la tentative de suivre le rythme technologique de nos rivaux. Il fallait céder quelque part, et malheureusement, ce sont nos avancées pour les forces terrestres qui en ont pâti. La seule vraie solution consiste à développer massivement notre industrie militaire, aujourd’hui bien trop sollicitée. Ainsi, nous pourrons enfin libérer des ressources pour travailler plus efficacement sur des projets expérimentaux."
ITA_military_research_stretched_thin_tt:0 "\n§WCet§! §YEsprit national§! sera §Gsuppressé§! §Ulorsque nous disposerons de§! 50 §Yusines militaires§!."

