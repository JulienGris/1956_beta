l_french:
  # Ministres
 balbo_dead:0 "Italo Balbo est mort."

 # Drapeaux
 ITA_dino_alfieri:0 "Dino Alfieri"
 ITA_pietro_koch:0 "Pietro Koch"
 ITA_manlio_morgagni:0 "Manlio Morgagni"
 ITA_pietro_gazzera:0 "Pietro Gazzera"
 ITA_umberto_zanotti_bianco:0 "Umberto Zanotti Bianco"
 r56_ITA_vanquish_ethiopia_failed:0 "L’Italie capitule face à l’Éthiopie et signe une paix blanche."

 # Traits
 soldier_king:0 "Roi-soldat"

 # Infobulles
 ITA_royal_intervention_tt:0 "Les loyalistes monarchistes et les militaires fidèles au Roi déclencheront une §Yguerre civile§! contre les fascistes !"
 aoi_founded_tt:0 "§Y[AOI.GETNAME]§! sera §Ylibéré§! en tant que §Ysujet§! en Éthiopie"
 r56_aoi_founded_warning_tt:0 "La possession des États éthiopiens par §Y[AOI.GETNAME]§! sera §Rcontestée§! en raison de notre §Rguerre§! contre §Y[ETH.GETNAMEDEF]§!."

 # Décisions
 ITA_foreign_policy_fascism:0 "Politique étrangère fasciste"
 ITA_foreign_policy_fascism_desc:0 "Une politique étrangère plus active nous permettra de mieux défendre nos intérêts et de garantir que notre influence soit maintenue et étendue."

 ITA_renew_the_italo_yemeni_treaty:0 "Renouveler le traité italo-yéménite"
 ITA_renew_the_italo_yemeni_treaty_desc:0 "Le traité italo-yéménite, également connu sous le nom de traité de San'a, fut conclu en 1926. Il reconnaissait l’imam Yahya Muhammad Hamid ed-Din comme roi du Yémen, scellait l’amitié entre nos deux nations et reconnaissait les revendications du Yémen sur Aden. Avec l’annexion de l’Éthiopie et l’extension de notre influence en mer Rouge, nous devrions renouveler ce traité."
 ITA_renew_the_italo_yemeni_treaty_diplomacy:0 "Traité italo-yéménite renouvelé"
 ITA_renew_the_italo_yemeni_treaty_tt:0 "Débloquera des §Ydécisions§! pour intégrer le Yémen dans notre §Ysphère§!"

 ITA_seize_the_balearic_islands:0 "S’emparer des Baléares"
 ITA_seize_the_balearic_islands_desc:0 "La guerre civile en Espagne représente une occasion en or de s’emparer des Baléares, ce qui nous permettrait de mieux contrôler la Méditerranée occidentale. Cependant, une telle saisie brutale ne passera pas inaperçue, et le gouvernement espagnol victorieux appréciera peu que nous ayons profité de sa faiblesse."
 ITA_seize_the_balearic_islands_tt:0 "§RVous ne pourrez plus vous allier à l’Espagne§!\n"
 seized_the_baleares_flag:0 "S’est emparé des Baléares"

 ITA_temporarly_occupy_the_baleares:0 "Occuper temporairement les Baléares"
 ITA_temporarly_occupy_the_baleares_desc:0 "Les Baléares sont bien trop stratégiques pour les laisser aux mains d’un régime potentiellement communiste. Nous enverrons des troupes pour occuper les îles en promettant aux nationalistes de les leur rendre une fois la guerre civile terminée. Bien sûr, s’ils disparaissent, nous n’aurions aucune raison de tenir notre promesse."
 ITA_temporarly_occupy_the_baleares_tt:0 "Vous promettez de rendre les îles aux §Gnationalistes§! §Iune fois la guerre civile terminée§!. Si les §YrÉpublicains§! l’emportent, vous pourrez garder les îles, mais si vous refusez de les rendre aux §Gnationalistes§!, vous subirez de §Rlourdes pénalités§!"

 ITA_cede_884_to_HUN:0 "Céder le Prekmurje à [HUN.GetNameDef]"

 # Événements
 r56_italy.1.t:0 "Le Roi écarte Mussolini du pouvoir"
 r56_italy.1.d:0 "À la suite d’une réunion d’urgence convoquée par le roi Victor-Emmanuel III, ce dernier rencontra Mussolini et lui demanda sa démission, évoquant notamment l’énorme dette dans laquelle [ITA.GetNameDef] s’était enfoncée depuis près de quinze ans, l’abîme économique qu’avait représenté la campagne d’Éthiopie ainsi que les problèmes causés par les embargos. \n\nSous la pression du Grand Conseil du fascisme, qui commençait à se retourner contre lui, surtout sous l’influence des royalistes, Mussolini n’eut d’autre choix que d’accepter l’ordre, préférant cela à la prison. Pietro Badoglio fut alors nommé président du Conseil. Bien que lié à l’administration fasciste, il est considéré comme une figure plus modérée. \n\nLe Roi tente ainsi de sauver l’image de [ITA.GetNameDef], dont la situation ne cesse de se détériorer."
 r56_italy.1.a:0 "Espérons que la situation pourra être redressée."

 r56_italy.2.t:0 "L’armistice éthiopien"
 r56_italy.2.d:0 "L’un des premiers objectifs de Badoglio fut de mettre fin aux coûteux conflits en Éthiopie. Le nouveau ministre des Affaires étrangères, Alfredo Covelli, fut envoyé négocier la paix entre nos deux nations. Il y parvint, mais en contrepartie nous dûmes payer des réparations de guerre pour les destructions civiles causées durant le conflit."
 r56_italy.2.a:0 "Mieux vaut quelques réparations que l’abîme économique permanent."

 r56_italy.3.t:0 "Le nouveau cabinet"
 r56_italy.3.d:0 "Quelques jours après sa nomination, Pietro Badoglio forma son nouveau gouvernement. Même s’il se réclame encore du Parti national fasciste, l’influence fasciste fut réduite au sein des ministères, remplacée par la participation de nombreux monarchistes, probablement sur l’impulsion du roi, soucieux des problèmes qui pourraient naître du maintien des politiques économiques et sociales fascistes."
 r56_italy.3.a:0 "Place au renouveau !"

 r56_italy.4.t:0 "La proposition de Giovanni Messe"
 r56_italy.4.d:0 "Giovanni Messe, général de division et ministre de l’Intérieur, approcha Badoglio avec une proposition claire : infiltrer les chemises noires et autres organisations proches du PNF pour éliminer ses principaux dirigeants de l’intérieur. Ainsi décapité, le mouvement pourrait être dissous sans trop de sang versé."
 r56_italy.4.a:0 "En détruisant ses têtes, le mouvement s’écroulera de lui-même."
 r56_italy.4.b:0 "Et si cela se retournait contre nous ? Trop risqué."

 r56_italy.5.t:0 "Mort d’Arturo Bocchini"
 r56_italy.5.d:0 "Arturo Bocchini, chef de la police et surtout de l’OVRA, la police secrète fasciste, a été retrouvé mort chez lui, deux balles dans la tête. \n\nIl fut choisi comme première cible par peur que l’OVRA ne découvre le complot. Le poste est désormais vacant, réduisant grandement le risque d’être découverts."
 r56_italy.5.a:0 "Excellent."

 r56_italy.6.t:0 "Les fascistes accusent les communistes"
 r56_italy.6.d:0 "Le meurtre de Bocchini choqua les cadres du PNF. Dans « Il Popolo d’Italia », on titra « La menace communiste renaissante », accusant des membres du PCI. \n\nLuigi Russo, chef des chemises noires, appela à une vigilance accrue contre tout élément jugé antifasciste."
 r56_italy.6.a:0 "Au moins, ils ne nous soupçonnent pas."

 r56_italy.7.t:0 "Assassinat des frères Rosselli"
 r56_italy.7.d:0 "Carlo et Sabatino Rosselli, deux exilés antifascistes ayant combattu en Espagne aux côtés des républicains, furent assassinés par l’organisation française « La Cagoule » alors qu’ils se soignaient à Bagnoles-de-l’Orne. \n\nIls étaient les fondateurs du mouvement « Giustizia e Libertà », aux idées allant du libéralisme au socialisme."
 r56_italy.7.a:0 "Deux problèmes en moins."

 r56_italy.8.t:0 "Incident à la Société des Nations"
 r56_italy.8.d:0 "Lors d’un discours de Hailé Sélassié Ier à la SDN dénonçant l’invasion italienne, les journalistes italiens se moquèrent de lui. \n\nLe diplomate roumain Nicolae Titulescu réagit en demandant leur expulsion, allant jusqu’à déclarer : « À la porte les sauvages ! »"
 r56_italy.8.a:0 "Pour qui se prend-il ?"
 ITA_diplomatic_incident_at_the_league_of_nations:0 "Incident à la Société des Nations"
 r56_italy.9.t:0 "Militarisation des Protocoles de Rome"
 r56_italy.9.d:0 "Signés pour la première fois en 1934 entre les gouvernements d’Autriche, de Hongrie et d’Italie, les Protocoles de Rome étaient des accords principalement consacrés à la coopération économique entre les trois nations et à l’opposition à l’intégrité territoriale de la Yougoslavie. Sous la direction de [FROM.GetNameDef], une seconde version de ces protocoles fut signée, incluant une alliance militaire entre les trois nations.\n\nBeaucoup y voient une tentative de [ITA.GetNameDef] de trouver une place en Europe après avoir quitté la Société des Nations, et d’empêcher [GER.GetNameDef] d’intégrer [AUS.GetNameDef]."
 r56_italy.9.a:0 "Peut-être cela garantira-t-il la stabilité de l’Europe centrale."

 r56_italy.10.t:0 "Le second Front de Stresa"
 r56_italy.10.d:0 "Face à ce qu’ils considéraient comme une « menace [GER.GetAdjective] croissante », les gouvernements [ITA.GetAdjective], [FRA.GetAdjective] et [ENG.GetAdjective] se sont de nouveau réunis dans la ville de Stresa pour annoncer la recréation du Front du même nom, qui avait été brisé après l’invasion italienne de l’Abyssinie. Les gouvernements [FRA.GetAdjective] et [ENG.GetAdjective] acceptèrent de lever les embargos contre [ITA.GetNameDef] en échange.\n\nLeur objectif est de maintenir l’intégrité territoriale de [AUS.GetNameDef] face à [GER.GetNameDef] et de s’assurer que ce dernier respecte le traité de Versailles."
 r56_italy.10.a:0 "Des gouvernements radicalement différents, unis pour préserver leur victoire passée."

 r56_italy.11.t:0 "Le Pacte d’Acier"
 r56_italy.11.d:0 "Les divers embargos subis par [ITA.GetNameDef] après son invasion de l’Abyssinie entraînèrent un rapprochement avec des nations différentes de ses alliés traditionnels, en particulier [GER.GetNameDef]. Les relations se réchauffèrent après que l’Italie accepta de cesser de garantir l’Autriche, que l’Allemagne souhaitait finalement annexer malgré la violation du traité de Versailles.\n\nÀ la suite de la signature du Pacte d’amitié et d’alliance entre [GER.GetNameDef] et [ITA.GetNameDef], les deux pays s’engagèrent à se soutenir militairement dans les années à venir."
 r56_italy.11.a:0 "Quelles seront les conséquences pour l’Europe ?"

 r56_italy.12.t:0 "[ITA.GetNameDefCap] veut réformer le Front de Stresa"
 r56_italy.12.d:0 "Craignant que [GER.GetNameDef] ne cherche à transgresser le traité de Versailles, notamment par sa rhétorique revancharde, [ITA.GetNameDef] nous appela à réformer le Front de Stresa afin de garantir qu’aucune agression non provoquée, comme celle survenue en Abyssinie, ne se reproduise.\n\nNous nous engagerions ainsi à garantir l’intégrité territoriale de [AUS.GetNameDef] et les termes du traité de Versailles, ce qui pourrait mener à une réponse militaire si nécessaire."
 r56_italy.12.a:0 "Le traité de Versailles doit être défendu à tout prix !"
 r56_italy.12.b:0 "Nous ne pouvons plus faire confiance à [ITA.GetNameDef]."

 r56_italy.13.t:0 "[ITA.GetNameDefCap] veut réformer le Front de Stresa"
 r56_italy.13.d:0 "Craignant que [GER.GetNameDef] ne cherche à transgresser le traité de Versailles, notamment par sa rhétorique revancharde, [ITA.GetNameDef] nous appela à réformer le Front de Stresa afin de garantir qu’aucune agression non provoquée, comme celle survenue en Abyssinie, ne se reproduise.\n\nNous nous engagerions ainsi à garantir l’intégrité territoriale de [AUS.GetNameDef] et les termes du traité de Versailles, ce qui pourrait mener à une réponse militaire si nécessaire."
 r56_italy.13.a:0 "Il serait prudent d’accepter."
 r56_italy.13.b:0 "[ITA.GetNameDefCap] a déjà franchi la ligne une fois, qu’est-ce qui nous garantit qu’il ne le refera pas ?"

 r56_italy.14.t:0 "Réformation du Front de Stresa"
 r56_italy.14.d:0 "[FRA.GetNameDefCap] et [ENG.GetNameDef] ont accepté de réformer notre front commun contre [GER.GetNameDef].\n\nEspérons que cela permettra de sauvegarder ce pour quoi nous nous sommes battus durant la Grande Guerre et de garantir la paix en Europe."
 r56_italy.14.a:0 "L’Entente renaît !"

 r56_italy.15.t:0 "[FROM.GetNameDefCap] veut militariser les Protocoles de Rome"
 r56_italy.15.d:0 "Invoquant notamment le revanchisme croissant en [GER.GetNameDef], qui pourrait menacer les intérêts de [AUS.GetNameDef], [HUN.GetNameDef] et [ITA.GetNameDef], [FROM.GetLeader] proposa d’étendre les Protocoles de Rome pour y inclure une alliance militaire défensive et offensive.\n\nSelon eux, la création d’un nouveau bloc en Europe centrale et méridionale permettrait d’éviter toute domination par des puissances belliqueuses."
 r56_italy.15.a:0 "Il serait prudent d’accepter."
 r56_italy.15.b:0 "Cela risquerait de provoquer une guerre encore plus vaste, refusons !"

 r56_italy.16.t:0 "Ultimatum [ITA.GetAdjective]"
 r56_italy.16.d:0 "L’ambassadeur [ITA.GetAdjective] déclara que la Roumanie faisait partie des régions stratégiques du Pacte de Rome, notamment pour [ITA.GetNameDef] et [HUN.GetNameDef], et remit un ultimatum au gouvernement [ROM.GetAdjective].\n\nIls exigent que la totalité de la Transylvanie soit rendue à [HUN.GetNameDef], que les intérêts [ITA.GetAdjective] dans les champs pétrolifères soient garantis, et que le gouvernement [ITA.GetAdjective] obtienne un droit de regard sur les décisions gouvernementales, y compris un veto accordé à l’ambassadeur.\n\n[ITA.GetNameDefCap] précisa clairement que tout refus pourrait entraîner une intervention militaire."
 r56_italy.16.a:0 "Nous n’avons pas le choix."
 r56_italy.16.b:0 "Nous ne céderons pas si facilement notre indépendance !"

 r56_italy.17.t:0 "[ROM.GetNameDefCap] refuse l’ultimatum !"
 r56_italy.17.d:0 "Décrivant les exigences [ITA.GetAdjective] comme « absurdes », le gouvernement [ROM.GetAdjective] refusa l’ultimatum envoyé il y a quelques jours et rejeta toute renégociation. Nous avions menacé de représailles militaires en cas de refus.\n\nReste à savoir si nous devons mettre nos menaces à exécution ou les repousser."
 r56_italy.17.a:0 "Ils ont choisi leur destin."
 r56_italy.17.b:0 "Nous ne pouvons pas nous permettre une guerre maintenant."

 r56_italy.18.t:0 "[ITA.GetNameDefCap] propose une coopération militaire plus étroite"
 r56_italy.18.d:0 "Ces derniers mois, nos relations avec [ITA.GetNameDef] se sont réchauffées, l’Italie ayant été diplomatiquement et économiquement abandonnée par ses anciens alliés, les puissances de l’Entente. \n\nL’ambassadeur [ITA.GetAdjective] nous proposa de signer une alliance militaire entre nos deux nations, destinée en particulier à l’assistance dans une hypothétique guerre contre [ENG.GetNameDef], [FRA.GetNameDef] ou [SOV.GetNameDef].\n\nUn rapprochement avec [ITA.GetNameDef] nous permettrait sans doute de sécuriser les Alpes méridionales. Il nous assurerait aussi un certain contrôle en Méditerranée et en Afrique, deux zones que nous ne maîtrisons plus. \n\nCependant, n’oublions pas la trahison initiale que nous avons subie au début de la Grande Guerre et nos divers conflits d’intérêts dans des zones d’influence qui se chevauchent largement."
 r56_italy.18.a:0 "L’Axe Rome-Berlin ne sera jamais vaincu !"
 r56_italy.18.b:0 "Cela ne mènerait qu’à une nouvelle trahison."

 r56_italy.19.t:0 "[GER.GetNameDefCap] accepte le pacte"
 r56_italy.19.d:0 "Le gouvernement [GER.GetAdjective] a répondu positivement à notre proposition d’alliance militaire, scellant officiellement l’amitié et la coopération entre nos deux nations, prouvant que nous n’avons pas besoin de céder aux exigences des démocraties de l’Entente."
 r56_italy.19.a:0 "Un nouvel Axe est né !"

 r56_italy.20.t:0 "[GER.GetNameDefCap] refuse le pacte !"
 r56_italy.20.d:0 "Déclarant qu’une coopération entre nos deux nations n’apporterait aucun avantage à [GER.GetNameDef], ils ont rejeté notre proposition d’alliance militaire."
 r56_italy.20.a:0 "Encore une fois, nous avons été abandonnés !"

 r56_italy.21.t:0 "[FROM.GetNameDefCap] exige le contrôle de notre politique intérieure"
 r56_italy.21.d:0 "L’ambassadeur [FROM.GetAdjective] nous transmit une demande directe de [FROM.GetCapitalVictoryPointName]. Le gouvernement [FROM.GetAdjective] exige un droit de regard et de veto sur notre politique interne et externe, affirmant vouloir défendre « les intérêts de la nation [FROM.GetAdjective] au sein de [ROOT.GetName] ».\n\nLe diplomate précisa qu’un refus pourrait être accompagné de lourdes sanctions économiques, voire d’une intervention militaire en cas de ce qu’ils considéreraient comme « une atteinte grave aux nombreux efforts [FROM.GetAdjective] consentis en [ROOT.GetName] ».\n\nAccepter ces demandes signifierait une perte significative de l’indépendance [ROOT.GetAdjective]."
 r56_italy.21.a:0 "Nous ne craignons aucune armée, qu’ils viennent !"
 r56_italy.21.b:0 "Nous n’avons pas le choix."

 r56_italy.22.t:0 "[FROM.GetNameDefCap] refuse l’ultimatum"
 r56_italy.22.d:0 "Décrivant nos exigences comme « une véritable insulte à la nation [FROM.GetAdjective] et à son peuple », le gouvernement [FROM.GetAdjective] refusa notre demande de contrôle plus strict sur leur politique. Comment devrions-nous réagir ?"
 r56_italy.22.a:0 "Ils connaissaient les conséquences : envahissons-les !"
 r56_italy.22.b:0 "Nous n’avons pas le temps pour une guerre avec [FROM.GetNameDef]."

 r56_italy.23.t:0 "[ITA.GetNameDefCap] exige la Dalmatie"
 r56_italy.23.d:0 "Invoquant la présence historique d’une population [ITA.GetAdjective] dans la région dalmate, le gouvernement [ITA.GetAdjective] nous adressa une demande pour restituer l’ensemble de la province de Dalmatie à [ITA.GetNameDef], avec évacuation des troupes [ROOT.GetAdjective] sous 72 heures après le transfert. Il menaça de représailles militaires en cas de refus."
 r56_italy.23.a:0 "Si cela évite une guerre, soit."
 r56_italy.23.b:0 "La Dalmatie nous appartient légitimement !"

 r56_italy.24.t:0 "[103.Owner.GetNameDefCap] refuse d’abandonner la Dalmatie !"
 r56_italy.24.d:0 "Le gouvernement [103.Owner.GetAdjective] nous fit savoir qu’il ne « pliera pas face à un gouvernement qui ne respecte pas le peuple vivant en Dalmatie », et l’on constate une augmentation de la présence militaire dans la région et le long de leur frontière avec nous. Que devons-nous faire ?"
 r56_italy.24.a:0 "Ils auraient dû céder pacifiquement. Nous la reprendrons par la force !"
 r56_italy.24.b:0 "Nous reviendrons plus tard."

 r56_italy.25.t:0 "La garantie du Front de Stresa envers [AUS.GetNameDef]"
 r56_italy.25.d:0 "Déclarant que c’était « la priorité du Front de Stresa », le gouvernement [ITA.GetAdjective] proposa de signer une déclaration officielle de protection envers [AUS.GetNameDef], lui permettant de compter sur nous en cas de conflit, notamment avec [GER.GetNameDef]."
 r56_italy.25.a:0 "[AUS.GetNameDefCap] bénéficie de notre protection."
 r56_italy.25.b:0 "Nous n’avons aucun intérêt à défendre [AUS.GetNameDef]."

 r56_italy.26.t:0 "[ITA.GetNameDefCap] s’empare des Baléares"
 r56_italy.26.d:0 "Affirmant vouloir « sauvegarder les intérêts [ITA.GetAdjective] en Méditerranée et surtout protéger ces îles », le gouvernement [ITA.GetAdjective] décida de s’emparer des Baléares, envoyant plusieurs garnisons pour y établir sa présence."
 r56_italy.26.a:0 "Nous n’avons jamais autorisé cela !"

 r56_italy.27.t:0 "[ITA.GetNameDefCap] occupe les Baléares pour nous"
 r56_italy.27.d:0 "Le gouvernement [ITA.GetAdjective] a décidé d’envoyer une garnison aux Baléares pour empêcher le gouvernement républicain d’y accéder. Il nous déclara qu’il ne faisait que protéger nos intérêts en empêchant les Républicains de dominer la Méditerranée."
 r56_italy.27.a:0 "Espérons qu’ils nous les rendront."


r56_italy.28.t:0 "Le Front de Stresa refusé"
r56_italy.28.d:0 "Le gouvernement de [From.GetNameDefCap] a décidé de rejeter notre proposition de réforme du Front de Stresa. Nous allons donc devoir continuer sans leur aide."
r56_italy.28.a:0 "Notre route se fera sans eux."

r56_italy.29.t:0 "La question du budget de la Regia Marina"
r56_italy.29.d:0 "Depuis la fin de la Grande Guerre, le gouvernement italien s’est fixé pour objectif de dominer la Méditerranée et, pour y parvenir, a lancé de vastes projets de modernisation de la marine. Cependant, ces projets ont un coût. Ainsi, une partie du budget généralement allouée à l’armée a été redirigée vers la Regia Marina, créant un déséquilibre dans la production d’équipements.\n\nNous pourrions tenter d’ajuster le budget afin de revenir à une répartition équitable entre les trois branches, mais peut-être que la clé de la victoire réside dans la domination des mers ?"
r56_italy.29.a:0 "Nous devons revenir à un budget équilibré !"
r56_italy.29.b:0 "Le budget est correct tel qu’il est."
r56_italy.29.c:0 "Davantage de fonds pour la Regia Marina !"

r56_italy.30.t:0 "Événement pour décider si Italo Balbo meurt"
r56_italy.30.d:0 "Vous n’êtes pas censé voir ceci. Si c’est le cas, merci de le signaler !"
r56_italy.30.a:0 "D’accord, je le ferai !"

r56_italy.31.t:0 "Italo Balbo tué dans un accident"
r56_italy.31.d:0 "Alors qu’il était passager d’un Savoia-Marchetti SM.79 devant atterrir à Tobrouk, en Libye, l’avion d’Italo Balbo fut pris pour un chasseur ennemi et abattu par les batteries antiaériennes censées défendre la piste.\n\nHéros de l’aviation italienne et l’un des principaux organisateurs du Partito Nazionale Fascista et de la Marche sur Rome, il fut aussi l’un des plus grands vulgarisateurs de l’aviation en Italie."
r56_italy.31.a:0 "Aujourd’hui nous avons perdu plus qu’un aviateur : nous avons perdu une légende."

r56_italy.32.t:0 "[GRE.GetNameDefCap] protège l’Albanie"
r56_italy.32.d:0 "[GRE.GetNameDefCap] a occupé l’Albanie, notre futur point de débarquement dans les Balkans ; comment devons-nous réagir ?"
r56_italy.32.a:0 "La guerre maintenant !"
r56_italy.32.b:0 "N’attaquons pas encore."

r56_italy.100.t:0 "La formalisation du Front de Stresa"
r56_italy.100.d:0 "Les diplomates de [ITA.GetNameDef], [FRA.GetNameDef] et [ENG.GetNameDef] se sont à nouveau réunis à Stresa, [SWI.GetNameDef], pour le dernier cycle de discussions sur le Front de Stresa contre [GER.GetNameDef]. La proposition est de formaliser le front en une alliance militaire contre l’agression et l’influence allemandes en Europe. Bien que les relations entre les puissances démocratiques et le gouvernement fasciste italien aient été tendues ces dernières années, les pourparlers récents ont été positifs. Alors que [FRA.GetNameDef] semble prêt à rejoindre, certains craignent que ce bloc n’affaiblisse l’indépendance diplomatique de [ENG.GetNameDef]."
r56_italy.100.a:0 "Ensemble, nous tiendrons tête à [GER.GetNameDef]."
r56_italy.100.b:0 "L’accord actuel nous convient."

r56_italy.101.t:0 "Les Alliés rejoignent le Front de Stresa"
r56_italy.101.d:0 "[ENG.GetNameDefCap] et le Commonwealth [ENG.GetAdjective] ont accepté de formaliser le Front de Stresa."
r56_italy.101.a:0 "Excellent."

r56_italy.102.t:0 "Les Alliés refusent de rejoindre le Front de Stresa"
r56_italy.102.d:0 "[ENG.GetNameDefCap] et le Commonwealth [ENG.GetAdjective] ont décliné notre offre de formaliser le Front de Stresa."
r56_italy.102.a:0 "Dommage."

r56_italy.103.t:0 "La formalisation du Front de Stresa"
r56_italy.103.d:0 "Les diplomates de [ITA.GetNameDef], [FRA.GetNameDef] et [ENG.GetNameDef] se sont à nouveau réunis à Stresa, [SWI.GetNameDef], pour le dernier cycle de discussions sur le Front de Stresa afin de contrer l’agression et l’influence croissantes de [GER.GetAdjective] en Europe. Bien que les relations entre les démocraties et le gouvernement fasciste italien aient été tendues ces dernières années, elles se sont récemment apaisées avec une déclaration commune officialisant une alliance militaire entre tous les signataires du Front de Stresa."
r56_italy.103.a:0 "Ensemble pour la victoire !"
r56_italy.103.b:0 "Ils se regroupent comme des moutons effrayés par un loup."
r56_italy.103.c:0 "Espérons qu’ils sauront coopérer pour le bien commun."
r56_italy.107.t:0 "Victor-Emmanuel III prend le pouvoir"
r56_italy.107.d:0 "Avec l’Italie pleinement rétablie, le roi Victor-Emmanuel a pris le pouvoir pour le moment. Le roi a promis que le gouvernement organiserait un référendum sur la monarchie dans un an."
r56_italy.107.a:0 "Un développement intéressant."
ITA_referendum_year_tt:0 "Un §Yréférendum sur la monarchie§! sera organisé dans un an ; si une majorité vote contre la monarchie, de nouvelles élections auront lieu."
r56_italy.107.b:0 "Vive Victor-Emmanuel III !"

r56_italy.108.t:0 "Référendum sur la monarchie"
r56_italy.108.desc:0 "Ces derniers temps, [ITA.GetNameDef] a traversé une période troublée, mais à présent que le pouvoir est de nouveau consolidé et que la stabilité est revenue, nous pouvons enfin nous tourner vers la question centrale : la monarchie d’Italie.\n\nLa monarchie italienne a dirigé la nation et servi de force unificatrice pour la péninsule, mais ces dernières années elle a subi de vives critiques pour son soutien affiché au Parti national fasciste de Mussolini. Certains appellent à l’abolition de la monarchie au profit d’une nouvelle république italienne pleinement indépendante, tandis que d’autres veulent que Victor-Emmanuel poursuive son rôle d’unificateur de la nouvelle Italie. Certains ont même suggéré qu’Emmanuel abdique en faveur de son fils Umberto II, comme solution de compromis.\n\nLe sort final repose entre les mains d’un référendum libre du peuple, qui décidera du destin de la monarchie italienne, vieille de plusieurs décennies."
r56_italy.108.d2:0 "Aujourd’hui marque un jour historique dans l’histoire italienne : la monarchie a été abolie par référendum. Le sort du roi Umberto et de sa famille reste incertain." #anti-monarchie
r56_italy.108.a:0 "Bien que contesté, Victor-Emmanuel III est le seul roi pour l’Italie."
r56_italy.108.b:0 "Forcer Victor-Emmanuel à abdiquer en faveur de son fils, Umberto II."
r56_italy.108.c:0 "La monarchie a mis l’Italie à genoux, elle doit disparaître."
r56_italy.108.d:0 "Umberto II sera un roi plus fidèle."

r56_italy.109.t:0 "Abdication de Victor-Emmanuel"
r56_italy.109.d:0 "Ses pouvoirs ayant été réduits sous la pression des Alliés et sa collaboration avec Mussolini étant controversée, le roi Emmanuel a décidé d’abdiquer. La monarchie, désormais représentée par le fils plus populaire d’Emmanuel, Umberto II, a de meilleures chances de survivre au référendum à venir."
r56_italy.109.a:0 "Bien."

# Idées
ITA_lack_of_powered_planes:0 "Manque de moteurs puissants"
ITA_lack_of_powered_planes_desc:0 "L’une des principales faiblesses de l’aviation [ITA.GetAdjective] réside dans le manque de puissance des moteurs équipant nos avions, ce qui entache le reste de leur équipement.\nUne modernisation significative de nos capacités de production de moteurs est nécessaire pour résoudre ce problème. Nos avions, trop lents, risquent d’être sévèrement désavantagés à une époque où chaque année la vitesse aérienne progresse."

ITA_bloated_military_bureaucracy:0 "Bureaucratie militaire tentaculaire"
ITA_bloated_military_bureaucracy_desc:0 "La tendance excessive de l’armée à privilégier le style plutôt que l’efficacité a rendu plus difficile toute modernisation.\nToute innovation technique ou organisationnelle remettant en cause le prestige du haut commandement est rejetée, forçant l’armée à utiliser des tactiques datant de la Grande Guerre."

ITA_bloated_military_bureaucracy_end_corruption:0 "Bureaucratie militaire tentaculaire"

ITA_fresh_doctrines:0 "Doctrines renouvelées"
ITA_the_backbone_of_the_party_2:0 "La colonne vertébrale du parti"
ITA_stresa_front_idea:0 "Front de Stresa"

ITA_excessive_regia_marina_budget:0 "Budget excessif de la Regia Marina"
ITA_excessive_regia_marina_budget_desc:0 "Parmi les trois forces armées, c’est la Regia Marina qui reçoit la plus grande part du budget, lui permettant une modernisation plus aisée au détriment des autres branches."
ITA_excessive_regia_marina_budget_2:0 "Budget excessif de la Regia Marina"
ITA_excessive_regia_marina_budget_2_desc:0 "Parmi les trois forces armées, c’est la Regia Marina qui reçoit la plus grande part du budget, lui permettant une modernisation plus aisée au détriment des autres branches."

ITA_scientific_cooperation_with_germany:0 "Coopération scientifique avec [GER.GetNameDef]"
ITA_invite_andorra:0 "Inviter [ADR.GetNameDef]"
ITA_invite_andorra_desc:0 "Nous élargirons notre alliance ibérique en invitant [ADR.GetNameDef] à rejoindre notre faction."
ITA_giannini_sarnow_protocols_ger:0 "Protocoles Giannini-Sarnow"

# AOI
ITA_army_of_east_africa:0 "Armée d’Afrique orientale italienne"
ITA_governor_commissariats:0 "Commissariats de gouverneurs"
ITA_collaborators_in_the_hills:0 "Collaborateurs dans les montagnes"
ITA_collaborators_in_the_hills_desc:0 "Si beaucoup souhaitent combattre l’occupation, de nombreuses minorités ethniques au sein de [AOI.GetName] ne veulent pas revenir à l’ancien régime. Ce n’est peut-être pas leur premier choix, mais la soumission à [ITA.GetName] leur paraît préférable à un retour sous la domination de [ETH.GetNameDef]."

soldier_king_2:0 "Roi-soldat"
umberto:0 "Umberto II"

ITA_our_own_sphere:0 "Notre propre sphère"
ITA_our_own_sphere_desc:0 "" #//WIP

ITA_territorial_deal_with_yugoslavia:0 "Accord territorial avec [YUG.GetNameDef]"
ITA_territorial_deal_with_yugoslavia_desc:0 "" #//WIP

ITA_approach_hungary:0 "Se rapprocher de [HUN.GetNameDef]"
ITA_approach_hungary_desc:0 "[HUN.GetNameDefCap] partage un intérêt commun avec nous : la division de [YUG.GetNameDef]. L’intégrer à notre alliance permettrait aussi de lier [ROM.GetNameDef] à notre sphère d’influence."

ITA_our_latin_brothers:0 "Nos frères latins"
ITA_our_latin_brothers_desc:0 "Nous partageons de nombreuses racines culturelles avec [ROM.GetNameDef] et nous ne pouvons ignorer son fort potentiel d’allié, notamment grâce à ses importantes réserves de pétrole. Chercher une alliance avec eux ne pourrait être que bénéfique."

ITA_garantee_austria:0 "ITA_garantee_austria"
ITA_guarantee_austria:0 "Garantir [AUS.GetNameDef]"
ITA_guarantee_austria_desc:0 "" #//WIP

ITA_align_bulgaria:0 "Aligner [BUL.GetNameDef]"
ITA_align_bulgaria_desc:0 "" #//WIP

ITA_claims_on_france2:0 "Revendiquer la France"
ITA_claims_on_france2_desc:0 "Une fois notre domination à l’est assurée, il est temps de récupérer toutes les terres légitimement italiennes que les Français nous ont toujours refusées : la Corse, la Savoie et la Tunisie."

ITA_expand_aviation_research_facilities:0 "Étendre les centres de recherche aéronautique"
ITA_expand_aviation_research_facilities_desc:0 "" #//WIP
ITA_expand_aviation_research:0 "Développer la recherche aéronautique"
ITA_expand_aviation_research_desc:0 "" #//WIP

ITA_reclaim_antalya:0 "Reprendre Antalya"
ITA_reclaim_antalya_desc:0 "" #//WIP

ITA_ally_spain:0 "S’allier à l’Espagne"
ITA_ally_spain_desc:0 "" #//WIP

ITA_intervene_in_spain:0 "Intervenir en Espagne"
ITA_intervene_in_spain_desc:0 "L’échec des nationalistes en Espagne et la montée d’un régime orienté vers le communisme représentent un danger pour la sécurité de toute l’Europe. S’il ne s’effondre pas de lui-même, nous le ferons tomber de l’extérieur."

ITA_approach_portugal:0 "Se rapprocher du Portugal"
ITA_approach_portugal_desc:0 "" #//WIP

ITA_victory_in_ethiopia:0 "Victoire en Éthiopie"
ITA_victory_in_ethiopia_desc:0 "Après des décennies d’humiliation, nous avons enfin surmonté notre défaite contre l’Éthiopie. Une telle victoire ne peut que renforcer la confiance du peuple dans le gouvernement de Mussolini."

ITA_the_desillusion_of_fascism:0 "La désillusion du fascisme"
ITA_the_desillusion_of_fascism_desc:0 "" #//WIP

ITA_ratify_the_stresa_front_tt:0 "Nous demanderons à §Y[ENG.GetNameDef]§! et §Y[FRA.GetNameDef]§! de réformer le §YFront de Stresa§! contre §Y[GER.GetNameDef]§!. Ils doivent tous deux accepter l’offre, sinon cet objectif sera §Rabandonné§!.\n"
ITA_stresa_front_refused_flag:0 "La reformation du Front de Stresa a été refusée."

ITA_leave_the_league_of_nations:0 "Quitter la Société des Nations"
ITA_leave_the_league_of_nations_desc:0 "La Société des Nations, dont l’impuissance est avérée, a néanmoins jugé bon de condamner notre invasion de l’Éthiopie. Nous n’avons pas besoin de son soutien ni de sa validation pour savoir ce qui est bon pour [ITA.GetNameDef]. Nous devons la quitter."

ITA_move_toward_autarky:0 "Se tourner vers l’autarcie"
ITA_move_toward_autarky_desc:0 "Les divers embargos auxquels nous sommes soumis nous forcent à adopter une politique autarcique en matière de ressources."

ITA_the_stab_in_the_back:0 "Triomphe en Afrique"
ITA_the_stab_in_the_back_desc:0 "Malgré tout le sang versé par nos braves soldats durant la Grande Guerre, les nations victorieuses nous ont peu récompensés, nous privant de territoires peuplés d’Italiens. Nous corrigerons cette injustice et réaliserons enfin l’unification totale de l’Italie !"

ITA_the_lega_latina:0 "La Lega Latina"
ITA_the_lega_latina_desc:0 "Nous formerons une alliance militaire pour nous assurer que plus personne ne nous trahira. Nous montrerons au monde que [ITA.GetNameDef] est une puissance respectable, capable d’imposer sa volonté à quiconque voudrait nous défier."

ITA_cooperation_with_germany:0 "Coopération avec [GER.GetNameDef]"
ITA_cooperation_with_germany_desc:0 "Comme nous, les [GER.GetAdjective] cherchent à se venger des puissances de l’Entente. Il serait bénéfique pour nous de nous aligner sur eux afin de créer un front commun."

ITA_joint_austrian_gaurantee:0 "Garantie conjointe de [AUS.GetNameDef]"
ITA_joint_austrian_gaurantee_desc:0 "Depuis des années, l’Allemagne convoite l’Autriche à travers son projet « Anschluss », en violation manifeste du traité de Versailles et du traité de Saint-Germain-en-Laye. Une garantie conjointe de notre part et de nos alliés la dissuadera."
protected_by_the_stresa_front_flag:0 "Protégé par le Front de Stresa"
ITA_joint_austrian_gaurantee_tt:0 "[AUS.GetNameDef] refusera désormais §Gtoujours§! l’§YAnschluss§!\n"

ITA_scientific_cooperation_r56:0 "Coopération scientifique"
ITA_scientific_cooperation_r56_desc:0 "Les scientifiques [GER.GetAdjective]s ont accompli de nombreux progrès, notamment en matière de blindés et de fusées. Une coopération scientifique entre nos deux nations ne pourrait être qu’avantageuse."

ITA_the_italian_tiger:0 "Le tigre italien"
ITA_the_italian_tiger_desc:0 "Les chars lourds [GER.GetAdjective]s se sont montrés redoutablement efficaces sur le champ de bataille. Si nous voulons obtenir des victoires similaires, nous devons concevoir notre propre char, équivalent à celui des [GER.GetAdjective]s."

ITA_ultimatum_to_albania:0 "Ultimatum à [ALB.GetNameDef]"
ITA_ultimatum_to_albania_desc:0 "Nous avons des vues sur l’Albanie depuis de nombreuses années, l’ayant déjà transformée en protectorat de facto. Il est désormais temps de l’intégrer pleinement à notre empire en exigeant la déposition du gouvernement actuel."

ITA_alliance_with_austria:0 "Alliance avec [AUS.GetNameDef]"
ITA_alliance_with_austria_desc:0 "Le meilleur moyen de dissuader [GER.GetNameDef] d’envahir [AUS.GetNameDef] serait de signer un traité d’alliance avec ce dernier, garantissant ainsi ses frontières contre toute agression."

ITA_claims_on_yugoslavia:0 "Revendiquer la Yougoslavie"
ITA_claims_on_yugoslavia_desc:0 "Il est temps de corriger l’une des plus grandes injustices infligées à l’Italie : notre séparation de la Dalmatie, alors que les populations italiennes y sont implantées depuis plusieurs siècles."

ITA_the_new_spain:0 "La nouvelle Espagne"
ITA_the_new_spain_desc:0 "La victoire des forces nationalistes durant la guerre civile espagnole a rapproché nos deux pays, désormais unis culturellement et politiquement. Sans aucun doute, il serait dans notre intérêt de les intégrer à notre alliance militaire."

ITA_expanding_our_influence:0 "Élargir notre influence"

ITA_invade_greece:0 "Envahir la Grèce"
ITA_invade_greece_desc:0 "Prendre le contrôle de la Grèce compléterait notre domination des Balkans et nous offrirait une meilleure base pour contrôler la Méditerranée orientale."

ITA_the_spanish_question:0 "La question espagnole"
ITA_the_spanish_question_desc:0 "La guerre civile a profondément transformé l’Espagne. La péninsule doit être placée sous notre contrôle direct pour sécuriser l’accès à l’Atlantique avant que la situation ne devienne véritablement critique."

ITA_claims_in_africa:0 "Revendiquer l’Afrique"
ITA_claims_in_africa_desc:0 "" #//WIP

ITA_influence_iberia:0 "Influencer l’Ibérie"
ITA_influence_iberia_desc:0 "" #//WIP

ITA_officialize_the_albanian_protectorate:0 "Légitimer le protectorat albanais"
ITA_formalize_the_albanian_protectorate:0 "Formaliser le protectorat albanais"
ITA_formalize_the_albanian_protectorate_desc:0 "Sans aller jusqu’à une annexion directe, l’établissement d’une supervision italienne renforcée sur les décisions politiques de l’Albanie suffirait à en faire un protectorat officiel, sans attirer la colère des Alliés."

ITA_demand_dalmatia:0 "Exiger la Dalmatie"
ITA_demand_dalmatia_desc:0 "Un problème reste non résolu : celui de la Dalmatie, promise à l’Italie à la fin de la Grande Guerre. Avec le soutien de nos alliés, nous devrions facilement convaincre [YUG.GetNameDef] de nous céder cette province."

ITA_preventive_intervention:0 "Intervention préventive"
ITA_preventive_intervention_desc:0 "Aucun traité, aucune sanction et aucun avertissement ne détourneront [GER.GetNameDef]. Pour la sécurité globale de l’Europe, une intervention contre eux est nécessaire."
ITA_prevent_the_spread_of_communism:0 "Empêcher la propagation du communisme"
ITA_prevent_the_spread_of_communism_desc:0 "Les risques de propagation du communisme sont réels, comme l’a montré la guerre civile espagnole. Nous devrons intervenir avant que la situation ne devienne incontrôlable."
ITA_expand_ond_membership:0 "Élargir l’adhésion à l’OND"
ITA_expand_ond_membership_desc:0 "L’Opera Nazionale Dopolavoro, ou Club national des loisirs, est une association créée en 1925 pour organiser le temps libre des ouvriers. Bien qu’apolitique à l’origine, elle est devenue de plus en plus un organe auxiliaire du parti, augmentant ainsi la loyauté des travailleurs envers le fascisme."
ITA_revive_the_opera_nazionale_balilla:0 "Rétablir l’Opera Nazionale Balilla"
ITA_revive_the_opera_nazionale_balilla_desc:0 "L’Opera Nazionale Balilla est une organisation de jeunesse fondée en 1926 sous le contrôle direct du Parti national fasciste, mais servant aussi de force paramilitaire destinée à former une nouvelle génération de soldats loyaux au régime fasciste."
ITA_opera_nazionale_balilla:0 "Opera Nazionale Balilla"
ITA_opera_nazionale_balilla_desc:0 "L’Opera Nazionale Balilla est une organisation de jeunesse fondée en 1926 sous le contrôle direct du Parti national fasciste, mais servant aussi de force paramilitaire destinée à former une nouvelle génération de soldats loyaux au régime fasciste."
ITA_mobilize_womens:0 "Nuova Italiana"
ITA_mobilize_womens_desc:0 "Notre conquête de l’Éthiopie représente l’occasion idéale pour mobiliser les femmes dans la construction de l’Empire italien. Les groupes féminins fascistes étendront leurs rôles pour couvrir de nouvelles tâches, comme la tenue de cours de formation sur la lutte contre le gaspillage domestique."
ITA_expand_the_OVRA:0 "Renforcer l’OVRA"
ITA_expand_the_OVRA_desc:0 "L’Organizzazione per la Vigilanza e la Repressione dell’Antifascismo est un réseau de police secrète chargé de traquer les antifascistes, d’écraser les partisans et de protéger le régime de Mussolini. Avec les temps difficiles qui s’annoncent, il est important d’étendre leurs opérations pour renforcer encore le régime."
ITA_reorganize_the_unpa:0 "Réorganiser l’UNPA"
ITA_reorganize_the_unpa_desc:0 "L’Union nationale pour la défense aérienne a été créée en 1934 pour la défense civile, mais elle doit maintenant être réorganisée afin de préciser son rôle en temps de paix."
ITA_resume_food_importation:0 "Reprendre les importations alimentaires"
ITA_resume_food_importation_desc:0 "À la suite de la Grande Dépression, nous avons tenté de réduire nos importations, notamment de blé, préférant produire nous-mêmes. Cela s’est fait au détriment des fruits et légumes et n’a pas amélioré la situation des paysans. Maintenant que nos embargos ont été levés, nous devrions revenir à notre ancienne situation en important du blé [CAN.GetAdjective] et [USA.GetAdjective]."
ITA_decrease_tariffs:0 "Réduire les tarifs douaniers"
ITA_decrease_tariffs_desc:0 "Nous pourrions réduire les tarifs mis en place après la Grande Dépression afin de stimuler l’économie et de rendre notre commerce plus attractif. Après tout, l’Italie a toujours été reconnue pour ses échanges commerciaux."
ITA_joint_naval_exercises:0 "Manœuvres navales conjointes"
ITA_joint_naval_exercises_desc:0 "L’entraînement naval avec la Royal Navy nous permettrait de moderniser la Regia Marina, toujours en retard sur le plan technologique."
ITA_militarize_the_rome_protocols:0 "Militariser les protocoles de Rome"
ITA_militarize_the_rome_protocols_desc:0 "Les protocoles de Rome étaient des accords signés avec l’Autriche et la Hongrie concernant la coopération économique et une position commune sur l’intégrité territoriale de la Yougoslavie. Transformer ces accords en traité d’alliance permettrait de défendre [AUS.GetNameDef] contre les ambitions de [GER.GetNameDef] et d’étendre l’influence [ITA.GetAdjective] en Europe."
ITA_invite_bulgaria:0 "Inviter [BUL.GetNameDef]"
ITA_invite_bulgaria_desc:0 "Inviter [BUL.GetNameDef] à rejoindre notre alliance permettrait de sécuriser la péninsule balkanique méridionale ainsi que la mer Noire."
ITA_operazione_dacia:0 "Operazione Dacia"
ITA_operazione_dacia_desc:0 "La position stratégique et les ressources pétrolières de la Roumanie signifient que nous ne pouvons pas la laisser passer dans la sphère d’un de nos ennemis. Nous enverrons un ultimatum au gouvernement [ROM.GetAdjective] exigeant une surveillance [ITA.GetAdjective] de ses actions diplomatiques et internes, une garantie d’accès privilégié à son pétrole, et enfin, le retour de la Transylvanie à [HUN.GetNameDef]."
ITA_end_yugoslavia:0 "Mettre fin à la Yougoslavie"
ITA_partition_yugoslavia:0 "Démanteler la Yougoslavie"
ITA_partition_yugoslavia_desc:0 "La Yougoslavie est une aberration née de la volonté des puissances de l’Entente. Il est temps d’y mettre fin."
ITA_end_yugoslavia_desc:0 "La Yougoslavie est une aberration née de la volonté des puissances de l’Entente. Il est temps d’y mettre fin."
ITA_fight_the_reich:0 "Combattre [GER.GetNameDef]"
ITA_fight_the_reich_desc:0 "Il est clair que les ambitions [GER.GetAdjective] entrent en conflit avec les nôtres et pourraient bientôt nous être fatales. Le mieux à faire est de frapper les premiers et de neutraliser la menace."
ITA_complete_the_latin_alliance:0 "Achever l’alliance latine"
ITA_complete_the_latin_alliance_desc:0 "Avec l’adhésion de [ROM.GetNameDef] et de l’Espagne à notre alliance, il est temps d’inclure le Portugal pour compléter le partenariat des nations latines. Cela nous offrirait une position optimale pour dominer l’Atlantique et l’Afrique."
ITA_expand_the_oil_fields:0 "Étendre les champs pétroliers"
ITA_expand_the_romanian_oil_fields:0 "Étendre les champs pétroliers roumains"
ITA_expand_the_romanian_oil_fields_desc:0 "Le pétrole roumain a permis d’approvisionner une grande partie de notre armée, mais nous manquons encore de carburant. L’extension des installations pétrolières doit régler ce problème."
italy_flag_romania_accepted_ultimatum:0 "La Roumanie a accepté notre ultimatum"
ITA_operazione_achaicus:0 "Operazione Achaicus"
ITA_operazione_achaicus_desc:0 "Si nous voulons réformer l’Empire romain, il est évident qu’il nous faudra ajouter la Grèce à notre empire."
ITA_operazione_trajan:0 "Operazione Trajan"
ITA_operazione_trajan_desc:0 "La position stratégique et les ressources pétrolières de la Roumanie signifient que nous ne pouvons pas la laisser passer dans la sphère d’un de nos ennemis. Nous enverrons un ultimatum au gouvernement roumain exigeant une surveillance italienne de ses actions diplomatiques et internes, une garantie d’accès privilégié à son pétrole, et enfin, le retour de la Transylvanie à la Hongrie."
ITA_italianize_dalmatia:0 "Italiser la Dalmatie"
ITA_italianize_dalmatia_desc:0 "Des programmes d’italianisation de la population locale et l’installation de familles italiennes en Dalmatie en feront une province entièrement italienne en quelques années."
ITA_operazione_cesare:0 "Operazione Cesare"
ITA_operazione_cesare_desc:0 "Depuis que la France nous a pris notre chère Corse, les Italiens de France subissent constamment des persécutions, notamment via des programmes destinés à les franciser. Il est temps de retrouver nos frères."
ITA_operazione_vulso:0 "Operazione Vulso"
ITA_operazione_vulso_desc:0 "Le traité de Sèvres nous avait promis de vastes terres en Anatolie, mais nous avons dû y renoncer après notre défaite face aux troupes de Mustafa Kemal. Il est temps de corriger cette erreur dans notre histoire militaire."
ITA_operazione_tiberio:0 "Operazione Tiberio"
ITA_operazione_tiberio_desc:0 "La Yougoslavie est une aberration née de la volonté des puissances de l’Entente. Il est temps d’y mettre fin."
ITA_operazione_druso:0 "Operazione Druso"
ITA_operazione_druso_desc:0 "Il est clair que les ambitions allemandes entrent en conflit avec les nôtres et pourraient bientôt nous être fatales. Le mieux à faire est de frapper les premiers et de neutraliser la menace."
ITA_operazione_costantino:0 "Operazione Costantino"
ITA_operazione_costantino_desc:0 "Personne n’a effrayé le monde autant que la terreur bolchévique réfugiée dans ses froides hauteurs russes. Il est temps de mettre fin à la menace communiste et d’assurer ainsi l’hégémonie italienne en Europe."
ITA_increase_wheat_production:0 "Augmenter la production de blé"
ITA_increase_wheat_production_desc:0 "Les différents embargos compliquent encore davantage notre dépendance aux importations alimentaires. Nous mettrons en place un programme efficace pour inciter les paysans à produire davantage de blé."
ITA_expand_the_comando_supremo:0 "Élargir le rôle du Comando Supremo"
ITA_expand_the_comando_supremo_desc:0 "Le haut commandement joue actuellement un rôle mineur dans les décisions militaires, notamment pour informer les commandants des attentes du gouvernement. Nous devrions élargir à la fois son importance et sa composition."
ITA_maintain_the_three_branches_independence:0 "Maintenir l’indépendance des trois branches"
ITA_maintain_the_three_branches_independence_desc:0 "Le fonctionnement actuel de l’armée permet d’éviter les interférences entre les trois branches principales, améliorant ainsi la rapidité des décisions."
ITA_war_of_rapid_decision:0 "Guerre de décision rapide"
ITA_war_of_rapid_decision_desc:0 "Une armée motorisée et rapide serait idéale en Europe de l’Est et en Afrique du Nord."
ITA_focus_on_firepower:0 "Se concentrer sur la puissance de feu"
ITA_focus_on_firepower_desc:0 "Accroître le rôle de l’artillerie permettrait d’éviter des pertes inutiles tout en augmentant notre capacité de feu."
ITA_war_of_positions:0 "Guerre de positions"
ITA_war_of_positions_desc:0 "Améliorer l’efficacité de l’infanterie au sol serait un excellent compromis pour renforcer nos capacités offensives et défensives."
ITA_resolve_the_automobile_gap:0 "Résorber le retard automobile"
ITA_resolve_the_automobile_gap_desc:0 "La production automobile reste faible et peu d’unités en sont entièrement équipées. Un effort doit être fait pour augmenter la production de véhicules et la moderniser."
ITA_increase_the_number_of_ncos:0 "ITA_increase_the_number_of_ncos"
ITA_increase_the_number_of_nco:0 "Résoudre le manque de sous-officiers"
ITA_increase_the_number_of_nco_desc:0 "Les sous-officiers sont l’épine dorsale de toute armée, et nos divisions en manquent cruellement. Nous recruterons davantage pour améliorer la qualité du commandement."
ITA_modern_era_artillery:0 "Artillerie moderne"
ITA_modern_era_artillery_desc:0 "Une grande partie de notre artillerie date encore de la Grande Guerre. Nous devons lancer un programme général de modernisation afin d’équiper nos soldats d’armes à jour."
ITA_review_the_military_budget:0 "Réviser le budget militaire"
ITA_review_the_military_budget_desc:0 "Pour soutenir l’armée, nous devons augmenter le budget qui lui est alloué."
ITA_the_new_arditi:0 "Les Nouveaux Arditi"
ITA_the_new_arditi_desc:0 "Les « Reparti d’Assalto », plus connus sous le nom d’Arditi, étaient un corps spécial de l’armée italienne pendant la Première Guerre mondiale. Premières troupes de choc modernes, elles étaient redoutées par toutes les puissances centrales. Nombre de leurs anciens membres étant devenus des figures importantes de l’armée, il serait intéressant d’en reformer un équivalent moderne."
ITA_carro_armato:0 "Carro Armato P 40"
ITA_carro_armato_desc:0 "Nous devons accompagner la motorisation de l’armée par un usage accru des chars. La plupart de ceux que nous utilisons datent de la Grande Guerre, il est temps de les moderniser."
ITA_modello_1938:0 "Modello 1938"
ITA_modello_1938_desc:0 "Après les rapports sur ses piètres performances à courte et longue portée, en particulier durant la guerre contre l’Éthiopie, un nouveau modèle de fusil, toujours développé par Carcano, sera introduit dans l’armée pour corriger les défauts du modèle précédent."
ITA_alpini:0 "Alpini"
ITA_cannone_da_75_32:0 "Cannone da 75/32"
ITA_cannone_da_47_32:0 "Cannone da 47/32"
ITA_cannone_da_47_32_desc:0 "Conçu par la firme autrichienne Böhler, le Cannone da 47/32 sera utilisé comme arme d’appui d’infanterie et canon antichar. Nous devrions négocier une licence pour équiper notre armée."
ITA_alpini_desc:0 "Les Alpini sont des troupes spécialisées dans le combat en montagne, ayant fait leurs preuves contre l’Autriche-Hongrie. Il est temps de les moderniser."
ITA_modernise_the_fanti_dell_aria:0 "Moderniser "
ITA_modernize_the_fanti_dell_aria:0 "Moderniser les Fanti Dell’Aria"
ITA_nationalize_the_banking_sector:0 "Nationaliser le secteur bancaire"
ITA_nationalize_the_banking_sector_desc:0 "Les difficultés financières de la Grande Dépression, la brutale déflation et le coût de la guerre d’Éthiopie montrent que le secteur financier ne peut fonctionner correctement qu’avec une supervision stricte de l’État. Nous signerons un décret pour placer les banques sous contrôle public."
ITA_expand_the_iri_role:0 "Élargir le rôle de l’IRI"
ITA_end_the_army_corruption:0 "Mettre fin à la corruption dans l’armée"
ITA_end_the_army_corruption_desc:0 "Notre politique de favoritisme envers les membres du parti nous a donné une armée loyale. Mais elle est aussi devenue corrompue, dirigée par des hommes privilégiant leur influence au détriment de la modernisation. Il est temps de revenir à un système fondé sur le mérite."
ITA_end_the_army_corruption_tt:0 "Certains généraux seront §Yrenvoyés§!"
ITA_the_backbone_of_the_party:0 "La colonne vertébrale du parti"
ITA_the_backbone_of_the_party_desc:0 "L’armée et sa glorification ont rendu le Partito Nazionale Fascista puissant. Nous devons poursuivre cette politique pour renforcer le contrôle politique."
ITA_adapt_great_war_tactics_to_our_era:0 "Adapter les tactiques de la Grande Guerre à notre ère"
ITA_adapt_great_war_tactics:0 "Adapter les tactiques de la Grande Guerre"
ITA_adapt_great_war_tactics_desc:0 "Le Haut Commandement reste convaincu que nous pouvons réutiliser les mêmes tactiques qui nous ont menés à la victoire lors de la Grande Guerre. Nous ne pouvons pas les faire totalement changer d’avis, mais nous pouvons tenter de les adapter suffisamment."
ITA_reshuffle_the_officer_corps:0 "Remanier le corps des officiers"
ITA_reshuffle_the_officer_corps_desc:0 "Les rivalités au sein du haut commandement ont conduit à ce que certains officiers soient promus uniquement en raison de leur affiliation et de leur loyauté envers un chef de l’armée. Des inspections et, si nécessaire, des remaniements doivent être effectués."
ITA_extend_officers_autonomy:0 "Accroître l’autonomie des officiers"
ITA_extend_officers_autonomy_desc:0 "Nous devons donner plus d’autonomie aux officiers sur le terrain afin de permettre des tactiques mieux adaptées."
ITA_pride_of_the_nation:0 "Fierté de la Nation"
ITA_pride_of_the_nation_desc:0 "La propagande militaire doit être encore plus vaste. Le peuple italien doit être fier de son armée, et nous devons le convaincre que s’y engager n’est pas seulement un devoir, mais une véritable fierté personnelle."
ITA_follow_pariani_plan:0 "Suivre le plan de Pariani"
ITA_follow_pariani_plan_desc:0 "Alberto Pariani, chef d’état-major, a promu une doctrine d’avancée rapide et mobile, soutenue par une artillerie lourde d’appui."
ITA_appoint_graziani:0 "Nommer Graziani"
ITA_appoint_graziani_desc:0 "Rodolfo Graziani, principalement connu pour sa répression brutale dans les colonies, en particulier en Libye, plaide pour une guerre plus rapide et pour un rôle accru des chars dans l’armée. Le nommer à sa tête nous permettrait d’engager une modernisation de la mécanisation de nos forces."
ITA_study_the_spanish_civil_war:0 "Étudier la guerre civile espagnole"
ITA_study_the_spanish_civil_war_desc:0 "La guerre civile espagnole nous offre une occasion en or d’étudier les combats modernes."
ITA_question_the_high_command:0 "Mettre en question le Haut Commandement"
ITA_question_the_high_command_desc:0 "Le Haut Commandement est composé de vieux vétérans de la Grande Guerre, qui n’ont connu d’autres conflits que les affrontements coloniaux. Sans forcément les écarter, nous devrions donner davantage de poids aux officiers plus jeunes."
ITA_focus_on_mobilisation:0 "Concentrer nos efforts sur la mobilisation"
ITA_focus_on_mobilization:0 "Concentrer nos efforts sur la mobilisation"
ITA_focus_on_mobilization_desc:0 "Nous devons concentrer nos efforts sur l’amélioration de notre capacité à mobiliser les soldats, afin d’être pleinement préparés lorsque le conflit éclatera."
ITA_further_doctrinal_innovation:0 "Pousser plus loin l’innovation doctrinale"
ITA_further_doctrinal_innovation_desc:0 "Le plan de modernisation étant déjà en place, il est temps d’accélérer la modernisation de nos doctrines de combat."
ITA_high_command_loyalty:0 "Loyauté du Haut Commandement"
ITA_high_command_loyalty_desc:0 "Nos efforts pour renforcer l’autorité du haut commandement nous permettent d’assurer sa loyauté sans faille."
ITA_war_without_bloodshed:0 "Une guerre sans effusion de sang"
ITA_war_without_bloodshed_desc:0 "Recourir à la violence réglerait le problème plus vite, mais cela pourrait se retourner contre nous de façon dramatique. À un moment aussi crucial, nous ne pouvons pas nous le permettre. Une stratégie politique visant à réduire progressivement l’influence des fascistes permettrait une transition en douceur."
ITA_war_without_bloodshed_tt:0 "Les §GFascistes§! mettront bien plus de temps à s’affaiblir, mais cela consolidera les §gMonarchistes§!."
ITA_meet_with_messe:0 "Rencontrer Messe"
ITA_meet_with_messe_desc:0 "En raison de la gloire dont jouit Giovanni Messe, notre ministre de l’Intérieur et fervent royaliste, il est très respecté et surtout influent. Nous pourrions utiliser de potentiels royalistes infiltrés dans les institutions fascistes pour les détruire de l’intérieur."
ITA_meet_with_messe_tt:0 "Les §Gfascistes§! seront bien plus affaiblis, mais cela ne profitera pas nécessairement aux §gmonarchistes§!, et pourrait se retourner contre nous."
ITA_victory_in_the_civil_war:0 "Victoire dans la guerre civile"
ITA_victory_in_the_civil_war_desc:0 "Nous avons enfin éliminé les traîtres fascistes de notre belle nation italienne. La reconstruction prendra du temps, mais nous avançons en sachant que nous avons évité le pire."
ITA_restore_elections:0 "Rétablir les élections"
ITA_restore_elections_desc:0 "" #//EN COURS
ITA_a_guiding_hand:0 "Une main directrice"
ITA_a_guiding_hand_desc:0 "" #//EN COURS
ITA_expand_the_iri_role_desc:0 "Fondé pour sauver, restructurer et financer les banques et entreprises en faillite durant la Grande Dépression, l’IRI s’est retrouvé en possession de nombreuses banques italiennes. Étendre son contrôle à une plus large partie de l’économie en ferait un pilier central de notre reconstruction économique après la crise."
ITA_po_valley_mettalurgy:0 "Métallurgie de la plaine du Pô"
ITA_po_valley_mettalurgy_desc:0 "La plaine du Pô abrite une grande partie de l’industrie italienne, notamment la métallurgie à Turin et à Gênes. Cette industrie est vitale, et nous devrions la soutenir en priorité."
ITA_expand_hydroelectricity_production:0 "Développer la production hydroélectrique"
ITA_expand_hydroelectricity_production_desc:0 "Pour résoudre nos problèmes d’électricité, principalement dus à notre manque de charbon, nous avons lancé depuis plusieurs années des programmes de construction de barrages destinés à la production hydroélectrique."
ITA_increase_marble_exportations:0 "Augmenter les exportations de marbre"
ITA_increase_marble_exportations_desc:0 "Entre La Spezia et Livourne s’élèvent les Alpes Apuanes, riches en marbre. Qu’il soit de Carrare ou de Serravezza, veiné de bleu ou de noir, le marbre reste l’une de nos principales exportations."
ITA_prepare_the_economy_for_war:0 "Préparer l’économie à la guerre"
ITA_prepare_the_economy_for_war_desc:0 "Nous sommes en retard sur les autres nations d’Europe en matière de production militaire, en raison de notre industrialisation encore faible et concentrée uniquement au nord. Nous devrons fournir des efforts économiques considérables pour atteindre un niveau de production suffisant afin d’approvisionner l’armée."
ITA_colonial_investments:0 "Investissements coloniaux"
ITA_colonial_investments_desc:0 "Nos colonies représentent une formidable opportunité économique : des sols gorgés de pétrole en Libye aux réserves de fer et d’or en Érythrée. Nous devons accroître nos investissements coloniaux."
ITA_bring_industry_to_the_mezzogiorno:0 "Industrialiser le Mezzogiorno"
ITA_bring_industry_to_the_mezzogiorno_desc:0 "Le Mezzogiorno, la région méridionale de l’Italie, a toujours été en retard en matière d’industrialisation, la majorité de ses habitants étant des agriculteurs. Il est temps de porter le sud au niveau du nord sur le plan industriel."
ITA_expand_libyan_oil_production:0 "Société Petrolibya"
ITA_expand_libyan_oil_production_desc:0 "Sous son immense désert, la Libye recèle de vastes réserves de pétrole encore inexploitées. En raison de la colonisation massive et de la forte présence italienne, il ne serait pas difficile d’accroître nos capacités d’extraction pétrolière."
ITA_increase_settlements_in_eritrea:0 "Accroître les colonies en Érythrée"
ITA_increase_settlements_in_eritrea_desc:0 "L’Érythrée regorge d’opportunités grâce à son climat favorable à l’élevage et à ses sous-sols riches en minerais, du fer à l’or. Le nombre d’Italiens présents n’est que de quelques milliers, largement insuffisant pour rendre l’économie de la colonie rentable. Des efforts pour encourager des familles à s’y installer, comme nous l’avons fait en Libye, devraient résoudre cette pénurie de population."
ITA_establish_the_sme:0 "Fonder la SME"
ITA_establish_the_sme_desc:0 "La Società Mineraria dell’Eritrea sera une entreprise publique chargée d’exploiter les gisements miniers d’Érythrée, nous permettant d’en tirer profit."
ITA_profits_from_eritrea:0 "Profits de l’Érythrée"
ITA_eritrean_coast_oil_extraction:0 "Extraction pétrolière de la côte érythréenne"
ITA_eritrean_coast_oil_extraction_desc:0 "Des recherches ont détecté des gisements de pétrole dans la région côtière de l’Érythrée. Il serait judicieux d’y installer des infrastructures pétrolières."
ITA_increase_north_south_links:0 "Renforcer les liaisons nord-sud"
ITA_increase_north_south_links_desc:0 "Des efforts pour améliorer les routes reliant le nord et le sud bénéficieraient aux deux régions."
ITA_incease_fiat_presence_in_the_south:0 "Accroître la présence de Fiat dans le sud"
ITA_incease_fiat_presence_in_the_south_desc:0 "L’un de nos plus grands constructeurs automobiles et fabricants de chars, Fiat, est déjà solidement implanté dans le nord. Nous pourrions encourager la création d’usines dans le sud et ainsi accroître notre potentiel industriel."
ITA_finish_the_litoranea_libica:0 "Achever la Litoranea Libica"
ITA_finish_the_litoranea_libica_desc:0 "Durant la Grande Dépression, le gouvernement a massivement développé les infrastructures et lancé des travaux publics à travers la Libye afin d’améliorer les conditions des colons présents depuis plusieurs décennies. Dans les années 1930, nous avons lancé le projet de la « Litoranea Libica », une route longeant toute la côte méditerranéenne. Elle est prête à être achevée et pourra ainsi relier la plupart des grandes villes libyennes."
ITA_tripoli_explosives_factory:0 "Usine d’explosifs de Tripoli"
ITA_tripoli_explosives_factory_desc:0 "Les colons italiens ont ouvert de nombreuses entreprises en Tripolitaine et en Cyrénaïque. Parmi elles, une production d’explosifs à Tripoli, qui pourrait s’avérer très utile à notre armée."
ITA_expand_libyan_manufactures:0 "Développer l’industrie libyenne"
ITA_expand_libyan_manufactures_desc:0 "Maintenant que les colons sont correctement installés en Libye, il est temps de développer l’industrie civile de la colonie en construisant des usines, notamment des distilleries, des usines Fiat et des cimenteries."
ITA_modernize_ethiopian_roads:0 "Moderniser les routes éthiopiennes"
ITA_modernize_ethiopian_roads_desc:0 "Notre nouvelle colonie, l’Éthiopie, dispose d’un ancien réseau ferroviaire, dont le meilleur exemple est la ligne franco-éthiopienne, qui met plus de 36 heures à relier Addis-Abeba à Djibouti. Nous moderniserons ces voies avec l’aide des nouveaux autorails développés par Fiat."
ITA_imperial_line:0 "Linea dell’Impero"
ITA_imperial_line_desc:0 "La Ligne impériale sera une route aérienne censée relier Addis-Abeba, Mogadiscio, Asmara, Benghazi et Rome. Elle reliera ainsi tout l’empire colonial italien et permettra une meilleure intégration économique de ses différentes parties."
ITA_compagnia_etiopica_degli_esplosivi:0 "Compagnia Etiopica Degli Esplosivi"
ITA_compagnia_etiopica_degli_esplosivi_desc:0 "Pour soutenir les troupes défendant l’Afrique orientale et l’ensemble de notre armée, l’expansion de nos capacités de production d’explosifs est nécessaire. L’Éthiopie, dont la modernisation routière a stimulé le développement économique, serait idéale pour cela."
ITA_cementerie_d_etiopia:0 "Cementerie d’Etiopia"
ITA_cementerie_d_etiopia_desc:0 "Le développement de l’industrie du ciment augmenterait notre capacité de construction en Éthiopie."
ITA_colonial_rifles_production:0 "Production d’armes coloniales"
ITA_colonial_rifles_production_desc:0 "Le développement de l’industrie des explosifs à travers notre empire colonial montre que nous devrions aussi accroître la capacité de production d’armes dans les colonies, afin d’équiper les troupes coloniales chargées de les protéger."
ITA_expand_addis_ababa:0 "Agrandir Addis-Abeba"
ITA_expand_addis_ababa_desc:0 "Nous avons rassemblé de nombreux architectes pour préparer notre projet d’agrandissement de la ville d’Addis-Abeba, afin d’en faire la capitale de l’Afrique orientale italienne. Il est temps de mettre ces projets en œuvre."
ITA_expand_taranto_steelwork:0 "Développer la sidérurgie de Tarente"
ITA_expand_taranto_steelwork_desc:0 "Tarente est l’une des plus grandes villes du sud et aussi l’une des plus importantes économiquement, principalement grâce à ses nombreuses fonderies de fer et d’acier. Il serait judicieux de développer davantage ce secteur, dont nous aurons besoin non seulement pour notre armée mais aussi pour l’essor global du Mezzogiorno."
ITA_operazione_plautius:0 "Opération Plautius"
ITA_operazione_plautius_desc:0 "Pendant des années, nous avons dû composer avec la Royal Navy, nous cantonnant à un rôle secondaire en Méditerranée. Notre victoire dans la « crise méditerranéenne » n’est pas suffisante pour obtenir le respect ; ce sera par la guerre que l’Italie dominera la Méditerranée !"
ITA_regia_aeronautica_focus:0 "Regia Aeronautica"
ITA_regia_aeronautica_focus_desc:0 "La guerre d’Abyssinie nous a permis pour la première fois d’utiliser notre armée de l’air en situation de guerre, après sa création en 1923. Toutefois, beaucoup de nos appareils sont encore anciens, notamment des biplans, qu’il nous faudra moderniser."
newfocus_99_desc:0 "Développé et fabriqué par Savoia-Marchetti, le SM.79 Sparviero possède trois moteurs. Initialement prévu comme avion de transport, ce projet a attiré l’attention du gouvernement italien en raison de sa capacité à être un bombardier bien plus rapide que tous les autres."
ITA_sm_79:0 "Savoia-Marchetti SM.79"
ITA_sm_79_desc:0 "Développé et fabriqué par Savoia-Marchetti, le SM.79 Sparviero possède trois moteurs. Initialement prévu comme avion de transport, ce projet a attiré l’attention du gouvernement italien en raison de sa capacité à être un bombardier bien plus rapide que tous les autres."
ITA_ba_65:0 "Breda Ba.65"
ITA_ba_65_desc:0 "Version avancée du Ba.64, le Ba.65 fut conçu par Antonio Parano et Giuseppe Panzeri. Comme ses prédécesseurs, il est destiné à remplir plusieurs rôles, notamment chasseur, appareil de reconnaissance et avion d’attaque au sol."
ITA_g_50:0 "Fiat G.50"
ITA_g_50_desc:0 "Le Fiat G.50, surnommé « Flèche », représente un tournant pour Fiat, ayant été conçu par Giuseppe Gabrielli alors que l’entreprise s’appuyait jusque-là sur l’ingénieur en chef Celestino Rosatelli."
ITA_increase_aircraft_production:0 "Accroître la production aéronautique"
ITA_increase_aircraft_production_desc:0 "Malgré nos avancées technologiques, notre production d’avions reste relativement faible, l’industrie qui y est dédiée étant limitée. Si nous voulons disposer d’une armée de l’air entièrement équipée, nous devons redoubler d’efforts dans la fabrication d’appareils !"
ITA_cant_z_1011:0 "CANT Z.1011"
ITA_cant_z_1011_desc:0 "Conçu par Filippo Zappata, le CANT Z.1011 est une petite merveille. C’est un bombardier bimoteur à aile basse. Les premiers tests ont révélé une efficacité redoutable contre les infrastructures, ce qui en ferait un atout précieux en temps de guerre."
ITA_further_pilots_training:0 "Renforcer la formation des pilotes"
ITA_further_pilots_training_desc:0 "Le dernier point sur lequel nous devons moderniser notre armée de l’air concerne les pilotes. Le développement de la formation au combat aérien nous permettra de former une nouvelle génération de pilotes bien plus talentueux que la précédente."
ITA_crocco_mission:0 "La mission de Crocco"
ITA_crocco_mission_desc:0 "Gaetano Crocco, pionnier de l’astronautique italienne et fondateur de la Société italienne de fuséologie, a entrepris la lourde tâche de développer un système de missiles pour équiper l’armée italienne."
ITA_satisfy_the_branches_needs:0 "Satisfaire les besoins des différentes armes"
ITA_satisfy_the_branches_needs_desc:0 "La marine comme l’aviation réclament depuis longtemps davantage de ressources, jalouses des privilèges accordés à l’armée de terre. Il est temps de leur donner satisfaction."
ITA_appoint_messe_2:0 "Nommer Messe"
ITA_appoint_messe_2_desc:0 "Giovanni Messe fut le commandant d’une division motorisée durant la guerre d’Abyssinie, ce qui lui valut d’être promu général de brigade. Habitué aux divisions rapides, qu’elles soient composées de cavaliers ou de véhicules, sa nomination à la tête de l’armée lui permettrait de la réformer autour de doctrines axées sur la vitesse."
ITA_restructure_the_divisions:0 "Restructurer les divisions"
ITA_restructure_the_divisions_desc:0 "Les divisions d’infanterie doivent passer d’une constitution tripartite à une composition bipartite, les rendant plus maniables, mobiles et adaptées aux guerres de mouvement."
ITA_general_equipment_modernization:0 "Modernisation générale de l’équipement"
ITA_general_equipment_modernization_desc:0 "Notre armée est encore principalement équipée de matériel de la Grande Guerre, n’ayant eu à combattre que dans des conflits coloniaux. Nous devons lancer des projets de recherche pour améliorer en priorité notre artillerie, et nos fusils dans une moindre mesure."
ITA_winter_training_in_finland:0 "Entraînement hivernal en Finlande"
ITA_winter_training_in_finland_desc:0 "Grâce à nos bonnes relations avec la Finlande, nous y avons envoyé l’une de nos divisions alpines pour étudier la guerre en conditions hivernales. Cette mission nous a permis d’acquérir une expérience précieuse que nous pourrons utiliser si nous devons combattre dans des terres gelées."
ITA_expand_the_elite_forces:0 "Renforcer les forces d’élite"
ITA_expand_the_elite_forces_desc:0 "Nos forces d’élite ont obtenu des résultats formidables durant la Grande Guerre, au point que toutes les puissances de l’Axe les redoutaient. Nombre de leurs membres ont depuis gagné en grade, ce qui nous permet de former une nouvelle génération de ces unités."
ITA_spa_as_37:0 "SPA AS.37"
ITA_spa_as_37_desc:0 "Construit par Fiat, le SPA AS.37 est basé sur le tracteur d’artillerie TL.37, mais spécialement développé pour le combat en Afrique du Nord, notamment grâce à l’initiative du gouverneur de Libye Italo Balbo."
ITA_german_military_assistance:0 "Assistance militaire allemande"
ITA_german_military_assistance_desc:0 "Nous pouvons apprendre beaucoup de la Wehrmacht. En invitant des officiers allemands à inspecter nos troupes, celles-ci atteindront le même niveau de préparation que les leurs."
ITA_giannini_sarnow_protocols:0 "Protocoles Giannini-Sarnow"
ITA_giannini_sarnow_protocols_desc:0 "Pour lutter contre le chômage, nous avons signé un accord avec l’Allemagne permettant à des milliers de travailleurs italiens d’aller travailler en Allemagne, notamment dans les usines Volkswagen."
ITA_redirect_military_fundings:0 "Rediriger le financement militaire"
ITA_redirect_military_fundings_desc:0 "Malgré un budget militaire élevé, l’armée se consacre davantage à son propre maintien et à celui de ses troupes qu’à la production militaire. Nous devrions allouer une part plus importante de ce budget déjà très élevé à l’expansion de nos capacités de production d’armes."
ITA_war_with_britain:0 "Guerre contre la Grande-Bretagne"
ITA_war_with_britain_desc:0 "Le moment est venu de vaincre la Grande-Bretagne, afin d’obtenir la suprématie en Méditerranée et d’en faire un lac italien !"
ITA_regia_marina_2:0 "Regia Marina"
ITA_regia_marina_2_desc:0 "Pendant longtemps, le gouvernement italien a davantage mis l’accent sur la modernisation de la Regia Marina que sur l’armée de terre ou l’armée de l’air, dans l’objectif de contrôler totalement la Méditerranée."
ITA_cavagnari_plan:0 "Le plan de Cavagnari"
ITA_cavagnari_plan_desc:0 "Nous avons promu Domenico Cavagnari au poste de chef d’état-major de la marine en 1933, puis de secrétaire de la marine, sur la base d’une approche conservatrice du combat naval reposant sur la production de croiseurs, de destroyers et de sous-marins."
ITA_new_navy_leadership:0 "Nouvelle direction de la marine" #//EN COURS
ITA_submarines_suppremacy:0 "Suprématie sous-marine"
ITA_appoint_campioni:0 "Nommer Campioni"
ITA_appoint_campioni_desc:0 "Inigo Campioni serait un bien meilleur chef de la marine. Plutôt que de multiplier les navires légers et les sous-marins, le développement des cuirassés doit devenir notre priorité."
ITA_develop_naval_aviation:0 "Développer l’aéronavale"
ITA_develop_aircraft_carriers:0 "Développer les porte-avions"
ITA_develop_aircraft_carriers_desc:0 "Si nous voulons projeter suffisamment de puissance en Méditerranée pour être à égalité avec la Grande-Bretagne ou la France, nous devons développer l’aviation embarquée de notre marine."
ITA_naval_war_of_attrition:0 "Guerre navale d’usure"
ITA_naval_war_of_attrition_desc:0 "Le développement de nos sous-marins nous permettra de harceler la marine ennemie."
ITA_improve_the_fleet_projection:0 "Améliorer la projection de la flotte"
ITA_improve_the_fleet_projection_desc:0 "Nous ne pouvons pas simplement espérer que nos sous-marins suffiront à dominer la Méditerranée. Si nous voulons en faire notre zone d’influence, nous devons y projeter un maximum de puissance grâce à de plus grands navires."
ITA_auxiliary_cruisers:0 "Croiseurs auxiliaires"
ITA_auxiliary_cruisers_desc:0 "La légèreté des croiseurs auxiliaires leur permettra d’accompagner nos sous-marins dans leurs campagnes de harcèlement."
ITA_la_decima:0 "Prima Flottiglia MAS"
ITA_la_decima_desc:0 "La « Prima Flottiglia MAS » sera notre unité spéciale de nageurs de combat, spécialisée dans les raids contre les navires ennemis."
ITA_mare_nostrum_2:0 "Mare Nostrum"
ITA_develop_southern_ports:0 "Développer les ports du Sud"
ITA_develop_southern_shipyards:0 "Développer les chantiers navals du Sud"
ITA_develop_southern_shipyards_desc:0 "Pour répondre à nos nouveaux besoins en production navale, nous devons accroître nos capacités. Nous pouvons agrandir les chantiers navals du Sud afin de répondre à cette demande."
ITA_naval_guerilla:0 "Guérilla navale"
ITA_naval_guerilla_desc:0 "Face à des marines bien plus puissantes que la nôtre, nous devons recourir à des tactiques plus vicieuses, en utilisant de petites formations rapides pour harceler les navires ennemis lors d’engagements éclairs."
ITA_shift_toward_an_offensive_force:0 "Passer à une force offensive"
ITA_shift_toward_an_offensive_force_desc:0 "Nous devons être capables de frapper les premiers pour compenser notre infériorité numérique."
ITA_royal_intervention:0 "Intervention royale"
ITA_royal_intervention_desc:0 "Nous ne pouvons pas faire confiance au régime fasciste pour mener l’Italie vers la gloire. Les revers subis au début de notre guerre en Éthiopie furent une preuve claire de l’incapacité du Parti national fasciste à diriger. Nous devons renverser les fascistes et placer le pays sous le contrôle de notre grand roi !"
ITA_empower_the_monarchists:0 "Renforcer les monarchistes"
ITA_empower_the_monarchists_desc:0 "Après des années de tumulte politique, il est clair que notre roi Victor-Emmanuel III est le seul en qui l’on puisse avoir confiance pour donner à notre nation une main ferme et unir le pays en un État stable et puissant !"
ITA_secure_control_over_parliament:0 "Assurer le contrôle du parlement"
ITA_secure_control_over_parliament_desc:0 "Le parlement a été la cause de nombreuses crises politiques internes, plongeant souvent notre nation à genoux. Pour éviter toute réédition de ces incidents, nous ne le dissoudrons pas directement, mais nous ferons en sorte que chacun sache à qui il doit sa loyauté."
ITA_restore_the_statuto_albertino:0 "Rétablir le Statuto Albertino"
ITA_restore_the_statuto_albertino_desc:0 "Le Statuto Albertino est la constitution de notre pays depuis 1848, mais sous le régime fasciste, il a été lourdement modifié et vidé de ses principes fondateurs. Nous devons le restaurer dans sa forme originelle et libérer à nouveau le parlement."
ITA_royal_militarism:0 "Militarisme royal"
ITA_royal_militarism_desc:0 "L’Armée royale se souviendra des victoires de la Grande Guerre et suivra l’exemple inspirant de notre glorieux roi-soldat."
ITA_control_the_industrial_elites:0 "Contrôler les élites industrielles"
ITA_control_the_industrial_elites_desc:0 "La corruption des élites industrielles a causé d’immenses dégâts économiques par le passé. Nous devons leur rappeler à qui elles doivent leur loyauté."
ITA_rebuild_the_north:0 "Reconstruire le Nord"
ITA_rebuild_the_north_desc:0 "La brutale guerre civile a causé d’énormes dégâts dans le nord industriel de notre pays. Si des efforts ne sont pas entrepris pour résoudre ces problèmes, la région pourrait devenir un terreau de résistance communiste. Il est donc vital de la restaurer dans sa splendeur passée."
ITA_reopen_the_markets:0 "Rouvrir les marchés"
ITA_reopen_the_markets_desc:0 "Les politiques d’autarcie de Mussolini nous ont lourdement restreints dans nos échanges avec de nombreux pays. De telles idées insensées mèneront notre économie à sa perte : nous devons rouvrir les marchés."
ITA_strengthen_the_coalition:0 "Renforcer la coalition"
ITA_strengthen_the_coalition_desc:0 "Maintenant que les fascistes ont été chassés d’Italie, nous pouvons enfin unir les forces des partis de centre-gauche dans une coalition solide, visant à restaurer la démocratie et à établir une nouvelle république italienne !"
ITA_referendum_on_the_monarchy:0 "Référendum sur la monarchie"
ITA_referendum_on_the_monarchy_desc:0 "Maintenant que notre guerre civile est terminée, nous pouvons enfin nous attaquer au second problème : celui de la monarchie, qui a soutenu le régime fasciste pendant plus d’une décennie. Il est temps de décider du sort de la monarchie dans notre pays."
ITA_christian_democracy_r56:0 "Démocratie chrétienne"
ITA_christian_democracy_r56_desc:0 "Notre nouvelle république suivra des valeurs profondément chrétiennes afin d’améliorer le mode de vie de notre peuple et de protéger notre démocratie libre."
ITA_disband_the_partisans:0 "Dissoudre les partisans"
ITA_disband_the_partisans_desc:0 "Les partisans communistes nous ont bien servis, mais maintenant que la guerre civile est terminée, ils représentent une menace bien trop importante. Nous devons les dissoudre tant que nous le pouvons, avant qu’ils ne commencent à nourrir d’autres ambitions."
ITA_liberalize_our_industries:0 "Libéraliser nos industries"
ITA_liberalize_our_industries_desc:0 "La nationalisation et le contrôle strict des industries, bien qu’efficaces au début, se sont révélés inefficaces sur le long terme. Pour garantir notre stabilité économique, nous autoriserons à nouveau les industries à fonctionner librement."
ITA_defenders_of_southern_europe:0 "Défenseurs de l’Europe du Sud"
ITA_defenders_of_southern_europe_desc:0 "" #//EN COURS
ITA_formalise_the_front:0 "Formaliser le front"
ITA_formalise_the_front_desc:0 "Il est temps de faire du Front de Stresa plus qu’une simple promesse : nous unirons nos nations dans une alliance militaire commune pour maintenir la bête allemande à distance."
ITA_formalise_the_front_tt:0 "§YChaque pays§! qui fait partie d’une faction avec §Y[ENG.GetNameDef]§! rejoint le §YFront de Stresa§! dirigé par §Y[ITA.GetNameDef]§!."
ITA_invite_croatia:0 "Inviter la Croatie"
ITA_invite_croatia_desc:0 "Malgré quelques tensions dues à nos revendications sur la Dalmatie, nous allier à la Croatie pourrait sécuriser notre flanc tout en étendant notre sphère d’influence dans les Balkans."
ITA_finance_anic:0 "Financer l’Anic"
ITA_finance_anic_desc:0 "L’Anic est destinée à devenir la plus grande société pétrochimique d’Italie et, avec davantage de ressources, elle pourra produire un carburant bien supérieur aux huiles importées."
ITA_a_way_out:0 "Une issue"
ITA_second_risorgimento:0 "Second Risorgimento"
ITA_second_risorgimento_desc:0 "Le rêve d’une Italie unifiée est de nouveau à notre portée. Fratelli d’Italia, l’Italia s’è desta !"

