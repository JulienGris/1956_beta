  #decisions
 BEL_declaration_of_neutrality:0 "Déclaration de Neutralité"
 BEL_declaration_of_neutrality_desc:0 "Pendant des décennies, la Belgique a été protégée par la France. Cela remonte à la révolution belge lorsque des troupes françaises ont aidé à repousser la contre-attaque néerlandaise de 1831 et à assurer l'indépendance des Pays-Bas méridionaux. \n\nDepuis la fin de la Grande Guerre, l'état-major [FRA.getAdjective] a établi des liens étroits avec l'armée [BEL.GetAdjective] pour coordonner nos actions en cas de conflit. [FRA.getNameDefCap] protège et garantit notre indépendance. Pour l'instant. \n\nD'un autre côté, une coopération militaire continue avec le gouvernement [FRA.GetAdjective] représente un risque pour la sécurité [BEL.GetAdjective]. Cela pourrait contraindre le pays à entrer dans un nouveau conflit. Pour éviter une catastrophe similaire à la dévastation de l'offensive [GER.GetAdjective] de 1914, nous devrons peut-être renoncer aux garanties [FRA.GetAdjective] et communiquer notre décision à la Société des Nations."

 BEL_declaration_of_neutrality_dummy:0 "Déclaration de Neutralité"
 BEL_declaration_of_neutrality_dummy_desc:0 "Pendant des décennies, la Belgique a été protégée par la France. Cela remonte à la révolution belge lorsque des troupes françaises ont aidé à repousser la contre-attaque néerlandaise de 1831 et à assurer l'indépendance des Pays-Bas méridionaux. \n\nDepuis la fin de la Grande Guerre, l'état-major [FRA.getAdjective] a établi des liens étroits avec l'armée [BEL.GetAdjective] pour coordonner nos actions en cas de conflit. [FRA.getNameDefCap] protège et garantit notre indépendance. Pour l'instant. \n\nD'un autre côté, une coopération militaire continue avec le gouvernement [FRA.GetAdjective] représente un risque pour la sécurité [BEL.GetAdjective]. Cela pourrait contraindre le pays à entrer dans un nouveau conflit. Pour éviter une catastrophe similaire à la dévastation de l'offensive [GER.GetAdjective] de 1914, nous devrons peut-être renoncer aux garanties [FRA.getAdjective] et communiquer notre décision à la Société des Nations."

 BEL_declared_neutrality:0 "A déclaré la neutralité totale."

 BEL_leopold3:0 "Léopold III"
 BEL_leopold3_desc:0 "Léopold III, roi des Belges, règne mais ne gouverne pas. Bien qu'il soit le commandant en chef de l'armée belge, le commandement effectif est détenu par le chef d'état-major."
 BEL_leopold3_captive:0 "Léopold III, Captif"
 BEL_leopold3_captive_desc:0 "Léopold III est en captivité ; il faudra pénétrer profondément en territoire ennemi pour le libérer."
 BEL_leopold3_exile:0 "Léopold III, Exilé"
 BEL_charles_regent:0 "Prince-Régent Charles"
 BEL_charles_regent_desc:0 "Tant que le roi ne peut gouverner, son frère, le prince Charles, prendra sa place en tant que régent du royaume."

 BEL_Pierre_Daye:0 "Pierre Daye"
 BEL_Pierre_Daye_desc:0 "Pierre Daye était le chef du groupe Rexist au parlement belge. Il était également le seul Rexist jugé acceptable par le palais royal, tandis que Degrelle était considéré comme un fauteur de troubles. N'ayant pas une bonne opinion des autres représentants Rexist, il quitta le mouvement avant la guerre."

 BEL_Charles_Someville:0 "Charles Somville"
 BEL_edgar_lalmand:0 "Edgar Lalmand"
 BEL_edgar_lalmand_desc:0 "Même s'il ne fait pas partie de la Troïka dirigeante van den Boom, Lahaut et Relecom, Edgar Lalmand agit souvent en coulisses. En tant que marchand de grains, ses compétences peuvent être utiles pour gérer les travaux publics."

 BEL_henri_glineur:0 "Henri Glineur"
 BEL_robert_desmet:0 "Robert Desmet"
 BEL_robert_desmet_desc:0 "Robert Desmet était aviateur pendant la Grande Guerre. Dans les années 1930, il servait comme instructeur pour les futurs pilotes militaires belges."

 BEL_raoul_overstraeten_desc:0 "Raoul van Overstraeten était l'un des conseillers militaires les plus proches du roi, d'où son surnom de « vice-roi » (au moins sur les questions militaires). Il était également professeur à l'École Royale Militaire et avait publié plusieurs ouvrages dans les années 1920, où il prévoyait l'importance future des chars. Il avait aussi une opinion particulière sur l'aviation belge : il pensait que l'armée de l'air étant incapable de résister à une attaque allemande, l'armée ne devrait pas investir dans l'aviation mais se concentrer sur l'artillerie anti-aérienne."
#  BEL_jules_iserentant:0 "Félix Iserentant" # déplacé pour remplacement
BEL_gustaaf_sap:0 "Gustaaf Sap"
BEL_gustaaf_sap_desc:0 "Gustaaf Sap était un économiste et un homme politique à l’extrême droite du parti catholique. Il soutenait secrètement Léon Degrelle, espérant une victoire rexiste. Il prévoyait d’organiser le succès électoral de Degrelle et de rejoindre son parti seulement après qu’il aurait pris le pouvoir. En raison du déclin de Rex après le succès de Degrelle aux élections de 1936, Gustaaf Sap resta dans le Parti catholique et termina au gouvernement en exil à Londres."
#  BEL_victor_van_strydonck_de_burkel:0 "Victor van Strydonck de Burkel" # même que vanilla
BEL_victor_van_strydonck_de_burkel_desc:0 "En tant que l’un des plus anciens généraux de l’armée belge, il aurait pu être dépassé par les progrès technologiques de la mobilité. Mais après quelques réticences, il accepta et adopta ensuite le programme de motorisation lancé en 1935."
BEL_auguste_edouard_gilliaert:0 "Auguste-Édouard Gilliaert"
#  BEL_karel_bossart:0 "Karel Jan Bossart" # déplacé pour remplacement
BEL_karel_bossart_desc:0 "Les Américains ont fourni à l’un de nos plus grands esprits dans le domaine de la fuséologie un financement abondant. Nous pouvons sûrement le convaincre de revenir dans son pays s’il nous offrons les mêmes opportunités."
BEL_joris_van_severen:0 "Joris van Severen"
BEL_joris_van_severen_desc:0 "Joris van Severen n’était pas un chef de parti, car Verdinaso n’était pas un parti politique. Il s’agissait d’un mouvement visant l’unité du Benelux en un État corporatiste uni. Malgré cela, jusqu’en 1935, il était un nationaliste flamand fervent avant d’affirmer que les Wallons étaient des cousins du même sang et, en tant que tels, devaient être inclus dans l’union. Plus pratiquement, diviser la Belgique aurait signifié scinder le Congo belge, ce qui allait totalement à l’encontre de ses rêves de grandeur. En 1940, les autorités belges l’arrêtèrent comme futur collaborateur potentiel. Déplacé dans le nord de la France avec d’autres fascistes, il fut tué par ses gardes français ivres et mécontents."
#  BEL_julien_lahaut:0 "Julien Lahaut" # même que vanilla
BEL_julien_lahaut_desc:0 "Vétéran du « Corps expéditionnaire belge de voitures blindées en Russie », Julien Lahaut rencontra les bolcheviks et approuva leurs idées. Une fois en Belgique, il devint un membre essentiel du parti communiste."
#  BEL_achille_van_acker:0 "Achille van Acker" # même que vanilla
BEL_achille_van_acker_desc:0 "Achille (Achiel) van Acker était un homme politique socialiste qui devint Premier ministre en 1945."
#  BEL_yvan_gerard:0 "Ivan Gérard" # déplacé pour remplacement
BEL_yvan_gerard_desc:0 "Ivan Gérard était commandant de division dans l’armée belge. Il réussit à replier ses troupes dans un ordre relativement bon compte tenu des circonstances."
BEL_jean_de_lannoy:0 "Jean de Lannoy"
BEL_jean_de_lannoy_desc:0 "Issu d’une ancienne famille noble, Jean de Lannoy est un vieux général contemplant la nature de la guerre moderne. Il avait des vues innovantes comparées à l’établissement militaire belge. Il publia des articles suggérant l’usage des chars pour permettre des contre-attaques mortelles qui arrêteraient les avancées ennemies. Même si historiquement la Belgique n’avait jamais assez de chars pour réaliser les manœuvres qu’il suggérait, il est clair qu’il prônait la guerre mobile en Belgique."
BEL_henri_denis:0 "Henri Denis"
BEL_henri_denis_desc:0 "Grâce à son expertise militaire en tant que général retraité, Henri Denis fut ministre de la Défense dans plusieurs gouvernements. Il supervisa l’établissement de la stratégie défensive belge et créa la garde anti-aérienne territoriale. En 1940, il refusa de suivre le gouvernement en exil à Londres pour rester avec le roi. Il proposa même à Léopold III de signer l’ordre de démission du gouvernement comme seul ministre restant dans le pays, ce qui aurait nui à la légitimité du gouvernement de Hubert Pierlot. Heureusement, le roi refusa sa proposition."
BEL_edouard_van_den_bergen:0 "Édouard van den Bergen"
BEL_edouard_van_den_bergen_desc:0 "Ancien général d’artillerie, Édouard van den Bergen fut nommé chef d’état-major en 1935. En tant que commandant des forces armées (après le roi), il conçut un plan pour allonger la durée du service militaire et améliorer la qualité des divisions de réserve. Ce plan ne fut jamais appliqué, car le gouvernement privilégiait la reprise économique sur la préparation d’une guerre encore hypothétique. Il perdit sa position et commanda un des groupes d’armée après avoir invité les forces françaises à franchir la frontière belge lors d’une fausse alerte de la « drôle de guerre » sans consulter le roi ou le gouvernement."
BEL_paul_hiernaux:0 "Paul Hiernaux"
BEL_paul_hiernaux_desc:0 "Vétéran aviateur de la Grande Guerre, Paul Hiernaux fut le commandant en chef de l’armée de l’air belge en 1940. (Remarque : son portrait date de 1918)"
BEL_paul_van_waesberghe:0 "Paul van Waesberghe"
BEL_paul_van_waesberghe_desc:0 "Paul van Waesberghe était encore jeune lieutenant lorsque la marine belge fut rétablie. Grâce à son talent, il fut envoyé en Grande-Bretagne pour une formation avancée dans la Royal Navy. Il combattit ensuite avec le corps belge de la Royal Navy et devint un des officiers les plus importants de la marine belge après la guerre."
BEL_gustave_fromont:0 "Gustave Fromont"
BEL_gustave_fromont_desc:0 "Gustave Fromont fut, avec Olivier Derousseaux, le second du commandement de l’état-major en 1940."
BEL_gustave_fromont2:0 "Gustave Fromont"
BEL_gustave_fromont2_desc:0 "Gustave Fromont fut, avec Olivier Derousseaux, le second du commandement de l’état-major en 1940."
BEL_olivier_derousseaux:0 "Olivier Derousseaux"
BEL_olivier_derousseaux_desc:0 "Olivier Derousseaux fut, avec Gustave Fromont, le second du commandement de l’état-major en 1940. Il eut la tâche difficile de négocier la reddition de l’armée belge."
BEL_olivier_derousseaux2:0 "Olivier Derousseaux"
BEL_olivier_derousseaux2_desc:0 "Olivier Derousseaux fut, avec Gustave Fromont, le second du commandement de l’état-major en 1940. Il eut la tâche difficile de négocier la reddition de l’armée belge."
BEL_jules_pire2:0 "Jules Pire"
BEL_jules_pire2_desc:0 "Jules Pire était commandant de division en 1940. Il commanderait plus tard l’armée secrète belge."
BEL_franz_burniaux:0 "Franz Burniaux"
BEL_franz_burniaux_desc:0 "Instructeur aérien dans l’armée de l’air belge, Franz Burniaux continua la guerre en Afrique après un court séjour en Grande-Bretagne. Consulté pour établir une force aérienne au Congo belge, le projet étant abandonné, il servit dans le corps belge de l’armée de l’air sud-africaine."
BEL_Fernand_Frenay:0 "Fernand Frenay"
BEL_xavier_relecom:0 "Xavier Relecom"
BEL_xavier_relecom_desc:0 "Membre important du Parti communiste belge, Xavier Relecom fut le chef de la Troïka avec Julien Lahaut et Georges van den Boom après la mort de Joseph Jacquemotte. Emprisonné par la Gestapo, il conclut un pacte secret pour sauver le comité dirigeant du parti (y compris lui-même) en échange de convaincre d’autres militants communistes de collaborer."
BEL_andor_berei:0 "Andor Berei"
BEL_andor_berei_desc:0 "Andor Berei était un Hongrois en exil après le succès des contre-révolutionnaires qui écrasèrent la République soviétique hongroise en 1919. Il fut envoyé en Belgique comme représentant du Komintern (et par extension, de Staline) auprès du Parti communiste belge."
BEL_paul_nothomb:0 "Paul Nothomb"
BEL_paul_nothomb_desc:0 "Paul Nothomb avait tout pour être un modèle de la haute société belge. Né dans une famille aisée, il fut major de sa promotion en aviation. Mais il découvrit le marxisme-léninisme et embrassa la cause communiste. Il quitta l’armée pour combattre le fascisme pendant la guerre civile espagnole, où il rencontra André Malraux. À son retour en Belgique, il fut arrêté par les Allemands avec d’autres militants communistes influents mais échappa à l’exécution grâce au pacte entre Relecom et la Gestapo."
BEL_Jose_Streel:0 "José Streel"
#  BEL_rene_lagrou:0 "René Lagrou" # déplacé pour remplacement
BEL_rene_lagrou_desc:0 "René Lagrou était un « correspondant de guerre » du parti autonomiste/indépendantiste flamand VNV. Il tenta de motiver la jeunesse flamande à rejoindre la légion SS flamande. Il est aussi le grand-père d’un des professeurs universitaires de l’auteur de ces lignes."
BEL_Victor_Matthys:0 "Victor Matthys"
BEL_Victor_Matthys_desc:0 "Victor Matthys était un proche compagnon de Léon Degrelle et fut chargé de diriger le parti rexiste pendant l’absence de Degrelle sur le front de l’Est."
#  BEL_lambert_chardome:0 "Lambert Chardome" # même que vanilla
BEL_lambert_chardome_desc:0 "Lambert Chardome est un cas particulier. Il commandait une division en 1940, mais aurait pu conspirer avec Degrelle pour soutenir sa « Marche sur Bruxelles » et organiser un coup d’État. Cependant, seule la revendication de Degrelle a été trouvée, probablement une réécriture historique. Il fut envoyé en prison, comme la plupart des généraux belges. En 1944, Degrelle chercha un officier pour commander la « Légion Wallonie », et Chardome fut convaincu après qu’on lui eut dit que le roi acceptait de combattre les Soviétiques (même si Léopold III n’aimait sans doute pas les communistes). Avant de rejoindre le front, il demanda à revenir en Belgique pour voir sa famille, constata la situation et retourna à son stalag. Bien qu’il n’ait jamais participé aux activités de la Légion, il fut condamné à 15 ans de prison après la guerre."
BEL_jules_henri_vincotte:0 "Jules-Henri Vincotte"
BEL_jules_henri_vincotte_desc:0 "Directeur de l’académie militaire."
BEL_rene_legros:0 "René Legros"
BEL_rene_legros_desc:0 "René Legros était général-major aviateur de l’armée de l’air belge."
BEL_andre_becquet:0 "André Becquet"
BEL_alexandre_galopin:0 "Alexandre Galopin"
BEL_alexandre_galopin_desc:0 "Alexandre Galopin était l'administrateur de la « Société Générale », une société au nom aussi vague que son domaine d'activités. Elle détenait des actifs dans de nombreux secteurs vitaux de l'économie belge, comme l'« Union Minière du Haut-Katanga » au Congo belge. Pendant la guerre, il choisit de rester en Belgique car il craignait qu'en l'absence d'une direction adéquate, les actifs de la société soient saisis par les forces occupantes. À la place, il donna son nom à la « Doctrine Galopin ». Elle consistait en l'idée que l'économie devait continuer à fonctionner pour payer les salaires de la population. Même si cela aidait partiellement les Allemands, ces politiques étaient soutenues par le gouvernement belge en exil, car elles étaient vues comme un moindre mal comparé à la famine. En 1944, il fut assassiné par des fascistes flamands dirigés par Robert Jan Verbelen parce qu'il représentait la classe dirigeante économique d'avant-guerre."
BEL_jean_terfve:0 "Jean Terfve"
BEL_jean_terfve_desc:0 "Jean Terfve était docteur en droit et membre du Parti communiste belge. Il fut actif dans la résistance belge, et après l'arrestation d'autres chefs communistes, il fut choisi par Andor Berei pour être l'un des principaux communistes en Belgique."
BEL_gustave_joassart:0 "Gustave Joassart"
BEL_gustave_joassart_desc:0 "En tant que directeur de FN Herstal, Gustave Joassart était au cœur des diverses industries militaires belges. Par exemple, il participa à des réunions pour construire une usine de moteurs d'avion en Belgique, qui étaient systématiquement importés par les fabricants belges d'avions."
BEL_constant_de_wulf:0 "Constant De Wulf"
BEL_maximilien_de_neve_de_roden:0 "Maximilien de Neve de Roden"
BEL_maximilien_de_neve_de_roden_desc:0 "Maximilien de Neve de Roden était général de cavalerie et commanda les « Chasseurs Ardennais » en 1936 et le corps de cavalerie en 1939."
BEL_auguste_lippens:0 "Auguste Lippens"
BEL_auguste_lippens_desc:0 "Ancien Gouverneur général du Congo belge, Auguste Lippens proposa en 1940 de former un nouveau gouvernement autour du roi."
BEL_robert_de_foy:0 "Robert de Foy"

FLA_auguste_baesens:0 "Auguste Baesens"
FLA_auguste_baesens_desc:0 "Auguste Baesens était commandant de l'artillerie du 2ᵉ corps d'armée."
FLA_alexis_vander_veken:0 "Alexis Vander Veken"
FLA_alexis_vander_veken_desc:0 "Alexis Vander Veken était commandant du 1ᵉʳ corps d'armée."
FLA_Robert_Jan_Verbelen:0 "Robert Jan Verbelen"
FLA_Robert_Jan_Verbelen_desc:0 "Robert Jan Verbelen était un nationaliste flamand qui collabora activement avec la Gestapo pour éliminer l'opposition en Belgique occupée. Il chassa les membres de la résistance, les communistes et toute personne se mettant en travers de son chemin. Il fut responsable de l'assassinat du directeur de la « Société Générale », Alexandre Galopin. Après la guerre, il s'enfuit en Autriche pour échapper à la justice et proposa ses services aux Américains en tant que chasseur professionnel de communistes. Ainsi, il entama une nouvelle carrière comme agent de la CIA."
FLA_jef_van_de_wiele:0 "Jef van de Wiele"
FLA_jef_van_de_wiele_desc:0 "Jef van de Wiele était l'un des collaborateurs les plus enthousiastes de Belgique. Il était l'un des membres les plus éminents de « De Vlag » (Le Drapeau), une organisation visant rien de moins que l'annexion de la Flandre à l'Allemagne. Il bénéficiait naturellement d'un fort soutien des Allemands, espérant créer un Großdeutschland unissant tous les peuples d'origine germanique."
FLA_Staf_De_Clercq:0 "Staf Declercq"
 FLA_war_van_overstraeten:0 "War van Overstraeten"
 FLA_Dr_August_Borms:0 "August Borms"
 FLA_paul_le_roy:0 "Pol Le Roy"
