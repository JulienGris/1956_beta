BEL_benelux_tech_sharing_group:0 "Commission scientifique Benelux"
BEL_benelux_tech_sharing_group_desc:0 "Comme nous n'avons pas beaucoup de personnes à mobiliser, la supériorité technologique est notre seule voie pour affronter la menace militaire de notre époque. Une coopération étroite des pays du Benelux garantirait l'exploitation complète du potentiel de nos trois armées."
benelux_research_name:0 "Commission de recherche Benelux"
benelux_research_desc:0 "Réduit le temps de recherche pour les technologies déjà découvertes par d'autres pays du Benelux."
belgium_research_name:0 "Groupe de recherche belge"
belgium_research_desc:0 "Réduit le temps de recherche pour les technologies déjà découvertes par [BEL.GetNameDef] et [COG.GetNameDef]."
italian_research_name:0 "Groupe de recherche italien"
italian_research_desc:0 "Réduit le temps de recherche pour les technologies déjà découvertes par [ITA.GetNameDef]. Ces technologies incluent les arbalètes géantes, les chars en bois, les hélicoptères à propulsion musculaire et la redoutable artillerie lourde mobile à pâtes."

#flandre semi-générique
flanders_focus:0 "Priorité nationale flamande"
BEL_rearmement_agreement:0 "Accords de réarmement élargis"
FLA_army_effort:0 "Organiser la nouvelle armée"
FLA_army_effort_desc:0 "Malgré les possibilités croissantes de la guerre aérienne et navale, le combat terrestre reste crucial dans les guerres de demain. Avec une bonne préparation, nous pouvons éviter de revivre l'enfer des tranchées."
FLA_equipment_effort:0 "Moderniser l'équipement"
FLA_equipment_effort_desc:0 "Les limites de ce que l’infanterie peut transporter ne cessent d’être repoussées. Nous nous concentrerons sur le fait de donner à nos troupes les meilleurs outils disponibles."
FLA_motorization_effort:0 "Soutien motorisé"
FLA_motorization_effort_desc:0 "La mobilité et la protection sont cruciales pour transporter l’infanterie sur le champ de bataille et l’en retirer en sécurité. Se concentrer sur ces développements nous permettra d’agir rapidement."
FLA_doctrine_effort:0 "Concevoir de nouvelles tactiques"
FLA_doctrine_effort_desc:0 "Les doctrines militaires qui ont défini le combat terrestre pendant la Grande Guerre sont obsolètes. Nous devons confier à nos meilleurs esprits la tâche de façonner la pensée militaire de demain."
FLA_equipment_effort_2:0 "Poursuivre la réforme de l'équipement"
FLA_equipment_effort_2_desc:0 "Nous continuerons nos efforts pour que notre infanterie et nos troupes de soutien disposent du meilleur équipement possible de notre époque."
FLA_mechanization_effort:0 "Infanterie mécanisée"
FLA_mechanization_effort_desc:0 "En repensant les possibilités de l'infanterie motorisée, nous pouvons repousser les limites des véhicules que nous pouvons construire aujourd'hui."
FLA_doctrine_effort_2:0 "Exercices à grande échelle"
FLA_doctrine_effort_2_desc:0 "Le champ de bataille a changé pendant les années d'entre-deux-guerres et au fil des récents conflits. Nous devons constamment réévaluer nos doctrines pour en tenir compte."
FLA_equipment_effort_3:0 "Finaliser la modernisation militaire"
FLA_equipment_effort_3_desc:0 "Au lieu d'imiter ou d'acheter de l'équipement étranger, nous devrions devenir un leader mondial en armement d'infanterie."
FLA_armor_effort:0 "Concevoir des véhicules blindés"
FLA_armor_effort_desc:0 "En appliquant ce que nous avons appris en mécanisant notre infanterie, nous pouvons également améliorer nos véhicules blindés."
FLA_special_forces:0 "Forces spéciales"
FLA_special_forces_desc:0 "Nous avons besoin de forces d'élite ; les troupes de montagne et les parachutistes doivent être notre priorité."
FLA_aviation_effort:0 "Fonder l'École de l'air [FLA.GetAdjective]"
FLA_aviation_effort_tt:0 "Pas assez d'emplacements de construction pour une §YBase aérienne§!"
FLA_aviation_effort_desc:0 "Nulle part les progrès technologiques ne sont plus rapides que dans la guerre aérienne. L’aviation est un domaine que toute nation moderne doit maîtriser."
FLA_fighter_focus:0 "Priorité aux chasseurs"
FLA_fighter_focus_desc:0 "Nous n’avons pas vu la fin des combats aériens comme ceux de la Grande Guerre. Rester en avance dans le développement des avions de chasse nous donnera un avantage à l'avenir."
FLA_bomber_focus:0 "Priorité aux bombardiers"
FLA_bomber_focus_desc:0 "Les gens raconteront un jour l'horreur des guerres d'aujourd'hui, évoquant le feu tombant du ciel. Nous ferons en sorte que ces histoires soient racontées par nos ennemis."
FLA_aviation_effort_2:0 "Étudier les tactiques étrangères"
FLA_aviation_effort_2_desc:0 "D'autres progrès dans l'aviation seront nécessaires pour intégrer efficacement notre force aérienne avec les autres branches militaires."
FLA_CAS_effort:0 "Bombardiers en piqué"
FLA_CAS_effort_desc:0 "Une armée moderne a besoin de soutien, à la fois par des véhicules terrestres et aériens."
FLA_rocket_effort:0 "Moteurs à réaction"
FLA_rocket_effort_desc:0 "Les moteurs-fusées et à réaction permettent des vitesses inédites pour les appareils habités ou non. Être pionniers dans ces technologies nous permettra de surprendre l’ennemi."
FLA_NAV_effort:0 "Bombardiers navals"
FLA_NAV_effort_desc:0 "Tout comme la nouvelle guerre navale se déroule sous la surface de l'eau, une partie se joue aussi dans les airs au-dessus des mers."
FLA_naval_effort:0 "Financer la construction navale"
FLA_naval_effort_tt:0 "Pas assez d'emplacements de construction pour des §YChantiers navals§!"
FLA_naval_effort_desc:0 "L’expansion de notre marine devrait être notre priorité. Allouons toutes les ressources disponibles aux nouveaux chantiers navals et à la recherche sur les navires de surface légers."
FLA_flexible_navy:0 "Marine flexible"
FLA_flexible_navy_desc:0 "Réinventer la guerre navale pour tenir compte des avancées dans la technologie sous-marine nous permettra de frapper efficacement les convois ennemis."
FLA_large_navy:0 "Grande marine"
FLA_large_navy_desc:0 "Adapter nos doctrines navales pour accueillir de grands navires et assurer la sécurité de nos convois commerciaux nous enseignera quel type de navires nous devons construire."
FLA_submarine_effort:0 "Guerre sous-marine"
FLA_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus excitant depuis l’invention du torpilleur. Nous devrions nous protéger contre les sous-marins et les utiliser contre la flotte marchande ennemie."
FLA_cruiser_effort:0 "Concevoir des croiseurs"
FLA_cruiser_effort_desc:0 "Avant de nous lancer dans la recherche avancée sur les cuirassés, il faut remplacer les croiseurs plus petits."
FLA_destroyer_effort:0 "Concevoir des destroyers"
FLA_destroyer_effort_desc:0 "En étudiant la conception des sous-marins et leur utilisation stratégique, nous avons également appris à contrer ces stratégies. Les destroyers seront essentiels pour cela."
FLA_capital_ships_effort:0 "Intérêt pour les navires capitaux"
FLA_capital_ships_effort_desc:0 "La nation qui possède le plus de cuirassés régnera sur les océans. Les cuirassés et les porte-avions représentent respectivement l’ancien et le nouveau visage de la supériorité navale."
FLA_industrial_effort:0 "Effort industriel"
FLA_industrial_effort_desc:0 "Concentrons tous nos efforts politiques sur le développement de l'industrie civile dans un grand bond en avant."
FLA_industrial_effort_2:0 "Effort industriel II"
FLA_industrial_effort_2_desc:0 "Avec une volonté de fer et une éthique de travail implacable, nous pouvons mobiliser le peuple pour un nouvel effort industriel d'envergure."
FLA_construction_effort_tt:0 "Pas assez d’emplacements de construction pour des §Yusines civiles§!"
FLA_construction_effort:0 "Développer les industries de Bruxelles"
FLA_construction_effort_desc:0 "Avec les nouvelles voies ferrées actuellement en construction à Bruxelles et dans ses environs, le potentiel économique de la ville sera encore plus attractif pour les industries et les services."
FLA_production_effort:0 "Soutenir les Zeebrugse Smederijen"
FLA_production_effort_tt:0 "Pas assez d’emplacements de construction pour une §Yusine militaire§!"
FLA_production_effort_desc:0 "Si l’on peut construire des tracteurs, on peut construire des chars ! Nous ne devons pas laisser notre capacité de production militaire prendre du retard."
FLA_construction_effort_2:0 "Renovatie van de Haven van Antwerpen"
FLA_construction_effort_2_desc:0 "Poursuivre l’expansion de nos usines nous permettra d’accélérer la production de biens pour le commerce et de soutenir d’autres projets de construction."
FLA_production_effort_2:0 "Soutenir l’industrie des véhicules lourds"
FLA_production_effort_2_desc:0 "En tant que l’un des principaux ports européens, Anvers est idéale pour développer une industrie tournée vers l’exportation."
FLA_production_effort_3:0 "Soutenir les fabricants d’avions militaires"
FLA_production_effort_3_desc:0 "Des efforts continus pour développer nos usines militaires sont nécessaires pour répondre à la demande en nouveaux équipements."
FLA_infrastructure_effort:0 "Relier les chemins de fer bruxellois"
FLA_infrastructure_effort_desc:0 "Un pays sans infrastructure adéquate ne peut pas entreprendre de projets ou constructions avancés."
FLA_infrastructure_effort_tt:0 "Pas assez d’emplacements de construction pour des §Yinfrastructures§!"
FLA_coal_mines:0 "Exploiter pleinement les mines de charbon du Limbourg"
FLA_coal_mines_desc:0 "Le charbon est notre ressource la plus importante, et nous devons en maximiser l’extraction."
FLA_synth_oil_effort_tt:0 "Pas assez d’emplacements de construction pour une §Yraffinerie synthétique§!"
FLA_infrastructure_effort_2:0 "Rénover les routes"
FLA_infrastructure_effort_2_desc:0 "L’extension de nos infrastructures permettra le transport et les communications nécessaires à des projets clandestins de haute technologie."
FLA_construction_effort_3:0 "Antwerps Industriegebied"
FLA_construction_effort_3_desc:0 "L’expansion de notre réseau d’infrastructures a considérablement amélioré notre capacité de construction."
FLA_nuclear_effort:0 "Goedendagproject"
FLA_nuclear_effort_desc:0 "À la veille d’une découverte qui pourrait changer le monde, nous ne pouvons pas laisser d’autres allumer le feu qui pourrait un jour consumer la Terre."
FLA_extra_tech_slot:0 "Soutenir l’Université de Gand"
FLA_extra_tech_slot_desc:0 "Notre expansion industrielle et nos récents progrès pourraient nous permettre de mener davantage de recherches en parallèle."
FLA_extra_tech_slot_2:0 "Comité de coordination de l’innovation"
FLA_extra_tech_slot_2_desc:0 "L’industrialisation rapide de notre nation a ouvert de nouvelles opportunités de recherche que nous devrions saisir."
FLA_technology_sharing:0 "Partage technologique"
FLA_technology_sharing_desc:0 "En partageant nos avancées technologiques avec nos alliés, toute notre faction pourra mener des recherches en temps de guerre plus efficacement."
FLA_secret_weapons:0 "Armes secrètes"
FLA_secret_weapons_desc:0 "Il est tentant de consacrer toutes nos ressources supplémentaires au développement de chars et d’avions, mais le secret pour gagner les guerres réside dans des domaines scientifiques entièrement nouveaux : l’électronique, la fuséologie et la recherche nucléaire."
FLA_political_effort:0 "Loi fondamentale"
FLA_political_effort_desc:0 "Pour changer le monde, nous devons commencer par changer notre propre pays. Le renforcement de notre position politique doit être prioritaire."
FLA_collectivist_ethos:0 "Renforcer les syndicats"
FLA_collectivist_ethos_desc:0 "Nos ennemis peuvent diviser et conquérir les nations plus faibles, mais notre peuple restera uni — tous pour un et un pour tous."
FLA_liberty_ethos:0 "Consensus démocratique"
FLA_liberty_ethos_desc:0 "Nous protégerons les libertés individuelles et la liberté à une époque où des fanatiques idéologiques cherchent à étouffer l’esprit humain."
FLA_militarism:0 "Militarisme"
FLA_militarism_desc:0 "Ceux qui considèrent l’armée comme un mal nécessaire hésiteront face à la guerre. Nous ancrerons le militarisme dans notre culture pour devenir un peuple de soldats."
FLA_political_correctness:0 "Correction politique"
FLA_political_correctness_desc:0 "Les personnes ayant des opinions légèrement controversées ou embarrassantes semblent préoccupées par un vaste complot à leur encontre. Cela nous paraît être une excellente idée."
FLA_neutrality_focus:0 "Orientation neutralité"
FLA_neutrality_focus_desc:0 "Tandis que certains prétendent qu’il faut du courage et de la sagesse pour choisir un camp dans un conflit mondial, nous savons qu’il en faut encore plus pour refuser."
FLA_interventionism_focus:0 "Orientation interventionnisme"
FLA_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples, pas seulement de nos citoyens. Si prévenir la tyrannie implique la guerre, qu’il en soit ainsi."
FLA_military_youth:0 "Nationaal-Socialistische Jeugd Vlaanderen"
FLA_military_youth_desc:0 "Des organisations visant à promouvoir la discipline et l’éducation politique des jeunes de notre nation favoriseront la loyauté et l’esprit de sacrifice dès le plus jeune âge."
FLA_deterrence:0 "Dissuasion"
FLA_deterrence_desc:0 "Isolés, nous profitons rarement de la guerre. Heureusement, nous savons que la meilleure défense est celle qui est tellement connue que l’on n’a jamais besoin de l’utiliser."
FLA_volunteer_corps:0 "Corps de volontaires"
FLA_volunteer_corps_desc:0 "Forcer notre peuple à mourir pour des idéaux de liberté serait ironique, mais créer des moyens pour ceux qui souhaitent aider des populations à l’étranger ne l’est pas."
FLA_paramilitarism:0 "Vlaamsche Wacht"
FLA_paramilitarism_desc:0 "Les principes militaires trouvent des applications en dehors de l’armée. Plus de personnes auront une formation militaire si nous développons des unités semi-militarisées pour compléter nos forces armées."
FLA_indoctrination_focus:0 "Endoctrinement"
FLA_indoctrination_focus_desc:0 "Ayant établi que notre idéologie repose sur la vérité, elle peut être enseignée comme telle. L'éducation et les médias doivent refléter cette leçon."
FLA_foreign_expeditions:0 "Expéditions Étrangères"
FLA_foreign_expeditions_desc:0 "Alors que nos ennemis se préparent à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."
FLA_why_we_fight:0 "Pourquoi Nous Combattions"
FLA_why_we_fight_effect:0 "Si nous n'avons pas l'esprit §YPolitique Étrangère Neutre§!, nous pourrons créer des factions.\n"
FLA_why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple doit voir les atrocités commises par ceux qui convoitent le pouvoir. Nous rallierons la population à notre cause et nous assurerons que chacun soit prêt à se battre pour notre liberté."
FLA_political_commissars:0 "Commissaires Politiques"
FLA_political_commissars_desc:0 "Pour garantir que nos politiques soient appliquées dans la pratique militaire, nous introduirons des responsables politiques dans les rangs de l'armée."
FLA_internationalism_focus:0 "Accent sur l'Internationalisme"
FLA_internationalism_focus_desc:0 "L'idéologie ne connaît pas de frontières. Une autre nation peut se dire souveraine, mais nos convictions priment sur de telles revendications."
FLA_nationalism_focus:0 "Ralliement autour du Strijdvlag"
FLA_ultra_nationalism_focus:0 "Triomphe du VNV"
FLA_nationalism_focus_desc:0 "Notre nation est unique, et nos réalisations politiques n'auraient pu se produire qu'ici. Nous devons nous battre pour elle à tout prix."
FLA_ideological_fanaticism:0 "Fanatisme Idéologique"
FLA_ideological_fanaticism_desc:0 "Nos valeurs et objectifs établis politiquement valent autant la peine de mourir que n'importe quelle foi ancienne. Tout partisan doit être prêt à affronter la mort, et ceux qui s'en écartent feraient mieux de s'y préparer également."
FLA_conservatism_focus:0 "Influence Catholique"
FLA_conservatism_focus_desc:0 "Influence Catholique."
FLA_welfare_focus:0 "Réformes Sociales"
FLA_rearmament_agreement:0 "Accord de Réarmement"
FLA_political_coalition_focus:0 "Coalition Politique"
FLA_political_coalition_focus_desc:0 "Coalition Politique."
FLA_Antwerp_Oil_Industry:0 "Possibilités de Raffinage Anversoises"
FLA_Antwerp_Oil_Industry_desc:0 "Anvers est déjà un port important pour le secteur chimique. Face à la menace croissante sur le commerce international, nous devrions réaffecter une partie de ces installations pour transformer notre cher charbon condrozien en pétrole."
FLA_reinforce_antwerp_brussels:0 "Ligne KO"
FLA_reinforce_antwerp_brussels_desc:0 "Le Brabant est au cœur de notre pays et abrite nos villes les plus importantes. Anvers était une forteresse importante dans le passé, et Bruxelles est le centre de notre nation. La fortification des deux régions en fera un rempart contre toute invasion ennemie. S'étendant des villages de Koningshooikt à Ottenburg, la ligne sera équipée de fossés antichars, de bunkers et de barrières Cointet."
#wallon semi-générique
wallonia_focus:0 "Arbre des priorités nationales de Wallonie"
WLL_army_effort:0 "Organiser la Nouvelle Armée"
WLL_army_effort_desc:0 "Malgré les possibilités croissantes de la guerre aérienne et navale, le combat terrestre reste crucial dans les guerres de demain. Avec une bonne préparation, nous pourrons éviter de revivre l'enfer des tranchées."
WLL_equipment_effort:0 "Moderniser l’Équipement"
WLL_equipment_effort_desc:0 "Les limites de ce que peut emporter l’infanterie sont sans cesse repoussées. Nous nous concentrerons sur l’équipement de nos troupes avec les meilleurs outils disponibles."
WLL_motorization_effort:0 "Soutien Motorisé"
WLL_motorization_effort_desc:0 "La mobilité et la protection sont essentielles pour transporter l’infanterie sur le terrain et l’en retirer en toute sécurité. Se concentrer sur ces développements nous permettra d’agir rapidement."
WLL_doctrine_effort:0 "Concevoir de Nouvelles Tactiques"
WLL_doctrine_effort_desc:0 "Les doctrines militaires qui ont défini le combat terrestre durant la Grande Guerre sont obsolètes. Nous devons confier à nos plus brillants esprits la tâche de façonner la pensée militaire de demain."
WLL_equipment_effort_2:0 "Poursuivre la Réforme de l’Équipement"
WLL_equipment_effort_2_desc:0 "Nous continuerons nos efforts pour garantir que notre infanterie et nos troupes de soutien disposent du meilleur équipement possible pour notre époque."
WLL_mechanization_effort:0 "Une Infanterie Mécanisée"
WLL_mechanization_effort_desc:0 "En repensant les possibilités de l’infanterie motorisée, nous pouvons repousser les limites de ce que nos véhicules peuvent accomplir."
WLL_doctrine_effort_2:0 "Manœuvres à Grande Échelle"
WLL_doctrine_effort_2_desc:0 "Le champ de bataille a changé durant l’entre-deux-guerres et au fil des récents conflits. Nous devons réévaluer continuellement nos doctrines pour en tenir compte."
WLL_equipment_effort_3:0 "Finaliser la Modernisation Militaire"
WLL_equipment_effort_3_desc:0 "Plutôt que d’imiter ou d’acheter du matériel étranger, nous devrions devenir un leader mondial dans les armes d’infanterie."
WLL_armor_effort:0 "Concevoir des Véhicules Blindés"
WLL_armor_effort_desc:0 "En appliquant ce que nous avons appris en mécanisant notre infanterie, nous pouvons aussi améliorer nos véhicules blindés."
WLL_special_forces:0 "Forces Spéciales"
WLL_special_forces_desc:0 "Nous avons besoin de troupes d’élite ; les chasseurs alpins et parachutistes doivent être notre priorité."
WLL_aviation_effort:0 "Fonder l’École Aérienne [ROOT.GetAdjective]"
WLL_aviation_effort_tt:0 "Pas assez d’emplacements disponibles pour une §YBase Aérienne§!"
WLL_aviation_effort_desc:0 "Nulle part les avancées technologiques ne sont aussi rapides que dans la guerre aérienne. L’aviation est un domaine que toute nation moderne doit maîtriser."
WLL_fighter_focus:0 "Primauté aux « Avions Fairey »"
WLL_fighter_focus_desc:0 "Nous n’avons pas vu la fin des combats aériens depuis la Grande Guerre. Rester en avance dans le développement des avions de chasse nous donnera un avantage futur."
WLL_bomber_focus:0 "Primauté à la SABCA"
WLL_bomber_focus_desc:0 "Les gens parleront un jour de l’horreur des guerres d’aujourd’hui, racontant des histoires de feu tombant du ciel. Nous ferons en sorte que ces histoires soient racontées par nos ennemis."
WLL_aviation_effort_2:0 "Étudier les Tactiques Étrangères"
WLL_aviation_effort_2_desc:0 "De nouvelles avancées en aviation seront nécessaires pour bien intégrer notre force aérienne avec les autres branches militaires."
WLL_CAS_effort:0 "Bombardiers en Piqué"
WLL_CAS_effort_desc:0 "Une armée moderne a besoin du soutien de véhicules au sol comme dans les airs."
WLL_rocket_effort:0 "Moteurs à Réaction"
WLL_rocket_effort_desc:0 "Les moteurs-fusées et les turboréacteurs permettent des vitesses inédites, que ce soit pour des appareils avec ou sans équipage. Être pionniers dans ces technologies nous permettra de surprendre l’ennemi."
WLL_NAV_effort:0 "Bombardiers Navals"
WLL_NAV_effort_desc:0 "Tout comme la nouvelle guerre navale se déroule sous la surface de l’eau, une partie se joue dans les airs au-dessus des mers."
WLL_naval_effort:0 "Financer la Construction Navale"
WLL_naval_effort_tt:0 "Pas assez d’emplacements disponibles pour des §YChantiers Navals§!"
WLL_naval_effort_desc:0 "L’expansion de notre marine doit être notre priorité. Attribuons toutes les ressources disponibles aux nouveaux chantiers navals et à la recherche sur les navires de surface légers."
WLL_flexible_navy:0 "Marine Flexible"
WLL_flexible_navy_desc:0 "Réinventer la guerre navale en tenant compte des avancées dans la technologie des sous-marins nous permettra de frapper efficacement les convois ennemis."
WLL_large_navy:0 "Grande Marine"
WLL_large_navy_desc:0 "Adapter nos doctrines navales pour accueillir de grands navires et assurer la sécurité de nos convois marchands nous apprendra beaucoup sur le type de navires dont nous avons besoin."
WLL_submarine_effort:0 "Guerre Sous-Marine"
WLL_submarine_effort_desc:0 "La guerre sous-marine est le développement naval le plus passionnant depuis l’invention du torpilleur. Nous ferions bien de nous protéger contre les sous-marins tout en les utilisant contre la flotte marchande ennemie."
WLL_cruiser_effort:0 "Concevoir des Croiseurs"
WLL_cruiser_effort_desc:0 "Avant de nous lancer dans la recherche avancée sur les cuirassés, les croiseurs plus petits doivent être remplacés."
WLL_destroyer_effort:0 "Concevoir des Destroyers"
WLL_destroyer_effort_desc:0 "En étudiant la conception et l’usage stratégique des sous-marins, nous avons aussi appris comment contrer ces stratégies. Les destroyers seront essentiels à cet effet."
WLL_capital_ships_effort:0 "Intérêt pour les Capitaux Navals"
WLL_capital_ships_effort_desc:0 "La nation ayant le plus de cuirassés dominera les océans. Les cuirassés et les porte-avions représentent à la fois l’ancien et le nouveau visage de la supériorité navale."
WLL_industrial_effort:0 "Plan Industriel de la Vallée de la Meuse"
WLL_industrial_effort_desc:0 "Concentrons tous nos efforts politiques sur le développement de l’industrie civile dans un grand bond en avant."
WLL_industrial_effort_2:0 "Effort Industriel II"
WLL_industrial_effort_2_desc:0 "Avec une volonté de fer et une éthique de travail inflexible, nous pouvons mobiliser la population dans un nouvel effort industriel majeur."
WLL_construction_effort:0 "Développer les Industries Lourdes à Liège"
WLL_construction_effort_tt:0 "Pas assez d’emplacements disponibles pour des §YUsines Civiles§!"
WLL_construction_effort_desc:0 "La capacité industrielle civile ne doit pas être sous-estimée, même quand la guerre menace le monde."
WLL_production_effort:0 "Investir dans la FN Herstal"
WLL_production_effort_tt:0 "Pas assez d’emplacements disponibles pour une §YUsine Militaire§!"
WLL_production_effort_desc:0 "Si vous pouvez fabriquer des tracteurs, vous pouvez fabriquer des chars ! Nous ne devons pas permettre à notre capacité de production militaire de prendre du retard."
WLL_construction_effort_3:0 "Encourager les Industries Légères à Namur"
WLL_construction_effort_3_desc:0 "Au cœur de la vallée Sambre-Meuse, Namur ne devrait pas seulement être notre capitale politique, mais aussi un centre industriel secondaire, en soutien à Liège et Charleroi."
WLL_coal_mines:0 "La Bataille du Charbon"
WLL_coal_mines_desc:0 "Le charbon est notre ressource la plus importante et nous devons maximiser son extraction."
WLL_Artificial_Oil_Industry:0 "Du Charbon au Pétrole"
WLL_Artificial_Oil_Industry_desc:0 "Notre charbon peut être transformé en pétrole et en caoutchouc synthétique, un développement utile qui nous permettra de moins dépendre des importations."
WLL_production_effort_2:0 "Étendre le FRC"
WLL_production_effort_2_desc:0 "Tenter d’adapter les usines civiles à la production d’armement est inefficace. Nous devrions préparer la production militaire dès maintenant."
WLL_production_effort_3:0 "Investir dans Avions Fairey et SABCA"
WLL_production_effort_3_desc:0 "Poursuivre l’expansion de nos usines militaires est nécessaire pour répondre à la demande de nouveaux équipements."
WLL_infrastructure_effort:0 "Rénover les Routes"
WLL_infrastructure_effort_desc:0 "Un pays sans infrastructures adaptées ne peut mener de projets ou de constructions avancés."
WLL_infrastructure_effort_tt:0 "Pas assez d’emplacements disponibles pour §YInfrastructure§!"
WLL_synth_oil_effort_tt:0 "Pas assez d’emplacements disponibles pour §YRaffinerie Synthétique§!"
WLL_infrastructure_effort_2:0 "Rénover les Chemins de Fer"
WLL_infrastructure_effort_2_desc:0 "Étendre notre réseau d’infrastructures permettra le transport et la communication nécessaires à des projets secrets de haute technologie."
WLL_construction_effort_2:0 "Augmenter la Production à Hainaut"
LL_construction_effort_2_desc:0 "La région entre Mons et Charleroi n'est pas seulement riche en charbon, elle compte également de nombreuses usines. Nous devons encore plus la développer pour résister à ces temps troublés."
WLL_liege_forts:0 "Recréer la ceinture de forts de Liège"
WLL_liege_forts_desc:0 "Les forts de Liège furent un élément crucial de la défense belge contre l'Allemagne au début de la Grande Guerre. Un programme de construction vital doit commencer dès que possible afin d'en faire un élément central pour dissuader [GER.GetNameDef] d'attaquer. N'oublions pas de prendre en compte la possibilité d'une attaque par planeurs."
WLL_nuclear_effort:0 "Programme nucléaire"
WLL_nuclear_effort_desc:0 "À l'aube d'une découverte qui pourrait changer le monde, nous ne pouvons pas laisser d'autres allumer le feu qui pourrait un jour consumer la Terre."
WLL_extra_tech_slot:0 "Financer les universités"
WLL_extra_tech_slot_desc:0 "Notre expansion industrielle et d'autres progrès récents pourraient nous permettre de mener davantage de recherches et développements en parallèle."
WLL_extra_tech_slot_2:0 "Coordonner les innovations"
WLL_extra_tech_slot_2_desc:0 "L'industrialisation rapide de notre nation a ouvert de nouvelles opportunités en matière de recherche et développement que nous devrions exploiter."
WLL_technology_sharing:0 "Partage technologique"
WLL_technology_sharing_desc:0 "En partageant nos avancées technologiques avec nos alliés, l'ensemble de notre faction mènera la recherche et développement en temps de guerre plus efficacement."
WLL_secret_weapons:0 "Armes secrètes"
WLL_secret_weapons_desc:0 "Il est tentant d'investir toutes nos ressources supplémentaires dans le développement de chars et d'avions, mais le secret de la victoire réside dans des domaines scientifiques entièrement nouveaux : électronique, fuséologie et recherche nucléaire."
WLL_political_effort:0 "Organiser le nouvel État"
WLL_political_effort_desc:0 "Pour changer le monde, nous devons commencer par changer notre propre pays. Renforcer notre position politique doit être la première étape."
WLL_collectivist_ethos:0 "Esprit collectiviste"
WLL_collectivist_ethos_desc:0 "Nos ennemis peuvent diviser et conquérir les nations plus faibles, mais notre peuple restera uni : tous pour un et un pour tous."
WLL_liberty_ethos:0 "Consensus démocratique"
WLL_liberty_ethos_desc:0 "Nous protégerons les libertés individuelles et la liberté en ces temps où des fanatiques idéologiques cherchent à étouffer l'esprit humain."
WLL_militarism:0 "Militarisme"
WLL_militarism_desc:0 "Ceux qui considèrent l'armée comme un mal nécessaire hésiteront face à la guerre. Nous intégrerons le militarisme dans notre culture pour devenir un peuple de soldats."
WLL_political_correctness:0 "Correction politique"
WLL_political_correctness_desc:0 "Les personnes ayant des opinions légèrement controversées ou embarrassantes semblent craindre un vaste complot contre elles. Cela semble être une excellente idée."
WLL_neutrality_focus:0 "Priorité à la neutralité"
WLL_neutrality_focus_desc:0 "Certains affirment qu'il faut du courage et de la sagesse pour prendre parti dans un conflit mondial, mais nous savons qu'il en faut davantage pour refuser."
WLL_interventionism_focus:0 "Priorité à l'interventionnisme"
WLL_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples, pas seulement celle de nos citoyens. Si empêcher la tyrannie signifie faire la guerre, qu'il en soit ainsi."
WLL_military_youth:0 "Jeunesses Rexistes"
WLL_military_youth_desc:0 "Des organisations visant à promouvoir la discipline et l'éducation politique de la jeunesse favoriseront la loyauté et l'abnégation dès le plus jeune âge."
WLL_deterrence:0 "Dissuasion"
WLL_deterrence_desc:0 "Seuls, nous bénéficions rarement de la guerre. Heureusement, nous savons que la meilleure défense est celle que l'on connaît si bien qu'il n'est jamais nécessaire de l'utiliser."
WLL_volunteer_corps:0 "Corps de volontaires"
WLL_volunteer_corps_desc:0 "Forcer notre peuple à mourir pour des idéaux de liberté serait une ironie, mais permettre à ceux qui le souhaitent d'aider à l'étranger ne l'est pas."
WLL_paramilitarism:0 "Gardes wallonnes"
WLL_paramilitarism_desc:0 "Les principes militaires ont des applications au-delà de l'armée. Plus de personnes auront une formation militaire si nous développons des unités semi-militarisées pour compléter nos forces armées."
WLL_indoctrination_focus:0 "Endoctrinement"
WLL_indoctrination_focus_desc:0 "Ayant établi que notre idéologie est fondée sur la vérité, elle peut être enseignée comme telle. L'éducation et les médias doivent refléter cette réalité."
WLL_foreign_expeditions:0 "Expéditions étrangères"
WLL_foreign_expeditions_desc:0 "Puisque nos ennemis sont prêts à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."
WLL_why_we_fight:0 "Pourquoi nous combattons"
WLL_why_we_fight_effect:0 "Si nous n'avons pas l'esprit §YPolitique étrangère neutre§!, nous pourrons créer des factions.\n"
WLL_why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple doit voir les atrocités commises par ceux qui convoitent le pouvoir. Nous rallierons la nation à notre cause et veillerons à ce que chacun soit prêt à se battre pour notre liberté."
WLL_political_commissars:0 "Commissaires politiques"
WLL_political_commissars_desc:0 "Pour garantir l'application de nos politiques au sein des forces armées, nous introduirons des responsables nommés politiquement dans les rangs militaires."
WLL_internationalism_focus:0 "Priorité à l'internationalisme"
WLL_internationalism_focus_desc:0 "L'idéologie ne connaît pas de frontières. Une autre nation peut se dire souveraine, mais nos convictions priment sur ces revendications."
WLL_nationalism_focus:0 "Priorité au nationalisme"
WLL_nationalism_focus_desc:0 "Notre nation est unique, et nos réussites politiques n'auraient pu se produire qu'ici. Nous devons nous battre pour elle à tout prix."
WLL_ideological_fanaticism:0 "Fanatisme idéologique"
