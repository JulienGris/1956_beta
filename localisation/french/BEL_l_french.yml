 WLL_georges_thone:0 "Georges Thone"
 WLL_arille_carlier:0"Arille Carlier"
 WLL_Prosper_Theugels:0 "Prosper Theugels"
 WLL_fernand_rouleau:0 "Fernand Rouleau"
 WLL_Jules_Mahieu:0 "Jules Mahieu"

COG_albert_decoster:0 "Albert Decoster"
COG_albert_decoster_desc:0 "Albert Decoster était directeur du « Journal du Katanga », une publication qui répétait le contenu des bulletins de guerre soviétiques avec une fidélité et une régularité extrêmes. Bien que ce soit partiellement pour plaire aux syndicalistes de Jadotville, il avait des sympathies de gauche."
COG_pierre_cattier:0 "Pierre Cattier"
COG_pierre_cattier_desc:0 "Pierre Cattier était le directeur d'une compagnie de ferry opérant entre Anvers et Léopoldville. Dans le cas de la construction d'une marine belgo-congolaise, il aurait été l'une des rares personnes disposant de l'expérience nécessaire pour aider à sa gestion."
COG_joseph_kasa_vubu_desc:0 "Joseph Kasa-Vubu était déjà un défenseur de la reconnaissance des spécificités culturelles des Congolais juste après la guerre. Il devint plus tard le premier président du Congo indépendant de Léopoldville."
COG_gerard_greindl_desc:0 "Gérard Greindl était un aviateur belge qui poursuivit la guerre en Afrique. En raison du manque d'avions au Congo belge, il servit dans l'armée de l'air sud-africaine."
COG_charles_joseph_haas:0 "Charles-Joseph Haas"
COG_charles_joseph_haas_desc:0 "Charles-Joseph Haas était un officier qui poursuivit sa carrière au Congo après la Grande Guerre. Lieutenant-colonel en 1935 et colonel en 1941, il combattit sous le commandement de Gilliaert en Abyssinie."
COG_jules_cousin:0 "Jules Cousin"
COG_jules_cousin_desc:0 "Jules Cousin était l'un des administrateurs de l'Union Minière du Haut-Katanga."
COG_leo_petillon:0 "Léo Pétillon"
COG_leo_petillon_desc:0 "Léo Pétillon était un fonctionnaire du ministère des colonies à Bruxelles (il est l'un des fondateurs de la loterie coloniale, précurseur de la loterie nationale belge) avant d'être affecté au Congo belge. En 1939, il devint un aide du Gouverneur général Pierre Ryckmans."
COG_eugene_jungers_desc:0 "Eugène Jungers était l'administrateur colonial du mandat du Ruanda-Urundi, un territoire composé des pays modernes du Rwanda et du Burundi. Ces territoires étaient (en théorie) distincts du Congo belge et administrés sous mandat de la Société des Nations."
COG_edgar_sengier:0 "Edgar Sengier"
COG_edgar_sengier_desc:0 "Edgar Sengier était l'ingénieur qui eut l'idée d'envoyer de grandes quantités de minerai d'uranium extraites à Shinkolobwe aux États-Unis pour le protéger d'une guerre européenne. Ses actions ont directement impacté les quantités d'uranium disponibles pour le gouvernement américain afin de lancer le projet Manhattan."
COG_jean_beaudinet:0 "Jean Beaudinet"
COG_jean_beaudinet_desc:0 "Jean Beaudinet était directeur de la « sécurité d'État » (le service secret civil belge) dans la colonie."
COG_paul_ermens_desc:0 "Paul Ermens était chef d'état-major de la Force Publique."
COG_auguste_edouard_gilliaert:0 "Auguste-Édouard Gilliaert"
COG_leopold_dronkers_martens:0 "Léopold Dronkers-Martens"
COG_leopold_dronkers_martens_desc:0 "Léopold Dronkers-Martens était l'un des officiers les plus gradés de la campagne d'Abyssinie. Il fut plus tard envoyé au Moyen-Orient avec le corps congolais."
COG_edmond_van_der_meersch:0 "Edmond van der Meersch"
COG_edmond_van_der_meersch_desc:0 "Edmond van der Meersch est surtout connu pour son rôle lors des événements entourant l'indépendance du Congo en 1960, mais il était déjà un officier de haut rang dans la Force Publique."
COG_robert_mauroy:0 "Robert Mauroy"
COG_robert_mauroy_desc:0 "Robert Mauroy était le chef d'état-major d'Émile Hennequin. Il était un candidat potentiel pour le commandement effectif des troupes, mais Auguste-Édouard Gilliaert fut choisi à la place."
COG_emile_hennequin:0 "Émile Hennequin"
COG_emile_hennequin_desc:0 "Émile Hennequin commandait la Force Publique avant le général Ermens. Il supervisa les premières réformes qui conduisirent au rééquipement de la Force Publique après les réductions budgétaires causées par la Grande Dépression."
COG_franz_burniaux:0 "Franz Burniaux"
COG_franz_burniaux_desc:0 "Instructeur aérien dans l'armée de l'air belge, Franz Burniaux continua la guerre en Afrique après un bref passage en Grande-Bretagne. Il fut consulté sur la faisabilité de créer une force aérienne pour le Congo belge, mais le projet fut abandonné, et il servit dans le corps belge de l'armée de l'air sud-africaine."
COG_n_cools:0 "N. Cools"
COG_n_cools_desc:0 "Bien que N. Cools ait eu historiquement un rôle relativement mineur parmi tous les officiers de haut rang de la Force Publique, il est notable qu'il avait une forte réputation de germanophilie. En l'absence de meilleur candidat, il fut choisi comme leader fasciste congolais. Il n'a été possible de trouver que son initiale pour son prénom."
COG_m_heynen:0 "M. Heynen"
COG_m_heynen_desc:0 "M. Heynen est un syndicaliste qui mena des grèves en 1940 à Jadotville avec M. Dutron. La différence est qu'il prônait une victoire allemande, tandis que Dutron prônait une révolution communiste. Ce n'était pas contradictoire à l'époque en raison du pacte Molotov-Ribbentrop. Tous deux furent emprisonnés pour « discours défaitistes »."
COG_m_dutron:0 "M. Dutron"
COG_m_dutron_desc:0 "M. Dutron est un syndicaliste qui mena des grèves en 1940 à Jadotville avec M. Heynen. La différence est qu'il prônait une révolution communiste, tandis que Heynen souhaitait une victoire allemande. Ce n'était pas contradictoire à l'époque en raison du pacte Molotov-Ribbentrop. Tous deux furent emprisonnés pour « discours défaitistes »."
COG_m_dutron2:0 "M. Dutron"
COG_m_dutron2_desc:0 "M. Dutron est un syndicaliste qui mena des grèves en 1940 à Jadotville avec M. Heynen. La différence est qu'il prônait une révolution communiste, tandis que Heynen souhaitait une victoire allemande. Ce n'était pas contradictoire à l'époque en raison du pacte Molotov-Ribbentrop. Tous deux furent emprisonnés pour « discours défaitistes »."
COG_maurice_sluys:0 "Maurice Sluys"
COG_maurice_sluys_desc:0 "Maurice Sluys était un ingénieur minier qui travailla pour une société américaine en Yougoslavie avant de se rendre au Congo belge après l'invasion de la Belgique et de la Yougoslavie. Il devint chef de la « Direction de la production minière de guerre ». Il retourna plus tard en Belgique et enseigna la géologie à Liège. La photo utilisée le montre dans les dernières années de sa vie, bien après avoir quitté l'Afrique."
COG_union_miniere:0 "Union Minière du Haut Katanga"
COG_union_miniere_desc:0 "L'Union Minière du Haut Katanga est une société minière établie dans le 'scandale géologique' du Katanga. Elle exploitait le cuivre, le tungstène et la célèbre mine d'uranium de Shinkolobwe."
COG_idea_war_mining_production_directorate:0 "Direction de la production minière de guerre"
COG_idea_war_mining_production_directorate2:0 "Direction de la production minière de guerre"
COG_idea_war_mining_production_directorate3:0 "Direction de la production minière de guerre"

BEL_linguistic_question_in_military:0 "Question linguistique militaire"
BEL_linguistic_question_in_military_desc:0 "Depuis des années, le mouvement flamand voulait diviser l'armée sur des bases linguistiques, affirmant que les soldats flamands ne comprenaient pas les ordres donnés en français."

BEL_divide_the_military:0 "Réorganiser l'armée selon la langue"
BEL_divide_the_military_desc:0 "Maintenant que nous avons élaboré un plan pour réorganiser la structure de nos forces armées sur une base linguistique, certaines unités devront déménager dans d'autres casernes tandis que de nombreux soldats seront commandés par de nouveaux officiers."

BEL_army_linguistic_divide:0 "Division linguistique de l'armée"
BEL_army_linguistic_divide_desc:0 "Depuis des années, le mouvement flamand voulait diviser l'armée sur des bases linguistiques, affirmant que les soldats flamands ne comprenaient pas les ordres donnés en français. Il est maintenant temps de mettre en œuvre des changements dans la structure de l'armée pour avoir des divisions séparées francophones et néerlandophones."

BEL_depillarize_the_belgians:0 "Dé-pillariser la société belge"
BEL_depillarize_the_belgians_desc:0 "La rigidité de notre société actuelle, organisée en piliers, est un obstacle à la révolution et à un avenir meilleur."

BEL_choose_Rex:0 "Choisir Rex"
BEL_choose_Rex_desc:0 "Rex est le parti fasciste le plus puissant de ce pays. Rex veut garder la patrie forte et unie. Rex montrera la véritable gloire de la Belgique. Rex triomphera !"

BEL_choose_Verdinaso:0 "Choisir Verdinaso"
BEL_choose_Verdinaso_desc:0 "Le VNV veut seulement diviser le pays ; ils ne voient pas que les Wallons ne sont pas nos ennemis mais nos frères de race. Au contraire, si nous pouvons unir notre peuple derrière l'unification des Pays-Bas, nous pourrions former Dietsland, l'union de tous les peuples des Pays-Bas. Cette nouvelle nation célébrera notre union perpétuelle après 500 ans de séparation."

BEL_go_left:0 "Soutenir KPB-PCB"
BEL_go_left_desc:0 "Notre nation a été dominée par les banquiers et les riches pendant trop longtemps. Il est temps que le Parti communiste belge brille. Nous devons propager la Révolution prolétarienne !"

BEL_go_right:0 "Soutenir Rex et Verdinaso"
BEL_go_right_desc:0 "Notre pays a été gouverné trop longtemps par une classe de politiciens égoïstes et corrompus et leurs amis banquiers. Ce comportement accélère la désintégration morale de notre société, permettant à ces fameux chiens rouges de détourner notre peuple de l'unique Église sainte, catholique et apostolique. Il est temps que notre patrie se réveille !"

BEL_fascist_legions:0 "Légions antibolcheviques belges"
BEL_fascist_legions_desc:0 "Nous devons mobiliser nos partisans pour combattre la menace rouge dans chaque pays en danger."

BEL_belgian_militarism:0 "Militarisme belge"
BEL_belgian_militarism_desc:0 "La Belgique a marqué l'histoire pendant deux mille ans ! Nous avons surpris le grand César, vaincu les Français à la bataille des Éperons d'or et dominé les Allemands pendant la Grande Guerre. Notre héritage est héroïque ; notre armée doit le refléter."

BEL_claim_the_benelux:0 "Revendiquer les anciens Pays-Bas bourguignons"
BEL_claim_the_benelux_desc:0 "Les Pays-Bas étaient autrefois unis… non pas par le roi Guillaume d’Orange mais par les comtes de Flandre, ducs de Brabant et de Bourgogne régnant depuis Bruges, Bruxelles et Dijon. Le peuple des Pays-Bas est d’une seule race noble et partage un patrimoine commun. Ils doivent donc être unis sous une seule autorité, la nôtre."

BEL_burgundian_circuit:0 "Restaurer le cercle bourguignon"
BEL_burgundian_circuit_desc:0 "Peuple impérial, réveillez-vous ! Par ces mots, Léon Degrelle appelait tous les Belges à restaurer l’ambition des ducs de Bourgogne pour créer un État entre la France et l’Allemagne, inspiré du Cercle bourguignon établi par l’empereur Charles V. Néanmoins, certains sceptiques l’ont surnommé « Modeste Ier, roi de Bourgogne » (ces sceptiques étaient, comme lui, des soldats de la Légion wallonne sur le front de l’Est)."
BEL_proclaim_thiois_empire:0 "Proclamer l'Empire Thiois"
BEL_proclaim_thiois_empire_desc:0 "Maintenant que nos principaux objectifs sont accomplis, nous pouvons enfin abandonner notre ancien nom de Belgique pour le remplacer par un nouveau qui montre clairement la puissance de notre union impériale. Vive l'Empire Thiois !"

BEL_unite_dietsland:0 "Unir Dietsland"
BEL_unite_dietsland_desc:0 "Une union de Dietsland est désormais possible. D'abord, nous devons réunir les frontières du Royaume-Uni des Pays-Bas. Ensuite, nous pourrions frapper la France pour annuler les infâmes traités de guerre de Sébastien de Vauban et Louis XIV et réunir les XVII provinces. Cela fonctionnera car, comme le dit la devise : \"La Force Fait l'Unité\"."

BEL_proclaim_dietsland:0 "Proclamer Dietsland"
BEL_proclaim_dietsland_desc:0 "Une union de Dietsland est désormais possible. D'abord, nous devons réunir les frontières du Royaume-Uni des Pays-Bas. Ensuite, nous pourrions frapper la France pour annuler les infâmes traités de guerre de Sébastien de Vauban et Louis XIV et réunir les XVII provinces. Cela fonctionnera car, comme le dit la devise : \"La Force Fait l'Unité\"."

BEL_proclaim_dietsche_rijk:0 "Proclamer le Dietsche Rijk"
BEL_proclaim_dietsche_rijk_desc:0 "Maintenant que nos principaux objectifs sont accomplis, nous pouvons enfin abandonner notre ancien nom de Belgique pour le remplacer par un nouveau qui montre clairement la puissance de notre union impériale. Vive le Dietsche Rijk !"

BEL_fascist_youth_organizations:0 "Créer des organisations de jeunesse fascistes"
BEL_fascist_youth_organizations_desc:0 "Nous pouvons parler différentes langues au nord et au sud, mais nous sommes unis par notre origine germanique commune. Cette vérité ancienne doit être enseignée à la jeunesse car elle représente l'avenir de notre pays, de notre race et la base du nouvel ordre européen."

BEL_colonial_claims:0 "Revendiquer le Grand Bassin du Congo"
BEL_colonial_claims_desc:0 "Lors de la conférence de Berlin, l'étendue réelle du Congo fut restreinte par les hypocrites « grandes puissances ». Il est temps de réviser ces décisions et d’appliquer le plan exposé par Stanley : un grand Congo, reliant les deux océans pour assurer le triomphe de la civilisation au cœur de l’Afrique."

BEL_germany_millitary_coop:0 "Coopération militaire avec [GER.GetNameDef]"
BEL_germany_millitary_coop_desc:0 "Avec l’éveil national dans notre pays et notre proximité idéologique avec [GER.GetNameDef], nous pourrions établir un pacte de coopération militaire."

BEL_belgium_first:0 "Dieu protège la Belgique libre et son Roi"
BEL_belgium_first_desc:0 "« Dieu Protège la Libre Belgique et son Roi » provient de « Vers l'Avenir », l’hymne rexiste. Dans ce nom, Rex était très royaliste, et Léopold III lui-même n’était pas clairement opposé à un exécutif fort. Cette « indécision » a conduit à la « question royale », à la régence du prince Charles et à l’abdication du roi après la guerre."

BEL_reactivate_caur_contacts:0 "Réactiver les contacts du CAUR"
BEL_reactivate_caur_contacts_desc:0 "La convention de Montreux de 1934 fut l’occasion pour les membres du Verdinaso de se rencontrer sous l’égide des agents du CAUR (Comité d’Action pour l’Universalité de Rome) pour créer une nouvelle Europe guidée par la vision du Duce."

BEL_an_ally_across_the_channel:0 "Un allié de l’autre côté de la Manche"
BEL_an_ally_across_the_channel_desc:0 "Le succès conjoint de nos partis respectifs chez nous et en [ENG.GetNameDef] a fait de nos gouvernements des alliés naturels."

BEL_propaganda_ministry:0 "Créer un ministère de la propagande"
BEL_propaganda_ministry_desc:0 "La propagande n’est pas de l’endoctrinement… c’est le meilleur moyen de guider le peuple sur la bonne voie."

BEL_communist_brigades:0 "Brigades communistes belges"
BEL_communist_brigades_desc:0 "Nous devons mobiliser des volontaires pour combattre les fascistes."

BEL_support_pcf:0 "Soutenir le Parti communiste français"
BEL_support_pcf_desc:0 "Le Parti communiste français est un élément crucial des forces antifascistes en Europe. Nous devons le soutenir par tous les moyens disponibles."

BEL_support_pcf2:0 "Soutenir [FRA.GetNameDef]"
BEL_support_pcf2_desc:0 "Le Parti communiste français est un élément crucial des forces antifascistes en Europe. Nous devons le soutenir par tous les moyens disponibles."

BEL_communist_army:0 "Réorganisation politique de l’armée"
BEL_communist_army_desc:0 "La souffrance individuelle est nécessaire pour la gloire nationale. Dans un pays comme la Belgique, l’internationalisme doit commencer en interne avant de se répandre dans le monde."

BEL_sign_pact_with_soviets:0 "Pacte avec les [SOV.GetAdjective]s"
BEL_sign_pact_with_soviets_desc:0 "Notre plus grande menace se trouve en [GER.GetNameDef]. [SOV.GetNameDefCap] a proposé d’améliorer notre technologie blindée pour concurrencer les Panzers [GER.GetAdjective]. Nous devons saisir cette opportunité à deux mains !"
BEL_independent_revolution:0 "Révolution Indépendante"
BEL_independent_revolution_desc:0 "Cette révolution est notre révolution ! Nous ne devons rien à [SOV.GetLeader] !"
BEL_invite_france:0 "Alliance avec [FRA.GetNameDef]"
BEL_invite_france_desc:0 "En tant que nouvelle puissance communiste en Europe de l'Ouest, nos deux pays doivent conclure un accord pour former une alliance militaire indestructible."
BEL_political_commissars:0 "Commissaires Politiques"
BEL_political_commissars_desc:0 "Les révolutions communistes risquent la subversion à chaque étape du progrès vers l'abondance mondiale. Pour garantir que ce progrès ne soit pas menacé par ses ennemis, les gardiens du chemin juste doivent combattre les agents des puissances capitalistes."
BEL_technology_sharing:0 "Partage de la Technologie"
BEL_puppet_netherlands:0 "Faire pression sur le gouvernement [HOL.GetAdjective]"
BEL_puppet_netherlands_desc:0 "Les Pays-Bas doivent être libérés du capitalisme."
BEL_communist_propaganda_Benelux:0 "Travailleurs des Pays-Bas, Unissez-vous !"
BEL_communist_propaganda_Benelux_desc:0 "Les Pays-Bas doivent être libérés du capitalisme. Pour cela, la propagande doit être diffusée chez nos voisins afin d'étendre la révolution."
BEL_ideological_propaganda:0 "Propagande Idéologique"
BEL_ideological_propaganda_desc:0 "Chaque mouvement communiste est une cellule potentielle prête à organiser les masses."
BEL_technology_sharing_desc:0 "En partageant les avancées technologiques avec nos alliés, toute notre faction mènera la R&D de guerre plus efficacement."
BEL_technology_sharing_democracy:0 "Partage de la Technologie"
BEL_technology_sharing_democracy_desc:0 "En partageant les avancées technologiques avec nos alliés, toute notre faction mènera la R&D de guerre plus efficacement."
BEL_technology_sharing_fascism:0 "La Force par la Connaissance"
BEL_technology_sharing_fascism_desc:0 "En partageant les avancées technologiques avec nos alliés, toute notre faction mènera la R&D de guerre plus efficacement."
BEL_technology_sharing_communism:0 "Coopération Scientifique Socialiste"
BEL_technology_sharing_communism_desc:0 "En partageant les avancées technologiques avec nos alliés, toute notre faction mènera la R&D de guerre plus efficacement."
BEL_form_coalition_government:0 "Former un Gouvernement de Coalition"
BEL_form_coalition_government_desc:0 "Les gouvernements de coalition sont une tradition en Belgique, mais pour faire face à la menace fasciste, tous les partis démocratiques doivent être inclus dans une grande coalition, et les petites différences mises de côté."
BEL_centralized_communist_government:0 "Gouvernement Communiste Centralisé"
BEL_urban_projects_capital:0 "Relier les Chemins de Fer de Bruxelles"
BEL_urban_projects_capital_desc:0 "Nous pouvons transformer notre capitale en une ville vraiment moderne en creusant des tunnels pour relier les différents systèmes ferroviaires en un vaste réseau traversant la ville, même si cela se fait au détriment de son charme architectural."
BEL_fortress_belgium:0 "Recréer la Ceinture de Forts de Liège"
BEL_fortress_belgium_desc:0 "Les forts de Liège étaient un élément crucial de la défense belge contre l'Allemagne au début de la Grande Guerre. Un programme de construction vital doit commencer dès que possible pour en faire un élément clé afin de dissuader [GER.GetNameDef] d'attaquer. N'oubliez pas de prendre en compte la possibilité d'une attaque par planeur."
BEL_reinforce_antwerp_brussels:0 "Ligne KW Linie"
BEL_reinforce_antwerp_brussels_desc:0 "Le Brabant est au cœur de notre pays et abrite nos villes les plus importantes. Anvers était une forteresse importante dans le passé, et Bruxelles est le centre de notre nation. La fortification de ces deux régions les transformera en rempart contre toute invasion ennemie. S'étendant du village de Koningshooikt à la ville de Wavre, la ligne sera équipée de fossés antichars, bunkers et pièges antichars Cointet."
BEL_fortress_french_border:0 "Fortifier la Frontière [FRA.GetAdjective]"
BEL_fortress_french_border_desc:0 "Les [FRA.GetAdjective] sont nos ennemis naturels, et nous devons être prêts en cas de guerre."


congo_focus:0 "Objectif National Congolais"

BEL_Support_the_congo_railways:0 "Bureau Colonial des Transports"
BEL_Support_the_congo_railways_desc:0 "Fondé en 1935, l'« Office des transports coloniaux » ou OTRACO, était chargé du système ferroviaire au Congo belge."

BEL_congo_rubber:0 "Étendre les Plantations d'Hévéa"
BEL_congo_rubber_desc:0 "Le climat tropical du Congo est idéal pour les plantations d'hévéa. L'utilisation de nouvelles variétés et l'extension des plantations augmenteraient rapidement la production. Nous sommes certains que les autochtones nous donneraient volontiers un coup de main à cet égard."

BEL_congo_rubber2:0 "Améliorer la Productivité des Plantations"
BEL_congo_rubber2_desc:0 "Le climat tropical du Congo est idéal pour les plantations d'hévéa. L'utilisation de nouvelles variétés et l'extension des plantations augmenteraient rapidement la production. Nous sommes certains que les autochtones nous donneraient volontiers un coup de main à cet égard."

BEL_support_copper_mining:0 "Commencer l'Exploitation du Cuivre [COG.GetAdjective]"
BEL_support_copper_mining_desc:0 "Découverts au fil des ans dans diverses régions du Congo, les riches minerais de la colonie n'attendent que la civilisation pour être exploités et soutenir notre économie."

BEL_support_copper_mining2:0 "Étendre les Mines de Cuivre [COG.GetAdjective]"
BEL_support_copper_mining2_desc:0 "Découverts au fil des ans dans diverses régions du Congo, les riches minerais de la colonie n'attendent que la civilisation pour être exploités et soutenir notre économie."

BEL_support_tungsten_mining:0 "Commencer l'Exploitation du Tungstène [COG.GetAdjective]"
BEL_support_tungsten_mining_desc:0 "Découverts au fil des ans dans diverses régions du Congo, les riches minerais de la colonie n'attendent que la civilisation pour être exploités et soutenir notre économie."

BEL_support_tungsten_mining2:0 "Étendre les Mines de Tungstène [COG.GetAdjective]"
BEL_support_tungsten_mining2_desc:0 "Découverts au fil des ans dans diverses régions du Congo, les riches minerais de la colonie n'attendent que la civilisation pour être exploités et soutenir notre économie."

BEL_support_tungsten_mining3:0 "Étendre Davantage les Mines de Tungstène"
BEL_support_tungsten_mining3_desc:0 "Découverts au fil des ans dans diverses régions du Congo, les riches minerais de la colonie n'attendent que la civilisation pour être exploités et soutenir notre économie."

BEL_support_tungsten_mining4:0 "Maximiser l'Extraction du Tungstène"
BEL_support_tungsten_mining4_desc:0 "Découverts au fil des ans dans diverses régions du Congo, les riches minerais de la colonie n'attendent que la civilisation pour être exploités et soutenir notre économie."

BEL_transform_the_congo:0 "Étendre les Opportunités Coloniales"
BEL_transform_the_congo_desc:0 "Rénover le port de Banana pour accroître nos capacités logistiques."

BEL_transform_the_congo2:0 "Investir dans l'Industrie Coloniale"
BEL_transform_the_congo2_desc:0 "Même si le Congo était principalement une colonie d'exploitation, la population coloniale et le nombre de minerais sont suffisamment importants pour commencer la production avant l'exportation."

BEL_transform_the_congo3:0 "Augmenter l'Industrie Coloniale"
BEL_transform_the_congo3_desc:0 "Même si le Congo était principalement une colonie d'exploitation, la population coloniale et le nombre de minerais sont suffisamment importants pour commencer la production avant l'exportation."

BEL_urbanize_wallonie:0 "Investir dans le « Sillon Sambre et Meuse »"
BEL_urbanize_wallonie_desc:0 "La Wallonie est l'une des régions les plus industrialisées d'Europe depuis le début du XIXe siècle ; la Meuse et son affluent, la Sambre, sont des artères vitales pour transporter les produits industriels à travers le pays puis vers le reste de l'Europe."

BEL_invest_in_FN_Herstal:0 "Étendre les Usines Militaires de Liège"
BEL_invest_in_FN_Herstal_desc:0 "La Fabrique Nationale, la Fonderie Royale de Canons et la Manufacture d'Armes de l'État, situées à Liège et ses environs, sont les éléments les plus précieux de notre capacité de production d'armement. Pour disposer d'une armée suffisamment équipée, l'extension de ces usines sera nécessaire."

BEL_invest_in_FRC_Herstal:0 "Étendre la « Fonderie Nationale de Canons »"
BEL_invest_in_FRC_Herstal_desc:0 "La 'Fabrique Nationale' et la 'Fonderie Royale de Canons', situées à Herstal près de Liège, sont les éléments les plus importants de notre production militaire. Si nous voulons augmenter le nombre d'armes produites, des extensions de ces usines sont indispensables."
BEL_urban_projects_capital_industry:0 "Développer les industries de Bruxelles"
BEL_urban_projects_capital_industry_desc:0 "Avec les nouvelles voies ferrées actuellement en construction dans et autour de Bruxelles, le potentiel économique de la ville sera encore plus attractif pour les industries et les services."
BEL_Expand_the_port_of_Antwerp:0 "Étendre le port d'Anvers"
BEL_Expand_the_port_of_Antwerp_desc:0 "En tant que l'un des principaux ports européens, Anvers est idéal pour développer une industrie tournée vers l'exportation."
BEL_urban_projects_capital2:0 "Zone industrielle d'Anvers"
BEL_urban_projects_capital2_desc:0 "En tant que l'un des principaux ports européens, Anvers est idéal pour développer une industrie tournée vers l'exportation."
BEL_revise_air_doctrine:0 "Réviser la doctrine aérienne"
BEL_revise_air_doctrine_desc:0 "Au milieu des années 1930, le besoin d'une nouvelle doctrine aérienne semblait urgent. L'armée de l'air belge a étudié les tactiques françaises mais a surtout acheté des licences anglaises après l'échec des prototypes belges."
BEL_van_overstraeten_aa_guns:0 "Se concentrer sur l'artillerie antiaérienne"
BEL_van_overstraeten_aa_guns_desc:0 "Raoul van Overstraeten, un des théoriciens militaires belges les plus influents, était convaincu que la Belgique était trop petite pour avoir une force aérienne. Il préférait que nos alliés défendent l'espace aérien belge, tandis que l'armée se concentrerait sur l'artillerie antiaérienne."
BEL_aa_guns_expertise:0 "Expertise en artillerie antiaérienne"
BEL_aa_guns_expertise_desc:0 "Pour garantir notre sécurité face aux menaces aériennes, nous devons produire plus de batteries et protéger nos infrastructures vitales avec des structures de défense aérienne."
BEL_Renard_fighters:0 "Avions légers Renard"
BEL_Renard_fighters_desc:0 "Pilote courageux pendant la Grande Guerre, Alfred Renard est devenu un des constructeurs d'avions belges les plus importants. Historiquement, ses avions militaires ont été des échecs à cause des crashes de prototypes, mais avec quelques corrections, ils pourraient devenir les meilleurs chasseurs belges."
BEL_Foreign_aviation_studies:0 "Étudier les tactiques étrangères"
BEL_Foreign_aviation_studies_desc:0 "En étudiant et en licenciant des designs étrangers, nous pouvons identifier les défauts de nos avions et améliorer leur qualité."
BEL_experimental_weaponry:0 "Soutenir les prototypes de FN"
BEL_experimental_weaponry_desc:0 "Des inventions ingénieuses et des percées technologiques radicales nous permettent de poursuivre des technologies militaires plus exotiques et efficaces. FN Herstal est depuis des décennies un pionnier des armes d'infanterie, et cette tradition doit continuer pour garantir notre victoire."
BEL_establish_radio_stations:0 "Améliorer les stations radio"
BEL_establish_radio_stations_desc:0 "Les stations de détection et de radioguidage profitent à la défense nationale. Créons des systèmes radar pour mieux protéger notre pays."
BEL_support_innovation:0 "Soutenir les innovations"
BEL_support_innovation_desc:0 "Les batailles se gagnent grâce aux avantages technologiques. Une meilleure technologie signifie plus de victoires, et une meilleure technologie provient de laboratoires de recherche supérieurs."
BEL_clear_lands_congo:0 "Dégager de nouvelles terres"
BEL_clear_lands_congo_desc:0 "Rénover le port de Banana pour améliorer nos capacités logistiques."
BEL_invest_in_nuclear_program:0 "Recherche nucléaire"
BEL_invest_in_nuclear_program_desc:0 "En nous appuyant sur les théories de la relativité d'Albert Einstein et la désintégration radioactive de l'uranium-238, nous avons découvert que fissionner l'atome génère d'énormes quantités d'énergie. Il faut étudier la théorie de la réaction en chaîne et extraire de grandes quantités d'uranium dans nos mines de Kolwezi et Shinkolobwe."
BEL_further_nuclear_research:0 "Exploiter et exporter l'uranium"
BEL_further_nuclear_research_desc:0 "Grâce à notre nouvelle compréhension de l'atome et à l'augmentation de la production d'uranium, nous pouvons non seulement étudier son potentiel, mais aussi exporter une partie de ce minerai à nos principaux alliés pour assurer la victoire finale de notre coalition."
BEL_start_rocket_program:0 "Lancer un programme de fusées"
BEL_start_rocket_program_desc:0 "La fuséologie est une science nouvelle avec de nombreuses possibilités. Son exploration à des fins militaires peut porter ses fruits. Pour réussir, nous devons recruter l'expert le plus compétent. Karel Jan Bossart travaille actuellement aux États-Unis ; espérons qu'il accepte de revenir dans son pays pour devenir l'ingénieur principal de ce fascinant projet."
BEL_stay_neutral:0 "Politique des Mains Libres"
BEL_stay_neutral_desc:0 "Nous ne devons pas provoquer Hitler ; même si s’allier aux Alliés serait plus sûr, cela augmenterait le risque d’un nouveau plan Schlieffen. Cette politique neutre est appelée 'Mains Libres' / 'Vrij Handen' (littéralement : mains libres)."
BEL_deterrence:0 "Dissuasion"
BEL_deterrence_desc:0 "Les menaces croissantes du fascisme européen montrent clairement que la simple déclaration de neutralité ne suffit pas. Nous devons nous armer pour défendre notre indépendance."
BEL_democratic_influence:0 "Union politique contre le fascisme"
BEL_democratic_influence_desc:0 "Notre nation est démocratique et ne doit pas se laisser influencer par les nouvelles idées du nationalisme ou du communisme."
BEL_begin_rearmement:0 "Suivre le rapport de la Commission de Défense"
BEL_begin_rearmement_desc:0 "La commission de défense a publié un rapport détaillé pour évaluer l'effort nécessaire afin d'adapter notre armée aux tensions politiques croissantes. Ce rapport devrait servir de base à un ambitieux plan de réarmement."
BEL_accept_van_den_den_bergen_plan:0 "Accepter le plan de van den Bergen"
BEL_accept_van_den_den_bergen_plan_desc:0 "Le général van den Bergen a proposé un plan ambitieux visant à augmenter le nombre de conscrits prêts à être mobilisés complètement. Bien que ce plan permette à l'armée de se préparer rapidement au combat, la mobilisation d'un si grand nombre de personnes ralentirait probablement notre économie, encore fragile après le choc de la grande dépression."
BEL_lessons_from_wwi:0 "Organiser des manœuvres"
BEL_lessons_from_wwi_desc:0 "Il est temps de mettre en pratique les théories du plan de modernisation en les testant lors de manœuvres à grande échelle."
BEL_light_tank_destroyers:0 "Programme de chasseur de chars léger"
BEL_light_tank_destroyers_desc:0 "Nous possédons l'un des meilleurs canons antichars au monde, le FRC 47 mm. Mais il peut être contourné par des véhicules rapides. Pour contrer cette menace, nous devons trouver un moyen de déplacer nos canons antichars rapidement. Peut-être pourrions-nous monter ces canons sur un châssis léger blindé sur chenilles pour créer des chasseurs de chars légers et portables. Ils pourraient tirer parti du terrain accidenté des Ardennes et utiliser des tactiques d'embuscade contre les colonnes de chars ennemis."
BEL_restore_the_auto_canon_unit:0 "Restaurer l'unité Auto-Canon"
BEL_restore_the_auto_canon_unit_desc:0 "Durant la Première Guerre mondiale, des voitures blindées Minerva furent envoyées en Russie pour soutenir les combats contre l'armée austro-hongroise, exploitant les brèches et appuyant l'infanterie. Alors que nous motorisons nos unités, nous pourrions réintroduire les voitures blindées dans nos divisions."
BEL_motorised_support:0 "Soutien motorisé"
BEL_motorised_support_desc:0 "Pour mettre en place un système permettant le déploiement le plus rapide possible de nos troupes sur les lignes de front, nous devons motoriser une grande partie des unités de soutien de nos divisions d'infanterie."
BEL_military_research_interest:0 "Développer le Bureau de Recherche Militaire"
BEL_military_research_interest_desc:0 "Bien que les victoires récentes aient permis la capture de capacités industrielles étrangères et d’équipements militaires, nous devons développer le Bureau de Recherche Militaire, la section du ministère de la Défense dédiée à l'innovation militaire, afin que toutes nos troupes soient équipées du matériel le plus adapté."
BEL_doctrines_of_the_present:0 "Doctrines du présent"
BEL_doctrines_of_the_present_desc:0 "Analyser ce qui a fonctionné ou non dans le passé est un bon début, mais nous devons également observer les guerres récentes et en tirer des leçons."
BEL_mechanized_infantry_investments:0 "Investissements dans l'infanterie mécanisée"
BEL_mechanized_infantry_investments_desc:0 "La mécanisation de notre infanterie est une étape essentielle dans le nouveau monde de la guerre mobile."
BEL_equipement_modernization:0 "Modernisation de l'équipement"
BEL_equipement_modernization_desc:0 "Les investissements récents dans notre effort de guerre ont fait naître la fierté de notre histoire militaire, et désormais les jeunes hommes en âge de servir affluent vers les centres de volontariat."
BEL_prototype_weapons:0 "Prototypes d'artillerie FRC"
BEL_prototype_weapons_desc:0 "Pour garantir une puissance de feu suffisante, il faut développer de meilleurs modèles d'artillerie. En tant que seul producteur d'armes belge, FRC sera logiquement à la pointe de ce programme."
BEL_modernize_tanks:0 "Moderniser les chars"
BEL_modernize_tanks_desc:0 "Nos chars sont obsolètes. Nous devons concevoir de nouveaux modèles pour faire face aux évolutions militaires de notre époque."
BEL_continue_the_tank_destroyer_program:0 "Poursuivre le programme de chasseurs de chars"
BEL_continue_the_tank_destroyer_program_desc:0 "Le programme de chasseurs de chars légers a été un succès, mais il y a toujours place à l'amélioration. Nous pouvons utiliser de nouvelles méthodes pour les rendre moins coûteux à produire, économisant ainsi des ressources pour d'autres projets."
BEL_daring_paratroopers:0 "Paratroopers audacieux"
BEL_daring_paratroopers_desc:0 "Les évolutions militaires récentes montrent la nécessité d'une infanterie spécialisée. Avec l'importance croissante de l'aviation dans la pensée militaire moderne, il est peut-être temps pour [BEL.GetNameDef] de disposer d'un corps de parachutistes. Autrefois, il pleuvait des cordes et des hallebardes en Belgique, désormais il pleuvrait des soldats !"
BEL_specialized_divisions:0 "Divisions spécialisées"
BEL_specialized_divisions_desc:0 "Les évolutions militaires récentes montrent la nécessité d'une infanterie spécialisée, dédiée à certains types de terrains."
BEL_aerial_support:0 "Soutien aérien aux troupes au sol"
BEL_aerial_support_desc:0 "Développer de nouveaux avions capables de soutenir nos troupes donnera à nos forces un avantage au combat."
BEL_rule_the_sea_through_the_sky:0 "Dominer la mer par les airs"
BEL_rule_the_sea_through_the_sky_desc:0 "Pour contrôler la mer, la puissance aérienne est cruciale, même si d'autres préconisent la supériorité des cuirassés. Ces dernières années, plusieurs théoriciens ont plaidé pour une aviation forte afin de couler les navires ennemis."
BEL_further_investments_fokker_company:0 "Augmenter les investissements dans Fokker"
BEL_further_investments_fokker_company_desc:0 "Des investissements supplémentaires dans les efforts d'Anthony Fokker amélioreront considérablement notre capacité à faire la guerre dans les airs."
BEL_interest_in_rocket_technology:0 "Intérêt pour les fusées"
BEL_interest_in_rocket_technology_desc:0 "Les investissements récents dans notre aviation ont plongé notre pays dans une sorte de frénésie pour les fusées. Nous devrions en tirer parti."
BEL_recreate_the_navy:0 "Recréer la marine belge"
BEL_recreate_the_navy_desc:0 "La marine belge n'est même plus l'ombre de ce qu'elle était... ce n'est pas surprenant, puisqu'elle a été dissoute en 1927 ! Alors que les chantiers navals seront sollicités pour produire les premiers navires militaires belges depuis des décennies, des bateaux de pêche convertis équipés de quelques canons de calibres variés permettront de patrouiller ou de poser des mines dès que possible."
BEL_submarine_operations:0 "Opérations sous-marines"
BEL_submarine_operations_desc:0 "Nous devons concentrer nos efforts navals sur une force capable d'affamer nos ennemis en détruisant leurs convois."
BEL_reinvigorate_naval_prowess_of_old:0 "Développer la marine"
BEL_reinvigorate_naval_prowess_of_old_desc:0 "Notre marine manque cruellement de puissance de feu en termes de navires lourds. La bataille en mer peut se gagner de nombreuses façons, mais les forteresses navales de cuirassés et de croiseurs de bataille sont les moyens les plus efficaces et glorieux. Nous devons devenir une force maritime forte et redoutable."
BEL_submarine_improvements:0 "Une marine invisible"
BEL_submarine_improvements_desc:0 "Pour réussir nos nouvelles stratégies, nous devons nous assurer de posséder les sous-marins les plus modernes au monde."
BEL_stealth_upgrades:0 "Améliorations des snorkels"
BEL_stealth_upgrades_desc:0 "Les snorkels nous permettront d'opérer nos sous-marins pendant de longues périodes tout en réduisant les risques de détection, assurant notre avantage de première frappe."
BEL_expand_the_navy:0 "Étendre la marine"
BEL_expand_the_navy_desc:0 "Les cuirassés et les porte-avions sont la voie à suivre pour défendre notre empire étendu contre les menaces extérieures."
BEL_cruisers_and_destroyers:0 "Concentrer sur les petits navires"
BEL_cruisers_and_destroyers_desc:0 "Les gros navires sont un gaspillage de ressources précieuses - pourquoi les construire alors que nous pouvons mieux défendre nos voies maritimes avec de nombreux petits navires ?"
BEL_naval_mining:0 "Mines navales"
BEL_naval_mining_desc:0 "Mines navales"
BEL_naval_warfare_desc:0 "Les mines nous permettent de gêner l'ennemi sans engager le combat direct, ce qui est un avantage considérable compte tenu de notre situation stratégique."
BEL_naval_artillery:0 "Artillerie navale"
BEL_naval_artillery_desc:0 "Pour qu'un navire de surface soit efficace, la puissance de feu est cruciale."
BEL_dutch_marines:0 "Marines [BEL.GetAdjective]"
BEL_dutch_marines_desc:0 "Nous avons besoin de divisions de marines spéciales pour être les plus efficaces lors d'une invasion navale afin de prendre possession des îles."
BEL_interest_in_carriers:0 "Ambition porte-avions"
BEL_interest_in_carriers_desc:0 "Il est temps de projeter la marine [BEL.GetAdjective] dans le futur ! La couverture aérienne est obligatoire dans les opérations navales modernes. La nouvelle menace d'un conflit mondial signifie que le pouvoir doit être projeté dans le monde entier... et [BEL.GetNameDef] doit être prêt à prendre sa part."
BEL_join_britain_alliance:0 "Rejoindre les Alliés"
BEL_join_britain_alliance_desc:0 "Il y a deux fronts en Europe : ceux qui souhaitent protéger la liberté et ceux qui veulent la détruire. Il est temps de se rapprocher de [ENG.GetNameDef] et d’abandonner la neutralité. Pour les Alliés !"
BEL_benelux_faction:0 "Former le Benelux"
BEL_benelux_faction_desc:0 "Au lieu de rester neutres ou de rejoindre [FRA.GetNameDef] et [ENG.GetNameDef], un chemin qui nous entraînerait sûrement dans une guerre contre [GER.GetNameDef], nous devrions coopérer avec nos voisins les plus proches. C’est pourquoi, après la mise en place de l’Union douanière Benelux, un plan de défense commun doit être établi pour garantir l’indépendance de nos trois lions face à l’aigle et au coq."
BEL_invite_bel_lux:0 "Inviter [HOL.GetNameDef] et [LUX.GetNameDef]"
BEL_invite_bel_lux_desc:0 "Nous devons ajouter le 'Ne' et le 'Lux' pour former le Benelux."
BEL_communist_youth:0 "Mouvement révolutionnaire des jeunes bilingues"
BEL_communist_youth_desc:0 "L’internationalisme commence parfois dans son propre pays. Pour que tous les futurs travailleurs [BEL.GetAdjective] se comprennent, nous devons rendre le bilinguisme obligatoire, même si cela choque une partie de la population francophone."
BEL_armed_neutrality:0 "Neutralité armée"
BEL_armed_neutrality_desc:0 "Pour préserver notre neutralité en ces temps hostiles, nous devons montrer que nous ne tomberons pas sans combattre."
BEL_british_ship_designs:0 "Plans navals [ENG.GetAdjective]"
BEL_british_ship_designs_desc:0 "Les [ENG.GetAdjective] nous ont fourni des plans de navires pour augmenter notre production et protéger plus efficacement notre territoire maritime."
BEL_trick_german_scum:0 "Montrer notre neutralité"
BEL_trick_german_scum_desc:0 "Nous montrerons aux [GER.GetAdjective]s que nous comptons nous défendre contre toute menace extérieure, pas seulement la leur, en construisant quelques forts côtiers."
BEL_pillarized_society:0 "Société pilierisée"
BEL_pillarized_society_desc:0 "La pilierisation est l’un des facteurs essentiels de la politique [ROOT.GetAdjective]. Elle se caractérise par une séparation de la société en « bulles politiques », chaque parti puissant ayant son fonds commun, syndicat et autres organisations. Ce système tend à solidifier les votes d’élection en élection et encourage le retour des mêmes coalitions politiques."
BEL_union_agreements:0 "Accords syndicaux"
BEL_union_agreements_desc:0 "Les discussions récentes avec les syndicats ont abouti à un résultat satisfaisant."
BEL_reserve_mobilization:0 "Mobilisation de la réserve"
BEL_reserve_mobilization_desc:0 "Nous pouvons unir une nouvelle génération dans l’armée en les galvanisant avec des histoires de notre héroïque résistance lors de la Grande Guerre contre les Allemands."
BEL_tank_destroyers_expertise:0 "Expertise en chasseurs de chars"
BEL_tank_destroyers_expertise_desc:0 "L’utilisation de méthodes nouvelles et améliorées nous permet de construire nos chasseurs de chars à moindre coût."
BEL_communist_police:0 "Police communiste"
BEL_communist_police_desc:0 "Ces unités spéciales de police contreront la dissidence parmi nos citoyens nouvellement acquis et rendront nos troupes plus disposées à combattre pour la Patrie !"
BEL_aerial_interest:0 "Intérêt aérien"
BEL_aerial_interest_desc:0 "Notre nouveau corps de parachutistes et les investissements renouvelés dans la société Fokker ont créé un intérêt public pour les développements aériens."
BEL_armed_neutrality_idea:0 "Neutralité armée"
BEL_coalition_vs_fascism:0 "Union contre le fascisme"
BEL_why_we_fight:0 "Défense de la liberté"
BEL_why_we_fight_desc:0 "Pour le Roi, pour la Loi, pour la Liberté !"
BEL_exiled_intelligence_service:0 "Service de renseignement en exil"
BEL_exiled_intelligence_service_desc:0 "Le combat pour la libération de la patrie continue dans l’ombre."
BEL_exiled_evacuated_industries:0 "Industries évacuées en exil"
BEL_exiled_evacuated_industries_desc:0 "Nous pouvons utiliser l’industrie que nous avons réussi à évacuer lors de notre capitulation pour continuer le combat."
BEL_launch_V_campaign:0 "Lancer la campagne V"
BEL_launch_V_campaign_desc:0 "Alors que nous sommes en exil, nous devons continuer à informer les [BEL.GetAdjective]s et les inciter à résister à l’occupation étrangère. Pour créer un symbole commun, Robert de Laveleye a imaginé utiliser la lettre V, car c’est la première lettre de Victoire en français et de Vrijheid (Liberté) en néerlandais."
BEL_armed_neutrality_idea_desc:0 "Bien que notre pays se soit déclaré neutre, une armée permanente est primordiale pour protéger cette neutralité."
BEL_british_ship_designs_idea:0 "Plans navals [ENG.GetAdjective]"
BEL_british_ship_designs_idea_desc:0 "Les [ENG.GetAdjective] nous ont donné certains de leurs plans pour produire plus efficacement des destroyers."
BEL_Antwerp_Oil_Industry:0 "Raffinage à Anvers"
BEL_Antwerp_Oil_Industry_desc:0 "Anvers est déjà un port important pour le secteur chimique. Avec les menaces croissantes sur le commerce international, nous devrions réaffecter une partie de ces installations pour transformer notre charbon condruzien en pétrole."
BEL_form_air_guard_of_the_territory:0 "Former la 'Garde anti-aérienne territoriale'"
BEL_form_air_guard_of_the_territory_desc:0 "La 'Garde anti-aérienne territoriale' (Garde Territoriale Antiaérienne, Territoriale Wacht voor Luchtafweer) a été fondée en 1937 par le ministre de la Défense Denis pour protéger les zones stratégiques contre les attaques aériennes. Indépendante de l’armée, elle disposait d’un budget d’un milliard de francs. Comme FRC avait des problèmes de production de canons AA, elle a été équipée de canons Bofors de 40 mm et de canons Vickers AA de 75 et 94 mm."
BEL_belgian_navy_in_exile:0 "Créer la marine [BEL.GetAdjective] en exil"
BEL_belgian_navy_in_exile_desc:0 "La Belgique peut être tombée, mais la guerre n’est pas encore perdue. Nous devons recréer une marine pour continuer le combat et préparer la libération de notre pays."
BEL_air_force_congo:0 "Ailes aériennes de la Force Publique"
BEL_air_force_congo_desc:0 "La Belgique peut être sous occupation étrangère, mais la guerre continue. Comme la bataille pour la Belgique nous l’a montré, la puissance aérienne est essentielle et nous ne manquerons pas les développements futurs."
BEL_fighter_license:0 "Acquérir une licence de chasseurs"
BEL_fighter_license_desc:0 "Comme nos designs de chasseurs ne semblent pas assez fiables pour concurrencer d’autres appareils, nous devons contacter les grandes puissances pour obtenir un accord de licence permettant la construction d’un chasseur moderne pour l’armée de l’air belge."
BEL_SABCAs_bombers:0 "Bombardiers sous licence SABCA"
BEL_SABCAs_bombers_desc:0 "Dans ses ateliers, SABCA peut construire des avions modernes puissants et grands. Mais un élément clé manque : les plans militaires. Si nous pouvons convaincre une des grandes puissances de nous concéder une licence, nous pourrions créer notre propre force de bombardiers."
BEL_SABCAs_CAS:0 "Le SABCA S.47"
BEL_SABCAs_CAS_desc:0 "Le SABCA S.47 est un avion de reconnaissance/assistance aérienne rapprochée conçu par le constructeur [ITA.GetAdjective] Caproni, sous le contrôle strict de l’ingénieur en chef de SABCA."
BEL_license_production:0 "Plans étrangers"
BEL_license_production_desc:0 "Comme nos propres designs n’offrent pas beaucoup de potentiel, nous devons chercher ailleurs pour obtenir les plans d’avions militaires modernes."
BEL_multipurpose_bombers:0 "Bombardiers polyvalents"
BEL_multipurpose_bombers_desc:0 "Comme nous manquons d’avions militaires lourds (hors transports), la manière la plus simple et économique de remplir toutes les missions assignées à de tels appareils serait d’avoir un seul type d’avion lourd. Ce nouvel avion devrait effectuer toutes les missions, de la reconnaissance au bombardement."
BEL_king_reaction:0 "Déclarer l’état d’urgence"
BEL_royal_reaction:0 "Réaction Royale"
BEL_royal_reaction_desc:0 "Face à la menace du radicalisme politique et à la difficulté croissante de maintenir l'ordre, le roi a décidé de déclarer la loi martiale. En cette heure fatidique, le roi et le ministre de la Défense ont déployé l'armée pour stabiliser le pays. Dans ce processus, ils ont effectivement suspendu la constitution."

BEL_purge_radical_opposition:0 "Éliminer l'Opposition Radical"
BEL_purge_radical_opposition_desc:0 "Pour combattre les communistes et les fascistes, des répressions massives doivent être organisées. Dans ce processus, l'autorité civile est réduite. Le Premier ministre est remplacé par un monarchiste loyal qui ne remettrait pas en question les actions exceptionnelles mais nécessaires ordonnées par le roi, Henri Denis, et Auguste Lippens."

BEL_reduce_parlementarism:0 "Réduire le Parlementarisme"
BEL_reduce_parlementarism_desc:0 "Alors que le pouvoir est centralisé entre les mains de l'exécutif, le dernier contrepoids reste le parlement. Même si supprimer cette institution entièrement n'est pas possible à long terme, son affaiblissement par rapport à la situation avant la crise politique est clair. Tant que des nuages sont visibles à l'horizon, le roi, vigilant gardien, protégera [BEL.GetNameDef] contre les menaces extérieures."

BEL_restore_constitution:0 "Restaurer la Constitution"
BEL_restore_constitution_desc:0 "Après une série de troubles comparables au Déluge de Noé, la colombe de la paix est enfin revenue dans l'arche de la patrie. Bien que des nuages dérivent à l'horizon, il est peut-être temps de s'effacer et de restaurer la constitution, l'arc-en-ciel entre le gouvernement et les citoyens. Avec le rétablissement de l'état de droit, le pouvoir a été rendu aux mains d'un gouvernement civil."

BEL_aa_expertise:0 "Expertise en Fabrication de Canons AA"

BEL_national_union:0 "Union Politique en Temps de Guerre"
BEL_national_union_desc:0 "En raison de la guerre, un nouveau gouvernement de coalition a été établi pour unir les partis démocratiques contre la menace étrangère."

BEL_peacetime_national_union:0 "Gouvernement d'Union Nationale"
BEL_peacetime_national_union_desc:0 "Notre gouvernement unit actuellement tous les partis démocratiques dans une large coalition, réduisant les disputes politiques."

BEL_congo_uranium:0 "Uranium du Katanga"
BEL_congo_uranium_desc:0 "L'uraninite/pitchblende de la mine de Shinkolobwe au Katanga est le minerai d'uranium le plus riche du monde. Nous pourrions l'exporter vers nos alliés pour les aider à gagner la guerre.\n§RCe bonus sera supprimé si une faction rivale prend et maintient la région de Léopoldville au Congo.§!"

BEL_volunteer_corps:0 "Volontaires [ROOT.GetAdjective]"
BEL_church_support:0 "Soutien de l'Église"
BEL_benelux_research_cooperation:0 "Coopération Scientifique Benelux"
BEL_efficient_license_production:0 "Production Efficace de Licences"
BEL_support_pcf_politics:0 "Soutien Communiste Belge"
BEL_support_pcf_diplomacy:0 "Focus Diplomatique Belge"
BEL_repair_damages:0 "Réparations des Dommages"
BEL_fascism_banned:0 "Fascisme Interdit"
BEL_nationalism:0 "Nationalisme"
BEL_french_advisors:0 "Conseillers [FRA.GetAdjective]"
BEL_monarchist_repression:0 "Répression Monarchiste"
BEL_extended_royal_powers:0 "Pouvoirs Royaux Étendus"
BEL_purge_the_army:0 "Éliminer l'Armée"
BEL_recovery_from_the_great_depression1:0 "Reprise de la Grande Dépression"
BEL_recovery_from_the_great_depression1_desc:0 "Bien que la situation économique s'améliore, l'économie souffre encore des conséquences de la Grande Dépression."
BEL_digging_of_the_albert_canal:0 "Creusement du Canal Albert"
BEL_digging_of_the_albert_canal_desc:0 "Planifié après la Grande Guerre et commencé en 1930, le Canal Albert est un projet coûteux mais essentiel qui reliera les zones industrielles de Wallonie au port d'Anvers."

BEL_van_den_bergen_plan:0 "Plan de Conscription de Van den Bergen"
BEL_military_linguistical_weaknesses:0 "Faiblesses Linguistiques de l'Armée"
BEL_military_linguistical_weaknesses_desc:0 "Même après la division linguistique de l'armée, des faiblesses étaient encore apparentes. Il y avait un manque chronique d'officiers flamands, et les racines locales de chaque division rendaient parfois difficile l'opération hors de leurs zones d'entraînement habituelles."

BEL_buy_back_the_railway_gun:0 "Racheter le Canon Ferroviaire"
BEL_buy_back_the_railway_gun_desc:0 "En 1924, nous avons vendu notre canon ferroviaire à la France. Il est peut-être temps de le racheter."

BEL_supplementary_payments:0 "Paiements Supplémentaires"
belgium.1.t:0 "[From.GetNameDefCap] Veut que Nous Rejoignions le Benelux"
belgium.1.d:0 "Une société nationale de diffusion de [From.GetNameDef] a officiellement annoncé il y a quelques heures que son gouvernement cherche à renforcer les liens économiques et commerciaux entre nos deux pays. « L'Union douanière du Benelux est un outil puissant dans le commerce et l'échange scientifique, mais elle ne peut protéger la population locale contre toute source d'agression si celle-ci survenait à nos frontières. »\n\nLe discours de [From.GetLeader] suscite de vives inquiétudes quant au statut de la région du Benelux, alors que les tensions européennes montent et que le climat politique change défavorablement pour les pays démocratiques.\n\nRejoindre une alliance nous aidera sûrement à préserver notre statut de nation indépendante, mais pourrait aliéner certains de nos voisins.\n\nDevons-nous entrer dans l'alliance formelle avec [From.GetNameDef] ?"
belgium.1.a:0 "C'est le seul moyen de préserver notre indépendance."
belgium.1.b:0 "Nous avons déjà nos alliés."
belgium.2.t:0 "[From.GetNameDefCap] Refuse"
belgium.2.d:0 "Malgré nos missions diplomatiques constantes, nos liens économiques et la menace croissante du révisionnisme en Europe, [From.GetLeader] a annoncé ouvertement que [From.GetNameDef] n'est pas disposé à étendre l'Union douanière du Benelux en une « alliance militariste et belliqueuse » et souhaite préserver la paix et la prospérité dans tout le pays.\n\nAvec la montée des tensions et le refus des alliés potentiels les plus proches, [ROOT.GetNameDef] se retrouve sévèrement affaibli, face aux nuages sombres qui s'amoncellent sur l'Europe."
belgium.2.a:0 "Nous avons besoin d'eux, d'une manière ou d'une autre."
belgium.3.t:0 "[From.GetNameDefCap] Accepte"
belgium.3.d:0 "La réponse du gouvernement [From.GetAdjective] était attendue avec impatience par la majorité de la direction du pays. Un télégramme récent reçu à Bruxelles sera diffusé ce soir à la radio et à la télévision, annonçant que la nouvelle alliance militaire du Benelux sera élargie avec un nouveau membre : [From.GetNameDef].\n\nLe protocole de coopération mutuelle sera signé la semaine prochaine par les délégations des deux nations dans notre capitale. Dans le cadre de cet accord, l'état-major de [ROOT.GetNameDef] recevra un soutien complet et une coopération avec son homologue de [From.GetNameDef].\n\n[Root.GetFactionName] devient plus fort jour après jour, et qui sait, peut-être que les Grandes Puissances respecteront cette fois notre neutralité ? Seul l'avenir le dira..."
belgium.3.a:0 "Excellente nouvelle !"
belgium.3.b:0 "Nous le ferons nous-mêmes alors !"
belgium.4.t:0 "[BEL.GetNameDefCap] Propose une Coopération Militaire"
belgium.4.d:0 "Le régime nouvellement établi à [BEL.GetNameDef] fait face à de nombreux obstacles pour assurer sa stabilité et son indépendance face aux regards indiscrets de ses voisins. La menace croissante de l'impérialisme et du revanchisme fera sûrement de [BEL.GetNameDef] une cible d'agression militaire, comme ce fut le cas lors de la Grande Guerre.\n\nBien que nous ne puissions pas soutenir directement leur régime sur leur territoire, nous pouvons nous assurer que nos innovations technologiques dans le développement de chars seront disponibles pour nos alliés [BEL.GetAdjective]. Notre coopération sera encore plus productive si nous concluons une alliance pour défendre ensemble notre peuple et notre pays !\n\nD'un autre côté, s'allier avec un pays comme [From.GetNameDef] signifiera étendre notre influence et notre présence en Europe, ce qui pourrait provoquer des instabilités régionales et peut-être même des représailles des Grandes Puissances."
belgium.4.a:0 "Partager des valeurs communes est ce qui nous unit !"
belgium.4.b:0 "Nos sphères d'influence ont peu en commun."
belgium.5.t:0 "[From.GetNameDefCap] Accepte Notre Pacte Proposé"
belgium.5.d:0 "Conscient de notre importance stratégique au cœur de l'Europe de l'Ouest, [From.GetNameDef] nous a fourni des plans de chars technologiquement supérieurs pour nous défendre contre les influences extérieures.\n\nUn accord supplémentaire a été signé le lendemain, par lequel nos deux pays se sont engagés à coopérer dans les domaines économique, scientifique et commercial.\n\nCette coopération étroite a déjà suscité une forte opposition de la part de [FRA.GetNameDef] et [ENG.GetNameDef]. Ils étaient néanmoins prêts à annoncer publiquement leur volonté de soutenir l'indépendance de [ROOT.GetNameDef], tant que ce pays s'engagerait à vivre en paix avec ses voisins et à ne pas menacer la stabilité en Europe de l'Ouest."
belgium.5.a:0 "Mettons-nous au travail avec ces nouveaux plans."
belgium.6.t:0 "[From.GetNameDefCap] Refuse Notre Pacte Proposé"
belgium.6.d:0 "La réponse officielle de [From.GetNameDef] est arrivée à Bruxelles à 4h du matin et, après beaucoup d'hésitation, a été remise directement à [ROOT.GetLeader] le lendemain matin. En forte opposition aux attentes de notre peuple, le gouvernement de [From.GetNameDef] a remis en question les motivations de [ROOT.GetNameDef] et de son gouvernement, affirmant que «... les chars sont principalement utilisés dans une guerre terrestre, et [From.GetNameDef] cherche seulement la paix pour le moment ».\n\nUn silence pesant a régné dans les bureaux du gouvernement alors que [ROOT.GetLeader] questionnait ouvertement les capacités de nos diplomates à mener correctement des missions diplomatiques. La décision du leader a été annoncée le lendemain, et elle fut..."
belgium.6.a:0 "Amenez-moi l'homme responsable."
belgium.6.b:0 "Tout le monde fait des erreurs."
belgium.8.t:0 "[From.GetNameDefCap] Veut Rejoindre [Root.GetFactionName]"
belgium.8.d:0 "Conscient que les institutions démocratiques et les libertés du peuple ne peuvent être protégées derrière la déclaration de neutralité, [From.GetNameDef] a officiellement demandé à notre gouvernement de rejoindre l'alliance militaire que représente notre pays.\n\nLa situation tendue sur le continent s'intensifie jour après jour, et la croyance commune dans la volonté du peuple, l'État laïque et la liberté d'expression a rapproché nos nations comme jamais auparavant ! S'unir tout en garantissant la liberté et la justice est une cause noble qui mérite d'être défendue.\n\nD'un autre côté, nos vétérans de la Grande Guerre se souviennent encore des combats féroces auxquels notre pays a été impliqué par nos alliés [ROOT.GetAdjective]. Quelle sera la réponse officielle de [ROOT.GetLeader] ?"
belgium.8.a:0 "Nous nous souvenons de nos liens de la Grande Guerre !"
belgium.8.b:0 "C'est trop dangereux."
belgium.9.t:0 "[From.GetNameDefCap] Accepte"
belgium.9.d:0 "En plus du traité de Londres de 1839 et de notre lutte commune lors de la Grande Guerre, [From.GetNameDef] a décidé d'étendre le mandat de protection de notre pays à un accord complet de coopération militaire et de partage de renseignements, dans lequel la défense de [ROOT.GetNameDef] jouera un rôle déterminant.\n\nLes premières unités [From.GetAdjective] devraient arriver dans quelques jours sur notre sol pour assister et renforcer la défense nationale, tandis que les attachés militaires [From.GetAdjective] sont en ligne pour discuter des mesures défensives avec nos généraux et commandants sur le terrain.\n\nDes avions [From.GetAdjective] sont dépêchés sur nos bases aériennes, et la flotte [From.GetAdjective] est prête à assurer la sécurité de nos eaux."
belgium.9.a:0 "Nous sommes ravis d'apprendre cela !"
belgium.10.t:0 "[From.GetNameDefCap] Refuse"
belgium.10.d:0 "Les efforts de nos politiciens, diplomates et commerçants semblent avoir peu ou pas d'effet. Alors que [From.GetNameDef] se réarme et se prépare pour le conflit militaire à venir, leurs ambassadeurs à Bruxelles ont déclaré que « c'est une affaire [From.GetAdjective] et uniquement [From.GetAdjective] ».\n\nLes diplomates [From.GetAdjective] ont également suggéré que nous démilitarisions la frontière incertaine et réduisions notre présence militaire dans la région au minimum pour « désamorcer la situation ».\n\nIls espèrent la paix, mais tout le monde sait que la guerre n'est qu'une question de temps, que quelqu'un le veuille ou non."
belgium.10.a:0 "Quoi ?! Qui croient-ils que nous sommes pour faire ça ?"
belgium.11.t:0 "Commencer le Processus de Dépilarisation"
belgium.11.d:0 "Nous n'avons pas besoin d'une société pillarisée en ces temps tumultueux. Briser les piliers est une étape essentielle pour renforcer notre État."
belgium.11.a:0 "Commencer le processus."
belgium.12.t:0 "Proposition Économique"
belgium.12.d:0 "[BEL.GetNameDefCap] a récemment proposé de nouveaux accords économiques qui nous permettraient de réduire les coûts de production."
belgium.12.a:0 "Accepter."
belgium.12.b:0 "Refuser."
belgium.13.t:0 "Le Gouvernement [From.GetAdjective] Accepte"
belgium.13.d:0 "[From.GetLeader] a accepté de coopérer avec nous pour réduire les coûts et nous aligner davantage les uns sur les autres."
belgium.13.a:0 "Ravi de l'entendre."
belgium.14.t:0 "Le Gouvernement [From.GetAdjective] Refuse"
belgium.14.d:0 "Malheureusement, [From.GetNameDef] a refusé notre offre, car cela « nierait leur souveraineté »."
belgium.14.a:0 "Un triste jour pour le Benelux."
belgium.15.t:0 "Tout le monde Accepte la Proposition Économique"
belgium.15.d:0 "Tout le Benelux a accepté notre proposition économique, et à l'avenir, nous ne ferons que nous rapprocher davantage."
belgium.15.a:0 "Excellente nouvelle !"
belgium.22.t:0 "Grève des Travailleurs après un Double Meurtre !"
belgium.22.d:0 "L'assassinat de deux militants socialistes à Anvers par des fascistes a déclenché la grève des dockers du port, rapidement suivie par le reste du pays. Le nombre de grévistes a atteint 500 000 travailleurs, et les industries du pays se sont arrêtées."
belgium.22.a:0 "Nous devrions faire des concessions."
belgium.22.b:0 "Laissez-les faire grève, tirez sur la foule si nécessaire."
belgium.23.t:0 "Paul van Zeeland Accusé de Détournement !"
belgium.23.d:0 "Gustaaf Sap, membre du Parlement, a accusé le Premier ministre de détournement lorsqu'il travaillait à la Banque Nationale. Même après le démenti de van Zeeland, ce scandale a mis une forte pression sur le gouvernement. La coalition tripartite devait encore encaisser le choc pour le moment."
belgium.23.a:0 "Il serait plus sûr de démissionner."
belgium.24.t:0 "L’Agitation Politique Menace le Gouvernement !"
belgium.24.d:0 "Alors que la menace rexiste semble moins importante, la rivalité politique a de nouveau augmenté. Le ministre des Finances, Henri de Man, a tenté d’unir les ailes gauche du Parti catholique et du Parti libéral avec le Parti socialiste pour instaurer un nouvel impôt touchant les classes supérieures. De Man a ensuite démissionné « pour raisons de santé ». Ce projet ébranle encore la majorité parlementaire. Une nouvelle coalition doit être formée sans les catholiques."
belgium.24.a:0 "Paul-Henri Spaak a plus de soutien que de Man."
belgium.25.t:0 "La Nomination d’un Médecin Nationaliste Flamand Provoque un Scandale !"
belgium.25.d:0 "Le roi Léopold III a refusé de signer la nomination du Dr Adriaan Martens. Martens avait collaboré avec les forces impériales allemandes pendant la Première Guerre mondiale en tant que chef de l’Académie flamande de médecine. La proposition aurait dû être approuvée d’abord par le conseil des ministres. Mais ce ne fut pas le cas et quelqu’un a mis son nom sur l’ordre royal. Le scandale a entraîné la démission de tout le gouvernement."
belgium.25.a:0 "Hubert Pierlot sera le prochain formateur."
belgium.26.t:0 "Le Roi et le Gouvernement Unis pour Défendre le Pays, Hubert Pierlot Confirmé comme Premier Ministre !"
belgium.26.d:0 "Pour faire face à la situation actuelle et assurer l’unité du pays, la coalition gouvernementale a été élargie pour inclure tous les partis démocratiques du pays, avec Hubert Pierlot comme Premier ministre."
belgium.26.a:0 "Nous espérons vivre un jour en paix."
belgium.27.t:0 "Le Roi et le Gouvernement Unis pour Défendre le Pays, Hubert Pierlot Confirmé comme Premier Ministre !"
belgium.27.d:0 "Pour faire face à l’agression soudaine de notre pays, la coalition gouvernementale a été élargie pour inclure tous les partis démocratiques, avec Hubert Pierlot comme Premier ministre."
belgium.27.a:0 "Nous espérons vivre un jour en paix."
belgium.28.t:0 "Ultimatum [BEL.GetAdjective]"
belgium.28.d:0 "Le gouvernement révolutionnaire [BEL.GetAdjective] veut imposer un gouvernement communiste dans notre pays."
belgium.28.a:0 "Accepter."
belgium.28.b:0 "Demander l’aide de [ENG.GetAdjective]."
belgium.28.c:0 "À la guerre !"
belgium.38.t:0 "La Campagne Électorale de 1936 Commence !"
belgium.38.d:0 "L’intensification des activités politiques montre clairement que les élections approchent. Le peuple [BEL.GetAdjective] sera appelé à voter fin mai. Dans les coulisses, certains partis négocient déjà un accord électoral pour constituer une nouvelle coalition après le jour du vote. Les nouveaux mouvements populistes comme Rex, Verdinaso et le VNV prendront-ils des voix aux partis traditionnels ?"
belgium.38.a:0 "Nous organiserons une grande réunion !"
belgium.39.t:0 "Union Démocratique Brisée !"
belgium.39.d:0 "En raison de l’évolution de la situation politique en [BEL.GetNameDef], l’union politique en faveur de la guerre a désormais disparu."
belgium.39.a:0 "D’accord."
belgium.40.t:0 "Joseph Jacquemotte Est Décédé !"
belgium.40.d:0 "Le Parti communiste belge a annoncé la mort soudaine de son dirigeant Joseph Jacquemotte. Il avait dirigé le parti pendant plus de 10 ans. Une troïka composée de Julien Lahaut, Xavier Relecom et Georges van den Boom dirigera prochainement le parti."
belgium.40.a:0 "Relecom est le choix de Moscou ; il dirigera le parti."
belgium.40.b:0 "Julien Lahaut devrait diriger les communistes en Belgique."
belgium.41.t:0 "La Démission des Représentants Rexist Force des Élections Partielles. Paul van Zeeland Affrontera Léon Degrelle !"
belgium.41.d:0 "Dans une manœuvre politique comparable à la démission des représentants du POB en 1935, les représentants rexistes de Bruxelles ont tous démissionné simultanément, forçant des élections partielles. Pour contrer la menace rexiste, notamment l’annonce de la candidature de Léon Degrelle, Paul van Zeeland a choisi de se présenter contre lui. Cela transforma la campagne électorale en duel. Tous les autres partis soutinrent le Premier ministre, y compris les communistes. Les rexistes appelèrent van Zeeland, ancien banquier et leader du parti catholique conservateur, un pantin des rouges."
belgium.41.a:0 "L’union fait la force - Eendracht maakt macht !"
belgium.41.b:0 "Pour un régime propre, votez Degrelle !"
belgium.41.c:0 "Une grande victoire contre le fascisme !"
belgium.42.t:0 "Les Terres Allemandes Volées en 1919."
belgium.42.d:0 "À la fin de la Grande Guerre, même la Belgique annexa une partie de notre territoire. Notre offensive prévue autour de la ligne Maginot sera une occasion parfaite de réviser un autre chapitre du diktat de Versailles."
belgium.42.a:0 "Ces terres aussi appartiennent à la Patrie !"
belgium.43.t:0 "Léon Degrelle Proclame l’Aube de l’Empire Thiois"
belgium.43.d:0 "\n\nDans un long discours louant la valeur de la nation et de son armée, Léon Degrelle annonça que, maintenant que l'union avec [HOL.GetNameDef] était achevée, une nouvelle ère commençait pour les Pays-Bas. Pour marquer ce changement, le pays sera désormais nommé Empire Thiois. Dans un appel à ressusciter l'esprit de l'empereur Charles Quint, il appela à la réunion de l'ancien "Cercle Bourguignon" au sein de cette nouvelle entité politique."
belgium.43.a:0 "Aujourd'hui, un peuple impérial s'est enfin réveillé !"

belgium.44.d:0 "\n\nDans un long discours louant la valeur de la nation et de son armée, Joris van Severen annonça que, maintenant que l'union avec [HOL.GetNameDef] était achevée, une nouvelle ère commençait pour les Pays-Bas. Le pays sera désormais nommé Dietsche Rijk pour montrer ce changement. Dans un appel à ressusciter l'unité des néerlandophones, il appela à la réunion de tous les héritiers des Pays-Bas afin de s'unir au sein de cette nouvelle entité politique."
belgium.44.a:0 "Aujourd'hui, après des siècles, nous sommes enfin vraiment unis !"

belgium.49.d:0 "Au début de l'invasion, les fascistes [BEL.GetAdjective] furent emprisonnés par le gouvernement par crainte qu'ils ne collaborent avec l'ennemi. Ces prisonniers politiques furent déplacés loin des forces ennemies, puis finalement envoyés en [FRA.GetNameDef] et gardés par des soldats [FRA.GetAdjective].\n\nLa nuit dernière, des soldats ivres frustrés par la capitulation de l'armée [BEL.GetAdjective] tuèrent leurs prisonniers, mettant fin à la vie de l'un des dirigeants fascistes flamands les plus importants : Joris van Severen."
belgium.49.a:0 "Une victime parmi des milliers dans cette guerre."

belgium.50.d:0 "Maintenant que la Flandre est de nouveau unie, il est temps de marquer notre conquête dans le paysage. Lille sera désormais appelée Rijsel, et Dunkerque retrouvera son nom d'origine : Duinkerke."
belgium.50.a:0 "Alles voor Vlaanderen, Vlaanderen voor Kristus."
belgium.50.b:0 "Ils ont oublié le flamand, c'est désespérant."

belgium.51.d:0 "Maintenant que le nord est à nouveau libre, les villes doivent récupérer leur nom correct. De Gaulle est né à Lille, pas à Ri-je-zelle."
belgium.51.a:0 "La France retrouve son unité indivisible."
belgium.52.t:0 "Les vieux Ft-17"
belgium.52.d:0 "Inutilisés depuis des années, 14 Renault Ft sont encore dans nos réserves. Restes des 49 chars achetés à la France après la Grande Guerre, tout le monde sait que ces vieilles machines sont obsolètes. Certains pensent qu'il serait judicieux de les donner à la gendarmerie nationale."
belgium.52.a:0 "Les donner à la gendarmerie pour le moment."

belgium.53.t:0 "Le stock d'artillerie"
belgium.53.d:0 "Les vieux canons de 75 mm attendent leur affectation dans nos arsenaux."
belgium.53.a:0 "Nous devons les affecter à nos divisions."

belgium.54.t:0 "Le stock d'artillerie - Les canons [SWE.GetAdjective]"
belgium.54.d:0 "Les canons de montagne Bofors achetés l'année dernière ont été ajoutés aux stocks des anciens canons de 75 mm et attendent désormais dans nos arsenaux."
belgium.54.a:0 "Nous devons les affecter à nos divisions."

belgium.55.t:0 "Démission de Hubert Pierlot"
belgium.55.d:0 "Fatigué des années de guerre, Hubert Pierlot a décidé de présenter sa démission. Achille van Acker dirigera un gouvernement presque identique."
belgium.55.a:0 "Une simple transition."

belgium.56.t:0 "Expédition d'uranium du Katanga arrêtée"
belgium.56.d:0 "En raison de la perte de contrôle du Katanga par [BEL.GetNameDef] ou de la rupture de notre collaboration avec le gouvernement [BEL.GetAdjective], nous n'avons plus accès au précieux uranium du Katanga. Cela rendra nos recherches sur les propriétés physiques de l'uranium et son potentiel prometteur beaucoup plus difficiles."
belgium.56.a:0 "Nous devons continuer sans lui."

belgium.57.t:0 "Expédition d'uranium du Katanga reçue"
belgium.57.d:0 "Grâce à notre collaboration avec le gouvernement [BEL.GetAdjective] contrôlant les mines d'uranium du Katanga, nous avons reçu un envoi de ce précieux minerai."
belgium.57.a:0 "Nous devons essayer d'exploiter son potentiel."

belgium.58.t:0 "Arrestation de Xavier Relecom"
belgium.58.d:0 "Le leader du Parti communiste belge a été arrêté par les forces [GER.GetAdjective] et mis en détention dans le fort de Breendonck."
belgium.58.a:0 "Une victime de plus du fascisme."

belgium.59.t:0 "Arrestation de Julien Lahaut"
belgium.59.d:0 "Le leader du Parti communiste belge a été arrêté par les forces [GER.GetAdjective] et mis en détention dans le fort de Breendonck."
belgium.59.a:0 "Une victime de plus du fascisme."

belgium.60.t:0 "Assassinat d'Alexandre Galopin"
belgium.60.d:0 "Le directeur de la 'Société Générale de Belgique', l'une des entreprises belges les plus importantes et ayant joué un rôle essentiel dans l'économie du pays sous occupation, a été assassiné aujourd'hui par les fascistes flamands du groupe 'De Vlag' (Le Drapeau). L'assassinat a été organisé par Robert Jan Verbelen, l'un de ses membres les plus influents."
belgium.60.a:0 "Une victime de plus du fascisme."

belgium.61.t:0 "Enfin la paix !"
belgium.61.d:0 "Avec le retour de la paix, le gouvernement d'union nationale peut se concentrer sur les défis futurs."
belgium.61.a:0 "Espérons que la paix perdurera."

belgium.62.t:0 "Léopold III se rend"
belgium.62.d:0 "En raison de la capitulation, le roi Léopold III s'est rendu aux forces ennemies et est maintenant prisonnier au Palais de Laeken, dans le nord de Bruxelles. Pendant ce temps, le gouvernement s'est distancié de la décision du roi et a décidé de continuer la guerre alors que le roi était incapable de régner."
belgium.62.a:0 "La nation doit être libérée."

belgium.63.t:0 "Charles devient prince-régent"
belgium.63.d:0 "Tant que le roi ne peut régner, son frère cadet Charles assume la fonction de prince-régent. Il a montré son engagement à collaborer avec le gouvernement pour rétablir l'ordre régulier des institutions."
belgium.63.a:0 "\"Je jure d'observer la Constitution...\""

belgium.64.t:0 "L'Union démocratique éclatée !"
belgium.64.d:0 "En raison de l'évolution de la situation politique en Belgique, l'union politique en faveur de la guerre a maintenant disparu."
belgium.64.a:0 "Un nouvel ordre nous attend !"
belgium.64.b:0 "La révolution ouvrière prévaut !"
belgium.64.c:0 "L'opposition radicale grandit de jour en jour."
belgium.65.t:0 "Les conservateurs obtiennent la majorité gouvernementale !"
belgium.65.d:0 "En raison de leur influence croissante dans les cercles politiques, le gouvernement socialiste est tombé, et les conservateurs dirigeront le prochain gouvernement wallon."
belgium.65.a:0 "Mahieu est prêtre et un vrai militant wallon."
belgium.65.b:0 "Nous devons nous appuyer sur un politicien expérimenté comme Pierlot."
belgium.66.t:0 "Autonomie coloniale limitée instaurée à [COG.GetNameDef]"
belgium.66.d:0 "Avec l'autonomie limitée à [COG.GetNameDef], le Gouverneur Général [COG.GetLeader] s'est vu accorder de nouveaux pouvoirs. Le DLC Ensemble pour la Victoire est recommandé."
belgium.66.a:0 "Maintenir [COG.GetNameDef] sous contrôle [BEL.GetAdjective]."
belgium.66.b:0 "Travail et Progrès !"
belgium.67.t:0 "[COG.GetNameDefCap] finance des avions de chasse"
belgium.67.d:0 "[COG.GetNameDefCap] a collecté des fonds pour financer la construction de chasseurs supplémentaires pour les pilotes [BEL.GetAdjective] en service dans la RAF."
belgium.67.a:0 "Unis, nous vaincrons !"
belgium.67.b:0 "Seuls unis, nous pouvons gagner !"
belgium.70.t:0 "Le début de la campagne V"
belgium.70.d:0 "Lors d'une émission de Radio Belgium, dans le segment dédié au peuple [BEL.GetAdjective], Victor de Laveleye a annoncé que toute personne mécontente de l'occupation devrait choisir la lettre V comme symbole de résistance. Cette lettre a été choisie car elle est la première lettre de Victoire et de Vrijheid (Liberté), symbole d'unité pour tous les [BEL.GetAdjective] libres. [ENG.GetNameDefCap] pourrait être intéressé à promouvoir des activités partisanes à travers l'Europe."
belgium.70.a:0 "V pour Victoire !"
belgium.70.b:0 "Nous écraserons les terroristes !"
belgium.70.c:0 "Cette guerre devient plus violente chaque jour."
belgium.71.t:0 "La campagne V soutient les activités partisanes"
belgium.71.d:0 "Avec la propagation du soutien à la campagne V, de plus en plus de peintures en V ont été vues dans nos villes. Ces symboles, visibles le matin et rapidement effacés, rappellent à la population que l'occupation n'est pas une fatalité et que nos ennemis seront vaincus."
belgium.71.a:0 "V pour Victoire !"
belgium.72.t:0 "[COG.GetNameDefCap] souhaite rejoindre le Komintern"
belgium.72.d:0 "[COG.GetNameDefCap] nous a approchés pour demander à rejoindre le Komintern."
belgium.72.a:0 "Encore un pays qui rejoint la révolution."
belgium.72.b:0 "Rejeter leur demande."
belgium.73.t:0 "[COG.GetNameDefCap] souhaite rejoindre l'Union des Peuples Africains"
belgium.73.d:0 "[COG.GetNameDefCap] nous a approchés pour demander à rejoindre l'Union des Peuples Africains."
belgium.73.a:0 "Encore un pays qui rejoint la révolution."
belgium.73.b:0 "Rejeter leur demande."
belgium.74.t:0 "[COG.GetNameDefCap] souhaite rejoindre le [Root.GetFactionName]"
belgium.74.d:0 "[COG.GetNameDefCap], désormais indépendant de [BEL.GetNameDef], cherche à rejoindre le [Root.GetFactionName] pour aider à établir un nouvel ordre mondial."
belgium.74.a:0 "Encore un pays qui rejoint la révolution."
belgium.74.b:0 "Rejeter leur demande."
belgium.74-2.a:0 "Encore un pays qui rejoint la révolution."
belgium.74-2.b:0 "Rejeter leur demande."
belgium.75.t:0 "Une alliance [BEL.GetAdjective] ?"
belgium.75.d:0 "[BEL.GetNameDefCap] a proposé de former une alliance militaire pour protéger la révolution de ses ennemis. Moscou est loin, et nous devons coordonner nos efforts entre nous."
belgium.75.a:0 "Bien sûr !"
belgium.75.b:0 "Rejeter leur demande."
belgium.76.t:0 "[BEL.GetNameDefCap] et [FRA.GetNameDef] cherchent une assistance militaire mutuelle"
belgium.76.d:0 "Les deux puissances communistes de l'ouest se sont rapprochées en annonçant la signature d'un traité d'assistance militaire mutuelle pour garantir leur sécurité. Signée hier matin à l'hôtel de ville de Bruxelles, cette nouvelle alliance est déjà appelée le 'Pacte de Bruxelles' et pourrait attirer d'autres puissances communistes qui ne veulent pas s'aligner sur la brutalité du régime [SOV.GetAdjective]."
belgium.76.a:0 "Nous serons les phares de la révolution."
belgium.76.b:0 "Encore une menace pour l'ordre établi."
belgium.76.c:0 "La diplomatie évolue aussi vite que la politique."
belgium.77.t:0 "Les négociations de défense [FRA.GetAdjective]-[BEL.GetAdjective] ont échoué"
belgium.77.d:0 "Alors que les diplomates [FRA.GetAdjective] et [BEL.GetAdjective] négociaient un accord de défense mutuelle, ces discussions semblent n'avoir abouti qu'à un grand malentendu. Les deux pays n'ont pas pu compromettre leurs positions et n'ont pas pu parvenir à un accord."
belgium.77.a:0 "Nous étions si proches d'un accord historique !"
belgium.77.b:0 "Cette alliance ne semble pas être une menace."
belgium.77.c:0 "Tant qu'ils se querellent entre eux..."
belgium.78.t:0 "[BEL.GetNameDefCap] influence notre politique"
belgium.78.d:0 "Nous avons récemment remarqué que [BEL.GetNameDef] essaie d'influencer notre population et certains de nos politiciens."
belgium.78.a:0 "Tout soutien est toujours le bienvenu."
belgium.78.b:0 "Comment osent-ils !"
belgium.79.t:0 "Le retour de Trotsky influence les communistes [BEL.GetAdjective]"
belgium.79.d:0 "Des débats ont agité le Parti communiste [Root.GetAdjective] depuis que Lev Trotsky est revenu au pouvoir en [SOV.GetNameDef]. Les trotskystes auparavant marginalisés voulaient remplacer les anciens dirigeants du parti, laissés sans soutien externe après la chute de Staline."
belgium.79.a:0 "Un communiste remplace un communiste, et alors ?"
belgium.79.b:0 "Nous n'avons d'autre choix que de faire notre auto-critique."
belgium.79.c:0 "Nous embrasserons le Daugisme, une variante du trotskysme."
belgium.79.e:0 "Nous n'abandonnerons pas la voie de Staline !"
belgium.80.t:0 "Le retour de Trotsky influence les communistes [ROOT.GetAdjective]"
belgium.81.t:0 "Staff De Clerq est décédé !"
belgium.81.d:0 "Les rapports confirment que Staff De Clerq est décédé la nuit dernière d'une crise cardiaque soudaine. L'homme est désormais pleuré par les nationalistes flamands, car il était le leader de la cause de l'indépendance flamande, prônant la création d'un État flamand fasciste. Il envisageait même un grand État néerlandais englobant la Flandre française, la Flandre et les Pays-Bas."
belgium.81.a:0 "De Leider est mort ! Il ne sera jamais oublié !"
belgium.81.b:0 "Bon débarras !"
belgium.84.t:0 "[COG.GetNameDefCap] influence notre politique"
belgium.84.d:0 "Nous avons récemment remarqué que [COG.GetNameDef] essaie d'influencer notre population et certains de nos politiciens."
belgium.84.a:0 "Tout soutien est toujours le bienvenu."
belgium.84.b:0 "Comment osent-ils !"
belgium.85.t:0 "Le destin du roi"
belgium.85.d:0 "Avec le pouvoir enfin entre nos mains, nous devons décider quoi faire du roi. Alors que certains fanatiques affirment qu'il doit subir le même sort que Nicolas II de Russie, d'autres disent qu'il doit être mis en prison pour la répression des émeutes de quelques années plus tôt. Un dernier groupe affirme qu'il est maintenant un homme sans pouvoir et devrait être autorisé à partir en exil."
belgium.85.a:0 "Préparez le peloton d'exécution !"
belgium.85.b:0 "Les oppresseurs du prolétariat doivent être emprisonnés !"
belgium.85.c:0 "Mettez cet insignifiant bouffon sur un bateau."
belgium.86.t:0 "Le retour de Trotsky influence les communistes flamands"
belgium.87.t:0 "La reddition de Léopold III"
belgium.87.d:0 "Avec la reddition de l'armée [BEL.GetAdjective], leur roi s'est rendu et est maintenant notre prisonnier."
belgium.87.a:0 "Un otage précieux."
belgium.88.t:0 "Le roi des Belges a été libéré"
belgium.88.d:0 "Léopold III, le roi des Belges, a été libéré par les forces ennemies et n'est plus notre invité."
belgium.88.a:0 "Nous avons d'autres préoccupations."
belgium.89.t:0 "Le retour du roi ?"
belgium.89.d:0 "Avec la libération de Léopold III, nous devons répondre à la question de son retour possible. Bien que le rappeler serait la solution la plus simple, son mariage avec sa maîtresse et son refus de suivre le gouvernement en exil ont causé des problèmes parmi la population, et beaucoup ne voulaient pas de son retour."
belgium.89.a:0 "Il restera à l'étranger pour l'instant."
belgium.89.b:0 "Organisez son retour."
belgium.90.t:0 "La monarchie restaurée !"
belgium.90.d:0 "À la suite du succès des forces anticommunistes, le roi des Belges, Léopold III, a été libéré de sa cellule et sera rétabli dans ses pouvoirs royaux. Pour ce faire correctement, il renouvellera son serment aux libertés et lois du peuple [BEL.GetAdjective] devant le nouveau parlement."
belgium.90.a:0 "Le Roi, la Loi, la Liberté ! Voor Vorst, voor Vrijheid en voor Recht !"
belgium.90.b:0 "Que Dieu protège la Belgique libre et son roi !"
belgium.91.t:0 "Le roi des Belges libéré et rétabli sur son trône !"
belgium.91.d:0 "À la suite du succès des forces anticommunistes, le roi des Belges, Léopold III, a été libéré de sa cellule qu'il décrivait dans une remarque privée comme 'la paille humide de la prison de St Leonard'. Il fit son entrée officielle joyeuse dans la capitale tandis que les rues étaient remplies pour voir le retour du monarque. Cependant, le défilé dans les rues fut bref, car on craignait que certains sympathisants communistes ne tentent de l'assassiner. Il fut ensuite acclamé par le nouveau parlement après avoir renouvelé son serment de protéger les lois du pays."
belgium.91.a:0 "Intéressant !"
belgium.91.b:0 "Le Roi, la Loi, la Liberté ! Voor Vorst, voor Vrijheid en voor Recht !"
belgium.92.t:0 "Le retour du roi !"
belgium.92.d:0 "Après l'anéantissement de la tyrannie communiste, la monarchie et la liberté de notre peuple ont été rétablies !"
belgium.92.a:0 "Le Roi, la Loi, la Liberté ! Voor Vorst, voor Vrijheid en voor Recht !"
belgium.92.b:0 "Que Dieu protège la Belgique libre et son roi !"
belgium.93.t:0 "Le roi des Belges revient dans son pays et reprend son trône !"
belgium.93.d:0 "\nÀ la suite du succès des forces anticommunistes, le roi des Belges, Léopold III, est revenu d’exil. Il fit son entrée triomphale, défilant dans des rues bondées de gens impatients de voir le monarque restauré. Toutefois, ce moment fut relativement bref, car les mesures de sécurité étaient très strictes. Alors qu’il défilait à cheval pour la première fois depuis la mort d’Albert Ier, il dut finalement le faire dans une voiture blindée, par crainte d’une tentative communiste sur sa vie. Il fut acclamé par le nouveau parlement et renouvela son serment de protéger les lois et libertés du peuple [BEL.GetAdjective]."
belgium.93.a:0 "Intéressant !"
belgium.93.b:0 "Le Roi, la Loi, la Liberté ! Voor Vorst, voor Vrijheid en voor Recht !"

belgium.94.t:0 "Le roi des Belges envoyé en exil !"
belgium.94.d:0 "Ayant échappé à la capture lorsque les révolutionnaires communistes prirent possession du palais royal, Léopold III, roi des Belges, reçut l’ordre du nouveau gouvernement d’abdiquer et de quitter la Belgique pour toujours. C’est un jour triste pour le roi, car cela marque son échec à contenir le communisme dans son pays, et il se pourrait bien que ce soit la dernière fois qu’il mette les pieds sur le sol [BEL.GetAdjective].\nPendant ce temps, les révolutionnaires ont pris leurs premières mesures pour lancer le processus de collectivisation."
belgium.94.a:0 "Un tyran de plus expulsé !"
belgium.94.b:0 "Un changement pour le pire, assurément."

belgium.95.t:0 "Le roi des Belges emprisonné par les révolutionnaires !"
belgium.95.d:0 "\nCapturé lors du coup d’État communiste, Léopold III, roi des Belges, a été envoyé en prison. Le comité révolutionnaire a déjà annoncé qu’il serait jugé pour oppression du prolétariat. Ce prisonnier de renom n’est qu’un parmi de nombreux détenus politiques arrêtés dans les heures suivant la prise de pouvoir communiste. Ceux qui le purent et furent prévenus à temps ont quitté le pays. Il semble que certains parlent déjà de former un comité de libération pour saper le nouveau régime communiste [BEL.GetAdjective]."
belgium.95.a:0 "Un tyran de plus paiera pour ses crimes !"
belgium.95.b:0 "Ces communistes sont vraiment inquiétants."

belgium.96.t:0 "Le roi des Belges exécuté par les révolutionnaires !"
belgium.96.d:0 "\nLes correspondants rapportant les événements en [BEL.GetNameDef] ont annoncé que le roi Léopold III avait été capturé par les révolutionnaires et exécuté sans délai. Cette nouvelle a choqué les traditionalistes. Le cardinal Van Roey, qui échappa de peu à la capture, a déjà déclaré que Léopold était un martyr de la foi chrétienne et qu’il plaiderait sa cause auprès du Pape pour obtenir sa béatification.\n\nCette exécution démontre la détermination des révolutionnaires, prêts, comme les bolcheviks avant eux, à assassiner pour atteindre leurs objectifs et réaliser leur utopie socialiste."
belgium.96.a:0 "Ce tyran n’opprimera plus le prolétariat !"
belgium.96.b:0 "Une preuve supplémentaire de la barbarie communiste."

belgium.97.t:0 "Les Pays-Bas méridionaux ouvrent des négociations pour une coopération défensive mutuelle"
belgium.97.d:0 "\nLes ministres des Affaires étrangères et de la Défense de [BEL.GetNameDef], [HOL.GetNameDef] et [LUX.GetNameDef] ont annoncé qu’ils avaient entamé des négociations pour renforcer leur coopération. Après avoir déjà supprimé les droits de douane et réduit d’autres restrictions commerciales, ce nouveau sommet régional vise à conclure un accord étendant notre partenariat au domaine militaire.\n\nSi les négociations aboutissent, tout acte d’agression contre un pays du Benelux sera considéré comme une attaque contre chacun des autres membres de l’alliance proposée."
belgium.97.a:0 "Espérons maintenir notre neutralité, ensemble."
belgium.97.b:0 "Une évolution intéressante."

belgium.98.t:0 "Échec des négociations tripartites des Pays-Bas méridionaux !"
belgium.98.d:0 "\nLe ministre [BEL.GetAdjective] des Affaires étrangères a annoncé aujourd’hui que le comité tripartite, censé jeter les bases d’un accord de défense mutuelle entre [BEL.GetNameDef], [HOL.GetNameDef] et [LUX.GetNameDef], avait échoué, les différentes délégations n’ayant pas réussi à s’entendre sur une stratégie commune. La coopération militaire semblant désormais impossible, les trois pays devront probablement compter sur eux-mêmes et chercher de nouveaux partenaires."
belgium.98.a:0 "De toute façon, c’était leur faute."
belgium.98.b:0 "Est-ce vraiment si important ?"

belgium.101.t:0 "Concours pour un avion de chasse"
belgium.101.desc:0 "Une étude récente sur le combat aérien moderne a mis en évidence une faiblesse critique de notre armée de l’air : nos chasseurs sont largement dépassés par les développements des autres pays. Le ministère de l’Air a lancé un programme accéléré visant à acquérir un chasseur moderne dans les plus brefs délais. Comme un développement national prendrait trop de temps, il a été décidé d’acheter une licence à l’étranger. Un budget supplémentaire a été accordé.\n\nLes experts divergent sur le type d’avion le mieux adapté pour moderniser nos escadrilles de chasse."
belgium.101.a:0 "Un intercepteur léger sera construit par Avions Fairey."
belgium.101.b:0 "Un gros chasseur lourd sera construit par la Sabca."

belgium.102.t:0 "Concours pour un chasseur léger"
belgium.102.desc_light_fighter:0 "Le ministère de la Défense recherche un nouveau chasseur léger qui nous permettrait de protéger notre espace aérien. Le ministère des Affaires étrangères n’a pas opposé de refus au projet, mais a suggéré que des considérations politiques et diplomatiques devraient également influencer le choix du pays fournisseur."
belgium.102.desc_light_fighter_refused:0 "Invoquant la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous aurons peut-être plus de chances ailleurs, ou nous pourrons envisager d’améliorer nos avions existants comme solution d’urgence."
belgium.102.a:0 "Contacter [GER.GetNameDef]"
belgium.102.b:0 "Contacter [ITA.GetNameDef]"
belgium.102.c:0 "Contacter [FRA.GetNameDef]"
belgium.102.d:0 "Contacter [ENG.GetNameDef]"
belgium.102.e:0 "Contacter [USA.GetNameDef]"
belgium.102.f:0 "Utiliser l’expérience acquise lors du concours pour améliorer nos propres avions."

belgium.103.t:0 "Concours pour un chasseur lourd"
belgium.103.a:0 "Favoriser les modèles [GER.GetAdjective]"
belgium.103.b:0 "Choisir les avions [ITA.GetAdjective]"
belgium.103.c:0 "Faire appel aux spécialistes [FRA.GetAdjective]"
belgium.103.d:0 "Acheter des appareils [ENG.GetAdjective]"
belgium.103.e:0 "Reproduire les modèles [USA.GetAdjective]"
belgium.103.desc_heavy_fighter:0 "Le ministère de l’Air souhaite acquérir un nouveau chasseur lourd pour l’interception à long rayon d’action et l’escorte de bombardiers. Cependant, le ministère des Affaires étrangères a suggéré que des considérations politiques et diplomatiques devraient également guider le choix du pays fournisseur."
belgium.103.desc_heavy_fighter_refused:0 "Invoquant la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous aurons peut-être plus de chances ailleurs, ou nous pourrons envisager d’améliorer nos avions existants comme solution d’urgence."

belgium.104.t:0 "Concours de chasseur [From.GetAdjective]"
belgium.104.desc:0 "L’armée de l’air [From.GetAdjective] organise actuellement des essais pour un nouveau chasseur léger. Selon notre attaché de l’air, notre dernier modèle est en bonne position pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue sous peu.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des inquiétudes subsistent quant à la sécurité nationale et au risque de voir notre équipement le plus moderne vendu à un pays étranger. Devons-nous autoriser cette transaction ?"
belgium.104.a:0 "Absolument."
belgium.104.b:0 "Nous ne pouvons pas courir le risque de fuites."

belgium.105.t:0 "Concours pour un chasseur lourd"
belgium.105.a:0 "Accepter de participer."
belgium.105.b:0 "Pas cette fois !"
belgium.105.desc:0 "L’armée de l’air [From.GetAdjective] organise actuellement des essais pour un nouveau chasseur lourd. Selon notre attaché de l’air, notre dernier modèle est bien placé pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue prochainement.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des inquiétudes en matière de sécurité nationale subsistent quant à la livraison de notre matériel le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
belgium.106.t:0 "Compétition de chasseurs terminée"
belgium.106.desc:0 "À l’issue de négociations avec le constructeur et les autorités, nous avons obtenu une licence de production pour un nouveau chasseur. Un exemplaire de l’appareil est déjà arrivé pour former les mécaniciens à son entretien, et un jeu complet de plans et schémas est attendu sous peu. La production peut commencer à tout moment."
belgium.106.a:0 "Parfait."

belgium.107.t:0 "Compétition de bombardiers"
belgium.107.desc:0 "Une étude du ministère de l’Air a révélé que nos forces aériennes sont mal préparées à soutenir l’armée. Les frappes aériennes à longue portée et l’appui aérien rapproché ont été identifiés comme deux domaines clés où nous sommes gravement déficients. Le gouvernement a débloqué des fonds pour un programme accéléré d’acquisition d’un bombardier moderne, mais nous devons décider quel appareil acheter."
belgium.107.a:0 "Un petit bombardier pour l’appui rapproché."
belgium.107.b:0 "Un appareil plus grand avec plus d’autonomie."

belgium.108.t:0 "Compétition de bombardiers légers"
belgium.108.desc_cas:0 "Le ministère de l’Air cherche à acquérir un nouveau bombardier léger pour l’appui rapproché des forces terrestres, mais le ministère des Affaires étrangères a suggéré que des considérations politiques et diplomatiques jouent également un rôle dans le choix du pays fournisseur."
belgium.108.desc_cas_refused:0 "Au nom de la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous pourrions avoir plus de chances ailleurs, ou envisager de moderniser nos appareils existants en solution de secours."
belgium.108.a:0 "S’adresser à [GER.GetNameDef]."
belgium.108.b:0 "S’adresser à [ITA.GetNameDef]."
belgium.108.c:0 "S’adresser à [FRA.GetNameDef]."
belgium.108.d:0 "S’adresser à [ENG.GetNameDef]."
belgium.108.e:0 "S’adresser à [USA.GetNameDef]."

belgium.109.t:0 "Compétition de bombardiers moyens"
belgium.109.desc_tac:0 "Le ministère de l’Air cherche à acquérir un nouveau bombardier moyen pour des missions d’interdiction à longue portée et de frappes tactiques, mais le ministère des Affaires étrangères a suggéré que des considérations politiques et diplomatiques jouent également un rôle dans le choix du pays fournisseur."
belgium.109.desc_tac_refused:0 "Au nom de la sécurité nationale, le gouvernement [From.GetAdjective] a refusé de délivrer une licence de production. Nous pourrions avoir plus de chances ailleurs, ou envisager de moderniser nos appareils existants en solution de secours."
belgium.109.a:0 "S’adresser à [GER.GetNameDef]."
belgium.109.b:0 "S’adresser à [ITA.GetNameDef]."
belgium.109.c:0 "S’adresser à [FRA.GetNameDef]."
belgium.109.d:0 "S’adresser à [ENG.GetNameDef]."
belgium.109.e:0 "S’adresser à [USA.GetNameDef]"
belgium.109.f:0 "Encourager l’aviation nationale"

belgium.110.t:0 "Compétition de bombardiers [From.GetAdjective]"
belgium.110.desc:0 "L’armée de l’air [From.GetAdjective] organise actuellement des essais pour un nouveau bombardier léger. Selon notre attaché de l’air, notre dernier modèle est bien placé pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue prochainement.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des inquiétudes en matière de sécurité nationale subsistent quant à la livraison de notre matériel le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
belgium.110.a:0 "Montrons-leur nos plans."
belgium.110.b:0 "Cela ne nous intéresse pas."

belgium.111.t:0 "Compétition de bombardiers [From.GetAdjective]"
belgium.111.desc:0 "L’armée de l’air [From.GetAdjective] organise actuellement des essais pour un nouveau bombardier moyen. Selon notre attaché de l’air, notre dernier modèle est bien placé pour l’emporter. Une demande officielle du gouvernement [From.GetAdjective] est attendue prochainement.\n\nLes représentants du constructeur sont fermement favorables à la vente, mais des inquiétudes en matière de sécurité nationale subsistent quant à la livraison de notre matériel le plus moderne à un pays étranger. Devons-nous autoriser la transaction ?"
belgium.111.a:0 "Montrons-leur nos plans."
belgium.111.b:0 "Cela ne nous intéresse pas."

belgium.112.t:0 "Compétition de bombardiers terminée"
belgium.112.desc:0 "À l’issue de négociations avec le constructeur et les autorités, nous avons obtenu une licence de production pour un nouveau bombardier. Un exemplaire de l’appareil est déjà arrivé pour former les mécaniciens à son entretien, et un jeu complet de plans et schémas est attendu sous peu. La production peut commencer à tout moment."
belgium.112.a:0 "Parfait."

belgium.113.t:0 "[BEL.GetNameDefCap] veut développer un bombardier léger avec nous"
belgium.113.desc:0 "[BEL.GetNameDefCap] a proposé un partage de connaissances afin de permettre à la SABCA de développer un bombardier léger en collaboration avec Caproni. Cela pourrait nous apporter des enseignements précieux, tandis que les [BEL.GetAdjective] obtiendraient un appareil moderne d’appui rapproché."
belgium.113.a:0 "Nous avons tout à y gagner."
belgium.113.b:0 "Nous préférons l’autonomie."

belgium.114.t:0 "[ITA.GetNameDefCap] accepte notre accord de développement conjoint"
belgium.114.desc:0 "Le gouvernement [ITA.GetAdjective] a autorisé la collaboration entre la SABCA et Caproni pour construire un nouvel appareil destiné à l’armée [BEL.GetAdjective]."
belgium.114.a:0 "Excellente nouvelle."
belgium.117.t:0 "[BEL.GetNameDefCap] renonce à la protection [FRA.GetAdjective]"
belgium.117.desc:0 "\nAprès un débat houleux, le gouvernement [BEL.GetAdjective] a décidé d'adopter une position strictement neutre et de protéger toutes les frontières de manière égale. Cette décision a été prise en partie grâce au soutien des nationalistes flamands, qui considéraient ces garanties et l'influence [FRA.GetAdjective] sur l'armée comme une ingérence scandaleuse d'un gouvernement étranger dans nos affaires internes."
belgium.117.a:0 "C’est leur décision."
belgium.117.b:0 "C’est leur décision."
belgium.117.c:0 "Intéressant."

belgium.118.t:0 "Les représentants flamands veulent une neutralité totale"
belgium.118.desc:0 "\"Plus d'intervention [FRA.GetAdjective] !\" Ce slogan, entre autres, est le nouveau mot d’ordre des nationalistes flamands, qui demandent que nous renoncions à la protection [FRA.GetAdjective] et adoptions une politique strictement neutre. Cette position, en totale rupture avec la situation diplomatique de la Belgique depuis 18 ans, est censée nous assurer la sécurité, car un lien étroit avec [FRA.GetNameDef] ne ferait que favoriser une répétition du plan Schlieffen en cas d’un nouveau conflit [FRA.GetAdjective]-[GER.GetAdjective]. Mais, loin d’être uniquement soutenue par les nationalistes flamands, cette position a également trouvé un écho chez des personnalités francophones influentes comme Paul-Henri Spaak. Des rumeurs venant du palais royal affirment même que le roi lui-même soutiendrait une telle décision."
belgium.118.a:0 "Accepter leurs demandes."
belgium.118.b:0 "Nous ne céderons pas à leur volonté."

belgium.119.t:0 "Paul-Henri Spaak lance un ultimatum"
belgium.119.desc:0 "Paul-Henri Spaak, l’un des principaux hommes politiques socialistes, a menacé de démissionner avec les autres ministres socialistes si une politique étrangère neutre n’était pas mise en place immédiatement. Si les socialistes démissionnent, la coalition tripartite qui était au cœur de la politique [BEL.GetAdjective] depuis les dernières élections législatives serait brisée. L’évolution logique serait que les catholiques et les libéraux forment ensemble un gouvernement pour renforcer leurs relations avec [FRA.GetNameDef] et [ENG.GetNameDef]."
belgium.119.a:0 "Accepter l’ultimatum de Spaak."
belgium.119.b:0 "Nous formerons un gouvernement sans eux."

belgium.120.t:0 "Rejoindre l’Entente française ?"
belgium.120.desc:0 "L’engagement [FRA.GetAdjective] envers la protection des autres nations d’Europe semble clair et ferme. Ils ont formé ce qu’ils appellent une Entente pour sécuriser le continent contre la menace des tyrans. Compte tenu de notre position et de notre politique clairement pro-[FRA.GetAdjective], il serait naturel de rejoindre cette alliance pour garantir notre sécurité. La seule alternative viable serait d’établir un lien solide avec [ENG.GetNameDef], afin de fournir, en temps voulu, un soutien concret à notre stratégie."
belgium.120.a:0 "Notre hymne ne sera tout de même pas la Marseillaise."
belgium.120.b:0 "Renforçons plutôt nos liens diplomatiques avec [ENG.GetNameDef]."

belgium.121.t:0 "Réunion fasciste perturbée par des militants communistes"
belgium.121.desc:0 "La nuit dernière, une réunion fasciste a été troublée par l’agression violente de sympathisants communistes qui ont jeté des pierres et frappé pour perturber le rassemblement. Bien que les fascistes aient répliqué violemment, la situation tendue a été gérée aussi prudemment que possible par la police."
belgium.121.a:0 "Une action nécessaire pour stopper les fascistes."
belgium.121.b:0 "Intervenir pour mettre fin à la violence."

belgium.122.t:0 "Les communistes organisent des grèves massives"
belgium.122.desc:0 "Pour montrer leur force parmi les classes populaires de notre société, le Parti communiste a organisé une grève massive mais, espérons-le, courte dans tout le pays. Ils qualifient ce mouvement de victoire, accentuant la fracture entre les communistes et les partis démocratiques."
belgium.122.a:0 "Prolétaires de tous les pays, unissez-vous !"
belgium.122.b:0 "Sales communistes !"
belgium.122.c:0 "Assez ! Envoyez l’armée !"

belgium.123.t:0 "Les communistes organisent une marche sur Bruxelles"
belgium.123.desc:0 "Le Parti communiste belge a organisé une marche sur Bruxelles contre la \"faim\" et pour la \"justice sociale\". Alors que les sympathisants communistes appellent à des réformes en faveur des travailleurs et considèrent cet événement comme une manifestation nécessaire pour défendre ces derniers, les autorités craignent que cette démonstration ne dégénère en émeute visant les institutions démocratiques."
belgium.123.a:0 "Sales communistes !"
belgium.123.b:0 "Assez ! Envoyez l’armée !"

belgium.124.t:0 "Xavier Relecom arrêté !"
belgium.124.desc:0 "Pour réprimer la grève organisée par le Parti communiste, l’un de ses principaux dirigeants, Xavier Relecom, a été arrêté la nuit dernière. Il est actuellement en détention, le temps d’enquêter sur son implication dans cette affaire."
belgium.124.a:0 "La police fait son travail."

belgium.125.t:0 "Réunion rexiste réussie"
belgium.125.desc:0 "La nuit dernière, le chef de Rex, Léon Degrelle, a réuni une grande salle de sympathisants et a prononcé un long discours contre la nature corrompue de l’institution et la dissolution de l’esprit national."
belgium.125.a:0 "\"Rex vaincra\", disent-ils…"

belgium.126.t:0 "Réunion rexiste massive"
belgium.126.desc:0 "Hier après-midi, Léon Degrelle a tenu une grande réunion en plein air. Il est arrivé dans une décapotable noire, passant en revue les membres de la milice rexiste devant lui. Il a ensuite prononcé un long discours fustigeant le système parlementaire et la mollesse des représentants démocrates. Cette impressionnante démonstration de force a permis aux sympathisants d’affirmer leur soutien au mouvement. En même temps, du point de vue des citoyens non fascistes, cela ressemblait à un grand défilé militaire, menaçant la démocratie."
belgium.126.a:0 "Notre main levée est le signe de notre disponibilité pour la patrie."
belgium.126.b:0 "Assez ! Envoyez l’armée !"
belgium.127.t:0 "Grand rassemblement du Verdinaso"
belgium.127.desc:0 "Hier, Joris van Severen a démontré la force de son mouvement en rassemblant une foule organisée et nombreuse lors d’un grand meeting. Dans son discours, il a attaqué le système politique actuel, le qualifiant de corrompu et inefficace, et accusé de détruire la nation."
belgium.127.a:0 "Ce mouvement prend de l’ampleur chaque jour."
belgium.127.b:0 "Ça suffit ; envoyez l’armée !"

belgium.128.t:0 "Importante émeute entre fascistes et antifascistes"
belgium.128.desc:0 "Un groupe de nervis fascistes organisés a agressé à plusieurs reprises des sympathisants antifascistes qui protestaient contre leur dernier meeting. L’incident a ensuite dégénéré en émeute, causant des dégâts matériels et blessant de nombreuses personnes… ainsi que quelques malheureux pris au milieu des affrontements."
belgium.128.a:0 "La violence politique n’est pas la solution."
belgium.128.b:0 "Intervenir au plus vite pour mettre fin aux troubles."

belgium.129.t:0 "Léon Degrelle arrêté après son dernier meeting"
belgium.129.desc:0 "En raison des troubles survenus après le dernier rassemblement fasciste, Léon Degrelle a été arrêté par la police afin d’enquêter sur sa responsabilité dans les récentes émeutes."
belgium.129.a:0 "La police fait son travail."

belgium.130.t:0 "Une partie de la population craint le fascisme"
belgium.130.desc:0 "Il semble que le dernier meeting fasciste ait été quelque peu contre-productif : cette démonstration de force a convaincu une partie de la population que la démocratie devait être défendue."
belgium.130.a:0 "Qui pourrait leur en vouloir ?"

belgium.131.t:0 "La cinquième colonne fasciste"
belgium.131.desc:0 "L’agression [GER.GetAdjective] nous oblige à arrêter les sympathisants potentiels à l’intérieur du pays. Selon les autorités, bien que Léon Degrelle ait officiellement déclaré qu’ils n’étaient pas pro-[GER.GetAdjective], le risque était trop important pour être ignoré. Par conséquent, des figures nationalistes, syndicalistes et séparatistes en vue, telles qu’August Borms, Léon Degrelle et Joris van Severen, ont été arrêtées."
belgium.131.a:0 "Ils pourraient collaborer avec l’ennemi."
belgium.131.b:0 "Les désaccords font partie du processus démocratique."
belgium.131.c:0 "Poursuivez, cela importe peu."

belgium.132.t:0 "Un syndicaliste aide à propager les idées marxistes"
belgium.132.desc:0 "Un syndicaliste local a organisé une campagne intensive de promotion des idées communistes. Il semble avoir attiré de nombreux nouveaux sympathisants à notre cause."
belgium.132.a:0 "Nous sommes l’avenir !"

belgium.133.t:0 "Les réactionnaires bourgeois tentent de protéger les institutions capitalistes"
belgium.133.desc:0 "En réaction à notre montée en puissance, les agents des capitalistes ont décidé de protéger leur soi-disant « liberté » afin de garantir la survie des institutions créées par la bourgeoisie. Ce processus ne sera probablement que temporaire, car rien n’empêchera les travailleurs de prendre le pouvoir et de s’emparer des moyens de production."
belgium.133.a:0 "Nous avons vu l’avenir ; ils combattent l’inévitable."

belgium.134.t:0 "Les fascistes s’assemblent pour contrer la montée des communistes"
belgium.134.desc:0 "Pour inverser l’inévitable, des bandes de réactionnaires fascistes (probablement manipulées par les capitalistes) se sont organisées et ont attaqué des militants communistes."
belgium.134.a:0 "Nous triompherons à la fin !"

belgium.135.t:0 "Mobilisation en faveur de la démocratie"
belgium.135.desc:0 "La menace des mouvements fascistes et communistes a poussé de nombreuses personnes à soutenir les institutions démocratiques. Des associations se sont formées pour dénoncer les atteintes aux libertés publiques et maintenir les structures de la société [BEL.GetAdjective]."
belgium.135.a:0 "Les libertés doivent être protégées."

belgium.136.t:0 "La Force publique réclame des fusils modernes"
belgium.136.desc:0 "La Force publique, force de sécurité du [COG.GetNameDef], n’a pas reçu d’équipement moderne depuis des années. Elle devient progressivement obsolète comme force de combat et rencontre désormais des difficultés dans ses missions quotidiennes de maintien de l’ordre dans les zones reculées de la colonie.\nPour changer la situation, un équipement moderne a été demandé dans le cadre d’un plan global visant à restaurer les capacités des forces coloniales."
belgium.136.a:0 "Envoyez des instructions au service logistique."
belgium.136.b:0 "Nous leur enverrons de la documentation technique."
belgium.136.c:0 "Nous ne pouvons épargner aucun fusil."

belgium.137.t:0 "[BEL.GetNameDefCap] accepte la demande d’expédition de fusils modernes"
belgium.137.desc:0 "Le gouvernement [BEL.GetAdjective] a accepté d’envoyer une partie des fusils FN demandés pour moderniser l’équipement de la Force publique."
belgium.137.a:0 "Excellente nouvelle."

belgium.138.t:0 "[BEL.GetNameDefCap] a rejeté notre demande"
belgium.138.desc:0 "Le gouvernement [BEL.GetAdjective] a refusé de nous envoyer les fusils demandés. Sans investissements, la Force publique aura encore plus de mal à accomplir efficacement ses tâches quotidiennes."
belgium.138.a:0 "Nous devrons donc les fabriquer nous-mêmes."
belgium.139.t:0 "Les Armes Légères de la Force Publique"
belgium.139.desc:0 "La première partie des armes que nous avions promis de fournir à la Force Publique pour moderniser son armement est enfin prête."
belgium.139.a:0 "Envoyez-les sans délai."
belgium.139.b:0 "Annuler la livraison et garder les armes."
belgium.140.t:0 "Deuxième Livraison d'Armes à la Force Publique"
belgium.140.desc:0 "La deuxième livraison d'armes destinée à la Force Publique est prête."
belgium.140.a:0 "Vous connaissez la procédure. Continuez."
belgium.141.t:0 "La Dernière Livraison d'Armes [COG.GetAdjective]"
belgium.141.desc:0 "La dernière livraison d'armes légères à destination de [COG.GetNameDef] est enfin prête."
belgium.141.a:0 "J'espère qu'ils aimeront leurs nouveaux fusils."
belgium.142.t:0 "[BEL.GetNameDefCap] Refuse de Livrer les Armes !"
belgium.142.desc:0 "Contre toute attente, [BEL.GetNameDef] a décidé de conserver les armes qu'ils avaient promis de livrer et d'annuler les livraisons futures. Cette décision a provoqué la colère des officiers de la Force Publique et du gouvernement [COG.GetAdjective]. Ce manque de soutien et de fiabilité du gouvernement [BEL.GetAdjective] a renforcé l'idée qu'une plus grande autonomie de la colonie est nécessaire pour atteindre des objectifs réalistes, avec ou sans l'accord du ministère des Colonies."
belgium.142.a:0 "C'est un scandale."
belgium.143.t:0 "La Première Livraison de Fusils est Arrivée"
belgium.143.desc:0 "Nous avons reçu la première partie des armes promises par le gouvernement [BEL.GetAdjective]."
belgium.143.a:0 "Espérons que le reste suivra rapidement."
belgium.144.t:0 "Une Nouvelle Cargaison de Fusils est Arrivée"
belgium.144.desc:0 "Une deuxième livraison d'armes légères est arrivée."
belgium.144.a:0 "Il était temps."
belgium.145.t:0 "La Dernière Partie des Armes Promises a Été Livrée"
belgium.145.desc:0 "La dernière livraison d'armes à feu promise par le gouvernement [BEL.GetAdjective] vient d'arriver à Matadi."
belgium.145.a:0 "C'est bien qu'ils aient tenu parole."

belgium.146.t:0 "[BEL.GetNameDefCap] Déclare l'État d'Urgence"
belgium.146.desc:0 "Pour faire face à la menace croissante des politiciens radicaux, le roi des Belges, Léopold III, a décidé de mobiliser l'armée. Aussi surprenante que soit cette décision, des rumeurs affirment qu'elle a été favorisée par des pressions [ENG.GetAdjective] sur le pays. La loi martiale est désormais instaurée en [BEL.GetNameDef], et la répression a commencé contre les politiciens et sympathisants fascistes. Néanmoins, un grand nombre d'entre eux, plus royalistes que fascistes, ont reconnu que leurs opinions étaient à courte vue et se sont rangés derrière le roi.\n\nPendant ce temps, les partis démocratiques sont divisés sur ce développement. Si beaucoup se réjouissent de l’écrasement des ennemis de l’État, d’autres craignent que les pouvoirs d’urgence ne soient prolongés et que les institutions démocratiques ne deviennent obsolètes."
belgium.146.a:0 "Intéressant."
belgium.146.b:0 "Vive le Roi !"
belgium.147.t:0 "[BEL.GetNameDefCap] Déclare l'État d'Urgence"
belgium.147.desc:0 "Pour faire face à la menace croissante des politiciens radicaux, le roi des Belges, Léopold III, a décidé de mobiliser l'armée. Aussi surprenante que soit cette décision, certaines rumeurs affirment qu'elle a été favorisée par des pressions [ENG.GetAdjective] sur le pays. La loi martiale est désormais instaurée en [BEL.GetNameDef], et la répression a commencé contre les politiciens et sympathisants communistes.\n\nPendant ce temps, les partis démocratiques sont divisés sur ce développement. Si beaucoup se réjouissent de l’écrasement des ennemis de l’État, d’autres craignent que les pouvoirs d’urgence ne soient prolongés et que les institutions démocratiques ne deviennent obsolètes."
belgium.147.a:0 "Intéressant."
belgium.147.b:0 "Vive le Roi !"
belgium.148.t:0 "Le Roi des Belges Propose un Accord Diplomatique"
belgium.148.desc:0 "Conscient de nos projets d'intervention dans leur pays afin d'assurer notre alignement à leurs côtés, le roi Léopold III a suggéré une solution plus pacifique. Il déclarerait la loi martiale et s'occuperait lui-même des politiciens radicaux, tandis que nous préserverions leur indépendance et leur neutralité."
belgium.148.a:0 "C'est une solution raisonnable."
belgium.148.b:0 "Nous ne devons pas abandonner la possibilité d'une invasion."
belgium.149.t:0 "[ENG.GetNameDefCap] a Refusé Notre Offre"
belgium.149.desc:0 "[ENG.GetNameDefCap] nous a informés qu'ils refusaient notre proposition. Comme une intervention [ENG.GetAdjective] reste possible, nous devons intensifier nos efforts pour lutter contre les fascistes et les communistes, tout en restant prêts tant qu'ils sont sur le pied de guerre."
belgium.149.a:0 "Il est temps de mobiliser !"
belgium.150.t:0 "Une Démonstration de Loyauté"
belgium.150.desc:0 "Récemment, la propagande pro-royaliste s'est intensifiée et a été accueillie avec enthousiasme par les monarchistes prêts à défendre le pays. À Roulers, des habitants se sont spontanément réunis pour déposer des bouquets de fleurs devant un grand portrait du roi afin de montrer leur loyauté."
belgium.150.a:0 "Vive Léopold !"
belgium.151.t:0 "La Menace d'une Intervention [ENG.GetAdjective]"
belgium.151.desc:0 "Le parlement [ENG.GetAdjective] a approuvé le projet d'intervention en [BEL.GetNameDef]. Par conséquent, la possibilité d'une invasion devient chaque jour plus réelle. Comme ils semblent sourds à nos appels diplomatiques pour éviter un nouveau conflit européen, nous sommes effectivement pris au piège entre les discours politiques antidémocratiques et la possibilité d'un débarquement [ENG.GetAdjective]. Pour sortir de ce qui semble être une situation inextricable, le roi a rencontré le gouvernement et le chef d'état-major général pour discuter d'un plan d'action radical qui montrerait à [ENG.GetNameDef] notre détermination dans la lutte contre les fascistes et les communistes, dans l'espoir d'éviter une guerre inutile."
belgium.151.a:0 "Mettre le plan à exécution. Déclarer la loi martiale."
belgium.151.b:0 "C'est trop dangereux."

belgium.152.t:0 "La Loi Martiale Entre en Vigueur"
belgium.152.desc:0 "Comme indiqué dans le long et grave discours diffusé par les stations de radio [BEL.GetAdjective], la loi martiale est désormais effectivement instaurée. Des divisions ont été mobilisées et envoyées sur des sites stratégiques, tandis que le roi dirigeait toute l'opération depuis le haut commandement militaire du fort de Breendonck. Les quartiers généraux de Rex, du VNV, du Parti communiste belge et d'autres organisations affiliées à l'extrême gauche comme à l'extrême droite sont actuellement perquisitionnés par les forces de police, soutenues par le personnel militaire.\n\nLe roi contrôle désormais effectivement le pays, prêt à sauvegarder son indépendance tout en protégeant son trône."
belgium.152.a:0 "Un coup porté au cœur de nos ennemis."
belgium.153.t:0 "Le retour de la pilarisation"
belgium.153.desc:0 "Avec le retour d'une politique démocratique fonctionnelle, la société se réorganise à nouveau selon les lignes partisanes. Par conséquent, on s'attend à ce que, d'une manière ou d'une autre, la pilarisation façonne à nouveau la structure de la société."
belgium.153.a:0 "La société que nous connaissons et aimons revient."

belgium.156.t:0 "La fin de la Belgique"
belgium.156.desc:0 "En raison de la perte de la moitié des territoires historiques du pays, la division de la population entre Flamands et Wallons a soudainement disparu. Par conséquent, le gouvernement doit tenir compte de ce changement et reconnaître que les institutions de l'État belge ne sont plus représentatives."
belgium.156.a:0 "Une évolution logique.."
belgium.156.b:0 "Une évolution logique.."
belgium.156.c:0 "Une évolution logique.."
belgium.156.d:0 "Une évolution logique.."

belgium.157.t:0 "La fin de la Belgique"
belgium.157.desc:0 "En raison de la perte de la moitié des territoires historiques du pays, la division de la population entre Flamands et Wallons a soudainement disparu. Par conséquent, le gouvernement doit tenir compte de ce changement et reconnaître que les institutions de l'État belge ne sont plus représentatives."
belgium.157.a:0 "Une évolution logique."
belgium.157.b:0 "Une évolution logique."
belgium.157.c:0 "Une évolution logique."
belgium.157.d:0 "Une évolution logique."

belgium.158.t:0 "La montée du Lion flamand"
belgium.158.desc:0 "En raison de la perte du territoire wallon, l'ancien gouvernement belge s'est effondré. La rupture de l'équilibre linguistique (qui favorisait la population francophone) au profit de la désormais écrasante majorité flamande a poussé le pays à se reconstruire en tant que Flandre. Les dirigeants nationalistes flamands ont qualifié ce jour de second plus important de l'histoire flamande depuis la bataille des Éperons d'Or de 1302."
belgium.158.a:0 "Intéressant."

belgium.159.t:0 "Le Congrès wallon proclame la reformation de la Belgique"
belgium.159.desc:0 "\n\nAvec la perte des territoires flamands, y compris son ancienne capitale Bruxelles, le gouvernement belge est en plein désarroi. Pour s'adapter aux nouvelles réalités politiques, un congrès wallon s'est réuni à Liège afin de poser les bases d'un État wallon."
belgium.159.a:0 "Intéressant."

belgium.161.t:0 "Lutte de pouvoir en [COG.GetNameDef]"
belgium.161.desc:0 "Sous l'influence d'un autre pays communiste, un débat a émergé concernant la direction du mouvement communiste en [COG.GetNameDef]. Certains considèrent Albert Decoster comme illégitime en raison de ses origines européennes. D'autres préféreraient voir un Africain à la tête d'un pays africain, même s'il ne s'agit que d'une figure symbolique."
belgium.161.a:0 "L'Afrique doit être dirigée par des Africains."
belgium.161.b:0 "Le garder au gouvernement."
belgium.161.c:0 "Le garder au pouvoir."

belgium.164.t:0 "Rapport du ministère des Colonies pour 1935"
belgium.164.desc:0 "Nous sommes raisonnablement satisfaits du travail de Pierre Ryckmans en [COG.GetNameDef], car il applique assez bien la charte coloniale, même si quelques abus ont été signalés çà et là.\nL'économie s'améliore et la situation des indigènes s'est considérablement améliorée depuis 1909. De plus, la production minière et l'extraction du caoutchouc rapportent des revenus substantiels. Néanmoins, notre matériel minier devient obsolète, ce qui pourrait menacer l'efficacité économique de la colonie à l'avenir.\nConcernant la Force publique, elle est presque totalement désorganisée. Les soldats sont presque entièrement équipés de fusils complètement dépassés, tandis que les officiers sont démotivés. Par conséquent, seules les opérations de sécurité les plus basiques peuvent être réalisées pour le moment.\n\nParallèlement, la Société des Nations a approuvé le rapport d'Eugène Jungers sur son travail dans les colonies sous mandat du Ruanda et de l'Urundi. La supervision des royaumes de Mutara III au Ruanda et de Mwambutsa IV en Urundi devrait donc se poursuivre sans incident. Par conséquent, nous ne voyons actuellement aucune nécessité de remplacer l'administration civile, mais une révision urgente de notre force de sécurité est nécessaire."
belgium.164.a:0 "Nous avons beaucoup à faire !"

belgium.165.t:0 "Canal Albert terminé"
belgium.165.desc:0 "Après une décennie de travaux, le canal Albert a enfin été inauguré."
belgium.165.a:0 "Un accomplissement magnifique."

belgium.166.t:0 "Le creusement du canal Albert est interrompu"
belgium.166.desc:0 "En raison de la guerre, le creusement du canal Albert a été interrompu juste avant son achèvement."
belgium.166.a:0 "Nous gagnerons la guerre, rétablirons la paix et terminerons le canal."

belgium.167.t:0 "Bruxelles promet une aide technique"
belgium.167.desc:0 "Alors que nous avions demandé de nouveaux fusils, le gouvernement a envoyé à la place une aide technique."
belgium.167.a:0 "C'est mieux que rien."

belgium.news.1.t:0 "Le gouvernement [HOL.GetAdjective] cède aux exigences [BEL.GetAdjective] !"
belgium.news.1.d:0 "\n\nLe gouvernement [HOL.GetAdjective] a accepté les termes de l'ultimatum [BEL.GetAdjective], s'ouvrant ainsi à une forte influence communiste."
belgium.news.1.a:0 "Excellente nouvelle !"
belgium.news.1.b:0 "Maudits [BEL.GetAdjective] ! Ils ne devraient vraiment pas exister."
belgium.news.1.c:0 "Réjouissez-vous, travailleurs ! La révolution se répand !"
belgium.news.1.e:0 "Encore un pays qui se couvre de honte devant un agresseur étranger."

belgium.news.2.t:0 "Le gouvernement [HOL.GetAdjective] rejette les exigences [BEL.GetAdjective] !"
belgium.news.2.d:0 "\n\nLe gouvernement [HOL.GetAdjective] a rejeté l'ultimatum [BEL.GetAdjective], déclarant qu'il ne se soumettrait pas à ces demandes ridicules. Il a ajouté qu'il était prêt à défendre chaque parcelle de terre contre l'eau et tout autre envahisseur."
belgium.news.2.a:0 "Les [HOL.GetAdjective] se dressent contre l'agression !"
belgium.news.2.b:0 "Nos alliés [HOL.GetAdjective] auront besoin de nous ; préparons-nous."
belgium.news.2.c:0 "Cela n'arrêtera pas la marche de l'Histoire !"
belgium.news.2.e:0 "Inquiétant !"

belgium.news.3.t:0 "Le gouvernement [HOL.GetAdjective] sollicite l'aide des Alliés !"
belgium.news.3.d:0 "\n\nFace aux exigences [BEL.GetAdjective], le gouvernement [HOL.GetAdjective] les a rejetées et a demandé l'aide militaire des Alliés contre toute agression [BEL.GetAdjective]."
belgium.news.3.a:0 "Les Nations Unies défendront la liberté !"
belgium.news.3.b:0 "Les ennemis de nos ennemis sont (presque) nos amis."
belgium.news.3.c:0 "Cela n'arrêtera pas la marche de l'Histoire !"
belgium.news.3.e:0 "Ce sera une guerre courte, n'est-ce pas ?"

belgium.news.43.t:0 "Léon Degrelle proclame l'Empire thiois"
belgium.news.43.d:0 "Dans un long discours louant la valeur de la nation et de son armée, Léon Degrelle a annoncé que, maintenant que l'union avec les Pays-Bas est achevée, une nouvelle ère commence pour les Pays-Bas méridionaux. Pour marquer ce changement, le pays sera désormais appelé l'Empire thiois. Appelant à ressusciter l'esprit de l'empereur Charles Quint, il a exhorté à réunir l'ancien « Cercle de Bourgogne » dans cette nouvelle entité politique."
belgium.news.43.a:0 "Aujourd'hui, un peuple impérial s'est enfin éveillé !"
belgium.news.43.b:0 "Après le pays qui n'existe pas, l'empire qui n'existe pas !"
belgium.news.43.c:0 "Il va falloir changer nos cartes."

belgium.news.44.t:0 "Joris van Severen proclame le Dietsche Rijk"
belgium.news.44.d:0 "Dans un long discours louant la valeur de la nation et de son armée, Joris van Severen a annoncé que, maintenant que l'union avec les Pays-Bas est achevée, une nouvelle ère commence pour les Pays-Bas méridionaux. Le pays sera désormais appelé le Dietsche Rijk pour marquer ce changement. Appelant à ressusciter l'unité du peuple néerlandophone, il a exhorté tous les héritiers des Pays-Bas à s'unir dans cette nouvelle entité politique."
belgium.news.44.a:0 "Aujourd'hui, un peuple impérial s'est enfin éveillé !"
belgium.news.44.b:0 "Après le pays qui n'existe pas, l'empire qui n'existe pas !"
belgium.news.44.c:0 "Il va falloir changer nos cartes."

