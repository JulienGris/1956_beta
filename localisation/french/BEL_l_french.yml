BEL_recall_jules_pire:0 "Rappeler Jules Pire"
BEL_recall_jules_pire_desc:0 "Ancien commandant des Chasseurs ardennais, Jules Pire a pris sa retraite il y a quelques années. Cependant, face aux exigences croissantes de la guerre, il pourrait être judicieux de le rappeler au service actif et de bénéficier de son expérience de commandement passée."

