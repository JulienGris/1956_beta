HOL_arm_flemish_fascists_category_desc:0 "Nous devons organiser et armer les fascistes flamands qui souhaitent également unifier l’ensemble des Pays-Bas méridionaux. Cela pourrait constituer un avantage considérable dans le conflit qui se profile à l’horizon."
