bel_cityfall.1.t:0 "La Chute de Berlin"
bel_cityfall.1.d:0 "Les soldats [BEL.GetAdjective] victorieux défilent dans les rues de Berlin après de violents combats autour de la porte de Brandebourg, du Reichstag et de la chancellerie du Reich.\n\nLe drapeau [BEL.GetAdjective] flotte désormais au-dessus du Reichstag. Pendant ce temps, des équipes spéciales fouillent la ville pour capturer tout officier [GER.GetAdjective] piégé dans la cité assiégée."
bel_cityfall.1.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.1.b:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.1.c:0 "Belgische Schweinhunde !"

bel_cityfall.2.t:0 "La Chute de Londres"
bel_cityfall.2.d:0 "Les soldats [BEL.GetAdjective] victorieux défilent dans les rues de Londres après de violents combats qui ont duré presque toute la journée. Bien que la plupart des monuments de la ville aient été préservés, le Tower Bridge fut détruit lorsque les troupes [ENG.GetAdjective] en retraite tentèrent de franchir la Tamise par le pont. L’artillerie [BEL.GetAdjective] détruisit sa partie centrale avant qu’elles n’atteignent l’autre rive.\n\nLe palais de Buckingham est désormais le nouveau quartier général des forces [BEL.GetAdjective] en progression."
bel_cityfall.2.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.2.b:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.2.c:0 "Pourquoi les avoir aidés en 1914 ?"

bel_cityfall.3.t:0 "La Chute de Moscou"
bel_cityfall.3.d:0 "Les soldats [BEL.GetAdjective] victorieux défilent dans les rues de Moscou après de violents combats qui ont duré presque toute la journée. Les bataillons [BEL.GetAdjective] se sont positionnés autour de la place Rouge et dans les bâtiments endommagés du Kremlin. Les tours de la basilique Saint-Basile ont miraculeusement survécu au bombardement, comme la tour de l’hôtel de ville de Bruxelles en 1695."
bel_cityfall.3.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.3.b:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.3.c:0 "[BEL.GetAdjective] ? Ici ?"

bel_cityfall.4.t:0 "La Chute d’Amsterdam"
bel_cityfall.4.d:0 "Les soldats [BEL.GetAdjective] victorieux défilent dans les rues d’Amsterdam après de violents combats qui ont duré presque toute la journée. Les bataillons [BEL.GetAdjective] se sont installés sur plusieurs ponts et places principales de la ville."
bel_cityfall.4.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.4.b:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.4.c:0 "Nous aurions dû les écraser en 1830."

bel_cityfall.5.t:0 "La Chute de Paris"
bel_cityfall.5.d:0 "Les soldats [BEL.GetAdjective] victorieux ont défilé ce matin sur les Champs-Élysées. Les bataillons [BEL.GetAdjective] ont pris position autour de la tour Eiffel, de l’hôtel Matignon et du palais du Luxembourg.\n\nPendant la retraite [FRA.GetAdjective], certains officiers [BEL.GetAdjective] ont profité de l’occasion pour visiter le Louvre, bien que presque tout ait été évacué. Pendant ce temps, le commandant des forces [BEL.GetAdjective] a proclamé aux Parisiens de ne pas craindre l’armée avancée, promettant un comportement humain. Il a également qualifié ce jour de première occupation de Paris depuis l’entrée des troupes bourguignonnes en 1418… une remarque étrange au vu des massacres qui suivirent."
bel_cityfall.5-2.d:0 "Les soldats [BEL.GetAdjective] victorieux ont défilé ce matin sur les Champs-Élysées. Les bataillons [BEL.GetAdjective] ont pris position autour de la tour Eiffel, de l’hôtel Matignon et du palais du Luxembourg.\n\nPendant la retraite [FRA.GetAdjective], certains officiers [BEL.GetAdjective] ont profité de l’occasion pour visiter le Louvre, bien que presque tout ait été évacué. Pendant ce temps, le commandant des forces [BEL.GetAdjective] a proclamé aux Parisiens de ne pas craindre l’armée avancée et promis un comportement humain. Il a aussi annoncé que cette victoire historique marquait la fin de la domination [FRA.GetAdjective] sur la Flandre conquise et opprimée par les impérialistes [FRA.GetAdjective] depuis trois siècles."
bel_cityfall.5.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.5.b:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.5.c:0 "Ils ne savent même pas compter et ils nous battent ?"

bel_cityfall.6.t:0 "La Chute de Paris"
bel_cityfall.6.d:0 "Les soldats [BEL.GetAdjective] victorieux ont défilé ce matin sur les Champs-Élysées. Les bataillons [BEL.GetAdjective] ont pris position autour de la tour Eiffel, de l’hôtel Matignon et du palais du Luxembourg.\n\nPendant la retraite [FRA.GetAdjective], certains officiers [BEL.GetAdjective] ont profité de l’occasion pour visiter le Louvre, bien que presque tout ait été évacué. Pendant ce temps, le commandant des forces [BEL.GetAdjective] a proclamé aux Parisiens de ne pas craindre l’armée avancée, promettant un comportement humain."
bel_cityfall.6.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.6.b:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.6.c:0 "Ils ne savent même pas compter et ils nous battent ?"

bel_cityfall.7.t:0 "La Chute de Jérusalem"
bel_cityfall.7.d:0 "Les soldats [BEL.GetAdjective] victorieux sont entrés ce matin dans la vieille ville de Jérusalem. Les bataillons ont pris position sur et autour du mont du Temple et du Saint-Sépulcre.\n\nPendant la retraite des forces [ENG.GetAdjective], des officiers [BEL.GetAdjective] sont entrés dans le Saint-Sépulcre pour prier devant le tombeau du Christ et rendre hommage à Godefroy de Bouillon, le conquérant de Jérusalem lors de la première croisade. Léon Degrelle a salué cette grande victoire comme un signe que Dieu était à ses côtés dans la lutte de la civilisation européenne sacrée contre la barbarie judéo-bolchevique et ploutocratique."
bel_cityfall.7.a:0 "Le Lion [BEL.GetAdjective] Rugit à Nouveau !"
bel_cityfall.7.b:0 "Deus Vult !"
bel_cityfall.7.c:0 "Une contre-attaque sera indispensable !"

bel_cityfall.8.t:0 "La Chute de Rome"
bel_cityfall.8.d:0 "Des rapports confirment que les troupes [BEL.GetAdjective] ont pris le contrôle de Rome. Les derniers défenseurs ont tenté d’arrêter les troupes [BEL.GetAdjective] avant le pont Milvius, mais furent rapidement mis en déroute lorsque les [BEL.GetAdjective] pénétrèrent dans la ville par la Porta del Popolo. Un détachement fut immédiatement envoyé au Vatican pour assurer la sécurité du pape."
bel_cityfall.8.a:0 "Ces [BEL.GetAdjective] sont partout !"
bel_cityfall.8.b:0 "Nous avons montré le courage d’Ambiorix !"
bel_cityfall.8.c:0 "Nous ne devons pas abandonner Rome aux barbares !"

bel_cityfall.9.d:0 "Des rapports confirment que les troupes [BEL.GetAdjective] ont pris le contrôle de Rome. Les derniers défenseurs ont tenté d’arrêter les troupes [BEL.GetAdjective] avant le pont Milvius, mais furent rapidement mis en déroute lorsque les [BEL.GetAdjective] pénétrèrent dans la ville par la Porta del Popolo. Le commandant [BEL.GetAdjective] annonça que cela marquait une nouvelle étape de l’histoire romaine : le peuple de Rome est désormais libre de toute domination d’un sénat ploutocratique ou d’un chef religieux despotique ! Par la suite, toutes les inscriptions et monuments rappelant le fascisme furent systématiquement détruits. Le sort du pape reste inconnu, mais les croyants du monde entier comparent déjà cet événement au sac de Rome par les Vandales."
bel_cityfall.9.b:0 "Cela prouve qu’aucun dieu ne protège le pape !"


