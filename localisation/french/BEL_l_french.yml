form_united_netherlands_category2:0 "Unifier les Pays-Bas méridionaux"
form_united_netherlands_category2_desc:0 "Hormis le bref Royaume-Uni des Pays-Bas entre 1815 et 1830, les Pays-Bas méridionaux sont divisés depuis la sécession des sept provinces du nord avec l’Union d’Utrecht à la fin du XVIe siècle. Il est temps de les unifier à nouveau et d’éviter les erreurs du passé."
