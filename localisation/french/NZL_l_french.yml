 # Événements
 new_zealand.1.t: "Michael Savage tombe malade – Un nouveau Premier ministre doit être nommé"
 new_zealand.1.d: "Avec les tensions croissantes et l’état fragmenté du Parti travailliste, il nous faut choisir un successeur pour le Premier ministre Michael Joseph Savage, de plus en plus souffrant. Peter Fraser s’est révélé être un dirigeant compétent, soutenu à la fois par Walter Nash et par Savage lui-même. Cependant, cela n’empêche pas l’opposition de Savage, menée par Gervan McMillan, de pousser son agenda encore plus fort. McMillan, choix plus controversé, a exprimé des sympathies envers l’exclu travailliste John A. Lee, ce qui le rend profondément impopulaire."
 new_zealand.1.a: "Peter Fraser est la meilleure solution aux problèmes des travaillistes."
 new_zealand.1.b: "La modération de Gervan McMillan saura rassembler le Parti travailliste."
 new_zealand.1.c: "Le parti est trop divisé pour choisir, il nous faut plus de temps."
 new_zealand.2.t: "Mort de Michael Joseph Savage"
 new_zealand.2.d: "Le Premier ministre Michael Savage est décédé aujourd’hui, après avoir déclaré que la Nouvelle-Zélande se tiendrait aux côtés de la Grande-Bretagne. Un héros et un grand leader, qui n’avait pas peur de critiquer ce qu’il jugeait injuste, il manquera à tous. Le Parti travailliste doit maintenant s’ajuster à cette perte et préparer la nation à l’avenir."
 new_zealand.2.a: "Repose en paix."
 new_zealand.2.b: "Que le parti s’organise, l’heure est venue de bâtir un nouvel avenir."
 new_zealand.3.t: "Les élections générales de 1938"
new_zealand.3.d: "Les deux principaux partis qui s’affrontent lors de ces élections ont multiplié les promesses pour séduire l’opinion publique. Le Parti travailliste dirige la nation depuis un certain temps et s’est engagé à adopter la loi sur la sécurité sociale, qui prévoit des pensions de vieillesse et des allocations chômage. Cela s’est révélé être un excellent atout face au Parti national, qui critique ouvertement les politiques travaillistes. Bien que récent, le Parti national a gagné en popularité au fil des années, ralliant du soutien en exploitant les faiblesses du gouvernement travailliste. Même si l’élection semble pencher en faveur des travaillistes, le Parti national pourrait encore créer la surprise."
new_zealand.3.a: "Le Parti travailliste doit tenir ses promesses."
new_zealand.3.b: "Les travaillistes ont eu leur temps, la nation doit entreprendre les changements nécessaires."
new_zealand.3.c: "La Nouvelle-Zélande forgera son propre avenir, celui du peuple."
new_zealand.3.e: "La Légion guidera la Nouvelle-Zélande vers la gloire."
new_zealand.4.t: "Les restes de la Légion forcent les démissions des travaillistes"
new_zealand.4.d: "Après le décès du Premier ministre travailliste Michael Savage, les partisans de la Légion, menés par John Ormond, ont commencé à exiger la démission de figures travaillistes importantes comme Peter Fraser et Walter Nash. Le gouvernement travailliste, désormais affaibli par la perte de son chef et sans successeur clair, semble céder aux demandes d’Ormond sans grande résistance. Seul l’avenir dira si la Légion peut devenir un parti majeur dans la politique néo-zélandaise."
new_zealand.4.a: "La Légion est le meilleur espoir pour l’avenir de la Nouvelle-Zélande."
new_zealand.5.t: "Les journaux communistes se répandent dans tout le pays"
new_zealand.5.d: "De mystérieux journaux circulent de plus en plus dans les grandes villes, prônant un système directement opposé aux idéaux des restes de la Légion et du Parti travailliste. Nul ne connaît leur source, bien que l’on pense qu’ils proviennent de caches situées dans les campagnes. Certains se sont radicalisés en conséquence, et des émeutes ont éclaté dans tout le pays, exigeant la destitution de tous les responsables gouvernementaux, ainsi que la fin de la Légion et de son chef Ormond. Le Parti travailliste, sans chef, semble prêt à céder, tandis qu’Ormond menace de réprimer les émeutes avec ses propres partisans."
new_zealand.5.a: "Démissionnons, les communistes sont plus nombreux que nous."
new_zealand.5.b: "Réprimons immédiatement ces émeutes, elles ne feront qu’aggraver notre situation."
new_zealand.6.t: "Le gouverneur général rallie les loyalistes"
new_zealand.6.d: "Alors que le statut de dominion de la Nouvelle-Zélande est remis en question et que la monarchie retrouve tout son pouvoir en Grande-Bretagne, plusieurs partis suggèrent l’indépendance. Cependant, un puissant mouvement loyaliste mené par le gouverneur général George Monckton-Arundell tente de consolider le contrôle dans le pays. Ce mouvement a déjà provoqué des affrontements ouverts entre partis radicaux dans les rues de Wellington, poussant certains à douter de la sécurité nationale."
new_zealand.6.a: "Laissons le gouverneur présenter ses exigences, la Nouvelle-Zélande reste aux côtés de la Grande-Bretagne."
new_zealand.6.b: "Écrasons immédiatement les mouvements loyalistes, ils menacent notre sécurité."
new_zealand.9.t: "Les communistes chassent les travaillistes et la Légion"
new_zealand.9.d: "Avec la popularité croissante du parti communiste, le peuple s’est soulevé contre la Légion nouvellement relancée, surtout après l’effondrement du gouvernement travailliste. Débordé, M. Ormond a démissionné, laissant l’avenir de la Nouvelle-Zélande entre les mains du Parti communiste."
new_zealand.10.t: "Sidney Holland prend le contrôle"
new_zealand.10.d: "Adam Hamilton a démissionné de la direction du Parti national et du poste de Premier ministre, laissant la place vacante pour Sidney Holland. Ce dernier s’est montré un digne successeur et a déclaré vouloir poursuivre l’agenda du Parti national."
new_zealand.10.a: "Holland montre un grand potentiel."

