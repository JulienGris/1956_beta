 ### AXES NATIONAUX

 ## BRANCHE ARMÉE
 NZL_army_review: "Revue de l’armée en [GetYear]"
 NZL_army_review_desc: "Alors que les tensions mondiales augmentent, nous devrions encourager l’état-major à entreprendre une revue complète de l’armée nationale, afin d’évaluer les avantages et les faiblesses de notre structure, de notre équipement et de nos stratégies actuelles."
 NZL_a_reinvigorated_force: "Une armée revigorée"
 NZL_a_reinvigorated_force_desc: "Notre armée n’est peut-être pas la plus redoutable du monde, mais grâce à des investissements accrus dans l’équipement, des programmes de formation modernes et une planification stratégique, nous sommes désormais bien plus solides. Bien que de taille modeste, l’armée néo-zélandaise devient une force plus compétente et professionnelle, prête à défendre notre nation et à contribuer à la stabilité mondiale."
 NZL_adopt_blitskrieg_tactics: "Adopter les tactiques de Blitzkrieg"
 NZL_adopt_blitskrieg_tactics_desc: ""
 NZL_the_horses_are_better: "Une armée basée sur la cavalerie"
 NZL_the_horses_are_better_desc: ""
 NZL_new_zealand_will_not_fall: "La Nouvelle-Zélande ne tombera pas"
 NZL_improve_the_radars: "Améliorer nos radars"
 NZL_improve_the_radars_desc: "Nos radars sont incroyablement dépassés, et puisque la guerre navale évolue, notre technologie doit évoluer aussi."
 NZL_waiouru_excercises: "Tenir des exercices militaires à Waiouru"
 NZL_waiouru_excercises_desc: "Les terrains d’entraînement de Waiouru sont un pilier de la formation de notre armée. Avec la revue de l’armée en cours, nous devrions entraîner nos forces dans un exercice prolongé, afin de nous assurer qu’elles sont prêtes à affronter les réalités difficiles de terrains hostiles tout en conservant efficacité et sang-froid au combat."
 NZL_conscript_the_sheep: "Envoyons les moutons !"
 NZL_conscript_the_sheep_desc: ""
 # ANZAC/CANBERRA PACT/ANZUS
 NZL_open_ties_with_washington: "Ouvrir des relations avec Washington"
 NZL_open_ties_with_washington_desc: "Les Américains jouent un rôle crucial dans le monde moderne, et établir des liens plus forts avec eux s’avérera sans aucun doute avantageux, offrant des opportunités de collaboration ainsi qu’un accès à des ressources et à un soutien précieux."
 NZL_reaffirm_commonwelth_commitments: "Engagements du Commonwealth"
 NZL_reaffirm_commonwelth_commitments_desc: ""
 NZL_ford_munition_plant: "Usine de munitions Ford"
 NZL_ford_munition_plant_desc: "Faire appel à des entreprises américaines pour construire des usines de munitions dans notre pays renforcerait notre capacité industrielle, garantissant un approvisionnement régulier en armements vitaux tout en bénéficiant de leur expertise et de leurs techniques de fabrication avancées."
 NZL_anzus_treaty: "Signer le traité de l’ANZUS"
 NZL_anzus_treaty_desc: ""
 NZL_mutual_aid_agreement: "Accord d’aide mutuelle"
 NZL_mutual_aid_agreement_desc: ""
 NZL_australian_nzl_agreement: "Accord ANZAC"
 NZL_australian_nzl_agreement_desc: "Pour protéger nos intérêts dans le Pacifique, il est essentiel de collaborer étroitement avec nos nations voisines. La menace rapide de la guerre et l’expansion des empires nécessitent des efforts communs pour assurer la stabilité régionale, la sécurité et la défense des valeurs et de la souveraineté partagées."
 
 # ANZAC/CANBERRA/ANZUS - FIN
 # BRANCHE EFFORT DE GUERRE
 NZL_serving_the_empire: "Servir l’Empire"
 NZL_serving_the_empire_desc: "Un sage Français a un jour déclaré : « La tyrannie, comme l’enfer, n’est pas aisément vaincue ; mais nous avons cette consolation : plus la lutte est rude, plus la victoire est magnifique. » Ainsi, notre résolution ne faiblira jamais : nous affronterons la tyrannie où qu’elle se trouve et où qu’elle puisse apparaître."
 NZL_adapt_to_the_jungles:  "S’adapter à la guerre dans la jungle"
 NZL_adapt_to_the_jungles_desc: "Nous devons préparer nos forces à combattre efficacement dans les environnements difficiles de la jungle du Pacifique. En développant des programmes d’entraînement spécialisés, en équipant nos soldats de matériel approprié et en adoptant des tactiques adaptées à un terrain dense et impitoyable, nous pouvons garantir que nos troupes seront prêtes à relever ce défi unique."
 NZL_the_second_nzl_volunteer_force: "La seconde force volontaire"
 NZL_the_second_nzl_volunteer_force_desc: "En cas de guerre, la Nouvelle-Zélande doit lever des troupes pour se protéger et protéger ses alliés."
 NZL_new_zealand_special_forces: "1er régiment S.A.S néo-zélandais"
 NZL_new_zealand_special_forces_desc: "Les forces spéciales ont désormais leur place dans la guerre. Les adopter serait un excellent choix."
 NZL_hot_climate_equipment: "Obtenir un équipement pour climat chaud"
 NZL_hot_climate_equipment_desc: "Nous devrions obtenir un équipement adapté aux climats chauds car, en cas de guerre, nos unités pourraient être déployées dans des zones où cela sera nécessaire."
 NZL_supply_food_stuffs: "Fournir des vivres en échange d’équipement"
 NZL_supply_food_stuffs_desc: "Même si nous n’avons pas les ressources pour déployer un grand nombre de soldats ou fournir des quantités importantes d’équipement, nous pouvons offrir un soutien précieux sous forme de vivres. Ces provisions pourraient constituer une aide cruciale, voire faciliter un échange pour l’équipement nécessaire."
 NZL_army_of_thieves: "« Une armée de voleurs »"
 NZL_army_of_thieves_desc: "Certaines de nos divisions de première ligne en sont venues à « s’approprier » l’équipement ennemi. Si certains nous qualifient de « voleurs », nous préférons parler de « réquisition sur place » et de « réduction du fardeau logistique du combat ». Cet esprit d’ingéniosité doit se diffuser à l’ensemble de nos forces armées !"

 ## BRANCHE ARMÉE – SUITE
 NZL_munition_companies_investments: "Étendre l’usine de munitions coloniale"
 NZL_munition_companies_investments_desc: "Notre premier pas pour créer une armée améliorée consiste à investir dans les entreprises qui fournissent et fabriquent l’équipement de nos soldats."
 NZL_remember_anzac: "Leçons de la Grande Guerre"
 NZL_remember_anzac_desc: "Les sacrifices des forces ANZAC durant la Grande Guerre nous rappellent le coût du conflit. Les leçons de campagnes comme Gallipoli façonnent les améliorations actuelles de la stratégie militaire, en mettant l’accent sur la flexibilité, la préparation et des tactiques plus intelligentes. Nous honorons leur mémoire en cherchant à renforcer et à perfectionner notre armée, de peur d’oublier."
 NZL_womens_auxiliary_army: "Corps auxiliaire féminin de l’armée"
 NZL_womens_auxiliary_army_desc: "La création du corps auxiliaire féminin permettra aux femmes d’occuper des rôles non-combat vitaux – travaux administratifs, logistique, mécanique et communications – renforçant ainsi les opérations militaires et permettant à davantage d’hommes de servir en première ligne."
 NZL_motorization_efforts: "Motoriser l’armée"
 NZL_motorization_efforts_desc: "Avec la mise en place d’un corps logistique élargi et les besoins croissants de notre armée en moyens de transport plus efficaces, un effort ciblé vers la motorisation serait extrêmement bénéfique. Améliorer la mobilité grâce aux véhicules modernes rationaliserait la logistique, améliorerait l’efficacité de la chaîne d’approvisionnement et assurerait un déploiement plus rapide des ressources sur les lignes de front."
 NZL_new_charlton_automatic_rifles: "Nouveaux fusils automatiques Charlton"
 NZL_new_charlton_automatic_rifles_desc: "Nous devons adopter de nouveaux fusils en prévision de tout futur conflit."
 NZL_expand_our_tank_warfare: "Le concept de la guerre blindée"
 NZL_expand_our_tank_warfare_desc: "Notre nation n’est pas réputée pour son expertise dans la guerre mécanisée, mais le ministre des Travaux publics a présenté un concept ambitieux et ingénieux. Face aux pénuries mondiales d’équipement, il propose de développer un véhicule blindé indigène utilisant des matériaux locaux et de l’ingéniosité. Bien qu’inhabituelle, cette initiative reflète notre détermination à renforcer nos défenses."
 NZL_pursue_indigenous_designs: "Le prototype Schofield"
 NZL_pursue_indigenous_designs_desc: "Nous devrions développer le char Schofield, un modèle indigène conçu pour protéger notre nation. Son système unique roue-chenille offre une flexibilité sur divers terrains, le rendant idéal pour nos paysages variés. Contrairement aux modèles étrangers, le char Schofield incarne une approche autonome, adaptée à nos besoins et à notre environnement."
 NZL_abandon_and_combat_enemy_armour: "Combattre les blindés ennemis"
 NZL_abandon_and_combat_enemy_armour_desc: "Nous devrions abandonner notre poursuite de la guerre blindée et plutôt nous concentrer sur le développement de stratégies efficaces pour contrer les blindés ennemis. En investissant dans des armes antichars avancées, comme l’artillerie lourde, les lance-roquettes et des tactiques d’infanterie spécialisées, nous pouvons neutraliser la menace des unités blindées plus efficacement."
 NZL_bren_transport_carrier: "Le transporteur Bren"
 NZL_bren_transport_carrier_desc: "Le ministère de la Défense a suggéré le développement de véhicules chenillés polyvalents, tels que le transporteur Bren, afin de relever les défis des terrains difficiles. Ces véhicules garantiront un déplacement efficace des troupes, des munitions et des ravitaillements."
 NZL_foundations_of_an_aritllery_regiment: "Les fondations d’un régiment d’artillerie"
 NZL_foundations_of_an_aritllery_regiment_desc: "Un régiment d’artillerie est essentiel dans toute armée, nous devrions en créer un nous-mêmes."
 NZL_the_charlton_rifle: "Le fusil Charlton"
 NZL_the_charlton_rifle_desc: "Philip Charlton, un concepteur, a proposé de convertir des fusils Lee-Enfield excédentaires en armes semi-automatiques, afin de pallier le manque de puissance de feu moderne de notre pays. Son design innovant offre plus d’efficacité et de puissance de feu. Nous devrions étudier sa proposition pour renforcer nos capacités militaires avec des ressources limitées."
 NZL_engineer_and_supply_corp: "Le corps du génie et de l’intendance"
 NZL_engineer_and_supply_corp_desc: "Développons davantage notre armée en ajoutant de nouvelles branches qui pourraient se révéler utiles."

 ## AVIATION
 
 NZL_construct_the_whenuapai_base: "Construire la base de Whenuapai"
 NZL_construct_the_whenuapai_base_desc: "Nos avions ont besoin d’un lieu à la fois pour l’entraînement et pour l’entretien. Construire de nouvelles bases aériennes ou moderniser celles existantes répondra à ces besoins."
 NZL_bomber_production: "Développer des avions pour le Commonwealth"
 NZL_bomber_production_desc: "Notre éloignement de l’Europe ferait de notre pays un endroit idéal pour développer des avions en cas de guerre."
 NZL_goverment_funded_aircraft_production: "Accroître les capacités de production aéronautique"
 NZL_goverment_funded_aircraft_production_desc: ""
 NZL_commonwealth_training_idea: "Programme de formation aérienne de l’Empire"
 NZL_commonwealth_training_idea_desc: "En tant que contributeur essentiel au programme de formation aérienne du Commonwealth, nous avons consacré nos ressources à former et équiper une nouvelle génération de personnels navigants qualifiés."
 NZL_close_air_support: "Avions d’appui rapproché"
 NZL_close_air_support_desc: "Pour accroître l’efficacité de nos forces terrestres et assurer des capacités de réaction rapide, nous devons développer et déployer des avions spécialisés dans l’appui aérien rapproché."
 NZL_tactical_bombing: "Avions de destruction stratégique"
 NZL_tactical_bombing_desc: "Pour affaiblir la capacité de nos ennemis à poursuivre le combat, nous devons développer et déployer des avions capables d’atteindre leurs territoires pour mener des destructions stratégiques. En poursuivant le développement d’avions à long rayon d’action, nous gagnerons la capacité de frapper profondément derrière les lignes ennemies, en ciblant les infrastructures critiques, les chaînes logistiques et les centres de commandement."
 NZL_allocate_resources_to_the_rnzf: "Allouer des ressources à la RNZAF"
 NZL_allocate_resources_to_the_rnzf_desc: "Nous devons acquérir davantage d’avions pour accroître nos effectifs et renforcer notre position, nous donnant une meilleure chance de survivre et de nous défendre. En renforçant notre aviation, nous pourrons disposer des ressources nécessaires pour relever les défis à venir et augmenter nos chances globales de succès."
 NZL_aircraft_research_group: "Développer une production aéronautique nationale"
 NZL_aircraft_research_group_desc: "Nous devons moderniser nos avions et nous concentrer sur la production nationale, en reconnaissant que se reposer uniquement sur l’achat d’appareils auprès de nos alliés pourrait ne pas être viable lors d’un futur conflit. Pour garantir notre souveraineté et notre sécurité, il est crucial de développer nos propres capacités de conception et de fabrication d’avions modernes."
 NZL_into_the_jet_age: "Entrer dans l’ère du jet"
 NZL_into_the_jet_age_desc: "Alors que nous entrons dans l’ère des jets, nous devrions nous engager à développer des technologies avancées afin de renforcer nos capacités de défense et de rester en avance dans la guerre moderne. Reconnaissant l’évolution rapide de l’aviation, nous devons nous assurer que notre armée de l’air dispose de la vitesse, de l’agilité et de la précision nécessaires pour affronter nos ennemis."
 NZL_pilot_recruitment_drive: "Campagne de recrutement de pilotes"
 NZL_pilot_recruitment_drive_desc: "Pour garantir la disponibilité de personnel dans notre armée de l’air, nous devons encourager la formation d’une nouvelle génération d’aviateurs et de personnels de soutien dévoués, compétents et déterminés à protéger notre ciel national."
 NZL_strenghten_british_ties: "Renforcer les liens avec [ENG.GetAdjective]"
 NZL_strenghten_british_ties_desc: "Reconnaissant l’importance historique de notre relation, nos compatriotes ont exprimé leur mécontentement face aux limites de l’autonomie au sein de l’Empire, et certains questionnent à quel point nous devrions rester étroitement liés à la Grande-Bretagne. Cependant, en réaffirmant notre engagement envers la Couronne, nous pouvons assurer une voie qui concilie nos intérêts nationaux avec les avantages d’un partenariat continu."
 NZL_develop_anti_air_capabilities: "Développement antiaérien"
 NZL_develop_anti_air_capabilities_desc: ""
 NZL_empire_air_training_scheme: "« Le Plan »"
 NZL_empire_air_training_scheme_desc: "En réponse au besoin croissant de personnels navigants pour défendre le ciel, nous joindrons nos forces à celles de nos alliés du Commonwealth afin de mettre en place un vaste programme de formation aérienne. En contribuant à ce plan, nous formerons une génération hautement qualifiée de pilotes, navigateurs et personnels de soutien aérien."
 NZL_womens_auxiliary_air_force: "L’auxiliaire féminin de l’Armée de l’air"
 NZL_womens_auxiliary_air_force_desc: "N/A"
 NZL_form_the_new_zealand_air_force: "Une aviation en développement"
 NZL_form_the_actual_new_zealander_airforce: "Établir la RNZAF"
 NZL_form_the_actual_new_zealander_airforce_desc: "Avec l’importance croissante de la puissance aérienne et la nécessité d’une armée de l’air dédiée, il est temps de fonder pleinement la Royal New Zealand Air Force comme une branche militaire indépendante. N’étant plus simplement une extension de l’armée, la RNZAF disposera désormais de sa propre structure de commandement et de ses propres ressources."
 NZL_formed_the_new_zealand_air_force: "La Royal New Zealand Air Force"
 NZL_aircraft_engine_upgrades: "Nouveaux prototypes de moteurs"
 NZL_aircraft_engine_upgrades_desc: ""
 NZL_taranaki_oil_field: "Exploiter les champs pétrolifères de Taranaki"
 NZL_taranaki_oil_field_desc: "Avec la présence aérienne croissante dans notre pays et nos réserves de carburant qui s’épuisent rapidement, nous faisons face à des défis urgents. Bien que nos ressources nationales soient limitées, nous possédons de petits gisements pétroliers qui, s’ils sont exploités, pourraient fournir des approvisionnements cruciaux. Exploiter ces champs pourrait offrir une solution vitale, aidant à sécuriser les ressources nécessaires à notre survie et à notre défense en ces temps difficiles."
 ## INDUSTRIE
 NZL_industrialization_fund: "Établir le Fonds d’Industrialisation"
 NZL_industrialization_fund_desc: "L’avenir économique de notre nation dépend d’une action audacieuse pour moderniser notre industrie. Ce fonds fournira les ressources essentielles pour alimenter la modernisation, soutenir la construction de nouvelles usines, moderniser les infrastructures obsolètes et stimuler l’investissement privé."
 NZL_end_sustenance_work: "Mettre fin aux programmes de travail de subsistance"
 NZL_end_sustenance_work_desc: "Les programmes d’urgence de travail de subsistance de la Grande Dépression ont apporté un soulagement vital en temps de crise, mais ils ne constituent plus une solution durable pour notre main-d’œuvre. Il est temps de passer de mesures temporaires à des emplois stables et durables."
 NZL_modernize_railways: "Revitaliser les chemins de fer"
 NZL_modernize_railways_desc: "Le réseau ferroviaire vieillissant a un besoin urgent de modernisation pour répondre aux exigences d’une nation en pleine croissance. En modernisant les voies, en augmentant la capacité de fret et en introduisant des locomotives modernes, nous pouvons transformer le transport ferroviaire en un système plus rapide et plus fiable."
 NZL_connect_the_nation: "Financer le Conseil national des routes"
 NZL_connect_the_nation_desc: "Nos routes nécessitent d’importantes améliorations pour mieux servir la nation. En améliorant les infrastructures, nous rendrons les déplacements plus efficaces, tant pour les civils que pour l’armée."
 NZL_modernize_hydroelectric_power: "Moderniser l’énergie hydroélectrique"
 NZL_modernize_hydroelectric_power_desc: "La centrale de Waitaki, pierre angulaire du réseau hydroélectrique naissant de la Nouvelle-Zélande, possède un potentiel inexploité de modernisation. En modernisant ses infrastructures et en étendant les opérations vers le sud, nous assurerons une alimentation fiable et renouvelable pour les communautés rurales et les industries en expansion."
 NZL_aquire_foreign_machinery: "Acquérir des machines modernes"
 NZL_aquire_foreign_machinery_desc: "Pour répondre aux besoins d’une économie en expansion, nous devons investir dans des machines modernes pour nos industries urbaines. En remplaçant les équipements obsolètes et en adoptant des techniques de fabrication avancées, nous pourrons accroître considérablement l’efficacité et la capacité industrielle."
 NZL_the_wairarapa_sheep_cattle_farm: "Développer l’élevage dans le Wairarapa"
 NZL_the_wairarapa_sheep_cattle_farm_desc: "Les plaines fertiles du Wairarapa sont depuis longtemps un pilier du succès agricole de la Nouvelle-Zélande, dominées par les élevages ovins. En diversifiant vers l’élevage bovin à grande échelle, nous pourrons ouvrir de nouvelles opportunités économiques dans la production de viande et de produits laitiers."
 NZL_new_zealand_steel_works: "Sidérurgie néo-zélandaise"
 NZL_new_zealand_steel_works_desc: "L’acier de notre nation peut être utilisé pour de multiples usages, ce qui nous donne toutes les raisons d’en accroître la production."
 NZL_resource_imports: "Adopter de nouvelles doctrines commerciales"
 NZL_resource_imports_desc: "Si nous voulons maintenir une production suffisante, nous devons réexaminer où nos ressources naturelles sont investies."
 NZL_prioritize_rural_growth: "Privilégier l’investissement rural"
 NZL_prioritize_rural_growth_desc: "Nous devrions encourager la croissance des zones rurales néo-zélandaises en revitalisant notre secteur agricole et en renforçant les communautés qui en dépendent. En améliorant les infrastructures, en soutenant les agriculteurs avec des techniques modernes et en investissant dans les industries locales, nous pourrons assurer la prospérité de nos campagnes."
 NZL_prioritize_city_growth: "Renforcer les zones urbaines"
 NZL_prioritize_city_growth_desc: "Nous devrions donner la priorité à l’expansion et au développement des centres commerciaux en Nouvelle-Zélande. En développant nos villes, nous pourrons stimuler la croissance économique, attirer des investissements et créer des emplois. Le renforcement des zones urbaines favorisera le commerce, l’industrie et l’innovation."
 NZL_industrialize_christchurch: "Industrialiser Christchurch"
 NZL_industrialize_christchurch_desc: "Nous devrions développer Christchurch en un autre grand centre industriel de Nouvelle-Zélande. En investissant dans des secteurs clés tels que la fabrication, les infrastructures et l’innovation technologique, nous pourrons transformer la ville en un moteur de croissance nationale."
 NZL_expand_auckland_industrial_park: "Parc industriel d’Auckland"
 NZL_expand_auckland_industrial_park_desc: "Nous devrions faire du parc industriel d’Auckland un centre clé du commerce maritime et de la construction navale. En développant des cales modernes pour la construction et l’entretien des navires, ainsi qu’en élargissant les infrastructures portuaires, nous pourrons faire d’Auckland un pôle de commerce et d’industrie maritime de premier plan."
 NZL_open_pike_river_mine: "Accroître les opérations minières"
 NZL_open_pike_river_mine_desc: "Nous devons renforcer nos efforts d’extraction de charbon dans la région pour stimuler l’industrialisation et soutenir la croissance économique. En augmentant les opérations, nous pourrons accroître la production, créer des emplois et consolider les industries locales tout en respectant les pratiques durables et les normes de sécurité."
 NZL_the_inudtrial_segment: "Industrialiser les communautés rurales"
 NZL_the_inudtrial_segment_desc: "La Nouvelle-Zélande possède encore des terres propices à la construction de nouvelles villes et de centres industriels. Nous devrions exploiter ce potentiel."
 NZL_the_wairarapa_sheep_farms: "Les fermes ovines du Wairarapa"
 NZL_the_wairarapa_sheep_farms_desc: "Nous pouvons réaffecter les bénéfices générés par nos vastes exploitations agricoles pour soutenir l’effort de guerre. En utilisant la richesse produite par l’agriculture, nous avons une opportunité unique de financer les besoins militaires essentiels, de l’approvisionnement aux infrastructures, sans surcharger l’économie nationale."
 NZL_industrial_awakening: "Programme d’urbanisation extensive"
 NZL_industrial_awakening_desc: "Plusieurs villes portuaires connaissent déjà une forte croissance économique et démographique. Si nous continuons à encourager cette expansion, le pays tout entier en bénéficiera."
 NZL_distribute_the_national_defense_budget: "Répartir le budget de la défense"
 NZL_distribute_the_national_defense_budget_desc: "Un budget accru pour nos forces de défense est nécessaire dans le climat international actuel."
 NZL_the_tsunami_project: "Le projet Tsunami"
 NZL_the_tsunami_project_desc: "Collaborer avec les Américains au développement d’une arme révolutionnaire, comme la bombe tsunami du Projet Seal, pourrait devenir une priorité. Cette initiative expérimentale visait à créer une arme capable de déclencher d’immenses vagues destructrices, offrant un moyen novateur de défendre notre île face à d’éventuelles menaces."
 NZL_hire_physicists: "Financer directement l’Université d’Auckland"
 NZL_hire_physicists_desc: "Afin de développer les connaissances scientifiques et de soutenir d’éventuels projets militaires, nous devrions recruter davantage de physiciens."
 NZL_massey_university: "Financer l’Université Massey"
 NZL_massey_university_desc: "N/A"

 ## McMillan – Aile gauche du Parti travailliste
 NZL_trust_in_the_opposition: "Faire confiance à l’opposition"
 NZL_trust_in_the_opposition_desc: "McMillan a été choisi pour diriger le Parti travailliste. Pour réussir, il doit gagner la confiance de la nation."
 NZL_public_health_service: "Service public de santé"
 NZL_public_health_service_desc: "Mettre en place un service public de santé est une étape cruciale dans le programme social du Parti travailliste."
 NZL_research_grants: "Subventions à la recherche"
 NZL_research_grants_desc: "Le Parti travailliste considère la recherche comme un pilier de la croissance nationale. Son budget doit donc être augmenté."
 NZL_review_the_prison_system: "Réformer le système carcéral"
 NZL_review_the_prison_system_desc: "Le système pénitentiaire est fondamentalement défaillant dans notre pays. Nous devrions chercher à l’améliorer."
 NZL_reconcile_political_opponents: "Rapprocher les opposants politiques"
 NZL_reconcile_political_opponents_desc: "John A. Lee a toujours été un leader talentueux. Le réintégrer pourrait nous permettre d’utiliser ses compétences."
 NZL_denounce_conservative_politicians: "Dénoncer les conservateurs"
 NZL_denounce_conservative_politicians_desc: "Les idéaux conservateurs freinent le progrès de notre nation. Nous devons mobiliser toutes nos ressources pour les réduire au silence."

 ## Fraser – Aile droite du Parti travailliste
 NZL_frasers_leadership: "Le leadership de Fraser"
 NZL_frasers_leadership_desc: "Peter Fraser s’est montré un dirigeant compétent, digne de guider notre nation à travers ces temps difficiles."
 NZL_begin_lobbying_for_reforms: "Commencer le lobbying pour des réformes"
 NZL_begin_lobbying_for_reforms_desc: "Entamons un travail de lobbying auprès du nouveau gouvernement travailliste afin d’obtenir des réformes."
 NZL_rally_the_opponents: "Rassembler les opposants"
 NZL_rally_the_opponents_desc: "Nous devons coopérer avec tous nos opposants, même ceux situés hors du Parti travailliste, pour faire avancer la nation."
 NZL_attempt_at_a_war_economy: "Tenter une économie de guerre"
 NZL_attempt_at_a_war_economy_desc: "L’économie néo-zélandaise n’a jamais été pensée pour un conflit majeur, mais aujourd’hui plus que jamais, il est essentiel d’essayer de la transformer en une économie de guerre."
 NZL_lower_labor_wages: "Réduire les salaires"
 NZL_lower_labor_wages_desc: "Afin de soutenir notre mobilisation, nous devons réduire certains salaires pour stimuler davantage notre économie."
 NZL_silence_the_discontent: "Faire taire le mécontentement"
 NZL_silence_the_discontent_desc: "Certains s’opposent à nos lois de mobilisation plus strictes. Nous devons les censurer avant que ces idées ne se répandent."
 NZL_fight_for_control_over_our_soldiers: "Introduire la conscription"
 NZL_fight_for_control_over_our_soldiers_desc: "Notre pays a besoin de plus d’hommes en cas de conflit. Bien que cette mesure soit impopulaire, il est peut-être temps de rétablir la conscription."
 ## Fraser - Fin
 
 ## Travaillistes principaux – Cabinet Savage
 NZL_the_labour_partys_reform: "Le cabinet Savage"
 NZL_the_labour_partys_reform_desc: "Michael Savage et le Parti travailliste ont promis plusieurs réformes aux habitants de Nouvelle-Zélande. Il est maintenant temps de commencer à les mettre en œuvre."
 NZL_critize_uk_foreign_policy: "Critiquer l’apaisement"
 NZL_critize_uk_foreign_policy_desc: "L’apaisement n’est pas une forme légitime de diplomatie. Même si nous sommes les seuls à défendre ce point de vue, il est important de le faire savoir au Royaume-Uni."
 NZL_universal_medical_benefits: "Avantages médicaux universels"
 NZL_universal_medical_benefits_desc: "Fournir à tous les citoyens des soins de santé de base est une étape essentielle vers l’adoption de la loi."
 NZL_nationalize_commerical_broadcasting: "Nationaliser la radiodiffusion commerciale"
 NZL_nationalize_commerical_broadcasting_desc: "Le gouvernement doit contrôler les radios pour garantir une publicité éthique."
 NZL_state_controlled_bank: "Créer des banques de réserve contrôlées par l’État"
 NZL_state_controlled_bank_desc: "Nous avons tiré des leçons de la Dépression, dont l’une est d’assurer la sécurité du système bancaire."
 NZL_the_social_security_acts: "La loi sur la sécurité sociale"
 NZL_the_social_security_acts_desc: "Le Parti travailliste promet depuis longtemps cette loi, qui garantira à la Nouvelle-Zélande des programmes progressistes accessibles à tous."
 NZL_the_goodwill_mission: "Mission de bonne volonté"
 NZL_the_goodwill_mission_desc: "Nous devrions engager des discussions avec le mouvement Mau à Samoa pour préparer la voie à l’indépendance, le retour d’Olaf Nelson d’exil et d’autres points clés. Ces négociations visent à garantir une transition pacifique et à renforcer les liens entre Samoa et la Nouvelle-Zélande."
 NZL_unenmployment_benefit: "Allocation chômage"
 NZL_unenmployment_benefit_desc: "Un des volets de la loi sur la sécurité sociale prévoit une allocation chômage pour réduire la pauvreté."
 NZL_construct_state_housing: "Construire des logements sociaux"
 NZL_construct_state_housing_desc: "Des logements pour ceux qui n’ont pas les moyens d’acheter une maison sont indispensables dans tout pays moderne."
 NZL_old_age_pension: "Pension de vieillesse"
 NZL_old_age_pension_desc: "Il est du devoir du gouvernement de prendre soin de ses aînés qui ont consacré leur vie à cette nation."
 NZL_dedicate_men: "Dédier des hommes à l’effort de guerre"
 NZL_national_party_triumphant: "Le Parti national triomphant"
 NZL_national_party_triumphant_desc: "Depuis trop longtemps, le Parti travailliste promet des programmes vides. Le Parti national peut accomplir de réels objectifs et corriger leurs erreurs."
 NZL_appeal_rural_communities: "Séduire les communautés rurales"
 NZL_appeal_rural_communities_desc: "Notre base principale se trouve dans les petites villes rurales de Nouvelle-Zélande. Nous devons les satisfaire pour conserver notre position."
 NZL_condem_intervention: "Condamner l’interventionnisme"
 NZL_condem_intervention_desc: "Le gouvernement ne doit pas interférer dans les affaires privées ni intervenir dans l’économie."
 NZL_absorb_conservative_remains: "Absorber les partis conservateurs"
 NZL_absorb_conservative_remains_desc: "Certains membres du Parti travailliste partagent nos idées. Nous pourrions tirer parti de leurs compétences."
 NZL_equality_conscription: "Égalité par la conscription"
 NZL_equality_conscription_desc: "Les natifs doivent également être conscrits, leur statut ne les exonère pas de leur devoir envers la patrie."
 NZL_fight_militant_worker_union: "Combattre les syndicats ouvriers militants"
 NZL_fight_militant_worker_union_desc: "Certains syndicats ne se laissent pas amadouer par de meilleurs salaires. Si nous devons les arrêter, alors ainsi soit-il."
 NZL_tackle_inflation: "Lutter contre l’inflation"
 NZL_tackle_inflation_desc: "Nous devons prendre des mesures avant que l’inflation ne devienne un vrai problème."
 NZL_war_council: "Conseil consultatif de guerre"
 NZL_war_council_desc: "La création d’un conseil de guerre multipartite pourrait améliorer l’efficacité de notre armée."
 NZL_open_up_to_free_market: "S’ouvrir au libre marché"
 NZL_open_up_to_free_market_desc: "L’ouverture au libre marché est notre objectif principal. Après notre victoire électorale, nous pouvons enfin le réaliser."
 NZL_combined_intelligence_centre: "Centre de renseignement conjoint"
 NZL_combined_intelligence_centre_desc: "Nous devons coopérer avec le Royaume-Uni pour intercepter et décrypter les messages codés."
 NZL_construct_shore_fortification: "Construire des fortifications côtières"
 NZL_construct_shore_fortification_desc: "Nous devons préparer nos côtes contre toute invasion et assurer notre sécurité."
 NZL_unite_communist_movements: "Unifier les mouvements communistes"
 NZL_unite_communist_movements_desc: "Le mouvement communiste en Nouvelle-Zélande n’est pour l’instant qu’un groupe marginal. Pour prendre de l’ampleur, il doit s’unifier en un seul parti."
 NZL_lobby_soviet: "Faire pression en Union soviétique"
 NZL_lobby_soviet_desc: "L’URSS sera notre investisseur le plus crucial si nous prenons le pouvoir. Il est nécessaire de sécuriser son soutien."
 NZL_the_peoples_voice: "La Voix du Peuple"
 NZL_the_peoples_voice_desc: "La Voix du Peuple est notre outil le plus puissant pour diffuser nos idéaux. Assurons-nous qu’elle continue d’être publiée."
 NZL_invite_radical_labour_exiles: "Inviter les exilés travaillistes radicaux"
 NZL_invite_radical_labour_exiles_desc: "John A. Lee et Bill Barnard pourraient sympathiser avec notre cause. Leurs compétences et leur influence ne doivent pas être négligées."
 NZL_new_wave_of_feminism: "Nouvelle vague de féminisme"
 NZL_new_wave_of_feminism_desc: "Dans notre nouvel État, tous doivent être égaux devant la loi, y compris les deux sexes."
 NZL_maori_equality: "Égalité des Māoris"
 NZL_maori_equality_desc: "Le peuple māori a été opprimé bien trop longtemps. Il mérite les mêmes droits que tous nos autres citoyens."
 NZL_nationalize_bank: "Nationaliser la Banque de Nouvelle-Zélande"
 NZL_nationalize_bank_desc: "La Banque de Nouvelle-Zélande doit être nationalisée pour garantir une croissance économique durable."
 NZL_public_housing: "Prioriser le logement public"
 NZL_public_housing_desc: "Fournir des conditions de vie de base aux citoyens qui ne peuvent les assumer montrera le progressisme de notre nation."
 NZL_encourage_selfless_citizens: "Encourager le civisme"
 NZL_encourage_selfless_citizens_desc: "Altruisme et vertu sont des qualités essentielles pour survivre. Nous n’avons pas de place pour la lâcheté."
 NZL_join_sov: "Alliance avec l’Union soviétique"
 NZL_join_sov_desc: "Nous sommes dépassés et entourés d’ennemis. Pour survivre, nous devons nous allier aux champions du communisme."
 NZL_neutral: "Stabiliser les affaires intérieures"
 NZL_neutral_desc: "Consolider notre autorité sur le pays est plus important que de s’égarer dans les affaires étrangères."
 NZL_increased_defense_spending: "Augmenter les dépenses de défense"
 NZL_increased_defense_spending_desc: "La guerre exige du matériel moderne et nous ne pouvons pas nous reposer uniquement sur nos alliés."
 NZL_central_research_planning: "Planification centralisée de la recherche"
 NZL_central_research_planning_desc: "Planifier l’économie signifie aussi orienter les scientifiques vers les technologies dont l’État aura besoin, comme si une grande intelligence choisissait les meilleures options d’avenir."
 NZL_national_research_grants: "Subventions nationales à la recherche"
 NZL_national_research_grants_desc: "Nous devons miser sur nos propres innovations, réputées supérieures aux étrangères. C’est ainsi que les habitants de ces îles ont éliminé des oiseaux dangereux plutôt que de perdre contre eux."
 NZL_corporate_innovations: "Innovations d’entreprise"
 NZL_corporate_innovations_desc: "Le secteur privé sait développer de nouvelles technologies, et la concurrence mettra en avant le meilleur de notre pays."
 NZL_paratrooper_units: "Priorité aux parachutistes"
 NZL_paratrooper_units_desc: "Nous ne pourrons peut-être pas percer par la mer, mais le ciel reste une autre possibilité."
 NZL_naval_equipment: "Équipements navals"
 NZL_naval_equipment_desc: "Une coque moderne n’est rien sans équipements modernes."

 # IDÉES
 ###################
 # Armée
 NZL_memories_of_the_great_war: "Souvenirs de la Grande Guerre"
 NZL_memories_of_the_great_war_desc: "Avec des milliers de fils et pères néo-zélandais enterrés à l’étranger, le lourd tribut des conflits passés pèse encore sur la nation. Une grande partie de la population et du gouvernement s’oppose fermement à l’envoi de troupes dans ce qu’ils considèrent comme des guerres européennes inutiles, privilégiant les intérêts nationaux et la protection des vies."
 NZL_white_feather_movement: "Le Mouvement de la plume blanche"
 NZL_the_white_feather_movement_desc: "La plume blanche, symbole de lâcheté en Grande-Bretagne durant la Grande Guerre, était souvent donnée par les femmes aux hommes sans uniforme pour les pousser à s’engager. Avec le conflit mondial qui se profile, une pratique similaire émerge dans notre pays.\n\n§RCet esprit disparaîtra si nous ne sommes pas engagés dans un conflit.§!"
 NZL_fighting_tyranny: "Combattre la tyrannie partout où elle se trouve"
 NZL_reinvigorated_spirit: "Esprit combatif ravivé"
 NZL_hot_climate_equipment_idea: "Équipement pour climat chaud"
 NZL_charlton_conversion_idea: "Conversion du fusil Charlton"
 NZL_charlton_conversion_idea_desc: "Nous avons adapté le fidèle fusil Lee-Enfield en une version semi-automatique afin de renforcer notre puissance de feu. La conversion en fusil Charlton nous permet de produire des armes efficaces plus rapidement, tout en économisant des ressources et en maintenant leur fiabilité. Cette innovation illustre notre ingéniosité face aux pénuries et garantit que nos soldats soient mieux armés."
 NZL_womens_service_army: "Corps auxiliaire féminin de l’armée"
 NZL_womens_service_air: "Corps auxiliaire féminin de l’air"
 NZL_womens_air_service_army_air: "Auxiliaires féminines de guerre"
 # Affaire Lee
 NZL_destruction_of_the_lee_afair: "La fin de l’affaire Lee"
 NZL_destruction_of_the_lee_afair_desc: "John A. Lee était un homme politique de renom, connu pour ses positions radicales et ses critiques sévères envers les travaillistes. En réponse, nous l’avons rétrogradé de ses fonctions à responsabilité."
 NZL_upset_maori_population: "Mécontentement de la population māorie"
 NZL_upset_maori_population_desc: "Les natifs se révoltent depuis un certain temps, principalement à propos de l’autonomie et des saisies de terres. Il est peut-être temps de trouver des solutions."
 NZL_organizing_communists: "Organisation des communistes"
 NZL_stiff_opposition: "Opposition farouche"
 NZL_unemployment_benefit: "Allocation chômage"
 NZL_the_engineer_corp: "Régiment d’artillerie"
 NZL_create_a_satnding_navy: "Créer une marine permanente"
 
 NZL_a_moderate_army: "Armée en développement"
 NZL_a_proper_army: "Forces armées établies"
 NZL_a_true_army: "L’armée néo-zélandaise"
 
 NZL_integrating_maori: "Intégration des Māoris"
 NZL_autonomy_for_maori: "Autonomie de la population native"
 
 socialist_finance_minister: "Ministre des finances socialiste"
 socialist_follower: "Partisan de Lee"
 labour_party_remnant: "Vestige du Parti travailliste"
 NZL_obtain_funding: "Obtenir des financements pour le parti"
 NZL_prioritize_house: "Logement public"
 NZL_fight_for_authority_over_our_troops: "Introduire la conscription"
 NZL_devaluated_currency: "Monnaie dévaluée"
 NZL_devaluated_currency_desc: "Pour soutenir notre mobilisation, nous devons réduire certains salaires, et cela passe par la dévaluation du dollar néo-zélandais."

 NZL_defend_our_islands: "Défendre nos îles"
 NZL_defend_our_islands_desc: "Nous devons être prêts à repousser toute attaque maritime contre notre paradis insulaire. Les bombardiers navals peuvent intercepter les barges de débarquement ou même cibler les navires capitaux."

 NZL_commie_tt: "Achever cet objectif débloquera la voie communiste aux élections"
 NZL_legion_tt: "Achever cet objectif débloquera la voie fasciste aux élections"
 
 # Wairarapa
 NZL_the_wairarapa_sheep_cattle_farms: "Élevages du Wairarapa"
 NZL_the_wairarapa_sheep_cattle_farms_lesser: "Élevages du Wairarapa"
 NZL_the_wairarapa_sheep_farms_lesser: "Fermes ovines du Wairarapa"
 NZL_the_wairarapa_sheep_farms_lesser_desc: "Avec la pression de la guerre, nos troupeaux de moutons ont été réorientés de la production lainière vers la viande, afin de nourrir les troupes et répondre aux besoins urgents plutôt qu’aux exportations textiles traditionnelles."
 
