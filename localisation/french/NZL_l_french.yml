CHT_fading_national_identity: "Identité nationale en déclin"

# Māoris
NZL_the_stance_on_maori: "Gérer les troubles māoris"
NZL_the_stance_on_maori_desc: "La situation du peuple māori en Nouvelle-Zélande reste incertaine, et son avenir est à un tournant. Devons-nous préserver leurs traditions et leur mode de vie, en respectant leur culture et en veillant à ce qu’ils restent une partie intégrante de la nation ? Ou leur rôle dans la société doit-il changer ?"
NZL_integrate_maori_into_new_zealand: "Intégration des Māoris"
NZL_integrate_maori_into_new_zealand_desc: "Notre histoire commune avec les Māoris est marquée par la tension et les luttes, mais cela n’a plus d’importance désormais. Ce qui importe, c’est la nécessité de leur intégration dans la société néo-zélandaise, une étape qui doit être franchie, qu’ils le souhaitent ou non."
NZL_respect_maori_culture: "Égalité des Māoris"
NZL_respect_maori_culture_desc: "Le peuple māori a enduré bien trop longtemps oppression et déni de droits. Il est temps de corriger ces injustices et de leur accorder les mêmes droits et privilèges que tous les autres citoyens. Ainsi, nous pourrons bâtir une nation plus juste et unie, où chacun est valorisé, quel que soit son héritage."
NZL_maori_autonomy: "Autonomie māorie"
NZL_maori_autonomy_desc: "Bien que notre histoire avec les Māoris ait été difficile et que leur mécontentement vis-à-vis de nos récentes politiques grandisse, le temps est peut-être venu de se réconcilier avec le peuple autochtone et de réparer nos relations tendues."
NZL_protect_maori_land: "Confisquer les terres māories utiles"
NZL_protect_maori_land_desc: "Les Māoris contrôlent plusieurs régions clés essentielles à l’expansion de notre nation. Il est temps de reprendre ces terres, en offrant une juste compensation. Cela causera peut-être des tensions, mais c’est un pas nécessaire pour sécuriser les ressources dont nous avons besoin."
NZL_minor_native_representation_in_gov: "Représentation autochtone mineure"
NZL_minor_native_representation_in_gov_desc: "Permettre à un groupe restreint de Māoris d’avoir une voix au gouvernement pourrait apaiser leur mécontentement grandissant. En leur donnant une représentation, nous pourrions calmer les tensions et reconnaître leur importance dans l’avenir du pays."
NZL_the_maori_division: "La division māorie"
NZL_the_maori_division_desc: "L’héritage guerrier du peuple māori est un élément majeur de sa culture, et son courage lors de conflits passés en est la preuve. En créant une division militaire composée de Māoris, nous pourrons canaliser cet esprit combatif au service de la nation."
NZL_maori_into_economy: "Lancer l’industrie māorie"
NZL_maori_into_economy_desc: "Puisque les Māoris demeurent indépendants de nos politiques, il est juste de leur fournir les ressources et le soutien nécessaires pour bâtir une économie stable. En les dotant des moyens de croître, nous assurons leur prospérité et maintenons une relation pacifique et productive."
NZL_the_natives_of_new_zealand: "Les autochtones de Nouvelle-Zélande"
NZL_the_natives_of_new_zealand_desc: "Nous avons accordé aux Māoris l’autonomie qu’ils réclamaient depuis longtemps. Ce geste pourrait amener d’autres nations polynésiennes à nous considérer comme un partenaire plus fiable et amical. Cela pourrait ouvrir la voie à des liens plus étroits, voire à la formation d’une fédération, renforçant notre influence et notre unité dans le Pacifique."
NZL_inlist_the_maori: "Enrôler les Māoris"
NZL_inlist_the_maori_desc: "Avec les tensions croissantes et la menace de guerre à l’horizon, il est temps d’enrôler les Māoris pour qu’ils se tiennent à nos côtés dans la défense de la nation. Leur esprit guerrier et leur bravoure éprouvée en font des alliés inestimables. En les appelant, nous honorons leur héritage tout en renforçant nos forces."

# Personnages
NZL_john_a_lee: "John A. Lee"
NZL_john_a_lee_desc: "Surnommé « Bolshie Lee », John A. Lee a gravi les échelons du Parti travailliste avec un charisme flamboyant. Mais ses critiques virulentes envers la prudence de Savage sur les réformes économiques ont alimenté l’instabilité, sa volonté d’imposer des politiques plus radicales divisant ses collègues. Certains le voient comme un visionnaire défendant la classe ouvrière, d’autres comme une menace pour l’unité et la stabilité du gouvernement."
