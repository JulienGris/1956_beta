 BUL_bulgarian_parachutists:0 "Parachutistes [BUL.GetAdjective]"
 BUL_bulgarian_parachutists_desc:0 "Nos ennemis ne s’attendaient pas à ce que nos ancêtres viennent des steppes. Ils ne s’attendront pas non plus à ce que nous venions du ciel que nous vénérions autrefois."

