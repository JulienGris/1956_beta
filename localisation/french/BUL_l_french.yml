 # variables
 BUL_support_yugoslavian_seperatists:0 "Soutenir les séparatistes [YUG.GetAdjective]"
 BUL_support_yugoslavian_seperatists_desc:0 "[YUG.GetNameDefCap]. Une abomination née du traité de Versailles. Beaucoup, dans notre voisinage, souhaitent créer leur patrie, ce qui pourrait être exploité au profit de l'État. Nous leur fournirons des armes pour se « libérer »."
 BUL_support_yugoslavian_seperatists_category:0 "Soutenir les séparatistes"
 BUL_support_yugoslavian_seperatists_category_desc:0 "De nombreuses minorités [YUG.GetAdjective] luttent pour leur indépendance, notamment les Macédoniens du Vardar avec lesquels nous partageons une frontière. Si nous pouvons les financer, ils pourront se soulever et devenir de précieux alliés dans les Balkans.\nSoutien séparatiste en Macédoine : §Y[?BUL.macedonian_support]%§!\n\nSoutien séparatiste en Croatie : §Y[?BUL.croatian_support]%§!\n\nSoutien séparatiste en Slovénie : §Y[?BUL.slovenian_support]%§!\n\nSoutien séparatiste en Bosnie : §Y[?BUL.bosnian_support]%§!"
 BUL_support_imro:0 "Soutenir l’ORIM :\n§R+100% de soutien en Macédoine§!"
 BUL_support_slovene_seperatists:0 "Soutenir les séparatistes slovènes :\n§R+100% de soutien en Slovénie§!"
 BUL_support_croatian_seperatists:0 "Soutenir les séparatistes croates :\n§R+100% de soutien en Croatie§!"
 BUL_support_bosnian_seperatists:0 "Soutenir les séparatistes bosniaques :\n§R+100% de soutien en Bosnie§!"
