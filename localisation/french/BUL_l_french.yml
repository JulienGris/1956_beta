axis_minors_bulgaria.70.t:0 "Autonomie macédonienne"
axis_minors_bulgaria.70.d:0 "[BUL.GetNameDefCap] nous a demandé d’accorder aux Macédoniens une certaine autonomie afin qu’ils puissent se développer et établir des relations avec les [BUL.GetAdjective]s."
axis_minors_bulgaria.70.a:0 "Leur donner de l’autonomie aidera aussi à résoudre nos problèmes internes."
axis_minors_bulgaria.70.b:0 "Ce n’est pas à eux de décider ce que nous faisons de nos régions."

axis_minors_bulgaria.71.t:0 "Autonomie macédonienne"
axis_minors_bulgaria.71.d:0 "[YUG.GetNameDefCap] a accepté notre demande et accordé aux Macédoniens une certaine autonomie. Nous pouvons maintenant entamer une diplomatie avec eux."
axis_minors_bulgaria.71.a:0 "Parfait."

axis_minors_bulgaria.72.t:0 "Autonomie macédonienne"
axis_minors_bulgaria.72.d:0 "[YUG.GetNameDefCap] a rejeté notre demande et décidé de maintenir les Macédoniens intégrés, sans autonomie particulière."
axis_minors_bulgaria.72.a:0 "N’ont-ils donc aucune compassion ?"

