##focuses##
BUL_diplomatic_mission_to_the_soviet_union:0 "Mission diplomatique vers [SOV.GetNameDef]"
BUL_diplomatic_mission_to_the_soviet_union_desc:0 "Au nord se trouve l’Ukraine, contrôlée par [SOV.GetNameDef] ; nous devrions envoyer un diplomate pour améliorer nos relations, car nous ne pouvons pas ignorer un voisin aussi puissant."
BUL_revoke_censorship_communist_material:0 "Lever l’interdiction des publications communistes"
BUL_revoke_censorship_communist_material_desc:0 "Actuellement, les écrits et travaux des ouvriers [BUL.GetAdjective] sont interdits par le gouvernement, mais le temps a montré que ce n’était pas la meilleure décision. Lever cette interdiction réduira la dissidence sociale et unira le pays."
BUL_commitee_of_state_security:0 "Comité de sécurité de l’État"
BUL_commitee_of_state_security_desc:0 "La crainte que des ennemis politiques préparent encore leur coup contre le parti existe toujours. La solution serait de mettre en place une police secrète pour infiltrer ces groupes et les démanteler."
BUL_rally_the_proletariat:0 "Rallier le prolétariat"
BUL_rally_the_proletariat_desc:0 "Les révolutions socialistes en Russie ont montré que le prolétariat est une force qui mérite d’être honorée. Nous devons apporter cette gloire au peuple [BUL.GetAdjective] et poursuivre cet héritage."
BUL_align_with_molotov_ribbentrop_pact:0 "S’aligner sur le pacte Molotov-Ribbentrop"
BUL_align_with_molotov_ribbentrop_pact_desc:0 "Assurer notre position en Europe sera crucial pour la prospérité de notre grande nation. Être en paix avec [GER.GetNameDef] et entretenir de meilleures relations avec [SOV.GetNameDef] ne fera que renforcer notre position stratégique."
BUL_peoples_courts:0 "Tribunaux populaires"
BUL_peoples_courts_desc:0 "Même si nous avons purgé les traîtres et ennemis de la Révolution, certains se cachent encore dans les rangs de l’armée. Les débusquer et les éliminer garantira qu’ils ne poseront plus de problème."
BUL_ties_with_ussr:0 "Liens avec [SOV.GetAdjective]"
BUL_ties_with_ussr_desc:0 "Maintenant que la Révolution a triomphé en [BUL.GetNameDef], il est préférable de s’aligner sur notre allié naturel – [SOV.GetNameDef]. Cette alliance nous sera grandement bénéfique, car nos partenaires [SOV.GetAdjective] nous aideront à développer notre pays et à en faire l’utopie socialiste dont nous avons tous besoin."
BUL_balkan_revolution:0 "S’unir contre un ennemi commun"
BUL_balkan_revolution_desc:0 "En [YUG.GetNameDef], nos camarades sont désormais au pouvoir ; il est temps de resserrer nos liens en créant une alliance qui nous unira contre les fléaux du monde moderne : le capitalisme et le fascisme."
BUL_communist_scientific_cooperation:0 "Coopération scientifique communiste"
BUL_communist_scientific_cooperation_desc:0 "En établissant une alliance entre nos camarades et nous, nous pourrons développer mutuellement nos économies, partager doctrines et stratégies. Surtout, nous pourrons devenir une puissance militaire en acquérant leurs technologies."
BUL_social_reforms:0 "Réformes sociales"
BUL_social_reforms_desc:0 "Maintenant que les oppresseurs sont partis, nous allons mettre en place des réformes sociales qui profiteront à la population rurale [BUL.GetAdjective] en limitant les aristocrates. Nous devons améliorer le niveau de vie et concrétiser le rêve socialiste."
BUL_nationalizations:0 "Planification économique centralisée"
BUL_nationalizations_desc:0 "Depuis la Grande Guerre, la nation bulgare a toujours souffert de difficultés économiques causées par un système financier faible. Centraliser notre économie améliorera considérablement notre situation."
BUL_communist_heavy_industry:0 "Industrie lourde communiste"
BUL_communist_heavy_industry_desc:0 "Nous aspirons à la paix, mais un conflit à nos frontières semble inévitable, et nous devons être prêts à défendre notre patrie. Financer notre industrie lourde sera crucial en cas de guerre."
BUL_army_reorganization:0 "Réorganisation de l’armée"
BUL_army_reorganization_desc:0 "Notre structure militaire est dépassée et considérée comme obsolète à l’ère moderne. Une réorganisation majeure, sous la guidance des pays communistes, permettra à l’armée [BUL.GetAdjective] de retrouver sa grandeur."
BUL_communist_volunteers:0 "Créer les forces internationales [BUL.GetAdjective]"
BUL_communist_volunteers_desc:0 "Envoyer des volontaires aux nations communistes en difficulté renforcera notre position sur la scène internationale et stimulera le moral de notre population."
BUL_communist_youth:0 "Ligue de la jeunesse communiste"
BUL_communist_youth_desc:0 "Les organisations de jeunesse communistes garantiront la loyauté des futures générations envers la Révolution et le Parti. Elles enseigneront nos idéaux et prépareront la prospérité future."
BUL_invite_greece_communism:0 "Inviter [GRE.GetNameDef]"
BUL_invite_greece_communism_desc:0 "Nos camarades du sud ont enfin pris le pouvoir. Un rapprochement entre nos deux nations garantirait la sécurité de nos révolutions."
BUL_invite_romania_communism:0 "Inviter [ROM.GetNameDef]"
BUL_invite_romania_communism_desc:0 "Maintenant que la Roumanie est sous régime communiste, une coopération militaire serait dans notre intérêt commun."
BUL_invite_albania_communism:0 "Inviter [ALB.GetNameDef]"
BUL_invite_albania_communism_desc:0 "Menacée à l’ouest par [ITA.GetNameDef], [ALB.GetNameDef] pourrait ne pas survivre sans aide extérieure. En les plaçant sous notre protection, nous découragerons toute tentative d’invasion."
BUL_soviet_theorists:0 "Inviter les experts [SOV.GetAdjective]"
BUL_soviet_theorists_desc:0 "Étant donné nos liens avec [SOV.GetAdjective], il est naturel de coopérer avec eux pour accélérer nos recherches. Nous coordonnerons nos efforts afin de rattraper le retard technologique."
BUL_yugoslavist_triumph:0 "Union [YUG.GetAdjective]"
BUL_yugoslavist_triumph_desc:0 "Le gouvernement capitaliste [YUG.GetAdjective] n’acceptera jamais l’exportation du socialisme. Il est temps d’abattre la monarchie et d’ériger un [YUG.GetNameDef] libre et socialiste."
BUL_restore_spirit_tarnovo_constitution:0 "Rétablir l’esprit de la constitution de Tarnovo"
BUL_restore_spirit_tarnovo_constitution_desc:0 "Bien que rédigée au XIXe siècle, la constitution de Tarnovo reste en vigueur mais faiblement appliquée, affaiblie par les amendements de 1908 et 1911 renforçant le pouvoir royal. Il est temps de limiter l’autorité du monarque et de revenir à la forme originelle."
BUL_support_multipartism:0 "Soutenir le multipartisme"
BUL_support_multipartism_desc:0 "Le moment est venu d’adopter un système multipartite. Nous devons encourager et soutenir la création de partis et leur participation légale aux élections."
BUL_appeal_to_the_west_democracies:0 "Faire appel aux démocraties occidentales"
BUL_appeal_to_the_west_democracies_desc:0 "Nous devons rechercher l’aide de démocraties comme [ENG.GetNameDef], [USA.GetNameDef] et [FRA.GetNameDef]. Nos réformes démocratiques devraient faciliter des accords mutuellement bénéfiques."
BUL_voting_concessions:0 "Suspendre Kyoseivanov"
BUL_voting_concessions_desc:0 "Le Premier ministre Georgi Kyoseivanov abuse de son pouvoir et viole la constitution de Tarnovo. Il doit être suspendu pour ses actions contre la patrie."
BUL_release_the_opposition:0 "Libérer l’opposition"
BUL_democracy_through_elections:0 "Démocratie par les élections"
BUL_democracy_through_elections_desc:0 "De nouvelles élections doivent être organisées pour déterminer qui dirigera [BUL.GetNameDef] avec le retour des libertés politiques."
BUL_initiate_land_reforms:0 "Lancer les réformes économiques et agraires"
BUL_initiate_land_reforms_desc:0 "Les fermiers [BUL.GetAdjective] souffrent encore de leur dépendance aux grands propriétaires. Une redistribution des terres et une réforme économique amélioreront la vie de tous."
BUL_crush_the_monarchists:0 "Discréditer les absolutistes"
BUL_crush_the_monarchists_desc:0 "L’absolutisme est une relique du passé qui n’aurait jamais dû voir le jour en Bulgarie. Il doit être considéré comme un mal contraire au bien-être du peuple."
BUL_form_the_orange_guard:0 "Former la Garde Orange"
BUL_form_the_orange_guard_desc:0 "La Garde Orange était une organisation paramilitaire affiliée à l’Union populaire agraire bulgare sous le mandat d’Aleksandar Stamboliyski. Elle servait de garde du corps et appliquait les réformes agraires. La rétablir assurerait la sécurité du gouvernement face aux tyrans potentiels."
BUL_establish_free_trade:0 "Établir une économie de libre-échange"
BUL_establish_free_trade_desc:0 "La prospérité économique viendra de notre capacité à nous adapter au marché mondial. Des réformes favorisant le libre marché faciliteront notre intégration au commerce international."
BUL_invite_investors:0 "Inviter les investisseurs industriels"
BUL_invite_investors_desc:0 "Nos réformes pro-entreprises ont attiré de nombreux investisseurs étrangers, améliorant à la fois la qualité de vie et notre capacité industrielle."
BUL_fund_orthodox_church:0 "Financer l’Église orthodoxe"
BUL_fund_orthodox_church_desc:0 "L’Église orthodoxe, religion officielle de [BUL.GetNameDef], bénéficiera toujours du soutien financier du gouvernement. Cela renforcera notre image auprès de la population religieuse."
BUL_denounce_fascist_nations:0 "Prononcer un discours antifasciste"
BUL_denounce_fascist_nations_desc:0 "Le fascisme, idéologie totalitaire fondée sur l’exploitation et la privation de libertés, est intolérable. Une dénonciation officielle montrera notre détermination à défendre les libertés de notre peuple."
BUL_approach_the_west:0 "Se rapprocher de l’Ouest"
BUL_approach_the_west_desc:0 "Un rapprochement avec les nations occidentales, fondé sur notre proximité idéologique et nos intérêts communs, serait bénéfique."
BUL_alliance_with_britain:0 "Alliance avec [ENG.GetNameDef]"
BUL_alliance_with_britain_desc:0 "Un traité officiel avec [ENG.GetNameDef] garantirait la sécurité de [BUL.GetNameDef] contre toute puissance totalitaire cherchant à nous envahir ou à nous intégrer dans sa sphère."
BUL_reaffirm_trade_relations_with_balkans:0 "Créer un pacte commercial balkanique"
BUL_negotiate_for_south_dobrudja:0 "Négocier avec [ROM.GetNameDef]"
BUL_negotiate_for_south_dobrudja_desc:0 "La Dobroudja du Sud, encore majoritairement peuplée de Bulgares, fut annexée par la Roumanie après la Deuxième Guerre balkanique. Avec l’appui de nos alliés, nous pourrions négocier son retour tout en garantissant les droits des minorités [ROM.GetAdjective]."
BUL_non_aggression_pact_with_soviet:0 "Pacte de non-agression avec [SOV.GetNameDef]"
BUL_non_aggression_pact_with_soviet_desc:0 "Malgré nos différences idéologiques, signer un pacte de non-agression avec [SOV.GetNameDef] servirait nos intérêts et réduirait le risque d’invasion."
BUL_industrial_modernization:0 "Modernisation industrielle"
BUL_industrial_modernization_desc:0 "[BUL.GetNameDefCap] reste loin derrière l’Europe en matière d’industrie, étant avant tout une nation agraire. Des plans d’industrialisation à long terme ont été préparés et seront mis en œuvre."
BUL_post_depression_economic_recovery:0 "Développer le secteur civil"
BUL_post_depression_economic_recovery_desc:0 "Le secteur civil de [BUL.GetNameDef] pourrait être étendu pour améliorer nos capacités de construction."
BUL_two_year_railway_plan:0 "Plan de développement ferroviaire sur deux ans"
BUL_two_year_railway_plan_desc:0 "Un plan ambitieux visant à étendre le réseau routier et ferroviaire [BUL.GetAdjective] est nécessaire pour soutenir notre expansion industrielle."
BUL_expand_chromium_production:0 "Exploiter les gisements de chrome"
BUL_expand_chromium_production_desc:0 "Nos sous-sols regorgent de chrome, ressource essentielle à la production militaire. En accroître l’extraction nous rapprochera de l’autosuffisance."
BUL_expand_the_chelopech_gold_deposit:0 "Exploiter le gisement d’or de Chelopech"
BUL_expand_the_chelopech_gold_deposit_desc:0 "L’extraction de l’or et les revenus qu’elle génère nous fourniront les moyens nécessaires à notre expansion industrielle."
BUL_technological_advancement:0 "Progrès technologique"
BUL_technological_advancement_desc:0 "Le développement industriel s’accompagne d’un essor de la recherche scientifique, nous permettant de moderniser nos technologies."
BUL_build_coal_power_plants:0 "Construire des centrales à charbon"
BUL_build_coal_power_plants_desc:0 "Notre modernisation industrielle entraîne une hausse de la demande en électricité. Développer la production à base de charbon assurera l’alimentation de nos usines."
BUL_mobilize_natural_resources:0 "Mobiliser les ressources naturelles"
BUL_mobilize_natural_resources_desc:0 "L’augmentation de notre capacité d’extraction doit s’accompagner d’une limitation des exportations afin de privilégier l’usage interne."
BUL_liquify_coal:0 "Nouvelle utilisation du charbon"
BUL_liquify_coal_desc:0 "La liquéfaction du charbon représente une opportunité d’augmenter notre production de carburant, dont nous dépendons fortement."
BUL_housing_expansion_plan:0 "Plan d’expansion du logement"
BUL_housing_expansion_plan_desc:0 "Nous lancerons un programme public de construction pour loger décemment une plus grande partie de la population, encourageant l’urbanisation."
BUL_kickstart_ammunition_production:0 "Relancer la production de munitions"
BUL_kickstart_ammunition_production_desc:0 "Depuis nos deux défaites consécutives, la production d’armes et de munitions n’a pas été une priorité. Mais avec l’ombre de la guerre qui s’approche, nous devons nous réarmer, en commençant par fournir les munitions nécessaires aux armes déjà en service."
BUL_heavy_war_industry_expansion:0 "Expansion de l’industrie lourde de guerre"
BUL_heavy_war_industry_expansion_desc:0 "Disposer d’usines capables de produire chars et avions est une nécessité absolue pour toute nation se préparant à un conflit."
BUL_artillery_pieces_production:0 "Expertise en artillerie"
BUL_artillery_pieces_production_desc:0 "Nous devons exploiter pleinement notre savoir-faire en matière d’artillerie en augmentant notre capacité de production."
BUL_ministries_coop:0 "Effort conjoint des ministères"
BUL_ministries_coop_desc:0 "La coopération entre les ministères responsables de l’industrie permettra de guider la production militaire et de faciliter la transition vers une économie de guerre."
BUL_finalize_rearmament_plans:0 "Finaliser le plan de réarmement industriel"
BUL_finalize_rearmament_plans_desc:0 "L’étape finale vers la mobilisation totale de l’industrie militaire bulgare est en cours, afin d’atteindre le niveau de production nécessaire pour équiper correctement notre armée."
BUL_industrial_centralization:0 "Centralisation industrielle"
BUL_industrial_centralization_desc:0 "Une supervision accrue de l’État sur la production de matériel essentiel garantira le respect des normes et la fiabilité de notre équipement."
BUL_fill_the_supply_gaps:0 "Combler les lacunes d’approvisionnement"
BUL_fill_the_supply_gaps_desc:0 "Certaines de nos unités manquent encore d’équipements spécifiques. La diversification des ateliers militaires augmentera notre flexibilité et garantira que toutes nos forces soient équipées."
BUL_repurpose_abandoned_facilities:0 "Réaffecter les installations abandonnées"
BUL_repurpose_abandoned_facilities_desc:0 "Beaucoup d’ateliers militaires ont été abandonnés. En les rouvrant avec un soutien financier de l’État, nous pouvons rapidement augmenter notre capacité de production."
BUL_post_rearmament_military_plans:0 "Plans industriels post-réarmement"
BUL_post_rearmament_military_plans_desc:0 "La fin du réarmement ne doit pas signifier la fin du développement de l’industrie militaire. L’expansion de notre armée exigera une industrie toujours plus importante."
BUL_the_prosperity_plan:0 "Le Plan de prospérité"
BUL_the_prosperity_plan_desc:0 "Le « Plan de prospérité » est une stratégie visant à coordonner l’expansion de l’industrie civile et militaire, afin d’accroître l’efficacité des deux secteurs."
BUL_new_page_in_technological_research:0 "Une nouvelle page pour la technologie [BUL.GetAdjective]"
BUL_new_page_in_technological_research_desc:0 "Avec le Plan de prospérité en place, nous devons coordonner la recherche scientifique avec l’industrie pour permettre des avancées technologiques sans précédent."
BUL_military_rearmament_plans:0 "Plan de réarmement militaire"
BUL_military_rearmament_plans_desc:0 "Le terme « état pitoyable » est insuffisant pour décrire notre armée actuelle. Nous mettrons en place un vaste plan de modernisation pour l’amener au niveau des grandes puissances."
BUL_reform_the_army:0 "Réformer l’armée"
BUL_reform_the_army_desc:0 "L’armée doit être au cœur de notre projet de réforme. La modernisation de sa structure et de son état-major améliorera son efficacité et préparera son expansion."
BUL_innovation_warfare:0 "Guerre d’innovation"
BUL_innovation_warfare_desc:0 "La Grande Guerre a transformé la manière de faire la guerre, ouvrant la voie à de nouvelles technologies militaires. Leur développement nous permettra de les utiliser pleinement."
BUL_bulgarian_tank_corps:0 "Corps blindé [BUL.GetAdjective]"
BUL_bulgarian_tank_corps_desc:0 "La création d’une unité blindée, longtemps envisagée, doit devenir réalité pour tirer parti de sa puissance et de sa polyvalence."
BUL_forces_of_mechanization:0 "Forces mécanisées"
BUL_forces_of_mechanization_desc:0 "Des unités rapides et bien équipées accompagneront nos divisions traditionnelles, facilitant la prise de territoires ennemis."
BUL_lightning_warfare:0 "Guerre éclair"
BUL_lightning_warfare_desc:0 "Les guerres à venir seront remportées par les armées les plus rapides et les mieux préparées. Nous avons les technologies nécessaires pour bâtir une telle force."
BUL_strength_in_firepower:0 "La force par la puissance de feu"
BUL_strength_in_firepower_desc:0 "Même pendant la Grande Guerre, l’usage d’artilleries toujours plus puissantes a prouvé son efficacité. Développer ces technologies nous permettra de frapper durement l’ennemi tout en limitant les pertes."
BUL_expand_artillery_supplies:0 "Augmenter l’approvisionnement en artillerie"
BUL_expand_artillery_supplies_desc:0 "Notre production d’artillerie reste insuffisante. Nous avons négocié l’achat de plusieurs pièces auprès de Rheinmetall, un fabricant allemand."
BUL_neverending_artillery_modernization:0 "Modernisation continue de l’artillerie"
BUL_neverending_artillery_modernization_desc:0 "La modernisation constante est indispensable pour maintenir notre efficacité face aux nouvelles technologies, notamment les blindés."
BUL_shells_and_guns:0 "Obus et canons"
BUL_shells_and_guns_desc:0 "Une offensive coordonnée entre l’artillerie et l’infanterie infligera de lourds dégâts à l’ennemi tout en limitant nos pertes."
BUL_strive_for_an_organized_army:0 "Œuvrer pour une armée organisée"
BUL_strive_for_an_organized_army_desc:0 "L’organisation et la discipline doivent être la priorité de la modernisation militaire."
BUL_modernized_weaponry:0 "Armement modernisé"
BUL_modernized_weaponry_desc:0 "Les fusils de nos soldats vieillissent. Produire de nouvelles armes plus modernes améliorera l’efficacité globale de nos troupes."
BUL_rifle_production:0 "Production de fusils"
BUL_rifle_production_desc:0 "L’extension de nos ateliers de fabrication de fusils soutiendra la modernisation de l’infanterie et facilitera l’entraînement de nouvelles unités bien équipées."
BUL_maximized_planning_effort:0 "Effort de planification maximale"
BUL_maximized_planning_effort_desc:0 "L’expansion de l’état-major général nous a permis d’intensifier nos recherches militaires sur les différentes manières de planifier nos attaques. Le succès d’une offensive réside dans sa préparation."
BUL_naval_air_rearmament_plan:0 "Lancer le réarmement naval et aérien"
BUL_naval_air_rearmament_plan_desc:0 "La marine et l’aviation n’ont jamais reçu beaucoup d’attention, surtout depuis la perte d’une grande partie de nos côtes. Toutefois, si nous investissons suffisamment de temps et d’efforts dans la modernisation de ces secteurs, ils pourraient devenir des atouts majeurs."
BUL_expand_the_varna_shipyards:0 "Agrandir les chantiers navals de Varna"
BUL_expand_the_varna_shipyards_desc:0 "Notre capacité de production navale reste limitée, principalement à la fabrication de convois et de navires civils. La modernisation et surtout l’extension de nos infrastructures pour produire des navires plus lourds sont nécessaires pour disposer d’une véritable marine."
BUL_heavy_vessels:0 "Navires lourds"
BUL_heavy_vessels_desc:0 "La domination navale passe par la construction de navires assez puissants pour s’imposer seuls, réunis dans une même flotte."
BUL_build_the_burgas_shipyards:0 "Construire les chantiers navals de Bourgas"
BUL_build_the_burgas_shipyards_desc:0 "L’expansion des chantiers navals de Bourgas permettra une nette amélioration de nos capacités maritimes, maintenant que nous avons décidé de produire des navires lourds et très lourds."
BUL_modern_battlecruisers:0 "Croiseurs de bataille modernes"
BUL_modern_battlecruisers_desc:0 "Les croiseurs de bataille représentent un bon compromis entre puissance de feu et vitesse dans une flotte composée de navires lourds, malgré un blindage plus léger."
BUL_modern_heavy_cruisers:0 "Croiseurs lourds modernes"
BUL_modern_heavy_cruisers_desc:0 "Les croiseurs seront parfaits comme navires moyens pour accompagner notre flotte dans des batailles où la vitesse serait décisive."
BUL_modern_battleships:0 "Cuirassés modernes"
BUL_modern_battleships_desc:0 "Les cuirassés représenteront à la fois l’avant-garde et le fleuron de notre marine. Ils doivent être aussi modernes et puissants que possible."
BUL_shipbuilding_experience:0 "Expérience navale"
BUL_shipbuilding_experience_desc:0 "Maintenant que la modernisation de l’équipement est terminée, il est temps d’adapter nos tactiques vers une concentration maximale de puissance de feu."
BUL_light_vessels:0 "Navires légers"
BUL_light_vessels_desc:0 "L’innovation est essentielle pour l’efficacité d’une armée. Il est temps de délaisser les tactiques centrées sur les navires lourds pour adopter une marine plus légère, plus rapide et plus discrète, notamment avec les sous-marins."
BUL_modern_light_cruisers:0 "Croiseurs légers modernes"
BUL_modern_light_cruisers_desc:0 "Le développement de croiseurs plus légers nous permettra de conserver une bonne puissance de feu tout en suivant la vitesse de nos autres navires."
BUL_modern_destroyers:0 "Destroyers modernes"
BUL_modern_destroyers_desc:0 "Les destroyers assureront une bonne défense pour le reste de notre flotte."
BUL_modern_submarines:0 "Sous-marins modernes"
BUL_modern_submarines_desc:0 "Les sous-marins sont une technologie révolutionnaire et fascinante. En apportant une dimension furtive au combat naval, ils peuvent couler des navires apparemment insubmersibles grâce à des attaques discrètes."
BUL_naval_strategy:0 "Stratégie navale"
BUL_naval_strategy_desc:0 "Il est temps de réformer nos tactiques navales en fonction de la composition que nous avons choisie pour notre marine, afin de tirer pleinement parti de nos navires."
BUL_torpedo_based_navy:0 "Marine axée sur les torpilles"
BUL_torpedo_based_navy_desc:0 "Les torpilles représentent un énorme progrès dans le combat naval. Il est temps d’intégrer cette merveille à notre arsenal maritime."
BUL_naval_bomber_focus:0 "Torpilles volantes"
BUL_naval_bomber_focus_desc:0 "Nous devons développer des bombardiers spécialisés dans le combat naval pour soutenir nos navires, notamment contre les bâtiments lourds."
BUL_rearm_the_bulgarian_airforce:0 "Réarmer l’aviation [BUL.GetAdjective]"
BUL_rearm_the_bulgarian_airforce_desc:0 "Notre force aérienne est loin d’être à jour ou développée, alors qu’elle pourrait être un atout majeur pour nos autres branches armées. Il est temps de corriger cette grave erreur."
BUL_short_range_fighter_focus:0 "Axe sur les chasseurs à courte portée"
BUL_short_range_fighter_focus_desc:0 "Nous devrions nous concentrer sur l’utilisation de chasseurs simples, tels qu’ils existaient depuis la Grande Guerre, principalement pour protéger le ciel [BUL.GetAdjective] des bombardiers ennemis et attaquer des troupes proches de nos frontières."
BUL_long_range_fighter_focus:0 "Axe sur les chasseurs à longue portée"
BUL_long_range_fighter_focus_desc:0 "L’utilisation de chasseurs à long rayon d’action représente une opportunité en or pour infliger de lourds dégâts matériels à un ennemi éloigné, notamment avec le soutien de bombardiers, ou pour défendre à la fois notre ciel et celui de nos alliés."
BUL_low_altitude_flights:0 "Vols à basse altitude"
BUL_low_altitude_flights_desc:0 "Nous pouvons utiliser la supériorité aérienne acquise par nos chasseurs pour soutenir nos troupes au sol. En effet, si nous pouvons abattre des avions, nous pouvons aussi attaquer des forces terrestres."
BUL_compromised_approach:0 "Approche équilibrée"
BUL_compromised_approach_desc:0 "Un équilibre entre le soutien aux troupes et la destruction des infrastructures ennemies permettrait une offensive plus coordonnée et efficace."
BUL_offensive_bombing_strategy:0 "Stratégie de bombardement offensif"
BUL_offensive_bombing_strategy_desc:0 "La destruction directe d’installations civiles ou militaires est une stratégie efficace dans une guerre d’usure, comme cela a été le cas lors de la Grande Guerre."
BUL_CAS_effort:0 "Axe sur l’attaque au sol"
BUL_CAS_effort_desc:0 "Le développement d’appareils spécifiquement dédiés aux attaques contre les troupes terrestres sera plus efficace que l’utilisation de chasseurs pour cette mission."
BUL_bomber_focus:0 "Axe sur les bombardiers"
BUL_bomber_focus_desc:0 "Nos capacités destructrices peuvent toujours être améliorées, notamment par voie aérienne. Le développement de nouveaux bombardiers renforcera la puissance de frappe de notre aviation."
BUL_experimental_paradoppings:0 "Expérimentations de parachutages"
BUL_experimental_paradoppings_desc:0 "Le largage de troupes derrière les lignes ennemies ou dans des zones difficiles d’accès est parfaitement possible si nous contrôlons le ciel."
BUL_aviation_effort_2:0 "Extension des bases aériennes"
BUL_aviation_effort_2_desc:0 "Nous aurons besoin de nouvelles bases aériennes pour accueillir les avions que nous produisons."
BUL_rocket_effort:0 "Expérimentations sur les fusées"
BUL_rocket_effort_desc:0 "Les fusées s’annoncent comme une technologie potentiellement plus destructrice que les bombardiers conventionnels. Elles méritent toute notre attention."
BUL_form_mechanics:0 "Former des équipes de mécaniciens"
BUL_form_mechanics_desc:0 "De nouvelles équipes de mécaniciens seront formées pour accompagner nos aviateurs."
BUL_crush_the_military_union:0 "Purger l’Union militaire"
BUL_crush_the_military_union_desc:0 "La chute du gouvernement Zveno ne suffit pas, car des sympathies subsistent dans l’armée. Une purge est nécessaire pour éviter que l’autorité de Boris III ne soit remise en cause."
BUL_renew_kyoseivanovs_term:0 "Renouveler le mandat de Kyoseivanov"
BUL_renew_kyoseivanovs_term_desc:0 "Georgi Kyoseivanov n’est qu’une marionnette au service de Boris III. Cependant, la légitimité de ce dernier doit être préservée, au moins aux yeux du public. Le renouvellement de son mandat de Premier ministre renforcera cette légitimité."
BUL_approach_italy:0 "Se rapprocher de [ITA.GetNameDef]"
BUL_approach_italy_desc:0 "[ITA.GetNameDefCap] et [BUL.GetNameDef] partagent des ambitions et des intérêts communs vis-à-vis des autres nations balkaniques. Un rapprochement avec le régime de [ITA.GetLeader] nous permettra, espérons-le, d’obtenir son accord pour une éventuelle extension des territoires [BUL.GetAdjective]."
BUL_consolidate_the_regime:0 "Consolider le régime des autorités"
BUL_consolidate_the_regime_desc:0 "La mise en place du nouveau gouvernement est encore récente dans l’esprit des [BUL.GetAdjective]s. Des efforts pour renforcer notre autorité doivent être entrepris afin d’obtenir le soutien de la population, une fois que l’armée aura acquis ce soutien."
BUL_saedinenieto_pravi_silata:0 "Saedinenieto Pravi Silata"
BUL_saedinenieto_pravi_silata_desc:0 "L’autorité de Boris III est tout ce dont [BUL.GetNameDef] a besoin pour retrouver sa gloire. Les différents gouvernements parlementaires n’ont fait que réduire le prestige, la gloire et la puissance de [BUL.GetNameDef], et c’est par la monarchie que nous les retrouverons."
BUL_popovo_maneuvers:0 "Les manœuvres de Popovo"
BUL_popovo_maneuvers_desc:0 "Nous organiserons des manœuvres militaires dans la ville de Popovo afin de préparer l’armée aux guerres de reconquête que nous planifions."
BUL_reassert_claims:0 "Réaffirmer les revendications de la Grande Bulgarie"
BUL_reassert_claims_desc:0 "Les traités de Bucarest et de Neuilly-sur-Seine nous ont privés de territoires bulgares légitimes. Il est temps de corriger cette injustice en réaffirmant nos droits sur ces régions qui composent la « Grande Bulgarie », une nation pour tous les Bulgares."
BUL_demand_dobrudja:0 "Exiger l’annexion de la Dobroudja"
BUL_demand_dobrudja_desc:0 "La région de la Dobroudja a été injustement prise par le Royaume de Roumanie à la fin de la Seconde Guerre balkanique, malgré la présence d’une majorité de Bulgares n’attendant que leur libération. [ROM.GetNameDefCap] nous rendra ce territoire ou nous le reprendrons par la force."
BUL_demand_southern_territories:0 "Réclamer le Belomorie"
BUL_demand_southern_territories_desc:0 "La perte des régions thraces à l’issue de la Seconde Guerre balkanique et de la Grande Guerre a également signifié la perte de notre accès à la Méditerranée et la séparation d’avec les Bulgares qui y vivent. Il est temps de les ramener chez eux."
BUL_demand_vardaria:0 "Exiger l’annexion du Vardar"
BUL_demand_vardaria_desc:0 "La Macédoine est une région bulgare et le restera toujours. Malgré les efforts de serbisation de [YUG.GetNameDef], ses habitants savent au fond d’eux qu’ils sont Bulgares. Il est temps de mettre fin à cette exploitation de notre peuple et de ramener la Macédoine dans le giron de [BUL.GetNameDef]."
BUL_defend_the_new_borders:0 "Défendre les nouvelles frontières"
BUL_defend_the_new_borders_desc:0 "Nous avons peut-être gagné ces guerres, mais à tout moment nous pourrions perdre à nouveau ces territoires et être séparés de nos frères et sœurs. Nous lancerons des projets de fortification de ces nouvelles frontières."
BUL_long_live_boris_the_unifier:0 "Vive Boris l’Unificateur !"
BUL_long_live_boris_the_unifier_desc:0 "Boris III a su réparer les erreurs de son père et a même fait mieux en réunissant toute la région bulgare en une seule nation. Il restera dans l’Histoire comme celui qui a rendu à [BUL.GetNameDef] sa fierté."
BUL_tsarist_terror:0 "Terreur tsariste"
BUL_tsarist_terror_desc:0 "Nous devons soutenir l’autorité tsariste pour permettre au gouvernement de prendre les mesures nécessaires à la prospérité de [BUL.GetNameDef]. Nous ne pouvons pas laisser nos opposants en liberté."
BUL_royal_militarism:0 "Militarisme royal"
BUL_royal_militarism_desc:0 "Les efforts pour militariser la société, accompagnés d’un fanatisme en faveur de la monarchie et du tsar, nous permettront d’atteindre nos ambitions de reconquête."
BUL_allow_rigged_election:0 "Autoriser des élections truquées"
BUL_allow_rigged_election_desc:0 "Pour conserver une certaine légitimité légale au Premier ministre et au gouvernement, des élections seront organisées, mais sous des règles strictes afin que le gouvernement tsariste obtienne la majorité nécessaire à la mise en œuvre de ses activités."
BUL_mobilize_the_nation:0 "Mobiliser la nation"
BUL_mobilize_the_nation_desc:0 "Chaque citoyen [BUL.GetAdjective] doit s’engager pour la prospérité de [BUL.GetNameDef]. Des campagnes de mobilisation de la population prépareront le peuple et l’économie aux conflits futurs."
BUL_patriotic_boom_among_the_populace:0 "Essor patriotique parmi la population"
BUL_patriotic_boom_among_the_populace_desc:0 "Les différentes réformes tsaristes ont ravivé le patriotisme. Une fois de plus, le peuple [BUL.GetAdjective] souhaite voir sa nation devenir une puissance respectée. Nous exaucerons ce vœu."
BUL_fortify_the_bulgarian_skies:0 "Fortifier le ciel [BUL.GetAdjective]"
BUL_fortify_the_bulgarian_skies_desc:0 "Pour protéger nos soldats et nos citoyens contre de possibles bombardements ennemis, le gouvernement donnera la priorité à l’installation d’équipements antiaériens."
BUL_ready_for_war:0 "Prêts pour la guerre"
BUL_ready_for_war_desc:0 "Nous avons pris suffisamment de mesures pour que [BUL.GetNameDef] puisse être considérée comme une nation préparée aux futures guerres totales."
BUL_an_alliance_of_desperation:0 "Une alliance de désespoir"
BUL_an_alliance_of_desperation_desc:0 "Comme nous, [GER.GetNameDef] cherche à annuler les injustices des traités imposés à la fin de la Grande Guerre. Avec de tels intérêts communs, il serait sage de chercher une alliance, compte tenu de sa puissance."
BUL_concessions_to_lukov:0 "Concessions à Lukov"
BUL_concessions_to_lukov_desc:0 "Le ministre de la Guerre, Hristo Lukov, a été un atout majeur dans la répression du Zveno et dans l’orientation politique de [BUL.GetNameDef]. Son influence ne peut être que bénéfique à la nation."
BUL_brannik_youth_organization:0 "Organisation de jeunesse Brannik"
BUL_brannik_youth_organization_desc:0 "La création d’une organisation de jeunesse obligatoire, calquée sur les Jeunesses hitlériennes, contribuera à inculquer patriotisme et militarisme à notre population."
BUL_cement_our_rule_with_an_iron_fist:0 "Commencer à asseoir notre pouvoir"
BUL_cement_our_rule_with_an_iron_fist_desc:0 "L’autorité de Lukov est encore contestée, tout comme celle de Boris III l’a été. Une répression des politiciens jugés déloyaux, y compris potentiellement des monarchistes, devra être mise en place."
BUL_combat_ideological_enemies_in_foreign_soil:0 "Combattre les ennemis idéologiques"
BUL_combat_ideological_enemies_in_foreign_soil_desc:0 "Nous ne pouvons tolérer la propagation du bolchevisme barbare, une idéologie fondamentalement opposée au patriotisme et au nationalisme. Comme en Espagne, nous mettrons en place une force expéditionnaire pour aider les nations confrontées à cette idéologie."
BUL_begin_militarization:0 "Militarisation rapide"
BUL_begin_militarization_desc:0 "Nous mettrons en œuvre des programmes avancés de militarisation. La population doit sacrifier son confort pour laisser place à un [BUL.GetName] prodigieux."
BUL_totalitarian_control:0 "Contrôle totalitaire"
BUL_totalitarian_control_desc:0 "Avec la « disparition » d’une grande partie de nos rivaux politiques et militaires, l’autorité de Lukov n’est plus menacée."
BUL_reassert_the_extended_land_claims:0 "Réaffirmer les revendications territoriales élargies"
BUL_reassert_the_extended_land_claims_desc:0 "Pour assurer la survie et la gloire de la nation [BUL.GetAdjective], nous devons repousser nos frontières, tout en restant neutres, comme notre pays est naturellement destiné à dominer les Balkans."
BUL_crush_the_greeks:0 "Écraser [GRE.GetNameDef]"
BUL_crush_the_greeks_desc:0 "Nous ne pardonnerons jamais à la Grèce de nous avoir fait perdre notre accès à la Méditerranée. Il est temps de le reprendre et d’imposer définitivement notre domination au régime d’Athènes."
BUL_divide_yugoslavia:0 "Diviser [YUG.GetNameDef]"
BUL_divide_yugoslavia_desc:0 "Les Serbes traîtres ont voulu garder la Macédoine pour eux en faisant croire à ses habitants qu’ils étaient plus serbes que bulgares, tout en réprimant l’héritage de la région. Il est temps de reprendre cette région essentielle de la Bulgarie."
BUL_topple_romania:0 "Renverser [ROM.GetNameDef]"
BUL_topple_romania_desc:0 "[ROM.GetNameDefCap] a montré qu’elle ne pensait qu’à son propre peuple en s’emparant de la région de la Dobroudja, encore peuplée aujourd’hui de Bulgares, et tout comme elle nous l’a prise par la force, nous la reprendrons par la force."
BUL_tame_albania:0 "Soumettre [ALB.GetNameDef]"
BUL_tame_albania_desc:0 "Ajouter l’Albanie à notre empire nous assurera une domination totale sur les Balkans et évitera d’éventuelles revendications futures de sa part sur des régions comme le Kosovo."
BUL_aggressive_assimilation:0 "Assimilation agressive"
BUL_aggressive_assimilation_desc:0 "Des programmes de bulgarisation forcée seront mis en place dans les différentes régions annexées : éducation, signalisation routière, administration… tout sera fait pour en faire des régions modèles de la Grande Bulgarie."
BUL_demand_albanian_subjugation:0 "Exiger la soumission [ALB.GetAdjective]"
BUL_demand_albanian_subjugation_desc:0 "[ALB.GetNameDefCap] est faible, dirigée par un roi fantoche. Si nous n’intervenons pas rapidement, elle pourrait tomber entre les mains de [ITA.GetLeader] et de ses rêves funestes de conquête méditerranéenne. Nous lui proposerons de rejoindre un État peuplé de ses frères. Ce n’est pas comme si elle pouvait dire non !"
BUL_politicize_the_trade_union:0 "Politiser les syndicats libres"
BUL_politicized_trade_union_desc:0 "Maintenant que nous avons établi un régime démocratique, l’étape suivante consiste à atteindre le peuple. Un gouvernement détesté par la population n’en est pas un. Cependant, il existe un moyen de renforcer la confiance du peuple dans l’État. Le Syndicat libre est un syndicat [BUL.GetAdjective] influent, et beaucoup d’ouvriers ordinaires y sont membres ou liés. Si nous parvenons à politiser ce syndicat (resté largement apolitique jusqu’à présent), nous pourrons accroître notre soutien et renforcer notre contrôle sur [BUL.GetNameDef]."
BUL_intergrate_womens_rights_organizations:0 "Intégrer les organisations pour les droits des femmes"
BUL_intergrate_womens_rights_organizations_desc:0 "Autrefois, les femmes se voyaient refuser de nombreux droits dont jouissaient leurs homologues européennes. Maintenant que nous avons aboli une grande partie de ce régime rétrograde, nous pouvons nous appuyer sur de puissantes militantes pour les droits des femmes, comme les Blagolev. Dimitar Blagolev était membre de notre parti, et sa femme a fondé l’un des premiers groupes de défense des droits des femmes dans notre grande nation. En promouvant des personnalités comme elle au gouvernement et en accordant des droits aux femmes, nous instaurerons une plus grande égalité dans tout [BUL.GetNameDef]."
BUL_request_macedonian_autonomy:0 "Demander l’autonomie macédonienne"
BUL_request_macedonian_autonomy_desc:0 "La Macédoine est un problème difficile à résoudre. Avec des Macédoniens divisés entre deux nations, de puissants mouvements indépendantistes et militants ont vu le jour. Accorder (ou au moins défendre) l’indépendance de la Macédoine faciliterait la gestion du pays et réduirait les pertes économiques. Les tensions avec la minorité macédonienne commenceraient alors à s’apaiser."
BUL_promote_republicanism:0 "Abolir la monarchie"
BUL_strength_of_the_tsar:0 "La force du tsar"
#parties
BUL_democrat_party:0 "DP"
BUL_democrat_party_long:0 "Parti démocratique (Demokraticheska partia)"
BUL_agrarian_party:0 "BZNS"
BUL_agrarian_party_long:0 "Union nationale agraire bulgare (Balgarski Zemedelski Naroden Sajuz)"
BUL_socdem_party:0 "BRSP"
BUL_socdem_party_long:0 "Parti social-démocrate ouvrier bulgare (Balgarska rabotnicheska sotsialdemokraticheska partia)"

#Technologie
BUL_motorized_equipment_1:0 "Fiat 626"
BUL_motorized_equipment_1_short:0 "Fiat 626"
BUL_motorized_equipment_1_desc:0 "Le Fiat 626 était un camion moyen utilisé par l’armée bulgare pour le transport militaire."
BUL_light_tank_equipment_1:0 "Carro Veloce L3/33"
BUL_light_tank_equipment_1_short:0 "CV33"
BUL_light_tank_equipment_1_desc:0 "Le CV33 italien était une tankette développée en Italie. Plusieurs exemplaires furent importés en Bulgarie avant la Seconde Guerre mondiale."
BUL_light_tank_equipment_2:0 "Char T-11"
BUL_light_tank_equipment_2_short:0 "T-11"
BUL_light_tank_equipment_2_desc:0 "Le char T-11 fut acquis par la Bulgarie avant la Seconde Guerre mondiale. C’était une version modifiée localement du Škoda CKD Lt vz.35, dotée d’un meilleur canon, d’une vitesse accrue et d’une maniabilité améliorée."
BUL_light_tank_equipment_3:0 "Char T-12"
BUL_light_tank_equipment_3_short:0 "T-12"
BUL_light_tank_equipment_3_desc:0 "Le T-12 était un char modifié par les Bulgares, basé sur le LT vz. 38 tchécoslovaque. Ces chars furent plus tard fournis à la Bulgarie par l’Allemagne."
BUL_medium_tank_equipment_1:0 "Panzerkampfwagen III"
BUL_medium_tank_equipment_1_short:0 "T3G"
BUL_medium_tank_equipment_1_desc:0 "Le Ram Mark I était un char produit par la Bulgarie pour son armée. Ce char performant était équipé d’un canon de 6 livres."
BUL_medium_tank_equipment_2:0 "Maybach T4G Ausf. F2/G"
BUL_medium_tank_equipment_2_short:0 "T4G"
BUL_medium_tank_equipment_2_desc:0 "Le Panzer IV Maybach T4G était la variante bulgare du Panzer IV. Il était équipé d’un canon différent de ses homologues, mais restait sinon identique."
BUL_medium_tank_equipment_3:0 "Panzerkampfwagen IV Ausf. H"
BUL_medium_tank_equipment_3_short:0 "T-4"
BUL_medium_tank_equipment_3_desc:0 "Le T-4 était la version bulgare du Panzer IV. Il possédait des jupes latérales en standard, mais restait sinon inchangé."
BUL_CAS_equipment_1:0 "DAR 3 Garian I"
BUL_CAS_equipment_1_short:0 "DAR 3"
BUL_cv_CAS_equipment_1:0 "DAR 3 version embarquée"
BUL_cv_CAS_equipment_1_short:0 "DAR 3 CV"
BUL_CAS_equipment_2:0 "DAR 10"
BUL_CAS_equipment_2_short:0 "DAR 10"
BUL_CAS_equipment_2_desc:0 "DAR 10"
BUL_cv_CAS_equipment_2:0 "DAR 10 version embarquée"
BUL_cv_CAS_equipment_2_short:0 "DAR 10 CV"
BUL_CAS_equipment_3:0 "DAR 10F"
BUL_CAS_equipment_3_short:0 "DAR 10F"
BUL_CAS_equipment_3_desc:0 "DAR 10F"
BUL_cv_CAS_equipment_3:0 "DAR 10F version embarquée"
BUL_cv_CAS_equipment_3_short:0 "DAR 10F CV"
BUL_fighter_equipment_2:0 "DAR 11"
BUL_fighter_equipment_2_short:0 "DAR 11"
BUL_fighter_equipment_2_desc:0 "L’armée bulgare s’intéressait au modèle tchèque « Avia B-135 » et négocia pour le produire localement sous le nom « DAR 11 ». Malheureusement, le constructeur bulgare ne put mener à bien cette production et les prototypes tchèques furent finalement utilisés comme avions d’entraînement. L’armée bulgare se tourna alors vers le « Bf 109 »."
BUL_fighter_equipment_3:0 "LAZ 12"
BUL_fighter_equipment_3_short:0 "LAZ 12"
BUL_fighter_equipment_0:0 "DAR 1"
BUL_fighter_equipment_0_short:0 "DAR 1"
BUL_jet_fighter_equipment_1:0 "LAZ 14"
BUL_jet_fighter_equipment_1_short:0 "LAZ 14"

BUL_mobilized_proletariat:0 "Prolétariat mobilisé"

#Événements
axis_minors_bulgaria.1.t:0 "[BUL.GetNameDefCap] annonce son soutien au communisme à caractéristiques balkaniques"
axis_minors_bulgaria.1.d:0 "Avec le succès des révolutions prolétariennes dans les deux pays, nous avons établi d’excellentes relations avec [BUL.GetNameDef]. Il s’avère qu’ils approuvent notre choix de nous éloigner de l’influence de Moscou et souhaitent conclure une alliance unissant nos deux nations."
axis_minors_bulgaria.1.a:0 "Cela accélérera nos projets à long terme."
axis_minors_bulgaria.1.b:0 "Nous n’avons pas besoin de leur aide."
axis_minors_bulgaria.27.t:0 "Élections"
axis_minors_bulgaria.27.d:0 "Le tsar a récemment accordé le droit de vote à la population et annoncé des élections pour déterminer les droits du peuple. Après dépouillement, il est clair que les partis extrémistes radicaux ont perdu, laissant la place à quelques partis modérés. Qui l’emporte ?"
axis_minors_bulgaria.27.a:0 "Le DP l’emporte."
axis_minors_bulgaria.27.b:0 "Le BZNS l’emporte."
axis_minors_bulgaria.27.c:0 "Le BRSP l’emporte."

axis_minors_bulgaria.28.t:0 "Suspendre Kyoseivanov"
axis_minors_bulgaria.28.d:0 "Le Premier ministre Georgi Kyoseivanov a abusé de son pouvoir, et sa violation de la Constitution de Tarnovo ne doit pas rester impunie. Il mérite d’être démis de ses fonctions pour ses actions contre la patrie."
axis_minors_bulgaria.28.a:0 "Dehors, ce fasciste corrompu !"

axis_minors_bulgaria.29.t:0 "Révolution communiste"
axis_minors_bulgaria.29.d:0 "Nous avons lentement gagné en influence et désormais une partie non négligeable de la population nous soutient ; il n’y a pas de meilleur moment pour lancer une révolution et renverser ces fascistes corrompus !"
axis_minors_bulgaria.29.a:0 "Une nouvelle ère commence !"

axis_minors_bulgaria.30.t:0 "La question du réarmement [BUL.GetAdjective]"
axis_minors_bulgaria.30.d:0 "Le Premier ministre [BUL.GetAdjective] nous a envoyé une demande visant à lever les restrictions imposées à l’armée [BUL.GetAdjective] après la signature du traité de Neuilly-sur-Seine. Comment devons-nous répondre ?"
axis_minors_bulgaria.30.a:0 "Conviez-les à Salonique ; ils ont retenu la leçon."
axis_minors_bulgaria.30.b:0 "Cela ne ferait que déclencher un second grand conflit."

axis_minors_bulgaria.31.t:0 "Réponse à l’accord de Salonique"
axis_minors_bulgaria.31.d:0 "Des délégués [BUL.GetAdjective] et [GRE.GetAdjective] se sont rendus à Salonique pour discuter du réarmement. Au final, ils ont décidé d’autoriser [BUL.GetNameDef] à se réarmer en vue d’un futur conflit. Comment réagir face à cette décision ?"
axis_minors_bulgaria.31.a:0 "Nous pouvons nous aligner sur cela."
axis_minors_bulgaria.31.b:0 "Envoyer une protestation diplomatique."

axis_minors_bulgaria.32.t:0 "L’accord de Salonique"
axis_minors_bulgaria.32.d:0 "Aujourd’hui, des délégués [BUL.GetAdjective] et [GRE.GetAdjective] se sont réunis à Salonique pour signer un accord nous permettant de nous réarmer. Nous pouvons désormais nous préparer pleinement à la guerre qui approche."
axis_minors_bulgaria.32.a:0 "En ces temps, tout le monde devrait pouvoir se réarmer."

axis_minors_bulgaria.33.t:0 "La question de la Dobroudja méridionale"
axis_minors_bulgaria.33.d:0 "[BUL.GetNameDefCap] nous a envoyé un télégramme proposant notre participation à un pacte commercial balkanique, mais seulement en échange du retour de la Dobroudja méridionale."
axis_minors_bulgaria.33.a:0 "Un échange équitable."
axis_minors_bulgaria.33.b:0 "Nous ne pouvons pas céder notre territoire."

axis_minors_bulgaria.34.t:0 "Succès des négociations pour la Dobroudja"
axis_minors_bulgaria.34.d:0 "[ROM.GetNameDef] a accepté nos conditions et cédé la Dobroudja méridionale. Cela nous sera grandement bénéfique."
axis_minors_bulgaria.34.a:0 "C’est un grand jour."

axis_minors_bulgaria.35.t:0 "Échec des négociations pour la Dobroudja"
axis_minors_bulgaria.35.d:0 "Les diplomates [ROM.GetAdjective] ont refusé de nous céder la Dobroudja. Cependant, nous ne pouvons pas répondre de manière agressive à ce refus."
axis_minors_bulgaria.35.a:0 "Après tout, ce n’est qu’un bout de terre."

axis_minors_bulgaria.36.t:0 "Pacte de non-agression avec [BUL.GetNameDef]"
axis_minors_bulgaria.36.d:0 "[BUL.GetNameDefCap] nous propose un pacte de non-agression. Cela améliorera nos relations et évitera une guerre."
axis_minors_bulgaria.36.a:0 "Pourquoi pas ?"
axis_minors_bulgaria.36.b:0 "Nous ne passons pas d’accords avec des capitalistes."

axis_minors_bulgaria.37.t:0 "Traité de non-agression [SOV.GetAdjective]"
axis_minors_bulgaria.37.d:0 "[SOV.GetNameDefCap] a signé l’accord de non-agression entre nos deux nations. Cela évitera un conflit d’ampleur relativement importante."
axis_minors_bulgaria.37.a:0 "De nombreuses vies viennent d’être épargnées."

axis_minors_bulgaria.38.t:0 "Refus [SOV.GetAdjective]"
axis_minors_bulgaria.38.d:0 "Les [SOV.GetAdjective] ont répondu à notre proposition d’accord. Cela peut signifier qu’ils envisagent un conflit futur. Mais rien n’est certain."
axis_minors_bulgaria.38.a:0 "Prions pour les jeunes hommes de [BUL.GetNameDef]."

axis_minors_bulgaria.39.t:0 "Amélioration de l’industrie militaire"
axis_minors_bulgaria.39.d:0 "Notre industrie lourde a atteint un nouveau niveau de développement. Cependant, elle peut encore être améliorée au-delà de ce stade."
axis_minors_bulgaria.39.a:0 "Accélérons la production !"

axis_minors_bulgaria.41.t:0 "Préparer le terrain"
axis_minors_bulgaria.41.d:0 "Les actions de l’Union militaire ont exercé une pression excessive sur le gouvernement qu’elle prétend représenter. Si [BUL.GetNameDef] veut survivre en tant que nation, elle doit se débarrasser de ces éléments rebelles qui agissent dans l’ombre et mettre fin à leurs tentatives de renverser le gouvernement ou de saboter ses politiques."
axis_minors_bulgaria.41.a:0 "Lancer l’opération."
axis_minors_bulgaria.42.t:0 "Statut de l’Union militaire"
axis_minors_bulgaria.42.d:0 "Si nos efforts initiaux n’ont permis de capturer que les membres les plus téméraires de l’Union militaire, nous arrêtons désormais de plus en plus de ses membres. Les aveux d’opérateurs de bas niveau sont obtenus en échange de promesses de clémence s’ils coopèrent. Naturellement, le gouvernement ne voit aucune raison d’accorder quoi que ce soit à ces traîtres, même s’ils coopèrent."
axis_minors_bulgaria.42.a:0 "Redoublons d’efforts pour traquer ces chiens traîtres !"

axis_minors_bulgaria.43.t:0 "La rafle finale"
axis_minors_bulgaria.43.d:0 "Les efforts conjoints de l’armée et de nos forces de police ont permis de capturer efficacement les derniers traîtres présents dans notre pays. Tous les coupables ayant été arrêtés, nous pouvons désormais passer au procès de ces traîtres."
axis_minors_bulgaria.43.a:0 "Le procès n’est qu’une formalité ; ils seront pendus à l’aube."

axis_minors_bulgaria.44.t:0 "L’ultimatum de Dobroudja"
axis_minors_bulgaria.44.d:0 "Les [BUL.GetAdjective]s nous ont envoyé un ultimatum via leur émissaire diplomatique concernant le statut du territoire de la Dobroudja, que nous contrôlons. Cela s’accompagne d’une posture de plus en plus hostile depuis quelques semaines et de manœuvres militaires visant à nous intimider. Quelle sera notre réponse à cette lettre audacieuse ?"
axis_minors_bulgaria.44.a:0 "Nous accepterons leurs exigences, ne serait-ce que pour éviter une nouvelle guerre."
axis_minors_bulgaria.44.b:0 "Nous n’avons pas peur des [BUL.GetAdjective]s. Rejetez cet ultimatum absurde."

axis_minors_bulgaria.45.t:0 "Refus des [ROM.GetAdjective]s"
axis_minors_bulgaria.45.d:0 "L’émissaire diplomatique est revenu avec la réponse officielle de [ROM.GetNameDef]. Ils ont refusé notre ultimatum et doivent maintenant recevoir une leçon."
axis_minors_bulgaria.45.a:0 "Mobilisez nos forces et convoquez l’état-major."

axis_minors_bulgaria.46.t:0 "Acceptation des [ROM.GetAdjective]s"
axis_minors_bulgaria.46.d:0 "L’émissaire diplomatique est revenu avec la réponse officielle de [ROM.GetNameDef]. Le reste de la Dobroudja fera désormais partie de [BUL.GetNameDef]."
axis_minors_bulgaria.46.a:0 "Tout est comme il se doit !"

axis_minors_bulgaria.47.t:0 "La question de la Thrace et de la Macédoine"
axis_minors_bulgaria.47.d:0 "Les territoires de Thrace et de Macédoine abritent depuis longtemps de nombreux Bulgares. [BUL.GetNameDefCap] le revendique depuis toujours et envoie désormais des messages, par le biais de ses émissaires diplomatiques, exigeant sans détour le transfert de la Thrace et de la Macédoine de [GRE.GetNameDef] vers [BUL.GetNameDef]. Quelle sera notre réponse ?"
axis_minors_bulgaria.47.a:0 "Nous acceptons."
axis_minors_bulgaria.47.b:0 "Nous ne céderons pas la Macédoine, mais offrirons la Thrace aux [BUL.GetAdjective]s en compromis."
axis_minors_bulgaria.47.c:0 "Absurde ! Cette question entière est une farce !"

axis_minors_bulgaria.48.t:0 "Refus [GRE.GetAdjective]"
axis_minors_bulgaria.48.d:0 "[GRE.GetNameDefCap] a catégoriquement rejeté nos conditions concernant le transfert territorial de la Thrace et de la Macédoine."
axis_minors_bulgaria.48.a:0 "C’est un outrage ! Convoquez l’état-major et préparez la guerre !"

axis_minors_bulgaria.49.t:0 "[GRE.GetNameDefCap] accepte"
axis_minors_bulgaria.49.d:0 "Bien qu’il soit évident que [GRE.GetNameDef] ne partage pas nos revendications sur la Thrace et la Macédoine, ils ont tout de même accepté les termes du document."
axis_minors_bulgaria.49.a:0 "Notre peuple est enfin réuni !"

axis_minors_bulgaria.50.t:0 "Contre-offre [GRE.GetAdjective]"
axis_minors_bulgaria.50.d:0 "Tout en refusant de reconnaître nos revendications légitimes sur la Macédoine, ils nous ont fait une contre-offre : le transfert de la Thrace dans notre sphère d’influence. Ce n’est pas tout ce que nous voulions, mais cela pourrait malgré tout s’avérer bénéfique pour notre nation."
axis_minors_bulgaria.50.a:0 "Nous accepterons la Thrace, mais ce dossier n’est pas clos."

axis_minors_bulgaria.51.t:0 "Ultimatum du Vardar"
axis_minors_bulgaria.51.d:0 "À mesure que [BUL.GetNameDef] se renforce, elle continue de chercher à restaurer ses frontières. [BUL.GetNameDefCap] a envoyé un document exigeant le retour du territoire du Vardar à son « propriétaire légitime », à savoir [BUL.GetNameDef].\nQue répondrons-nous à une exigence aussi audacieuse ?"
axis_minors_bulgaria.51.a:0 "Permettons aux [BUL.GetAdjective]s de le contrôler pour maintenir la paix."
axis_minors_bulgaria.51.b:0 "Rejetez immédiatement ces absurdités."

axis_minors_bulgaria.52.t:0 "Refus [YUG.GetAdjective]"
axis_minors_bulgaria.52.d:0 "La réponse [YUG.GetAdjective] a été aussi rapide que concise : la nation refuse de reconnaître notre revendication légitime sur le Vardar et rejette l’idée de nous en transférer le contrôle."
axis_minors_bulgaria.52.a:0 "C’est un outrage ! Convoquez l’état-major et préparez la guerre !"

axis_minors_bulgaria.53.t:0 "[YUG.GetNameDef] accepte"
axis_minors_bulgaria.53.d:0 "Que [YUG.GetNameDef] ne voie aucune raison de verser le sang pour le Vardar ou qu’ils reconnaissent la puissance de notre armée, ils ont tout de même accepté nos exigences. Le Vardar est à nous !"
axis_minors_bulgaria.53.a:0 "Nous accueillons à nouveau les Bulgares du Vardar dans notre nation !"

axis_minors_bulgaria.54.t:0 "La marche sur Sofia"
axis_minors_bulgaria.54.d:0 "Nous avons rassemblé suffisamment de soutien pour enfin exiger le contrôle du pays au tsar, au profit de notre nouveau dirigeant Hristo Lukov, imitant ainsi l’ascension de Benito Mussolini. Dès à présent, une nouvelle ère s’ouvre pour [BUL.GetNameDef]."
axis_minors_bulgaria.54.a:0 "Nous devons maintenant conserver notre emprise sur [BUL.GetNameDef]."

axis_minors_bulgaria.55.t:0 "Le nouvel héritier"
axis_minors_bulgaria.55.d:0 "Un nouveau-né vient de voir le jour en [BUL.GetNameDef]. Fils du tsar Boris et de Giovanna d’Italie, il sera bientôt appelé à mener [BUL.GetNameDef] vers la grandeur, tout comme son père avant lui."
axis_minors_bulgaria.55.a:0 "Bénissons-le."

axis_minors_bulgaria.56.t:0 "Mort du tsar Boris III"
axis_minors_bulgaria.56.d:0 "Des forces inconnues ont assassiné le tsar Boris III. Il a été retrouvé gisant au sol dans le palais, probablement empoisonné. La police n’a trouvé aucune piste pour identifier le meurtrier. Cependant, des rumeurs circulent selon lesquelles les [GER.GetAdjective]s seraient responsables. Quoi qu’il en soit, une régence a été instaurée pour diriger [BUL.GetNameDef] jusqu’à la majorité du jeune Siméon. Qui doit être régent en chef ?"
axis_minors_bulgaria.56.a:0 "Kyril, le frère du défunt tsar."
axis_minors_bulgaria.56.b:0 "Bogdan Filov, le Premier ministre."
axis_minors_bulgaria.57.t:0 "Premier congrès communiste national"
axis_minors_bulgaria.57.d:0 "Tout récemment, nous avons pris le pouvoir en Bulgarie. À la tête de la révolution se trouve le camarade Georgi Dimitrov, dont les idées en matière de communisme sont très expérimentales. Naturellement, de nombreux membres du parti estiment désormais qu’il devrait démissionner au profit d’un autre secrétaire, tel que Christian Rakovsky ou Valko Tchervenkov, qui considèrent que la meilleure forme de communisme est le stalinisme. Ont-ils raison ?"
axis_minors_bulgaria.57.a:0 "Dimitrov doit rester."
axis_minors_bulgaria.57.b:0 "L’expérimentalisme peut mener une nation entière à sa perte."
axis_minors_bulgaria.57.c:0 "Rakovsky jouera un rôle essentiel dans la révolution mondiale."

axis_minors_bulgaria.58.t:0 "Les exigences [BUL.GetAdjective]"
axis_minors_bulgaria.58.d:0 "[BUL.GetNameDefCap] nous a menacés d’invasion si nous ne cédons pas à leurs exigences, qui incluent la mise en place d’un gouvernement communiste et notre intégration forcée dans une alliance avec eux. Comment devons-nous répondre à cela ?"
axis_minors_bulgaria.58.a:0 "Protégeons notre peuple en cédant."
axis_minors_bulgaria.58.b:0 "Rejetons ces exigences scandaleuses."

axis_minors_bulgaria.59.t:0 "[ALB.GetNameDefCap] accepte"
axis_minors_bulgaria.59.desc:0 "[BUL.GetNameDefCap] a récemment récupéré le territoire macédonien du Vardar. Ils ont désormais une frontière avec nous mais, à notre grand désarroi, ils nous menacent d’invasion si nous ne cédons pas à leurs exigences, qui comprennent, entre autres, la mise en place d’un gouvernement communiste et notre intégration forcée dans leur alliance. Comment devons-nous répondre ?"
axis_minors_bulgaria.59.a:0 "Protégeons notre peuple en cédant."

axis_minors_bulgaria.60.t:0 "[ALB.GetNameDefCap] refuse"
axis_minors_bulgaria.60.desc:0 "[ALB.GetNameDefCap] a défié notre puissance et rejeté nos exigences. Ignorent-ils donc qu’ils ne peuvent nous vaincre en aucune façon ?"
axis_minors_bulgaria.60.a:0 "Pff… nous n’avons pas besoin de leurs terres de toute façon."
axis_minors_bulgaria.60.b:0 "Alors ce sera la guerre."

axis_minors_bulgaria.61.t:0 "[BUL.GetNameDefCap] propose un pacte commercial"
axis_minors_bulgaria.61.d:0 "Les représentants [BUL.GetAdjective]s nous ont fait part de leur intention de créer une alliance commerciale balkanique. Comment devons-nous répondre ?"
axis_minors_bulgaria.61.a:0 "Pourquoi pas ?"
axis_minors_bulgaria.61.b:0 "Cela ne nous aidera pas."

axis_minors_bulgaria.62.t:0 "[TUR.GetNameDefCap] signe le pacte"
