l_french:

is_AH_tt:0 "Est §YAutriche-Hongrie§!"

HUN_moderate_restoration:0 "Restauration modérée"
HUN_moderate_restoration_desc:0 "Face à la cruauté et à la souffrance engendrées par le nationalisme radical comme par le communisme, le roi et empereur Otto a décidé de ne pas revendiquer de territoires étrangers afin d’épargner à l’Europe une nouvelle catastrophe."

HUN_fortification_cooperation:0 "Coopération pour les fortifications"
HUN_fortification_cooperation_desc:0 "Nos ressources communes pourraient nous permettre d’éviter le pire."

HUN_papal_blessing:0 "Bénédiction papale"
HUN_papal_blessing_desc:0 "Les Habsbourg ont soutenu l’Église une, sainte, catholique et apostolique durant des siècles."

HUN_invite_croatia:0 "Inviter la Croatie"
HUN_invite_croatia_desc:0 "Les Croates sont liés à nous depuis longtemps. Ils pourraient devenir des alliés fiables."

HUN_alliance_with_the_kaiserreich:0 "Alliance avec le Kaiserreich"
HUN_alliance_with_the_kaiserreich_desc:0 "L’influence industrielle des [GER.GetAdjective] sur notre pays rend une alliance diplomatique presque inévitable."

HUN_form_the_mdp:0 "Former le MDP"
HUN_form_the_mdp_desc:0 "Nous devons réorganiser les partis politiques en créant un front uni et en incluant les nombreux partis de gauche, avec le Parti communiste à leur tête."

HUN_turn_the_adriatic_red:0 "Rougir l’Adriatique"
HUN_turn_the_adriatic_red_desc:0 "Le corrompu [YUG.GetName] a trop longtemps opprimé les mouvements ouvriers balkaniques. Notre devoir premier est de libérer le prolétariat et de lui montrer les valeurs du communisme !"

HUN_liberate_the_austrians:0 "Libérer les [AUS.GetAdjective]"
HUN_liberate_the_austrians_desc:0 "Le Parti communiste d’Autriche, le KPÖ, a été contraint à la clandestinité par le décret d’urgence du gouvernement austrofasciste en 1933. Sans soutien extérieur, le parti ne peut pas guider le peuple [AUS.GetAdjective] vers la prospérité qu’il mérite. Nous allons changer cela pour toujours !"

HUN_expand_the_levente:0 "Développer la Levente"
HUN_expand_the_levente_desc:0 "Les associations Levente sont une organisation paramilitaire existant depuis 1921, créée initialement pour l’entraînement physique et sanitaire, mais militarisée par la suite afin de contourner les restrictions du traité de Trianon."

HUN_demand_the_coastline:0 "[ROOT.GetHUNdemandthecoastline]"
HUN_demand_the_coastline_desc:0 "L’héritage du royaume de Hongrie comprend les territoires côtiers de Dalmatie, perdus face aux Ottomans il y a cinq siècles. Si nous voulons retrouver notre gloire d’antan, nous devrons exiger ou conquérir ces territoires !"
GetHUNdemandthecoastlinenormal_KEY:0 "Revendiquer le littoral"
GetHUNdemandthecoastlineitaly_KEY:0 "Négocier le littoral"

HUN_integrate_southern_slovakia:0 "Intégrer la Slovaquie méridionale"

HUN_gyor_program_investment:0 "Investissements du programme de Győr"
HUN_gyor_program_decision_category:0 "Le programme de Győr"
HUN_gyor_program_decision_category_desc:0 "Le programme de Győr est un plan qui doit permettre au pays d’augmenter sa production d’armement et de rééquiper l’armée [ROOT.getAdjective]."
HUN_support_manufacturers_coordination:0 "Soutenir la coordination des fabricants"

HUN_idea_support_armament_manufacturers:0 "Coordination des fabricants d’armement"

HUN_acquire_skoda_naval_artillery_experience:0 "Acquérir l’expérience navale de Skoda"
HUN_acquire_skoda_naval_artillery_experience_desc:0 "Skoda a conçu les canons de la marine austro-hongroise ; il est temps de mettre à nouveau cette expertise à profit."
HUN_experiment_with_torpedoes:0 "Expérimenter les torpilles"
HUN_experiment_with_torpedoes_desc:0 "Nous devons rattraper notre retard sur les autres nations concernant nos modèles de torpilles, afin de frapper en silence."

HUN_invest_in_north_transylvanian_mining:0 "Investir dans les mines de Transylvanie du Nord"
HUN_invest_in_north_transylvanian_mining_desc:0 "La Transylvanie a une longue tradition minière remontant à plusieurs siècles. Même si ces minerais ne sont pas directement utiles aux usines de guerre, leur exploitation contribuera grandement à l’économie."

HUN_odon_trunkwalter:0 "Ődőn Trunkwalter"
HUN_dezso_winkler:0 "Dezső Winkler"
