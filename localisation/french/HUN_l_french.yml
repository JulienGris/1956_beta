HUN_impose_admiralty_government_GER:0 "Imposer un gouvernement dirigé par l’Amirauté en Allemagne"
HUN_impose_admiralty_government_FRA:0 "Imposer un gouvernement dirigé par l’Amirauté en France"
HUN_try_to_reconcile_with_horthy_loyalists:0 "Tenter de se réconcilier avec les loyalistes de Horthy"

HUN_organize_workers_collectives:0 "Organiser les collectifs ouvriers"
HUN_organize_workers_collectives_desc:0 "En organisant des collectifs ouvriers, nous pourrons prendre le contrôle de l’économie et enfin sceller le sort du capitalisme."

HUN_new_invasion_of_slovakia:0 "Nouvelle invasion de la Slovaquie"
HUN_new_invasion_of_slovakia_desc:0 "Soumettons les Slovaques une bonne fois pour toutes et vengeons notre échec de 1919."

HUN_oil_refining_infrastructure:0 "Infrastructures de raffinage du pétrole"
HUN_oil_refining_infrastructure_desc:0 "Pour exploiter nos gisements pétroliers, nous devons équiper le pays de raffineries et de silos à carburant."

HUN_ally_yugoslavia:0 "S’allier à [YUG.GetNameDef]"
HUN_ally_yugoslavia_desc:0 "[YUG.GetNameDefCap] doit être soutenu et devenir notre allié dans notre lutte pour la libération des travailleurs du monde entier !"

HUN_ally_greece:0 "S’allier à [GRE.GetNameDef]"
HUN_ally_greece_desc:0 "[GRE.GetNameDefCap] doit être soutenu et devenir notre allié dans notre lutte pour la libération des travailleurs du monde entier !"

HUN_ally_bulgaria:0 "S’allier à [BUL.GetNameDef]"
HUN_ally_bulgaria_desc:0 "[BUL.GetNameDefCap] doit être soutenu et devenir notre allié dans notre lutte pour la libération des travailleurs du monde entier !"

HUN_ally_austria:0 "S’allier à [AUS.GetNameDef]"
HUN_ally_austria_desc:0 "[AUS.GetNameDefCap] doit être soutenu et devenir notre allié dans notre lutte pour la libération des travailleurs du monde entier !"


HUN_revolt_of_the_arrow_crosses:0 "Révolte des Croix fléchées"
HUN_revolt_of_the_arrow_crosses_desc:0 "Le soi-disant régent a trahi la mère patrie et son armée pendant des années en accaparant le pouvoir pour lui-même tout en se montrant complaisant envers les oppresseurs étrangers."

HUN_favor_the_army:0 "Favoriser l’armée"
HUN_favor_the_army_desc:0 "Nous devons favoriser l’armée afin de redonner à la Hongrie ses frontières historiques. Nous devons donc tout faire pour servir les intérêts des officiers et apaiser les divisions causées par la destitution de Horthy le traître."

HUN_foreign_aeronautical_assistance:0 "Aide aéronautique étrangère"
HUN_foreign_aeronautical_assistance_desc:0 "Nos alliés peuvent nous aider à produire davantage d’avions."
HUN_foreign_aeronautical_assistance_idea:0 "Aide aéronautique étrangère"


HUN_invite_yugoslavia:0 "Inviter [YUG.GetNameDef]"
HUN_invite_yugoslavia_desc:0 "Le soutien de [YUG.GetNameDef] est essentiel pour l’avenir d’une coalition balkanique durable."

HUN_invite_czechoslovakia:0 "Inviter [CZE.GetNameDef]"
HUN_invite_czechoslovakia_desc:0 "Le soutien de [CZE.GetNameDef] est essentiel pour l’avenir d’une coalition balkanique durable."

HUN_invite_greece:0 "Inviter [GRE.GetNameDef]"
HUN_invite_greece_desc:0 "Le soutien de [GRE.GetNameDef] est essentiel pour l’avenir d’une coalition balkanique durable."

HUN_protect_ruthenia:0 "Protéger la Ruthénie"
HUN_protect_ruthenia_desc:0 "Il est dans notre intérêt, comme dans celui des Magyars et des Ruthènes, de protéger la Ruthénie et de garantir que leurs communautés vivent en paix les unes avec les autres. Ces temps sont déjà assez troublés, nous n’avons pas besoin d’ennemis intérieurs."

HUN_join_the_little_entente:0 "Rejoindre la Petite Entente"
HUN_join_the_little_entente_desc:0 "Nos efforts diplomatiques ont enfin convaincu les [FRA.GetAdjective] que nous ne constituons pas une menace et que nous pouvons régler pacifiquement la question des Magyars vivant hors des frontières [HUN.GetAdjective]. La présence de tyrans menaçant la paix est une préoccupation bien plus grande, contre laquelle les nations libres doivent s’unir."

HUN_join_the_cordon_sanitaire:0 "Rejoindre le cordon sanitaire"
HUN_join_the_cordon_sanitaire_desc:0 "L’alliance [POL.GetAdjective]-[ROM.GetAdjective] est le rempart de l’Europe de l’Est contre la tyrannie ; c’est servir la cause de la liberté que de les rejoindre."

HUN_hungarian_minorities_recruitment_agreement:0 "Accord de recrutement des minorités hongroises"
HUN_hungarian_minorities_recruitment_agreement_desc:0 "Faisons pression sur nos alliés pour qu’ils autorisent leurs citoyens d’origine hongroise à servir dans l’armée [HUN.GetAdjective]."

HUN_rearmament_refused:0 "§YLes membres de la Petite Entente ont refusé le réarmement§!"


HUN_bernadotte_dynastic_ties_decision_category:0 "Liens dynastiques Bernadotte"
HUN_bernadotte_dynastic_ties_decision_category_desc:0 "Le nouveau roi de notre nation est né et a grandi en Suède, où il conserve de solides attaches avec le pays de sa jeunesse."

HUN_hungarian_minorities_recruitment_decision_category:0 "Recrutement des minorités hongroises"
HUN_hungarian_minorities_recruitment_decision_category_desc:0 "Plutôt que de nous lamenter sur le démantèlement de la Grande Hongrie, trouvons un réconfort dans la coopération internationale avec nos voisins. Certains Hongrois vivant à l’étranger pourraient être plus motivés à servir sous le drapeau [HUN.GetAdjective], ce qui permet d’éviter les barrières linguistiques. Nos voisins alliés ont été consciencieusement sollicités et convaincus que c’était pour le bien de la cause commune, et la gravité de notre époque ouvre la porte à des solutions inédites."

HUN_form_swedish_democratic_government_in_exile:0 "Former un gouvernement démocratique [SWE.GetAdjective] en exil"
HUN_recruit_magyars_in_carpathian_ruthenia:0 "Recruter des Magyars en Ruthénie carpathique"
HUN_recruit_magyars_in_vojvodina:0 "Recruter des Magyars en Voïvodine"
HUN_recruit_magyars_in_southern_transylvania:0 "Recruter des Magyars en Transylvanie méridionale"
HUN_recruit_magyars_in_northern_transylvania:0 "Recruter des Magyars en Transylvanie septentrionale"
HUN_recruit_magyars_in_southern_slovakia:0 "Recruter des Magyars en Slovaquie méridionale"
HUN_support_swedish_democratic_government:0 "Soutenir le gouvernement démocratique [SWE.GetAdjective]"
HUN_restore_swedish_democracy:0 "Restaurer la démocratie [SWE.GetAdjective]"

r56_hungary_6.t:0 "Rejoindre Charles Bernadotte"
r56_hungary_6.desc:0 "Rejoindre Charles Bernadotte"
r56_hungary_6.a:0 "À la victoire !"
r56_hungary_6.b:0 "Durr durr, la mort vaut mieux."

HUN_balkan_pact_preparation:0 "Préparatifs militaires de [HUN.getfactionname]"

HUN_claim_south_tyrol:0 "Revendiquer le Tyrol du Sud"


r56_hungary_coastline.1.t:0 "La Hongrie revendique les possessions de la Grande Hongrie"
r56_hungary_coastline.1.d:0 "Le [HUN.GetName] a utilisé l’héritage du royaume de Hongrie comme casus belli pour revendiquer les possessions de la Grande Hongrie."
r56_hungary_coastline.1.a:0 "Donnez-les-leur."
r56_hungary_coastline.1.b:0 "Qui croient-ils être, à nier la Grande Italie ?!"

r56_hungary_coastline.2.t:0 "Les [ITA.GetName] acceptent !"
r56_hungary_coastline.2.d:0 "Les [ITA.GetName] ont cédé à nos exigences concernant la Grande Hongrie !"
r56_hungary_coastline.2.a:0 "Excellent."

r56_hungary_coastline.3.t:0 "Les [ITA.GetName] refusent notre demande"
r56_hungary_coastline.3.d:0 "Les [ITA.GetName] ont rejeté notre revendication, sachant parfaitement quelle en est l’alternative."
r56_hungary_coastline.3.a:0 "Alors c’est la guerre."

r56_hungary_7.t:0 "[ITA.GetLeader] invite [YUG.GetNameDef] à rejoindre le [HUN.getfactionname]"
r56_hungary_7.desc:0 "Avec son habituel panache diplomatique, [ITA.GetLeader] a décidé d’agir seul et d’inviter [YUG.GetLeader] à signer un traité d’alliance, les liant au [HUN.getfactionname]. Bien qu’il soit agréable d’avoir de nouveaux alliés, cela pourrait entraver la restauration de la Hongrie historique."
r56_hungary_7.a:0 "Mieux vaut ça que d’être entouré d’ennemis."


