# Événements
grl.1:0 "L’accord Hull-Kauffmann"
grl.1.t:0 "L’accord Hull-Kauffmann"
grl.1.d:0 "Le gouvernement [DEN.GetAdjective] est récemment tombé face aux armées fascistes, mais le territoire colonial du Groenland reste libre de toute ingérence fasciste. Par chance, un diplomate [DEN.GetAdjective] du nom de Henrik Kauffmann nous a récemment approchés au sujet de la situation au Groenland. Il agit « au nom du Roi » et avec l’autorité du gouvernement [DEN.GetAdjective] récemment exilé.\n\nLes autorités de Nuuk ont contacté Kauffmann avec cette requête, préférant une occupation [USA.GetAdjective] plutôt qu’une occupation possible par [ENG.GetNameDef] ou [CAN.GetNameDef]. Ou pire encore, une puissance fasciste. Cet accord est peut-être juridiquement douteux en termes de droit international… mais nous avons la responsabilité de protéger toutes les terres et les peuples du Nouveau Monde contre les menaces fascistes ; cela inclut le Groenland.\n\nQuelle voie devons-nous suivre ?"
grl.1.a:0 "Placer immédiatement le Groenland sous notre contrôle direct."
grl.1.b:0 "Laisser le gouvernement local de Nuuk prendre le contrôle. Mais nous devons garantir leur sécurité."
grl.1.c:0 "Ne nous impliquons pas."

