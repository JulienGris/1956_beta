# Idée spéciale (humoristique / Easter egg ?)
GRL_the_carrier_which_came_in_from_the_cold:0 "Le porte-avions venu du froid"
GRL_the_carrier_which_came_in_from_the_cold_desc:0 "Notre position géographique nous permet de développer un immense porte-avions à base de glace. Il nous permettrait de dominer partout où brillent les aurores boréales et de soutenir des débarquements jusque dans les cuisines où certains restent cachés."
