MEX_foreign_affairs:0 "Affaires étrangères"
MEX_invite_FROM_to_the_treaty:0 "Inviter [FROM.getNameDef] au traité"
MEX_invite_FROM_to_the_treaty_tt:0 "Débloque £decision_icon_small pour §Yinviter§! les pays indépendants d’Amérique latine à rejoindre notre alliance !"

#tooltips
MEX_pan_american_highway_tt:0 "Cet Esprit national sera supprimé une fois le focus « §YLa route panaméricaine§! » complété par le Mexique."

fierro:0 "Roberto Fierro"
abelardo:0 "Abelardo Rodríguez"
abelardo_desc:0 "Abelardo fut un magnat des affaires, général mexicain et président intérimaire du Mexique. Il fonda 80 entreprises et participa à 120 au total. Il créa Baja California, un sous-traitant militaire aéronautique, ainsi que les chantiers navals Rodríguez à Tijuana."

rodriguez:0 "Chantiers navals Rodríguez"
rodriguez_desc:0 "Propriété du magnat des affaires et ancien président mexicain Abelardo Rodríguez, les chantiers navals Rodríguez étaient situés à Tijuana. D’après les rares informations disponibles, ils se concentraient sur des navires de petite taille."

MEX_almazan:0 "Juan Almazán"
MEX_almazan_desc:0 "Juan fut décrit comme un homme d’affaires déguisé en général. Son principal secteur d’activité était la construction militaire : sa société fut responsable de la construction de la plus grande base militaire du Mexique, à Monterrey, dans les années 1920."

Maximino2:0 "Maximino Ávila Camacho"
Maximino2_desc:0 "Maximino fut le Caudillo de Puebla, où il possédait les télégraphes, les chemins de fer, les mines et la plupart des infrastructures. À cette époque, le Mexique faisait appel aux ingénieurs militaires pour construire rapidement infrastructures et bâtiments, Maximino y prenant une part active. Pour cette raison, Maximino serait un expert en logistique, capable d’apporter son expérience en matière de lignes d’approvisionnement et de construction d’infrastructures à tout conflit."

Maximino3:0 "Maximino Ávila Camacho"
Maximino3_desc:0 "Les historiens mexicains décrivaient Maximino comme arrogant, colérique et vindicatif. On disait de lui qu’il s’en prenait avec une extrême sévérité à ceux qui osaient le défier."

MEX_MARC:0 "El Compa Nacho"
MEX_MARC_desc:0 "El Compa Nacho, de son vrai nom Ignacio Morales, était un agent lié à la fois aux groupes cardénistes et alémanistes, et aurait reçu des missions spéciales de leur part. Morales fut accusé par les partisans d’Almazán d’être impliqué dans un complot d’assassinat raté contre ce dernier. Source : « Political Intelligence and the Creation of Modern Mexico, 1938-1954 », p. 46."

lopez:0 "Raúl López Sánchez"

pawling1:0 "Alberto J. Pawling"
pawling2:0 "Alberto J. Pawling"

MEX_agrarian_army:0 "Union agraire"
MEX_agrarian_army_desc:0 ""

MEX_constable_army:0 "Armée de constables"
MEX_constable_army_desc:0 "L’armée mexicaine fut longtemps tournée vers le maintien de l’ordre intérieur et manquait de la structure nécessaire pour affronter efficacement des menaces extérieures. Durant cette période, les Caudillos représentaient une menace sérieuse pour la paix nationale, forçant le gouvernement à employer l’armée dans des projets d’ingénierie. Cela permettait non seulement d’occuper les effectifs afin que les Caudillos ne puissent lever de rébellions, mais aussi d’améliorer en parallèle les infrastructures nationales."

MEX_constable_army_caudillos_sided:0 "Armées des Caudillos"
MEX_constable_army_caudillos_sided_desc:0 "Le renforcement du pouvoir des Caudillos a conduit à la domination de secteurs locaux par des armées privées. Pour le meilleur ou pour le pire, c’est au moins un pas en avant vers une structure militaire plus fiable."

MEX_low_literacy_rate:0 "Faible taux d’alphabétisation"
MEX_low_literacy_rate_desc:0 "En 1936, le Mexique affichait un taux d’alphabétisation d’environ 40 %. La principale cause résidait dans la répartition de la population, majoritairement rurale, tandis que l’accès à l’éducation était concentré dans les zones urbaines."

MEX_heavily_subsidized_rural_education:0 "Éducation rurale fortement subventionnée"

MEX_conservative_education:0 "Éducation conservatrice"
MEX_conservative_education_desc:0 ""

MEX_modernize_the_education_system:0 "Moderniser le système éducatif"
MEX_modernize_the_education_system_desc:0 ""

MEX_major_economic_sanctions:0 "Sanctions économiques majeures"
MEX_major_economic_sanctions_desc:0 "Les sanctions économiques étrangères ont un impact catastrophique sur l’ensemble du paysage économique et industriel du Mexique."

MEX_small_aviation_industry:0 "Blocage de l’industrie aéronautique"
MEX_small_aviation_industry_desc:0 "Le Mexique ne manquait pas de bons concepteurs d’avions. Cependant, l’industrie souffrait d’un manque de capacités de production en série, faute non seulement de machines, mais aussi d’ingénieurs qualifiés. Le principal obstacle du Mexique pour déployer ses propres conceptions résidait dans la lenteur de la production."

MEX_idea_expanded_mining_industry:0 "Compagnies minières allemandes"
MEX_idea_expanded_mining_industry_desc:0 "L’Allemagne s’intéressait, entre autres, à l’installation de sociétés minières au Mexique afin de réduire l’influence écrasante des Américains dans ce secteur."

