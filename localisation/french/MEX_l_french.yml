#tooltips
MEX_oil_concessions_tt:0 "§YNos installations d’extraction pétrolière sont entre les mains de sociétés étrangères !§!"

MEX_strength_of_the_civil_War_depends_on_low_stability_tt:0 "Une §Gfaible stabilité§! garantit que les §Yr ébelles§! reçoivent §Gmoins§! de forces !"

MEX_diplomatic_opportunity_tt:0 "Peut déclencher une guerre à la fois avec les États-Unis et le Royaume-Uni si la tension est trop faible. Il pourrait être possible de monter les États-Unis et le Royaume-Uni l’un contre l’autre si le moment est bien choisi."

tt_mexpromotion:0 "Le président du Mexique est considéré comme un général 5 étoiles en raison du système de classement. De ce fait, ce candidat militaire sera promu au niveau 5 et recevra des bonus en fonction de son parcours.\n"

tt_MEX_racial_tensions:0 "Ne passera pas inaperçu et accentuera les tensions raciales en Amérique."

juan_is_dead:0 "Mort"
juan_loses:0 "a quitté le Mexique après avoir perdu les élections"

escobar_returns:0 "Escobar est revenu au Mexique"
election_1940:0 "Élections de 1940"
riot:0 "Émeute du Zoot Suit"

POLITICS_DIONISIO_ENCINA_DESC:0 "Dionisio était décrit comme une figure polarisante, et les historiens avaient rarement des commentaires positifs sur son leadership. Il fut responsable de la fragmentation du plus grand parti communiste mexicain, le PCM. Soutenu par des agents soviétiques chargés de diffuser le communisme au Mexique, il n’agissait jamais sans ordre et craignait constamment que ses supérieurs soviétiques ne trouvent un dirigeant plus apte pour le PCM. Cette peur le poussa à purger toute personne ayant de meilleures compétences de direction ou plus de charisme, de peur d’être remplacé. Il laissa ainsi le PCM cruellement dépourvu de dirigeants compétents et de pensée proactive."
