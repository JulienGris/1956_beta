MEX_alvaro_rosado_osorio:0 "Álvaro Rosado Osorio"

Salinas:0 "Gustavo Adolfo Salinas Camiña"
Salinas_desc:0 "Premier aviateur à réaliser une frappe navale. En 1943, il déclara : « Les bombes que j’utilisais étaient artisanales, avec une charge de 52 bâtons de dynamite. Aussi primitives qu’elles fussent, elles fonctionnaient à merveille. À l’époque, je pilotais un vieux Wright à hélice propulsive. Il m’est venu à l’esprit qu’un jour, nous disposerions d’avions capables de supporter des charges bien au-delà de nos rêves les plus fous, et que l’avion deviendrait alors une arme d’assaut militaire d’une puissance fabuleuse. Ce jour est arrivé. »"

agustin_olachea2:0 "Agustin Aviles Olachea"
agustin_olachea2_desc:0 "Agustin Aviles Olachea créa des écoles aéronautiques durant la Seconde Guerre mondiale et contribua à formaliser l’armée de l’air mexicaine pour les générations suivantes, alors que s’achevait l’ère des héros révolutionnaires autodidactes de l’aviation."

antonio:0 "Antonio Cardenas Rodriguez"
antonio_desc:0 "Le fait marquant de la carrière militaire d’Antonio fut de diriger l’Escadron 201 aux Philippines dans les dernières étapes de la Seconde Guerre mondiale."

Maximino:0 "Maximino Ávila Camacho"
Maximino_desc:0 "Maximino est le frère de Manuel Ávila Camacho. Il est connu non seulement comme sympathisant de l’Axe, mais aussi comme associé de William Jenkins, détenteur d’un monopole sur les médias mexicains et grand opposant à l’influence alliée. L’ingérence de Maximino a, à elle seule, réduit à néant les tentatives de propagande de la France et de la Grande-Bretagne."

MEX_PAB:0 "Pablo Quiroga Treviño"
MEX_PAB_desc:0 "Pablo Quiroga Treviño est considéré comme l’un des plus proches alliés de Cárdenas. Il fut chargé d’imposer l’éducation socialiste controversée et de défendre avec ferveur la politique de Cárdenas. Pablo Quiroga fut l’un des rares ministres du cabinet d’origine à rester fidèle à Cárdenas."

MEX_SANTA:0 "Miguel G. Santa Ana"
MEX_SANTA_desc:0 "Miguel G. Santa Ana était responsable de l’acquisition de matériel, de fournitures et d’autres ressources pour le compte de la S.E.D.E.N.A., le secrétariat mexicain de l’Armée et de la Marine."

Castillo:0 "Francisco Castillo"
Castillo_desc:0 "Castillo est surtout connu pour son rôle d’ambassadeur auprès de pays étrangers, où il explorait des possibilités d’accords commerciaux et travaillait à l’amélioration des relations diplomatiques."

agustin_olachea:0 "Agustin Aviles Olachea"
agustin_olachea_desc:0 "Agustin Olachea était chargé de la construction de tout ce qui était jugé essentiel au fonctionnement des forces armées mexicaines. Il supervisa de nombreux projets militaires allant de nouvelles bases aériennes à de nouvelles académies militaires dans tout le pays."

MEX_plutarco_e_calles_desc:0 "Plutarco Calles, également connu sous le nom de « El Jefe Máximo », fut président populiste de 1924 à 1928. Au départ, il jouissait d’un grand soutien populaire et était considéré comme un héros de la révolution. Malheureusement, à l’instar du dictateur Porfirio Díaz contre lequel la révolution s’était levée, il conserva le pouvoir jusqu’en 1936 grâce à des présidents fantoches et des alliés au sein du PRM. Ses idées politiques dérivèrent vers la droite et, lorsque ses politiques contribuèrent au déclenchement de la guerre des Cristeros, sa réputation fut entièrement ruinée. Celle-ci culmina en 1936 avec son exil à San Diego."

padilla:0 "Ezequiel Padilla Peñaloza"
padilla_desc:0 "Durant sa carrière gouvernementale, Padilla est surtout connu pour sa position résolument pro-américaine. Il soutenait tellement les intérêts des États-Unis qu’il leur transmit à plusieurs reprises des documents mexicains top secrets."

MEX_eduardo_saurez:0 "Eduardo Saurez"
MEX_eduardo_saurez_desc:0 "Eduardo Saurez fut ministre des Finances du Mexique de 1935 à 1946."

MEX_rex_applegate:0 "Rex Applegate"
MEX_rex_applegate_desc:0 "Rex Applegate était un officier américain et garde du corps personnel de Roosevelt, envoyé pour former les soldats mexicains aux tactiques des forces spéciales, notamment le combat rapproché, et il resta conseiller bien après la guerre."

Heriberto:0 "Heriberto Jara Corona"
Heriberto_desc:0 "Heriberto fut le tout premier secrétaire de la Marine du Mexique. En raison de la centralisation de l’armée, ce poste fut créé pour réduire l’influence politique des forces militaires."

hector:0 "Héctor Meixueiro"

gustavo:0 "Gustavo Adolfo Salinas Camiña"
gustavo_desc:0 "Premier aviateur à réaliser une frappe navale. En 1943, il déclara : « Les bombes que j’utilisais étaient artisanales, avec une charge de 52 bâtons de dynamite. Aussi primitives qu’elles fussent, elles fonctionnaient à merveille. À l’époque, je pilotais un vieux Wright à hélice propulsive. Il m’est venu à l’esprit qu’un jour, nous disposerions d’avions capables de supporter des charges bien au-delà de nos rêves les plus fous, et que l’avion deviendrait alors une arme d’assaut militaire d’une puissance fabuleuse. Ce jour est arrivé. »"

enrique_estrada:0 "Enrique Estrada"
enrique_estrada_desc:0 "Enrique Estrada fut élève du célèbre général révolutionnaire Felipe Ángeles, qui lui enseigna l’art de l’artillerie."

MEX_Manuel_Sandoval_Vallarta:0 "Manuel Sandoval Vallarta"
MEX_Manuel_Sandoval_Vallarta_desc:0 "Vallarta était un physicien mexicain qui donna des cours à la fois au MIT et à l’UNAM. Son domaine d’expertise portait sur les rayons cosmiques. En 1927, il reçut une bourse Guggenheim qui lui permit d’être accueilli aux universités de Berlin et Leipzig. Là, il apprit aux côtés d’Einstein, Heisenberg, Schrödinger et Planck. En 1946, il choisit de rester à l’UNAM à plein temps pour devenir conseiller en politique scientifique. Vallarta se distingue par le fait qu’il forma des étudiants aux États-Unis qui participèrent ensuite au projet Manhattan. Parmi ses élèves figuraient Richard Feynman et Julius Stratton. Il fut également collègue du physicien belge Georges Lemaître lors de recherches sur les rayons cosmiques."

MEX_nationalize_oil_fields:0 "Nationaliser les champs pétrolifères"
MEX_nationalize_oil_fields_desc:0 "PEMEX est la compagnie pétrolière nationalisée du Mexique. Sa création lança une vaste vague de découvertes géologiques, d’évolution sociale et d’innovations économiques, devenant le principal moteur de l’industrialisation du pays."

aguila:0 "Aguila Oil"
aguila_desc:0 "Les Sinarquistes, fascistes mexicains, étaient des capitalistes convaincus qui prônaient la maîtrise du marché mexicain par les Mexicains eux-mêmes. Toute entreprise étrangère souhaitant pénétrer ce marché devait passer par un intermédiaire mexicain indépendant. Sous leur direction, l’industrie pétrolière étrangère aurait été brutalement nationalisée et, si PEMEX avait existé, elle aurait été morcelée et vendue aux élites mexicaines."

CEMEX:0 "CEMEX"

Azcarate:0 "Azcarate S.A."
Azcarate_desc:0 "Après son exil politique, Azcárate fonda une petite entreprise aéronautique avec laquelle il mena des projets en partenariat avec Lockheed Martin durant la Seconde Guerre mondiale."

baja:0 "Mariscraft S.A."
baja_desc:0 "Mariscraft était une obscure entreprise aéronautique mexicaine qui ne produisit qu’un seul avion, le MA-260. Ce projet visait à créer un bombardier de chasse à long rayon d’action, inspiré du concept du 8W Zeus."

Mendoza:0 "Productos Mendoza"
Mendoza_desc:0 "Mendoza est le deuxième grand nom de la conception d’armes mexicaines, derrière Manuel Mondragón. L’entreprise se spécialise dans les mitrailleuses, allant des HMG aux SMG, ainsi que dans les fusils automatiques."

Obregon: "Alejandro Obregón"
Obregon_desc:0 "Obregón est surtout connu pour son pistolet Obregón .45, qui innovait en simplifiant le design extérieur proche du 1911. À l’intérieur, il était très différent et comportait de nombreuses pièces simplifiées, ce qui le rendait plus fiable et moins coûteux que le 1911. Les pistolets Obregón sont réputés comme des modèles de savoir-faire."

Grupo_Ramirez:0 "Grupo Ramirez"
Grupo_Ramirez_desc:0 "Première entreprise automobile du Mexique et créatrice du camion Rural Ramirez. Elle se spécialise dans les voitures et moteurs bon marché et fiables."

Grupo_Ramirez2:0 "Grupo Ramirez"
Grupo_Ramirez2_desc:0 "Première entreprise automobile du Mexique et créatrice du camion Rural Ramirez. Elle se spécialise dans les voitures et moteurs bon marché et fiables."

VAM:0 "VAM"
VAM_desc:0 "Un constructeur automobile contrôlé par l’État, initialement filiale américaine de Jeep, qui devint une société indépendante après un rachat gouvernemental."

VAM2:0 "VAM"
VAM2_desc:0 "Un constructeur automobile contrôlé par l’État, initialement filiale américaine de Jeep, qui devint une société indépendante après un rachat gouvernemental."

TELMEX:0 "TELMEX"
TELMEX_DESC:0 "Telmex est le monopole mexicain des télécommunications. Avant d’être vendu à des intérêts privés, il fut racheté par le gouvernement mexicain afin de moderniser les réseaux de communication du pays."

MEX_ASTIMAR:0 "ASTIMAR"
MEX_ASTIMAR_desc:0 "ASTIMAR est le constructeur naval dirigé par l’État. L’entreprise s’est spécialisée dans les canonnières et la défense côtière."

AHMSA:0 "AHMSA"
AHMSA_desc:0 "AHMSA est le plus grand exploitant de minerai de fer et de charbon du Mexique, ainsi que le plus grand producteur d’acier. Elle se spécialise dans les pièces mécaniques et les composants en acier destinés aux infrastructures comme les ponts."

league:0 "Ligue mexicaine des expériences radiophoniques"
league_desc:0 "La Ligue mexicaine des expériences radiophoniques réunissait un groupe de scientifiques, dont certains enfants prodiges, qui innovèrent dans le domaine des communications radio. Ils sont surtout connus pour avoir inventé la technologie qui permit l’apparition de la télévision en couleur."

Echevarrieta:0 "Chantiers navals Echevarrieta"
Echevarrieta_desc:0 "Echevarrieta était une entreprise navale espagnole qui vendit des escorteurs de convois au Mexique."

Odero:0 "Chantiers navals Odero"
Odero_desc:0 "Les chantiers navals Odero étaient une entreprise italienne, responsable de la construction des navires les plus blindés de la flotte mexicaine."

Angel:0 "Ángel Lascurain"
Angel_desc:0 "Ángel Lascurain fut un aviateur légendaire au Mexique, créateur de l’avion le plus avancé et futuriste jamais produit dans le pays. Les magazines spécialisés s’émerveillèrent de la façon dont il conçut et fabriqua, à partir d’un simple établi, un avion de transport monoplace à deux moteurs conçu localement. Cet appareil, baptisé Aura, fut décrit par les observateurs comme d’une agilité surnaturelle pour un avion de cette taille."

electridad:0 "Comisión Federal de Electricidad"
electridad_desc:0 "La Comisión Federal de Electricidad est l’entreprise publique d’énergie, également responsable du développement et de la construction des centrales nucléaires mexicaines."

yokosuka_naval_arsenal2:0 "Arsenal naval de Yokosuka"

MEX_jenkins_blockade:0 "Blocus Jenkins"
MEX_jenkins_blockade_desc:0 "William O. Jenkins détient un monopole sur les médias mexicains. Son associé discret dans cette affaire fut Maximino Ávila Camacho, sympathisant de l’Axe. Cette alliance, surnommée le « Blocus Jenkins » par certains historiens, fut l’un des principaux facteurs de l’échec cuisant de la tentative franco-britannique d’exploiter l’isolationnisme de la politique étrangère américaine pour entraîner le Mexique dans la sphère d’influence européenne."

MEX_porfiriato_heritage_idea:0 "Héritage du Porfiriato"
MEX_porfiriato_heritage_idea_desc:0 "L’ancienne élite économique mexicaine est fortement porfiriste, ayant bénéficié de la dictature de Porfirio Díaz. Elle soutient l’Allemagne par rancune envers le Royaume-Uni et s’emploie activement à contrer les efforts des propagandistes britanniques et français. Grâce à son immense influence politique, elle pousse le Mexique dans les bras de l’Axe."

MEX_new_era_of_porfirato:0 "Nouvelle ère du Porfiriato"
MEX_pact_of_honor_idea:0 "Pacte d’honneur"

MEX_conservative_politics_idea:0 "Politiques conservatrices"
MEX_camarilla_cabinet:0 "Cabinet de la camarilla"
MEX_active_political_inquisition:0 "Inquisition politique active"
MEX_moderate_oil_concessions:0 "Concessions pétrolières modérées"
MEX_industrial_concessions:0 "Concessions industrielles"
MEX_PAN7:0 "Dictature parfaite"

#designers
MEX_state_railroad_company:0 "Compagnie nationale des chemins de fer mexicains"
MEX_state_railroad_company_desc:0 "Connue au niveau national sous le nom de Ferrocarril Nacional Mexicano ou FNM, cette compagnie ferroviaire publique fut créée par le gouvernement pour développer le réseau ferré insuffisant du pays et renforcer les liaisons existantes entre les grandes villes comme Mexico, Ciudad Juárez, Nuevo Laredo et Matamoros."

MEX_maximato_legacy:0 "Héritage du Maximato"
MEX_maximato_legacy_desc:0 "Le gouvernement [ROOT.getAdjective] est imprégné de loyalistes de Plutarco Calles, également connu sous le nom de « El Jefe Máximo ». Président du Mexique de 1924 à 1928, Calles contrôla ensuite le pays par le biais de présidents fantoches et de soutiens au sein du PRM. De 1924 jusqu’en 1936, c’est lui qui détenait le véritable pouvoir au Mexique. Cette période de l’histoire mexicaine est connue sous le nom de Maximato."

MEX_recovering_from_maximato:0 "Sortir du Maximato"

MEX_military_purges:0 "Purg es militaires"

MEX_political_union_support:0 "Soutien de l’Union politique"

MEX_funding_public_enterprises:0 "Financer les entreprises publiques"
MEX_funding_public_enterprises_desc:0 "Le gouvernement [ROOT.getAdjective] réoriente actuellement certains fonds afin de soutenir la création de services publics, améliorant considérablement le bien-être de la population."

MEX_new_maximato:0 "Nouveau Maximato"

