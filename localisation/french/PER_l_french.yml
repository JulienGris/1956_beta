# Un peu faible, avions assemblés et importés de Grande-Bretagne dans les années 30
PER_generic_medium_aircraft_manufacturer:0 "Ateliers de Busher"

# Événements
r56_persia.1.t:0 "Mort du Shah"
r56_persia.1.desc:0 "Reza Shah Pahlavi, fondateur de la monarchie Pahlavi, est mort de causes naturelles. Son fils lui succède tandis que [ROOT.GetNameDef] se souvient de son règne modernisateur."
r56_persia.1.a:0 "Regrettable"

