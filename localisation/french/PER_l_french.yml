l_french:

 #Décisions
 PER_restoring_the_lions_might:0 "Rétablir la puissance du Lion"
 PER_easier_integration_tt:0 "Toutes les décisions de §YRétablir la puissance du Lion§! deviennent disponibles avec une conformité plus faible"
 PER_restoring_the_lions_might_desc:0 "Le Lion persan avait autrefois griffé sa route vers la domination en Asie occidentale, notre gloire sombrant dans les profondeurs de la guerre civile et des ingérences étrangères. Avec l’Iran de nouveau sous une direction forte, nous tracerons une nouvelle voie : revenir sur la scène mondiale !"

 PER_rescind_the_azerbaijan_concession:0 "Révoquer la concession d’Azerbaïdjan"
 PER_rescind_the_azerbaijan_concession_desc:0 "Parmi toutes nos pertes territoriales, la chute de l’Azerbaïdjan aux mains des Russes fut peut-être la plus évitable et la plus tragique. Les Azéris du nord sont tout aussi iraniens que ceux vivant dans nos provinces du nord-ouest, leur occupation ne sera plus tolérée !"
 PER_rescind_the_azerbaijan_concession_tt:0 "Débloque la décision : §YRéintégrer l’Azerbaïdjan§!"
 PER_reintegrate_azerbaijan:0 "Réintégrer l’Azerbaïdjan"

 PER_claim_iraqi_kurdistan:0 "Revendiquer le Kurdistan irakien"
 PER_claim_iraqi_kurdistan_desc:0 "Les groupes rebelles kurdes du nord de l’Irak ont passé des décennies à tenter de créer leur propre État sur les terres irakiennes, échouant à chaque fois. Le peuple kurde est notre frère, un héritage des sommets impériaux de la Perse. Les Kurdes trouveront la libération qu’ils réclament par leur intégration dans le nouvel Iran !"
 PER_claim_iraqi_kurdistan1_tt:0 "Débloque la décision : §YRéintégrer le delta oriental du Tigre§!"
 PER_claim_iraqi_kurdistan2_tt:0 "Débloque la décision : §YRéintégrer Mossoul§!"
 PER_integrate_the_eastern_tigris_delta:0 "Intégrer le delta oriental du Tigre"
 PER_reintegrate_mosul:0 "Réintégrer Mossoul"

 PER_claim_the_anatolian_far_east:0 "Revendiquer l’Extrême-Est anatolien"
 PER_claim_the_anatolian_far_east_desc:0 "Les groupes rebelles kurdes d’Anatolie se sont battus au nom d’un État kurde, mais malgré tout, leurs efforts n’ont rien donné. Les Kurdes trouveront la libération qu’ils réclament par leur intégration dans le nouvel Iran !"
 PER_claim_the_anatolian_far_east1_tt:0 "Débloque la décision : §YRéintégrer Van§!"
 PER_claim_the_anatolian_far_east2_tt:0 "Débloque la décision : §YRéintégrer Hakkari§!"
 PER_reintegrate_hakkari:0 "Réintégrer Hakkari"
 PER_reintegrate_van:0 "Réintégrer Van"

 PER_reclaim_our_caucasian_holdings:0 "Récupérer nos possessions caucasiennes"
 PER_reclaim_our_caucasian_holdings_desc:0 "Le Caucase nous donne notre juste connexion à la mer Noire et a prouvé être une frontière fiable contre les invasions étrangères. Nous allons reprendre ces terres légitimes immédiatement !"

 PER_solidify_dominance_over_the_persian_gulf:0 "Consolider la domination sur le golfe Persique"
 PER_solidify_dominance_over_the_persian_gulf_desc:0 "Le golfe Persique est notre arrière-cour et notre lien avec le monde. Nous devons montrer clairement au monde qu’il est à nous et qu’il le restera toujours !"

 ### Nouveau contenu
 PER_paniranism:0 "Pan-iranisme"

 PER_reza_shah_modernizer_new:0 "Modernisateur superficiel"
 PER_shah_of_iran_trait:0 "Shah d’Iran"
