 ### Nouveau contenu par BlueFoxy
 PER_anglo_iranian_oil_company:0 "Compagnie Anglo-Persian Oil"
 PER_anglo_iranian_oil_company_desc:1 "Après la découverte de pétrole à Masjed Soleiman, la Anglo-Persian Oil Company a été créée. Cette compagnie a obtenu un monopole sur notre pétrole et entrave sérieusement notre économie. Nous avons désormais un choix : nous soumettre à la suprématie britannique ou mourir en la combattant."

 PER_continue_modernisation_of_the_army:0 "Poursuivre la modernisation de l’armée"
 PER_continue_modernisation_of_the_army_desc:0 ""

 ##### ARMÉE #####
 PER_adopt_western_style_military_bureaucracy:0 "Adopter la bureaucratie militaire occidentale"
 PER_adopt_western_style_military_bureaucracy_desc:0 "L’ancienne dynastie qadjare a négligé la formation d’une armée permanente jusqu’à sa chute en 1925. Bien que nous ayons rapidement alloué des fonds supplémentaires aux forces armées iraniennes, elles restent dans un état pitoyable, avec de jeunes officiers incompétents et un commandement désorganisé. L’adoption de la structure et de la hiérarchie de commandement occidentales améliorera les performances de nos armées permanentes."

 ### DOCTRINES ###
 PER_continue_sending_cadets_abroad:0 "Continuer l’envoi de cadets à l’étranger"
 PER_continue_sending_cadets_abroad_desc:0 "L’état-major moderne repose sur des officiers compétents, que nous pouvons former à l’étranger afin d’acquérir les nouvelles tactiques militaires et technologies."
 PER_invite_foreign_officers:0 "Inviter des officiers étrangers"
 PER_invite_foreign_officers_desc:0 "Nos soldats ne peuvent attendre des années que des officiers iraniens soient formés à l’étranger. Si nous voulons une armée permanente rapidement, des spécialistes étrangers qualifiés doivent superviser et guider dès maintenant l’entraînement de nos forces terrestres !"

 PER_continue_using_western_doctrines:0 "Poursuivre l’usage des doctrines occidentales"
 PER_continue_using_western_doctrines_desc:0 "L’influence britannique et française est présente dans toutes nos politiques : industrie, extraction de ressources, coopération économique, exportations, importations, et maintenant aussi dans notre armée. Une défense bien planifiée et un bon retranchement profiteront à nos forces armées comme à notre régime."
 PER_adopt_german_doctrines:0 "Adopter les doctrines allemandes"
 PER_adopt_german_doctrines_desc:0 "L’Allemagne s’est bien relevée du traité de Versailles et ses armées sont plus fortes que jamais. Nous suivrons leur voie et adopterons des doctrines favorisant les blindés et les véhicules motorisés. Nous manquons de caoutchouc, mais nous avons assez de pétrole pour alimenter une grande force blindée."
 PER_rely_on_artillery_firepower:0 "Compter sur la puissance de feu de l’artillerie"
 PER_rely_on_artillery_firepower_desc:0 "La Grande Guerre a montré qu’une attaque d’infanterie ne pouvait réussir qu’après un barrage d’artillerie massif. Améliorer la coordination artillerie-infanterie avec nos ressources limitées pourrait être la meilleure option pour nos forces terrestres."
 PER_adopt_soviet_tactics:0 "Adopter les tactiques soviétiques"
 PER_adopt_soviet_tactics_desc:0 "Notre grand voisin du nord a développé une doctrine adaptée à son énorme réserve de main-d’œuvre. Les tragédies des guerres russo-persanes ne se répéteront pas si nous suivons leur voie."
 PER_adopt_guerilla_tactics:0 "Adopter les tactiques de guérilla"
 PER_adopt_guerilla_tactics_desc:0 "Montagnes, vallées étroites et vastes déserts forment des lignes de défense naturelles. Si l’ennemi franchit nos frontières, il subira la résistance de nos forces, des actions de partisans dans son dos, et le combat jusqu’à la dernière balle pour chaque mètre de notre sol !"
 PER_revise_universal_drafting_law:0 "Réviser la loi sur la conscription universelle"
 PER_revise_universal_drafting_law_desc:0 "De nombreux intellectuels et travailleurs qualifiés seraient bien plus utiles comme spécialistes militaires ou personnels civils. Une loi de conscription indiquant que « seul 1 homme sur 10 doit servir » semble grandement améliorer l’efficacité de notre armée."
 PER_maintain_universal_drafting:0 "Maintenir la conscription universelle"
 PER_maintain_universal_drafting_desc:0 "La loi universelle de conscription de 1925 stipule que « tout homme de 21 ans doit servir deux ans dans l’armée ». Elle peut être légèrement modifiée pour augmenter considérablement le nombre de conscrits."

 ### ÉQUIPEMENT ###
 PER_rifles_modernisation:0 "Modernisation des fusils"
 PER_rifles_modernisation_desc:0 "Nos troupes utilisent des équipements obsolètes, parfois datant de la Grande Guerre voire plus anciens. Si nos soldats doivent défendre le pays, ils ont besoin des meilleures armes que nous pouvons leur fournir."
 PER_terrain_specialization:0 "Spécialisation selon le terrain"
 PER_terrain_specialization_desc:0 "Le climat varié et les terrains diversifiés de notre pays limitent fortement l’efficacité de nos forces actuelles. Financer des troupes spécialisées pour ces conditions difficiles améliorera notre défense."
 PER_develop_logistic_bataillons:0 "Développer les bataillons logistiques"
 PER_develop_logistic_bataillons_desc:0 "L’efficacité de nos forces peut être améliorée en ajoutant des bataillons de reconnaissance et de génie aux divisions actuelles."
 PER_motorize_the_cavalry:0 "Motoriser la cavalerie"
 PER_motorize_the_cavalry_desc:0 "La cavalerie a perdu son utilité sur le front avec l’invention de la mitrailleuse. Les camions armés, mobiles et autonomes, sont l’avenir."
 PER_import_tanks_designs:0 "Importer des modèles de chars"
 PER_import_tanks_designs_desc:0 "Les chars représentent l’avenir de la guerre. Nous n’avons pas les moyens d’en concevoir à grande échelle, mais nous pouvons importer et étudier des modèles étrangers."
 PER_modernise_our_artillery:0 "Moderniser notre artillerie"
 PER_modernise_our_artillery_desc:0 "Nos forces bénéficieront de modèles d’artillerie plus puissants, compacts et faciles d’utilisation."
 PER_counter_enemy_armor:0 "Contrer les blindés ennemis"
 PER_counter_enemy_armor_desc:0 "Nos ennemis pourraient utiliser des chars pour percer nos lignes. De nouveaux canons antichars les arrêteront."
 PER_counter_enemy_bombers:0 "Contrer les bombardiers ennemis"
 PER_counter_enemy_bombers_desc:0 "Si l’ennemi n’a pas de chars, il utilisera ses avions pour nous frapper. Équiper nos bataillons d’armes anti-aériennes mettra fin à cette menace."

 ### AIR ###
 PER_local_fighters_development:0 "Développement d’avions de chasse locaux"
 PER_local_fighters_development_desc:0 "Nous pourrions acheter des chasseurs aux grandes puissances, mais en cas de guerre proche de nos frontières, nous dépendrons de nos propres fabricants."
 PER_separate_the_air_force:0 "Séparer les forces aériennes"
 PER_separate_the_air_force_desc:0 "Il est préférable de séparer forces terrestres et aériennes en branches indépendantes. Donner trop de pouvoir à l’armée n’a jamais été bon."
 PER_maintain_air_land_links:0 "Maintenir les liens air-terre"
 PER_maintain_air_land_links_desc:0 "Les meilleurs résultats s’obtiennent par la coopération : l’aviation couvre l’infanterie et l’infanterie protège l’aviation."
 PER_air_officers_academy:0 "Académie technique des officiers de l’IIAF"
 PER_air_officers_academy_desc:0 "L’Armée de l’air impériale iranienne, créée en 1920, a reçu peu de financement. Une académie est nécessaire pour former des pilotes et commandants compétents."
 PER_independent_bombers_bataillons:0 "Bataillons de bombardiers indépendants"
 PER_independent_bombers_bataillons_desc:0 "Les vastes espaces aériens du Moyen-Orient peuvent être couverts si nous créons des bataillons de bombardiers indépendants par région."
 PER_cas_troops_assistance:0 "Assistance aérienne rapprochée"
 PER_cas_troops_assistance_desc:0 "L’appui des troupes terrestres est la mission principale des bombardiers en piqué. Beaucoup de nos modèles sont dépassés, nous devons investir dans de meilleurs avions."
 PER_ghale_morghi_air_bases:0 "Bases aériennes de Ghale Morghi"
 PER_ghale_morghi_air_bases_desc:0 "L’extension de la base aérienne de Ghale Morghi, près de Téhéran, fournira un point d’appui supplémentaire pour l’IIAF."
 PER_anti_aircraft_defense:0 "Défense anti-aérienne"
 PER_anti_aircraft_defense_desc:0 "Nous ne pouvons pas laisser nos escadrons être détruits avant même de décoller. Nous devons renforcer nos défenses anti-aériennes et fortifier nos bases aériennes."
### MARINE ###

PER_separate_the_navy:0 "Séparer la marine"
PER_separate_the_navy_desc:0 "Chaque branche de nos forces armées doit avoir un haut commandement individuel, clairement observé depuis les positions gouvernementales. La concentration du pouvoir entre trop peu de mains pourrait avoir des conséquences catastrophiques pour notre pays."
PER_maintain_navy_land_links:0 "Maintenir les liens marine-terre"
PER_maintain_navy_land_links_desc:0 "Nos eaux territoriales sont mal protégées, les navires britanniques et français pénétrant constamment dans le golfe Persique tandis que les forces navales russes dominent la mer Caspienne. La protection de nos côtes nécessitera une forte coordination terre-mer, ce qui est actuellement encouragé."
PER_ensure_commercial_protection:0 "Assurer la protection commerciale"
PER_ensure_commercial_protection_desc:0 "Les routes commerciales du golfe Persique et de la mer d’Arabie pourraient nécessiter une protection supplémentaire que nos nouvelles forces navales et doctrines améliorées peuvent offrir."
PER_dominate_the_persian_gulf:0 "Dominer le golfe Persique"
PER_dominate_the_persian_gulf_desc:0 "Parmi tous les pays indépendants partageant le golfe Persique, nous possédons la côte la plus longue et la plus grande flotte, ce qui ne fait que renforcer l’idée de la domination iranienne dans le Golfe."
PER_expand_shipbuilding_capacities:0 "Développer les capacités navales"
PER_expand_shipbuilding_capacities_desc:0 "Notre plus grand port, base navale et centre opérationnel à Bandar Abbas nécessite une expansion si nous voulons développer une marine capable de défendre nos intérêts dans le Golfe et dans le monde."
PER_hunt_the_submarines:0 "Chasser les sous-marins"
PER_hunt_the_submarines_desc:0 "La Grande Guerre a vu l’Allemagne adopter la guerre sous-marine à outrance. Les nouveaux modèles de sous-marins et les tensions croissantes dans le monde suggèrent que nous devons protéger de près nos navires marchands et nos routes commerciales contre ces menaces."
PER_submarines_experimentations:0 "Expérimentation sous-marine"
PER_submarines_experimentations_desc:0 "Dominer le Golfe ne suffit pas. Si nous voulons étendre notre influence en haute mer, il nous faut un outil économique, agile et puissant. Les sous-marins répondent à toutes ces exigences et nous devons investir dans leur développement."
PER_carrier_development:0 "Développement des porte-avions"
PER_carrier_development_desc:0 "Les porte-avions jouent un rôle crucial dans les opérations maritimes des grandes puissances. Nous devrions obtenir des financements pour développer et perfectionner ces bases aériennes flottantes."

### POLITIQUE ###

### Shah/autoritaire ###
PER_maintain_the_armys_privileges:0 "Maintenir les privilèges de l’armée"
PER_continue_governmental_purges:0 "Poursuivre les purges gouvernementales"
PER_continue_government_purges:0 "Poursuivre les purges gouvernementales"
PER_continue_government_purges_desc:0 "Plus un politicien s’enracine, plus il est susceptible de s’extraire de l’influence royale. Pour éviter cela, des renvois forcés seront nécessaires."
PER_increase_funds_for_the_army:0 "Augmenter le financement de l’armée"
PER_increase_funds_for_the_army_desc:0 "L’armée est l’un des principaux piliers du règne du Shah. Les officiers sont beaucoup mieux payés que les autres employés. En augmentant le budget militaire, nous nous assurerons de leur loyauté."
PER_diplomatic_balance:0 "Équilibre diplomatique"
PER_diplomatic_balance_desc:0 "La situation mondiale actuelle et les pressions internationales nous obligent à nous concentrer sur notre politique intérieure et à proclamer une politique étrangère neutre afin de préserver notre souveraineté."
PER_reaffirm_friendship_with_turkey:0 "Réaffirmer l’amitié avec la Turquie"
PER_reaffirm_friendship_with_turkey_desc:0 "Nos pays partagent des origines similaires et mènent des politiques de turquisation et de persanisation. Nos objectifs communs d’établir des nations fortes et unies au Moyen-Orient nous rapprochent. De nombreuses visites diplomatiques ont rétabli des relations amicales entre nos gouvernements."
PER_between_giants:0 "Entre géants"
PER_between_giants_desc:0 "Notre grand mais fragile État se trouve au carrefour du monde : avec les [SOV.GetAdjective] au nord et les [ENG.GetAdjective] au sud, nous sommes entourés de grandes puissances qui scrutent notre politique et la stabilité de notre régime. Peut-être pouvons-nous tirer parti de cette position particulière ?"
PER_forced_secularization_r56:0 "Sécularisation forcée"
PER_forced_secularization_r56_desc:0 "Le premier pas vers la transition d’une société médiévale vers une société industrielle moderne est une séparation claire et visible entre l’Église et l’État. L’islam est profondément enraciné dans notre culture, mais si nous voulons entrer sur la scène mondiale, nous devons nous adapter, quel qu’en soit le prix."
PER_trial_of_the_fifty_three:0 "Procès des Cinquante-Trois"
PER_trial_of_the_fifty_three_desc:0 "De nombreux partisans de la révolution communiste et du parti Tudeh d’Iran utilisaient leur éducation, leur position respectable et leurs relations étrangères pour détourner notre peuple. 53 d’entre eux ont été arrêtés et affrontent désormais la justice dans l’un des procès politiques les plus marquants de l’histoire iranienne."
PER_secular_nationalism:0 "Nationalisme séculier"
PER_secular_nationalism_desc:0 "La religion reste présente dans les esprits et les cœurs de nos soldats. Nous devons leur rappeler que les vraies valeurs résident non dans la foi, mais dans la patrie, son gouvernement et ses politiques. Ils se battent pour le peuple, et seulement pour lui."

PER_encourage_german_trade:0 "Encourager le commerce avec l’Allemagne"
PER_encourage_german_trade_desc:0 "Depuis des années, nous renforçons nos liens diplomatiques et économiques avec nos amis allemands, la seule puissance européenne sans ambitions impérialistes au Moyen-Orient. Ingénieurs et ouvriers iraniens et allemands travaillent ensemble à moderniser notre pays."
PER_pro_german_diplomacy:0 "Diplomatie pro-allemande"
PER_pro_german_diplomacy_desc:0 "Les Russes et les Britanniques ont leurs propres projets pour notre pays. Nous devons chercher le soutien d’une autre grande puissance. Les besoins de l’Allemagne en pétrole et son appui politique font d’elle un allié idéal."
PER_steel_deals:0 "Accords sur l’acier"
PER_steel_deals_desc:0 "En nous éloignant de la Grande-Bretagne pour soutenir les intérêts allemands, notre économie pourrait souffrir à court terme, mais les bénéfices à long terme valent ce risque. Nous échangerons notre pétrole contre leur acier, en partenaires égaux."

### Démocratique ###
PER_restore_constitutionalism:0 "Restaurer le constitutionnalisme"
PER_restore_constitutionalism_desc:0 "L’absolutisme n’a engendré que corruption et divisions. Le pouvoir doit revenir au peuple si [ROOT.GetNonIdeologyName] veut progresser."
PER_prime_minister_foroughi:0 "Premier ministre Foroughi"
PER_prime_minister_foroughi_desc:0 "Le Parti de la Renaissance (Hezb-e Tajaddod) formera une nouvelle coalition. L’un de ses vétérans, Mohammad-Ali Foroughi, deviendra Premier ministre pendant la transition."
PER_declare_the_shah_a_traitor:0 "Déclarer le Shah traître"
PER_declare_the_shah_a_traitor_desc:0 ""
PER_align_the_army:0 "Aligner l’armée"
PER_align_the_army_desc:0 "L’un des points du programme du Parti de la Renaissance concerne la création d’une armée moderne. Mais avant toute réforme, il faut traiter avec les généraux rivaux et les soldats rebelles."
PER_increase_education_funds:0 "Augmenter les fonds pour l’éducation"
PER_increase_education_funds_desc:0 "L’analphabétisme élevé dans les campagnes freine notre développement. Nous devons investir dans l’éducation."
PER_reform_the_tax_system:0 "Réformer le système fiscal"
PER_reform_the_tax_system_desc:0 "Nous devons introduire de nouveaux impôts pour les riches et alléger ceux des paysans, pêcheurs et ouvriers."
PER_align_with_britain:0 "S’allier à la Grande-Bretagne"
PER_align_with_britain_desc:0 "Nous partageons désormais les valeurs démocratiques des puissances occidentales. Pour préserver nos institutions, il nous faut de puissants alliés comme la Grande-Bretagne ou la France."
PER_renegociate_oil_agreements:0 "Renégocier les accords pétroliers"
PER_renegociate_oil_agreements_desc:0 "La compagnie Anglo-Persian Oil nuit à l’image de notre gouvernement. Nous devons renégocier afin que notre peuple bénéficie équitablement des profits du pétrole."

PER_rally_around_mosaddegh:0 "Se rallier à Mossadegh"
PER_rally_around_mosaddegh_desc:0 "Avec le coup de force de Reza Shah en 1925, Mohammad Mossadegh s’était retiré. Le nouvel élan démocratique permet de former un « Front national » rassemblant libéraux, nationalistes et socialistes sous sa direction."
PER_de_militarize_politics:0 "Démilitariser la politique"
PER_de_militarize_politics_desc:0 "L’armée et le gouvernement ont été trop longtemps liés. Pour démontrer notre pacifisme, nous devons exclure l’armée de la politique."
PER_nationalize_aioc:0 "Nationaliser l’APOC"
PER_nationalize_aioc_desc:0 "Mossadegh a déclaré : « Avec les revenus pétroliers, nous pourrions financer tout notre budget, combattre la pauvreté et le retard. L’Iran expulsera les experts étrangers et fermera les installations. »"
PER_land_reform_act:0 "Loi de réforme agraire"
PER_land_reform_act_desc:0 "Les fonds libérés par la réduction du budget militaire permettront une redistribution plus équitable des terres et richesses."

PER_reform_the_administration:0 "Réformer l’administration"
PER_reform_the_administration_desc:0 "L’appareil bureaucratique de l’ancien Shah est encore enraciné. Nous devons l’éradiquer."

PER_anti_imperialist_position:0 "Position anti-impérialiste"
PER_anti_imperialist_position_desc:0 "Nos principes démocratiques diffèrent de ceux de l’Occident. Nous ne masquons aucune ambition coloniale. Nous devons être le bouclier des opprimés."
PER_the_sadabat_pact:0 "Le pacte de Saadabad"
PER_the_sadabat_pact_desc:0 "De nombreux pays du Moyen-Orient partagent notre foi en l’autodétermination. Un traité de non-agression renforcera notre diplomatie."
PER_lead_the_way:0 "Montrer la voie"
PER_lead_the_way_desc:0 "Si nécessaire, nous imposerons les règles démocratiques en créant une confédération pan-arabe indépendante."

### Fasciste ###
PER_appoint_zahedi:0 "Nommer Zahedi"
PER_appoint_zahedi_desc:0 "Fazlollah Zahedi, chef de la police nationale, est influent dans l’armée et la politique. En le nommant Premier ministre, nous intégrerons les organisations nationalistes radicales dans le gouvernement."
PER_halt_religious_persecutions:0 "Mettre fin aux persécutions religieuses"
PER_halt_religious_persecutions_desc:0 "La sécularisation forcée du Shah a poussé de nombreux talents à l’exil. Nous pouvons stabiliser la situation en soutenant les croyants."
PER_religious_militarism:0 "Militarisme religieux"
PER_religious_militarism_desc:0 "Pendant des siècles, religion et État furent inséparables. Nous pouvons utiliser nos valeurs islamiques pour renforcer notre armée."
PER_embrace_persian_identity:0 "Adopter l’identité perse"
PER_embrace_persian_identity_desc:0 "Notre véritable identité remonte à l’Empire perse, berceau de la civilisation. Il est temps de révéler notre vraie nature au monde."
PER_crush_religious_resistance:0 "Écraser la résistance religieuse"
PER_crush_religious_resistance_desc:0 "L’Empire perse unifiait par la justice sociale et le progrès, pas par la foi. Nous devons mettre fin à tout extrémisme religieux."
PER_strategic_nationalizations:0 "Nationalisations stratégiques"
PER_strategic_nationalizations_desc:0 "La Compagnie pétrolière anglo-persane échappe à notre contrôle. Nous devons la nationaliser et utiliser ses ressources."
PER_reorganization_of_the_state:0 "Réorganisation de l’État"
PER_reorganization_of_the_state_desc:0 "Avec la montée de Zahedi, il est clair où réside le vrai pouvoir. Le Shah n’est plus nécessaire."
PER_diplomatic_independence:0 "Indépendance diplomatique"
PER_diplomatic_independence_desc:0 "Nous tracerons notre propre voie au Moyen-Orient, sans être entravés par les fascistes européens."
PER_heroic_sacrifice:0 "Sacrifices héroïques"
PER_heroic_sacrifice_desc:0 "Nous honorerons nos héros tombés et utiliserons leur exemple pour inspirer le peuple."
PER_agressive_pan_iranism:0 "Pan-iranisme agressif"
PER_agressive_pan_iranism_desc:0 "De nombreux territoires de l’Empire perse peuvent être récupérés, promettant un avenir prospère sous notre règne."
PER_retake_afghanistan:0 "Reprendre l’Afghanistan"
PER_retake_afghanistan_desc:0 "Les Qadjars ont échoué à prendre Hérat il y a un siècle. Cette fois, avec notre armée modernisée, nous réussirons."
PER_reclaim_iraq:0 "Reprendre l’Irak"
PER_reclaim_iraq_desc:0 "Les injustices économiques et politiques en Irak ne laissent d’autre choix que d’imposer notre autorité."
PER_our_central_asian_brothers:0 "Nos frères d’Asie centrale"
PER_our_central_asian_brothers_desc:0 "L’Asie centrale doit se libérer du joug russe, chinois ou britannique. Peuples turciques, levez-vous !"

### Communiste ###
PER_revive_the_jungle_movement:0 "Raviver le mouvement de la Jungle"
PER_revive_the_jungle_movement_desc:0 "Le Mouvement de la Jungle reste un symbole majeur de la cause communiste. Nous devons ranimer cet esprit d’unité sous la bannière rouge pour renverser la monarchie."
PER_acquire_soviet_support:0 "Obtenir le soutien soviétique"
PER_acquire_soviet_support_desc:0 "L’URSS est essentielle à notre révolution. Nous devons obtenir son aide matérielle."
PER_assemble_the_tudeh_party:0 "Réunir le parti Tudeh"
PER_assemble_the_tudeh_party_desc:0 "Le parti Tudeh est la principale force communiste d’Iran. Il est temps de l’unifier pour renverser la monarchie."
PER_recreate_the_persian_socialist_soviet_republic:0 "Recréer la RSS persane"
PER_recreate_the_persian_socialist_soviet_republic_desc:0 "Avec l’aide soviétique et du parti Tudeh, le moment est venu d’abattre la dynastie Pahlavi. Assez d’oppression ! En avant, camarades !"
PER_nationalize_the_means_of_production:0 "Nationaliser les moyens de production"
PER_nationalize_the_means_of_production_desc:0 "La nationalisation transforme la propriété privée en biens publics. Pour réaliser l’esprit communiste, nous devons empêcher toute mainmise bourgeoise."
PER_land_reforms:0 "Réformes agraires"
PER_land_reforms_desc:0 "Il n’y a rien de pire qu’un paysan sans terre ou qu’un ouvrier sans usine. Les moyens de production nouvellement acquis doivent être réorganisés et équitablement distribués parmi la population. Le pouvoir au peuple !"
PER_federalize_the_nation:0 "Fédéraliser la nation"
PER_federalize_the_nation_desc:0 "Le fédéralisme a fait ses preuves dans de nombreux pays. Il est temps pour nous aussi d’adopter ce système, en divisant notre nation en États semi-autonomes avec une représentation au Parlement."
PER_islamic_socialism_focus:0 "Socialisme islamique"
PER_islamic_socialism_focus_desc:0 "Il est vrai que l’athéisme est nécessaire pour atteindre une société véritablement communiste, cependant l’islam est profondément enraciné chez le peuple perse. Pour conserver la confiance du peuple dans le nouveau régime, nous devons intégrer nos politiques socialistes à l’islam."
PER_promote_atheism:0 "Promouvoir l’athéisme"
PER_promote_atheism_desc:0 "Rester fidèle aux principes communistes est essentiel. Tous sont égaux, et aucun être n’est au-dessus de l’humanité. Nous devons promouvoir un athéisme d’État, que cela plaise ou non, afin de rester fidèles à la voie de Marx."
PER_align_with_the_soviets:0 "S’aligner sur les Soviétiques"
PER_align_with_the_soviets_desc:0 "Bien que nos idéaux ne correspondent pas entièrement à ceux des Soviétiques, leur révolution a inspiré la nôtre. Il serait insensé, dans l’esprit communiste, de ne pas soutenir une autre grande nation communiste dans ses efforts pour propager la révolution."
PER_persian_way_to_socialism:0 "Voie persane vers le socialisme"
PER_persian_way_to_socialism_desc:0 "Oui, les Soviétiques nous ont aidés à former notre union. Oui, ils méritent une compensation. Mais allons-nous la leur accorder ? Non ! Notre communisme est différent, une union du peuple sans effusion de sang, séparée des horreurs de la collectivisation."
PER_soviet_economic_help:0 "Aide économique soviétique"
PER_soviet_economic_help_desc:0 "Avec la création de la RSS persane et nos liens avec nos frères bolcheviques du nord, il est temps d’améliorer notre économie. Grâce à de petits prêts et investissements soviétiques, nous pourrons réparer notre économie et redevenir la plus grande puissance économique du Moyen-Orient."
PER_control_the_strait:0 "Contrôler les détroits"
PER_control_the_strait_desc:0 "Les détroits du Bosphore sont un point stratégique crucial. Celui qui les contrôle décide des routes commerciales de la Roumanie, de la Bulgarie et de l’Union soviétique. Les capturer nous donnerait un monopole sur ces routes et aiderait nos alliés du nord."
PER_liberation_of_arabia:0 "Libération de l’Arabie"
PER_liberation_of_arabia_desc:0 "Les monarchies arabes oppriment depuis longtemps leur peuple, femmes, hommes, enfants et travailleurs. Il est temps de les libérer de la tyrannie de l’Arabie saoudite, d’Oman et de l’Irak. Nos camarades à l’ouest ont besoin de nous, lançons-nous de toutes nos forces pour les libérer !"

### INDUSTRIE ###
PER_finish_the_trans_iranian_railway:0 "Achever le chemin de fer trans-iranien"
PER_finish_the_trans_iranian_railway_desc:0 "Le développement de l’Iran passe par la modernisation des communications. Le chemin de fer trans-iranien, lancé en 1927 avec des capitaux indigènes, reliera mieux Téhéran à nos routes commerciales, notamment aux ports du sud."
PER_foreign_exchange_controls:0 "Contrôles des changes"
PER_foreign_exchange_controls_desc:0 "L’augmentation de notre commerce international doit s’accompagner d’une régulation par l’État afin d’en assurer les bénéfices."
PER_increase_machines_import:0 "Augmenter les importations de machines"
PER_increase_machines_import_desc:0 "Si nous voulons accroître notre production industrielle, de nouvelles machines seront nécessaires. Comme nous n’avons pas encore la capacité de les produire, nous avons négocié leur importation."
PER_increase_textile_production:0 "Augmenter la production textile"
PER_increase_textile_production_desc:0 "Le développement de l’industrie textile a surtout eu lieu dans les régions de Tabriz et d’Ispahan, et d’autres usines sont prévues par l’État."
PER_secure_weapon_deals:0 "Sécuriser les accords d’armement"
PER_secure_weapon_deals_desc:0 "Nous dépendons largement des importations d’équipements militaires. Si nous voulons renforcer notre armée, nous devons augmenter nos importations d’armes."
PER_expand_tehran_university:0 "Développer l’Université de Téhéran"
PER_expand_tehran_university_desc:0 "Inaugurée en 1934, l’Université de Téhéran a marqué un grand pas dans le développement éducatif de l’Iran. Elle représente l’avenir du pays et doit recevoir tout notre soutien."
PER_sugar_exports:0 "Exporter du sucre"
PER_sugar_exports_desc:0 "Dans le cadre de la réforme agricole, de nouvelles plantations, notamment de betteraves sucrières, ont été introduites. De nombreuses raffineries ont été construites, produisant déjà plus de 40 000 tonnes par an."
PER_shift_toward_heavy_industry:0 "Usines d’armes légères de Téhéran"
PER_shift_toward_heavy_industry_desc:0 "Région la plus industrialisée du pays, Téhéran est un lieu idéal pour établir des installations organisées de production d’armes."
PER_electronic_development:0 "Développement électronique"
PER_electronic_development_desc:0 "Notre industrie croissante et notre demande en électricité ont conduit à la création de plus de 120 centrales. Nos scientifiques proposent de passer du contrôle manuel à l’automatisation, mais cela exige des investissements en électronique moderne."
PER_study_nuclear_power:0 "Étudier l’énergie nucléaire"
PER_study_nuclear_power_desc:0 "« Une bombe de cette puissance peut détruire un port et les villes environnantes. » Ainsi écrivait Einstein à Roosevelt. Si nous parvenons à exploiter cette énergie, nous gagnerons reconnaissance internationale et dissuaderons les impérialistes."
PER_manufacture_planes:0 "Fabriquer des avions"
PER_manufacture_planes_desc:0 "Notre aviation dépend des importations de modèles étrangers. Pourtant, ces avions peuvent être produits localement, renforçant notre économie et nos industriels."
PER_increase_research_funds:0 "Augmenter les fonds de recherche"
PER_increase_research_funds_desc:0 "Les scientifiques et intellectuels [PER.GetAdjective] méritent mieux que les restes du budget. Augmenter les dépenses éducatives et scientifiques accélérera notre développement technologique."

PER_taslihat_e_artesh:0 "Taslihat-e Artesh"

