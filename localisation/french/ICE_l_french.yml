ICE_internal_conflicts:0 "Conflits internes au parti"
ICE_internal_conflicts_desc:0 "Bien que le parti au pouvoir affiche une façade unie face à ses ennemis, il est miné par des querelles et désaccords internes."

ICE_fascist_youth:0 "Programmes de jeunesse"
ICE_fascist_youth_desc:0 "La jeunesse est l’avenir du pays ; elle doit être formée pour donner le meilleur d’elle-même et défendre la nation."

ICE_ger_mil:0 "Conseillers [GER.GetAdjective]"
ICE_ger_mil_desc:0 "Des officiers [GER.GetAdjective] expérimentés conseillent l’armée de ce pays."

ICE_recycle:0 "Programmes de recyclage"
ICE_recycle_desc:0 "Ce pays applique une stricte politique de récupération, utilisant chaque matériau disponible et condamnant fermement tout gaspillage qu’il ne peut réutiliser."

ICE_den_investment:0 "Investissement [DEN.GetAdjective]"
ICE_den_investment_desc:0 "[DEN.GetNameDefCap] a des intérêts directs dans ce pays."
ICE_den_investment2:0 "Investissement [DEN.GetAdjective]"
ICE_den_investment2_desc:0 "[DEN.GetNameDefCap] a des intérêts directs dans ce pays."
ICE_den_investment3:0 "Investissement [DEN.GetAdjective]"
ICE_den_investment3_desc:0 "[DEN.GetNameDefCap] a des intérêts directs dans ce pays."

ICE_icelandic_neutrality:0 "Neutralité [ICE.GetAdjective]"
ICE_icelandic_neutrality_desc:0 "Ce pays croit fermement en sa neutralité et est peu susceptible de participer à une guerre."
ICE_icelandic_neutrality2:0 "Neutralité islandaise"
ICE_icelandic_neutrality2_desc:0 "Ce pays croit fermement en sa neutralité ; sauf en cas d’attaque directe, il ne prendra jamais part à une guerre et défendra ce principe au mieux de ses moyens."

ICE_armour_focused:0 "Doctrine blindée"
ICE_armour_focused_desc:0 "Ce pays a adopté une armée entièrement mécanisée."
ICE_mountain_strong:0 "Chasseurs alpins aguerris"
ICE_mountain_strong_desc:0 "Attaque des chasseurs alpins : §G+5%§!\nÉquipement d’infanterie requis : §G-40§!"
