ICE_geothermic_banana_production:0 "Production géothermique de bananes"
ICE_geothermic_banana_production_desc:0 "Grâce au volcanisme de notre île, l’exploitation des sources géothermiques devrait nous permettre de créer des conditions favorables à la culture d’une quantité modérée de fruits tropicaux, notamment de bananes, et ainsi réduire notre dépendance aux importations."

