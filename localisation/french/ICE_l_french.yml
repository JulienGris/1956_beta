# Tooltips
ICE_look_den_tt:0 "Améliore l’opinion et l’opinion commerciale avec [DEN.GetNameDef]."
ICE_close_eng_tt:0 "Améliore l’opinion et l’opinion commerciale avec [ENG.GetNameDef]."
ICE_close_usa_tt:0 "Améliore l’opinion et l’opinion commerciale avec [USA.GetNameDef]."
ICE_abolish_althing_tt:0 "Organiser un coup d’État pour renverser le gouvernement faible. Il en résultera probablement une certaine instabilité politique."
ICE_ikarus_tt:0 "Pour assurer notre sécurité, [GER.GetNameDef] nous fournira des Fallschirmjäger."
ICE_vikings_tt:0 "Obtient des revendications et des cœurs dans la région scandinave, au Groenland et aux îles Féroé.\n"
ICE_no_neutral_tt:0 "N’a pas l’esprit national §YNeutralité [ICE.GetAdjective]§!."
ICE_end_neutral_tt:0 "Supprime l’esprit national §YNeutralité [ICE.GetAdjective]§!.\n"
ICE_create_ifv_tt:0 "Permet de choisir un fabricant de VCI."
ICE_island_defence_tt:0 "Ajoute §G10%§! §YDéfense terrestre§! à §YDéfense du territoire national§!.\n"
ICE_advanced_weapons_tt:0 "Réduit le §Ytemps d’entraînement de l’armée§! de §G5%§! et ajoute §G5%§! de §Yfiabilité des armes d’infanterie§! et §G5%§! de §Yfiabilité de l’artillerie§! à §YDéfense du territoire national§!."
ICE_propaganda_tt:0 "Ajoute §G5%§! §YAttaque et Défense sur territoire national§! et §G5%§! §YMoral de l’armée§! à §YDéfense du territoire national§!.\n"
ICE_carrier_tt:0 "Crée un §YPorte-avions§! et §G25§! §Ybombardiers embarqués§! et §Ychasseurs embarqués§!. Les modèles seront les plus récents à la date de construction."
ICE_rocket_effort_tt:0 "Réduit la pénalité d’avance de §G-100%§! ou accorde un bonus de §G50%§! si la recherche n’est pas anticipée. Valable pour les §Y2§! prochaines recherches de ces technologies : §YArtillerie à roquettes§!."

# Focus descriptions
ICE_roads_program:0 "Programme routier"
ICE_roads_program_desc:0 "L’Islande est encore un pays de peuples isolés. Nous manquons d’infrastructures pour relier nos villes et villages. Cela doit changer dès maintenant."

ICE_look_den:0 "Regarder vers [DEN.GetNameDef]"
ICE_look_den_desc:0 "Nous ne sommes peut-être plus des sujets directs du Danemark, mais ils restent nos fidèles alliés et protecteurs. Tout comme les sujets de [ENG.GetNameDef] se tournent vers leur mère patrie, nous nous tournons vers le Danemark, notre père, pour trouver conseil."

ICE_look_away:0 "Politique étrangère indépendante"
ICE_look_away_desc:0 "[DEN.GetNameDefCap] nous a peut-être autrefois gouvernés, mais nous choisissons désormais notre destin. Même si nous décidons de conserver notre union avec [DEN.GetNameDef], nous devons agir en pays indépendant et souverain. Nos alliés, c’est à nous de les choisir."

ICE_den_inf:0 "Investissement [DEN.GetAdjective]"
ICE_den_inf_desc:0 "Nos liens solides avec [DEN.GetNameDef] nous permettent d’attirer leur attention et de rendre notre pays plus prometteur. Cela augmentera les chances que les entreprises [DEN.GetAdjective] investissent dans notre avenir."

ICE_domestic_ind:0 "Promouvoir l’industrie locale"
ICE_domestic_ind_desc:0 "La capacité industrielle de l’Islande prête à rire. Nous devrions rendre l’investissement attractif et offrir des incitations à ceux qui ouvrent des usines et entreprises ici en Islande."

ICE_den_mil_invest:0 "Investissement militaire [DEN.GetAdjective]"
ICE_den_mil_invest_desc:0 "Loin du continent instable, l’Islande est l’endroit idéal pour construire des matériels de guerre essentiels. C’est une évidence ; il ne reste qu’à convaincre [DEN.GetNameDef]."

ICE_den_research_collab:0 "Inviter des chercheurs [DEN.GetAdjective]"
ICE_den_research_collab_desc:0 "Pour progresser dans tous les domaines, nous devrions comparer nos travaux avec nos frères [DEN.GetAdjective]. Deux têtes valent mieux qu’une, surtout lorsque l’une d’elles est [ICE.GetAdjective] !"

ICE_new_industry:0 "Nouvelles pratiques industrielles"
ICE_new_industry_desc:0 "[ICE.GetNameDefCap] n’est pas exactement une puissance industrielle moderne. Pour mieux rivaliser, nous devons étudier les techniques et technologies de nos voisins plus avancés."

ICE_den_invest_final:0 "Intérêt [DEN.GetAdjective] pour l’Islande"
ICE_den_invest_final_desc:0 "L’intérêt de [DEN.GetNameDefCap] pour nos infrastructures et notre industrie a fortement augmenté. Nous devons en profiter pour obtenir le capital nécessaire et lancer l’expansion de notre capacité industrielle."

ICE_look_out:0 "Regarder vers le monde"
ICE_look_out_desc:0 "Nous avons passé bien trop de temps isolés. Nous devons nous tourner vers l’extérieur et déterminer ce qui servira le mieux notre peuple."

ICE_end_neutrality:0 "Mettre fin à la neutralité"
ICE_end_neutrality_desc:0 "Nous avons longtemps partagé la politique de neutralité de [DEN.GetNameDef]. Mais la situation mondiale actuelle nous montre que nous ne pouvons plus rester neutres en toute bonne foi."

ICE_refine_research:0 "Recherche sur les matériaux synthétiques"
ICE_refine_research_desc:0 "L’Islande manque de ressources naturelles utiles à la guerre, mais nous pourrions développer des techniques pour produire des matériaux précieux sans dépendre des matières premières rares."

ICE_recycling_programs:0 "Programmes de recyclage"
ICE_recycling_programs_desc:0 "[ICE.GetNameDefCap] ne peut se permettre de gaspiller ce qu’elle produit. Nous devons veiller à ce que même nos outils cassés trouvent une utilité."

ICE_infr_2:0 "Développer les infrastructures [ICE.GetAdjective]"
ICE_infr_2_desc:0 "Les infrastructures ne se résument pas aux routes. Nous avons besoin de ponts, de barrages, de lignes électriques et d’autres services publics essentiels."

ICE_mil_facs:0 "Investir dans la production d’armes"
ICE_mil_facs_desc:0 "Si nous voulons conserver notre indépendance, nous devons être capables de nous défendre avec des armes fabriquées ici même, en Islande."

ICE_war_manu:0 "Économie de guerre totale"
ICE_war_manu_desc:0 "La guerre a éclaté en Europe et [ICE.GetNameDef] y est désormais impliquée. L’économie doit refléter cette situation."

ICE_new_indu:0 "Nouvelles opportunités industrielles"
ICE_new_indu_desc:0 "Le monde extérieur considère enfin [ICE.GetNameDef] comme une opportunité d’investissement sérieuse. Profitons de cet intérêt pour assurer notre avenir sur le marché mondial."

ICE_strong_neutral:0 "Renforcer la neutralité [ICE.GetAdjective]"
ICE_strong_neutral_desc:0 "[ICE.GetNameDefCap] a clairement affiché son intention de rester neutre dans les guerres à venir, et nous ferons tout pour que cette neutralité soit respectée."

ICE_close_eng:0 "Établir des liens étroits avec [ENG.GetNameDef]"
ICE_close_eng_desc:0 "[ENG.GetNameDefCap] est à nos portes. Nous devons chercher leur amitié et une défense mutuelle."

ICE_close_usa:0 "Établir des liens étroits avec [USA.GetNameDef]"
ICE_close_usa_desc:0 "[USA.GetNameDefCap] n’agit peut-être pas rapidement, mais il est évident qu’ils joueront un rôle majeur à l’avenir. Nous devons établir des liens solides pour nous assurer une place dans ce futur."

ICE_fas_rallies:0 "Soutenir les rassemblements fascistes"
ICE_fas_rallies_desc:0 "Le parti nationaliste islandais, le Flokkur Þjóðernissinna, organise des rassemblements dans la capitale, Reykjavik. Plutôt que de les restreindre comme auparavant, nous devrions les encourager."

ICE_sup_com:0 "Droits des travailleurs"
ICE_sup_com_desc:0 "La Grande Dépression a mis les ouvriers et les fermiers islandais sur le devant de la scène. Nous devons garantir leur protection à l’avenir et ne jamais permettre qu’une telle crise se reproduise."

ICE_sup_dem:0 "Promouvoir la pensée républicaine"
ICE_sup_dem_desc:0 "[ICE.GetNameDefCap] doit se libérer de ses dernières chaînes qui la lient à [DEN.GetNameDef]. Fini les politiques dictées par Copenhague."

ICE_distance_den:0 "Prendre ses distances avec [DEN.GetNameDef]"
ICE_distance_den_desc:0 "Nous avons certes une longue histoire avec [DEN.GetNameDef], mais il est temps de forger notre propre destin. Nous ne pouvons plus écouter les apaisements des politiciens de Copenhague."

ICE_guarantees:0 "Réaffirmer l’engagement envers la démocratie"
ICE_guarantees_desc:0 "[ICE.GetNameDefCap] possède une démocratie forte et vivante, mais il en allait de même pour l’Allemagne il n’y a pas si longtemps. Nous devons montrer au monde que [ICE.GetNameDef] reste fidèle à ses valeurs."

ICE_break_den:0 "Indépendance vis-à-vis de [DEN.GetNameDef]"
ICE_break_den_desc:0 "Nous agissons en nation souveraine depuis plus de trois décennies. Il est temps de couper nos derniers liens avec [DEN.GetNameDef] et de nous proclamer république à part entière."

ICE_eng_defences:0 "Défenses [ENG.GetAdjective]"
ICE_eng_defences_desc:0 "Nos liens étroits avec [ENG.GetNameDef] et notre position stratégique garantissent leur volonté de nous protéger contre une attaque [GER.GetAdjective]."

ICE_join_allies:0 "Rejoindre les Alliés"
ICE_join_allies_desc:0 "La cause des Alliés est juste ; nous devons éradiquer le mal du fascisme, où qu’il se trouve !"

ICE_mountain_train:0 "Fonder l’école tactique d’Akureyri"
ICE_mountain_train_desc:0 "Le relief froid et montagneux de l’Islande constitue un terrain idéal pour l’entraînement des troupes alpines et de montagne. [ENG.GetNameDefCap] a proposé de construire une école dédiée à la formation de soldats pour cet usage."
ICE_eng_expand_airport:0 "Agrandir l’aéroport de Reykjavik"
ICE_eng_expand_airport_desc:0 "Les [ENG.GetADjective] ont besoin de bases pour stationner leurs avions en patrouille au-dessus de l’Atlantique, et ils ont manifesté leur intérêt pour l’agrandissement de l’aéroport de Reykjavik à cette fin."
ICE_usa_airport:0 "Établir l’aéroport de Keflavík"
ICE_usa_airport_desc:0 "[USA.GetNameDefCap] a exprimé son intérêt pour la construction d’un aéroport à Keflavík. Ils promettent de nous remettre cette base quelques années après la fin de la guerre."
ICE_fas_youth:0 "Fonder la jeunesse islandaise"
ICE_fas_youth_desc:0 "La jeunesse est l’avenir ; nous devons l’entraîner à être prête à tout et à guider l’Islande vers la grandeur !"
ICE_fas_leader:0 "Mettre en œuvre le Forysta Meginreglu"
ICE_fas_leader_desc:0 "Le Führerprinzip a grandement servi [GER.GetNameDefCap]. Nous devrions l’adopter et l’adapter, mettant fin aux luttes internes de notre parti. Un seul doit se tenir au-dessus des autres."
ICE_abolish_althing:0 "Abolir l’Althing"
ICE_abolish_althing_desc:0 "L’Althing est une institution impuissante, paralysée par son indécision. Nous ne pouvons plus suivre ces idées dépassées qui donnent tant de pouvoir à la multitude ; nous devons réorganiser le gouvernement selon un modèle plus corporatiste."
ICE_ikarus:0 "Opération IKARUS"
ICE_ikarus_desc:0 "[GER.GetNameDefCap] s’est intéressé à notre position stratégique et à la pureté raciale de notre peuple. Nous devrions les rejoindre dans leur guerre juste contre les capitalistes et les communistes."
ICE_vikings:0 "Héritiers des Norses"
ICE_vikings_desc:0 "Le peuple islandais est le plus robuste et le plus fort de tous. Nous sommes les véritables descendants des anciens Norses ; aucun sang faible ne coule dans nos veines. Il est temps de reprendre ce qui nous revient de droit, et comme nos ancêtres avant nous, nous apporterons la mort à ceux qui osent nous défier."
ICE_com_rallies:0 "Rassemblements communistes"
ICE_com_rallies_desc:0 "Le communisme progresse, et le peuple a montré son soutien par de grands rassemblements et une forte hausse des ventes de journaux et magazines communistes. Ils triompheront bientôt de leurs oppresseurs bourgeois !"
ICE_ger_coop:0 "Programme de coopération [GER.GetAdjective]"
ICE_ger_coop_desc:0 "L’armée de [GER.GetNameDefCap] est l’une des plus efficaces et redoutables au monde. Nous disposons de soldats d’élite ; nous devons tirer profit de cette force."
ICE_ger_tech:0 "Technologie [GER.GetAdjective]"
ICE_ger_tech_desc:0 "Les scientifiques de [GER.GetNameDefCap] sont les meilleurs du monde. En les faisant venir ici, nous pourrons former la prochaine génération de grands savants et ouvrir l’Ère islandaise !"
ICE_com_takeover:0 "Gouvernement communiste"
ICE_com_takeover_desc:0 "Le peuple n’attend plus ; nous devons prendre les choses en main. Le gouvernement actuel doit être remplacé par ceux qui embrassent la révolution."
ICE_join_com:0 "Rejoindre le Komintern"
ICE_join_com_desc:0 "Bien que notre parti communiste fasse déjà partie du Komintern, nous n’avons aucune relation officielle avec [SOV.GetNameDef] en tant qu’État. Il est temps de formaliser nos liens."
ICE_sov_tech:0 "Science [SOV.GetAdjective]"
ICE_sov_tech_desc:0 "[SOV.GetNameDefCap] rassemble des scientifiques du monde entier, disposés à nous aider à faire entrer notre pays dans l’ère ouvrière moderne."
ICE_sov_group:0 "Volontaires [SOV.GetAdjective]"
ICE_sov_group_desc:0 "Pour toute la grandeur de l’Islande, il lui manque des effectifs. Peut-être que [SOV.GetNameDef] acceptera d’envoyer des « volontaires » pour défendre nos intérêts communs ?"
ICE_com_kill_oppressors:0 "Renverser les oppresseurs"
ICE_com_kill_oppressors_desc:0 "Le Danemark a régné sur nos terres durant des siècles, apportant misère et désespoir. Désormais, avec l’aide de [SOV.GetNameDef], il est temps de libérer les travailleurs [DEN.GetADjective] de leurs oppresseurs afin qu’ils connaissent la même liberté que nous !"
ICE_ally_tech:0 "Équipes de recherche alliées"
ICE_ally_tech_desc:0 "La démocratie est le meilleur moteur du progrès scientifique, et cela n’a jamais été aussi évident qu’aujourd’hui. Nos scientifiques sont émerveillés par les avancées spectaculaires de nos alliés. Il est temps d’en tirer profit pour notre pays."
ICE_shieldmaidens:0 "Former les légions de bouclières"
ICE_shieldmaidens_desc:0 "Autrefois, les Vikings envoyaient leurs femmes au combat. Féroces comme des tigresses et deux fois plus redoutables, les bouclières étaient craintes dans toute l’Europe médiévale. Il est naturel que [ICE.GetNameDef], héritière légitime des Norses, poursuive cette tradition. Aux armes, femmes, votre combat vous attend !"
ICE_national_def_force:0 "Créer la Force nationale de défense"
ICE_national_def_force_desc:0 "Nous dépendons entièrement de [DEN.GetNameDef] pour notre défense. C’est inacceptable ; nous devons constituer une armée pour nous protéger."
ICE_train_reserves:0 "Former des réserves"
ICE_train_reserves_desc:0 "Maintenant que nous disposons d’une Force nationale de défense et d’officiers formés, il est temps d’entraîner des réserves."
ICE_look_into_armour:0 "Doctrine blindée"
ICE_look_into_armour_desc:0 "[ICE.GetNameDefCap] possède des soldats robustes, mais cela ne compense pas le manque d’effectifs. Nous devons envisager le recours à des véhicules blindés."
ICE_look_into_special:0 "Doctrine des troupes d’élite"
ICE_look_into_special_desc:0 "[ICE.GetNameDefCap] ne dispose peut-être pas des effectifs des autres nations, mais chacun de nos soldats en vaut dix. Pour maximiser cet atout, nous devons créer des unités spécialisées capables d’affronter tout ennemi."
ICE_reserve_focus:0 "Priorité à la défense de l’île"
ICE_reserve_focus_desc:0 "[ICE.GetNameDefCap] n’a pas les moyens de porter la guerre chez l’ennemi. Nous devons plutôt concentrer nos forces sur la défense de notre belle île contre toute invasion."
ICE_mountain_focus:0 "Par la terre"
ICE_mountain_focus_desc:0 "Le relief rude de l’Islande forge les hommes les plus endurcis. En combattant depuis collines et montagnes, l’ennemi ne pourra jamais nous déloger, et jamais il ne nous verra venir."
ICE_on_sea:0 "Par la mer"
ICE_on_sea_desc:0 "Les Islandais grandissent entourés par l’océan. Ajoutons à cela notre héritage maritime : notre peuple est prêt à combattre sur mer comme sur terre."
ICE_by_air:0 "Par les airs"
ICE_by_air_desc:0 "Nos ancêtres furent les pionniers des invasions navales, mais les temps ont changé. La mer cède la place au ciel, et nous devons à nouveau saisir l’avenir de la guerre à bras-le-corps."
ICE_special_done:0 "Troupes d’élite perfectionnées"
ICE_special_done_desc:0 "Nos soldats sont les mieux entraînés au monde, chacun maître dans sa spécialité. Mais une idée germe : et si nous formions chaque soldat à exceller dans tous les domaines ?"
ICE_mobile_warfare:0 "Guerre de mouvement"
ICE_mobile_warfare_desc:0 "La guerre repose désormais sur les véhicules et la mobilité. Si nous voulons une force blindée complète, nous devons étudier les méthodes les plus efficaces d’utilisation de nos blindés."
ICE_heavy_armour:0 "Blindés lourds"
ICE_heavy_armour_desc:0 "La clé de la victoire réside dans des blindés lourds et impénétrables. L’ennemi ne peut pas tuer ce qu’il ne peut pas percer."
ICE_mobile_armour:0 "Blindés mobiles"
ICE_mobile_armour_desc:0 "Un blindage épais arrête les balles, mais aucune épaisseur n’arrête ce qui frappe à des kilomètres. Nous avons besoin de blindés capables de combattre l’ennemi et de l’atteindre."
ICE_pure_armour:0 "Forces exclusivement blindées"
ICE_pure_armour_desc:0 "Notre choix d’une armée purement blindée a garanti l’excellence de nos troupes. L’acier est éternel !"
ICE_local_militia:0 "Former des milices locales"
ICE_local_militia_desc:0 "Même à l’ère moderne, l’Islande reste un pays largement rural, difficile à défendre par une armée conventionnelle. Si nous organisons des milices locales, nous pourrons harceler l’ennemi partout et renforcer considérablement notre défense."
ICE_island_defence:0 "Initiative de défense de l’île"
ICE_island_defence_desc:0 "Pour défendre l’Islande, nous devons renforcer ses défenses. L’ennemi ne doit prendre aucune plage, n’avancer d’aucun mètre. Nous poserons des mines, tisserons des barbelés et érigerons des fortins."
ICE_propaganda:0 "Efforts de propagande"
ICE_propaganda_desc:0 "Ils ne viennent pas seulement pour nos terres ; ils viennent pour nos femmes et nos enfants, pour brûler nos champs et détruire nos foyers. [ICE.GetNameDefCap] disparaîtra si chaque homme, femme et enfant ne met pas toute son énergie à contrecarrer les plans de l’ennemi !"
ICE_advanced_weapons:0 "Armes avancées"
ICE_advanced_weapons_desc:0 "Si nous ne pouvons vaincre par le nombre, nous vaincrons grâce à notre savoir-faire et à nos armes supérieures !"
ICE_create_ifv:0 "Fonder Ísland Fyrstu Vopnin"
ICE_create_ifv_desc:0 "Trop longtemps l’Islande a-t-elle dépendu des armes et technologies étrangères. Nous devons créer notre propre entreprise d’armement [ICE.GetAdjective] ! L’avenir nous appartient, et à nous seuls !"
ICE_coastguard:0 "Renforcer la garde-côtière"
ICE_coastguard_desc:0 "Principale force de défense de [ICE.GetNameDefCap], la garde-côtière islandaise veille sans relâche à protéger la nation. Mais elle est dramatiquement en sous-effectif ; il est temps d’y remédier."
ICE_sea_air:0 "La mer par les airs"
ICE_sea_air_desc:0 "L’avenir du combat se joue dans le ciel, et en tant que nation insulaire, nous devons anéantir l’ennemi avant même qu’il n’atteigne nos côtes. À la mer, garçons, nous y allons par les airs !"
ICE_air_and_sea:0 "La terre et la mer"
ICE_land_and_sea_desc:0 "Nous ne pouvons pas limiter nos avions à la seule défense maritime ; il nous faut aussi assurer la défense du territoire ! Une percée suffirait à causer notre perte. Nous devons l’empêcher à tout prix."
ICE_air_doctrine:0 "Établir une doctrine aérienne"
ICE_air_doctrine_desc:0 "[ICE.GetNameDefCap] vient tout juste d’entrer dans la guerre aérienne, mais nous comprenons déjà que notre manque de vision nous handicape. Pour régner sur les cieux, nous devons codifier nos pratiques."
ICE_build_dock:0 "Construire de véritables chantiers navals"
ICE_build_dock_desc:0 "Si [ICE.GetNameDef] dispose de quelques petits chantiers, ils ne sont pas comparables à ceux des autres nations. Pour construire des navires d’envergure, nous devons ériger de véritables infrastructures."
ICE_dockyards_2:0 "Étendre les chantiers navals"
ICE_dockyards_2_desc:0 "Nos nouveaux chantiers sont enfin achevés, et nous pouvons commencer à développer la flotte de notre garde-côtière. Il faut maintenant les agrandir."
ICE_ships:0 "Lancer la construction de grands navires"
ICE_ships_desc:0 "Par le passé, nous avons dû mettre des canons sur des chalutiers pour nous défendre. Il est temps d’avoir une véritable flotte, avec de vrais navires."
ICE_carrier:0 "PROJET : Mávur"
ICE_carrier_desc:0 "Après des mois de conception et de développement, nous avons enfin conçu le porte-avions ultime. Il exigera toutes les ressources de la nation, mais une fois achevé, nous serons invincibles !"
ICE_sub:0 "Opérations sous-marines"
ICE_sub_desc:0 "Nos mers sont vulnérables aux flottes ennemies, mais nous n’avons pas les ressources pour les affronter directement. La construction de sous-marins devrait compenser cette faiblesse."
ICE_from_afar:0 "La mort venue de loin"
ICE_from_afar_desc:0 "Nos scientifiques ont découvert un nouveau mode de propulsion, la « fusée ». Capables en théorie de parcourir une bonne partie du globe, ces engins nous permettraient de frapper nos ennemis sans risquer la vie d’un seul soldat [ICE.GetAdjective] !"
ICE_nuke:0 "Eau lourde"
ICE_nuke_desc:0 "En étudiant la structure fondamentale de la matière, un groupe de scientifiques a fait une découverte incroyable : il serait possible de maîtriser l’atome comme arme, avec une puissance destructrice au-delà de l’imagination."
ICE_expand_rocketry:0 "Développer le programme spatial"
ICE_expand_rocketry_desc:0 "Nos recherches sur les fusées ont donné d’excellents résultats ; nous devons y consacrer autant de ressources que possible !"
ICE_nav_doc:0 "Établir la mission de la garde-côtière"
ICE_nav_doc_desc:0 "La garde-côtière protège [ICE.GetNameDef] de toutes les menaces, étrangères comme intérieures, mais quelles sont exactement ses prérogatives ? Quelle est sa juridiction, quelles tactiques doit-elle privilégier ? Ce sont les questions auxquelles il faut répondre pour assurer son efficacité."
ICE_screen_ships:0 "Former une flotte d’escorte"
ICE_screen_ships_desc:0 "La garde-côtière de [ICE.GetNameDefCap] a besoin d’une force d’escorte moderne et efficace."
ICE_anti_sub:0 "Chasseurs de loups"
ICE_anti_sub_desc:0 "Les sous-marins menacent notre existence en attaquant nos navires marchands et de pêche. Il est temps d’apprendre à ces « meutes de loups » qui est le véritable prédateur."
ICE_fighting_ships:0 "Navires de combat"
ICE_fighting_ships_desc:0 "[ICE.GetNameDefCap] doit pouvoir se défendre contre tous ceux qui lui veulent du mal. Il nous faut doter notre garde-côtière de navires capables d’assurer cette protection."
ICE_coast_guard:0 "La marine de [ICE.GetNameDefCap]"
ICE_coast_guard_desc:0 "La garde-côtière de [ICE.GetNameDefCap] n’est pas une marine à proprement parler. Elle défend nos côtes et nos cieux, mais son rôle reste celui d’une force de protection. Il est temps de décider si elle doit devenir la véritable marine et armée de l’air de [ICE.GetNameDef]."
ICE_steel_mill:0 "Haut-fourneau [ICE.GetAdjective]"
ICE_steel_mill_desc:0 "L’Islande n’avait ni l’infrastructure ni la technologie pour ériger un haut-fourneau digne de ce nom. Maintenant que nous les possédons, nous devons les utiliser."
ICE_discoveries:0 "Pensée industrielle"
ICE_discoveries_desc:0 "L’Islande a longtemps accusé un retard dans la construction d’infrastructures modernes. Mais nos recherches sur de nouvelles méthodes de construction ont suscité des percées dans tout le pays."

#IDEAS

ICE_disloyal:0 "Sujet déloyal"
ICE_disloyal_desc:0 "Ce pays souhaite se libérer de son suzerain, bien que pas nécessairement immédiatement."
ICE_disloyal_democratic:0 "Sujet déloyal"
ICE_disloyal_democratic_desc:0 "Ce pays souhaite se libérer de son suzerain. Il diffuse activement une rhétorique républicaine pour s’en assurer."
ICE_disloyal_democratic2:0 "Sujet déloyal"
ICE_disloyal_democratic2_desc:0 "Ce pays souhaite se libérer de son suzerain. Il diffuse activement une rhétorique républicaine pour que cela se produise le plus vite possible."
ICE_disloyal_communism:0 "Sujet déloyal"
ICE_disloyal_communism_desc:0 "Ce pays souhaite se libérer de son suzerain. Il promeut les droits des travailleurs et la liberté face aux oppresseurs pour atteindre cet objectif."
ICE_disloyal_communism2:0 "Sujet déloyal"
ICE_disloyal_communism2_desc:0 "Ce pays souhaite se libérer de son suzerain. Il promeut les droits des travailleurs et la liberté face aux oppresseurs pour atteindre cet objectif."
ICE_disloyal_fascism:0 "Sujet déloyal"
ICE_disloyal_fascism_desc:0 "Ce pays souhaite se libérer de son suzerain. Le nationalisme et les idées de suprématie dominent désormais le débat national, certaines manifestations tournant même à la violence."
ICE_disloyal_fascism2:0 "Sujet déloyal"
ICE_disloyal_fascism2_desc:0 "Ce pays souhaite se libérer de son suzerain. Le nationalisme et les idées de suprématie dominent désormais le débat national, certaines manifestations tournant même à la violence."

