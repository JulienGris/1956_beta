l_french:
 serbia_focus:0 "Arbre de priorités serbe"

 #characters
 SER_konstantin_musicki:0 "Konstantin Mušicki"

 SER_local_developers:0 "Concepteurs locaux"
 SER_local_developers_desc:0 "Les avions serbes sont les meilleurs. Aucune partialité ici, bien sûr."
 SER_state_guard:0 "Former la Srpska Državna Straža"
 SER_state_guard_desc:0 "Pour garantir la sécurité de la nation, nous devons établir une armée permanente pour protéger notre territoire : la Garde d’État serbe."
 SER_small_arms:0 "Améliorer la maniabilité des armes légères"
 SER_small_arms_desc:0 "Les limites de l’équipement que l’infanterie peut porter sont constamment repoussées. Nous donnerons à nos troupes les meilleurs outils disponibles."
 SER_improve_conscripts_equipment:0 "Améliorer l’équipement des conscrits"
 SER_improve_conscripts_equipment_desc:0 "Si les conscrits ne peuvent recevoir les meilleures armes, nous devons au moins nous assurer qu’ils disposent d’un équipement suffisant pour se battre au mieux de leurs capacités."
 SER_motorization_effort:0 "Corps motorisé"
 SER_motorization_effort_desc:0 "La mobilité et la protection sont cruciales pour déplacer l’infanterie en zone de combat et l’en faire sortir en sécurité. Se concentrer sur ces développements nous permettra d’agir rapidement."
 SER_structured_logistics:0 "Logistique structurée"
 SER_structured_logistics_desc:0 "Étant donné nos capacités de production limitées, nous ne pouvons nous permettre de perdre du matériel précieux ; un système logistique clair et structuré est vital pour maintenir notre aptitude à faire la guerre."
 SER_recovery_teams:0 "Équipes de récupération"
 SER_recovery_teams_desc:0 "Pour réduire davantage les pertes de matériel, nous devons organiser des équipes chargées de récupérer armes et véhicules sur les champs de bataille."
 SER_army_maneuvers:0 "Manœuvres de l’armée"
 SER_army_maneuvers_desc:1 "Pour remettre notre armée en condition, de nouveaux exercices doivent être organisés. L’expérience mènera sans aucun doute à de nouvelles idées en matière de guerre moderne."
 SER_supremacy_of_offense:0 "Suprématie de l’offensive"
 SER_supremacy_of_offense_desc:1 "L’action offensive est la clé de la victoire et doit dicter notre stratégie générale ainsi que le développement de nouvelles doctrines."
 SER_supremacy_of_defense:0 "Suprématie de la défense"
 SER_supremacy_of_defense_desc:1 "Ennemis de tous côtés, nous devons tenir assez longtemps pour que nos alliés allègent la pression. Le développement de nouvelles doctrines doit se concentrer sur la défense de notre patrie."
 SER_artillery_regiments:0 "Régiments d’artillerie"
 SER_artillery_regiments_desc:1 "En dotant nos divisions de puissants régiments d’artillerie, leur force de combat globale augmentera sensiblement."
 SER_domestic_artillery_production:0 "Production d’artillerie nationale"
 SER_domestic_artillery_production_desc:1 "En stimulant le développement de modèles d’artillerie modernes produits localement, nous pouvons garantir à nos forces le meilleur appui feu possible."
 SER_anti_tank_defenses:0 "Défenses antichars"
 SER_anti_tank_defenses_desc:1 "Le char occupant désormais le devant de la scène, de nouveaux développements sont nécessaires en matière de canons antichars de campagne, permettant à notre infanterie d’abattre ces colosses blindés."
 SER_mountain_brigades:0 "Brigades de montagne"
 SER_mountain_brigades_desc:1 "De larges portions de notre pays sont montagneuses, ce qui exige la formation d’unités spécialisées pour ce type de terrain."
 SER_armored_cavalry:0 "Cavalerie blindée"
 SER_armored_cavalry_desc:0 "La mécanisation de la cavalerie et la transition vers des half-tracks permettraient une grande mobilité et une meilleure protection des unités. Bien que coûteuse, cette transition est nécessaire pour assurer une victoire rapide sur le terrain."
 SER_tank_conversions:0 "Conversions de chars"
 SER_tank_conversions_desc:1 "Nous pouvons avoir besoin de chars aujourd’hui, mais de l’artillerie automotrice ou de chasseurs de chars sur le même châssis demain. Notre matériel blindé doit rester flexible et adaptable à nos besoins."
 SER_modern_tanks:0 "Chars modernes"
 SER_modern_tanks_desc:1 "Avec l’ajout d’un armement principal de gros calibre, la technologie blindée dépasse largement le simple transport protégé de troupes. Nous devons construire nos propres chars modernes pour rivaliser avec nos voisins."

 SER_equipment_effort_2:0 "Effort d’équipement II"
 SER_equipment_effort_2_desc:0 "Nous poursuivrons nos efforts pour armer notre infanterie et nos unités d’appui avec le meilleur équipement de notre époque."
 SER_mechanization_effort:0 "Effort de mécanisation"
 SER_mechanization_effort_desc:0 "En repensant les possibilités de l’infanterie motorisée, nous pouvons repousser les limites des véhicules que nous construisons aujourd’hui."
 SER_doctrine_effort_2:0 "Effort doctrinal II"
 SER_doctrine_effort_2_desc:0 "Le champ de bataille a changé durant l’entre-deux-guerres et les récents conflits. Nous devons réévaluer continuellement nos doctrines."
 SER_equipment_effort_3:0 "Effort d’équipement III"
 SER_equipment_effort_3_desc:0 "Plutôt que d’imiter ou d’acheter des armes étrangères, devenons un leader mondial des armements d’infanterie."
 SER_armor_effort:0 "Effort blindé"
 SER_armor_effort_desc:0 "En appliquant les leçons tirées de la mécanisation de l’infanterie, nous pouvons améliorer nos véhicules blindés."
 SER_special_forces:0 "Forces spéciales"
 SER_special_forces_desc:0 "Nous avons besoin d’unités d’élite ; troupes de montagne et parachutistes doivent être notre priorité."
 SER_aviation_effort:0 "Fonder l’École aérienne de Belgrade"
 SER_aviation_effort_tt:0 "Pas assez d’emplacements de construction pour une §Ybase aérienne§!."
 SER_aviation_effort_desc:0 "Nulle part les progrès technologiques ne sont plus rapides qu’en matière de guerre aérienne. L’aviation est un domaine que toute nation moderne doit maîtriser."
 SER_fighter_focus:0 "Priorité aux chasseurs"
 SER_fighter_focus_desc:0 "Les duels aériens n’ont pas disparu avec la Grande Guerre. Rester en tête dans le développement des chasseurs nous donnera un avantage."
 SER_bomber_focus:0 "Priorité aux bombardiers"
 SER_bomber_focus_desc:0 "Quand on parlera des horreurs de la guerre moderne, la pluie de feu venue du ciel sera omniprésente. Nous ferons en sorte que ces histoires soient racontées par nos ennemis."
 SER_airplanes_licenses:0 "Licences d’avions"
 SER_airplanes_licenses_desc:0 "Nos capacités de conception étant limitées, nous devrions obtenir des licences et équiper notre armée de l’air de chasseurs modernes."
 SER_form_mechanics:0 "Former des équipes de mécaniciens"
 SER_form_mechanics_desc:0 "Qu’importe qu’un avion tombe sous les balles ennemies, prenne feu soudainement ou soit immobilisé par une panne si nous ne pouvons pas le réparer ? Pour réduire les risques de défaillance, il faut des mécaniciens dédiés et bien formés qui connaissent leurs appareils mieux qu’un chirurgien son anatomie."
 SER_aviation_effort_2:0 "Doctrine aérienne avancée"
 SER_aviation_effort_2_desc:0 "De nouveaux progrès sont nécessaires pour bien intégrer notre armée de l’air aux autres branches."
 SER_CAS_effort:0 "Effort d’appui aérien rapproché"
 SER_CAS_effort_desc:0 "Une armée moderne a besoin d’un appui venu du sol comme des airs."
 SER_rocket_effort:0 "Effort fusées"
 SER_rocket_effort_desc:0 "Les moteurs-fusées et à réaction permettent des vitesses inédites pour drones comme pour appareils pilotés. En pionniers, nous surprendrons l’ennemi."
 SER_NAV_effort:0 "Effort aéronaval"
 SER_NAV_effort_desc:0 "Si une part de la guerre navale moderne se joue sous l’eau, une autre se déroule dans les airs, au-dessus des flots."

 SER_ikarus:0 "Ikarus"
 SER_ikarus_desc:1 "Notre plus ancienne industrie aéronautique : les usines Ikarus de Novi Sad doivent être agrandies pour préparer la montée en cadence de notre nouvelle armée de l’air."
 SER_designer_tt:0 "Déverrouille cette entreprise comme concepteur d’avions.\n"
 SER_rogozarski:0 "Rogožarski"
 SER_rogozarski_desc:1 "Fondée peu après Ikarus, la « Première usine d’avions serbe de Živojin Rogožarski » doit s’agrandir pour répondre à la demande."
 SER_zmaj:0 "Zmaj"
 SER_zmaj_desc:1 "Les ateliers aéronautiques Zmaj de Belgrade doivent recevoir de nouveaux espaces d’expansion. Plus jeune que nos autres sociétés, Zmaj a le potentiel de répondre à nos besoins si elle est agrandie."

 ######################NAVY###################
 SER_expand_the_split_shipyards:0 "Agrandir les chantiers monténégrins"
 SER_expand_the_split_shipyards_desc:0 "Notre industrie navale existante au Monténégro est idéale pour une expansion et dispose d’installations permettant des bâtiments de guerre plus grands."
 SER_coastal_defense:0 "Défense côtière"
 SER_coastal_defense_desc:0 "Nous ne pouvons espérer rivaliser avec les flottes adverses dans l’Adriatique. Préparons plutôt nos côtes à repousser toute invasion."
 SER_contest_the_adriatic:0 "Contester l’Adriatique"
 SER_contest_the_adriatic_desc:0 "La défense de nos côtes commence au large. Développons des tactiques et stratégies navales pour prendre — ou contester — le contrôle de l’Adriatique."
 SER_light_cruiser:0 "Concevoir des croiseurs légers"
 SER_light_cruiser_desc:1 "Il nous faut un croiseur moderne pour épine dorsale de notre flotte adriatique."
 SER_naval_bombers:0 "Bombardiers navals"
 SER_naval_bombers_desc:1 "L’Adriatique est longue mais étroite, facilement accessible depuis nos aérodromes. Développer des modèles dédiés de bombardiers navals pourrait grandement améliorer les chances de notre marine face à plus puissant qu’elle."
 SER_heavy_cruiser_project:0 "Projet de croiseur lourd"
 SER_heavy_cruiser_project_desc:1 "Pour défier correctement des marines hostiles, il nous faut plus de tonnage et un armement plus lourd. Les croiseurs lourds seraient une bonne évolution."
 SER_modern_destroyers:0 "Destroyers modernes"
 SER_modern_destroyers_desc:1 "Les destroyers sont l’épine dorsale de toute flotte ; les nôtres ne doivent pas être inférieurs à ceux de nos adversaires."

 SER_build_the_nation:0 "Jeter les bases de l’industrialisme"
 SER_build_the_nation_desc:0 "Concentrons tous nos efforts politiques sur l’essor de l’industrie civile lors d’un grand bond en avant."
 SER_research_collaboration:0 "Coopération de recherche yougoslave"
 SER_research_collaboration_desc:0 "En tant que région autonome, il est logique de partager toute découverte pertinente avec le gouvernement central yougoslave."
 SER_prospect_for_resources:0 "Prospecter des ressources"
 SER_prospect_for_resources_desc:0 "Notre sol recèle des ressources utiles au combat de notre époque. Libérons-les au plus vite et tirons-en le meilleur parti."
 SER_construction_effort_tt:0 "Pas assez d’emplacements de construction pour des §Yusines civiles§!."
 SER_construction_effort:0 "Premiers pas vers l’industrialisation"
 SER_construction_effort_desc:0 "Premiers pas vers l’industrialisation."
 SER_production_effort:0 "Armer la nation"
 SER_production_effort_tt:0 "Pas assez d’emplacements de construction pour une §Yusine militaire§!."
 SER_production_effort_desc:0 "Si l’on peut fabriquer des tracteurs, on peut fabriquer des chars ! Ne laissons pas notre capacité de production militaire à la traîne."
 SER_construction_effort_2:0 "Industrialiser la Morava rurale"
 SER_construction_effort_2_desc:0 "Poursuivre l’extension de nos usines accélérera la production de biens pour le commerce et les chantiers."
 SER_industrial_planning:0 "Planification industrielle"
 SER_industrial_planning_desc:0 "Pour poursuivre nos développements, nous devons établir des stratégies de long terme et identifier des terrains adaptés."
 SER_create_skopje_arsenals:0 "Créer de nouveaux arsenaux à Skopje"
 SER_create_skopje_arsenals_desc:1 "La Macédoine n’a jamais vraiment eu d’industrie militaire ; il est temps d’en créer."
 SER_production_effort_2:0 "Soutenir l’industrie des véhicules lourds"
 SER_production_effort_2_desc:0 "En tant que l’un des principaux ports européens, Anvers est idéale pour développer une industrie tournée vers l’exportation."  # (Texte d’origine mentionnant Anvers conservé fidèlement)
 SER_infrastructure_effort:0 "Relier Podgorica à Belgrade"
 SER_infrastructure_effort_desc:0 "Sans infrastructures adéquates, impossible de mener des projets ou constructions avancés."
 SER_infrastructure_effort_tt:0 "Pas assez d’emplacements de construction pour des §Yinfrastructures§!."
 SER_extract_aluminium:0 "Développer l’aluminium monténégrin"
 SER_extract_aluminium_desc:0 "L’aluminium est notre principale ressource ; nous devons absolument en maximiser l’extraction."
 SER_develop_steel_deposits:0 "Développer l’acier de la Morava"
 SER_develop_steel_deposits_desc:0 "La jeune sidérurgie de la Morava doit être développée pour fournir l’acier nécessaire au pays."
 SER_expand_the_university_of_belgrade:0 "Agrandir l’université de Belgrade"
 SER_expand_the_university_of_belgrade_desc:0 "L’université de Belgrade est déjà, de loin, la plus grande du pays. En lui allouant davantage de moyens, notamment pour des recherches pouvant déboucher sur des innovations militaires, nous pourrions acquérir un avantage décisif sur le champ de bataille."
 SER_develop_macedonia:0 "Développer la Macédoine"
 SER_develop_macedonia_desc:0 "Les Macédoniens n’existent pas ; ce sont simplement des Serbes musulmans. La Macédoine est donc habitée par des Serbes et mérite autant de soins que le reste de la Serbie."
 SER_construction_effort_3:0 "Effort industriel III"
 SER_construction_effort_3_desc:0 "L’extension de notre réseau d’infrastructures a nettement amélioré notre capacité de construction."
 SER_nuclear_effort:0 "Institut nucléaire de Vinča"

 SER_nuclear_effort_desc:0 " "
 SER_extra_tech_slot_2:0 "Étendre le département R&D"
 SER_extra_tech_slot_2_desc:0 "La rapide industrialisation de notre nation a ouvert de nouvelles opportunités de R&D que nous devrions poursuivre."
 SER_technology_sharing:0 "Partage technologique"
 SER_technology_sharing_desc:0 "En partageant nos avancées technologiques avec nos alliés, toute notre faction mènera la R&D de temps de guerre plus efficacement."
 SER_secret_weapons:0 "Armes secrètes"
 SER_secret_weapons_desc:0 "Il est tentant d’affecter toutes les ressources supplémentaires aux chars et aux avions, mais le secret de la victoire réside dans des domaines scientifiques entièrement nouveaux : électronique, astronautique et recherche nucléaire."
 SER_political_effort:0 "Organiser le nouvel État"
 SER_political_effort_desc:0 "Notre premier objectif est d’établir les représentations gouvernementales de base à travers le pays."
 SER_collectivist_ethos:0 "Renforcer les syndicats"
 SER_collectivist_ethos_desc:0 "Nos ennemis peuvent diviser pour mieux régner sur des nations plus faibles, mais notre peuple restera uni — tous pour un et un pour tous."
 SER_liberty_ethos:0 "Consensus démocratique"
 SER_liberty_ethos_desc:0 "Nous protégerons les libertés individuelles et la liberté à une époque où des fanatiques idéologiques cherchent à étouffer l’esprit humain."
 SER_militarism:0 "Militariser le pays"
 SER_militarism_desc:0 "Pour combattre l’ennemi de l’État, recrutons parmi nos volontaires militants afin d’affronter nos ennemis idéologiques mortels, en particulier les communistes."
 SER_political_correctness:0 "Correction politique"
 SER_political_correctness_desc:0 "Des personnes aux opinions légèrement controversées — ou gênantes — voient partout un vaste complot contre elles. Cela nous semble être une excellente idée."
 SER_neutrality_focus:0 "Priorité à la neutralité"
 SER_neutrality_focus_desc:0 "D’aucuns prétendent qu’il faut du courage et de la sagesse pour prendre parti dans un conflit mondial ; nous savons qu’il en faut davantage pour refuser."
 SER_interventionism_focus:0 "Priorité à l’interventionnisme"
 SER_interventionism_focus_desc:0 "Nous valorisons la liberté de tous les peuples, pas seulement celle de nos citoyens. Si prévenir la tyrannie implique la guerre, qu’il en soit ainsi."
 SER_military_youth:0 "Endoctrinement à la guerre"
 SER_military_youth_desc:0 "Des organisations promouvant discipline et éducation politique forgeront tôt la loyauté et l’esprit de sacrifice."
 SER_deterrence:0 "Dissuasion"
 SER_deterrence_desc:0 "Seuls, nous tirons rarement profit de la guerre. Heureusement, la meilleure défense est celle que l’on connaît si bien qu’on n’a jamais à l’employer."
 SER_volunteer_corps:0 "Corps de volontaires"
 SER_volunteer_corps_desc:0 "Forcer notre peuple à mourir pour des idéaux de liberté serait d’une ironie cruelle ; en revanche, donner les moyens à ceux qui souhaitent aider à l’étranger ne l’est pas."
 SER_paramilitarism:0 "Paramilitarisme"
 SER_paramilitarism_desc:0 "Les principes militaires ont des applications hors de l’armée. Davantage de citoyens auront une formation militaire si nous développons des unités semi-militarisées pour compléter nos forces."
 SER_indoctrination_focus:0 "Endoctrinement"
 SER_indoctrination_focus_desc:0 "Puisque notre idéologie est fondée sur la vérité, elle peut être enseignée comme telle. L’éducation et les médias doivent refléter cette leçon."
 SER_foreign_expeditions:0 "Expéditions extérieures"
 SER_foreign_expeditions_desc:0 "Puisque nos ennemis se préparent à intervenir au loin au nom de leurs idéaux, préparons-nous à en faire autant pour les nôtres."
 SER_why_we_fight:0 "Pourquoi nous nous battons"
 SER_why_we_fight_effect:0 "Si nous n’avons pas l’esprit §YPolitique étrangère neutre§!, nous pouvons créer des factions.\n"
 SER_why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple doit voir les atrocités commises par ceux qui convoitent le pouvoir. Rassemblons la nation à notre cause et assurons-nous que chacun est prêt à se battre pour notre liberté."
 SER_political_commissars:0 "Commissaires politiques"
 SER_political_commissars_desc:0 "Pour garantir l’application de nos politiques dans la pratique militaire, nous introduirons des responsables nommés politiquement au sein des rangs."
 SER_organized_partizans:0 "Partisans organisés"
 SER_organized_partizans_desc:0 "Pour faire face à la menace d’une invasion, nous devons organiser à l’avance des cellules de résistance. Elles prépareront des caches, repéreront des zones de largage et recruteront des locaux afin de recueillir du renseignement. Tous ces efforts mettront un maximum de pression à l’arrière des lignes ennemies."
 SER_internationalism_focus:0 "Priorité à l’internationalisme"
 SER_internationalism_focus_desc:0 "L’idéologie ne connaît pas de frontières. Un autre État peut se dire souverain ; nos convictions s’élèvent au-dessus de telles prétentions."
 SER_nationalism_focus:0 "Salut national"
 SER_nationalism_focus_desc:0 "Ces dernières décennies, la Serbie faisait partie de l’État yougoslave, qui rassemblait de nombreuses minorités balkaniques, comme les Bosniaques et les Slovènes. Mais cet État n’est plus ; désormais, nous régnerons sur les Balkans en tant que fière nation serbe !"
 SER_ideological_fanaticism_communism:0 "Fanatisme idéologique"
 SER_ideological_fanaticism_communism_desc:0 "Nos valeurs et objectifs politiques valent autant qu’une foi ancienne ; quiconque nous suit doit être prêt à faire face à la mort, et les déviants à l’affronter."
 SER_ideological_fanaticism:0 "Fanatisme idéologique"
 SER_ideological_fanaticism_desc:0 "Nos valeurs et objectifs politiques valent autant qu’une foi ancienne ; quiconque nous suit doit être prêt à faire face à la mort, et les déviants à l’affronter."
 SER_anti_partizan_tactics:0 "Tactiques anti-partisans"
 SER_anti_partizan_tactics_desc:0 "Les partisans doivent être combattus et chassés de leurs montagnes. Pour porter le combat au cœur de leur territoire, des patrouilles régulières sécuriseront les villages et nous collecterons des renseignements auprès des locaux loyaux. Nous n’avons pas d’autre choix si nous voulons vaincre les communistes et remporter cette lutte une bonne fois pour toutes."
 SER_faithful_ally:0 "Un allié fidèle"
 SER_faithful_ally_desc:0 "Par notre détermination à défendre notre sol et le sang versé pour la cause commune d’une victoire européenne contre le judéo-bolchevisme, nous avons mérité d’être reconnus comme de véritables membres des puissances de l’Axe. Tout cela a été facilité par l’œuvre brillante de nos phrénologues, qui ont prouvé que, contrairement à ces sales Serbes, nous sommes les descendants directs des Aryens qui ont migré vers le sud."
 SER_catholic_dominance_focus:0 "Domination catholique"
 SER_catholic_dominance_focus_desc:0 "Depuis des siècles, les Croates sont guidés par l’enseignement de l’Église catholique romaine. Depuis notre union forcée avec la Serbie, beaucoup ont embrassé l’orthodoxie par intérêt. Cela doit cesser : tout [CRO.GetAdjective] chrétien doit reconnaître l’autorité de Sa Sainteté le Pape."
 SER_secularism_focus:0 "Laïcité"
 SER_secularism_focus_desc:0 "La foi ne doit en aucun cas interférer avec les affaires de l’État. Elle doit rester une question privée, et le personnel religieux doit être tenu à l’écart de l’arène politique."
 SER_integrate_muslim_croats_focus:0 "Intégrer les Croates musulmans"
 SER_integrate_muslim_croats_focus_desc:0 "Les musulmans pratiquent une autre religion, mais ils font partie de la nation et doivent être pleinement acceptés comme Croates."
 SER_bosnian_muslim_conscription_focus:0 "Incorporer les musulmans de Bosnie"
 SER_bosnian_muslim_conscription_focus_desc:0 "Les musulmans vivant en Bosnie étant des Croates, ils doivent servir dans l’armée aux côtés de leurs frères ethniques."
 SER_integrate_orthodox_croats_focus:0 "Intégrer les Croates orthodoxes"
 SER_integrate_orthodox_croats_focus_desc:0 "Nous avons maltraité les Croates orthodoxes. Mais nous devons reconnaître que, même si les bons Croates appartiennent à la sainte Église catholique apostolique et romaine, les Croates convertis à la religion des Serbes restent des Croates et doivent être intégrés à la communauté nationale."
 SER_deny_citizenship_to_muslims_focus:0 "Refuser des droits aux musulmans"
 SER_deny_citizenship_to_muslims_focus_desc:0 "Le catholicisme est au cœur de l’identité croate et les musulmans qui prétendent être croates ne méritent pas d’être parmi nous."
 SER_integrate_religious_minorities_focus:0 "Intégrer les minorités religieuses"
 SER_integrate_religious_minorities_focus_desc:0 "Notre pays abrite des minorités religieuses ; leurs particularismes doivent être respectés."

 SER_a_king_for_our_people_focus:0 "Un roi pour notre peuple"
 SER_a_king_for_our_people_focus_desc:0 "Pour restaurer la grandeur du libre royaume de Croatie d’antan, nous devons choisir un roi qui guidera le peuple croate régénéré."
 SER_saviour_of_serbia:0 "Le porteur du salut"
 SER_saviour_of_serbia_desc:0 "Le porteur du salut."
 SER_secure_flanks:0 "Reconquérir la Macédoine et le Monténégro"
 SER_secure_flanks_desc:0 "Reconquérir la Macédoine et le Monténégro."
 SER_advance_north:0 "Reconquérir l’État de CSS"
 SER_advance_north_desc:0 "Reconquérir l’État de CSS."
 SER_join_axis:0 "S’allier à l’Allemagne"
 SER_join_axis_desc:0 "S’allier à l’Allemagne."

 SER_belgrade_investments_focus:0 "Investissements à Belgrade"
 SER_belgrade_investments_focus_desc:0 "Belgrade est notre capitale et un important centre industriel ; elle doit être au cœur de notre politique industrielle."
 SER_trading_infrastructures:0 "Infrastructures commerciales"
 SER_trading_infrastructures_desc:0 "La voie de la mer est la voie d’avenir. En développant les ports de la côte dalmate, nous augmenterons nos exportations."
 SER_industrial_support:0 "Soutien industriel"
 SER_industrial_support_desc:0 "Nous devons rallier les industriels et les convaincre de travailler pour le bien commun."
 SER_economic_optimization:0 "Optimisation économique"
 SER_economic_optimization_desc:0 "Certains segments de notre complexe militaro-industriel sont mal gérés ; réformons-les pour accroître leur productivité."
 SER_research_grants:0 "Subventions à la recherche"
 SER_research_grants_desc:0 "En finançant des entreprises d’ingénierie, nous pourrions accélérer le développement de nouveaux équipements pour nos forces."

 SER_yugoslav_scientific_cooperation:0 "Coopération scientifique yougoslave"

 SER_form_peasant_councils:0 "Former des conseils paysans"
 SER_form_peasant_councils_desc:0 "Les paysans ont été opprimés partout dans le pays pendant des années. En les encourageant à s’unir et à s’organiser sous notre direction idéologique, nous gagnerons de nombreux nouveaux soutiens."
 SER_recreate_yugoslavia:0 "Recréer la Yougoslavie"
 SER_economic_centralization:0 "Centralisation économique"
 SER_economic_centralization_desc:0 "Nous devons restructurer entièrement l’économie pour permettre au prolétariat de prendre le pouvoir."
 SER_nationalize_factories:0 "Nationaliser les usines"
 SER_nationalize_factories_desc:0 "L’industrialisation est l’avenir, et les capitalistes la freinent en exploitant le travail du prolétariat. Pour libérer tout le potentiel de ce dernier, nous devons écarter les capitalistes vicieux et oppressifs de leur influence économique."
 SER_local_steel_production:0 "Production d’acier locale"
 SER_local_steel_production_desc:0 "Soutenir notre industrie de guerre par une production d’acier locale est essentiel. Nous devons appliquer, par tous les moyens, cette décision du comité politique central du parti communiste."
 SER_local_militias:0 "Milices locales"
 SER_local_militias_desc:0 "Les militants des conseils paysans doivent être mobilisés et armés pour former l’épine dorsale d’une armée loyaliste sur le plan idéologique."

 SER_state_guard_tooltip:0 "§Y3§! divisions de la Garde d’État seront formées"
 SER_integrate_montenegro:0 "Intégrer le Monténégro"
