#events

egypt.1.t:0 "Mort de Fouad Ier"
egypt.1.d:0 "Fouad Ier, qui a servi comme sultan de notre nation pendant 5 ans, puis 14 années supplémentaires en tant que roi, est mort dans son sommeil au palais royal de Koubbeh. Il avait 68 ans.\n\nFouad Ier a conduit notre nation durant les dernières étapes de la Grande Guerre et a supervisé la révolution [EGY.GetAdjective] de 1919 ainsi que la déclaration d’indépendance face à [ENG.GetNameDef] en 1922. Il a ensuite renforcé la position internationale de [EGY.GetNameDef], réformant et façonnant le Royaume tel que nous le connaissons.\n\nAvec la mort de Fouad, son fils Farouk devient l’héritier immédiat du trône sous le nom de Farouk Ier. Cependant, n’étant pas encore majeur, il sera placé sous régence dirigée par Aziz Ezzat et plusieurs autres princes jusqu’à sa majorité dans un an."
egypt.1.a:0 "Un héros national perdu."

egypt.2.t:0 "Conférence Anglo-[EGY.GetAdjective] de [getYear]"
egypt.2.d:0 "À l’initiative du gouvernement [EGY.getAdjective], une conférence Anglo-[EGY.GetAdjective] a été convoquée en [getYear], où les délégations des deux pays se réuniront à [907.GetCapitalVictoryPointName] pour discuter du statut et de la contribution de [EGY.getNameDef] au sein du Commonwealth des Nations et du protectorat [ENG.getAdjective].\n\nLes thèmes de la conférence incluent la défense mutuelle terrestre et aérienne en cas d’invasion étrangère, les relations [EGY.GetAdjective]-[SUD.GetAdjective], ainsi que le problème du canal de Suez, dans l’espoir de conclure un traité définitif. Celui-ci décidera sans aucun doute de l’avenir des relations de [EGY.GetNameDef] avec [ENG.GetNameDef] et l’Empire."
egypt.2.a:0 "Très bien."

egypt.3.t:0 "L’Égypte exige le retrait militaire britannique"
egypt.3.d:0 "Travail en cours"
egypt.3.a:0 "Il est inutile de résister à l’inévitable."
egypt.3.b:0 "L’Égypte est trop importante, cela ne peut arriver."

egypt.4.t:0 "[EGY.GetNameDefCap] nous menace avec [ITA.GetNameDef]"
egypt.4.d:0 "[EGY.getNameDefCap] a récemment indiqué à notre délégation que, si les négociations sur l’indépendance [EGY.GetAdjective] n’avançaient pas de manière significative, ils établiraient des relations diplomatiques avec [ITA.GetNameDef] pour rechercher des alliances européennes ailleurs.\n\nCela pourrait être un simple bluff pour nous forcer à faire des concessions, mais l’idée de perdre les [EGY.GetAdjective]s de notre sphère d’influence aussi brutalement est peut-être trop risquée."
egypt.4.a:0 "Cette menace doit être prise au sérieux."
egypt.4.b:0 "Un simple bluff."

egypt.5.t:0 "[ENG.getNameDefCap] accepte nos exigences"
egypt.5.d:0 "La délégation [ENG.GetAdjective] a pris en considération notre menace et a proposé de nouvelles concessions en échange de notre loyauté.\n\nNe voulant clairement pas laisser une nation rivale exercer son influence sur nous contre la volonté de [ENG.GetNameDef], ils sont prêts à faire des efforts supplémentaires pour éviter cela."
egypt.5.a:0 "Ils ont fait le bon choix."

egypt.6.t:0 "[ENG.getNameDefCap] appelle notre bluff"
egypt.6.d:0 "La délégation [ENG.GetAdjective] a rejeté notre menace, la considérant comme une simple tactique de négociation, et n’a aucun intérêt à y céder. Ils estiment que nous n’avons pas plus d’intérêt à nous tourner vers [ITA.GetAdjective] qu’eux-mêmes.\n\nMême s’ils ont déjoué notre bluff cette fois-ci et causé notre embarras, il est possible que nous puissions exploiter leur inaction à notre avantage dans le futur."
egypt.6.a:0 "Cela aurait pu mieux se passer."

egypt.7.t:0 "Proposition d’indépendance [EGY.getAdjective]"
egypt.7.d:0 "Lors des discussions de la conférence avec [EGY.GetNameDef], les [EGY.GetAdjective]s ont directement demandé quelle était notre position sur leur indépendance totale, sans forte influence ni soutien [ENG.GetAdjective].\n\nBien que nous ayons des intérêts importants dans [EGY.GetNameDef], il est crucial d’affirmer clairement notre position sur leur expulsion complète de notre influence, et de déterminer dans quelle mesure nous devons les laisser vraiment « indépendants »."
egypt.7.a:0 "Nous ne sommes pas opposés à une pleine indépendance [EGY.GetAdjective]."
egypt.7.b:0 "L’Égypte est trop importante pour être lâchée."

egypt.8.t:0 "[ENG.getNameDefCap] n’est pas opposé à notre indépendance"
egypt.8.d:0 "La délégation de [ENG.GetNameDefCap] a répondu à notre demande sur l’indépendance totale en déclarant qu’ils étaient disposés à ne pas s’y opposer si leurs intérêts dans notre pays étaient protégés et si nous restions un hub stratégique si nécessaire.\n\nCe soutien a sans doute un prix, mais c’est une étape dans la bonne direction."
egypt.8.a:0 "Excellente nouvelle."

egypt.9.t:0 "[ENG.getNameDefCap] s’oppose à notre indépendance"
egypt.9.d:0 "La délégation de [ENG.getNameDefCap] a répondu à notre demande d’indépendance totale en affirmant clairement vouloir éviter cela, car ils le voient comme une menace pour leurs intérêts et leurs objectifs stratégiques dans la région.\n\nAvec une telle arrogance face au droit légitime d’indépendance de notre pays, il sera difficile de négocier efficacement avec les [ENG.GetAdjective]."
egypt.9.a:0 "Des imbéciles arrogants."

egypt.10.t:0 "[ENG.getNameDefCap] nous envoie des concessions industrielles"
egypt.10.d:0 "Des fonds provenant de la banque de [ENG.GetNameDef] ont été transférés à notre réserve nationale afin de soutenir notre développement et d’assurer notre avenir financier. Il s’agit probablement d’une tentative d’adoucir nos relations avec les [ENG.GetAdjective]."
egypt.10.a:0 "Conditions acceptables."

egypt.11.t:0 "[ENG.getNameDefCap] propose un traité de recherche navale mutuelle"
egypt.11.d:0 "[ENG.GetNameDefCap] nous a suggéré aujourd’hui que nos forces navales organisent des exercices conjoints et coopèrent temporairement au développement de nos technologies navales. Ils prétendent que cette coopération renforcera les intérêts en Méditerranée et en mer Rouge pour les deux parties."
egypt.11.a:0 "Cela bénéficiera aux deux camps."

egypt.12.t:0 "[EGY.getNameDefCap] demande une plus grande autonomie"
egypt.12.d:0 "Travail en cours"
egypt.12.a:0 "Ils sont loyaux et d’excellents alliés."
egypt.12.b:0 "Ils sont trop peu fiables."
egypt.13.t:0 "[ENG.getNameDefCap] nous accorde une plus grande autonomie"
egypt.13.d:0 "Travail en cours"
egypt.13.a:0 "L’Égypte et la Grande-Bretagne, unies pour toujours."

egypt.14.t:0 "[ENG.getNameDefCap] refuse de nous accorder une plus grande autonomie"
egypt.14.d:0 "Travail en cours"
egypt.14.a:0 "Une trahison imprévue."

egypt.15.t:0 "La conférence se termine en faveur de [EGY.getNameDef]"
egypt.15.d:0 "Alors que la conférence touche à sa fin, il est clair que [EGY.GetNameDef] a pris le dessus sur [ENG.GetNameDef]. Il est désormais évident que leur droit à l’autodétermination et l’expulsion totale de l’influence [ENG.GetAdjective] en faveur de l’indépendance complète des [EGY.GetAdjective] est une réalité, et qu’ils peuvent désormais engager ce processus s’ils le souhaitent.\n\nMalgré cela, l’avenir de [EGY.GetNameDef] reste incertain."
egypt.15.a:0 "La conférence est terminée."

egypt.16.t:0 "La conférence se termine en faveur de [ENG.getNameDef]"
egypt.16.d:0 "Alors que la conférence touche à sa fin, il est clair que [ENG.GetNameDef] a pris le dessus sur [EGY.GetNameDef]. Il est désormais évident que les [EGY.GetAdjective]s sont destinés à rester soumis aux [ENG.GetAdjective] et que leur idée d’indépendance n’était qu’une formalité visant à renforcer les relations internationales et apaiser le peuple. Les intérêts [ENG.GetAdjective] dans [EGY.GetNameDef] sont désormais renforcés d’une poigne de fer.\n\nCependant, ce développement pourrait accroître les troubles intérieurs en raison du sentiment anti-[ENG.GetAdjective]. Seul l’avenir dira ce qu’il en adviendra."
egypt.16.a:0 "La conférence est terminée."

egypt.17.t:0 "La conférence se termine sans conclusion"
egypt.17.d:0 "En raison de circonstances imprévues, la conférence n’a pas pu se poursuivre ou aucun avantage décisif n’a pu être établi. La suite reste incertaine, mais les deux camps pourraient tenter de tirer parti de cette situation."
egypt.17.a:0 "La conférence est terminée."

egypt.18.t:0 "[EGY.getName] demande notre soutien"
egypt.18.d:0 "Le mouvement des Frères musulmans [EGY.GetAdjective], actuellement organisé comme un mouvement de guérilla clandestin, a demandé notre soutien matériel, voire l’envoi de volontaires, en cas de rébellion contre la monarchie et l’influence [ENG.GetAdjective], qu’ils cherchent à expulser de leur pays pour établir un État arabe fort et indépendant.\n\nCela pourrait être l’occasion d’établir un pays allié au Moyen-Orient et de considérablement affaiblir la puissance de [ENG.GetNameDef] dans la région."
egypt.18.a:0 "Nous soutiendrons nos amis contre [ENG.GetNameDef]."
egypt.18.a2:0 "C’est une opportunité pour nous."
egypt.18.b:0 "Nous ne sommes pas intéressés."

egypt.19.t:0 "[GER.getName] promet son soutien"
egypt.19.d:0 "[GER.GetNameDefCap] a exprimé une forte sympathie pour notre cause et a saisi l’occasion de contrer [ENG.GetAdjective] en Afrique, offrant son aide en cas de rébellion, qu’il s’agisse de matériel, de main-d’œuvre, ou des deux."
egypt.19.a:0 "Excellent."
egypt.19_tt:0 "Nous recevrons §Y2000 équipements d’infanterie§! supplémentaires au déclenchement de la guerre civile."

egypt.20.t:0 "[GER.getName] ne nous offre pas son soutien"
egypt.20.d:0 "Bien que restant sympathiques à notre cause contre le réalisme et [ENG.GetNameDef], [GER.GetNameDef] ne nous enverra aucune aide pour soutenir notre combat. Peut-être une erreur diplomatique, mais il existe sans doute d’autres opportunités entre nous si nous prouvons notre valeur."
egypt.20.a:0 "Malheureusement."

egypt.21.t:0 "Révoltes armées au Soudan"
egypt.21.d:0 "Travail en cours"
egypt.21.a:0 "Le conflit s’intensifie."

egypt.22.t:0 "Rébellion au Soudan"
egypt.22.d:0 "Avec des tensions en hausse continue au [SUD.GetNonIdeologyName] depuis des mois, la population est de plus en plus insatisfaite de notre occupation. Nos politiques répressives et notre manque général de soutien n’ont fait qu’alimenter la colère et l’agitation parmi le peuple [SUD.GetAdjective].\n\nEn réaction, un groupe de leaders nationalistes [SUD.GetAdjective] s’est rassemblé pour lancer une rébellion armée contre notre occupation. Le mouvement a rapidement pris de l’ampleur, militaires et civils [SUD.GetAdjective] prenant les armes pour lutter pour leur liberté."
egypt.22.a:0 "La rébellion doit être écrasée !"
egypt.22.b:0 "Une cause noble."

egypt.23.t:0 "[EGY.getName] propose d’acheter le canal de Suez"
egypt.23.d:0 "Travail en cours"
egypt.23.a:0 "Une offre séduisante."
egypt.23.b:0 "Nous ne vendrions jamais quelque chose d’aussi important."

egypt.24.t:0 "[907.Owner.getName] accepte notre offre"
egypt.24.d:0 "Travail en cours"
egypt.24.a:0 "Le bon choix."

egypt.25.t:0 "[907.Owner.getName] refuse notre offre"
egypt.25.d:0 "Travail en cours"
egypt.25.a:0 "Ils refusent de rendre ce qui nous appartient de droit."

egypt.26.t:0 "Farouk Ier monte sur le trône"
egypt.26.d:0 "Avec la majorité atteinte par Farouk, sa cérémonie de couronnement a eu lieu au palais royal de [907.GetCapitalVictoryPointName]. Escorté par la police de [907.GetCapitalVictoryPointName] et la garde royale, il a été accueilli par plusieurs membres du gouvernement [EGY.GetAdjective] et de son cabinet. Après les cérémonies initiales de son arrivée, il fut couronné roi de [EGY.GetNameDef] sous le nom de Farouk Ier.\n\nFarouk devient ainsi le plus jeune monarque couronné de l’histoire de notre pays. Reste à savoir s’il saura conserver le prestige et l’héritage de son défunt père."
egypt.26.a:0 "Vive Farouk Ier !"

egypt.27.t:0 "Conférence Anglo-[EGY.GetAdjective] de [getYear]"
egypt.27.d:0 "À l’initiative du gouvernement [EGY.getAdjective], une conférence Anglo-[EGY.GetAdjective] a été convoquée en [getYear]. Les délégations des deux pays se réuniront à [907.GetCapitalVictoryPointName] pour discuter du statut et de la contribution de [EGY.getNameDef] au sein du Commonwealth et du protectorat [ENG.getAdjective].\n\nLes thèmes incluent la défense mutuelle en cas d’invasion étrangère, les relations [EGY.GetAdjective]-[SUD.GetAdjective], et la question épineuse du canal de Suez. Un traité définitif pourrait ainsi définir l’avenir des relations entre l’Égypte, la Grande-Bretagne et l’Empire."
egypt.27.a:0 "Très bien."

egypt.29.t:0 "[EGY.GetNameDefCap] évoque les anciens liens"
egypt.29.d:0 "Le gouvernement de [EGY.GetName] nous a approchés avec une proposition d’union personnelle entre nos deux nations. Ils invoquent notre histoire commune et nos liens culturels, ainsi que les bénéfices économiques et militaires potentiels d’une telle union.\n\nLes [EGY.GetAdjective]s soutiennent qu’une union apporterait une plus grande stabilité et prospérité aux deux nations. Mais devons-nous accepter ?"
egypt.29.a:0 "Une proposition avantageuse."
egypt.29.b:0 "Quelle absurdité !"

egypt.30.t:0 "[ALB.GetNameDefCap] accepte une union personnelle"
egypt.30.d:0 "Le gouvernement de [ALB.GetNameDef] a accepté notre proposition d’union personnelle entre nos deux nations. Nous sommes heureux d’annoncer que [ROOT.GetNonIdeologyName] et [ALB.GetNonIdeologyName] seront désormais unis sous un même dirigeant, apportant stabilité et prospérité accrues aux deux pays. C’est un pas de plus vers l’unification légitime de nos deux nations."
egypt.30.a:0 "Un bon choix."

egypt.31.t:0 "Le [ALB.GetName] refuse notre proposition"
egypt.31.d:0 "Le gouvernement de [ALB.GetNameDef] a rejeté notre proposition d’union personnelle entre nos deux nations. Il est clair que les [ALB.GetAdjective] préfèrent s’illusionner et ignorent le destin manifeste qui nous unit."
egypt.31.a:0 "Dans ce cas, nous devons reculer."
egypt.31.b:0 "Nous avons tenté la voie diplomatique."

egypt.32.t:0 "Le retour du Khédive"
egypt.32.d:0 "Abbas II, dernier Khédive de notre nation avant sa dissolution en 1914 par la force de [ENG.GetNameDef], est revenu maintenant que notre pays a obtenu son indépendance complète face aux [ENG.GetAdjective]. Il cherche à restaurer le trône illégitimement pris, considérant que [EGY.GetLeader] n’est qu’une marionnette [ENG.GetAdjective] et que le Khédive représentait la dernière véritable indépendance [EGY.GetAdjective].\n\nAbbas II a été chaleureusement accueilli par le peuple et une grande partie du gouvernement, voyant en lui le dirigeant fort dont [EGY.GetNameDef] a besoin après l’indépendance totale, au grand dam de Farouk."
egypt.32.a:0 "Une ère glorieuse s’ouvre pour [EGY.GetNameDef] !"

egypt.33.t:0 "Le [EGY.GetName] propose un pacte de non-agression"
egypt.33.d:0 "Aujourd’hui, le diplomate présent de [EGY.GetNameDef] nous a proposé de signer un pacte de non-agression afin de préserver la prospérité et l’unité du Moyen-Orient.\n\nSi nous acceptons, cela pourrait encourager une coopération accrue entre les peuples [TUR.GetAdjective] et [EGY.GetAdjective]. Si nous refusons, au contraire, cela pourrait creuser un fossé plus profond dans la région."
egypt.33.a:0 "Préservons la prospérité du Moyen-Orient."
egypt.33.b:0 "Nous ne sommes pas de la même lignée, [EGY.GetLeader]."

egypt.34.t:0 "Le [TUR.GetName] accepte notre proposition"
egypt.34.d:0 "[TUR.GetNameDef] a chaleureusement accepté notre proposition de pacte de non-agression, y voyant un grand pas vers la prospérité et l’unité du Moyen-Orient. Cela pourrait ouvrir la voie à une amitié durable et à une coopération future."
egypt.34.a:0 "Nous serons bientôt amis."

egypt.35.t:0 "Le [TUR.GetName] refuse notre proposition"
egypt.35.d:0 "[TUR.GetNameDef] a rejeté notre proposition de pacte de non-agression, préférant la balayer et nous renvoyer bredouilles. Cela montre probablement une volonté ferme de ne pas coopérer avec nous."
egypt.35.a:0 "[TUR.GetLeader] est loin d’être un réaliste."

egypt.36.t:0 "L’accord de Mansoura"
egypt.36.d:0 "Aujourd’hui, un accord a été conclu entre le parti Wafd et la monarchie dans la ville de Mansoura. Face à l’instabilité politique, les deux parties se sont entendues pour renforcer le Wafd comme parti dirigeant, tandis que [EGY.GetLeader] deviendrait un monarque constitutionnel, conservant des pouvoirs politiques limités.\n\nCet accord vise à prévenir toute instabilité future, à apaiser les anti-monarchistes tout en maintenant Farouk au pouvoir."
egypt.36.a:0 "Une nouvelle ère de stabilité politique."

egypt.37.t:0 "[SUD.GetNameDefCap] vote pour une intégration totale"
egypt.37.d:0 "Les résultats sont tombés et les [SUD.GetAdjective] ont voté de justesse pour une intégration complète au sein de [EGY.GetNameDef], estimant qu’ils sont mieux unis à nous que séparés. Il semble que nos réformes et nos efforts de développement aient porté leurs fruits."
egypt.37.a:0 "Désormais, nous vivons en égaux."

egypt.38.t:0 "[SUD.GetNameDefCap] vote pour une autonomie limitée"
egypt.38.d:0 "Les résultats sont tombés et les [SUD.GetAdjective] ont voté majoritairement pour un statut d’autonomie limitée au sein de [EGY.GetNameDef], préférant rester dans notre pays tout en conservant leurs propres autorités locales et lois distinctes. Nos réformes n’ont peut-être pas suffi à les convaincre d’une intégration totale, mais c’est tout de même un pas dans la bonne direction."
egypt.38.a:0 "Un compromis admirable."
egypt.39.t:0 "[SUD.GetNameDefCap] vote pour l’indépendance"
egypt.39.d:0 "Les résultats sont tombés et les [SUD.GetAdjective] ont voté massivement pour proclamer leur indépendance vis-à-vis de [EGY.GetNameDef] et former [SUD.GetNameDef] en tant que nation souveraine. Il est clair que nous n’avons pas fait assez pour convaincre les [SUD.GetAdjective] d’accepter l’intégration ou l’autonomie. Nous pouvons l’accepter et les laisser partir définitivement, ou contester cela et risquer de compromettre tout ce que nous avons accompli."
egypt.39.a:0 "Un résultat malheureux, mais nous devons l’accepter."
egypt.39.b:0 "La libération du Soudan est proche !"
egypt.39.c:0 "L’élection a été truquée, nous ne pouvons pas accepter cela."

egypt.40.t:0 "Les politiciens commencent à questionner l’agenda politique de [EGY.GetLeader]"
egypt.40.d:0 "Avec l’accession de [EGY.GetLeader] au trône, les politiciens et les membres du parlement ont presque immédiatement commencé à remettre en question l’agenda politique du nouveau roi. Alors que son père, Fouad Ier, avait à plusieurs reprises tenté d’accroître son pouvoir et de saper le parlement, il avait réussi à éviter une large opposition en restant une figure nationaliste et charismatique. Beaucoup doutent que [EGY.GetLeader] suive ses traces et craignent les conséquences de ses actions, compte tenu de son incompétence et de son absence générale."
egypt.40.a:0 "Ce ne sont que des rumeurs."

egypt.41.t:0 "Le parlement appelle à des réformes"
egypt.41.d:0 "Récemment, le parlement [EGY.GetAdjective] a vu croître régulièrement son opposition envers les institutions de la monarchie et [EGY.GetLeader], en raison de la corruption de longue date et des abus perpétrés par la monarchie au fil des ans. Un grand nombre de parlementaires appellent à des réformes en profondeur des institutions et des pouvoirs de la monarchie, tandis que d’autres, plus audacieux, suggèrent que [EGY.GetLeader] abdique complètement le trône, affirmant que la monarchie [EGY.GetAdjective] est un « symbole du passé » et qu’elle doit être remplacée par un système nouveau et moderne."
egypt.41.a:0 "Les fondations politiques ne peuvent pas durer éternellement."

egypt.42.t:0 "Le mécontentement militaire grandit"
egypt.42.d:0 "[EGY.GetLeader] est récemment devenu très impopulaire au sein de l’armée [EGY.GetAdjective], étant considéré comme un monarque faible et indécis. De plus, l’afflux massif de corruption, principalement dû à l’aristocratie, a nui au financement et au moral de l’armée. Des commandants influents tels que Mohamed Naguib et Gamal Abdel Nasser ont ouvertement appelé au renversement de la monarchie et à l’instauration d’un « dirigeant fort » pour gouverner notre nation."
egypt.42.a:0 "Les forces armées deviennent de plus en plus rebelles."

egypt.43.t:0 "[EGY.GetNameDefCap] cherche à s’emparer du canal de [911.GetName]"
egypt.43.d:0 "Aujourd’hui, le dirigeant [EGY.GetAdjective], [EGY.GetLeader], a déclaré que le canal de [911.GetName] fait légitimement partie de la nation et doit nous être rendu. Même par la force, si nécessaire.\n\nCela pourrait être une justification pour une guerre autour du canal, nous devons nous préparer au pire."
egypt.43.a:0 "Nous devons agir."

egypt.44.t:0 "Victoire [EGY.GetAdjective] à [911.GetName]"
egypt.44.d:0 "Les forces [EGY.GetAdjective] ont réussi à pénétrer dans le canal de [911.GetName], à sécuriser Port-Saïd et contrôlent désormais totalement le canal et ses opérations.\n\nBien que nous contrôlions enfin le canal de Suez, qui nous échappait depuis sa construction il y a plus de 75 ans, nous devons nous préparer à la réaction du gouvernement [911.Owner.getAdjective]."
egypt.44.a:0 "Nous n’avons fait que reprendre ce qui est à nous."

egypt.45.t:0 "Victoire [911.Owner.getAdjective] à [911.GetName]"
egypt.45.d:0 "La force de défense du canal de [911.GetName] a réussi à repousser l’avancée [EGY.GetAdjective] et à repousser l’attaque, forçant les [EGY.GetAdjective] à se retirer. Le canal reste fermement sous contrôle [911.Owner.getAdjective]."
egypt.45.a:0 "Un échec retentissant."
egypt.45.b:0 "Cela leur servira de leçon."

egypt.46.t:0 "Victoire [EGY.GetAdjective] à [911.GetName]"
egypt.46.d:0 "Les forces [EGY.GetAdjective] ont réussi à pénétrer dans le canal de [911.GetName], à sécuriser Port-Saïd et contrôlent désormais totalement le canal et ses opérations.\n\nC’est une menace claire pour nos intérêts dans la région, mais comment devons-nous réagir ?"
egypt.46.a:0 "Il est insensé de retarder l’inévitable."
egypt.46.b:0 "C’est inacceptable, nous devons reprendre le canal !"

egypt.47.t:0 "Impasse à [911.GetName]"
egypt.47.d:0 "Les combats dans le canal de [911.GetName] se sont enlisés, et aucun des deux camps n’a progressé, laissant la situation dans une impasse. Il est difficile de savoir comment le conflit évoluera, mais aucun changement significatif n’a eu lieu."
egypt.47.a:0 "Très bien."

egypt.48.t:0 "Coup d’État des Officiers libres"
egypt.48.d:0 "Tôt le matin, des policiers nationalistes ont commencé à protéger et encourager la résistance ainsi que les attaques contre les unités royales à [GetCapitalVictoryPointName]. Par la suite, les cellules du Mouvement des officiers libres ont déclenché des émeutes qui ont mené à des incendies criminels. Le mécontentement croissant dans l’armée a fini par exploser. Peu après, des bataillons ont pris d’assaut le bâtiment des officiers royaux et tous les autres commandants.\n\nMohamed Naguib et Gamal Abdel Nasser ont conjointement proclamé la déposition de Farouk et l’établissement de la République égyptienne, avec Nasser comme premier président. Farouk fut contraint d’abdiquer peu après et est depuis parti en exil.\n\nNasser promet d’expulser l’influence étrangère de [ROOT.GetNonIdeologyName], de restaurer la puissance du pays et de devenir une force unificatrice pour le monde arabe."
egypt.48.a:0 "Maintenant, nous allons leur montrer qui nous sommes vraiment."

egypt.49.t:0 "Adhésion à la coalition anti-[ISR.GetAdjective]"
egypt.49.d:0 "[EGY.GetNameDefCap] a formé une coalition offensive contre les politiques sionistes de [ISR.GetNameDef] et appelle tous les pays arabes à prendre les armes pour les détruire. Ils ont déjà lancé des opérations contre le pays, devons-nous rejoindre ce combat pour débarrasser le Moyen-Orient de [ISR.GetNameDef] ?"
egypt.49.a:0 "Nous aiderons nos frères arabes."
egypt.49.b:0 "Nous ne sommes pas intéressés."

egypt.50.t:0 "[EGY.GetNameDefCap] exige le contrôle de [SYR.GetNonIdeologyName] et [LEB.GetNonIdeologyName]"
egypt.50.d:0 "[EGY.GetNameDefCap] nous a envoyé un ultimatum : accorder l’indépendance immédiate à [SYR.GetNameDef] et [LEB.GetNameDef] et retirer tous nos actifs du pays, qui passerait exclusivement sous supervision [EGY.GetAdjective], ou risquer la guerre.\n\nCela correspond à la volonté de [EGY.GetLeader] d’étendre son influence sur le monde arabe et de l’unifier, mais voulons-nous vraiment risquer la guerre pour ces territoires ?"
egypt.50.a:0 "Nous ne sommes pas en position de défendre cela."
egypt.50.b:0 "C’est insensé de croire que nous abandonnerions quelque chose d’aussi important."

egypt.51.t:0 "[FROM.GetNameDefCap] satisfait nos exigences"
egypt.51.d:0 ""
egypt.51.a:0 "Le monde arabe se renforce."

egypt.52.t:0 "Nos exigences ont été rejetées"
egypt.52.d:0 "L’impérialiste qui domine [FROM.GetNameDef] et maintient [SYR.GetNameDef] et [LEB.GetNameDef] sous son joug a refusé notre demande de céder ces territoires, dans notre juste combat pour expulser les impérialistes de la région. Nous pouvons nous soumettre à leur domination ou aller plus loin et combattre pour notre vision d’un État arabe uni."
egypt.52.d2:0 "L’impérialiste qui domine [FROM.GetNameDef] et maintient [LBA.GetNameDef] sous son joug a refusé notre demande de céder ces territoires, dans notre juste combat pour expulser les impérialistes de la région. Nous pouvons nous soumettre à leur domination ou aller plus loin et combattre pour notre vision d’un État arabe uni."
egypt.52.d3:0 "L’impérialiste qui domine [FROM.GetNameDef] et maintient [ALG.GetNameDef] sous son joug a refusé notre demande de céder ces territoires, dans notre juste combat pour expulser les impérialistes de la région. Nous pouvons nous soumettre à leur domination ou aller plus loin et combattre pour notre vision d’un État arabe uni."
egypt.52.a:0 "Ils ont fait leur choix."
egypt.52.b:0 "Si ce n’est pas par la paix, ce sera par la guerre que nous serons unis !"

egypt.53.t:0 "[EGY.GetNameDefCap] exige le contrôle de [LBA.GetNonIdeologyName]"
egypt.53.d:0 "[EGY.GetNameDefCap] nous a envoyé un ultimatum : accorder l’indépendance immédiate à [LBA.GetNameDef] et retirer tous nos actifs du pays, qui passerait exclusivement sous supervision [EGY.GetAdjective], ou risquer la guerre.\n\nCela correspond à la volonté de [EGY.GetLeader] d’étendre son influence sur le monde arabe et de l’unifier, mais voulons-nous vraiment risquer la guerre pour ces territoires ?"
egypt.53.a:0 "Nous ne sommes pas en position de défendre cela."
egypt.53.b:0 "C’est insensé de croire que nous abandonnerions quelque chose d’aussi important."
egypt.54.t:0 "[EGY.GetNameDefCap] exige le contrôle de [ALG.GetNonIdeologyName]"
egypt.54.d:0 "[EGY.GetNameDefCap] nous a envoyé un ultimatum : accorder l’indépendance immédiate à [ALG.GetNameDef] et retirer tous nos actifs du pays, qui passerait exclusivement sous supervision [EGY.GetAdjective], ou risquer la guerre.\n\nCela correspond à la volonté de [EGY.GetLeader] d’étendre son influence sur le monde arabe et de l’unifier, mais voulons-nous vraiment risquer la guerre pour ces territoires ?"
egypt.54.a:0 "Nous ne sommes pas en position de défendre cela."
egypt.54.b:0 "C’est insensé de croire que nous abandonnerions quelque chose d’aussi important."

egypt.55.t:0 "[EGY.GetNameDefCap] propose l’unification dans un État arabe uni"
egypt.55.d:0 "Aujourd’hui, [EGY.GetNameDefCap] nous a envoyé une proposition officielle d’unification dans un seul État arabe sous leur direction, affirmant que le monde arabe a été trop longtemps écrasé par les impérialistes et divisé par les rivalités, et que le moment est venu de s’unir enfin pour établir un État arabe puissant et légitime, auquel les [ROOT.GetAdjective]s peuvent contribuer.\n\nBien que cette proposition semble noble et séduisante, il est à craindre qu’elle ne soit en réalité qu’un moyen pour accroître l’influence et la puissance [EGY.GetAdjective] à leur seul bénéfice."
egypt.55.a:0 "Ensemble nous sommes plus forts."
egypt.55.b:0 "Nous ne deviendrons pas un État policier de plus."

egypt.56.t:0 "[EGY.GetNameDefCap] demande une aide matérielle"
egypt.56.d:0 "Les diplomates de [EGY.GetNameDef] nous ont approchés afin de solliciter une aide matérielle américaine pour soutenir le développement et la modernisation de leur armée.\n\nBien que nous ayons officiellement établi des relations avec eux en 1922, lors de notre indépendance, ce serait la première fois que nos nations concluraient une relation ou un accord diplomatique majeur, et cela pourrait être une excellente opportunité d’établir un pays ami au Moyen-Orient et de servir nos intérêts dans la région."
egypt.56.a:0 "C’est une grande chance d’améliorer nos relations."
egypt.56.b:0 "Nous n’avons aucun intérêt pour [EGY.GetNameDef]."

egypt.57.t:0 "[USA.GetNameDefCap] accepte de nous envoyer une aide matérielle"
egypt.57.d:0 "Notre délégation auprès de [USA.GetNameDef] est parvenue à un accord avec leurs représentants pour nous envoyer un lot d’aide matérielle comprenant de l’équipement d’infanterie et de l’artillerie, afin de soutenir le développement et la modernisation de notre armée. Nous devrions recevoir cet équipement prochainement."
egypt.57.a:0 "Le début d’une amitié."

egypt.58.t:0 "[USA.GetNameDefCap] refuse notre demande d’aide matérielle"
egypt.58.d:0 "Notre délégation auprès de [USA.GetNameDef] n’a pas réussi à trouver un accord avec leurs diplomates, qui ont rejeté notre demande d’aide matérielle pour le développement et la modernisation de notre armée. Nous ne recevrons rien."
egypt.58.a:0 "C’est leur perte."

egypt.59.t:0 "Les factions politiques sapent le pouvoir de [EGY.GetLeader]"
egypt.59.d:0 "Le peuple [EGY.GetAdjective] comme son gouvernement doutent fortement de la capacité de [EGY.GetLeader] à gouverner, après de multiples échecs dans l’administration et la gestion. Plus que jamais, de nombreux politiciens et officiers de l’armée appellent à réduire son pouvoir, voire à le renverser complètement.\n\nLe parti Wafd, longtemps influent sous la monarchie, soutient l’idée de réduire le pouvoir de Farouk à celui d’une monarchie constitutionnelle et de devenir le parti dominant de [EGY.GetNameDef]. En parallèle, des figures militaires comme Gamal Abdel Nasser et Mohammed Naguib appellent à son renversement et à la création d’une république arabe pour tourner la page de l’impérialisme étranger.\n\nSi une solution n’est pas trouvée rapidement, la situation pourrait échapper à tout contrôle."
egypt.59.a:0 "La position de Farouk est en lambeaux."

egypt.60.t:0 "[EGY.GetNameDefCap] nous envoie une mission diplomatique"
egypt.60.d:0 "Aujourd’hui, [EGY.GetNameDef] nous a envoyé une mission diplomatique composée de ses ambassadeurs, dans l’espoir d’élargir nos relations et d’établir une amitié ainsi qu’une possible coopération future.\n\nCe serait la première relation diplomatique majeure que nous entretenons avec [EGY.GetNameDef] depuis leur indépendance en 1922, et cela pourrait être une excellente opportunité d’établir un pays ami au Moyen-Orient et de servir nos intérêts dans la région."
egypt.60.a:0 "Envoyons aux [EGY.GetAdjective] quelques chars en signe d’amitié."
egypt.60.b:0 "Ils ne nous intéressent pas."

egypt.61.t:0 "[SOV.GetNameDefCap] répond positivement à notre mission diplomatique"
egypt.61.d:0 "Notre mission diplomatique auprès de [SOV.GetNameDef] a été accueillie avec bienveillance et approbation. Ils semblent aussi enthousiastes que nous à l’idée d’établir des relations amicales et une coopération future.\n\nDe plus, ils ont offert de nous envoyer 100 de leurs meilleurs chars moyens comme généreux gage d’amitié, qui devraient arriver prochainement."
egypt.61.a:0 "Un cadeau généreux de nos nouveaux amis."

egypt.62.t:0 "[SOV.GetNameDefCap] rejette notre mission diplomatique"
egypt.62.d:0 "[SOV.GetNameDefCap], manifestement peu intéressé par notre délégation, a rejeté notre mission diplomatique et ne semble pas vouloir établir de relations ni chercher une coopération future.\n\nCeci pourrait bien avoir fait échouer l’unique occasion d’établir de telles relations."
egypt.62.a:0 "C’était une entreprise insensée."

egypt.63.t:0 "[EGY.GetNameDefCap] nous envoie une aide matérielle"
egypt.63.d:0 "Aujourd’hui, [EGY.GetNameDefCap] a annoncé son intention de protéger notre indépendance et de nous offrir un soutien inconditionnel afin de « dissuader » toute menace étrangère potentielle. Ils ont également déclaré qu’ils enverraient un grand lot d’équipements en tant que « package de modernisation » pour soutenir le développement de notre armée.\n\nBien que ce soit un geste généreux et bienvenu, il est probable que ce soit davantage pour protéger les intérêts [EGY.GetAdjective] que les nôtres."
egypt.63.a:0 "Quelle générosité de la part des [EGY.GetAdjective]."

egypt.64.t:0 "[EGY.GetNameDefCap] demande des conseillers"
egypt.64.d:0 "[EGY.GetNameDefCap] nous a officiellement demandé aujourd’hui de détacher certains de nos officiers en tant qu’attachés militaires auprès de leur armée afin de les conseiller dans leurs efforts de modernisation, d’entraînement et de tactique. Cela pourrait être une opportunité d’établir des relations amicales avec [EGY.GetNameDef] et de les intégrer à notre sphère d’influence."
egypt.64.a:0 "C’est une opportunité pour nous."
egypt.64.b:0 "Nous ne sommes pas intéressés par les [EGY.GetAdjective]."

egypt.65.t:0 "[GER.GetNameDefCap] accepte de nous envoyer des conseillers"
egypt.65.d:0 "[GER.GetNameDefCap] a accepté de nous envoyer une mission militaire afin de conseiller notre armée et de soutenir sa modernisation et son entraînement. Les [GER.GetAdjective] ont désigné l’officier d’infanterie Wilhelm Fahrmbacher comme chef de cette mission, et il arrivera bientôt pour être disponible à notre service."
egypt.65.a:0 "Magnifique."

egypt.66.t:0 "[GER.GetNameDefCap] refuse de nous envoyer des conseillers"
egypt.66.d:0 "[GER.GetNameDefCap] a refusé de nous envoyer une mission militaire pour conseiller notre armée et soutenir sa modernisation et son entraînement. Il est peu probable d’attendre une coopération future de la part de [GER.GetNameDef]."
egypt.66.a:0 "Nous ne sommes que des pions pour les [GER.GetAdjective]."

