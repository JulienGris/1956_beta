#airforce tree

EGY_reestablish_control_of_the_EAAF:0 "Rétablir le contrôle de l’EEAF"
EGY_reestablish_control_of_the_EAAF_desc:0 ""
EGY_abu_suweir_air_base:0 "Base aérienne d’Abu Suweir"
EGY_abu_suweir_air_base_desc:0 "Pour soutenir l’expansion de notre force aérienne, nous allouerons des fonds à la construction de nouvelles bases aériennes. La zone stratégique d’Ismaïlia est l’endroit idéal pour ces installations."
EGY_victor_taits_legacy:0 "L’héritage de Victor Tait"
EGY_victor_taits_legacy_desc:0 ""
EGY_royal_egyptian_airforce:0 "La force aérienne [EGY.GetAdjective]"
EGY_royal_egyptian_airforce_desc:0 "[ROOT.GetNonIdeologyName] a historiquement disposé d’une force aérienne minuscule, subordonnée à l’armée et à la marine. Il est temps de la constituer en arme indépendante afin qu’elle devienne une force de frappe efficace et importante."
EGY_purchase_audax_fighters:0 "Acheter des chasseurs Audax"
EGY_purchase_audax_fighters_desc:0 ""
EGY_bomber_production:0 "Production de bombardiers"
EGY_bomber_production_desc:0 "La position isolée de notre pays suggère qu’il ne sera pas une cible majeure des bombardements ennemis. Une petite force de chasse suffira donc pour nos cieux. Nos principaux investissements doivent être consacrés au développement de bombardiers capables de frapper l’industrie ennemie de loin."
EGY_al_zafir_kahi_missles:0 "Missiles Al Zafir-Kahi"
EGY_al_zafir_kahi_missles_desc:0 "Une alternative intéressante aux raids aériens a émergé dans l’un de nos centres de recherche : une bombe guidée capable d’être lancée depuis une plateforme et dirigée vers sa cible sans équipage embarqué, préservant ainsi la vie de nos pilotes et équipages."
EGY_solve_the_canal_issue:0 "Régler la question du canal"
EGY_solve_the_canal_issue_desc:0 ""
EGY_militarize_the_canal_zone:0 "Militariser la zone du canal"
EGY_militarize_the_canal_zone_desc:0 ""


#navy tree

EGY_expand_the_navy:0 "Développer la marine"
EGY_expand_the_navy_desc:0 "Comparée à l’armée, la flotte a été relativement bien entretenue au fil des ans. Elle reste imparfaite, et des améliorations sont nécessaires pour garder nos capacités navales compétitives."
EGY_hunt_class_destroyers:0 "Destroyers classe Hunt"
EGY_hunt_class_destroyers_desc:0 ""
EGY_replace_miniscule_vessels:0 "Remplacer les petits bâtiments"
EGY_replace_miniscule_vessels_desc:0 "Les innovations navales apparaissent constamment lors de conférences et manœuvres conjointes. Nous pouvons apprendre autant de nos alliés et ennemis que de notre propre expérience."
EGY_expand_alexandria_shipping:0 "Étendre la flotte d’Alexandrie"
EGY_expand_alexandria_shipping_desc:0 ""
EGY_develop_port_sudan:0 "Développer Port-Soudan"
EGY_develop_port_sudan_desc:0 ""
EGY_the_suez_alternative:0 "L’alternative au canal de Suez"
EGY_the_suez_alternative_desc:0 ""
EGY_big_farouq:0 "Le Grand Farouq"
EGY_big_farouq_desc:0 "La Grande Guerre a montré que les gros canons décident de la bataille. Nos capacités navales permettent d’investir dans le développement de nouveaux modèles de navires lourds."
EGY_carrier_development:0 "Développement des porte-avions"
EGY_carrier_development_desc:0 "Les porte-avions, véritables bases aériennes flottantes, sont l’avenir de la guerre navale. Leur mise au point exige de lourds financements, mais c’est la seule voie vers une marine moderne."
EGY_naval_attrition:0 "Attrition navale"
EGY_naval_attrition_desc:0 "Le canal de Suez est l’une des routes commerciales les plus empruntées au monde. L’utilisation de sous-marins pour y perturber le trafic ennemi aurait des effets dévastateurs. Aucun pays n’oserait prendre ce risque."
EGY_radar_defence_technologies:0 "Technologies radar défensives"
EGY_radar_defence_technologies_desc:0 "Grâce à un système complexe de navigation radio, nous pouvons améliorer la capacité de nos avions et navires à repérer et frapper l’ennemi, même de nuit."
EGY_el_saka_forces:0 "Forces El-Sa‘ka"
EGY_el_saka_forces_desc:0 "Nous devons former une infanterie de marine capable de mener des débarquements audacieux si nous voulons projeter nos forces au-delà des mers."
EGY_amphibious_exercises:0 "Exercices amphibies"
EGY_amphibious_exercises_desc:0 "Une flotte de transport efficace est aussi indispensable qu’une unité de marines entraînée. L’une sans l’autre est inutile."
EGY_navy_of_the_two_banks:0 "La marine des Deux Rives"
EGY_navy_of_the_two_banks_desc:0 ""
EGY_supremacy_over_the_mediterranean:0 "Suprématie sur la Méditerranée"
EGY_supremacy_over_the_mediterranean_desc:0 "La marine [EGY.GetAdjective] s’est affirmée comme une force puissante, mais pour obtenir le prestige international recherché, il nous faut étendre notre influence et sécuriser la Méditerranée comme des eaux [EGY.GetAdjective]."


#suez crisis tree

EGY_a_humiliation:0 "Une humiliation écrasante"
EGY_a_humiliation_desc:0 "Nous avons été humiliés. Le Sinaï et la rive est du canal de Suez sont sous contrôle israélien. Allons-nous négocier ? Ou les reprendre par la force ?"
EGY_three_nos:0 "Les Trois Non"
EGY_three_nos_desc:0 "Pas de paix.\nPas de négociations.\nPas de reconnaissance."


#ideas

EGY_egyptian_non_alligment:0 "Non-alignement [EGY.GetAdjective]"
EGY_egyptian_non_alligment_desc:0 "Depuis la fin officielle du protectorat [ENG.GetAdjective] en 1922, [EGY.GetNameDef] s’est fixé une stricte politique de neutralité. Mais la situation particulière de l’Égypte rend ce choix difficile à maintenir."
EGY_egyptian_staunch_nationalism:0 "Nationalisme [EGY.GetAdjective] intransigeant"
EGY_egyptian_staunch_nationalism_desc:0 ""
EGY_promote_agricultural_development_idea:0 "Développement agricole"
EGY_promote_agricultural_development_idea_desc:0 ""
EGY_british_industrial_concessions_to_egypt:0 "Concessions industrielles à [ROOT.GetNonIdeologyName]"
EGY_british_industrial_concessions_to_egypt_desc:0 ""
EGY_british_sending_industrial_concessions:0 "Concessions industrielles britanniques"
EGY_british_sending_industrial_concessions_desc:0 ""
EGY_dissatisfied_military:0 "Armée mécontente"
EGY_dissatisfied_military_desc:0 ""
EGY_integrate_the_green_shirts_bonus:0 "Les Chemises vertes"
EGY_integrate_the_green_shirts_bonus_desc:0 ""
EGY_islamic_fiscal:0 "Fiscalité islamique"
EGY_islamic_fiscal_desc:0 ""
EGY_modify_islamic_fiscal_intro:0 "Modifier la §YFiscalité islamique§! en"
EGY_agrarian_society:0 "Société agraire"
EGY_the_iron_guard:0 "La Garde de fer [EGY.GetAdjective]"
EGY_the_iron_guard_desc:0 ""
EGY_defensive_preparations:0 "Préparatifs défensifs"
EGY_defensive_preparations_desc:0 ""
EGY_farouk_i_idea:0 "Farouk Ier"
EGY_farouk_i_idea_desc:0 "Farouk Ier est le roi actuel de [ROOT.GetNonIdeologyName] et de [SUD.GetNonIdeologyName]. Bien que la monarchie soit désormais constitutionnelle, il conserve une grande influence politique et demeure un puissant facteur d’unité nationale."
