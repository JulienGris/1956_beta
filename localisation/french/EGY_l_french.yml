EGY_logistical_brigades_tt:0 "$EGY_modify_the_egyptian_army_intro$ \nOrganisation des divisions : §G+10.0%§!\n\n"
EGY_desert_camouflage_tt:0 "$EGY_modify_the_egyptian_army_intro$ \nRéduction des dégâts infligés par l’appui aérien rapproché : §G+10.0%§!\n\n"
