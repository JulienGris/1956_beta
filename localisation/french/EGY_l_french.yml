EGY_offer_assistance_against_sudanese_rebels:0 "Offrir une assistance contre les rebelles [SUD.GetAdjective]"
EGY_offer_assistance_against_sudanese_rebels_desc:0 "La question du Soudan est complexe, étant techniquement sous occupation conjointe de l’Anglo-[EGY.GetAdjective] Soudan depuis 1899. La question de son avenir en cas d’indépendance [EGY.GetAdjective] demeure. Si nous offrons des concessions aux [EGY.GetAdjective]s, cela allègera le poids des négociations."
EGY_return_sudanese_resources:0 "Rendre les ressources de [884.GetName]"

EGY_organise_nationalist_factions:0 "Organiser les factions nationalistes"
EGY_organise_nationalist_factions_desc:0 "La monarchie nous a trahis. Si nous voulons mettre fin à l’humiliation de l’Égypte aux mains des puissances impérialistes, nous n’avons d’autre choix que de prendre les choses en main et d’expulser les colonisateurs de notre terre une fois pour toutes."
