#industrie

EGY_development_in_sudan:0 "Développement au Soudan"
EGY_development_in_sudan_desc:0 "[SUD.GetNonIdeologyName] a le potentiel de devenir un partenaire économique précieux. Ce focus impliquera d’augmenter les investissements dans leur secteur industriel, de fournir une aide pour moderniser leurs usines et industries, et d’encourager la coopération et les coentreprises entre les entreprises [SUD.GetAdjective] et [EGY.GetAdjective]. Cela contribuera à renforcer les liens économiques entre les deux nations."
EGY_construct_khartoum_juba_link:0 "Liaison [551.GetName]-[884.GetName]"
EGY_construct_khartoum_juba_link_desc:0 "La construction d’une voie ferrée entre Khartoum et Juba ouvrira de nouvelles opportunités économiques au sein de [SUD.GetNonIdeologyName]. Le chemin de fer permettra un transport plus rapide et plus efficace des marchandises et des personnes entre les deux nations, ainsi que la stimulation du commerce et de la coopération."
EGY_expand_jonglei_aluminum:0 "Développer l’aluminium de [884.GetName]"
EGY_expand_jonglei_aluminum_desc:0 "La région du Nil Supérieur détient de vastes ressources en aluminium. Nous allons accroître les investissements dans l’extraction, le raffinage et la production d’aluminium, ainsi que fournir une aide pour moderniser l’industrie. En développant l’industrie de l’aluminium du Nil Supérieur, nous sécuriserons l’accès à une ressource vitale pour nos besoins industriels et pour l’exportation."
EGY_ministry_of_resources:0 "Ministère des Ressources"
EGY_ministry_of_resources_desc:0 "Afin de sécuriser les besoins en ressources de notre nation et de maximiser leur potentiel, nous devons étendre les capacités du Ministère des Ressources. Cela impliquera une augmentation du financement et du personnel, ainsi qu’une formation et des équipements modernes."
EGY_misr_for_trade_and_oil:0 "Misr pour le Commerce et le Pétrole"
EGY_misr_for_trade_and_oil_desc:0 "La création de Misr pour le Commerce et le Pétrole, une entreprise publique, aidera à sécuriser et à développer l’accès de notre nation aux ressources vitales telles que le pétrole et d’autres matériaux stratégiques."
EGY_banha_industrial_sectors:0 "Secteurs industriels de Banha"
EGY_banha_industrial_sectors_desc:0 "La ville de Banha a le potentiel de devenir un pôle industriel majeur de notre nation. Nous investirons dans les infrastructures, fournirons une formation et une aide à l’industrie locale, et encouragerons les entreprises à s’implanter dans la région. En développant les secteurs industriels à Banha, nous créerons des emplois, stimulerons la croissance économique et diversifierons notre base industrielle."
EGY_promote_agricultural_development:0 "Promouvoir le développement agricole"
EGY_promote_agricultural_development_desc:0 ""
EGY_banque_misr:0 "Financer la Banque Misr"
EGY_banque_misr_desc:0 "La Banque Misr est une institution cruciale pour la stabilité et la croissance économique de notre nation. Nous devons lui fournir le financement nécessaire pour qu’elle élargisse ses activités et améliore ses services."
EGY_the_aswan_dam:0 "Le barrage d’Assouan"
EGY_the_aswan_dam_desc:0 "La construction du barrage d’Assouan apportera de nombreux avantages à notre nation, notamment une augmentation de la production hydroélectrique, une amélioration de l’irrigation pour l’agriculture et un meilleur contrôle du Nil. Les nouvelles opportunités dans la région permettront une croissance industrielle considérable."
EGY_develop_the_east:0 "Développer l’Est"
EGY_develop_the_east_desc:0 "Le [457.GetName] a longtemps été la région la moins développée de notre pays. Il est temps de développer l’industrie de cette zone afin de l’élever au niveau du reste du pays."
EGY_national_defence_funds:0 "Fonds de défense nationale"
EGY_national_defence_funds_desc:0 "La sécurité de [ROOT.GetNameDef] est notre priorité absolue. Un financement est donc nécessaire pour l’assurer."
EGY_rural_education_plan:0 "Plan d’éducation rurale"
EGY_rural_education_plan_desc:0 "Une grande partie de notre pays est sous-développée et, dans de nombreuses régions rurales, les habitants manquent d’un système éducatif de base. Avec nos nouveaux progrès industriels, il est temps de se concentrer sur le peuple et de lui offrir une éducation."
#armée

EGY_expand_the_defence_department:0 "Étendre le département de la Défense"
EGY_expand_the_defence_department_desc:0 "Une défense solide est la base de la sécurité de toute nation. Pour garantir la sécurité de notre peuple, nous devons élargir et moderniser notre département de la Défense. Nous devons être mieux équipés pour relever les défis d’un monde en constante évolution et protéger notre nation contre toute menace potentielle."
EGY_reinforce_the_north:0 "Renforcer le Nord"
EGY_reinforce_the_north_desc:0 "En tant que nation dotée d’une longue côte, nous sommes vulnérables à une attaque par la mer. Nous devons fortifier notre côte nord par une série de structures défensives afin de dissuader toute invasion navale potentielle."
EGY_fortify_sudan:0 "Fortifier le [SUD.GetNonIdeologyName]"
EGY_fortify_sudan_desc:0 "Nous sommes vulnérables aux infiltrations et aux attaques venant du sud. Nous devons fortifier notre frontière méridionale au sein du [SUD.GetNonIdeologyName] avec une série de structures défensives pour nous protéger des menaces externes comme internes."
EGY_the_eastern_frontier:0 "La frontière orientale"
EGY_the_eastern_frontier_desc:0 "Le Sinaï est une région stratégiquement importante pour nous. Nous devons la fortifier avec une série de structures défensives."
EGY_defence_of_cairo:0 "Défense de [907.GetCapitalVictoryPointName]"
EGY_defence_of_cairo_desc:0 "En tant que capitale, [907.GetCapitalVictoryPointName] revêt une importance immense. Elle est non seulement le centre de notre gouvernement, mais aussi un pôle culturel, industriel et commercial. Pour protéger la ville, nous devons fortifier et défendre [907.GetCapitalVictoryPointName] contre toute menace potentielle. Cela inclura la construction de défenses aériennes, d’abris souterrains et de champs d’obstacles pour freiner l’avance ennemie."
EGY_organize_the_egyptian_resistance:0 "Organiser la résistance [EGY.GetAdjective]"
EGY_organize_the_egyptian_resistance_desc:0 "En cas d’invasion, nous ne devons pas perdre espoir. Nous devons rallier notre peuple et former un mouvement de résistance contre les forces d’occupation. Cela inclura l’entraînement et l’armement des civils, l’organisation d’opérations de sabotage et la diffusion de propagande pour saper le contrôle ennemi. Cela nous préparera aussi au jour où nous pourrons reprendre notre souveraineté."
EGY_evacuate_industrial_reserves:0 "Évacuer les réserves industrielles"
EGY_evacuate_industrial_reserves_desc:0 "Face à une invasion ou une occupation, il est crucial de protéger nos réserves industrielles. Cela inclura la relocalisation d’usines essentielles, d’équipements et de personnel vers des lieux sûrs, à l’intérieur comme à l’extérieur de nos frontières. Ainsi, elles ne tomberont pas entre les mains de l’ennemi et continueront à produire du matériel vital pour notre armée."
EGY_the_army_in_exile:0 "L’armée en exil"
EGY_the_army_in_exile_desc:0 "Si notre nation venait à être occupée, nous ne devons pas perdre de vue notre objectif ultime : recouvrer notre souveraineté. Pour cela, nous devons former une armée en exil composée de soldats loyaux et déterminés, recrutés parmi les expatriés et réfugiés, équipée par des nations alliées et structurée par un commandement efficace."
EGY_exile_naval_forces:0 "Forces navales en exil"
EGY_exile_naval_forces_desc:0 "En cas d’occupation, nos capacités navales ne doivent pas être abandonnées. Nous devons constituer une marine en exil composée de marins loyaux et déterminés, soutenue par des alliés et organisée dans une chaîne de commandement fiable."
EGY_exiles_in_the_air:0 "Exilés dans les airs"
EGY_exiles_in_the_air_desc:0 "Nos capacités aériennes doivent également être préservées. Nous devons former une force aérienne en exil composée de pilotes loyaux et déterminés, entraînés parmi les expatriés et soutenus par nos alliés."
EGY_egyptian_military_academy:0 "Académie militaire [EGY.GetAdjective]"
EGY_egyptian_military_academy_desc:0 "Notre pays a longtemps négligé l’éducation et la formation militaires, mais avec la menace de guerre, le besoin d’une armée moderne et bien formée devient évident."
EGY_increase_british_arms_shipments:0 "Accroître les livraisons d’armes [EGY.GetAdjective]"
EGY_increase_british_arms_shipments_desc:0 ""
EGY_continue_army_segregation:0 "Maintenir la ségrégation dans l’armée"
EGY_continue_army_segregation_desc:0 "Il est important de préserver l’intégrité et la loyauté de l’armée [EGY.GetAdjective]. Cela garantira que nos soldats restent fidèles à la nation et ne soient pas influencés par des idées indésirables."
EGY_sudanese_volunteers:0 "Volontaires [SUD.GetAdjective]"
EGY_sudanese_volunteers_desc:0 "Nous devons reconnaître que pour disposer d’une armée forte et efficace, il faut embrasser la diversité et l’inclusivité. En intégrant des soldats [EGY.GetAdjective] et [SUD.GetAdjective], nous favoriserons la compréhension mutuelle, le respect et la cohésion."
EGY_modernize_our_weaponry:0 "Moderniser notre armement"
EGY_modernize_our_weaponry_desc:0 "Beaucoup de nos armes sont obsolètes face à celles de nos adversaires. La standardisation et la modernisation ne sont pas si difficiles si l’on sait à qui s’adresser et quels changements apporter."
EGY_field_piece_research:0 "Recherche en artillerie de campagne"
EGY_field_piece_research_desc:0 "« L’artillerie est nécessaire pour former l’épine dorsale de notre armée, c’est pourquoi des ressources considérables doivent être allouées pour obtenir davantage de puissance de feu. »"
EGY_logistical_brigades:0 "Brigades logistiques"
EGY_logistical_brigades_desc:0 "La dépendance aux réserves locales est une menace pour nos forces armées. Garantir qu’elles reçoivent les équipements et fournitures nécessaires améliorera leur moral, leur organisation et leurs capacités de combat."
EGY_desert_camouflage:0 "Camouflage désertique"
EGY_desert_camouflage_desc:0 "La majeure partie de notre territoire étant désertique, il est impératif que notre armée soit équipée du camouflage adapté à ces conditions. Cela compliquera la tâche de l’ennemi pour repérer nos troupes et nous donnera un avantage dans la guerre du désert."
EGY_radio_technologies:0 "Technologies radio"
EGY_radio_technologies_desc:0 "Les communications radio entre les colonnes motorisées amélioreront grandement leurs capacités, la rapidité de planification et leur réactivité face aux menaces."
EGY_new_military_institute:0 "Nouvel institut militaire"
EGY_new_military_institute_desc:0 "Une nouvelle génération d’officiers rend nécessaire l’ouverture d’un nouvel institut militaire où ils pourront présenter leurs idées."
EGY_central_intelligence:0 "Renseignement central"
EGY_central_intelligence_desc:0 "Dans un monde en perpétuelle accélération, l’information est un pouvoir. En formant un réseau central de renseignement, nous pourrons collecter et analyser des données partout dans le monde, nous donnant un avantage sur nos ennemis."
EGY_decryption_department:0 "Département du déchiffrement"
EGY_decryption_department_desc:0 "Pour protéger nos secrets et contrer l’espionnage étranger, nous devons investir dans un service de déchiffrement de pointe capable de casser les codes ennemis."
EGY_air_defenses:0 "Défenses aériennes"
EGY_air_defenses_desc:0 "Nous avons fortifié notre territoire, mais il est désormais temps de protéger nos cieux."
EGY_continue_motorization_of_the_army:0 "Poursuivre la motorisation de l’armée"
EGY_continue_motorization_of_the_army_desc:0 "L’ère du fantassin touche à sa fin. En motorisant notre armée, nous pourrons nous déplacer rapidement sur le champ de bataille, surprenant nos ennemis et augmentant notre mobilité et notre puissance de feu."
EGY_develop_egyptian_armour:0 "Développer les blindés [EGY.GetAdjective]"
EGY_develop_egyptian_armour_desc:0 "Nous devons investir dans le développement de blindés modernes, des chars aux véhicules de transport, afin de protéger nos soldats et de conserver un avantage technologique."
EGY_unit_777:0 "Unité 777"
EGY_unit_777_desc:0 "Face à des menaces croissantes, nous devons créer une force d’opérations spéciales hautement entraînée : l’Unité 777."
EGY_study_nuclear_power:0 "Projet ETRR-1"
EGY_study_nuclear_power_desc:0 "Nous devons étudier l’énergie nucléaire et ses applications militaires. La maîtrise de cette science nous permettra de développer une dissuasion nucléaire contre tout agresseur."
EGY_sameera_moussa:0 "Sameera Moussa"

EGY_the_egyptian_army_idea:0 "L’armée [EGY.GetAdjective]"
EGY_the_egyptian_army_idea_desc:0 "Des années de négligence par le gouvernement et l’économie ont laissé l’armée en mauvais état. Une modernisation est nécessaire en prévision d’un nouveau conflit."
EGY_the_egyptian_army_modifier:0 "L’armée égyptienne"
EGY_modify_the_egyptian_army_intro:0 "Modifier §YL’armée [EGY.GetAdjective]§! en"
EGY_egyptian_military_academy_tt:0 "$EGY_modify_the_egyptian_army_intro$ \nCoût des chefs militaires : §G-50%§!\nCoût de doctrine terrestre : §G-10%§!\nGain quotidien de pouvoir de commandement : §G+10%§!\n\n"
EGY_new_military_institute_tt:0 "$EGY_modify_the_egyptian_army_intro$ \nCoût des chefs militaires : §G-50%§!\nCoût de doctrine terrestre : §G-10%§!\n\n"
