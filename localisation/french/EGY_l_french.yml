EGY_sway_a_commander_to_the_cause_desc:0 "Nous ne pouvons espérer réussir une rébellion sans le soutien d’éléments de l’armée. Peut-être qu’avec assez de persuasion, nous pourrons obtenir la sympathie et l’appui d’un commandant."
