EGY_sway_sudanese_separatists_tt:0 "Cet État [SUD.GetAdjective] sera sous notre contrôle au déclenchement de la guerre civile et des §Ypartisans [SUD.GetAdjective]§! se lèveront de notre côté, supprimant ainsi le §Yséparatisme [SUD.GetAdjective]§!."
