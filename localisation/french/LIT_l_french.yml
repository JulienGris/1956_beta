 LIT_council_of_lithuania_decisions:0 "Conseil de Lituanie"
 LIT_council_of_lithuania_decisions_desc:0 "Le Conseil de Lituanie supervisa autrefois l’occupation du pays durant la Première Guerre mondiale, signa l’acte d’indépendance en 1918 et tenta sans succès d’établir une monarchie. Avec le changement de régime soudain en Allemagne voisine, la possibilité de restaurer le royaume suscite beaucoup plus d’intérêt dans la Lituanie post-Smetona. [GetIwValues] [GetNuValues] [GetCdValues] [GetSdValues]"
 LIT_iw_values:0 "\n\n§YPosition des Voldemarininkai§! sur la restauration de la monarchie :       [GetIwLoyalty]\n§YInfluence des Voldemarininkai§! au conseil :                                          [?LIT.LIT_iw_seats|+0] sur [?LIT.LIT_total_seats|+0] sièges"
