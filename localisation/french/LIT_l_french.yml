 #Infobulles
 LIT_monarch_learning_lithuanian_tt:0 "Karl Gero, duc d’Urach, commencera à apprendre le lituanien"
 LIT_undercover_snieckus_tt:0 "Les efforts de Sniečkus augmenteront la probabilité de succès de la révolte"
 LIT_not_completing_elections_tt:0 "Ne pas terminer les élections à temps suscitera du mécontentement et renforcera les partisans des idéologies radicales"
 LIT_electoral_law_tt:0 "Amender la loi électorale est nécessaire pour consolider la mainmise de Smetona sur le pouvoir"
 LIT_ussr_coup_help_tt:0 "Du matériel arrivera en Lituanie une fois le soulèvement/coup d’État lancé"
 LIT_become_lithuania:0 "Devenir la Lituanie"
 LIT_german_rail_tt:0 "§CDeux §!§YInfrastructures§!§C seront ajoutées à §!§Ychaque État frontalier avec l’Allemagne.§!"
 LIT_op_mindaugas_tt:0 "§YCette décision déclenche une guerre frontalière pour [784.GetName]§!"
 unify_baltics_lithuania_required_states_tt:0 "Contrôle de tous les §YÉtats lituaniens§!. (Exclut Memel et Wilno)"
 unify_baltics_latvia_required_states_tt:0 "Contrôle de tous les §YÉtats lettons§!."
 unify_baltics_estonia_required_states_tt:0 "Contrôle de tous les §YÉtats estoniens§!."
 form_gdl_ukraine_required_states_tt:0 "Contrôle de tous les §YÉtats ukrainiens§! de l’Union soviétique à l’exception de [199.GetName], [196.GetName], [200.GetName], [227.GetName] et [228.GetName]."
 form_gdl_ukraine_cored_states_tt:0 "Obtient des cœurs sur tous les §YÉtats ukrainiens§! requis."
 LIT_disband_nationalist_union_tt:0 "Tous les sièges de l’§YUnion nationaliste§! sont cédés aux autres partis, offrant un petit bonus de soutien à chacun."
 LIT_oust_key_smetonists_tt:0 "L’§YUnion nationaliste§! perd un siège au profit de chaque parti concurrent, ce qui offre un petit bonus de soutien aux autres partis, au détriment de l’§YUnion nationale§!."
 LIT_kings_party_sd_tt:0 "Les §YSociaux-démocrates§! contrôlent moins de 10 sièges."

 #Priorités
 LIT_Aviation_Effort:0 "Développer l’armée de l’air du [ROOT.GetName]"
 LIT_Aviation_Effort_desc:0 "L’armée de l’air [ROOT.GetAdjective], correctement développée, peut être une force redoutable capable de réduire à néant tout agresseur. Nous devons commencer la construction de bases aériennes et former nos officiers à l’utilisation de ces machines volantes."
 LIT_Foreign_Design:0 "Se concentrer sur les modèles étrangers"
 LIT_Foreign_Design_desc:0 "Notre capacité industrielle à développer des avions locaux est terriblement limitée. Nous devrions collaborer avec d’autres nations alliées pour aligner nos capacités aériennes sur leurs modèles."
 LIT_Aircraft_England:0 "Étudier les avions britanniques"
 LIT_Aircraft_England_desc:0 "Quelques firmes aéronautiques britanniques, avec le soutien tacite du gouvernement, nous ont proposé d’acheter leurs derniers modèles d’exportation. Nous devrions accepter leur offre."

 LIT_Aircraft_american:0 "Étudier les avions américains"
 LIT_Aircraft_american_desc:0 "Certaines compagnies américaines ont proposé de nous vendre des prototypes de chasseurs légers. Les acquérir, ainsi que leurs plans et pièces détachées, aiderait grandement notre armée de l’air."
 LIT_Aircraft_Italian:0 "Étudier les avions italiens"
 LIT_Aircraft_Italian_desc:0 "Les bombardiers italiens comptent parmi les meilleurs au monde. Un rapprochement avec leur gouvernement actuel nous permettrait d’en acheter et d’en étudier les modèles."
 LIT_Aircraft_japanese:0 "Étudier les avions japonais"
 LIT_Aircraft_japanese_desc:0 "L’agilité et la vitesse surprenantes des avions légers japonais doivent être étudiées en détail par nos ingénieurs."
 LIT_Aircraft_Soviet:0 "Étudier les avions soviétiques"
 LIT_Aircraft_Soviet_desc:0 "Quelles que soient leurs intentions envers nous, les avions [SOV.GetAdjective] sont d’une excellente qualité de fabrication que nous pourrions intégrer à nos conceptions."
 LIT_Aircraft_German:0 "Étudier les avions allemands"
 LIT_Aircraft_German_desc:0 "Malgré nos désaccords avec le gouvernement [GER.GetAdjective], leurs avions sont robustes et efficaces. Nous devrions tenter d’obtenir certaines spécifications techniques et tirer profit de leur expertise."
 LIT_Fighter_Competition:0 "Concours de chasseurs"
 LIT_Fighter_Competition_desc:0 "Organiser un salon aérien de chasseurs modernes nous permettra de sélectionner et d’obtenir certains des meilleurs appareils disponibles aujourd’hui."
 LIT_Fighter_Competition_EXPL:0 "Obtient quelques §Havions§! des pays où vous avez effectué une mission aéronautique.\n"
 LIT_Close_Air_Support:0 "Modifications pour l’appui aérien rapproché"
 LIT_Close_Air_Support_desc:0 "Maintenant que nous possédons des licences de chasseurs étrangers, nous pouvons facilement les modifier pour les adapter aux missions d’appui aérien rapproché pour notre armée."
 LIT_Bomber_Competition:0 "Concours de bombardiers"
 LIT_Bomber_Competition_desc:0 "Un salon aérien des bombardiers actuels permettra également à notre armée de l’air d’en obtenir quelques-uns."
 LIT_German_Rocketry:0 "Missiles allemands"
 LIT_German_Rocketry_desc:0 "Par un pur hasard, nous avons « obtenu » quelques roquettes expérimentales de notre voisin du sud. Nous devrions les étudier avant de les rendre aux [GER.GetAdjective]."
 LIT_Shared_Air_Doctrine:0 "Suivre les doctrines aériennes étrangères"
 LIT_Shared_Air_Doctrine_desc:0 "Notre armée de l’air moderne ne serait qu’une coquille vide sans innovations doctrinales. Certains pilotes et officiers ont proposé des changements tactiques solides que nous devrions adopter avant qu’une guerre n’éclate."
 LIT_aircraft_design_cooperation:0 "Coopération dans la conception aéronautique"
 LIT_aircraft_design_cooperation_desc:0 "Nous avons beaucoup à apprendre de nos alliés, tout comme eux peuvent apprendre de nous. Les bénéfices mutuels renforceront encore davantage nos recherches aériennes."

 LIT_finish_marshalls_reforms:0 "Achever les réformes du maréchal Raštikis"
 LIT_finish_marshalls_reforms_desc:0 "Alors que les tensions montent en Europe, nous ne pouvons pas laisser notre armée dépérir, sans formation et dirigée par des officiers médiocres. Un officier prometteur formé en Allemagne, Stasys Raštikis, a proposé une série de réformes qui préparent notre armée à une expansion future et à un programme plus efficace de formation des officiers."
 LIT_army_expansion:0 "Expansion de l’armée"
 LIT_army_expansion_desc:0 "L’achèvement des réformes nous a permis d’entraîner davantage de troupes en parallèle, et nos officiers sont désormais disposés à apprendre et à appliquer de nouvelles améliorations dans les méthodes ainsi que dans les tactiques de combat."
 LIT_fortify_the_border:0 "Fortifier la frontière"
 LIT_fortify_the_border_desc:0 "Nous partageons des frontières avec certains des voisins les plus peu accommodants. Construire des lignes de défense constituera un sévère moyen de dissuasion contre leurs offensives, sans aucun doute déjà planifiées."
 LIT_prepare_the_mobilization_plans:0 "Préparer les plans de mobilisation"
 LIT_prepare_the_mobilization_plans_desc:0 "Une armée agrandie est inutile si elle ne peut pas se rassembler à temps pour combattre. Le maréchal Raštikis a des idées sur la façon de réduire le temps de mobilisation de notre armée à moins de 48 heures en cas de guerre contre [GER.GetName] et [POL.GetName]."
 LIT_doctrine_effort:0 "Révision de la doctrine"
 LIT_doctrine_effort_desc:0 "Des armes modernes ne suffisent pas à mener une guerre défensive réussie. Nous devons également développer les doctrines correspondantes pour garantir le succès sur le champ de bataille."
 LIT_doctrine_effort_2:0 "Simulations de guerre"
 LIT_doctrine_effort_2_desc:0 "« Aucun plan ne survit au premier contact avec l’ennemi. » Nos tactiques doivent être réalistes en temps de paix pour être efficaces en temps de guerre."
 LIT_expand_the_MAL:0 "Élargir l’Académie militaire lituanienne"
 LIT_expand_the_MAL_desc:0 "L’Académie militaire de Lituanie est l’endroit où nos officiers sont formés avant de servir. Son expansion doit être accélérée pour répondre à nos besoins."
 LIT_equipment_effort:0 "Modernisation de l’équipement"
 LIT_equipment_effort_desc:0 "Nos troupes combattent encore avec des armes datant de 1918. Cet état de fait doit prendre fin ici, avec un programme d’amélioration des armes d’infanterie et de l’artillerie."
 LIT_equipment_effort_2:0 "Artillerie moderne"
 LIT_equipment_effort_2_desc:0 "Une meilleure artillerie mène à de plus grandes batailles, et grâce à elle, nous sortirons victorieux."
 LIT_army_modernization:0 "Moderniser l’armée"
 LIT_army_modernization_desc:0 "L’armée [LIT.GetAdjective] connaîtra une expansion rapide de ses unités de soutien, améliorant l’endurance de nos divisions sur le terrain."
 LIT_equipment_effort_3:0 "Équipement prototype"
 LIT_equipment_effort_3_desc:0 "Certains officiers des bataillons d’artillerie ont proposé des améliorations et innovations. Les appliquer à de nouveaux canons nous donnera un avantage contre nos ennemis."
 LIT_special_forces:0 "Forces spéciales"
 LIT_special_forces_desc:0 "Des officiers prometteurs ont proposé la formation d’unités capables d’opérer dans des terrains jugés impossibles pour d’autres. Nous devons les former et tester ces idées."
 LIT_establish_a_armor_corp:0 "Créer un corps blindé"
 LIT_establish_a_armor_corp_desc:0 "Ces nouveaux véhicules blindés, appelés chars, ont d’importantes implications tactiques. Nous devons créer un corps blindé du [Root.GetName] pour tester leur efficacité et développer de meilleurs modèles."
 LIT_signal_companies:0 "Compagnies de transmissions"
 LIT_signal_companies_desc:0 "La radio permet de transmettre des messages sur de longues distances en pleine bataille. La formation de compagnies de transmissions augmentera la réactivité de nos unités."
 LIT_motorization_effort:0 "Créer un corps motorisé"
 LIT_motorization_effort_desc:0 "La formation d’un corps motorisé augmentera la mobilité de nos troupes. Nous ne devons pas ignorer ce développement passionnant."
 LIT_mechanization_effort:0 "Créer un corps mécanisé"
 LIT_mechanization_effort_desc:0 "L’infanterie transportée en camions est vulnérable. L’ajout de blindage à nos transports offre une plus grande liberté de mouvement et de combat."
 LIT_field_hospitals:0 "Développer les équipes médicales"
 LIT_field_hospitals_desc:0 "Un petit pays comme le nôtre ne peut pas subir de lourdes pertes. Nous devons doter nos troupes d’un corps médical dédié."
 LIT_modern_logistics:0 "Logistique moderne"
 LIT_modern_logistics_desc:0 "La logistique est la ligne de vie de l’armée. Sans elle, les troupes dépérissent sans nourriture ni munitions. Toute l’armée doit maîtriser l’art du ravitaillement en conditions difficiles."
 LIT_revive_the_trade_sector:0 "Relancer le secteur commercial"
 LIT_revive_the_trade_sector_desc:0 "Nos échanges et exportations mondiales ont toujours aidé notre économie à prospérer. Nous devons stimuler ce secteur lucratif pour attirer les affaires dans la Baltique."
 LIT_develop_the_fledgling_industry:0 "Développer l’industrie naissante"
 LIT_develop_the_fledgling_industry_desc:0 "Nos machines et outils industriels sont peu nombreux. Notre prochain plan industriel visera à les développer."
 LIT_develop_coastal_regions:0 "Développer les régions côtières"
 LIT_develop_coastal_regions_desc:0 "Šiauliai sera agrandie avec des ports modernes et des infrastructures pour soutenir notre commerce croissant avec l’Occident."
 LIT_develop_the_banks_holdings:0 "Développer les avoirs de la banque"
 LIT_develop_the_banks_holdings_desc:0 "Notre banque nationale possédera de nouvelles infrastructures et machines-outils, stimulant davantage la croissance économique."
 LIT_lithuanian_industrial_boom:0 "Boom industriel lituanien"
 LIT_lithuanian_industrial_boom_desc:0 "Nos récents investissements et plans industriels ont porté leurs fruits ! Les investisseurs et entrepreneurs étrangers affluent en Lituanie."
 LIT_long_term_investments:0 "Investissements à long terme"
 LIT_long_term_investments_desc:0 "Nous devons convaincre les investisseurs étrangers d’investir durablement pour développer nos infrastructures et notre économie."
 LIT_increase_commercialism:0 "Accroître le commerce"
 LIT_increase_commercialism_desc:0 "Nos échanges internationaux ont renforcé notre réputation dans les pays baltes comme partenaire fiable."
 LIT_control_the_exports:0 "Contrôler les exportations"
 LIT_control_the_exports_desc:0 "Nous devons contrôler davantage nos exportations pour mieux nous protéger des fluctuations de prix mondiaux."
 LIT_increase_the_currency_value:0 "Augmenter la valeur du litas"
 LIT_increase_the_currency_value_desc:0 "Le litas [LIT.GetAdjective] est l’une des monnaies les plus stables d’Europe. Accroître sa valeur nous donnera un avantage dans nos échanges."
 LIT_prepare_the_military_industry:0 "Préparer l’industrie militaire"
 LIT_prepare_the_military_industry_desc:0 "Construire davantage d’usines de production d’armement est essentiel pour notre défense."
 LIT_prepare_the_nations_defences:0 "Préparer les défenses nationales"
 LIT_prepare_the_nations_defences_desc:0 "Les bouleversements politiques autour de nous finiront par nous atteindre. Nous construirons, et nous défendrons."
 LIT_all_in:0 "§RTout miser !§!"
 LIT_all_in_desc:0 "Notre existence même est en jeu. Chaque homme, femme et enfant de [LIT.GetNameDef] doit travailler, et chaque usine doit produire des armes."
 LIT_unban_the_LSDP:0 "Réanimer la « coalition de 1926 »"
 LIT_alliance_with_far_left:0 "Alliance avec le LKP"
 LIT_politicize_the_lpm:0 "Politiser le LPJS"
 LIT_collectived_agriculture:0 "Réformes agricoles collectivisées"
 LIT_crush_latvian_oligarchism:0 "Écraser l’oligarchie lettone"
 LIT_support_vilna_workers:0 "Libérer les travailleurs de Vilna"
 LIT_forcefully_incorporate_estonia:0 "Incorporer de force l’Estonie"
 LIT_preemptive_strike:0 "Frappe préventive"
 LIT_formalize_baltic_unity:0 "Formaliser l’unité balte"
 LIT_soviet_alliance:0 "Alliance soviétique"
 LIT_support_anti_fascism:0 "Soutenir l’antifascisme international"
 LIT_strengthen_the_coalition:0 "Renforcer la coalition"
 LIT_fund_the_anbo:0 "Financer l’ANBO"
 LIT_fund_the_anbo_desc:0 "L’ANBO, dirigée par Antanas Gustaitis, a conçu et produit de nombreux avions indigènes. En lui donnant plus de moyens, nous pourrions développer des avions modernes pour notre armée de l’air."
 LIT_import_foreign_engines:0 "Importer des moteurs étrangers"
 LIT_import_foreign_engines_desc:0 "La production de moteurs d’avion est coûteuse et complexe. Il vaut mieux les importer."
 LIT_modernize_planes:0 "Moderniser les avions"
 LIT_modernize_planes_desc:0 "L’acquisition de moteurs puissants nous permet de moderniser nos avions, produisant des chasseurs comparables aux modèles étrangers."
 LIT_open_pilot_training_facilities:0 "Ouvrir des écoles de pilotage"
 LIT_open_pilot_training_facilities_desc:0 "Notre armée de l’air souffre d’un manque de pilotes. En ouvrant des écoles et en recrutant des instructeurs expérimentés, nous résoudrons ce problème."
 LIT_anbo_viii:0 "ANBO VIII"
 LIT_anbo_viii_desc:0 "Un projet d’avion de reconnaissance et d’appui rapproché, codé ANBO VIII. Ce sera l’avion le plus avancé jamais conçu en Lituanie."
 LIT_open_new_aviation_workshops:0 "Ouvrir de nouveaux ateliers aéronautiques"
 LIT_open_new_aviation_workshops_desc:0 "De nouveaux ateliers permettront d’augmenter notre production et de répondre aux besoins de l’armée de l’air."
 LIT_antanas_gustaitis_reforms:0 "Réformes d’Antanas Gustaitis"
 LIT_antanas_gustaitis_reforms_desc:0 "Antanas Gustaitis a proposé une série de réformes qui jetteront les bases de notre doctrine aérienne."
 LIT_cooperate_with_maritime_organisations:0 "Coopérer avec les organisations maritimes"
 LIT_cooperate_with_maritime_organisations_desc:0 "De nombreuses organisations maritimes lituaniennes, regroupant marins et capitaines expérimentés, pourraient nous aider à améliorer notre marine."
 LIT_revisit_naval_doctrine:0 "Réviser la doctrine navale"
 LIT_revisit_naval_doctrine_desc:0 "Grâce à nos nouvelles connaissances stratégiques, nous pouvons adapter notre doctrine navale à nos besoins."
 LIT_focus_on_destroyer_production:0 "Se concentrer sur la production de destroyers"
 LIT_focus_on_destroyer_production_desc:0 "Les destroyers, petits mais polyvalents, doivent constituer la base de notre flotte."
 LIT_educate_naval_officers_abroad:0 "Former des officiers navals à l’étranger"
 LIT_educate_naval_officers_abroad_desc:0 "Envoyer nos meilleurs officiers dans les académies navales étrangères les aidera à atteindre leur plein potentiel."
 LIT_defend_the_coast:0 "Défendre les côtes"
 LIT_defend_the_coast_desc:0 "Protéger notre littoral et nos routes maritimes doit être l’objectif principal de notre marine."
 LIT_cruisers_development:0 "Développement des croiseurs"
 LIT_cruisers_development_desc:0 "Les croiseurs offrent un bon équilibre entre puissance de feu et polyvalence."
 LIT_streamline_submarine_production:0 "Rationaliser la production de sous-marins"
 LIT_streamline_submarine_production_desc:0 "En concentrant nos chantiers sur les sous-marins, nous éliminerons les goulets d’étranglement."
 LIT_raiding_fleet:0 "Flotte de raid"
 LIT_raiding_fleet_desc:0 "Les sous-marins et torpilles nous permettent de défier de grandes marines sans gaspiller nos ressources dans des navires lourds."
 LIT_develop_indigenous_designs:0 "Développer des conceptions indigènes"
 LIT_develop_indigenous_designs_desc:0 "Nous devons réunir nos meilleurs ingénieurs pour concevoir des navires adaptés à nos besoins."
 LIT_klaipda_shipyards:0 "Chantiers navals de Klaipėda"
 LIT_klaipda_shipyards_desc:0 "Klaipėda, notre plus grand port, est un site idéal pour une base navale, malgré sa proximité dangereuse de la frontière."
 LIT_ventoji_shipyards:0 "Chantiers navals de Šventoji"
 LIT_ventoji_shipyards_desc:0 "Šventoji est moins adapté que Klaipėda mais son emplacement central le protège mieux d’une attaque étrangère."
 LIT_study_foreign_navies:0 "Étudier les marines étrangères"
 LIT_study_foreign_navies_desc:0 "Nous devons apprendre des grandes puissances maritimes si nous voulons créer une marine efficace."
 LIT_expansion_of_naval_facilities:0 "Expansion des infrastructures navales"
 LIT_expansion_of_naval_facilities_desc:0 "Nous devons développer les infrastructures nécessaires pour entretenir et agrandir notre flotte."
 LIT_a_separate_branch:0 "Une branche séparée"
 LIT_a_separate_branch_desc:0 "Jusqu’à récemment, notre marine manquait de reconnaissance. Elle doit devenir une véritable branche de nos forces armées."
 LIT_baltic_navy:0 "Marine baltique"
LIT_baltic_navy_desc:0 "Notre marine est appelée à opérer presque exclusivement en mer Baltique et doit donc être adaptée aux particularités de sa géographie et de la guerre navale côtière."
LIT_found_the_lithuanian_maritime_academy:0 "Fonder l’Académie maritime lituanienne"
LIT_found_the_lithuanian_maritime_academy_desc:0 "En investissant dans la création de l’Académie maritime lituanienne, nous pourrions commencer à former des marins et officiers hautement qualifiés pour notre marine."
LIT_purchase_foreign_ships:0 "Acheter des navires étrangers"
LIT_purchase_foreign_ships_desc:0 "Les chantiers navals étrangers produisent des navires bien plus rapidement et efficacement que nous ne pourrions jamais l’espérer. Plutôt que de les imiter maladroitement, nous devrions tenter d’acquérir leurs meilleurs bâtiments pour notre propre flotte."
LIT_purchase_italian_ships:0 "Acheter des navires italiens"
LIT_purchase_italian_ships_desc:0 "Beaucoup de nos officiers ont étudié en Italie, il serait donc logique d’ouvrir un appel d’offres pour acquérir plusieurs navires modernes auprès des Italiens."
LIT_purchase_french_ships:0 "Acheter des navires français"
LIT_purchase_french_ships_desc:0 "La France est l’une des grandes puissances maritimes et possède une flotte moderne et puissante. Nous devrions envisager d’approcher le gouvernement français afin de tenter d’obtenir certains de leurs navires."
LIT_announce_upcoming_elections:0 "Annoncer des élections à venir"
LIT_announce_upcoming_elections_desc:0 "Le peuple semble réclamer des élections, nous allons donc les organiser. Mais le résultat final n’est pas forcément destiné à leur appartenir."
LIT_force_parties_to_reregister:0 "Forcer les partis à se réenregistrer"
LIT_force_parties_to_reregister_desc:0 "Exiger la réinscription des partis politiques pourrait les empêcher de figurer sur le bulletin de vote."
LIT_amend_the_electoral_law:0 "Modifier la loi électorale"
LIT_amend_the_electoral_law_desc:0 "La modification de la loi électorale est nécessaire pour consolider l’emprise de Smetona sur le pouvoir."
LIT_decrease_representation:0 "Réduire la représentation"
LIT_decrease_representation_desc:0 "L’instabilité politique récente a mis en évidence le besoin d’une gouvernance plus directe et d’un pouvoir consolidé face à la montée des tensions. Nous devrions réduire le nombre de représentants de 85 à 49 afin de rendre le corps législatif plus efficace, mieux à même de représenter la volonté du peuple lituanien, et de débarrasser le président Smetona de tout obstacle légal."
LIT_subsidize_food_industry:0 "Subventionner l’industrie alimentaire"
LIT_subsidize_food_industry_desc:0 "Premier secteur industriel de Lituanie et source essentielle d’exportations, l’industrie alimentaire a du mal à rester compétitive à cause de tarifs élevés et de pratiques dépassées. En lui accordant des subventions ciblées, nous pourrions moderniser ce secteur vital, le rendre plus résistant aux chocs économiques et maintenir la forte position de notre pays sur le marché mondial."
LIT_elect_the_fourth_seimas:0 "Élire le quatrième Seimas"
LIT_elect_the_fourth_seimas_desc:0 "Pour renforcer davantage la domination de Smetona sur la Lituanie, nous devons élire un quatrième Seimas constitutionnel qui lui restera loyal."
LIT_form_the_youth_branch:0 "Former une branche jeunesse"
LIT_form_the_youth_branch_desc:0 "En créant une véritable branche jeunesse avec des sièges au gouvernement, nous pourrions inciter notre jeunesse à s’impliquer activement en politique et former une nouvelle génération de fonctionnaires lituaniens. Malheureusement, cela pourrait aussi favoriser des interprétations radicales de notre idéologie."
LIT_expand_riflemans_union:0 "Étendre l’Union des Tireurs"
LIT_expand_riflemans_union_desc:0 "Fondée en 1919, l’Union des Tireurs lituaniens est une composante essentielle de la défense nationale. Il est logique d’élargir cette institution."
LIT_exile_voldemaras:0 "Exiler Voldemaras"
LIT_exile_voldemaras_desc:0 "Augustinas Voldemaras et ses partisans représentent une menace existentielle pour le gouvernement lituanien. Mieux vaut l’avoir à l’étranger."
LIT_adopt_a_new_constitution:0 "Adopter une nouvelle constitution"
LIT_adopt_a_new_constitution_desc:0 "Une nouvelle constitution doit être rédigée afin de renforcer le contrôle de notre gouvernement sur la nation."
LIT_empower_smetona:0 "Renforcer Smetona"
LIT_empower_smetona_desc:0 "Notre président Antanas Smetona a montré une force exceptionnelle dans la conduite de l’État lituanien. Il est temps de consolider encore davantage ce pouvoir."
LIT_arrest_nazi_sympathizers:0 "Arrêter les sympathisants nazis"
LIT_arrest_nazi_sympathizers_desc:0 "L’Italie et l’Allemagne flirtent ouvertement avec le fascisme et chercheront à exporter ces idées dans le reste de l’Europe. Nous devons persécuter ceux qui cherchent à implanter ces idéologies en Lituanie."
LIT_dissolve_the_klaipda_directorate:0 "Dissoudre la direction de Klaipėda"
LIT_dissolve_the_klaipda_directorate_desc:0 "La région de [188.GetName] conserve encore une autonomie partielle depuis sa concession par l’Allemagne. Il est temps de supprimer tout obstacle au contrôle de cette partie de notre territoire."
LIT_accept_opposition_in_the_government:0 "Accepter l’opposition au gouvernement"
LIT_accept_opposition_in_the_government_desc:0 "Avec la guerre qui se profile, nous devons obtenir le soutien de personnalités politiques importantes, même celles hostiles au régime."
LIT_fortify_klaipda:0 "Fortifier Klaipėda"
LIT_fortify_klaipda_desc:0 "En raison des tensions croissantes avec l’Allemagne au sujet de Klaipėda, il est évident qu’en cas de guerre, cette ville serait la première cible d’une invasion allemande. Nous devons fortifier cette région si nous voulons avoir une chance de résister."
LIT_reinforce_kaunas_fortress:0 "Renforcer la forteresse de Kaunas"
LIT_reinforce_kaunas_fortress_desc:0 "La forteresse de Kaunas, achevée au début du XXe siècle, englobe une grande partie de la ville et reste l’une des plus vastes structures défensives d’Europe. Des rénovations d’ampleur sont nécessaires pour la maintenir et la préparer à d’éventuelles attaques."
LIT_offer_our_enemies_support:0 "Offrir notre soutien à nos ennemis"
LIT_offer_our_enemies_support_desc:0 "Nous nous trouvons dans une situation périlleuse, entourés de puissants ennemis. Nous sommes contraints de céder à certains adversaires pour apaiser les tensions et gagner du temps, en espérant renégocier plus tard des accords plus favorables avec ces ennemis devenus partenaires."
LIT_sovietlithuanian_mutual_assistance_treaty:0 "Traité d’assistance mutuelle [SOV.GetAdjective]-[ROOT.GetAdjective]"
LIT_sovietlithuanian_mutual_assistance_treaty_desc:0 "Les Allemands cherchent ouvertement à réaffirmer leur autorité sur leurs anciens territoires impériaux. Il est donc préférable de nous tourner vers Moscou pour discuter d’une assistance mutuelle en cas de guerre."
LIT_germanlithuanian_mutual_assistance_treaty:0 "Traité d’assistance germano-[ROOT.GetAdjective]"
LIT_germanlithuanian_mutual_assistance_treaty_desc:0 "Si le courage et la détermination suffisaient, l’URSS serait déjà démantelée. Mais la Lituanie manque cruellement de moyens pour se défendre face à une menace aussi écrasante. En nous alliant aux Allemands, nous avons peut-être une chance de survivre à la prochaine décennie."
LIT_voldemarininkai_coup:0 "Coup d’État des Voldemarininkai"
LIT_voldemarininkai_coup_desc:0 "Smetona prévoit d’organiser de prochaines « élections ». Si nous voulons établir l’organisation du Loup de Fer comme une véritable force politique, nous devons agir maintenant et assurer notre position."
LIT_reform_the_iron_wolf:0 "Réformer le Loup de Fer"
LIT_reform_the_iron_wolf_desc:0 "Réformer le Loup de Fer n’est pas qu’une décision stratégique : c’est une déclaration. Autrefois craint, il renaîtra pour imposer l’autorité des Voldemarininkai, éliminer la dissidence et raviver l’ardeur nationaliste. Fidèles à la cause de Voldemaras, ils poursuivront le rêve d’une Lituanie forte et unie."
LIT_rehabilitate_organisers_of_the_1934_coup:0 "Réhabiliter les organisateurs du coup de 1934"
LIT_rehabilitate_organisers_of_the_1934_coup_desc:0 "Le coup d’État manqué des Voldemarininkai en 1934 résonne encore dans notre paysage politique. Ceux qui avaient tenté de nous hisser au pouvoir sont aujourd’hui emprisonnés et rejetés. Leur réhabilitation ne serait pas seulement un geste de clémence, mais une manœuvre stratégique pour rallier des alliés loyaux et renforcer notre autorité."
LIT_return_of_voldemaras:0 "Retour de Voldemaras"
LIT_return_of_voldemaras_desc:0 "À présent libéré d’une peine de prison injuste, nous devons organiser une cérémonie grandiose pour célébrer son retour légitime en tant que dirigeant de la nation."
LIT_hold_the_lnp_commission:0 "Tenir la commission du LNP"
LIT_hold_the_lnp_commission_desc:0 "Les Voldemarininkai ne disposent ni d’une idéologie claire, ni d’une hiérarchie stable. Les querelles entre commandants menacent de miner la stabilité du mouvement nationaliste. Organiser la première commission du LNP permettrait de légitimer le Parti nationaliste lituanien comme organe dirigeant du nouvel État et de définir un programme politique officiel."
LIT_empower_patriots:0 "Renforcer l’aile patriotique"
LIT_empower_patriots_desc:0 "L’aile patriotique, moins instable que l’aile radicale, doit être renforcée ainsi que ses politiques afin d’éviter une radicalisation accrue de la population lituanienne."
LIT_enforce_lithuaniazation:0 "Imposer la lithuanisation"
LIT_enforce_lithuaniazation_desc:0 "La Lituanie est une nation largement homogène, mais on y trouve encore d’importantes minorités allemandes et polonaises. Le gouvernement doit chercher à assimiler ces populations à notre mode de vie plutôt que de les laisser retomber sous influence étrangère."
LIT_syndicalize_agriculture:0 "Syndicaliser l’agriculture"
LIT_syndicalize_agriculture_desc:0 "Pour améliorer la productivité agricole et garantir la solidité de notre économie rurale, nous pouvons organiser les exploitations en syndicats. Ceux-ci encourageront l’unité, le partage des ressources, la standardisation des pratiques et l’augmentation des rendements."
LIT_battle_for_lithuania:0 "Batailles économiques de Lituanie"
LIT_battle_for_lithuania_desc:0 "En imitant les « batailles économiques » de Mussolini, nous pourrions obtenir des résultats similaires dans la résolution de nos problèmes économiques et démographiques."
LIT_lithuanian_autarky:0 "Autarcie lituanienne"
LIT_lithuanian_autarky_desc:0 "La Lituanie doit être totalement autosuffisante face aux grandes puissances qui l’entourent. Nous devons sécuriser nos propres ressources pour la Lituanie seule."
LIT_empower_radicals:0 "Renforcer l’aile radicale"
LIT_empower_radicals_desc:0 "L’aile radicale du LNP défend une vision ultranationaliste, fortement influencée par le national-socialisme, prônant une Lituanie « pure » et des idéologies raciales rejetées par les patriotes. Le gouvernement doit s’aligner davantage sur cette aile radicale et isoler l’aile patriotique."
LIT_promote_lithuanian_aryanism:0 "Promouvoir le chauvinisme lituanien"
LIT_promote_lithuanian_aryanism_desc:0 "Les idées italiennes sur la subordination des femmes doivent être adoptées afin d’assurer l’avenir de la jeunesse lituanienne."
LIT_seize_minority_assets:0 "Saisir les biens des minorités"
LIT_seize_minority_assets_desc:0 "La minorité polonaise détient trop d’influence sur les ressources de notre pays. Cette situation doit être corrigée pour le bien du Grand-Duché."
LIT_germanlithuanian_credit_agreement:0 "Accord de crédit germano-lituanien"
LIT_germanlithuanian_credit_agreement_desc:0 "Avec notre récent changement de ton, l’Allemagne est devenue l’un de nos alliés les plus importants. Nous devrions approcher Berlin avec une proposition économique mutuellement avantageuse."
LIT_german_industrial_aid:0 "Aide industrielle allemande"
LIT_german_industrial_aid_desc:0 "La Lituanie n’est pas une grande nation et encore moins une nation industrialisée. La meilleure solution est de demander à nos alliés allemands d’investir en Lituanie."
LIT_lithuanian_antibolshevik_legions:0 "Légions antibolcheviques lituaniennes"
LIT_lithuanian_antibolshevik_legions_desc:0 "Les communistes menacent notre mode de vie. Il est du devoir du monde libre de veiller à ce qu’ils ne puissent pas soumettre d’autres nations au joug du communisme."
LIT_form_the_lithuanian_security_police:0 "Former la police de sécurité lituanienne"
LIT_form_the_lithuanian_security_police_desc:0 "Des puissances comme l’Allemagne nous ont montré l’efficacité d’une police spécialisée dans la sécurité intérieure. Nous devons appliquer cette idée immédiatement dans notre nouvel État."
LIT_militarise_the_iron_wolf:0 "Militariser le Loup de Fer"
LIT_militarise_the_iron_wolf_desc:0 "Malgré leur loyauté, les membres du Loup de Fer sont indisciplinés et divisés. Leurs unités se livrent davantage à des violences de rue et à du harcèlement politique qu’à la lutte contre les menaces internes. Les militariser permettrait de hisser nos hommes les plus dévoués au niveau du soldat lituanien moyen."
LIT_lithuanian_irridentism:0 "Attiser l’irrédentisme lituanien"
LIT_lithuanian_irridentism_desc:0 "Des puissances étrangères détiennent non seulement une partie de notre territoire légitime, mais aussi notre capitale historique. Nous devons réparer cette injustice !"
LIT_northern_intervention:0 "Intervention au Nord"
LIT_northern_intervention_desc:0 "Malgré nos liens, nos voisins du nord nous ont maintes fois trahis. Ils ont refusé de combattre à nos côtés contre les bolcheviks en 1919 et de nous soutenir lors de la mutinerie de Żeligowski en 1920. Nous ne pouvons tolérer de tels alliés peu fiables à nos frontières. Cette situation doit changer, qu’ils le veuillent ou non."
LIT_nationalist_education:0 "Éducation nationaliste"
LIT_nationalist_education_desc:0 "Des milliers de jeunes esprits fréquentent les universités du pays, et nous manquons une occasion unique d’y inculquer les idéaux de la Lituanie que nous construisons. La jeunesse doit être encouragée à devenir patriote, combattante et pilier de l’État lituanien."
LIT_lead_by_example:0 "Montrer l’exemple"
LIT_lead_by_example_desc:0 "Mettre l’accent sur l’innovation technologique nous évitera de passer les cinquante prochaines années à rattraper le reste de l’Europe."
LIT_operation_mindaugas:0 "Opération Mindaugas"
LIT_operation_mindaugas_desc:0 "Nous devons reprendre Vilnius par tous les moyens nécessaires. Les Polonais étant occupés par leurs tractations avec Moscou et Berlin, le moment est idéal pour frapper."
LIT_r56_demand_vilnius:0 "Réclamer Vilnius"
LIT_r56_demand_vilnius_desc:0 "Nous ne resterons pas les bras croisés tandis que des forces étrangères occupent Vilnius. Nous exigerons son retour légitime, quel qu’en soit le prix !"
LIT_greater_lithuania:0 "Grande Lituanie"
LIT_greater_lithuania_desc:0 "L’idée de « Grande Lituanie » nous a été dérobée par les Polonais dans les années 1920. Il est temps de la réaliser pleinement !"
LIT_unify_baltics_fascist:0 "Union baltique"
LIT_unify_baltics_fascist_desc:0 "Bien que l’idée d’un État balte unifié puisse sembler irréaliste, nul ne peut nier la fraternité qui dépasse nos frontières. Avec la Lettonie et l’Estonie sous notre contrôle, il ne reste plus qu’à intégrer leur administration à la nôtre pour faire de l’hégémonie balte une réalité."
LIT_unify_baltics_communist:0 "Former une république soviétique balte"
LIT_unify_baltics_communist_desc:0 "Bien que distincts par leur culture et leur langue, les trois États baltes partagent une longue fraternité. Nos voisins sont autant nos camarades que nos compatriotes. Les travailleurs n’ont rien à gagner si nous ne nous unissons pas dans une seule république socialiste."
LIT_restore_the_gdl:0 "Restaurer le Grand-Duché"
LIT_restore_the_gdl_desc:0 "1795 fut la dernière année, avant 1918, où un État lituanien exista. Il est temps d’assumer notre passé impérial et de restaurer le Grand-Duché dans son intégralité."
LIT_contain_german_agression:0 "Contenir l’agression allemande"
LIT_contain_german_agression_desc:0 "Même si nous partageons certaines idéologies avec l’Allemagne, il serait naïf de croire qu’elle n’ambitionne pas notre territoire. Nous devons chercher d’autres soutiens en Europe pour garantir notre indépendance."
LIT_ally_france:0 "S’allier à la France"
LIT_ally_france_desc:0 "Dans les années 1920, la France envisageait une alliance balte semblable à celles qu’elle avait nouées en Europe orientale. Cette idée doit être relancée pour préserver la souveraineté lituanienne."
LIT_ally_italy:0 "S’allier à l’Italie"
LIT_ally_italy_desc:0 "L’Italie fut l’une des premières puissances européennes à reconnaître notre indépendance. Aujourd’hui, nos idéologies étant plus proches, nous devons renforcer ces relations pour protéger notre souveraineté."
LIT_memel_for_protection:0 "Memel pour protection"
LIT_reconvene_the_council_of_lithuania:0 "Rétablir le Conseil de Lituanie"
LIT_reconvene_the_council_of_lithuania_desc:0 "L’organe qui supervisa la création de l’État lituanien indépendant et du premier royaume moderne doit maintenant guider notre pays dans le vide politique laissé par la chute de Smetona."
LIT_intervene_in_the_german_civil_war:0 "Intervenir dans la guerre civile allemande"
LIT_intervene_in_the_german_civil_war_desc:0 "Intervenir dans la guerre civile en Allemagne est une occasion idéale pour nouer des relations avec le gouvernement qui en sortira."
LIT_vote_on_monarchy:0 "Voter sur la monarchie"
LIT_vote_on_monarchy_desc:0 "Le Conseil de Lituanie étant rétabli, il est temps de voter sur le rétablissement de la monarchie."
LIT_join_central_powers:0 "Rejoindre les puissances centrales"
LIT_join_central_powers_desc:0 "Avec le rétablissement d’une monarchie en Allemagne, nous devons chercher la protection du Kaiser."
LIT_break_nationalist_union:0 "Dissoudre l’Union nationaliste"
LIT_break_nationalist_union_desc:0 "L’Union nationaliste a accaparé le pouvoir de manière illégale. Elle menace le conseil et doit être détruite à tout prix."
LIT_banish_smetonists:0 "Écarter les smetonistes influents"
LIT_banish_smetonists_desc:0 "Le Conseil exige que [GetNeutralLeader] prenne des mesures hostiles contre l’Union nationaliste. Cependant, nous devons agir contre eux sans compromettre l’Union, trop précieuse face à la coalition libérale-chrétienne/sociale-démocrate montante."
LIT_dissolve_the_seimas:0 "Dissoudre le Conseil d’État"
LIT_dissolve_the_seimas_desc:0 "Le Conseil d’État fut créé après la dissolution du 3e Seimas en 1927 et hérita de ses fonctions législatives. Bien qu’il ait souvent défié l’autorité du Premier ministre, il restait loyal à Smetona. C’est pourquoi sa dissolution est nécessaire pour mettre fin à son règne."
LIT_ensure_german_support:0 "Assurer le soutien allemand"
LIT_ensure_german_support_desc:0 "Le soutien politique et militaire de [GER.GetNameDef] envers [ROOT.GetNameDef] renforcerait la légitimité et la popularité du régime."
LIT_invite_karl_gero:0 "Débattre de la monarchie"
LIT_kings_party:0 "Parti royaliste"
LIT_kings_party_desc:0 "La politique lituanienne est actuellement paralysée par le vote sur la monarchie. Un cercle restreint, composé des hommes forts de chaque parti, peut être utilisé pour influencer les factions sans qu’aucune ne puisse défier la couronne."
LIT_new_noble_class:0 "Nouvelle noblesse"
LIT_new_noble_class_desc:0 "La noblesse lituanienne a joué un rôle crucial dans le succès du Grand-Duché. Ces familles nobles ont façonné la vie politique et militaire du pays, et beaucoup de leurs descendants restent influents aujourd’hui. Le rétablissement de privilèges aristocratiques permettra de s’appuyer sur cette richesse d’expérience et de loyauté, garantissant stabilité et continuité dans la gouvernance tout en honorant l’héritage de la Lituanie."
LIT_support_the_lkma:0 "Soutenir la LKMA"
LIT_support_the_lkma_desc:0 "L’Académie catholique lituanienne des sciences (LKMA) joue un rôle essentiel dans le développement scientifique du pays depuis sa fondation en 1922. Il est de notre intérêt de soutenir ses efforts, pour renforcer à la fois la nation et la popularité de la monarchie."
LIT_lithuanian_aristocracy:0 "Aristocratie lituanienne"
LIT_cooperate_with_the_conservatives:0 "Coopérer avec les conservateurs"
LIT_cooperate_with_the_conservatives_desc:0 ""
LIT_restore_constitutionalism:0 "Rétablir le constitutionnalisme"
LIT_restore_constitutionalism_desc:0 ""
LIT_restore_the_monarchy:0 "Rétablir la monarchie"
LIT_royal_adress:0 "Discours royal"
LIT_royal_adress_desc:0 "La monarchie étant solidement rétablie, il est temps pour notre glorieux roi de s’adresser au peuple et de lui inspirer confiance : une nouvelle ère pour la Lituanie est sur le point de commencer !"
LIT_roman_recognition:0 "Reconnaissance de Rome"
LIT_roman_recognition_desc:0 "Le concordat de 1925 a sapé la légitimité du gouvernement lituanien en reconnaissant explicitement l’autorité de l’Église catholique polonaise sur Vilnius, capitale historique et légitime de la Lituanie. Ce fut perçu comme une trahison par le Vatican. Rechercher un rapprochement avec Rome et la reconnaissance de l’archidiocèse de Vilnius peut légitimer le royaume aux yeux du peuple."
LIT_fate_of_smetona:0 "Former un gouvernement loyaliste"
LIT_redraft_the_twelve_point_proposal:0 "Réviser la proposition des douze points"
LIT_redraft_the_twelve_point_proposal_desc:0 "La proposition des douze points était un ensemble de statuts définissant l’étendue des pouvoirs et des obligations du monarque envers la Lituanie et son peuple. Si elle était approuvée, elle constituerait un corpus juridique garantissant une transition stable du pouvoir. Toutefois, certains estiment qu’en réalité, elle vise à limiter l’autorité du monarque."
LIT_kaunas_conference:0 "Conférence de Kaunas"
LIT_kaunas_conference_desc:0 "Avec le soutien de l’Allemagne, il serait sans doute plus facile de reprendre Vilnius aux occupants étrangers."
LIT_vilnius_procession:0 "Procession royale à Vilnius"
LIT_vilnius_procession_desc:0 "Maintenant que Vilnius est enfin revenue légitimement en mains lituaniennes, nous montrerons à tout le peuple le succès de notre roi !"
LIT_royal_legacy:0 "Héritage royal"
LIT_german_capital:0 "Capital allemand"
LIT_german_capital_desc:0 ""
LIT_german_railworks_integrated:0 "Unifier l’écartement ferroviaire allemand"
LIT_german_railworks_integrated_desc:0 ""
LIT_expand_to_markets:0 "S’ouvrir aux marchés"
LIT_expand_to_markets_desc:0 "Historiquement, nos exportations étaient tournées vers le marché intérieur, limitant notre croissance. En négociant activement des accords de libre-échange avec nos voisins, nous pourrons ouvrir de nouveaux débouchés à nos produits et entreprises."
LIT_support_domestic_entrepreneurs:0 "Soutenir les entrepreneurs locaux"
LIT_support_domestic_entrepreneurs_desc:0 ""
LIT_integrate_lithuanian_rail_network:0 "Intégrer le réseau ferré lituanien"
LIT_integrate_lithuanian_rail_network_desc:0 "La majorité de nos lignes ferroviaires utilisent encore l’écartement de 1524 mm, alors que notre principal partenaire commercial, l’Allemagne, utilise le standard de 1435 mm. Les trains de marchandises doivent donc subir des retards coûteux à Klaipėda avant de poursuivre leur route. Passer au 1435 mm ouvrirait la Lituanie à davantage de marchés allemands et européens."
LIT_mercedes_benz_engine_plant:0 "Usine de moteurs Mercedes-Benz"
LIT_mercedes_benz_engine_plant_desc:0 ""
LIT_new_idea_available_tank:0 "\nNouveau §Yconcepteur de chars§! disponible :\n"
LIT_db_six_hundred:0 "DB 600"
LIT_db_six_hundred_desc:0 "La série de moteurs Daimler-Benz DB 600 est le propulseur principal de la plupart des chasseurs et bombardiers de la Luftwaffe. Stuttgart a exprimé son intérêt pour un transfert de savoir-faire technique en échange de l’expansion de ses implantations industrielles en Lituanie."
LIT_three_thousand:0 "L3000"
LIT_three_thousand_desc:0 "Le L3000 devint l’épine dorsale du réseau logistique de la Wehrmacht. Sa conception robuste et simple le rendait facile à entretenir et réparer. En raison de pénuries de diesel et de la volonté d’uniformiser la production, l’état-major allemand a cessé sa fabrication, laissant un stock important sans acquéreur. Peut-être accepteraient-ils de céder ces camions à la Lituanie."
LIT_cult_of_vytautas_the_great:0 "Culte de Vytautas le Grand"
LIT_legacy_of_mindaugas:0 "Héritage de Mindaugas Ier"
LIT_gediminas_heritage:0 "Héritage de Gediminas"
LIT_solicit_ratikiss_support:0 "Solliciter le soutien de Ratikis"
LIT_solicit_ratikiss_support_desc:0 "Maréchal décoré et opposant au régime actuel, son ralliement renforcerait notre position face au pouvoir en place lors des élections à venir."
LIT_hold_fair_elections:0 "Organiser des élections libres"
LIT_hold_fair_elections_desc:0 "La tentative de Smetona de nommer un gouvernement loyal a échoué. Le moment est venu de tenir de véritables élections et de réintroduire la démocratie en Lituanie."
LIT_the_4th_president:0 "Le 4e président"
LIT_the_4th_president_desc:0 "Les élections étant terminées, il est clair que le peuple souhaite voir l’ancien Premier ministre Leonas Bistras diriger la Lituanie."
LIT_reinforce_czechoslovak_ties:0 "Renforcer les liens avec la Tchécoslovaquie"
LIT_reinforce_czechoslovak_ties_desc:0 "La Tchécoslovaquie reste notre principal fournisseur d’armes et une destination privilégiée pour la formation de nos jeunes officiers. Comme nous, elle est menacée par l’expansionnisme allemand. Un rapprochement diplomatique et militaire serait bénéfique."
LIT_propose_a_baltic_union:0 "Proposer une Union baltique"
LIT_propose_a_baltic_union_desc:0 "Bien que nos peuples soient différents, il existe depuis toujours une fraternité entre les nations baltes. Il est temps de mettre de côté nos différences pour assurer notre survie commune."
LIT_liberalization_of_trade_policies:0 "Libéraliser les politiques commerciales"
LIT_liberalization_of_trade_policies_desc:0 "Pour dynamiser notre économie et renforcer nos industries, nous devons libéraliser nos politiques commerciales. En réduisant tarifs et barrières, nous offrirons un environnement plus favorable aux entreprises."
LIT_privatise_lithuanian_railroads:0 "Privatiser les chemins de fer lituaniens"
LIT_privatise_lithuanian_railroads_desc:0 "La privatisation des chemins de fer est essentielle pour redynamiser notre secteur des transports. En transférant leur propriété à des acteurs privés, nous attirerons investissements et innovations, modernisant ainsi l’infrastructure et le matériel roulant."
LIT_model_capitalist_society:0 "Société capitaliste modèle"
LIT_model_capitalist_society_desc:0 "La Lituanie est devenue une société capitaliste exemplaire grâce à des réformes profondes favorisant le laissez-faire et l’économie néoclassique. Ces politiques ont créé un environnement propice à l’entrepreneuriat et à l’innovation, permettant aux entreprises de prospérer avec une ingérence minimale de l’État."
LIT_remove_martial_law:0 "Lever la loi martiale"
LIT_remove_martial_law_desc:0 "Avec les élections terminées et l’avenir politique du pays assuré, la loi martiale n’a plus lieu d’être."
LIT_amnesty_to_political_prisoners:0 "Amnistie pour les prisonniers politiques"
LIT_amnesty_to_political_prisoners_desc:0 "Maintenant que la démocratie est rétablie en Lituanie, il est temps de l’honorer en amnistiant les dissidents politiques."
LIT_remove_cencorship:0 "Abolir la censure"
LIT_remove_cencorship_desc:0 "L’Allemagne et l’Union soviétique censurent largement ce qui entre et sort de leurs pays. Nous ne suivrons pas cet exemple et garantirons la liberté de nos citoyens."
LIT_invest_in_public_education:0 "Investir dans l’éducation publique"
LIT_invest_in_public_education_desc:0 "Pour que la Lituanie soit prise au sérieux sur la scène internationale, nous devons disposer d’une population instruite qui œuvre à l’avenir de la nation."
LIT_preparing_for_the_inevitable:0 "Se préparer à l’inévitable"
LIT_preparing_for_the_inevitable_desc:0 "Les fascistes comme les communistes cherchent ouvertement à nous détruire. Nous ne pouvons compter sur personne pour défendre notre souveraineté. C’est pourquoi nous devons nous appuyer sur nous-mêmes pour préserver l’indépendance lituanienne."
LIT_continue_griniuss_presidency:0 "Poursuivre la présidence de Grinius"
LIT_continue_griniuss_presidency_desc:0 "Avant le coup d’État de 1926, Kazys Grinius était président de la Lituanie. Il est clair que le peuple souhaite le voir revenir à cette fonction."
LIT_contact_the_aurininkai:0 "Contacter les Aurininkai"
LIT_contact_the_aurininkai_desc:0 "Grinius a toujours défendu des politiques sociales en faveur des pauvres. Coopérer avec les Aurininkai renforcera la popularité des réformes sociales mises en place par le gouvernement."
LIT_social_welfare_focus:0 "Réformes de Grinius"
LIT_social_welfare_focus_desc:0 "De retour au pouvoir, Grinius entend introduire de nouvelles politiques sociales pour les plus pauvres."
LIT_griniuss_reforms_1:0 "Protection sociale"
LIT_subsidize_farmers:0 "Subventionner les agriculteurs"
LIT_subsidize_farmers_desc:0 "Les agriculteurs étant le pilier de la Lituanie, il est impératif de leur accorder des subventions ciblées. Ces investissements soutiendront leurs moyens de subsistance et stabiliseront leur production face aux chocs de marché qui ont souvent menacé leur viabilité."
LIT_council_of_lithuania_1:0 "Conseil de Lituanie"
LIT_council_of_lithuania_2:0 "Conseil de Lituanie"
LIT_empty_throne:0 "Trône vacant"
LIT_fragile_monarchy:0 "Monarchie fragile"
LIT_kings_party_idea:0 "Karaliaus Partija"
LIT_draw_closer_to_finland:0 "Se rapprocher de la Finlande"
LIT_draw_closer_to_finland_desc:0 "Même si nous avons moins de liens historiques avec la Finlande qu’avec l’Estonie, nous devons entretenir des relations positives avec Helsinki en espérant leur aide dans les conflits à venir."
LIT_draw_closer_to_sweden:0 "Se rapprocher de la Suède"
LIT_draw_closer_to_sweden_desc:0 "La démocratie s’étant implantée en Lituanie, nous devons rechercher le soutien d’autres démocraties solides comme la Suède."
LIT_form_a_baltic_alliance:0 "Former une alliance baltique"
LIT_form_a_baltic_alliance_desc:0 "Bien que nos peuples soient différents, il existe une fraternité de longue date entre les nations baltes. Il est temps de mettre nos différences de côté pour assurer notre survie."
LIT_join_northern_lights:0 "Rejoindre Northern Lights"
LIT_join_northern_lights_desc:0 "Nos alliés démocratiques du nord organisent un pacte d’assistance mutuelle. Nous devons tenter de rejoindre cette alliance bénéfique."
LIT_join_allies:0 "Rejoindre les Alliés"
LIT_join_allies_desc:0 "Le Royaume-Uni reste l’une des rares grandes démocraties d’Europe. Nous devrions solliciter une invitation formelle aux Alliés."
LIT_research_cooperative:0 "Coopérative de recherche"
LIT_research_cooperative_desc:0 "Nos avancées technologiques ont été significatives ces dernières années, mais nous avons encore beaucoup à apprendre de nos alliés. Encourageons-les à partager leur savoir en échange du nôtre."
LIT_lcp_resurgence:0 "Renaissance du PCL"
LIT_lcp_resurgence_desc:0 "Fondé en 1918, le Parti communiste lituanien a été interdit presque dès sa création. L’instabilité actuelle liée aux prochaines élections est l’occasion idéale d’organiser une révolution semblable à celle de Russie pour renverser la dictature en place !"
LIT_preparing_for_the_uprising:0 "Préparer le soulèvement"
LIT_preparing_for_the_uprising_desc:0 "Pour réussir notre révolution, nous devons obtenir non seulement le soutien du peuple, mais aussi, dans la mesure du possible, celui de l’Union soviétique."
LIT_launch_the_revolution:0 "Lancer la révolution"
LIT_launch_the_revolution_desc:0 "Avec nos soutiens assurés, le moment est venu de déclencher la révolution et d’entraîner la Lituanie dans une nouvelle ère !"
LIT_collectivisation:0 "Collectivisation"
LIT_collectivisation_desc:0 "Comme toute révolution communiste, la nôtre doit collectiviser les terres pour améliorer les conditions de travail et accroître la production nationale."
LIT_industrialisation:0 "Industrialisation"
LIT_industrialisation_desc:0 "Depuis sa création, la Lituanie est restée faiblement industrialisée. Il est temps que le prolétariat change cet état de fait."
LIT_urbanisation:0 "Urbanisation"
LIT_urbanisation_desc:0 "La transition vers l’urbanisation est essentielle pour l’État socialiste naissant. En déplaçant la population rurale vers les villes, nous créons une main-d’œuvre efficace et apte à industrialiser le pays et à nous libérer des marchés capitalistes oppresseurs."
LIT_new_lithuania:0 "La Nouvelle Lituanie"
LIT_new_lithuania_desc:0 "Avec la propagation de l’image révolutionnaire en Lituanie, il est clair que notre révolution a réussi et nous a placés aux côtés des autres États communistes grandissants."
LIT_socialist_science:0 "Science socialiste"
LIT_socialist_science_desc:0 "Les scientifiques soviétiques ont déjà prouvé que la science communiste favorisait les inventions révolutionnaires. Suivons leur exemple et soutenons le mouvement scientifique naissant en Lituanie."
LIT_academy_of_sciences:0 "Fonder l’Académie des sciences lituanienne"
LIT_academy_of_sciences_desc:0 "La Société scientifique lituanienne plaide depuis longtemps pour une académie des sciences. Nous devons soutenir cette idée avec des fonds publics."
LIT_join_comintern:0 "Rejoindre le Komintern"
LIT_join_comintern_desc:0 "Avec l’Union soviétique si proche, il est naturel que nous cherchions à rejoindre l’Internationale communiste."
LIT_join_ussr:0 "Rejoindre l’Union"
LIT_join_ussr_desc:0 "Nos liens étroits avec l’URSS et notre passé de domination russe rendent logique une demande d’intégration en tant que RSS au sein de l’Union soviétique."
LIT_peoples_army:0 "Armée populaire"
LIT_peoples_army_desc:0 "L’état-major actuel est gangrené par des éléments bourgeois et contre-révolutionnaires. Une réorganisation massive est nécessaire pour que l’armée incarne les principes révolutionnaires, se transformant en Armée populaire lituanienne, garante du socialisme et prête à défendre le pays contre toute menace extérieure."
LIT_reintegrate_lit_minor:0 "Réintégrer la Lituanie Mineure"
LIT_reintegrate_lit_minor_desc:0 "Avec la menace allemande écartée, nous devons intégrer Königsberg et sa minorité lituanienne dans la Lituanie proprement dite."
LIT_red_volunteers:0 "Volontaires rouges"
LIT_red_volunteers_desc:0 ""
LIT_spread_the_revolution:0 "Exporter la révolution"
LIT_spread_the_revolution_desc:0 "Sans être trotskistes, nous reconnaissons qu’il y a du vrai dans l’idée de « révolution permanente ». Nous devons chercher à répandre le communisme à nos voisins."
LIT_red_latvia:0 "Nos voisins du nord"
LIT_red_latvia_desc:0 "Le peuple letton souffre sous une dictature. Il est temps de les libérer et de les intégrer à l’Internationale communiste."
LIT_red_estonia:0 "Marcher sur Tallinn"
LIT_red_estonia_desc:0 "La révolution lettone a réussi et nous sommes en bonne voie de former une union balte prolétarienne. Le moment est venu d’apporter la révolution au peuple estonien opprimé."
LIT_empower_litvak_community:0 "Valoriser la communauté lituano-juive"
LIT_empower_litvak_community_desc:0 "Une petite communauté juive, présente depuis l’époque du Grand-Duché, a trop longtemps été négligée à cause des préjugés nationalistes. Notre doctrine socialiste doit reconnaître et valoriser sa contribution à la société lituanienne."
LIT_empower_litvak_community_idea:0 "Valoriser la communauté lituano-juive"
LIT_anti_fascist_legions_idea:0 "Légions antifascistes"

