LIT_constitutional_loophole:0 "Vide constitutionnel sur la capitale"
LIT_constitutional_loophole_desc:0 "Notre capitale Kaunas est temporaire depuis des décennies, depuis que la Pologne a occupé notre capitale historique Vilnius en octobre 1920 lors de l’opération dite « Żeligowski ». Comme la question n’a jamais été réglée par nous ni par une tierce partie telle que la §YLigue des Nations§!, notre constitution stipule que Vilnius reste notre capitale de jure."
