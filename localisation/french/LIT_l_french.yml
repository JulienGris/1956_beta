 LIT_skirpas_coup:0 "Coup d’État de Škirpa"
 LIT_skirpas_coup_desc:0 "Très insatisfait de la neutralité et de la position pro-soviétique de Smetona, le colonel Škirpa a utilisé son poste de représentant en Allemagne pour coordonner une prise de pouvoir soutenue par les Allemands. Avec le Front des activistes lituaniens, nous pouvons forcer la destitution de Smetona, marquant la fin de son règne et l’avènement d’un nouveau gouvernement nationaliste."
 LIT_seek_accommodation_with_germany:0 "Chercher un accommodement avec l’Allemagne"
 LIT_seek_accommodation_with_germany_desc:0 "L’Allemagne convoitant ouvertement certaines de nos terres, nous devons tenter d’engager Berlin afin de préserver notre souveraineté."
 LIT_join_axis:0 "Rejoindre l’Axe"
 LIT_join_axis_desc:0 "Nos relations étant désormais solidifiées avec l’Allemagne, il est temps de demander notre adhésion à l’Axe."
 LIT_economic_battle_in_progress_flag:0 "Mène déjà une autre bataille économique."
