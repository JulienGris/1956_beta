LIT_root_out_communists:0 "Éradiquer les communistes"
LIT_root_out_communists_desc:0 "L’Union soviétique est l’une des plus grandes menaces pour la paix et la sécurité en Europe. Nous devons éradiquer le communisme en Lituanie afin de ne pas tomber sous son joug."
LIT_root_out_fascists:0 "Éradiquer les fascistes"
LIT_root_out_fascists_desc:0 "L’Italie et l’Allemagne flirtent ouvertement avec le fascisme et cherchent à exporter ces idées. Nous devons persécuter ceux qui cherchent à les implanter en Lituanie."
