#Events
 LIT_event.1.t:0 "Victoire communiste"
 LIT_event.1.d:0 "À la suite de leur victoire aux élections, le Parti communiste de Lituanie est désormais propulsé à la tête du pays. Inattendu pour une grande partie de la population, le nouveau gouvernement tranche avec tous ceux que la Lituanie a connus : bien plus radical et déterminé à transformer l’économie vers le communisme. La Lituanie ouvre un tout nouveau chapitre de son histoire."
 LIT_event.1.a:0 "En route vers le XXe siècle"
 LIT_event.2.t:0 "Les forces armées [SOV.getAdjective] se retirent de Vilnius"
 LIT_event.2.desc:0 "Après leur pacte avec les Allemands concernant le sort de la Pologne, [SOV.getleader] considéra à juste titre que Vilnius ne faisait pas partie de la Pologne et nous remit donc le contrôle de notre capitale et de ses environs.\n\nUn grand arc a été érigé pour accueillir nos forces armées, et la population lituanienne acclame nos troupes défilant dans les rues. Les autres communautés, elles, sont soulagées d’échapper à la domination [SOV.getAdjective]."
 LIT_event.2.a:0 "Quel grand jour !"
 lithuania_purchase_ships.1.t:0 "[From.GetNameDefCap] cherche à acheter des navires [Root.GetAdjective]"
 lithuania_purchase_ships.1.desc:0 "Le gouvernement [From.GetAdjective], conscient de son manque de marine appropriée, a soumis un appel d’offres pour acheter des navires [Root.GetAdjective]. Si nous acceptons de construire les navires demandés, ils nous fourniront des biens utiles à nos propres fins."
 lithuania_purchase_ships.1.a:0 "Cela profitera à nous deux."
 lithuania_purchase_ships.1.a_tt:0 "Nous recevrons §Y1§! usine civile hors carte en paiement une fois que [POR.GetNameDefCap] choisira un accord."
 lithuania_purchase_ships.1.b:0 "Cela ne nous intéresse pas."
 lithuania_purchase_ships.2.t:0 "[From.GetNameDefCap] accepte de construire nos navires"
 lithuania_purchase_ships.2.desc:0 "Le gouvernement [From.GetAdjective] a accepté de construire des navires pour la marine [Root.GetAdjective]. Ils ont proposé deux offres différentes parmi lesquelles nous devons choisir."
 lithuania_purchase_ships.2.a:0 "Acheter des sous-marins."
 lithuania_purchase_ships.2.b:0 "Acheter des destroyers."
 lithuania_purchase_ships.3.t:0 "[From.GetNameDefCap] refuse de construire nos navires"
 lithuania_purchase_ships.3.desc:0 "[From.GetNameDefCap] a rejeté notre proposition d’acheter des navires [From.GetNameDefCap] pour notre marine.\nNous devrons chercher d’autres pays prêts à accepter, ou développer nos propres installations navales afin de ne dépendre d’aucune puissance étrangère pour bâtir une puissante flotte [Root.GetAdjective]."
 lithuania_purchase_ships.3.a:1 "Nous nous débrouillerons sans eux."
 lithuania_purchase_ships.4.t:0 "Construction terminée – Sous-marins"
 lithuania_purchase_ships.4.desc:0 "Après presque un an de chantier, les trois sous-marins commandés ont passé plusieurs essais en mer et sont enfin prêts à être officiellement incorporés dans la marine.\nLes bâtiments sont amarrés dans un port [Root.GetAdjective], et leurs équipages attendent les ordres."
 lithuania_purchase_ships.4.a:0 "Parfait"
 lithuania_purchase_ships.4.a_tt:0 "Trois sous-marins ajoutés à la flotte de réserve"
 lithuania_purchase_ships.5.t:0 "Construction terminée – Destroyers"
 lithuania_purchase_ships.5.desc:0 "Après presque un an de chantier, les deux destroyers commandés ont passé plusieurs essais en mer et sont enfin prêts à être officiellement incorporés dans la marine.\nLes bâtiments sont amarrés dans un port [Root.GetAdjective], et leurs équipages attendent les ordres."
 lithuania_purchase_ships.5.a:0 "Parfait"
 lithuania_purchase_ships.5.a_tt:0 "Deux destroyers ajoutés à la flotte de réserve"
 lithuania.10.t:0 "Indignation publique"
 lithuania.10.desc:0 "Notre incapacité à organiser les élections promises a provoqué un immense tollé de l’opposition, plaçant le pays au bord de la guerre civile. Nous devons agir rapidement pour réprimer cette indignation."
 lithuania.10.a:0 "Envoyer l’armée"
 lithuania.10.b:0 "Lâcher les Voldemarininkai"
 lithuania.12.t:0 "Les voldemaristes rétablissent l’ordre"
 lithuania.12.desc:0 "Les membres de l’organisation Voldemarininkai, que nous avions lancés contre l’opposition, ont violemment réprimé les dissidents, et la situation semble relativement stable."
 lithuania.12.a:0 "Bien, débarrassons-nous d’eux maintenant"
 lithuania.13.t:0 "[Root.GetDateText] sanglant"
 lithuania.13.desc:0 "Notre décision d’envoyer l’armée pour réprimer les dissidents a causé de lourdes pertes civiles, ce qui nuit gravement à la stabilité du pays et entraîne la démission de nombreux officiers."
 lithuania.13.a:0 "Malheureux"
 lithuania.14.t:0 "Coup d’État des Voldemarininkai"
 lithuania.14.desc:0 "Il s’avère que les Voldemarininkai n’ont pas apprécié d’être dissous de force. En représailles, les voldemaristes et des officiers militaires sympathisants ont tenté un coup d’État et renversé le gouvernement. Le président Smetona a fui le pays, laissant de fait Juozas Tūbelis au pouvoir, qui a aussitôt présenté sa démission."
 lithuania.14.a:0 "L’aube d’une nouvelle ère"
 lithuania.15.t:0 "Gouvernement bourgeois renversé"
 lithuania.15.desc:0 "Nous avons réussi à renverser notre gouvernement oppressif. Vive le prolétariat !"
 lithuania.15.a:0 "L’aube d’une nouvelle ère"
 lithuania.16.t:0 "Coup d’État raté"
 lithuania.16.desc:0 "Nous avons échoué à renverser notre gouvernement oppressif. Les forces armées se sont mobilisées et le pays est entré en guerre civile."
 lithuania.16.a:0 "La révolution triomphera"
 lithuania.17.t:0 "Les communistes lituaniens demandent de l’aide"
 lithuania.17.desc:0 "Nos camarades lituaniens prévoient de renverser leur gouvernement et nous demandent de l’aide sous forme d’équipements et de fournitures. S’ils réussissent, la Lituanie deviendra sûrement une amie proche du prolétariat."
 lithuania.17.a:0 "Leur accorder une aide abondante"
 lithuania.17.b:0 "Soutenir leur cause"
 lithuania.17.c:0 "Ils ont nos meilleurs vœux"
 lithuania.18.t:0 "L’URSS nous abandonne"
 lithuania.18.desc:0 "Le gouvernement soviétique a notifié à Sniečkus qu’aucune arme ne nous serait fournie."
 lithuania.18.a:0 "Traîtres"
 lithuania.19.t:0 "Élections du 4ᵉ Seimas"
 lithuania.19.desc:0 "La date limite des élections du 4ᵉ Seimas est passée, les votes ont été comptés et le vainqueur est désigné."
 lithuania.19.a:0 "Victoire des démocrates-chrétiens"
 lithuania.19.b:0 "Victoire des sociaux-démocrates"
 lithuania.21.t:0 "Le Loup de Fer devient hors de contrôle"
 lithuania.21.desc:0 "Les affrontements entre organisations idéologiques opposées, minorités ethniques et membres du Loup de Fer sont fréquents. Ce que nous pensions être une simple échauffourée a dégénéré en émeute généralisée : des centaines de personnes, voldemaristes comme civils, s’affrontent violemment dans tout Kaunas avec diverses minorités. L’émeute ne cesse de prendre de l’ampleur et de la violence. Sans intervention, les conséquences pourraient être monstrueuses."
 lithuania.21.a:0 "Ne pas intervenir"
 lithuania.21.b:0 "Intervenir"
 lithuania.22.t:0 "Pogrom de Kaunas"
 lithuania.22.desc:0 "Ce qui avait commencé comme une rixe limitée à un quartier a totalement dégénéré en une émeute d’une violence jamais vue en Lituanie. Nous n’avons pas encore décompté les victimes, mais nous estimons qu’au moins plusieurs milliers de personnes sont mortes dans ce massacre."
 lithuania.22.a:0 "Ils l’avaient bien cherché"
 lithuania.23.t:0 "Incident de Kaunas"
 lithuania.23.desc:0 "Contrairement aux autres fois où nous utilisions le Loup de Fer pour réprimer les dissidents, cette fois, c’est lui que nous avons dû réprimer avec l’armée. Celle-ci a rapidement mis fin aux affrontements, mais au prix de la vie de nos concitoyens et d’une perte de soutien populaire."
 lithuania.23.a:0 "Quel gâchis"
 lithuania.27.t:0 "Commission du LNP"
 lithuania.27.desc:0 "La première commission du LNP a marqué une nouvelle étape dans l’histoire de la Lituanie, et il est important d’en définir l’avenir."
 lithuania.27.a:0 "Renforcer l’aile patriotique"
 lithuania.27.b:0 "Renforcer l’aile radicale"
 lithuania.31.t:0 "Électrifier la Lituanie"
 lithuania.31.desc:0 "L’électrification est cruciale pour la croissance économique, l’industrialisation et la sécurité nationale de notre pays. Mais les monopoles étrangers bloquent l’accès à une électricité bon marché, siphonnant l’argent des travailleurs lituaniens. Deux options s’offrent à nous : installer plusieurs centrales au charbon, ce qui augmenterait l’offre mais nous forcerait à importer d’énormes quantités de charbon étranger ; ou bien tenter de construire une centrale hydroélectrique à la confluence du Niémen. Un tel exploit n’a jamais été tenté en Lituanie et nécessiterait une recherche de partenaires diplomatiques à l’étranger."
 lithuania.31.a:0 "À quoi sert la puissance sans charbon ?"
 lithuania.31.b:0 "Nous ne pouvons pas prendre de risques"
 lithuania.32.t:0 "Problèmes financiers"
 lithuania.32.desc:0 "Nous rencontrons d’importantes difficultés financières dans notre projet d’électrification. Nous pourrions y investir davantage, mais risquer de tout perdre si le projet échouait. En revanche, si nous abandonnons maintenant, ce serait un désastre politique."
 lithuania.32.a:0 "Nous devons tenir bon"
 lithuania.32.b:0 "Abandonner le projet"
 lithuania.33.t:0 "Projet abandonné"
 lithuania.33.desc:0 "L’augmentation des coûts du projet nous a contraints à l’abandonner et à démanteler ce qui avait été entrepris."
 lithuania.33.a:0 "Il le faut"
 lithuania.34.t:0 "Projet achevé"
 lithuania.34.desc:0 "Malgré les dépenses engendrées, nous avons réussi à le mener à terme dans les délais."
 lithuania.34.a:0 "Parfait"
 lithuania.35.t:0 "Un coup de main"
 lithuania.35.desc:0 "Avant de commencer les travaux, nous devons décider si nous entreprendrons ce projet seuls ou avec une aide étrangère."
 lithuania.35.a:0 "Nous sommes capables seuls"
 lithuania.35.b:0 "Chercher des investisseurs en Italie"
 lithuania.36.t:0 "La Lituanie demande du soutien"
 lithuania.36.desc:0 "L’ambassade lituanienne à Rome nous a contactés avec une proposition d’aide à la construction d’une centrale hydroélectrique à Kaunas. Cela pourrait être une bonne occasion de soutenir nos alliés idéologiques du nord mais, d’un autre côté, compte tenu de la distance, cela serait assez coûteux."
 lithuania.36.a:0 "Les aider"
 lithuania.36.b:0 "Refuser"
 lithuania.48.t:0 "Les Italiens acceptent"
 lithuania.48.desc:0 "Le consulat italien de Kaunas a annoncé sa volonté de soutenir la construction d’une centrale hydroélectrique."
 lithuania.48.a:0 "Parfait"
 lithuania.49.t:0 "[FROM.Capital.GetName] refuse de nous soutenir"
 lithuania.49.desc:0 "Le consulat [From.GetAdjective] à [ROOT.Capital.GetName] nous a notifié son refus de soutenir notre entreprise."
 lithuania.49.a:0 "Nous nous en sortirons seuls"
 lithuania.37.t:0 "Problèmes financiers"
 lithuania.37.desc:0 "Nous avons rencontré d’importants problèmes financiers au cours de notre projet d’électrification. Nous pourrions investir davantage de ressources, mais risquerions de tout perdre si le projet échouait. En revanche, si nous nous retirons maintenant, cela pourrait tourner au désastre politique."
 lithuania.37.b:0 "Nous devons tenir bon"
 lithuania.37.a:0 "Abandonner le projet"
 lithuania.38.t:0 "Catastrophe sur le Niémen"
 lithuania.38.desc:0 "La centrale hydroélectrique que nous construisions s’est effondrée, provoquant une inondation désastreuse qui a gravement endommagé Kaunas."
 lithuania.38.a:0 "C’était une erreur"
 lithuania.39.t:0 "Rapport d’avancement"
 lithuania.39.desc:0 "Les travaux sur la centrale hydroélectrique se déroulent bien, les tâches les plus difficiles étant achevées. Nous prévoyons de terminer d’ici deux ans."
 lithuania.39.a:0 "Grand succès"
 lithuania.40.t:0 "Centrale hydroélectrique achevée"
 lithuania.40.desc:0 "Les travaux sur la centrale hydroélectrique sont terminés, le projet est achevé et pleinement opérationnel. Cela produira une grande quantité d’électricité sans avoir besoin d’importer du charbon."
 lithuania.40.a:0 "Grand succès"
 lithuania.41.t:0 "Bataille des naissances"
 lithuania.41.desc:0 "La Lituanie, malgré toute sa grandeur, se trouve au bord d’une crise démographique. Les difficultés à assimiler les minorités et le faible taux de croissance de la population représentent une grande menace pour l’avenir de notre pays. Nous devons donc faire tout notre possible pour encourager la croissance des familles lituaniennes."
 lithuania.41.a:0 "Mettons-nous au travail"
 lithuania.42.t:0 "Rencontre avec Grinius"
 lithuania.42.desc:0 "Lorsque le programme nataliste a été annoncé, beaucoup de ceux qui avaient rédigé les politiques prévues envisageaient un certain nombre de mesures visant à accroître la population : promotion des valeurs familiales traditionnelles, renvoi des femmes des industries publiques, taxation des célibataires, promotions réservées aux hommes mariés et bien plus encore. Ces idées furent fortement critiquées par notre ancien président qui, malgré son mépris pour notre idéologie, proposa des politiques alternatives axées sur la réduction de la mortalité infantile et maternelle ainsi que la mise en place de crèches gratuites. Cela vise à atteindre la croissance démographique sans restreindre les droits civiques des femmes."
 lithuania.42.a:0 "Accepter les réformes de Grinius"
 lithuania.42.b:0 "Rejeter les réformes de Grinius"
 lithuania.43.t:0 "Indignation du parti"
 lithuania.43.desc:0 "La connaissance de la contribution du président Grinius aux politiques prévues a provoqué une indignation massive au sein du parti. Beaucoup ont affirmé que cela menaçait de socialiser la Lituanie et représentait une tentative d’infiltration bolchevique. Malgré l’absurdité de ces accusations, si nous allons de l’avant avec ces réformes, nous risquons de provoquer des divisions politiques."
 lithuania.43.a:0 "Ignorer le mécontentement"
 lithuania.43.b:0 "Revenir sur les réformes"
 lithuania.44.t:0 "Politiques natalistes rédigées"
 lithuania.44.desc:0 "Nous avons finalisé nos réformes destinées à accroître la croissance démographique de notre pays, que nous avons calquées sur des réformes similaires adoptées en Italie."
 lithuania.44.a:0 "Grand succès"
 lithuania.45.t:0 "Réformes de santé et de garde d’enfants rédigées"
 lithuania.45.desc:0 "Nous avons finalisé nos réformes visant à accroître la croissance démographique de notre pays en réduisant la mortalité infantile et maternelle. Ces réformes ont été vivement critiquées et doivent encore prouver leur efficacité."
 lithuania.45.a:0 "Nous avons pris la bonne décision"
 lithuania.46.t:0 "Les réformes de santé portent leurs fruits"
 lithuania.46.desc:0 "Nos réformes se sont révélées extrêmement fructueuses : nous avons observé une augmentation de la croissance démographique et, en prime, une participation accrue des femmes aux affaires économiques et militaires de notre pays."
 lithuania.46.a:0 "Grand succès"
 lithuania.47.t:0 "L’URSS nous fournit du matériel"
 lithuania.47.desc:0 "L’URSS nous a fourni le matériel nécessaire pour renverser Smetona."
 lithuania.47.a:0 "Excellente nouvelle !"
 lithuania.80.t:0 "La Lituanie propose une coopération accrue"
 lithuania.80.desc:0 "Aujourd’hui, un émissaire [LIT.GetAdjective] est arrivé à [Root.Capital.GetName], proposant l’établissement d’une zone économique spéciale entre nos deux nations. Cela pourrait mener à une intégration économique partielle ainsi qu’à l’expansion des industries [Root.GetAdjective] sur leur marché, mais il existe aussi une menace de céréales [LIT.GetAdjective] bon marché qui pourraient évincer les agriculteurs locaux."
 lithuania.80.a:0 "Une intégration économique accrue profitera à tous !"
 lithuania.80.b:0 "Nous ne pouvons accepter une telle offre."
 lithuania.81.t:0 "Le [From.Owner.GetName] accepte la coopération économique"
 lithuania.81.desc:0 "L’ambassadeur étranger [From.Owner.GetAdjective] a répondu favorablement, exprimant son intérêt pour notre proposition. Nous devrions immédiatement commencer à resserrer nos liens."
 lithuania.81.a:0 "Que le libre-échange profite à tous !"
 lithuania.82.t:0 "Le [From.Owner.GetName] refuse la coopération économique"
 lithuania.82.desc:0 "L’ambassadeur étranger [From.Owner.GetAdjective] a rejeté toute proposition d’intégration économique accrue avec notre nation."
 lithuania.82.a:0 "Quel dommage."
 lithuania.90.t:0 "La Lituanie exige Vilnius"
 lithuania.90.d:0 "Notre ambassade en France a reçu un ultimatum de plusieurs diplomates lituaniens exigeant le contrôle de la région de Vilnius."
 lithuania.90.a:0 "Nous n’avons pas le choix"
 lithuania.90.b:0 "Qu’ils viennent"
 lithuania.91.t:0 "Le [From.Owner.GetName] accepte"
 lithuania.91.d:0 "Nos exigences ont été satisfaites et notre ennemi a cédé le contrôle de Vilnius et des territoires environnants."
 lithuania.91.a:0 "Excellente nouvelle"
 lithuania.92.t:0 "Le [From.Owner.GetName] refuse"
 lithuania.92.d:0 "Nos exigences n’ont pas été satisfaites et notre ennemi a renforcé sa présence militaire à Vilnius et dans les territoires environnants."
 lithuania.92.a:0 "Cette décision aura de graves conséquences"
 lithuania.93.t:0 "Opération désastreuse"
 lithuania.93.d:0 "Nos troupes ont subi de lourdes pertes et n’ont pas réussi à capturer de territoire significatif ni Vilnius."
 lithuania.93.a:0 "C’est impossible !"
 lithuania.94.t:0 "Opération réussie"
 lithuania.94.d:0 "Nos troupes ont capturé Vilnius et les territoires environnants, infligeant de lourdes pertes à nos ennemis. Avec Vilnius fermement sous notre contrôle et nos ennemis brisés, nous devons décider de la suite à donner."
 lithuania.94.a:0 "Hissons notre drapeau sur la tour de Gediminas"
 lithuania.94.b:0 "Nous devons nous préparer à une riposte polonaise"
 lithuania.95.t:0 "Opération infructueuse"
 lithuania.95.d:0 "Nos troupes ont réalisé des gains significatifs et subi peu de pertes, mais n’ont pas réussi à capturer Vilnius. Nous devons décider de la suite à donner."
 lithuania.95.a:0 "Se préparer à une riposte polonaise"
 lithuania.95.b:0 "Nous devons frapper maintenant !"
 lithuania.96.t:0 "Wilno saisi"
 lithuania.96.d:0 "Nos garnisons à Wilno ont été mises en déroute par une attaque surprise lituanienne traîtresse. Nous devons décider de la suite à donner."
 lithuania.96.a:0 "Laissons-leur"
 lithuania.96.b:0 "Intolérable !"
 lithuania.97.t:0 "Les Lituaniens repoussés"
 lithuania.97.d:0 "Nos braves soldats en garnison à Wilno ont repoussé et mis en déroute une attaque surprise lituanienne. Nous devons décider de la suite à donner. Nous pourrions venger cette trahison en frappant la Lituanie pour prévenir toute incursion future, ou bien utiliser cette victoire et notre nouvelle position de force pour négocier un accord fructueux et rediriger nos précieuses ressources ailleurs."
 lithuania.97.a:0 "Exiger une résolution diplomatique"
 lithuania.97.b:0 "Frapper tant qu’ils sont faibles"
 lithuania.98.t:0 "Attaque surprise lituanienne"
 lithuania.98.d:0 "Nos garnisons stationnées à la frontière lituanienne ont été repoussées par une attaque surprise, mais ont tenu aux abords de Wilno, infligeant de lourdes pertes à nos ennemis. Nous devons décider de la suite à donner. Nous pourrions venger cette trahison en frappant la Lituanie et empêcher toute future incursion, tenter de négocier un accord et rediriger nos ressources ailleurs, ou parvenir au même résultat en maintenant le statu quo."
 lithuania.98.a:0 "Maintenir le statu quo"
 lithuania.98.b:0 "Exiger une résolution diplomatique"
 lithuania.98.c:0 "C’est une raison suffisante pour la guerre"
 lithuania.99.t:0 "La Pologne exige une résolution diplomatique"
 lithuania.99.d:0 "À la lumière de notre récente attaque, le gouvernement polonais exige une résolution diplomatique à la crise en cours."
 lithuania.99.a:0 "Accepter leurs exigences"
 lithuania.99.b:0 "Refuser leurs exigences"
 lithuania.100.t:0 "La Lituanie recule"
 lithuania.100.d:0 "Le gouvernement lituanien a accepté nos exigences et renoncé à toute revendication sur le territoire contesté."
 lithuania.100.a:0 "Parfait"
 lithuania.101.t:0 "La Lituanie ne recule pas"
 lithuania.101.d:0 "Le gouvernement lituanien a refusé nos exigences. Maintenant que nous les avons formulées, nous ne pouvons pas simplement reculer, car cela nous ferait paraître faibles."
 lithuania.101.a:0 "Déclarer la guerre"
lithuania.101.b:0 "Nous réglerons ça plus tard"
lithuania.102.t:0 "Collectivisation de la Banque centrale"
lithuania.102.d:0 "Au cours du processus de nationalisation et de collectivisation, nous avons rencontré une forte résistance de la part des banquiers bourgeois. Ils affirment que réduire le rôle de la banque centrale en tant qu’institution nuira à la stabilité de notre monnaie, mais en réalité, ils utilisent simplement le risque d’inflation comme prétexte pour accumuler l’argent de la classe ouvrière. Malgré tout, il est peut-être trop tôt pour prendre des mesures aussi drastiques."
lithuania.102.a:0 "Aucune exception pour cette vermine bourgeoise"
lithuania.102.b:0 "Leur accorder une autonomie politique"
lithuania.103.t:0 "Répression gouvernementale imminente"
lithuania.103.d:0 "Après la conclusion des récentes élections frauduleuses, une vague de dissidence et de débats politiques a déferlé sur la Lituanie, principalement au sein du gouvernement actuel et de son opposition démocratique. Cela, combiné à une économie stagnante, a créé un climat parfait pour une révolution. Nous avons donc commencé à préparer notre moment. Malgré tout, le gouvernement actuel a noté notre activité, mais reste trop occupé par les démocrates, qu’il considère comme une menace plus importante. Cela nous donne une fenêtre limitée pour réussir un coup d’État, espérons-le sans effusion de sang."
lithuania.103.a:0 "Nous devons nous dépêcher"
lithuania.104.t:0 "La Lituanie propose une alliance défensive"
lithuania.104.d:0 "La Lituanie est un partenaire proche : nombre de leurs officiers étudient dans les académies militaires tchécoslovaques et leurs forces armées utilisent du matériel tchécoslovaque. Compte tenu de la menace mutuelle que représente l’Allemagne pour nos pays, il n’a pas été surprenant qu’ils suggèrent de former un pacte défensif mutuel entre nos deux nations."
lithuania.104.a:0 "Excellente idée"
lithuania.104.b:0 "Nous ne pouvons pas nous permettre ce risque"
lithuania.105.t:0 "La Tchécoslovaquie accepte"
lithuania.105.d:0 "Le gouvernement tchécoslovaque a accepté la proposition de former un pacte défensif mutuel entre nos pays. Cette alliance garantira assurément notre sécurité."
lithuania.105.a:0 "Nous devons nous dépêcher"
lithuania.106.t:0 "La Tchécoslovaquie refuse"
lithuania.106.d:0 "Le gouvernement tchécoslovaque a rejeté la proposition de former un pacte défensif mutuel entre nos pays. C’est un choc, mais d’autres opportunités s’offriront à nous."
lithuania.106.a:0 "Dommage"
lithuania.107.t:0 "Remaniement du Conseil"
lithuania.107.desc:0 "De récentes accusations de falsification au sein du Conseil ont conduit à plusieurs démissions forcées d’anciens membres, laissant plusieurs sièges vacants. Nous devons maintenant décider quel groupe d’intérêts les occupera."
lithuania.107.a:0 "Ultranationalistes"
lithuania.107.b:0 "Anciens unionistes nationaux"
lithuania.107.c:0 "Démocrates-chrétiens"
lithuania.107.d:0 "Sociaux-démocrates"
lithuania.108.t:0 "Remaniement du Conseil"
lithuania.108.desc:0 "De récentes accusations de falsification au sein du Conseil ont conduit à quelques démissions forcées d’anciens membres, laissant quelques sièges vacants. Nous devons maintenant décider quel groupe d’intérêts les occupera."
lithuania.108.a:0 "Ultranationalistes"
lithuania.108.b:0 "Anciens unionistes nationaux"
lithuania.108.c:0 "Démocrates-chrétiens"
lithuania.108.d:0 "Sociaux-démocrates"
lithuania.109.t:0 "Les Voldémaristes quittent le Conseil en signe de protestation"
lithuania.109.d:0 "La proposition de restauration de la monarchie a été controversée parmi les membres du Conseil de Lituanie. Les Voldémaristes manquaient de confiance dans la monarchie. Lorsque le vote en faveur de la monarchie a été approuvé, cela a créé une fracture entre la droite et la gauche, entraînant la démission de plusieurs conseillers nationalistes en signe de protestation."
lithuania.109.a:0 "Bon débarras"
lithuania.110.t:0 "Les unionistes nationaux quittent le Conseil en signe de protestation"
lithuania.110.d:0 "La proposition de restauration de la monarchie a été controversée parmi les membres du Conseil de Lituanie. Les unionistes nationaux manquaient de confiance dans la monarchie. Lorsque le vote en faveur de la monarchie a été approuvé, cela a créé une fracture entre la droite et la gauche, entraînant la démission de plusieurs conseillers nationalistes en signe de protestation."
lithuania.110.a:0 "Bon débarras"
lithuania.111.t:0 "Les démocrates-chrétiens quittent le Conseil en signe de protestation"
lithuania.111.d:0 "La proposition de restauration de la monarchie a été controversée parmi les membres du Conseil de Lituanie. Les démocrates-chrétiens manquaient de confiance dans la monarchie. Lorsque le vote en faveur de la monarchie a été approuvé, cela a créé une fracture entre la droite et la gauche, entraînant la démission de plusieurs conseillers libéraux en signe de protestation."
lithuania.111.a:0 "Bon débarras"
lithuania.112.t:0 "Les sociaux-démocrates quittent le Conseil en signe de protestation"
lithuania.112.d:0 "La proposition de restauration de la monarchie a été controversée parmi les membres du Conseil de Lituanie. Les sociaux-démocrates manquaient de confiance dans la monarchie. Lorsque le vote en faveur de la monarchie a été approuvé, cela a créé une fracture entre la droite et la gauche, entraînant la démission de plusieurs conseillers libéraux en signe de protestation."
lithuania.112.a:0 "Bon débarras"
lithuania.113.t:0 "Le Conseil vote en faveur de la monarchie"
lithuania.113.d:0 "Des mois de débats enflammés, de négociations et d’intrigues se sont achevés. Le Conseil a voté en faveur de l’invitation de Karl Gero, duc d’Urach, à accepter la couronne lituanienne dans un royaume bientôt restauré. Karl Gero a accepté la proposition d’être élu, prenant le nom de règne de Mindaugas III.\n\nPour certains membres plus âgés de la société lituanienne, cela peut sembler étrangement familier : l’ascension de Mindaugas II fut très similaire, mais bien moins réussie."
lithuania.113.a:0 "Une nouvelle page de l’histoire lituanienne"
lithuania.114.t:0 "Intervention en Allemagne"
lithuania.114.d:0 "Nous avons beaucoup à gagner de la victoire du [GER.GetName] dans la guerre civile allemande et devons donc faire tout notre possible pour assurer leur succès dans le conflit actuel, ou du moins nous mettre de leur côté dès le début."
lithuania.114.a:0 "Intervenir aux côtés de [GER.GetName]"
lithuania.114.b:0 "Mieux vaut intervenir indirectement"
lithuania.114.c:0 "Nous avons déjà assez de soucis"
lithuania.115.t:0 "Commande du VK 30.01 (D)"
lithuania.115.d:0 "Le récent concours de chars en Allemagne pour le dernier modèle de char moyen a vu deux propositions : le VK 30.02(M) présenté par Maschinenfabrik Augsburg-Nürnberg et le VK 30.01(D) présenté par Daimler-Benz. Les deux modèles utilisaient une technologie de pointe répondant aux spécifications du département de l’armement (blindage incliné, grandes roues de route et canon saillant). Mais contrairement à la proposition de MAN, le VK 30.01(D) utilisait un moteur diesel avec réservoir externe largable et des ressorts à lames au lieu de la suspension à barres de torsion plus coûteuse. Le VK 30.01(D) aurait pu être moins cher et plus facile à produire, c’est pourquoi il avait d’abord été privilégié par le département de l’armement, qui en commanda 200 exemplaires.\n\nÀ un moment donné, le gouvernement allemand a préféré la tourelle plus spacieuse et la suspension plus moderne du prototype MAN, qui devint le Panzer V Panther, annulant la commande précédente. Depuis, Daimler-Benz a cherché des acheteurs pour son prototype. Le prince Wilhelm, qui avait déjà travaillé chez Daimler-Benz et possède des connexions en Allemagne, a négocié l’achat de ces chars à prix réduit, équipés du canon local L43 plutôt que du KwK 42 allemand."
lithuania.115.a:0 "Allons-y"
lithuania.115.b:0 "S’il n’a trouvé aucun acheteur, c’est qu’il y a une raison"
lithuania.115.c:0 "Nous avons déjà assez de soucis"
lithuania.116.t:0 "La Lituanie demande du soutien dans un différend"
lithuania.116.d:0 "La mission diplomatique lituanienne à Berlin a soumis une demande formelle mais confidentielle de soutien dans son différend territorial avec la Pologne au sujet de la région de Vilnius. Ils attendent notre réponse."
lithuania.116.a:0 "Leur accorder notre assurance carte blanche"
lithuania.116.b:0 "Proposer de servir de médiateur"
lithuania.116.c:0 "Rester en dehors de ce différend futile"
lithuania.117.t:0 "Un soutien limité arrive"
lithuania.117.d:0 "Notre demande d’aide financière et matérielle a été partiellement satisfaite, avec des fonds alloués aux dépenses liées au retour des Urach en Lituanie et aux coûts associés. L’avantage de l’origine privée de ce financement est la discrétion de son utilisation, contrairement aux capitaux publics."
lithuania.117.a:0 "Toute aide est la bienvenue"
lithuania.118.t:0 "Un soutien significatif arrive"
lithuania.118.d:0 "Notre demande d’aide financière et matérielle a été satisfaite, avec des fonds alloués à diverses dépenses ainsi qu’un important stock de matériel militaire de contrebande."
lithuania.118.a:0 "Toute aide est la bienvenue"
lithuania.119.t:0 "Un soutien majeur arrive"
lithuania.119.d:0 "Notre demande d’aide financière et matérielle a été comblée et au-delà : des fonds ont été alloués aux dépenses diverses, un important stock de matériel militaire de contrebande ainsi qu’un contingent de vétérans saxons-wurtembergeois de la « Brigade Südlitauen », sympathisants de notre cause."
lithuania.119.a:0 "Toute aide est la bienvenue"
lithuania.119.b:0 "C’est trop à notre goût"
lithuania.120.t:0 "Conseil d’État dissous"
lithuania.120.d:0 "La dissolution du Conseil d’État a marqué l’effondrement d’un gouvernement dominé par l’Union nationaliste, laissant place à un bloc politique ultranationaliste ressurgi autour du parti Jeune Lituanie (ancien mouvement de jeunesse de l’Union nationaliste) et des Voldémaristes dissidents. De l’autre côté de l’arène politique, les unionistes nationaux aux tendances libérales ont afflué vers le parti démocrate-chrétien, qui domine désormais la scène politique démocratique."
lithuania.120.a:0 "Bon débarras"
lithuania.122.t:0 "Bataille pour l’acier"
lithuania.122.desc:0 "Afin de renforcer l’autosuffisance [ROOT.GetAdjective], une mine de fer est en cours d’installation à [814.GetName], ce qui sera sans aucun doute utile pour réduire nos besoins en importations de minerais."
lithuania.122.a:0 "Excellente nouvelle"
lithuania.123.t:0 "L’Allemagne accepte d’aider"
lithuania.123.desc:0 "[GER.GetNameDefCap] a accepté de nous soutenir si [784.Owner.GetNameDefCap] refuse de nous rendre [784.GetName]."
lithuania.123.a:0 "[784.Owner.GetNameDefCap] sera vaincu."
lithuania.124.t:0 "L’Allemagne refuse d’aider"
lithuania.124.desc:0 "[GER.GetNameDefCap] a rejeté notre demande de soutien si le conflit autour de [784.GetName] devait tourner à la guerre. Leur ambassadeur nous informe qu’ils ne peuvent pas risquer une guerre avec [784.Owner.GetNameDefCap]."
lithuania.124.a:0 "Il nous faut changer nos plans"
#lithuania.120.b:0 ""

#Jeune Lituanie
#Les transfuges de l’Union nationaliste vers d’autres groupes d’intérêts ou la formation de blocs politiques séparés : « Jeune Lituanie » – anciennement la branche jeunesse de la LTS, Jaunoji Lietuva est une coalition d’étudiants, de voldemarininkai et de jeunes officiers
#Divers
LIT_political_path_decided:0 "Orientation politique décidée"
